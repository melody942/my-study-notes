elf):\n        self.dirs = [(0, 1), (0, -1), (1, 0), (-1, 0)]\n\n    def dfs(self, grid, r, c, targetValue, markValue):\n        # 共同入口：越界、不属于目标区域、已经被标记过，都直接返回 0 贡献。\n        m = len(grid)\n        n = len(grid[0])\n        if r \u003c 0 or r >= m or c \u003c 0 or c >= n or grid[r][c] != targetValue:\n            return 0\n\n        grid[r][c] = markValue  # 永久染色：修改本身就是 visited 标记。\n        area = 1  # 面积变形会用到；数量题可以忽略这个返回值。\n        for dr, dc in self.dirs:\n            area += self.dfs(grid, r + dr, c + dc, targetValue, markValue)\n        return area\n\n    def countComponents(self, grid):\n        if not grid or not grid[0]:\n            return 0\n\n        ans = 0\n        for r in range(len(grid)):\n            for c in range(len(grid[0])):\n                if grid[r][c] == 1:\n                    ans += 1  # 变形点：数量题在发现新入口时加一。\n                    self.dfs(grid, r, c, 1, 0)\n        return ans\n\n    def maxComponentArea(self, grid):\n        if not grid or not grid[0]:\n            return 0\n\n        ans = 0\n        for r in range(len(grid)):\n            for c in range(len(grid[0])):\n                if grid[r][c] == 1:\n                    ans = max(ans, self.dfs(grid, r, c, 1, 0))  # 变形点：数量改成取最大面积。\n        return ans\n\n    def fillRegion(self, image, sr, sc, newValue):\n        if not image or not image[0]:\n            return\n\n        oldValue = image[sr][sc]\n        if oldValue == newValue:\n            return  # 目标值和新值相同，不处理会导致递归无法真正标记 visited。\n        self.dfs(image, sr, sc, oldValue, newValue)\n```\n\n#### 变形点对照\n\n| 题型 | 共同骨架中改哪里 | 代码差异 |\n|---|---|---|\n| 岛屿数量 | 外层发现入口时结算 | `ans += 1; dfs(grid, r, c, 1, 0)` |\n| 最大岛屿面积 | DFS 返回值参与答案 | `ans = max(ans, dfs(...))` |\n| 区域染色 | 目标值和标记值参数化 | `targetValue = oldValue`，`markValue = newValue` |\n| `char` 网格岛屿 | 值类型不同，骨架不变 | 把 `1/0` 换成 `'1'/'0'` |\n\n#### 易错点\n\n- 访问后没有永久染色，导致同一岛屿被重复统计。\n- 把路径搜索的回溯恢复写到连通块题里，使已处理格子重新变成可访问。\n- 区域染色没处理 `oldValue == newValue`，会导致递归无法真正标记 visited。\n- DFS 入口没有统一越界判断，递归到边界外时访问非法坐标。\n\n### 5.6 网格多源 BFS 扩散\n\n#### 适用题型\n\n- `994 腐烂的橘子`：所有腐烂橘子同时向外扩散。\n- 多个源点到所有目标点的最短时间或最近距离。\n- 01 矩阵距离、地图最近设施距离等“所有源点同为第 0 层”的题。\n\n#### 核心思路\n\n多源 BFS 的共同骨架是：先把所有源点作为第 0 层一起入队，然后按层扩散，邻居入队时立刻标记。腐烂橘子和 01 矩阵距离的主循环几乎一样，差别只在初始化源点、邻居能否进入、以及入队时记录什么答案。\n\n关键不变量：\n\n- 初始化时所有源点同时入队。\n- 每轮开始固定 `size`，这一轮只处理当前层节点。\n- 入队即标记，不能等出队再标记。\n- 腐烂橘子需要统计剩余目标；距离矩阵需要在入队时写 `dist`。\n\n#### 代码模板：共同骨架\n\n> **题目简述：** 994 腐烂的橘子：网格中腐烂橘子每分钟感染四邻新鲜橘子，求全部腐烂所需时间，不可能则返回 -1。 [力扣原题 ↗](https://leetcode.cn/problems/rotting-oranges/)\n\n```python\nfrom collections import deque\n\n\ndef orangesRottingTemplate(grid):\n    if not grid or not grid[0]:\n        return 0\n\n    m = len(grid)\n    n = len(grid[0])\n    q = deque()\n    fresh = 0\n\n    for r in range(m):\n        for c in range(n):\n            if grid[r][c] == 2:\n                q.append((r, c))  # 所有腐烂橘子作为第 0 分钟源点同时入队。\n            elif grid[r][c] == 1:\n                fresh += 1\n\n    minutes = 0\n    dirs = [(0, 1), (0, -1), (1, 0), (-1, 0)]\n\n    while q and fresh > 0:\n        size = len(q)\n        for _ in range(size):\n            r, c = q.popleft()\n            for dr, dc in dirs:\n                nr, nc = r + dr, c + dc\n                if nr \u003c 0 or nr >= m or nc \u003c 0 or nc >= n or grid[nr][nc] != 1:\n                    continue\n                grid[nr][nc] = 2  # 入队即标记，避免同一个新鲜橘子重复入队。\n                fresh -= 1\n                q.append((nr, nc))\n        minutes += 1\n\n    return -1 if fresh > 0 else minutes\n```\n\n01 矩阵距离不需要另起一个完整模板，只替换三处：源点条件、访问标记、答案写入。\n\n> **题目简述：** 542 01 矩阵：给定 0/1 矩阵，返回每个单元格到最近 0 的距离。 [力扣原题 ↗](https://leetcode.cn/problems/01-matrix/)\n\n```python\nfrom collections import deque\n\n\ndef multiSourceDistanceTemplate(grid):\n    if not grid or not grid[0]:\n        return []\n\n    m = len(grid)\n    n = len(grid[0])\n    q = deque()\n    dist = [[-1] * n for _ in range(m)]\n\n    for r in range(m):\n        for c in range(n):\n            if grid[r][c] == 0:\n                dist[r][c] = 0  # 源点距离为 0，同时入队。\n                q.append((r, c))\n\n    dirs = [(0, 1), (0, -1), (1, 0), (-1, 0)]\n    while q:\n        r, c = q.popleft()\n        for dr, dc in dirs:\n            nr, nc = r + dr, c + dc\n            if nr \u003c 0 or nr >= m or nc \u003c 0 or nc >= n or dist[nr][nc] != -1:\n                continue\n            dist[nr][nc] = dist[r][c] + 1  # 第一次到达就是最近距离。\n            q.append((nr, nc))\n\n    return dist\n```\n\n#### 变形点对照\n\n| 题型 | 共同骨架中改哪里 | 代码差异 |\n|---|---|---|\n| 腐烂橘子 | 源点、目标、答案 | 源点是 `2`，目标是 `1`，用 `fresh/minutes` 结算 |\n| 01 矩阵距离 | 源点、访问标记、返回值 | 源点是 `0`，用 `dist == -1` 判断未访问，返回 `dist` |\n| 最近设施距离 | 源点集合不同 | 所有设施入队，空地第一次触达时写距离 |\n\n#### 易错点\n\n- 只把一个源点入队，破坏“同时扩散”。\n- 分钟数按层增加，不能每弹出一个节点就加一分钟。\n- 不在入队时标记，导致同一个格子被多个源点重复入队。\n- 把腐烂橘子的 `fresh` 逻辑机械搬到距离矩阵，导致返回值语义混乱。\n\n### 5.7 网格回溯路径搜索\n\n#### 适用题型\n\n- `79 单词搜索`。\n- 棋盘路径枚举、当前路径不能重复使用同一格的搜索题。\n- 需要临时标记并在退出分支时恢复现场的题。\n\n#### 核心思路\n\n回溯 DFS 的访问状态只对当前路径有效。进入格子时先保存原字符并临时标记，向四个方向搜索；无论搜索成功还是失败，离开前都要恢复原字符。\n\n关键不变量：\n\n- `k` 表示当前要匹配 `word[k]`。\n- 当前路径中的格子不能重复使用。\n- 任何提前返回 `True` 之前都必须先恢复现场。\n\n#### 代码模板\n\n> **题目简述：** 79 单词搜索：判断单词能否由字符网格中上下左右相邻且不重复使用的单元格组成。 [力扣原题 ↗](https://leetcode.cn/problems/word-search/)\n\n```python\ndef dfs(board, word, r, c, k):\n    m = len(board)\n    n = len(board[0])\n\n    if r \u003c 0 or r >= m or c \u003c 0 or c >= n or board[r][c] != word[k]:\n        return False\n    if k == len(word) - 1:\n        return True\n\n    old = board[r][c]\n    board[r][c] = '#'  # 临时标记当前路径已使用该格子。\n\n    found = (\n        dfs(board, word, r + 1, c, k + 1) or\n        dfs(board, word, r - 1, c, k + 1) or\n        dfs(board, word, r, c + 1, k + 1) or\n        dfs(board, word, r, c - 1, k + 1)\n    )\n\n    board[r][c] = old  # 无论成功失败，离开当前分支前都恢复现场。\n    return found\n\n\ndef exist(board, word):\n    if not board or not board[0]:\n        return False\n\n    for r in range(len(board)):\n        for c in range(len(board[0])):\n            if dfs(board, word, r, c, 0):\n                return True\n    return False\n```\n\n#### 易错点\n\n- 找到答案提前返回前没有恢复当前格子。\n- 把连通块的永久染色模板照搬到路径搜索。\n- 没有先判断越界就访问 `board[r][c]`。\n\n### 5.8 矩阵 DP 滚动数组\n\n#### 适用题型\n\n- `62 不同路径`：到达每格的方案数。\n- `64 最小路径和`：到达每格的最小代价。\n- 只能从上方和左方转移的网格 DP。\n\n#### 核心思路\n\n若只能向右或向下走，那么 `(r, c)` 只可能来自上方 `(r - 1, c)` 或左方 `(r, c - 1)`。滚动数组中 `dp[c]` 在更新前表示上方状态，`dp[c - 1]` 表示当前行左侧状态。\n\n关键不变量：\n\n- 第一行只能从左边来，第一列只能从上边来。\n- 更新顺序必须从左到右，保证 `dp[c - 1]` 已是当前行状态。\n- 若允许四方向移动，不能直接套这个无环 DP 模板。\n\n#### 代码 A：路径数\n\n> **题目简述：** 62 不同路径：机器人位于网格左上角且只能向右或向下，求到右下角的不同路径数。 [力扣原题 ↗](https://leetcode.cn/problems/unique-paths/)\n\n```python\ndef gridDpPathCountTemplate(m, n):\n    dp = [1 for _ in range(n)]\n\n    for r in range(1, m):\n        for c in range(1, n):\n            dp[c] += dp[c - 1]\n\n    return dp[n - 1]\n```\n\n#### 代码 B：最小路径和\n\n> **题目简述：** 64 最小路径和：给定非负网格，只能向右或向下移动，求左上到右下的最小路径和。 [力扣原题 ↗](https://leetcode.cn/problems/minimum-path-sum/)\n\n```python\ndef gridDpMinCostTemplate(grid):\n    m = len(grid)\n    n = len(grid[0])\n    dp = [float('inf') / 2 for _ in range(n)]\n    dp[0] = 0\n\n    for r in range(0, m):\n        for c in range(0, n):\n            if c == 0:\n                dp[c] = dp[c] + grid[r][c]\n            else:\n                dp[c] = min(dp[c], dp[c - 1]) + grid[r][c]\n\n    return dp[n - 1]\n```\n\n#### 易错点\n\n- 第一行第一列初始化错误。\n- 滚动数组要从左往右更新，确保 `dp[c - 1]` 仍是当前行状态。\n- 题目允许上下左右移动时仍套矩阵 DP，形成有环依赖。\n\n## 6. 高频易错点清单\n\n| 易错点 | 典型题目 | 规避方式 |\n|---|---|---|\n| 行列变量写反 | `48`、`54`、`74` | 统一使用 `m = rows`、`n = cols`、`matrix[r][c]` |\n| 螺旋遍历单行单列重复加入 | `54` | 处理下边和左边前检查边界 |\n| 旋转矩阵转置时交换了两次 | `48` | 内层从 `c = r + 1` 开始 |\n| 矩阵置零边扫描边清零 | `73` | 先标记，后执行 |\n| 首行首列标记混淆 | `73` | 用单独变量记录首列是否置零 |\n| 展平二分坐标换算写错 | `74` | 行是 `mid / n`，列是 `mid % n` |\n| 把 `240` 当成整体有序数组 | `240` | 只能阶梯搜索或分治，不能直接展平二分 |\n| DFS 缺少越界判断 | `200`、`79` | 递归入口第一行做边界和目标值判断 |\n| BFS 出队才标记访问 | `994` | 入队时立刻改状态 |\n| 单词搜索提前返回前没恢复 | `79` | 所有 return true 前都恢复原字符 |\n| 矩阵 DP 第一行第一列初始化错误 | `62`、`64` | 明确边界只能来自一个方向 |\n\n## 7. 最短复盘口诀\n\n矩阵题先定坐标：行是 `r`，列是 `c`。螺旋看边界，旋转看映射，置零先标记后执行；全局有序展平成一维二分，行列有序从右上角阶梯走；连通块永久染色，多源 BFS 入队即标记，路径搜索必须回溯；矩阵 DP 看能从哪些方向转移。\n\n\n\n================================================================================\n\n# 第5部分: 链表\n\n================================================================================\n\n> 目标：本文把 Hot100 链表题抽象成若干“可复用套路”。复习时先识别题型，再套对应模板，最后处理边界和变形。\n\n## 1. 链表题的底层模型\n\n链表题的难点通常不在遍历，而在维护引用关系。每道链表题先问四个问题：\n\n| 问题               | 如果答案是“是”             | 常用处理                  |\n| ---------------- | -------------------- | --------------------- |\n| 头结点会不会变          | 删除头、交换头、反转头、合并后新头不确定 | 用 `dummy` 保护头结点       |\n| 是否需要目标节点的前驱      | 删除、插入、区间反转、分组反转      | 让引用停在目标节点前一个位置        |\n| 修改 `next` 前会不会丢链 | 反转、交换、拆分、复制          | 先保存 `nxt = cur.next` |\n| 是否要快速定位某个节点      | LRU、随机链表复制、K 路归并     | 哈希表、堆、双向链表            |\n\n链表题最核心的动作只有五类：\n\n| 动作 | 对应 Hot100 题目 | 复习关键词 |\n|---|---|---|\n| 哑节点与尾插 | `2`、`19`、`21`、`24`、`25` | `dummy`、`cur`、`pre` |\n| 局部反转 | `206`、`24`、`25`、`234` | `pre`、`cur`、`nxt` |\n| 快慢引用定位 | `141`、`142`、`148`、`234` | 判环、入环点、中点 |\n| 双链表同步 | `160`、`21`、`2` | 换头、归并、同步推进 |\n| 辅助结构设计 | `23`、`138`、`146` | 堆、哈希表、双向链表 |\n\n## 2. Hot100 链表题型地图\n\n| 题型 | 题目 | 抽象能力 | 一句话记忆 |\n|---|---|---|---|\n| 基础重连 | `206 反转链表` | 单链表反转 | 改 `cur.next` 前必须先保存 `nxt` |\n| 尾插构造 | `2 两数相加`、`21 合并两个有序链表` | 用 `dummy + cur` 构造结果链 | `cur` 永远指向结果链表尾部 |\n| 删除节点 | `19 删除倒数第 N 个结点` | 找目标前驱 | 删除题通常找目标前一个节点 |\n| 分组操作 | `24 两两交换节点`、`25 K 个一组翻转` | 固定长度区间重连 | 先保证够一组，再反转，再接回去 |\n| 快慢引用 | `141 环形链表`、`142 环形链表 II` | 判环和找入口 | 第一次相遇判有环，第二次相遇找入口 |\n| 链表归并 | `23 合并 K 个升序链表`、`148 排序链表` | 多路归并和分治 | `21` 是 `23` 和 `148` 的基础组件 |\n| 双引用对齐 | `160 相交链表` | 消除长度差 | 走完自己的路，就去对方的路上补齐 |\n| 组合题 | `234 回文链表` | 找中点加反转加比较 | 先切出后半段，再反转比较 |\n| 复杂结构复制 | `138 随机链表的复制` | 节点映射关系 | 哈希表映射最直观，穿插复制最省空间 |\n| 双向链表设计 | `146 LRU 缓存` | O(1) 查找和 O(1) 调整顺序 | 哈希表查节点，双向链表排冷热 |\n| 树链表化 | `114 二叉树展开为链表` | 树结构原地改链 | 反向前序像链表头插法 |\n\n## 3. 复习顺序建议\n\n先刷基础动作，再刷组合题。推荐顺序如下：\n\n1. `206 反转链表`：必须闭眼写出三引用反转。\n2. `21 合并两个有序链表`：掌握 `dummy + cur` 尾插。\n3. `19 删除倒数第 N 个结点`：理解“找前驱”比“找目标”更重要。\n4. `24 两两交换节点`：练局部重连。\n5. `25 K 个一组翻转`：把局部反转和接回链表练熟。\n6. `141`、`142`：快慢引用判环和找入口。\n7. `160`：双链表换头对齐。\n8. `234`：组合 `找中点 + 反转 + 比较`。\n9. `148`、`23`：复用 `21` 做归并。\n10. `138`、`146`：处理带额外结构的链表设计题。\n\n## 4. 关键套路详解\n\n### 4.1 dummy 是默认防御\n\n当头结点可能被删除、交换、反转、替换时，不要对 `head` 写一堆特判。直接构造一个虚拟前驱：\n\n```python\nclass ListNode:\n    def __init__(self, val=0, next=None):\n        self.val = val\n        self.next = next\n\n\ndef dummyTemplate(head):\n    dummy = ListNode(-1, head)  # dummy 保护头结点，统一处理头结点变化。\n    pre = dummy                # pre 默认从 dummy 开始，表示待操作节点的前驱。\n    return dummy.next\n```\n\n`dummy` 的价值是把“头结点”和“普通节点”统一处理。`19` 删除头结点、`24` 交换前两个节点、`25` 第一组反转后换头，都靠它避免特殊分支。\n\n### 4.2 反转链表是母题\n\n所有链表反转题都来自同一个动作：\n\n```python\nnxt = cur.next\ncur.next = pre\npre = cur\ncur = nxt\n```\n\n这个动作解决的是“把当前节点从原方向摘下来，接到反方向链表前面”。`206` 是完整链表反转，`25` 是每 K 个节点重复这个动作，`234` 是只反转后半段。\n\n### 4.3 快慢引用有三种停法\n\n| 目标    | 循环条件                                     | 结果                  |\n| ----- | ---------------------------------------- | ------------------- |\n| 判环    | `while fast and fast.next`             | `fast == slow` 表示有环 |\n| 找偏右中点 | `while fast and fast.next`             | 偶数长度时 `slow` 到右中点   |\n| 找偏左中点 | `while fast.next and fast.next.next` | 偶数长度时 `slow` 到左中点   |\n\n`234 回文链表`通常希望 `slow` 停在前半段尾部，所以用偏左中点写法。`148 排序链表`需要切断左右两段，通常额外保存 `pre`。\n\n### 4.4 归并类题要复用组件\n\n`21 合并两个有序链表`是链表归并的基础函数。`23 合并 K 个链表`只是把它变成多路合并。`148 排序链表`只是先把链表拆成小段，再用它合回来。\n\n不要把 `21`、`23`、`148` 当三道完全不同的题，它们共用同一个“有序链表合并”动作。\n\n### 4.5 复杂链表题的本质是“映射”和“快速调整”\n\n`138 随机链表复制`的本质是旧节点到新节点的映射。哈希表方案显式维护映射，穿插复制方案把映射藏在 `old.next` 里。\n\n`146 LRU 缓存`的本质是同时满足两个要求：通过 key 快速找到节点，通过访问顺序快速移动节点。所以哈希表和双向链表缺一不可。\n\n## 5. 抽象代码模板\n\n本节按链表操作的基本动作拆分模板。链表代码最怕“断链”和“头结点变化”，因此每个模板都明确维护哪些引用、什么时候保存后继、什么时候接回前后链表。\n\n```python\nclass ListNode:\n    def __init__(self, val=0, next=None):\n        self.val = val\n        self.next = next\n```\n\n### 5.1 模板一：dummy + 尾插构造结果链\n\n#### 适用题型\n\n- `21 合并两个有序链表`：复用原节点，每轮把较小节点接到结果链尾部。\n- `2 两数相加`：新建结果节点，每轮计算一位和进位。\n- 任何需要按扫描顺序构造新链表的题：统一维护 `cur` 指向结果尾部。\n\n#### 核心思路\n\n- `dummy` 保护结果链头，避免单独处理第一个节点。\n- `cur` 永远指向结果链尾部，每接一个节点后都要移动到新尾部。\n- 复用原节点时要注意后续是否可能形成旧链残留；新建节点时不影响原链。\n\n#### 代码 A：合并两个有序链表\n\n> **题目简述：** 21 合并两个有序链表：给定两个升序链表，将其合并为一个仍然升序的链表。 [力扣原题 ↗](https://leetcode.cn/problems/merge-two-sorted-lists/)\n\n```python\nclass ListNode:\n    def __init__(self, val=0, next=None):\n        self.val = val\n        self.next = next\n\n\ndef mergeTwoListsTemplate(a, b):\n    dummy = ListNode(-1)\n    cur = dummy\n\n    while a and b:\n        if a.val \u003c= b.val:\n            cur.next = a\n            a = a.next\n        else:\n            cur.next = b\n            b = b.next\n        cur = cur.next\n\n    cur.next = a if a else b\n    return dummy.next\n```\n\n#### 代码 B：两数相加\n\n> **题目简述：** 2 两数相加：两个非空链表以逆序数字表示非负整数，求其和并以同样形式返回。 [力扣原题 ↗](https://leetcode.cn/problems/add-two-numbers/)\n\n```python\nclass ListNode:\n    def __init__(self, val=0, next=None):\n        self.val = val\n        self.next = next\n\n\ndef addTwoNumbersTemplate(a, b):\n    dummy = ListNode(-1)\n    cur = dummy\n    carry = 0\n\n    while a or b or carry:\n        total = carry\n        if a:\n            total += a.val\n            a = a.next\n        if b:\n            total += b.val\n            b = b.next\n\n        carry = total // 10\n        cur.next = ListNode(total % 10)\n        cur = cur.next\n\n    return dummy.next\n```\n\n#### 易错点\n\n- 合并链表复用原节点，移动 `a/b` 前要先把节点接到 `cur.next`。\n- 两数相加循环条件必须包含 `carry`，否则最高位进位会丢。\n- 返回 `dummy.next`，不要返回 `cur`。\n\n### 5.2 模板二：删除节点与找前驱\n\n#### 适用题型\n\n- `19 删除链表的倒数第 N 个结点`：快慢引用让慢引用停在待删节点前驱。\n- 删除指定值或指定区间：单链表删除通常必须先定位前驱。\n- 头结点可能被删除的题：必须使用 dummy 统一处理。\n\n#### 核心思路\n\n- 删除节点时需要改的是前驱的 `next`。\n- `right` 先走 `n` 步，然后 `left/right` 同步走，最终 `left` 停在待删节点前驱。\n- `dummy` 让删除头节点与删除中间节点使用同一套逻辑。\n\n#### 代码模板\n\n> **题目简述：** 19 删除链表的倒数第 N 个结点：给定单链表和正整数 N，删除倒数第 N 个结点并返回链表头。 [力扣原题 ↗](https://leetcode.cn/problems/remove-nth-node-from-end-of-list/)\n\n```python\nclass ListNode:\n    def __init__(self, val=0, next=None):\n        self.val = val\n        self.next = next\n\ndef removeNthFromEndTemplate(head, n):\n    dummy = ListNode(0, head)\n    left = dummy\n    right = dummy\n\n    # right 先走 n 步，保持 left 和 right 间隔 n 个节点。\n    for _ in range(n):\n        right = right.next\n\n    # 同步推进，直到 right 到达最后一个节点。\n    # 此时 left 停在待删除节点的前驱。\n    while right.next:\n        left = left.next\n        right = right.next\n\n    # 删除 left 后面的节点。\n    left.next = left.next.next\n    return dummy.next\n```\n\n#### 易错点\n\n- `left` 应停在前驱，不能停在待删节点本身。\n- 删除头节点时，如果不用 dummy，需要额外特判。\n- 面试中可说明 LeetCode 通常不要求手动 释放引用，但 Python 模板释放更规范。\n\n### 5.3 模板三：三引用反转与区间反转\n\n#### 适用题型\n\n- `206 反转链表`：反转整条链表。\n- `234 回文链表`：反转后半段再比较。\n- `25 K 个一组翻转链表`：反转 `[head, stop)` 区间。\n\n#### 核心思路\n\n- `pre` 表示已经反转好的部分头部。\n- `cur` 表示当前待处理节点。\n- `nxt` 必须先保存原链后继，否则一改 `cur.next` 就会断链。\n- 反转 `[head, stop)` 时，`stop` 不参与反转，适合局部重连。\n\n#### 代码模板\n\n> **题目简述：** 本模板覆盖：206 反转链表（给定单链表头结点，反转所有 next 指针并返回新的头结点。）；234 回文链表（给定单链表头结点，判断从头到尾的结点值序列是否为回文。）；25 K 个一组翻转链表（按每 K 个结点一组翻转链表，末尾不足 K 个的部分保持原顺序。） [25 原题 ↗](https://leetcode.cn/problems/reverse-nodes-in-k-group/) · [206 原题 ↗](https://leetcode.cn/problems/reverse-linked-list/) · [234 原题 ↗](https://leetcode.cn/problems/palindrome-linked-list/)\n\n```python\ndef reverseBeforeStopTemplate(head, stop):\n    pre = stop\n    cur = head\n\n    while cur != stop:\n        # 改指针前先保存后继，否则剩余链表会丢失。\n        nxt = cur.next\n        cur.next = pre\n        pre = cur\n        cur = nxt\n\n    return pre\n\ndef reverseListTemplate(head):\n    return reverseBeforeStopTemplate(head, None)\n```\n\n#### 易错点\n\n- `pre` 初始为 `stop`，这样反转后的尾巴天然接回后续链表。\n- 反转循环结束后返回的是 `pre`，也就是新区间头。\n\n### 5.4 模板四：分组反转与局部重连\n\n#### 适用题型\n\n- `24 两两交换链表中的节点`：`k = 2`。\n- `25 K 个一组翻转链表`：每组够 `k` 个才反转。\n- 指定长度区间反转：只执行一轮分组反转。\n\n#### 核心思路\n\n- `groupPrev` 是当前组前一个节点。\n- `groupHead` 是当前组反转前的头，反转后会变成尾。\n- `nextGroup` 是下一组开头，反转区间为 `[groupHead, nextGroup)`。\n\n#### 代码模板\n\n> **题目简述：** 本模板覆盖：24 两两交换链表中的节点（将链表中每两个相邻结点交换位置，不允许只修改结点值。）；25 K 个一组翻转链表（按每 K 个结点一组翻转链表，末尾不足 K 个的部分保持原顺序。） [24 原题 ↗](https://leetcode.cn/problems/swap-nodes-in-pairs/) · [25 原题 ↗](https://leetcode.cn/problems/reverse-nodes-in-k-group/)\n\n```python\nclass ListNode:\n    def __init__(self, val=0, next=None):\n        self.val = val\n        self.next = next\n\ndef reverseBeforeStopTemplate(head, stop):\n    pre = stop\n    cur = head\n\n    while cur != stop:\n        nxt = cur.next\n        cur.next = pre\n        pre = cur\n        cur = nxt\n\n    return pre\n\ndef reverseKGroupTemplate(head, k):\n    dummy = ListNode(0, head)\n    groupPrev = dummy\n\n    while True:\n        # 从 groupPrev 出发检查后面是否凑够 k 个节点。\n        kth = groupPrev\n        for _ in range(k):\n            kth = kth.next\n            if kth is None:\n                return dummy.next\n\n        groupHead = groupPrev.next\n        nextGroup = kth.next\n\n        # 反转区间 [groupHead, nextGroup)，并把前驱接到新区间头。\n        groupPrev.next = reverseBeforeStopTemplate(groupHead, nextGroup)\n\n        # groupHead 反转后变成当前组尾巴，下一轮从它继续。\n        groupPrev = groupHead\n\ndef swapPairsTemplate(head):\n    return reverseKGroupTemplate(head, 2)\n```\n\n#### 易错点\n\n- 反转前必须保存 `nextGroup`，否则接不回下一组。\n- 反转后 `groupHead` 变成尾巴，下一轮的 `groupPrev` 应该移动到它。\n- 不足 `k` 个是否反转取决于题意，Hot100 第 25 题是不反转。\n\n### 5.5 模板五：快慢引用定位\n\n#### 适用题型\n\n- `141 环形链表`：快慢引用相遇说明有环。\n- `142 环形链表 II`：相遇后一个引用回头，两引用同步走找入口。\n- `234 回文链表`：找前半段尾巴后反转后半段。\n- `148 排序链表`：快慢引用切分左右两半。\n\n#### 核心思路\n\n- 判环：`slow` 一步，`fast` 两步。\n- 入环点：第一次相遇后，`head` 和 `meet` 同步走，重逢处是入口。\n- 找中点要先明确想要偏左中点还是偏右中点。\n\n#### 代码 A：判环与找入口\n\n> **题目简述：** 本模板覆盖：141 环形链表（给定单链表头结点，判断沿 next 指针前进是否会重复到达某个结点。）；142 环形链表 II（若单链表存在环则返回入环的第一个结点，否则返回空结点。） [141 原题 ↗](https://leetcode.cn/problems/linked-list-cycle/) · [142 原题 ↗](https://leetcode.cn/problems/linked-list-cycle-ii/)\n\n```python\ndef getCycleMeetTemplate(head):\n    slow = head\n    fast = head\n\n    while fast and fast.next:\n        slow = slow.next\n        fast = fast.next.next\n\n        if slow == fast:\n            return slow\n\n    return None\n\ndef detectCycleEntryTemplate(head):\n    meet = getCycleMeetTemplate(head)\n    if not meet:\n        return None\n\n    p = head\n    q = meet\n    while p != q:\n        p = p.next\n        q = q.next\n\n    return p\n```\n\n#### 代码 B：排序链表切分\n\n> **题目简述：** 148 排序链表：给定单链表头结点，以 O(n log n) 时间将所有结点按值升序排列。 [力扣原题 ↗](https://leetcode.cn/problems/sort-list/)\n\n```python\ndef splitMiddleForSortTemplate(head):\n    pre = None\n    slow = head\n    fast = head\n\n    while fast and fast.next:\n        pre = slow\n        slow = slow.next\n        fast = fast.next.next\n\n    # pre 是左半段尾巴，断开后 head 和 slow 分别是左右两段头。\n    if pre:\n        pre.next = None\n    return slow\n```\n\n#### 代码 C：回文链表原始反转后半段解法\n\n> **题目简述：** 234 回文链表：给定单链表头结点，判断从头到尾的结点值序列是否为回文。 [力扣原题 ↗](https://leetcode.cn/problems/palindrome-linked-list/)\n\n```python\nclass ListNode:\n    def __init__(self, val=0, next=None):\n        self.val = val\n        self.next = next\n\ndef reverseListTemplate(head):\n    pre = None\n    cur = head\n\n    while cur:\n        nxt = cur.next\n        cur.next = pre\n        pre = cur\n        cur = nxt\n\n    return pre\n\ndef isPalindromeTemplate(head):\n    if not head or not head.next:\n        return True\n\n    # slow 停在前半段尾部，偶数长度时停在左半段最后一个节点。\n    slow = head\n    fast = head\n    while fast.next and fast.next.next:\n        slow = slow.next\n        fast = fast.next.next\n\n    # 反转后半段，再从两端向中间比较。\n    start2 = reverseListTemplate(slow.next)\n    p1 = head\n    p2 = start2\n    ok = True\n\n    while p2:\n        if p1.val != p2.val:\n            ok = False\n            break\n        p1 = p1.next\n        p2 = p2.next\n\n    # 如需保持链表原状，可把后半段反转回去。\n    slow.next = reverseListTemplate(start2)\n    return ok\n```\n\n#### 易错点\n\n- 排序链表切分后必须断开 `pre.next`，否则递归不会收敛。\n- 回文链表原始解法中 `slow` 要停在前半段尾部，因此循环条件是 `fast.next and fast.next.next`。\n- 回文链表只需要比较反转后的后半段长度，循环条件应是 `while start2`。\n\n### 5.6 模板六：双链表同步推进\n\n#### 适用题型\n\n- `160 相交链表`：两个引用交换链表头后总路程相同。\n- 两条链表长度不同但要同步比较：先拉齐路径长度。\n\n#### 核心思路\n\n- `p` 走完 A 后去 B，`q` 走完 B 后去 A。\n- 如果有交点，两个引用会在交点相遇；如果无交点，会同时到达 `None`。\n\n#### 代码模板\n\n> **题目简述：** 160 相交链表：给定两个无环单链表，返回它们按结点引用相交的起点，不相交则返回空。 [力扣原题 ↗](https://leetcode.cn/problems/intersection-of-two-linked-lists/)\n\n```python\nclass ListNode:\n    def __init__(self, val=0, next=None):\n        self.val = val\n        self.next = next\n\ndef getIntersectionNodeTemplate(headA, headB):\n    p = headA\n    q = headB\n\n    # p 走完 A 后转到 B，q 走完 B 后转到 A。\n    # 有交点会在交点相遇，无交点会同时走到 None。\n    while p != q:\n        p = headB if p is None else p.next\n        q = headA if q is None else q.next\n\n    return p\n```\n\n#### 易错点\n\n- 相交比较节点地址，节点值无效。\n- 无交点时最终 `p` 和 `q` 都是 `None`，循环也能结束。\n\n### 5.7 模板七：归并类链表题\n\n#### 适用题型\n\n- `21 合并两个有序链表`：归并的基础动作。\n- `23 合并 K 个升序链表`：分治合并或最小堆多路归并。\n- `148 排序链表`：切分两半，递归排序，再归并。\n\n#### 核心思路\n\n- 两两合并是基础组件。\n- K 路合并：分治法复用 mergeTwo，堆法每次取当前最小节点。\n- 排序链表：快慢引用切分后递归处理左右半段。\n\n#### 代码 A：分治合并 K 条链表\n\n> **题目简述：** 23 合并 K 个升序链表：给定 K 个升序链表，合并全部结点并返回一个升序链表。 [力扣原题 ↗](https://leetcode.cn/problems/merge-k-sorted-lists/)\n\n```python\nclass ListNode:\n    def __init__(self, val=0, next=None):\n        self.val = val\n        self.next = next\n\ndef mergeTwoListsTemplate(a, b):\n    dummy = ListNode(0)\n    cur = dummy\n\n    while a and b:\n        if a.val \u003c= b.val:\n            cur.next = a\n            a = a.next\n        else:\n            cur.next = b\n            b = b.next\n        cur = cur.next\n\n    cur.next = a if a else b\n    return dummy.next\n\ndef mergeKByDivideTemplate(lists):\n    if not lists:\n        return None\n\n    n = len(lists)\n    step = 1\n\n    # 每轮把间隔 step 的两条链表合并，step 翻倍。\n    while step \u003c n:\n        for i in range(0, n - step, step * 2):\n            lists[i] = mergeTwoListsTemplate(lists[i], lists[i + step])\n        step *= 2\n\n    return lists[0]\n```\n\n#### 代码 B：排序链表\n\n> **题目简述：** 148 排序链表：给定单链表头结点，以 O(n log n) 时间将所有结点按值升序排列。 [力扣原题 ↗](https://leetcode.cn/problems/sort-list/)\n\n```python\ndef sortListTemplate(head):\n    if not head or not head.next:\n        return head\n\n    rightHead = splitMiddleForSortTemplate(head)\n    leftSorted = sortListTemplate(head)\n    rightSorted = sortListTemplate(rightHead)\n    return mergeTwoListsTemplate(leftSorted, rightSorted)\n```\n\n#### 易错点\n\n- 分治合并 K 条链表时，`step` 每轮翻倍。\n- 排序链表切分后要确保左右两段断开。\n\n### 5.8 模板八：复杂引用链表复制\n\n#### 适用题型\n\n- `138 随机链表复制`：建立旧节点到新节点的映射。\n- 带额外引用的链表 / 图深拷贝：都可以先创建节点，再补边。\n\n#### 核心思路\n\n- 哈希表法显式记录 `oldToNew[old] = copy`，最稳且通用。\n- 穿插复制法把复制节点插到原节点后面，用 `old.next` 隐式表示映射。\n\n#### 代码模板\n\n> **题目简述：** 138 随机链表的复制：深拷贝一个同时含 next 和 random 指针的链表，新结点不得指向原链表。 [力扣原题 ↗](https://leetcode.cn/problems/copy-list-with-random-pointer/)\n\n```python\nclass Node:\n    def __init__(self, val=0, next=None, random=None):\n        self.val = val\n        self.next = next\n        self.random = random\n\ndef copyRandomList(head):\n    if head is None:\n        return None\n\n    cur = head\n    while cur:\n        copy = Node(cur.val, cur.next)\n        cur.next = copy\n        cur = copy.next\n\n    cur = head\n    while cur:\n        if cur.random:\n            cur.next.random = cur.random.next\n        cur = cur.next.next\n\n    dummy = Node(-1)\n    tail = dummy\n    cur = head\n    while cur:\n        copy = cur.next\n        cur.next = copy.next\n        tail.next = copy\n        tail = copy\n        cur = cur.next\n    return dummy.next\n```\n\n#### 易错点\n\n- 新链表的 `next/random` 必须指向复制节点，不能指回原节点。\n- 两遍扫描更稳：第一遍建点，第二遍补边。\n\n### 5.9 模板九：完整 LRU 缓存\n\n#### 适用题型\n\n- `146 LRU 缓存`：哈希表 O(1) 定位节点，双向链表 O(1) 调整顺序。\n- 需要按访问时间维护顺序并支持 O(1) 删除任意节点的设计题。\n\n#### 核心思路\n\n- dict 负责 `key: node`。\n- 双向链表头部表示最近使用，尾部表示最久未使用。\n- 每次 `get/put` 命中节点后都移动到头部；超容量时删除尾部前一个真实节点。\n\n#### 代码模板\n\n> **题目简述：** 146 LRU 缓存：设计定容量缓存，使查询和写入均为平均 O(1)，满时淘汰最久未使用项。 [力扣原题 ↗](https://leetcode.cn/problems/lru-cache/)\n\n```python\nclass Node:\n    def __init__(self, key=0, val=0):\n        self.key = key\n        self.val = val\n        self.prev = None\n        self.next = None\n\nclass LRUCache:\n    def __init__(self, capacity):\n        self.capacity = capacity\n        self.cache = {}\n\n        # 虚拟头尾节点：head 后面是最近使用，tail 前面是最久未使用。\n        self.head = Node()\n        self.tail = Node()\n        self.head.next = self.tail\n        self.tail.prev = self.head\n\n    def _remove(self, node):\n        prev_node = node.prev\n        next_node = node.next\n        prev_node.next = next_node\n        next_node.prev = prev_node\n\n    def _add_to_head(self, node):\n        first = self.head.next\n        node.prev = self.head\n        node.next = first\n        self.head.next = node\n        first.prev = node\n\n    def _move_to_head(self, node):\n        self._remove(node)\n        self._add_to_head(node)\n\n    def get(self, key):\n        if key not in self.cache:\n            return -1\n\n        node = self.cache[key]\n        # 命中也算一次访问，需要移动到头部。\n        self._move_to_head(node)\n        return node.val\n\n    def put(self, key, value):\n        if key in self.cache:\n            node = self.cache[key]\n            node.val = value\n            self._move_to_head(node)\n            return\n\n        node = Node(key, value)\n        self.cache[key] = node\n        self._add_to_head(node)\n\n        if len(self.cache) > self.capacity:\n            # tail 前一个真实节点是最久未使用节点。\n            old = self.tail.prev\n            self._remove(old)\n            del self.cache[old.key]\n```\n\n#### 易错点\n\n- 删除链表节点时必须同步删除哈希表。\n- `get` 命中也算访问，需要移动到头部。\n- 使用虚拟 `head/tail` 可以避免删除头尾时大量特判。\n\n### 5.10 模板十：树结构链表化\n\n#### 适用题型\n\n- `114 二叉树展开为链表`：按前序顺序原地展开。\n- 树转单链形式：按目标顺序反向递归维护 `prev`。\n\n#### 核心思路\n\n- 前序是中-左-右；反过来按右-左-中处理，可以让 `prev` 始终表示已经展开好的后继链。\n- 当前节点的 `right` 指向 `prev`，`left` 置空，然后当前节点成为新的 `prev`。\n- 外层 wrapper 每次调用前重置 `prev`，避免多次调用污染状态。\n\n#### 代码模板\n\n> **题目简述：** 114 二叉树展开为链表：将二叉树原地展开为前序遍历顺序的单链表，仅使用结点的右指针。 [力扣原题 ↗](https://leetcode.cn/problems/flatten-binary-tree-to-linked-list/)\n\n```python\nclass TreeNode:\n    def __init__(self, val=0, left=None, right=None):\n        self.val = val\n        self.left = left\n        self.right = right\n\nclass TreeFlattenTemplate:\n    def __init__(self):\n        self.prev = None\n\n    def _dfs(self, root):\n        if not root:\n            return\n\n        # 反向前序：右、左、中；prev 始终是当前节点展开后的后继。\n        self._dfs(root.right)\n        self._dfs(root.left)\n\n        root.right = self.prev\n        root.left = None\n        self.prev = root\n\n    def flatten(self, root):\n        # 公开入口重置状态，避免多次调用互相污染。\n        self.prev = None\n        self._dfs(root)\n```\n\n#### 易错点\n\n- 如果没有 wrapper 重置 `prev`，同一个对象重复调用会把上次结果接进来。\n- 展开后所有 `left` 都必须置空。\n\n## 6. 高频易错点清单\n\n| 易错点 | 典型题目 | 规避方式 |\n|---|---|---|\n| 忘记处理头结点变化 | `19`、`24`、`25` | 默认使用 `dummy` |\n| 反转前没保存后继 | `206`、`25`、`234` | 第一行先写 `nxt = cur.next` |\n| 删除时引用停在目标节点 | `19` | 删除要停在目标前驱 |\n| K 个一组反转后接不回去 | `25` | 记录 `groupHead`，它翻转后就是尾巴 |\n| 快慢引用循环条件混乱 | `141`、`142`、`234`、`148` | 先明确 slow 要停在哪里 |\n| 相交链表比较了值 | `160` | 相交是地址相同，值相等无效 |\n| 随机链表复制指向原节点 | `138` | 新链表的 `next/random` 必须指向复制节点 |\n| LRU 删除链表节点忘记删哈希表 | `146` | 链表和 map 必须同步更新 |\n| 归并排序切分后没断开 | `148` | 找到中点后必须 `pre.next = None` |\n| 最小堆比较器方向写反 | `23` | Python 小顶堆比较器写 把节点值作为堆排序键 |\n\n## 7. 最短复盘口诀\n\n链表题先判断头会不会变，会变就上 `dummy`。删除找前驱，反转存后继，合并看尾巴，分组先判够不够。快慢引用负责定位，双链换头负责对齐，dict 负责映射，双向链表负责 O(1) 移动。`206` 是反转母题，`21` 是归并母题，`25` 是局部重连大成题。\n\n\n\n================================================================================\n\n# 第6部分: 二叉树\n\n================================================================================\n\n> 目标：本文把 Hot100 二叉树题抽象成若干“可复用题型模板”。复习时先判断题型，再套递归定义、遍历顺序、返回值语义和状态维护方式。\n\n## 1. 二叉树题的底层模型\n\n二叉树题的关键在于说清楚每个递归函数到底在做什么。每道树题先问五个问题：\n\n| 问题 | 如果答案是“是” | 常用处理 |\n|---|---|---|\n| 需要访问所有节点吗 | 遍历、统计、比较、构造答案 | DFS 或 BFS |\n| 答案和层有关吗 | 层序遍历、右视图、最小层级信息 | BFS 按层处理，或 DFS 携带 `depth` |\n| 当前节点需要左右子树返回值吗 | 深度、直径、最大路径和、LCA | 后序递归，先拿左右结果再处理当前节点 |\n| 题目利用 BST 性质吗 | 验证 BST、第 K 小、有序数组转 BST | 中序有序、上下界约束、取中点构造 |\n| 路径是否可以从任意节点开始 | 路径总和 III、最大路径和、直径 | 全局答案 + 向父节点返回“可延伸贡献” |\n\n二叉树题最常见的递归函数有三种语义：\n\n| 递归语义 | 返回值含义 | 代表题 |\n|---|---|---|\n| 遍历型 | 不关心返回值，只在访问节点时收集答案 | `94`、`199` |\n| 分治型 | 返回当前子树的某种属性 | `104`、`226`、`236` |\n| 贡献型 | 返回给父节点能继续使用的单边贡献，同时更新全局答案 | `543`、`124` |\n\n## 2. Hot100 二叉树题型地图\n\n本专题覆盖二叉树/BST 题 15 道。`208 Trie`、`200 岛屿数量`、`994 腐烂的橘子`、`207 课程表`、`79 单词搜索`虽然也有 DFS/BFS，但归入 Trie、图或回溯专题更合适。\n\n| 题型        | 题目                           | 抽象能力          | 一句话记忆             |\n| --------- | ---------------------------- | ------------- | ----------------- |\n| 基础 DFS 遍历 | `94 二叉树的中序遍历`                | 前中后序递归与迭代     | 递归顺序决定访问顺序        |\n| 层序 BFS    | `102 二叉树的层序遍历`、`199 二叉树的右视图` | 队列按层处理        | 每轮先固定本层 `size`    |\n| 子树属性递归    | `104 最大深度`、`226 翻转二叉树`       | 子树返回值与原地修改    | 当前节点只依赖左右子树结果     |\n| 镜像比较      | `101 对称二叉树`                  | 双节点同步递归       | 比较外侧和内侧，避免单棵树独立递归 |\n| BST 中序性质  | `98 验证二叉搜索树`、`230 第 K 小`     | 中序严格递增        | BST 题先想中序遍历       |\n| BST 构造    | `108 有序数组转 BST`              | 区间递归建树        | 取中点做根，左右区间递归      |\n| 遍历序列建树    | `105 前序与中序构造二叉树`             | 用根切分左右子树      | 前序找根，中序确定左右规模     |\n| 树形展开      | `114 二叉树展开为链表`               | 原地重连引用        | 反向前序像链表头插法        |\n| 贡献型路径     | `543 二叉树的直径`、`124 最大路径和`     | 返回单边贡献，更新全局答案 | 答案可以拐弯，返回值不能拐弯    |\n| 前缀和路径     | `437 路径总和 III`               | 树上前缀和与回溯      | 左子树历史不能污染右子树      |\n| 最近公共祖先    | `236 二叉树的最近公共祖先`             | 子树查找目标节点      | 左右都找到，当前就是答案      |\n\n## 3. 复习顺序建议\n\n建议按“遍历能力 → 子树返回值 → 路径贡献 → 构造和设计”的顺序复习：\n\n1. `94 二叉树的中序遍历`：建立前中后序递归直觉。\n2. `104 最大深度`：理解子树返回值。\n3. `226 翻转二叉树`：练递归中的原地修改。\n4. `101 对称二叉树`：练两个节点同时递归。\n5. `102 层序遍历`：掌握 BFS 队列按层模板。\n6. `199 右视图`：理解 BFS 每层最后一个和 DFS 深度首次到达。\n7. `98`、`230`：用中序有序性处理 BST。\n8. `108`、`105`：练区间递归构造树。\n9. `543`、`124`：区分“全局答案”和“向上返回值”。\n10. `437`：掌握树上前缀和必须回溯。\n11. `236`：掌握 LCA 的后序查找逻辑。\n12. `114`：练树形结构原地改链。\n\n## 4. 关键套路详解\n\n### 4.1 递归从函数语义开始\n\n写二叉树递归前，先用一句话定义函数：\n\n```text\n这个函数处理以 root 为根的子树，并返回 ______。\n```\n\n例如 `104 最大深度` 返回“这棵子树的最大深度”；`543 直径` 的 DFS 返回“从当前节点向下走的最大深度”，同时用全局变量更新“经过当前节点的最大直径”；`236 最近公共祖先` 返回“当前子树里找到的 p 或 q 或 LCA”。\n\n如果这句话说不清楚，递归代码大概率会写乱。\n\n### 4.2 前中后序的真正区别是“当前节点什么时候处理”\n\n| 遍历 | 顺序 | 适合题型 |\n|---|---|---|\n| 前序 | 中、左、右 | 复制树、展开树、从根向下传状态 |\n| 中序 | 左、中、右 | BST 有序性、第 K 小、验证 BST |\n| 后序 | 左、右、中 | 深度、直径、最大路径和、LCA、删除/重构子树 |\n\n树的多数难题需要“遍历时带状态”或“遍历后返回信息”。比如 `437 路径总和 III` 是前序进入节点时加入前缀和，退出节点时回溯撤销。`124 最大路径和`是后序拿到左右贡献后更新答案。\n\n### 4.3 BFS 的关键是固定当前层长度\n\n层序题不要边遍历边用 `len(q)` 作为循环条件，因为队列过程中会加入下一层节点。正确做法是每进入一层先固定：\n\n```python\nsize = len(q)\nfor _ in range(size):\n    node = q.popleft()\n    # 在这里处理当前层节点，并把下一层节点加入队列。\n```\n\n`102` 收集每层所有节点，`199` 可以在每层开始时取 `q[-1].val`，也可以在每层循环中记录最后一个弹出的节点。\n\n### 4.4 BST 题优先想中序遍历\n\nBST 的最强性质是中序遍历严格递增。`98 验证 BST`不能只比较当前节点和左右孩子，因为 BST 约束是整棵左子树都小于当前节点、整棵右子树都大于当前节点。正确方向有两个：\n\n| 方法 | 思路 | 适合场景 |\n|---|---|---|\n| 中序递增 | 维护上一个访问值 `prev` | 验证 BST、第 K 小 |\n| 上下界递归 | 每个节点必须落在 `(low, high)` 内 | 避免全局变量，更严格表达范围约束 |\n\n`230 第 K 小`就是中序遍历到第 K 个节点。进阶场景如果频繁插入删除并查询第 K 小，需要维护子树大小，走类似 order statistic tree 的路线。\n\n### 4.5 贡献型路径题要区分“答案”和“返回值”\n\n`543 直径`和`124 最大路径和`是同一类题。当前节点处的最优答案可以同时使用左子树和右子树，因为路径可以在当前节点拐弯。但向父节点返回时，只能选择一边继续向上，不能左右都带走，否则路径会分叉。\n\n| 题目 | 当前节点更新答案 | 向父节点返回 |\n|---|---|---|\n| `543 直径` | `leftDepth + rightDepth` | `max(leftDepth, rightDepth) + 1` |\n| `124 最大路径和` | `node.val + leftGain + rightGain` | `node.val + max(leftGain, rightGain)` |\n\n最重要的一句话：答案可以拐弯，返回值不能拐弯。\n\n### 4.6 树上前缀和必须回溯\n\n`437 路径总和 III`像数组题 `560 和为 K 的子数组`，但树有分叉。当前路径上的前缀和只能给当前分支使用，不能污染兄弟分支。因此进入节点时执行 `prefix[sum] += 1`，递归完左右子树后必须执行 `prefix[sum] -= 1`。\n\n初始化 `prefix[0] = 1` 的含义是：如果从根到当前节点的路径和刚好等于目标值，也应该被统计。\n\n### 4.7 构造题的本质是区间递归\n\n`108 有序数组转 BST`和`105 前序中序构造树`都依赖区间递归。\n\n`108` 的区间含义简单：取中点做根，左区间建左子树，右区间建右子树。\n\n`105` 的边界更容易错：前序第一个是根，中序中根左边是左子树，根右边是右子树。只要算出 `leftSize`，前序左右子树边界就能推出来。\n\n## 5. 抽象代码模板\n\n下面模板按二叉树题的递归语义拆分。每个模板都先说明适用题型、核心思路，再给出可迁移 Python 骨架。本节在保留新版严格结构的同时，补回旧版总笔记中的完整覆盖：遍历、层序、子树属性、双节点比较、BST、构造树、贡献型路径、树上前缀和、LCA 和树形展开。\n\n### 5.1 DFS 访问位置模板\n\n#### 适用题型\n\n- `94 二叉树的中序遍历`：访问位置决定前序 / 中序 / 后序。\n- `199 二叉树的右视图`：先右后左，首次到达某一层时记录。\n- 从根向下传递路径状态、深度、上下界的题。\n- BST 中序类题的基础访问框架，完整 BST 模板见 5.5。\n\n#### 核心思路\n\n二叉树 DFS 的关键在于明确当前节点在递归生命周期的哪个位置处理：前序位置适合把状态从父节点传给子节点；中序位置适合利用 BST 有序性；后序位置适合等左右子树都处理完后汇总信息。这个模板本身不依赖返回值，重点是访问时机。\n\n#### 代码模板\n\n> **题目简述：** 本模板覆盖：94 二叉树的中序遍历（给定二叉树根结点，按左子树、根、右子树的顺序返回结点值。）；199 二叉树的右视图（给定二叉树，返回从右侧观察时自顶向下能够看到的结点值。） [94 原题 ↗](https://leetcode.cn/problems/binary-tree-inorder-traversal/) · [199 原题 ↗](https://leetcode.cn/problems/binary-tree-right-side-view/)\n\n```python\nclass TreeNode:\n    def __init__(self, val=0, left=None, right=None):\n        self.val = val\n        self.left = left\n        self.right = right\n\ndef dfsPosition(root, depth, ans):\n    if not root:\n        return\n\n    # 前序访问位置：适合记录深度首次到达、从父节点向子节点传状态。\n    if depth == len(ans):\n        ans.append(root.val)\n\n    dfsPosition(root.left, depth + 1, ans)\n\n    # 中序访问位置：BST 题可在这里利用有序性。\n    # ans.append(root.val)\n\n    dfsPosition(root.right, depth + 1, ans)\n\n    # 后序访问位置：适合在左右子树处理完后汇总信息。\n    # ans.append(root.val)\n```\n\n#### 易错点\n\n- BST 题不要只在前序位置比较当前节点和左右孩子，BST 约束的是整棵子树范围或中序严格递增。\n- 右视图 DFS 必须先右后左，否则“首次到达该层”记录的是左视图。\n- 路径状态如果只属于当前路径，进入节点后修改，退出节点前必须恢复。\n\n### 5.2 BFS 层序模板\n\n#### 适用题型\n\n- `102 二叉树的层序遍历`：按层收集节点。\n- `199 二叉树的右视图`：每层取最后一个节点。\n- 二叉树最大深度的 BFS 写法。\n- 按层统计最大值、平均值、宽度等。\n\n#### 核心思路\n\nBFS 层序的核心不变量是：每一轮开始时队列里恰好是当前层的所有节点。必须先固定 `size`，本轮只弹出这 `size` 个节点；循环中加入的孩子属于下一层，不能混入当前层。\n\n#### 代码模板\n\n> **题目简述：** 本模板覆盖：102 二叉树的层序遍历（给定二叉树，按从上到下、每层从左到右返回各层结点值。）；199 二叉树的右视图（给定二叉树，返回从右侧观察时自顶向下能够看到的结点值。） [102 原题 ↗](https://leetcode.cn/problems/binary-tree-level-order-traversal/) · [199 原题 ↗](https://leetcode.cn/problems/binary-tree-right-side-view/)\n\n```python\ndef levelOrder(root):\n    levels = []\n    if not root:\n        return levels\n\n    q = deque()\n    q.append(root)\n\n    while not not q:\n        size = len(q)  # 层序不变量：当前层节点数，后续 len(q) 会变化。\n        level = []\n\n        for i in range(0, size):\n            node = q[0]\n            q.pop()\n\n            # i == 0 是左视图候选；i == size - 1 是右视图候选。\n            level.append(node.val)\n\n            if node.left:\n                q.append(node.left)  # 下一层节点，只能在下一轮处理。\n            if node.right:\n                q.append(node.right)\n\n        levels.append(level)\n\n    return levels\n```\n\n#### 易错点\n\n- 不要在 `for` 条件里动态使用 `len(q)`，否则会把下一层节点也处理掉。\n- 右视图取的是当前层最后一个弹出的节点，也可以每层开始时读取 `q.back()`。\n- 空树要在入队前处理，不能把None塞进队列。\n\n### 5.3 子树属性返回值模板\n\n#### 适用题型\n\n- `104 二叉树的最大深度`：返回当前子树高度。\n- 最小深度、节点数、叶子数等子树属性统计。\n- 判断平衡二叉树：返回高度，同时带失败状态。\n- `226 翻转二叉树`：递归处理左右子树后原地重连。\n\n#### 核心思路\n\n这一类题共享“后序合并”骨架：先处理左右子树，再在当前节点合成结果。它们不需要拆成完全不同的模板，真正变化的是返回值语义和合并公式。结构修改类题也一样，只是合并动作从“计算属性”变成“重接引用”。\n\n#### 代码模板：共同骨架\n\n> **题目简述：** 本模板覆盖：104 二叉树的最大深度（给定二叉树，求根结点到最远叶结点路径上的结点数。）；226 翻转二叉树（交换二叉树中每个结点的左右子树，并返回翻转后的根结点。） [104 原题 ↗](https://leetcode.cn/problems/maximum-depth-of-binary-tree/) · [226 原题 ↗](https://leetcode.cn/problems/invert-binary-tree/)\n\n```python\nclass TreeNode:\n    def __init__(self, val=0, left=None, right=None):\n        self.val = val\n        self.left = left\n        self.right = right\n\nclass SubtreeInfo:\n    def __init__(self, height=0, nodeCount=0, leafCount=0, balanced=True):\n        self.height = height\n        self.nodeCount = nodeCount\n        self.leafCount = leafCount\n        self.balanced = balanced\n\ndef collectSubtreeInfo(root):\n    if not root:\n        return SubtreeInfo()\n\n    left = collectSubtreeInfo(root.left)\n    right = collectSubtreeInfo(root.right)\n\n    height = max(left.height, right.height) + 1\n    nodeCount = left.nodeCount + right.nodeCount + 1\n\n    if not root.left and not root.right:\n        leafCount = 1\n    else:\n        leafCount = left.leafCount + right.leafCount\n\n    balanced = (\n        left.balanced\n        and right.balanced\n        and abs(left.height - right.height) \u003c= 1\n    )\n\n    return SubtreeInfo(height, nodeCount, leafCount, balanced)\n```\n\n翻转树仍是同一个递归框架，原始笔记写法是先暂存左子树，再递归交换左右入口：\n\n> **题目简述：** 本模板覆盖：104 二叉树的最大深度（给定二叉树，求根结点到最远叶结点路径上的结点数。）；226 翻转二叉树（交换二叉树中每个结点的左右子树，并返回翻转后的根结点。） [104 原题 ↗](https://leetcode.cn/problems/maximum-depth-of-binary-tree/) · [226 原题 ↗](https://leetcode.cn/problems/invert-binary-tree/)\n\n```python\nclass TreeNode:\n    def __init__(self, val=0, left=None, right=None):\n        self.val = val\n        self.left = left\n        self.right = right\n\ndef invertTreeTemplate(root):\n    if not root:\n        return None\n\n    # 先暂存左子树，再递归交换左右入口。\n    left = root.left\n    root.left = invertTreeTemplate(root.right)\n    root.right = invertTreeTemplate(left)\n    return root\n```\n\n#### 变形点对照\n\n| 题型    | 共同骨架中改哪里         | 合并公式 / 处理差异                              |\n| ----- | ---------------- | ---------------------------------------- |\n| 最大深度  | 返回 `height`      | `max(left.height, right.height) + 1`     |\n| 节点数   | 返回 `nodeCount`   | `left.nodeCount + right.nodeCount + 1`   |\n| 叶子数   | 增加叶子判断           | 叶子为 `1`，非叶子累加左右叶子数                       |\n| 平衡二叉树 | 高度同时带 `balanced` | 左右平衡且高度差不超过 `1`                          |\n| 最小深度  | 单孩子节点特殊处理        | 空子树不能参与 `min`                            |\n| 翻转二叉树 | 合并动作改成引用重接       | `root.left = right; root.right = left` |\n|       |                  |                                          |\n\n#### 易错点\n\n- 返回值必须只表示当前子树属性，不要混入“整棵树最终答案”的语义。\n- 最小深度遇到单孩子节点不能简单 `min(left, right) + 1`，否则会把不存在的空子树深度 0 当成路径。\n- 平衡树不能只看当前节点高度差，还要保证左右子树本身已经平衡。\n- 翻转树可以前序交换也可以后序交换，但必须保证左右引用最终接到已处理后的子树。\n\n### 5.4 双节点镜像递归模板\n\n#### 适用题型\n\n- `101 对称二叉树`：比较左右子树是否互为镜像。\n- 判断两棵树是否相同。\n- 判断一棵树是否是另一棵树的子树。\n- 任意需要两个节点同步推进、成对比较的树题。\n\n#### 核心思路\n\n对称树需要双节点同步递归。递归参数同时保存两个待比较节点。镜像比较时使用 `a.left` 对 `b.right`、`a.right` 对 `b.left`；相同树比较时使用 `a.left` 对 `b.left`、`a.right` 对 `b.right`。\n\n#### 代码 A：镜像比较\n\n> **题目简述：** 101 对称二叉树：给定二叉树根结点，判断其左右子树是否关于中心互为镜像。 [力扣原题 ↗](https://leetcode.cn/problems/symmetric-tree/)\n\n```python\nclass TreeNode:\n    def __init__(self, val=0, left=None, right=None):\n        self.val = val\n        self.left = left\n        self.right = right\n\ndef mirrorCompare(a, b):\n    if not a and not b:\n        return True\n    if not a or not b:\n        return False\n    if a.val != b.val:\n        return False\n\n    # 镜像比较：外侧对外侧，内侧对内侧。\n    return mirrorCompare(a.left, b.right) and mirrorCompare(a.right, b.left)\n\ndef isSymmetricTemplate(root):\n    if not root:\n        return True\n    return mirrorCompare(root.left, root.right)\n```\n\n#### 代码 B：相同树比较\n\n> **题目简述：** 100 相同的树：给定两棵二叉树，判断其结构及对应结点值是否完全相同。 [力扣原题 ↗](https://leetcode.cn/problems/same-tree/)\n\n```python\nclass TreeNode:\n    def __init__(self, val=0, left=None, right=None):\n        self.val = val\n        self.left = left\n        self.right = right\n\ndef sameTree(a, b):\n    if not a and not b:\n        return True\n    if not a or not b:\n        return False\n    if a.val != b.val:\n        return False\n\n    # 相同树比较：左对左，右对右。\n    return sameTree(a.left, b.left) and sameTree(a.right, b.right)\n```\n\n#### 易错点\n\n- 对称树比较的是外侧和内侧：`left-left` 对 `right-right` 的写法是错的。\n- 双节点递归要先处理“同时为空 / 只有一个为空 / 值不同”三类终止条件。\n- 子树判断通常是“外层遍历每个起点 + 内层 sameTree”，不要把两层语义混在一个函数里。\n\n### 5.5 BST 中序与上下界模板\n\n#### 适用题型\n\n- `98 验证二叉搜索树`：中序严格递增或递归传上下界。\n- `230 二叉搜索树中第 K 小的元素`：中序遍历第 K 个访问点。\n- BST 第 K 大：反中序，即右、根、左。\n- BST 范围查询、范围剪枝。\n\n#### 核心思路\n\nBST 的性质要求整棵左子树都小于根，整棵右子树都大于根。验证时要么传递开区间 `(low, high)`，要么利用中序严格递增。第 K 小的本质是中序遍历计数，成员变量需要在公开入口初始化。\n\n#### 代码 A：上下界验证 BST\n\n> **题目简述：** 98 验证二叉搜索树：判断二叉树是否满足所有左侧值严格更小、右侧值严格更大的全局约束。 [力扣原题 ↗](https://leetcode.cn/problems/validate-binary-search-tree/)\n\n```python\nclass TreeNode:\n    def __init__(self, val=0, left=None, right=None):\n        self.val = val\n        self.left = left\n        self.right = right\n\nclass ValidateBstRangeTemplate:\n    def _dfs(self, root, low, high):\n        if not root:\n            return True\n\n        # 当前节点必须落在开区间 (low, high) 内。\n        if root.val \u003c= low or root.val >= high:\n            return False\n\n        return (\n            self._dfs(root.left, low, root.val)\n            and self._dfs(root.right, root.val, high)\n        )\n\n    def isValidBST(self, root):\n        return self._dfs(root, float(\"-inf\"), float(\"inf\"))\n```\n\n#### 代码 B：中序验证 BST\n\n> **题目简述：** 98 验证二叉搜索树：判断二叉树是否满足所有左侧值严格更小、右侧值严格更大的全局约束。 [力扣原题 ↗](https://leetcode.cn/problems/validate-binary-search-tree/)\n\n```python\nclass TreeNode:\n    def __init__(self, val=0, left=None, right=None):\n        self.val = val\n        self.left = left\n        self.right = right\n\nclass ValidateBstInorderTemplate:\n    def __init__(self):\n        self.prev = None\n\n    def _inorder(self, root):\n        if not root:\n            return True\n\n        if not self._inorder(root.left):\n            return False\n\n        # 中序遍历必须严格递增。\n        if self.prev is not None and root.val \u003c= self.prev:\n            return False\n        self.prev = root.val\n\n        return self._inorder(root.right)\n\n    def isValidBST(self, root):\n        # 公开入口重置 prev，避免多次调用污染状态。\n        self.prev = None\n        return self._inorder(root)\n```\n\n#### 代码 C：第 K 小\n\n> **题目简述：** 本模板覆盖：98 验证二叉搜索树（判断二叉树是否满足所有左侧值严格更小、右侧值严格更大的全局约束。）；230 二叉搜索树中第 K 小的元素（给定二叉搜索树和有效整数 K，返回所有结点值中的第 K 小值。） [98 原题 ↗](https://leetcode.cn/problems/validate-binary-search-tree/) · [230 原题 ↗](https://leetcode.cn/problems/kth-smallest-element-in-a-bst/)\n\n```python\nclass TreeNode:\n    def __init__(self, val=0, left=None, right=None):\n        self.val = val\n        self.left = left\n        self.right = right\n\nclass KthSmallestBstTemplate:\n    def __init__(self):\n        self.remain = 0\n        self.answer = None\n\n    def _inorder(self, root):\n        if not root or self.remain == 0:\n            return\n\n        self._inorder(root.left)\n        if self.remain == 0:\n            return\n\n        self.remain -= 1\n        if self.remain == 0:\n            self.answer = root.val\n            return\n\n        self._inorder(root.right)\n\n    def kthSmallest(self, root, k):\n        # 公开入口初始化计数器和答案。\n        self.remain = k\n        self.answer = None\n        self._inorder(root)\n        return self.answer\n```\n\n#### 易错点\n\n- 验证 BST 不能只比较当前节点和左右孩子，要约束整棵子树。\n- `prev` 初始化不能用 `-float(\"inf\")`，因为节点值可能等于 `-float(\"inf\")`，用 `LLONG_MIN` 更安全。\n- 第 K 大只需改成反中序 `right, root, left`，不要先遍历完整数组再排序。\n\n### 5.6 区间递归构造二叉树模板\n\n#### 适用题型\n\n- `108 将有序数组转换为二叉搜索树`：用有序区间中点作为根。\n- `105 从前序与中序遍历序列构造二叉树`：前序确定根，中序切分左右子树。\n- 中序 + 后序构造树变形。\n- 任意“一个区间构造一棵子树”的分治题。\n\n#### 核心思路\n\n构造树题必须先定义区间语义。`108` 适合使用左闭右开区间 `[left, right)`；`105` 常用闭区间，前序左端是根，中序根左侧是左子树。为了避免每次在线性扫描中序数组，先用哈希表记录值到下标的映射。\n\n#### 代码 A：有序数组转平衡 BST\n\n> **题目简述：** 108 将有序数组转换为二叉搜索树：给定严格升序数组，将其转换为一棵高度平衡的二叉搜索树。 [力扣原题 ↗](https://leetcode.cn/problems/convert-sorted-array-to-binary-search-tree/)\n\n```python\ndef buildBalancedBst(nums, left, right):\n    # 区间语义：用 nums[left, right) 构造一棵平衡 BST。\n    if left >= right:\n        return None\n\n    mid = left + (right - left) // 2\n    root = TreeNode(nums[mid])\n\n    root.left = buildBalancedBst(nums, left, mid)\n    root.right = buildBalancedBst(nums, mid + 1, right)\n\n    return root\n\ndef sortedArrayToBSTTemplate(nums):\n    return buildBalancedBst(nums, 0, len(nums))\n```\n\n#### 代码 B：前序 + 中序构造树\n\n> **题目简述：** 105 从前序与中序遍历序列构造二叉树：给定同一棵无重复值二叉树的前序和中序序列，还原并返回该树。 [力扣原题 ↗](https://leetcode.cn/problems/construct-binary-tree-from-preorder-and-inorder-traversal/)\n\n```python\nclass TreeNode:\n    def __init__(self, val=0, left=None, right=None):\n        self.val = val\n        self.left = left\n        self.right = right\n\ndef buildTree(preorder, inorder):\n    index = {v: i for i, v in enumerate(inorder)}\n\n    def dfs(pre_l, pre_r, in_l, in_r):\n        if pre_l > pre_r:\n            return None\n        root_val = preorder[pre_l]\n        root_idx = index[root_val]\n        left_size = root_idx - in_l\n        root = TreeNode(root_val)\n        root.left = dfs(pre_l + 1, pre_l + left_size, in_l, root_idx - 1)\n        root.right = dfs(pre_l + left_size + 1, pre_r, root_idx + 1, in_r)\n        return root\n\n    return dfs(0, len(preorder) - 1, 0, len(inorder) - 1)\n```\n\n#### 易错点\n\n- 构造题最容易错的是区间开闭不统一，建议在代码注释里固定区间语义。\n- `leftSize` 是中序根下标和当前中序左边界的差，不能用前序下标差。\n- `105` 默认节点值不重复；如果值重复，单纯 `value: index` 映射会失效。\n\n### 5.7 贡献型路径模板\n\n#### 适用题型\n\n- `543 二叉树的直径`。\n- `124 二叉树中的最大路径和`。\n- 任意“当前节点更新全局答案，向父节点只能返回单边贡献”的路径题。\n\n#### 核心思路\n\n贡献型题共享同一套骨架：DFS 返回“能继续交给父节点拼接的单边贡献”，而全局答案在当前节点用“左贡献 + 当前节点 + 右贡献”更新。直径和最大路径和共用模板，差别在于贡献的单位、负贡献处理和答案公式。\n\n#### 代码模板：共同骨架\n\n> **题目简述：** 本模板覆盖：543 二叉树的直径（求二叉树任意两结点间最长路径的边数，该路径不一定经过根结点。）；124 二叉树中的最大路径和（二叉树路径可从任意结点起止且不重复经过结点，求最大结点值之和。） [124 原题 ↗](https://leetcode.cn/problems/binary-tree-maximum-path-sum/) · [543 原题 ↗](https://leetcode.cn/problems/diameter-of-binary-tree/)\n\n```python\nclass TreeNode:\n    def __init__(self, val=0, left=None, right=None):\n        self.val = val\n        self.left = left\n        self.right = right\n\nclass PathContributionTemplate:\n    def __init__(self):\n        self.ans = 0\n\n    def _dfs(self, root):\n        if not root:\n            return 0\n\n        left = self._dfs(root.left)\n        right = self._dfs(root.right)\n\n        # 不同汇合点：答案可以在当前节点拐弯，同时使用左右贡献。\n        self.ans = max(self.ans, left + right)\n\n        # 不同返回点：返回给父节点时不能拐弯，只能选一侧继续延伸。\n        return max(left, right) + 1\n\n    def diameterOfBinaryTree(self, root):\n        self.ans = 0\n        self._dfs(root)\n        return self.ans\n```\n\n最大路径和沿用相同骨架，只替换三处：空节点贡献、负贡献处理、答案公式。\n\n> **题目简述：** 本模板覆盖：543 二叉树的直径（求二叉树任意两结点间最长路径的边数，该路径不一定经过根结点。）；124 二叉树中的最大路径和（二叉树路径可从任意结点起止且不重复经过结点，求最大结点值之和。） [124 原题 ↗](https://leetcode.cn/problems/binary-tree-maximum-path-sum/) · [543 原题 ↗](https://leetcode.cn/problems/diameter-of-binary-tree/)\n\n```python\n# 变形点 1：左右贡献如果为负，直接截断为 0。\nleftGain = max(0, sumGain(root.left))\nrightGain = max(0, sumGain(root.right))\n\n# 变形点 2：全局答案公式从边数改成路径和。\nans = max(ans, root.val + leftGain + rightGain)\n\n# 变形点 3：返回值带上当前节点值，只能选一侧。\nreturn root.val + max(leftGain, rightGain)\n```\n\n#### 变形点对照\n\n| 题型 | 返回值语义 | 全局答案公式 | 特殊处理 |\n|---|---|---|---|\n| 二叉树直径 | 向下最大深度 | `leftDepth + rightDepth` | `ans` 初始为 `0` |\n| 最大路径和 | 向下最大路径和 | `root.val + leftGain + rightGain` | 负贡献截断；`ans` 初始为 `-float(\"inf\")` |\n\n#### 易错点\n\n- 不要把 `left + right` 返回给父节点；它只能用于更新当前节点处的全局答案。\n- 最大路径和的答案初值必须足够小，不能初始化为 0，否则全负数输入会错。\n- 如果把 `ans` 写成成员变量或全局变量，必须在公开入口函数里重置。\n- 直径常按边数计，深度返回按节点层数计，两者不要混淆。\n\n### 5.8 树上前缀和回溯模板\n\n#### 适用题型\n\n- `437 路径总和 III`。\n- 树上任意祖先到后代路径和计数。\n- 需要查询当前路径历史状态的题。\n\n#### 核心思路\n\n树上前缀和像数组前缀和，但历史只属于“根到当前节点”这条路径。进入节点后加入当前前缀，递归左右子树，退出节点前撤销当前前缀。这里不需要全局答案，直接用返回值累计当前子树中的方案数，初始化 `map[0] = 1`。\n\n#### 代码模板\n\n> **题目简述：** 437 路径总和 III：统计二叉树中结点值之和等于目标值的向下路径数，路径可从任意结点开始。 [力扣原题 ↗](https://leetcode.cn/problems/path-sum-iii/)\n\n```python\nclass TreeNode:\n    def __init__(self, val=0, left=None, right=None):\n        self.val = val\n        self.left = left\n        self.right = right\n\nclass TreePrefixSumTemplate:\n    def __init__(self):\n        self.count = {0: 1}\n        self.target = 0\n\n    def path(self, root, prefix_sum):\n        if not root:\n            return 0\n\n        prefix_sum += root.val\n        res = self.count.get(prefix_sum - self.target, 0)\n\n        self.count[prefix_sum] = self.count.get(prefix_sum, 0) + 1\n        res += self.path(root.left, prefix_sum)\n        res += self.path(root.right, prefix_sum)\n        self.count[prefix_sum] -= 1\n\n        return res\n\n    def pathSum(self, root, targetSum):\n        self.target = targetSum\n        self.count = {0: 1}\n        return self.path(root, 0)\n```\n\n#### 易错点\n\n- `map` 记录当前路径历史，不能当全树历史；递归退出前必须把当前前缀和计数减 1。\n- 先统计 `map[sum - target]`，再把当前 `sum` 加入表，避免把当前节点当成自己的历史。\n- 在 Python 中整数不会像固定宽度整型那样溢出；仍要注意前缀和可能很大，逻辑上按整数精确维护即可。\n\n### 5.9 最近公共祖先 LCA 模板\n\n#### 适用题型\n\n- `236 二叉树的最近公共祖先`：普通二叉树后序查找。\n- BST 最近公共祖先：利用节点值范围剪枝。\n- 多个目标节点的公共祖先变形。\n- 不保证目标节点存在时，需要额外统计命中数量的变形。\n\n#### 核心思路\n\n普通二叉树 LCA 的共同骨架是后序查找：左右子树各自返回命中信息，当前节点根据左右命中情况决定是否成为汇合点。变形不应该拆成完全无关模板，而是在返回值里增加“是否找到目标”“命中数量”等少量信息。BST LCA 是例外：因为可利用值范围剪枝，控制流会变成迭代向左/向右。\n\n#### 代码模板：共同骨架\n\n> **题目简述：** 236 二叉树的最近公共祖先：给定二叉树及其中两个结点，返回同时包含二者的最深祖先结点。 [力扣原题 ↗](https://leetcode.cn/problems/lowest-common-ancestor-of-a-binary-tree/)\n\n```python\ndef lowestCommonAncestorTemplate(root, p, q):\n    if not root or root == p or root == q:\n        return root\n\n    left = lowestCommonAncestorTemplate(root.left, p, q)\n    right = lowestCommonAncestorTemplate(root.right, p, q)\n\n    if left and right:\n        return root  # 左右两侧各命中一个目标，当前节点是最近汇合点。\n    return left if left else right\n```\n\n如果题目不保证目标都存在，骨架仍是后序，只把返回值从一个节点扩展成“节点 + 命中标记”：\n\n> **题目简述：** 236 二叉树的最近公共祖先：给定二叉树及其中两个结点，返回同时包含二者的最深祖先结点。 [力扣原题 ↗](https://leetcode.cn/problems/lowest-common-ancestor-of-a-binary-tree/)\n\n```python\nclass TreeNode:\n    def __init__(self, val=0, left=None, right=None):\n        self.val = val\n        self.left = left\n        self.right = right\n\nclass LcaSearchResult:\n    def __init__(self, node=None, foundP=False, foundQ=False):\n        self.node = node\n        self.foundP = foundP\n        self.foundQ = foundQ\n\ndef lcaSearch(root, p, q):\n    if not root:\n        return LcaSearchResult()\n\n    left = lcaSearch(root.left, p, q)\n    if left.node:\n        return left\n\n    right = lcaSearch(root.right, p, q)\n    if right.node:\n        return right\n\n    # 变形点：left/right 仍然后序合并，只是在合并时维护 foundP/foundQ。\n    foundP = left.foundP or right.foundP or root == p\n    foundQ = left.foundQ or right.foundQ or root == q\n    node = root if foundP and foundQ else None\n    return LcaSearchResult(node, foundP, foundQ)\n```\n\n多目标 LCA 也是同一思路：把两个布尔命中扩展成“当前子树命中的目标数量”。\n\n> **题目简述：** 236 二叉树的最近公共祖先：给定二叉树及其中两个结点，返回同时包含二者的最深祖先结点。 [力扣原题 ↗](https://leetcode.cn/problems/lowest-common-ancestor-of-a-binary-tree/)\n\n```python\ndef lowest_common_ancestor_for_targets(root, targets):\n    target_set = set(targets)\n    answer = None\n\n    def dfs(node):\n        nonlocal answer\n        if node is None:\n            return 0\n        count = 1 if node in target_set else 0\n        count += dfs(node.left)\n        count += dfs(node.right)\n        if count == len(target_set) and answer is None:\n            answer = node\n        return count\n\n    dfs(root)\n    return answer\n```\n\n#### 变形点对照\n\n| 题型 | 返回值语义 | 合并差异 |\n|---|---|---|\n| 普通二叉树 LCA | 返回 `p/q/LCA/None` | 左右都非空则当前为 LCA |\n| 不保证目标存在 | 返回节点，同时带 `foundP/foundQ` | 最终必须两个目标都存在才返回答案 |\n| 多目标 LCA | 返回命中目标数量 | 首次命中数量达到目标总数时锁定答案 |\n| BST LCA | 不需要后序返回值 | 根据 `p/q` 与当前值关系向左或向右剪枝 |\n\n#### 易错点\n\n- 当前节点等于 `p` 或 `q` 时要直接返回当前节点，不需要继续向下找另一个。\n- 普通二叉树不能用值大小剪枝；只有 BST LCA 才能按值判断左右方向。\n- 如果题目不保证 `p`、`q` 都存在，普通模板会把存在的那个节点返回，需要额外记录命中数量。\n- 多目标 LCA 要在后序位置判断，前序判断会把过高的祖先误当答案。\n\n### 5.10 二叉树展开为链表模板\n\n#### 适用题型\n\n- `114 二叉树展开为链表`。\n- 树按前序遍历顺序原地改成单链结构。\n- 需要把左子树和右子树重排到一条 `right` 引用链上的题。\n\n#### 核心思路\n\n目标链表顺序是前序：根、左、右。递归法可以反过来处理：右、左、根，用 `prev` 保存已经处理好的链表头，当前节点接到 `prev` 前面。迭代法则找到当前左子树的最右节点，把原右子树接到它后面，再把左子树整体挪到右边。\n\n#### 代码 A：反向前序递归\n\n> **题目简述：** 114 二叉树展开为链表：将二叉树原地展开为前序遍历顺序的单链表，仅使用结点的右指针。 [力扣原题 ↗](https://leetcode.cn/problems/flatten-binary-tree-to-linked-list/)\n\n```python\nclass TreeNode:\n    def __init__(self, val=0, left=None, right=None):\n        self.val = val\n        self.left = left\n        self.right = right\n\n\nclass FlattenReversePreorderTemplate:\n    def __init__(self):\n        self.prev = None\n\n    def _dfs(self, root):\n        if root is None:\n            return\n        self._dfs(root.right)\n        self._dfs(root.left)\n        root.right = self.prev\n        root.left = None\n        self.prev = root\n\n    def flatten(self, root):\n        self.prev = None\n        self._dfs(root)\n```\n\n#### 代码 B：O(1) 额外空间前驱法\n\n> **题目简述：** 114 二叉树展开为链表：将二叉树原地展开为前序遍历顺序的单链表，仅使用结点的右指针。 [力扣原题 ↗](https://leetcode.cn/problems/flatten-binary-tree-to-linked-list/)\n\n```python\ndef flattenByPredecessorTemplate(root):\n    cur = root\n\n    while cur:\n        if cur.left:\n            # predecessor 是左子树按前序展开后最末尾的节点，也就是左子树最右链末端。\n            predecessor = cur.left\n            while predecessor.right:\n                predecessor = predecessor.right\n\n            predecessor.right = cur.right  # 原右子树接到左子树末尾。\n            cur.right = cur.left  # 左子树整体移动到右侧。\n            cur.left = None  # 展开链表必须清空 left。\n\n        cur = cur.right\n```\n\n#### 易错点\n\n- `114` 的目标顺序是前序，不能用中序或后序。\n- 递归反向前序必须初始化 `prev = None`，否则多次调用会串到旧链表。\n- 每处理一个节点都要清空 `left`，否则展开链表结构非法。\n- 前驱法中必须先把原右子树接到左子树最右节点，再移动左子树。\n\n\n## 6. 高频易错点清单\n\n| 易错点 | 典型题目 | 规避方式 |\n|---|---|---|\n| 递归函数返回值语义不清 | `104`、`543`、`124`、`236` | 先写一句“dfs 返回什么” |\n| BFS 没有固定当前层长度 | `102`、`199` | 每层开始先 `level_size = len(q)` |\n| 队列初始化后忘记压入根节点 | `102` | 空树判断后立刻 `q.push(root)` |\n| BST 只比较父子节点 | `98` | 用中序严格递增或上下界递归 |\n| 第 K 小没有利用 BST 中序 | `230` | 中序遍历计数，第 K 个就是答案 |\n| 构造树边界算错 | `105` | 用 `leftSize` 推前序左右区间 |\n| 贡献型题把返回值当答案 | `543`、`124` | 全局答案可左右合并，返回值只能单边延伸 |\n| 最大路径和没有截断负贡献 | `124` | `leftGain = max(0, dfs(left))` |\n| 前缀和没有回溯 | `437` | 左右子树递归后 `prefix_count[cur_sum] -= 1` |\n| LCA 不知道何时返回当前节点 | `236` | 左右都找到时当前节点就是 LCA |\n| 展开链表忘记清空 left | `114` | 每处理一个节点都 `root.left = None` |\n| 现有 `543` 笔记代码与题目不匹配 | `543` | 思路是直径，代码应使用直径模板，不应套最大路径和函数 |\n\n## 7. 最短复盘口诀\n\n二叉树题先定义递归函数返回什么。遍历题看当前节点处理位置，层序题固定当前层 `size`，BST 题先想中序，构造题看区间边界，路径题分清“全局答案”和“向上贡献”，前缀和题进入加状态、退出撤状态。`104` 是子树属性母题，`102` 是 BFS 母题，`98` 是 BST 母题，`543/124` 是贡献型路径母题，`236` 是后序查找母题。\n\n\n\n================================================================================\n\n# 第7部分: 图论\n\n================================================================================\n\n> 目标：本文把 Hot100 中的图论题抽象成若干“可复用题型模板”。复习时先判断图的形态，再决定建图方式、遍历方式、状态语义和终止条件。\n\n## 1. 图论题的底层模型\n\n图论题的关键在于把题目翻译成图。每道图论题先问六个问题：\n\n| 问题 | 如果答案是“是” | 常用处理 |\n|---|---|---|\n| 图是隐式的吗 | 网格、字符串前缀、状态转移 | 不一定显式建边，用方向数组、字符分支或状态转移生成邻居 |\n| 图是显式的吗 | 课程依赖、边列表、节点关系 | 建邻接表 `list[list[int]] edges` |\n| 需要找连通块数量吗 | 岛屿数量、区域计数 | 外层枚举起点，遇到未访问节点就 DFS/BFS 吃掉整块 |\n| 答案和最短时间/层数有关吗 | 腐烂的橘子、最短步数 | BFS 按层扩散，必要时多源同时入队 |\n| 是否是有向图判环 | 课程表、依赖关系 | 拓扑排序看是否能访问全部节点，或 DFS 三色标记 |\n| 是否是前缀路径结构 | Trie、自动补全、前缀查询 | 每个节点维护 `children`，路径表示字符串前缀 |\n\n图论题最常见的图形态有四种：\n\n| 图形态 | 节点是什么 | 边是什么 | 代表题 |\n|---|---|---|---|\n| 网格图 | 一个格子 `(r, c)` | 上下左右相邻 | `200`、`994`、相邻题 `79` |\n| 有向图 | 一门课程或一个状态 | 依赖关系或状态转移 | `207` |\n| 字符前缀图 | Trie 节点 | 下一个字符分支 | `208` |\n| 状态图 | 一个数值或组合状态 | 一次合法操作 | 相邻题 `279`、`322` 可用 BFS 理解 |\n\n## 2. Hot100 图论题型地图\n\n本专题覆盖 `200 岛屿数量`、`207 课程表`、`208 实现 Trie`、`994 腐烂的橘子` 四类图论模型。`79 单词搜索`与网格图 DFS 模板高度相关，可作为相邻变形题一起复习。\n\n| 题型 | 题目 | 抽象能力 | 一句话记忆 |\n|---|---|---|---|\n| 网格连通块 DFS | `200 岛屿数量` | 方向数组、边界判断、访问标记 | 遇到一块陆地，DFS 把整座岛吃掉 |\n| 网格多源 BFS | `994 腐烂的橘子` | 多源入队、按层扩散、分钟计数 | 一开始所有腐烂橘子同时扩散 |\n| 有向图判环 | `207 课程表` | 邻接表、入度、拓扑排序、三色 DFS | 能拓扑完所有课就无环 |\n| 前缀树设计 | `208 实现 Trie` | 多叉字符图、路径查询、终止标记 | 节点表示前缀，`isEnd` 区分完整单词 |\n| 网格回溯 DFS | 相邻题 `79 单词搜索` | 路径状态、访问撤销、提前返回 | 找路径要恢复现场，不能永久染色 |\n\n## 3. 复习顺序建议\n\n建议按“隐式图遍历 → BFS 层扩散 → 显式建图 → 设计型图结构”的顺序复习：\n\n1. `200 岛屿数量`：建立网格图 DFS 的方向数组和访问标记直觉。\n2. `994 腐烂的橘子`：掌握多源 BFS 和按层计时。\n3. `207 课程表`：学习显式建图、入度数组、拓扑排序和 DFS 染色判环。\n4. `208 实现 Trie`：理解前缀树其实是字符路径图。\n5. `79 单词搜索`：作为网格 DFS 的回溯变形，重点练“进入修改、失败恢复”。\n\n## 4. 关键套路详解\n\n### 4.1 先翻译“点”和“边”\n\n图论题第一步是翻译：\n\n```text\n节点是什么？\n从一个节点可以走到哪些邻居？\n一个节点访问过以后还能不能再次访问？\n```\n\n`200` 中节点是格子，边是上下左右相邻的陆地；`994` 中节点也是格子，但边表示腐烂扩散，答案和 BFS 层数有关；`207` 中节点是课程，边是先修关系；`208` 中节点是前缀状态，边是一个字符。\n\n如果点和边翻译不清楚，DFS/BFS 模板再熟也会写乱。\n\n### 4.2 网格图的核心是方向数组和防越界\n\n网格图通常不需要显式建邻接表，因为每个格子的邻居可以通过方向数组现场生成：\n\n```python\ndirs = [[0, 1], [0, -1], [1, 0], [-1, 0]]\n```\n\n网格 DFS/BFS 的“防爆盾”通常包含三层：坐标是否越界、格子是否符合目标值、是否已经访问过。`200` 可以直接把访问过的 `'1'` 改成 `'0'` 或其他标记；`79` 不能永久修改，因为一条路径失败后，别的路径还可能使用这个格子，所以必须回溯恢复。\n\n### 4.3 DFS 适合吃完整块，BFS 适合算最短层数\n\n`200 岛屿数量`只需要知道有多少个连通块。外层枚举每个格子，一旦发现新陆地，就用 DFS 或 BFS 把整个连通块标记掉，答案加一。\n\n`994 腐烂的橘子`需要最少分钟数。分钟天然对应 BFS 的层数，所以要用队列按层扩散。更关键的是它是多源 BFS：一开始所有腐烂橘子同时入队。\n\n| 场景 | 优先方法 | 原因 |\n|---|---|---|\n| 只要遍历完一个连通块 | DFS 或 BFS | 不关心层数，吃完整块即可 |\n| 要最短步数、分钟、距离 | BFS | BFS 第一时间到达就是最短 |\n| 多个起点同时扩散 | 多源 BFS | 所有源点先一起入队，层数才正确 |\n| 路径要撤销状态 | 回溯 DFS | 进入标记，退出恢复 |\n\n### 4.4 多源 BFS 的初始化决定答案是否正确\n\n`994` 的难点在初始化：\n\n| 初始化内容 | 作用 |\n|---|---|\n| 所有腐烂橘子入队 | 多个源点同时在第 0 分钟开始扩散 |\n| 统计新鲜橘子数量 `fresh` | 最后判断是否还有死角无法腐烂 |\n| 如果 `fresh == 0` 直接返回 0 | 没有新鲜橘子时不需要进入 BFS |\n\nBFS 每处理完当前队列中的一层，才代表过了一分钟。不要每弹出一个橘子就加一分钟。\n\n### 4.5 课程表是有向图判环\n\n`207 课程表`要先把题意翻译成有向图。如果 `[a, b]` 表示学 `a` 之前必须先学 `b`，那么边应该是 `b: a`，意思是完成 `b` 后可以解锁 `a`。\n\n两种常用解法本质一致：\n\n| 方法 | 状态含义 | 判定方式 |\n|---|---|---|\n| 拓扑排序 | `indeg[x]` 表示课程 `x` 还剩多少前置课 | 能弹出并学习全部课程，说明无环 |\n| DFS 三色标记 | `0` 未访问，`1` 当前路径中，`2` 已确认安全 | DFS 遇到 `1`，说明有环 |\n\n拓扑排序更直观，DFS 染色更像递归版判环。两个都要掌握。\n\n### 4.6 Trie 是字符图，不只是字符串题\n\n`208 实现 Trie`可以理解为一张从根出发的字符图。每走一个字符，就沿着对应边进入下一层节点。`search` 和 `startsWith` 的区别不在遍历过程，而在遍历结束后的判断：\n\n| 操作 | 遍历过程 | 结束判断 |\n|---|---|---|\n| `insert` | 没有边就新建节点 | 最后节点 `isEnd = true` |\n| `search` | 缺边直接 false | 最后必须 `isEnd == true` |\n| `startsWith` | 缺边直接 false | 走完 prefix 就 true |\n\n最容易错的是把前缀存在当成完整单词存在。`apple` 插入后，`startsWith(\"app\")` 是 true，但 `search(\"app\")` 仍是 false，除非单独插入过 `app`。\n\n### 4.7 永久染色和回溯恢复不能混用\n\n`200` 和 `79` 都像网格 DFS，但访问标记的语义完全不同：\n\n| 题目 | 标记方式 | 为什么 |\n|---|---|---|\n| `200 岛屿数量` | 可以永久把陆地改成水或已访问 | 一座岛只需要统计一次，之后不再需要原状态 |\n| `79 单词搜索` | 进入时临时标记，退出时恢复 | 当前路径不能重复用格子，但其他路径仍可能用 |\n\n一句话区分：统计连通块可以永久染色，搜索具体路径通常要回溯恢复。\n\n## 5. 抽象代码模板\n\n下面模板按图的形态组织：网格图、依赖有向图、前缀字符图。重点是先翻译节点和边，再选择 DFS、BFS、拓扑或 Trie。\n\n### 5.1 网格 DFS 连通块模板\n\n#### 适用题型\n\n- 岛屿数量 / 连通块数量。\n- 岛屿最大面积。\n- 区域染色 / 图像渲染。\n\n#### 核心思路\n\n同一类网格 DFS 应该先抽出共同的 flood fill 骨架：入口判断、永久染色、四方向递归。岛屿数量、最大面积、区域染色的差别很小，主要是外层结算方式和目标/标记值不同。\n\n关键不变量：\n\n- 访问过的格子要永久标记，不能回溯恢复。\n- DFS 入口统一处理越界和目标值判断。\n- 数量题在入口计数，面积题让 DFS 返回格子数，染色题把颜色作为参数。\n\n#### 代码模板：共同骨架\n\n> **题目简述：** 本模板用于：岛屿数量 / 连通块数量。；岛屿最大面积。；区域染色 / 图像渲染。 [力扣原题 ↗](https://leetcode.cn/problems/number-of-islands/)\n\n```python\ndef gridDfs(grid, r, c, targetValue, markValue):\n    m = len(grid)\n    n = len(grid[0])\n    if r \u003c 0 or r >= m or c \u003c 0 or c >= n or grid[r][c] != targetValue:\n        return 0\n\n    grid[r][c] = markValue  # 永久染色，避免同一连通块被重复访问。\n    area = 1\n    area += gridDfs(grid, r + 1, c, targetValue, markValue)\n    area += gridDfs(grid, r - 1, c, targetValue, markValue)\n    area += gridDfs(grid, r, c + 1, targetValue, markValue)\n    area += gridDfs(grid, r, c - 1, targetValue, markValue)\n    return area\n```\n\n#### 变形点对照\n\n| 题型 | 改哪里 | 代码差异 |\n|---|---|---|\n| 岛屿数量 | 外层结算 | 发现 `1` 时 `ans += 1`，然后 `gridDfs(grid, r, c, 1, 0)` |\n| 岛屿最大面积 | 外层结算 | `ans = max(ans, gridDfs(grid, r, c, 1, 0))` |\n| 区域染色 | 入口和标记值 | 从 `(sr, sc)` 开始，`targetValue = oldColor`，`markValue = newColor` |\n| 字符网格 | 值类型 | 把 `1/0` 换成 `'1'/'0'`，骨架不变 |\n\n区域染色的新旧颜色相同会让“染色即标记”失效，需要提前返回：\n\n```python\noldColor = image[sr][sc]\nif oldColor != newColor:\n    gridDfs(image, sr, sc, oldColor, newColor)\n```\n\n#### 易错点\n\n- 没有永久染色，导致同一连通块重复统计。\n- 面积题仍只写 `ans += 1`，没有使用 DFS 返回的面积。\n- 区域染色没判断新旧颜色相等。\n- 把回溯恢复逻辑写进连通块题，导致 visited 失效。\n\n### 5.2 网格多源 BFS 扩散模板\n\n#### 适用题型\n\n- 腐烂橘子。\n- 01 矩阵距离、地图最近设施距离。\n- 最短桥等“先构造源点集合，再向外扩散”的题。\n\n#### 核心思路\n\n多源 BFS 的核心是：所有源点同时作为第 0 层入队，随后一层一层向外扩散。腐烂橘子和 01 矩阵距离只在源点定义、入队标记和答案记录上不同；最短桥多了“先用 DFS 找第一座岛并作为源点”的预处理阶段，BFS 骨架仍然相同。\n\n#### 代码模板：共同骨架\n\n> **题目简述：** 本模板用于：腐烂橘子。；01 矩阵距离、地图最近设施距离。；最短桥等“先构造源点集合，再向外扩散”的题。 [994 原题 ↗](https://leetcode.cn/problems/rotting-oranges/) · [542 原题 ↗](https://leetcode.cn/problems/01-matrix/)\n\n```python\nfrom collections import deque\n\ndef multiSourceBfsGrid(grid):\n    m = len(grid)\n    n = len(grid[0])\n    dirs = [[0, 1], [0, -1], [1, 0], [-1, 0]]\n    q = deque()\n    fresh = 0\n\n    for r in range(m):\n        for c in range(n):\n            if grid[r][c] == 2:\n                q.append((r, c))  # 多源种子：所有 2 都是第 0 层源点。\n            elif grid[r][c] == 1:\n                fresh += 1\n\n    step = 0\n    while q and fresh > 0:\n        size = len(q)\n        for _ in range(size):\n            r, c = q.popleft()\n\n            for dr, dc in dirs:\n                nr = r + dr\n                nc = c + dc\n                if nr \u003c 0 or nr >= m or nc \u003c 0 or nc >= n or grid[nr][nc] != 1:\n                    continue\n                grid[nr][nc] = 2  # 入队即标记，避免同一格子被重复感染。\n                fresh -= 1\n                q.append((nr, nc))\n        step += 1\n\n    return step if fresh == 0 else -1\n```\n\n#### 变形点对照\n\n| 题型 | 源点初始化 | 邻居进入条件 | 入队时写什么 | 返回什么 |\n|---|---|---|---|---|\n| 腐烂橘子 | 所有 `2` 入队 | `grid[nr][nc] == 1` | `grid[nr][nc] = 2`，`fresh -= 1` | 分钟数或 `-1` |\n| 01 矩阵距离 | 所有 `0` 入队，`dist = 0` | `dist[nr][nc] == -1` | `dist[nr][nc] = dist[r][c] + 1` | 距离矩阵 |\n| 最短桥 | 先 DFS 标记第一座岛并全部入队 | 未访问的水或第二座岛 | 水改成已访问；遇到第二座岛返回 | 翻转的水格数 |\n\n最短桥是在 BFS 前增加“构造源点集合”的阶段：\n\n```python\n# 预处理变形：先 DFS 找到第一座岛，把它的所有格子标记为 2 并入队。\n# 之后沿用多源 BFS；BFS 第一次遇到仍为 1 的格子，就是第二座岛。\nif grid[nr][nc] == 1:\n    return step\n```\n\n#### 易错点\n\n- 多源题只放一个源点，导致层数偏大。\n- 入队时不标记，导致同一格子被重复入队。\n- 腐烂橘子按层加分钟，不能按节点加分钟。\n- 最短桥忘记先把第一座岛整座入队，导致 BFS 源点不完整。\n\n### 5.3 拓扑排序 BFS 模板\n\n#### 适用题型\n\n- 课程表。\n- 任务依赖调度。\n- 有向图判环、输出一种可行拓扑序。\n\n#### 核心思路\n\n拓扑排序把有向图中入度为 0 的节点作为“当前可执行节点”。弹出一个节点相当于删除它和它的出边，后继节点入度随之减少。如果最终弹出的节点数少于总数，剩余节点一定被环卡住。\n\n#### 代码模板\n\n> **题目简述：** 本模板用于：课程表。；任务依赖调度。；有向图判环、输出一种可行拓扑序。 [力扣原题 ↗](https://leetcode.cn/problems/course-schedule/)\n\n```python\nfrom collections import deque\n\ndef topoOrder(n, prerequisites):\n    edges = [[] for _ in range(n)]\n    indeg = [0] * n\n\n    for course, pre in prerequisites:\n        edges[pre].append(course)  # pre -> course。\n        indeg[course] += 1\n\n    q = deque()\n    for i in range(n):\n        if indeg[i] == 0:\n            q.append(i)\n\n    order = []\n    while q:\n        u = q.popleft()\n        order.append(u)\n\n        for v in edges[u]:\n            indeg[v] -= 1\n            if indeg[v] == 0:\n                q.append(v)\n\n    if len(order) != n:\n        return []  # 有环，无法得到完整拓扑序。\n    return order\n```\n\n#### 易错点\n\n- `[a, b]` 的方向翻译错，正确是 `b: a`。\n- 只判断队列是否为空；拓扑结束时队列总为空，要看弹出数量。\n- 入度数组没有和邻接表方向保持一致。\n\n### 5.4 有向图 DFS 三色判环模板\n\n#### 适用题型\n\n- 课程表 DFS 写法。\n- 依赖关系是否存在环。\n- 安全节点类问题。\n\n#### 核心思路\n\nDFS 三色法关注“当前递归路径”。`0` 表示未访问，`1` 表示正在当前路径中，`2` 表示已经处理完并确认安全。遇到 `1` 就是环；遇到 `2` 可以直接复用结果。\n\n#### 代码模板\n\n代码 A：课程表判环\n\n> **题目简述：** 本模板用于：课程表 DFS 写法。；依赖关系是否存在环。；安全节点类问题。 [力扣原题 ↗](https://leetcode.cn/problems/course-schedule/)\n\n```python\nclass DirectedGraphCycleTemplate:\n    def __init__(self):\n        self.edges = []\n        self.state = []  # 0 未访问，1 当前路径中，2 已完成。\n\n    def dfs(self, u):\n        # 返回值语义：从 u 出发是否不存在环。\n        if self.state[u] == 1:\n            return False\n        if self.state[u] == 2:\n            return True\n\n        self.state[u] = 1  # 进入当前递归路径。\n        for v in self.edges[u]:\n            if not self.dfs(v):\n                return False\n        self.state[u] = 2  # 离开递归路径，所有后继安全。\n        return True\n\n    def canFinishByDfs(self, n, prerequisites):\n        self.edges = [[] for _ in range(n)]\n        self.state = [0] * n\n\n        for course, pre in prerequisites:\n            self.edges[pre].append(course)\n\n        for i in range(n):\n            if self.state[i] == 0 and not self.dfs(i):\n                return False\n        return True\n```\n\n代码 B：最终安全节点变形\n\n> **题目简述：** 本模板用于：课程表 DFS 写法。；依赖关系是否存在环。；安全节点类问题。 [力扣原题 ↗](https://leetcode.cn/problems/course-schedule/)\n\n```python\nclass EventualSafeNodesTemplate:\n    def __init__(self):\n        self.state = []  # 0 未访问，1 当前路径中，2 已确认安全。\n\n    def dfs(self, u, graph):\n        if self.state[u] == 1:\n            return False  # 回到当前路径，说明能进入环，不安全。\n        if self.state[u] == 2:\n            return True\n\n        self.state[u] = 1\n        for v in graph[u]:\n            if not self.dfs(v, graph):\n                return False\n        self.state[u] = 2\n        return True\n\n    def eventualSafeNodes(self, graph):\n        n = len(graph)\n        self.state = [0] * n\n        ans = []\n\n        for i in range(n):\n            if self.dfs(i, graph):\n                ans.append(i)  # 只收集 dfs(i) 为 true 的点。\n        return ans\n```\n\n#### 易错点\n\n- 用布尔 visited 无法区分“当前路径中”和“已经安全”。\n- 退出节点时忘记设为 `2`，把安全节点误判为环。\n- 发现环后继续递归，导致状态语义混乱。\n\n### 5.5 Trie 前缀树模板\n\n#### 适用题型\n\n- 实现 Trie。\n- 单词插入、完整单词查询、前缀查询。\n- 字符路径图设计题。\n\n#### 核心思路\n\nTrie 可以看作字符图：每个节点表示一个前缀状态，每条边表示追加一个字符。`insert`、`search`、`startsWith` 的遍历过程类似，区别在结束判断：完整单词必须 `isEnd == true`，前缀只要路径存在即可。\n\n#### 代码模板\n\n> **题目简述：** 本模板用于：实现 Trie。；单词插入、完整单词查询、前缀查询。；字符路径图设计题。 [力扣原题 ↗](https://leetcode.cn/problems/implement-trie-prefix-tree/)\n\n```python\nclass TrieNode:\n    def __init__(self):\n        self.children = [None] * 26\n        self.isEnd = False\n\nclass Trie:\n    def __init__(self):\n        self.root = TrieNode()\n\n    def insert(self, word):\n        node = self.root\n        for c in word:\n            index = ord(c) - ord('a')\n            if node.children[index] is None:\n                node.children[index] = TrieNode()\n            node = node.children[index]\n        node.isEnd = True\n\n    def search(self, word):\n        node = self.root\n        for c in word:\n            index = ord(c) - ord('a')\n            if node.children[index] is None:\n                return False\n            node = node.children[index]\n        return node.isEnd\n\n    def startsWith(self, prefix):\n        node = self.root\n        for c in prefix:\n            index = ord(c) - ord('a')\n            if node.children[index] is None:\n                return False\n            node = node.children[index]\n        return True\n```\n\n#### 易错点\n\n- 把前缀存在误认为完整单词存在。\n- 插入时忘记在最后节点设置 `isEnd`。\n- 字符集不止小写字母时仍硬编码 26 个孩子，需要改成哈希表。\n\n### 5.6 网格路径回溯模板\n\n#### 适用题型\n\n- 单词搜索。\n- 棋盘或矩阵路径搜索。\n- 当前路径不能重复使用节点，但其他路径仍可使用节点的题。\n\n#### 核心思路\n\n路径搜索中的访问标记只属于当前路径。进入格子时临时标记，递归探索四个方向，成功提前返回前也要恢复；如果四个方向都失败，退出前同样恢复现场。\n\n#### 代码模板\n\n> **题目简述：** 本模板用于：单词搜索。；棋盘或矩阵路径搜索。；当前路径不能重复使用节点，但其他路径仍可使用节点的题。 [力扣原题 ↗](https://leetcode.cn/problems/word-search/)\n\n```python\nclass GridPathBacktrackingTemplate:\n    def __init__(self):\n        self.dirs = [[0, 1], [0, -1], [1, 0], [-1, 0]]\n\n    def dfs(self, board, word, r, c, k):\n        # 返回值语义：从 (r,c) 出发是否能匹配 word[k...]。\n        m = len(board)\n        n = len(board[0])\n        if r \u003c 0 or r >= m or c \u003c 0 or c >= n or board[r][c] != word[k]:\n            return False\n        if k == len(word) - 1:\n            return True\n\n        old = board[r][c]\n        board[r][c] = '#'  # 做选择：当前路径占用该格子。\n\n        for dr, dc in self.dirs:\n            if self.dfs(board, word, r + dr, c + dc, k + 1):\n                board[r][c] = old\n                return True\n\n        board[r][c] = old  # 恢复现场。\n        return False\n\n    def exist(self, board, word):\n        if not board or not board[0]:\n            return False\n        for r in range(len(board)):\n            for c in range(len(board[0])):\n                if self.dfs(board, word, r, c, 0):\n                    return True\n        return False\n```\n\n#### 易错点\n\n- 把路径题当连通块题永久染色。\n- 提前成功返回前没有恢复原字符。\n- 没有用 `k` 明确表示当前匹配进度，导致递归层级混乱。\n\n## 6. 高频易错点清单\n\n| 易错点 | 典型题目 | 规避方式 |\n|---|---|---|\n| 没先翻译清楚点和边 | `207`、`208` | 先写一句“节点是什么，边是什么” |\n| 网格 DFS 忘记边界判断 | `200`、`79` | 递归入口第一行写越界和目标值判断 |\n| 访问标记时机错误 | `200`、`994` | DFS 进入时标记，BFS 入队时标记 |\n| 把路径回溯写成永久染色 | `79` | 路径搜索失败后必须恢复现场 |\n| 多源 BFS 只放了一个起点 | `994` | 初始化时把所有源点全部入队 |\n| BFS 分钟数加错 | `994` | 每处理完一层才加一分钟 |\n| 没统计剩余新鲜橘子 | `994` | 用 `fresh` 判断是否存在无法到达的死角 |\n| 课程表建图方向反了 | `207` | `[a, b]` 表示 `b: a`，学完 b 才能学 a |\n| 拓扑排序只看队列是否为空 | `207` | 必须比较 `visitedCount == numCourses` |\n| DFS 染色忘记从 1 改成 2 | `207` | 当前路径退出前标记为已完成 |\n| Trie 把前缀当完整单词 | `208` | `search` 必须检查 `isEnd`，`startsWith` 不需要 |\n| Trie 根节点没初始化 | `208` | 构造函数或成员变量中创建 `root` |\n\n## 7. 最短复盘口诀\n\n图论题先翻译点和边。网格题用方向数组，连通块用 DFS 吃掉整块，最短时间用 BFS 按层扩散，多源题先把所有源点入队。有向依赖题先建邻接表和入度，拓扑排序看能否访问全部节点，DFS 染色看是否遇到当前路径。Trie 本质是字符路径图，`isEnd` 决定完整单词，不决定前缀是否存在。统计类可以永久标记，路径类必须回溯恢复。\n\n\n\n================================================================================\n\n# 第8部分: 回溯\n\n================================================================================\n\n> 目标：本文把 Hot100 回溯题抽象成“选择列表、路径状态、剪枝条件、撤销现场”的模板。复习时先判断是在枚举组合、排列、切分、棋盘还是网格路径，再套对应搜索树。\n\n## 1. 回溯题的底层模型\n\n回溯题的本质是遍历一棵搜索树。每个节点代表当前已经做出的选择，每条边代表再做一个选择。每道回溯题先问五个问题：\n\n| 问题 | 如果答案是“是” | 常用处理 |\n|---|---|---|\n| 选择是否有顺序 | 全排列、电话号码 | 用 `used` 或按位置推进 |\n| 选择是否不能重复 | 组合、子集、分割 | 用 `start` 保证只向后选 |\n| 一个元素能否重复使用 | 组合总和 | 递归时传 `i`，允许本元素重复选择 |\n| 是否需要路径合法性剪枝 | 括号、N 皇后、单词搜索 | 进入下一层前先判断约束 |\n| 状态是否要恢复 | 棋盘、网格、路径数组 | 进入修改，退出撤销 |\n\n回溯模板最关键的四个位置：\n\n| 位置 | 作用 | 典型代码 |\n|---|---|---|\n| 终止条件 | 决定什么时候收集答案 | `if len(path) == n` |\n| 选择循环 | 枚举当前层可以选什么 | `for i in range(start, n)` |\n| 做选择 | 修改路径和状态 | `path.append(x)`、`used[i] = true` |\n| 撤销选择 | 恢复给兄弟分支 | `path.pop()`、`used[i] = false` |\n\n## 2. Hot100 回溯题型地图\n\n回溯专题覆盖 8 道典型题。`22` 和 `131` 可兼顾动态规划属性，`79` 可兼顾矩阵 DFS；这里统一按回溯搜索树理解。\n\n| 题型 | 题目 | 抽象能力 | 一句话记忆 |\n|---|---|---|---|\n| 固定映射展开 | `17 电话号码的字母组合` | 每一层对应一个字符位置 | 第 k 层从 digits[k] 的映射字符里选 |\n| 合法序列生成 | `22 括号生成` | 搜索中维护合法约束 | 左括号不超过 n，右括号不超过左括号 |\n| 组合枚举 | `39 组合总和` | `start` 控制去重和复用 | 可重复就递归传 `i`，不可重复传 `i + 1` |\n| 排列枚举 | `46 全排列` | `used` 控制每个元素只用一次 | 每层都从 0 扫，靠 used 避免重复 |\n| 子集枚举 | `78 子集` | 每个节点都是一个答案 | 先收集当前路径，再继续向后选 |\n| 棋盘约束 | `51 N 皇后` | 行推进、列和对角线剪枝 | 一行放一个皇后，三组集合判冲突 |\n| 网格路径 | `79 单词搜索` | 临时访问标记和恢复现场 | 路径题不能永久染色 |\n| 回文切分 | `131 分割回文串` | 枚举切点，回文剪枝 | 只在子串是回文时切一刀 |\n\n## 3. 复习顺序建议\n\n建议按“纯枚举 → 带约束 → 带恢复 → 预处理剪枝”的顺序复习：\n\n1. `78 子集`：理解每个搜索节点都可以成为答案。\n2. `46 全排列`：掌握 `used` 数组和撤销选择。\n3. `39 组合总和`：理解 `start` 的去重语义和可重复选择。\n4. `17 电话号码`：练按位置推进的多叉搜索。\n5. `22 括号生成`：练合法性剪枝。\n6. `79 单词搜索`：练网格路径的临时标记和恢复。\n7. `131 分割回文串`：练切点枚举和回文预处理。\n8. `51 N 皇后`：综合行推进、集合剪枝和棋盘构造。\n\n## 4. 关键套路详解\n\n### 4.1 `start` 和 `used` 解决的是不同问题\n\n组合和子集不关心顺序，`[1, 2]` 和 `[2, 1]` 是同一个选择，所以用 `start` 限制后续只能选当前位置之后的元素。\n\n排列关心顺序，`[1, 2]` 和 `[2, 1]` 是不同答案，所以每层都可以从头枚举，但必须用 `used` 防止同一个元素在同一路径里重复出现。\n\n| 模型 | 是否关心顺序 | 控制方式 |\n|---|---|---|\n| 子集、组合 | 不关心 | `start` 向后推进 |\n| 全排列 | 关心 | `used[i]` 标记路径内已使用 |\n| 组合总和可重复 | 不关心但可复用 | 选中 `i` 后下一层仍从 `i` 开始 |\n\n### 4.2 剪枝应该发生在递归之前\n\n回溯的效率来自尽早拒绝不可能分支。`22 括号生成` 中如果 `right > left`，当前前缀已经非法，后面再加字符也无法变合法。`51 N 皇后` 中如果列或对角线冲突，就不要放皇后，更不要递归。\n\n剪枝条件越靠近“做选择”之前，搜索树越小。\n\n### 4.3 路径状态必须对兄弟分支无副作用\n\n`path.append` 后必须 `path.pop()`。`used[i] = true` 后必须恢复成 false。`79 单词搜索` 中把格子改成 `#` 后，失败或提前成功返回前都要还原原字符。\n\n回溯代码最重要的对称性是：做选择和撤销选择必须成对出现。\n\n### 4.4 回文分割要把“判断回文”和“枚举切法”拆开\n\n`131 分割回文串` 如果每次递归都用双引用判断子串是否回文，会重复计算。更稳的方式是先用 DP 预处理 `isPalindrome[l][r]`，回溯时只负责枚举下一刀切在哪里。\n\n这类题的模式是：DP 负责合法性查询，回溯负责枚举方案。\n\n### 4.5 N 皇后不要每次扫描棋盘\n\nN 皇后每一行只放一个皇后，因此递归层数就是行号。冲突只需要三类信息：列、主对角线、副对角线。\n\n| 冲突类型 | 标识方式 |\n|---|---|\n| 同列 | `col` |\n| 主对角线 | `row - col` |\n| 副对角线 | `row + col` |\n\n用集合或布尔数组维护这三类占用，就不需要每次扫描棋盘。\n\n## 5. 抽象代码模板\n\n下面模板按搜索树形态组织。回溯代码重点看四个位置：终止条件、选择列表、做选择、撤销现场。\n\n### 5.1 子集与组合枚举模板\n\n#### 适用题型\n\n- 子集：每个搜索节点都是一个答案。\n- 组合总和：路径和达到目标时收集答案。\n- 从数组中选择若干元素且不关心顺序的题。\n\n#### 核心思路\n\n`start` 表示当前层只能从哪个下标开始选。组合和子集不关心顺序，递归向后推进可以避免 `[1,2]` 和 `[2,1]` 这种排列式重复。选择一个元素后立刻进入下一层，返回后撤销选择，保证兄弟分支看到的是同一个现场。\n\n#### 代码 A：子集\n\n> **题目简述：** 本模板用于：子集：每个搜索节点都是一个答案。；组合总和：路径和达到目标时收集答案。；从数组中选择若干元素且不关心顺序的题。 [78 原题 ↗](https://leetcode.cn/problems/subsets/) · [39 原题 ↗](https://leetcode.cn/problems/combination-sum/)\n\n```python\ndef subsetDfs(nums, start, path, ans):\n    # 当前 path 本身就是一个子集，所以先收集当前节点。\n    ans.append(path.copy())\n\n    for i in range(start, len(nums)):\n        # 做选择：把 nums[i] 加入当前路径。\n        path.append(nums[i])\n\n        # 下一层只能从 i + 1 开始，保证按下标递增选择，避免重复。\n        subsetDfs(nums, i + 1, path, ans)\n\n        # 恢复现场：移除刚才选择的数，让下一条兄弟分支重新尝试。\n        path.pop()\n```\n\n#### 代码 B：组合总和\n\n> **题目简述：** 39 组合总和：从互异正整数候选集中选数凑成目标值，每个数可重复使用，返回全部组合。 [力扣原题 ↗](https://leetcode.cn/problems/combination-sum/)\n\n```python\ndef combinationSumDfs(candidates, start, remain, path, ans):\n    if remain == 0:\n        ans.append(path.copy())\n        return\n\n    for i in range(start, len(candidates)):\n        if candidates[i] > remain:\n            continue  # 如果 candidates 已排序，可以改成 break。\n\n        path.append(candidates[i])\n\n        # 可重复使用当前元素，所以下一层仍从 i 开始；不可重复时应传 i + 1。\n        combinationSumDfs(candidates, i, remain - candidates[i], path, ans)\n\n        path.pop()\n```\n\n#### 易错点\n\n- 组合题每层从 0 开始枚举，写成排列题。\n- 可重复选择和不可重复选择混淆：可重复传 `i`，不可重复传 `i + 1`。\n- `path` 传值导致大量拷贝；应传引用并手动 push/pop。\n\n### 5.2 全排列模板\n\n#### 适用题型\n\n- 全排列。\n- 每个元素只能使用一次，但不同顺序代表不同答案的题。\n\n#### 核心思路\n\n排列关心顺序，每一层都可以从 0 到 `n - 1` 枚举候选。`used[i]` 表示 `nums[i]` 是否已出现在当前路径中。做选择时同时修改 `used` 和 `path`，撤销时必须按相反顺序恢复。\n\n#### 代码模板\n\n> **题目简述：** 本模板用于：全排列。；每个元素只能使用一次，但不同顺序代表不同答案的题。 [力扣原题 ↗](https://leetcode.cn/problems/permutations/)\n\n```python\ndef permutationDfs(nums, used, path, ans):\n    if len(path) == len(nums):\n        ans.append(path.copy())\n        return\n\n    for i in range(len(nums)):\n        if used[i]:\n            continue  # 当前路径已经使用过 nums[i]，不能重复使用。\n\n        used[i] = True\n        path.append(nums[i])\n\n        permutationDfs(nums, used, path, ans)\n\n        # 恢复现场：path 和 used 必须同时恢复，避免污染兄弟分支。\n        path.pop()\n        used[i] = False\n```\n\n#### 易错点\n\n- 忘记恢复 `used[i] = false`，导致后续分支少选元素。\n- 把排列题误用 `start`，会漏掉不同顺序的答案。\n- 含重复元素时只排序不做同层去重，仍会产生重复排列。\n\n### 5.3 按位置展开字符串模板\n\n#### 适用题型\n\n- 电话号码的字母组合。\n- 每一层候选由当前位置决定的字符串生成题。\n\n#### 核心思路\n\n`index` 表示当前处理输入的第几个字符。与组合题不同，候选集合由 `digits[index]` 映射出来。每一层必须推进到 `index + 1`，直到处理完所有位置。\n\n#### 代码模板\n\n> **题目简述：** 本模板用于：电话号码的字母组合。；每一层候选由当前位置决定的字符串生成题。 [力扣原题 ↗](https://leetcode.cn/problems/letter-combinations-of-a-phone-number/)\n\n```python\nclass PhoneLetterCombinationsTemplate:\n    def __init__(self):\n        self.letterMap = [\n            '',      # 0\n            '',      # 1\n            'abc',   # 2\n            'def',   # 3\n            'ghi',   # 4\n            'jkl',   # 5\n            'mno',   # 6\n            'pqrs',  # 7\n            'tuv',   # 8\n            'wxyz',  # 9\n        ]\n        self.result = []\n        self.path = []\n\n    def backtracking(self, digits, index):\n        if index == len(digits):\n            self.result.append(''.join(self.path))\n            return\n\n        digit = ord(digits[index]) - ord('0')\n        letters = self.letterMap[digit]\n        for ch in letters:\n            self.path.append(ch)\n            self.backtracking(digits, index + 1)\n            self.path.pop()\n\n    def letterCombinations(self, digits):\n        self.result = []\n        self.path = []\n        if not digits:\n            return self.result\n        self.backtracking(digits, 0)\n        return self.result\n```\n\n#### 易错点\n\n- 空输入没有特殊处理，可能返回包含空串的答案；实际题目通常空输入返回空数组。\n- `index` 不推进导致无限递归。\n- 把映射字符串拷贝到局部变量问题不大，但可用引用减少拷贝。\n\n### 5.4 合法序列生成模板\n\n#### 适用题型\n\n- 括号生成。\n- 需要在构造过程中保持前缀合法的序列题。\n\n#### 核心思路\n\n回溯不一定要等完整序列才判断合法。括号生成的核心不变量是：任意前缀中右括号数量不能超过左括号数量，左括号数量不能超过 `n`。剪枝发生在递归之前，搜索树会小很多。\n\n#### 代码模板\n\n> **题目简述：** 本模板用于：括号生成。；需要在构造过程中保持前缀合法的序列题。 [力扣原题 ↗](https://leetcode.cn/problems/generate-parentheses/)\n\n```python\ndef generateParenthesisDfs(n, leftUsed, rightUsed, path, ans):\n    if len(path) == 2 * n:\n        ans.append(''.join(path))\n        return\n\n    if leftUsed \u003c n:\n        path.append('(')\n        generateParenthesisDfs(n, leftUsed + 1, rightUsed, path, ans)\n        path.pop()\n\n    if rightUsed \u003c leftUsed:\n        # 只有右括号数量少于左括号数量时，才能添加右括号保持前缀合法。\n        path.append(')')\n        generateParenthesisDfs(n, leftUsed, rightUsed + 1, path, ans)\n        path.pop()\n```\n\n#### 易错点\n\n- 只检查最终左右括号数量，不检查前缀合法性。\n- 右括号条件写成 `rightUsed \u003c n`，会生成非法前缀。\n- 做选择后忘记撤销，导致字符串路径串在一起。\n\n### 5.5 网格路径回溯模板\n\n#### 适用题型\n\n- 单词搜索。\n- 棋盘或矩阵中寻找一条满足条件的路径。\n- 当前路径不能重复使用同一格，但其他路径仍可使用的题。\n\n#### 核心思路\n\n网格路径题的访问标记只属于当前路径。进入格子时临时标记，递归探索邻居；无论失败还是提前成功返回，都必须恢复原字符，避免污染其他方向、其他起点。\n\n#### 代码模板\n\n> **题目简述：** 本模板用于：单词搜索。；棋盘或矩阵中寻找一条满足条件的路径。；当前路径不能重复使用同一格，但其他路径仍可使用的题。 [力扣原题 ↗](https://leetcode.cn/problems/word-search/)\n\n```python\nclass GridPathBacktrackingTemplate:\n    def __init__(self):\n        self.dirs = [[0, 1], [0, -1], [1, 0], [-1, 0]]\n\n    def dfs(self, board, word, r, c, index):\n        # 返回值语义：从 (r,c) 出发是否能匹配 word[index...]。\n        m = len(board)\n        n = len(board[0])\n        if r \u003c 0 or r >= m or c \u003c 0 or c >= n or board[r][c] != word[index]:\n            return False\n        if index == len(word) - 1:\n            return True\n\n        original = board[r][c]\n        board[r][c] = '#'  # 做选择：当前路径占用该格子。\n\n        for dr, dc in self.dirs:\n            if self.dfs(board, word, r + dr, c + dc, index + 1):\n                board[r][c] = original  # 提前返回前也要恢复现场。\n                return True\n\n        board[r][c] = original  # 撤销选择，恢复给兄弟分支和其他起点。\n        return False\n\n    def exist(self, board, word):\n        if not board or not board[0]:\n            return False\n        for r in range(len(board)):\n            for c in range(len(board[0])):\n                if self.dfs(board, word, r, c, 0):\n                    return True\n        return False\n```\n\n#### 易错点\n\n- 把单词搜索写成永久染色，导致后续路径不能复用格子。\n- 成功提前返回前忘记恢复现场。\n- `index == len(word) - 1` 的终止条件放在字符匹配之前，可能越界或误判。\n\n### 5.6 回文切分模板\n\n#### 适用题型\n\n- 分割回文串。\n- 枚举字符串所有合法切分方案。\n- 合法性查询可以预处理的切分题。\n\n#### 核心思路\n\n回文切分由一个回溯骨架加一个合法性查询优化组成。共同主线是：`index` 表示下一刀起点，枚举 `end`，如果 `s[index..end]` 合法，就选择这一段并递归到 `end + 1`。\n\n#### 代码模板：共同骨架\n\n> **题目简述：** 本模板用于：分割回文串。；枚举字符串所有合法切分方案。；合法性查询可以预处理的切分题。 [力扣原题 ↗](https://leetcode.cn/problems/palindrome-partitioning/)\n\n```python\ndef palindromePartitionDfs(s, index, isPalindrome, path, ans):\n    if index == len(s):\n        ans.append(path.copy())\n        return\n\n    for end in range(index, len(s)):\n        if not isPalindrome[index][end]:\n            continue  # 变形点：合法性查询由预处理表 O(1) 提供。\n\n        path.append(s[index:end + 1])\n        palindromePartitionDfs(s, end + 1, isPalindrome, path, ans)\n        path.pop()\n```\n\n回文表是同一模板的“合法性查询加速器”：\n\n> **题目简述：** 本模板用于：分割回文串。；枚举字符串所有合法切分方案。；合法性查询可以预处理的切分题。 [力扣原题 ↗](https://leetcode.cn/problems/palindrome-partitioning/)\n\n```python\ndef buildPalindromeTable(s):\n    n = len(s)\n    is_palindrome = [[False] * n for _ in range(n)]\n    for length in range(1, n + 1):\n        for left in range(0, n - length + 1):\n            right = left + length - 1\n            is_palindrome[left][right] = (\n                s[left] == s[right]\n                and (length \u003c= 2 or is_palindrome[left + 1][right - 1])\n            )\n    return is_palindrome\n```\n\n#### 变形点对照\n\n| 部分 | 在共同骨架中的作用 | 代码差异 |\n|---|---|---|\n| 普通回溯切分 | 枚举下一刀 `end` | `path.append` 后递归 `end + 1` |\n| 回文判断 | 决定当前段能否选择 | 用 `isPalindrome[index][end]` 替代每次双引用扫描 |\n| wrapper | 初始化共享状态 | 先建回文表，再初始化 `path/ans` 调 DFS |\n\n```python\ndef buildPalindromeTable(s):\n    n = len(s)\n    is_palindrome = [[False] * n for _ in range(n)]\n    for length in range(1, n + 1):\n        for left in range(0, n - length + 1):\n            right = left + length - 1\n            is_palindrome[left][right] = (\n                s[left] == s[right]\n                and (length \u003c= 2 or is_palindrome[left + 1][right - 1])\n            )\n    return is_palindrome\n\n\ndef partitionTemplate(s):\n    is_palindrome = buildPalindromeTable(s)\n    ans = []\n    path = []\n\n    def dfs(start):\n        if start == len(s):\n            ans.append(path.copy())\n            return\n        for end in range(start, len(s)):\n            if is_palindrome[start][end]:\n                path.append(s[start:end + 1])\n                dfs(end + 1)\n                path.pop()\n\n    dfs(0)\n    return ans\n```\n\n#### 易错点\n\n- 每次递归都双引用判断回文，重复计算多。\n- 收集答案时没有保证 `index == len(s)`，导致未切完整字符串。\n- 撤销时忘记 `path.pop()`。\n- 回文表区间长度遍历顺序错误，导致 `isPalindrome[left + 1][right - 1]` 尚未计算。\n\n### 5.7 N 皇后棋盘约束模板\n\n#### 适用题型\n\n- N 皇后。\n- 一行/一列只能选一个位置，并带对角线或其他冲突约束的棋盘题。\n\n#### 核心思路\n\n递归层数就是当前行号，每行放一个皇后。用三组布尔数组记录列、主对角线、副对角线占用，避免每次扫描棋盘。做选择时同时改棋盘和三组占用，返回后完全恢复。\n\n#### 代码模板\n\n> **题目简述：** 本模板用于：N 皇后。；一行/一列只能选一个位置，并带对角线或其他冲突约束的棋盘题。 [力扣原题 ↗](https://leetcode.cn/problems/n-queens/)\n\n```python\ndef nQueensDfs(n, row, board, col, diag1, diag2, ans):\n    if row == n:\n        ans.append(board.copy())\n        return\n\n    for c in range(n):\n        d1 = row - c + n - 1\n        d2 = row + c\n        if col[c] or diag1[d1] or diag2[d2]:\n
