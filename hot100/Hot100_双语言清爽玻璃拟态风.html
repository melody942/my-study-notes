ove + add` | 移到头部 |\n| `put` 插入新 key | `map[key] = node` | `add` | 插到头部 |\n| 超容量淘汰 | `del self.map[delnode.key]` | `remove(delnode)` | 删除尾前节点 |\n\n#### 易错点\n\n- `get` 命中后没有移动到头部，最近使用顺序失真。\n- `put` 更新已有 key 时只改 value，没有移动到头部。\n- 淘汰链表尾部节点后忘记从 `dict` 删除，导致哈希表保存已失效节点。\n- 淘汰节点时应先从 `dict` 删除对应 key，再断开链表节点；Python 无需手动释放节点。\n- 不用哑头哑尾，空链表、单节点链表特判过多且容易出现 `None` 处理错误。\n\n## 6. 高频易错点清单\n\n| 易错点 | 典型题目 | 规避方式 |\n|---|---|---|\n| 只用一个结构硬做所有操作 | `146`、`295` | 从复杂度拆职责，多个结构组合 |\n| 最小栈没有随每层保存当前最小值 | `155` | 原始写法用 `list[tuple[int, int]]`，`second` 存当前深度最小值 |\n| 最小栈忘记哨兵语义 | `155` | 构造函数压入 `(0, float(\"inf\"))`，真实元素在哨兵之上 |\n| Trie 把前缀当完整单词 | `208` | `search` 必须检查 `isEnd`，`startsWith` 只检查路径 |\n| Trie 根节点未初始化 | `208` | 构造函数或成员初始化中创建 root |\n| 双堆插入流程随意改 | `295` | 原始流程：先入左堆，再将左堆堆顶移入右堆；若右堆元素更多，再移回左堆 |\n|双堆左右顺序不满足|`295` | 左堆保存较小一半，右堆保存较大一半 |\n| 中位数整数溢出或整数除法 | `295` | Python 直接用两堆顶之和 `/ 2.0` 求平均，无需担心固定宽度整数溢出 |\n| LRU 命中后没移动到头部 | `146` | `get` 和更新型 `put` 都要 `remove + add` |\n| LRU 淘汰链表节点后没删哈希表 | `146` | 先 `del self.map[delnode.key]`，再断链；Python 无需手动释放节点 |\n| 双向链表没用哑头哑尾导致特判多 | `146` | 默认使用 dummy head/tail |\n\n## 7. 最短复盘口诀\n\n设计题先看接口复杂度，再拆数据结构职责。最小栈按原始笔记用 `(value, current_min)` 保存每层最小值，Trie 是 `children[26] + isEnd`，数据流中位数按“先进左堆、移到右堆、再平衡”的双堆流程，LRU 是哈希表加手写双向链表。多个结构存同一份状态时，每个接口都要同步维护不变量。\n\n================================================================================\n\n# 第20部分: 分治\n\n================================================================================\n\n> 目标：本文把 Hot100 中“拆成子问题、分别求解、再合并结果”的题目抽象成若干可复用模板。复习时先定义子问题区间，再明确递归返回值和跨区间合并方式。\n\n## 1. 分治题的底层模型\n\n分治的本质是把一个大问题拆成若干结构相同的小问题。每道分治题先问五个问题：\n\n| 问题 | 如果答案是“是” | 常用处理 |\n|---|---|---|\n| 子问题是否仍是同类问题 | 排序链表、最大子数组、建树 | 递归处理左右区间 |\n| 合并是否简单 | 合并 K 个链表、有序数组转 BST | 两两合并、取中点构造 |\n| 合并是否需要跨边界信息 | 最大子数组和 | 返回前缀、后缀、总和、最佳值 |\n| 是否只需要其中一边 | 第 K 大、二分分割 | 快速选择、二分短数组 |\n| 是否能排除一个区域 | 搜索二维矩阵 II | 按单调性缩小候选区域 |\n\n分治题的递归函数一定要先定义语义：\n\n| 递归语义 | 返回值含义 | 代表题 |\n|---|---|---|\n| 区间构造 | 用 `[l, r]` 或 `[l, r)` 构造答案结构 | `108`、`105` |\n| 区间统计 | 返回当前区间的统计信息 | `53` |\n| 区间排序 | 返回当前区间排好序后的结构 | `148`、`23` |\n| 区间选择 | 返回当前区间目标秩元素 | `215` |\n| 区间排除 | 根据中点关系排除一半 | `4`、`240` |\n\n## 2. Hot100 分治题型地图\n\n\n| 题型 | 题目 | 抽象能力 | 一句话记忆 |\n|---|---|---|---|\n| 双数组第 K 小 | `4 寻找两个正序数组的中位数` | 每次丢弃不可能包含答案的一段 | 中位数可以转化为第 K 小 |\n| 两两归并 | `23 合并 K 个升序链表` | 把 K 路问题拆成两个半区 | K 个链表两两合并，像归并排序 |\n| 跨区间合并 | `53 最大子数组和` | 合并左右区间的前缀、后缀和最佳值 | 最大子数组要么在左，要么在右，要么跨中点 |\n| 区间建树 | `105 前序中序构造树` | 根切分左右子树区间 | 前序定根，中序定规模 |\n| 中点构造 | `108 有序数组转 BST` | 取中点保持平衡 | 中点做根，左右递归 |\n| 链表归并排序 | `148 排序链表` | 快慢引用拆分，两段排序后合并 | 链表排序的分治核心是断链和 merge |\n| 多数元素分治 | `169 多数元素` | 左右候选合并 | 左右候选相同直接返回，不同则计数比较 |\n| 快速选择 | `215 数组第 K 大` | partition 后只递归一边 | 只找目标秩，不完整排序 |\n| 矩阵分治搜索 | `240 搜索二维矩阵 II` | 根据单调性排除区域 | 也可用右上角阶梯搜索替代 |\n| 频次 Top K 快选 | `347 前 K 高频元素` | 在频次数组上选择前 K | 先统计频次，再分治选择 |\n\n## 3. 复习顺序建议\n\n建议按“区间递归 → 归并 → 选择 → 结构构造 → 复杂合并”的顺序复习：\n\n1. `108 有序数组转 BST`：最简单的中点分治构造。\n2. `105 前序中序构造树`：练区间边界和规模计算。\n3. `23 合并 K 个升序链表`：练两两归并。\n4. `148 排序链表`：练拆分、断链、合并完整流程。\n5. `53 最大子数组和`：理解跨区间信息合并。\n6. `169 多数元素`：理解候选合并，顺便对比摩尔投票。\n7. `215 数组第 K 大`：掌握 partition 后只保留一边。\n8. `347 前 K 高频元素`：把快选用在频次对象上。\n9. `240 搜索二维矩阵 II`：理解二维候选区域排除。\n10. `4 两个正序数组中位数`：最后练双数组第 K 小或分割线二分。\n\n## 4. 关键套路详解\n\n### 4.1 分治先写递归语义，不先写代码\n\n分治题最常见的错误是递归函数边界写出来了，但不知道返回值代表什么。写代码前先补全这句话：\n\n```text\nsolve(l, r) 返回区间 ______ 的 ______。\n```\n\n`108` 返回 `[l, r)` 构造出的 BST 根节点；`53` 返回当前区间的总和、最大前缀、最大后缀、最大子数组和；`148` 返回当前链表排序后的头结点。\n\n### 4.2 区间边界要全程统一\n\n数组分治建议使用左闭右开 `[l, r)`，空区间是 `l >= r`，单元素区间是 `r - l == 1`。树构造题有时用闭区间更贴近题解，但同一个函数内必须统一。\n\n`105` 的关键是 `leftSize = rootIndex - inLeft`。只要左子树规模算对，前序和中序的左右区间就能全部推出来。\n\n### 4.3 归并类题的合并函数是核心组件\n\n`23`、`148` 都可以复用“合并两个有序链表”。`23` 是把 K 个链表分治成左右两组，分别合并后再 merge。`148` 是先把一条链表拆成两条短链表，分别排序后再 merge。\n\n归并题的复杂度通常来自每层合并 O(n)，层数 O(log k) 或 O(log n)。\n\n### 4.4 跨区间答案必须携带足够信息\n\n`53 最大子数组和`如果只返回当前区间最大子数组和，合并时无法处理“跨过中点”的答案。所以每个区间至少返回四个量：区间总和、最大前缀和、最大后缀和、最大子数组和。\n\n跨中点答案等于左区间最大后缀加右区间最大前缀。\n\n### 4.5 快速选择只递归目标所在半边\n\n`215` 和 `347` 的分治点是 partition。pivot 落定后，左边都不大于它，右边都不小于它。目标秩如果在左边，只处理左边；在右边，只处理右边。平均 O(n) 的关键就是每层只走一边。\n\n第 K 大要换算成升序下标 `n - k`，这是最常见的错误点。\n\n### 4.6 分治不一定是递归，也可能是“排除一半”\n\n`4` 的第 K 小解法每次比较两个数组各自第 `k / 2` 个候选，丢掉较小的一段，因为这段不可能包含第 K 小。`240` 也可以递归分割矩阵区域，不过右上角阶梯搜索更简洁。\n\n二分查找本质上也是一种只递归一边的分治。\n\n## 5. 抽象代码模板\n\n下面模板把分治题拆成“子问题定义、递归返回值、合并信息、只递归哪一边”四个层面来复用。写分治前先确认：当前函数处理哪个区间，返回什么，左右结果如何合并，是否可以排除某一边。\n\n### 5.1 区间构造分治\n\n#### 适用题型\n\n- `108 有序数组转换为二叉搜索树`：中点做根，左右区间递归构造。\n- `105 从前序与中序遍历序列构造二叉树`：前序定根，中序定左右子树规模。\n- 所有“一个区间唯一决定一个子结构”的递归构造题。\n\n#### 核心思路\n\n区间构造题的关键在于让每个递归参数都有清晰语义。推荐数组构造使用左闭右开 `[left, right)`，树遍历构造也可以用闭区间，但同一个函数内必须统一。\n\n合并信息通常很简单：先构造根节点，再把左区间结果接到 `root.left`，右区间结果接到 `root.right`。如果中序位置确定，`leftSize = rootIndex - inLeft` 是推导所有边界的核心。\n\n#### 代码模板\n\n> **题目简述：** 本模板覆盖：108 将有序数组转换为二叉搜索树（给定严格升序数组，将其转换为一棵高度平衡的二叉搜索树。）；105 从前序与中序遍历序列构造二叉树（给定同一棵无重复值二叉树的前序和中序序列，还原并返回该树。） [105 原题 ↗](https://leetcode.cn/problems/construct-binary-tree-from-preorder-and-inorder-traversal/) · [108 原题 ↗](https://leetcode.cn/problems/convert-sorted-array-to-binary-search-tree/)\n\n```python\nclass TreeNode:\n    def __init__(self, val=0, left=None, right=None):\n        self.val = val\n        self.left = left\n        self.right = right\n\ndef buildTree(preorder, inorder):\n    index = {v: i for i, v in enumerate(inorder)}\n\n    def dfs(pre_l, pre_r, in_l, in_r):\n        if pre_l > pre_r:\n            return None\n        root_val = preorder[pre_l]\n        root_idx = index[root_val]\n        left_size = root_idx - in_l\n        root = TreeNode(root_val)\n        root.left = dfs(pre_l + 1, pre_l + left_size, in_l, root_idx - 1)\n        root.right = dfs(pre_l + left_size + 1, pre_r, root_idx + 1, in_r)\n        return root\n\n    return dfs(0, len(preorder) - 1, 0, len(inorder) - 1)\n```\n\n#### 易错点\n\n- 同一递归函数中不要混用左闭右开和闭区间。\n- `105` 的右子树前序起点是 `preLeft + leftSize + 1`，避免写成 `preLeft + leftSize`。\n- 前序加中序能唯一建树通常默认节点值不重复；有重复值时映射会失效。\n\n### 5.2 两两归并分治\n\n#### 适用题型\n\n- `23 合并 K 个升序链表`。\n- 多路有序序列合并，但可以拆成左右两组分别合并。\n- 归并排序中的“先拆分，再合并”模型。\n\n#### 核心思路\n\n分治函数 `mergeRange(left, right)` 返回 `lists[left..right]` 合并后的有序链表。递归阶段只负责拆成两半；真正的合并信息集中在 `mergeTwo`：它维护一个已排序尾引用，把两个有序链表中较小节点接到结果后面。\n\n复杂度来自每层合并会处理所有节点，层数约为 `log k`，所以合并 K 个链表总复杂度是 `O(N log k)`。\n\n#### 代码模板\n\n> **题目简述：** 23 合并 K 个升序链表：给定 K 个升序链表，合并全部结点并返回一个升序链表。 [力扣原题 ↗](https://leetcode.cn/problems/merge-k-sorted-lists/)\n\n```python\nclass ListNode:\n    def __init__(self, val=0, next=None):\n        self.val = val\n        self.next = next\n\n\ndef mergeTwoSortedListsTemplate(a, b):\n    dummy = ListNode(-1)\n    tail = dummy\n\n    while a and b:\n        if a.val \u003c= b.val:\n            tail.next = a\n            a = a.next\n        else:\n            tail.next = b\n            b = b.next\n        tail = tail.next\n\n    tail.next = a if a else b\n    return dummy.next\n\n\ndef mergeKDivideTemplate(lists, left, right):\n    if left > right:\n        return None\n    if left == right:\n        return lists[left]\n\n    mid = left + (right - left) // 2\n    l = mergeKDivideTemplate(lists, left, mid)\n    r = mergeKDivideTemplate(lists, mid + 1, right)\n    return mergeTwoSortedListsTemplate(l, r)\n```\n\n#### 易错点\n\n- `lists` 为空时必须允许 `left > right` 返回 `None`。\n- `mergeTwo` 中移动的是被接入节点所属链表的引用，不要忘记移动 `tail`。\n- 归并合并可以复用原节点，通常不需要新建所有节点。\n\n### 5.3 链表归并排序\n\n#### 适用题型\n\n- `148 排序链表`。\n- 链表上要求 `O(n log n)` 排序，且不适合随机访问快排的题。\n- 需要练习快慢引用拆链和有序链表合并的题。\n\n#### 核心思路\n\n链表归并排序的子问题是“返回当前链表排序后的头节点”。先用快慢引用找到中点，再断开成两条链表，递归排序左右两段，最后用 `mergeTwo` 合并两个有序链表。\n\n合并信息就是两个已排序链表的头引用；拆分阶段最容易遗漏的是 `slow.next = None`，不切断会导致递归区间没有缩小。\n\n#### 代码模板\n\n> **题目简述：** 148 排序链表：给定单链表头结点，以 O(n log n) 时间将所有结点按值升序排列。 [力扣原题 ↗](https://leetcode.cn/problems/sort-list/)\n\n```python\ndef sortListDivideTemplate(head):\n    if not head or not head.next:\n        return head\n\n    slow = head\n    fast = head.next\n    while fast and fast.next:\n        slow = slow.next\n        fast = fast.next.next\n\n    rightHead = slow.next\n    slow.next = None  # 必须断链，让左右递归处理互不重叠的两段。\n\n    left = sortListDivideTemplate(head)\n    right = sortListDivideTemplate(rightHead)\n    return mergeTwoSortedListsTemplate(left, right)\n```\n\n#### 易错点\n\n- 快慢引用初始化不同会影响左右长度，但必须保证每次拆分后规模缩小。\n- 不断链会形成重复处理甚至无限递归。\n- 链表排序更推荐归并排序，数组快排的随机访问优势在链表上不存在。\n\n### 5.4 跨区间信息合并\n\n#### 适用题型\n\n- `53 最大子数组和` 的分治写法。\n- 线段树、区间查询中需要从左右子区间合成父区间信息的题。\n- 答案可能完全在左边、完全在右边，也可能跨过中点的题。\n\n#### 核心思路\n\n如果只返回当前区间的最大子数组和，父区间无法计算跨中点答案。因此每个区间需要返回四类合并信息：`sum` 区间总和、`prefix` 最大前缀和、`suffix` 最大后缀和、`best` 最大子数组和。\n\n合并时，父区间的跨中点答案是 `left.suffix + right.prefix`；父区间的 `prefix/suffix` 也要考虑是否跨过整个左区间或右区间。\n\n#### 代码模板\n\n> **题目简述：** 53 最大子数组和：给定整数数组，找出和最大的非空连续子数组并返回其和。 [力扣原题 ↗](https://leetcode.cn/problems/maximum-subarray/)\n\n```python\nclass SubarrayInfo:\n    def __init__(self, total, prefix, suffix, best):\n        self.sum = total\n        self.prefix = prefix\n        self.suffix = suffix\n        self.best = best\n\n\ndef mergeSubarrayInfo(left, right):\n    total = left.sum + right.sum\n    prefix = max(left.prefix, left.sum + right.prefix)\n    suffix = max(right.suffix, right.sum + left.suffix)\n    best = max(left.best, right.best, left.suffix + right.prefix)\n    return SubarrayInfo(total, prefix, suffix, best)\n\n\ndef maxSubArrayDivideTemplate(nums, left, right):\n    if right - left == 1:\n        x = nums[left]\n        return SubarrayInfo(x, x, x, x)\n\n    mid = left + (right - left) // 2\n    l = maxSubArrayDivideTemplate(nums, left, mid)\n    r = maxSubArrayDivideTemplate(nums, mid, right)\n    return mergeSubarrayInfo(l, r)\n```\n\n#### 易错点\n\n- `prefix` 必须从左端开始，`suffix` 必须到右端结束，不能和 `best` 混淆。\n- 全负数时不能把初始答案设为 0，除非题目允许空子数组。\n- 分治写法不如 Kadane 简短，但它训练的是“合并信息必须足够”的能力。\n\n### 5.5 随机 pivot 快速选择\n\n#### 适用题型\n\n- `215 数组中的第 K 个最大元素`。\n- `347 前 K 个高频元素` 中对频次对象做选择。\n- 不要求完整排序，只要求目标秩或前 K 个无序集合的题。\n\n#### 核心思路\n\n原始笔记里的快速选择采用随机 `pivot`，再按第 K 大的语义分成 `big/equal/small` 三组。每一层只递归目标所在的一组：如果 `big` 已经至少有 K 个，答案一定在 `big`；如果 `big + equal` 覆盖了 K，答案就是 `pivot`；否则去 `small` 中找新的第 `k - len(big) - len(equal)` 大。\n\n随机 pivot 的作用是降低退化概率；`equal` 单独成组是为了正确处理重复值。\n\n#### 代码模板\n\n> **题目简述：** 本模板覆盖：215 数组中的第 K 个最大元素（给定无序数组和 K，返回按排序名次计算的第 K 大元素，而非第 K 个不同值。）；347 前 K 个高频元素（给定整数数组和 K，返回出现频率最高的 K 个元素，结果顺序不限。） [215 原题 ↗](https://leetcode.cn/problems/kth-largest-element-in-an-array/) · [347 原题 ↗](https://leetcode.cn/problems/top-k-frequent-elements/)\n\n```python\ndef kthLargestQuickSelectTemplate(nums, k):\n    import random\n\n    pivot = random.choice(nums)\n    small, equal, big = [], [], []\n\n    for num in nums:\n        if num > pivot:\n            big.append(num)\n        elif num \u003c pivot:\n            small.append(num)\n        else:\n            equal.append(num)\n\n    if k \u003c= len(big):\n        return kthLargestQuickSelectTemplate(big, k)\n    if k > len(big) + len(equal):\n        return kthLargestQuickSelectTemplate(small, k - len(big) - len(equal))\n    return pivot\n\n\ndef findKthLargestTemplate(nums, k):\n    return kthLargestQuickSelectTemplate(nums, k)\n```\n\n#### 易错点\n\n- 原始三路写法直接按第 K 大递归，不需要换算成升序下标 `n - k`。\n- 进入 `small` 递归时必须扣掉 `big` 和 `equal` 的数量。\n- `equal` 不能省略，否则大量重复值时容易秩判断错误。\n\n### 5.6 两个有序数组第 K 小\n\n#### 适用题型\n\n- `4 寻找两个正序数组的中位数`。\n- 两个有序序列合并后找第 K 小，但不希望真的合并。\n- 每轮能丢弃一段确定不含答案的候选区间的题。\n\n#### 核心思路\n\n把中位数转换为第 K 小。每轮比较两个数组各自剩余部分第 `k / 2` 个候选，较小者及其之前的元素最多只能贡献较小的一批，不可能成为当前第 K 小，可以整段丢弃，并把 `k` 减去实际丢弃数量。\n\nwrapper 负责处理中位数：总长度为奇数时取第 `total / 2 + 1` 小；偶数时取第 `total / 2` 小和第 `total / 2 + 1` 小的平均。\n\n#### 代码模板\n\n> **题目简述：** 4 寻找两个正序数组的中位数：给定两个正序数组，求合并后的中位数，并满足对数级时间复杂度。 [力扣原题 ↗](https://leetcode.cn/problems/median-of-two-sorted-arrays/)\n\n```python\ndef kthInTwoSortedArrays(a, i, b, j, k):\n    if i == len(a):\n        return b[j + k - 1]\n    if j == len(b):\n        return a[i + k - 1]\n    if k == 1:\n        return min(a[i], b[j])\n\n    half = k // 2\n    new_i = min(i + half, len(a)) - 1\n    new_j = min(j + half, len(b)) - 1\n\n    if a[new_i] \u003c= b[new_j]:\n        discarded = new_i - i + 1\n        return kthInTwoSortedArrays(a, new_i + 1, b, j, k - discarded)\n\n    discarded = new_j - j + 1\n    return kthInTwoSortedArrays(a, i, b, new_j + 1, k - discarded)\n\n\ndef medianOfTwoSortedArraysWrapper(a, b):\n    total = len(a) + len(b)\n    if total % 2 == 1:\n        return kthInTwoSortedArrays(a, 0, b, 0, total // 2 + 1)\n\n    left_mid = kthInTwoSortedArrays(a, 0, b, 0, total // 2)\n    right_mid = kthInTwoSortedArrays(a, 0, b, 0, total // 2 + 1)\n    return (left_mid + right_mid) / 2.0\n```\n\n#### 易错点\n\n- `k` 是从 1 开始的秩，避免按 0-based 下标处理。\n- 数组剩余长度可能不足 `k / 2`，所以要用 `min` 计算实际候选位置。\n- 丢弃多少元素，`k` 就必须减少多少，不能固定减 `half`。\n\n### 5.7 多数元素候选合并\n\n#### 适用题型\n\n- `169 多数元素` 的分治理解。\n- 左右子区间各自能返回候选，需要在父区间重新判断的题。\n- 练习“候选信息不足时必须补计数”的合并模型。\n\n#### 核心思路\n\n递归函数返回当前区间的多数候选。左右候选相同，可以直接作为父区间候选；若不同，则必须在父区间重新统计两个候选出现次数，次数更多的才是父区间候选。\n\n这里的合并信息只有“候选值”，不足以直接证明合法性，所以合并阶段要额外扫描当前区间计数。实战中多数元素更推荐摩尔投票，但分治写法能帮助理解局部候选如何合并。\n\n#### 代码模板\n\n> **题目简述：** 169 多数元素：给定长度为 N 的数组，找出出现次数严格超过 N/2 且保证存在的元素。 [力扣原题 ↗](https://leetcode.cn/problems/majority-element/)\n\n```python\ndef majorityDivideTemplate(nums, left, right):\n    if left == right:\n        return nums[left]\n\n    mid = left + (right - left) / 2\n    leftCandidate = majorityDivideTemplate(nums, left, mid)\n    rightCandidate = majorityDivideTemplate(nums, mid + 1, right)\n\n    if leftCandidate == rightCandidate:\n        return leftCandidate\n\n    leftCount = 0\n    rightCount = 0\n    for i in range(left, right + 1):\n        if nums[i] == leftCandidate:\n            leftCount += 1\n        if nums[i] == rightCandidate:\n            rightCount += 1\n\n    return leftCandidate if leftCount >= rightCount else rightCandidate\n```\n\n#### 易错点\n\n- 左右候选不同不能随便返回左边或右边，必须在当前父区间计数。\n- 如果题目不保证多数元素存在，最终候选还要全局二次验证。\n- 分治返回候选，还需要再验证多数合法性。\n\n### 5.8 二维有序矩阵区域排除\n\n#### 适用题型\n\n- `240 搜索二维矩阵 II`。\n- 行、列分别有序，但整体不能直接展平成一维有序数组的矩阵题。\n- 能根据当前角点值排除一整行或一整列的题。\n\n#### 核心思路\n\n从右上角出发，当前位置是当前候选区域的“行内最大、列内最小”。如果它大于 `target`，当前列下面只会更大，可以排除这一列；如果它小于 `target`，当前行左侧只会更小，可以排除这一行。\n\n这类写法本质上每步排除一块候选区域，只保留可能包含答案的子问题。\n\n#### 代码模板\n\n> **题目简述：** 240 搜索二维矩阵 II：给定每行和每列均升序的矩阵，判断指定目标值是否存在。 [力扣原题 ↗](https://leetcode.cn/problems/search-a-2d-matrix-ii/)\n\n```python\ndef staircaseMatrixSearchAsDivide(matrix, target):\n    if not matrix or not matrix[0]:\n        return False\n\n    m = len(matrix)\n    n = len(matrix[0])\n    row = 0\n    col = n - 1\n\n    while row \u003c m and col >= 0:\n        if matrix[row][col] == target:\n            return True\n        if matrix[row][col] > target:\n            col -= 1  # 当前列从 row 往下都更大，整列排除。\n        else:\n            row += 1  # 当前行从 0 到 col 都更小，整行排除。\n\n    return False\n```\n\n#### 易错点\n\n- `240` 的矩阵不能直接展平二分，因为每行首尾之间不保证全局顺序。\n- 从右上或左下开始才有明确排除方向；左上和右下都无法一次排除一整块。\n- 空矩阵要先判断，否则访问 `matrix[0]` 会越界。\n\n## 6. 高频易错点清单\n\n| 易错点 | 典型题目 | 规避方式 |\n|---|---|---|\n| 递归函数返回值语义不清 | 所有分治题 | 先写“solve 返回什么” |\n| 区间开闭混用 | `105`、`108`、`53` | 一个函数内固定闭区间或左闭右开 |\n| 建树前序边界算错 | `105` | 用 `leftSize` 推前序左右子树范围 |\n| 有序数组转 BST 取中点后递归边界错 | `108` | 左闭右开时右子树从 `mid + 1` 开始 |\n| 合并 K 链表没有处理空数组 | `23` | `left > right` 返回 `None` |\n| 链表排序切分后没断链 | `148` | `slow.next = None` |\n| 最大子数组分治只返回 best | `53` | 合并需要 sum/prefix/suffix/best 四个量 |\n| 快选第 K 大下标换算错 | `215` | 升序目标是 `n - k` |\n| Top K 高频直接对原数组快选 | `347` | 先哈希统计，再对频次对象选择 |\n| 两数组第 K 小 k 更新错误 | `4` | 丢弃多少元素，k 就减多少 |\n| 矩阵分治误把行列有序当全局有序 | `240` | 不能展平二分，只能区域排除或阶梯搜索 |\n\n## 7. 最短复盘口诀\n\n分治先定义子问题，再定义返回值。建树看区间，归并先拆后合，最大子数组要带前缀后缀，快选只走目标半边，K 大先转 `n - k`，两个有序数组第 K 小每轮丢一段，行列有序矩阵靠区域排除。能合并就归并，能排除就二分，能只走一边就快选。\n\n\n\n================================================================================\n\n# 第21部分: 递归\n\n================================================================================\n\n> 目标：本文把 Hot100 中标记为递归的题目抽象成“函数语义、终止条件、子问题组合、返回值”的模板。复习时先用一句话定义递归函数，再写 base case 和组合逻辑。\n\n## 1. 递归题的底层模型\n\n递归通过同构子问题拆解问题。每道递归题先问五个问题：\n\n| 问题 | 如果答案是“是” | 常用处理 |\n|---|---|---|\n| 当前节点是否只依赖后续链表 | 反转链表、合并链表 | 递归处理 `head.next` 或两个链表的剩余部分 |\n| 是否要把一段结构拆成头和剩余 | 两数相加、字符串解码 | 当前层处理一位或一段，递归处理剩余 |\n| 是否需要返回新头 | 反转、交换、K 组反转 | 返回当前子问题处理后的头节点 |\n| 是否有嵌套结构 | 字符串解码 | 递归函数在遇到右括号时返回当前层结果 |\n| 是否递归更清楚但迭代更稳 | 链表题多数 | 掌握递归语义，同时知道栈深风险 |\n\n递归代码必须先写清楚三件事：\n\n| 内容 | 含义 | 典型例子 |\n|---|---|---|\n| 函数语义 | 这个函数解决哪个子问题 | `reverse(head)` 返回反转后新头 |\n| 终止条件 | 子问题小到什么时候直接返回 | `if not head or not head.next: return head` |\n| 组合方式 | 当前层如何接上子问题结果 | `head.next.next = head` |\n\n## 2. Hot100 递归题型地图\n\n递归专题覆盖 7 道典型题。多数是链表题，`394` 是字符串嵌套解析题，`234` 既可以递归也可以快慢引用加反转。\n\n| 题型 | 题目 | 抽象能力 | 一句话记忆 |\n|---|---|---|---|\n| 链表递归合并 | `21 合并两个有序链表` | 选择当前头，递归合并剩余 | 谁小谁当头，next 接递归结果 |\n| 链表递归反转 | `206 反转链表` | 子链反转后接回当前节点 | 先相信后面已经反转好 |\n| 链表局部递归 | `24 两两交换节点`、`25 K 个一组翻转` | 当前段处理后接递归剩余 | 当前组先改，后面交给递归 |\n| 逐位递归/同步推进 | `2 两数相加` | 当前位 + 进位，递归下一位 | 递归参数带 carry |\n| 链表双端语义 | `234 回文链表` | 从后向前回溯比较 | 递归栈天然提供反向访问 |\n| 嵌套解析 | `394 字符串解码` | 遇到 `[` 进入子层，遇到 `]` 返回 | 每层只解析自己的括号内部 |\n\n## 3. 复习顺序建议\n\n建议按“最简单子问题 → 返回新头 → 分组处理 → 嵌套解析”的顺序复习：\n\n1. `21 合并两个有序链表`：理解递归返回“合并后的头”。\n2. `206 反转链表`：练最经典的链表递归组合。\n3. `24 两两交换节点`：练当前两个节点和剩余链表的拼接。\n4. `2 两数相加`：练递归参数携带进位。\n5. `25 K 个一组翻转`：练先判断够一组，再反转并递归连接。\n6. `234 回文链表`：理解递归栈的后序比较，但实际刷题优先掌握快慢引用方案。\n7. `394 字符串解码`：练嵌套结构的递归解析。\n\n## 4. 关键套路详解\n\n### 4.1 递归函数语义要比代码更先确定\n\n`206 反转链表` 中 `reverse(head)` 的语义是：反转以 `head` 开始的整条链表，并返回反转后的新头。只要相信 `reverse(head.next)` 已经把后半段反转好，当前层只需要把原来的第二个节点指回 `head`，再把 `head.next` 置空。\n\n如果不先定义语义，递归代码会变成“我调用我自己，然后凭感觉接引用”。\n\n### 4.2 链表递归多数都要返回新头\n\n链表节点重连后，当前子链表的头经常会变化。反转后新头是原尾节点；两两交换后新头是第二个节点；K 个一组翻转后新头是当前组的第 K 个节点。因此递归函数返回值通常就是“当前子问题处理后的头”。\n\n### 4.3 递归处理链表要警惕断链\n\n递归反转的关键两句：\n\n```python\nhead.next.next = head\nhead.next = None\n```\n\n第一句把后一个节点指回当前节点，第二句切断当前节点原来的 next，避免形成环。很多递归链表题错在只接回去，不切断旧引用。\n\n### 4.4 嵌套字符串解析适合递归下降\n\n`394 字符串解码` 中每一层递归负责解析当前括号层级内的字符串。遇到数字就累积重复次数，遇到 `[` 就递归解析内部，遇到 `]` 就返回当前层结果。\n\n这种写法的好处是括号匹配天然由调用栈管理，不需要手动维护多个栈。但必须让下标按引用传递，保证子层解析完后外层继续从正确位置走。\n\n### 4.5 递归和回溯的区别在返回值语义\n\n回溯通常是在搜索树上枚举方案，重点是做选择和撤销选择。递归专题里的链表题更像分治：子问题返回一个结构，当前层把结构接好。`394` 虽然也有树形嵌套，但目标是解析一个确定结果，无需枚举所有方案。\n\n## 5. 抽象代码模板\n\n本节先按原始单题笔记的参考解法整理。需要特别注意：本专题虽然叫“递归”，但用户原始笔记中的链表题大多使用哑节点、前驱引用、三引用反转等 O(1) 空间迭代写法；递归写法只作为理解“函数语义/返回新头”的扩展，不替代原始提交模板。\n\n### 5.1 哑节点 + 尾引用/前驱引用链表模板\n\n#### 适用题型\n\n- `21 合并两个有序链表`：两个引用比较大小，尾引用接较小节点。\n- `2 两数相加`：尾引用持续新建结果节点，循环条件必须包含 `carry`。\n- `24 两两交换链表节点`：前驱引用站在待交换二元组前面，原地改三条边。\n\n#### 核心思路\n\n这三题共享“哑节点统一头部处理”骨架。`dummy` 负责兜住答案头，`cur` 或 `pre` 负责站在已经处理好的尾部/前驱位置。区别只在于：`21` 是复用旧节点并比较大小；`2` 是按位相加并新建节点；`24` 是每轮原地交换两个节点。\n\n#### 代码 A：`21` 合并两个有序链表\n\n> **题目简述：** 21 合并两个有序链表：给定两个升序链表，将其合并为一个仍然升序的链表。 [力扣原题 ↗](https://leetcode.cn/problems/merge-two-sorted-lists/)\n\n```python\nclass ListNode:\n    def __init__(self, val=0, next=None):\n        self.val = val\n        self.next = next\n\n\ndef mergeTwoLists(list1, list2):\n    dummy = ListNode(-1, list1)\n    cur = dummy\n    p, q = list1, list2\n\n    while p and q:\n        if q.val \u003c= p.val:\n            cur.next = q\n            q = q.next\n        else:\n            cur.next = p\n            p = p.next\n        cur = cur.next\n\n    cur.next = q if q else p\n    return dummy.next\n```\n\n#### 代码 B：`2` 两数相加\n\n> **题目简述：** 2 两数相加：两个非空链表以逆序数字表示非负整数，求其和并以同样形式返回。 [力扣原题 ↗](https://leetcode.cn/problems/add-two-numbers/)\n\n```python\nclass ListNode:\n    def __init__(self, val=0, next=None):\n        self.val = val\n        self.next = next\n\n\ndef addTwoNumbers(l1, l2):\n    dummy = ListNode(-1)\n    cur = dummy\n    carry = 0\n\n    while l1 or l2 or carry:\n        total = carry\n        if l1:\n            total += l1.val\n            l1 = l1.next\n        if l2:\n            total += l2.val\n            l2 = l2.next\n\n        carry = total // 10\n        cur.next = ListNode(total % 10)\n        cur = cur.next\n\n    return dummy.next\n```\n\n#### 代码 C：`24` 两两交换节点\n\n> **题目简述：** 24 两两交换链表中的节点：将链表中每两个相邻结点交换位置，不允许只修改结点值。 [力扣原题 ↗](https://leetcode.cn/problems/swap-nodes-in-pairs/)\n\n```python\nclass ListNode:\n    def __init__(self, val=0, next=None):\n        self.val = val\n        self.next = next\n\n\ndef swapPairs(head):\n    dummy = ListNode(-1, head)\n    pre = dummy\n    cur = head\n\n    while cur and cur.next:\n        nxt = cur.next\n        pre.next = nxt\n        cur.next = nxt.next\n        nxt.next = cur\n        pre = cur\n        cur = cur.next\n\n    return dummy.next\n```\n\n#### 变形点对照\n\n| 题目 | 引用语义 | 节点来源 | 答案更新/连接时机 |\n|---|---|---|---|\n| `21` | `cur` 是合并后尾节点，`p/q` 是两条原链表当前位置 | 复用原节点 | 每次比较后接一个节点，循环后接剩余整段 |\n| `2` | `cur` 是结果链表尾节点，`l1/l2` 同步前进 | 新建节点 | 每位算完立即 `new ListNode(sum % 10)` |\n| `24` | `pre` 是待交换二元组前驱，`cur/nxt` 是组内两个节点 | 原地重连 | 每轮改三条边后，`pre` 移到当前组尾 |\n\n#### 易错点\n\n- `dummy` 是栈对象时，最后写 `return dummy.next`，避免写成 `dummy.next`。\n- `2` 的循环条件漏掉 `carry`，会丢失 `[5] + [5] = [0,1]` 中的最后进位。\n- `24` 改边前不保存 `nxt`，或者交换后忘记让 `pre = cur`，都会断链或死循环。\n\n### 5.2 三引用反转及其复用模板\n\n#### 适用题型\n\n- `206 反转链表`：整条链表反转。\n- `25 K 个一组翻转链表`：每次反转长度为 `k` 的一段，不足 `k` 的尾段不动。\n- `234 回文链表`：先找中点，再反转后半段，最后前后两段同步比较。\n\n#### 核心思路\n\n原始笔记中的反转链表母题是三引用：`pre` 表示已反转部分的新头，`cur` 表示当前待处理节点，`nxt` 先保存下一节点防止断链。`25` 和 `234` 都是在这个骨架外层增加边界控制：`25` 要先知道剩余节点够不够一组，`234` 要先用快慢引用定位后半段起点。\n\n#### 代码 A：`206` 整链反转\n\n> **题目简述：** 206 反转链表：给定单链表头结点，反转所有 next 指针并返回新的头结点。 [力扣原题 ↗](https://leetcode.cn/problems/reverse-linked-list/)\n\n```python\nclass ListNode:\n    def __init__(self, val=0, next=None):\n        self.val = val\n        self.next = next\n\n\ndef reverseList(head):\n    pre = None\n    cur = head\n\n    while cur:\n        nxt = cur.next\n        cur.next = pre\n        pre = cur\n        cur = nxt\n\n    return pre\n```\n\n#### 代码 B：`25` K 个一组翻转\n\n> **题目简述：** 25 K 个一组翻转链表：按每 K 个结点一组翻转链表，末尾不足 K 个的部分保持原顺序。 [力扣原题 ↗](https://leetcode.cn/problems/reverse-nodes-in-k-group/)\n\n```python\nclass ListNode:\n    def __init__(self, val=0, next=None):\n        self.val = val\n        self.next = next\n\n\ndef reverseKGroup(head, k):\n    n = 0\n    cur = head\n    while cur:\n        cur = cur.next\n        n += 1\n\n    dummy = ListNode(-1, head)\n    p0 = dummy\n    cur = head\n\n    while n >= k:\n        n -= k\n        pre = None\n        first = cur\n\n        for _ in range(k):\n            nxt = cur.next\n            cur.next = pre\n            pre = cur\n            cur = nxt\n\n        first.next = cur\n        p0.next = pre\n        p0 = first\n\n    return dummy.next\n```\n\n#### 代码 C：`234` 回文链表\n\n> **题目简述：** 234 回文链表：给定单链表头结点，判断从头到尾的结点值序列是否为回文。 [力扣原题 ↗](https://leetcode.cn/problems/palindrome-linked-list/)\n\n```python\ndef isPalindrome(head):\n    vals = []\n    while head:\n        vals.append(head.val)\n        head = head.next\n    return vals == vals[::-1]\n```\n\n#### 变形点对照\n\n| 题目 | 三引用反转范围 | 反转前额外准备 | 反转后如何接回 |\n|---|---|---|---|\n| `206` | 整条链表 | 无 | 直接返回 `pre` |\n| `25` | 当前连续 `k` 个节点 | 先统计长度，保证 `n >= k` 才翻 | `first.next = cur`，`p0.next = pre` |\n| `234` | `slow.next` 开始的后半段 | 快慢引用找偏左中点 | 不必接回即可判题；工程上可再反转一次恢复 |\n\n#### 易错点\n\n- 三引用反转必须先保存 `nxt`，再改 `cur.next`。\n- `25` 中 `first` 是翻转前组头、翻转后组尾；连接顺序错了会丢掉下一组。\n- `234` 从 `slow.next` 反转，避免让奇数长度中点参与比较两次。\n\n### 5.3 递归返回新头模板（扩展语义，不替代原始提交）\n\n#### 适用题型\n\n- `21`、`206`、`24` 的递归写法训练：明确函数返回“当前子链表处理后的新头”。\n- `25` 的递归变形：先处理当前 `k` 段，再递归连接剩余链表。\n\n#### 核心思路\n\n递归链表题必须先写清楚函数语义。当前层只处理“当前节点/当前一小段”，剩余部分交给子问题。由于反转、交换、分组都会改变子链表头，所以返回值通常是新头。注意：这些写法有 O(n) 调用栈，空间上弱于原始笔记的最优提交。\n\n#### 代码 A：递归合并两个有序链表\n\n> **题目简述：** 21 合并两个有序链表：给定两个升序链表，将其合并为一个仍然升序的链表。 [力扣原题 ↗](https://leetcode.cn/problems/merge-two-sorted-lists/)\n\n```python\ndef mergeTwoListsByRecursion(a, b):\n    # 返回值语义：返回 a 和 b 合并后的链表头。\n    if not a: return b\n    if not b: return a\n\n    if a.val \u003c= b.val:\n        a.next = mergeTwoListsByRecursion(a.next, b)\n        return a\n\n    b.next = mergeTwoListsByRecursion(a, b.next)\n    return b\n```\n\n#### 代码 B：递归反转链表\n\n> **题目简述：** 206 反转链表：给定单链表头结点，反转所有 next 指针并返回新的头结点。 [力扣原题 ↗](https://leetcode.cn/problems/reverse-linked-list/)\n\n```python\nclass ListNode:\n    def __init__(self, val=0, next=None):\n        self.val = val\n        self.next = next\n\n\ndef reverseListByRecursion(head):\n    if not head or not head.next:\n        return head\n\n    new_head = reverseListByRecursion(head.next)\n    head.next.next = head\n    head.next = None\n    return new_head\n```\n\n#### 代码 C：递归两两交换\n\n> **题目简述：** 24 两两交换链表中的节点：将链表中每两个相邻结点交换位置，不允许只修改结点值。 [力扣原题 ↗](https://leetcode.cn/problems/swap-nodes-in-pairs/)\n\n```python\ndef swapPairsByRecursion(head):\n    # 返回值语义：返回当前链表两两交换后的新头。\n    if not head or not head.next: return head\n\n    second = head.next\n    rest = second.next  # 先保存剩余链表，避免重连后丢失。\n\n    second.next = head\n    head.next = swapPairsByRecursion(rest)  # 原 head 变成当前二元组尾巴。\n\n    return second\n```\n\n#### 变形点对照\n\n| 递归变形 | 当前层处理什么 | 子问题返回什么 | 原始笔记提交差异 |\n|---|---|---|---|\n| `21` 递归合并 | 选择 `a/b` 中较小头节点 | 剩余两链表合并后的头 | 原始笔记用迭代 dummy，空间更稳 |\n| `206` 递归反转 | 让原第二个节点指回当前节点 | 后半段反转后的新头 | 原始笔记用三引用 O(1) |\n| `24` 递归交换 | 交换当前两个节点 | 剩余链表交换后的头 | 原始笔记用 `pre/cur` 原地迭代 |\n| `25` 递归分组 | 先确认够 `k` 个，再反转 `[head, tail)` | 后续分组翻转后的头 | 原始笔记先数长度，避免递归栈 |\n\n#### 易错点\n\n- 递归模板是语义训练，不要误认为比原始迭代模板更优。\n- 返回值必须是“处理后的新头”，不能返回旧 `head`。\n- 反转类递归一定要切断旧 `next`，否则链表成环。\n\n### 5.4 双栈解析嵌套字符串模板\n\n#### 适用题型\n\n- `394 字符串解码` 原始笔记写法。\n- 括号内字符串需要重复拼接，且可能多层嵌套的解析题。\n\n#### 核心思路\n\n使用两个栈分别保存进入当前括号前的状态：`stnum` 保存重复次数，`ststr` 保存外层已经解析出的字符串。遇到数字累积 `num`；遇到 `[` 时把当前 `num/res` 入栈并重置；遇到 `]` 时弹出上层状态，把当前层 `res` 重复后拼回上层。\n\n#### 代码模板\n\n> **题目简述：** 394 字符串解码：解码形如 k[子串] 的有效编码字符串，编码可嵌套且 k 表示重复次数。 [力扣原题 ↗](https://leetcode.cn/problems/decode-string/)\n\n```python\ndef decodeString(s):\n    stnum = []\n    ststr = []\n    num = 0\n    res = \"\"\n\n    for ch in s:\n        if ch.isdigit():\n            num = num * 10 + int(ch)\n        elif ch.isalpha():\n            res += ch\n        elif ch == '[':\n            stnum.append(num)\n            ststr.append(res)\n            res = \"\"\n            num = 0\n        elif ch == ']':\n            cur_num = stnum.pop()\n            last_str = ststr.pop()\n            res = last_str + res * cur_num\n\n    return res\n```\n\n#### 变形点对照\n\n| 场景 | 栈中保存什么 | 出栈时做什么 |\n|---|---|---|\n| 普通字母 | 不入栈 | 直接追加到当前层 `res` |\n| 数字 | 暂存在 `num` | 遇到 `[` 时和当前 `res` 一起入栈 |\n| 左括号 `[` | 当前重复次数、外层字符串 | 重置当前层状态 |\n| 右括号 `]` | 弹出最近一层状态 | 当前层重复 `curnum` 次后拼回 `laststr` |\n\n#### 易错点\n\n- `num` 入栈后必须清零，否则下一层会继承错误重复次数。\n- `res` 入栈后必须清空，否则内层会混入外层前缀。\n- `]` 出栈时是 `laststr + tmp`，避免写成 `tmp + laststr`。\n\n### 5.5 递归下降解析模板（扩展写法）\n\n#### 适用题型\n\n- `394 字符串解码` 的递归下降写法。\n- 括号嵌套表达式求值、括号内局部解析等“每层只处理自己括号内部”的题。\n\n#### 核心思路\n\n定义 `decode(s, index)` 解析当前括号层级内的内容，直到遇到 `]` 或字符串结束。`index` 必须按引用传递：子层解析完后，外层要接着从子层右括号之后继续扫描。这个模板逻辑清晰，但空间复杂度来自调用栈，区分于原始笔记的双栈提交写法。\n\n#### 代码模板\n\n> **题目简述：** 394 字符串解码：解码形如 k[子串] 的有效编码字符串，编码可嵌套且 k 表示重复次数。 [力扣原题 ↗](https://leetcode.cn/problems/decode-string/)\n\n```python\ndef decodeDfs(s, index):\n    result = \"\"\n    repeat = 0\n\n    while index \u003c len(s) and s[index] != ']':\n        if s[index].isdigit():\n            repeat = repeat * 10 + int(s[index])\n            index += 1\n        elif s[index] == '[':\n            index += 1\n            inner, index = decodeDfs(s, index)\n            index += 1\n            result += inner * repeat\n            repeat = 0\n        else:\n            result += s[index]\n            index += 1\n\n    return result, index\n\n\ndef decodeStringByRecursion(s):\n    result, _ = decodeDfs(s, 0)\n    return result\n```\n\n#### 变形点对照\n\n| 写法 | 状态保存位置 | 优点 | 注意事项 |\n|---|---|---|---|\n| 双栈原始写法 | `stnum/ststr` | 更贴近原始笔记，流程显式 | 入栈后重置 `num/res` |\n| 递归下降扩展 | 调用栈 + 引用下标 | 层级语义清楚 | `index` 必须按引用，子层返回后跳过 `]` |\n\n#### 易错点\n\n- `index` 没按引用传递，外层位置不会跟着子层推进。\n- 子层返回后忘记 `index += 1` 跳过 `]`。\n- 使用 `for _ in range(repeat)` 时忘记从子层返回后继续推进下标，容易让重复次数状态变得不可读。\n\n## 6. 高频易错点清单\n\n| 易错点 | 典型题目 | 规避方式 |\n|---|---|---|\n| 把“递归专题”误解成所有题都要递归提交 | `21`、`206`、`24`、`25`、`234` | 先按原始笔记掌握 O(1) 迭代写法，递归只作为语义扩展 |\n| 栈上 `dummy` 返回写错 | `21`、`2`、`24`、`25` | `ListNode dummy(...);` 最后返回 `dummy.next` |\n| 两数相加漏掉最后进位 | `2` | 循环条件写成 `while l1 or l2 or carry:` |\n| 三引用反转先改边后取后继 | `206`、`25`、`234` | 每轮第一句先保存 `nxt = cur.next` |\n| K 组翻转连接顺序混乱 | `25` | 记住 `first` 翻转后是组尾：`first.next = cur`，`p0.next = pre` |\n| 回文链表从错误位置反转 | `234` | 原始写法找偏左中点，从 `slow.next` 开始反转后半段 |\n| 字符串解码入栈后不重置状态 | `394` | 遇到 `[` 后同时重置 `res = \"\"` 和 `num = 0` |\n| 递归下降下标没有按引用传递 | `394` 扩展写法 | `decodeDfs(const string& s, int& index)`，子层返回后外层继续正确位置 |\n\n## 7. 最短复盘口诀\n\n递归专题先看原始笔记：链表题多用 dummy 和三引用，保证 O(1) 空间；`21/2/24` 是哑节点连接，`206/25/234` 是反转骨架复用，`394` 原始写法是双栈保存外层状态。递归写法要会读：先定义函数语义，再写终止条件，返回值多是“处理后的新头”，但提交时不要丢掉原始优化解法。\n\n================================================================================\n\n# 第22部分: 前缀和\n\n================================================================================\n\n> 目标：本文把 Hot100 中“把区间问题转化为两个前缀状态之差”的题抽象成可复用模板。复习时先定义前缀状态，再判断答案是直接相减、查历史计数，还是做左右乘积。\n\n## 1. 前缀和题的底层模型\n\n前缀和的核心是把连续区间的代价从 O(n) 查询压缩到 O(1) 或接近 O(1)。每道题先问五个问题：\n\n| 问题             | 如果答案是“是”           | 常用处理                          |\n| -------------- | ------------------ | ----------------------------- |\n| 查询连续子数组和吗      | 和为 K 的子数组          | `sum(i, j) = pre[j] - pre[i]` |\n| 需要统计有多少区间满足条件吗 | 和为 K 的子数组、路径总和 III | 哈希表统计历史前缀出现次数                 |\n| 前后两侧都要贡献吗      | 除自身以外数组的乘积         | 左前缀乘积 + 右后缀乘积                 |\n| 数据结构有分叉吗       | 树上路径和              | 前缀表进入递归时加入，退出时回溯              |\n| 是二维区域或矩阵标记吗    | 矩阵类相邻题             | 二维前缀和、行列标记                    |\n\n前缀和题最常见的状态有三类：\n\n| 状态 | 对应 Hot100 题目 | 复习关键词 |\n|---|---|---|\n| 一维累计和 | `560`、`53` 相邻思路 | `pre[j] - pre[i]` |\n| 左右前后缀 | `238` | 左乘积、右乘积、不能用除法 |\n| 路径前缀和 | `437` | 当前路径、哈希计数、回溯 |\n\n## 2. Hot100 前缀和题型地图\n\n\n| 题型 | 题目 | 抽象能力 | 一句话记忆 |\n|---|---|---|---|\n| 历史前缀计数 | `560 和为 K 的子数组` | 用历史前缀和个数统计区间数 | 当前 `sum` 需要找历史 `sum - k` |\n| 左右前后缀乘积 | `238 除自身以外数组的乘积` | 不用除法得到两侧贡献 | 答案先放左乘积，再乘右乘积 |\n| 树上路径前缀 | `437 路径总和 III` | 当前根到节点路径上的历史前缀 | 左分支历史不能污染右分支 |\n| 最大子数组相邻思路 | `53 最大子数组和` | 前缀最小值或 Kadane | 当前最大区间和等于 `pre - minPre` |\n| 二维前缀相邻思路 | `73 矩阵置零`、矩阵区域和类题 | 行列状态压缩 | 二维题先想行列前缀或标记 |\n\n## 3. 复习顺序建议\n\n前缀和建议按“定义状态 → 统计区间 → 组合前后缀 → 树上回溯”的顺序复习：\n\n1. 先手写普通前缀数组：理解 `pre[0] = 0` 和左闭右开区间。\n2. `560 和为 K 的子数组`：掌握前缀和 + 哈希计数。\n3. `238 除自身以外数组的乘积`：练不显式建左右数组的前后缀压缩。\n4. `437 路径总和 III`：理解树上前缀和为什么必须回溯。\n5. `53 最大子数组和`：用前缀最小值理解 Kadane 的本质。\n\n## 4. 关键套路详解\n\n### 4.1 前缀数组最好用左闭右开定义\n\n推荐定义 `pre[0] = 0`，`pre[i + 1] = pre[i] + nums[i]`。这样任意区间 `[l, r]` 的和就是 `pre[r + 1] - pre[l]`，任意左闭右开区间 `[l, r)` 的和就是 `pre[r] - pre[l]`。\n\n### 4.2 统计区间数时不能只存一个前缀\n\n`560` 要统计所有和为 K 的子数组。当前位置前缀和为 `sum`，如果历史上有若干个前缀和等于 `sum - k`，每一个都能和当前位置组成一个答案。因此哈希表 value 必须是次数，不能存下标。\n\n### 4.3 `count[0] = 1` 是空前缀边界\n\n如果从数组开头到当前位置的和刚好等于 `k`，那么需要一个“空前缀”参与配对。`count[0] = 1` 表示在处理任何元素前，前缀和 0 已经出现一次。\n\n### 4.4 前后缀乘积是广义前缀和\n\n`238` 不能用除法，因为有 0 和题目限制。做法是先从左到右把每个位置左边所有数的乘积写入答案，再从右到左用一个变量累乘右边所有数，并乘到答案上。\n\n### 4.5 树上前缀和必须回溯\n\n数组是一条线，历史前缀天然只向右使用；树有分叉，当前路径上的前缀和只能给当前分支使用。进入节点时执行 `prefix[curSum] += 1`，递归完左右子树后必须 `prefix[curSum] -= 1`。\n\n## 5. 抽象代码模板\n\n本节按照原始单题笔记的参考解法整理，优先保留你已经写过的变量语义和空间优化方式。前缀和专题需要根据题目判断：查历史次数、合并左右贡献、树上回溯，还是用前缀最小值解释动态规划。\n\n### 5.1 一维前缀数组与区间查询母模板\n\n#### 适用题型\n\n- 普通区间和多次查询：先构造 `pre[i + 1]`，再用两个前缀相减。\n- 固定长度窗口统计：把窗口 `[left, right]` 转成 `pre[right + 1] - pre[left]`。\n- 区间平均值、区间计数、权重累计：只要状态满足“可加可减”，都可以替换 `sum` 的含义。\n\n#### 核心思路\n\n`pre[i]` 表示下标 `[0, i - 1]` 的累计和，所以 `pre[0] = 0` 是空前缀。这样闭区间 `[left, right]` 的和统一写成 `pre[right + 1] - pre[left]`，无需为 `left == 0` 单独分支。\n\n#### 代码模板：共同骨架\n\n> **题目简述：** 本模板用于：普通区间和多次查询：先构造 pre[i + 1]，再用两个前缀相减。；固定长度窗口统计：把窗口 [left, right] 转成 pre[right + 1] - pre[left]。；区间平均值、区间计数、权重累计：只要状态满足“可加可减”，都可以替换 sum 的含义。\n\n```python\n\ndef buildPrefix(nums):\n    n = len(nums)\n    pre = [0 for _ in range(n + 1)]\n\n    for i in range(0, n):\n        # pre[i + 1] 表示 nums[0..i] 的累计和；多出的 pre[0] 表示空前缀。\n        pre[i + 1] = pre[i] + nums[i]\n\n    return pre\n\ndef rangeSumClosed(pre, left, right):\n    # 查询闭区间 [left, right]，右端点在前缀数组中要整体右移一位。\n    return pre[right + 1] - pre[left]\n\ndef rangeSumHalfOpen(pre, left, right):\n    # 查询左闭右开区间 [left, right)，适合窗口右端点不入窗的写法。\n    return pre[right] - pre[left]\n```\n\n#### 变形点对照\n\n| 变形 | 状态含义 | 查询方式 |\n|---|---|---|\n| 区间和 | `pre[i]` 是前 `i` 个数之和 | `pre[r + 1] - pre[l]` |\n| 固定长度窗口 | 窗口右端固定，左端为 `right - k + 1` | `pre[right + 1] - pre[right - k + 1]` |\n| 区间计数/权重 | 把 `nums[i]` 换成是否满足条件或权重 | 仍然两个前缀相减 |\n\n#### 易错点\n\n- `pre` 长度必须是 `n + 1`，否则访问 `pre[right + 1]` 会越界。\n- 先约定闭区间还是左闭右开，不能在同一道题中混用。\n- 区间和可能很大时，Python `int` 可直接承载，无需额外切换整数类型。\n\n### 5.2 前缀和 + 哈希计数统计区间数\n\n#### 适用题型\n\n- `560 和为 K 的子数组`：原始笔记中的核心题，当前 `sum` 查历史 `sum - k`。\n- 和可被 K 整除的子数组：把哈希 key 从完整前缀和换成规范化后的余数。\n- 所有“统计满足条件的连续子数组个数”的题：哈希表 value 必须是出现次数。\n\n#### 核心思路\n\n这题本质是“前缀和版两数之和”。扫描到当前位置时，当前前缀和为 `sum`，如果历史前缀中出现过 `sum - k`，那么这些历史前缀之后到当前位置的连续子数组和就是 `k`。原始解法最关键的一行是初始化 `count = {0: 1}`，它表示空前缀已经出现一次。\n\n#### 代码模板：共同骨架\n\n> **题目简述：** 560 和为 K 的子数组：给定整数数组和整数 K，统计元素和恰好为 K 的连续子数组数量。 [力扣原题 ↗](https://leetcode.cn/problems/subarray-sum-equals-k/)\n\n```python\ndef subarraySum(nums, k):\n    # key 是历史前缀和，value 是这个前缀和出现过几次。\n    # {0, 1} 表示空前缀出现一次，用来统计从下标 0 开始且和为 k 的子数组。\n    map = {0: 1}\n\n    res = 0\n    sum = 0\n\n    for i in range(0, len(nums)):\n        sum += nums[i]\n\n        # 如果历史上存在 sum - k，那么那些历史位置之后到 i 的区间和就是 k。\n        # 这里先查历史，再加入当前 sum，避免当前前缀和自己配对成空区间。\n        if (sum - k in map):\n            res += map[sum - k]\n\n        # 当前前缀会成为后续位置的历史前缀。\n        map[sum] = map.get(sum, 0) + 1\n\n    return res\n```\n\n#### 变形点对照\n\n| 题型 | 哈希 key | 查询什么 | 更新顺序 |\n|---|---|---|---|\n| `560 和为 K 的子数组` | 前缀和 `sum` | `sum - k` 出现次数 | 先查后加当前 `sum` |\n| 和可被 K 整除 | 规范化余数 `((prefix_sum % k) + k) % k` | 同余前缀出现次数 | 先累计答案再 `count[mod] = count.get(mod, 0) + 1` |\n| 前缀异或类 | 前缀异或值 | `xor ^ target` | 和两数之和同理 |\n\n#### 易错点\n\n- `map{{0, 1}}` 不能漏；它是空前缀边界。\n- `map` 的 value 是次数，不能存下标，否则无法统计多个历史前缀带来的多个答案。\n- 数组中有负数时滑动窗口失效，前缀和 + 哈希计数仍然成立。\n\n### 5.3 左右前后缀乘积：保留空间优化\n\n#### 适用题型\n\n- `238 除自身以外数组的乘积`：原始笔记使用一个后缀数组 `suf` 加一个滚动前缀 `pre`。\n- 每个位置都需要“左侧贡献 × 右侧贡献”的题：乘法可替换为其他可合并状态。\n\n#### 核心思路\n\n原始解法先让 `suf[i]` 表示 `i` 右侧所有元素的乘积，再用一个变量 `pre` 从左到右滚动维护 `i` 左侧所有元素的乘积。这样只用返回数组本身承载一侧贡献，另一侧用变量维护，符合题目 O(1) 额外空间的要求。\n\n#### 代码模板：共同骨架\n\n> **题目简述：** 238 除自身以外数组的乘积：不使用除法，在 O(n) 时间内返回每个位置之外其余元素乘积组成的数组。 [力扣原题 ↗](https://leetcode.cn/problems/product-of-array-except-self/)\n\n```python\ndef productExceptSelf(nums):\n    n = len(nums)\n    suf = [1] * n\n\n    for i in range(n - 2, -1, -1):\n        suf[i] = suf[i + 1] * nums[i + 1]\n\n    pre = 1\n    for i in range(n):\n        suf[i] *= pre\n        pre *= nums[i]\n\n    return suf\n```\n\n#### 变形点对照\n\n| 写法 | 空间使用 | 关键不变量 |\n|---|---|---|\n| 原始笔记写法：`suf` + `pre` | 返回数组承载后缀，额外一个变量 | `suf[i]` 先是右侧乘积，第二遍乘左侧 `pre` |\n| 对称写法：答案先存左乘积，再滚动右乘积 | 同样 O(1) 额外空间 | `ans[i]` 先是左侧乘积，第二遍乘右侧变量 |\n| 有 0 的情况 | 无需特判 | 前后缀乘积天然不会除以 0 |\n\n#### 易错点\n\n- 乘法单位元必须初始化为 `1`，不能写成 `0`。\n- 更新顺序不能反：先用当前滚动贡献算答案，再把 `nums[i]` 纳入滚动贡献。\n- 不要使用除法；题目禁止除法，且数组存在 0 时总乘积除法会失效。\n\n### 5.4 树上前缀和 + 回溯\n\n#### 适用题型\n\n- `437 路径总和 III`：统计任意祖先到当前节点的路径和是否为目标值。\n- 树上祖先到后代路径统计：只允许当前递归路径上的历史状态参与配对。\n\n#### 核心思路\n\n数组前缀和的历史天然只沿一个方向增长；树上前缀和的历史必须限定在“根到当前节点”的路径上。进入节点后更新 `curSum`，查询 `curSum - target`，再把当前前缀加入表中递归左右子树；离开节点前必须撤销当前前缀，防止左子树状态污染右子树。\n\n#### 代码模板：共同骨架\n\n> **题目简述：** 437 路径总和 III：统计二叉树中结点值之和等于目标值的向下路径数，路径可从任意结点开始。 [力扣原题 ↗](https://leetcode.cn/problems/path-sum-iii/)\n\n```python\nclass TreeNode:\n    def __init__(self, val=0, left=None, right=None):\n        self.val = val\n        self.left = left\n        self.right = right\n\n\ndef dfsPathPrefix(root, curSum, target, prefixCount):\n    if not root:\n        return 0\n\n    curSum += root.val\n    res = prefixCount.get(curSum - target, 0)\n\n    prefixCount[curSum] = prefixCount.get(curSum, 0) + 1\n    res += dfsPathPrefix(root.left, curSum, target, prefixCount)\n    res += dfsPathPrefix(root.right, curSum, target, prefixCount)\n    prefixCount[curSum] -= 1\n\n    return res\n\n\ndef pathSum(root, targetSum):\n    prefixCount = {0: 1}\n    return dfsPathPrefix(root, 0, targetSum, prefixCount)\n```\n\n#### 变形点对照\n\n| 场景 | 前缀表含义 | 是否回溯 |\n|---|---|---|\n| 数组 `560` | 已扫描过的所有历史前缀 | 不回溯 |\n| 树 `437` | 当前根到节点路径上的历史前缀 | 必须回溯 |\n| 路径异或/路径字符频次 | key 换成异或值或状态压缩掩码 | 仍然进入加、退出减 |\n\n#### 易错点\n\n- `prefixCount` 不能一直全局累加，否则会把跨分支路径误算成合法路径。\n- 查询答案要发生在加入当前前缀之前，否则会把当前节点后的空路径算进去。\n- 路径和可能很大时，`cur_sum` 和字典 key 仍可直接使用 Python `int`。\n\n### 5.5 最大子数组：前缀最小值与 Kadane 空间优化\n\n#### 适用题型\n\n- `53 最大子数组和`：原始笔记同时给了前缀最小值写法和 Kadane 动态规划写法。\n- 最大区间收益类问题：当前状态减去此前最小状态。\n- 连续子数组最优值：通常能进一步压缩到一个滚动变量。\n\n#### 核心思路\n\n前缀和视角下，固定当前右端点时，最大子数组和等于当前前缀和减去此前最小前缀和。Kadane 视角下，`f` 表示“以当前元素结尾的最大子数组和”，如果之前的 `f` 为负，就不如从当前元素重新开始；因此原始笔记写成 `f = max(f, 0) + x`。\n\n#### 代码 A：前缀最小值写法\n\n> **题目简述：** 53 最大子数组和：给定整数数组，找出和最大的非空连续子数组并返回其和。 [力扣原题 ↗](https://leetcode.cn/problems/maximum-subarray/)\n\n```python\ndef maxSubArrayByPrefix(nums):\n    sums = 0\n    res = -float('inf')\n    premin = 0\n\n    for i in range(0, len(nums)):\n        sums += nums[i]\n\n        # 以 i 为右端点时，最优左端点来自此前最小前缀和。\n        # 先更新答案，再更新 premin，避免选到空子数组。\n        res = max(res, sums - premin)\n        premin = min(premin, sums)\n\n    return res\n```\n\n#### 代码 B：Kadane 滚动变量写法\n\n> **题目简述：** 53 最大子数组和：给定整数数组，找出和最大的非空连续子数组并返回其和。 [力扣原题 ↗](https://leetcode.cn/problems/maximum-subarray/)\n\n```python\ndef maxSubArray(nums):\n    res = -float('inf')\n    f = 0  # f 表示以当前元素结尾的最大子数组和；负贡献会被丢弃。\n\n    for x in nums:\n        # 如果前一段 f \u003c 0，继续接上只会拖累当前元素，所以从 x 重新开始。\n        f = max(f, 0) + x\n        res = max(res, f)\n\n    return res\n```\n\n#### 变形点对照\n\n| 写法 | 状态 | 更适合的复习角度 |\n|---|---|---|\n| 前缀最小值 | `sums - premin` | 理解“区间和 = 两个前缀之差” |\n| Kadane | `f = max(f, 0) + x` | 面试实写更短，空间 O(1) |\n| 股票一次交易 | `price - minPrice` | 和前缀最小值同构，但区间收益不能为负时答案初始为 0 |\n\n#### 易错点\n\n- 最大子数组不能为空，所以 `res` 要初始化为 `-float(\"inf\")`，不能初始化为 0。\n- 前缀写法中 `premin` 要在更新答案之后再更新。\n- Kadane 中 `f` 可以初始化为 0，但答案必须通过每个 `x` 更新，才能处理全负数组。\n\n### 5.6 二维前缀和：相邻扩展而非 `73` 主解\n\n#### 适用题型\n\n- 矩阵区域和查询、二维固定窗口统计等标准二维前缀和题。\n- 图像/网格类区域计数：把矩阵值替换成权重或是否满足条件。\n- 注意：`73 矩阵置零` 的原始主解是行列标记；这里只作为矩阵类相邻思想，不应替代 `73` 的专题模板。\n\n#### 核心思路\n\n二维前缀和把左上角到当前位置的矩形累计起来。查询任意子矩形时，用大矩形减去上方和左方，再加回被重复减掉的左上区域。多开一行一列，可以统一处理第一行和第一列。\n\n#### 代码模板：共同骨架\n\n> **题目简述：** 304 二维区域和检索：给定不变矩阵，预处理后多次返回指定子矩形内的元素和。 [力扣原题 ↗](https://leetcode.cn/problems/range-sum-query-2d-immutable/)\n\n```python\ndef build2DPrefix(matrix):\n    m = len(matrix)\n    n = len(matrix[0]) if m else 0\n    pre = [[0] * (n + 1) for _ in range(m + 1)]\n\n    for i in range(m):\n        for j in range(n):\n            pre[i + 1][j + 1] = (\n                pre[i][j + 1]\n                + pre[i + 1][j]\n                - pre[i][j]\n                + matrix[i][j]\n            )\n\n    return pre\n\n\ndef regionSum(pre, r1, c1, r2, c2):\n    return (\n        pre[r2 + 1][c2 + 1]\n        - pre[r1][c2 + 1]\n        - pre[r2 + 1][c1]\n        + pre[r1][c1]\n    )\n```\n\n#### 变形点对照\n\n| 题型 | 是否是 Hot100 原始主线 | 使用方式 |\n|---|---|---|\n| 矩阵区域和 | 是二维前缀标准题 | 建 `m + 1`、`n + 1` 前缀表 |\n| 二维固定窗口 | 相邻扩展 | 枚举右下角，O(1) 查窗口和 |\n| `73 矩阵置零` | 行列标记主解 | 应回到矩阵专题的行列标记模板 |\n\n#### 易错点\n\n- 查询公式最后的 `+ pre[r1][c1]` 不能漏。\n- `pre` 坐标整体比原矩阵偏移一位，右下角访问要写 `r2 + 1`、`c2 + 1`。\n- 不要把所有矩阵题都套二维前缀；先判断题目是否真的在查询区域累计值。\n\n## 6. 高频易错点清单\n\n| 易错点 | 典型题目 | 规避方式 |\n|---|---|---|\n| 前缀数组下标错一位 | 区间和类 | 使用 `pre[i + 1] = pre[i] + nums[i]` |\n| 忘记初始化空前缀 | `560`、`437` | 写 `count[0] = 1` |\n| 查错补数方向 | `560` | 当前 `sum` 查历史 `sum - k` |\n| 哈希表只存下标不存次数 | `560` | 统计区间数时 value 必须是出现次数 |\n| 先加入当前前缀再查答案 | `560` | 先查历史，再加入当前 |\n| 树上前缀和没有回溯 | `437` | 递归退出前 `prefix_count[cur_sum] -= 1` |\n| 前缀和数值很大 | `560`、`437` | Python 直接用 `int` 精确维护 |\n| 除自身乘积使用除法 | `238` | 用左乘积和右乘积合并 |\n| 有 0 时乘积逻辑崩溃 | `238` | 前后缀天然处理 0，不要特判除法 |\n\n## 7. 最短复盘口诀\n\n前缀和先定义状态。普通区间用两前缀相减，统计区间用历史频次查 `sum - k`，乘积题用左前缀乘右后缀，树上路径进入加、退出减。`count[0] = 1` 是空前缀边界，回溯是树和数组的最大区别。\n\n================================================================================\n\n# 第23部分: 字符串\n\n================================================================================\n\n> 目标：本文把 Hot100 字符串题抽象成“字符状态、连续子串、括号栈、回文结构、递归解析、字典结构和字符串 DP”几类模板。复习时先判断题目处理的是子串、子序列、括号结构、词典还是构造搜索。\n\n## 1. 字符串题的底层模型\n\n字符串题的难点通常不在遍历字符，而在识别字符串结构。每道题先问六个问题：\n\n| 问题 | 如果答案是“是” | 常用处理 |\n|---|---|---|\n| 目标必须连续吗 | 最长无重复子串、最小覆盖、最长回文子串 | 滑动窗口、中心扩展、区间 DP |\n| 目标可以不连续吗 | 最长公共子序列、编辑距离 | 序列 DP |\n| 字符频次重要吗 | 异位词、覆盖、分组 | 计数数组或哈希表 |\n| 有括号或嵌套结构吗 | 有效括号、字符串解码、最长有效括号 | 栈、下标栈、递归解析 |\n| 需要枚举构造吗 | 电话号码组合、括号生成、分割回文串、单词搜索 | 回溯 + 剪枝 |\n| 需要前缀查询吗 | Trie、单词拆分 | 前缀树、哈希集合、DP |\n\nHot100 字符串题可以按结构分成七类：\n\n| 结构 | 对应题目 | 复习关键词 |\n|---|---|---|\n| 滑动窗口 | `3`、`76`、`438` | 连续子串、频次、欠账 |\n| 回文结构 | `5`、`131` | 中心扩展、区间 DP、回溯切割 |\n| 括号与栈 | `20`、`22`、`32`、`394` | 匹配、下标、嵌套解析 |\n| 字符分组 | `49`、`763` | 频次签名、最后出现位置 |\n| 词典与前缀 | `139`、`208` | `wordSet`、Trie、可达性 DP |\n| 网格字符串搜索 | `79` | DFS 回溯、访问恢复 |\n| 字符串 DP | `72`、`1143` | 状态定义、转移边界 |\n\n## 2. Hot100 字符串题型地图\n\n\n| 题型 | 题目 | 抽象能力 | 一句话记忆 |\n|---|---|---|---|\n| 滑窗子串 | `3 无重复字符`、`76 最小覆盖子串`、`438 找所有异位词` | 连续窗口频次维护 | 右扩更新状态，合法性决定左缩 |\n| 回文处理 | `5 最长回文子串`、`131 分割回文串` | 中心扩展或区间 DP | 回文判断预处理能降低回溯成本 |\n| 括号匹配 | `20 有效括号`、`22 括号生成`、`32 最长有效括号` | 栈、计数约束、下标边界 | 有效性要么靠栈匹配，要么靠左右数量约束 |\n| 字符分组与划分 | `49 字母异位词分组`、`763 划分字母区间` | 签名分组、最后出现位置 | 同组字符共享签名，同段字符不能跨出最远边界 |\n| 递归解析 | `394 字符串解码` | 数字、括号、字符串栈 | 遇 `]` 就结算当前层 |\n| 词典 DP | `139 单词拆分`、`208 Trie` | 前缀查询和可达性 | `dp[i]` 表示前 i 个字符能否拆分 |\n| 网格搜索 | `79 单词搜索` | 字符路径回溯 | 进入标记，退出恢复 |\n| 编辑类 DP | `72 编辑距离`、`1143 最长公共子序列` | 双串状态转移 | `dp[i][j]` 表示两个前缀之间的关系 |\n| 电话键盘/构造 | `17 电话号码组合` | 字符映射 + 回溯 | 每一位数字选择一个候选字符 |\n\n## 3. 复习顺序建议\n\n建议按“字符计数 → 栈结构 → 回溯构造 → 字符串 DP → Trie/词典”的顺序复习：\n\n1. `49 字母异位词分组`：练字符频次签名。\n2. `3`、`76`、`438`：掌握字符串滑动窗口。\n3. `20`、`32`、`394`：练栈和嵌套结构。\n4. `5`、`131`：掌握回文中心扩展和回文预处理。\n5. `17`、`22`、`79`：练字符串回溯和状态恢复。\n6. `139`、`208`：练词典、前缀和可达性。\n7. `72`、`1143`：练双串 DP 的状态定义。\n8. `763`：用最后出现位置理解字符串贪心划分。\n\n## 4. 关键套路详解\n\n### 4.1 子串和子序列必须先分清\n\n子串要求连续，通常用滑动窗口、中心扩展或区间 DP；子序列不要求连续，通常用双串 DP。`3`、`5`、`76` 处理子串；`1143` 处理子序列。把两者混淆，会直接选错算法。\n\n### 4.2 字符串计数优先用数组\n\n如果字符集固定为小写字母，用 `list[int]` 长度 26 比 `dict` 更直接；如果字符集包含 ASCII 或空格，用 `[0] * 128` 或 `[0] * 256`；只有字符集不确定时再考虑哈希表。\n\n### 4.3 括号题要区分“匹配”和“最长”\n\n`20` 只判断整体是否有效，用栈保存左括号即可。`32` 要找最长有效括号，需要保存下标边界：栈底放“上一个无效位置”，每次匹配后用当前下标减栈顶下标更新长度。\n\n### 4.4 回文题有两种主线\n\n`5` 求最长回文子串，中心扩展最直接；`131` 要枚举所有分割方案，如果每次现场判断回文会重复计算，通常先用区间 DP 预处理 `isPal[left][right]`。\n\n### 4.5 嵌套解析题栈里存的是上一层状态\n\n`394 字符串解码`遇到 `[` 时，把当前数字和当前字符串入栈，然后开启新层；遇到 `]` 时，当前层完成，把它重复若干次接回上一层。栈保存的是“回来以后要继续的状态”。\n\n### 4.6 词典题是前缀可达性\n\n`139 单词拆分`中 `dp[i]` 表示 `s[0..i)` 是否能拆分。只要存在 `j \u003c i`，使得 `dp[j]` 为真且 `s[j..i)` 在词典中，`dp[i]` 就为真。`208 Trie`则把词典查询优化成沿字符边走。\n\n## 5. 抽象代码模板\n\n本节按字符串题的核心模型拆分模板。每个模板都把“适用题型”和“配套代码”绑定起来；如果同一模型下的题型差异较大，则拆成多个函数，避免只给一个泛化骨架。\n\n### 5.1 模板一：字符串滑动窗口\n\n#### 适用题型\n\n- `3 无重复字符的最长子串`：维护一个始终无重复字符的最长合法窗口。\n- `76 最小覆盖子串`：维护欠账表，窗口满足需求后尽量左缩。\n- `438 找到字符串中所有字母异位词`：固定长度窗口，比较窗口频次和目标频次。\n\n#### 核心思路\n\n滑动窗口的共同骨架是右引用不断纳入新字符，左引用在窗口不满足当前题目要求时移动。不同题型的差异体现在“合法条件、何时收缩、何时更新答案”。\n\n#### 代码模板：共同骨架\n\n> **题目简述：** 本模板覆盖：3 无重复字符的最长子串（给定字符串，求不含重复字符的最长连续子串长度。）；76 最小覆盖子串（在字符串 S 中寻找覆盖字符串 T 全部字符及其频次的最短连续子串。）；438 找到字符串中所有字母异位词（给定字符串 S 和 P，返回 S 中所有与 P 字符及频次相同的子串起点。） [3 原题 ↗](https://leetcode.cn/problems/longest-substring-without-repeating-characters/) · [76 原题 ↗](https://leetcode.cn/problems/minimum-window-substring/) · [438 原题 ↗](https://leetcode.cn/problems/find-all-anagrams-in-a-string/)\n\n```python\ndef slidingWindowSkeleton(s):\n    left = 0\n    window = {}\n    ans = 0\n\n    for right, ch in enumerate(s):\n        window[ch] = window.get(ch, 0) + 1\n\n        while False:\n            left_ch = s[left]\n            window[left_ch] -= 1\n            if window[left_ch] == 0:\n                del window[left_ch]\n            left += 1\n\n        ans = max(ans, right - left + 1)\n\n    return ans\n```\n\n最小覆盖子串是这个骨架的典型形态：右侧纳入字符减少欠账，窗口满足后持续左缩，并在收缩过程中更新最短答案。\n\n> **题目简述：** 本模板覆盖：3 无重复字符的最长子串（给定字符串，求不含重复字符的最长连续子串长度。）；76 最小覆盖子串（在字符串 S 中寻找覆盖字符串 T 全部字符及其频次的最短连续子串。）；438 找到字符串中所有字母异位词（给定字符串 S 和 P，返回 S 中所有与 P 字符及频次相同的子串起点。） [3 原题 ↗](https://leetcode.cn/problems/longest-substring-without-repeating-characters/) · [76 原题 ↗](https://leetcode.cn/problems/minimum-window-substring/) · [438 原题 ↗](https://leetcode.cn/problems/find-all-anagrams-in-a-string/)\n\n```python\ndef minWindow(s, t):\n    need = {}\n    for ch in t:\n        need[ch] = need.get(ch, 0) + 1\n\n    valid = 0\n    left = 0\n    start = 0\n    min_len = float('inf')\n\n    for right, ch in enumerate(s):\n        if ch in need:\n            need[ch] -= 1\n            if need[ch] == 0:\n                valid += 1\n\n        while valid == len(need):\n            if right - left + 1 \u003c min_len:\n                min_len = right - left + 1\n                start = left\n            out = s[left]\n            left += 1\n            if out in need:\n                if need[out] == 0:\n                    valid -= 1\n                need[out] += 1\n\n    return '' if min_len == float('inf') else s[start:start + min_len]\n```\n\n#### 变形点对照\n\n| 题型 | 窗口合法条件 | 收缩时机 | 更新答案时机 |\n|---|---|---|---|\n| 最长无重复字符 | 窗口内无重复字符 | 新字符在窗口内重复时，`left` 跳到上次位置后一位 | 每次窗口合法后更新最大长度 |\n| 最小覆盖子串 | `missing == 0`，窗口已覆盖目标 | 满足覆盖后尽量左缩 | 左缩过程中更新最短长度 |\n| 找所有异位词 | 窗口长度等于 `len(p)` 且频次一致 | 长度超过 `len(p)` 时左缩 | 长度正确且频次一致时记录 `left` |\n\n最长无重复字符只需要把“收缩循环”替换成跳跃左边界：\n\n```python\nif last[ch] >= left:\n    left = last[ch] + 1\nlast[ch] = right\nans = max(ans, right - left + 1)\n```\n\n固定长度异位词只需要把收缩条件换成窗口长度：\n\n```python\nif right - left + 1 > len(p):\n    window[s[left] - 'a'] -= 1\n    left += 1\nif right - left + 1 == len(p) and window == need:\n    ans.append(left)\n```\n\n#### 易错点\n\n- 最长窗口在合法后更新答案；最短窗口在满足条件后的收缩过程中更新答案。\n- `minWindow` 中 `need[ch]` 可以为负数，负数表示窗口里多余的字符。\n- 固定窗口题不要每次重新统计整个子串，维护滑动频次数组即可。\n- 不要只背代码，先判断当前题是“最长合法”“最短覆盖”还是“固定长度匹配”。\n\n### 5.2 模板二：字符签名与分组\n\n#### 适用题型\n\n- `49 字母异位词分组`：同一组字符串具有相同字符频次签名。\n- 异位词判断：两个字符串的频次向量完全一致。\n- 字符频次作为等价关系的题：把字符串映射成稳定 key。\n\n#### 核心思路\n\n- 排序 key 简洁，但每个字符串多一个 `O(k log k)`。\n- 计数 key 是线性的，适合只含小写字母的题。\n- key 中要加分隔符，避免 `[1, 11]` 和 `[11, 1]` 拼接冲突。\n\n#### 代码模板\n\n> **题目简述：** 49 字母异位词分组：给定字符串数组，将包含相同字符及频次的字母异位词归为一组。 [力扣原题 ↗](https://leetcode.cn/problems/group-anagrams/)\n\n```python\ndef countSignatureTemplate(s):\n    cnt = [0] * 26\n    for ch in s:\n        cnt[ord(ch) - ord('a')] += 1\n\n    key = []\n    for x in cnt:\n        key.append('#')\n        key.append(str(x))\n    return ''.join(key)\n\n\ndef groupAnagramsTemplate(strs):\n    groups = {}\n    for s in strs:\n        groups.setdefault(countSignatureTemplate(s), []).append(s)\n    return list(groups.values())\n```\n\n#### 易错点\n\n- 计数签名默认只适合字符集固定的场景；如果有大写或 Unicode，需要换成 map 或排序 key。\n- key 必须稳定，同一个异位词集合生成的 key 应完全一致。\n\n### 5.3 模板三：括号栈与下标哨兵\n\n#### 适用题型\n\n- `20 有效括号`：栈保存还未匹配的左括号。\n- `32 最长有效括号`：栈保存下标，栈底保存最近一个无效边界。\n- `22 括号生成`：回溯时约束右括号不能超过左括号。\n\n#### 核心思路\n\n- 有效括号检查类型和顺序，不能只看数量。\n- 最长有效括号中，栈底哨兵用于计算合法段长度。\n- 生成括号时，只要 `rightUsed \u003c= leftUsed \u003c= n`，前缀就仍可能合法。\n\n#### 代码 A：有效括号\n\n> **题目简述：** 20 有效的括号：给定仅含三类括号的字符串，判断括号类型、顺序和配对是否有效。 [力扣原题 ↗](https://leetcode.cn/problems/valid-parentheses/)\n\n```python\ndef validParenthesesTemplate(s):\n    match = {')': '(', ']': '[', '}': '{'}\n    st = []\n\n    for ch in s:\n        if ch not in match:\n            st.append(ch)\n            continue\n\n        if not st or st[-1] != match[ch]:\n            return False\n        st.pop()\n\n    return not st\n```\n\n#### 代码 B：最长有效括号\n\n> **题目简述：** 32 最长有效括号：给定仅含左右圆括号的字符串，求最长连续合法括号子串的长度。 [力扣原题 ↗](https://leetcode.cn/problems/longest-valid-parentheses/)\n\n```python\ndef longestValidParenthesesTemplate(s):\n    st = [-1]\n    ans = 0\n\n    for i, ch in enumerate(s):\n        if ch == '(':\n            st.append(i)\n        else:\n            st.pop()\n            if not st:\n                st.append(i)\n            else:\n                ans = max(ans, i - st[-1])\n\n    return ans\n```\n\n#### 易错点\n\n- 最长有效括号的栈里存下标，不能存字符。\n- 遇到无效右括号时要把它作为新哨兵，否则后续长度会跨过非法位置。\n\n### 5.4 模板四：回文中心扩展与回文预处理\n\n#### 适用题型\n\n- `5 最长回文子串`：枚举奇偶中心，向两侧扩展。\n- `131 分割回文串`：先预处理 `isPal[left][right]`，再回溯切分。\n- 回文最少切割类题：`isPal` 预处理后做前缀 DP。\n\n#### 核心思路\n\n- 中心扩展适合只要最长子串的题，空间低。\n- 回文切分要反复查询区间是否回文，先预处理可避免重复判断。\n- 区间 DP 要保证 `isPal[left + 1][right - 1]` 已经算好，所以 `left` 倒序、`right` 正序。\n\n#### 代码 A：最长回文子串\n\n> **题目简述：** 5 最长回文子串：给定字符串，返回其中长度最长的连续回文子串。 [力扣原题 ↗](https://leetcode.cn/problems/longest-palindromic-substring/)\n\n```python\ndef expandPalindromeTemplate(s, left, right):\n    while left >= 0 and right \u003c len(s) and s[left] == s[right]:\n        left -= 1\n        right += 1\n\n    # 循环结束时 [left + 1, right - 1] 才是最后一个合法回文区间。\n    return [left + 1, right - left - 1]\n\ndef longestPalindromeTemplate(s):\n    bestStart = 0\n    bestLen = 0\n\n    for i in range(0, len(s)):\n        [oddStart, oddLen] = expandPalindromeTemplate(s, i, i)\n        [evenStart, evenLen] = expandPalindromeTemplate(s, i, i + 1)\n\n        if oddLen > bestLen:\n            bestStart = oddStart\n            bestLen = oddLen\n        if evenLen > bestLen:\n            bestStart = evenStart\n            bestLen = evenLen\n\n    return s[bestStart:bestStart + bestLen]\n```\n\n#### 代码 B：回文表 + 分割回文串\n\n> **题目简述：** 131 分割回文串：将给定字符串切分成若干子串，返回每段都是回文串的全部切分方案。 [力扣原题 ↗](https://leetcode.cn/problems/palindrome-partitioning/)\n\n```python\ndef buildPalindromeTableTemplate(s):\n    n = len(s)\n    isPal = [[False] * n for _ in range(n)]\n\n    for left in range(n - 1, -1, -1):\n        for right in range(left, n):\n            isPal[left][right] = (\n                s[left] == s[right]\n                and (right - left \u003c= 2 or isPal[left + 1][right - 1])\n            )\n\n    return isPal\n\n\ndef dfsPartitionPalindromeTemplate(s, start, isPal, path, ans):\n    if start == len(s):\n        ans.append(path[:])\n        return\n\n    for end in range(start, len(s)):\n        if not isPal[start][end]:\n            continue\n        path.append(s[start:end + 1])\n        dfsPartitionPalindromeTemplate(s, end + 1, isPal, path, ans)\n        path.pop()\n\n\ndef partitionPalindromeTemplate(s):\n    isPal = buildPalindromeTableTemplate(s)\n    ans = []\n    path = []\n    dfsPartitionPalindromeTemplate(s, 0, isPal, path, ans)\n    return ans\n```\n\n#### 易错点\n\n- 最长回文必须同时考虑奇数中心和偶数中心。\n- 回文表计算顺序不能反，否则 `isPal[left + 1][right - 1]` 还没算出来。\n- 回溯切分后必须 `pop` 撤销选择。\n\n### 5.5 模板五：嵌套字符串解析\n\n#### 适用题型\n\n- `394 字符串解码`：遇到新层保存上一层数字和字符串状态。\n- 带括号表达式解析：进入括号保存当前上下文，退出括号结算当前层。\n- 递归结构字符串解析：栈保存“返回上一层后要继续的信息”。\n\n#### 核心思路\n\n- `num` 处理连续多位数字。\n- 遇到 `[` 时，当前层开始，上一层的字符串和重复次数入栈。\n- 遇到 `]` 时，当前层完成，重复后接回上一层。\n\n#### 代码模板\n\n> **题目简述：** 394 字符串解码：解码形如 k[子串] 的有效编码字符串，编码可嵌套且 k 表示重复次数。 [力扣原题 ↗](https://leetcode.cn/problems/decode-string/)\n\n```python\ndef decodeStringTemplate(s):\n    counts = []\n    prevStrings = []\n    cur = \"\"\n    num = 0\n\n    for ch in s:\n        if ch.isdigit():\n            num = num * 10 + int(ch)\n        elif ch == '[':\n            counts.append(num)\n            prevStrings.append(cur)\n            num = 0\n            cur = \"\"\n        elif ch == ']':\n            repeat = counts.pop()\n            prev = prevStrings.pop()\n            cur = prev + cur * repeat\n        else:\n            cur += ch\n\n    return cur\n```\n\n#### 易错点\n\n- `num` 在遇到 `[` 后要清零，否则会污染下一层数字。\n- 出栈顺序要和入栈语义一致：先取重复次数，再取上一层字符串。\n- 嵌套结构中 `cur` 始终表示当前层已经解析出的字符串。\n\n### 5.6 模板六：词典 DP 与 Trie\n\n#### 适用题型\n\n- `139 单词拆分`：`dp[i]` 表示前 `i` 个字符能否拆分。\n- `208 实现 Trie`：提供 `insert`、`search`、`startsWith` 三个完整接口。\n- `212 单词搜索 II` 相邻模型：Trie 用于剪枝网格 DFS，但还需要额外的网格回溯。\n\n#### 核心思路\n\n- 词典 DP 是“前缀可达性”：只要存在一个可达前缀 `j`，且 `s[j..i)` 在词典中，`dp[i]` 就可达。\n- Trie 的 `search` 要检查 `isEnd`，`startsWith` 只检查路径是否存在。\n- Trie 节点可以用数组优化小写字母，也可以用哈希表支持更大字符集。\n\n#### 代码 A：单词拆分\n\n> **题目简述：** 139 单词拆分：给定字符串和单词字典，判断字符串能否拆成一个或多个字典单词。 [力扣原题 ↗](https://leetcode.cn/problems/word-break/)\n\n```python\ndef wordBreakTemplate(s, wordDict):\n    words = set(wordDict)\n    dp = [False for _ in range(len(s) + 1)]\n\n    # 空串可拆分，是所有后续状态转移的起点。\n    dp[0] = True\n\n    for i in range(1, len(s) + 1):\n        for j in range(0, i):\n            # 前缀 s[0..j) 可拆，且后半段 s[j..i) 是单词，则前 i 个字符可拆。\n            if dp[j] and (s[j:j + i - j in words]):\n                dp[i] = True\n                break\n\n    return dp[len(s)]\n```\n\n#### 代码 B：完整 Trie 类\n\n> **题目简述：** 208 实现 Trie：设计前缀树，支持插入单词、查询完整单词和判断是否存在指定前缀。 [力扣原题 ↗](https://leetcode.cn/problems/implement-trie-prefix-tree/)\n\n```python\nclass TrieTemplate:\n    class Node:\n        def __init__(self):\n            self.child = [None] * 26\n            self.isEnd = False\n\n    def __init__(self):\n        self.root = self.Node()\n\n    def _walk(self, word):\n        cur = self.root\n        for ch in word:\n            idx = ord(ch) - ord('a')\n            if cur.child[idx] is None:\n                return None\n            cur = cur.child[idx]\n        return cur\n\n    def insert(self, word):\n        cur = self.root\n        for ch in word:\n            idx = ord(ch) - ord('a')\n            if cur.child[idx] is None:\n                cur.child[idx] = self.Node()\n            cur = cur.child[idx]\n        cur.isEnd = True\n\n    def search(self, word):\n        node = self._walk(word)\n        return node is not None and node.isEnd\n\n    def startsWith(self, prefix):\n        return self._walk(prefix) is not None\n```\n\n#### 易错点\n\n- `dp[0] = true` 不能漏，否则所有状态都无法从空前缀转移。\n- `search(\"app\")` 和 `startsWith(\"app\")` 语义不同，前者需要 `isEnd`。\n- Trie 模板默认只处理小写字母；字符集变化时要修改 child 结构。\n\n### 5.7 模板七：双串动态规划\n\n#### 适用题型\n\n- `1143 最长公共子序列`：相等时取左上 + 1，否则取上/左最大。\n- `72 编辑距离`：插入、删除、替换三种操作取最小。\n- 两个字符串前缀关系题：通常定义 `dp[i][j]` 表示两个前缀之间的最优值或可达性。\n\n#### 核心思路\n\n- `dp[i][j]` 使用前 `i` 个字符和前 `j` 个字符，访问字符时是 `a[i - 1]` 与 `b[j - 1]`。\n- 空前缀边界必须初始化。\n- LCS 是求最大保留长度；编辑距离是求最少操作次数。\n\n#### 代码 A：最长公共子序列\n\n> **题目简述：** 1143 最长公共子序列：给定两个字符串，求二者保持字符相对顺序但不要求连续的最长公共子序列长度。 [力扣原题 ↗](https://leetcode.cn/problems/longest-common-subsequence/)\n\n```python\ndef lcsTemplate(a, b):\n    m, n = len(a), len(b)\n    dp = [[0] * (n + 1) for _ in range(m + 1)]\n\n    for i in range(1, m + 1):\n        for j in range(1, n + 1):\n            if a[i - 1] == b[j - 1]:\n                dp[i][j] = dp[i - 1][j - 1] + 1\n            else:\n                dp[i][j] = max(dp[i - 1][j], dp[i][j - 1])\n\n    return dp[m][n]\n```\n\n#### 代码 B：编辑距离\n\n> **题目简述：** 72 编辑距离：给定两个单词，求通过插入、删除或替换字符将前者变为后者的最少操作数。 [力扣原题 ↗](https://leetcode.cn/problems/edit-distance/)\n\n```python\ndef editDistanceTemplate(a, b):\n    m, n = len(a), len(b)\n    dp = [[0] * (n + 1) for _ in range(m + 1)]\n\n    for i in range(m + 1):\n        dp[i][0] = i\n    for j in range(n + 1):\n        dp[0][j] = j\n\n    for i in range(1, m + 1):\n        for j in range(1, n + 1):\n            if a[i - 1] == b[j - 1]:\n                dp[i][j] = dp[i - 1][j - 1]\n            else:\n                remove_a = dp[i - 1][j]\n                insert_b = dp[i][j - 1]\n                replace_a = dp[i - 1][j - 1]\n                dp[i][j] = min(remove_a, insert_b, replace_a) + 1\n\n    return dp[m][n]\n```\n\n#### 易错点\n\n- `dp` 维度用 `m + 1`、`n + 1`，字符访问用 `i - 1`、`j - 1`。\n- 编辑距离的三个操作方向分别是删除、插入、替换，不要漏掉替换。\n- 子串连续，子序列不连续；LCS 不能按滑动窗口理解。\n\n## 6. 高频易错点清单\n\n| 易错点 | 典型题目 | 规避方式 |\n|---|---|---|\n| 把子串当子序列 | `3`、`5`、`1143` | 子串连续，子序列不连续 |\n| 字符频次 key 有冲突 | `49` | 计数 key 加分隔符 |\n| 滑动窗口更新时机混乱 | `3`、`76`、`438` | 最长、最短、固定窗口分开记 |\n| 有效括号只比较数量 | `20` | 必须检查类型和顺序 |\n| 最长有效括号没保存无效边界 | `32` | 栈底放最近无效下标 |\n| 回文中心漏掉偶数长度 | `5` | 同时扩展 `(i, i)` 和 `(i, i + 1)` |\n| 回文分割反复判断回文超时 | `131` | 先预处理 `isPal` |\n| 字符串解码多位数字处理错误 | `394` | `num = num * 10 + digit` |\n| 单词拆分 `dp[0]` 未初始化 | `139` | 空串可拆分，`dp[0] = true` |\n| 网格单词搜索不恢复现场 | `79` | 提前返回和失败返回前都要恢复字符 |\n| 编辑距离边界漏初始化 | `72` | 空前缀到另一个前缀需要插入/删除次数 |\n| Trie 把前缀当完整单词 | `208` | `search` 检查 `isEnd`，`startsWith` 不检查 |\n\n## 7. 最短复盘口诀\n\n字符串题先分子串和子序列。连续子串想滑窗或中心扩展，频次题设计计数签名，括号题用栈和下标，回文枚举中心或预处理区间，嵌套解析保存上一层，词典题看前缀可达性，双串题定义 `dp[i][j]` 的前缀语义。\n\n"</script>
