continue\n\n        board[row] = board[row][:c] + 'Q' + board[row][c + 1:]\n        col[c] = diag1[d1] = diag2[d2] = True\n        nQueensDfs(n, row + 1, board, col, diag1, diag2, ans)\n        col[c] = diag1[d1] = diag2[d2] = False\n        board[row] = board[row][:c] + '.' + board[row][c + 1:]\n```\n\n#### 易错点\n\n- 主对角线 `row - col` 可能为负，必须平移。\n- 只恢复棋盘，忘记恢复列或对角线占用。\n- 每次扫描整个棋盘判断冲突，代码复杂且效率低。\n\n## 6. 高频易错点清单\n\n| 易错点 | 典型题目 | 规避方式 |\n|---|---|---|\n| 组合题写成排列题 | `39`、`78` | 用 `start` 控制向后选择 |\n| 排列题忘记恢复 `used` | `46` | `used[i] = true` 和 `False` 成对出现 |\n| 可重复选择和不可重复选择混淆 | `39` | 可重复传 `i`，不可重复传 `i + 1` |\n| 括号生成只看总数不看前缀合法 | `22` | 任何时候右括号数量不能超过左括号 |\n| 网格搜索提前返回前没恢复字符 | `79` | 所有 return true 前先还原现场 |\n| 回文分割每次重复判断子串 | `131` | 预处理 `isPalindrome` 表 |\n| N 皇后对角线下标为负 | `51` | 主对角线用 `row - col + n - 1` |\n| 终止条件收集答案太早或太晚 | 多数回溯题 | 先定义“路径什么时候完整” |\n| path 传值导致性能差 | 多数回溯题 | 传引用，手动 push/pop |\n| 排序后去重漏掉同层条件 | 含重复元素变形 | 只跳过同一层前一个未使用的重复值 |\n\n## 7. 最短复盘口诀\n\n回溯题先画搜索树。组合子集用 `start`，排列用 `used`，括号看前缀合法，棋盘靠集合剪枝，网格路径进来标记出去恢复。做选择和撤销选择必须对称，剪枝越早越好。`78` 是子集母题，`46` 是排列母题，`39` 是组合母题，`22` 是合法序列母题，`51/79` 是状态恢复母题。\n\n\n\n================================================================================\n\n# 第9部分: 二分查找\n\n================================================================================\n\n> 目标：本文把 Hot100 中的有序数组、旋转数组、答案空间、二维矩阵和二分优化题抽象成若干“可复用模板”。复习时先判断单调性在哪里，再选择查值、查边界、查答案或查结构。\n\n## 1. 二分查找题的底层模型\n\n二分查找的本质是存在一个能把搜索空间分成两半的单调判断。每道二分题先问五个问题：\n\n| 问题 | 如果答案是“是” | 常用处理 |\n|---|---|---|\n| 数组整体有序吗 | 插入位置、左右边界、二维矩阵展平 | 标准左闭右开二分 |\n| 要找第一个满足条件的位置吗 | 搜索插入位置、左边界、答案最小值 | `if (check(mid)) right = mid` |\n| 要找最后一个满足条件的位置吗 | 右边界、最大可行答案 | `if (check(mid)) left = mid + 1` 后回看 |\n| 数组被旋转了吗 | 搜索旋转数组、寻找最小值 | 判断哪一半有序或和右端点比较 |\n| 单调性不在下标而在答案吗 | 寻找重复数、LIS、两个数组中位数 | 对值域、长度或切分位置二分 |\n\n二分题最重要的是明确 `check(x)` 的语义：\n\n| 二分类型 | `check(x)` 含义 | 代表题 |\n|---|---|---|\n| 查值 | `nums[mid]` 和 `target` 的大小关系 | `35`、`74` |\n| 查边界 | 位置 `mid` 是否已经达到目标区间 | `34` |\n| 查旋转结构 | `mid` 落在哪个有序半区或最小值在哪边 | `33`、`153` |\n| 查答案空间 | 答案不超过或至少为 `mid` 是否可行 | `287`、`300` |\n| 查分割线 | 左半部分最大值是否不大于右半部分最小值 | `4` |\n\n## 2. Hot100 二分查找题型地图\n\n\n| 题型 | 题目 | 抽象能力 | 一句话记忆 |\n|---|---|---|---|\n| 标准 lower_bound | `35 搜索插入位置` | 找第一个 `>= target` 的位置 | 左闭右开最稳定 |\n| 左右边界 | `34 在排序数组中查找范围` | 两次 lower_bound | 左边界找 `target`，右边界找 `target + 1` 再减一 |\n| 旋转数组查值 | `33 搜索旋转排序数组` | 判断哪半边有序 | 每轮至少有一半是有序的 |\n| 旋转数组最小值 | `153 寻找旋转排序数组中的最小值` | 和右端点比较最小值在哪边 | `nums[mid] > nums[right]` 说明最小值在右边 |\n| 二维矩阵展平 | `74 搜索二维矩阵` | 一维下标映射二维坐标 | `mid / n` 和 `mid % n` |\n| 行列有序矩阵 | `240 搜索二维矩阵 II` | 阶梯排除或分治缩区间 | 从右上角开始，大左小下 |\n| 值域二分 | `287 寻找重复数` | 对数值范围做计数判断 | `\u003c= mid` 的个数过多，重复数在左半值域 |\n| 二分优化 DP | `300 最长递增子序列` | `tails[len]` 维护长度的最小尾值 | 维护每个长度的最优尾巴，不代表最终序列 |\n| 双数组分割 | `4 寻找两个正序数组的中位数` | 二分短数组切分点 | 左半最大不大于右半最小 |\n\n## 3. 复习顺序建议\n\n建议按“基础边界 → 旋转结构 → 矩阵结构 → 答案空间 → 双数组切分”的顺序复习：\n\n1. `35 搜索插入位置`：先把左闭右开 lower_bound 写熟。\n2. `34 查找第一个和最后一个位置`：练两次 lower_bound。\n3. `74 搜索二维矩阵`：把下标二分扩展到二维坐标。\n4. `33 搜索旋转排序数组`：练“哪一半有序”的判断。\n5. `153 寻找最小值`：练和右端点比较的结构二分。\n6. `240 搜索二维矩阵 II`：理解二维单调结构不一定能展平。\n7. `287 寻找重复数`：掌握值域二分，不改数组。\n8. `300 最长递增子序列`：掌握 tails 数组和 lower_bound。\n9. `4 两个正序数组中位数`：最后攻克分割线二分。\n\n## 4. 关键套路详解\n\n### 4.1 左开右开模板优先级最高\n\n本专题统一使用左开右开区间 `(left, right)`。这里的 `left` 和 `right` 都作为两侧哨兵，位于当前未知区间外：\n\n```text\nleft  : 已确认不满足条件的位置，初始为 -1\nright : 已确认满足条件的位置，初始为 n\n(left, right) : 仍然未知、需要继续二分的区间\n```\n\n循环条件固定写 `left + 1 \u003c right`。每次计算 `mid` 后，只把 `mid` 变成新的哨兵：`right = mid` 或 `left = mid`。循环结束时 `left + 1 == right`，`right` 就是第一个满足条件的位置。\n\n`35` 是母题：找第一个 `nums[i] >= target` 的位置。如果这个位置等于 `n`，说明 target 应插入末尾。\n\n### 4.2 边界题不要写复杂分支\n\n`34` 可以拆成两个左开右开 lower_bound：\n\n```text\nleftBoundary  = 第一个 >= target 的位置\nrightBoundary = 第一个 > target 的位置 - 1\n```\n\n目标不存在时，`lowerBound` 仍会返回插入位置，所以必须验证 `start \u003c n && nums[start] == target`。\n\n### 4.3 旋转数组也能用哨兵思维\n\n`153` 寻找最小值可以转化为：找第一个 `nums[i] \u003c= nums[n - 1]` 的位置。旋转后右半段都不大于最后一个元素，左半段都大于最后一个元素，因此 `check(i) = nums[i] \u003c= nums[n - 1]` 具有单调性。\n\n`33` 搜索目标不能套普通 lower_bound，因为数组整体缺少全局有序性。它仍可以写成左开右开边界更新，但每轮要先判断 `mid` 落在左侧有序段还是右侧有序段，再决定目标是否在可保留区间。\n\n### 4.4 二维矩阵不能随便展平\n\n`74` 可以展平，因为每行最后一个小于下一行第一个，整体全局有序。`240` 不能展平，因为行列分别有序不等于一维全局有序。`240` 常从右上角阶梯搜索，每次排除一整行或一整列。\n\n### 4.5 值域二分是在答案上找边界\n\n`287 寻找重复数` 不查数组下标，而是在值域 `[1, n]` 上找最小满足“左侧值域已经装不下”的值。统计 `\u003c= mid` 的个数，如果个数大于 `mid`，说明重复数在 `[1, mid]`。\n\n### 4.6 LIS 的 tails 数组表示最优尾值\n\n`300` 中 `tails[i]` 表示长度为 `i + 1` 的递增子序列的最小可能尾值。每个元素 `x` 用左开右开 lower_bound 找第一个 `>= x` 的尾值位置并替换。严格递增用 lower_bound，非递减通常用 upper_bound。\n\n### 4.7 双数组中位数是在找合法切分\n\n`4` 在较短数组上找切分点 `i`，让两个数组左半元素数量满足要求，并满足：\n\n```text\nmaxLeftA \u003c= minRightB && maxLeftB \u003c= minRightA\n```\n\n它可以保留闭区间切分写法，因为搜索空间是切分点 `[0, m]`，核心在于调整 `i` 直到分割线合法。\n\n## 5. 抽象代码模板\n\n下面模板统一以左开右开 `(left, right)` 为主。复习时先判断能否定义“第一个满足条件的位置”；能定义时使用哨兵 lower_bound，不能定义时再考虑旋转结构、阶梯搜索或双数组切分。\n\n### 5.1 左开右开 lower_bound 母模板\n\n#### 适用题型\n\n- `35 搜索插入位置`：找第一个 `>= target` 的位置。\n- `34 在排序数组中查找元素的第一个和最后一个位置`。\n- `74 搜索二维矩阵`：展平成一维后找第一个 `>= target` 的位置。\n- `300 最长递增子序列`：在 `tails` 中找第一个 `>= x` 的尾值位置。\n\n#### 核心思路\n\n左开右开模板维护两个哨兵：`left` 永远表示“不满足”的一侧，`right` 永远表示“满足”的一侧。未知区间是 `(left, right)`，因此循环条件是 `left + 1 \u003c right`。每轮只把 `mid` 归类到某个哨兵，不能写成 `mid + 1` 或 `mid - 1`，否则会破坏哨兵语义。\n\n#### 代码模板：共同骨架\n\n> **题目简述：** 本模板覆盖：35 搜索插入位置（在升序无重复数组中查找目标值，返回其下标或应插入的位置。）；34 在排序数组中查找元素的第一个和最后一个位置（在升序数组中返回目标值的首尾下标，不存在时返回 [-1, -1]。）；74 搜索二维矩阵（矩阵每行升序且下一行首项大于上一行末项，判断目标值是否存在。）；300 最长递增子序列（给定整数数组，求保持原有次序但不必连续的最长严格递增子序列长度。） [34 原题 ↗](https://leetcode.cn/problems/find-first-and-last-position-of-element-in-sorted-array/) · [35 原题 ↗](https://leetcode.cn/problems/search-insert-position/) · [74 原题 ↗](https://leetcode.cn/problems/search-a-2d-matrix/) · [300 原题 ↗](https://leetcode.cn/problems/longest-increasing-subsequence/)\n\n```python\ndef firstTrueByOpenInterval(n, check):\n    left = -1\n    right = n\n    while left + 1 \u003c right:\n        mid = left + (right - left) // 2\n        if check(mid):\n            right = mid\n        else:\n            left = mid\n    return right\n\n\ndef lowerBoundOpen(nums, target):\n    left = -1\n    right = len(nums)\n    while left + 1 \u003c right:\n        mid = left + (right - left) // 2\n        if nums[mid] >= target:\n            right = mid\n        else:\n            left = mid\n    return right\n\n\ndef searchInsert(nums, target):\n    return lowerBoundOpen(nums, target)\n```\n\n#### 变形点对照\n\n| 题型 | `check(mid)` 含义 | 返回值使用方式 |\n|---|---|---|\n| 搜索插入位置 `35` | `nums[mid] >= target` | 直接返回 `right` |\n| 左边界 `34` | `nums[mid] >= target` | 返回后验证 `nums[right] == target` |\n| 右边界 `34` | `nums[mid] > target` | 返回 `right - 1` |\n| LIS `300` | `tails[mid] >= x` | `right` 是替换位置 |\n\n#### 易错点\n\n- 初始必须是 `left = -1, right = n`，避免写成 `left = 0, right = n`。\n- 循环条件必须是 `left + 1 \u003c right`，避免写成 `left \u003c right`。\n- 更新必须是 `left = mid` 或 `right = mid`，不要写 `mid + 1` / `mid - 1`。\n- 返回的是右哨兵 `right`，它可能等于 `n`，调用方需要判断越界。\n\n### 5.2 左右边界：两次左开右开 lower_bound\n\n#### 适用题型\n\n- `34 在排序数组中查找元素的第一个和最后一个位置`。\n- 统计有序数组中某个值出现次数。\n- 需要查 `[target, target]`、`[low, high]` 这类值域边界的有序数组题。\n\n#### 核心思路\n\n左边界是第一个 `>= target` 的位置；右边界是第一个 `> target` 的位置减一。这样可以避免写命中后向两边扩散，也避免目标不存在时的复杂分支。唯一必须做的是：先验证左边界确实命中目标。\n\n#### 代码模板：共同骨架\n\n> **题目简述：** 34 在排序数组中查找元素的第一个和最后一个位置：在升序数组中返回目标值的首尾下标，不存在时返回 [-1, -1]。 [力扣原题 ↗](https://leetcode.cn/problems/find-first-and-last-position-of-element-in-sorted-array/)\n\n```python\ndef upperBoundOpen(nums, target):\n    left = -1\n    right = len(nums)\n\n    while left + 1 \u003c right:\n        mid = left + (right - left) / 2\n        if nums[mid] > target:\n            right = mid  # 第一个 > target 可能就是 mid。\n        else:\n            left = mid  # nums[mid] \u003c= target，还在目标区间左侧或内部。\n\n    return right\n\ndef searchRange(nums, target):\n    start = lowerBoundOpen(nums, target)\n\n    # lower_bound 只保证插入位置，不保证 target 存在。\n    if start == len(nums) or nums[start] != target:\n        return [-1, -1]\n\n    end = upperBoundOpen(nums, target) - 1\n    return [start, end]\n```\n\n#### 变形点对照\n\n| 需求 | 写法 | 说明 |\n|---|---|---|\n| 找第一个等于 target | `lowerBoundOpen(nums, target)` | 返回后必须验证 |\n| 找最后一个等于 target | `upperBoundOpen(nums, target) - 1` | 不用 `target + 1`，避免溢出 |\n| 统计出现次数 | `upper - lower` | 若目标不存在结果自然为 0 |\n\n#### 易错点\n\n- 目标不存在时不能直接返回 `{start, upper - 1}`。\n- 用 `target + 1` 找右边界可能在极值时溢出，`upperBoundOpen` 更稳。\n- `upperBoundOpen` 的判断是 `nums[mid] > target`，避免写成 `>=`。\n\n### 5.3 二维矩阵展平搜索\n\n#### 适用题型\n\n- `74 搜索二维矩阵`。\n- 每行升序且上一行最后一个小于下一行第一个的矩阵。\n- 可以把二维坐标视为虚拟一维有序数组的题。\n\n#### 核心思路\n\n如果矩阵满足全局有序，就可以把下标 `idx` 映射为 `matrix[idx / n][idx % n]`，再用左开右开 lower_bound 找第一个 `>= target` 的位置。搜索结束后同样要检查 `right` 是否越界以及值是否等于目标。\n\n#### 代码模板：共同骨架\n\n> **题目简述：** 74 搜索二维矩阵：矩阵每行升序且下一行首项大于上一行末项，判断目标值是否存在。 [力扣原题 ↗](https://leetcode.cn/problems/search-a-2d-matrix/)\n\n```python\ndef searchFlattenedSortedMatrix(matrix, target):\n    if not matrix or not matrix[0]: return False\n\n    m = len(matrix)\n    n = len(matrix[0])\n    total = m * n\n\n    left = -1\n    right = total\n\n    while left + 1 \u003c right:\n        mid = left + (right - left) / 2\n        value = matrix[mid / n][mid % n]\n\n        if value >= target:\n            right = mid\n        else:\n            left = mid\n\n    return right \u003c total and matrix[right / n][right % n] == target\n```\n\n#### 变形点对照\n\n| 题型 | 是否可展平 | 处理方式 |\n|---|---|---|\n| `74 搜索二维矩阵` | 可以 | `idx / n`、`idx % n` 映射后 lower_bound |\n| `240 搜索二维矩阵 II` | 不可以 | 行列分别有序但不全局有序，用阶梯搜索 |\n\n#### 易错点\n\n- 展平前必须确认矩阵是全局有序，而不只是行列分别有序。\n- `right` 可能等于 `m * n`，访问前必须判断。\n- 坐标映射中除数和模数都是列数 `n`。\n\n### 5.4 旋转数组：搜索目标与寻找最小值\n\n#### 适用题型\n\n- `153 寻找旋转排序数组中的最小值`。\n- `33 搜索旋转排序数组`。\n- 有重复值的旋转数组变形。\n\n#### 核心思路\n\n`153` 可以转成标准左开右开二分：找第一个 `nums[i] \u003c= nums[n - 1]` 的位置。因为旋转数组左半段大于最后一个元素，右半段小于等于最后一个元素，单调性来自“是否已经进入右半段”。\n\n`33` 的目标搜索不能套普通 lower_bound，也不能只比较 `nums[mid]` 和 `target`。每轮先判断 `mid` 在左侧有序段还是右侧有序段，再判断 target 是否与 `mid` 位于同一可保留半区。\n\n#### 代码 A：寻找旋转数组最小值\n\n> **题目简述：** 153 寻找旋转排序数组中的最小值：给定元素互异且旋转过的升序数组，以对数时间找出其中最小元素。 [力扣原题 ↗](https://leetcode.cn/problems/find-minimum-in-rotated-sorted-array/)\n\n```python\ndef findMinInRotatedArray(nums):\n    n = len(nums)\n    left = -1\n    right = n\n\n    while left + 1 \u003c right:\n        mid = left + (right - left) / 2\n\n        if nums[mid] > nums[n - 1]:\n            left = mid  # mid 仍在左侧较大有序段，最小值在右边。\n        else:\n            right = mid  # mid 已进入右侧较小有序段，可能就是最小值。\n\n    return nums[right]\n```\n\n#### 代码 B：搜索旋转排序数组\n\n> **题目简述：** 33 搜索旋转排序数组：在元素互异的旋转升序数组中查找目标值，返回下标或 -1。 [力扣原题 ↗](https://leetcode.cn/problems/search-in-rotated-sorted-array/)\n\n```python\ndef searchInRotatedArray(nums, target):\n    if not nums: return -1\n\n    n = len(nums)\n    left = -1\n    right = n\n\n    while left + 1 \u003c right:\n        mid = left + (right - left) / 2\n        if nums[mid] == target: return mid\n\n        if nums[mid] >= nums[0]:\n            # mid 在左侧有序段。只有 target 也在左段且小于 nums[mid]，才保留左侧。\n            if target >= nums[0] and target \u003c nums[mid]:\n                right = mid\n            else:\n                left = mid\n        else:\n            # mid 在右侧有序段。只有 target 也在右段且大于 nums[mid]，才保留右侧。\n            if target > nums[mid] and target \u003c= nums[n - 1]:\n                left = mid\n            else:\n                right = mid\n\n    return -1\n```\n\n#### 变形点对照\n\n| 题型 | 每轮判断什么 | 边界更新差异 |\n|---|---|---|\n| 找最小值 `153` | `nums[mid] > nums[n - 1]` 是否仍在左段 | 左段则 `left = mid`，右段则 `right = mid` |\n| 搜索目标 `33` | `mid` 在哪段，target 是否落在应保留段 | 命中直接返回，否则用哨兵收缩 |\n| 有重复找最小值 | `nums[mid] == nums[right]` 时方向不确定 | 通常只能安全 `right -= 1`，最坏 O(n) |\n\n#### 易错点\n\n- `153` 中 `right` 最终是最小值下标，返回 `nums[right]`。\n- `33` 不能把 `nums[mid] >= nums[0]` 写成普通有序数组比较。\n- 有重复值时，`nums[mid] == nums[right]` 会破坏单调判断，需要单独处理。\n\n### 5.5 值域二分与可行性二分\n\n#### 适用题型\n\n- `287 寻找重复数`：对答案值域 `[1, n]` 二分。\n- 最小可行速度、最小容量、最少天数等答案空间题。\n- 最大可行值类题，需要返回最后一个满足条件的位置。\n\n#### 核心思路\n\n值域二分查答案值，区分于数组下标。最小可行值仍然可以使用左开右开哨兵：左边界表示“不可行”，右边界表示“可行”。最大可行值也能用对称写法：左边界表示“可行”，右边界表示“不可行”，最终返回 `left`。\n\n#### 代码模板：共同骨架\n\n> **题目简述：** 287 寻找重复数：长度 N+1 的数组仅含 1 至 N，找出重复数且不能修改数组、额外空间为常数。 [力扣原题 ↗](https://leetcode.cn/problems/find-the-duplicate-number/)\n\n```python\ndef binarySearchMinFeasibleOpen(lowImpossible, highPossible, check):\n    left = lowImpossible\n    right = highPossible\n    while left + 1 \u003c right:\n        mid = left + (right - left) // 2\n        if check(mid):\n            right = mid\n        else:\n            left = mid\n    return right\n\n\ndef binarySearchMaxFeasibleOpen(lowPossible, highImpossible, check):\n    left = lowPossible\n    right = highImpossible\n    while left + 1 \u003c right:\n        mid = left + (right - left) // 2\n        if check(mid):\n            left = mid\n        else:\n            right = mid\n    return left\n\n\ndef findDuplicateByValueBinarySearch(nums):\n    n = len(nums) - 1\n    left = 0\n    right = n\n    while left + 1 \u003c right:\n        mid = left + (right - left) // 2\n        count_less_equal = sum(1 for x in nums if x \u003c= mid)\n        if count_less_equal > mid:\n            right = mid\n        else:\n            left = mid\n    return right\n```\n\n#### 变形点对照\n\n| 题型 | 哨兵语义 | check 为真时 | 返回值 |\n|---|---|---|---|\n| 最小可行值 | `left` 不可行，`right` 可行 | `right = mid` | `right` |\n| 最大可行值 | `left` 可行，`right` 不可行 | `left = mid` | `left` |\n| 寻找重复数 `287` | `countLessEqual > mid` 表示左半存在重复压力 | `right = mid` | `right` |\n\n#### 易错点\n\n- 值域二分返回答案值，区分于数组下标。\n- 必须先证明 `check(mid)` 具有单调性，再套模板。\n- `287` 中 `countLessEqual > mid` 来自抽屉原理，不能按普通排序比较理解。\n\n### 5.6 LIS 的左开右开 lower_bound 优化\n\n#### 适用题型\n\n- `300 最长递增子序列`。\n- 俄罗斯套娃信封排序后一维 LIS。\n- 需要维护“某个长度的最小可能尾值”的序列题。\n\n#### 核心思路\n\n`tails[i]` 表示长度为 `i + 1` 的严格递增子序列的最小可能尾值。每来一个 `x`，在 `tails` 中用左开右开 lower_bound 找第一个 `>= x` 的位置：如果位置等于 `len(tails)`，说明可以扩展长度；否则替换更小尾值，为后续元素留下更多空间。\n\n#### 代码模板：共同骨架\n\n> **题目简述：** 300 最长递增子序列：给定整数数组，求保持原有次序但不必连续的最长严格递增子序列长度。 [力扣原题 ↗](https://leetcode.cn/problems/longest-increasing-subsequence/)\n\n```python\ndef lengthOfLisByOpenInterval(nums):\n    tails = []\n\n    for x in nums:\n        left = -1\n        right = len(tails)\n\n        while left + 1 \u003c right:\n            mid = left + (right - left) / 2\n            if tails[mid] >= x:\n                right = mid  # 第一个 >= x 的尾值可以被 x 替换。\n            else:\n                left = mid  # tails[mid] \u003c x，x 可以接在该长度后面。\n\n        if right == len(tails):\n            tails.append(x)\n        else:\n            tails[right] = x\n\n    return len(tails)\n```\n\n#### 变形点对照\n\n| 题型 | 二分条件 | 说明 |\n|---|---|---|\n| 严格递增 LIS | `tails[mid] >= x` | lower_bound，避免相等元素扩展长度 |\n| 非递减 LIS | `tails[mid] > x` | upper_bound，相等元素允许接上 |\n| 俄罗斯套娃信封 | 宽升序、高降序后对高做 LIS | 高降序避免相同宽度互相嵌套 |\n\n#### 易错点\n\n- `tails` 表示最小尾值，不能直接输出为最终子序列。\n- 严格递增用 `>= x` 找替换位置，非递减才用 `> x`。\n- 替换尾值不会改变已有最优长度，只是优化未来可扩展性。\n\n### 5.7 行列有序矩阵：用阶梯搜索\n\n#### 适用题型\n\n- `240 搜索二维矩阵 II`。\n- 行升序、列升序，但不满足全局一维有序的矩阵。\n- 每次可以排除一整行或一整列的二维单调结构。\n\n#### 核心思路\n\n从右上角开始：当前值大于目标时，当前列从当前位置往下都更大，可以排除这一列；当前值小于目标时，当前行从左到当前位置都更小，可以排除这一行。这属于利用单调结构缩小搜索空间，思路接近二分但模板不同。\n\n#### 代码模板：共同骨架\n\n> **题目简述：** 240 搜索二维矩阵 II：给定每行和每列均升序的矩阵，判断指定目标值是否存在。 [力扣原题 ↗](https://leetcode.cn/problems/search-a-2d-matrix-ii/)\n\n```python\ndef searchRowColSortedMatrix(matrix, target):\n    if not matrix or not matrix[0]: return False\n\n    m = len(matrix)\n    n = len(matrix[0])\n    row = 0\n    col = n - 1\n\n    while row \u003c m and col >= 0:\n        value = matrix[row][col]\n        if value == target: return True\n\n        if value > target:\n            col -= 1  # 排除当前列：这一列从 row 往下都 >= value > target。\n        else:\n            row += 1  # 排除当前行：这一行从 0 到 col 都 \u003c= value \u003c target。\n\n    return False\n```\n\n#### 变形点对照\n\n| 起点 | 当前值过大 | 当前值过小 | 说明 |\n|---|---|---|---|\n| 右上角 | 左移 | 下移 | 最常用写法 |\n| 左下角 | 上移 | 右移 | 对称写法 |\n\n#### 易错点\n\n- `240` 不能像 `74` 一样展平。\n- 从右上角出发时，大了左移，小了下移，方向不要反。\n- 循环条件是 `row \u003c m && col >= 0`。\n\n### 5.8 两个有序数组的分割线二分\n\n#### 适用题型\n\n- `4 寻找两个正序数组的中位数`。\n- 两个有序数组合并后的第 k 小。\n- 对两个有序序列寻找合法左右分割。\n\n#### 核心思路\n\n只在较短数组上二分切分点 `i`，另一个数组切分点 `j` 由左半元素总数决定。合法分割满足 `maxLeftA \u003c= minRightB` 且 `maxLeftB \u003c= minRightA`。边界切空时用 `-float(\"inf\")/float(\"inf\")` 哨兵，避免访问越界。\n\n#### 代码模板：共同骨架\n\n> **题目简述：** 4 寻找两个正序数组的中位数：给定两个正序数组，求合并后的中位数，并满足对数级时间复杂度。 [力扣原题 ↗](https://leetcode.cn/problems/median-of-two-sorted-arrays/)\n\n```python\ndef findMedianTwoSortedArrays(a, b):\n    if len(a) > len(b):\n        return findMedianTwoSortedArrays(b, a)\n\n    m, n = len(a), len(b)\n    half = (m + n + 1) // 2\n    left, right = 0, m\n\n    while left \u003c= right:\n        i = left + (right - left) // 2\n        j = half - i\n        a_left = float('-inf') if i == 0 else a[i - 1]\n        a_right = float('inf') if i == m else a[i]\n        b_left = float('-inf') if j == 0 else b[j - 1]\n        b_right = float('inf') if j == n else b[j]\n\n        if a_left \u003c= b_right and b_left \u003c= a_right:\n            left_max = max(a_left, b_left)\n            if (m + n) % 2 == 1:\n                return float(left_max)\n            right_min = min(a_right, b_right)\n            return (left_max + right_min) / 2.0\n\n        if a_left > b_right:\n            right = i - 1\n        else:\n            left = i + 1\n\n    return 0.0\n```\n\n#### 变形点对照\n\n| 题型 | 搜索空间 | 判断条件 |\n|---|---|---|\n| 两数组中位数 | 较短数组切分点 `i` | 左半最大值不大于右半最小值 |\n| 两数组第 k 小 | 第一个数组取几个元素 | 左侧总数固定为 k |\n\n#### 易错点\n\n- 必须在较短数组上二分，保证 `j` 不越界。\n- 奇数总长度返回左半最大值，偶数返回两边中间值平均。\n- `leftMax + rightMin` 可能溢出，Python 直接相加后除以 `2.0` 即可。\n\n## 6. 高频易错点清单\n\n| 易错点 | 典型题目 | 规避方式 |\n|---|---|---|\n| 把左开右开写成左闭右开 | `35`、`34` | 固定 `left = -1, right = n`，循环 `left + 1 \u003c right` |\n| 更新成 `mid + 1` 或 `mid - 1` | 所有左开右开模板 | 哨兵模板只写 `left = mid` 或 `right = mid` |\n| 返回错哨兵 | lower_bound 类 | 找第一个满足条件返回 `right` |\n| 找边界后没有验证目标存在 | `34` | 返回前检查 `start \u003c n && nums[start] == target` |\n| 展平矩阵坐标映射错误 | `74` | `row = idx / n`、`col = idx % n` |\n| 把行列有序矩阵当全局有序 | `240` | 只能阶梯搜索或分治，不能展平二分 |\n| 旋转最小值没有定义单调条件 | `153` | 找第一个 `nums[i] \u003c= nums[n - 1]` 的位置 |\n| 旋转数组搜索目标当普通 lower_bound | `33` | 先判断 `mid` 在左段还是右段 |\n| 值域二分误以为返回下标 | `287` | 返回的是答案值，不能当下标 |\n| LIS 把 tails 当真实子序列 | `300` | tails 只维护最小尾值，不保证来自同一条实际序列 |\n| 两数组中位数没选短数组二分 | `4` | 递归或交换保证 `m \u003c= n` |\n| 分割线边界访问越界 | `4` | 切空时用 `-float(\"inf\")` 和 `float(\"inf\")` |\n\n## 7. 最短复盘口诀\n\n二分先找单调性，再定义 `check(mid)`。基础题统一左开右开：`left` 是不满足哨兵，`right` 是满足哨兵，循环 `left + 1 \u003c right`，更新只写 `left = mid` 或 `right = mid`。边界题做两次 lower_bound；旋转最小值找第一个进入右段的位置；二维矩阵全局有序才能展平，行列有序走阶梯；答案空间二分返回值；LIS 的 `tails` 是最小尾值，双数组中位数是找合法分割线。\n\n================================================================================\n\n# 第10部分: 单调栈\n\n================================================================================\n\n> 目标：本文把 Hot100 中的单调栈题抽象成“找最近更大/更小边界”的统一模型。复习时先判断维护递增还是递减，再确定出栈时结算距离、面积还是蓄水量。\n\n## 1. 单调栈题的底层模型\n\n单调栈解决的是“某个元素左右两侧第一个比它大或小的位置”。每道题先问五个问题：\n\n| 问题            | 如果答案是“是”     | 常用处理                            |\n| ------------- | ------------ | ------------------------------- |\n| 是否要找右侧第一个更大元素 | 每日温度、下一个更大元素 | 维护单调递减栈，新元素更大时出栈结算              |\n| 是否要找右侧第一个更小元素 | 柱状图最大矩形、边界压缩 | 维护单调递增栈，新元素更小时出栈结算              |\n| 出栈元素是否需要左边界   | 柱状图宽度、接雨水宽度  | 出栈后新的栈顶就是左边界                    |\n| 末尾是否还有元素没结算   | 柱状图最大矩形      | 在数组两端加哨兵或末尾补 0                  |\n| 相等元素如何处理      | 重复高度、重复温度    | 根据边界是否允许合并决定用 `>`、`>=`、`\u003c`、`\u003c=` |\n\n单调栈的关键在于：出栈那一刻，栈顶元素的右边界已经被当前元素确定，左边界由出栈后的新栈顶确定。\n\n| 维护方式 | 栈内含义 | 触发出栈 | 代表题 |\n|---|---|---|---|\n| 单调递减栈 | 从栈底到栈顶值递减 | 当前值更大 | `739 每日温度` |\n| 单调递增栈 | 从栈底到栈顶值递增 | 当前值更小 | `84 柱状图最大矩形` |\n| 凹槽递减栈 | 保留可能成为左墙的高度 | 当前高度高于槽底 | `42 接雨水` |\n\n## 2. Hot100 单调栈题型地图\n\n\n| 题型 | 题目 | 抽象能力 | 一句话记忆 |\n|---|---|---|---|\n| 下一个更大元素 | `739 每日温度` | 出栈时确定右侧第一个更高温度 | 当前温度让栈顶等待结束 |\n| 最近更小边界 | `84 柱状图中最大的矩形` | 以出栈柱为最矮柱计算最大宽度 | 当前更矮柱子切断右边界 |\n| 凹槽蓄水 | `42 接雨水` | 左墙、槽底、右墙共同结算水量 | 栈顶出栈是槽底，新栈顶是左墙 |\n\n## 3. 复习顺序建议\n\n建议按“边界最简单 → 宽度边界 → 双墙结算”的顺序复习：\n\n1. `739 每日温度`：只需要右侧第一个更大元素，最适合入门。\n2. `84 柱状图中最大的矩形`：理解出栈元素的左边界和右边界。\n3. `42 接雨水`：理解出栈元素代表凹槽底部。\n4. 回头比较 `84` 和 `42`：二者都用当前元素作为右边界，但结算公式完全不同。\n5. 总结相等高度处理：`84` 可用严格递增或非严格递增，但要保持宽度定义一致；`739` 必须是更高温度，不能用相等温度结算。\n\n## 4. 关键套路详解\n\n### 4.1 单调栈一般存下标，不只存值\n\nHot100 的单调栈题几乎都要计算距离或宽度，因此栈里应保存下标。值可以通过 `nums[index]` 取到，下标还能计算 `i - j`、`right - left - 1` 这类答案。\n\n| 题目 | 出栈时需要什么 | 为什么存下标 |\n|---|---|---|\n| `739` | 等待天数 `i - j` | 需要温度差对应的位置差 |\n| `84` | 矩形宽度 `right - left - 1` | 需要左右边界位置 |\n| `42` | 凹槽宽度 `right - left - 1` | 需要左右墙之间的距离 |\n\n### 4.2 找下一个更大：维护递减栈\n\n`739 每日温度` 中，栈里保存还没找到更高温度的日期。栈内温度从底到顶递减。当今天温度高于栈顶日期温度时，栈顶日期的答案就确定了：今天就是它右侧第一个更高温度。\n\n这里的“第一个”来自遍历顺序。因为从左到右扫描，栈顶第一次被更大元素弹出时，当前下标就是最近的右侧更大元素。\n\n### 4.3 找最近更小边界：维护递增栈\n\n`84 柱状图最大矩形` 中，一个柱子能向左右扩展到哪里，取决于左右第一个比它矮的柱子。维护递增栈时，当前柱子更矮，会让栈顶柱子的右边界确定为当前下标。出栈后新的栈顶就是它左侧第一个更矮柱子。\n\n宽度公式必须记清楚：\n\n```text\nheight = heights[mid]\nright = i\nleft = st[-1]  # 弹出后新的栈顶是左边界\nwidth = right - left - 1\narea = height * width\n```\n\n哨兵的作用是统一边界。左侧加 `-1` 下标作为虚拟矮柱，右侧补 `0` 强制所有柱子结算。\n\n### 4.4 接雨水：出栈元素是槽底\n\n`42 接雨水` 也用递减栈，但结算语义不同。当前高度大于栈顶时，栈顶被弹出作为“槽底”。如果弹出后栈为空，说明没有左墙，不能蓄水。否则新栈顶是左墙，当前元素是右墙。\n\n水量公式：\n\n```text\nboundedHeight = min(height[left], height[right]) - height[bottom]\nwidth = right - left - 1\nwater += boundedHeight * width\n```\n\n这道题最容易误把出栈元素当成左墙。正确理解是：出栈元素位于两堵墙之间，是被水覆盖的低洼位置。\n\n### 4.5 相等元素处理要服务题意\n\n相等高度是否出栈没有唯一标准，但必须和题意一致。\n\n| 场景 | 推荐条件 | 原因 |\n|---|---|---|\n| `739` 找更高温度 | `temperatures[i] > temperatures[st[-1]]` | 相等温度不能算更暖 |\n| `84` 找严格更矮边界 | `heights[i] \u003c heights[st[-1]]` | 保留相等高度也能算对，宽度由后续统一结算 |\n| `84` 合并相等高度 | `heights[i] \u003c= heights[st[-1]]` | 相等柱提前出栈，保留更靠右下标，写法也可行 |\n| `42` 接雨水 | `height[i] > height[st[-1]]` | 高于槽底才可能形成水位 |\n\n复习时不要机械背比较符号，要能解释比较符号背后的“是否已经确定边界”。\n\n## 5. 抽象代码模板\n\n本节把单调栈拆成“等待结算”和“边界查询”两类模板。关键在于说明：栈里元素为什么还没结算，当前元素为什么能让它们出栈。\n\n### 5.1 模板一：右侧第一个更大元素\n\n#### 适用题型\n\n- `739 每日温度`：返回右侧第一个更高温度的距离。\n- 下一个更大元素：返回右侧第一个更大的值或下标。\n- 股票跨度类反向变形：可以从右向左维护单调栈。\n\n#### 核心思路\n\n- 栈里保存“还没找到右侧更大元素”的下标。\n- 栈内对应值保持单调递减。\n- 当前值更大时，栈顶元素的右侧第一个更大值已经确定，可以出栈结算。\n\n#### 代码模板\n\n> **题目简述：** 739 每日温度：给定每日温度，返回每一天还需等待多少天才会出现更高温度，不存在则为零。 [力扣原题 ↗](https://leetcode.cn/problems/daily-temperatures/)\n\n```python\ndef dailyTemperaturesTemplate(temperatures):\n    n = len(temperatures)\n    ans = [0] * n\n    st = []\n    for i, temp in enumerate(temperatures):\n        while st and temp > temperatures[st[-1]]:\n            j = st.pop()\n            ans[j] = i - j\n        st.append(i)\n    return ans\n```\n\n#### 易错点\n\n- 栈里默认存下标，不存值；距离和宽度都需要下标。\n- 相等温度不能算更暖，所以比较条件是 `>`。\n- 出栈可能连续发生，必须用 `while`，不能用 `if`。\n\n### 5.2 模板二：循环数组的下一个更大元素\n\n#### 适用题型\n\n- 环形数组中找下一个更大元素。\n- 需要把右侧搜索延伸到数组开头的变形。\n\n#### 核心思路\n\n- 遍历 `2n` 次模拟环。\n- 只有前 `n` 次真正入栈，避免同一个下标重复等待。\n- 后 `n` 次只负责帮助前面的元素完成结算。\n\n#### 代码模板\n\n> **题目简述：** 本模板用于：环形数组中找下一个更大元素。；需要把右侧搜索延伸到数组开头的变形。\n\n```python\ndef circularNextGreaterTemplate(nums):\n    n = len(nums)\n    ans = [-1] * n\n    st = []\n    for i in range(2 * n):\n        idx = i % n\n        while st and nums[idx] > nums[st[-1]]:\n            ans[st.pop()] = nums[idx]\n        if i \u003c n:\n            st.append(idx)\n    return ans\n```\n\n#### 易错点\n\n- 第二圈不要继续入栈，否则同一个下标会重复等待。\n- 如果题目要求距离，距离要用 `(i - j + n) % n` 处理环形偏移。\n\n### 5.3 模板三：柱状图出栈结算面积\n\n#### 适用题型\n\n- `84 柱状图中最大的矩形`：出栈时以该柱子作为最低高度结算最大宽度。\n- 对每个元素找左右第一个更小元素。\n- 需要用当前元素作为最低点向两侧扩展的题。\n\n#### 核心思路\n\n- 栈内高度保持递增。\n- 当前高度更小时，栈顶柱子的右边界确定为当前下标。\n- 出栈后的新栈顶是左侧第一个更小元素。\n- 宽度是 `right - left - 1`。\n\n#### 代码模板\n\n> **题目简述：** 84 柱状图中最大的矩形：给定单位宽度柱状图的各柱高度，求连续柱子可构成的最大矩形面积。 [力扣原题 ↗](https://leetcode.cn/problems/largest-rectangle-in-histogram/)\n\n```python\ndef largestRectangleTemplate(heights):\n    heights = list(heights)\n    heights.append(-1)\n    st = [-1]\n    max_area = 0\n    for i, height in enumerate(heights):\n        while st[-1] != -1 and height \u003c heights[st[-1]]:\n            cur = st.pop()\n            area = heights[cur] * (i - st[-1] - 1)\n            max_area = max(max_area, area)\n        st.append(i)\n    return max_area\n```\n\n#### 易错点\n\n- 原始写法通过 `heights.append(-1)` 添加右侧哨兵，确保所有遗留柱子都会被结算。\n- 宽度必须是 `i - st[-1] - 1`，当前 `i` 和弹栈后的左边界本身都不能包含。\n- 左侧虚拟下标 `-1` 不能拿来访问 `heights[-1]`，所以循环条件必须先判断 `st[-1] != -1`。\n\n### 5.4 模板四：显式左右更小边界数组\n\n#### 适用题型\n\n- 柱状图最大矩形的边界数组写法。\n- 需要多次复用每个位置左右边界的题。\n- 调试单调栈时验证边界语义。\n\n#### 核心思路\n\n- `leftLess[i]` 是左侧第一个严格更小元素下标，不存在为 `-1`。\n- `rightLess[i]` 是右侧第一个严格更小元素下标，不存在为 `n`。\n- 面积为 `heights[i] * (rightLess[i] - leftLess[i] - 1)`。\n\n#### 代码模板\n\n> **题目简述：** 本模板用于：柱状图最大矩形的边界数组写法。；需要多次复用每个位置左右边界的题。；调试单调栈时验证边界语义。 [力扣原题 ↗](https://leetcode.cn/problems/largest-rectangle-in-histogram/)\n\n```python\ndef largestRectangleByBoundariesTemplate(heights):\n    n = len(heights)\n    left_less = [-1] * n\n    right_less = [n] * n\n    st = []\n\n    for i in range(n):\n        while st and heights[st[-1]] >= heights[i]:\n            st.pop()\n        left_less[i] = -1 if not st else st[-1]\n        st.append(i)\n\n    st.clear()\n    for i in range(n - 1, -1, -1):\n        while st and heights[st[-1]] >= heights[i]:\n            st.pop()\n        right_less[i] = n if not st else st[-1]\n        st.append(i)\n\n    ans = 0\n    for i, height in enumerate(heights):\n        ans = max(ans, height * (right_less[i] - left_less[i] - 1))\n    return ans\n```\n\n#### 易错点\n\n- 相等高度的处理要左右一致，否则边界可能重叠或漏算。\n- `>=` 会保留更靠近当前元素的边界语义，适合严格更小边界。\n\n### 5.5 模板五：接雨水凹槽结算\n\n#### 适用题型\n\n- `42 接雨水`：当前右墙出现后，结算中间低洼槽底。\n- 任何“右边界出现后才能确定中间贡献”的题。\n\n#### 核心思路\n\n- 栈内保存可能成为左墙的下标，整体保持递减高度。\n- 当前高度高于栈顶时，栈顶作为槽底出栈。\n- 出栈后如果栈为空，说明没有左墙，不能接水。\n- 水位由左右墙较矮者决定。\n\n#### 代码模板\n\n> **题目简述：** 42 接雨水：给定各柱子的高度，计算下雨后这些柱子之间能够接住的雨水总量。 [力扣原题 ↗](https://leetcode.cn/problems/trapping-rain-water/)\n\n```python\ndef trapRainWaterTemplate(height):\n    n = len(height)\n    water = 0\n    st = []\n    for right in range(n):\n        while st and height[right] > height[st[-1]]:\n            bottom = st.pop()\n            if not st:\n                break\n            left = st[-1]\n            bounded_height = min(height[left], height[right]) - height[bottom]\n            width = right - left - 1\n            water += bounded_height * width\n        st.append(right)\n    return water\n```\n\n#### 易错点\n\n- 出栈元素是槽底；新栈顶才是左墙。\n- 没有左墙时不能接水，要先判断空栈。\n- `boundedHeight` 是左右墙较矮值减槽底高度。\n\n### 5.6 模板六：四方向最近更大 / 更小边界\n\n#### 适用题型\n\n- 面试时快速确定维护递增栈还是递减栈。\n- 需要同时获得左右边界的题，例如柱状图、贡献法统计子数组最小值/最大值。\n- 需要找最近更大或最近更小元素的通用边界题。\n\n#### 核心思路\n\n- 找更小：弹掉大于等于当前值的元素，让栈顶成为严格更小。\n- 找更大：弹掉小于等于当前值的元素，让栈顶成为严格更大。\n- 找左边界从左往右扫，找右边界从右往左扫。\n\n#### 代码模板\n\n> **题目简述：** 本模板用于：面试时快速确定维护递增栈还是递减栈。；需要同时获得左右边界的题，例如柱状图、贡献法统计子数组最小值/最大值。；需要找最近更大或最近更小元素的通用边界题。 [力扣原题 ↗](https://leetcode.cn/problems/largest-rectangle-in-histogram/)\n\n```python\ndef nearestSmallerOnLeftTemplate(nums):\n    ans = [-1] * len(nums)\n    st = []\n    for i, num in enumerate(nums):\n        while st and nums[st[-1]] >= num:\n            st.pop()\n        ans[i] = -1 if not st else st[-1]\n        st.append(i)\n    return ans\n\n\ndef nearestSmallerOnRightTemplate(nums):\n    n = len(nums)\n    ans = [n] * n\n    st = []\n    for i in range(n - 1, -1, -1):\n        while st and nums[st[-1]] >= nums[i]:\n            st.pop()\n        ans[i] = n if not st else st[-1]\n        st.append(i)\n    return ans\n\n\ndef nearestGreaterOnLeftTemplate(nums):\n    ans = [-1] * len(nums)\n    st = []\n    for i, num in enumerate(nums):\n        while st and nums[st[-1]] \u003c= num:\n            st.pop()\n        ans[i] = -1 if not st else st[-1]\n        st.append(i)\n    return ans\n\n\ndef nearestGreaterOnRightTemplate(nums):\n    n = len(nums)\n    ans = [n] * n\n    st = []\n    for i in range(n - 1, -1, -1):\n        while st and nums[st[-1]] \u003c= nums[i]:\n            st.pop()\n        ans[i] = n if not st else st[-1]\n        st.append(i)\n    return ans\n```\n\n#### 易错点\n\n- `>=` / `\u003c=` 决定相等元素归属，涉及贡献计数时尤其重要。\n- 左边界不存在用 `-1`，右边界不存在用 `n`，这样宽度公式更自然。\n- 找右边界时从右往左扫，不要写成和左边界同一个方向。\n\n## 6. 高频易错点清单\n\n| 易错点 | 典型题目 | 规避方式 |\n|---|---|---|\n| 栈里存值导致无法计算距离 | `739`、`84`、`42` | 默认存下标，通过下标取值 |\n| 比较方向写反 | `739`、`84` | 找更大维护递减栈，找更小维护递增栈 |\n| 只用 `if` 出栈 | `84`、`42` | 当前元素可能连续结算多个栈顶，必须用 `while` |\n| 柱状图末尾元素没结算 | `84` | 循环到 `i == n`，令当前高度为 0 |\n| 柱状图宽度少减 1 | `84` | 宽度是 `right - left - 1` |\n| 出栈后马上访问空栈 | `42` | 弹出槽底后先判断 `not st` |\n| 接雨水把槽底当左墙 | `42` | 出栈元素是 bottom，新栈顶才是 left |\n| 每日温度把相等温度当更暖 | `739` | 只在 `>` 时结算 |\n| 相等高度处理前后不一致 | `84` | 明确选择严格或非严格边界，并保持统一 |\n| 忘记单调栈答案在出栈时更新 | `42`、`84`、`739` | 入栈只是等待，出栈才是结算 |\n\n## 7. 最短复盘口诀\n\n单调栈题先问找更大还是更小。找更大用递减栈，找更小用递增栈；栈里存下标，破坏单调就 while 出栈结算。`739` 出栈算距离，`84` 出栈算以它为最低柱的矩形，`42` 出栈的是槽底，左右墙共同算水。右边界是当前下标，左边界是出栈后的新栈顶。\n\n\n\n================================================================================\n\n# 第11部分: 栈\n\n================================================================================\n\n> 目标：本文把 Hot100 中所有显式或隐式用栈的题抽象成若干“可复用题型模板”。复习时先判断栈里存什么、什么时候入栈、什么时候出栈、出栈时结算什么。\n\n## 1. 栈题的底层模型\n\n栈题的本质是“最近的未完成状态”。每道栈题先问五个问题：\n\n| 问题 | 如果答案是“是” | 常用处理 |\n|---|---|---|\n| 是否需要匹配最近的左侧状态 | 括号匹配、字符串解码、最长有效括号 | 栈保存左括号、下标或上一层状态 |\n| 是否需要撤回到上一层语义 | 嵌套字符串、递归模拟、表达式解析 | 栈保存进入当前层前的上下文 |\n| 是否需要维护额外最值 | 最小栈、最大栈变形 | 主栈保存数据，辅助栈保存当前最值 |\n| 是否在模拟递归调用栈 | 二叉树迭代遍历、展开树 | 显式栈保存待处理节点和访问状态 |\n| 是否需要找最近更大/更小元素 | 每日温度、柱状图、接雨水 | 单调栈，出栈时结算贡献 |\n\n栈里通常只存三类东西：\n\n| 栈内元素 | 适用场景 | 代表题 |\n|---|---|---|\n| 字符或节点本身 | 判断匹配、模拟遍历 | `20`、`94`、`114` |\n| 下标 | 需要计算长度、距离、宽度 | `32`、`42`、`84`、`739` |\n| 上一层上下文 | 嵌套结构还原 | `394` |\n| 聚合状态 | O(1) 查询当前最值 | `155` |\n\n## 2. Hot100 栈题型地图\n\n\n| 题型 | 题目 | 抽象能力 | 一句话记忆 |\n|---|---|---|---|\n| 括号匹配 | `20 有效的括号` | 最近左括号匹配 | 右括号只和栈顶最近左括号配对 |\n| 下标哨兵 | `32 最长有效括号` | 用栈维护合法段左边界 | 栈底放“最后一个非法位置” |\n| 嵌套解码 | `394 字符串解码` | 栈保存上一层字符串和倍数 | 遇到 `[` 入栈，遇到 `]` 弹栈拼回上一层 |\n| 设计型栈 | `155 最小栈` | 双栈同步维护最值 | 每个元素入栈时都记录当前最小值 |\n| 递归模拟 | `94 二叉树中序遍历`、`114 二叉树展开为链表` | 显式栈模拟调用栈 | 手动保存还没处理的节点 |\n| 辅助判断 | `234 回文链表` | 栈保存前半段或整链值 | 后进先出天然反向比较 |\n| 单调栈 | `42 接雨水`、`84 柱状图最大矩形`、`739 每日温度` | 最近更大/更小关系 | 栈保持单调，破坏单调时结算答案 |\n\n## 3. 复习顺序建议\n\n先掌握普通栈，再进入单调栈和递归模拟：\n\n1. `20 有效的括号`：理解栈解决“最近匹配”。\n2. `155 最小栈`：理解主栈和辅助栈同步状态。\n3. `394 字符串解码`：练嵌套结构和上下文恢复。\n4. `32 最长有效括号`：练“下标栈 + 哨兵边界”。\n5. `94 二叉树中序遍历`：把递归调用栈改写成显式栈。\n6. `234 回文链表`：把栈作为反向访问工具，并对比快慢引用反转法。\n7. `739 每日温度`：入门单调栈，出栈时结算距离。\n8. `84 柱状图最大矩形`：掌握哨兵和左右边界。\n9. `42 接雨水`：理解单调栈按“凹槽”结算。\n10. `114 二叉树展开为链表`：理解栈和反向 DFS 都能模拟前序结构。\n\n## 4. 关键套路详解\n\n### 4.1 栈里存什么，比用不用栈更重要\n\n栈题最常见错误是直接把元素压栈，却发现答案需要距离、宽度或边界。判断标准很简单：如果题目最终要计算位置差，就存下标；如果只需要匹配类型，就存字符；如果需要恢复上一层状态，就存上下文对象。\n\n| 需求 | 栈里存 | 例子 |\n|---|---|---|\n| 判断括号是否匹配 | 左括号字符 | `20` |\n| 计算最长合法长度 | 下标 | `32` |\n| 计算等待天数或矩形宽度 | 下标 | `739`、`84` |\n| 恢复嵌套前的字符串 | `{之前字符串, 重复次数}` | `394` |\n| 查询当前最小值 | 当前层最小值 | `155` |\n\n### 4.2 括号类题的边界是“最后一个非法位置”\n\n`20` 只需要判断是否完全匹配，所以栈保存左括号即可。`32` 需要计算最长长度，因此不能只存字符，必须存下标。栈底的 `-1` 表示“当前合法段左侧的非法边界”。当遇到无法匹配的右括号时，把它的下标作为新的非法边界。\n\n这类题的关键在于让栈顶始终能回答：当前合法段从哪里之后开始。\n\n### 4.3 嵌套结构题用栈保存上一层上下文\n\n`394 字符串解码` 的当前层字符串遇到 `[` 后会进入下一层。如果不保存上一层，遇到 `]` 时就不知道应该把当前层重复后拼回哪里。因此栈里保存的是“进入下一层之前的状态”：上一层已经构造好的字符串、当前层的重复次数。\n\n类似表达式解析、括号内表达式求值、嵌套列表解析，都可以套这个模型。\n\n### 4.4 最小栈每层保存当前最小值\n\n`155 最小栈` 要求 `getMin()` 为 O(1)。这意味着不能在查询时遍历主栈。常见做法有两种：\n\n| 方法 | 思路 | 优点 |\n|---|---|---|\n| 双栈同步 | 每次 push 时辅助栈也 push 当前最小值 | pop 时天然同步，不需要计数 |\n| 压缩辅助栈 | 只在新值小于等于当前最小时入辅助栈 | 节省空间，但 pop 时要比较 |\n\n复习时优先写双栈同步版，逻辑最稳。\n\n### 4.5 递归调用栈可以显式模拟\n\n二叉树递归本质上也是栈。`94` 的中序遍历可以用 `while cur or st` 模拟：一路向左入栈，弹出时访问节点，再转向右子树。`114` 可以把右节点先压栈、左节点后压栈，从而弹出顺序符合前序。\n\n写迭代遍历时不要只记“模板长什么样”，要明确栈里保存的是“之后还要回来的节点”。\n\n### 4.6 单调栈是栈专题的进阶分支\n\n单调栈通过维护一个单调序列完成结算。当新元素破坏单调性时，说明栈顶元素找到了右侧第一个更大或更小元素，可以立刻结算。\n\n`739` 结算距离，`84` 结算以某根柱子为最矮柱的最大矩形，`42` 结算某个凹槽能接的水。它们共同点是：出栈元素在出栈那一刻同时确定了右边界，左边界由新的栈顶给出。\n\n## 5. 抽象代码模板\n\n下面模板按栈内状态抽象出通用骨架。复习时先确定栈里存字符、下标、上下文、节点还是聚合状态，再选择对应模板。\n\n### 5.1 括号匹配栈\n\n#### 适用题型\n\n- `20 有效的括号`：右括号必须匹配最近的左括号。\n- 表达式括号合法性检查、多类型括号匹配。\n- 需要判断“最近未闭合状态”是否合法的题。\n\n#### 核心思路\n\n栈中只保存尚未匹配的左括号。遇到右括号时，它只能和栈顶最近左括号匹配；如果栈为空或类型不一致，立即失败。遍历结束后栈必须为空。\n\n关键不变量：\n\n- 栈内元素从底到顶是尚未被关闭的左括号。\n- 右括号不入栈，只负责触发匹配和出栈。\n- 每次访问 `st[-1]` 前必须先判断栈非空。\n\n#### 代码模板\n\n> **题目简述：** 20 有效的括号：给定仅含三类括号的字符串，判断括号类型、顺序和配对是否有效。 [力扣原题 ↗](https://leetcode.cn/problems/valid-parentheses/)\n\n```python\ndef isValid(s):\n    st = []\n    pairs = {'(': ')', '[': ']', '{': '}'}\n    for ch in s:\n        if ch in pairs:\n            st.append(pairs[ch])\n        else:\n            if not st or st[-1] != ch:\n                return False\n            st.pop()\n    return not st\n```\n\n#### 易错点\n\n- 把所有字符都当作左括号入栈，导致非括号字符干扰匹配。\n- 右括号到来时直接访问 `st[-1]`，空栈会越界。\n- 忘记最后检查栈为空，漏掉多余左括号。\n\n### 5.2 下标栈 + 哨兵边界\n\n#### 适用题型\n\n- `32 最长有效括号`：需要计算合法括号段长度。\n- 任意需要用最近非法位置切分区间的括号题。\n- 单调栈题中的距离、宽度计算也常复用“存下标”的思想。\n\n#### 核心思路\n\n栈底放一个哨兵下标，表示当前合法段左侧最后一个不能跨越的位置。遇到 `(` 压入下标；遇到 `)` 先弹出一个待匹配位置。若弹后栈空，说明当前右括号无法匹配，它成为新的非法边界；否则 `i - st[-1]` 就是以当前下标结尾的合法长度。\n\n关键不变量：\n\n- 栈底始终是当前扫描段左侧的非法边界。\n- 栈内其余元素是尚未匹配的左括号下标。\n- 每次合法匹配后，栈顶提供当前合法段左边界的前一个位置。\n\n#### 代码模板\n\n> **题目简述：** 32 最长有效括号：给定仅含左右圆括号的字符串，求最长连续合法括号子串的长度。 [力扣原题 ↗](https://leetcode.cn/problems/longest-valid-parentheses/)\n\n```python\ndef longestValidParenthesesTemplate(s):\n    st = [-1]\n    ans = 0\n    for i, ch in enumerate(s):\n        if ch == '(':\n            st.append(i)\n        else:\n            st.pop()\n            if not st:\n                st.append(i)\n            else:\n                ans = max(ans, i - st[-1])\n    return ans\n```\n\n#### 易错点\n\n- 忘记初始哨兵 `-1`，导致开头合法段长度算错。\n- 无法匹配的右括号没有变成新边界。\n- 用字符栈会丢失长度信息，必须存下标。\n\n### 5.3 嵌套结构上下文栈\n\n#### 适用题型\n\n- `394 字符串解码`：`k[encoded]` 类型嵌套还原。\n- 括号嵌套表达式求值。\n- 进入子结构前需要保存父层状态的解析题。\n\n#### 核心思路\n\n当前层遇到 `[` 时即将进入子层，必须把“父层已经构造好的字符串”和“本层重复次数”一起入栈。遇到 `]` 时当前层完成，弹出父层上下文，把当前层重复后拼回父层。\n\n关键不变量：\n\n- `cur` 始终表示当前层已经解析出的内容。\n- `repeat` 必须支持多位数字累积。\n- 栈中每个元素都是进入下一层前保存的 `{父层字符串, 重复次数}`。\n\n#### 代码模板\n\n> **题目简述：** 394 字符串解码：解码形如 k[子串] 的有效编码字符串，编码可嵌套且 k 表示重复次数。 [力扣原题 ↗](https://leetcode.cn/problems/decode-string/)\n\n```python\ndef decodeString(s):\n    stnum = []\n    ststr = []\n    num = 0\n    res = ''\n    for ch in s:\n        if ch.isdigit():\n            num = num * 10 + int(ch)\n        elif ch.isalpha():\n            res += ch\n        elif ch == '[':\n            stnum.append(num)\n            ststr.append(res)\n            res = ''\n            num = 0\n        elif ch == ']':\n            cur_num = stnum.pop()\n            last_str = ststr.pop()\n            res = last_str + res * cur_num\n    return res\n```\n\n#### 易错点\n\n- 数字只按单字符处理，漏掉 `12[a]` 这类多位倍数。\n- 遇到 `]` 后只重复当前层，忘记拼回父层。\n- 入栈后没有清空当前层状态，导致父子层内容混在一起。\n\n### 5.4 最小栈双栈同步\n\n#### 适用题型\n\n- `155 最小栈`：`push/pop/top/getMin` 都要求 O(1)。\n- 最大栈、历史最值查询、支持撤销的聚合状态栈。\n- 主结构操作后需要同步维护辅助查询结果的设计题。\n\n#### 核心思路\n\n一个栈保存真实数据，另一个栈保存“压入当前元素后整个栈的最小值”。每次 `push` 两个栈都入栈，每次 `pop` 两个栈都出栈，所以 `mins[-1]` 永远是当前最小值。\n\n关键不变量：\n\n- `len(data) == len(mins)`。\n- `mins[-1]` 是当前所有 `data` 元素的最小值。\n- `pop()` 必须让主栈和辅助栈同步变化。\n\n#### 代码模板\n\n> **题目简述：** 155 最小栈：设计支持压栈、出栈、查看栈顶和获取最小值且操作均为 O(1) 的栈。 [力扣原题 ↗](https://leetcode.cn/problems/min-stack/)\n\n```python\nclass MinStack:\n    def __init__(self):\n        self.st = [(0, float('inf'))]\n\n    def push(self, val):\n        current_min = min(val, self.st[-1][1])\n        self.st.append((val, current_min))\n\n    def pop(self):\n        self.st.pop()\n\n    def top(self):\n        return self.st[-1][0]\n\n    def getMin(self):\n        return self.st[-1][1]\n```\n\n#### 易错点\n\n- 只维护一个普通栈，`getMin()` 时扫描，复杂度不满足 O(1)。\n- 辅助栈只在更小值时入栈，却在弹出相等最小值时忘记同步弹出。\n- 两个栈长度不同步，连续 `pop()` 后最小值失真。\n\n### 5.5 显式栈模拟树遍历\n\n#### 适用题型\n\n- `94 二叉树中序遍历`。\n- BST 第 K 小、验证 BST 等“中序访问时结算”的题。\n- 递归调用栈可能过深，或面试要求迭代写法的树题。\n\n#### 核心思路\n\n递归本质就是系统栈。中序遍历的显式栈写法是：当前节点不空时一路向左并压栈；走不动后弹出最近未访问节点，访问它，再转向右子树。\n\n关键不变量：\n\n- 栈内节点是“左子树已准备深入，但自身还没访问”的祖先链。\n- 弹栈时才访问节点，保证左、根、右顺序。\n- 访问后必须令 `cur = cur.right`，否则右子树会丢失。\n\n#### 代码模板\n\n> **题目简述：** 94 二叉树的中序遍历：给定二叉树根结点，按左子树、根、右子树的顺序返回结点值。 [力扣原题 ↗](https://leetcode.cn/problems/binary-tree-inorder-traversal/)\n\n```python\nclass TreeNode:\n    def __init__(self, val=0, left=None, right=None):\n        self.val = val\n        self.left = left\n        self.right = right\n\n\ndef inorderIterativeTemplate(root):\n    res = []\n    st = []\n    cur = root\n    while cur is not None or st:\n        while cur is not None:\n            st.append(cur)\n            cur = cur.left\n        cur = st.pop()\n        res.append(cur.val)\n        cur = cur.right\n    return res\n```\n\n#### 易错点\n\n- 外层循环只写 `while cur`，栈中剩余祖先无法继续处理。\n- 弹出节点后忘记转向右子树。\n- 前序遍历中入栈顺序写反：想先访问左子树，应先压右再压左。\n\n### 5.6 前序栈模拟结构重排\n\n#### 适用题型\n\n- `114 二叉树展开为链表` 的显式栈写法。\n- 需要按前序顺序重排树结构的题。\n- 递归 flatten 容易栈溢出或要求迭代实现的场景。\n\n#### 核心思路\n\n前序顺序是根、左、右。栈是后进先出，所以为了先处理左子树，入栈时要先压右再压左。每弹出一个节点，就把上一个节点的 `right` 指向当前节点，并清空 `left`，逐步形成前序链表。\n\n关键不变量：\n\n- 栈中保存尚未接到链表上的节点。\n- `prev` 始终是已经展开链表的尾节点。\n- 每处理一个节点，都必须清空 `left`。\n\n#### 代码模板\n\n> **题目简述：** 114 二叉树展开为链表：将二叉树原地展开为前序遍历顺序的单链表，仅使用结点的右指针。 [力扣原题 ↗](https://leetcode.cn/problems/flatten-binary-tree-to-linked-list/)\n\n```python\nclass TreeNode:\n    def __init__(self, val=0, left=None, right=None):\n        self.val = val\n        self.left = left\n        self.right = right\n\n\ndef flattenByPreorderStack(root):\n    if root is None:\n        return\n\n    st = [root]\n    prev = None\n    while st:\n        cur = st.pop()\n        if prev is not None:\n            prev.right = cur\n            prev.left = None\n        if cur.right is not None:\n            st.append(cur.right)\n        if cur.left is not None:\n            st.append(cur.left)\n        prev = cur\n\n    if prev is not None:\n        prev.left = None\n```\n\n#### 易错点\n\n- 入栈顺序写成先左后右，会得到根、右、左的错误链表。\n- 只重连 `right`，忘记清空 `left`。\n- 在保存左右孩子之前就改引用，导致原子树入口丢失。\n\n### 5.7 链表回文的栈辅助判断\n\n#### 适用题型\n\n- `234 回文链表` 的栈解法。\n- 只能单向遍历，但需要反向比较的链表题。\n- 空间 O(n) 可接受、优先保证思路简单的场景。\n\n#### 核心思路\n\n单链表无法从尾部向前走，可以先把前半段或全部节点值压栈，再从链表头或中点开始比较。更节省空间的写法是快慢引用找中点，同时把前半段压栈；奇数长度时跳过中间节点。\n\n关键不变量：\n\n- 快引用每次走两步，慢引用每次走一步。\n- 慢引用经过的前半段值按顺序入栈，栈顶对应靠近中点的值。\n- 比较后半段时，栈顶顺序正好是前半段的反向。\n\n#### 代码模板\n\n> **题目简述：** 234 回文链表：给定单链表头结点，判断从头到尾的结点值序列是否为回文。 [力扣原题 ↗](https://leetcode.cn/problems/palindrome-linked-list/)\n\n```python\nclass ListNode:\n    def __init__(self, val=0, next=None):\n        self.val = val\n        self.next = next\n\n\ndef isPalindromeByStack(head):\n    st = []\n    slow = head\n    fast = head\n    while fast is not None and fast.next is not None:\n        st.append(slow.val)\n        slow = slow.next\n        fast = fast.next.next\n\n    if fast is not None:\n        slow = slow.next\n\n    while slow is not None:\n        if not st or st[-1] != slow.val:\n            return False\n        st.pop()\n        slow = slow.next\n\n    return not st\n```\n\n#### 易错点\n\n- 奇数长度没有跳过中间节点，导致自己和自己错位比较。\n- 把后半段也压栈，比较方向混乱。\n- 只比较到链表结束，不检查栈是否同步为空。\n\n\n### 5.8 单调栈结算模板\n\n#### 适用题型\n\n- `739 每日温度`：找右侧第一个更大元素并计算距离。\n- `84 柱状图最大矩形`：出栈时确定当前柱子的左右更矮边界。\n- `42 接雨水`：出栈时按左右边界结算凹槽水量。\n\n#### 核心思路\n\n这三题共享同一个“右边界出现时弹栈结算”骨架。共同点是栈里存还没确定右边界的下标；当当前元素破坏栈的单调性时，被弹出的下标立刻拿到右边界，新的栈顶通常提供左边界。\n\n关键不变量：\n\n- 栈里存下标，不直接存值，因为距离、宽度都来自下标差。\n- 出栈那一刻必须完成结算，不能只弹不算。\n- 每日温度要找右侧更大，维护单调递减栈。\n- 柱状图要找右侧更小，维护单调递增栈，并用哨兵清算尾部。\n- 接雨水和每日温度一样等右侧更大，但弹出元素代表凹槽底部。\n\n#### 代码模板：共同骨架\n\n> **题目简述：** 本模板覆盖：739 每日温度（给定每日温度，返回每一天还需等待多少天才会出现更高温度，不存在则为零。）；84 柱状图中最大的矩形（给定单位宽度柱状图的各柱高度，求连续柱子可构成的最大矩形面积。）；42 接雨水（给定各柱子的高度，计算下雨后这些柱子之间能够接住的雨水总量。） [42 原题 ↗](https://leetcode.cn/problems/trapping-rain-water/) · [84 原题 ↗](https://leetcode.cn/problems/largest-rectangle-in-histogram/) · [739 原题 ↗](https://leetcode.cn/problems/daily-temperatures/)\n\n```python\ndef nextGreaterDistanceTemplate(nums):\n    ans = [0] * len(nums)\n    st = []\n    for i, num in enumerate(nums):\n        while st and num > nums[st[-1]]:\n            mid = st.pop()\n            ans[mid] = i - mid\n        st.append(i)\n    return ans\n```\n\n柱状图和接雨水只替换“破坏单调性的条件”和“弹出时的结算公式”：\n\n> **题目简述：** 本模板覆盖：739 每日温度（给定每日温度，返回每一天还需等待多少天才会出现更高温度，不存在则为零。）；84 柱状图中最大的矩形（给定单位宽度柱状图的各柱高度，求连续柱子可构成的最大矩形面积。）；42 接雨水（给定各柱子的高度，计算下雨后这些柱子之间能够接住的雨水总量。） [42 原题 ↗](https://leetcode.cn/problems/trapping-rain-water/) · [84 原题 ↗](https://leetcode.cn/problems/largest-rectangle-in-histogram/) · [739 原题 ↗](https://leetcode.cn/problems/daily-temperatures/)\n\n```python\ndef largestRectangleVariant(heights):\n    heights = list(heights)\n    heights.append(-1)\n    st = [-1]\n    ans = 0\n    for i, height in enumerate(heights):\n        while st[-1] != -1 and height \u003c heights[st[-1]]:\n            cur = st.pop()\n            ans = max(ans, heights[cur] * (i - st[-1] - 1))\n        st.append(i)\n    return ans\n\n\ndef trapRainWaterVariant(height):\n    st = []\n    ans = 0\n    for i, h in enumerate(height):\n        while st and h > height[st[-1]]:\n            bottom = st.pop()\n            if not st:\n                break\n            left = st[-1]\n            width = i - left - 1\n            bounded_height = min(height[left], h) - height[bottom]\n            ans += bounded_height * width\n        st.append(i)\n    return ans\n```\n\n#### 变形点对照\n\n| 题型 | 栈单调性 | 触发弹栈条件 | 弹出元素含义 | 结算公式 |\n|---|---|---|---|---|\n| 每日温度 | 单调递减 | `nums[i] > nums[st[-1]]` | 等到右侧更大值的位置 | `ans[mid] = i - mid` |\n| 柱状图最大矩形 | 单调递增 | `heights[i] \u003c heights[st[-1]]` | 以该柱为最矮柱 | `heights[mid] * (i - left_less_index - 1)` |\n| 接雨水 | 单调递减 | `height[i] > height[st[-1]]` | 凹槽底部 | `(min(left, right) - bottom) * width` |\n\n#### 易错点\n\n- 通用：忘记存下标，导致无法计算等待天数、矩形宽度或水槽宽度。\n- `while` 写成 `if`，一次只弹一个，漏掉连续被当前右边界结算的元素。\n- 柱状图忘记右侧哨兵，导致递增栈尾部柱子没有被清算。\n- 接雨水弹出底部后没有检查栈空，或把底部高度当成边界高度。\n\n## 6. 高频易错点清单\n\n| 易错点 | 典型题目 | 规避方式 |\n|---|---|---|\n| 栈里存了字符但题目要算长度 | `32` | 需要距离或长度时优先存下标 |\n| 右括号来时没有检查空栈 | `20`、`32` | 每次访问栈顶 `stack[-1]` 前先判断空 |\n| 最长有效括号忘记哨兵 `-1` | `32` | 栈底保存最后一个非法边界 |\n| 无效右括号没有更新边界 | `32` | 栈空后把当前下标压入作为新边界 |\n| 字符串解码没有处理多位数字 | `394` | `repeat = repeat * 10 + digit` |\n| 遇到 `]` 后只重复当前层，忘记拼回上一层 | `394` | 弹出 `{prev, times}`，令 `cur = prev + repeat(cur)` |\n| 最小栈辅助栈没有同步 pop | `155` | 主栈和辅助栈一起 push/pop |\n| 迭代中序遍历丢失右子树 | `94` | 访问弹出节点后 `cur = cur.right` |\n| 前序栈遍历入栈顺序反了 | `114` | 想先处理左，就先压右再压左 |\n| 单调栈只入栈不结算 | `42`、`84`、`739` | 破坏单调性时必须 while 出栈并更新答案 |\n\n## 7. 最短复盘口诀\n\n栈题先问“最近未完成状态是什么”。匹配存左括号，算长度存下标，嵌套存上一层上下文，最值查询存历史最值，递归模拟存待回来的节点。`20` 是匹配母题，`32` 是下标哨兵母题，`394` 是上下文母题，`155` 是辅助栈母题，`739/84/42` 是单调栈母题。\n\n\n\n================================================================================\n\n# 第12部分: 堆\n\n================================================================================\n\n> 目标：本文把 Hot100 中的堆题抽象成“动态维护极值”的可复用模板。复习时先判断要维护最大值、最小值、前 K 个元素还是数据流中位数，再选择大顶堆、小顶堆或双堆。\n\n## 1. 堆题的底层模型\n\n堆解决的是“当前最该被处理的元素是谁”。每道堆题先问五个问题：\n\n| 问题 | 如果答案是“是” | 常用处理 |\n|---|---|---|\n| 是否每次都要取当前最小元素 | K 路归并、最短候选、升序合并 | 小顶堆 |\n| 是否只关心最大的 K 个 | 第 K 大、Top K 高频 | 固定大小小顶堆 |\n| 是否只关心最小的 K 个 | 第 K 小、最小 K 个数 | 固定大小大顶堆 |\n| 是否需要动态中位数 | 数据流不断插入和查询中位数 | 大顶堆保存较小半，小顶堆保存较大半 |\n| 是否有窗口过期元素 | 滑动窗口最大值的堆写法 | 堆中保存 `{值, 下标}`，弹出过期下标 |\n\n堆题最核心的三种模型：\n\n| 模型 | 堆内元素 | 不变式 | 代表题 |\n|---|---|---|---|\n| 多路归并 | 当前候选节点 | 堆顶是所有候选中最小者 | `23` |\n| 固定大小 Top K | 当前保留的 K 个候选 | 堆顶是最弱候选，超 K 就淘汰 | `215`、`347` |\n| 双堆平衡 | 小半部分和大半部分 | 两堆大小差不超过 1，且左堆都不大于右堆 | `295` |\n\n## 2. Hot100 堆题型地图\n\n\n| 题型 | 题目 | 抽象能力 | 一句话记忆 |\n|---|---|---|---|\n| K 路归并 | `23 合并 K 个升序链表` | 每条链贡献一个当前最小候选 | 弹出最小节点后，把它的后继补进堆 |\n| 第 K 大 | `215 数组中的第 K 个最大元素` | 固定大小小顶堆或快速选择 | 堆里只留最大的 K 个，堆顶就是第 K 大 |\n| Top K 高频 | `347 前 K 个高频元素` | 哈希计数 + 固定大小堆 | 先统计频率，再用堆淘汰低频元素 |\n| 滑动窗口极值 | `239 滑动窗口最大值` | 堆保存值和下标，延迟删除过期元素 | 堆顶过期就弹，没过期就是窗口最大值 |\n| 数据流中位数 | `295 数据流的中位数` | 双堆分区和平衡 | 左堆放较小半，右堆放较大半 |\n\n## 3. 复习顺序建议\n\n建议按“单堆极值 → 固定大小 Top K → 多路归并 → 双堆设计”的顺序复习：\n\n1. `215 数组中的第 K 个最大元素`：先写固定大小小顶堆，理解“淘汰最弱候选”。\n2. `347 前 K 个高频元素`：在 `215` 基础上增加哈希计数和自定义比较。\n3. `23 合并 K 个升序链表`：理解小顶堆做多路归并。\n4. `239 滑动窗口最大值`：掌握堆的延迟删除思想，并对比单调队列更优解。\n5. `295 数据流的中位数`：掌握双堆大小平衡和顺序平衡。\n6. 回头总结 Python `heapq` 默认是小顶堆；需要大顶堆时通常存相反数，复杂元素用元组排序键。\n\n## 4. 关键套路详解\n\n### 4.1 Python heapq 默认是小顶堆\n\nPython 的 `heapq` 默认让最小值在堆顶。如果要最大值在堆顶，常用相反数：\n\n```text\nheap = []  # heapq 默认就是小顶堆\nheapq.heappush(heap, x)\nsmallest = heapq.heappop(heap)\n```\n\nPython 的 `heapq` 不接收自定义 comparator。复杂元素通常把“排序键”放在元组前面，例如 `(node.val, seq, node)`；需要大顶堆时存相反数，例如 `-x`。只有自定义对象直接入堆时，才需要谨慎实现 `__lt__`。\n\n### 4.2 固定大小堆的本质是淘汰\n\n`215` 和 `347` 都可以用固定大小堆。关键在于只保留 K 个最有竞争力的元素。\n\n| 目标 | 使用堆 | 淘汰谁 | 堆顶含义 |\n|---|---|---|---|\n| 第 K 大 | 小顶堆 | 超过 K 时淘汰当前最小 | 第 K 大 |\n| 第 K 小 | 大顶堆 | 超过 K 时淘汰当前最大 | 第 K 小 |\n| Top K 高频 | 按频率的小顶堆 | 超过 K 时淘汰最低频 | 第 K 高频的边界 |\n\n如果 K 很接近 N，堆仍然能过，但快速选择可能更优。复习堆专题时优先掌握堆法，因为模板更稳定。\n\n### 4.3 K 路归并只放“当前候选”\n\n`23 合并 K 个升序链表` 不需要把所有节点一次性放入堆。每条链表天然有序，所以每条链只需要把当前头节点作为候选放入堆。弹出某个节点后，再把它的下一个节点补进堆。\n\n这个模型也适用于合并 K 个有序数组、找有序矩阵第 K 小、多个日志流按时间合并。\n\n### 4.4 滑动窗口堆要处理过期元素\n\n`239 滑动窗口最大值` 的堆写法把 `{值, 下标}` 放进大顶堆。窗口右端推进时不断入堆，但堆里会残留已经离开窗口的旧元素。不要试图在元素过期时从堆中间删除，因为 `heapq` 不支持高效删除任意元素。\n\n正确做法是延迟删除：每次取答案前，检查堆顶下标是否还在窗口内。如果过期，就弹掉，直到堆顶有效。\n\n这道题最优解是单调队列，但堆写法仍然是理解“过期候选”的重要模板。\n\n### 4.5 数据流中位数要同时维护两个不变式\n\n`295 数据流的中位数` 需要维护两个不变式：\n\n| 不变式 | 含义 | 维护方式 |\n|---|---|---|\n| 顺序不变式 | 左堆所有元素都小于等于右堆所有元素 | 新数先按大小放入对应堆，必要时跨堆移动 |\n| 大小不变式 | 两堆大小差不超过 1 | 哪边多太多，就把堆顶移到另一边 |\n\n常见写法是让左边大顶堆 `small` 的大小等于右边小顶堆 `large`，或只比右边多 1。这样奇数个元素时中位数是 `-small[0]`，偶数个元素时是两堆顶平均值。\n\n## 5. 抽象代码模板\n\n下面模板按“动态极值维护”的模型抽象。复习时先判断要保留 Top K、合并多路候选、清理过期元素，还是用双堆维护分位点。\n\n### 5.1 固定大小堆维护 Top K\n\n#### 适用题型\n\n- `215 数组中的第 K 个最大元素`。\n- 数据流中持续保留最大的 K 个元素。\n- 求第 K 小、最小 K 个数等对称问题。\n\n#### 核心思路\n\n固定大小堆的共同抽象是“只保留 K 个强候选，堆顶永远是这 K 个候选里最弱的那个”。第 K 大和第 K 小不需要写成两套无关模板，差别只有堆的方向和淘汰谁。\n\n关键不变量：\n\n- 堆大小不超过 K。\n- 堆顶是当前保留候选中最应该被淘汰的元素。\n- 第 K 大：保留最大的 K 个，最弱候选是其中最小值，所以用小顶堆。\n- 第 K 小：保留最小的 K 个，最弱候选是其中最大值，所以用大顶堆。\n\n#### 代码模板：共同骨架\n\n> **题目简述：** 215 数组中的第 K 个最大元素：给定无序数组和 K，返回按排序名次计算的第 K 大元素，而非第 K 个不同值。 [力扣原题 ↗](https://leetcode.cn/problems/kth-largest-element-in-an-array/)\n\n```python\nimport heapq\n\n\ndef kthLargestTemplate(nums, k):\n    heap = []\n    for x in nums:\n        heapq.heappush(heap, x)\n        if len(heap) > k:\n            heapq.heappop(heap)\n    return heap[0]\n```\n\n如果题目改成第 K 小，只改堆方向，循环骨架不变：\n\n> **题目简述：** 第 K 小变形：给定整数数组和 K，返回按排序名次计算的第 K 小元素。\n\n```python\nimport heapq\n\n\ndef kthSmallestTemplate(nums, k):\n    heap = []\n    for x in nums:\n        heapq.heappush(heap, -x)\n        if len(heap) > k:\n            heapq.heappop(heap)\n    return -heap[0]\n```\n\n#### 变形点对照\n\n| 题型 | 保留谁 | 堆方向 | 超 K 时淘汰谁 | 堆顶含义 |\n|---|---|---|---|---|\n| 第 K 大 | 最大的 K 个 | 小顶堆 | 当前保留候选中最小的 | 第 K 大 |\n| 第 K 小 | 最小的 K 个 | 大顶堆 | 当前保留候选中最大的 | 第 K 小 |\n| Top K 高频 | 频率最高的 K 个 | 按频率的小顶堆 | 当前最低频候选 | 第 K 高频边界 |\n\n#### 易错点\n\n- 把所有元素都放进堆后再弹，空间退化为 O(n)。\n- 求第 K 大时堆方向写反，导致保留下来的反而是最小 K 个。\n- 只记“第 K 大用小顶堆”，不理解原因，遇到第 K 小或 Top K 高频就容易反向。\n- K 可能等于 1 或等于 n，代码仍要保持同一不变量。\n\n### 5.2 哈希计数 + 固定大小堆\n\n#### 适用题型\n\n- `347 前 K 个高频元素`。\n- 前 K 个高频单词、按权重取 Top K。\n- 需要先聚合，再按频率或分数筛选的题。\n\n#### 核心思路\n\n先用dict 把原始数组压缩为 `{元素: 频率}`，再对频率建固定大小小顶堆。堆顶代表当前 Top K 中频率最低的候选，超过 K 时弹出它。\n\n关键不变量：\n\n- 堆内元素数量不超过 K。\n- 堆顶是当前最应该被淘汰的候选。\n- 比较器必须和“谁更差”一致；有 tie-breaker 时要显式写清。\n\n#### 代码 A：桶排序原始解法\n\n> **题目简述：** 347 前 K 个高频元素：给定整数数组和 K，返回出现频率最高的 K 个元素，结果顺序不限。 [力扣原题 ↗](https://leetcode.cn/problems/top-k-frequent-elements/)\n\n```python\ndef topKFrequentByBucketTemplate(nums, k):\n    count = {}\n    for num in nums:\n        count[num] = count.get(num, 0) + 1\n\n    n = len(nums)\n    buckets = [[] for _ in range(n + 1)]\n    for num, freq in count.items():\n        buckets[freq].append(num)\n\n    res = []\n    for i in range(n, 0 - 1, -1):\n        for num in buckets[i]:\n            res.append(num)\n            if len(res) == k:\n                return res\n    return res\n```\n\n#### 代码 B：小顶堆原始解法\n\n> **题目简述：** 347 前 K 个高频元素：给定整数数组和 K，返回出现频率最高的 K 个元素，结果顺序不限。 [力扣原题 ↗](https://leetcode.cn/problems/top-k-frequent-elements/)\n\n```python\nimport heapq\nfrom collections import Counter\n\n\ndef topKFrequentTemplate(nums, k):\n    count = Counter(nums)\n    pq = []\n    for num, freq in count.items():\n        heapq.heappush(pq, (freq, num))\n        if len(pq) > k:\n            heapq.heappop(pq)\n    res = []\n    while pq:\n        res.append(heapq.heappop(pq)[1])\n    return res\n```\n\n#### 易错点\n\n- 没有先统计频率，直接对原数组建堆。\n- Python 元组会按从左到右的字段顺序比较；如果 tie-breaker 不符合题意，就要显式设计元组字段顺序。\n- 比较器写反，导致高频元素被当成“更差候选”弹出。\n\n### 5.3 自定义权重 Top K 比较器\n\n#### 适用题型\n\n- `347 前 K 个高频元素` 的多字段排序变体。\n- 前 K 个高频单词、按分数/时间/优先级取 Top K。\n- 需要 tie-breaker 的固定大小堆：频率相同按字典序、编号、时间等规则比较。\n\n#### 核心思路\n\n固定大小 Top K 的核心在于让堆顶成为当前 Top K 中最差的候选。每加入一个新候选，如果堆超过 K，就弹掉堆顶这个最差候选。自定义比较器时要先定义 `worse(a, b)`：如果 `a` 比 `b` 更应该被淘汰，则 `a` 应该浮到堆顶。\n\nPython `heapq` 的比较器方向容易反直觉：`operator()(a, b)` 返回 `True` 表示 `a` 的优先级低于 `b`，所以要让“更差候选”排在堆顶时，比较器必须围绕“谁应该被留下/淘汰”写清楚。\n\n#### 代码模板\n\n> **题目简述：** 自定义权重 Top K：给定带分数和时间戳的候选项，按指定优先级选出前 K 项。\n\n```python\nimport heapq\nfrom dataclasses import dataclass\n\n\n@dataclass\nclass Candidate:\n    value: int\n    score: int\n    timestamp: int\n\n\ndef topKByCustomWeightTemplate(items, k):\n    heap = []\n    for item in items:\n        entry = (item.score, -item.timestamp, item.value, item)\n        heapq.heappush(heap, entry)\n        if len(heap) > k:\n            heapq.heappop(heap)\n\n    ans = []\n    while heap:\n        ans.append(heapq.heappop(heap)[3].value)\n    ans.reverse()\n    return ans\n```\n\n#### 易错点\n\n- 没先定义“堆顶是最好还是最差”，导致比较器方向反复试错。\n- 多字段排序漏掉 tie-breaker，结果在同分候选上不稳定或不符合题意。\n- 固定大小堆中弹出的是“当前 Top K 中最差”的候选，这个语义必须和比较器一致。\n\n### 5.4 K 路归并小顶堆\n\n#### 适用题型\n\n- `23 合并 K 个升序链表`。\n- 合并 K 个有序数组、日志流、时间线。\n- 从多条有序序列中不断取全局最小候选。\n\n#### 核心思路\n\n每一路本身有序，所以堆里不需要放所有元素，只放每一路当前头部候选。弹出全局最小节点后，把它所在那一路的后继补进堆。\n\n关键不变量：\n\n- 堆中最多每一路一个当前候选。\n- 堆顶是所有未合并元素中当前可确定的最小值。\n- 弹出节点后必须补入它的 `next`，否则该路后续元素会丢失。\n\n#### 代码模板\n\n> **题目简述：** 23 合并 K 个升序链表：给定 K 个升序链表，合并全部结点并返回一个升序链表。 [力扣原题 ↗](https://leetcode.cn/problems/merge-k-sorted-lists/)\n\n```python\nimport heapq\n\n\nclass ListNode:\n    def __init__(self, val=0, next=None):\n        self.val = val\n        self.next = next\n\n\nclass Solution:\n    def mergeKLists(self, lists):\n        pq = []\n        order = 0\n        for head in lists:\n            if head is not None:\n                heapq.heappush(pq, (head.val, order, head))\n                order += 1\n\n        dummy = ListNode(-1)\n        cur = dummy\n        while pq:\n            _, _, node = heapq.heappop(pq)\n            if node.next is not None:\n                heapq.heappush(pq, (node.next.val, order, node.next))\n                order += 1\n            cur.next = node\n            cur = cur.next\n\n        return dummy.next\n```\n\n#### 易错点\n\n- 一次性把所有链表节点入堆，空间从 O(k) 退化为 O(n)。\n- Python 堆元素排序键设计错误，小顶堆变成大顶堆。\n- 弹出节点后忘记压入后继节点。\n\n### 5.5 滑动窗口堆 + 延迟删除\n\n#### 适用题型\n\n- `239 滑动窗口最大值` 的堆写法。\n- 带过期时间的实时最大值/最小值查询。\n- `heapq` 不能从堆中间删除，需要惰性清理的场景。\n\n#### 核心思路\n\n堆中保存 `{value, index}`。右端点每前进一步就把新元素入堆，旧元素不主动删除；每次取答案前，只检查堆顶是否已经离开窗口，若过期就不断弹出，直到堆顶有效。\n\n关键不变量：\n\n- 堆中允许存在过期元素，但答案只能来自有效堆顶。\n- 当前窗口为 `[i - k + 1, i]`，过期条件是 `index \u003c= i - k`。\n- 延迟删除只在“堆顶被需要时”清理，不试图删除堆内部元素。\n\n#### 代码模板\n\n> **题目简述：** 239 滑动窗口最大值：给定整数数组和窗口大小 K，返回窗口从左向右滑动时每个位置的最大值。 [力扣原题 ↗](https://leetcode.cn/problems/sliding-window-maximum/)\n\n```python\nimport heapq\n\n\ndef maxSlidingWindowByHeapTemplate(nums, k):\n    heap = []\n    ans = []\n    for i, num in enumerate(nums):\n        heapq.heappush(heap, (-num, i))\n        while heap and heap[0][1] \u003c= i - k:\n            heapq.heappop(heap)\n        if i >= k - 1:\n            ans.append(-heap[0][0])\n    return ans\n```\n\n#### 易错点\n\n- 取答案前没有清理过期堆顶，返回了窗口外元素。\n- 过期边界写成 `\u003c i - k`，导致刚离窗元素仍被保留。\n- 误以为堆写法是 O(n)，实际是 O(n log n)；最优解通常是单调队列。\n\n### 5.6 双堆维护数据流中位数\n\n#### 适用题型\n\n- `295 数据流的中位数`。\n- 动态插入并查询中位数或相邻分位点。\n- 需要把数据流分成较小半和较大半的设计题。\n\n#### 核心思路\n\n用大顶堆 `minHeap` 保存较小的一半，用小顶堆 `maxHeap` 保存较大的一半。约定 `len(minHeap)` 等于 `len(maxHeap)` 或只比它多 1。插入后通过跨堆移动堆顶恢复大小平衡，堆顶就能直接给出中位数。\n\n关键不变量：\n\n- 顺序不变量：`minHeap` 中所有元素都不大于 `maxHeap` 中所有元素。\n- 大小不变量：`len(min_heap) == len(max_heap)` 或 `len(min_heap) == len(max_heap) + 1`。\n- 奇数个元素时中位数为 `min_heap[0]`，偶数时为两堆顶平均。\n\n#### 代码模板\n\n> **题目简述：** 295 数据流的中位数：设计结构持续接收整数，并能随时返回当前所有数据的中位数。 [力扣原题 ↗](https://leetcode.cn/problems/find-median-from-data-stream/)\n\n```python\nimport heapq\n\n\nclass MedianFinder:\n    def __init__(self):\n        self.maxHeap = []\n        self.minHeap = []\n\n    def addNum(self, num):\n        heapq.heappush(self.maxHeap, -num)\n        heapq.heappush(self.minHeap, -heapq.heappop(self.maxHeap))\n        if len(self.minHeap) > len(self.maxHeap):\n            heapq.heappush(self.maxHeap, -heapq.heappop(self.minHeap))\n\n    def findMedian(self):\n        if len(self.maxHeap) > len(self.minHeap):\n            return float(-self.maxHeap[0])\n        return (-self.maxHeap[0] + self.minHeap[0]) / 2.0\n```\n\n#### 易错点\n\n- 只维护大小平衡，没有维护左右顺序。\n- 偶数中位数直接整数相加再除以 2，出现整数除法或溢出风险。\n- 扩展到滑动窗口中位数时，忘记普通 `heapq` 无法直接删除任意元素，需要额外延迟删除表。\n\n## 6. 高频易错点清单\n\n| 易错点 | 典型题目 | 规避方式 |\n|---|---|---|\n| Python 小顶堆比较器写反 | `23`、`215`、`347` | 小顶堆常写 直接使用 `heapq` 小顶堆 或 把节点值作为堆排序键 |\n| 第 K 大把所有元素入堆后才弹 | `215` | 固定大小为 K，超出就弹，空间 O(K) |\n| Top K 高频没有先统计频率 | `347` | 先 `dict` 计数，再对频率建堆 |\n| 元组排序维度不符合题意 | `347`、自定义 Top K | 明确 `(frequency, value)` 的字段顺序，必要时增加二级排序键 |\n| K 路归并一次性把所有节点入堆 | `23` | 每条链只放当前候选，弹出后补后继 |\n| 合并链表弹出节点后忘记压入 next | `23` | `if node.next: heapq.heappush(heap, node.next)` |\n| 滑动窗口堆顶已经过期 | `239` | 取答案前 while 弹出 `index \u003c= i - k` |\n| 数据流中位数只平衡大小，不保证顺序 | `295` | 插入时按 `-small[0]` 分堆，必要时跨堆移动 |\n| 双堆大小差超过 1 | `295` | 每次 add 后调用 rebalance |\n| 偶数中位数整数溢出或整数除法 | `295` | Python 用 `/ 2` 或 `/ 2.0` 得到浮点中位数，无需处理整数溢出 |\n\n## 7. 最短复盘口诀\n\n堆题先问“谁最该被处理”。取最小用小顶堆，取最大用大顶堆；Top K 用固定大小堆，超 K 淘汰最弱；K 路归并每路只放当前候选；窗口堆要延迟删除过期下标；中位数用双堆，左边大顶堆、右边小顶堆，大小和平衡顺序都要守住。`215/347` 是 Top K 母题，`23` 是多路归并母题，`295` 是双堆母题。\n\n\n\n================================================================================\n\n# 第13部分: 贪心\n\n================================================================================\n\n> 目标：本文把 Hot100 贪心题抽象成“局部选择为什么能推出全局最优”的复习笔记。复习时不要只背做法，必须能说清楚贪心指标、维护变量和正确性理由。\n\n## 1. 贪心题的底层模型\n\n贪心题的关键在于证明当前选择不会破坏全局最优。每道贪心题先问五个问题：\n\n| 问题           | 如果答案是“是”     | 常用处理                    |\n| ------------ | ------------ | ----------------------- |\n| 是否能维护一个最远边界  | 跳跃游戏、跳跃游戏 II | 扫描时更新 `farthest` 或当前层边界 |\n| 是否能通过双引用丢弃劣解 | 盛最多水的容器      | 移动短板，因为长板移动不可能更优        |\n| 是否按区间最右端合并   | 划分字母区间       | 先记录最后出现位置，再扩张当前段        |\n| 是否只需当前最优状态   | 股票一次买卖       | 维护历史最低价和当前最大收益          |\n| 贪心选择是否有交换论证  | 多数区间、排序题     | 证明换成局部最优不会变差            |\n\n贪心题最常见的维护对象有三类：\n\n| 维护对象 | 含义 | 代表题 |\n|---|---|---|\n| 最远可达位置 | 当前扫描范围内能到的最远下标 | `55`、`45` |\n| 当前区间右边界 | 当前必须覆盖到的位置 | `45`、`763` |\n| 一对候选边界 | 左右引用决定当前候选空间 | `11` |\n\n## 2. Hot100 贪心题型地图\n\n贪心专题覆盖 4 道典型题。`45`、`55` 同时可从动态规划理解，但复习时应优先掌握贪心写法。\n\n| 题型 | 题目 | 抽象能力 | 一句话记忆 |\n|---|---|---|---|\n| 双引用淘汰劣解 | `11 盛最多水的容器` | 判断哪一侧移动才可能变好 | 面积受短板限制，移动长板没有意义 |\n| 可达性边界 | `55 跳跃游戏` | 扫描时维护最远可达 | 一旦当前位置超过 farthest，就断档 |\n| BFS 层贪心 | `45 跳跃游戏 II` | 当前步数覆盖一层范围 | 扫到当前层末尾时必须跳一次 |\n| 区间闭合 | `763 划分字母区间` | 用字符最后位置扩张片段 | 当前段右端等于扫描位置时才能切开 |\n\n## 3. 复习顺序建议\n\n建议按“边界维护 → 层边界 → 区间闭合 → 双引用证明”的顺序复习：\n\n1. `55 跳跃游戏`：掌握 `farthest` 可达边界。\n2. `45 跳跃游戏 II`：在 `farthest` 基础上增加当前层边界 `end`。\n3. `763 划分字母区间`：练“当前段必须覆盖所有已见字符最后位置”。\n4. `11 盛最多水的容器`：练反证法和淘汰劣解。\n\n## 4. 关键套路详解\n\n### 4.1 贪心必须能说清“丢掉了什么”\n\n`11 盛最多水的容器` 中左右引用形成当前最大宽度。如果左边更矮，面积上限由左边决定。移动右引用只会让宽度变小，短板高度还没变，因此不可能得到更大面积。能产生更优解的唯一希望是移动短板。\n\n贪心每一步都安全地丢掉一批不可能成为最优解的候选。\n\n### 4.2 跳跃游戏的本质是维护覆盖范围\n\n`55` 只问能不能到达终点，所以维护一个 `farthest` 就够了。扫描到 `i` 时，如果 `i \u003c= farthest`，说明当前位置可达，可以继续更新 `farthest = max(farthest, i + nums[i])`。\n\n`45` 问最少跳几次，可以把每次跳跃看成 BFS 的一层。`end` 表示当前步数能覆盖的最右端，`farthest` 表示下一步能覆盖的最右端。扫描到 `end` 时，必须增加一步，并把下一层边界更新为 `farthest`。\n\n### 4.3 区间闭合题先找“最后一次出现”\n\n`763 划分字母区间` 的贪心选择是：当前段必须包含段内所有字符的最后出现位置。因此扫描时不断用 `last[s[i]]` 扩张右边界。当扫描位置 `i == right` 时，说明当前段内所有字符都不会再出现在后面，此时切开一定安全。\n\n这个思路也适用于很多“同类元素不能跨区间”的题。\n\n### 4.4 DP 能写不代表贪心不该写\n\n`55`、`45` 都可以写 DP，但 DP 会保留大量不必要状态。贪心本质上是把所有可达位置压缩成一个最远边界，把 BFS 队列的一层压缩成 `[start, end]` 区间。\n\n当题目只关心可达性、最少层数或区间是否闭合时，优先考虑边界压缩。\n\n## 5. 抽象代码模板\n\n下面模板以原始单题笔记的参考解法为主，再按贪心证明方式组织。每个模板都要同时回答三件事：维护什么局部状态、当前选择丢弃了哪些候选、为什么这些候选不可能产生更优解。\n\n### 5.1 最远可达边界\n\n#### 适用题型\n\n- `55 跳跃游戏`：判断是否存在一条路径到达终点。\n- 一维覆盖类问题：扫描过程中只关心“目前能覆盖到的最远位置”。\n- 只需要可达性，不需要还原具体路径的题。\n\n#### 核心思路\n\n`farthest` 表示在已经确认可达的位置中，下一步能扩展出的最远下标。只要当前下标 `i \u003c= farthest`，就说明 `i` 可达，可以用 `i + nums[i]` 更新覆盖范围；如果出现 `i > farthest`，前面的所有可达点都无法跨过断档，后续位置自然也无法被访问。\n\n贪心证明点是“边界支配”：在扫描到 `i` 之前，所有可达位置产生的后续可能性都被压缩进了一个最大的 `farthest`。保留较小可达终点不会带来额外优势，因此可以安全丢弃。\n\n#### 代码模板\n\n> **题目简述：** 55 跳跃游戏：数组元素表示当前位置的最大跳跃长度，判断能否到达最后一个下标。 [力扣原题 ↗](https://leetcode.cn/problems/jump-game/)\n\n```python\n\ndef canReachEndGreedyTemplate(nums):\n    n = len(nums)\n    farthest = 0  # 已扫描可达点能共同扩展出的最远位置\n\n    for i in range(0, n):\n        # 当前位置已经超过覆盖边界，说明前面所有选择都跨不过这个断档。\n        if i > farthest:\n            return False\n\n        # 只要 i 可达，就把从 i 出发的能力合并到全局最远边界中。\n        farthest = max(farthest, i + nums[i])\n        if farthest >= n - 1:\n            return True  # 可达性题可以提前结束，不必继续扫描。\n\n    return True\n```\n\n#### 易错点\n\n- 更新 `farthest` 前必须先判断 `i` 是否可达，否则会用不可达位置错误扩展边界。\n- `farthest` 表示“最远覆盖”，无需还原具体下一步落点。\n- 空数组、单元素数组如果题目允许出现，需要单独按题意处理。\n\n### 5.2 层边界最少跳数\n\n#### 适用题型\n\n- `45 跳跃游戏 II`：求到达终点的最少跳数，原题保证一定可达。\n- 每次操作可以把当前一批状态扩展到下一批状态，且每层代价相同的题。\n- BFS 可以做但状态是一维连续区间，适合压缩成左右边界的题。\n\n#### 核心思路\n\n把“跳一次”理解成 BFS 的一层。`end` 是当前跳数能覆盖到的右边界，`maxlength` 是遍历当前层过程中合并得到的“下一层最远覆盖边界”。扫描到 `end` 时，当前层已经处理完，若还没到终点，就必须增加一次跳跃并进入下一层。\n\n贪心证明点在于“同样跳数下，只需要保留下一层能覆盖到的最远右边界”。当前层所有可达点扩展出的下一层候选区间，被合并压缩为一个最大右边界 `maxlength`；较小覆盖边界被它支配，不会产生更少跳数。\n\n#### 代码模板\n\n> **题目简述：** 45 跳跃游戏 II：数组元素表示最大跳跃长度，在保证可达末尾时求最少跳跃次数。 [力扣原题 ↗](https://leetcode.cn/problems/jump-game-ii/)\n\n```python\ndef minJumpLayerGreedyTemplate(nums):\n    maxlength = 0  # 当前层内所有位置再跳一步后，能覆盖到的最远位置。\n    end = 0  # 当前 res 次跳跃能覆盖到的右边界。\n    res = 0\n\n    # 原始笔记强调遍历到 `len(nums) - 1` 之前即可，站到终点后不需要再跳。\n    # LeetCode 45 保证可达，所以这里不写通用不可达返回值，避免制造错误语义。\n    for i in range(0, len(nums) - 1):\n        maxlength = max(maxlength, i + nums[i])\n\n        if i == end:\n            end = maxlength\n            res += 1\n\n    return res\n```\n\n#### 变形点对照\n\n| 场景 | 是否保证可达 | 模板处理 | 备注 |\n|---|---|---|---|\n| `45` 原题 | 保证 | 不写不可达分支，按层边界计数 | 与原始笔记一致 |\n| 通用最少跳 | 不保证 | 需要在 `i == end && maxlength == end` 时判定无法继续扩展 | 不要直接套原题代码 |\n| BFS 显式写法 | 不一定 | 队列按层扩展 | 一维连续覆盖时可压缩成 `end/maxlength` |\n\n#### 易错点\n\n- 循环到 `n - 1` 容易在终点多加一次跳数。\n- `end` 和 `maxlength` 不能混用：前者是当前层边界，后者是下一层合并后的最远覆盖。\n- `45` 原题保证可达；如果自己写通用模板，必须额外处理无法扩展的断档，不要返回一个看似合法的跳数。\n\n### 5.3 双引用淘汰劣解\n\n#### 适用题型\n\n- `11 盛最多水的容器`。\n- 答案由左右边界共同决定，且每次能证明某一侧边界可以整批淘汰的题。\n- 宽度、区间长度随引用内移单调减少的候选空间题。\n\n#### 核心思路\n\n当前面积由 `min(height[left], height[right]) * width` 决定。假设左板更短，如果移动右引用，宽度只会变小，短板仍然不高于原左板，面积不可能超过当前组合；因此所有“固定左板、右端继续左移”的候选都可以被丢弃，唯一可能变好的是移动短板。\n\n贪心证明点是“反证淘汰”：被丢弃的一批候选在关键上界上不超过当前答案，所以不可能包含全局最优。\n\n#### 代码模板\n\n> **题目简述：** 11 盛最多水的容器：给定各位置的高度，选择两条竖线，使其与横轴围成的容器容量最大。 [力扣原题 ↗](https://leetcode.cn/problems/container-with-most-water/)\n\n```python\ndef maxContainerByEliminationTemplate(height):\n    left = 0\n    right = len(height) - 1\n    ans = 0\n\n    while left \u003c right:\n        width = right - left\n        shortSide = min(height[left], height[right])\n        ans = max(ans, width * shortSide)\n\n        # 移动短板：较高一侧即使保留，面积上限仍由短板决定。\n        # 原始笔记相等时走 else，即移动右指针；相等时移动任意一侧都安全。\n        if height[left] \u003c height[right]:\n            left += 1\n        else:\n            right -= 1\n\n    return ans\n```\n\n#### 易错点\n\n- 不能只说“移动短板更可能变大”，要能说明移动长板为什么一定不优。\n- 相等时移动任意一侧都可以，因为两侧都能作为当前短板被淘汰。\n- 双引用需要针对每道题重新证明移动方向。\n\n### 5.4 最后位置区间闭合\n\n#### 适用题型\n\n- `763 划分字母区间`。\n- 每个元素的全部出现必须落在同一个片段中。\n- 扫描时可以预先知道元素最后出现位置的区间切分题。\n\n#### 核心思路\n\n先记录每个字符的最后出现位置。扫描当前片段时，右边界 `right` 必须覆盖所有已出现字符的最后位置；当扫描下标 `i == right` 时，说明当前片段内的字符都不会再出现在后面，此时切开不会破坏约束。\n\n这个过程和 `45 跳跃游戏 II` 的层边界很像：扫描过程中不断扩张当前片段的最远右边界，只有当扫描引用追上边界时，当前“层/片段”才真正闭合。\n\n贪心证明点是“最早安全切分”：任何早于 `right` 的切分都会把某个已出现字符切到两个片段；而在 `right` 切分已经满足所有当前字符的闭合要求，越早切分越能给后续留下更多独立空间。\n\n#### 代码模板\n\n> **题目简述：** 763 划分字母区间：将字符串划分为尽可能多的片段，使每个字母最多出现在一个片段中，返回各段长度。 [力扣原题 ↗](https://leetcode.cn/problems/partition-labels/)\n\n```python\ndef partitionByLastOccurrenceTemplate(s):\n    last = [-1 for _ in range(26)]\n    for i in range(0, len(s)):\n        last[s[i] - 'a'] = i\n\n    ans = []\n    start = 0\n    right = 0\n\n    for i in range(0, len(s)):\n        # 当前片段必须一直扩张到所有已见字符的最后一次出现位置。\n        right = max(right, last[s[i] - 'a'])\n\n        if i == right:\n            ans.append(right - start + 1)\n            start = i + 1\n\n    return ans\n```\n\n#### 易错点\n\n- 必须先预处理最后出现位置，不能边扫边凭当前字符决定切分。\n- `right` 是当前片段的动态闭合边界，区分于固定窗口长度。\n- 字符集超出小写字母时，把数组换成 `dict[str, int]` 或离散化表。\n\n### 5.5 贪心正确性证明通用模板\n\n#### 适用题型\n\n- 面试中需要解释“为什么局部最优推出全局最优”的贪心题。\n- 排序贪心、区间贪心、边界压缩、双引用淘汰等题型的口头证明。\n\n#### 核心思路\n\n贪心代码通常很短，但证明必须补齐。常见证明方式有三种：\n\n1. 边界支配：只维护最远、最早、最小代价等代表性状态，其他状态被它支配。\n2. 交换论证：任意最优解都能把某一步替换成当前贪心选择，且答案不变差。\n3. 反证淘汰：被移动引用或被切掉的候选存在上界，不可能超过当前最优。\n\n#### 代码模板\n\n> **题目简述：** 本模板用于：面试中需要解释“为什么局部最优推出全局最优”的贪心题。；排序贪心、区间贪心、边界压缩、双引用淘汰等题型的口头证明。\n\n```python\nclass GreedyProofChecklist:\n    def __init__(self, state=\"\", choice=\"\", discarded=\"\", reason=\"\"):\n        self.state = state\n        self.choice = choice\n        self.discarded = discarded\n        self.reason = reason\n\n\ndef greedyProofIsComplete(proof):\n    if isinstance(proof, dict):\n        return all(bool(proof.get(key)) for key in (\"state\", \"choice\", \"discarded\", \"reason\"))\n    return all(bool(getattr(proof, key, \"\")) for key in (\"state\", \"choice\", \"discarded\", \"reason\"))\n```\n\n#### 易错点\n\n- “每次选当前最优”只是做法描述，不能代替证明。\n- 如果说不清丢弃了哪些候选，通常说明这题不该直接套贪心。\n- 能用 DP 写不代表不能贪心；但能压缩状态前，必须先证明压缩不会丢最优解。\n\n## 6. 高频易错点清单\n\n| 易错点 | 典型题目 | 规避方式 |\n|---|---|---|\n| 贪心理由只写“感觉最优” | 全部贪心题 | 必须说明丢弃哪些候选且不会错过答案 |\n| 跳跃游戏没有判断断档 | `55` | 遍历时先判断 `i > farthest`，再更新最远覆盖 |\n| 跳跃游戏 II 终点多跳一次 | `45` | 循环到 `n - 2` 即可，站到终点后不再跳 |\n| 跳跃游戏 II 写了错误不可达保护 | `45` 通用化 | 原题保证可达；若泛化，必须处理 `i == end && maxlength == end` 的无法扩展情况 |\n| `end` 和 `maxlength/farthest` 混用 | `45` | `end` 是当前层边界，`maxlength` 是下一层合并后的最远覆盖 |\n| 容器题移动了高板 | `11` | 面积受短板限制，移动高板只会缩宽；相等时移动任意一侧都安全，原始笔记移动右侧 |\n| 划分字母区间没预处理最后位置 | `763` | 先扫一遍记录 `last[ch]` |\n| 区间还没闭合就切开 | `763` | 只有 `i == right/end` 才能切，逻辑类似跳跃题层边界闭合 |\n| 把所有 DP 题都强行贪心 | `322`、`416` | 不能证明局部选择安全时不要贪心 |\n\n## 7. 最短复盘口诀\n\n贪心题先问维护什么边界，再问丢掉什么候选。`55` 维护最远可达，`45` 维护当前层右端和下一层最远覆盖，原题保证可达；`11` 移动短板，相等时原始写法移动右侧；`763` 像跳跃题一样等最后位置边界闭合。能证明局部选择不伤全局，才是真贪心；证明不了就回到 DP、搜索或排序模型。\n\n================================================================================\n\n# 第14部分: 动态规划\n\n================================================================================\n\n> 目标：本文把 Hot100 动态规划题抽象成若干“状态定义 + 转移方程 + 遍历顺序”的复用模板。复习时先判断状态维度，再确认依赖方向，最后决定是否能滚动压缩。\n\n## 1. 动态规划题的底层模型\n\n动态规划题的核心在于把“重复子问题”翻译成可计算状态。每道 DP 题先问六个问题：\n\n| 问题 | 如果答案是“是” | 常用处理 |\n|---|---|---|\n| 当前答案只依赖前几个位置吗 | 爬楼梯、打家劫舍、最大子数组 | 一维 DP 或滚动变量 |\n| 状态是否需要两个坐标 | 网格路径、编辑距离、LCS | 二维 DP，明确 `dp[i][j]` 语义 |\n| 是否在区间内部枚举断点 | 最长回文、回文分割 | 区间 DP 或预处理回文表 |\n| 是否在集合容量内选择物品 | 零钱兑换、完全平方数、等和子集 | 背包 DP，注意循环方向 |\n| 当前最优是否同时需要最大和最小 | 乘积最大子数组 | 维护双状态，负数会交换角色 |\n| 能否用更强的数据结构优化 | LIS、接雨水、跳跃游戏 | 二分、单调栈、贪心作为 DP 优化 |\n\nDP 的标准落地过程只有四步：\n\n| 步骤 | 要写清楚什么 | 常见错误 |\n|---|---|---|\n| 定义状态 | `dp[i]` 或 `dp[i][j]` 表示什么 | 只写变量，不写语义 |\n| 初始化 | 空串、第一行、第一列、起点 | 边界漏掉导致整体偏移 |\n| 状态转移 | 当前状态从哪些旧状态来 | 依赖未计算或覆盖旧值 |\n| 遍历顺序 | 保证依赖项已经算完 | 背包一维压缩方向写反 |\n\n## 2. Hot100 动态规划题型地图\n\n动态规划专题覆盖 23 道典型题。`45`、`55` 可兼顾贪心，`22`、`131` 可兼顾回溯，`124` 可兼顾二叉树路径贡献；这里统一放在 DP 视角下理解。\n\n| 题型       | 题目                                   | 抽象能力              | 一句话记忆                       |\n| -------- | ------------------------------------ | ----------------- | --------------------------- |\n| 线性递推     | `70 爬楼梯`、`118 杨辉三角`                  | 从前置状态推出当前状态       | 先写清 `dp[i]`，再看能否滚动          |\n| 子数组最优    | `53 最大子数组和`、`152 乘积最大子数组`、`121 买卖股票` | 以当前位置结尾的最优贡献      | 子数组必须连续，状态要以 `i` 结尾         |\n| 网格路径     | `62 不同路径`、`64 最小路径和`                 | 二维坐标依赖上方和左方       | 第一行第一列是边界主线                 |\n| 字符串双序列   | `72 编辑距离`、`1143 最长公共子序列`             | 两个前缀之间的关系         | `dp[i][j]` 表示前 `i` 和前 `j`   |\n| 单串区间/括号  | `5 最长回文子串`、`32 最长有效括号`、`131 分割回文串`   | 子串合法性和区间依赖        | 回文看两端，括号看匹配点                |\n| 单词与拆分    | `139 单词拆分`                           | 前缀能否被合法切开         | `dp[i]` 表示前 `i` 个字符是否可拆     |\n| 背包选择     | `279 完全平方数`、`322 零钱兑换`、`416 分割等和子集`  | 容量状态与物品选择         | 完全背包正序，01 背包倒序              |\n| 序列优化     | `300 最长递增子序列`                        | `O(n^2)` DP 到二分优化 | `tails[len]` 存长度为 len 的最小尾值 |\n| 树形贡献     | `124 二叉树最大路径和`                       | 向上返回单边贡献          | 答案可左右合并，返回只能单边              |\n| 贪心可替代 DP | `45 跳跃游戏 II`、`55 跳跃游戏`、`42 接雨水`      | 从 DP 依赖中提炼局部最优    | 能维护最远/最高边界就不必全量 DP          |\n\n## 3. 复习顺序建议\n\n建议按“状态最简单 → 维度增加 → 选择模型 → 优化模型”的顺序复习：\n\n1. `70`、`118`：建立递推和初始化习惯。\n2. `53`、`121`、`152`：理解“以当前位置结尾”的状态定义。\n3. `62`、`64`：掌握二维 DP 的第一行、第一列初始化。\n4. `72`、`1143`：练两个字符串前缀 DP。\n5. `5`、`32`、`131`：练单字符串区间、匹配和预处理。\n6. `139`：练前缀可行性与枚举切点。\n7. `279`、`322`、`416`：练背包模型和循环方向。\n8. `198`：练“不相邻选择”的状态转移。\n9. `300`：先写 `O(n^2)`，再用 `tails + 二分`优化。\n10. `42`、`45`、`55`：理解 DP 可被双引用或贪心压缩的场景。\n11. `124`：把树上路径当成树形 DP 贡献题复盘。\n\n## 4. 关键套路详解\n\n### 4.1 状态定义必须带“结尾”或“前缀”语义\n\n`53 最大子数组和` 的 `dp[i]` 表示“以 `i` 结尾的最大连续子数组和”。因为连续子数组如果不要求以 `i` 结尾，就无法从 `i - 1` 转移到 `i`。\n\n`72 编辑距离` 和 `1143 LCS` 的 `dp[i][j]` 一般表示两个前缀：`word1[0..i-1]` 和 `word2[0..j-1]`。前缀语义能自然处理空串，所以数组大小通常开成 `(m + 1) * (n + 1)`。\n\n### 4.2 初始化属于状态语义\n\n二维 DP 中第一行、第一列通常代表空前缀或边界路径。`72` 中 `dp[i][0] = i` 表示把长度为 `i` 的字符串删空；`64` 中第一行只能从左边来，第一列只能从上边来。\n\n如果初始化想不清楚，说明状态语义还不够精确。\n\n### 4.3 背包题先判断“物品能用几次”\n\n| 模型 | 典型题目 | 一维循环方向 | 原因 |\n|---|---|---|---|\n| 01 背包 | `416 分割等和子集` | 容量倒序 | 防止同一物品被重复使用 |\n| 完全背包 | `322 零钱兑换`、`279 完全平方数` | 容量正序 | 允许当前物品被多次使用 |\n\n`322` 求最少硬币数，状态是最小值，初始化为不可达大数。`416` 求能否凑出目标，状态是布尔值，初始化 `dp[0] = true`。\n\n### 4.4 字符串 DP 多半在比较末尾字符\n\n两个字符串前缀题通常只看最后一个字符是否相等：\n\n| 题目 | 相等时 | 不相等时 |\n|---|---|---|\n| `1143 LCS` | `dp[i][j] = dp[i - 1][j - 1] + 1` | `max(dp[i - 1][j], dp[i][j - 1])` |\n| `72 编辑距离` | `dp[i][j] = dp[i - 1][j - 1]` | 插入、删除、替换取最小再加一 |\n\n单字符串回文题则比较区间两端：`s[l] == s[r]` 且内部区间已经是回文。\n\n### 4.5 DP 优化来自观察冗余状态\n\n`300 LIS` 的 `O(n^2)` DP 很直观，但只要求长度时，可以维护 `tails`：长度为 `k` 的递增子序列尾值越小越好，因为它给后续数字留下更大空间。\n\n`55 跳跃游戏` 也能写 DP，但只需要维护当前最远可达位置 `farthest`。如果遍历到某个位置 `i > farthest`，说明中间断档，不可能继续。\n\n## 5. 抽象代码模板\n\n本节优先保留空间优化写法，避免退回泛化的二维 `dp` 表。共同题型只抽一套骨架，变形处用变量语义、初始化和转移聚合方式说明小差异。\n\n### 5.1 模板一：线性 DP 的滚动变量\n\n#### 适用题型\n\n- `70 爬楼梯`：原始解法用 `prev1 / prev2 / res` 三个变量滚动。\n- `198 打家劫舍`：原始解法用 `prev1` 表示前一位置最优，`prev2` 表示前二位置最优。\n- `53 最大子数组和`：原始笔记保留了“前缀和 - 最小前缀”和 `f = max(f, 0) + x` 两种 O(1) 写法。\n- `121 买卖股票的最佳时机`：原始解法用历史最低价压缩状态。\n\n#### 核心思路\n\n线性 DP 的空间优化前提是：当前状态只依赖少数旧状态。代码上不再创建完整 `dp` 数组，而是把旧状态命名为 `prev1`、`prev2`、`f`、`minprice` 等变量。变形差异主要在“当前状态是否必须选当前位置”：爬楼梯是方案数累加，打家劫舍是在偷与不偷之间取最大，最大子数组要求连续，股票题维护历史最小买点。\n\n#### 代码模板：共同滚动骨架\n\n> **题目简述：** 本模板覆盖：70 爬楼梯（每次可爬一阶或两阶，给定总阶数 N，求到达楼顶的不同方式数。）；198 打家劫舍（给定各房屋金额，相邻房屋不能同时偷取，求一晚可取得的最大金额。）；53 最大子数组和（给定整数数组，找出和最大的非空连续子数组并返回其和。）；121 买卖股票的最佳时机（给定每日股价，最多完成一次先买后卖，求能够获得的最大利润。） [53 原题 ↗](https://leetcode.cn/problems/maximum-subarray/) · [70 原题 ↗](https://leetcode.cn/problems/climbing-stairs/) · [121 原题 ↗](https://leetcode.cn/problems/best-time-to-buy-and-sell-stock/) · [198 原题 ↗](https://leetcode.cn/problems/house-robber/)\n\n```python\ndef rollingLinearDpStep(prev1, prev2, value, transition):\n    cur = transition(prev1, prev2, value)\n    prev2 = prev1\n    prev1 = cur\n    return prev1, prev2, cur\n```\n\n#### 原始解法 A：爬楼梯\n\n> **题目简述：** 70 爬楼梯：每次可爬一阶或两阶，给定总阶数 N，求到达楼顶的不同方式数。 [力扣原题 ↗](https://leetcode.cn/problems/climbing-stairs/)\n\n```python\ndef climbStairs(n):\n    prev1 = 1\n    prev2 = 1\n    res = 1\n    for _ in range(2, n + 1):\n        res = prev1 + prev2\n        prev2 = prev1\n        prev1 = res\n    return res\n```\n\n#### 原始解法 B：打家劫舍\n\n> **题目简述：** 198 打家劫舍：给定各房屋金额，相邻房屋不能同时偷取，求一晚可取得的最大金额。 [力扣原题 ↗](https://leetcode.cn/problems/house-robber/)\n\n```python\ndef rob(nums):\n    if len(nums) == 1:\n        return nums[0]\n\n    prev1 = max(nums[0], nums[1])\n    prev2 = nums[0]\n    res = prev1\n\n    for i in range(2, len(nums)):\n        res = max(prev1, prev2 + nums[i])\n        prev2 = prev1\n        prev1 = res\n    return res\n```\n\n#### 原始解法 C：最大子数组和\n\n> **题目简述：** 53 最大子数组和：给定整数数组，找出和最大的非空连续子数组并返回其和。 [力扣原题 ↗](https://leetcode.cn/problems/maximum-subarray/)\n\n```python\ndef maxSubArray(nums):\n    res = -float(\"inf\")\n    f = 0\n    for x in nums:\n        f = max(f, 0) + x\n        res = max(res, f)\n    return res\n```\n\n也可以按原笔记的前缀和思路理解同一件事：`sums - premin` 表示以当前前缀为右端时能得到的最大连续和。\n\n> **题目简述：** 53 最大子数组和：给定整数数组，找出和最大的非空连续子数组并返回其和。 [力扣原题 ↗](https://leetcode.cn/problems/maximum-subarray/)\n\n```python\ndef maxSubArray(nums):\n    sums = 0\n    res = -float(\"inf\")\n    premin = 0\n    for x in nums:\n        sums += x\n        res = max(res, sums - premin)\n        premin = min(premin, sums)\n    return res\n```\n\n#### 原始解法 D：股票一次交易\n\n> **题目简述：** 本模板覆盖：70 爬楼梯（每次可爬一阶或两阶，给定总阶数 N，求到达楼顶的不同方式数。）；198 打家劫舍（给定各房屋金额，相邻房屋不能同时偷取，求一晚可取得的最大金额。）；53 最大子数组和（给定整数数组，找出和最大的非空连续子数组并返回其和。）；121 买卖股票的最佳时机（给定每日股价，最多完成一次先买后卖，求能够获得的最大利润。） [53 原题 ↗](https://leetcode.cn/problems/maximum-subarray/) · [70 原题 ↗](https://leetcode.cn/problems/climbing-stairs/) · [121 原题 ↗](https://leetcode.cn/problems/best-time-to-buy-and-sell-stock/) · [198 原题 ↗](https://leetcode.cn/problems/house-robber/)\n\n```python\ndef maxProfit(prices):\n    minprice = float(\"inf\")\n    res = -float(\"inf\")\n    for x in prices:\n        minprice = min(x, minprice)\n        res = max(res, x - minprice)\n    return 0 if res == -float(\"inf\") else res\n```\n\n#### 易错点\n\n- 滚动变量更新顺序不能反：必须先算 `res/cur`，再移动 `prev2 = prev1`、`prev1 = res`。\n- 最大子数组和不能为空，`res` 要从 `-float(\"inf\")` 或 `nums[0]` 级别初始化。\n- 股票题的状态被压缩成“历史最低价 + 当前最大利润”。\n\n### 5.2 模板二：最大乘积子数组双状态\n\n#### 适用题型\n\n- `152 最大乘积子数组`：原始解法用 `cur_max / cur_min / global_max` 三个变量做 O(1) 空间优化。\n- 连续乘积类题：负数会让最大值和最小值互换角色，必须维护双状态。\n\n#### 核心思路\n\n`cur_max` 和 `cur_min` 都表示“以当前位置结尾”的乘积状态。遇到正数时最大仍可能来自旧最大，遇到负数时旧最小乘负数可能变成新最大，遇到 0 时把 `num` 本身纳入 `max/min`，自然完成重启。\n\n#### 代码模板\n\n> **题目简述：** 152 乘积最大子数组：给定整数数组，找出乘积最大的非空连续子数组并返回该乘积。 [力扣原题 ↗](https://leetcode.cn/problems/maximum-product-subarray/)\n\n```python\nclass Solution:\n    def maxProduct(self, nums):\n        if not nums: return 0\n\n        cur_max = nums[0]\n        cur_min = nums[0]\n        global_max = nums[0]\n\n        def __init__(self, i):\n            prev_max = cur_max  # 保存旧最大，避免更新 cur_max 后污染 cur_min。\n            num = nums[i]\n\n            cur_max = max([num, prev_max * num, cur_min * num])\n            cur_min = min([num, prev_max * num, cur_min * num])\n            global_max = max(global_max, cur_max)\n        return global_max\n```\n\n#### 易错点\n\n- 不能只维护最大乘积，负数会让旧最小变成新最大。\n- 只保存 `prev_max` 是因为 `cur_min` 此时还是上一轮旧值；如果先改了 `cur_min`，也必须保存旧最小。\n\n### 5.3 模板三：网格 DP 的一维压缩\n\n#### 适用题型\n\n- `62 不同路径`：原始解法直接使用 `dp = [1] * n`，空间 O(n)。\n- `64 最小路径和`：原始解法使用一维 `dp`，先初始化第一行，再逐行滚动。\n\n#### 核心思路\n\n网格题的二维状态 `dp[i][j]` 只依赖上方和左方，因此可以压缩成一行：进入当前行时，`dp[j]` 还是“上方”的值；本轮更新后的 `dp[j - 1]` 是“左方”的值。不同路径是相加，最小路径和是取最小后加当前格子。\n\n#### 原始解法 A：不同路径\n\n> **题目简述：** 62 不同路径：机器人位于网格左上角且只能向右或向下，求到右下角的不同路径数。 [力扣原题 ↗](https://leetcode.cn/problems/unique-paths/)\n\n```python\nclass Solution:\n    def uniquePaths(self, m, n):\n        # 第一行每个位置只有一种走法，直接初始化为 1。\n        dp = [1 for _ in range(n)]\n        def __init__(self, i):\n            def __init__(self, j):\n                # dp[j] 是上方，dp[j - 1] 是左方。\n                dp[j] = dp[j] + dp[j - 1]\n        return dp[n - 1]\n```\n\n#### 原始解法 B：最小路径和\n\n> **题目简述：** 64 最小路径和：给定非负网格，只能向右或向下移动，求左上到右下的最小路径和。 [力扣原题 ↗](https://leetcode.cn/problems/minimum-path-sum/)\n\n```python\ndef minPathSum(grid):\n    m = len(grid)\n    n = len(grid[0])\n    dp = [0] * n\n\n    dp[0] = grid[0][0]\n    for j in range(1, n):\n        dp[j] = dp[j - 1] + grid[0][j]\n\n    for i in range(1, m):\n        dp[0] += grid[i][0]\n        for j in range(1, n):\n            dp[j] = min(dp[j], dp[j - 1]) + grid[i][j]\n    return dp[n - 1]\n```\n\n原笔记还给了带哨兵的一维写法，本质是用 `float(\"inf\")` 消掉第一列特判：\n\n> **题目简述：** 64 最小路径和：给定非负网格，只能向右或向下移动，求左上到右下的最小路径和。 [力扣原题 ↗](https://leetcode.cn/problems/minimum-path-sum/)\n\n```python\nclass Solution:\n    def minPathSum(self, grid):\n        n = len(grid[0])\n        f = [float('inf') for _ in range(n + 1)]\n        f[1] = 0\n        def __init__(self, grid):\n            def __init__(self, j):\n                f[j + 1] = min(f[j], f[j + 1]) + row[j]\n        return f[n]\n```\n\n#### 易错点\n\n- 一维压缩时 `dp[j]` 和 `dp[j - 1]` 的时间含义不同：前者是上一行，后者是当前行左边。\n- 最小路径和不能把不存在方向当作 0，否则边界会被错误压低。\n- `uniquePaths` 的 `m / n` 是行列数量，答案是 `dp[n - 1]`，避免写成 `dp[n]`。\n\n### 5.4 模板四：双字符串前缀 DP 的一维压缩\n\n#### 适用题型\n\n- `1143 最长公共子序列`：原始解法使用一维 `dp(n + 1)`，通过 `pre/temp` 保存左上角。\n- `72 编辑距离`：原始解法同样压缩到一维，通过 `prev/temp` 保存 `dp[i-1][j-1]`。\n\n#### 核心思路\n\n双字符串 DP 的二维依赖通常有三个方向：上方 `dp[i-1][j]`、左方 `dp[i][j-1]`、左上方 `dp[i-1][j-1]`。压缩为一维后：\n但是我后面觉得，感觉这个没必要压缩了，不压缩多简单，一压缩怎么看都费劲。都贴在这边吧。\n```python\ndef lcsTemplate(a, b):\n    m = len(a)\n    n = len(b)\n    dp = [[0] * (n + 1) for _ in range(m + 1)]\n\n    for i in range(1, m + 1):\n        for j in range(1, n + 1):\n            if a[i - 1] == b[j - 1]:\n                dp[i][j] = dp[i - 1][j - 1] + 1\n            else:\n                dp[i][j] = max(dp[i - 1][j], dp[i][j - 1])\n    return dp[m][n]\n\n\ndef editDistanceTemplate(a, b):\n    m = len(a)\n    n = len(b)\n    dp = [[0] * (n + 1) for _ in range(m + 1)]\n\n    for i in range(m + 1):\n        dp[i][0] = i\n    for j in range(n + 1):\n        dp[0][j] = j\n\n    for i in range(1, m + 1):\n        for j in range(1, n + 1):\n            if a[i - 1] == b[j - 1]:\n                dp[i][j] = dp[i - 1][j - 1]\n            else:\n                dp[i][j] = min(dp[i - 1][j], dp[i][j - 1], dp[i - 1][j - 1]) + 1\n    return dp[m][n]\n```\n\n| 二维位置 | 一维变量 |\n|---|---|\n| 上方 `dp[i-1][j]` | 进入本轮内层循环前的 `dp[j]` |\n| 左方 `dp[i][j-1]` | 已经更新过的 `dp[j - 1]` |\n| 左上 `dp[i-1][j-1]` | 手动保存的 `pre/prev` |\n\n#### 原始解法 A：最长公共子序列\n\n> **题目简述：** 1143 最长公共子序列：给定两个字符串，求二者保持字符相对顺序但不要求连续的最长公共子序列长度。 [力扣原题 ↗](https://leetcode.cn/problems/longest-common-subsequence/)\n\n```python\ndef longestCommonSubsequence(text1, text2):\n    m = len(text1)\n    n = len(text2)\n    dp = [0] * (n + 1)\n\n    for i in range(1, m + 1):\n        pre = dp[0]\n        for j in range(1, n + 1):\n            temp = dp[j]\n            if text1[i - 1] == text2[j - 1]:\n                dp[j] = pre + 1\n            else:\n                dp[j] = max(dp[j], dp[j - 1])\n            pre = temp\n    return dp[n]\n```\n\n#### 原始解法 B：编辑距离\n\n> **题目简述：** 72 编辑距离：给定两个单词，求通过插入、删除或替换字符将前者变为后者的最少操作数。 [力扣原题 ↗](https://leetcode.cn/problems/edit-distance/)\n\n```python\ndef minDistance(word1, word2):\n    m = len(word1)\n    n = len(word2)\n    dp = list(range(n + 1))\n\n    for i in range(1, m + 1):\n        prev = dp[0]\n        dp[0] = i\n        for j in range(1, n + 1):\n            temp = dp[j]\n            if word1[i - 1] == word2[j - 1]:\n                dp[j] = prev\n            else:\n                dp[j] = 1 + min(dp[j], dp[j - 1], prev)\n            prev = temp\n    return dp[n]\n```\n\n#### 易错点\n\n- `pre/prev` 必须在覆盖 `dp[j]` 前保存；内层循环末尾再更新为 `temp`。\n- 编辑距离每一行开始都要先把 `dp[0]` 改成 `i`，否则第一列仍停留在上一行。\n- LCS 的 `dp[j - 1]` 是当前行左边，`dp[j]` 是上一行上方，二者语义不能混。\n\n### 5.5 模板五：单串区间、括号与切分\n\n#### 适用题型\n\n- `5 最长回文子串`：原始解法使用二维回文表，从右下向左上遍历。\n- `32 最长有效括号`：原始笔记同时保留 DP 写法和栈哨兵写法。\n- `131 分割回文串`：原始解法使用 `huiwen(left, right)` 即时判断 + 回溯，未使用预处理表。\n\n#### 核心思路\n\n单串题的关键是“区间是否有效”。最长回文子串用 `dp[i][j]` 表示 `s[i..j]` 是否为回文；最长有效括号用 `dp[i]` 表示以 `i` 结尾的最长有效括号长度；回文切分则把“判断一段是否回文”作为 DFS 的合法性检查。\n\n#### 原始解法 A：最长回文子串\n\n> **题目简述：** 5 最长回文子串：给定字符串，返回其中长度最长的连续回文子串。 [力扣原题 ↗](https://leetcode.cn/problems/longest-palindromic-substring/)\n\n```python\ndef longestPalindrome(s):\n    n = len(s)\n    if n \u003c 2:\n        return s\n    dp = [[False] * n for _ in range(n)]\n    start = 0\n    max_len = 1\n    for i in range(n):\n        dp[i][i] = True\n    for length in range(2, n + 1):\n        for left in range(n - length + 1):\n            right = left + length - 1\n            if s[left] == s[right] and (length \u003c= 3 or dp[left + 1][right - 1]):\n                dp[left][right] = True\n                if length > max_len:\n                    start = left\n                    max_len = length\n    return s[start:start + max_len]\n```\n\n#### 原始解法 B：最长有效括号 DP\n\n> **题目简述：** 32 最长有效括号：给定仅含左右圆括号的字符串，求最长连续合法括号子串的长度。 [力扣原题 ↗](https://leetcode.cn/problems/longest-valid-parentheses/)\n\n```python\ndef longestValidParentheses(s):\n    n = len(s)\n    if n \u003c 2:\n        return 0\n\n    dp = [0] * n\n    maxlen = 0\n\n    for i in range(1, n):\n        if s[i] == \")\":\n            if s[i - 1] == \"(\":\n                dp[i] = (dp[i - 2] if i >= 2 else 0) + 2\n            elif i - dp[i - 1] - 1 >= 0 and s[i - dp[i - 1] - 1] == \"(\":\n                match = i - dp[i - 1] - 1\n                dp[i] = dp[i - 1] + 2 + (dp[match - 1] if match - 1 >= 0 else 0)\n        maxlen = max(maxlen, dp[i])\n    return maxlen\n```\n\n#### 原始解法 C：回文切分\n\n> **题目简述：** 本模板覆盖：5 最长回文子串（给定字符串，返回其中长度最长的连续回文子串。）；32 最长有效括号（给定仅含左右圆括号的字符串，求最长连续合法括号子串的长度。）；131 分割回文串（将给定字符串切分成若干子串，返回每段都是回文串的全部切分方案。） [5 原题 ↗](https://leetcode.cn/problems/longest-palindromic-substring/) · [32 原题 ↗](https://leetcode.cn/problems/longest-valid-parentheses/) · [131 原题 ↗](https://leetcode.cn/problems/palindrome-partitioning/)\n\n```python\ndef huiwen(s, left, right):\n    while left \u003c right:\n        if s[left] != s[right]:\n            return False\n        left += 1\n        right -= 1\n    return True\n\n\ndef partition(s):\n    res = []\n    path = []\n\n    def dfs(start):\n        if start == len(s):\n            res.append(path[:])\n            return\n\n        for i in range(start, len(s)):\n            if huiwen(s, start, i):\n                path.append(s[start:i + 1])\n                dfs(i + 1)\n                path.pop()\n\n    dfs(0)\n    return res\n```\n\n#### 原始解法 D：最长有效括号栈哨兵\n\n> **题目简述：** 32 最长有效括号：给定仅含左右圆括号的字符串，求最长连续合法括号子串的长度。 [力扣原题 ↗](https://leetcode.cn/problems/longest-valid-parentheses/)\n\n```python\ndef longestValidParentheses(s):\n    max_len = 0\n    st = [-1]\n\n    for i, ch in enumerate(s):\n        if ch == \"(\":\n            st.append(i)\n        else:\n            st.pop()\n            if not st:\n                st.append(i)\n            else:\n                max_len = max(max_len, i - st[-1])\n    return max_len\n```\n\n#### 易错点\n\n- 最长回文子串的遍历顺序不能随意改：`dp[i][j]` 依赖更内层的 `dp[i + 1][j - 1]`。\n- 最长有效括号第二种转移里，匹配左括号下标是 `i - dp[i - 1] - 1`。\n- 栈哨兵 `-1` 是“墙”，栈空时要把当前右括号下标压入作为新墙。\n- 回文切分原始写法没有预处理表，复杂度更高但代码直观；如果改成预处理表，必须标明这是优化版，与原始参考解法区分。\n\n### 5.6 模板六：一维背包 DP\n\n#### 适用题型\n\n- `322 零钱兑换`：原始解法是一维完全背包，`dp[j]` 表示凑出金额 `j` 的最少硬币数。\n- `279 完全平方数`：原始解法也是一维完全背包，物品重量是 `i * i`。\n- `416 分割等和子集`：原始解法是一维 01 背包，容量必须倒序。\n\n#### 核心思路\n\n背包压缩后只保留容量维度。完全背包允许同一物品重复使用，所以容量正序；01 背包每个物品只能用一次，所以容量倒序。求最小数量时用大数初始化；求可行性时用布尔状态，`dp[0] = true` 表示什么都不选即可凑出 0。\n\n关于先遍历背包容量还是先遍历物品的问题：\n\n这取决于两个关键要素：**这是 01 背包还是完全背包？** 以及 **题目到底让你求什么？**\n\n给你一个最清晰的终极定论，我们分情况来看：\n##### 1. 01 背包\n\n**结论：必须先遍历物品（外层），再倒序遍历容量（内层）。绝对不能反过来！**\n\n- **为什么不能先遍历容量？**\n    在一维 `dp` 数组中，我们利用倒序遍历容量来保证“每个物品只被使用一次”。\n    如果你把容量放在外层循环（`for j = target down to 0`），物品放在内层循环（`for i in range(len(nums))`），当你计算 `dp[j]` 时，你试图复用 `dp[j - nums[i]]` 的状态。但是此时的 `dp[j - nums[i]]` 已经在之前的容量外循环中，被**所有的物品**更新过了。这就导致同一个物品被重复放入背包，01 背包直接变成了完全背包。\n    \n---\n##### 2. 完全背包 - 求最值 / 可行性（例如 322 零钱兑换、279 完全平方数）\n**结论：内外层循环顺序无所谓！谁先谁后都可以。**\n- **为什么无所谓？**\n    在这两道题中，题目问的是“最少需要多少个硬币/完全平方数”。我们不在乎硬币是怎么组合的，是 `[1, 2]` 还是 `[2, 1]` 对我们来说都是 2 个硬币。\n    - **外层物品，内层容量（你的模板写法）：** 意思是“我先拿着面值 1 的硬币，去尝试更新所有的容量；然后我再拿着面值 2 的硬币，去更新所有的容量”。\n    - **外层容量，内层物品（反向写法）：** 意思是“我想凑出容量 1，我挨个试试所有的硬币；我想凑出容量 2，我再挨个试试所有的硬币”。\n        由于物品可以无限次使用，这两种遍历方式都能覆盖所有可能的状态，最终求得的最小值是一模一样的。你可以自己去力扣 322 题把两个 `for` 循环换个位置，一样能 AC。\n        \n---\n##### 3. 完全背包 - 求方案数（真正的易错大坑）\n虽然你上面列的题目里没有，但这是面试最喜欢考的变形。一旦遇到求**方案数（有多少种方法凑出容量）**，循环顺序将决定生死。\n- **情况 A：求组合数（不强调顺序，`{1, 2}` 和 `{2, 1}` 算同一种方法）**\n    - **典型题目：** 力扣 518. 零钱兑换 II\n    - **结论：必须先遍历物品，再遍历容量。**\n    - **解释：** 当你先遍历物品时，你是先用硬币 1 铺满整个 `dp` 数组，然后再用硬币 2 去叠加。这意味着你的方案里，硬币永远是按 `[1, 1, 2, 2]` 这种严格顺序出现的，绝不可能出现 `[2, 1]` 这种逆序组合。因此它求出来的天然就是**组合数**。\n- **情况 B：求排列数（强调顺序，`{1, 2}` 和 `{2, 1}` 算两种不同的方法）**\n    - **典型题目：** 力扣 377. 组合总和 Ⅳ\n    - **结论：必须先遍历容量，再遍历物品。**\n    - **解释：** 把容量放在外层，意味着你在思考：“为了凑出容量 5，如果我最后一步放的是硬币 1，方案数就是 `dp[4]`；如果最后一步放的是硬币 2，方案数就是 `dp[3]`”。这种逻辑天然就在穷举所有的排列顺序，所以它求出来的是**排列数**。\n\n\n| **背包类型**  | **题目诉求**         | **外层循环** | **内层循环 (容量方向)** |\n| --------- | ---------------- | -------- | --------------- |\n| **01 背包** | 求最值 / 可行性        | **物品**   | **容量 (必须倒序)**   |\n| **完全背包**  | 求最值 / 可行性        | **物品**
