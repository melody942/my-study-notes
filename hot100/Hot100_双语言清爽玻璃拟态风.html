      c: new Set('auto break case char const continue default do double else enum extern float for goto if inline int long register restrict return short signed sizeof static struct switch typedef union unsigned void volatile while'.split(' ')),
      java: new Set('abstract assert boolean break byte case catch char class const continue default do double else enum extends final finally float for goto if implements import instanceof int interface long native new package private protected public return short static strictfp super switch synchronized this throw throws transient try void volatile while'.split(' ')),
      javascript: new Set('async await break case catch class const continue debugger default delete do else export extends finally for from function get if import in instanceof let new of return set static super switch this throw try typeof var void while with yield'.split(' ')),
      typescript: new Set('abstract any as async await boolean break case catch class const constructor continue debugger declare default delete do else enum export extends finally for from function get if implements import in infer instanceof interface keyof let module namespace never new of private protected public readonly require return set static string super switch symbol this throw try type typeof var void while with yield'.split(' ')),
      python: new Set('and as assert async await break class continue def del elif else except False finally for from global if import in is lambda None nonlocal not or pass raise return True try while with yield'.split(' ')),
      sql: new Set('add all alter and any as asc backup between by case check column constraint create database default delete desc distinct drop exec exists foreign from full group having in index inner insert into is join key left like limit not null on or order outer primary procedure right rownum select set table top truncate union unique update values view where'.split(' ')),
      bash: new Set('case do done elif else esac export fi for function if in local readonly return select shift then until while'.split(' '))
    };

    const HIGHLIGHT_TYPES = new Set('Array Boolean Callable Character Collection Comparator Deque Dict Double Exception Float HashMap HashSet Integer Iterable Iterator List ListNode Long Map Math Node Number Object Optional Pair PriorityQueue Queue Set Stack String StringBuilder StringBuffer TreeMap TreeNode TreeSet Vector array bool boolean char char32_t char16_t deque dict double float int integer list long map number object pair priority_queue queue set short size_t stack string unordered_map unordered_set vector void'.split(' '));
    const HIGHLIGHT_CONSTANTS = new Set('False True false true null nullptr None self super this undefined NaN Infinity'.split(' '));

    function normalizeCodeLanguage(raw) {
      const label = String(raw || '').trim().split(/\s+/)[0].replace(/^language-/, '').toLowerCase();
      return LANGUAGE_ALIASES[label] || label || 'text';
    }

    function isHighlightableLanguage(lang) {
      return !['text', 'plain', 'plaintext', 'txt', 'output'].includes(lang);
    }

    function spanToken(className, value) {
      return `<span class="${className}">${escapeHtml(value)}</span>`;
    }

    function isIdentifierStart(ch) {
      return /[A-Za-z_$]/.test(ch || '');
    }

    function isIdentifierPart(ch) {
      return /[A-Za-z0-9_$]/.test(ch || '');
    }

    function isAtLogicalLineStart(source, index) {
      const lineStart = source.lastIndexOf('\n', index - 1) + 1;
      return source.slice(lineStart, index).trim() === '';
    }

    function keywordSetForLanguage(lang) {
      const keywords = new Set(HIGHLIGHT_KEYWORDS.common);
      (HIGHLIGHT_KEYWORDS[lang] || []).forEach(item => keywords.add(item));
      return keywords;
    }

    function highlightCode(sourceCode, rawLang) {
      const source = String(sourceCode || '');
      const lang = normalizeCodeLanguage(rawLang);
      if (!source || !isHighlightableLanguage(lang)) return escapeHtml(source);

      const keywords = keywordSetForLanguage(lang);
      let html = '';
      let i = 0;
      let bracketDepth = 0;

      while (i < source.length) {
        const ch = source[i];
        const two = source.slice(i, i + 2);

        if ((lang === 'cpp' || lang === 'c') && ch === '#' && isAtLogicalLineStart(source, i)) {
          const end = source.indexOf('\n', i);
          const next = end === -1 ? source.length : end;
          html += spanToken('tok-meta', source.slice(i, next));
          i = next;
          continue;
        }

        if ((lang === 'python' || lang === 'bash') && ch === '#') {
          const end = source.indexOf('\n', i);
          const next = end === -1 ? source.length : end;
          html += spanToken('tok-comment', source.slice(i, next));
          i = next;
          continue;
        }

        if (lang === 'sql' && two === '--') {
          const end = source.indexOf('\n', i);
          const next = end === -1 ? source.length : end;
          html += spanToken('tok-comment', source.slice(i, next));
          i = next;
          continue;
        }

        if (two === '//' && !['python', 'sql', 'bash'].includes(lang)) {
          const end = source.indexOf('\n', i);
          const next = end === -1 ? source.length : end;
          html += spanToken('tok-comment', source.slice(i, next));
          i = next;
          continue;
        }

        if (two === '/*') {
          const end = source.indexOf('*/', i + 2);
          const next = end === -1 ? source.length : end + 2;
          html += spanToken('tok-comment', source.slice(i, next));
          i = next;
          continue;
        }

        if (ch === '"' || ch === "'" || ch === '`') {
          const quote = ch;
          const triple = lang === 'python' && (source.slice(i, i + 3) === quote.repeat(3));
          let j = i + (triple ? 3 : 1);
          while (j < source.length) {
            if (source[j] === '\\') { j += 2; continue; }
            if (triple && source.slice(j, j + 3) === quote.repeat(3)) { j += 3; break; }
            if (!triple && source[j] === quote) { j += 1; break; }
            if (!triple && quote !== '`' && source[j] === '\n') break;
            j += 1;
          }
          html += spanToken('tok-string', source.slice(i, j));
          i = j;
          continue;
        }

        if (/\d/.test(ch) && (i === 0 || !isIdentifierPart(source[i - 1]))) {
          const numberMatch = /^(?:0[xX][0-9a-fA-F]+|0[bB][01]+|\d+(?:\.\d+)?(?:[eE][+-]?\d+)?)(?:[uUlLfF]+)?/.exec(source.slice(i));
          if (numberMatch) {
            html += spanToken('tok-number', numberMatch[0]);
            i += numberMatch[0].length;
            continue;
          }
        }

        if (isIdentifierStart(ch)) {
          let j = i + 1;
          while (j < source.length && isIdentifierPart(source[j])) j += 1;
          const token = source.slice(i, j);
          const hasCallShape = /^\s*[\(\[\{]/.test(source.slice(j));
          let className = 'tok-variable';
          if (keywords.has(token)) className = 'tok-keyword';
          else if (HIGHLIGHT_CONSTANTS.has(token)) className = 'tok-constant';
          else if (HIGHLIGHT_TYPES.has(token) || /^[A-Z][A-Za-z0-9_]*$/.test(token)) className = 'tok-type';
          else if (hasCallShape) className = 'tok-function';
          html += spanToken(className, token);
          i = j;
          continue;
        }

        if ('(){}[]'.includes(ch)) {
          const closing = ')}]'.includes(ch);
          if (!closing) bracketDepth += 1;
          const colorIndex = ((Math.max(bracketDepth, 1) - 1) % 6) + 1;
          html += spanToken(`tok-bracket tok-bracket-${colorIndex}`, ch);
          if (closing) bracketDepth = Math.max(0, bracketDepth - 1);
          i += 1;
          continue;
        }

        if (/[+\-*\/%=!<>&|^~?:.]/.test(ch)) {
          html += spanToken('tok-operator', ch);
          i += 1;
          continue;
        }

        if (/[,;]/.test(ch)) {
          html += spanToken('tok-punctuation', ch);
          i += 1;
          continue;
        }

        html += escapeHtml(ch);
        i += 1;
      }

      return html;
    }

    function escapeRegex(value) {
      return String(value).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    }

    function stripMarkdown(value) {
      return String(value || '')
        .replace(/```[\s\S]*?```/g, ' ')
        .replace(/`([^`]+)`/g, '$1')
        .replace(/!\[[^\]]*\]\([^)]*\)/g, '')
        .replace(/\[([^\]]+)\]\([^)]*\)/g, '$1')
        .replace(/^#{1,6}\s+/gm, '')
        .replace(/[>*_~`]/g, '')
        .replace(/\s+/g, ' ')
        .trim();
    }

    function getSearchableMarkdownText(value) {
      const markdownWithCode = String(value || '').replace(/^```[^\n]*$/gm, ' ');
      return stripMarkdown(markdownWithCode);
    }

    function slugify(text, prefix, index) {
      const base = stripMarkdown(text).toLowerCase()
        .replace(/[^\u4e00-\u9fa5a-z0-9]+/gi, '-')
        .replace(/^-+|-+$/g, '')
        .slice(0, 70) || 'section';
      return `${prefix}-${index}-${base}`;
    }

    function normalizeTitle(line) {
      return stripMarkdown(line.replace(/^#{1,6}\s*/, '').replace(/\s+#+\s*$/, ''));
    }

    function cleanDecorativeLines(lines) {
      const copy = [...lines];
      while (copy.length && (!copy[0].trim() || /^={5,}\s*$/.test(copy[0]) || /^-{3,}\s*$/.test(copy[0]))) copy.shift();
      while (copy.length && (!copy[copy.length - 1].trim() || /^={5,}\s*$/.test(copy[copy.length - 1]) || /^-{3,}\s*$/.test(copy[copy.length - 1]))) copy.pop();
      return copy;
    }

    function splitIntoParts(md) {
      const lines = md.replace(/\r\n/g, '\n').split('\n');
      const markers = [];
      lines.forEach((line, lineIndex) => {
        const partMatch = /^#{0,2}\s*第\d+部分[:：].+\s*$/.exec(line.trim());
        if (partMatch) markers.push({ lineIndex, title: normalizeTitle(line) });
      });

      if (!markers.length) {
        lines.forEach((line, lineIndex) => {
          if (/^#\s+.+/.test(line)) markers.push({ lineIndex, title: normalizeTitle(line) });
        });
      }

      if (!markers.length) {
        return [{
          id: 'part-1',
          index: 0,
          title: '完整笔记',
          markdown: md,
          text: stripMarkdown(md),
          searchText: getSearchableMarkdownText(md),
          startLine: 0,
          endLine: lines.length
        }];
      }

      const result = [];
      if (markers[0].lineIndex > 0) {
        const introMarkdown = cleanDecorativeLines(lines.slice(0, markers[0].lineIndex)).join('\n').trim();
        if (introMarkdown) {
          result.push({
            id: 'part-1',
            index: 0,
            title: '总览与速查',
            markdown: introMarkdown,
            text: stripMarkdown('总览与速查\n' + introMarkdown),
            searchText: getSearchableMarkdownText('总览与速查\n' + introMarkdown),
            startLine: 0,
            endLine: markers[0].lineIndex
          });
        }
      }

      markers.forEach((marker, markerIndex) => {
        const next = markers[markerIndex + 1]?.lineIndex ?? lines.length;
        const bodyLines = cleanDecorativeLines(lines.slice(marker.lineIndex + 1, next));
        const partMarkdown = bodyLines.join('\n');
        const index = result.length;
        result.push({
          id: `part-${index + 1}`,
          index,
          title: marker.title,
          markdown: partMarkdown,
          text: stripMarkdown(marker.title + '\n' + partMarkdown),
          searchText: getSearchableMarkdownText(marker.title + '\n' + partMarkdown),
          startLine: marker.lineIndex,
          endLine: next
        });
      });

      return result;
    }

    function extractLocalHeadings(md) {
      const lines = md.replace(/\r\n/g, '\n').split('\n');
      const h2 = [];
      const h3 = [];
      let index = 0;
      lines.forEach((line) => {
        const match = /^(#{2,3})\s+(.+?)(?:\s+#+)?\s*$/.exec(line);
        if (!match) return;
        const level = match[1].length;
        const title = normalizeTitle(match[2]);
        const item = { id: slugify(title, 'sec', index), level, title };
        if (level === 2) h2.push(item);
        else h3.push(item);
        index += 1;
      });
      return h2.length ? h2 : h3.slice(0, 24);
    }

    function normalizePreviewText(value) {
      return stripMarkdown(value).replace(/\s+/g, ' ').trim();
    }

    function extractPartPreview(part) {
      const lines = part.markdown.replace(/\r\n/g, '\n').split('\n');
      const targetIndex = lines.findIndex(line => {
        const text = normalizePreviewText(line);
        return text.startsWith('目标：') || text.startsWith('目标:');
      });

      if (targetIndex >= 0) {
        const paragraph = [];
        for (let i = targetIndex; i < lines.length; i += 1) {
          const clean = lines[i].trim();
          if (i > targetIndex && (!clean || /^#{1,6}\s+/.test(clean) || /^={5,}\s*$/.test(clean) || /^-{3,}\s*$/.test(clean))) break;
          paragraph.push(clean.replace(/^>\s?/, ''));
        }
        const preview = normalizePreviewText(paragraph.join(' '));
        if (preview) return preview;
      }

      const quoteLine = lines.find(line => /^>\s?/.test(line.trim()));
      if (quoteLine) {
        const preview = normalizePreviewText(quoteLine.replace(/^>\s?/, ''));
        if (preview) return preview;
      }

      const fallbackLine = lines.find(line => {
        const clean = line.trim();
        return clean && !/^#{1,6}\s+/.test(clean) && !/^={5,}\s*$/.test(clean) && !/^-{3,}\s*$/.test(clean) && !clean.includes('|');
      });
      return normalizePreviewText(fallbackLine || part.text).slice(0, 180) || '本部分暂无摘要。';
    }

    function renderInline(value) {
      let s = escapeHtml(value);
      s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
      s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
      s = s.replace(/__([^_]+)__/g, '<strong>$1</strong>');
      s = s.replace(/~~([^~]+)~~/g, '<del>$1</del>');
      s = s.replace(/(^|[^*])\*([^*]+)\*/g, '$1<em>$2</em>');
      s = s.replace(/\[([^\]]+)\]\(([^\s)]+)(?:\s+&quot;[^&]*&quot;)?\)/g, (_, text, url) => {
        if (url.startsWith('#')) return `<a href="${url}">${text}</a>`;
        return `<a href="${url}" target="_blank" rel="noreferrer">${text}</a>`;
      });
      return s;
    }

    function splitTableRow(line) {
      return line.trim().replace(/^\|/, '').replace(/\|$/, '').split('|').map(cell => cell.trim());
    }

    function isTableSeparator(line) {
      return /^\s*\|?(\s*:?-{3,}:?\s*\|)+\s*:?-{3,}:?\s*\|?\s*$/.test(line);
    }

    function extractCodeBlocks(md) {
      const lines = String(md || '').replace(/\r\n/g, '\n').split('\n');
      const blocks = [];
      let inCode = false;
      let language = '';
      let buffer = [];

      lines.forEach(line => {
        const fence = /^```\s*([^`]*)\s*$/.exec(line);
        if (!fence) {
          if (inCode) buffer.push(line);
          return;
        }
        if (!inCode) {
          inCode = true;
          language = fence[1] || '';
          buffer = [];
          return;
        }
        blocks.push({ language, code: buffer.join('\n') });
        inCode = false;
        language = '';
        buffer = [];
      });

      if (inCode) blocks.push({ language, code: buffer.join('\n') });
      return blocks;
    }

    function renderCodeCard(fallbackBlock, pairedCodeBlocks, codeIndex) {
      const variants = new Map();
      ['cpp', 'python'].forEach(documentLanguage => {
        const block = pairedCodeBlocks?.[documentLanguage]?.[codeIndex];
        if (!block) return;
        const language = normalizeCodeLanguage(block.language);
        if (language === 'cpp' || language === 'python') {
          variants.set(language, { language, code: block.code });
        }
      });

      const fallbackLanguage = normalizeCodeLanguage(fallbackBlock.language);
      if (!variants.size || ((fallbackLanguage === 'cpp' || fallbackLanguage === 'python') && !variants.has(fallbackLanguage))) {
        variants.set(fallbackLanguage, { language: fallbackLanguage, code: fallbackBlock.code });
      }

      const entries = Array.from(variants.values());
      const isBilingual = variants.has('cpp') && variants.has('python');
      const codeKey = `${currentPartIndex}:${codeIndex}`;
      const rememberedLanguage = codeLanguageOverrides.get(codeKey);
      const activeLanguage = variants.has(rememberedLanguage)
        ? rememberedLanguage
        : (variants.has(currentLanguage) ? currentLanguage : entries[0].language);
      const activeLabel = LANGUAGE_LABELS[activeLanguage] || activeLanguage || 'code';
      const summaryTitle = isBilingual ? '查看题解代码' : (activeLanguage === 'text' ? '查看示意内容' : '查看代码');
      const languageControl = isBilingual
        ? `<div class="code-language-tabs" role="group" aria-label="切换本题代码语言">${entries.map(variant => {
            const label = LANGUAGE_LABELS[variant.language] || variant.language;
            const active = variant.language === activeLanguage;
            return `<button class="code-language-tab${active ? ' active' : ''}" type="button" data-code-language="${escapeHtml(variant.language)}" aria-pressed="${active ? 'true' : 'false'}">${escapeHtml(label)}</button>`;
          }).join('')}</div>`
        : `<span class="code-kind">${escapeHtml(activeLabel)}</span>`;
      const codePanels = entries.map(variant => {
        const hidden = variant.language === activeLanguage ? '' : ' hidden';
        return `<pre class="code-variant" data-code-language="${escapeHtml(variant.language)}"${hidden}><code class="language-${escapeHtml(variant.language)}">${highlightCode(variant.code, variant.language)}</code></pre>`;
      }).join('');

      return `<details class="code-card" data-code-key="${escapeHtml(codeKey)}" data-language="${escapeHtml(activeLanguage)}"><summary class="code-summary"><span class="code-summary-main"><span class="code-summary-title">${summaryTitle}</span><span class="code-summary-language">${escapeHtml(activeLabel)}</span></span><span class="code-summary-meta"><span class="code-summary-state">展开</span><span class="code-chevron" aria-hidden="true"></span></span></summary><div class="code-panel"><div class="code-toolbar">${languageControl}<button class="copy-code" type="button">复制代码</button></div>${codePanels}</div></details>`;
    }

    function renderMarkdown(md, pairedCodeBlocks = {}) {
      const lines = md.replace(/\r\n/g, '\n').split('\n');
      const html = [];
      let paragraph = [];
      let inCode = false;
      let codeLang = '';
      let codeBuffer = [];
      let codeIndex = 0;
      let listType = '';
      let headingIndex = 0;

      const flushParagraph = () => {
        if (!paragraph.length) return;
        html.push('<p>' + renderInline(paragraph.join(' ').trim()) + '</p>');
        paragraph = [];
      };
      const closeList = () => {
        if (!listType) return;
        html.push(`</${listType}>`);
        listType = '';
      };
      const flushCode = () => {
        html.push(renderCodeCard({ language: codeLang, code: codeBuffer.join('\n') }, pairedCodeBlocks, codeIndex));
        codeIndex += 1;
        codeBuffer = [];
        codeLang = '';
      };

      for (let i = 0; i < lines.length; i += 1) {
        const line = lines[i];
        const fence = /^```\s*([^`]*)\s*$/.exec(line);
        if (fence) {
          if (inCode) { inCode = false; flushCode(); }
          else { flushParagraph(); closeList(); inCode = true; codeLang = fence[1] || ''; }
          continue;
        }
        if (inCode) { codeBuffer.push(line); continue; }
        if (!line.trim()) { flushParagraph(); closeList(); continue; }
        if (/^={5,}\s*$/.test(line) || /^-{3,}\s*$/.test(line)) { flushParagraph(); closeList(); html.push('<hr />'); continue; }

        const heading = /^(#{1,4})\s+(.+?)(?:\s+#+)?\s*$/.exec(line);
        if (heading) {
          flushParagraph(); closeList();
          const level = heading[1].length;
          const titleText = normalizeTitle(heading[2]);
          const existing = currentLocalHeadings.find(h => h.title === titleText && h.level === level);
          const id = existing?.id || slugify(titleText, 'h', headingIndex);
          headingIndex += 1;
          html.push(`<h${level} id="${id}"><a class="heading-anchor" href="#${id}">${renderInline(heading[2].trim())}</a></h${level}>`);
          continue;
        }

        if (line.includes('|') && lines[i + 1] && isTableSeparator(lines[i + 1])) {
          flushParagraph(); closeList();
          const header = splitTableRow(line);
          i += 2;
          const rows = [];
          while (i < lines.length && lines[i].includes('|') && lines[i].trim()) {
            rows.push(splitTableRow(lines[i]));
            i += 1;
          }
          i -= 1;
          html.push('<div class="table-wrap"><table><thead><tr>' + header.map(cell => `<th>${renderInline(cell)}</th>`).join('') + '</tr></thead><tbody>' + rows.map(row => '<tr>' + row.map(cell => `<td>${renderInline(cell)}</td>`).join('') + '</tr>').join('') + '</tbody></table></div>');
          continue;
        }

        const quote = /^>\s?(.*)$/.exec(line);
        if (quote) { flushParagraph(); closeList(); html.push('<blockquote>' + renderInline(quote[1]) + '</blockquote>'); continue; }

        const unordered = /^\s*[-*+]\s+(.+)$/.exec(line);
        const ordered = /^\s*\d+\.\s+(.+)$/.exec(line);
        if (unordered || ordered) {
          flushParagraph();
          const target = ordered ? 'ol' : 'ul';
          if (listType && listType !== target) closeList();
          if (!listType) { listType = target; html.push(`<${target}>`); }
          html.push('<li>' + renderInline((unordered || ordered)[1]) + '</li>');
          continue;
        }

        paragraph.push(line.trim());
      }
      flushParagraph();
      closeList();
      if (inCode) flushCode();
      return html.join('\n');
    }

    function renderShell() {
      $('#totalParts').textContent = parts.length;
      $('#navSummary').textContent = `共 ${parts.length} 个部分。点击目录只切换当前部分，不渲染全文。`;
      partSelectEl.innerHTML = parts.map((part, index) => `<option value="${index}">${getDisplayPartNo(part, index)}. ${escapeHtml(part.title.replace(/^第\d+部分[:：]\s*/, ''))}</option>`).join('');
      buildPartNav();
    }

    function getDisplayPartNo(part, index) {
      const match = /^第(\d+)部分/.exec(part.title || '');
      return match ? match[1] : String(index);
    }

    function buildPartNav() {
      const query = searchInput.value.trim();
      partListEl.innerHTML = parts.map((part, index) => {
        const matches = globalMatches.get(index) || 0;
        const matchClass = matches ? ' has-match' : '';
        return `<button class="part-item${index === currentPartIndex ? ' active' : ''}${matchClass}" data-index="${index}" title="${escapeHtml(part.title)}"><span class="part-index">${getDisplayPartNo(part, index)}</span><span class="part-title">${escapeHtml(part.title.replace(/^第\d+部分[:：]\s*/, ''))}</span><span class="match-badge">${matches}</span></button>`;
      }).join('');
      $$('.part-item', partListEl).forEach(btn => {
        btn.addEventListener('click', () => {
          document.body.classList.remove('nav-open');
          setCurrentPart(Number(btn.dataset.index));
        });
      });
      if (query) updateSearchMeta();
    }

    function setupContentLinks() {
      $$('a[href^="#"]', contentEl).forEach(link => {
        link.removeAttribute('target');
        link.removeAttribute('rel');
        link.addEventListener('click', event => {
          const href = link.getAttribute('href') || '';
          const hash = decodeURIComponent(href);
          const partMatch = /第(\d+)部分/.exec(hash);
          if (partMatch) {
            const partNo = Number(partMatch[1]);
            const targetIndex = parts.findIndex(part => part.title.startsWith(`第${partNo}部分`));
            if (targetIndex >= 0) {
              event.preventDefault();
              setCurrentPart(targetIndex);
              window.scrollTo({ top: 0, behavior: 'smooth' });
            }
            return;
          }

          const targetId = hash.slice(1);
          const target = targetId ? document.getElementById(targetId) : null;
          if (target) {
            event.preventDefault();
            target.scrollIntoView({ behavior: 'smooth', block: 'start' });
          }
        });
      });
    }

    function renderCurrentPart() {
      const part = parts[currentPartIndex];
      if (!part) return;
      currentLocalHeadings = extractLocalHeadings(part.markdown);
      $('#partEyebrow').textContent = `PART ${getDisplayPartNo(part, currentPartIndex)} / ${parts.length - 1}`;
      $('#partTitle').textContent = part.title;
      $('#partDesc').textContent = extractPartPreview(part);
      $('#currentPartNo').textContent = getDisplayPartNo(part, currentPartIndex);
      $('#partChars').textContent = part.text.length.toLocaleString('zh-CN');
      $('#partCodeCount').textContent = Math.floor((part.markdown.match(/```/g) || []).length / 2).toLocaleString('zh-CN');
      partSelectEl.value = String(currentPartIndex);
      const pairedCodeBlocks = Object.fromEntries(
        Object.entries(partsByLanguage).map(([language, languageParts]) => {
          const pairedPart = languageParts[currentPartIndex];
          return [language, extractCodeBlocks(pairedPart?.markdown || '')];
        })
      );
      contentEl.innerHTML = renderMarkdown(part.markdown, pairedCodeBlocks);
      setupContentLinks();
      setupSelfTestSections();
      buildFloatingOutline();
      attachCodeCopy();
      applySearchToCurrentPart();
      observeCurrentSections();
      updatePartButtons();
      buildPartNav();
      updateSelfTestButtons();
      updateReadingProgress();
    }

    function buildFloatingOutline() {
      const links = $('#drawerLinks');
      if (!currentLocalHeadings.length) {
        links.innerHTML = '<div class="drawer-empty">本部分没有可用的小节目录。</div>';
        return;
      }
      links.innerHTML = currentLocalHeadings.map(h => `<a href="#${h.id}" data-target="${h.id}" title="${escapeHtml(h.title)}">${escapeHtml(h.title)}</a>`).join('');
      $$('#drawerLinks a').forEach(link => {
        link.addEventListener('click', event => {
          event.preventDefault();
          const target = document.getElementById(link.dataset.target);
          if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
        });
      });
    }

    function getCurrentMarkdown() {
      return MARKDOWN_BY_LANGUAGE[currentLanguage] || MARKDOWN_BY_LANGUAGE.cpp;
    }

    function getCurrentLanguageLabel() {
      return LANGUAGE_LABELS[currentLanguage] || LANGUAGE_LABELS.cpp;
    }

    function setCurrentPart(index, scrollTop = true) {
      if (index < 0 || index >= parts.length) return;
      currentPartIndex = index;
      localStorage.setItem(KEYS.currentPart, String(index));
      renderCurrentPart();
      if (scrollTop) window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function setLanguage(language, scrollTop = false) {
      if (!MARKDOWN_BY_LANGUAGE[language] || language === currentLanguage) return;
      currentLanguage = language;
      localStorage.setItem(KEYS.language, language);
      parts = partsByLanguage[currentLanguage] || partsByLanguage.cpp || [];
      if (currentPartIndex >= parts.length) currentPartIndex = Math.max(0, parts.length - 1);
      localStorage.setItem(KEYS.currentPart, String(currentPartIndex));
      searchHits = [];
      searchHitIndex = -1;
      updateGlobalMatches();
      renderShell();
      renderCurrentPart();
      updateSearchMeta();
      toast(`默认代码语言已切换为 ${getCurrentLanguageLabel()}`);
      if (scrollTop) window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function updatePartButtons() {
      const atFirst = currentPartIndex === 0;
      const atLast = currentPartIndex === parts.length - 1;
      ['#prevPart', '#prevPartBottom'].forEach(id => $(id).disabled = atFirst);
      ['#nextPart', '#nextPartBottom'].forEach(id => $(id).disabled = atLast);
    }

    function countOccurrences(text, query) {
      if (!query) return 0;
      const regex = new RegExp(escapeRegex(query), 'gi');
      return (text.match(regex) || []).length;
    }

    function updateGlobalMatches() {
      const query = searchInput.value.trim();
      globalMatches = new Map();
      if (!query) return;
      parts.forEach((part, index) => {
        const count = countOccurrences(part.searchText || part.text, query);
        if (count) globalMatches.set(index, count);
      });
    }

    function updateSearchMeta() {
      const query = searchInput.value.trim();
      if (!query) {
        searchMeta.textContent = `共 ${parts.length} 个部分`;
        return;
      }
      const globalCount = Array.from(globalMatches.values()).reduce((sum, value) => sum + value, 0);
      const position = searchHitIndex >= 0 && searchHits.length
        ? `，当前第 ${searchHitIndex + 1}/${searchHits.length} 处`
        : `，当前 ${searchHits.length} 处`;
      searchMeta.textContent = `全书 ${globalCount} 处${position}`;
    }

    function clearSearchHighlights(root) {
      $$('mark.search-hit', root).forEach(mark => {
        mark.replaceWith(document.createTextNode(mark.textContent || ''));
      });
      root.normalize();
    }

    function prepareCrossTokenCodeMatches(query) {
      const regex = new RegExp(escapeRegex(query), 'i');
      $$('.code-variant:not([hidden]) code', contentEl).forEach(code => {
        regex.lastIndex = 0;
        if (!regex.test(code.textContent || '')) return;

        const walker = document.createTreeWalker(code, NodeFilter.SHOW_TEXT);
        let singleNodeMatch = false;
        while (walker.nextNode()) {
          regex.lastIndex = 0;
          if (regex.test(walker.currentNode.nodeValue || '')) {
            singleNodeMatch = true;
            break;
          }
        }
        if (!singleNodeMatch) code.textContent = code.textContent;
      });
    }

    function applySearchToCurrentPart() {
      const query = searchInput.value.trim();
      searchHits = [];
      searchHitIndex = -1;
      clearSearchHighlights(contentEl);
      if (!query) { updateSearchMeta(); return; }
      prepareCrossTokenCodeMatches(query);
      highlightText(contentEl, query);
      searchHits = $$('mark.search-hit', contentEl);
      searchHits.forEach(hit => {
        const codeCard = hit.closest('details.code-card');
        if (codeCard) codeCard.open = true;
      });
      if (selfTestMode && searchHits.length) expandSectionsWithMatches();
      updateSearchMeta();
      if (searchHits.length) moveSearch(1, false);
    }

    function highlightText(root, query) {
      const regex = new RegExp(escapeRegex(query), 'gi');
      const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
        acceptNode(node) {
          const parent = node.parentElement;
          if (!parent || ['SCRIPT', 'STYLE', 'TEXTAREA', 'MARK'].includes(parent.tagName)) return NodeFilter.FILTER_REJECT;
          if (parent.closest('[hidden]')) return NodeFilter.FILTER_REJECT;
          regex.lastIndex = 0;
          return regex.test(node.nodeValue) ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_REJECT;
        }
      });
      const nodes = [];
      while (walker.nextNode()) nodes.push(walker.currentNode);
      nodes.forEach(node => {
        regex.lastIndex = 0;
        const frag = document.createDocumentFragment();
        let last = 0;
        node.nodeValue.replace(regex, (match, offset) => {
          frag.appendChild(document.createTextNode(node.nodeValue.slice(last, offset)));
          const mark = document.createElement('mark');
          mark.className = 'search-hit';
          mark.textContent = match;
          frag.appendChild(mark);
          last = offset + match.length;
        });
        frag.appendChild(document.createTextNode(node.nodeValue.slice(last)));
        node.parentNode.replaceChild(frag, node);
      });
    }

    function moveSearch(direction, scroll = true) {
      if (!searchHits.length) {
        const firstMatch = Array.from(globalMatches.keys())[0];
        if (firstMatch !== undefined && firstMatch !== currentPartIndex) {
          toast('当前部分无匹配，已在目录中标出其他匹配部分');
        }
        return;
      }
      searchHits.forEach(hit => hit.classList.remove('current'));
      searchHitIndex = (searchHitIndex + direction + searchHits.length) % searchHits.length;
      const hit = searchHits[searchHitIndex];
      hit.classList.add('current');
      updateSearchMeta();
      if (scroll) hit.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }

    function setupSelfTestSections() {
      const level = contentEl.querySelector('h2') ? 2 : (contentEl.querySelector('h3') ? 3 : 0);
      if (!level) return;
      const selector = `h${level}`;
      const headings = $$(selector, contentEl);
      headings.forEach((heading, index) => {
        const section = document.createElement('section');
        section.className = 'quiz-section';
        section.dataset.sectionId = heading.id;
        if (selfTestMode) section.classList.add('collapsed');

        const head = document.createElement('div');
        head.className = 'quiz-head';
        const prompt = document.createElement('p');
        prompt.className = 'quiz-prompt';
        prompt.textContent = '自测提示：先回忆这一节的核心思路、边界条件、常见题型和复杂度，再展开正文核对。';
        const toggle = document.createElement('button');
        toggle.className = 'quiz-toggle';
        toggle.type = 'button';
        toggle.textContent = selfTestMode ? '显示内容' : '收起内容';
        toggle.addEventListener('click', () => {
          section.classList.toggle('collapsed');
          updateQuizToggles();
        });

        const body = document.createElement('div');
        body.className = 'quiz-content';
        heading.parentNode.insertBefore(section, heading);
        section.appendChild(head);
        head.appendChild(heading);
        head.appendChild(toggle);
        head.appendChild(prompt);
        section.appendChild(body);

        let cursor = section.nextSibling;
        while (cursor && !(cursor.nodeType === 1 && cursor.matches(selector))) {
          const next = cursor.nextSibling;
          body.appendChild(cursor);
          cursor = next;
        }
      });
    }

    function setSelfTestMode(enabled, notify = true) {
      selfTestMode = enabled;
      localStorage.setItem(KEYS.selfTest, enabled ? 'true' : 'false');
      document.body.classList.toggle('self-test-mode', enabled);
      contentEl.classList.toggle('self-test', enabled);
      if (enabled) collapseAllSections(true);
      else collapseAllSections(false);
      updateSelfTestButtons();
      if (notify) toast(enabled ? '自测模式已开启：小节内容默认收起' : '自测模式已关闭');
    }

    function updateSelfTestButtons() {
      document.body.classList.toggle('self-test-mode', selfTestMode);
      contentEl.classList.toggle('self-test', selfTestMode);
      ['#selfTestToggle', '#selfTestToggleDrawer'].forEach(id => {
        const btn = $(id);
        if (!btn) return;
        btn.classList.toggle('active', selfTestMode);
        btn.textContent = selfTestMode ? '退出自测' : '自测模式';
      });
      updateQuizToggles();
    }

    function updateQuizToggles() {
      $$('.quiz-section').forEach(section => {
        const toggle = $('.quiz-toggle', section);
        if (toggle) toggle.textContent = section.classList.contains('collapsed') ? '显示内容' : '收起内容';
      });
    }

    function collapseAllSections(collapse) {
      $$('.quiz-section').forEach(section => section.classList.toggle('collapsed', collapse));
      updateQuizToggles();
    }

    function expandSectionsWithMatches() {
      $$('.quiz-section').forEach(section => {
        if ($('mark.search-hit', section)) section.classList.remove('collapsed');
      });
      updateQuizToggles();
    }

    function setActiveDrawerLink(id) {
      $$('#drawerLinks a').forEach(link => link.classList.toggle('active', link.dataset.target === id));
    }

    function observeCurrentSections() {
      if (sectionObserver) sectionObserver.disconnect();
      const sections = $$('.quiz-section', contentEl);
      if (!sections.length) return;
      sectionObserver = new IntersectionObserver(entries => {
        const visible = entries
          .filter(entry => entry.isIntersecting)
          .sort((a, b) => a.boundingClientRect.top - b.boundingClientRect.top)[0];
        if (visible) setActiveDrawerLink(visible.target.dataset.sectionId);
      }, { rootMargin: '-110px 0px -68% 0px', threshold: 0.01 });
      sections.forEach(section => sectionObserver.observe(section));
    }

    function attachCodeCopy() {
      $$('.code-card', contentEl).forEach(card => {
        card.addEventListener('toggle', () => {
          const state = $('.code-summary-state', card);
          if (state) state.textContent = card.open ? '收起' : '展开';
          updateReadingProgress();
        });
      });

      $$('.code-language-tab', contentEl).forEach(btn => {
        btn.addEventListener('click', () => {
          const card = btn.closest('.code-card');
          const language = btn.dataset.codeLanguage;
          if (!card || !language || card.dataset.language === language) return;

          $$('.code-language-tab', card).forEach(tab => {
            const active = tab.dataset.codeLanguage === language;
            tab.classList.toggle('active', active);
            tab.setAttribute('aria-pressed', active ? 'true' : 'false');
          });
          $$('.code-variant', card).forEach(panel => {
            panel.hidden = panel.dataset.codeLanguage !== language;
          });
          card.dataset.language = language;
          const summaryLanguage = $('.code-summary-language', card);
          if (summaryLanguage) summaryLanguage.textContent = LANGUAGE_LABELS[language] || language;
          codeLanguageOverrides.set(card.dataset.codeKey, language);
          if (searchInput.value.trim()) applySearchToCurrentPart();
          updateReadingProgress();
        });
      });

      $$('.copy-code', contentEl).forEach(btn => {
        btn.addEventListener('click', async () => {
          const card = btn.closest('.code-card');
          const activePanel = card ? $$('.code-variant', card).find(panel => !panel.hidden) : null;
          const code = activePanel?.querySelector('code')?.textContent || '';
          try {
            await navigator.clipboard.writeText(code);
            btn.textContent = '已复制';
            toast('代码已复制');
            setTimeout(() => { btn.textContent = '复制代码'; }, 1200);
          } catch {
            toast('复制失败，请手动选择代码复制');
          }
        });
      });
    }

    function downloadText(filename, text, type = 'text/plain;charset=utf-8') {
      const blob = new Blob([text], { type });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
    }

    function toast(message) {
      const item = document.createElement('div');
      item.className = 'toast-item';
      item.textContent = message;
      $('#toast').appendChild(item);
      setTimeout(() => item.remove(), 2400);
    }

    function updateReadingProgress() {
      const doc = document.documentElement;
      const max = Math.max(1, doc.scrollHeight - window.innerHeight);
      const percent = Math.min(100, Math.max(0, window.scrollY / max * 100));
      $('#readingProgress').style.width = percent + '%';
    }

    function initTheme() {
      const stored = localStorage.getItem(KEYS.theme);
      const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.dataset.theme = stored || (prefersDark ? 'dark' : 'light');
    }

    function init() {
      initTheme();
      selfTestMode = localStorage.getItem(KEYS.selfTest) === 'true';
      document.body.classList.toggle('self-test-mode', selfTestMode);
      partsByLanguage = Object.fromEntries(
        Object.entries(MARKDOWN_BY_LANGUAGE).map(([language, markdown]) => [language, splitIntoParts(markdown)])
      );
      const storedLanguage = localStorage.getItem(KEYS.language);
      currentLanguage = MARKDOWN_BY_LANGUAGE[storedLanguage] ? storedLanguage : 'cpp';
      languageSelectEl.value = currentLanguage;
      parts = partsByLanguage[currentLanguage] || partsByLanguage.cpp || [];
      const storedPart = Number(localStorage.getItem(KEYS.currentPart) || 0);
      currentPartIndex = Number.isFinite(storedPart) && storedPart >= 0 && storedPart < parts.length ? storedPart : 0;
      renderShell();
      renderCurrentPart();
      updateSearchMeta();
    }

    searchInput.addEventListener('input', () => {
      updateGlobalMatches();
      renderCurrentPart();
    });
    $('#prevHit').addEventListener('click', () => moveSearch(-1));
    $('#nextHit').addEventListener('click', () => moveSearch(1));
    languageSelectEl.addEventListener('change', () => setLanguage(languageSelectEl.value));
    partSelectEl.addEventListener('change', () => setCurrentPart(Number(partSelectEl.value)));
    $('#prevPart').addEventListener('click', () => setCurrentPart(currentPartIndex - 1));
    $('#nextPart').addEventListener('click', () => setCurrentPart(currentPartIndex + 1));
    $('#prevPartBottom').addEventListener('click', () => setCurrentPart(currentPartIndex - 1));
    $('#nextPartBottom').addEventListener('click', () => setCurrentPart(currentPartIndex + 1));
    $('#themeToggle').addEventListener('click', () => {
      const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
      document.documentElement.dataset.theme = next;
      localStorage.setItem(KEYS.theme, next);
    });
    $('#downloadMd').addEventListener('click', () => {
      const filename = currentLanguage === 'python'
        ? 'Hot100_完整复习笔记_Python.md'
        : 'Hot100_完整复习笔记.md';
      downloadText(filename, getCurrentMarkdown());
    });
    $('#mobileNav').addEventListener('click', () => document.body.classList.toggle('nav-open'));
    $('#outlineToggle').addEventListener('click', () => {
      const drawer = $('#sectionDrawer');
      drawer.classList.toggle('open');
      $('#outlineToggle').setAttribute('aria-expanded', drawer.classList.contains('open') ? 'true' : 'false');
    });
    $('#selfTestToggle').addEventListener('click', () => setSelfTestMode(!selfTestMode));
    $('#selfTestToggleDrawer').addEventListener('click', () => setSelfTestMode(!selfTestMode));
    $('#expandAllSections').addEventListener('click', () => {
      collapseAllSections(false);
      toast('已展开当前部分所有小节');
    });
    $('#collapseAllSections').addEventListener('click', () => {
      if (!selfTestMode) setSelfTestMode(true, false);
      collapseAllSections(true);
      toast('已收起当前部分所有小节');
    });
    document.addEventListener('click', event => {
      const drawer = $('#sectionDrawer');
      if (!drawer.classList.contains('open')) return;
      if (drawer.contains(event.target)) return;
      drawer.classList.remove('open');
      $('#outlineToggle').setAttribute('aria-expanded', 'false');
    });
    window.addEventListener('scroll', updateReadingProgress, { passive: true });
    window.addEventListener('resize', updateReadingProgress);

    document.addEventListener('keydown', event => {
      const tag = document.activeElement?.tagName;
      const typing = ['INPUT', 'TEXTAREA', 'SELECT'].includes(tag);
      if (typing && event.key !== 'Escape') return;
      if (event.key === '/') { event.preventDefault(); searchInput.focus(); }
      if (event.key.toLowerCase() === 'q') setSelfTestMode(!selfTestMode);
      if (event.key.toLowerCase() === 't') $('#themeToggle').click();
      if (event.key.toLowerCase() === 'n') {
        if (searchInput.value.trim()) moveSearch(1);
        else setCurrentPart(currentPartIndex + 1);
      }
      if (event.key.toLowerCase() === 'p') {
        if (searchInput.value.trim()) moveSearch(-1);
        else setCurrentPart(currentPartIndex - 1);
      }
      if (event.key === 'Escape') document.body.classList.remove('nav-open');
    });

    init();
  </script>
</body>
</html>
