<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light dark" />
  <link rel="icon" href="data:," />
  <title>Hot100 双语言清爽玻璃拟态风</title>
  <style>
    :root {
      --bg: #f6f7fb;
      --bg-soft: #eef2ff;
      --surface: #ffffff;
      --surface-soft: #f8fafc;
      --text: #111827;
      --muted: #667085;
      --subtle: #98a2b3;
      --border: rgba(17, 24, 39, .10);
      --primary: #6257f6;
      --primary-2: #0891b2;
      --primary-soft: rgba(98, 87, 246, .10);
      --warning: #f59e0b;
      --mark: #fff2a8;
      --code-bg: #0f172a;
      --code-text: #e5e7eb;
      --shadow: 0 22px 60px rgba(15, 23, 42, .10);
      --shadow-soft: 0 12px 30px rgba(15, 23, 42, .08);
      --radius-xl: 24px;
      --radius-lg: 18px;
      --topbar-h: 68px;
      color-scheme: light;
    }

    [data-theme="dark"] {
      --bg: #08111f;
      --bg-soft: #101827;
      --surface: #121a2a;
      --surface-soft: #172033;
      --text: #f8fafc;
      --muted: #a5b4c8;
      --subtle: #748198;
      --border: rgba(255, 255, 255, .12);
      --primary: #8b7cff;
      --primary-2: #22d3ee;
      --primary-soft: rgba(139, 124, 255, .16);
      --warning: #fbbf24;
      --mark: rgba(251, 191, 36, .32);
      --code-bg: #050914;
      --code-text: #edf2f7;
      --shadow: 0 24px 70px rgba(0, 0, 0, .38);
      --shadow-soft: 0 14px 36px rgba(0, 0, 0, .24);
      color-scheme: dark;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background:
        radial-gradient(circle at 12% -8%, rgba(98, 87, 246, .20), transparent 34%),
        radial-gradient(circle at 92% 8%, rgba(8, 145, 178, .16), transparent 32%),
        linear-gradient(135deg, var(--bg), var(--bg-soft));
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(100, 116, 139, .055) 1px, transparent 1px),
        linear-gradient(90deg, rgba(100, 116, 139, .055) 1px, transparent 1px);
      background-size: 28px 28px;
      mask-image: radial-gradient(circle at top, black 0%, transparent 78%);
    }

    button, input, select { font: inherit; }
    button, select {
      border: 1px solid var(--border);
      color: var(--text);
      background: var(--surface);
      border-radius: 999px;
      cursor: pointer;
      transition: transform .16s ease, box-shadow .16s ease, border-color .16s ease, background .16s ease;
    }
    button { padding: 9px 14px; }
    select { padding: 9px 36px 9px 12px; max-width: 280px; }
    button:hover, select:hover { transform: translateY(-1px); border-color: color-mix(in srgb, var(--primary) 46%, var(--border)); box-shadow: var(--shadow-soft); }
    button:active { transform: translateY(0); }
    button.primary, button.active { color: #fff; border-color: transparent; background: linear-gradient(135deg, var(--primary), var(--primary-2)); }
    button.icon { width: 40px; height: 40px; display: inline-grid; place-items: center; padding: 0; }
    button.ghost { background: transparent; }
    :focus-visible { outline: 3px solid color-mix(in srgb, var(--primary) 34%, transparent); outline-offset: 2px; }

    .reading-progress {
      position: fixed;
      top: 0;
      left: 0;
      z-index: 90;
      height: 3px;
      width: 0%;
      background: linear-gradient(90deg, var(--primary), var(--primary-2));
      transition: width .12s ease;
    }

    .topbar {
      position: relative;
      z-index: 70;
      min-height: var(--topbar-h);
      display: grid;
      grid-template-columns: minmax(220px, 320px) minmax(320px, 1fr) auto;
      gap: 14px;
      align-items: center;
      padding: 12px 22px;
      border-bottom: 1px solid var(--border);
      background: color-mix(in srgb, var(--surface) 88%, transparent);
      backdrop-filter: blur(18px);
    }
    .brand { display: flex; gap: 12px; align-items: center; min-width: 0; }
    .brand-mark {
      width: 42px;
      height: 42px;
      border-radius: 16px;
      display: grid;
      place-items: center;
      color: #fff;
      font-weight: 900;
      background: linear-gradient(135deg, var(--primary), var(--primary-2));
      box-shadow: 0 16px 34px color-mix(in srgb, var(--primary) 30%, transparent);
    }
    .brand strong, .brand span { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .brand strong { letter-spacing: -.02em; }
    .brand span { margin-top: 3px; color: var(--muted); font-size: 12px; }

    .search-row {
      display: grid;
      grid-template-columns: minmax(180px, 1fr) auto auto auto;
      gap: 8px;
      align-items: center;
      min-width: 0;
    }
    .search-box {
      height: 42px;
      display: flex;
      gap: 10px;
      align-items: center;
      min-width: 0;
      padding: 0 14px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--surface);
    }
    .search-box input {
      width: 100%;
      min-width: 0;
      border: 0;
      outline: 0;
      color: var(--text);
      background: transparent;
    }
    .search-meta { color: var(--muted); font-size: 12px; white-space: nowrap; }
    .actions { display: flex; gap: 8px; align-items: center; justify-content: flex-end; flex-wrap: wrap; }

    .app-shell {
      width: min(1440px, 100%);
      margin: 0 auto;
      padding: 18px 22px 36px;
      display: grid;
      grid-template-columns: 286px minmax(0, 1fr);
      gap: 18px;
    }
    .panel, .reader-card {
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      background: color-mix(in srgb, var(--surface) 92%, transparent);
      box-shadow: var(--shadow-soft);
      backdrop-filter: blur(18px);
    }
    .sidebar {
      position: sticky;
      top: 18px;
      height: calc(100vh - 36px);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .panel-head { padding: 18px 18px 12px; border-bottom: 1px solid var(--border); }
    .panel-head h2 { margin: 0; font-size: 16px; letter-spacing: -.01em; }
    .panel-head p { margin: 6px 0 0; color: var(--muted); font-size: 12px; line-height: 1.5; }
    .panel-body { min-height: 0; overflow: auto; padding: 12px; }
    .part-list { display: grid; gap: 6px; }
    .part-item {
      width: 100%;
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 9px;
      align-items: center;
      padding: 10px 11px;
      border: 0;
      border-radius: 14px;
      background: transparent;
      box-shadow: none;
      text-align: left;
      color: var(--muted);
    }
    .part-item:hover { transform: none; box-shadow: none; background: var(--primary-soft); }
    .part-item.active { color: var(--text); background: var(--primary-soft); box-shadow: inset 3px 0 0 var(--primary); }
    .part-index { width: 24px; height: 24px; border-radius: 999px; display: grid; place-items: center; color: var(--subtle); background: color-mix(in srgb, var(--muted) 10%, transparent); font-size: 12px; }
    .part-title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .match-badge { min-width: 22px; padding: 2px 6px; border-radius: 999px; color: #fff; background: var(--primary); font-size: 11px; text-align: center; }
    .part-item:not(.has-match) .match-badge { display: none; }

    .reader-card { overflow: hidden; box-shadow: var(--shadow); }
    .reader-header {
      padding: clamp(22px, 4vw, 38px);
      border-bottom: 1px solid var(--border);
      background:
        linear-gradient(135deg, color-mix(in srgb, var(--primary) 16%, transparent), color-mix(in srgb, var(--primary-2) 10%, transparent)),
        color-mix(in srgb, var(--surface) 88%, transparent);
    }
    .eyebrow { margin: 0 0 10px; color: var(--primary); font-size: 13px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; }
    .reader-header h1 { margin: 0; font-size: clamp(30px, 5vw, 50px); line-height: 1.08; letter-spacing: -.045em; }
    .reader-desc { max-width: 820px; margin: 14px 0 0; color: var(--muted); line-height: 1.75; }
    .reader-stats { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 20px; }
    .stat-pill { padding: 8px 11px; border: 1px solid var(--border); border-radius: 999px; color: var(--muted); background: color-mix(in srgb, var(--surface) 74%, transparent); font-size: 12px; }
    .stat-pill b { color: var(--text); }

    .local-outline {
      display: none;
      margin: 18px clamp(22px, 4vw, 42px) 0;
      padding: 14px;
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      background: var(--surface-soft);
    }
    .local-outline.visible { display: block; }
    .local-outline strong { display: block; margin-bottom: 8px; font-size: 14px; }
    .outline-links { display: flex; gap: 8px; flex-wrap: wrap; }
    .outline-links a {
      display: inline-flex;
      max-width: 260px;
      padding: 7px 10px;
      border: 1px solid var(--border);
      border-radius: 999px;
      color: var(--muted);
      background: var(--surface);
      font-size: 12px;
      text-decoration: none;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .outline-links a:hover { color: var(--text); border-color: color-mix(in srgb, var(--primary) 42%, var(--border)); }

    .markdown-body {
      max-width: 920px;
      margin: 0 auto;
      padding: clamp(24px, 4vw, 46px);
      line-height: 1.78;
      word-break: break-word;
    }
    .markdown-body h1, .markdown-body h2, .markdown-body h3, .markdown-body h4 { scroll-margin-top: 24px; line-height: 1.28; letter-spacing: -.02em; }
    .markdown-body h1 { margin: 12px 0 24px; font-size: 34px; }
    .markdown-body h2 { margin: 42px 0 16px; padding-bottom: 10px; border-bottom: 1px solid var(--border); font-size: 28px; }
    .markdown-body h3 { margin: 30px 0 12px; font-size: 22px; color: color-mix(in srgb, var(--text) 88%, var(--primary)); }
    .markdown-body h4 { margin: 22px 0 8px; font-size: 18px; }
    .heading-anchor { color: inherit; text-decoration: none; }
    .heading-anchor::before { content: '#'; margin-right: 8px; color: var(--primary); opacity: .5; }
    .markdown-body p { margin: 12px 0; }
    .markdown-body a { color: var(--primary); text-decoration: none; border-bottom: 1px dashed color-mix(in srgb, var(--primary) 60%, transparent); }
    .markdown-body ul, .markdown-body ol { padding-left: 1.5em; margin: 12px 0; }
    .markdown-body li { margin: 7px 0; }
    .markdown-body blockquote {
      margin: 18px 0;
      padding: 14px 18px;
      border-left: 4px solid var(--primary);
      border-radius: 14px;
      color: color-mix(in srgb, var(--text) 84%, var(--muted));
      background: var(--primary-soft);
    }
    .markdown-body hr { border: 0; border-top: 1px solid var(--border); margin: 28px 0; }
    .markdown-body :not(pre) > code {
      padding: 2px 6px;
      border: 1px solid var(--border);
      border-radius: 7px;
      color: color-mix(in srgb, var(--primary) 80%, var(--text));
      background: var(--primary-soft);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
      font-size: .92em;
    }
    .code-card { overflow: hidden; margin: 18px 0; border: 1px solid rgba(255,255,255,.10); border-radius: 18px; background: var(--code-bg); box-shadow: var(--shadow-soft); }
    .code-summary { display: flex; align-items: center; justify-content: space-between; gap: 14px; min-height: 48px; padding: 9px 12px; color: #dbe7f4; background: rgba(255,255,255,.045); cursor: pointer; list-style: none; }
    .code-summary::-webkit-details-marker { display: none; }
    .code-summary:focus-visible { outline: 2px solid var(--primary-2); outline-offset: -3px; }
    .code-summary-main, .code-summary-meta { display: inline-flex; align-items: center; gap: 9px; min-width: 0; }
    .code-summary-title { overflow: hidden; font-size: 13px; font-weight: 800; text-overflow: ellipsis; white-space: nowrap; }
    .code-summary-language { color: rgba(219, 231, 244, .7); font-size: 12px; }
    .code-summary-state { color: rgba(219, 231, 244, .58); font-size: 12px; }
    .code-chevron { width: 8px; height: 8px; flex: 0 0 auto; border-right: 2px solid currentColor; border-bottom: 2px solid currentColor; transform: rotate(45deg); transition: transform .18s ease; }
    .code-card[open] .code-summary { border-bottom: 1px solid rgba(255,255,255,.10); }
    .code-card[open] .code-chevron { transform: rotate(225deg); }
    .code-toolbar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; padding: 9px 12px; color: #dbe7f4; border-bottom: 1px solid rgba(255,255,255,.10); background: rgba(255,255,255,.025); }
    .code-language-tabs { display: inline-flex; flex: 0 1 160px; gap: 3px; width: 160px; max-width: 100%; min-width: 120px; padding: 3px; border: 1px solid rgba(255,255,255,.13); border-radius: 8px; background: rgba(2, 8, 23, .28); }
    .code-language-tab { flex: 1 1 0; min-width: 0; min-height: 30px; padding: 0 8px; color: rgba(219, 231, 244, .7); border: 0; border-radius: 6px; background: transparent; font-size: 12px; }
    .code-language-tab:hover { color: #fff; background: rgba(255,255,255,.08); }
    .code-language-tab.active { color: #08111f; background: #8ddad0; box-shadow: 0 2px 8px rgba(0,0,0,.22); }
    .code-kind { color: rgba(219, 231, 244, .68); font-size: 12px; text-transform: uppercase; }
    .copy-code { margin-left: auto; padding: 5px 10px; color: #e6edf7; border-color: rgba(255,255,255,.18); background: rgba(255,255,255,.08); font-size: 12px; }
    .code-variant[hidden] { display: none; }
    pre { margin: 0; max-height: 560px; overflow: auto; }
    pre code { display: block; padding: 18px; color: var(--code-text); font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 13px; line-height: 1.62; white-space: pre; }
    pre code .tok-keyword { color: #c586c0; }
    pre code .tok-type { color: #4ec9b0; }
    pre code .tok-function { color: #dcdcaa; }
    pre code .tok-variable { color: #9cdcfe; }
    pre code .tok-string { color: #ce9178; }
    pre code .tok-number { color: #b5cea8; }
    pre code .tok-comment { color: #6a9955; font-style: italic; }
    pre code .tok-constant { color: #569cd6; }
    pre code .tok-operator,
    pre code .tok-punctuation { color: #d4d4d4; }
    pre code .tok-meta { color: #c586c0; }
    pre code .tok-bracket { font-weight: 700; }
    pre code .tok-bracket-1 { color: #ffd700; }
    pre code .tok-bracket-2 { color: #da70d6; }
    pre code .tok-bracket-3 { color: #179fff; }
    pre code .tok-bracket-4 { color: #ff8c00; }
    pre code .tok-bracket-5 { color: #7bd88f; }
    pre code .tok-bracket-6 { color: #ff6bcb; }
    .code-card[data-language="text"] pre code,
    .code-card[data-language="plain"] pre code,
    .code-card[data-language="plaintext"] pre code { color: var(--code-text); }
    .table-wrap { overflow: auto; margin: 18px 0; border: 1px solid var(--border); border-radius: 16px; }
    table { width: 100%; min-width: 640px; border-collapse: collapse; background: var(--surface); }
    th, td { padding: 11px 13px; border-bottom: 1px solid var(--border); text-align: left; vertical-align: top; }
    th { background: var(--surface-soft); color: var(--text); font-size: 13px; }
    tr:nth-child(even) td { background: color-mix(in srgb, var(--surface-soft) 55%, transparent); }
    mark.search-hit { padding: 1px 3px; border-radius: 5px; color: inherit; background: var(--mark); box-shadow: 0 0 0 2px color-mix(in srgb, var(--warning) 16%, transparent); }
    mark.search-hit.current { outline: 2px solid var(--warning); }

    .section-drawer {
      position: fixed;
      top: min(32vh, 260px);
      right: 0;
      z-index: 80;
      width: 356px;
      display: grid;
      grid-template-columns: 56px 300px;
      transform: translateX(300px);
      transition: transform .22s ease;
    }
    .section-drawer.open { transform: translateX(0); }
    .drawer-tab {
      align-self: start;
      min-height: 170px;
      width: 56px;
      padding: 14px 10px;
      border-radius: 20px 0 0 20px;
      border-right: 0;
      color: var(--text);
      background: linear-gradient(180deg, color-mix(in srgb, var(--primary) 18%, var(--surface)), color-mix(in srgb, var(--primary-2) 10%, var(--surface)));
      box-shadow: -10px 14px 34px rgba(15, 23, 42, .12);
    }
    .drawer-tab span {
      display: inline-flex;
      writing-mode: vertical-rl;
      letter-spacing: .16em;
      font-weight: 800;
    }
    .drawer-panel {
      max-height: min(68vh, 640px);
      overflow: hidden;
      border: 1px solid var(--border);
      border-right: 0;
      border-radius: 20px 0 0 20px;
      background: color-mix(in srgb, var(--surface) 94%, transparent);
      box-shadow: -18px 20px 55px rgba(15, 23, 42, .14);
      backdrop-filter: blur(18px);
    }
    .drawer-head { padding: 16px 16px 12px; border-bottom: 1px solid var(--border); }
    .drawer-head strong { display: block; font-size: 16px; }
    .drawer-head span { display: block; margin-top: 4px; color: var(--muted); font-size: 12px; line-height: 1.45; }
    .drawer-actions { display: flex; gap: 8px; flex-wrap: wrap; padding: 12px 14px; border-bottom: 1px solid var(--border); }
    .drawer-actions button { padding: 7px 10px; font-size: 12px; }
    .drawer-actions button.active { color: #fff; border-color: transparent; background: linear-gradient(135deg, var(--primary), var(--primary-2)); }
    .drawer-links { display: grid; gap: 6px; max-height: min(42vh, 380px); overflow: auto; padding: 12px; }
    .drawer-links a {
      display: block;
      padding: 9px 10px;
      border: 1px solid transparent;
      border-radius: 12px;
      color: var(--muted);
      text-decoration: none;
      font-size: 13px;
      line-height: 1.42;
    }
    .drawer-links a:hover,
    .drawer-links a.active { color: var(--text); border-color: color-mix(in srgb, var(--primary) 34%, var(--border)); background: var(--primary-soft); }
    .drawer-empty { padding: 14px; color: var(--muted); font-size: 13px; line-height: 1.6; }

    .quiz-section { scroll-margin-top: 24px; }
    body.self-test-mode .quiz-section {
      margin: 20px 0;
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: 18px;
      background: color-mix(in srgb, var(--surface) 92%, transparent);
      box-shadow: var(--shadow-soft);
    }
    body.self-test-mode .quiz-head {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 10px;
      align-items: start;
      padding: 16px 18px;
      border-bottom: 1px solid var(--border);
      background: linear-gradient(135deg, var(--primary-soft), transparent 78%);
    }
    body.self-test-mode .quiz-head h1,
    body.self-test-mode .quiz-head h2,
    body.self-test-mode .quiz-head h3 { margin: 0; padding: 0; border: 0; }
    .quiz-prompt, .quiz-toggle { display: none; }
    body.self-test-mode .quiz-prompt { display: block; grid-column: 1 / -1; margin: 8px 0 0; color: var(--muted); font-size: 13px; line-height: 1.65; }
    body.self-test-mode .quiz-toggle { display: inline-flex; align-items: center; justify-content: center; padding: 7px 10px; font-size: 12px; }
    body.self-test-mode .quiz-content { padding: 0 18px 18px; }
    body.self-test-mode .quiz-section.collapsed .quiz-content { display: none; }
    body.self-test-mode .quiz-section.collapsed .quiz-head { border-bottom: 0; }

    .bottom-nav {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 18px clamp(22px, 4vw, 42px) 28px;
      border-top: 1px solid var(--border);
    }
    .toast { position: fixed; right: 24px; bottom: 24px; z-index: 100; display: grid; gap: 8px; max-width: 360px; }
    .toast-item { padding: 12px 14px; border: 1px solid var(--border); border-radius: 14px; background: var(--surface); box-shadow: var(--shadow); animation: toastIn .18s ease both; }
    @keyframes toastIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

    .mobile-menu { display: none; }
    @media (max-width: 1060px) {
      .topbar { grid-template-columns: 1fr; height: auto; }
      .app-shell { grid-template-columns: 1fr; padding: 14px; }
      .sidebar { display: none; }
      .mobile-menu { display: inline-grid; }
      body.nav-open .sidebar { display: flex; position: fixed; inset: 12px; top: 12px; z-index: 95; height: auto; }
    }
    @media (max-width: 720px) {
      .search-row { grid-template-columns: 1fr auto auto; }
      .search-meta { grid-column: 1 / -1; }
      .actions { justify-content: flex-start; }
      .actions select { width: 100%; max-width: none; }
      .reader-header, .markdown-body { padding: 22px; }
      .section-drawer {
        top: auto;
        bottom: 18px;
        width: 326px;
        grid-template-columns: 54px 272px;
        transform: translateX(272px);
      }
      .section-drawer.open { transform: translateX(0); }
      .drawer-tab { min-height: 118px; }
      .bottom-nav { flex-direction: column; }
      .bottom-nav button { width: 100%; }
    }
    @media print {
      .topbar, .sidebar, .section-drawer, .local-outline, .bottom-nav, .toast, .reading-progress { display: none !important; }
      .app-shell { display: block; padding: 0; }
      .reader-card { border: 0; box-shadow: none; }
      body { background: #fff; }
      .markdown-body { max-width: none; padding: 0; }
    }
  </style>
</head>
<body>
  <div id="readingProgress" class="reading-progress"></div>
  <header class="topbar">

  <script id="initial-markdown" type="application/json">"# Hot100 完整复习笔记\n\n> 使用方式：先看“一页速记”和“算法选择决策树”定方向，再用“题号速查索引”跳到主专题，最后进入对应专题的模板、易错点和复盘口诀。\n\n## 0. 总目录\n\n| 部分 | 专题 | 快速入口 | 适合优先查看的题型 |\n|---|---|---|---|\n| 1 | 哈希表 | [第1部分: 哈希表](#第1部分-哈希表) | 补数查询、频率统计、映射关系、O(1) 定位 |\n| 2 | 双指针 | [第2部分: 双指针](#第2部分-双指针) | 两端夹逼、快慢指针、链表相交、原地覆盖 |\n| 3 | 滑动窗口 | [第3部分: 滑动窗口](#第3部分-滑动窗口) | 连续子串、连续子数组、窗口状态维护 |\n| 4 | 矩阵 | [第4部分: 矩阵](#第4部分-矩阵) | 二维坐标、边界收缩、网格 DFS/BFS、矩阵 DP |\n| 5 | 链表 | [第5部分: 链表](#第5部分-链表) | dummy、反转、删除、分组、环、相交 |\n| 6 | 二叉树 | [第6部分: 二叉树](#第6部分-二叉树) | 递归语义、遍历顺序、BST、路径贡献 |\n| 7 | 图论 | [第7部分: 图论](#第7部分-图论) | 建图、连通块、多源 BFS、拓扑排序 |\n| 8 | 回溯 | [第8部分: 回溯](#第8部分-回溯) | 组合、排列、子集、切分、棋盘、路径搜索 |\n| 9 | 二分查找 | [第9部分: 二分查找](#第9部分-二分查找) | 查值、查边界、旋转数组、答案空间 |\n| 10 | 单调栈 | [第10部分: 单调栈](#第10部分-单调栈) | 最近更大/更小边界、面积、水量、等待结算 |\n| 11 | 栈 | [第11部分: 栈](#第11部分-栈) | 括号匹配、下标哨兵、上下文保存、模拟递归 |\n| 12 | 堆 | [第12部分: 堆](#第12部分-堆) | Top K、多路合并、动态中位数、过期清理 |\n| 13 | 贪心 | [第13部分: 贪心](#第13部分-贪心) | 局部选择、覆盖边界、区间闭合、候选淘汰 |\n| 14 | 动态规划 | [第14部分: 动态规划](#第14部分-动态规划) | 状态定义、转移方程、遍历顺序、空间压缩 |\n| 15 | 技巧 | [第15部分: 技巧](#第15部分-技巧) | 进位、翻转、异或、投票、原地标记、数学观察 |\n| 16 | 排序 | [第16部分: 排序](#第16部分-排序) | 排序预处理、区间扫描、三路划分、桶排序 |\n| 17 | 深度优先搜索 | [第17部分: 深度优先搜索](#第17部分-深度优先搜索) | 递归状态、访问标记、回溯恢复、图染色 |\n| 18 | 广度优先搜索 | [第18部分: 广度优先搜索](#第18部分-广度优先搜索) | 按层扩展、最短距离、多源扩散、拓扑剥离 |\n| 19 | 设计 | [第19部分: 设计](#第19部分-设计) | 接口语义、结构组合、复杂度不变量 |\n| 20 | 分治 | [第20部分: 分治](#第20部分-分治) | 区间递归、左右合并、快速选择、候选验证 |\n| 21 | 递归 | [第21部分: 递归](#第21部分-递归) | 函数语义、终止条件、子问题返回值 |\n| 22 | 前缀和 | [第22部分: 前缀和](#第22部分-前缀和) | 区间差、历史计数、左右乘积、树上路径和 |\n| 23 | 字符串 | [第23部分: 字符串](#第23部分-字符串) | 子串、括号、回文、解析、Trie、字符串 DP |\n\n## 0.1 一页速记\n\n- 哈希表：先定义 `key/value`，再决定“先查后放”或“先放后查”。\n- 双指针：每次移动都要说明会淘汰哪一批候选，以及为什么安全。\n- 滑动窗口：只处理连续区间，窗口状态要能随左右边界 O(1) 增删。\n- 矩阵：先统一 `r/c/m/n` 的坐标语义，再选边界收缩、DFS/BFS、DP 或二分。\n- 链表：优先 dummy，删除找前驱，反转先保存 `next`，分组先确认长度。\n- 二叉树：先定义递归函数语义，再决定前序传状态、中序用有序性、后序汇总信息。\n- 图论：先翻译“节点”和“边”，再选 DFS 连通块、BFS 最短层数或拓扑判环。\n- 回溯：路径、选择列表、剪枝条件、撤销现场四件套缺一不可。\n- 二分查找：先找单调性，再定义边界语义，最后确认返回 `left` 还是 `right`。\n- 单调栈：栈里存等待结算的下标，出栈瞬间确定右边界，新的栈顶常给左边界。\n- 栈：保存最近未完成状态，括号存匹配，下标存边界，上下文存外层现场。\n- 堆：动态维护极值；固定大小 Top K 让堆顶表示当前集合中最弱候选。\n- 贪心：局部选择必须能证明安全，常见证明方式是覆盖边界、交换论证或支配关系。\n- 动态规划：先写清 `dp` 含义，再写初始化、转移、遍历顺序和压缩方向。\n- 技巧：特殊约束触发特殊模型，重点识别进位、异或抵消、投票抵消、原地标记。\n- 排序：排序用于制造单调性、相邻关系或分组结构，后续常接双指针、扫描、堆或桶。\n- DFS：关注当前调用处理什么、返回什么、进入/退出时维护什么状态。\n- BFS：队列按层扩展；最短步数看层数，多源扩散先把所有源点入队。\n- 设计：从接口复杂度反推结构组合，每个操作都要维护同一组不变量。\n- 分治：定义子问题区间、递归返回值和跨区间合并信息。\n- 递归：用一句话定义函数语义，当前层只处理当前小问题，其余交给子问题。\n- 前缀和：把区间问题转成两个前缀状态之差；计数题要存历史频次。\n- 字符串：先判断子串、子序列、括号结构、回文结构、词典结构或构造搜索。\n\n## 0.2 算法选择决策树\n\n1. **题目处理连续子数组或连续子串？**\n   - 状态能随左右边界 O(1) 增删：优先滑动窗口。\n   - 问区间和、区间积、历史状态差：优先前缀和。\n   - 窗口长度固定且问极值：考虑单调队列或堆。\n   - 数组全为正数且问最短/最长满足条件区间：优先滑动窗口。\n\n2. **题目存在有序性、排序后有序性或答案单调性？**\n   - 查具体值、左右边界、插入位置：二分查找。\n   - 排序后两端夹逼或去重枚举：排序 + 双指针。\n   - `check(mid)` 随 `mid` 单调变化：答案空间二分。\n   - 行列分别有序的矩阵：优先阶梯搜索；全局有序矩阵可展平二分。\n\n3. **题目是链表结构？**\n   - 删除、插入、合并：先考虑 dummy。\n   - 倒数、环、相交：快慢指针或双指针对齐。\n   - 反转、分组反转、回文链表：三指针反转骨架。\n   - 随机指针或对象复制：哈希映射或穿插复制。\n\n4. **题目是树或递归结构？**\n   - 需要从父节点向子节点传状态：前序 DFS。\n   - 需要 BST 有序性：中序 DFS。\n   - 需要左右子树结果合并：后序 DFS。\n   - 需要按层、右视图、最短深度：BFS。\n   - 需要构造树：区间递归 + 下标映射。\n\n5. **题目能翻译成图？**\n   - 求连通块数量或区域大小：DFS/BFS + 访问标记。\n   - 求最短步数或最少分钟：BFS。\n   - 多个起点同时扩散：多源 BFS。\n   - 存在先修关系或依赖顺序：拓扑排序或 DFS 三色判环。\n   - 需要枚举路径且可重复回退：回溯，注意撤销现场。\n\n6. **题目要求枚举所有方案？**\n   - 组合、子集：用 `start` 控制选择范围。\n   - 排列：用 `used` 控制元素是否已在路径中。\n   - 切分：用 `index` 表示下一刀起点。\n   - 棋盘约束：用列、对角线集合剪枝。\n   - 网格路径：访问标记要在递归退出前恢复。\n\n7. **题目问最近更大/更小、右侧第一个、面积或水量？**\n   - 需要等待右边界出现：单调栈。\n   - 固定窗口最大值：单调队列。\n   - Top K 或动态极值：堆。\n   - 数据流中位数：大顶堆 + 小顶堆。\n\n8. **题目有重复子问题和最优子结构？**\n   - 单序列位置依赖：线性 DP。\n   - 二维网格路径：矩阵 DP。\n   - 两个字符串互相匹配：双序列 DP。\n   - 容量选择：背包 DP。\n   - 树上路径贡献：树形 DP。\n   - 能被贪心覆盖时，优先选择变量更少的贪心写法。\n\n9. **题目约束暗示特殊技巧？**\n   - 数字按位、成对出现：异或或按位计数。\n   - 超过一半：摩尔投票。\n   - 数组值域落在 `[1, n]`：原地哈希、抽屉原理或函数图快慢指针。\n   - 原地旋转、翻转、下一个排列：找关键位置再局部调整。\n   - 频率选择：哈希计数后接桶、堆或快速选择。\n\n## 0.3 题号速查索引\n\n> 说明：本表覆盖笔记中出现的核心题与相邻变形题。复习时优先看“主入口”，再按“关联专题”补充替代解法或证明角度。\n\n| 题号 | 题目 | 主入口 | 关联 堆](#第12部分-堆) | 哈希表、桶排序 |\n| 394 | 字符串解码 · [力扣原题 ↗](https://leetcode.cn/problems/decode-string/) | [栈](#第11部分-栈) | 递归、字符串 |\n| 416 | 分割等和子集 · [力扣原题 ↗](https://leetcode.cn/problems/partition-equal-subset-sum/) | [动态规划](#第14部分-动态规划) | 背包 |\n| 437 | 路径总和 III · [力扣原题 ↗](https://leetcode.cn/problems/path-sum-iii/) | [二叉树](#第6部分-二叉树) | 前缀和、DFS |\n| 438 | 找到字符串中所有字母异位词 · [力扣原题 ↗](https://leetcode.cn/problems/find-all-anagrams-in-a-string/) | [滑动窗口](#第3部分-滑动窗口) | 哈希表、字符串 |\n| 543 | 二叉树的直径 · [力扣原题 ↗](https://leetcode.cn/problems/diameter-of-binary-tree/) | [二叉树](#第6部分-二叉树) | DFS |\n| 560 | 和为 K 的子数组 · [力扣原题 ↗](https://leetcode.cn/problems/subarray-sum-equals-k/) | [前缀和](#第22部分-前缀和) | 哈希表 |\n| 567 | 字符串的排列 · [力扣原题 ↗](https://leetcode.cn/problems/permutation-in-string/) | [滑动窗口](#第3部分-滑动窗口) | 字符串 |\n| 739 | 每日温度 · [力扣原题 ↗](https://leetcode.cn/problems/daily-temperatures/) | [单调栈](#第10部分-单调栈) | 栈 |\n| 763 | 划分字母区间 · [力扣原题 ↗](https://leetcode.cn/problems/partition-labels/) | [贪心](#第13部分-贪心) | 字符串 |\n| 994 | 腐烂的橘子 · [力扣原题 ↗](https://leetcode.cn/problems/rotting-oranges/) | [广度优先搜索](#第18部分-广度优先搜索) | 图论、矩阵 |\n| 1143 | 最长公共子序列 · [力扣原题 ↗](https://leetcode.cn/problems/longest-common-subsequence/) | [动态规划](#第14部分-动态规划) | 字符串 |\n\n---\n================================================================================\n# 第1部分: 哈希表\n\n==================================================================\n\n> 目标：本文把 Hot100 中所有依赖“快速定位、计数、映射、去重”的题抽象成可复用模板。复习时先判断哈希表保存什么，再判断查询发生在更新之前还是之后。\n\n## 1. 哈希表题的底层模型\n\n哈希表题的关键在于定义清楚“键和值分别代表什么”。每道题先问五个问题：\n\n| 问题 | 如果答案是“是” | 常用处理 |\n|---|---|---|\n| 需要快速找另一个数吗 | 两数之和、前缀和补数 | `value -> index/count` |\n| 需要统计频率吗 | 字母异位词、前 K 高频 | `value -> frequency` |\n| 需要判断是否出现过吗 | 最长连续序列、缺失正数 | `unordered_set` 去重 |\n| 需要维护对象映射吗 | 随机链表复制、构造二叉树 | `old -> new`、`value -> index` |\n| 需要 O(1) 访问并维护顺序吗 | LRU 缓存 | 哈希表 + 双向链表 |\n\n哈希表题最常见的抽象动作有五类：\n\n| 动作 | 对应 Hot100 题目 | 复习关键词 |\n|---|---|---|\n| 补数查询 | `1`、`560` | 先查后放、避免用同一个元素 |\n| 频率计数 | `49`、`438`、`347`、`169` | 计数、签名、桶/堆 |\n| 集合去重 | `128`、`41` | 起点判断、原地哈希 |\n| 映射关系 | `138`、`105`、`208` | 节点映射、下标映射、字符分支 |\n| 设计组合 | `146` | `unordered_map` 查节点，链表调顺序 |\n\n## 2. Hot100 哈希表题型地图\n\n\n| 题型 | 题目 | 抽象能力 | 一句话记忆 |\n|---|---|---|---|\n| 补数查找 | `1 两数之和` | 当前元素和历史元素配对 | 先查 `target - x`，再记录 `x` |\n| 滑窗计数 | `3 无重复字符`、`76 最小覆盖子串`、`438 找到所有字母异位词` | 频次表维护窗口状态 | 窗口合法性由计数差决定 |\n| 字符串分组 | `49 字母异位词分组` | 把等价字符串映射到同一签名 | 排序串或 26 维计数都能做 key |\n| 集合起点 | `128 最长连续序列` | 只从连续段起点扩展 | 只有 `x - 1` 不存在时才开跑 |\n| 前缀和计数 | `560 和为 K 的子数组` | 历史前缀和频次 | 查 `sum - k`，避免写成 `k - sum` |\n| 原地哈希 | `41 缺失的第一个正数`、`73 矩阵置零` | 利用数组/首行首列作标记 | 题目要求 O(1) 空间时要找可复用位置 |\n| 对象映射 | `138 随机链表复制`、`105 构造二叉树` | 建立旧对象到新对象、值到下标的映射 | 先建映射，再连接关系 |\n| 频率 TopK | `347 前 K 个高频元素`、`169 多数元素` | 频率统计后选择 | 统计是第一步，选择可用堆、桶或投票 |\n| 设计型哈希 | `146 LRU 缓存`、`208 Trie` | O(1) 查找与结构组合 | 哈希表负责定位，结构负责语义 |\n\n## 3. 复习顺序建议\n\n先练“查历史”，再练“统计状态”，最后练“组合结构”：\n\n1. `1 两数之和`：掌握先查后放。\n2. `49 字母异位词分组`：掌握字符串签名。\n3. `128 最长连续序列`：练集合去重和起点判断。\n4. `560 和为 K 的子数组`：理解前缀和频次表。\n5. `3`、`76`、`438`：把哈希计数放进滑动窗口。\n6. `347`、`169`：练频率统计后的选择策略。\n7. `41`、`73`：理解 O(1) 空间下的原地标记。\n8. `138`、`105`：练对象和下标映射。\n9. `146`、`208`：练哈希表与数据结构组合设计。\n\n## 4. 关键套路详解\n\n### 4.1 先查后放用于避免自配对\n\n`1 两数之和`中如果先把当前元素放入表，再查询补数，`target = 2 * nums[i]` 时容易把自己当成答案。正确动作是先查历史，再记录当前值。这个顺序也适用于前缀和计数：先统计已有历史能产生多少答案，再把当前前缀和加入历史。\n\n### 4.2 key 的设计决定题目难度\n\n哈希表的 key 必须表达“等价关系”。字母异位词分组可以用排序后的字符串作为 key，也可以用 26 个字符频次拼成 key。构造二叉树用节点值定位中序下标；随机链表复制用旧节点地址定位新节点；LRU 用业务 key 定位链表节点。\n\n### 4.3 频率表有两种语义\n\n| 语义 | 代表题 | 写法 |\n|---|---|---|\n| 历史出现次数 | `560`、`1` 扩展 | `count[prefix]++` 表示过去有多少个前缀和 |\n| 当前窗口欠账 | `76`、`438` | `need[ch]` 表示还缺多少或窗口差值 |\n\n这两种语义不能混。历史表通常只增不减，滑动窗口表会随着左右指针移动增减。\n\n### 4.4 `unordered_set` 常用于“只关心存在性”\n\n`128 最长连续序列`不需要每个数出现几次，只需要知道某个数是否存在。先全部放进集合，再只从 `x - 1` 不存在的起点扩展，可以保证每个数最多被访问常数次。\n\n### 4.5 设计题必须把职责拆开\n\n`146 LRU 缓存`需要哈希表和双向链表配合。哈希表负责 O(1) 定位 key；双向链表负责 O(1) 维护最近使用顺序。两个结构必须同步更新。\n\n## 5. 抽象代码模板\n\n本节按照原始单题笔记的参考解法整理。哈希表专题不能只给“更通用”的写法：`49` 原始解法是排序字符串做 key，`347` 原始主解是桶排序，`138` 原始最终解是 O(1) 空间穿插复制，`146` 原始训练点是手写双向链表，`41`、`73` 则是 O(1) 空间下的原地哈希/原地标记。\n\n### 5.1 补数查询与历史表\n\n#### 适用题型\n\n- `1 两数之和`：当前元素查历史补数。\n- `560 和为 K 的子数组`：当前前缀和查历史 `sum - k`。\n- 所有“当前状态需要和历史状态配对”的题。\n\n#### 核心思路\n\n历史表只保存当前位置之前的信息，所以查询必须发生在更新当前状态之前。两数之和先查 `target - nums[i]`，再记录 `nums[i]`；前缀和统计先查历史 `sum - k` 出现次数，再把当前 `sum` 加入表。`map[0] = 1` 表示空前缀，是从下标 0 开始的合法区间边界。\n\n#### 代码 A：两数之和\n\n> **题目简述：** 1 两数之和：给定整数数组与目标值，返回和为目标值的两个不同元素下标，答案唯一。 [力扣原题 ↗](https://leetcode.cn/problems/two-sum/)\n\n```cpp\n#include \u003cbits/stdc++.h>\nusing namespace std;\n\nvector\u003cint> twoSum(vector\u003cint>& nums, int target) {\n    unordered_map\u003cint, int> map; // value -> 历史下标。\n\n    for (int i = 0; i \u003c (int)nums.size(); i++) {\n        auto it = map.find(target - nums[i]);\n        if (it != map.end()) {\n            // 原始笔记返回 {当前下标, 历史下标}；题目允许任意顺序。\n            return {i, it->second};\n        }\n        // 当前元素只给后续元素使用，避免同一个元素和自己配对。\n        map[nums[i]] = i;\n    }\n\n    return {};\n}\n```\n\n#### 代码 B：和为 K 的子数组\n\n> **题目简述：** 560 和为 K 的子数组：给定整数数组和整数 K，统计元素和恰好为 K 的连续子数组数量。 [力扣原题 ↗](https://leetcode.cn/problems/subarray-sum-equals-k/)\n\n```cpp\nint subarraySum(vector\u003cint>& nums, int k) {\n    unordered_map\u003cint, int> map{{0, 1}}; // 前缀和 -> 出现次数；空前缀出现一次。\n    int res = 0;\n    int sum = 0;\n\n    for (int i = 0; i \u003c (int)nums.size(); i++) {\n        sum += nums[i];\n\n        // 当前 sum 需要找历史 sum - k，历史表 value 是次数，不能存下标。\n        if (map.count(sum - k)) {\n            res += map[sum - k];\n        }\n\n        map[sum]++;\n    }\n\n    return res;\n}\n```\n\n#### 变形点对照\n\n| 题型 | key | value | 查询顺序 |\n|---|---|---|---|\n| `1 两数之和` | 数值 | 历史下标 | 先查补数，再放当前值 |\n| `560 和为 K 的子数组` | 前缀和 | 历史出现次数 | 先查 `sum - k`，再 `map[sum]++` |\n| 前缀异或 | 异或值 | 历史出现次数 | 先查 `xor ^ target`，再更新当前 |\n\n#### 易错点\n\n- 两数之和不能先放当前元素，否则可能自配对。\n- `560` 查的是 `sum - k`，避免写成 `k - sum`。\n- 统计区间数量时，哈希表 value 必须是次数。\n\n### 5.2 签名分组与频率选择\n\n#### 适用题型\n\n- `49 字母异位词分组`：原始笔记使用排序后的字符串作为 key。\n- `347 前 K 个高频元素`：原始主解使用桶排序，频率最大不超过 `n`。\n- `169 多数元素`：哈希计数能做，但原始题解用 O(1) 空间摩尔投票。\n\n#### 核心思路\n\n分组题的 key 要表达“两个对象等价”。字母异位词排序后相同，因此排序串可作为最直观 key。Top K 高频先用哈希表统计 `num -> freq`，再根据频率选择；本题原始主解用桶排序把相同频率的数放入同一个桶，从高频桶往低频桶收集答案。多数元素不需要完整频率表，摩尔投票通过候选抵消保留最终多数。\n\n#### 代码 A：字母异位词排序 key\n\n> **题目简述：** 49 字母异位词分组：给定字符串数组，将包含相同字符及频次的字母异位词归为一组。 [力扣原题 ↗](https://leetcode.cn/problems/group-anagrams/)\n\n```cpp\nvector\u003cvector\u003cstring>> groupAnagrams(vector\u003cstring>& strs) {\n    unordered_map\u003cstring, vector\u003cstring>> map; // sorted string -> 原字符串列表。\n\n    for (string& s : strs) {\n        string key = s;\n        sort(key.begin(), key.end());\n        map[key].push_back(s);\n    }\n\n    vector\u003cvector\u003cstring>> res;\n    for (auto it = map.begin(); it != map.end(); it++) {\n        res.push_back(it->second);\n    }\n    return res;\n}\n```\n\n#### 代码 B：前 K 高频元素桶排序\n\n> **题目简述：** 347 前 K 个高频元素：给定整数数组和 K，返回出现频率最高的 K 个元素，结果顺序不限。 [力扣原题 ↗](https://leetcode.cn/problems/top-k-frequent-elements/)\n\n```cpp\nvector\u003cint> topKFrequent(vector\u003cint>& nums, int k) {\n    unordered_map\u003cint, int> count;\n    for (int num : nums) {\n        count[num]++;\n    }\n\n    int n = (int)nums.size();\n    vector\u003cvector\u003cint>> buckets(n + 1); // buckets[freq] 存所有出现 freq 次的数。\n    for (auto& [num, freq] : count) {\n        buckets[freq].push_back(num);\n    }\n\n    vector\u003cint> res;\n    for (int freq = n; freq >= 0; freq--) {\n        for (int num : buckets[freq]) {\n            res.push_back(num);\n            if ((int)res.size() == k) {\n                return res;\n            }\n        }\n    }\n\n    return res;\n}\n```\n\n#### 代码 C：多数元素摩尔投票\n\n> **题目简述：** 169 多数元素：给定长度为 N 的数组，找出出现次数严格超过 N/2 且保证存在的元素。 [力扣原题 ↗](https://leetcode.cn/problems/majority-element/)\n\n```cpp\nint majorityElement(vector\u003cint>& nums) {\n    int candidate = 0;\n    int count = 0;\n\n    for (int num : nums) {\n        if (count == 0) {\n            candidate = num;\n        }\n\n        if (num == candidate) {\n            count++;\n        } else {\n            count--;\n        }\n    }\n\n    return candidate;\n}\n```\n\n#### 变形点对照\n\n| 题型 | 原始主线 | 复杂度关注 | 可选替代 |\n|---|---|---|---|\n| `49` 异位词分组 | 排序串做 key | 单串排序 O(L log L) | 26 维计数签名 O(L)，注意加分隔符 |\n| `347` Top K | 桶排序 | O(n) 时间，O(n) 空间 | 小顶堆 O(n log k) 更通用 |\n| `169` 多数元素 | 摩尔投票 | O(1) 空间 | 哈希计数更直观但空间 O(n) |\n\n#### 易错点\n\n- 异位词排序 key 要用原字符串副本，不能把要返回的字符串排序掉。\n- 桶排序桶下标是频率，最大频率不会超过 `nums.size()`。\n- 摩尔投票依赖题目保证多数元素一定存在；否则最后还要二次验证。\n\n### 5.3 集合去重与连续段起点\n\n#### 适用题型\n\n- `128 最长连续序列`：只关心值是否存在，不关心次数。\n- 去重后寻找连续段、区间起点、最长链等题。\n- 缺失正数如果不要求 O(1) 空间也可用集合；但 Hot100 原题要求原地哈希，见下一节。\n\n#### 核心思路\n\n先把数组一次性放入 `unordered_set` 去重。只有 `x - 1` 不存在时，`x` 才是连续段起点；从非起点扩展会重复扫描同一段。可选剪枝 `res * 2 >= map.size()` 只用于提前结束，不参与正确性证明。\n\n#### 代码模板：共同骨架\n\n> **题目简述：** 128 最长连续序列：给定无序整数数组，在线性时间内求数值连续序列的最长长度。 [力扣原题 ↗](https://leetcode.cn/problems/longest-consecutive-sequence/)\n\n```cpp\nint longestConsecutive(vector\u003cint>& nums) {\n    unordered_set\u003cint> map(nums.begin(), nums.end()); // 一步完成去重建集合。\n    int res = 0;\n\n    for (int x : map) {\n        if (map.find(x - 1) != map.end()) {\n            continue; // x 没有作为连续段起点。\n        }\n\n        int y = x + 1;\n        while (map.find(y) != map.end()) {\n            y++;\n        }\n\n        res = max(res, y - x);\n        // 原始笔记中的可选剪枝：if (res * 2 >= (int)map.size()) break;\n    }\n\n    return res;\n}\n```\n\n#### 变形点对照\n\n| 变形 | 起点判断 | 扩展方式 | 说明 |\n|---|---|---|---|\n| `128` 最长连续序列 | `x - 1` 不存在 | `y++` 直到不存在 | 每段只从起点扫描一次 |\n| 最长连续字符/编号段 | 前驱状态不存在 | 沿 next 状态扩展 | key 类型可替换 |\n| 可选剪枝 | `res` 已足够大 | 提前 break | 只影响性能，不影响正确性 |\n\n#### 易错点\n\n- 不能从每个数都向后扩展，否则会退化到 O(n^2)。\n- 遍历集合已经去重，不需要再处理重复数字。\n- 可选剪枝只影响提前结束，不要把它当作正确性条件。\n\n### 5.4 滑动窗口哈希计数\n\n#### 适用题型\n\n- `3 无重复字符的最长子串`：原始笔记使用 `unordered_set\u003cchar>` 保存当前窗口。\n- `76 最小覆盖子串`：原始笔记使用 `unordered_map\u003cchar, int>` 欠账表和 `valid`。\n- `438 找到所有字母异位词`：原始笔记使用 `int map[26]` 欠账数组和过量收缩。\n\n#### 核心思路\n\n滑动窗口表描述“当前窗口状态”，会随着左右指针移动增减。`3` 的集合就是窗口内容；`76` 的 `map` 是目标字符欠账，`valid` 是已经还清的字符种类；`438` 的数组是小写字母欠账，当前右端字符透支时持续左缩。\n\n#### 代码 A：无重复字符窗口集合\n\n> **题目简述：** 3 无重复字符的最长子串：给定字符串，求不含重复字符的最长连续子串长度。 [力扣原题 ↗](https://leetcode.cn/problems/longest-substring-without-repeating-characters/)\n\n```cpp\nint lengthOfLongestSubstring(string s) {\n    unordered_set\u003cchar> set;\n    int left = 0;\n    int res = 0;\n\n    for (int right = 0; right \u003c (int)s.size(); right++) {\n        while (set.count(s[right])) {\n            set.erase(s[left]);\n            left++;\n        }\n        set.insert(s[right]);\n        res = max(res, right - left + 1);\n    }\n\n    return res;\n}\n```\n\n#### 代码 B：最小覆盖子串 valid 写法\n\n> **题目简述：** 76 最小覆盖子串：在字符串 S 中寻找覆盖字符串 T 全部字符及其频次的最短连续子串。 [力扣原题 ↗](https://leetcode.cn/problems/minimum-window-substring/)\n\n```cpp\nstring minWindow(string s, string t) {\n    unordered_map\u003cchar, int> map;\n    for (int i = 0; i \u003c (int)t.size(); i++) {\n        map[t[i]]++;\n    }\n\n    int valid = 0;\n    int l = 0;\n    int start = 0;\n    int minLen = INT_MAX;\n\n    for (int r = 0; r \u003c (int)s.size(); r++) {\n        if (map.count(s[r])) {\n            map[s[r]]--;\n            if (map[s[r]] == 0) valid++;\n        }\n\n        while (valid == (int)map.size()) {\n            if (r - l + 1 \u003c minLen) {\n                minLen = r - l + 1;\n                start = l;\n            }\n\n            if (map.count(s[l])) {\n                if (map[s[l]] == 0) valid--;\n                map[s[l]]++;\n            }\n            l++;\n        }\n    }\n\n    return minLen == INT_MAX ? \"\" : s.substr(start, minLen);\n}\n```\n\n#### 代码 C：找到所有异位词欠账数组写法\n\n> **题目简述：** 438 找到字符串中所有字母异位词：给定字符串 S 和 P，返回 S 中所有与 P 字符及频次相同的子串起点。 [力扣原题 ↗](https://leetcode.cn/problems/find-all-anagrams-in-a-string/)\n\n```cpp\nvector\u003cint> findAnagrams(string s, string p) {\n    vector\u003cint> res;\n    int map[26] = {0};\n    int m = (int)s.size();\n    int n = (int)p.size();\n\n    for (int i = 0; i \u003c n; i++) {\n        map[p[i] - 'a']++;\n    }\n\n    int left = 0;\n    for (int right = 0; right \u003c m; right++) {\n        int in = s[right] - 'a';\n        map[in]--;\n\n        while (map[in] \u003c 0) {\n            map[s[left] - 'a']++;\n            left++;\n        }\n\n        if (right - left + 1 == n) {\n            res.push_back(left);\n        }\n    }\n\n    return res;\n}\n```\n\n#### 变形点对照\n\n| 题型 | 表的语义 | 合法条件 | 更新顺序 |\n|---|---|---|---|\n| `3` | 当前窗口字符集合 | 无重复 | 重复则先删左端，再插入当前 |\n| `76` | 目标字符欠账 | `valid == map.size()` | 满足时持续缩左并更新最短 |\n| `438` | 小写字母欠账 | 当前字符不透支且长度为 `p.size()` | 右扩 `--`，透支时左缩 `++` |\n\n#### 易错点\n\n- 窗口表会随左指针移动撤销状态，不能当历史表使用。\n- `76` 的 `valid` 表示满足的字符种类数，不能当总字符数使用。\n- `438` 不需要每轮比较两张表；原始写法用透支状态驱动左缩。\n\n### 5.5 原地哈希与原地标记\n\n#### 适用题型\n\n- `41 缺失的第一个正数`：原始笔记要求 O(1) 额外空间，不能用额外哈希表。\n- `73 矩阵置零`：原始笔记使用第一行、第一列作为标记空间。\n- 所有“题目要求 O(1) 空间，必须复用输入结构做标记”的题。\n\n#### 核心思路\n\n`41` 把值 `x` 放到下标 `x - 1`，使数组尽量满足 `nums[i] == i + 1`；交换后当前位置可能换来新数字，所以必须 `while` 继续归位。原始代码里的边界应写成 `nums[i] \u003c= n`，数字 `n` 也应该放到下标 `n - 1`。`73` 征用第一行和第一列作为行列标记，额外用 `col0` 记录第一列是否需要置零。\n\n#### 代码 A：缺失的第一个正数\n\n> **题目简述：** 41 缺失的第一个正数：给定无序整数数组，以线性时间和常数额外空间找出最小缺失正整数。 [力扣原题 ↗](https://leetcode.cn/problems/first-missing-positive/)\n\n```cpp\nint firstMissingPositive(vector\u003cint>& nums) {\n    int n = (int)nums.size();\n\n    for (int i = 0; i \u003c n; i++) {\n        // 把 x 放到 nums[x - 1]。必须用 while，因为交换来的新 nums[i] 可能还要继续归位。\n        // 注意边界是 \u003c= n；数字 n 应该放到下标 n - 1。\n        while (nums[i] > 0 && nums[i] \u003c= n && nums[i] != nums[nums[i] - 1]) {\n            swap(nums[i], nums[nums[i] - 1]);\n        }\n    }\n\n    for (int i = 0; i \u003c n; i++) {\n        if (nums[i] != i + 1) return i + 1;\n    }\n\n    return n + 1;\n}\n```\n\n#### 代码 B：矩阵置零首行首列标记\n\n> **题目简述：** 73 矩阵置零：若矩阵某元素为零，则将其整行整列置零，要求在原矩阵上完成。 [力扣原题 ↗](https://leetcode.cn/problems/set-matrix-zeroes/)\n\n```cpp\nvoid setZeroes(vector\u003cvector\u003cint>>& matrix) {\n    int m = (int)matrix.size();\n    int n = (int)matrix[0].size();\n    int col0 = 0; // 单独记录第一列是否需要置零。\n\n    for (int i = 0; i \u003c m; i++) {\n        if (matrix[i][0] == 0) col0 = 1;\n        for (int j = 1; j \u003c n; j++) {\n            if (matrix[i][j] == 0) {\n                matrix[i][0] = 0; // 标记第 i 行需要置零。\n                matrix[0][j] = 0; // 标记第 j 列需要置零。\n            }\n        }\n    }\n\n    for (int i = 1; i \u003c m; i++) {\n        for (int j = 1; j \u003c n; j++) {\n            if (matrix[i][0] == 0 || matrix[0][j] == 0) {\n                matrix[i][j] = 0;\n            }\n        }\n    }\n\n    if (matrix[0][0] == 0) {\n        for (int j = 0; j \u003c n; j++) {\n            matrix[0][j] = 0;\n        }\n    }\n    if (col0 == 1) {\n        for (int i = 0; i \u003c m; i++) {\n            matrix[i][0] = 0;\n        }\n    }\n}\n```\n\n#### 变形点对照\n\n| 题型 | 复用空间 | 扫描顺序 | 关键边界 |\n|---|---|---|---|\n| `41` | 数组下标本身 | 先归位，再找第一个不匹配 | `1 \u003c= nums[i] \u003c= n` |\n| `73` | 第一行第一列 | 先写标记，再处理中间，最后处理首行首列 | 第一列需单独 `col0` |\n\n#### 易错点\n\n- `41` 交换条件必须防止重复数字死循环：`nums[i] != nums[nums[i] - 1]`。\n- `41` 条件写成 `\u003c n` 会漏掉数字 `n` 的归位。\n- `73` 必须最后处理第一行和第一列，否则标记会被提前破坏。\n\n### 5.6 对象映射、下标映射与空间优化\n\n#### 适用题型\n\n- `138 随机链表复制`：哈希表版是基础思路，但原始最终代码使用 O(1) 空间穿插复制。\n- `105 从前序与中序遍历序列构造二叉树`：用哈希表把节点值映射到中序下标。\n- 图克隆、树构造等“旧结构到新结构”或“值到位置”映射题。\n\n#### 核心思路\n\n随机链表复制的哈希表版是 `old node -> new node`，但原始笔记进一步使用“影分身”：把复制节点插在原节点后面，利用 `cur->random->next` 找到 random 的复制节点，最后拆分两条链。构造树则用中序下标表避免每次线性查根。\n\n#### 代码 A：随机链表 O(1) 穿插复制\n\n> **题目简述：** 138 随机链表的复制：深拷贝一个同时含 next 和 random 指针的链表，新结点不得指向原链表。 [力扣原题 ↗](https://leetcode.cn/problems/copy-list-with-random-pointer/)\n\n```cpp\nclass Node {\npublic:\n    int val;\n    Node* next;\n    Node* random;\n    Node(int _val) : val(_val), next(nullptr), random(nullptr) {}\n};\n\nNode* copyRandomList(Node* head) {\n    if (head == nullptr) return nullptr;\n\n    Node* cur = head;\n    while (cur != nullptr) {\n        // 原始笔记用了带 next/random 的构造调用；如果 Node 只有单参构造，应手动连接 next。\n        Node* copy = new Node(cur->val);\n        copy->next = cur->next;\n        cur->next = copy;\n        cur = copy->next;\n    }\n\n    cur = head;\n    while (cur != nullptr) {\n        if (cur->random != nullptr) {\n            cur->next->random = cur->random->next;\n        }\n        cur = cur->next->next;\n    }\n\n    Node dummy(-1);\n    Node* tail = &dummy;\n    cur = head;\n    while (cur != nullptr) {\n        Node* copy = cur->next;\n        cur->next = copy->next; // 恢复原链表。\n        tail->next = copy;      // 把复制节点接到新链表尾部。\n        tail = copy;\n        cur = cur->next;\n    }\n\n    return dummy.next;\n}\n```\n\n#### 代码 B：前序 + 中序构造二叉树\n\n> **题目简述：** 105 从前序与中序遍历序列构造二叉树：给定同一棵无重复值二叉树的前序和中序序列，还原并返回该树。 [力扣原题 ↗](https://leetcode.cn/problems/construct-binary-tree-from-preorder-and-inorder-traversal/)\n\n```cpp\nstruct TreeNode {\n    int val;\n    TreeNode* left;\n    TreeNode* right;\n    TreeNode(int x) : val(x), left(nullptr), right(nullptr) {}\n};\n\nTreeNode* buildDfs(vector\u003cint>& preorder, int preleft, int preright,\n                   vector\u003cint>& inorder, int inleft, int inright,\n                   unordered_map\u003cint, int>& map) {\n    if (preleft > preright) return nullptr;\n\n    int rootvalue = preorder[preleft];\n    int rootindex = map[rootvalue];\n    int leftsize = rootindex - inleft;\n\n    TreeNode* root = new TreeNode(rootvalue);\n    root->left = buildDfs(preorder, preleft + 1, preleft + leftsize,\n                          inorder, inleft, rootindex - 1, map);\n    root->right = buildDfs(preorder, preleft + leftsize + 1, preright,\n                           inorder, rootindex + 1, inright, map);\n    return root;\n}\n\nTreeNode* buildTree(vector\u003cint>& preorder, vector\u003cint>& inorder) {\n    unordered_map\u003cint, int> map; // 节点值 -> 中序下标。\n    for (int i = 0; i \u003c (int)inorder.size(); i++) {\n        map[inorder[i]] = i;\n    }\n    return buildDfs(preorder, 0, (int)preorder.size() - 1,\n                    inorder, 0, (int)inorder.size() - 1, map);\n}\n```\n\n#### 变形点对照\n\n| 题型 | 映射/空间策略 | 关键点 | 备注 |\n|---|---|---|---|\n| `138` 哈希表基础版 | `old -> new` | 先建节点，再连关系 | 空间 O(n) |\n| `138` 原始优化版 | 复制节点穿插在原链表 | `cur->random->next` 是 random 的复制节点 | 空间 O(1) |\n| `105` 构造树 | `value -> inorder index` | 用左子树大小切前序区间 | 避免反复切片 |\n\n#### 易错点\n\n- 随机链表复制后必须恢复原链表，并拆出新链表。\n- `random` 为空时不能访问 `cur->random->next`。\n- 构造树时前序和中序边界必须同时收缩，左子树大小是 `rootindex - inleft`。\n\n### 5.7 哈希表 + 手写双向链表设计\n\n#### 适用题型\n\n- `146 LRU 缓存`：原始笔记使用 `unordered_map\u003cint, Node*>` 加手写双向链表。\n- 需要 O(1) 查找、移动、删除任意节点并维护访问顺序的缓存题。\n- `std::list + splice` 是工程简化写法，但不能替代手写链表训练点。\n\n#### 核心思路\n\n哈希表负责通过 key O(1) 定位链表节点，双向链表负责维护从新到旧的访问顺序。虚拟 `head/tail` 避免删除头尾时分类讨论。`get` 命中和 `put` 更新都要把节点移动到头部；容量超限时淘汰 `tail->prev`，并同步从哈希表删除和释放节点。\n\n#### 代码模板：共同骨架\n\n> **题目简述：** 146 LRU 缓存：设计定容量缓存，使查询和写入均为平均 O(1)，满时淘汰最久未使用项。 [力扣原题 ↗](https://leetcode.cn/problems/lru-cache/)\n\n```cpp\nclass LRUCache {\n    struct Node {\n        int key;\n        int value;\n        Node* prev;\n        Node* next;\n        Node(int k, int v) : key(k), value(v), prev(nullptr), next(nullptr) {}\n    };\n\n    unordered_map\u003cint, Node*> map; // key -> 链表节点。\n    Node* head;\n    Node* tail;\n    int cap;\n\n    void remove(Node* node) {\n        node->prev->next = node->next;\n        node->next->prev = node->prev;\n    }\n\n    void add(Node* node) {\n        node->prev = head;\n        node->next = head->next;\n        head->next->prev = node;\n        head->next = node;\n    }\n\npublic:\n    LRUCache(int capacity) : cap(capacity) {\n        head = new Node(-1, -1);\n        tail = new Node(-1, -1);\n        head->next = tail;\n        tail->prev = head;\n    }\n\n    int get(int key) {\n        if (!map.count(key)) return -1;\n\n        Node* node = map[key];\n        remove(node);\n        add(node); // 命中后刷新为最近使用。\n        return node->value;\n    }\n\n    void put(int key, int value) {\n        if (map.count(key)) {\n            Node* node = map[key];\n            node->value = value;\n            remove(node);\n            add(node);\n            return;\n        }\n\n        Node* node = new Node(key, value);\n        map[key] = node;\n        add(node);\n\n        if ((int)map.size() > cap) {\n            Node* delnode = tail->prev;\n            map.erase(delnode->key);\n            remove(delnode);\n            delete delnode;\n        }\n    }\n};\n```\n\n#### 变形点对照\n\n| 写法 | 查找结构 | 顺序结构 | 适合场景 |\n|---|---|---|---|\n| 原始手写链表 | `unordered_map\u003cint, Node*>` | 虚拟头尾双向链表 | 训练底层指针和 O(1) 删除 |\n| `std::list` 简化版 | `unordered_map\u003cint, iterator>` | `list\u003cpair\u003cint,int>>` | 工程简洁，`splice` 移动节点 |\n\n#### 易错点\n\n- 更新已有 key 时不能新增节点，否则链表中会出现重复 key。\n- 淘汰尾节点时要先 `map.erase(delnode->key)`，再断链并 `delete`。\n- `get` 命中也算访问，必须移动到头部。\n\n### 5.8 Trie：字符到子节点的映射\n\n#### 适用题型\n\n- `208 实现 Trie`：固定小写字母字符集，原始笔记使用 `children[26]`。\n- 前缀查询、单词插入、完整单词查询。\n- 如果字符集不固定，可把 `children[26]` 换成 `unordered_map\u003cchar, TrieNode*>`。\n\n#### 核心思路\n\nTrie 的每一层代表一个字符位置，`children[index]` 指向对应字符的下一层节点。`insert` 没有节点就创建；`search` 和 `startsWith` 都先沿路径走，区别在于 `search` 必须检查最后节点 `isEnd`，而 `startsWith` 路径存在即可。\n\n#### 代码模板：共同骨架\n\n> **题目简述：** 208 实现 Trie：设计前缀树，支持插入单词、查询完整单词和判断是否存在指定前缀。 [力扣原题 ↗](https://leetcode.cn/problems/implement-trie-prefix-tree/)\n\n```cpp\nclass TrieNode {\npublic:\n    TrieNode* children[26]{};\n    bool isEnd = false;\n};\n\nclass Trie {\n    TrieNode* root = new TrieNode();\n\npublic:\n    void insert(string word) {\n        TrieNode* node = root;\n        for (char c : word) {\n            int index = c - 'a';\n            if (node->children[index] == nullptr) {\n                node->children[index] = new TrieNode();\n            }\n            node = node->children[index];\n        }\n        node->isEnd = true;\n    }\n\n    bool search(string word) {\n        TrieNode* node = root;\n        for (char c : word) {\n            int index = c - 'a';\n            if (node->children[index] == nullptr) return false;\n            node = node->children[index];\n        }\n        return node->isEnd;\n    }\n\n    bool startsWith(string prefix) {\n        TrieNode* node = root;\n        for (char c : prefix) {\n            int index = c - 'a';\n            if (node->children[index] == nullptr) return false;\n            node = node->children[index];\n        }\n        return true;\n    }\n};\n```\n\n#### 变形点对照\n\n| 操作 | 返回条件 | 易混点 |\n|---|---|---|\n| `insert` | 无返回 | 结束节点要标记 `isEnd = true` |\n| `search` | 路径存在且 `isEnd` | 不能把前缀当完整单词 |\n| `startsWith` | 路径存在即可 | 不需要检查 `isEnd` |\n\n#### 易错点\n\n- `children[26]{}` 要初始化为空指针。\n- `search` 必须检查 `isEnd`，否则会把前缀误判成完整单词。\n- 字符集超出小写字母时，不要直接用 `c - 'a'`。\n\n## 6. 高频易错点清单\n\n| 易错点 | 典型题目 | 规避方式 |\n|---|---|---|\n| 两数之和先放再查导致自配对 | `1` | 先查补数，再记录当前值 |\n| 前缀和忘记初始化 `map[0] = 1` | `560` | 空前缀用于统计从下标 0 开始的区间 |\n| 字母异位词原字符串被排序破坏 | `49` | 排序副本 `key`，不要改坏待返回字符串 |\n| TopK 只会堆而忘记桶排序 | `347` | 频率最大不超过 n，可用 `buckets[freq]` 线性收集 |\n| 多数元素使用哈希表占 O(n) 空间 | `169` | 原始优化是摩尔投票 O(1) 空间 |\n| 最长连续序列从每个数都扩展 | `128` | 只从 `x - 1` 不存在的起点扩展 |\n| 滑动窗口表和历史表混用 | `3`、`76`、`438`、`560` | 历史表只增，窗口表随左右指针增减 |\n| 原地哈希边界漏掉 n | `41` | 归位条件写 `1 \u003c= nums[i] \u003c= n` |\n| 矩阵置零提前清首行首列 | `73` | 先写标记、处理中间，最后处理首行和首列 |\n| 随机链表复制后没有拆链 | `138` | 穿插复制最后要恢复原链表并接出新链表 |\n| LRU 链表更新了但 map 没同步 | `146` | 新增、删除、移动节点都要维护哈希表 |\n| Trie 把前缀当完整单词 | `208` | `search` 必须检查 `isEnd` |\n\n## 7. 最短复盘口诀\n\n哈希表题先定 key 和 value。配对题先查后放，前缀和题查 `sum - k`，分组题设计无冲突签名，连续段题只从起点扩展，复制题先建映射再连关系，设计题让哈希表负责定位、链表或 Trie 负责结构语义。\n\n================================================================================\n\n# 第2部分: 双指针\n\n================================================================================\n\n> 目标：本文把 Hot100 中“两个位置协同移动”的题抽象成若干模板。复习时先判断指针为什么能移动，再判断移动哪一边不会错过答案。\n\n## 1. 双指针题的底层模型\n\n双指针的本质是用两个位置维护一个关系：边界、距离、顺序、窗口、链表相对位置或快慢速度。每道题先问五个问题：\n\n| 问题          | 如果答案是“是”     | 常用处理                   |\n| ----------- | ------------ | ---------------------- |\n| 数组有序或可排序吗   | 三数之和、左右夹逼    | 排序后 `left/right` 向中间收缩 |\n| 需要维护一段区间吗   | 滑动窗口、最小覆盖    | `left/right` 表示窗口边界    |\n| 需要原地压缩或交换吗  | 移动零、颜色分类     | 慢指针表示下一个写入位置           |\n| 链表需要定位相对位置吗 | 删除倒数、判环、回文   | 快慢指针、间距指针              |\n| 指针移动有单调依据吗  | 盛水、接雨水、寻找重复数 | 移动短板或按函数图走             |\n\n双指针是一组“状态压缩”策略：\n\n| 动作 | 对应 Hot100 题目 | 复习关键词 |\n|---|---|---|\n| 左右夹逼 | `11`、`15`、`42`、`5` | 单调性、短板、去重 |\n| 快慢指针 | `141`、`142`、`234`、`287` | 速度差、入环点、中点 |\n| 同向覆盖 | `283`、`75`、`189` | 写指针、交换、分区 |\n| 间距同步 | `19`、`160` | 固定距离、换头对齐 |\n| 设计辅助 | `295` | 两边平衡、堆模拟左右边界 |\n\n## 2. Hot100 双指针题型地图\n\n\n| 题型 | 题目 | 抽象能力 | 一句话记忆 |\n|---|---|---|---|\n| 有序夹逼 | `15 三数之和` | 排序后固定一个数，双指针找另外两个 | 和小左移，和大右移，命中后跳重复 |\n| 面积短板 | `11 盛最多水的容器` | 移动较短边保留变大可能 | 面积受短板限制，只能丢掉短板 |\n| 雨水边界 | `42 接雨水` | 左右最大值决定当前位置水量 | 哪边最大值小，哪边先结算 |\n| 回文中心 | `5 最长回文子串` | 从中心向两侧扩展 | 奇偶中心都要试 |\n| 原地覆盖 | `283 移动零`、`75 颜色分类` | 慢指针维护已处理区间 | 写指针前面都是最终状态 |\n| 链表快慢 | `141 环形链表`、`142 环形链表 II`、`234 回文链表` | 判环、找入口、找中点 | 快慢第一次相遇判环，第二次同步找入口 |\n| 间距指针 | `19 删除倒数第 N 个`、`160 相交链表` | 消除长度差 | 一个先走 N 步，或两链换头走齐 |\n| 数组置换/反转 | `31 下一个排列`、`189 轮转数组` | 从后找拐点、三次反转 | 局部有序性决定交换和反转范围 |\n| 函数图判环 | `287 寻找重复数` | 数组值当 next 指针 | 重复数就是环入口 |\n\n## 3. 复习顺序建议\n\n建议按“左右夹逼 → 同向覆盖 → 链表快慢 → 组合变形”的顺序复习：\n\n1. `11 盛最多水的容器`：理解为什么移动短板。\n2. `15 三数之和`：练排序、夹逼和去重。\n3. `42 接雨水`：练左右边界的结算时机。\n4. `283 移动零`：掌握写指针压缩。\n5. `75 颜色分类`：练三指针分区。\n6. `141`、`142`：掌握 Floyd 判环和入口。\n7. `19`、`160`：练间距和对齐。\n8. `234`、`5`：把双指针用于回文结构。\n9. `31`、`189`、`287`：补齐置换、反转和函数图变形。\n\n## 4. 关键套路详解\n\n### 4.1 左右夹逼必须有单调性\n\n双指针从两端向中间移动必须有“移动某一边不会丢答案”的理由。`15` 依赖排序后和的单调变化，`11` 依赖面积受短板限制，`42` 依赖较小侧边界已经能确定水量。\n\n### 4.2 去重应作为循环不变量\n\n`15 三数之和`要在三个位置都去重：固定数 `i` 跳过重复，命中答案后 `left/right` 也要跳过重复。否则答案重复，或者循环停滞。\n\n### 4.3 快慢指针有两类语义\n\n| 语义 | 代表题 | 指针含义 |\n|---|---|---|\n| 速度差 | `141`、`142`、`287` | 快指针每轮多走一步，最终在环中相遇 |\n| 位置定位 | `234`、排序链表切分 | 快指针走两步，慢指针停在中点附近 |\n\n判环题不要和找中点题混用循环条件。判环通常 `while (fast && fast->next)`；找偏左中点常用 `while (fast->next && fast->next->next)`。\n\n### 4.4 原地覆盖题要定义慢指针区域\n\n`283 移动零`中 `slow` 前面表示已经放好的非零元素；`75 颜色分类`中 `[0, low)` 是 0，`[low, i)` 是 1，`(high, n)` 是 2。只要区域语义清楚，代码就不会乱。\n\n### 4.5 链表间距题找的是相对位置\n\n`19` 让 `right` 先走 N 步，使 `left` 停在待删节点前驱。`160` 让两个指针分别走完 A+B 和 B+A，自然对齐。\n\n## 5. 抽象代码模板\n\n本节按照原始单题笔记的参考解法整理。双指针专题里有些题的原始解法并不只是一种“左右指针”：`5` 原始笔记是区间 DP，中心扩展是双指针空间优化；`75` 原始笔记保留了荷兰国旗和原地染色两种写法；`189` 原始笔记是三次反转，但辅助函数应改成 `void` 才符合原地 O(1) 空间语义。\n\n### 5.1 排序数组左右夹逼：三数之和与有序两数\n\n#### 适用题型\n\n- `15 三数之和`：排序后固定一个数，左右指针找另外两个数。\n- 有序数组两数之和、最接近三数之和、四数之和等夹逼变形。\n- 前提是排序后具备“和小左移、和大右移”的单调移动依据。\n\n#### 核心思路\n\n排序提供单调性。固定 `i` 后，`left/right` 当前和小于目标，只能右移 `left` 让和变大；当前和大于目标，只能左移 `right` 让和变小。`15` 的去重有两层：固定点 `i` 去重，命中答案后左右指针去重。\n\n#### 代码 A：三数之和原始夹逼写法\n\n> **题目简述：** 15 三数之和：给定整数数组，找出所有和为零且不重复的三元组。 [力扣原题 ↗](https://leetcode.cn/problems/3sum/)\n\n```cpp\n#include \u003cbits/stdc++.h>\nusing namespace std;\n\nvector\u003cvector\u003cint>> threeSum(vector\u003cint>& nums) {\n    vector\u003cvector\u003cint>> res;\n    sort(nums.begin(), nums.end());\n    int n = (int)nums.size();\n\n    for (int i = 0; i \u003c n; i++) {\n        if (i > 0 && nums[i] == nums[i - 1]) continue;\n        if (nums[i] > 0) break; // 原始题解可直接 return res；这里 break 语义等价。\n\n        int left = i + 1;\n        int right = n - 1;\n        while (left \u003c right) {\n            long long sum = 1LL * nums[i] + nums[left] + nums[right];\n            if (sum > 0) {\n                right--;\n            } else if (sum \u003c 0) {\n                left++;\n            } else {\n                res.push_back({nums[i], nums[left], nums[right]});\n\n                // 原始笔记是先跳过相邻重复值，再统一移动指针。\n                // 也可以先 left++/right--，再和旧值比较去重；两种写法不要混用。\n                while (left \u003c right && nums[right] == nums[right - 1]) right--;\n                while (left \u003c right && nums[left] == nums[left + 1]) left++;\n                left++;\n                right--;\n            }\n        }\n    }\n\n    return res;\n}\n```\n\n#### 代码 B：有序两数之和扩展骨架\n\n> **题目简述：** 167 两数之和 II：给定升序整数数组和目标值，返回和为目标值的两个元素下标。 [力扣原题 ↗](https://leetcode.cn/problems/two-sum-ii-input-array-is-sorted/)\n\n```cpp\npair\u003cint, int> twoSumSorted(const vector\u003cint>& nums, int target) {\n    int left = 0;\n    int right = (int)nums.size() - 1;\n\n    while (left \u003c right) {\n        int sum = nums[left] + nums[right];\n        if (sum == target) return {left, right};\n        if (sum \u003c target) {\n            left++;   // 和偏小，只能增大左端。\n        } else {\n            right--;  // 和偏大，只能减小右端。\n        }\n    }\n\n    return {-1, -1};\n}\n```\n\n#### 变形点对照\n\n| 变形 | 固定部分 | 指针移动 | 去重位置 |\n|---|---|---|---|\n| `15 三数之和` | 外层固定 `i` | `sum \u003c 0` 左移，`sum > 0` 右移 | 固定点和命中后三个位置都去重 |\n| 有序两数之和 | 无外层固定点 | 根据 `sum` 和 `target` 比较移动 | 通常不需要去重 |\n| K 数之和 | 递归固定前若干个数 | 最后一层两指针夹逼 | 每层固定点都要去重 |\n\n#### 易错点\n\n- 排序后返回的是数值组合；如果题目要原下标，不能直接排序原数组。\n- 三数之和命中后必须推进左右指针，否则会死循环。\n- 去重顺序要自洽：先跳重复再移动，或先移动再跳重复，不要混写。\n\n### 5.2 移动短板与边界结算\n\n#### 适用题型\n\n- `11 盛最多水的容器`：面积由短板和宽度共同决定。\n- `42 接雨水`：当前位置水量由左右最大值较小者决定。\n- 二者都用左右指针，但移动依据不同，不能用一个条件硬套。\n\n#### 核心思路\n\n容器题中宽度每轮都会变小，只有移动短板才可能提高高度上限；移动长板不会让当前短板变高。接雨水中先更新 `lm/rm`，当 `lm \u003c rm` 时左侧水位确定，否则右侧水位确定；相等时结算哪边都正确，原始笔记选择结算右侧。\n\n#### 代码 A：盛最多水的容器\n\n> **题目简述：** 11 盛最多水的容器：给定各位置的高度，选择两条竖线，使其与横轴围成的容器容量最大。 [力扣原题 ↗](https://leetcode.cn/problems/container-with-most-water/)\n\n```cpp\nint maxArea(vector\u003cint>& height) {\n    int left = 0;\n    int right = (int)height.size() - 1;\n    int square = 0;\n\n    while (left \u003c right) {\n        square = max(square, (right - left) * min(height[right], height[left]));\n\n        // 原始题解：相等时移动右侧；相等时移动任意一边都不影响正确性。\n        if (height[left] \u003c height[right]) {\n            left++;\n        } else {\n            right--;\n        }\n    }\n\n    return square;\n}\n```\n\n#### 代码 B：接雨水双指针\n\n> **题目简述：** 42 接雨水：给定各柱子的高度，计算下雨后这些柱子之间能够接住的雨水总量。 [力扣原题 ↗](https://leetcode.cn/problems/trapping-rain-water/)\n\n```cpp\nint trap(vector\u003cint>& height) {\n    int l = 0;\n    int r = (int)height.size() - 1;\n    int lm = 0;\n    int rm = 0;\n    int res = 0;\n\n    while (l \u003c r) {\n        lm = max(lm, height[l]);\n        rm = max(rm, height[r]);\n\n        // 原始题解使用 lm \u003c rm：相等时结算右侧；使用 \u003c= 时结算左侧也正确。\n        if (lm \u003c rm) {\n            res += lm - height[l];\n            l++;\n        } else {\n            res += rm - height[r];\n            r--;\n        }\n    }\n\n    return res;\n}\n```\n\n#### 变形点对照\n\n| 题型 | 移动依据 | 相等时 | 答案更新 |\n|---|---|---|---|\n| `11` 容器 | 丢弃较短边 | 任意移动一边，原始写法移动右边 | 移动前更新当前面积 |\n| `42` 接雨水 | 结算较小最大边界侧 | 任意结算一边，原始写法结算右边 | 先更新最大边界，再结算 |\n\n#### 易错点\n\n- 容器题移动高板没有意义，宽度变小且短板不变。\n- 接雨水比较的是 `lm/rm`，避免直接比较当前 `height[l]/height[r]`。\n- 接雨水必须先更新边界最大值，再计算当前位置能接多少水。\n\n### 5.3 同向覆盖与三路分区\n\n#### 适用题型\n\n- `283 移动零`：原始笔记使用稳定覆盖，最后尾部补零。\n- `75 颜色分类`：原始笔记保留荷兰国旗法和原地染色法。\n- 删除重复、按条件稳定保留元素等同向写指针题。\n\n#### 核心思路\n\n同向覆盖中，慢指针表示下一个写入位置；快指针扫描原数组。三路分区中，`[0, p0)` 是 0，`[p0, i)` 是 1，`(p2, n - 1]` 是 2。原地染色写法则把已扫描区域默认刷成 2，再按原值回填 1 和 0。\n\n#### 代码 A：移动零稳定覆盖\n\n> **题目简述：** 283 移动零：将数组中的零原地移到末尾，同时保持所有非零元素的相对顺序。 [力扣原题 ↗](https://leetcode.cn/problems/move-zeroes/)\n\n```cpp\nvoid moveZeroes(vector\u003cint>& nums) {\n    int slow = 0;\n\n    for (int fast = 0; fast \u003c (int)nums.size(); fast++) {\n        if (nums[fast] != 0) {\n            nums[slow] = nums[fast];\n            slow++;\n        }\n    }\n\n    for (int i = slow; i \u003c (int)nums.size(); i++) {\n        nums[i] = 0;\n    }\n}\n```\n\n#### 代码 B：颜色分类荷兰国旗法\n\n> **题目简述：** 75 颜色分类：原地整理仅含 0、1、2 的数组，使相同颜色相邻并按数值升序排列。 [力扣原题 ↗](https://leetcode.cn/problems/sort-colors/)\n\n```cpp\nvoid sortColors(vector\u003cint>& nums) {\n    int n = (int)nums.size();\n    int p0 = 0;\n    int p2 = n - 1;\n    int i = 0;\n\n    while (i \u003c= p2) {\n        if (nums[i] == 0) {\n            swap(nums[i], nums[p0]);\n            p0++;\n            i++;\n        } else if (nums[i] == 2) {\n            swap(nums[i], nums[p2]);\n            p2--;\n            // 从右侧换来的元素还没检查，因此这里不能 i++。\n        } else {\n            i++;\n        }\n    }\n}\n```\n\n#### 代码 C：颜色分类原地染色法\n\n> **题目简述：** 75 颜色分类：原地整理仅含 0、1、2 的数组，使相同颜色相邻并按数值升序排列。 [力扣原题 ↗](https://leetcode.cn/problems/sort-colors/)\n\n```cpp\nvoid sortColorsByPainting(vector\u003cint>& nums) {\n    int p0 = 0;\n    int p1 = 0;\n\n    for (int i = 0; i \u003c (int)nums.size(); i++) {\n        int x = nums[i];\n\n        // 已扫描位置先默认刷成 2；如果原值更小，再向前覆盖 1 或 0。\n        nums[i] = 2;\n        if (x \u003c= 1) {\n            nums[p1++] = 1;\n        }\n        if (x == 0) {\n            nums[p0++] = 0;\n        }\n    }\n}\n```\n\n#### 变形点对照\n\n| 题型 | 慢指针语义 | 是否稳定 | 关键细节 |\n|---|---|---|---|\n| `283 移动零` | `slow` 是下一个非零写入位 | 稳定 | 非零压缩后尾部补 0 |\n| `75` 荷兰国旗 | `p0/i/p2` 划分四段区域 | 不要求稳定 | 遇到 2 交换后不能 `i++` |\n| `75` 原地染色 | `p0/p1` 是 0 和 1 的下一个写入位 | 不要求稳定 | 先刷 2，再补 1，再补 0 |\n\n#### 易错点\n\n- 移动零覆盖完非零元素后，尾部必须补零。\n- 荷兰国旗遇到 2 时不能 `i++`。\n- 原地染色必须先保存 `x = nums[i]`，否则刷成 2 后会丢失原值。\n\n### 5.4 链表快慢指针与函数图判环\n\n#### 适用题型\n\n- `141 环形链表`：快慢指针相遇即有环。\n- `142 环形链表 II`：相遇后同步找入口。\n- `287 寻找重复数`：数组值当作 `next` 指针，重复数是环入口。\n\n#### 核心思路\n\nFloyd 判环依赖速度差。快指针每次走两步，慢指针每次走一步；有环必相遇。找入口时，一个指针从头出发，一个从相遇点出发，同速前进，下一次相遇就是入口。数组函数图写法中，`nums[i]` 表示下一个下标。\n\n#### 代码 A：判断链表是否有环\n\n> **题目简述：** 141 环形链表：给定单链表头结点，判断沿 next 指针前进是否会重复到达某个结点。 [力扣原题 ↗](https://leetcode.cn/problems/linked-list-cycle/)\n\n```cpp\nstruct ListNode {\n    int val;\n    ListNode* next;\n    ListNode(int x) : val(x), next(nullptr) {}\n};\n\nbool hasCycle(ListNode* head) {\n    ListNode* fast = head;\n    ListNode* slow = head;\n\n    while (fast != nullptr && fast->next != nullptr) {\n        fast = fast->next->next;\n        slow = slow->next;\n        if (fast == slow) return true;\n    }\n\n    return false;\n}\n```\n\n#### 代码 B：寻找环入口\n\n> **题目简述：** 142 环形链表 II：若单链表存在环则返回入环的第一个结点，否则返回空结点。 [力扣原题 ↗](https://leetcode.cn/problems/linked-list-cycle-ii/)\n\n```cpp\nListNode* detectCycle(ListNode* head) {\n    ListNode* fast = head;\n    ListNode* slow = head;\n\n    while (fast != nullptr && fast->next != nullptr) {\n        fast = fast->next->next;\n        slow = slow->next;\n\n        if (fast == slow) {\n            // 原始题解直接移动 head；模板保留这个写法，表示从链表头重新出发。\n            while (slow != head) {\n                slow = slow->next;\n                head = head->next;\n            }\n            return head;\n        }\n    }\n\n    return nullptr;\n}\n```\n\n#### 代码 C：寻找重复数的函数图写法\n\n> **题目简述：** 287 寻找重复数：长度 N+1 的数组仅含 1 至 N，找出重复数且不能修改数组、额外空间为常数。 [力扣原题 ↗](https://leetcode.cn/problems/find-the-duplicate-number/)\n\n```cpp\nint findDuplicate(vector\u003cint>& nums) {\n    int slow = 0;\n    int fast = 0;\n\n    // 原始写法是 do-while 语义：先走一步，再判断是否相遇。\n    while (true) {\n        slow = nums[slow];\n        fast = nums[nums[fast]];\n        if (fast == slow) break;\n    }\n\n    int head = 0;\n    while (slow != head) {\n        slow = nums[slow];\n        head = nums[head];\n    }\n\n    return slow;\n}\n```\n\n#### 变形点对照\n\n| 题型 | 相遇后操作 | 返回值 | 注意点 |\n|---|---|---|---|\n| `141` | 相遇立即返回 | `bool` | 不需要入口阶段 |\n| `142` | 头指针和相遇点同步走 | 入口节点 | `return nullptr` 表示无环 |\n| `287` | 下标 0 和相遇点同步走 | 重复数字 | 不修改数组，O(1) 空间 |\n\n#### 易错点\n\n- 链表判环循环条件必须是 `fast && fast->next`。\n- `141` 和 `142` 前半段相同，但 `141` 相遇后无需再找入口。\n- 函数图比较的是“当前下标状态”，检测到相遇后返回入口下标对应的重复数。\n\n### 5.5 固定间距与双链对齐\n\n#### 适用题型\n\n- `19 删除链表的倒数第 N 个结点`。\n- `160 相交链表`。\n- 需要消除长度差或定位倒数位置的链表题。\n\n#### 核心思路\n\n删除倒数节点时，用 dummy 统一删除头结点。`right` 先走 `n` 步，之后 `left/right` 同步前进；当 `right` 到尾时，`left` 正好停在待删节点前驱。相交链表让两个指针分别走 A+B 和 B+A，总路程相同，相交则在交点相遇，不相交则同时到空。\n\n#### 代码 A：删除倒数第 N 个节点\n\n> **题目简述：** 19 删除链表的倒数第 N 个结点：给定单链表和正整数 N，删除倒数第 N 个结点并返回链表头。 [力扣原题 ↗](https://leetcode.cn/problems/remove-nth-node-from-end-of-list/)\n\n```cpp\nListNode* removeNthFromEnd(ListNode* head, int n) {\n    ListNode dummy(-1);\n    dummy.next = head;\n    ListNode* right = &dummy;\n    ListNode* left = &dummy;\n\n    for (int i = 0; i \u003c n; i++) {\n        right = right->next;\n    }\n\n    while (right->next) {\n        right = right->next;\n        left = left->next;\n    }\n\n    ListNode* removed = left->next;\n    left->next = removed->next;\n    // 原始题解释放了被删节点；刷题环境通常不强制，工程 C++ 拥有节点所有权时建议 delete。\n    delete removed;\n\n    return dummy.next;\n}\n```\n\n#### 代码 B：相交链表换头对齐\n\n> **题目简述：** 160 相交链表：给定两个无环单链表，返回它们按结点引用相交的起点，不相交则返回空。 [力扣原题 ↗](https://leetcode.cn/problems/intersection-of-two-linked-lists/)\n\n```cpp\nListNode* getIntersectionNode(ListNode* headA, ListNode* headB) {\n    ListNode* p = headA;\n    ListNode* q = headB;\n\n    while (p != q) {\n        p = (p == nullptr) ? headB : p->next;\n        q = (q == nullptr) ? headA : q->next;\n    }\n\n    return p; // 相交则为交点；不相交则为 nullptr。\n}\n```\n\n#### 变形点对照\n\n| 题型 | 对齐方式 | 返回/修改 | 关键边界 |\n|---|---|---|---|\n| `19` 删除倒数 | 先制造 `n` 步间距 | 修改链表 | dummy 统一删除头结点 |\n| `160` 相交链表 | 换头走完 A+B/B+A | 返回节点地址 | 比较指针地址，不比较值 |\n\n#### 易错点\n\n- 删除倒数节点必须用 dummy，否则删除头结点需要额外分支。\n- `right` 先走的是 `n` 步，后续让 `left` 停在前驱。\n- 相交链表的“相交”指节点地址相同，节点值相同无效。\n\n### 5.6 回文结构：原始 DP 与双指针优化\n\n#### 适用题型\n\n- `5 最长回文子串`：原始单题笔记使用区间 DP；中心扩展是双指针专题下的 O(1) 空间替代写法。\n- `234 回文链表`：原始笔记用快慢指针找偏左中点，再反转后半段比较。\n- 回文字符串和回文链表都在“向两侧/两端比较”，但实现状态完全不同。\n\n#### 核心思路\n\n`5` 的原始 DP 定义 `dp[i][j]` 表示 `s[i..j]` 是否回文，转移依赖更短区间 `dp[i + 1][j - 1]`，所以 `i` 要从右往左枚举。中心扩展则从每个奇偶中心向两边扩，空间 O(1)。`234` 找偏左中点后，只反转 `slow->next` 开始的后半段，比较时以后半段长度为准。\n\n#### 代码 A：最长回文子串原始 DP 写法\n\n> **题目简述：** 5 最长回文子串：给定字符串，返回其中长度最长的连续回文子串。 [力扣原题 ↗](https://leetcode.cn/problems/longest-palindromic-substring/)\n\n```cpp\nstring longestPalindromeByDp(string s) {\n    int n = (int)s.size();\n    if (n \u003c 2) return s;\n\n    vector\u003cvector\u003cbool>> dp(n, vector\u003cbool>(n, false));\n    int maxLen = 1;\n    int begin = 0;\n\n    for (int i = n - 1; i >= 0; i--) {\n        for (int j = i; j \u003c n; j++) {\n            if (s[i] == s[j]) {\n                if (j - i \u003c= 2 || dp[i + 1][j - 1]) {\n                    dp[i][j] = true;\n                }\n            }\n\n            if (dp[i][j] && j - i + 1 > maxLen) {\n                maxLen = j - i + 1;\n                begin = i;\n            }\n        }\n    }\n\n    return s.substr(begin, maxLen);\n}\n```\n\n#### 代码 B：最长回文子串中心扩展优化\n\n> **题目简述：** 5 最长回文子串：给定字符串，返回其中长度最长的连续回文子串。 [力扣原题 ↗](https://leetcode.cn/problems/longest-palindromic-substring/)\n\n```cpp\nstring longestPalindromeByCenter(string s) {\n    int bestStart = 0;\n    int bestLen = 0;\n\n    auto expand = [&](int left, int right) {\n        while (left >= 0 && right \u003c (int)s.size() && s[left] == s[right]) {\n            left--;\n            right++;\n        }\n        int start = left + 1;\n        int len = right - left - 1;\n        if (len > bestLen) {\n            bestStart = start;\n            bestLen = len;\n        }\n    };\n\n    for (int i = 0; i \u003c (int)s.size(); i++) {\n        expand(i, i);     // 奇数长度中心。\n        expand(i, i + 1); // 偶数长度中心。\n    }\n\n    return s.substr(bestStart, bestLen);\n}\n```\n\n#### 代码 C：回文链表原始偏左中点写法\n\n> **题目简述：** 234 回文链表：给定单链表头结点，判断从头到尾的结点值序列是否为回文。 [力扣原题 ↗](https://leetcode.cn/problems/palindrome-linked-list/)\n\n```cpp\nListNode* reverseListForPalindrome(ListNode* head) {\n    ListNode* pre = nullptr;\n    ListNode* cur = head;\n    while (cur) {\n        ListNode* nxt = cur->next;\n        cur->next = pre;\n        pre = cur;\n        cur = nxt;\n    }\n    return pre;\n}\n\nbool isPalindrome(ListNode* head) {\n    if (!head || !head->next) return true;\n\n    ListNode* fast = head;\n    ListNode* slow = head;\n    // 原始题解找偏左中点，后续从 slow->next 开始反转后半段。\n    while (fast->next && fast->next->next) {\n        fast = fast->next->next;\n        slow = slow->next;\n    }\n\n    ListNode* start2 = reverseListForPalindrome(slow->next);\n    ListNode* start1 = head;\n\n    while (start2) {\n        if (start1->val != start2->val) return false;\n        start1 = start1->next;\n        start2 = start2->next;\n    }\n\n    return true;\n}\n```\n\n#### 变形点对照\n\n| 题型 | 原始/优化 | 状态 | 关键边界 |\n|---|---|---|---|\n| `5` DP | 原始题解 | `dp[i][j]` 是否回文 | `i` 从右往左，`j - i \u003c= 2` 直接成立 |\n| `5` 中心扩展 | 双指针优化 | 从中心向两侧扩 | 奇偶中心都要枚举 |\n| `234` 回文链表 | 原始题解 | 偏左中点 + 反转后半段 | 反转从 `slow->next` 开始 |\n\n#### 易错点\n\n- `5` 原始题解使用区间 DP；中心扩展是双指针专题下的空间优化替代。\n- 中心扩展结束后合法起点是 `left + 1`，长度是 `right - left - 1`。\n- 回文链表的中点循环条件和反转起点必须配套，偏左中点对应 `slow->next`。\n\n### 5.7 数组原地反转与置换\n\n#### 适用题型\n\n- `31 下一个排列`：从后找下降拐点，交换后反转后缀。\n- `189 轮转数组`：原始笔记使用三次反转实现 O(1) 空间轮转。\n- 所有需要原地调整排列或区间反转的数组题。\n\n#### 核心思路\n\n下一个排列从后往前找第一个 `nums[i] \u003c nums[i + 1]` 的位置，说明后缀 `[i + 1, n)` 已经是降序；再从后找第一个大于 `nums[i]` 的数交换，最后反转后缀得到最小的更大排列。轮转数组先整体反转，再反转前 `k` 个和后 `n-k` 个。原始 `reversee` helper 返回 `vector\u003cint>` 没必要，应改成 `void` 原地反转。\n\n#### 代码 A：下一个排列\n\n> **题目简述：** 31 下一个排列：原地生成当前整数排列的字典序下一个排列；若不存在则变为最小排列。 [力扣原题 ↗](https://leetcode.cn/problems/next-permutation/)\n\n```cpp\nvoid nextPermutation(vector\u003cint>& nums) {\n    int n = (int)nums.size();\n    int i = n - 2;\n\n    while (i >= 0 && nums[i] >= nums[i + 1]) {\n        i--;\n    }\n\n    if (i >= 0) {\n        int j = n - 1;\n        while (j >= 0 && nums[j] \u003c= nums[i]) {\n            j--;\n        }\n        swap(nums[i], nums[j]);\n    }\n\n    // 如果 i == -1，说明整个数组降序，反转全数组得到最小排列。\n    reverse(nums.begin() + i + 1, nums.end());\n}\n```\n\n#### 代码 B：轮转数组三次反转\n\n> **题目简述：** 189 轮转数组：给定整数数组和非负整数 K，将数组原地向右轮转 K 个位置。 [力扣原题 ↗](https://leetcode.cn/problems/rotate-array/)\n\n```cpp\nvoid reverseRange(vector\u003cint>& nums, int left, int right) {\n    while (left \u003c right) {\n        swap(nums[left], nums[right]);\n        left++;\n        right--;\n    }\n}\n\nvoid rotate(vector\u003cint>& nums, int k) {\n    int n = (int)nums.size();\n    if (n == 0) return;\n    k = k % n;\n\n    // 原始思路：整体反转，再分别反转前 k 个和后 n-k 个。\n    reverseRange(nums, 0, n - 1);\n    reverseRange(nums, 0, k - 1);\n    reverseRange(nums, k, n - 1);\n}\n```\n\n#### 变形点对照\n\n| 题型 | 指针动作 | 原地性 | 关键细节 |\n|---|---|---|---|\n| `31 下一个排列` | 从后找拐点和交换点 | O(1) 额外空间 | 后缀必须反转成升序 |\n| `189 轮转数组` | 三段反转 | O(1) 额外空间 | `k %= n`，辅助函数不返回数组 |\n\n#### 易错点\n\n- `31` 找不到拐点时要反转整个数组。\n- `31` 交换后只反转 `i + 1` 到末尾，不能反转前缀。\n- `189` 要先处理 `k %= n`；辅助反转函数应原地修改，不应返回 `vector\u003cint>`。\n\n## 6. 高频易错点清单\n\n| 易错点 | 典型题目 | 规避方式 |\n|---|---|---|\n| 双指针没有单调移动理由 | `11`、`15`、`42` | 先说明移动哪边不会错过答案 |\n| 三数之和去重不完整 | `15` | 固定数和命中后的左右指针都要去重 |\n| 盛水容器移动高板 | `11` | 面积受短板限制，只移动短板 |\n| 接雨水先结算较大侧 | `42` | 哪侧最大边界更小，哪侧水量先确定 |\n| 颜色分类换来 2 后直接 i++ | `75` | 从右侧换来的数未检查，不能立刻跳过 |\n| 原地染色覆盖前没保存原值 | `75` | 先保存 `x = nums[i]`，再把当前位置刷成 2 |\n| 链表判环空指针判断不足 | `141`、`142` | 循环条件写 `fast && fast->next` |\n| 删除倒数节点没用 dummy | `19` | 删除头结点也要统一处理 |\n| 相交链表比较节点值 | `160` | 相交是指针地址相等 |\n| 回文链表中点和反转起点不配套 | `234` | 偏左中点对应 `slow->next`，右中点对应 `slow` |\n| 下一个排列后缀没反转 | `31` | 交换拐点后反转 `[i + 1, end)` |\n| 轮转数组 helper 返回数组 | `189` | 反转函数应 `void` 原地修改，保持 O(1) 空间 |\n\n## 7. 最短复盘口诀\n\n双指针先找移动依据。排序题夹逼，短板题移短边，覆盖题定义慢指针区域，链表题用快慢和间距，对齐题让路程相等。每次移动都要能解释“为什么丢掉这一侧不会错过答案”。\n\n================================================================================\n\n# 第3部分: 滑动窗口\n\n================================================================================\n\n> 目标：本文把 Hot100 中“连续区间状态维护”的题抽象成可复用模板。复习时先判断窗口合法性由什么决定，再决定什么时候扩右、什么时候缩左、什么时候更新答案。\n\n## 1. 滑动窗口题的底层模型\n\n滑动窗口只适合处理连续子数组或连续子串。关键在于窗口状态能否被 O(1) 增删维护。每道题先问五个问题：\n\n| 问题         | 如果答案是“是”       | 常用处理                         |\n| ---------- | -------------- | ---------------------------- |\n| 目标是最长合法窗口吗 | 无重复字符最长子串      | 右扩，非法时左缩，合法时更新最大值            |\n| 目标是最短覆盖窗口吗 | 最小覆盖子串         | 右扩直到满足，再尽量左缩                 |\n| 窗口长度固定吗    | 找所有异位词、滑动窗口最大值 | 每轮保持 `right - left + 1 == k` |\n| 需要维护字符频次吗  | 覆盖、异位词、无重复     | `need/window` 或欠账计数          |\n| 需要维护区间最值吗  | 滑动窗口最大值        | 单调队列保存候选下标                   |\n\n滑动窗口常见的窗口状态有三类：\n\n| 状态 | 对应 Hot100 题目 | 复习关键词 |\n|---|---|---|\n| 去重集合/最后位置 | `3` | 重复字符、左边界跳跃 |\n| 字符频次差 | `76`、`438` | 欠账、满足、固定长度 |\n| 单调队列 | `239` | 下标过期、队尾淘汰 |\n\n## 2. Hot100 滑动窗口题型地图\n\n| 题型 | 题目 | 抽象能力 | 一句话记忆 |\n|---|---|---|---|\n| 最长合法窗口 | `3 无重复字符的最长子串` | 维护窗口内字符不重复 | 右扩遇重复，左边界跳到重复字符之后 |\n| 最短覆盖窗口 | `76 最小覆盖子串` | 维护目标字符欠账 | 满足后尽量缩左，缩到刚好不满足 |\n| 固定长度频次窗口 | `438 找到所有字母异位词` | 长度固定且频次匹配 | 窗口长度到 `p.size()` 后检查 |\n| 固定长度最值窗口 | `239 滑动窗口最大值` | 单调队列维护最大候选 | 队头是最大值，过期就弹出 |\n| 相邻变形 | `567 字符串排列`、`209 长度最小子数组` | 同类窗口思想 | Hot100 没列入但模板完全相通 |\n\n## 3. 复习顺序建议\n\n先掌握可变窗口，再掌握固定窗口，最后掌握单调队列：\n\n1. `3 无重复字符的最长子串`：建立 `left/right` 和窗口合法性的直觉。\n2. `438 找到所有字母异位词`：练固定长度和字符频次。\n3. `76 最小覆盖子串`：练欠账计数和满足后收缩。\n4. `239 滑动窗口最大值`：练单调队列，理解窗口里只保留有效候选。\n\n## 4. 关键套路详解\n\n### 4.1 窗口题先定义合法性\n\n写代码前先补全一句话：\n\n```text\n当前窗口 [left, right] 合法，当且仅当 ______。\n```\n\n`3` 的合法性是窗口内没有重复字符；`76` 的合法性是窗口已经覆盖 `t` 的所有字符；`438` 的合法性是窗口长度等于 `p.size()` 且频次完全相同；`239` 没有“合法/非法”，它是固定长度下维护最大值。\n\n### 4.2 最长和最短的更新时机相反\n\n| 目标 | 常用流程 | 更新答案时机 |\n|---|---|---|\n| 最长合法窗口 | 右扩，非法就左缩 | 每次恢复合法后更新最大值 |\n| 最短覆盖窗口 | 右扩直到满足，满足后左缩 | 每次仍满足时更新最小值 |\n| 固定长度窗口 | 右扩，超过长度就左缩 | 长度刚好等于 k 时更新 |\n\n把这三类混在一起，是滑动窗口最常见的错误来源。\n\n### 4.3 欠账表比双表比较更稳\n\n`76` 可以维护 `need[ch]` 表示还缺多少字符。右扩时如果 `need[ch] > 0`，说明补上了一个有效字符；左缩时如果移走后 `need[ch] > 0`，说明窗口重新缺字符。这样不用每次比较整张表。\n\n### 4.4 固定窗口要先处理过期\n\n`438` 和 `239` 都是固定长度窗口。区别是 `438` 维护频次，`239` 维护最大值候选。固定窗口中，过期元素必须及时移除：频次表要减掉左端字符，单调队列要弹出不在 `[i - k + 1, i]` 内的队头下标。\n\n### 4.5 单调队列保存候选集合\n\n`239` 中如果新元素比队尾元素大，队尾元素永远不可能再成为未来窗口最大值，可以直接弹出。队列保持下标对应值递减，队头就是当前窗口最大值。\n\n## 5. 抽象代码模板\n\n本节按照原始单题笔记的参考解法整理。滑动窗口需要先确定窗口合法性：`3` 用集合保证无重复，`76` 用账本和 `valid` 表示欠账种类是否还清，`438` 用欠账数组和“当前字符是否透支”控制左缩，`239` 用单调队列维护固定窗口最大候选。\n\n### 5.1 最长合法窗口：哈希集合去重\n\n#### 适用题型\n\n- `3 无重复字符的最长子串`：原始笔记使用 `unordered_set\u003cchar>` 保存当前窗口内字符。\n- 窗口合法性是“窗口内没有重复元素/字符”的最长连续区间。\n- 如果元素类型超出字符，把 `unordered_set\u003cchar>` 替换为 `unordered_set\u003cint>` 或对应类型即可。\n\n#### 核心思路\n\n窗口语义固定为 `[left, right]`。右端字符 `s[right]` 如果已经在集合中，说明当前窗口加入它会产生重复；此时不断移出 `s[left]` 并右移 `left`，直到集合里不再含有 `s[right]`。恢复合法后再把 `s[right]` 放入集合，并用当前窗口长度更新答案。\n\n#### 代码模板：共同骨架\n\n> **题目简述：** 3 无重复字符的最长子串：给定字符串，求不含重复字符的最长连续子串长度。 [力扣原题 ↗](https://leetcode.cn/problems/longest-substring-without-repeating-characters/)\n\n```cpp\n#include \u003cbits/stdc++.h>\nusing namespace std;\n\nint lengthOfLongestSubstring(string s) {\n    unordered_set\u003cchar> window; // 保存当前窗口 [left, right] 中已经存在的字符。\n    int left = 0;\n    int res = 0;\n\n    for (int right = 0; right \u003c (int)s.size(); right++) {\n        // 如果 s[right] 已在窗口中，窗口加入它会重复。\n        // 必须持续吐出左端字符，直到窗口中不再包含 s[right]。\n        while (window.count(s[right])) {\n            window.erase(s[left]);\n            left++;\n        }\n\n        // 此时加入 s[right] 后窗口仍然无重复，才能更新最长长度。\n        window.insert(s[right]);\n        res = max(res, right - left + 1);\n    }\n\n    return res;\n}\n```\n\n#### 变形点对照\n\n| 变形 | 状态维护 | 左缩条件 | 答案更新 |\n|---|---|---|---|\n| `3 无重复字符` 原始写法 | `unordered_set\u003cchar>` 保存窗口字符 | `while (window.count(s[right]))` | 插入当前字符后更新最长 |\n| 最后出现位置优化 | `last[ch]` 保存最近下标 | 若 `last[ch] >= left`，直接跳 `left` | 跳完后更新最长 |\n| 无重复整数子数组 | `unordered_set\u003cint>` | 逻辑不变 | 窗口长度或窗口状态 |\n\n#### 易错点\n\n- 遇到重复时不能只删一次左端；要 `while` 删除到当前字符不重复为止。\n- 答案要在窗口恢复合法并插入 `s[right]` 后更新，不能在非法窗口中更新。\n- `left` 只右移，不回退；集合内容必须和 `[left, right]` 保持一致。\n\n### 5.2 最短覆盖窗口：账本 + valid\n\n#### 适用题型\n\n- `76 最小覆盖子串`：原始笔记使用 `unordered_map\u003cchar, int> map` 作为欠账表。\n- 最短连续区间覆盖目标多重集合，目标字符可能重复。\n- 只关心目标字符的覆盖情况，非目标字符进入窗口不改变 `valid`。\n\n#### 核心思路\n\n`map[ch]` 表示字符 `ch` 还欠多少个，右扩遇到目标字符就还债：`map[s[r]]--`。当某个字符刚好还到 `0`，说明这个字符种类已经满足，`valid++`。当 `valid == map.size()` 时，所有目标字符种类都满足，当前窗口合法；这时要在 `while` 中一边记录最短答案，一边踢出左端字符，直到窗口重新不合法。\n\n#### 代码模板：共同骨架\n\n> **题目简述：** 76 最小覆盖子串：在字符串 S 中寻找覆盖字符串 T 全部字符及其频次的最短连续子串。 [力扣原题 ↗](https://leetcode.cn/problems/minimum-window-substring/)\n\n```cpp\nstring minWindow(string s, string t) {\n    unordered_map\u003cchar, int> map; // 欠账表：key 是目标字符，value 是还缺多少个。\n    for (int i = 0; i \u003c (int)t.size(); i++) {\n        map[t[i]]++; // 记录 t 中每个字符需要出现的次数，重复字符会累计。\n    }\n\n    int valid = 0; // 已经还清的目标字符种类数，不能当成还清的总字符数。\n    int l = 0;\n    int start = 0;\n    int minLen = INT_MAX; // 只记录最短窗口的起点和长度，避免频繁 substr。\n\n    for (int r = 0; r \u003c (int)s.size(); r++) {\n        // 1. 入窗：只有账本上的字符才会影响欠账状态。\n        if (map.count(s[r])) {\n            map[s[r]]--;\n            if (map[s[r]] == 0) {\n                valid++; // 这个字符种类刚好还清。\n            }\n        }\n\n        // 2. 当前窗口已覆盖 t，开始把左边界尽量右移以压缩长度。\n        while (valid == (int)map.size()) {\n            // 3. 更新答案：while 内每一次左缩前，窗口都仍然合法。\n            if (r - l + 1 \u003c minLen) {\n                minLen = r - l + 1;\n                start = l;\n            }\n\n            // 4. 出窗：如果踢掉的是目标字符，需要撤销它对账本的贡献。\n            if (map.count(s[l])) {\n                if (map[s[l]] == 0) {\n                    valid--; // 原本刚好还清，移走后该字符种类重新欠账。\n                }\n                map[s[l]]++;\n            }\n            l++;\n        }\n    }\n\n    return minLen == INT_MAX ? \"\" : s.substr(start, minLen);\n}\n```\n\n#### 变形点对照\n\n| 变形 | 状态含义 | 合法条件 | 左缩时机 |\n|---|---|---|---|\n| `76 最小覆盖子串` | `map[ch]` 是目标字符欠账，`valid` 是还清种类数 | `valid == map.size()` | 合法时持续缩左并更新最短 |\n| 正数数组最短和至少为 K | `state` 是窗口和 | `state >= k` | 合法时持续缩左并更新最短 |\n| 字符集固定的覆盖题 | `unordered_map` 可换成数组 | 合法条件不变 | 出窗时同样撤销状态 |\n\n#### 易错点\n\n- `valid` 表示满足的“字符种类数”，所以要和 `map.size()` 比较，不能和 `t.size()` 比较。\n- `left++` 必须在 `while (valid == map.size())` 内部；只有合法窗口才有资格继续压缩。\n- 出窗时要先判断 `map[s[l]] == 0` 再 `map[s[l]]++`，否则会错过“刚好从满足变成不满足”的瞬间。\n\n### 5.3 固定长度频次窗口：欠账数组 + 过量收缩\n\n#### 适用题型\n\n- `438 找到所有字母异位词`：原始笔记使用 `int map[26]` 作为欠账数组。\n- `567 字符串的排列`：同一骨架，找到第一个合法窗口时直接返回 `true`。\n- 所有“小写字母、固定长度、频次必须匹配”的连续子串题。\n\n#### 核心思路\n\n先把 `p` 中字符写入欠账数组：`map[c]` 表示还缺多少个 `c`。每次右扩时执行 `map[s[right]]--`，如果某个字符被用多了，它对应的欠账会变成负数。原始写法的关键是：只要当前右端字符透支，即 `map[s[right]] \u003c 0`，就不断从左端吐字符并把欠账加回去。这样循环结束后，窗口内每个字符都没有超过 `p` 的需求；当窗口长度刚好等于 `p.size()`，它就是一个异位词窗口。\n\n#### 代码模板：共同骨架\n\n> **题目简述：** 本模板覆盖：438 找到字符串中所有字母异位词（给定字符串 S 和 P，返回 S 中所有与 P 字符及频次相同的子串起点。）；567 字符串的排列（给定字符串 S1 和 S2，判断 S2 是否包含一个由 S1 字符重排得到的连续子串。） [438 原题 ↗](https://leetcode.cn/problems/find-all-anagrams-in-a-string/) · [567 原题 ↗](https://leetcode.cn/problems/permutation-in-string/)\n\n```cpp\nvector\u003cint> findAnagrams(string s, string p) {\n    vector\u003cint> res;\n    int map[26] = {0}; // map[c] 表示字符 c 还缺多少个；负数表示当前窗口用多了。\n    int m = (int)s.size();\n    int n = (int)p.size();\n\n    for (int i = 0; i \u003c n; i++) {\n        map[p[i] - 'a']++;\n    }\n\n    int left = 0;\n    for (int right = 0; right \u003c m; right++) {\n        int in = s[right] - 'a';\n        map[in]--; // 右端字符进入窗口，偿还一笔对应字符的欠账。\n\n        // 如果当前字符被用多了，就从左端持续吐出字符，直到透支被修复。\n        // 注意这里检查的是刚进入的 s[right]，这是原始笔记写法的核心。\n        while (map[in] \u003c 0) {\n            map[s[left] - 'a']++;\n            left++;\n        }\n\n        // 没有字符透支且长度等于 n，说明窗口频次与 p 完全一致。\n        if (right - left + 1 == n) {\n            res.push_back(left);\n        }\n    }\n\n    return res;\n}\n```\n\n#### 变形点对照\n\n| 变形 | 返回值 | 命中窗口后的处理 | 字符集 |\n|---|---|---|---|\n| `438 找所有异位词` | `vector\u003cint>` | `res.push_back(left)` 后继续扫描 | 小写字母用 `int map[26]` |\n| `567 是否包含排列` | `bool` | 第一次 `right - left + 1 == n` 直接返回 `true` | 同样可用 26 数组 |\n| 字符集不固定 | 起点或布尔值 | 逻辑不变 | 换成 `unordered_map\u003cchar, int>` 或 256 数组 |\n\n#### 易错点\n\n- 欠账数组初始化来自 `p`，右扩是 `--`，左缩是 `++`，方向不要反。\n- `while (map[in] \u003c 0)` 需要持续修复当前字符透支，不能只移动一次左端。\n- 命中条件是窗口长度等于 `p.size()`，无需每轮比较两张频次数组。\n\n### 5.4 固定长度单调队列：窗口最大值\n\n#### 适用题型\n\n- `239 滑动窗口最大值`：原始笔记思路是“队列存下标，超标踢队头，不如新值踢队尾”。\n- 固定长度窗口最小值：比较方向反过来即可。\n- 需要在窗口滑动时 O(1) 均摊维护最值候选。\n\n#### 核心思路\n\n双端队列 `dq` 保存候选下标。队头负责给出当前最大值；队尾负责淘汰以后不可能成为最大值的弱候选。由于弱候选可能连续出现多个，原始代码中“队尾不如新值就踢人”的判断必须写成 `while`，不能只用 `if` 弹一次。\n\n#### 代码模板：共同骨架\n\n> **题目简述：** 239 滑动窗口最大值：给定整数数组和窗口大小 K，返回窗口从左向右滑动时每个位置的最大值。 [力扣原题 ↗](https://leetcode.cn/problems/sliding-window-maximum/)\n\n```cpp\nvector\u003cint> maxSlidingWindow(vector\u003cint>& nums, int k) {\n    vector\u003cint> res;\n    deque\u003cint> dq; // 存下标；保持 nums[dq[0]] >= nums[dq[1]] >= ...。\n\n    for (int i = 0; i \u003c (int)nums.size(); i++) {\n        // 1. 踢过期队头：当前窗口是 [i - k + 1, i]。\n        while (!dq.empty() && dq.front() \u003c i - k + 1) {\n            dq.pop_front();\n        }\n\n        // 2. 踢弱队尾：nums[i] 更靠右且不小于队尾，队尾永远不会再成为最大值。\n        // 必须用 while，因为可能有多个队尾候选都不如当前值。\n        while (!dq.empty() && nums[i] >= nums[dq.back()]) {\n            dq.pop_back();\n        }\n\n        // 3. 当前下标入队，成为未来窗口的候选最大值。\n        dq.push_back(i);\n\n        // 4. 窗口长度达到 k 后，队头就是当前窗口最大值。\n        if (i - k + 1 >= 0) {\n            res.push_back(nums[dq.front()]);\n        }\n    }\n\n    return res;\n}\n```\n\n#### 变形点对照\n\n| 变形 | 队列单调性 | 队尾淘汰条件 | 队头含义 |\n|---|---|---|---|\n| `239 窗口最大值` | 从队头到队尾值递减 | `nums[i] >= nums[dq.back()]` | 当前窗口最大值下标 |\n| 固定窗口最小值 | 从队头到队尾值递增 | `nums[i] \u003c= nums[dq.back()]` | 当前窗口最小值下标 |\n| 保留更早相等元素 | 最大值用 `>`，保留相等值 | 相等时不弹队尾 | 队头仍是最大值，但相等元素更早过期 |\n\n#### 易错点\n\n- 单调队列必须存下标，不能只存值，否则无法判断是否超出窗口。\n- 读答案前必须先弹出过期队头。\n- 队尾淘汰必须用 `while`；只用 `if` 时，队列可能不再单调，后续最大值会错。\n\n### 5.5 相邻扩展：正数数组最短满足窗口\n\n#### 适用题型\n\n- 原始 `76` 笔记复盘中的 `slidingWindowMin` 骨架。\n- `209 长度最小的子数组`：数组元素全为正数，窗口和随右扩单调增加、随左缩单调减少。\n- 所有“达标后持续左缩求最短”的正数累计类窗口。\n\n#### 核心思路\n\n这类题和 `76` 的控制权交接完全一致：外层 `for` 负责右扩建立达标窗口；一旦 `state >= k`，内层 `while` 接管左边界，持续更新最短答案并撤销左端贡献，直到窗口不再达标。\n\n#### 代码模板：共同骨架\n\n> **题目简述：** 本模板覆盖：76 最小覆盖子串（在字符串 S 中寻找覆盖字符串 T 全部字符及其频次的最短连续子串。）；209 长度最小的子数组（给定正整数数组和目标值，求元素和至少为目标值的最短连续子数组长度。） [76 原题 ↗](https://leetcode.cn/problems/minimum-window-substring/) · [209 原题 ↗](https://leetcode.cn/problems/minimum-size-subarray-sum/)\n\n```cpp\nint slidingWindowMin(vector\u003cint>& nums, int k) {\n    if (nums.empty() || k \u003c= 0) return 0;\n\n    int left = 0;\n    int state = 0;     // 当前窗口和；正数数组下具备可收缩单调性。\n    int res = INT_MAX; // 求最短长度，初始为无穷大。\n\n    for (int right = 0; right \u003c (int)nums.size(); right++) {\n        // 1. 入窗：右指针扩大窗口，主动尝试让状态达标。\n        state += nums[right];\n\n        // 2. 达标后持续缩左：每次循环开始时窗口都是合法候选。\n        while (state >= k) {\n            res = min(res, right - left + 1);\n\n            // 3. 出窗：撤销左端元素贡献，再移动左指针。\n            state -= nums[left];\n            left++;\n        }\n    }\n\n    return res == INT_MAX ? 0 : res;\n}\n```\n\n#### 变形点对照\n\n| 变形 | 聚合状态 | 合法条件 | 为什么能滑窗 |\n|---|---|---|---|\n| 正数数组最短和至少 K | `state` 是窗口和 | `state >= k` | 正数保证右扩不减、左缩不增 |\n| 最小覆盖子串 `76` | `map + valid` | `valid == map.size()` | 状态可 O(1) 增删维护 |\n| 含负数的和为 K 子数组 | 前缀和 + 哈希表 | 查历史 `sum - k` | 负数破坏窗口和单调性，不适合滑窗 |\
