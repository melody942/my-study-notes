s[i]` |\n| 忘记初始化空前缀 | `560`、`437` | 写 `count[0] = 1` |\n| 查错补数方向 | `560` | 当前 `sum` 查历史 `sum - k` |\n| 哈希表只存下标不存次数 | `560` | 统计区间数时 value 必须是出现次数 |\n| 先加入当前前缀再查答案 | `560` | 先查历史，再加入当前 |\n| 树上前缀和没有回溯 | `437` | 递归退出前 `prefixCount[curSum]--` |\n| `int` 前缀和溢出 | `560`、`437` | 前缀和用 `long long` |\n| 除自身乘积使用除法 | `238` | 用左乘积和右乘积合并 |\n| 有 0 时乘积逻辑崩溃 | `238` | 前后缀天然处理 0，不要特判除法 |\n\n## 7. 最短复盘口诀\n\n前缀和先定义状态。普通区间用两前缀相减，统计区间用历史频次查 `sum - k`，乘积题用左前缀乘右后缀，树上路径进入加、退出减。`count[0] = 1` 是空前缀边界，回溯是树和数组的最大区别。\n\n================================================================================\n\n# 第23部分: 字符串\n\n================================================================================\n\n> 目标：本文把 Hot100 字符串题抽象成“字符状态、连续子串、括号栈、回文结构、递归解析、字典结构和字符串 DP”几类模板。复习时先判断题目处理的是子串、子序列、括号结构、词典还是构造搜索。\n\n## 1. 字符串题的底层模型\n\n字符串题的难点通常不在遍历字符，而在识别字符串结构。每道题先问六个问题：\n\n| 问题 | 如果答案是“是” | 常用处理 |\n|---|---|---|\n| 目标必须连续吗 | 最长无重复子串、最小覆盖、最长回文子串 | 滑动窗口、中心扩展、区间 DP |\n| 目标可以不连续吗 | 最长公共子序列、编辑距离 | 序列 DP |\n| 字符频次重要吗 | 异位词、覆盖、分组 | 计数数组或哈希表 |\n| 有括号或嵌套结构吗 | 有效括号、字符串解码、最长有效括号 | 栈、下标栈、递归解析 |\n| 需要枚举构造吗 | 电话号码组合、括号生成、分割回文串、单词搜索 | 回溯 + 剪枝 |\n| 需要前缀查询吗 | Trie、单词拆分 | 前缀树、哈希集合、DP |\n\nHot100 字符串题可以按结构分成七类：\n\n| 结构 | 对应题目 | 复习关键词 |\n|---|---|---|\n| 滑动窗口 | `3`、`76`、`438` | 连续子串、频次、欠账 |\n| 回文结构 | `5`、`131` | 中心扩展、区间 DP、回溯切割 |\n| 括号与栈 | `20`、`22`、`32`、`394` | 匹配、下标、嵌套解析 |\n| 字符分组 | `49`、`763` | 频次签名、最后出现位置 |\n| 词典与前缀 | `139`、`208` | `wordSet`、Trie、可达性 DP |\n| 网格字符串搜索 | `79` | DFS 回溯、访问恢复 |\n| 字符串 DP | `72`、`1143` | 状态定义、转移边界 |\n\n## 2. Hot100 字符串题型地图\n\n\n| 题型 | 题目 | 抽象能力 | 一句话记忆 |\n|---|---|---|---|\n| 滑窗子串 | `3 无重复字符`、`76 最小覆盖子串`、`438 找所有异位词` | 连续窗口频次维护 | 右扩更新状态，合法性决定左缩 |\n| 回文处理 | `5 最长回文子串`、`131 分割回文串` | 中心扩展或区间 DP | 回文判断预处理能降低回溯成本 |\n| 括号匹配 | `20 有效括号`、`22 括号生成`、`32 最长有效括号` | 栈、计数约束、下标边界 | 有效性要么靠栈匹配，要么靠左右数量约束 |\n| 字符分组与划分 | `49 字母异位词分组`、`763 划分字母区间` | 签名分组、最后出现位置 | 同组字符共享签名，同段字符不能跨出最远边界 |\n| 递归解析 | `394 字符串解码` | 数字、括号、字符串栈 | 遇 `]` 就结算当前层 |\n| 词典 DP | `139 单词拆分`、`208 Trie` | 前缀查询和可达性 | `dp[i]` 表示前 i 个字符能否拆分 |\n| 网格搜索 | `79 单词搜索` | 字符路径回溯 | 进入标记，退出恢复 |\n| 编辑类 DP | `72 编辑距离`、`1143 最长公共子序列` | 双串状态转移 | `dp[i][j]` 表示两个前缀之间的关系 |\n| 电话键盘/构造 | `17 电话号码组合` | 字符映射 + 回溯 | 每一位数字选择一个候选字符 |\n\n## 3. 复习顺序建议\n\n建议按“字符计数 → 栈结构 → 回溯构造 → 字符串 DP → Trie/词典”的顺序复习：\n\n1. `49 字母异位词分组`：练字符频次签名。\n2. `3`、`76`、`438`：掌握字符串滑动窗口。\n3. `20`、`32`、`394`：练栈和嵌套结构。\n4. `5`、`131`：掌握回文中心扩展和回文预处理。\n5. `17`、`22`、`79`：练字符串回溯和状态恢复。\n6. `139`、`208`：练词典、前缀和可达性。\n7. `72`、`1143`：练双串 DP 的状态定义。\n8. `763`：用最后出现位置理解字符串贪心划分。\n\n## 4. 关键套路详解\n\n### 4.1 子串和子序列必须先分清\n\n子串要求连续，通常用滑动窗口、中心扩展或区间 DP；子序列不要求连续，通常用双串 DP。`3`、`5`、`76` 处理子串；`1143` 处理子序列。把两者混淆，会直接选错算法。\n\n### 4.2 字符串计数优先用数组\n\n如果字符集固定为小写字母，用 `array\u003cint, 26>` 比 `unordered_map` 更直接；如果字符集包含 ASCII 或空格，用 `vector\u003cint>(128)` 或 `vector\u003cint>(256)`；只有字符集不确定时再考虑哈希表。\n\n### 4.3 括号题要区分“匹配”和“最长”\n\n`20` 只判断整体是否有效，用栈保存左括号即可。`32` 要找最长有效括号，需要保存下标边界：栈底放“上一个无效位置”，每次匹配后用当前下标减栈顶下标更新长度。\n\n### 4.4 回文题有两种主线\n\n`5` 求最长回文子串，中心扩展最直接；`131` 要枚举所有分割方案，如果每次现场判断回文会重复计算，通常先用区间 DP 预处理 `isPal[left][right]`。\n\n### 4.5 嵌套解析题栈里存的是上一层状态\n\n`394 字符串解码`遇到 `[` 时，把当前数字和当前字符串入栈，然后开启新层；遇到 `]` 时，当前层完成，把它重复若干次接回上一层。栈保存的是“回来以后要继续的状态”。\n\n### 4.6 词典题是前缀可达性\n\n`139 单词拆分`中 `dp[i]` 表示 `s[0..i)` 是否能拆分。只要存在 `j \u003c i`，使得 `dp[j]` 为真且 `s[j..i)` 在词典中，`dp[i]` 就为真。`208 Trie`则把词典查询优化成沿字符边走。\n\n## 5. 抽象代码模板\n\n本节按字符串题的核心模型拆分模板。每个模板都把“适用题型”和“配套代码”绑定起来；如果同一模型下的题型差异较大，则拆成多个函数，避免只给一个泛化骨架。\n\n### 5.1 模板一：字符串滑动窗口\n\n#### 适用题型\n\n- `3 无重复字符的最长子串`：维护一个始终无重复字符的最长合法窗口。\n- `76 最小覆盖子串`：维护欠账表，窗口满足需求后尽量左缩。\n- `438 找到字符串中所有字母异位词`：固定长度窗口，比较窗口频次和目标频次。\n\n#### 核心思路\n\n滑动窗口的共同骨架是右指针不断纳入新字符，左指针在窗口不满足当前题目要求时移动。不同题型的差异体现在“合法条件、何时收缩、何时更新答案”。\n\n#### 代码模板：共同骨架\n\n> **题目简述：** 本模板覆盖：3 无重复字符的最长子串（给定字符串，求不含重复字符的最长连续子串长度。）；76 最小覆盖子串（在字符串 S 中寻找覆盖字符串 T 全部字符及其频次的最短连续子串。）；438 找到字符串中所有字母异位词（给定字符串 S 和 P，返回 S 中所有与 P 字符及频次相同的子串起点。） [3 原题 ↗](https://leetcode.cn/problems/longest-substring-without-repeating-characters/) · [76 原题 ↗](https://leetcode.cn/problems/minimum-window-substring/) · [438 原题 ↗](https://leetcode.cn/problems/find-all-anagrams-in-a-string/)\n\n```cpp\nvoid slidingWindowSkeleton(const string& s) {\n    int left = 0;\n    for (int right = 0; right \u003c (int)s.size(); right++) {\n        // 1. 纳入 s[right]，更新窗口状态。\n\n        while (/* 当前窗口需要收缩 */) {\n            // 2. 移出 s[left]，更新窗口状态。\n            left++;\n        }\n\n        // 3. 在题目要求的时机更新答案。\n    }\n}\n```\n\n最小覆盖子串是这个骨架的典型形态：右侧纳入字符减少欠账，窗口满足后持续左缩，并在收缩过程中更新最短答案。\n\n> **题目简述：** 本模板覆盖：3 无重复字符的最长子串（给定字符串，求不含重复字符的最长连续子串长度。）；76 最小覆盖子串（在字符串 S 中寻找覆盖字符串 T 全部字符及其频次的最短连续子串。）；438 找到字符串中所有字母异位词（给定字符串 S 和 P，返回 S 中所有与 P 字符及频次相同的子串起点。） [3 原题 ↗](https://leetcode.cn/problems/longest-substring-without-repeating-characters/) · [76 原题 ↗](https://leetcode.cn/problems/minimum-window-substring/) · [438 原题 ↗](https://leetcode.cn/problems/find-all-anagrams-in-a-string/)\n\n```cpp\nstring minWindowTemplate(const string& s, const string& t) {\n    vector\u003cint> need(128, 0);\n    for (char ch : t) need[ch]++;\n\n    int missing = t.size();\n    int left = 0, bestLeft = 0, bestLen = INT_MAX;\n\n    for (int right = 0; right \u003c (int)s.size(); right++) {\n        if (need[s[right]] > 0) missing--;\n        need[s[right]]--;\n\n        while (missing == 0) {\n            if (right - left + 1 \u003c bestLen) {\n                bestLen = right - left + 1;\n                bestLeft = left;\n            }\n            need[s[left]]++;\n            if (need[s[left]] > 0) missing++;\n            left++;\n        }\n    }\n\n    return bestLen == INT_MAX ? \"\" : s.substr(bestLeft, bestLen);\n}\n```\n\n#### 变形点对照\n\n| 题型 | 窗口合法条件 | 收缩时机 | 更新答案时机 |\n|---|---|---|---|\n| 最长无重复字符 | 窗口内无重复字符 | 新字符在窗口内重复时，`left` 跳到上次位置后一位 | 每次窗口合法后更新最大长度 |\n| 最小覆盖子串 | `missing == 0`，窗口已覆盖目标 | 满足覆盖后尽量左缩 | 左缩过程中更新最短长度 |\n| 找所有异位词 | 窗口长度等于 `p.size()` 且频次一致 | 长度超过 `p.size()` 时左缩 | 长度正确且频次一致时记录 `left` |\n\n最长无重复字符只需要把“收缩循环”替换成跳跃左边界：\n\n```cpp\nif (last[ch] >= left) {\n    left = last[ch] + 1;\n}\nlast[ch] = right;\nans = max(ans, right - left + 1);\n```\n\n固定长度异位词只需要把收缩条件换成窗口长度：\n\n```cpp\nif (right - left + 1 > (int)p.size()) {\n    window[s[left] - 'a']--;\n    left++;\n}\nif (right - left + 1 == (int)p.size() && window == need) {\n    ans.push_back(left);\n}\n```\n\n#### 易错点\n\n- 最长窗口在合法后更新答案；最短窗口在满足条件后的收缩过程中更新答案。\n- `minWindow` 中 `need[ch]` 可以为负数，负数表示窗口里多余的字符。\n- 固定窗口题不要每次重新统计整个子串，维护滑动频次数组即可。\n- 不要只背代码，先判断当前题是“最长合法”“最短覆盖”还是“固定长度匹配”。\n\n### 5.2 模板二：字符签名与分组\n\n#### 适用题型\n\n- `49 字母异位词分组`：同一组字符串具有相同字符频次签名。\n- 异位词判断：两个字符串的频次向量完全一致。\n- 字符频次作为等价关系的题：把字符串映射成稳定 key。\n\n#### 核心思路\n\n- 排序 key 简洁，但每个字符串多一个 `O(k log k)`。\n- 计数 key 是线性的，适合只含小写字母的题。\n- key 中要加分隔符，避免 `[1, 11]` 和 `[11, 1]` 拼接冲突。\n\n#### 代码模板\n\n> **题目简述：** 49 字母异位词分组：给定字符串数组，将包含相同字符及频次的字母异位词归为一组。 [力扣原题 ↗](https://leetcode.cn/problems/group-anagrams/)\n\n```cpp\nstring countSignatureTemplate(const string& s) {\n    array\u003cint, 26> cnt{};\n    for (char ch : s) {\n        cnt[ch - 'a']++;\n    }\n\n    string key;\n    for (int x : cnt) {\n        // 分隔符不能省，否则不同计数序列可能拼出相同字符串。\n        key += '#';\n        key += to_string(x);\n    }\n    return key;\n}\n\nvector\u003cvector\u003cstring>> groupAnagramsTemplate(vector\u003cstring>& strs) {\n    unordered_map\u003cstring, vector\u003cstring>> groups;\n\n    for (const string& s : strs) {\n        groups[countSignatureTemplate(s)].push_back(s);\n    }\n\n    vector\u003cvector\u003cstring>> ans;\n    for (auto& [key, values] : groups) {\n        ans.push_back(move(values));\n    }\n    return ans;\n}\n```\n\n#### 易错点\n\n- 计数签名默认只适合字符集固定的场景；如果有大写或 Unicode，需要换成 map 或排序 key。\n- key 必须稳定，同一个异位词集合生成的 key 应完全一致。\n\n### 5.3 模板三：括号栈与下标哨兵\n\n#### 适用题型\n\n- `20 有效括号`：栈保存还未匹配的左括号。\n- `32 最长有效括号`：栈保存下标，栈底保存最近一个无效边界。\n- `22 括号生成`：回溯时约束右括号不能超过左括号。\n\n#### 核心思路\n\n- 有效括号检查类型和顺序，不能只看数量。\n- 最长有效括号中，栈底哨兵用于计算合法段长度。\n- 生成括号时，只要 `rightUsed \u003c= leftUsed \u003c= n`，前缀就仍可能合法。\n\n#### 代码 A：有效括号\n\n> **题目简述：** 20 有效的括号：给定仅含三类括号的字符串，判断括号类型、顺序和配对是否有效。 [力扣原题 ↗](https://leetcode.cn/problems/valid-parentheses/)\n\n```cpp\nbool validParenthesesTemplate(const string& s) {\n    unordered_map\u003cchar, char> match{{')', '('}, {']', '['}, {'}', '{'}};\n    stack\u003cchar> st;\n\n    for (char ch : s) {\n        if (!match.count(ch)) {\n            // 左括号暂时等待未来右括号匹配。\n            st.push(ch);\n            continue;\n        }\n\n        // 右括号必须和最近的左括号匹配，不能跨层匹配。\n        if (st.empty() || st.top() != match[ch]) {\n            return false;\n        }\n        st.pop();\n    }\n\n    return st.empty();\n}\n```\n\n#### 代码 B：最长有效括号\n\n> **题目简述：** 32 最长有效括号：给定仅含左右圆括号的字符串，求最长连续合法括号子串的长度。 [力扣原题 ↗](https://leetcode.cn/problems/longest-valid-parentheses/)\n\n```cpp\nint longestValidParenthesesTemplate(const string& s) {\n    stack\u003cint> st;\n\n    // -1 表示“最近一个无效位置”在字符串开始前，方便计算从 0 开始的合法长度。\n    st.push(-1);\n    int ans = 0;\n\n    for (int i = 0; i \u003c (int)s.size(); i++) {\n        if (s[i] == '(') {\n            st.push(i);\n        } else {\n            st.pop();\n\n            if (st.empty()) {\n                // 当前 ')' 没有可匹配左括号，它成为新的无效边界。\n                st.push(i);\n            } else {\n                // st.top() 是当前合法段左侧最近无效位置或未匹配左括号位置。\n                ans = max(ans, i - st.top());\n            }\n        }\n    }\n\n    return ans;\n}\n```\n\n#### 易错点\n\n- 最长有效括号的栈里存下标，不能存字符。\n- 遇到无效右括号时要把它作为新哨兵，否则后续长度会跨过非法位置。\n\n### 5.4 模板四：回文中心扩展与回文预处理\n\n#### 适用题型\n\n- `5 最长回文子串`：枚举奇偶中心，向两侧扩展。\n- `131 分割回文串`：先预处理 `isPal[left][right]`，再回溯切分。\n- 回文最少切割类题：`isPal` 预处理后做前缀 DP。\n\n#### 核心思路\n\n- 中心扩展适合只要最长子串的题，空间低。\n- 回文切分要反复查询区间是否回文，先预处理可避免重复判断。\n- 区间 DP 要保证 `isPal[left + 1][right - 1]` 已经算好，所以 `left` 倒序、`right` 正序。\n\n#### 代码 A：最长回文子串\n\n> **题目简述：** 5 最长回文子串：给定字符串，返回其中长度最长的连续回文子串。 [力扣原题 ↗](https://leetcode.cn/problems/longest-palindromic-substring/)\n\n```cpp\npair\u003cint, int> expandPalindromeTemplate(const string& s, int left, int right) {\n    while (left >= 0 && right \u003c (int)s.size() && s[left] == s[right]) {\n        left--;\n        right++;\n    }\n\n    // 循环结束时 [left + 1, right - 1] 才是最后一个合法回文区间。\n    return {left + 1, right - left - 1};\n}\n\nstring longestPalindromeTemplate(const string& s) {\n    int bestStart = 0;\n    int bestLen = 0;\n\n    for (int i = 0; i \u003c (int)s.size(); i++) {\n        auto [oddStart, oddLen] = expandPalindromeTemplate(s, i, i);\n        auto [evenStart, evenLen] = expandPalindromeTemplate(s, i, i + 1);\n\n        if (oddLen > bestLen) {\n            bestStart = oddStart;\n            bestLen = oddLen;\n        }\n        if (evenLen > bestLen) {\n            bestStart = evenStart;\n            bestLen = evenLen;\n        }\n    }\n\n    return s.substr(bestStart, bestLen);\n}\n```\n\n#### 代码 B：回文表 + 分割回文串\n\n> **题目简述：** 131 分割回文串：将给定字符串切分成若干子串，返回每段都是回文串的全部切分方案。 [力扣原题 ↗](https://leetcode.cn/problems/palindrome-partitioning/)\n\n```cpp\nvector\u003cvector\u003cbool>> buildPalindromeTableTemplate(const string& s) {\n    int n = s.size();\n    vector\u003cvector\u003cbool>> isPal(n, vector\u003cbool>(n, false));\n\n    for (int left = n - 1; left >= 0; left--) {\n        for (int right = left; right \u003c n; right++) {\n            // 长度为 1、2、3 时，只要两端相等，中间天然不用继续判断。\n            isPal[left][right] = s[left] == s[right]\n                              && (right - left \u003c= 2 || isPal[left + 1][right - 1]);\n        }\n    }\n\n    return isPal;\n}\n\nvoid dfsPartitionPalindromeTemplate(const string& s,\n                                    int start,\n                                    const vector\u003cvector\u003cbool>>& isPal,\n                                    vector\u003cstring>& path,\n                                    vector\u003cvector\u003cstring>>& ans) {\n    if (start == (int)s.size()) {\n        ans.push_back(path);\n        return;\n    }\n\n    for (int end = start; end \u003c (int)s.size(); end++) {\n        if (!isPal[start][end]) {\n            continue;\n        }\n\n        // 选择 s[start..end] 作为当前段，递归处理剩余后缀。\n        path.push_back(s.substr(start, end - start + 1));\n        dfsPartitionPalindromeTemplate(s, end + 1, isPal, path, ans);\n        path.pop_back();\n    }\n}\n\nvector\u003cvector\u003cstring>> partitionPalindromeTemplate(const string& s) {\n    auto isPal = buildPalindromeTableTemplate(s);\n    vector\u003cvector\u003cstring>> ans;\n    vector\u003cstring> path;\n    dfsPartitionPalindromeTemplate(s, 0, isPal, path, ans);\n    return ans;\n}\n```\n\n#### 易错点\n\n- 最长回文必须同时考虑奇数中心和偶数中心。\n- 回文表计算顺序不能反，否则 `isPal[left + 1][right - 1]` 还没算出来。\n- 回溯切分后必须 `pop_back` 撤销选择。\n\n### 5.5 模板五：嵌套字符串解析\n\n#### 适用题型\n\n- `394 字符串解码`：遇到新层保存上一层数字和字符串状态。\n- 带括号表达式解析：进入括号保存当前上下文，退出括号结算当前层。\n- 递归结构字符串解析：栈保存“返回上一层后要继续的信息”。\n\n#### 核心思路\n\n- `num` 处理连续多位数字。\n- 遇到 `[` 时，当前层开始，上一层的字符串和重复次数入栈。\n- 遇到 `]` 时，当前层完成，重复后接回上一层。\n\n#### 代码模板\n\n> **题目简述：** 394 字符串解码：解码形如 k[子串] 的有效编码字符串，编码可嵌套且 k 表示重复次数。 [力扣原题 ↗](https://leetcode.cn/problems/decode-string/)\n\n```cpp\nstring decodeStringTemplate(const string& s) {\n    stack\u003cint> counts;\n    stack\u003cstring> prevStrings;\n    string cur;\n    int num = 0;\n\n    for (char ch : s) {\n        if (isdigit(ch)) {\n            // 多位数字要累乘 10，例如 12[a] 不能按 1 和 2 分开处理。\n            num = num * 10 + (ch - '0');\n        } else if (ch == '[') {\n            // 进入新层前，保存上一层状态；cur 清空后专门收集括号内字符串。\n            counts.push(num);\n            prevStrings.push(cur);\n            num = 0;\n            cur.clear();\n        } else if (ch == ']') {\n            int repeat = counts.top();\n            counts.pop();\n\n            string prev = prevStrings.top();\n            prevStrings.pop();\n\n            // 当前层字符串重复 repeat 次后，接回上一层末尾。\n            while (repeat--) {\n                prev += cur;\n            }\n            cur = prev;\n        } else {\n            cur.push_back(ch);\n        }\n    }\n\n    return cur;\n}\n```\n\n#### 易错点\n\n- `num` 在遇到 `[` 后要清零，否则会污染下一层数字。\n- 出栈顺序要和入栈语义一致：先取重复次数，再取上一层字符串。\n- 嵌套结构中 `cur` 始终表示当前层已经解析出的字符串。\n\n### 5.6 模板六：词典 DP 与 Trie\n\n#### 适用题型\n\n- `139 单词拆分`：`dp[i]` 表示前 `i` 个字符能否拆分。\n- `208 实现 Trie`：提供 `insert`、`search`、`startsWith` 三个完整接口。\n- `212 单词搜索 II` 相邻模型：Trie 用于剪枝网格 DFS，但还需要额外的网格回溯。\n\n#### 核心思路\n\n- 词典 DP 是“前缀可达性”：只要存在一个可达前缀 `j`，且 `s[j..i)` 在词典中，`dp[i]` 就可达。\n- Trie 的 `search` 要检查 `isEnd`，`startsWith` 只检查路径是否存在。\n- Trie 节点可以用数组优化小写字母，也可以用哈希表支持更大字符集。\n\n#### 代码 A：单词拆分\n\n> **题目简述：** 139 单词拆分：给定字符串和单词字典，判断字符串能否拆成一个或多个字典单词。 [力扣原题 ↗](https://leetcode.cn/problems/word-break/)\n\n```cpp\nbool wordBreakTemplate(const string& s, vector\u003cstring>& wordDict) {\n    unordered_set\u003cstring> words(wordDict.begin(), wordDict.end());\n    vector\u003cbool> dp(s.size() + 1, false);\n\n    // 空串可拆分，是所有后续状态转移的起点。\n    dp[0] = true;\n\n    for (int i = 1; i \u003c= (int)s.size(); i++) {\n        for (int j = 0; j \u003c i; j++) {\n            // 前缀 s[0..j) 可拆，且后半段 s[j..i) 是单词，则前 i 个字符可拆。\n            if (dp[j] && words.count(s.substr(j, i - j))) {\n                dp[i] = true;\n                break;\n            }\n        }\n    }\n\n    return dp[s.size()];\n}\n```\n\n#### 代码 B：完整 Trie 类\n\n> **题目简述：** 208 实现 Trie：设计前缀树，支持插入单词、查询完整单词和判断是否存在指定前缀。 [力扣原题 ↗](https://leetcode.cn/problems/implement-trie-prefix-tree/)\n\n```cpp\nclass TrieTemplate {\nprivate:\n    struct Node {\n        array\u003cNode*, 26> child{};\n        bool isEnd = false;\n    };\n\n    Node* root;\n\n    Node* walk(const string& word) const {\n        Node* cur = root;\n        for (char ch : word) {\n            int idx = ch - 'a';\n            if (!cur->child[idx]) {\n                return nullptr;\n            }\n            cur = cur->child[idx];\n        }\n        return cur;\n    }\n\npublic:\n    TrieTemplate() : root(new Node()) {}\n\n    void insert(const string& word) {\n        Node* cur = root;\n        for (char ch : word) {\n            int idx = ch - 'a';\n            if (!cur->child[idx]) {\n                // 路径不存在就创建节点；已存在则复用原路径。\n                cur->child[idx] = new Node();\n            }\n            cur = cur->child[idx];\n        }\n\n        // 只有完整单词末尾才标记 isEnd，前缀路径本身不等于完整单词。\n        cur->isEnd = true;\n    }\n\n    bool search(const string& word) const {\n        Node* node = walk(word);\n        return node != nullptr && node->isEnd;\n    }\n\n    bool startsWith(const string& prefix) const {\n        return walk(prefix) != nullptr;\n    }\n};\n```\n\n#### 易错点\n\n- `dp[0] = true` 不能漏，否则所有状态都无法从空前缀转移。\n- `search(\"app\")` 和 `startsWith(\"app\")` 语义不同，前者需要 `isEnd`。\n- Trie 模板默认只处理小写字母；字符集变化时要修改 child 结构。\n\n### 5.7 模板七：双串动态规划\n\n#### 适用题型\n\n- `1143 最长公共子序列`：相等时取左上 + 1，否则取上/左最大。\n- `72 编辑距离`：插入、删除、替换三种操作取最小。\n- 两个字符串前缀关系题：通常定义 `dp[i][j]` 表示两个前缀之间的最优值或可达性。\n\n#### 核心思路\n\n- `dp[i][j]` 使用前 `i` 个字符和前 `j` 个字符，访问字符时是 `a[i - 1]` 与 `b[j - 1]`。\n- 空前缀边界必须初始化。\n- LCS 是求最大保留长度；编辑距离是求最少操作次数。\n\n#### 代码 A：最长公共子序列\n\n> **题目简述：** 1143 最长公共子序列：给定两个字符串，求二者保持字符相对顺序但不要求连续的最长公共子序列长度。 [力扣原题 ↗](https://leetcode.cn/problems/longest-common-subsequence/)\n\n```cpp\nint lcsTemplate(const string& a, const string& b) {\n    int m = a.size();\n    int n = b.size();\n    vector\u003cvector\u003cint>> dp(m + 1, vector\u003cint>(n + 1, 0));\n\n    for (int i = 1; i \u003c= m; i++) {\n        for (int j = 1; j \u003c= n; j++) {\n            if (a[i - 1] == b[j - 1]) {\n                // 当前两个字符都保留，答案来自两个前缀同时缩短一位。\n                dp[i][j] = dp[i - 1][j - 1] + 1;\n            } else {\n                // 当前字符不相等，只能分别尝试丢弃 a 或 b 的最后一个字符。\n                dp[i][j] = max(dp[i - 1][j], dp[i][j - 1]);\n            }\n        }\n    }\n\n    return dp[m][n];\n}\n```\n\n#### 代码 B：编辑距离\n\n> **题目简述：** 72 编辑距离：给定两个单词，求通过插入、删除或替换字符将前者变为后者的最少操作数。 [力扣原题 ↗](https://leetcode.cn/problems/edit-distance/)\n\n```cpp\nint editDistanceTemplate(const string& a, const string& b) {\n    int m = a.size();\n    int n = b.size();\n    vector\u003cvector\u003cint>> dp(m + 1, vector\u003cint>(n + 1, 0));\n\n    for (int i = 0; i \u003c= m; i++) {\n        // a 的前 i 个字符变成空串，只能删除 i 次。\n        dp[i][0] = i;\n    }\n    for (int j = 0; j \u003c= n; j++) {\n        // 空串变成 b 的前 j 个字符，只能插入 j 次。\n        dp[0][j] = j;\n    }\n\n    for (int i = 1; i \u003c= m; i++) {\n        for (int j = 1; j \u003c= n; j++) {\n            if (a[i - 1] == b[j - 1]) {\n                dp[i][j] = dp[i - 1][j - 1];\n            } else {\n                int removeA = dp[i - 1][j];\n                int insertB = dp[i][j - 1];\n                int replaceA = dp[i - 1][j - 1];\n                dp[i][j] = min({removeA, insertB, replaceA}) + 1;\n            }\n        }\n    }\n\n    return dp[m][n];\n}\n```\n\n#### 易错点\n\n- `dp` 维度用 `m + 1`、`n + 1`，字符访问用 `i - 1`、`j - 1`。\n- 编辑距离的三个操作方向分别是删除、插入、替换，不要漏掉替换。\n- 子串连续，子序列不连续；LCS 不能按滑动窗口理解。\n\n## 6. 高频易错点清单\n\n| 易错点 | 典型题目 | 规避方式 |\n|---|---|---|\n| 把子串当子序列 | `3`、`5`、`1143` | 子串连续，子序列不连续 |\n| 字符频次 key 有冲突 | `49` | 计数 key 加分隔符 |\n| 滑动窗口更新时机混乱 | `3`、`76`、`438` | 最长、最短、固定窗口分开记 |\n| 有效括号只比较数量 | `20` | 必须检查类型和顺序 |\n| 最长有效括号没保存无效边界 | `32` | 栈底放最近无效下标 |\n| 回文中心漏掉偶数长度 | `5` | 同时扩展 `(i, i)` 和 `(i, i + 1)` |\n| 回文分割反复判断回文超时 | `131` | 先预处理 `isPal` |\n| 字符串解码多位数字处理错误 | `394` | `num = num * 10 + digit` |\n| 单词拆分 `dp[0]` 未初始化 | `139` | 空串可拆分，`dp[0] = true` |\n| 网格单词搜索不恢复现场 | `79` | 提前返回和失败返回前都要恢复字符 |\n| 编辑距离边界漏初始化 | `72` | 空前缀到另一个前缀需要插入/删除次数 |\n| Trie 把前缀当完整单词 | `208` | `search` 检查 `isEnd`，`startsWith` 不检查 |\n\n## 7. 最短复盘口诀\n\n字符串题先分子串和子序列。连续子串想滑窗或中心扩展，频次题设计计数签名，括号题用栈和下标，回文枚举中心或预处理区间，嵌套解析保存上一层，词典题看前缀可达性，双串题定义 `dp[i][j]` 的前缀语义。\n\n"</script>
<script id="initial-markdown-python" type="application/json">"# Hot100 完整复习笔记\n\n> 使用方式：先看“一页速记”和“算法选择决策树”定方向，再用“题号速查索引”跳到主专题，最后进入对应专题的模板、易错点和复盘口诀。\n\n## 0. 总目录\n\n| 部分 | 专题 | 快速入口 | 适合优先查看的题型 |\n|---|---|---|---|\n| 1 | 哈希表 | [第1部分: 哈希表](#第1部分-哈希表) | 补数查询、频率统计、映射关系、O(1) 定位 |\n| 2 | 双引用 | [第2部分: 双引用](#第2部分-双引用) | 两端夹逼、快慢引用、链表相交、原地覆盖 |\n| 3 | 滑动窗口 | [第3部分: 滑动窗口](#第3部分-滑动窗口) | 连续子串、连续子数组、窗口状态维护 |\n| 4 | 矩阵 | [第4部分: 矩阵](#第4部分-矩阵) | 二维坐标、边界收缩、网格 DFS/BFS、矩阵 DP |\n| 5 | 链表 | [第5部分: 链表](#第5部分-链表) | dummy、反转、删除、分组、环、相交 |\n| 6 | 二叉树 | [第6部分: 二叉树](#第6部分-二叉树) | 递归语义、遍历顺序、BST、路径贡献 |\n| 7 | 图论 | [第7部分: 图论](#第7部分-图论) | 建图、连通块、多源 BFS、拓扑排序 |\n| 8 | 回溯 | [第8部分: 回溯](#第8部分-回溯) | 组合、排列、子集、切分、棋盘、路径搜索 |\n| 9 | 二分查找 | [第9部分: 二分查找](#第9部分-二分查找) | 查值、查边界、旋转数组、答案空间 |\n| 10 | 单调栈 | [第10部分: 单调栈](#第10部分-单调栈) | 最近更大/更小边界、面积、水量、等待结算 |\n| 11 | 栈 | [第11部分: 栈](#第11部分-栈) | 括号匹配、下标哨兵、上下文保存、模拟递归 |\n| 12 | 堆 | [第12部分: 堆](#第12部分-堆) | Top K、多路合并、动态中位数、过期清理 |\n| 13 | 贪心 | [第13部分: 贪心](#第13部分-贪心) | 局部选择、覆盖边界、区间闭合、候选淘汰 |\n| 14 | 动态规划 | [第14部分: 动态规划](#第14部分-动态规划) | 状态定义、转移方程、遍历顺序、空间压缩 |\n| 15 | 技巧 | [第15部分: 技巧](#第15部分-技巧) | 进位、翻转、异或、投票、原地标记、数学观察 |\n| 16 | 排序 | [第16部分: 排序](#第16部分-排序) | 排序预处理、区间扫描、三路划分、桶排序 |\n| 17 | 深度优先搜索 | [第17部分: 深度优先搜索](#第17部分-深度优先搜索) | 递归状态、访问标记、回溯恢复、图染色 |\n| 18 | 广度优先搜索 | [第18部分: 广度优先搜索](#第18部分-广度优先搜索) | 按层扩展、最短距离、多源扩散、拓扑剥离 |\n| 19 | 设计 | [第19部分: 设计](#第19部分-设计) | 接口语义、结构组合、复杂度不变量 |\n| 20 | 分治 | [第20部分: 分治](#第20部分-分治) | 区间递归、左右合并、快速选择、候选验证 |\n| 21 | 递归 | [第21部分: 递归](#第21部分-递归) | 函数语义、终止条件、子问题返回值 |\n| 22 | 前缀和 | [第22部分: 前缀和](#第22部分-前缀和) | 区间差、历史计数、左右乘积、树上路径和 |\n| 23 | 字符串 | [第23部分: 字符串](#第23部分-字符串) | 子串、括号、回文、解析、Trie、字符串 DP |\n\n## 0.1 一页速记\n\n- 哈希表：先定义 `key/value`，再决定“先查后放”或“先放后查”。\n- 双引用：每次移动都要说明会淘汰哪一批候选，以及为什么安全。\n- 滑动窗口：只处理连续区间，窗口状态要能随左右边界 O(1) 增删。\n- 矩阵：先统一 `r/c/m/n` 的坐标语义，再选边界收缩、DFS/BFS、DP 或二分。\n- 链表：优先 dummy，删除找前驱，反转先保存 `next`，分组先确认长度。\n- 二叉树：先定义递归函数语义，再决定前序传状态、中序用有序性、后序汇总信息。\n- 图论：先翻译“节点”和“边”，再选 DFS 连通块、BFS 最短层数或拓扑判环。\n- 回溯：路径、选择列表、剪枝条件、撤销现场四件套缺一不可。\n- 二分查找：先找单调性，再定义边界语义，最后确认返回 `left` 还是 `right`。\n- 单调栈：栈里存等待结算的下标，出栈瞬间确定右边界，新的栈顶常给左边界。\n- 栈：保存最近未完成状态，括号存匹配，下标存边界，上下文存外层现场。\n- 堆：动态维护极值；固定大小 Top K 让堆顶表示当前集合中最弱候选。\n- 贪心：局部选择必须能证明安全，常见证明方式是覆盖边界、交换论证或支配关系。\n- 动态规划：先写清 `dp` 含义，再写初始化、转移、遍历顺序和压缩方向。\n- 技巧：特殊约束触发特殊模型，重点识别进位、异或抵消、投票抵消、原地标记。\n- 排序：排序用于制造单调性、相邻关系或分组结构，后续常接双引用、扫描、堆或桶。\n- DFS：关注当前调用处理什么、返回什么、进入/退出时维护什么状态。\n- BFS：队列按层扩展；最短步数看层数，多源扩散先把所有源点入队。\n- 设计：从接口复杂度反推结构组合，每个操作都要维护同一组不变量。\n- 分治：定义子问题区间、递归返回值和跨区间合并信息。\n- 递归：用一句话定义函数语义，当前层只处理当前小问题，其余交给子问题。\n- 前缀和：把区间问题转成两个前缀状态之差；计数题要存历史频次。\n- 字符串：先判断子串、子序列、括号结构、回文结构、词典结构或构造搜索。\n\n## 0.2 算法选择决策树\n\n1. **题目处理连续子数组或连续子串？**\n   - 状态能随左右边界 O(1) 增删：优先滑动窗口。\n   - 问区间和、区间积、历史状态差：优先前缀和。\n   - 窗口长度固定且问极值：考虑单调队列或堆。\n   - 数组全为正数且问最短/最长满足条件区间：优先滑动窗口。\n\n2. **题目存在有序性、排序后有序性或答案单调性？**\n   - 查具体值、左右边界、插入位置：二分查找。\n   - 排序后两端夹逼或去重枚举：排序 + 双引用。\n   - `check(mid)` 随 `mid` 单调变化：答案空间二分。\n   - 行列分别有序的矩阵：优先阶梯搜索；全局有序矩阵可展平二分。\n\n3. **题目是链表结构？**\n   - 删除、插入、合并：先考虑 dummy。\n   - 倒数、环、相交：快慢引用或双引用对齐。\n   - 反转、分组反转、回文链表：三引用反转骨架。\n   - 随机引用或对象复制：哈希映射或穿插复制。\n\n4. **题目是树或递归结构？**\n   - 需要从父节点向子节点传状态：前序 DFS。\n   - 需要 BST 有序性：中序 DFS。\n   - 需要左右子树结果合并：后序 DFS。\n   - 需要按层、右视图、最短深度：BFS。\n   - 需要构造树：区间递归 + 下标映射。\n\n5. **题目能翻译成图？**\n   - 求连通块数量或区域大小：DFS/BFS + 访问标记。\n   - 求最短步数或最少分钟：BFS。\n   - 多个起点同时扩散：多源 BFS。\n   - 存在先修关系或依赖顺序：拓扑排序或 DFS 三色判环。\n   - 需要枚举路径且可重复回退：回溯，注意撤销现场。\n\n6. **题目要求枚举所有方案？**\n   - 组合、子集：用 `start` 控制选择范围。\n   - 排列：用 `used` 控制元素是否已在路径中。\n   - 切分：用 `index` 表示下一刀起点。\n   - 棋盘约束：用列、对角线集合剪枝。\n   - 网格路径：访问标记要在递归退出前恢复。\n\n7. **题目问最近更大/更小、右侧第一个、面积或水量？**\n   - 需要等待右边界出现：单调栈。\n   - 固定窗口最大值：单调队列。\n   - Top K 或动态极值：堆。\n   - 数据流中位数：大顶堆 + 小顶堆。\n\n8. **题目有重复子问题和最优子结构？**\n   - 单序列位置依赖：线性 DP。\n   - 二维网格路径：矩阵 DP。\n   - 两个字符串互相匹配：双序列 DP。\n   - 容量选择：背包 DP。\n   - 树上路径贡献：树形 DP。\n   - 能被贪心覆盖时，优先选择变量更少的贪心写法。\n\n9. **题目约束暗示特殊技巧？**\n   - 数字按位、成对出现：异或或按位计数。\n   - 超过一半：摩尔投票。\n   - 数组值域落在 `[1, n]`：原地哈希、抽屉原理或函数图快慢引用。\n   - 原地旋转、翻转、下一个排列：找关键位置再局部调整。\n   - 频率选择：哈希计数后接桶、堆或快速选择。\n\n## 0.3 题号速查索引\n\n> 说明：本表覆盖笔记中出现的核心题与相邻变形题。复习时优先看“主入口”，再按“关联专题”补充替代解法或证明角度。\n\n| 题号 | 题目 | 主入口 `41` | 起点判断、原地哈希 |\n| 映射关系 | `138`、`105`、`208` | 节点映射、下标映射、字符分支 |\n| 设计组合 | `146` | `dict` 查节点，链表调顺序 |\n\n## 2. Hot100 哈希表题型地图\n\n\n| 题型 | 题目 | 抽象能力 | 一句话记忆 |\n|---|---|---|---|\n| 补数查找 | `1 两数之和` | 当前元素和历史元素配对 | 先查 `target - x`，再记录 `x` |\n| 滑窗计数 | `3 无重复字符`、`76 最小覆盖子串`、`438 找到所有字母异位词` | 频次表维护窗口状态 | 窗口合法性由计数差决定 |\n| 字符串分组 | `49 字母异位词分组` | 把等价字符串映射到同一签名 | 排序串或 26 维计数都能做 key |\n| 集合起点 | `128 最长连续序列` | 只从连续段起点扩展 | 只有 `x - 1` 不存在时才开跑 |\n| 前缀和计数 | `560 和为 K 的子数组` | 历史前缀和频次 | 查 `sum - k`，避免写成 `k - sum` |\n| 原地哈希 | `41 缺失的第一个正数`、`73 矩阵置零` | 利用数组/首行首列作标记 | 题目要求 O(1) 空间时要找可复用位置 |\n| 对象映射 | `138 随机链表复制`、`105 构造二叉树` | 建立旧对象到新对象、值到下标的映射 | 先建映射，再连接关系 |\n| 频率 TopK | `347 前 K 个高频元素`、`169 多数元素` | 频率统计后选择 | 统计是第一步，选择可用堆、桶或投票 |\n| 设计型哈希 | `146 LRU 缓存`、`208 Trie` | O(1) 查找与结构组合 | dict 负责定位，结构负责语义 |\n\n## 3. 复习顺序建议\n\n先练“查历史”，再练“统计状态”，最后练“组合结构”：\n\n1. `1 两数之和`：掌握先查后放。\n2. `49 字母异位词分组`：掌握字符串签名。\n3. `128 最长连续序列`：练集合去重和起点判断。\n4. `560 和为 K 的子数组`：理解前缀和频次表。\n5. `3`、`76`、`438`：把哈希计数放进滑动窗口。\n6. `347`、`169`：练频率统计后的选择策略。\n7. `41`、`73`：理解 O(1) 空间下的原地标记。\n8. `138`、`105`：练对象和下标映射。\n9. `146`、`208`：练哈希表与数据结构组合设计。\n\n## 4. 关键套路详解\n\n### 4.1 先查后放用于避免自配对\n\n`1 两数之和`中如果先把当前元素放入表，再查询补数，`target = 2 * nums[i]` 时容易把自己当成答案。正确动作是先查历史，再记录当前值。这个顺序也适用于前缀和计数：先统计已有历史能产生多少答案，再把当前前缀和加入历史。\n\n### 4.2 key 的设计决定题目难度\n\n哈希表的 key 必须表达“等价关系”。字母异位词分组可以用排序后的字符串作为 key，也可以用 26 个字符频次拼成 key。构造二叉树用节点值定位中序下标；随机链表复制用旧节点地址定位新节点；LRU 用业务 key 定位链表节点。\n\n### 4.3 频率表有两种语义\n\n| 语义 | 代表题 | 写法 |\n|---|---|---|\n| 历史出现次数 | `560`、`1` 扩展 | `count[prefix] = count.get(prefix, 0) + 1` 表示把当前前缀和计入历史次数 |\n| 当前窗口欠账 | `76`、`438` | `need[ch]` 表示还缺多少或窗口差值 |\n\n这两种语义不能混。历史表通常只增不减，滑动窗口表会随着左右引用移动增减。\n\n### 4.4 `set` 常用于“只关心存在性”\n\n`128 最长连续序列`不需要每个数出现几次，只需要知道某个数是否存在。先全部放进集合，再只从 `x - 1` 不存在的起点扩展，可以保证每个数最多被访问常数次。\n\n### 4.5 设计题必须把职责拆开\n\n`146 LRU 缓存`需要 dict 和双向链表配合。dict 负责 O(1) 定位 key；双向链表负责 O(1) 维护最近使用顺序。两个结构必须同步更新。\n\n## 5. 抽象代码模板\n\n本节按照原始单题笔记的参考解法整理。哈希表专题不能只给“更通用”的写法：`49` 原始解法是排序字符串做 key，`347` 原始主解是桶排序，`138` 原始最终解是 O(1) 空间穿插复制，`146` 原始训练点是手写双向链表，`41`、`73` 则是 O(1) 空间下的原地哈希/原地标记。\n\n### 5.1 补数查询与历史表\n\n#### 适用题型\n\n- `1 两数之和`：当前元素查历史补数。\n- `560 和为 K 的子数组`：当前前缀和查历史 `sum - k`。\n- 所有“当前状态需要和历史状态配对”的题。\n\n#### 核心思路\n\n历史表只保存当前位置之前的信息，所以查询必须发生在更新当前状态之前。两数之和先查 `target - nums[i]`，再记录 `nums[i]`；前缀和统计先查历史 `sum - k` 出现次数，再把当前 `sum` 加入表。`map[0] = 1` 表示空前缀，是从下标 0 开始的合法区间边界。\n\n#### 代码 A：两数之和\n\n> **题目简述：** 1 两数之和：给定整数数组与目标值，返回和为目标值的两个不同元素下标，答案唯一。 [力扣原题 ↗](https://leetcode.cn/problems/two-sum/)\n\n```python\ndef twoSum(nums, target):\n    seen = {}  # value -> 历史下标。\n    for i, x in enumerate(nums):\n        need = target - x\n        if need in seen:\n            return [i, seen[need]]\n        seen[x] = i\n    return []\n```\n\n#### 代码 B：和为 K 的子数组\n\n> **题目简述：** 560 和为 K 的子数组：给定整数数组和整数 K，统计元素和恰好为 K 的连续子数组数量。 [力扣原题 ↗](https://leetcode.cn/problems/subarray-sum-equals-k/)\n\n```python\ndef subarraySum(nums, k):\n    count = {0: 1}  # 前缀和 -> 出现次数；空前缀出现一次。\n    ans = 0\n    prefix = 0\n    for x in nums:\n        prefix += x\n        ans += count.get(prefix - k, 0)\n        count[prefix] = count.get(prefix, 0) + 1\n    return ans\n```\n\n#### 变形点对照\n\n| 题型 | key | value | 查询顺序 |\n|---|---|---|---|\n| `1 两数之和` | 数值 | 历史下标 | 先查补数，再放当前值 |\n| `560 和为 K 的子数组` | 前缀和 | 历史出现次数 | 先查 `sum - k`，再用 `count[sum] = count.get(sum, 0) + 1` 更新当前前缀和次数 |\n| 前缀异或 | 异或值 | 历史出现次数 | 先查 `xor ^ target`，再更新当前 |\n\n#### 易错点\n\n- 两数之和不能先放当前元素，否则可能自配对。\n- `560` 查的是 `sum - k`，避免写成 `k - sum`。\n- 统计区间数量时，哈希表 value 必须是次数。\n\n### 5.2 签名分组与频率选择\n\n#### 适用题型\n\n- `49 字母异位词分组`：原始笔记使用排序后的字符串作为 key。\n- `347 前 K 个高频元素`：原始主解使用桶排序，频率最大不超过 `n`。\n- `169 多数元素`：哈希计数能做，但原始题解用 O(1) 空间摩尔投票。\n\n#### 核心思路\n\n分组题的 key 要表达“两个对象等价”。字母异位词排序后相同，因此排序串可作为最直观 key。Top K 高频先用哈希表统计 `num: freq`，再根据频率选择；本题原始主解用桶排序把相同频率的数放入同一个桶，从高频桶往低频桶收集答案。多数元素不需要完整频率表，摩尔投票通过候选抵消保留最终多数。\n\n#### 代码 A：字母异位词排序 key\n\n> **题目简述：** 49 字母异位词分组：给定字符串数组，将包含相同字符及频次的字母异位词归为一组。 [力扣原题 ↗](https://leetcode.cn/problems/group-anagrams/)\n\n```python\ndef groupAnagrams(strs):\n    groups = {}  # sorted string -> 原字符串列表。\n    for s in strs:\n        key = ''.join(sorted(s))\n        groups.setdefault(key, []).append(s)\n    return list(groups.values())\n```\n\n#### 代码 B：前 K 高频元素桶排序\n\n> **题目简述：** 347 前 K 个高频元素：给定整数数组和 K，返回出现频率最高的 K 个元素，结果顺序不限。 [力扣原题 ↗](https://leetcode.cn/problems/top-k-frequent-elements/)\n\n```python\ndef topKFrequent(nums, k):\n    count = {}\n    for num in nums:\n        count[num] = count.get(num, 0) + 1\n\n    n = len(nums)\n    buckets = [[] for _ in range(n + 1)]  # buckets[freq] 存所有出现 freq 次的数。\n    for num, freq in count.items():\n        buckets[freq].append(num)\n\n    res = []\n    for freq in range(n, 0 - 1, -1):\n        for num in buckets[freq]:\n            res.append(num)\n            if len(res) == k:\n                return res\n\n    return res\n```\n\n#### 代码 C：多数元素摩尔投票\n\n> **题目简述：** 169 多数元素：给定长度为 N 的数组，找出出现次数严格超过 N/2 且保证存在的元素。 [力扣原题 ↗](https://leetcode.cn/problems/majority-element/)\n\n```python\ndef majorityElement(nums):\n    candidate = 0\n    count = 0\n\n    for num in nums:\n        if count == 0:\n            candidate = num\n\n        if num == candidate:\n            count += 1\n        else:\n            count -= 1\n\n    return candidate\n```\n\n#### 变形点对照\n\n| 题型 | 原始主线 | 复杂度关注 | 可选替代 |\n|---|---|---|---|\n| `49` 异位词分组 | 排序串做 key | 单串排序 O(L log L) | 26 维计数签名 O(L)，注意加分隔符 |\n| `347` Top K | 桶排序 | O(n) 时间，O(n) 空间 | 小顶堆 O(n log k) 更通用 |\n| `169` 多数元素 | 摩尔投票 | O(1) 空间 | 哈希计数更直观但空间 O(n) |\n\n#### 易错点\n\n- 异位词排序 key 要用原字符串副本，不能把要返回的字符串排序掉。\n- 桶排序桶下标是频率，最大频率不会超过 `len(nums)`。\n- 摩尔投票依赖题目保证多数元素一定存在；否则最后还要二次验证。\n\n### 5.3 集合去重与连续段起点\n\n#### 适用题型\n\n- `128 最长连续序列`：只关心值是否存在，不关心次数。\n- 去重后寻找连续段、区间起点、最长链等题。\n- 缺失正数如果不要求 O(1) 空间也可用集合；但 Hot100 原题要求原地哈希，见下一节。\n\n#### 核心思路\n\n先把数组一次性放入 `set` 去重。只有 `x - 1` 不存在时，`x` 才是连续段起点；从非起点扩展会重复扫描同一段。可选剪枝 `res * 2 >= len(nums_set)` 只用于提前结束，不参与正确性证明。\n\n#### 代码模板：共同骨架\n\n> **题目简述：** 128 最长连续序列：给定无序整数数组，在线性时间内求数值连续序列的最长长度。 [力扣原题 ↗](https://leetcode.cn/problems/longest-consecutive-sequence/)\n\n```python\ndef longestConsecutive(nums):\n    num_set = set(nums)  # 一步完成去重建集合。\n    res = 0\n\n    for x in num_set:\n        if x - 1 in num_set:\n            continue  # x 没有作为连续段起点。\n\n        y = x + 1\n        while y in num_set:\n            y += 1\n\n        res = max(res, y - x)\n        # 原始笔记中的可选剪枝：if res * 2 >= len(num_set): break\n\n    return res\n```\n\n#### 变形点对照\n\n| 变形 | 起点判断 | 扩展方式 | 说明 |\n|---|---|---|---|\n| `128` 最长连续序列 | `x - 1` 不存在 | `y += 1` 直到不存在 | 每段只从起点扫描一次 |\n| 最长连续字符/编号段 | 前驱状态不存在 | 沿 next 状态扩展 | key 类型可替换 |\n| 可选剪枝 | `res` 已足够大 | 提前 break | 只影响性能，不影响正确性 |\n\n#### 易错点\n\n- 不能从每个数都向后扩展，否则会退化到 O(n^2)。\n- 遍历集合已经去重，不需要再处理重复数字。\n- 可选剪枝只影响提前结束，不要把它当作正确性条件。\n\n### 5.4 滑动窗口哈希计数\n\n#### 适用题型\n\n- `3 无重复字符的最长子串`：原始笔记使用 `set[str]` 保存当前窗口。\n- `76 最小覆盖子串`：原始笔记使用 `dict[str, int]` 欠账表和 `valid`。\n- `438 找到所有字母异位词`：原始笔记使用 `int map[26]` 欠账数组和过量收缩。\n\n#### 核心思路\n\n滑动窗口表描述“当前窗口状态”，会随着左右引用移动增减。`3` 的集合就是窗口内容；`76` 的 `map` 是目标字符欠账，`valid` 是已经还清的字符种类；`438` 的数组是小写字母欠账，当前右端字符透支时持续左缩。\n\n#### 代码 A：无重复字符窗口集合\n\n> **题目简述：** 3 无重复字符的最长子串：给定字符串，求不含重复字符的最长连续子串长度。 [力扣原题 ↗](https://leetcode.cn/problems/longest-substring-without-repeating-characters/)\n\n```python\ndef lengthOfLongestSubstring(s):\n    set = set()\n    left = 0\n    res = 0\n\n    for right in range(0, len(s)):\n        while s[right] in set:\n            set.discard(s[left])\n            left += 1\n        set.add(s[right])\n        res = max(res, right - left + 1)\n\n    return res\n```\n\n#### 代码 B：最小覆盖子串 valid 写法\n\n> **题目简述：** 76 最小覆盖子串：在字符串 S 中寻找覆盖字符串 T 全部字符及其频次的最短连续子串。 [力扣原题 ↗](https://leetcode.cn/problems/minimum-window-substring/)\n\n```python\ndef minWindow(s, t):\n    need = {}\n    for ch in t:\n        need[ch] = need.get(ch, 0) + 1\n\n    valid = 0\n    left = 0\n    start = 0\n    min_len = float('inf')\n\n    for right, ch in enumerate(s):\n        if ch in need:\n            need[ch] -= 1\n            if need[ch] == 0:\n                valid += 1\n\n        while valid == len(need):\n            if right - left + 1 \u003c min_len:\n                min_len = right - left + 1\n                start = left\n            out = s[left]\n            left += 1\n            if out in need:\n                if need[out] == 0:\n                    valid -= 1\n                need[out] += 1\n\n    return '' if min_len == float('inf') else s[start:start + min_len]\n```\n\n#### 代码 C：找到所有异位词欠账数组写法\n\n> **题目简述：** 438 找到字符串中所有字母异位词：给定字符串 S 和 P，返回 S 中所有与 P 字符及频次相同的子串起点。 [力扣原题 ↗](https://leetcode.cn/problems/find-all-anagrams-in-a-string/)\n\n```python\ndef findAnagrams(s, p):\n    res = []\n    need = [0] * 26\n    for ch in p:\n        need[ord(ch) - ord('a')] += 1\n\n    left = 0\n    for right, ch in enumerate(s):\n        idx = ord(ch) - ord('a')\n        need[idx] -= 1\n        while need[idx] \u003c 0:\n            need[ord(s[left]) - ord('a')] += 1\n            left += 1\n        if right - left + 1 == len(p):\n            res.append(left)\n    return res\n```\n\n#### 变形点对照\n\n| 题型 | 表的语义 | 合法条件 | 更新顺序 |\n|---|---|---|---|\n| `3` | 当前窗口字符集合 | 无重复 | 重复则先删左端，再插入当前 |\n| `76` | 目标字符欠账 | `valid == len(need)` | 满足时持续缩左并更新最短 |\n| `438` | 小写字母欠账 | 当前字符不透支且长度为 `len(p)` | 右扩令欠账减 1，透支时左缩令欠账加 1 |\n\n#### 易错点\n\n- 窗口表会随左引用移动撤销状态，不能当历史表使用。\n- `76` 的 `valid` 表示满足的字符种类数，不能当总字符数使用。\n- `438` 不需要每轮比较两张表；原始写法用透支状态驱动左缩。\n\n### 5.5 原地哈希与原地标记\n\n#### 适用题型\n\n- `41 缺失的第一个正数`：原始笔记要求 O(1) 额外空间，不能用额外哈希表。\n- `73 矩阵置零`：原始笔记使用第一行、第一列作为标记空间。\n- 所有“题目要求 O(1) 空间，必须复用输入结构做标记”的题。\n\n#### 核心思路\n\n`41` 把值 `x` 放到下标 `x - 1`，使数组尽量满足 `nums[i] == i + 1`；交换后当前位置可能换来新数字，所以必须 `while` 继续归位。原始代码里的边界应写成 `nums[i] \u003c= n`，数字 `n` 也应该放到下标 `n - 1`。`73` 征用第一行和第一列作为行列标记，额外用 `col0` 记录第一列是否需要置零。\n\n#### 代码 A：缺失的第一个正数\n\n> **题目简述：** 41 缺失的第一个正数：给定无序整数数组，以线性时间和常数额外空间找出最小缺失正整数。 [力扣原题 ↗](https://leetcode.cn/problems/first-missing-positive/)\n\n```python\ndef firstMissingPositive(nums):\n    n = len(nums)\n\n    for i in range(0, n):\n        # 把 x 放到 nums[x - 1]。必须用 while，因为交换来的新 nums[i] 可能还要继续归位。\n        # 注意边界是 \u003c= n；数字 n 应该放到下标 n - 1。\n        while nums[i] > 0 and nums[i] \u003c= n and nums[i] != nums[nums[i] - 1]:\n            nums[i], nums[nums[i] - 1] = nums[nums[i] - 1], nums[i]\n\n    for i in range(0, n):\n        if nums[i] != i + 1: return i + 1\n\n    return n + 1\n```\n\n#### 代码 B：矩阵置零首行首列标记\n\n> **题目简述：** 73 矩阵置零：若矩阵某元素为零，则将其整行整列置零，要求在原矩阵上完成。 [力扣原题 ↗](https://leetcode.cn/problems/set-matrix-zeroes/)\n\n```python\ndef setZeroes(matrix):\n    m, n = len(matrix), len(matrix[0])\n    first_col_zero = any(matrix[i][0] == 0 for i in range(m))\n\n    for i in range(m):\n        for j in range(1, n):\n            if matrix[i][j] == 0:\n                matrix[i][0] = 0\n                matrix[0][j] = 0\n\n    for i in range(1, m):\n        for j in range(1, n):\n            if matrix[i][0] == 0 or matrix[0][j] == 0:\n                matrix[i][j] = 0\n\n    if matrix[0][0] == 0:\n        for j in range(n):\n            matrix[0][j] = 0\n    if first_col_zero:\n        for i in range(m):\n            matrix[i][0] = 0\n```\n\n#### 变形点对照\n\n| 题型 | 复用空间 | 扫描顺序 | 关键边界 |\n|---|---|---|---|\n| `41` | 数组下标本身 | 先归位，再找第一个不匹配 | `1 \u003c= nums[i] \u003c= n` |\n| `73` | 第一行第一列 | 先写标记，再处理中间，最后处理首行首列 | 第一列需单独 `col0` |\n\n#### 易错点\n\n- `41` 交换条件必须防止重复数字死循环：`nums[i] != nums[nums[i] - 1]`。\n- `41` 条件写成 `\u003c n` 会漏掉数字 `n` 的归位。\n- `73` 必须最后处理第一行和第一列，否则标记会被提前破坏。\n\n### 5.6 对象映射、下标映射与空间优化\n\n#### 适用题型\n\n- `138 随机链表复制`：dict 版是基础思路，但原始最终代码使用 O(1) 空间穿插复制。\n- `105 从前序与中序遍历序列构造二叉树`：用dict 把节点值映射到中序下标。\n- 图克隆、树构造等“旧结构到新结构”或“值到位置”映射题。\n\n#### 核心思路\n\n随机链表复制的dict 版是 `old node: new node`，但原始笔记进一步使用“影分身”：把复制节点插在原节点后面，利用 `cur.random.next` 找到 random 的复制节点，最后拆分两条链。构造树则用中序下标表避免每次线性查根。\n\n#### 代码 A：随机链表 O(1) 穿插复制\n\n> **题目简述：** 138 随机链表的复制：深拷贝一个同时含 next 和 random 指针的链表，新结点不得指向原链表。 [力扣原题 ↗](https://leetcode.cn/problems/copy-list-with-random-pointer/)\n\n```python\nclass Node:\n    def __init__(self, val=0, next=None, random=None):\n        self.val = val\n        self.next = next\n        self.random = random\n\ndef copyRandomList(head):\n    if head is None:\n        return None\n\n    cur = head\n    while cur:\n        copy = Node(cur.val, cur.next)\n        cur.next = copy\n        cur = copy.next\n\n    cur = head\n    while cur:\n        if cur.random:\n            cur.next.random = cur.random.next\n        cur = cur.next.next\n\n    dummy = Node(-1)\n    tail = dummy\n    cur = head\n    while cur:\n        copy = cur.next\n        cur.next = copy.next\n        tail.next = copy\n        tail = copy\n        cur = cur.next\n    return dummy.next\n```\n\n#### 代码 B：前序 + 中序构造二叉树\n\n> **题目简述：** 105 从前序与中序遍历序列构造二叉树：给定同一棵无重复值二叉树的前序和中序序列，还原并返回该树。 [力扣原题 ↗](https://leetcode.cn/problems/construct-binary-tree-from-preorder-and-inorder-traversal/)\n\n```python\nclass TreeNode:\n    def __init__(self, val=0, left=None, right=None):\n        self.val = val\n        self.left = left\n        self.right = right\n\ndef buildTree(preorder, inorder):\n    index = {v: i for i, v in enumerate(inorder)}\n\n    def dfs(pre_l, pre_r, in_l, in_r):\n        if pre_l > pre_r:\n            return None\n        root_val = preorder[pre_l]\n        root_idx = index[root_val]\n        left_size = root_idx - in_l\n        root = TreeNode(root_val)\n        root.left = dfs(pre_l + 1, pre_l + left_size, in_l, root_idx - 1)\n        root.right = dfs(pre_l + left_size + 1, pre_r, root_idx + 1, in_r)\n        return root\n\n    return dfs(0, len(preorder) - 1, 0, len(inorder) - 1)\n```\n\n#### 变形点对照\n\n| 题型 | 映射/空间策略 | 关键点 | 备注 |\n|---|---|---|---|\n| `138` dict 基础版 | `old: new` | 先建节点，再连关系 | 空间 O(n) |\n| `138` 原始优化版 | 复制节点穿插在原链表 | `cur.random.next` 是 random 的复制节点 | 空间 O(1) |\n| `105` 构造树 | `value: inorder index` | 用左子树大小切前序区间 | 避免反复切片 |\n\n#### 易错点\n\n- 随机链表复制后必须恢复原链表，并拆出新链表。\n- `random` 为空时不能访问 `cur.random.next`。\n- 构造树时前序和中序边界必须同时收缩，左子树大小是 `rootindex - inleft`。\n\n### 5.7 哈希表 + 手写双向链表设计\n\n#### 适用题型\n\n- `146 LRU 缓存`：原始笔记使用 `dict[int, Node]` 加手写双向链表。\n- 需要 O(1) 查找、移动、删除任意节点并维护访问顺序的缓存题。\n- `OrderedDict` 是工程简化写法，但不能替代手写链表训练点。\n\n#### 核心思路\n\ndict 负责通过 key O(1) 定位链表节点，双向链表负责维护从新到旧的访问顺序。虚拟 `head/tail` 避免删除头尾时分类讨论。`get` 命中和 `put` 更新都要把节点移动到头部；容量超限时淘汰 `tail.prev`，并同步从字典中删除对应 key。\n\n#### 代码模板：共同骨架\n\n> **题目简述：** 146 LRU 缓存：设计定容量缓存，使查询和写入均为平均 O(1)，满时淘汰最久未使用项。 [力扣原题 ↗](https://leetcode.cn/problems/lru-cache/)\n\n```python\nclass LRUCache:\n    class Node:\n        def __init__(self, key, value):\n            self.key = key\n            self.value = value\n            self.prev = None\n            self.next = None\n\n    def __init__(self, capacity):\n        self.cap = capacity\n        self.map = {}  # key -> 链表节点。\n        self.head = self.Node(-1, -1)  # 虚拟头节点，后面是最近使用节点。\n        self.tail = self.Node(-1, -1)  # 虚拟尾节点，前面是最久未使用节点。\n        self.head.next = self.tail\n        self.tail.prev = self.head\n\n    def remove(self, node):\n        # 从双向链表中断开 node，调用前保证 node 不是虚拟头尾。\n        node.prev.next = node.next\n        node.next.prev = node.prev\n\n    def add(self, node):\n        # 插到 head 后面，表示最近使用。\n        node.prev = self.head\n        node.next = self.head.next\n        self.head.next.prev = node\n        self.head.next = node\n\n    def get(self, key):\n        if key not in self.map:\n            return -1\n\n        node = self.map[key]\n        self.remove(node)\n        self.add(node)  # 命中后刷新为最近使用。\n        return node.value\n\n    def put(self, key, value):\n        if key in self.map:\n            node = self.map[key]\n            node.value = value\n            self.remove(node)\n            self.add(node)\n            return\n\n        node = self.Node(key, value)\n        self.map[key] = node\n        self.add(node)\n\n        if len(self.map) > self.cap:\n            del_node = self.tail.prev\n            self.map.pop(del_node.key)\n            self.remove(del_node)\n```\n\n#### 变形点对照\n\n| 写法 | 查找结构 | 顺序结构 | 适合场景 |\n|---|---|---|---|\n| Python 手写链表 | `dict[int, Node]` | 虚拟头尾双向链表 | 训练节点引用和 O(1) 删除 |\n| `OrderedDict` 简化版 | `dict[int, Node]` | `OrderedDict` | Python 标准库更简洁，`move_to_end` 调整顺序 |\n\n#### 易错点\n\n- 更新已有 key 时不能新增节点，否则链表中会出现重复 key。\n- 淘汰尾节点时要先 `del self.map[delnode.key]`，再断链；Python 无需手动释放节点。\n- `get` 命中也算访问，必须移动到头部。\n\n### 5.8 Trie：字符到子节点的映射\n\n#### 适用题型\n\n- `208 实现 Trie`：固定小写字母字符集，原始笔记使用 `children[26]`。\n- 前缀查询、单词插入、完整单词查询。\n- 如果字符集不固定，可把 `children[26]` 换成 `dict[str, TrieNode]`。\n\n#### 核心思路\n\nTrie 的每一层代表一个字符位置，`children[index]` 指向对应字符的下一层节点。`insert` 没有节点就创建；`search` 和 `startsWith` 都先沿路径走，区别在于 `search` 必须检查最后节点 `isEnd`，而 `startsWith` 路径存在即可。\n\n#### 代码模板：共同骨架\n\n> **题目简述：** 208 实现 Trie：设计前缀树，支持插入单词、查询完整单词和判断是否存在指定前缀。 [力扣原题 ↗](https://leetcode.cn/problems/implement-trie-prefix-tree/)\n\n```python\nclass TrieNode:\n    def __init__(self):\n        self.children = [None] * 26  # 固定小写字母字符集。\n        self.isEnd = False\n\nclass Trie:\n    def __init__(self):\n        self.root = TrieNode()\n\n    def insert(self, word):\n        node = self.root\n        for ch in word:\n            index = ord(ch) - ord('a')\n            if node.children[index] is None:\n                node.children[index] = TrieNode()\n            node = node.children[index]\n        node.isEnd = True  # 结束节点要标记为完整单词。\n\n    def search(self, word):\n        node = self.root\n        for ch in word:\n            index = ord(ch) - ord('a')\n            if node.children[index] is None:\n                return False\n            node = node.children[index]\n        return node.isEnd  # search 必须检查是否为完整单词。\n\n    def startsWith(self, prefix):\n        node = self.root\n        for ch in prefix:\n            index = ord(ch) - ord('a')\n            if node.children[index] is None:\n                return False\n            node = node.children[index]\n        return True\n```\n\n#### 变形点对照\n\n| 操作 | 返回条件 | 易混点 |\n|---|---|---|\n| `insert` | 无返回 | 结束节点要标记 `isEnd = true` |\n| `search` | 路径存在且 `isEnd` | 不能把前缀当完整单词 |\n| `startsWith` | 路径存在即可 | 不需要检查 `isEnd` |\n\n#### 易错点\n\n- `children[26]{}` 要初始化为None。\n- `search` 必须检查 `isEnd`，否则会把前缀误判成完整单词。\n- 字符集超出小写字母时，不要直接用 `c - 'a'`。\n\n## 6. 高频易错点清单\n\n| 易错点 | 典型题目 | 规避方式 |\n|---|---|---|\n| 两数之和先放再查导致自配对 | `1` | 先查补数，再记录当前值 |\n| 前缀和忘记初始化 `map[0] = 1` | `560` | 空前缀用于统计从下标 0 开始的区间 |\n| 字母异位词原字符串被排序破坏 | `49` | 排序副本 `key`，不要改坏待返回字符串 |\n| TopK 只会堆而忘记桶排序 | `347` | 频率最大不超过 n，可用 `buckets[freq]` 线性收集 |\n| 多数元素使用哈希表占 O(n) 空间 | `169` | 原始优化是摩尔投票 O(1) 空间 |\n| 最长连续序列从每个数都扩展 | `128` | 只从 `x - 1` 不存在的起点扩展 |\n| 滑动窗口表和历史表混用 | `3`、`76`、`438`、`560` | 历史表只增，窗口表随左右引用增减 |\n| 原地哈希边界漏掉 n | `41` | 归位条件写 `1 \u003c= nums[i] \u003c= n` |\n| 矩阵置零提前清首行首列 | `73` | 先写标记、处理中间，最后处理首行和首列 |\n| 随机链表复制后没有拆链 | `138` | 穿插复制最后要恢复原链表并接出新链表 |\n| LRU 链表更新了但 map 没同步 | `146` | 新增、删除、移动节点都要维护哈希表 |\n| Trie 把前缀当完整单词 | `208` | `search` 必须检查 `isEnd` |\n\n## 7. 最短复盘口诀\n\n哈希表题先定 key 和 value。配对题先查后放，前缀和题查 `sum - k`，分组题设计无冲突签名，连续段题只从起点扩展，复制题先建映射再连关系，设计题让dict 负责定位、链表或 Trie 负责结构语义。\n\n================================================================================\n\n# 第2部分: 双引用\n\n================================================================================\n\n> 目标：本文把 Hot100 中“两个位置协同移动”的题抽象成若干模板。复习时先判断引用为什么能移动，再判断移动哪一边不会错过答案。\n\n## 1. 双引用题的底层模型\n\n双引用的本质是用两个位置维护一个关系：边界、距离、顺序、窗口、链表相对位置或快慢速度。每道题先问五个问题：\n\n| 问题          | 如果答案是“是”     | 常用处理                   |\n| ----------- | ------------ | ---------------------- |\n| 数组有序或可排序吗   | 三数之和、左右夹逼    | 排序后 `left/right` 向中间收缩 |\n| 需要维护一段区间吗   | 滑动窗口、最小覆盖    | `left/right` 表示窗口边界    |\n| 需要原地压缩或交换吗  | 移动零、颜色分类     | 慢引用表示下一个写入位置           |\n| 链表需要定位相对位置吗 | 删除倒数、判环、回文   | 快慢引用、间距引用              |\n| 引用移动有单调依据吗  | 盛水、接雨水、寻找重复数 | 移动短板或按函数图走             |\n\n双引用是一组“状态压缩”策略：\n\n| 动作 | 对应 Hot100 题目 | 复习关键词 |\n|---|---|---|\n| 左右夹逼 | `11`、`15`、`42`、`5` | 单调性、短板、去重 |\n| 快慢引用 | `141`、`142`、`234`、`287` | 速度差、入环点、中点 |\n| 同向覆盖 | `283`、`75`、`189` | 写引用、交换、分区 |\n| 间距同步 | `19`、`160` | 固定距离、换头对齐 |\n| 设计辅助 | `295` | 两边平衡、堆模拟左右边界 |\n\n## 2. Hot100 双引用题型地图\n\n\n| 题型 | 题目 | 抽象能力 | 一句话记忆 |\n|---|---|---|---|\n| 有序夹逼 | `15 三数之和` | 排序后固定一个数，双引用找另外两个 | 和小左移，和大右移，命中后跳重复 |\n| 面积短板 | `11 盛最多水的容器` | 移动较短边保留变大可能 | 面积受短板限制，只能丢掉短板 |\n| 雨水边界 | `42 接雨水` | 左右最大值决定当前位置水量 | 哪边最大值小，哪边先结算 |\n| 回文中心 | `5 最长回文子串` | 从中心向两侧扩展 | 奇偶中心都要试 |\n| 原地覆盖 | `283 移动零`、`75 颜色分类` | 慢引用维护已处理区间 | 写引用前面都是最终状态 |\n| 链表快慢 | `141 环形链表`、`142 环形链表 II`、`234 回文链表` | 判环、找入口、找中点 | 快慢第一次相遇判环，第二次同步找入口 |\n| 间距引用 | `19 删除倒数第 N 个`、`160 相交链表` | 消除长度差 | 一个先走 N 步，或两链换头走齐 |\n| 数组置换/反转 | `31 下一个排列`、`189 轮转数组` | 从后找拐点、三次反转 | 局部有序性决定交换和反转范围 |\n| 函数图判环 | `287 寻找重复数` | 数组值当 next 引用 | 重复数就是环入口 |\n\n## 3. 复习顺序建议\n\n建议按“左右夹逼 → 同向覆盖 → 链表快慢 → 组合变形”的顺序复习：\n\n1. `11 盛最多水的容器`：理解为什么移动短板。\n2. `15 三数之和`：练排序、夹逼和去重。\n3. `42 接雨水`：练左右边界的结算时机。\n4. `283 移动零`：掌握写引用压缩。\n5. `75 颜色分类`：练三引用分区。\n6. `141`、`142`：掌握 Floyd 判环和入口。\n7. `19`、`160`：练间距和对齐。\n8. `234`、`5`：把双引用用于回文结构。\n9. `31`、`189`、`287`：补齐置换、反转和函数图变形。\n\n## 4. 关键套路详解\n\n### 4.1 左右夹逼必须有单调性\n\n双引用从两端向中间移动必须有“移动某一边不会丢答案”的理由。`15` 依赖排序后和的单调变化，`11` 依赖面积受短板限制，`42` 依赖较小侧边界已经能确定水量。\n\n### 4.2 去重应作为循环不变量\n\n`15 三数之和`要在三个位置都去重：固定数 `i` 跳过重复，命中答案后 `left/right` 也要跳过重复。否则答案重复，或者循环停滞。\n\n### 4.3 快慢引用有两类语义\n\n| 语义 | 代表题 | 引用含义 |\n|---|---|---|\n| 速度差 | `141`、`142`、`287` | 快引用每轮多走一步，最终在环中相遇 |\n| 位置定位 | `234`、排序链表切分 | 快引用走两步，慢引用停在中点附近 |\n\n判环题不要和找中点题混用循环条件。判环通常 `while fast and fast.next`；找偏左中点常用 `while fast.next and fast.next.next`。\n\n### 4.4 原地覆盖题要定义慢引用区域\n\n`283 移动零`中 `slow` 前面表示已经放好的非零元素；`75 颜色分类`中 `[0, low)` 是 0，`[low, i)` 是 1，`(high, n)` 是 2。只要区域语义清楚，代码就不会乱。\n\n### 4.5 链表间距题找的是相对位置\n\n`19` 让 `right` 先走 N 步，使 `left` 停在待删节点前驱。`160` 让两个引用分别走完 A+B 和 B+A，自然对齐。\n\n## 5. 抽象代码模板\n\n本节按照原始单题笔记的参考解法整理。双引用专题里有些题的原始解法并不只是一种“左右引用”：`5` 原始笔记是区间 DP，中心扩展是双引用空间优化；`75` 原始笔记保留了荷兰国旗和原地染色两种写法；`189` 原始笔记是三次反转，但辅助函数应改成 `void` 才符合原地 O(1) 空间语义。\n\n### 5.1 排序数组左右夹逼：三数之和与有序两数\n\n#### 适用题型\n\n- `15 三数之和`：排序后固定一个数，左右引用找另外两个数。\n- 有序数组两数之和、最接近三数之和、四数之和等夹逼变形。\n- 前提是排序后具备“和小左移、和大右移”的单调移动依据。\n\n#### 核心思路\n\n排序提供单调性。固定 `i` 后，`left/right` 当前和小于目标，只能右移 `left` 让和变大；当前和大于目标，只能左移 `right` 让和变小。`15` 的去重有两层：固定点 `i` 去重，命中答案后左右引用去重。\n\n#### 代码 A：三数之和原始夹逼写法\n\n> **题目简述：** 15 三数之和：给定整数数组，找出所有和为零且不重复的三元组。 [力扣原题 ↗](https://leetcode.cn/problems/3sum/)\n\n```python\ndef threeSum(nums):\n    nums.sort()\n    ans = []\n    n = len(nums)\n    for i in range(n - 2):\n        if i > 0 and nums[i] == nums[i - 1]:\n            continue\n        left, right = i + 1, n - 1\n        while left \u003c right:\n            total = nums[i] + nums[left] + nums[right]\n            if total == 0:\n                ans.append([nums[i], nums[left], nums[right]])\n                left += 1\n                right -= 1\n                while left \u003c right and nums[left] == nums[left - 1]:\n                    left += 1\n                while left \u003c right and nums[right] == nums[right + 1]:\n                    right -= 1\n            elif total \u003c 0:\n                left += 1\n            else:\n                right -= 1\n    return ans\n```\n\n#### 代码 B：有序两数之和扩展骨架\n\n> **题目简述：** 167 两数之和 II：给定升序整数数组和目标值，返回和为目标值的两个元素下标。 [力扣原题 ↗](https://leetcode.cn/problems/two-sum-ii-input-array-is-sorted/)\n\n```python\ndef twoSumSorted(nums, target):\n    left = 0\n    right = len(nums) - 1\n\n    while left \u003c right:\n        sum = nums[left] + nums[right]\n        if sum == target: return [left, right]\n        if sum \u003c target:\n            left += 1  # 和偏小，只能增大左端。\n        else:\n            right -= 1  # 和偏大，只能减小右端。\n\n    return [-1, -1]\n```\n\n#### 变形点对照\n\n| 变形 | 固定部分 | 引用移动 | 去重位置 |\n|---|---|---|---|\n| `15 三数之和` | 外层固定 `i` | `sum \u003c 0` 左移，`sum > 0` 右移 | 固定点和命中后三个位置都去重 |\n| 有序两数之和 | 无外层固定点 | 根据 `sum` 和 `target` 比较移动 | 通常不需要去重 |\n| K 数之和 | 递归固定前若干个数 | 最后一层两引用夹逼 | 每层固定点都要去重 |\n\n#### 易错点\n\n- 排序后返回的是数值组合；如果题目要原下标，不能直接排序原数组。\n- 三数之和命中后必须推进左右引用，否则会死循环。\n- 去重顺序要自洽：先跳重复再移动，或先移动再跳重复，不要混写。\n\n### 5.2 移动短板与边界结算\n\n#### 适用题型\n\n- `11 盛最多水的容器`：面积由短板和宽度共同决定。\n- `42 接雨水`：当前位置水量由左右最大值较小者决定。\n- 二者都用左右引用，但移动依据不同，不能用一个条件硬套。\n\n#### 核心思路\n\n容器题中宽度每轮都会变小，只有移动短板才可能提高高度上限；移动长板不会让当前短板变高。接雨水中先更新 `lm/rm`，当 `lm \u003c rm` 时左侧水位确定，否则右侧水位确定；相等时结算哪边都正确，原始笔记选择结算右侧。\n\n#### 代码 A：盛最多水的容器\n\n> **题目简述：** 11 盛最多水的容器：给定各位置的高度，选择两条竖线，使其与横轴围成的容器容量最大。 [力扣原题 ↗](https://leetcode.cn/problems/container-with-most-water/)\n\n```python\ndef maxArea(height):\n    left = 0\n    right = len(height) - 1\n    square = 0\n\n    while left \u003c right:\n        square = max(square, (right - left) * min(height[right], height[left]))\n\n        # 原始题解：相等时移动右侧；相等时移动任意一边都不影响正确性。\n        if height[left] \u003c height[right]:\n            left += 1\n        else:\n            right -= 1\n\n    return square\n```\n\n#### 代码 B：接雨水双引用\n\n> **题目简述：** 42 接雨水：给定各柱子的高度，计算下雨后这些柱子之间能够接住的雨水总量。 [力扣原题 ↗](https://leetcode.cn/problems/trapping-rain-water/)\n\n```python\ndef trap(height):\n    l = 0\n    r = len(height) - 1\n    lm = 0\n    rm = 0\n    res = 0\n\n    while l \u003c r:\n        lm = max(lm, height[l])\n        rm = max(rm, height[r])\n\n        # 原始题解使用 lm \u003c rm：相等时结算右侧；使用 \u003c= 时结算左侧也正确。\n        if lm \u003c rm:\n            res += lm - height[l]\n            l += 1\n        else:\n            res += rm - height[r]\n            r -= 1\n\n    return res\n```\n\n#### 变形点对照\n\n| 题型 | 移动依据 | 相等时 | 答案更新 |\n|---|---|---|---|\n| `11` 容器 | 丢弃较短边 | 任意移动一边，原始写法移动右边 | 移动前更新当前面积 |\n| `42` 接雨水 | 结算较小最大边界侧 | 任意结算一边，原始写法结算右边 | 先更新最大边界，再结算 |\n\n#### 易错点\n\n- 容器题移动高板没有意义，宽度变小且短板不变。\n- 接雨水比较的是 `lm/rm`，避免直接比较当前 `height[l]/height[r]`。\n- 接雨水必须先更新边界最大值，再计算当前位置能接多少水。\n\n### 5.3 同向覆盖与三路分区\n\n#### 适用题型\n\n- `283 移动零`：原始笔记使用稳定覆盖，最后尾部补零。\n- `75 颜色分类`：原始笔记保留荷兰国旗法和原地染色法。\n- 删除重复、按条件稳定保留元素等同向写引用题。\n\n#### 核心思路\n\n同向覆盖中，慢引用表示下一个写入位置；快引用扫描原数组。三路分区中，`[0, p0)` 是 0，`[p0, i)` 是 1，`(p2, n - 1]` 是 2。原地染色写法则把已扫描区域默认刷成 2，再按原值回填 1 和 0。\n\n#### 代码 A：移动零稳定覆盖\n\n> **题目简述：** 283 移动零：将数组中的零原地移到末尾，同时保持所有非零元素的相对顺序。 [力扣原题 ↗](https://leetcode.cn/problems/move-zeroes/)\n\n```python\ndef moveZeroes(nums):\n    slow = 0\n\n    for fast in range(0, len(nums)):\n        if nums[fast] != 0:\n            nums[slow] = nums[fast]\n            slow += 1\n\n    for i in range(slow, len(nums)):\n        nums[i] = 0\n```\n\n#### 代码 B：颜色分类荷兰国旗法\n\n> **题目简述：** 75 颜色分类：原地整理仅含 0、1、2 的数组，使相同颜色相邻并按数值升序排列。 [力扣原题 ↗](https://leetcode.cn/problems/sort-colors/)\n\n```python\ndef sortColors(nums):\n    left = i = 0\n    right = len(nums) - 1\n    while i \u003c= right:\n        if nums[i] == 0:\n            nums[left], nums[i] = nums[i], nums[left]\n            left += 1\n            i += 1\n        elif nums[i] == 2:\n            nums[right], nums[i] = nums[i], nums[right]\n            right -= 1\n        else:\n            i += 1\n```\n\n#### 代码 C：颜色分类原地染色法\n\n> **题目简述：** 75 颜色分类：原地整理仅含 0、1、2 的数组，使相同颜色相邻并按数值升序排列。 [力扣原题 ↗](https://leetcode.cn/problems/sort-colors/)\n\n```python\ndef sortColorsByPainting(nums):\n    p0 = 0\n    p1 = 0\n\n    for i in range(len(nums)):\n        x = nums[i]\n\n        # 已扫描位置先默认刷成 2；如果原值更小，再向前覆盖 1 或 0。\n        nums[i] = 2\n        if x \u003c= 1:\n            nums[p1] = 1\n            p1 += 1\n        if x == 0:\n            nums[p0] = 0\n            p0 += 1\n```\n\n#### 变形点对照\n\n| 题型 | 慢引用语义 | 是否稳定 | 关键细节 |\n|---|---|---|---|\n| `283 移动零` | `slow` 是下一个非零写入位 | 稳定 | 非零压缩后尾部补 0 |\n| `75` 荷兰国旗 | `p0/i/p2` 划分四段区域 | 不要求稳定 | 遇到 2 交换后不能 `i += 1` |\n| `75` 原地染色 | `p0/p1` 是 0 和 1 的下一个写入位 | 不要求稳定 | 先刷 2，再补 1，再补 0 |\n\n#### 易错点\n\n- 移动零覆盖完非零元素后，尾部必须补零。\n- 荷兰国旗遇到 2 时不能 `i += 1`。\n- 原地染色必须先保存 `x = nums[i]`，否则刷成 2 后会丢失原值。\n\n### 5.4 链表快慢引用与函数图判环\n\n#### 适用题型\n\n- `141 环形链表`：快慢引用相遇即有环。\n- `142 环形链表 II`：相遇后同步找入口。\n- `287 寻找重复数`：数组值当作 `next` 引用，重复数是环入口。\n\n#### 核心思路\n\nFloyd 判环依赖速度差。快引用每次走两步，慢引用每次走一步；有环必相遇。找入口时，一个引用从头出发，一个从相遇点出发，同速前进，下一次相遇就是入口。数组函数图写法中，`nums[i]` 表示下一个下标。\n\n#### 代码 A：判断链表是否有环\n\n> **题目简述：** 141 环形链表：给定单链表头结点，判断沿 next 指针前进是否会重复到达某个结点。 [力扣原题 ↗](https://leetcode.cn/problems/linked-list-cycle/)\n\n```python\ndef hasCycle(head):\n    slow = fast = head\n    while fast and fast.next:\n        slow = slow.next\n        fast = fast.next.next\n        if slow is fast:\n            return True\n    return False\n```\n\n#### 代码 B：寻找环入口\n\n> **题目简述：** 142 环形链表 II：若单链表存在环则返回入环的第一个结点，否则返回空结点。 [力扣原题 ↗](https://leetcode.cn/problems/linked-list-cycle-ii/)\n\n```python\ndef detectCycle(head):\n    fast = head\n    slow = head\n\n    while fast != None and fast.next != None:\n        fast = fast.next.next\n        slow = slow.next\n\n        if fast == slow:\n            # 原始题解直接移动 head；模板保留这个写法，表示从链表头重新出发。\n            while slow != head:\n                slow = slow.next\n                head = head.next\n            return head\n\n    return None\n```\n\n#### 代码 C：寻找重复数的函数图写法\n\n> **题目简述：** 287 寻找重复数：长度 N+1 的数组仅含 1 至 N，找出重复数且不能修改数组、额外空间为常数。 [力扣原题 ↗](https://leetcode.cn/problems/find-the-duplicate-number/)\n\n```python\ndef findDuplicate(nums):\n    slow = 0\n    fast = 0\n\n    # 原始写法是 do-while 语义：先走一步，再判断是否相遇。\n    while True:\n        slow = nums[slow]\n        fast = nums[nums[fast]]\n        if fast == slow: break\n\n    head = 0\n    while slow != head:\n        slow = nums[slow]\n        head = nums[head]\n\n    return slow\n```\n\n#### 变形点对照\n\n| 题型 | 相遇后操作 | 返回值 | 注意点 |\n|---|---|---|---|\n| `141` | 相遇立即返回 | `bool` | 不需要入口阶段 |\n| `142` | 头引用和相遇点同步走 | 入口节点 | `return None` 表示无环 |\n| `287` | 下标 0 和相遇点同步走 | 重复数字 | 不修改数组，O(1) 空间 |\n\n#### 易错点\n\n- 链表判环循环条件必须是 `fast and fast.next`。\n- `141` 和 `142` 前半段相同，但 `141` 相遇后无需再找入口。\n- 函数图比较的是“当前下标状态”，检测到相遇后返回入口下标对应的重复数。\n\n### 5.5 固定间距与双链对齐\n\n#### 适用题型\n\n- `19 删除链表的倒数第 N 个结点`。\n- `160 相交链表`。\n- 需要消除长度差或定位倒数位置的链表题。\n\n#### 核心思路\n\n删除倒数节点时，用 dummy 统一删除头结点。`right` 先走 `n` 步，之后 `left/right` 同步前进；当 `right` 到尾时，`left` 正好停在待删节点前驱。相交链表让两个引用分别走 A+B 和 B+A，总路程相同，相交则在交点相遇，不相交则同时到空。\n\n#### 代码 A：删除倒数第 N 个节点\n\n> **题目简述：** 19 删除链表的倒数第 N 个结点：给定单链表和正整数 N，删除倒数第 N 个结点并返回链表头。 [力扣原题 ↗](https://leetcode.cn/problems/remove-nth-node-from-end-of-list/)\n\n```python\ndef removeNthFromEnd(head, n):\n    dummy = ListNode(0, head)\n    fast = slow = dummy\n    for _ in range(n):\n        fast = fast.next\n    while fast.next:\n        fast = fast.next\n        slow = slow.next\n    slow.next = slow.next.next\n    return dummy.next\n```\n\n#### 代码 B：相交链表换头对齐\n\n> **题目简述：** 160 相交链表：给定两个无环单链表，返回它们按结点引用相交的起点，不相交则返回空。 [力扣原题 ↗](https://leetcode.cn/problems/intersection-of-two-linked-lists/)\n\n```python\ndef getIntersectionNode(headA, headB):\n    p, q = headA, headB\n    while p is not q:\n        p = p.next if p else headB\n        q = q.next if q else headA\n    return p\n```\n\n#### 变形点对照\n\n| 题型 | 对齐方式 | 返回/修改 | 关键边界 |\n|---|---|---|---|\n| `19` 删除倒数 | 先制造 `n` 步间距 | 修改链表 | dummy 统一删除头结点 |\n| `160` 相交链表 | 换头走完 A+B/B+A | 返回节点地址 | 比较引用地址，不比较值 |\n\n#### 易错点\n\n- 删除倒数节点必须用 dummy，否则删除头结点需要额外分支。\n- `right` 先走的是 `n` 步，后续让 `left` 停在前驱。\n- 相交链表的“相交”指节点地址相同，节点值相同无效。\n\n### 5.6 回文结构：原始 DP 与双引用优化\n\n#### 适用题型\n\n- `5 最长回文子串`：原始单题笔记使用区间 DP；中心扩展是双引用专题下的 O(1) 空间替代写法。\n- `234 回文链表`：原始笔记用快慢引用找偏左中点，再反转后半段比较。\n- 回文字符串和回文链表都在“向两侧/两端比较”，但实现状态完全不同。\n\n#### 核心思路\n\n`5` 的原始 DP 定义 `dp[i][j]` 表示 `s[i..j]` 是否回文，转移依赖更短区间 `dp[i + 1][j - 1]`，所以 `i` 要从右往左枚举。中心扩展则从每个奇偶中心向两边扩，空间 O(1)。`234` 找偏左中点后，只反转 `slow.next` 开始的后半段，比较时以后半段长度为准。\n\n#### 代码 A：最长回文子串原始 DP 写法\n\n> **题目简述：** 5 最长回文子串：给定字符串，返回其中长度最长的连续回文子串。 [力扣原题 ↗](https://leetcode.cn/problems/longest-palindromic-substring/)\n\n```python\ndef longestPalindromeByDp(s):\n    n = len(s)\n    if n \u003c 2:\n        return s\n\n    dp = [[False] * n for _ in range(n)]  # dp[i][j] 表示 s[i..j] 是否回文。\n    max_len = 1\n    begin = 0\n\n    # i 从右往左枚举，保证 dp[i + 1][j - 1] 已经计算过。\n    for i in range(n - 1, -1, -1):\n        for j in range(i, n):\n            if s[i] == s[j]:\n                if j - i \u003c= 2 or dp[i + 1][j - 1]:\n                    dp[i][j] = True\n\n            if dp[i][j] and j - i + 1 > max_len:\n                max_len = j - i + 1\n                begin = i\n\n    return s[begin:begin + max_len]\n```\n\n#### 代码 B：最长回文子串中心扩展优化\n\n> **题目简述：** 5 最长回文子串：给定字符串，返回其中长度最长的连续回文子串。 [力扣原题 ↗](https://leetcode.cn/problems/longest-palindromic-substring/)\n\n```python\ndef longestPalindromeByCenter(s):\n    bestStart = 0\n    bestLen = 0\n\n    def expand(left, right):\n        while left >= 0 and right \u003c len(s) and s[left] == s[right]:\n            left -= 1\n            right += 1\n        start = left + 1\n        len = right - left - 1\n        if len > bestLen:\n            bestStart = start\n            bestLen = len\n\n    for i in range(0, len(s)):\n        expand(i, i)  # 奇数长度中心。\n        expand(i, i + 1)  # 偶数长度中心。\n\n    return s[bestStart:bestStart + bestLen]\n```\n\n#### 代码 C：回文链表原始偏左中点写法\n\n> **题目简述：** 234 回文链表：给定单链表头结点，判断从头到尾的结点值序列是否为回文。 [力扣原题 ↗](https://leetcode.cn/problems/palindrome-linked-list/)\n\n```python\nclass ListNode:\n    def __init__(self, val=0, next=None):\n        self.val = val\n        self.next = next\n\n\ndef reverseListForPalindrome(head):\n    pre = None\n    cur = head\n    while cur:\n        nxt = cur.next  # 改指针前先保存后继，避免断链。\n        cur.next = pre\n        pre = cur\n        cur = nxt\n    return pre\n\n\ndef isPalindrome(head):\n    if head is None or head.next is None:\n        return True\n\n    fast = head\n    slow = head\n    # 原始题解找偏左中点，后续从 slow.next 开始反转后半段。\n    while fast.next and fast.next.next:\n        fast = fast.next.next\n        slow = slow.next\n\n    start2 = reverseListForPalindrome(slow.next)\n    start1 = head\n\n    # 只以后半段长度为准比较，奇数长度中点不参与比较。\n    while start2:\n        if start1.val != start2.val:\n            return False\n        start1 = start1.next\n        start2 = start2.next\n\n    return True\n```\n\n#### 变形点对照\n\n| 题型 | 原始/优化 | 状态 | 关键边界 |\n|---|---|---|---|\n| `5` DP | 原始题解 | `dp[i][j]` 是否回文 | `i` 从右往左，`j - i \u003c= 2` 直接成立 |\n| `5` 中心扩展 | 双引用优化 | 从中心向两侧扩 | 奇偶中心都要枚举 |\n| `234` 回文链表 | 原始题解 | 偏左中点 + 反转后半段 | 反转从 `slow.next` 开始 |\n\n#### 易错点\n\n- `5` 原始题解使用区间 DP；中心扩展是双引用专题下的空间优化替代。\n- 中心扩展结束后合法起点是 `left + 1`，长度是 `right - left - 1`。\n- 回文链表的中点循环条件和反转起点必须配套，偏左中点对应 `slow.next`。\n\n### 5.7 数组原地反转与置换\n\n#### 适用题型\n\n- `31 下一个排列`：从后找下降拐点，交换后反转后缀。\n- `189 轮转数组`：原始笔记使用三次反转实现 O(1) 空间轮转。\n- 所有需要原地调整排列或区间反转的数组题。\n\n#### 核心思路\n\n下一个排列从后往前找第一个 `nums[i] \u003c nums[i + 1]` 的位置，说明后缀 `[i + 1, n)` 已经是降序；再从后找第一个大于 `nums[i]` 的数交换，最后反转后缀得到最小的更大排列。轮转数组先整体反转，再反转前 `k` 个和后 `n-k` 个。原始 `reversee` helper 返回 `list[int]` 没必要，应改成 `void` 原地反转。\n\n#### 代码 A：下一个排列\n\n> **题目简述：** 31 下一个排列：原地生成当前整数排列的字典序下一个排列；若不存在则变为最小排列。 [力扣原题 ↗](https://leetcode.cn/problems/next-permutation/)\n\n```python\ndef nextPermutation(nums):\n    n = len(nums)\n    i = n - 2\n\n    while i >= 0 and nums[i] >= nums[i + 1]:\n        i -= 1\n\n    if i >= 0:\n        j = n - 1\n        while j >= 0 and nums[j] \u003c= nums[i]:\n            j -= 1\n        nums[i], nums[j] = nums[j], nums[i]\n\n    # 如果 i == -1，说明整个数组降序，反转全数组得到最小排列。\n    nums[i + 1:] = reversed(nums[i + 1:])\n```\n\n#### 代码 B：轮转数组三次反转\n\n> **题目简述：** 189 轮转数组：给定整数数组和非负整数 K，将数组原地向右轮转 K 个位置。 [力扣原题 ↗](https://leetcode.cn/problems/rotate-array/)\n\n```python\ndef reverseRange(nums, left, right):\n    while left \u003c right:\n        nums[left], nums[right] = nums[right], nums[left]\n        left += 1\n        right -= 1\n\ndef rotate(nums, k):\n    n = len(nums)\n    if n == 0: return\n    k = k % n\n\n    # 原始思路：整体反转，再分别反转前 k 个和后 n-k 个。\n    reverseRange(nums, 0, n - 1)\n    reverseRange(nums, 0, k - 1)\n    reverseRange(nums, k, n - 1)\n```\n\n#### 变形点对照\n\n| 题型 | 引用动作 | 原地性 | 关键细节 |\n|---|---|---|---|\n| `31 下一个排列` | 从后找拐点和交换点 | O(1) 额外空间 | 后缀必须反转成升序 |\n| `189 轮转数组` | 三段反转 | O(1) 额外空间 | `k %= n`，辅助函数不返回数组 |\n\n#### 易错点\n\n- `31` 找不到拐点时要反转整个数组。\n- `31` 交换后只反转 `i + 1` 到末尾，不能反转前缀。\n- `189` 要先处理 `k %= n`；辅助反转函数应原地修改，不应返回 `list[int]`。\n\n## 6. 高频易错点清单\n\n| 易错点 | 典型题目 | 规避方式 |\n|---|---|---|\n| 双引用没有单调移动理由 | `11`、`15`、`42` | 先说明移动哪边不会错过答案 |\n| 三数之和去重不完整 | `15` | 固定数和命中后的左右引用都要去重 |\n| 盛水容器移动高板 | `11` | 面积受短板限制，只移动短板 |\n| 接雨水先结算较大侧 | `42` | 哪侧最大边界更小，哪侧水量先确定 |\n| 颜色分类换来 2 后直接 i += 1 | `75` | 从右侧换来的数未检查，不能立刻跳过 |\n| 原地染色覆盖前没保存原值 | `75` | 先保存 `x = nums[i]`，再把当前位置刷成 2 |\n| 链表判环None判断不足 | `141`、`142` | 循环条件写 `fast and fast.next` |\n| 删除倒数节点没用 dummy | `19` | 删除头结点也要统一处理 |\n| 相交链表比较节点值 | `160` | 相交是引用地址相等 |\n| 回文链表中点和反转起点不配套 | `234` | 偏左中点对应 `slow.next`，右中点对应 `slow` |\n| 下一个排列后缀没反转 | `31` | 交换拐点后反转 `[i + 1, end)` |\n| 轮转数组 helper 返回数组 | `189` | 反转函数应 `void` 原地修改，保持 O(1) 空间 |\n\n## 7. 最短复盘口诀\n\n双引用先找移动依据。排序题夹逼，短板题移短边，覆盖题定义慢引用区域，链表题用快慢和间距，对齐题让路程相等。每次移动都要能解释“为什么丢掉这一侧不会错过答案”。\n\n================================================================================\n\n# 第3部分: 滑动窗口\n\n================================================================================\n\n> 目标：本文把 Hot100 中“连续区间状态维护”的题抽象成可复用模板。复习时先判断窗口合法性由什么决定，再决定什么时候扩右、什么时候缩左、什么时候更新答案。\n\n## 1. 滑动窗口题的底层模型\n\n滑动窗口只适合处理连续子数组或连续子串。关键在于窗口状态能否被 O(1) 增删维护。每道题先问五个问题：\n\n| 问题         | 如果答案是“是”       | 常用处理                         |\n| ---------- | -------------- | ---------------------------- |\n| 目标是最长合法窗口吗 | 无重复字符最长子串      | 右扩，非法时左缩，合法时更新最大值            |\n| 目标是最短覆盖窗口吗 | 最小覆盖子串         | 右扩直到满足，再尽量左缩                 |\n| 窗口长度固定吗    | 找所有异位词、滑动窗口最大值 | 每轮保持 `right - left + 1 == k` |\n| 需要维护字符频次吗  | 覆盖、异位词、无重复     | `need/window` 或欠账计数          |\n| 需要维护区间最值吗  | 滑动窗口最大值        | 单调队列保存候选下标                   |\n\n滑动窗口常见的窗口状态有三类：\n\n| 状态 | 对应 Hot100 题目 | 复习关键词 |\n|---|---|---|\n| 去重集合/最后位置 | `3` | 重复字符、左边界跳跃 |\n| 字符频次差 | `76`、`438` | 欠账、满足、固定长度 |\n| 单调队列 | `239` | 下标过期、队尾淘汰 |\n\n## 2. Hot100 滑动窗口题型地图\n\n| 题型 | 题目 | 抽象能力 | 一句话记忆 |\n|---|---|---|---|\n| 最长合法窗口 | `3 无重复字符的最长子串` | 维护窗口内字符不重复 | 右扩遇重复，左边界跳到重复字符之后 |\n| 最短覆盖窗口 | `76 最小覆盖子串` | 维护目标字符欠账 | 满足后尽量缩左，缩到刚好不满足 |\n| 固定长度频次窗口 | `438 找到所有字母异位词` | 长度固定且频次匹配 | 窗口长度到 `len(p)` 后检查 |\n| 固定长度最值窗口 | `239 滑动窗口最大值` | 单调队列维护最大候选 | 队头是最大值，过期就弹出 |\n| 相邻变形 | `567 字符串排列`、`209 长度最小子数组` | 同类窗口思想 | Hot100 没列入但模板完全相通 |\n\n## 3. 复习顺序建议\n\n先掌握可变窗口，再掌握固定窗口，最后掌握单调队列：\n\n1. `3 无重复字符的最长子串`：建立 `left/right` 和窗口合法性的直觉。\n2. `438 找到所有字母异位词`：练固定长度和字符频次。\n3. `76 最小覆盖子串`：练欠账计数和满足后收缩。\n4. `239 滑动窗口最大值`：练单调队列，理解窗口里只保留有效候选。\n\n## 4. 关键套路详解\n\n### 4.1 窗口题先定义合法性\n\n写代码前先补全一句话：\n\n```text\n当前窗口 [left, right] 合法，当且仅当 ______。\n```\n\n`3` 的合法性是窗口内没有重复字符；`76` 的合法性是窗口已经覆盖 `t` 的所有字符；`438` 的合法性是窗口长度等于 `len(p)` 且频次完全相同；`239` 没有“合法/非法”，它是固定长度下维护最大值。\n\n### 4.2 最长和最短的更新时机相反\n\n| 目标 | 常用流程 | 更新答案时机 |\n|---|---|---|\n| 最长合法窗口 | 右扩，非法就左缩 | 每次恢复合法后更新最大值 |\n| 最短覆盖窗口 | 右扩直到满足，满足后左缩 | 每次仍满足时更新最小值 |\n| 固定长度窗口 | 右扩，超过长度就左缩 | 长度刚好等于 k 时更新 |\n\n把这三类混在一起，是滑动窗口最常见的错误来源。\n\n### 4.3 欠账表比双表比较更稳\n\n`76` 可以维护 `need[ch]` 表示还缺多少字符。右扩时如果 `need[ch] > 0`，说明补上了一个有效字符；左缩时如果移走后 `need[ch] > 0`，说明窗口重新缺字符。这样不用每次比较整张表。\n\n### 4.4 固定窗口要先处理过期\n\n`438` 和 `239` 都是固定长度窗口。区别是 `438` 维护频次，`239` 维护最大值候选。固定窗口中，过期元素必须及时移除：频次表要减掉左端字符，单调队列要弹出不在 `[i - k + 1, i]` 内的队头下标。\n\n### 4.5 单调队列保存候选集合\n\n`239` 中如果新元素比队尾元素大，队尾元素永远不可能再成为未来窗口最大值，可以直接弹出。队列保持下标对应值递减，队头就是当前窗口最大值。\n\n## 5. 抽象代码模板\n\n本节按照原始单题笔记的参考解法整理。滑动窗口需要先确定窗口合法性：`3` 用集合保证无重复，`76` 用账本和 `valid` 表示欠账种类是否还清，`438` 用欠账数组和“当前字符是否透支”控制左缩，`239` 用单调队列维护固定窗口最大候选。\n\n### 5.1 最长合法窗口：哈希集合去重\n\n#### 适用题型\n\n- `3 无重复字符的最长子串`：原始笔记使用 `set[str]` 保存当前窗口内字符。\n- 窗口合法性是“窗口内没有重复元素/字符”的最长连续区间。\n- 如果元素类型超出字符，把 `set[str]` 替换为 `set[int]` 或对应类型即可。\n\n#### 核心思路\n\n窗口语义固定为 `[left, right]`。右端字符 `s[right]` 如果已经在集合中，说明当前窗口加入它会产生重复；此时不断移出 `s[left]` 并右移 `left`，直到集合里不再含有 `s[right]`。恢复合法后再把 `s[right]` 放入集合，并用当前窗口长度更新答案。\n\n#### 代码模板：共同骨架\n\n> **题目简述：** 3 无重复字符的最长子串：给定字符串，求不含重复字符的最长连续子串长度。 [力扣原题 ↗](https://leetcode.cn/problems/longest-substring-without-repeating-characters/)\n\n```python\n\ndef lengthOfLongestSubstring(s):\n    window = set()  # 保存当前窗口 [left, right] 中已经存在的字符。\n    left = 0\n    res = 0\n\n    for right in range(0, len(s)):\n        # 如果 s[right] 已在窗口中，窗口加入它会重复。\n        # 必须持续吐出左端字符，直到窗口中不再包含 s[right]。\n        while s[right] in window:\n            window.discard(s[left])\n            left += 1\n\n        # 此时加入 s[right] 后窗口仍然无重复，才能更新最长长度。\n        window.add(s[right])\n        res = max(res, right - left + 1)\n\n    return res\n```\n\n#### 变形点对照\n\n| 变形 | 状态维护 | 左缩条件 | 答案更新 |\n|---|---|---|---|\n| `3 无重复字符` 原始写法 | `set[str]` 保存窗口字符 | `while s[right] in window` | 插入当前字符后更新最长 |\n| 最后出现位置优化 | `last[ch]` 保存最近下标 | 若 `last[ch] >= left`，直接跳 `left` | 跳完后更新最长 |\n| 无重复整数子数组 | `set[int]` | 逻辑不变 | 窗口长度或窗口状态 |\n\n#### 易错点\n\n- 遇到重复时不能只删一次左端；要 `while` 删除到当前字符不重复为止。\n- 答案要在窗口恢复合法并插入 `s[right]` 后更新，不能在非法窗口中更新。\n- `left` 只右移，不回退；集合内容必须和 `[left, right]` 保持一致。\n\n### 5.2 最短覆盖窗口：账本 + valid\n\n#### 适用题型\n\n- `76 最小覆盖子串`：原始笔记使用 `dict[str, int] need` 作为欠账表。\n- 最短连续区间覆盖目标多重集合，目标字符可能重复。\n- 只关心目标字符的覆盖情况，非目标字符进入窗口不改变 `valid`。\n\n#### 核心思路\n\n`need[ch]` 表示字符 `ch` 还欠多少个。右扩遇到目标字符时执行 `need[s[r]] -= 1`；当某个字符刚好还到 `0`，说明这个字符种类已经满足，执行 `valid += 1`。当 `valid == len(need)` 时，所有目标字符种类都满足，当前窗口合法；这时要在 `while` 中一边记录最短答案，一边踢出左端字符，直到窗口重新不合法。\n\n#### 代码模板：共同骨架\n\n> **题目简述：** 76 最小覆盖子串：在字符串 S 中寻找覆盖字符串 T 全部字符及其频次的最短连续子串。 [力扣原题 ↗](https://leetcode.cn/problems/minimum-window-substring/)\n\n```python\ndef minWindow(s, t):\n    map = {}  # 欠账表：key 是目标字符，value 是还缺多少个。\n    for i in range(0, len(t)):\n        map[t[i]] = map.get(t[i], 0) + 1  # 记录 t 中每个字符需要出现的次数，重复字符会累计。\n\n    valid = 0  # 已经还清的目标字符种类数，不能当成还清的总字符数。\n    l = 0\n    start = 0\n    minLen = float('inf')  # 只记录最短窗口的起点和长度，避免频繁 substr。\n\n    for r in range(0, len(s)):\n        # 1. 入窗：只有账本上的字符才会影响欠账状态。\n        if (s[r] in map):\n            map[s[r]] -= 1\n            if map[s[r]] == 0:\n                valid += 1  # 这个字符种类刚好还清。\n\n        # 2. 当前窗口已覆盖 t，开始把左边界尽量右移以压缩长度。\n        while valid == len(map):\n            # 3. 更新答案：while 内每一次左缩前，窗口都仍然合法。\n            if r - l + 1 \u003c minLen:\n                minLen = r - l + 1\n                start = l\n\n            # 4. 出窗：如果踢掉的是目标字符，需要撤销它对账本的贡献。\n            if (s[l] in map):\n                if map[s[l]] == 0:\n                    valid -= 1  # 原本刚好还清，移走后该字符种类重新欠账。\n                map[s[l]] = map.get(s[l], 0) + 1\n            l += 1\n\n    return \"\" if minLen == float('inf') else s[start:start + minLen]\n```\n\n#### 变形点对照\n\n| 变形 | 状态含义 | 合法条件 | 左缩时机 |\n|---|---|---|---|\n| `76 最小覆盖子串` | `need[ch]` 是目标字符欠账，`valid` 是还清种类数 | `valid == len(need)` | 合法时持续缩左并更新最短 |\n| 正数数组最短和至少为 K | `state` 是窗口和 | `state >= k` | 合法时持续缩左并更新最短 |\n| 字符集固定的覆盖题 | `dict` 可换成数组 | 合法条件不变 | 出窗时同样撤销状态 |\n\n#### 易错点\n\n- `valid` 表示满足的“字符种类数”，所以要和 `len(need)` 比较，不能和 `len(t)` 比较。\n- `left += 1` 必须在 `while valid == len(need)` 内部；只有合法窗口才有资格继续压缩。\n- 出窗时要先判断 `need[s[l]] == 0` 再执行 `need[s[l]] += 1`，否则会错过“刚好从满足变成不满足”的瞬间。\n\n### 5.3 固定长度频次窗口：欠账数组 + 过量收缩\n\n#### 适用题型\n\n- `438 找到所有字母异位词`：原始笔记使用 `int map[26]` 作为欠账数组。\n- `567 字符串的排列`：同一骨架，找到第一个合法窗口时直接返回 `True`。\n- 所有“小写字母、固定长度、频次必须匹配”的连续子串题。\n\n#### 核心思路\n\n先把 `p` 中字符写入欠账数组：`need[c]` 表示还缺多少个 `c`。每次右扩时执行 `need[s[right]] -= 1`，如果某个字符被用多了，它对应的欠账会变成负数。原始写法的关键是：只要当前右端字符透支，即 `need[s[right]] \u003c 0`，就不断从左端吐字符并把欠账加回去。这样循环结束后，窗口内每个字符都没有超过 `p` 的需求；当窗口长度刚好等于 `len(p)`，它就是一个异位词窗口。\n\n#### 代码模板：共同骨架\n\n> **题目简述：** 本模板覆盖：438 找到字符串中所有字母异位词（给定字符串 S 和 P，返回 S 中所有与 P 字符及频次相同的子串起点。）；567 字符串的排列（给定字符串 S1 和 S2，判断 S2 是否包含一个由 S1 字符重排得到的连续子串。） [438 原题 ↗](https://leetcode.cn/problems/find-all-anagrams-in-a-string/) · [567 原题 ↗](https://leetcode.cn/problems/permutation-in-string/)\n\n```python\ndef findAnagrams(s, p):\n    res = []\n    need = [0] * 26\n    for ch in p:\n        need[ord(ch) - ord('a')] += 1\n\n    left = 0\n    for right, ch in enumerate(s):\n        idx = ord(ch) - ord('a')\n        need[idx] -= 1\n        while need[idx] \u003c 0:\n            need[ord(s[left]) - ord('a')] += 1\n            left += 1\n        if right - left + 1 == len(p):\n            res.append(left)\n    return res\n```\n\n#### 变形点对照\n\n| 变形 | 返回值 | 命中窗口后的处理 | 字符集 |\n|---|---|---|---|\n| `438 找所有异位词` | `list[int]` | `res.append(left)` 后继续扫描 | 小写字母用 `int map[26]` |\n| `567 是否包含排列` | `bool` | 第一次 `right - left + 1 == n` 直接返回 `True` | 同样可用 26 数组 |\n| 字符集不固定 | 起点或布尔值 | 逻辑不变 | 换成 `dict[str, int]` 或 256 数组 |\n\n#### 易错点\n\n- 欠账数组初始化来自 `p`，右扩执行 `-= 1`，左缩执行 `+= 1`，方向不要反。\n- `while need[idx] \u003c 0` 需要持续修复当前字符透支，不能只移动一次左端。\n- 命中条件是窗口长度等于 `len(p)`，无需每轮比较两张频次数组。\n\n### 5.4 固定长度单调队列：窗口最大值\n\n#### 适用题型\n\n- `239 滑动窗口最大值`：原始笔记思路是“队列存下标，超标踢队头，不如新值踢队尾”。\n- 固定长度窗口最小值：比较方向反过来即可。\n- 需要在窗口滑动时 O(1) 均摊维护最值候选。\n\n#### 核心思路\n\n双端队列 `dq` 保存候选下标。队头负责给出当前最大值；队尾负责淘汰以后不可能成为最大值的弱候选。由于弱候选可能连续出现多个，原始代码中“队尾不如新值就踢人”的判断必须写成 `while`，不能只用 `if` 弹一次。\n\n#### 代码模板：共同骨架\n\n> **题目简述：** 239 滑动窗口最大值：给定整数数组和窗口大小 K，返回窗口从左向右滑动时每个位置的最大值。 [力扣原题 ↗](https://leetcode.cn/problems/sliding-window-maximum/)\n\n```python\ndef maxSlidingWindow(nums, k):\n    res = []\n    dq = deque()  # 存下标；保持 nums[dq[0]] >= nums[dq[1]] >= ...。\n\n    for i in range(0, len(nums)):\n        # 1. 踢过期队头：当前窗口是 [i - k + 1, i]。\n        while not not dq and dq[0] \u003c i - k + 1:\n            dq.popleft()\n\n        # 2. 踢弱队尾：nums[i] 更靠右且不小于队尾，队尾永远不会再成为最大值。\n        # 必须用 while，因为可能有多个队尾候选都不如当前值。\n        while not not dq and nums[i] >= nums[dq[-1]]:\n            dq.pop()\n\n        # 3. 当前下标入队，成为未来窗口的候选最大值。\n        dq.append(i)\n\n        # 4. 窗口长度达到 k 后，队头就是当前窗口最大值。\n        if i - k + 1 >= 0:\n            res.append(nums[dq[0]])\n\n    return res\n```\n\n#### 变形点对照\n\n| 变形 | 队列单调性 | 队尾淘汰条件 | 队头含义 |\n|---|---|---|---|\n| `239 窗口最大值` | 从队头到队尾值递减 | `nums[i] >= nums[dq.back()]` | 当前窗口最大值下标 |\n| 固定窗口最小值 | 从队头到队尾值递增 | `nums[i] \u003c= nums[dq.back()]` | 当前窗口最小值下标 |\n| 保留更早相等元素 | 最大值用 `>`，保留相等值 | 相等时不弹队尾 | 队头仍是最大值，但相等元素更早过期 |\n\n#### 易错点\n\n- 单调队列必须存下标，不能只存值，否则无法判断是否超出窗口。\n- 读答案前必须先弹出过期队头。\n- 队尾淘汰必须用 `while`；只用 `if` 时，队列可能不再单调，后续最大值会错。\n\n### 5.5 相邻扩展：正数数组最短满足窗口\n\n#### 适用题型\n\n- 原始 `76` 笔记复盘中的 `slidingWindowMin` 骨架。\n- `209 长度最小的子数组`：数组元素全为正数，窗口和随右扩单调增加、随左缩单调减少。\n- 所有“达标后持续左缩求最短”的正数累计类窗口。\n\n#### 核心思路\n\n这类题和 `76` 的控制权交接完全一致：外层 `for` 负责右扩建立达标窗口；一旦 `state >= k`，内层 `while` 接管左边界，持续更新最短答案并撤销左端贡献，直到窗口不再达标。\n\n#### 代码模板：共同骨架\n\n> **题目简述：** 本模板覆盖：76 最小覆盖子串（在字符串 S 中寻找覆盖字符串 T 全部字符及其频次的最短连续子串。）；209 长度最小的子数组（给定正整数数组和目标值，求元素和至少为目标值的最短连续子数组长度。） [76 原题 ↗](https://leetcode.cn/problems/minimum-window-substring/) · [209 原题 ↗](https://leetcode.cn/problems/minimum-size-subarray-sum/)\n\n```python\ndef slidingWindowMin(nums, k):\n    if not nums or k \u003c= 0: return 0\n\n    left = 0\n    state = 0  # 当前窗口和；正数数组下具备可收缩单调性。\n    res = float('inf')  # 求最短长度，初始为无穷大。\n\n    for right in range(0, len(nums)):\n        # 1. 入窗：右指针扩大窗口，主动尝试让状态达标。\n        state += nums[right]\n\n        # 2. 达标后持续缩左：每次循环开始时窗口都是合法候选。\n        while state >= k:\n            res = min(res, right - left + 1)\n\n            # 3. 出窗：撤销左端元素贡献，再移动左指针。\n            state -= nums[left]\n            left += 1\n\n    return 0 if res == float('inf') else res\n```\n\n#### 变形点对照\n\n| 变形 | 聚合状态 | 合法条件 | 为什么能滑窗 |\n|---|---|---|---|\n| 正数数组最短和至少 K | `state` 是窗口和 | `state >= k` | 正数保证右扩不减、左缩不增 |\n| 最小覆盖子串 `76` | `map + valid` | `valid == len(need)` | 状态可 O(1) 增删维护 |\n| 含负数的和为 K 子数组 | 前缀和 + 哈希表 | 查历史 `sum - k` | 负数破坏窗口和单调性，不适合滑窗 |\n\n#### 易错点\n\n- 这套最短和窗口要求数组为正数；有负数时应改用前缀和类方法。\n- 更新最短答案必须放在 `while state >= k` 内，不能只在右扩后更新一次。\n- 出窗时要先撤销 `nums[left]`，再 `left += 1`，保持窗口状态和边界一致。\n\n## 6. 高频易错点清单\n\n| 易错点 | 典型题目 | 规避方式 |\n|---|---|---|\n| 没定义窗口合法性就写循环 | `3`、`76` | 先写出合法条件 |\n| 最长窗口在非法状态更新答案 | `3` | 先 `while` 缩左恢复合法，再插入当前字符并更新 |\n| 遇到重复字符只删一次左端 | `3` | 用 `while s[right] in window` 持续删除到不重复 |\n| 最短窗口只找到一个满足窗口就停 | `76` | 满足后还要继续缩左找最短 |\n| `valid` 和 `len(t)` 比较 | `76` | `valid` 是满足种类数，应比较 `len(need)` |\n| 欠账表加减方向写反 | `76`、`438` | 右扩还债 `-= 1`，左缩撤销 `+= 1` |\n| 异位词窗口每轮比较两张表 | `438` | 原始写法用当前字符透支 `map[in] \u003c 0` 驱动左缩 |\n| 单调队列保存值不保存下标 | `239` | 必须用下标判断过期 |\n| 队尾淘汰只用 `if` | `239` | 弱候选可能有多个，必须用 `while` 弹到单调 |\n| 队尾淘汰方向写反 | `239` | 最大值窗口保持队列值递减 |\n\n## 7. 最短复盘口诀\n\n滑窗题先定合法性。最长题非法就缩左，合法后更新；最短题满足就缩左，缩时更新；固定窗口到长度再判断；最大值窗口用单调队列，下标负责过期，队尾负责淘汰弱候选。\n\n================================================================================\n\n# 第4部分: 矩阵\n\n================================================================================\n\n> 目标：本文把 Hot100 中二维数组、网格图、棋盘搜索和矩阵 DP 抽象成若干“可复用题型模板”。复习时先判断矩阵的坐标语义，再决定遍历顺序、边界收缩、原地标记、二分方式或 DFS/BFS 状态。\n\n## 1. 矩阵题的底层模型\n\n矩阵题的核心在于把 `(r, c)` 的含义说清楚。每道矩阵题先问六个问题：\n\n| 问题             | 如果答案是“是”         | 常用处理             |\n| -------------- | ---------------- | ---------------- |\n| 是否要按特定顺序访问每个格子 | 螺旋遍历、旋转图像        | 边界收缩、层级处理、坐标映射   |\n| 是否可以原地修改矩阵     | 矩阵置零、岛屿数量、腐烂橘子   | 首行首列标记、染色、入队即标记  |\n| 行列是否有序         | 搜索二维矩阵、搜索二维矩阵 II | 展平成一维二分、右上角阶梯搜索  |\n| 相邻格子是否代表边      | 岛屿数量、腐烂橘子、单词搜索   | 方向数组生成邻居         |\n| 答案是否依赖上方或左方状态  | 不同路径、最小路径和       | 二维 DP 或滚动数组      |\n| 路径状态是否需要撤销     | 单词搜索             | 回溯 DFS，进入标记，退出恢复 |\n\n矩阵题常见的坐标模型有四类：\n\n| 坐标模型 | 代表题 | 关键动作 |\n|---|---|---|\n| 边界模型 | `54 螺旋矩阵`、`48 旋转图像` | 维护上下左右边界或按层处理 |\n| 标记模型 | `73 矩阵置零`、`200 岛屿数量` | 用矩阵自身或额外 visited 表示状态 |\n| 有序模型 | `74 搜索二维矩阵`、`240 搜索二维矩阵 II` | 二分、阶梯搜索、候选区域缩小 |\n| 状态转移模型 | `62 不同路径`、`64 最小路径和` | 当前格子由上方和左方转移 |\n\n## 2. Hot100 矩阵题型地图\n\n\n| 题型 | 题目 | 抽象能力 | 一句话记忆 |\n|---|---|---|---|\n| 矩阵原地变换 | `48 旋转图像` | 坐标映射、转置加翻转、四点轮换 | 旋转需要处理每个坐标的目标位置 |\n| 边界收缩遍历 | `54 螺旋矩阵` | 上下左右边界维护 | 每走完一条边，就收缩对应边界 |\n| 矩阵标记 | `73 矩阵置零` | 首行首列作为标记位 | 标记和执行要分两阶段，首列单独记 |\n| 展平二分 | `74 搜索二维矩阵` | 二维坐标和一维下标互转 | `mid / n` 找行，`mid % n` 找列 |\n| 阶梯搜索 | `240 搜索二维矩阵 II` | 从右上角排除一行或一列 | 大了左移，小了下移 |\n| 网格连通块 | `200 岛屿数量` | DFS/BFS 吃掉整块 | 发现新陆地，整座岛染掉 |\n| 多源 BFS | `994 腐烂的橘子` | 队列按层扩散 | 所有腐烂橘子第 0 分钟同时入队 |\n| 网格回溯 | `79 单词搜索` | 路径状态临时标记 | 当前路径不能重复用格子，失败后恢复 |\n| 矩阵 DP | `62 不同路径`、`64 最小路径和` | 从上和左转移 | 第一行第一列是边界，内部格子看上左 |\n\n## 3. 复习顺序建议\n\n建议按“坐标遍历 → 原地标记 → 有序搜索 → 网格图 → 矩阵 DP”的顺序复习：\n\n1. `54 螺旋矩阵`：练边界变量和循环退出条件。\n2. `48 旋转图像`：掌握转置加水平翻转，理解坐标映射。\n3. `73 矩阵置零`：练原地标记和首行首列边界。\n4. `74 搜索二维矩阵`：把二维矩阵展平成一维二分。\n5. `240 搜索二维矩阵 II`：从右上角阶梯式排除候选区域。\n6. `200 岛屿数量`：用 DFS/BFS 处理网格连通块。\n7. `994 腐烂的橘子`：用多源 BFS 处理最短时间。\n8. `79 单词搜索`：练回溯 DFS 的进入标记和退出恢复。\n9. `62`、`64`：把矩阵坐标转成 DP 状态。\n\n## 4. 关键套路详解\n\n### 4.1 矩阵题先定义坐标含义\n\n写代码前先确定：`m` 是行数，`n` 是列数，`r` 表示第几行，`c` 表示第几列。很多错误来自把行列维度写反，尤其是 `matrix[r][c]`、`r \u003c m`、`c \u003c n` 三者不一致。\n\n`74` 展平成一维后，下标 `idx` 对应 `(idx / n, idx % n)`。这里必须除以列数 `n`，不能除以行数 `m`。\n\n### 4.2 边界收缩题要防止重复访问\n\n`54 螺旋矩阵`每一圈最多走四条边：上边、右边、下边、左边。走下边前要确认 `top \u003c= bottom`，走左边前要确认 `left \u003c= right`。否则单行或单列矩阵会重复加入元素。\n\n边界题最稳的写法是每走完一条边立即收缩，并在进入下一条边前检查边界是否仍合法。\n\n### 4.3 原地标记要分清“记录阶段”和“执行阶段”\n\n`73 矩阵置零`不能看到一个 0 就立刻清整行整列，因为新制造的 0 会污染后续判断。正确逻辑是先记录哪些行列需要置零，再统一执行。\n\n如果要求 O(1) 额外空间，可以把首行和首列当作标记数组。但 `matrix[0][0]` 同时属于首行和首列，所以通常额外用 `firstColZero` 记录首列是否需要清零。\n\n### 4.4 有序矩阵有两种完全不同的搜索模型\n\n`74 搜索二维矩阵`每行递增，且下一行首元素大于上一行尾元素，所以整个矩阵可以视为一个升序数组，直接二分。\n\n`240 搜索二维矩阵 II`每行递增、每列递增，但不能整体展平为全局有序数组。右上角是最好的决策点：当前值大于目标，当前列下面都更大，只能左移；当前值小于目标，当前行左边都更小，只能下移。\n\n### 4.5 网格 DFS/BFS 的边界判断必须统一\n\n网格题通常用方向数组生成邻居：\n\n```python\ndirs[4][2] = [[0, 1], [0, -1], [1, 0], [-1, 0]]\n```\n\nDFS 入口要先判断越界、格子值是否符合、是否已访问。BFS 则要在邻居入队时就标记访问，避免同一个格子被同层多个节点重复入队。\n\n### 4.6 统计连通块可以永久染色，路径搜索必须回溯\n\n`200 岛屿数量`只关心每座岛统计一次，所以可以把访问过的 `'1'` 永久改成 `'0'`。`79 单词搜索`是在找一条具体路径，当前路径不能重复使用格子，但失败后别的路径仍然可以使用这个格子，因此必须恢复现场。\n\n一句话区分：统计类染掉不回来，路径类标记后要撤销。\n\n### 4.7 矩阵 DP 的方向来自题目允许的移动\n\n`62` 和 `64` 只允许向右或向下走，所以到达 `(r, c)` 只能来自 `(r - 1, c)` 或 `(r, c - 1)`。如果题目允许四个方向，就不能直接套这种 DP，通常要变成图搜索或最短路。\n\n## 5. 抽象代码模板\n\n下面模板按矩阵坐标模型抽象出可迁移骨架。复习时先统一 `m` 为行数、`n` 为列数、`r/c` 为坐标，再决定边界收缩、方向数组、原地标记或 DP 顺序。\n\n### 5.1 边界收缩遍历\n\n#### 适用题型\n\n- `54 螺旋矩阵`：按上、右、下、左顺序收集元素。\n- 只处理矩阵外圈，或按层处理矩阵。\n- 需要避免单行、单列重复访问的边界题。\n\n#### 核心思路\n\n维护四个边界 `top/bottom/left/right` 表示当前尚未访问的矩形区域。每走完一条边就收缩对应边界；在处理下边和左边前检查边界是否仍合法，避免单行或单列被重复访问。\n\n关键不变量：\n\n- `[top, bottom]` 和 `[left, right]` 是未处理区域。\n- 每个元素只在所属边第一次被扫描时加入答案。\n- 收缩边界后必须重新判断区域是否为空。\n\n#### 代码模板\n\n> **题目简述：** 54 螺旋矩阵：给定二维矩阵，按从外到内的顺时针螺旋顺序返回全部元素。 [力扣原题 ↗](https://leetcode.cn/problems/spiral-matrix/)\n\n```python\ndef spiralOrderTemplate(matrix):\n    ans = []\n    if not matrix or not matrix[0]:\n        return ans\n\n    top = 0\n    bottom = len(matrix) - 1\n    left = 0\n    right = len(matrix[0]) - 1\n\n    while top \u003c= bottom and left \u003c= right:\n        for c in range(left, right + 1):\n            ans.append(matrix[top][c])\n        top += 1\n\n        for r in range(top, bottom + 1):\n            ans.append(matrix[r][right])\n        right -= 1\n\n        if top \u003c= bottom:\n            for c in range(right, left - 1, -1):\n                ans.append(matrix[bottom][c])\n            bottom -= 1\n\n        if left \u003c= right:\n            for r in range(bottom, top - 1, -1):\n                ans.append(matrix[r][left])\n            left += 1\n\n    return ans\n```\n\n#### 易错点\n\n- 下边和左边处理前不检查边界，单行单列重复加入。\n- `top/bottom` 与 `left/right` 更新顺序混乱。\n- 行列变量写反，把 `matrix[r][c]` 写成 `matrix[c][r]`。\n\n### 5.2 矩阵原地旋转\n\n#### 适用题型\n\n- `48 旋转图像`：`n x n` 矩阵顺时针旋转 90 度。\n- 转置、水平翻转、垂直翻转等坐标映射题。\n- 要求原地修改矩阵的方阵变换。\n\n#### 核心思路\n\n顺时针旋转 90 度可以拆成两步：先沿主对角线转置，再反转每一行。转置时只交换 `c > r` 的上三角元素，避免同一对坐标交换两次。\n\n关键不变量：\n\n- 转置后 `(r, c)` 与 `(c, r)` 互换。\n- 每行反转后列坐标变为 `n - 1 - c`。\n- 原地修改会覆盖旧值，必须使用安全的交换顺序。\n\n#### 代码模板\n\n> **题目简述：** 48 旋转图像：给定 N×N 方阵，将图像原地顺时针旋转九十度。 [力扣原题 ↗](https://leetcode.cn/problems/rotate-image/)\n\n```python\ndef rotateMatrixTemplate(matrix):\n    n = len(matrix)\n\n    for r in range(0, n):\n        for c in range(r + 1, n):\n            matrix[r][c], matrix[c][r] = matrix[c][r], matrix[r][c]\n\n    for r in range(0, n):\n        matrix[r].reverse()\n```\n\n#### 易错点\n\n- 转置时内层从 0 开始，导致元素被交换两次。\n- 非方阵不能直接套原地旋转模板。\n- 四点轮换时直接覆盖目标格，没用临时变量保存旧值。\n\n### 5.3 矩阵置零的原地标记\n\n#### 适用题型\n\n- `73 矩阵置零`。\n- 先记录状态、后执行修改的原地标记题。\n- 可以借用矩阵自身某些行列作为标记数组的题。\n\n#### 核心思路\n\n不能看到 0 就立即清整行整列，否则新制造的 0 会污染后续扫描。O(1) 空间做法是用第一行和第一列记录哪些列、哪些行需要清零；由于 `matrix[0][0]` 同时属于首行首列，单独用 `firstColZero` 记录首列是否清零。\n\n关键不变量：\n\n- 第一轮只标记，不执行清零。\n- 首列状态不能只靠 `matrix[0][0]` 表示。\n\n#### 代码模板\n\n> **题目简述：** 73 矩阵置零：若矩阵某元素为零，则将其整行整列置零，要求在原矩阵上完成。 [力扣原题 ↗](https://leetcode.cn/problems/set-matrix-zeroes/)\n\n```python\ndef setZeroes(matrix):\n    m, n = len(matrix), len(matrix[0])\n    first_col_zero = any(matrix[i][0] == 0 for i in range(m))\n\n    for i in range(m):\n        for j in range(1, n):\n            if matrix[i][j] == 0:\n                matrix[i][0] = 0\n                matrix[0][j] = 0\n\n    for i in range(1, m):\n        for j in range(1, n):\n            if matrix[i][0] == 0 or matrix[0][j] == 0:\n                matrix[i][j] = 0\n\n    if matrix[0][0] == 0:\n        for j in range(n):\n            matrix[0][j] = 0\n    if first_col_zero:\n        for i in range(m):\n            matrix[i][0] = 0\n```\n\n#### 易错点\n\n- 边扫描边清零，导致后续判断被污染。\n- 忘记单独记录首列，`matrix[0][0]` 标记含义冲突。\n- 从左上往右下执行清零，提前破坏第一行第一列标记。\n\n### 5.4 有序矩阵搜索\n\n#### 适用题型\n\n- `74 搜索二维矩阵`：整体可视为一维升序数组。\n- `240 搜索二维矩阵 II`：每行每列递增，但整体不能展平有序。\n- 候选区域可根据当前值排除一行或一列的题。\n\n#### 核心思路\n\n`74` 的矩阵满足全局有序，可以把 `[0, m * n)` 当作一维下标，坐标换算为 `(idx / n, idx % n)`。`240` 只能从右上角做阶梯搜索：当前值太大就左移排除一列，当前值太小就下移排除一行。\n\n关键不变量：\n\n- 展平二分必须除以列数 `n`，不能除以行数 `m`。\n- 阶梯搜索要求当前位置能同时代表一行最大值和一列最小值。\n- 两种有序条件不同，不能把 `240` 直接展平成全局有序数组。\n\n#### 代码 A：展平二分\n\n> **题目简述：** 74 搜索二维矩阵：矩阵每行升序且下一行首项大于上一行末项，判断目标值是否存在。 [力扣原题 ↗](https://leetcode.cn/problems/search-a-2d-matrix/)\n\n```python\ndef searchFlattenedMatrix(matrix, target):\n    m = len(matrix)\n    n = len(matrix[0])\n    left = 0\n    right = m * n\n\n    while left \u003c right:\n        mid = left + (right - left) / 2\n        value = matrix[mid / n][mid % n]\n        if value \u003c target:\n            left = mid + 1\n        else:\n            right = mid\n\n    return left \u003c m * n and matrix[left / n][left % n] == target\n```\n\n#### 代码 B：右上角阶梯搜索\n\n> **题目简述：** 240 搜索二维矩阵 II：给定每行和每列均升序的矩阵，判断指定目标值是否存在。 [力扣原题 ↗](https://leetcode.cn/problems/search-a-2d-matrix-ii/)\n\n```python\ndef searchStaircaseMatrix(matrix, target):\n    m = len(matrix)\n    n = len(matrix[0])\n    r = 0\n    c = n - 1\n\n    while r \u003c m and c >= 0:\n        if matrix[r][c] == target:\n            return True\n        if matrix[r][c] > target:\n            c -= 1\n        else:\n            r += 1\n\n    return False\n```\n\n#### 易错点\n\n- 坐标换算写成 `mid / m`、`mid % m`。\n- 把行列分别有序误认为整体有序。\n- 阶梯搜索移动方向反了：右上角大了左移，小了下移。\n\n### 5.5 网格 DFS 连通块染色\n\n#### 适用题型\n\n- `200 岛屿数量`：发现一块陆地后，把整座岛吃掉。\n- 连通块数量、连通块面积、区域染色等访问后不需要恢复的网格题。\n- 只关心“这块区域是否已经被全局处理过”的矩阵搜索题。\n\n#### 核心思路\n\n这些题不应该拆成互不相关的多个 DFS 模板。共同骨架都是：外层找到入口，DFS 判断边界和目标值，进入后立即永久标记，再递归四个方向。差别只在于外层如何结算答案，以及 DFS 是否需要返回面积。\n\n关键不变量：\n\n- `dirs` 中每个方向都表示一次上下左右邻接移动。\n- DFS 入口统一做越界和目标值判断。\n- 访问标记是永久状态，不能在递归退出时恢复。\n- 数量题在“发现新入口”时计数；面积题在 DFS 内累加格子数；染色题把目标值和标记值参数化。\n\n#### 代码模板：共同骨架\n\n> **题目简述：** 200 岛屿数量：给定由陆地和水组成的网格，统计上下左右相连陆地区域的数量。 [力扣原题 ↗](https://leetcode.cn/problems/number-of-islands/)\n\n```python\nclass GridFloodFillTemplate:\n    def __init__(s
