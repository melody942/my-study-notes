 | 容量 (正序)         |\n| **完全背包**  | 求 **组合数** (顺序无关) | **物品**   | **容量 (正序)**     |\n| **完全背包**  | 求 **排列数** (顺序有关) | **容量**   | **物品**          |\n\n#### 原始解法 A：零钱兑换\n\n> **题目简述：** 322 零钱兑换：给定可无限使用的硬币面额和总金额，求凑成金额的最少硬币数，不可达则返回 -1。 [力扣原题 ↗](https://leetcode.cn/problems/coin-change/)\n\n```python\nclass Solution:\n    def coinChange(self, coins, amount):\n        dp = [amount + 1 for _ in range(amount + 1)]\n        dp[0] = 0\n\n        def __init__(self, i):\n            count = coins[i]\n            # 完全背包正序：本轮更新后的 dp[j - count] 可以继续使用当前硬币。\n            def __init__(self, j):\n                dp[j] = min(dp[j], dp[j - count] + 1)\n        return -1 if dp[amount] == amount + 1 else dp[amount]\n```\n\n#### 原始解法 B：完全平方数\n\n> **题目简述：** 279 完全平方数：给定正整数 N，求和为 N 所需的完全平方数的最少数量。 [力扣原题 ↗](https://leetcode.cn/problems/perfect-squares/)\n\n```python\nclass Solution:\n    def numSquares(self, n):\n        # 求最小值，全填 n + 1；最差全用 1，也只需要 n 个。\n        dp = [n + 1 for _ in range(n + 1)]\n        dp[0] = 0\n\n        def __init__(self, i):\n            weight = i * i\n            # 完全背包正序遍历容量。\n            def __init__(self, j):\n                dp[j] = min(dp[j], dp[j - weight] + 1)\n        return dp[n]\n```\n\n#### 原始解法 C：分割等和子集\n\n> **题目简述：** 416 分割等和子集：给定正整数数组，判断能否将每个元素恰用一次地分成两个元素和相等的子集。 [力扣原题 ↗](https://leetcode.cn/problems/partition-equal-subset-sum/)\n\n```python\ndef canPartition(nums):\n    total = sum(nums)\n    if total % 2 != 0:\n        return False\n\n    target = total // 2\n    dp = [False] * (target + 1)\n    dp[0] = True\n\n    for num in nums:\n        for j in range(target, num - 1, -1):\n            dp[j] = dp[j] or dp[j - num]\n    return dp[target]\n```\n\n#### 易错点\n\n- `322` 和 `279` 都是完全背包，容量必须正序。\n- `416` 是 01 背包，容量必须倒序；写成正序会把一个数用多次。\n- 最小数量类题的不可达值要用 `amount + 1` 或 `n + 1`，不能初始化为 0。\n\n### 5.7 模板七：前缀可行性与序列优化\n\n#### 适用题型\n\n- `139 单词拆分`：原始解法是一维布尔 DP，枚举当前位置和词典单词。\n- `300 最长递增子序列`：原始笔记同时保留 `O(n^2)` DP 和 `tails + lower_bound` 优化版。\n- `118 杨辉三角`：原始解法直接构造每一行，下一行依赖上一行相邻两个数。\n\n#### 核心思路\n\n单词拆分的 `dp[i]` 表示 `s[0..i-1]` 能否被拆分；LIS 的 `dp[i]` 表示以 `nums[i]` 结尾的最长长度，进一步优化时不再保存所有结尾状态，而用 `tails` 保存“同长度下最小尾值”。杨辉三角是二维结果构造，不需要额外空间优化，因为题目要求返回整个三角形。\n\n#### 原始解法 A：单词拆分\n\n> **题目简述：** 139 单词拆分：给定字符串和单词字典，判断字符串能否拆成一个或多个字典单词。 [力扣原题 ↗](https://leetcode.cn/problems/word-break/)\n\n```python\ndef wordBreak(s, wordDict):\n    n = len(s)\n    dp = [False] * (n + 1)\n    dp[0] = True\n\n    for i in range(n + 1):\n        for word in wordDict:\n            length = len(word)\n            if i >= length and dp[i - length] and word == s[i - length:i]:\n                dp[i] = True\n                break\n    return dp[n]\n```\n\n#### 原始解法 B：最长递增子序列\n\n> **题目简述：** 300 最长递增子序列：给定整数数组，求保持原有次序但不必连续的最长严格递增子序列长度。 [力扣原题 ↗](https://leetcode.cn/problems/longest-increasing-subsequence/)\n\n```python\nfrom bisect import bisect_left\n\n\ndef lengthOfLIS(nums):\n    tails = []\n    for num in nums:\n        if not tails or num > tails[-1]:\n            tails.append(num)\n        else:\n            idx = bisect_left(tails, num)\n            tails[idx] = num\n    return len(tails)\n```\n\n原笔记中的基础 DP 版用于理解状态语义：\n\n> **题目简述：** 300 最长递增子序列：给定整数数组，求保持原有次序但不必连续的最长严格递增子序列长度。 [力扣原题 ↗](https://leetcode.cn/problems/longest-increasing-subsequence/)\n\n```python\nclass Solution:\n    def lengthOfLIS(self, nums):\n        if not nums: return 0\n        n = len(nums)\n        dp = [1 for _ in range(n)]\n        maxLength = 1\n\n        def __init__(self, i):\n            def __init__(self, j):\n                def __init__(self, nums):\n                    dp[i] = max(dp[i], dp[j] + 1)\n            maxLength = max(maxLength, dp[i])\n        return maxLength\n```\n\n#### 原始解法 C：杨辉三角\n\n> **题目简述：** 118 杨辉三角：给定行数，返回杨辉三角的前若干行，每项为左上与右上两项之和。 [力扣原题 ↗](https://leetcode.cn/problems/pascals-triangle/)\n\n```python\nclass Solution:\n    def generate(self, numRows):\n        res = [[] for _ in range(numRows)]\n        def __init__(self, i):\n            res[i].resize(i + 1, 1)\n            def __init__(self, j):\n                res[i][j] = res[i - 1][j - 1] + res[i - 1][j]\n        return res\n```\n\n#### 易错点\n\n- 单词拆分原始写法是“位置 i + 枚举 word”，`substr` 起点是 `i - length`。\n- LIS 严格递增用 `lower_bound` 替换第一个 `>= num` 的尾值；如果是非递减才考虑 `upper_bound`。\n- 杨辉三角题目要求返回完整二维数组，不能为了空间优化只保留一行。\n\n### 5.8 模板八：树形贡献 DP 与贪心压缩\n\n#### 适用题型\n\n- `124 二叉树中的最大路径和`：原始解法是树形 DP，递归返回单边贡献，全局答案可左右合并。\n- `55 跳跃游戏`：原始解法用 `maxlength` 压缩可达性。\n- `45 跳跃游戏 II`：原始解法用 `maxlength / end / res` 按层贪心，等价于压缩 BFS/DP 层数。\n- `42 接雨水`：原始解法使用双引用和左右最大值 `lm / rm`，区分于前后缀数组 DP。\n- `22 括号生成`：原始解法是约束回溯，已归入回溯专题，不强行放入 DP 模板。\n\n#### 核心思路\n\n这些题虽然在 topic 中含“动态规划”，但原始参考解法并不都是显式 `dp` 表。总结时应保留原始优化逻辑：树形路径用返回值表达向父节点的单边贡献；跳跃游戏只维护最远可达范围；接雨水只维护两侧目前最高柱，不再构造 `leftMax/rightMax` 数组。\n\n#### 原始解法 A：二叉树最大路径和\n\n> **题目简述：** 124 二叉树中的最大路径和：二叉树路径可从任意结点起止且不重复经过结点，求最大结点值之和。 [力扣原题 ↗](https://leetcode.cn/problems/binary-tree-maximum-path-sum/)\n\n```python\nclass Solution:\n    maxSum = -float('inf')\n\n    def maxPathSum(self, root):\n        dfs(root)\n        return maxSum\n\n    def dfs(self, node):\n        if node == None: return 0\n\n        # 小于 0 的子树贡献会拖累路径，直接舍弃。\n        leftGain = max(0, dfs(node.left))\n        rightGain = max(0, dfs(node.right))\n\n        # 全局答案可以在当前节点左右拐弯。\n        currentPathSum = node.val + leftGain + rightGain\n        maxSum = max(maxSum, currentPathSum)\n\n        # 返回给父节点时只能选一侧继续向上延伸。\n        return node.val + max(leftGain, rightGain)\n```\n\n#### 原始解法 B：跳跃游戏\n\n> **题目简述：** 55 跳跃游戏：数组元素表示当前位置的最大跳跃长度，判断能否到达最后一个下标。 [力扣原题 ↗](https://leetcode.cn/problems/jump-game/)\n\n```python\ndef canJump(nums):\n    maxlength = 0\n    n = len(nums)\n    for i in range(n):\n        if i > maxlength:\n            return False\n        maxlength = max(maxlength, i + nums[i])\n        if maxlength > n - 1:\n            return True\n    return True\n```\n\n#### 原始解法 C：跳跃游戏 II\n\n> **题目简述：** 45 跳跃游戏 II：数组元素表示最大跳跃长度，在保证可达末尾时求最少跳跃次数。 [力扣原题 ↗](https://leetcode.cn/problems/jump-game-ii/)\n\n```python\ndef jump(nums):\n    maxlength = 0\n    end = 0\n    res = 0\n\n    for i in range(len(nums) - 1):\n        maxlength = max(maxlength, i + nums[i])\n        if i == end:\n            end = maxlength\n            res += 1\n    return res\n```\n\n#### 原始解法 D：接雨水\n\n> **题目简述：** 42 接雨水：给定各柱子的高度，计算下雨后这些柱子之间能够接住的雨水总量。 [力扣原题 ↗](https://leetcode.cn/problems/trapping-rain-water/)\n\n```python\ndef trap(height):\n    res = 0\n    lm = 0\n    rm = 0\n    l = 0\n    r = len(height) - 1\n\n    while l \u003c r:\n        lm = max(lm, height[l])\n        rm = max(rm, height[r])\n\n        if lm \u003c rm:\n            res += lm - height[l]\n            l += 1\n        else:\n            res += rm - height[r]\n            r -= 1\n    return res\n```\n\n#### 易错点\n\n- `124` 的全局答案可以左右合并，但递归返回给父节点时只能返回一条单边路径。\n- `55` 一旦 `i > maxlength` 就说明中间断档，不能继续尝试后面的下标。\n- `45` 遍历到 `len(nums) - 1` 前一位即可，否则到终点还会多计一次跳跃。\n- `42` 的 `lm/rm` 要先更新再结算当前位置，结算后再移动对应引用。\n\n## 6. 高频易错点清单\n\n| 易错点 | 典型题目 | 规避方式 |\n|---|---|---|\n| 状态定义没有“以 i 结尾” | `53`、`152` | 连续子数组题默认定义结尾状态 |\n| 二维 DP 下标错位 | `72`、`1143` | `dp[i][j]` 对应前 i 和前 j，字符用 `i - 1` |\n| 第一行第一列初始化遗漏 | `62`、`64`、`72` | 初始化写在主循环之前 |\n| 回文区间遍历顺序错误 | `5`、`131` | 按长度从短到长枚举 |\n| 背包循环方向写反 | `322`、`416` | 完全背包正序，01 背包倒序 |\n| 最小值 DP 没用 INF | `322`、`279` | 不可达状态不能初始化为 0 |\n| 乘积最大子数组只维护最大值 | `152` | 负数会让最大最小互换，必须双状态 |\n| 单词拆分重复构造过多子串 | `139` | 可按最大单词长度剪枝，或用 Trie 优化 |\n| LIS 二分边界混淆 | `300` | 严格递增用 `lower_bound` 替换第一个大于等于 |\n| 树形 DP 返回值和答案混淆 | `124` | 全局答案可左右合并，返回值只能单边延伸 |\n\n## 7. 最短复盘口诀\n\nDP 题先写状态语义，再写初始化和遍历顺序。连续子数组看“以 i 结尾”，双字符串看“前 i 和前 j”，网格看上方左方，回文看两端和内部，背包先分 01 与完全。能滚动再滚动，能贪心前先证明依赖被压缩。`70` 是线性母题，`64` 是网格母题，`72/1143` 是双串母题，`322/416` 是背包母题，`300` 是优化母题。\n\n\n\n================================================================================\n\n# 第15部分: 技巧\n\n================================================================================\n\n> 目标：本文把 Hot100 中依赖“关键观察”的题目抽象成若干可复用小模型。复习时不要死背结论，而要识别题目为什么能用进位、翻转、异或、投票、快慢引用、原地哈希或数学 DP。\n\n## 1. 技巧题的底层模型\n\n技巧题通常由某个约束触发特殊解法。每道技巧题先问六个问题：\n\n| 问题 | 如果答案是“是” | 常用处理 |\n|---|---|---|\n| 是否逐位处理并带状态 | 两数相加 | carry 进位、dummy 尾插 |\n| 是否要求原地重排数组 | 下一个排列、轮转数组、旋转图像 | 后缀性质、三次翻转、转置翻转 |\n| 是否只有一个元素出现奇数次 | 只出现一次的数字 | 异或抵消 |\n| 是否有超过一半的多数 | 多数元素 | 摩尔投票 |\n| 是否能把数组看成链表或映射 | 寻找重复数 | 快慢引用找环入口、值域二分 |\n| 是否有数学递推或状态压缩 | 爬楼梯、不同路径、完全平方数 | Fibonacci、组合数、DP/BFS |\n\n技巧题常见的小模型如下：\n\n| 小模型 | 代表题 | 关键观察 |\n|---|---|---|\n| 进位模拟 | `2 两数相加` | 两条链表逐位相加，carry 进入下一位 |\n| 后缀重排 | `31 下一个排列` | 从右找第一个下降点，再换更大数并反转后缀 |\n| 原地哈希 | `41 缺失的第一个正数` 相邻技巧题 | 值 `x` 应放到下标 `x - 1` |\n| 数组翻转 | `189 轮转数组`、`48 旋转图像` | 通过局部翻转实现整体移动 |\n| 异或抵消 | `136 只出现一次的数字` | `a ^ a = 0`，`a ^ 0 = a` |\n| 摩尔投票 | `169 多数元素` | 多数元素和非多数元素两两抵消后仍剩下 |\n| 函数图找环 | `287 寻找重复数` | 下标到值形成链，重复数是环入口 |\n| 数学 DP | `70 爬楼梯`、`62 不同路径`、`279 完全平方数` | 状态定义比公式更重要 |\n\n## 2. Hot100 技巧题型地图\n\n\n| 题型 | 题目 | 抽象能力 | 一句话记忆 |\n|---|---|---|---|\n| 进位模拟 | `2 两数相加` | 同步推进两条链表并维护 carry | 循环条件是 `l1 || l2 || carry` |\n| 后缀排列 | `31 下一个排列` | 从右找可增大的最低位 | 找下降点，换稍大的，后缀升序化 |\n| 矩阵旋转技巧 | `48 旋转图像` | 转置加水平翻转 | 90 度旋转可以拆成两个简单变换 |\n| 路径计数技巧 | `62 不同路径` | 组合数或滚动 DP | 向右和向下的排列总数 |\n| Fibonacci DP | `70 爬楼梯` | 状态压缩递推 | 到第 n 阶来自 n-1 和 n-2 |\n| 异或抵消 | `136 只出现一次的数字` | 位运算消除成对元素 | 全部异或后只剩孤立元素 |\n| 数组轮转 | `189 轮转数组` | 三次反转或环状替换 | 先整体反转，再分别反转两段 |\n| 平方数分解 | `279 完全平方数` | 完全背包 DP 或 BFS 层数 | 每个平方数可以重复使用 |\n| 重复数建模 | `287 寻找重复数` | 函数图找环入口或值域二分 | 数组值当 next 引用，重复数就是环入口 |\n| 投票抵消 | 相邻题 `169 多数元素` | 多数元素与其他元素抵消 | 票数归零就换候选 |\n\n## 3. 复习顺序建议\n\n建议按“模拟 → 原地变换 → 位运算/投票 → 数学 DP → 函数图”的顺序复习：\n\n1. `2 两数相加`：练进位模拟和 dummy 尾插。\n2. `31 下一个排列`：理解后缀降序和下一个字典序。\n3. `189 轮转数组`：掌握三次反转。\n4. `48 旋转图像`：把二维旋转拆成转置和翻转。\n5. `136 只出现一次的数字`：掌握异或抵消。\n6. `169 多数元素`：补充摩尔投票技巧。\n7. `70 爬楼梯`：练 Fibonacci 状态压缩。\n8. `62 不同路径`：对比组合数学和滚动 DP。\n9. `279 完全平方数`：理解完全背包和 BFS 层数。\n10. `287 寻找重复数`：掌握函数图找环入口和二分值域两种技巧。\n\n## 4. 关键套路详解\n\n### 4.1 模拟题要把循环条件写全\n\n`2 两数相加`需要考虑最后仍有进位。最稳的循环条件是：\n\n```text\nwhile l1 or l2 or carry:\n```\n\n每轮从两个链表取当前位，没有节点就当 0，再加上 `carry`。结果位是 `sum % 10`，下一轮进位是 `sum / 10`。\n\n### 4.2 下一个排列的关键在“后缀已经最大”\n\n从右往左找第一个 `nums[i] \u003c nums[i + 1]`，说明 `i + 1` 到末尾是非递增后缀，已经是这段后缀能形成的最大排列。要得到刚好更大的排列，需要把 `nums[i]` 换成后缀中比它大的最小元素，然后把后缀反转成升序。\n\n如果找不到下降点，整个数组是最大排列，直接反转成最小排列。\n\n### 4.3 原地翻转类题要先想“最终块顺序”\n\n`189 轮转数组`右移 k 位后，后 k 个元素要跑到前面。三次反转的本质是改变块顺序：整体反转让后半块到前面，但块内部也反了；再分别反转两块恢复内部顺序。\n\n`48 旋转图像`原始笔记先写四点轮换，关键是不重不漏地枚举左上角四分之一；进阶写法可以拆成主对角线转置和每行反转，更容易检查。\n\n### 4.4 异或适合“成对抵消”\n\n`136` 成立依赖三个性质：`x ^ x = 0`，`x ^ 0 = x`，异或满足交换律和结合律。因此所有出现两次的数会抵消，最后剩下只出现一次的数。\n\n如果有两个数只出现一次，需要先用整体异或结果中的某个 1 位把数组分成两组；如果其他数出现三次，则要用按位计数取模 3，简单异或无法处理。\n\n### 4.5 摩尔投票的本质是抵消\n\n`169` 的多数元素超过一半，所以把一个多数元素和一个非多数元素配对删除，多数元素仍然存在。候选值 `candidate` 表示当前抵消后的可能多数，`votes` 表示净票数。票数归零时，之前那段已经完全抵消，下一位可以作为新候选。\n\n如果题目不保证多数元素存在，投票后还需要再遍历验证次数。\n\n### 4.6 重复数可以建模成函数图\n\n`287` 中数组长度是 `n + 1`，值域是 `[1, n]`。把每个下标 `i` 看成节点，边是 `i: nums[i]`。因为值域有限且有重复，必然形成环，重复数就是环入口。\n\n这和链表环入口完全同构：快慢引用第一次相遇后，一个引用回到起点，两个引用同步走，第二次相遇就是入口。\n\n### 4.7 数学 DP 题先定义状态，再考虑公式\n\n`70` 是 `dp[i] = dp[i - 1] + dp[i - 2]`，可以压缩成两个变量。`62` 是二维路径计数，也可以压缩成一维。`279` 是完全平方数，每个平方数可以重复使用，因此内层从小到大枚举容量。\n\n不要把这些题只当公式题。公式忘了时，状态定义能把递推重新推出来。\n\n## 5. 抽象代码模板\n\n下面模板以原始单题笔记的参考解法为主，再把同一技巧下的小变形放进“变形点对照”。复习时重点看“为什么这个约束触发了特殊做法”；如果某段代码是 Hot100 原题之外的扩展，会在标题或表格中明确标注。\n\n### 5.1 逐位进位模拟\n\n#### 适用题型\n\n- `2 两数相加`：链表逆序存储数字。\n- 字符串或数组表示的大整数加法。\n- 任意需要把低位结果和进位传递到下一位的模拟题。\n\n#### 核心思路\n\n每轮取两个当前位置的数字和上一轮 `carry`，当前位写入 `sum % base`，下一轮进位变成 `sum / base`。循环条件必须包含 `carry`，因为两个输入都走完后仍可能多出最高位。\n\ndummy 节点用于统一处理结果链表头，避免第一位单独分支。\n\n#### 代码模板\n\n> **题目简述：** 2 两数相加：两个非空链表以逆序数字表示非负整数，求其和并以同样形式返回。 [力扣原题 ↗](https://leetcode.cn/problems/add-two-numbers/)\n\n```python\nclass ListNode:\n    def __init__(self, val=0, next=None):\n        self.val = val\n        self.next = next\n\ndef addWithCarryTemplate(a, b):\n    dummy = ListNode(-1)\n    tail = dummy\n    carry = 0\n\n    while a or b or carry:\n        total = carry\n        if a:\n            total += a.val\n            a = a.next\n        if b:\n            total += b.val\n            b = b.next\n\n        carry = total // 10\n        tail.next = ListNode(total % 10)\n        tail = tail.next\n\n    return dummy.next\n```\n\n#### 易错点\n\n- 循环条件漏掉 `carry` 会丢失最后进位。\n- 输入正序存储时不能直接套逆序模板，需要反转链表或用栈。\n- base 不一定是 10，二进制、任意进制题要替换取模和除法基数。\n\n### 5.2 后缀重排下一个排列\n\n#### 适用题型\n\n- `31 下一个排列`。\n- 字典序的下一个状态。\n- 需要原地把当前排列变成“刚好更大”的排列题。\n\n#### 核心思路\n\n从右往左找第一个 `nums[i] \u003c nums[i + 1]`，它左侧保持不变，右侧后缀已经是非递增，也就是该后缀能形成的最大排列。要让整体刚好变大，需要把 `nums[i]` 换成后缀中比它大的最小元素；交换后再反转后缀，让后缀变成最小升序。\n\n如果找不到下降点，说明整个排列已经最大，整体反转即可回到最小排列。\n\n#### 代码模板\n\n> **题目简述：** 31 下一个排列：原地生成当前整数排列的字典序下一个排列；若不存在则变为最小排列。 [力扣原题 ↗](https://leetcode.cn/problems/next-permutation/)\n\n```python\ndef nextPermutationTemplate(nums):\n    n = len(nums)\n    if n \u003c= 1: return  # 原始笔记保留这个边界，避免 n-2 在空/单元素时产生无意义下标。\n\n    i = n - 2\n\n    while i >= 0 and nums[i] >= nums[i + 1]:\n        i -= 1\n\n    if i >= 0:\n        j = n - 1\n        while nums[j] \u003c= nums[i]:\n            j -= 1\n        nums[i], nums[j] = nums[j], nums[i]\n\n    nums[i + 1:] = reversed(nums[i + 1:])\n```\n\n#### 易错点\n\n- 必须从右往左找下降点，从左找会破坏“刚好更大”。\n- 交换后后缀要反转；原后缀本来就是非递增，反转即可得到升序。\n- 有重复元素时，找交换对象要用 `>`，不能用 `>=`。\n\n### 5.3 原地翻转与矩阵变换\n\n#### 适用题型\n\n- `189 轮转数组`：三次反转实现右轮转。\n- `48 旋转图像`：原始笔记先写四点轮换，再补充“转置 + 行翻转”。\n- 要求原地改变顺序、不能额外开大数组的题。\n\n#### 核心思路\n\n数组右轮转 `k` 位后，后 `k` 个元素整体跑到前面。整体反转会改变块顺序，但块内部也被反转；再分别反转前 `k` 个和后 `n-k` 个元素，就能恢复块内部顺序。\n\n矩阵顺时针旋转 90 度有两种原地写法：原始主解是四点轮换，只枚举左上角四分之一，避免重复旋转；进阶写法是先沿主对角线转置，再反转每一行。两者都满足 O(1) 额外空间。\n\n#### 代码 A：`189` 数组轮转，三次反转\n\n> **题目简述：** 189 轮转数组：给定整数数组和非负整数 K，将数组原地向右轮转 K 个位置。 [力扣原题 ↗](https://leetcode.cn/problems/rotate-array/)\n\n```python\ndef reverseRange(nums, left, right):\n    # 原始笔记提醒：既然目标是 O(1) 空间，手写反转函数应直接原地修改，不需要返回 vector。\n    while left \u003c right:\n        nums[left], nums[right] = nums[right], nums[left]\n        left += 1\n        right -= 1\n\ndef rotateArrayByReverseTemplate(nums, k):\n    n = len(nums)\n    if n == 0: return\n\n    k %= n\n    reverseRange(nums, 0, n - 1)\n    reverseRange(nums, 0, k - 1)\n    reverseRange(nums, k, n - 1)\n```\n\n#### 代码 B：`48` 矩阵旋转，四点轮换原始写法\n\n> **题目简述：** 48 旋转图像：给定 N×N 方阵，将图像原地顺时针旋转九十度。 [力扣原题 ↗](https://leetcode.cn/problems/rotate-image/)\n\n```python\ndef rotateMatrixByFourSwapTemplate(matrix):\n    n = len(matrix)\n    if n \u003c= 1:\n        return\n\n    for i in range(n // 2):\n        for j in range((n + 1) // 2):\n            matrix[i][j], matrix[j][n - 1 - i] = matrix[j][n - 1 - i], matrix[i][j]\n            matrix[n - 1 - i][n - 1 - j], matrix[n - 1 - j][i] = matrix[n - 1 - j][i], matrix[n - 1 - i][n - 1 - j]\n            matrix[n - 1 - i][n - 1 - j], matrix[i][j] = matrix[i][j], matrix[n - 1 - i][n - 1 - j]\n```\n\n#### 代码 C：`48` 矩阵旋转，转置 + 行翻转进阶写法\n\n> **题目简述：** 48 旋转图像：给定 N×N 方阵，将图像原地顺时针旋转九十度。 [力扣原题 ↗](https://leetcode.cn/problems/rotate-image/)\n\n```python\ndef rotateMatrixByTransformTemplate(matrix):\n    n = len(matrix)\n    if n \u003c= 1: return\n\n    for r in range(0, n):\n        for c in range(r + 1, n):\n            matrix[r][c], matrix[c][r] = matrix[c][r], matrix[r][c]\n\n    for row_key, row_value in matrix.items():\n        row.reverse()\n```\n\n#### 变形点对照\n\n| 题目/写法 | 原地操作 | 边界控制 | 关键风险 |\n|---|---|---|---|\n| `189` 三次反转 | 整体反转、前 `k` 反转、后段反转 | `k %= n`，`n == 0` 直接返回 | helper 不应返回新数组 |\n| `48` 四点轮换 | 每次同时轮换四个角 | `i \u003c n/2`，`j \u003c (n+1)/2` | 枚举范围不对会重转或漏转 |\n| `48` 转置翻转 | 主对角线转置 + 每行 reverse | 只交换 `c > r` | 转置交换两次等于没换 |\n\n#### 易错点\n\n- `k` 必须先对 `n` 取模，否则 `k` 作为切分下标 或手写区间可能越界。\n- 四点轮换必须选对左上角四分之一，不能把所有格子都轮一遍。\n- 矩阵转置只交换 `c > r` 的位置，否则会换两次等于没换。\n- 逆时针旋转的翻转方向不同，不能直接套顺时针模板。\n\n### 5.4 异或抵消与位计数变体\n\n#### 适用题型\n\n- `136 只出现一次的数字`：其他数字都出现两次，这是原始 Hot100 笔记主解。\n- 两个数字各出现一次、其余数字出现两次的变体。\n- 其他数字出现三次、只有一个数字出现一次的按位计数扩展。\n\n#### 核心思路\n\n`136` 的原始解法只需要整体异或：`x ^ x = 0`，`x ^ 0 = x`，且异或满足交换律和结合律，所以所有成对数字会抵消，只剩唯一数字。\n\n后两个写法作为同一位运算模型的扩展：两个异常值时，用 `a ^ b` 中任意一个为 1 的位分组；其他数出现三次时，用每一位出现次数对 3 取模恢复答案。\n\n#### 代码 A：`136` 一个数出现一次，原始写法\n\n> **题目简述：** 136 只出现一次的数字：非空数组中除一个元素出现一次外其余均出现两次，找出该唯一元素。 [力扣原题 ↗](https://leetcode.cn/problems/single-number/)\n\n```python\ndef singleNumberByXorTemplate(nums):\n    ans = 0\n    for x in nums:\n        ans ^= x  # 相同数字异或后抵消为 0。\n    return ans\n```\n\n#### 代码 B：两个数出现一次，扩展写法\n\n> **题目简述：** 260 只出现一次的数字 III：恰有两个元素出现一次，其余均出现两次，返回这两个只出现一次的元素。 [力扣原题 ↗](https://leetcode.cn/problems/single-number-iii/)\n\n```python\ndef twoSingleNumbersByXorTemplate(nums):\n    xor_all = 0\n    for x in nums:\n        xor_all ^= x\n\n    lowbit = xor_all & -xor_all\n    a = 0\n    b = 0\n    for x in nums:\n        if x & lowbit:\n            a ^= x\n        else:\n            b ^= x\n    return a, b\n```\n\n#### 代码 C：其他数出现三次，扩展写法\n\n> **题目简述：** 137 只出现一次的数字 II：一个元素出现一次，其余元素均出现三次，返回只出现一次的元素。 [力扣原题 ↗](https://leetcode.cn/problems/single-number-ii/)\n\n```python\ndef singleNumberWhenOthersAppearThreeTimesTemplate(nums):\n    ans = 0\n\n    for bit in range(32):\n        count = 0\n        for x in nums:\n            count += ((x & 0xFFFFFFFF) >> bit) & 1\n\n        if count % 3 != 0:\n            ans |= 1 \u003c\u003c bit\n\n    if ans >= 1 \u003c\u003c 31:\n        ans -= 1 \u003c\u003c 32\n    return ans\n```\n\n#### 变形点对照\n\n| 模型 | 触发条件 | 是否原始 Hot100 主解 | 关键动作 |\n|---|---|---|---|\n| 整体异或 | 只有一个数出现一次，其余都出现两次 | 是，`136` 原始解法 | 全部 `ans ^= x` |\n| lowbit 分组 | 两个数出现一次，其余都出现两次 | 否，位运算扩展 | 用 `a ^ b` 的最低 1 位分组 |\n| 按位计数 | 其他数出现三次 | 否，位运算扩展 | 每位计数 `% 3` 后恢复答案 |\n\n#### 易错点\n\n- 只有“其他数出现两次”才能直接整体异或。\n- `lowbit` 分组依赖两个异常值在该位不同，不能随便选位。\n- 位计数扩展处理第 31 位时用 `unsigned` 更稳，避免 `1 \u003c\u003c 31` 的 signed 边界问题。\n\n### 5.5 摩尔投票与 n/3 双候选\n\n#### 适用题型\n\n- `169 多数元素`：存在出现次数超过 `n / 2` 的元素。\n- 出现次数超过 `n / 3` 的所有元素。\n- 所有“超过某个比例的元素数量有限，可以用抵消找候选”的题。\n\n#### 核心思路\n\n摩尔投票的本质是抵消。超过一半的元素和其他元素两两抵消后一定仍有剩余。`votes == 0` 时说明当前片段已经抵消完，可以从下一个元素开始选择新候选。\n\n超过 `n / 3` 的元素最多两个，因此维护两个候选和两个票数。第一遍只找候选，第二遍必须验证，因为投票过程只能保证可能性，不能保证候选一定合法。\n\n#### 代码 A：超过 n/2\n\n> **题目简述：** 169 多数元素：给定长度为 N 的数组，找出出现次数严格超过 N/2 且保证存在的元素。 [力扣原题 ↗](https://leetcode.cn/problems/majority-element/)\n\n```python\ndef majorityVoteTemplate(nums):\n    candidate = 0\n    votes = 0\n\n    for x in nums:\n        if votes == 0:\n            candidate = x\n            votes = 1\n        elif x == candidate:\n            votes += 1\n        else:\n            votes -= 1\n\n    return candidate\n```\n\n#### 代码 B：超过 n/3 双候选\n\n> **题目简述：** 229 多数元素 II：给定整数数组，返回所有出现次数超过 floor(N/3) 的元素。 [力扣原题 ↗](https://leetcode.cn/problems/majority-element-ii/)\n\n```python\ndef majorityVoteN3Template(nums):\n    candidate1 = 0\n    candidate2 = 1  # 初始化成不同值，避免空票阶段误判相同候选。\n    vote1 = 0\n    vote2 = 0\n\n    for x in nums:\n        if x == candidate1:\n            vote1 += 1\n        elif x == candidate2:\n            vote2 += 1\n        elif vote1 == 0:\n            candidate1 = x\n            vote1 = 1\n        elif vote2 == 0:\n            candidate2 = x\n            vote2 = 1\n        else:\n            vote1 -= 1\n            vote2 -= 1\n\n    count1 = 0\n    count2 = 0\n    for x in nums:\n        if x == candidate1:\n            count1 += 1\n        elif x == candidate2:\n            count2 += 1\n\n    ans = []\n    n = len(nums)\n    if count1 > n / 3:\n        ans.append(candidate1)\n    if count2 > n / 3:\n        ans.append(candidate2)\n    return ans\n```\n\n#### 易错点\n\n- 投票得到的是候选；如果题目不保证答案存在，必须二次计数验证。\n- `n/3` 版本判断顺序很重要：先匹配已有候选，再看空票位。\n- 两个候选不能相同，否则会重复计票和重复输出。\n\n### 5.6 Floyd 函数图判环\n\n#### 适用题型\n\n- `287 寻找重复数`：数组值域构成 `i: nums[i]` 的函数图。\n- 链表环入口问题。\n- 不能修改数组、只能用 `O(1)` 额外空间寻找重复入口的题。\n\n#### 核心思路\n\n把下标看作节点，`nums[i]` 看作下一条边。由于长度是 `n + 1`、值域是 `[1, n]`，从 0 出发一定会进入环，重复数就是环入口。\n\n原始笔记采用和环形链表 II 一致的初始化：`slow = fast = 0`，第一阶段先各自走一步再判断相遇；第二阶段再让 `head = 0` 与相遇点同步走，最终相遇位置就是入口。Floyd 初始化方式可以有多种，但第一阶段起点和第二阶段起点必须配套，不能混着写。\n\n#### 代码模板\n\n> **题目简述：** 287 寻找重复数：长度 N+1 的数组仅含 1 至 N，找出重复数且不能修改数组、额外空间为常数。 [力扣原题 ↗](https://leetcode.cn/problems/find-the-duplicate-number/)\n\n```python\ndef findDuplicateByFloydTemplate(nums):\n    slow = 0\n    fast = 0\n\n    # 原始写法是 do-while 语义：先沿函数图走，再判断是否相遇。\n    while True:\n        slow = nums[slow]  # 等价于 slow = slow.next\n        fast = nums[nums[fast]]  # 等价于 fast = fast.next.next\n        if fast == slow:\n            break\n\n    head = 0\n    while slow != head:\n        slow = nums[slow]\n        head = nums[head]\n\n    return slow  # 入环口即重复元素。\n```\n\n#### 变形点对照\n\n| 场景 | 第一阶段初始化 | 第二阶段初始化 | 注意事项 |\n|---|---|---|---|\n| `287` 原始写法 | `slow = fast = 0`，循环内先走 | `head = 0`，`slow` 留在相遇点 | 与链表环入口写法一致 |\n| 预走一步写法 | `slow = nums[0]`，`fast = nums[nums[0]]` | 通常仍需从 `0` 配套推导 | 不要把两种初始化随意混合 |\n| 链表环入口 | `slow/fast = head` | 新引用回 `head` | 节点引用和数组下标语义对应 |\n\n#### 易错点\n\n- 该模板依赖值域 `[1, n]`，否则 `nums[nums[fast]]` 可能越界。\n- 第二阶段起点必须和第一阶段初始化配套；不要一会儿从 `nums[0]`，一会儿从 `0`。\n- Floyd 找的是重复值对应的环入口，不会告诉你重复出现了几次。\n\n### 5.7 原地标记与原地哈希\n\n#### 适用题型\n\n- `41 缺失的第一个正数` 一类原地哈希题。\n- 数组长度为 `n`，目标值域也与 `[1, n]` 强相关的题。\n- 允许修改数组、要求 `O(1)` 额外空间的存在性或缺失值问题。\n\n#### 核心思路\n\n原地哈希的核心是“值 `x` 应该放到下标 `x - 1`”。遍历数组时，只要 `nums[i]` 在 `[1, n]` 内，并且它还没待在正确位置，就不断交换到目标下标。整理完后，第一个 `nums[i] != i + 1` 的位置就是缺失的最小正数。\n\n注意原始单题笔记代码里边界写成了 `nums[i] \u003c n`，这会漏掉数字 `n` 应该放到下标 `n - 1` 的情况；专题模板保留原始“原地哈希”思路，但把边界修正为 `nums[i] \u003c= n`。\n\n原地标记也常用“把出现过的值对应位置改成负数”表示访问，但要先清理无关值，并小心重复标记。\n\n#### 代码 A：交换式原地哈希\n\n> **题目简述：** 41 缺失的第一个正数：给定无序整数数组，以线性时间和常数额外空间找出最小缺失正整数。 [力扣原题 ↗](https://leetcode.cn/problems/first-missing-positive/)\n\n```python\ndef firstMissingPositiveByPlacementTemplate(nums):\n    n = len(nums)\n\n    for i in range(0, n):\n        while nums[i] >= 1 and nums[i] \u003c= n and nums[nums[i] - 1] != nums[i]:\n            target = nums[i] - 1\n            nums[i], nums[target] = nums[target], nums[i]\n\n    for i in range(0, n):\n        if nums[i] != i + 1:\n            return i + 1\n    return n + 1\n```\n\n#### 代码 B：负号原地标记\n\n> **题目简述：** 41 缺失的第一个正数：给定无序整数数组，以线性时间和常数额外空间找出最小缺失正整数。 [力扣原题 ↗](https://leetcode.cn/problems/first-missing-positive/)\n\n```python\ndef firstMissingPositiveBySignMarkTemplate(nums):\n    n = len(nums)\n\n    # 非 [1, n] 的值不会影响答案，先改成哨兵 n + 1。\n    for x in nums:\n        if x \u003c= 0 or x > n:\n            x = n + 1\n\n    for x in nums:\n        val = abs(x)\n        if val >= 1 and val \u003c= n:\n            nums[val - 1] = -abs(nums[val - 1])\n\n    for i in range(0, n):\n        if nums[i] > 0:\n            return i + 1\n    return n + 1\n```\n\n#### 易错点\n\n- 交换式原地哈希必须用 `while`，一次交换后当前位置可能还是错的。\n- 合法值边界应是 `1 \u003c= nums[i] \u003c= n`；写成 `\u003c n` 会漏掉数字 `n`。\n- 条件中必须判断目标位置是否已有相同值，否则重复数字会导致死循环。\n- 负号标记前要清理无关值，标记时要用 `abs` 避免重复标记影响下标。\n\n### 5.8 数学 DP 状态压缩\n\n#### 适用题型\n\n- `70 爬楼梯`：Fibonacci 型递推。\n- `62 不同路径`：网格路径计数。\n- `279 完全平方数`：完全背包最少数量。\n\n#### 核心思路\n\n技巧题里的数学 DP 不要只背公式，而要先定义状态。`70` 的状态只依赖前两项，可以压缩成两个变量；`62` 的 `dp[c]` 表示当前行第 `c` 列路径数，滚动更新即可；`279` 是完全背包，每个平方数可以重复使用，所以容量从小到大枚举。\n\n#### 代码 A：Fibonacci 状态压缩\n\n> **题目简述：** 70 爬楼梯：每次可爬一阶或两阶，给定总阶数 N，求到达楼顶的不同方式数。 [力扣原题 ↗](https://leetcode.cn/problems/climbing-stairs/)\n\n```python\ndef climbStairsFibonacciTemplate(n):\n    if n \u003c= 2:\n        return n\n\n    prev2 = 1\n    prev1 = 2\n    for i in range(3, n + 1):\n        cur = prev1 + prev2\n        prev2 = prev1\n        prev1 = cur\n    return prev1\n```\n\n#### 代码 B：网格路径滚动 DP\n\n> **题目简述：** 62 不同路径：机器人位于网格左上角且只能向右或向下，求到右下角的不同路径数。 [力扣原题 ↗](https://leetcode.cn/problems/unique-paths/)\n\n```python\ndef uniquePathsRollingDpTemplate(m, n):\n    dp = [1 for _ in range(n)]\n\n    for r in range(1, m):\n        for c in range(1, n):\n            dp[c] += dp[c - 1]\n\n    return dp[n - 1]\n```\n\n#### 代码 C：完全平方数完全背包\n\n> **题目简述：** 279 完全平方数：给定正整数 N，求和为 N 所需的完全平方数的最少数量。 [力扣原题 ↗](https://leetcode.cn/problems/perfect-squares/)\n\n```python\ndef perfectSquaresDpTemplate(n):\n    # 原始笔记使用 n + 1 作为哨兵：最差全用 1，也只需要 n 个数，所以 n + 1 一定足够大。\n    dp = [n + 1 for _ in range(n + 1)]\n    dp[0] = 0\n\n    # 外层枚举物品：每个完全平方数都可以重复使用。\n    for x in range(1, 0):\n        square = x * x\n\n        # 完全背包正序枚举容量，允许同一个 square 在本轮被重复使用。\n        for sum in range(square, n + 1):\n            dp[sum] = min(dp[sum], dp[sum - square] + 1)\n\n    return dp[n]\n```\n\n#### 易错点\n\n- `70` 中 `n = 1` 和 `n = 2` 的初值要和题目定义一致。\n- `62` 的一维 DP 从左到右更新，因为当前值旧状态代表上方，新左值代表左方。\n- `279` 是可重复使用平方数，内层容量必须正序；若每个数只能用一次才倒序。\n\n## 6. 高频易错点清单\n\n| 易错点 | 典型题目 | 规避方式 |\n|---|---|---|\n| 两数相加漏掉最后进位 | `2` | 循环条件写 `l1 || l2 || carry` |\n| 链表结果头处理复杂 | `2` | 使用 `dummy + cur` 尾插 |\n| 下一个排列忽略短数组边界 | `31` | 先处理 `if (n \u003c= 1) return` |\n| 下一个排列从左找下降点 | `31` | 必须从右往左找第一个 `nums[i] \u003c nums[i+1]` |\n| 交换后没有反转后缀 | `31` | 后缀要变成最小升序排列 |\n| 数组轮转 k 没取模 | `189` | 先 `k %= n`；手写反转 helper 应返回 `void` |\n| 旋转矩阵枚举范围重复 | `48` 四点轮换 | 只枚举左上角四分之一：`i \u003c n/2`、`j \u003c (n+1)/2` |\n| 旋转矩阵转置交换两次 | `48` 转置翻转 | 只交换 `c > r` 的位置 |\n| 异或用于错误出现次数模型 | `136` | 只有成对抵消时直接异或；位计数变体要标为扩展 |\n| 位计数写 `1 \u003c\u003c 31` | 位运算扩展 | 用 `1u \u003c\u003c bit` 和 `unsigned` 处理符号位 |\n| 摩尔投票误当计数器 | `169` | 它只找候选，不保证无条件合法 |\n| 重复数快慢引用起点混乱 | `287` | 使用原始 `slow = fast = 0` 配套 `head = 0`，不要混用初始化 |\n| 原地哈希合法边界写窄 | `41` | 条件应包含 `nums[i] \u003c= n`，数字 `n` 要放到下标 `n-1` |\n| 完全平方数内层方向写反 | `279` | 可重复使用，内层从小到大；哨兵用原始笔记的 `n + 1` |\n| 不同路径把二维边界写复杂 | `62` | 一维 `dp` 初始化为 1 即覆盖第一行第一列 |\n\n## 7. 最短复盘口诀\n\n技巧题先找触发条件：逐位相加看 `carry`，下个排列看右侧后缀，数组轮转三次反转，矩阵旋转优先记原始四点轮换、再记转置加行翻转；成对抵消用异或，位计数变体要标清扩展；多数抵消用投票；重复数按原始 `slow = fast = 0` 找函数图入口；原地哈希边界包含 `n`；爬楼梯是 Fibonacci，不同路径看上左转移，完全平方数是可重复选择的完全背包。\n\n================================================================================\n\n# 第16部分: 排序\n\n================================================================================\n\n> 目标：本文把 Hot100 中“排序作为预处理、排序作为结构、排序作为选择工具”的题目抽象成若干可复用模板。复习时先判断排序带来了什么单调性，再决定用双引用、区间扫描、三路划分、归并、堆或桶。\n\n## 1. 排序题的底层模型\n\nHot100 里的排序重点在于“排序以后问题结构发生了什么变化”。每道排序题先问五个问题：\n\n| 问题 | 如果答案是“是” | 常用处理 |\n|---|---|---|\n| 排序后相同元素会聚在一起吗 | 字母异位词、频次统计、颜色分类 | 排序 key、分组、三路划分 |\n| 排序后可以双引用收缩吗 | 三数之和、合并区间 | 固定一个点，左右引用或线性扫描 |\n| 排序后区间关系更清楚吗 | 合并区间 | 按左端点排序，维护当前合并区间 |\n| 只需要第 K 个或前 K 个吗 | 数组第 K 大、前 K 高频 | 快速选择、堆、桶 |\n| 数据是链表或数据流吗 | 排序链表、数据流中位数 | 归并排序、双堆维护有序分割 |\n\n排序题常见抽象能力如下：\n\n| 能力 | 代表题 | 排序带来的变化 |\n|---|---|---|\n| 去重与相邻比较 | `49 字母异位词分组`、`169 多数元素` | 相同特征聚集 |\n| 双引用扫描 | `15 三数之和` | 有序后和的大小可以指导移动 |\n| 区间线性合并 | `56 合并区间` | 只需和当前区间尾部比较 |\n| 原地分区 | `75 颜色分类` | 小、中、大三段边界可维护 |\n| 选择第 K | `215 数组第 K 大` | 不必完整排序，只定位目标秩 |\n| 多路/分治归并 | `148 排序链表` | 拆分后合并有序子结构 |\n| 频次排序 | `347 前 K 高频元素` | 先统计，再按频次选择 |\n| 动态有序结构 | `295 数据流中位数` | 用两个堆维护有序左右半区 |\n\n## 2. Hot100 排序题型地图\n\n\n| 题型 | 题目 | 抽象能力 | 一句话记忆 |\n|---|---|---|---|\n| 排序后双引用 | `15 三数之和` | 固定一个数，双引用找两数和 | 去重比找到答案更容易错 |\n| 排序 key 分组 | `49 字母异位词分组` | 把同类字符串映射到同一个 key | 排序后的字符串就是异位词签名 |\n| 区间排序扫描 | `56 合并区间` | 按左端点排序后维护右端点 | 能接上就扩右端，接不上就开新区间 |\n| 三路划分 | `75 颜色分类` | 荷兰国旗问题 | `0` 扔左边，`2` 扔右边，`1` 留中间 |\n| 链表归并排序 | `148 排序链表` | 快慢引用拆分，merge 合并 | 链表排序优先归并，不优先快排 |\n| 多数元素排序视角 | `169 多数元素` | 排序后中位数必是多数元素 | 更优解是摩尔投票，排序是理解入口 |\n| 第 K 大选择 | `215 数组第K个最大元素` | 快速选择、堆 | 目标下标是 `n - k` |\n| 数据流中位数 | `295 数据流的中位数` | 双堆维护左右半区 | 左边最大堆，右边最小堆 |\n| 频次选择 | `347 前 K 个高频元素` | 哈希统计后堆/桶/快选 | 先数频次，再选前 K |\n\n## 3. 复习顺序建议\n\n建议按“排序预处理 → 原地分区 → 选择问题 → 归并和动态结构”的顺序复习：\n\n1. `49 字母异位词分组`：理解排序 key 的作用。\n2. `56 合并区间`：练排序后线性扫描。\n3. `15 三数之和`：练排序后双引用和去重。\n4. `75 颜色分类`：掌握三路划分边界。\n5. `169 多数元素`：理解排序中位数视角，并对比摩尔投票。\n6. `215 数组第 K 大`：练快速选择和堆两种方案。\n7. `347 前 K 高频元素`：练频次统计后的选择。\n8. `148 排序链表`：练归并排序在链表上的实现。\n9. `295 数据流中位数`：练动态维护有序分割。\n\n## 4. 关键套路详解\n\n### 4.1 排序后先问“什么东西相邻了”\n\n排序最常见的价值是把同类元素放到一起。`49` 中每个字符串排序后得到统一 key，异位词自然归到同一组。`169` 中多数元素出现次数超过一半，排序后中间位置一定是它。\n\n但排序通常会带来 O(n log n)，如果题目有更强要求，要考虑哈希、计数、投票或选择算法。\n\n### 4.2 排序后双引用的前提是方向可判断\n\n`15 三数之和`排序后固定 `i`，剩余区间用左右引用。当前和太小就移动左引用增大，当前和太大就移动右引用减小。这个方向性来自数组有序。\n\n三数之和真正的难点是去重：固定点要跳过重复值，找到答案后左右引用也要跳过重复值。\n\n### 4.3 区间合并只看当前合并区间的右端点\n\n`56 合并区间`按左端点排序后，后面的区间左端点不会更小。维护当前合并区间 `[curL, curR]`：如果新区间 `l \u003c= curR`，说明重叠，更新 `curR = max(curR, r)`；否则把当前区间入答案，开启新区间。\n\n### 4.4 三路划分维护三个区域\n\n`75 颜色分类`是荷兰国旗问题。维护三个区间：`[0, left)` 全是 0，`[left, i)` 全是 1，`(right, n - 1]` 全是 2，`[i, right]` 是未知区。\n\n遇到 0，和 `left` 交换后 `left += 1`、`i += 1`；遇到 2，和 `right` 交换后只 `right -= 1`，不能立刻 `i += 1`，因为换过来的元素还没检查。\n\n### 4.5 第 K 大不一定要完整排序\n\n`215` 的目标是第 K 大，也就是升序下标 `n - k`。快速选择每次 partition 后只递归包含目标下标的一侧，平均 O(n)。如果更重视实现稳定性，可以用大小为 K 的小顶堆，复杂度 O(n log k)。\n\n### 4.6 链表排序优先归并\n\n数组快排依赖随机访问，链表不适合。链表排序优先用归并：快慢引用找中点并断开，递归排序两段，再用合并两个有序链表的模板合并。\n\n切分时必须断链，否则递归不会收敛。\n\n### 4.7 数据流中位数是动态维护排序结果的一半\n\n`295` 不可能每插入一个数就排序一次。用大顶堆保存较小的一半，用小顶堆保存较大的一半，并保持两堆大小差不超过 1。中位数要么是大顶堆堆顶，要么是两堆堆顶平均。\n\n## 5. 抽象代码模板\n\n下面模板按排序带来的结构变化组织。刷题时先判断排序是为了产生 key、制造单调性、合并区间、原地分区、选择目标秩，还是维护动态有序分割。\n\n### 5.1 排序 Key 分组与计数 Key 分组\n\n#### 适用题型\n\n- `49 字母异位词分组`：排序后的字符串作为签名。\n- 字符集固定时，用计数 key 避免每个字符串排序。\n- 多字段对象分组：排序或规范化后作为哈希 key。\n\n#### 核心思路\n\n排序 key 的本质是把等价对象映射到同一个签名。异位词排序后字符顺序完全一致，因此可直接作为 key；如果字符集固定，也可以用 26 维计数拼接成 key。两种题型实现不同，分别给出函数。\n\n#### 代码 A：排序字符串作为 key\n\n> **题目简述：** 49 字母异位词分组：给定字符串数组，将包含相同字符及频次的字母异位词归为一组。 [力扣原题 ↗](https://leetcode.cn/problems/group-anagrams/)\n\n```python\ndef groupAnagramsBySortedKey(strs):\n    groups = {}\n    for s in strs:\n        key = \"\".join(sorted(s))\n        groups.setdefault(key, []).append(s)\n    return list(groups.values())\n```\n\n#### 代码 B：26 维计数作为 key\n\n> **题目简述：** 49 字母异位词分组：给定字符串数组，将包含相同字符及频次的字母异位词归为一组。 [力扣原题 ↗](https://leetcode.cn/problems/group-anagrams/)\n\n```python\ndef buildCountKey(s):\n    cnt = [0] * 26\n    for ch in s:\n        cnt[ord(ch) - ord('a')] += 1\n    return \"\".join(f\"#{x}\" for x in cnt)\n\ndef groupAnagramsByCountKey(strs):\n    groups = {}\n    for s in strs:\n        groups.setdefault(buildCountKey(s), []).append(s)\n    return list(groups.values())\n```\n\n#### 易错点\n\n- 排序 key 会带来每个字符串 O(L log L) 成本；计数 key 是 O(L)。\n- 计数 key 拼接必须加分隔符。\n- 如果题目要求保留原顺序，分组内 `append(s)` 不要改动元素内容。\n\n### 5.2 排序后双引用：三数之和\n\n#### 适用题型\n\n- `15 三数之和`。\n- 有序两数之和、最接近三数之和。\n- k-sum 递归固定若干数后，最后降到双引用 two-sum。\n\n#### 核心思路\n\n排序后，固定 `i`，剩余区间 `[i + 1, n - 1]` 用左右引用。当前和太小移动 `left`，当前和太大移动 `right`。答案去重是循环不变量的一部分：固定点要去重，找到一个三元组后左右也要跳过重复值。\n\n#### 代码模板\n\n> **题目简述：** 15 三数之和：给定整数数组，找出所有和为零且不重复的三元组。 [力扣原题 ↗](https://leetcode.cn/problems/3sum/)\n\n```python\ndef threeSumSortedTwoPointers(nums):\n    nums.sort()\n    ans = []\n    n = len(nums)\n\n    for i in range(n):\n        if i > 0 and nums[i] == nums[i - 1]:\n            continue\n        if nums[i] > 0:\n            break\n\n        left = i + 1\n        right = n - 1\n        while left \u003c right:\n            total = nums[i] + nums[left] + nums[right]\n            if total == 0:\n                ans.append([nums[i], nums[left], nums[right]])\n                left += 1\n                right -= 1\n                while left \u003c right and nums[left] == nums[left - 1]:\n                    left += 1\n                while left \u003c right and nums[right] == nums[right + 1]:\n                    right -= 1\n            elif total \u003c 0:\n                left += 1\n            else:\n                right -= 1\n\n    return ans\n```\n\n#### 易错点\n\n- 去重应在枚举过程中完成，不能最后只对答案套 `set`。\n- 排序会丢失原始下标，返回下标类变形要保存原位置。\n- Python 整数不会固定宽度溢出；三数相加仍要注意排序和去重逻辑。\n\n### 5.3 区间排序扫描\n\n#### 适用题型\n\n- `56 合并区间`。\n- 插入区间后合并。\n- 会议室、区间覆盖等排序扫描基础题。\n\n#### 核心思路\n\n按左端点排序后，后面的区间左端点不会更小。维护当前合并区间 `[curL, curR]`：如果新区间 `l \u003c= curR`，说明有重叠，扩展右端点；否则把当前区间加入答案，并开启新区间。循环结束后别忘了加入最后一个区间。\n\n#### 代码模板\n\n> **题目简述：** 56 合并区间：给定若干闭区间，合并所有重叠区间并返回互不重叠的结果。 [力扣原题 ↗](https://leetcode.cn/problems/merge-intervals/)\n\n```python\ndef mergeIntervalsAfterSorting(intervals):\n    if not intervals: return []\n\n    intervals = \"\".join(sorted(intervals))  # 默认先按左端点，再按右端点。\n    ans = []\n\n    curL = intervals[0][0]\n    curR = intervals[0][1]\n\n    for i in range(1, len(intervals)):\n        l = intervals[i][0]\n        r = intervals[i][1]\n\n        if l \u003c= curR:\n            curR = max(curR, r)\n        else:\n            ans.append([curL, curR])\n            curL = l\n            curR = r\n\n    ans.append([curL, curR])\n    return ans\n```\n\n#### 易错点\n\n- 必须按左端点排序，不能按右端点排序后套这个模板。\n- 闭区间重叠条件是 `l \u003c= curR`；开区间可能要改成 `l \u003c curR`。\n- 循环结束后要把当前区间加入答案。\n\n### 5.4 三路划分与荷兰国旗\n\n#### 适用题型\n\n- `75 颜色分类`。\n- 快排三向 partition。\n- 按 pivot 分成小于、等于、大于三段的原地分类题。\n\n#### 核心思路\n\n维护四段区间：`[0, low)` 是小区，`[low, i)` 是中区，`[i, high]` 是未知区，`(high, n-1]` 是大区。扫描未知区时，遇小元素交换到左侧并前进；遇大元素交换到右侧但 `i` 不动，因为换回来的元素仍未知。\n\n#### 代码 A：颜色分类\n\n> **题目简述：** 75 颜色分类：原地整理仅含 0、1、2 的数组，使相同颜色相邻并按数值升序排列。 [力扣原题 ↗](https://leetcode.cn/problems/sort-colors/)\n\n```python\ndef sortColorsDutchFlag(nums):\n    low = 0\n    i = 0\n    high = len(nums) - 1\n\n    while i \u003c= high:\n        if nums[i] == 0:\n            nums[low], nums[i] = nums[i], nums[low]\n            low += 1\n            i += 1\n        elif nums[i] == 2:\n            nums[i], nums[high] = nums[high], nums[i]\n            high -= 1  # i 不动，继续检查换来的未知元素。\n        else:\n            i += 1\n```\n\n#### 代码 B：按 pivot 三向切分\n\n> **题目简述：** 三向切分模板：给定数组区间和 pivot，原地划分为小于、等于和大于 pivot 的三段，并返回等值段边界。\n\n```python\ndef threeWayPartitionByPivot(nums, left, right, pivot):\n    low = left\n    i = left\n    high = right\n\n    while i \u003c= high:\n        if nums[i] \u003c pivot:\n            nums[low], nums[i] = nums[i], nums[low]\n            low += 1\n            i += 1\n        elif nums[i] > pivot:\n            nums[i], nums[high] = nums[high], nums[i]\n            high -= 1\n        else:\n            i += 1\n\n    return low, high\n```\n\n#### 易错点\n\n- 遇到大元素和右端交换后不能 `i += 1`。\n- `low/i/high` 的区间语义要先写清楚。\n- 三向 partition 返回等值区间，不能当单个 pivot 下标。\n\n### 5.5 快速选择与堆选择第 K\n\n#### 适用题型\n\n- `215 数组中的第 K 个最大元素`。\n- 只关心目标秩，不要求完整排序。\n- 数据流或更重视稳定实现时可用大小为 K 的小顶堆。\n\n#### 核心思路\n\n原始笔记提供两种写法：稳定好写的小顶堆，以及随机 pivot 的三路快速选择。三路快选不需要完整排序，而是把数组按 `> pivot`、`== pivot`、`\u003c pivot` 分成三段；因为题目问第 K 大，所以先看 `big` 段够不够，否则扣掉 `big/equal` 的规模去 `small` 段继续找。\n\n#### 代码 A：随机 pivot 三路快速选择原始解法\n\n> **题目简述：** 215 数组中的第 K 个最大元素：给定无序数组和 K，返回按排序名次计算的第 K 大元素，而非第 K 个不同值。 [力扣原题 ↗](https://leetcode.cn/problems/kth-largest-element-in-an-array/)\n\n```python\ndef quickSelectKthLargestTemplate(nums, k):\n    if not nums or k \u003c 1 or k > len(nums):\n        raise ValueError(\"k must be in the range [1, len(nums)]\")\n\n    pivot = nums[len(nums) // 2]\n    small = []\n    equal = []\n    big = []\n\n    for num in nums:\n        if num > pivot:\n            big.append(num)\n        elif num \u003c pivot:\n            small.append(num)\n        else:\n            equal.append(num)\n\n    if k \u003c= len(big):\n        return quickSelectKthLargestTemplate(big, k)\n    if k > len(big) + len(equal):\n        return quickSelectKthLargestTemplate(small, k - len(big) - len(equal))\n    return pivot\n\ndef findKthLargestByQuickSelect(nums, k):\n    return quickSelectKthLargestTemplate(nums, k)\n```\n\n#### 代码 B：小顶堆选择第 K 大原始解法\n\n> **题目简述：** 215 数组中的第 K 个最大元素：给定无序数组和 K，返回按排序名次计算的第 K 大元素，而非第 K 个不同值。 [力扣原题 ↗](https://leetcode.cn/problems/kth-largest-element-in-an-array/)\n\n```python\ndef findKthLargestByMinHeap(nums, k):\n    heap = []\n\n    for x in nums:\n        heap.append(x)\n        if len(heap) > k:\n            heap.pop()  # 堆里只保留当前最大的 K 个数，堆顶就是这 K 个里最小的。\n\n    return heap[0]\n```\n\n#### 易错点\n\n- 原始三路快选按“第 K 大”直接递归，不需要换算成 `n - k`。\n- 进入 `small` 段时，新的 K 必须扣掉 `len(big) + len(equal)`。\n- 堆方案要用小顶堆保存 K 个最大值，超出 K 时弹掉当前最小值。\n\n### 5.6 链表归并排序\n\n#### 适用题型\n\n- `148 排序链表`。\n- 链表结构需要 O(n log n) 排序。\n- 需要复用合并两个有序链表的题。\n\n#### 核心思路\n\n链表不适合随机访问，优先用归并排序。快慢引用找到中点后必须断链，使递归规模变小；分别排序左右两段后，用合并两个有序链表的模板合并。递归版有 O(log n) 栈空间，自底向上迭代可做到 O(1) 额外空间。\n\n#### 代码模板\n\n> **题目简述：** 148 排序链表：给定单链表头结点，以 O(n log n) 时间将所有结点按值升序排列。 [力扣原题 ↗](https://leetcode.cn/problems/sort-list/)\n\n```python\nclass ListNode:\n    def __init__(self, val=0, next=None):\n        self.val = val\n        self.next = next\n\ndef mergeSortedListsForSort(a, b):\n    dummy = ListNode()\n    tail = dummy\n\n    while a and b:\n        if a.val \u003c= b.val:\n            tail.next = a\n            a = a.next\n        else:\n            tail.next = b\n            b = b.next\n        tail = tail.next\n\n    tail.next = a if a else b\n    return dummy.next\n\ndef sortListByMergeSort(head):\n    if not head or not head.next:\n        return head\n\n    slow = head\n    fast = head.next\n    while fast and fast.next:\n        slow = slow.next\n        fast = fast.next.next\n\n    right_head = slow.next\n    slow.next = None\n\n    left = sortListByMergeSort(head)\n    right = sortListByMergeSort(right_head)\n    return mergeSortedListsForSort(left, right)\n```\n\n#### 易错点\n\n- 找到中点后必须 `slow.next = None`。\n- 合并时复用原节点即可，不需要新建所有节点。\n- 快慢引用初始化为 `fast = head.next` 可让 slow 停在左半段尾部，便于断链。\n\n### 5.7 频次统计后的 Top K\n\n#### 适用题型\n\n- `347 前 K 个高频元素`。\n- 高频词、高频数字。\n- 先哈希计数，再按频率堆选、桶选或快选。\n\n#### 核心思路\n\n排序专题里的 Top K 高频先把值压缩成 `(value, frequency)`。小顶堆保留频率最高的 K 个元素；如果频次最大不超过 n，也可以用桶排序，把相同频率的元素放入同一个桶，从高频往低频收集。\n\n#### 代码 A：小顶堆\n\n> **题目简述：** 347 前 K 个高频元素：给定整数数组和 K，返回出现频率最高的 K 个元素，结果顺序不限。 [力扣原题 ↗](https://leetcode.cn/problems/top-k-frequent-elements/)\n\n```python\ndef topKFrequentByHeap(nums, k):\n    import heapq\n\n    freq = {}\n    for num in nums:\n        freq[num] = freq.get(num, 0) + 1\n\n    heap = []\n    for num, count in freq.items():\n        heapq.heappush(heap, (count, num))\n        if len(heap) > k:\n            heapq.heappop(heap)\n\n    return [num for count, num in heap]\n```\n\n#### 代码 B：桶排序\n\n> **题目简述：** 347 前 K 个高频元素：给定整数数组和 K，返回出现频率最高的 K 个元素，结果顺序不限。 [力扣原题 ↗](https://leetcode.cn/problems/top-k-frequent-elements/)\n\n```python\ndef topKFrequentByBucket(nums, k):\n    freq = {}\n    for num in nums:\n        freq[num] = freq.get(num, 0) + 1\n\n    buckets = [[] for _ in range(len(nums) + 1)]\n    for num, count in freq.items():\n        buckets[count].append(num)\n\n    ans = []\n    for count in range(len(buckets) - 1, 0, -1):\n        for num in buckets[count]:\n            ans.append(num)\n            if len(ans) == k:\n                return ans\n\n    return ans\n```\n\n#### 易错点\n\n- 先统计频率，再对频率选择，不能对原数组直接取前 K。\n- 小顶堆比较器方向要让最小频率在堆顶。\n- 桶下标是频次，范围是 `1..n`。\n\n### 5.8 双堆维护数据流中位数\n\n#### 适用题型\n\n- `295 数据流的中位数`。\n- 动态插入并频繁查询中位数。\n- 维护有序集合左右半区的在线题。\n\n#### 核心思路\n\n用大顶堆 `small` 保存较小的一半，用小顶堆 `large` 保存较大的一半。保持 `len(small) >= len(large)` 且大小差不超过 1，并保证 `-small[0] \u003c= large[0]`。插入后立即 rebalance；查询时奇数返回 `-small[0]`，偶数返回两个堆顶平均。\n\n#### 代码模板\n\n> **题目简述：** 295 数据流的中位数：设计结构持续接收整数，并能随时返回当前所有数据的中位数。 [力扣原题 ↗](https://leetcode.cn/problems/find-median-from-data-stream/)\n\n```python\nclass MedianFinderByTwoHeaps:\n    def __init__(self):\n        import heapq\n\n        self.heapq = heapq\n        self.small = []  # 大顶堆，用负数保存较小的一半。\n        self.large = []  # 小顶堆，保存较大的一半。\n\n    def addNum(self, num):\n        if not self.small or num \u003c= -self.small[0]:\n            self.heapq.heappush(self.small, -num)\n        else:\n            self.heapq.heappush(self.large, num)\n\n        if len(self.small) \u003c len(self.large):\n            self.heapq.heappush(self.small, -self.heapq.heappop(self.large))\n        elif len(self.small) > len(self.large) + 1:\n            self.heapq.heappush(self.large, -self.heapq.heappop(self.small))\n\n    def findMedian(self):\n        if len(self.small) > len(self.large):\n            return float(-self.small[0])\n        return (-self.small[0] + self.large[0]) / 2.0\n```\n\n#### 易错点\n\n- 每次插入后都要 rebalance，不能等查询时再修。\n- 偶数个元素求平均要防止两个 `int` 相加溢出。\n- `small` 保存较小一半但用大顶堆，`large` 保存较大一半但用小顶堆。\n\n\n## 6. 高频易错点清单\n\n| 易错点 | 典型题目 | 规避方式 |\n|---|---|---|\n| 排序后丢失原始下标 | 需要返回下标的变形题 | 排序前保存 `{value, index}` |\n| 三数之和去重不完整 | `15` | 固定点、左引用、右引用都要跳重复 |\n| 区间排序没有按左端点 | `56` | 默认 `intervals.sort()` 即先按第一维排序 |\n| 合并区间忘记最后一个区间入答案 | `56` | 循环结束后 push 当前区间 |\n| 颜色分类遇到 2 后仍然 `i += 1` | `75` | 与右端交换后新元素未知，不能跳过 |\n| 第 K 大目标下标算错 | `215` | 升序目标下标是 `n - k` |\n| 快选最坏情况退化 | `215` | 随机 pivot 或用堆方案兜底 |\n| 链表归并切分后没断开 | `148` | 找到中点后 `slow.next = None` |\n| 前 K 高频比较器方向写反 | `347` | 小顶堆保留 K 个最大频次 |\n| 数据流中位数两堆大小失衡 | `295` | 每次插入后立即 rebalance |\n| 两堆堆顶顺序被破坏 | `295` | 小的一半进大顶堆，大的一半进小顶堆 |\n\n## 7. 最短复盘口诀\n\n排序题先问排序带来什么：同类相邻、区间有序、和可单调移动、目标秩可定位。异位词看排序 key，三数之和排序双引用，合并区间按左端扫描，颜色分类维护三段，链表排序用归并，第 K 大用快选或小顶堆，Top K 高频先计数后选择，数据流中位数用双堆维护左右半区。\n\n\n\n================================================================================\n\n# 第17部分: 深度优先搜索\n\n================================================================================\n\n> 目标：本文把 Hot100 中所有标注“深度优先搜索”的题抽象成递归语义、访问状态、回溯恢复和图染色等可复用模板。复习时先定义 DFS 函数含义，再决定是遍历型、分治型、贡献型、回溯型还是判环型。\n\n## 1. DFS 题的底层模型\n\nDFS 的核心在于定义清楚当前调用处理什么、返回什么、进入和退出时维护什么状态。每道 DFS 题先问六个问题：\n\n| 问题 | 如果答案是“是” | 常用处理 |\n|---|---|---|\n| 当前节点需要左右子树结果吗 | 深度、直径、最大路径和、LCA | 后序 DFS，先拿子结果再处理当前节点 |\n| 状态只属于当前路径吗 | 单词搜索、路径总和、回溯类题 | 进入时修改，退出时恢复 |\n| 访问过的节点是否永久失效 | 岛屿数量、连通块统计 | 永久染色或 visited 标记 |\n| 是否要判断有向图环 | 课程表、依赖关系 | DFS 三色标记：未访问、访问中、已完成 |\n| 是否利用 BST 有序性 | 验证 BST、第 K 小 | 中序 DFS 或上下界递归 |\n| 是否要模拟前序结构改引用 | 二叉树展开为链表 | 反向前序或显式栈 |\n\nDFS 常见函数语义有五类：\n\n| DFS 类型 | 返回值含义 | 状态维护 | 代表题 |\n|---|---|---|---|\n| 遍历型 | 通常无返回值，只收集答案 | 访问顺序 | `94`、`199` |\n| 分治型 | 返回当前子树属性 | 左右子树结果 | `104`、`226`、`101` |\n| 贡献型 | 返回能向父节点延伸的贡献 | 全局答案 | `543`、`124` |\n| 回溯型 | 返回是否找到或累计方案数 | 路径状态进入/退出 | `79`、`437` |\n| 图搜索型 | 返回当前节点是否安全或无环 | visited 或三色状态 | `200`、`207` |\n\n## 2. Hot100 DFS 题型地图\n\nDFS 专题关注“递归语义和状态模型”。二叉树题数量最多，图遍历、回溯和判环题也会共享同一套状态维护思路。\n\n| 题型 | 题目 | 抽象能力 | 一句话记忆 |\n|---|---|---|---|\n| 基础遍历 | `94 二叉树中序遍历` | 前中后序位置 | 当前节点处理位置决定遍历类型 |\n| 子树属性 | `104 最大深度`、`226 翻转二叉树` | 返回子树信息或修改子树 | 当前答案由左右子树合成 |\n| 双节点递归 | `101 对称二叉树` | 同步比较两个节点 | 镜像比较外侧和内侧 |\n| BST DFS | `98 验证 BST`、`230 第 K 小` | 中序有序和上下界 | BST 题优先想中序 |\n| 贡献型路径 | `543 二叉树直径`、`124 最大路径和` | 全局答案 + 单边贡献 | 答案可拐弯，返回不能拐弯 |\n| 树上前缀和 | `437 路径总和 III` | 当前路径历史状态 | 进入加前缀，退出撤前缀 |\n| LCA 后序查找 | `236 最近公共祖先` | 子树返回命中目标或答案 | 左右都找到，当前就是 LCA |\n| DFS 右视图 | `199 二叉树右视图` | 深度首次到达 | 先右后左，首次到层即答案 |\n| 树形展开 | `114 二叉树展开为链表` | 反向前序原地重连 | 右左中处理，当前接 prev |\n| 网格 DFS | `200 岛屿数量`、`79 单词搜索` | 永久染色 vs 回溯恢复 | 统计块永久标记，找路径必须恢复 |\n| 有向图判环 | `207 课程表` | 三色 DFS | 遇到访问中节点就是环 |\n\n## 3. 复习顺序建议\n\n建议按“树递归语义 → 路径状态 → 网格回溯 → 图判环”的顺序复习：\n\n1. `94`：建立前中后序的访问位置概念。\n2. `104`、`226`：理解 DFS 返回子树属性和原地修改。\n3. `101`：练两个节点同步递归。\n4. `98`、`230`：把 BST 性质落实到中序 DFS。\n5. `543`、`124`：掌握贡献型 DFS，区分全局答案和返回值。\n6. `437`：掌握路径状态必须回溯。\n7. `236`：掌握后序查找和返回命中信息。\n8. `199`、`114`：练 DFS 访问顺序对答案和结构的影响。\n9. `200`：练网格永久染色。\n10. `79`：练网格回溯恢复。\n11. `207`：练有向图三色判环。\n\n## 4. 关键套路详解\n\n### 4.1 DFS 第一行先写函数语义\n\n写 DFS 前先补完这句话：\n\n```text\ndfs(x, state) 表示处理 ______，返回 ______。\n```\n\n例如 `104` 的 DFS 返回当前子树最大深度；`543` 的 DFS 返回从当前节点向下的最长单边深度；`236` 的 DFS 返回当前子树中找到的 p、q 或 LCA；`79` 的 DFS 返回从 `(r,c)` 开始是否能匹配 `word[k...]`。\n\n如果返回值语义不清，递归边界、状态更新和答案更新都会混乱。\n\n### 4.2 前序、中序、后序是状态处理时机\n\n| 位置 | 适合做什么 | 代表题 |\n|---|---|---|\n| 前序位置 | 从父到子传状态、进入路径、首次到达某层 | `199`、`437`、`79` |\n| 中序位置 | BST 有序访问 | `94`、`98`、`230` |\n| 后序位置 | 汇总子树结果、贡献计算、LCA | `104`、`543`、`124`、`236` |\n\n不要把前中后序只理解成遍历顺序。它真正决定的是“当前节点在递归生命周期的哪个阶段被处理”。\n\n### 4.3 贡献型 DFS 必须区分答案和返回值\n\n`543` 和 `124` 是 DFS 最重要的抽象题型。当前节点处的最优答案可以同时使用左右子树，因为路径可以在当前节点拐弯。但向父节点返回时只能选一边继续延伸，否则路径会分叉。\n\n| 题目 | 更新全局答案 | 向上返回 |\n|---|---|---|\n| `543 直径` | `leftDepth + rightDepth` | `max(leftDepth, rightDepth) + 1` |\n| `124 最大路径和` | `root.val + leftGain + rightGain` | `root.val + max(leftGain, rightGain)` |\n\n口诀：答案可以拐弯，返回值不能拐弯。\n\n### 4.4 永久染色和回溯恢复不能混用\n\n`200` 和 `79` 都是网格 DFS，但访问标记语义完全不同。\n\n| 场景 | 标记策略 | 原因 |\n|---|---|---|\n| 连通块统计 | 永久标记 visited 或把陆地改成水 | 一块区域统计后不再需要参与其他答案 |\n| 路径搜索 | 临时标记，递归退出前恢复 | 当前路径不能重复用格子，但其他路径仍可能用 |\n\n判断方法：如果一个点访问过后全局都不该再用，永久染色；如果只是不允许当前路径重复使用，必须回溯恢复。\n\n### 4.5 树上前缀和是数组前缀和的回溯版\n\n`437 路径总和 III` 和数组 `560` 类似，都用 `curSum - target` 查历史前缀。但树有分叉，当前路径历史只能给当前分支使用，不能污染兄弟分支。\n\n固定动作：进入节点后执行 `prefix[curSum] += 1`，递归左右子树，退出节点前执行 `prefix[curSum] -= 1`。\n\n初始化 `prefix[0] = 1` 表示允许从根节点开始的一段路径被统计。\n\n### 4.6 有向图 DFS 判环看“当前路径”\n\n`207 课程表` 用 DFS 判环时，visited 不能只有 true/false。因为遇到“已访问过”有两种含义：正在当前递归路径中，或者已经完全处理完。\n\n三色状态：\n\n| 状态 | 含义 | 遇到时 |\n|---|---|---|\n| `0` | 未访问 | 继续 DFS |\n| `1` | 当前路径中 | 有环 |\n| `2` | 已完成且安全 | 直接返回无环 |\n\n退出一个节点前必须从 `1` 改成 `2`，否则会把已处理节点误判为环。\n\n## 5. 抽象代码模板\n\n下面模板按 DFS 的函数语义组织。每个模板都使用统一结构，并在使用成员答案时提供 wrapper 初始化，避免重复调用污染状态。\n\n### 5.1 树 DFS 访问位置模板\n\n#### 适用题型\n\n- 前序、中序、后序遍历。\n- BST 验证、第 K 小。\n- DFS 右视图、从根向下传状态。\n\n#### 核心思路\n\nDFS 访问位置决定当前节点的处理时机。前序位置适合“进入节点”时做事，中序位置适合 BST 有序访问，后序位置适合左右子树处理完后汇总。这个模板是遍历型，通常不依赖返回值。\n\n#### 代码模板\n\n> **题目简述：** 本模板用于：前序、中序、后序遍历。；BST 验证、第 K 小。；DFS 右视图、从根向下传状态。 [94 原题 ↗](https://leetcode.cn/problems/binary-tree-inorder-traversal/) · [98 原题 ↗](https://leetcode.cn/problems/validate-binary-search-tree/) · [230 原题 ↗](https://leetcode.cn/problems/kth-smallest-element-in-a-bst/) · [199 原题 ↗](https://leetcode.cn/problems/binary-tree-right-side-view/)\n\n```python\nclass TreeNode:\n    def __init__(self, val=0, left=None, right=None):\n        self.val = val\n        self.left = left\n        self.right = right\n\ndef treeDfsPosition(root, depth, ans):\n    if not root:\n        return\n\n    ans.append((\"pre\", root.val, depth))\n    treeDfsPosition(root.left, depth + 1, ans)\n    ans.append((\"in\", root.val, depth))\n    treeDfsPosition(root.right, depth + 1, ans)\n    ans.append((\"post\", root.val, depth))\n```\n\n#### 易错点\n\n- 把前中后序理解成状态处理时机，避免机械套固定遍历顺序。\n- DFS 右视图忘记先右后左，导致记录成左视图。\n- BST 验证只比较父子节点，遗漏整棵子树范围约束。\n\n### 5.2 子树属性分治 DFS 模板\n\n#### 适用题型\n\n- 最大深度、节点数、叶子数。\n- 翻转二叉树。\n- 判断平衡二叉树。\n\n#### 核心思路\n\n这一组题都在后序位置做同一件事：先拿到左右子树结果，再在当前节点合并。差别只在于“返回值语义”和“合并公式”。\n\n共同不变量：\n\n- 空节点先给出不会影响合并的默认值。\n- 当前节点只依赖左右子树已经算好的结果。\n- 如果题目需要提前失败，例如平衡树，返回值里要能表达失败状态。\n- 如果题目是原地修改，例如翻转树，合并动作从“计算属性”变成“接回左右子树”。\n\n#### 代码模板：共同骨架\n\n> **题目简述：** 本模板用于：最大深度、节点数、叶子数。；翻转二叉树。；判断平衡二叉树。 [104 原题 ↗](https://leetcode.cn/problems/maximum-depth-of-binary-tree/) · [226 原题 ↗](https://leetcode.cn/problems/invert-binary-tree/)\n\n```python\nclass TreeNode:\n    def __init__(self, val=0, left=None, right=None):\n        self.val = val\n        self.left = left\n        self.right = right\n\nclass SubtreeInfo:\n    def __init__(self, height=0, nodeCount=0, leafCount=0, balanced=True):\n        self.height = height\n        self.nodeCount = nodeCount\n        self.leafCount = leafCount\n        self.balanced = balanced\n\ndef collectSubtreeInfo(root):\n    if not root:\n        return SubtreeInfo()\n\n    left = collectSubtreeInfo(root.left)\n    right = collectSubtreeInfo(root.right)\n\n    height = max(left.height, right.height) + 1\n    node_count = left.nodeCount + right.nodeCount + 1\n    leaf_count = 1 if not root.left and not root.right else left.leafCount + right.leafCount\n    balanced = left.balanced and right.balanced and abs(left.height - right.height) \u003c= 1\n    return SubtreeInfo(height, node_count, leaf_count, balanced)\n```\n\n翻转二叉树仍然是同一个“先处理左右、再处理当前”的后序骨架，只是合并动作从计算属性改成交换引用：\n\n> **题目简述：** 本模板用于：最大深度、节点数、叶子数。；翻转二叉树。；判断平衡二叉树。 [104 原题 ↗](https://leetcode.cn/problems/maximum-depth-of-binary-tree/) · [226 原题 ↗](https://leetcode.cn/problems/invert-binary-tree/)\n\n```python\ndef invertTreeDfs(root):\n    if not root:\n        return None\n\n    left = invertTreeDfs(root.left)\n    right = invertTreeDfs(root.right)\n\n    # 变形点：左右结果用于交换后接回当前节点。\n    root.left = right\n    root.right = left\n    return root\n```\n\n#### 变形点对照\n\n| 题型 | 共同骨架中改哪里 | 合并公式 / 处理差异 |\n|---|---|---|\n| 最大深度 | 返回值只保留 `height` | `max(left.height, right.height) + 1` |\n| 节点数 | 返回值只保留 `nodeCount` | `left.nodeCount + right.nodeCount + 1` |\n| 叶子数 | 增加叶子判断 | 叶子返回 `1`，非叶子累加左右叶子数 |\n| 平衡二叉树 | 返回高度同时带失败状态 | 左右平衡且高度差不超过 `1` |\n| 翻转二叉树 | 合并动作从算属性改成接引用 | `root.left = right; root.right = left` |\n\n#### 易错点\n\n- 没有先说清楚返回值语义，导致 base case 和合并逻辑都摇摆。\n- 节点数、叶子数和深度共享后序骨架，但合并公式不同，不能机械套 `max(left, right) + 1`。\n- 平衡树只看当前高度差不够，还要左右子树本身都平衡。\n- 翻转树递归后忘记接回左右子树，或把局部变量和原引用混淆。\n\n### 5.3 贡献型路径 DFS 模板\n\n#### 适用题型\n\n- 二叉树直径。\n- 二叉树最大路径和。\n- 当前节点能更新答案，但向父节点只能返回单边贡献的路径题。\n\n#### 核心思路\n\n全局答案和递归返回值含义不同。全局答案可以使用“左贡献 + 当前节点 + 右贡献”，因为答案路径可以在当前节点拐弯；返回值要给父节点继续拼接，只能选择左或右一边。成员变量答案必须在 wrapper 里初始化。\n\n#### 代码 A：直径\n\n> **题目简述：** 本模板用于：二叉树直径。；二叉树最大路径和。；当前节点能更新答案，但向父节点只能返回单边贡献的路径题。 [力扣原题 ↗](https://leetcode.cn/problems/diameter-of-binary-tree/)\n\n```python\nclass TreeNode:\n    def __init__(self, val=0, left=None, right=None):\n        self.val = val\n        self.left = left\n        self.right = right\n\nclass DiameterDfsTemplate:\n    def __init__(self):\n        self.ans = 0\n\n    def depthGain(self, root):\n        if not root:\n            return 0\n\n        left = self.depthGain(root.left)\n        right = self.depthGain(root.right)\n\n        self.ans = max(self.ans, left + right)\n        return max(left, right) + 1\n\n    def diameterOfBinaryTree(self, root):\n        self.ans = 0\n        self.depthGain(root)\n        return self.ans\n\ndef depthGain(root):\n    solver = DiameterDfsTemplate()\n    return solver.depthGain(root)\n```\n\n#### 代码 B：最大路径和\n\n> **题目简述：** 124 二叉树中的最大路径和：二叉树路径可从任意结点起止且不重复经过结点，求最大结点值之和。 [力扣原题 ↗](https://leetcode.cn/problems/binary-tree-maximum-path-sum/)\n\n```python\nclass TreeNode:\n    def __init__(self, val=0, left=None, right=None):\n        self.val = val\n        self.left = left\n        self.right = right\n\nclass MaxPathDfsTemplate:\n    def __init__(self):\n        self.ans = float('-inf')\n\n    def sumGain(self, root):\n        if not root:\n            return 0\n\n        left = max(0, self.sumGain(root.left))\n        right = max(0, self.sumGain(root.right))\n\n        self.ans = max(self.ans, root.val + left + right)\n        return root.val + max(left, right)\n\n    def maxPathSum(self, root):\n        self.ans = float('-inf')\n        self.sumGain(root)\n        return self.ans\n\ndef sumGain(root):\n    solver = MaxPathDfsTemplate()\n    return solver.sumGain(root)\n```\n\n#### 易错点\n\n- 把全局答案当成 DFS 返回值返回，导致父节点收到一条已经分叉的路径。\n- 最大路径和不截断负贡献。\n- 类成员 `ans` 未在入口函数重置。\n\n### 5.4 树上前缀和回溯 DFS 模板\n\n#### 适用题型\n\n- 路径总和 III。\n- 树上祖先到后代路径和计数。\n- 当前路径历史状态查询。\n\n#### 核心思路\n\n`prefix[sum]` 只代表当前递归路径上的历史前缀和。进入当前节点后，先用 `curSum - target` 查询能形成多少条合法路径，再把当前前缀加入历史；递归完左右子树后撤销，防止左子树历史污染右子树。\n\n#### 代码模板\n\n> **题目简述：** 本模板用于：路径总和 III。；树上祖先到后代路径和计数。；当前路径历史状态查询。 [力扣原题 ↗](https://leetcode.cn/problems/path-sum-iii/)\n\n```python\nclass TreeNode:\n    def __init__(self, val=0, left=None, right=None):\n        self.val = val\n        self.left = left\n        self.right = right\n\ndef dfs(root, curSum, target, prefix):\n    if not root:\n        return 0\n\n    curSum += root.val\n    count = prefix.get(curSum - target, 0)\n\n    prefix[curSum] = prefix.get(curSum, 0) + 1\n    count += dfs(root.left, curSum, target, prefix)\n    count += dfs(root.right, curSum, target, prefix)\n    prefix[curSum] -= 1\n\n    return count\n\ndef pathSum(root, targetSum):\n    prefix = {0: 1}\n    return dfs(root, 0, targetSum, prefix)\n```\n\n#### 易错点\n\n- 递归左右后忘记执行 `prefix[curSum] -= 1`。\n- `prefix` 是当前路径记录，不能当全局访问记录。\n- 前缀和使用 `int` 可能溢出。\n\n### 5.5 LCA 后序查找 DFS 模板\n\n#### 适用题型\n\n- `236 二叉树的最近公共祖先`。\n- 树上查找两个目标节点并向上返回命中结果。\n- 多目标 LCA、不保证目标存在等变形。\n\n#### 核心思路\n\nLCA 是后序 DFS：当前节点先向左右子树询问是否找到了目标或 LCA，再根据左右结果决定返回什么。返回值语义必须明确：如果当前子树找到了 `p`、`q` 或 LCA，就返回对应节点；如果都没找到，就返回 `None`。左右都非空时，当前节点就是两个目标的首次汇合点。\n\n#### 代码模板\n\n> **题目简述：** 236 二叉树的最近公共祖先：给定二叉树及其中两个结点，返回同时包含二者的最深祖先结点。 [力扣原题 ↗](https://leetcode.cn/problems/lowest-common-ancestor-of-a-binary-tree/)\n\n```python\nclass TreeNode:\n    def __init__(self, val=0, left=None, right=None):\n        self.val = val\n        self.left = left\n        self.right = right\n\ndef lowestCommonAncestorDfs(root, p, q):\n    if not root or root is p or root is q:\n        return root\n\n    left = lowestCommonAncestorDfs(root.left, p, q)\n    right = lowestCommonAncestorDfs(root.right, p, q)\n\n    if left and right:\n        return root\n    return left if left else right\n```\n\n#### 易错点\n\n- 命中 `p` 或 `q` 时应直接返回当前节点，不要继续把目标节点下面的结构混进判断。\n- 普通二叉树 LCA 不能按值大小剪枝，那是 BST 专属变形。\n- 如果题目不保证两个目标都存在，需要额外统计命中数量，否则可能返回唯一存在的节点。\n\n### 5.6 网格 DFS 永久染色模板\n\n#### 适用题型\n\n- 岛屿数量。\n- 区域染色 / 图像渲染。\n- 连通块面积、连通块个数等访问后不需要恢复的题。\n\n#### 核心思路\n\n这类题共享同一个 flood fill 骨架：DFS 入口判断越界和目标值，进入后立即永久染色，再递归四个方向。不同题型只改“目标值是什么”“染成什么”“返回值要不要统计面积”。\n\n关键不变量：\n\n- 当前格子一旦被处理，就不应该再参与其他连通块。\n- 进入 DFS 后先标记，再递归邻居，避免环形连通块无限递归。\n- 连通块统计是永久染色，不需要退出时恢复。\n\n#### 代码模板：共同骨架\n\n> **题目简述：** 本模板用于：岛屿数量。；区域染色 / 图像渲染。；连通块面积、连通块个数等访问后不需要恢复的题。 [力扣原题 ↗](https://leetcode.cn/problems/number-of-islands/)\n\n```python\ndef floodFillDfs(grid, r, c, targetValue, markValue):\n    m = len(grid)\n    n = len(grid[0])\n    if r \u003c 0 or r >= m or c \u003c 0 or c >= n or grid[r][c] != targetValue:\n        return 0\n\n    grid[r][c] = markValue  # 共同动作：永久染色，修改本身就是 visited。\n    area = 1  # 面积变形需要返回；数量题可以忽略。\n\n    area += floodFillDfs(grid, r + 1, c, targetValue, markValue)\n    area += floodFillDfs(grid, r - 1, c, targetValue, markValue)\n    area += floodFillDfs(grid, r, c + 1, targetValue, markValue)\n    area += floodFillDfs(grid, r, c - 1, targetValue, markValue)\n    return area\n```\n\n#### 变形点对照\n\n| 题型 | 外层入口 | DFS 参数 | 答案结算 |\n|---|---|---|---|\n| 岛屿数量 | 遍历中发现 `grid[r][c] == 1` | `targetValue = 1`，`markValue = 0` | 入口处 `ans += 1`，DFS 只负责染掉整块 |\n| 最大岛屿面积 | 遍历中发现 `grid[r][c] == 1` | `targetValue = 1`，`markValue = 0` | `ans = max(ans, floodFillDfs(...))` |\n| 区域染色 | 只从 `(sr, sc)` 开始 | `targetValue = oldColor`，`markValue = newColor` | 不需要外层计数，只执行染色 |\n| `char` 岛屿网格 | 遍历中发现 `'1'` | 把 `1/0` 换成 `'1'/'0'` | 骨架不变，只换值类型 |\n\n区域染色必须额外处理新旧颜色相同的情况：\n\n```python\noldColor = image[sr][sc]\nif oldColor != newColor:\n    floodFillDfs(image, sr, sc, oldColor, newColor)\n```\n\n#### 易错点\n\n- 忘记进入后立刻标记，导致四方向递归互相回到旧格子。\n- 把回溯题的恢复逻辑搬到连通块题里，导致染色失效。\n- 区域染色没判断 `oldColor == newColor`，递归会反复进入同色区域。\n- 面积题只在外层 `ans += 1`，没有让 DFS 返回当前连通块大小。\n\n### 5.7 网格回溯 DFS 恢复模板\n\n#### 适用题型\n\n- `79 单词搜索`。\n- 棋盘路径搜索、路径枚举。\n- 访问限制只对当前路径有效，退出分支后必须恢复的题。\n\n#### 核心思路\n\n回溯类网格 DFS 的访问标记只属于当前路径。进入格子后临时占用，递归搜索下一步；无论搜索失败还是提前成功返回，都要恢复原字符，让兄弟分支和其他起点继续使用该格子。\n\n#### 代码模板\n\n> **题目简述：** 79 单词搜索：判断单词能否由字符网格中上下左右相邻且不重复使用的单元格组成。 [力扣原题 ↗](https://leetcode.cn/problems/word-search/)\n\n```python\ndef dfs(board, word, r, c, k):\n    m = len(board)\n    n = len(board[0])\n    if r \u003c 0 or r >= m or c \u003c 0 or c >= n or board[r][c] != word[k]:\n        return False\n    if k == len(word) - 1:\n        return True\n\n    old = board[r][c]\n    board[r][c] = '#'\n\n    for dr, dc in ((0, 1), (0, -1), (1, 0), (-1, 0)):\n        if dfs(board, word, r + dr, c + dc, k + 1):\n            board[r][c] = old\n            return True\n\n    board[r][c] = old\n    return False\n\ndef exist(board, word):\n    if not board or not board[0]:\n        return False\n\n    for r in range(len(board)):\n        for c in range(len(board[0])):\n            if dfs(board, word, r, c, 0):\n                return True\n    return False\n```\n\n#### 易错点\n\n- 单词搜索用永久染色，导致其他起点或路径无法使用本该可用的格子。\n- 提前 `return true` 前忘记恢复字符。\n- `k == len(word) - 1` 的成功条件放错，导致最后一个字符无法正确匹配。\n\n\n### 5.8 有向图 DFS 三色判环模板\n\n#### 适用题型\n\n- 课程表。\n- 依赖关系判环。\n- 最终安全节点类问题。\n\n#### 核心思路\n\n三色状态区分“没访问过”“正在当前递归路径中”“已经处理完成”。遇到 `state == 1` 表示回到当前路径上的点，存在环；遇到 `state == 2` 表示这个点之前已经确认安全，可以复用结果。\n\n#### 代码模板\n\n> **题目简述：** 本模板用于：课程表。；依赖关系判环。；最终安全节点类问题。 [力扣原题 ↗](https://leetcode.cn/problems/course-schedule/)\n\n```python\ndef dfs(u):\n    if state[u] == 1:\n        return False\n    if state[u] == 2:\n        return True\n\n    state[u] = 1\n    for v in edges[u]:\n        if not dfs(v):\n            return False\n    state[u] = 2\n    return True\n\ndef canFinishByDfs(n, prerequisites):\n    global edges, state\n    edges = [[] for _ in range(n)]\n    state = [0] * n\n\n    for course, pre in prerequisites:\n        edges[pre].append(course)\n\n    for i in range(n):\n        if state[i] == 0 and not dfs(i):\n            return False\n    return True\n```\n\n#### 易错点\n\n- 只用 `visited` 布尔值，无法区分“当前路径中”和“已完成”。\n- DFS 结束时忘记把 `state[u]` 改为 2。\n- 课程表边方向建反：`[a, b]` 表示 `b: a`。\n\n## 6. 高频易错点清单\n\n| 易错点 | 典型题目 | 规避方式 |\n|---|---|---|\n| DFS 函数返回值语义不清 | `104`、`543`、`236` | 先写一句“dfs 返回什么” |\n| 把前序、中序、后序当成死模板 | `94`、`98`、`124` | 按“当前节点处理时机”理解 |\n| 贡献型题把全局答案直接返回 | `543`、`124` | 全局答案可左右合并，返回值只能单边延伸 |\n| 最大路径和没有截断负贡献 | `124` | `gain = max(0, dfs(child))` |\n| 树上前缀和没有回溯 | `437` | 递归左右后 `prefix[curSum] -= 1` |\n| LCA 找到一个目标后继续乱处理 | `236` | 命中 `p/q` 直接返回当前节点 |\n| 网格 DFS 忘记越界判断 | `200`、`79` | DFS 入口第一行处理边界和目标值 |\n| 单词搜索提前返回前没恢复现场 | `79` | 所有 return true 前先还原字符 |\n| 岛屿数量没有永久标记 | `200` | 访问过的陆地改成水或 visited |\n| 课程表 DFS 只有 visited 布尔值 | `207` | 用三色状态区分访问中和已完成 |\n| 三色 DFS 退出时忘记设为 2 | `207` | 当前节点所有后继安全后 `state[u] = 2` |\n\n## 7. 最短复盘口诀\n\nDFS 先定义函数语义：处理什么，返回什么。树题看当前节点处理位置，子树题用后序汇总，路径题进入加状态、退出撤状态，贡献题答案能拐弯、返回不能拐弯。网格统计永久染色，路径搜索回溯恢复。有向图判环用三色，遇到访问中就是环。`104` 是分治母题，`543/124` 是贡献母题，`437` 是回溯前缀和母题，`200/79` 是网格 DFS 对照题，`207` 是图染色母题。\n\n\n\n================================================================================\n\n# 第18部分: 广度优先搜索\n\n================================================================================\n\n> 目标：本文把 Hot100 中所有标注“广度优先搜索”的题抽象成队列按层、最短距离、多源扩散、拓扑剥离和状态图搜索等可复用模板。复习时先判断答案是否和层数、最短步数或依赖入度有关，再决定 BFS 形态。\n\n## 1. BFS 题的底层模型\n\nBFS 的核心是“按距离从近到远扩展”。每道 BFS 题先问六个问题：\n\n| 问题 | 如果答案是“是” | 常用处理 |\n|---|---|---|\n| 答案是否按层输出 | 二叉树层序遍历、右视图 | 队列每轮固定当前层 `size` |\n| 是否要求最短步数或最少时间 | 腐烂橘子、完全平方数、零钱兑换状态图 | BFS 层数就是最短距离 |\n| 是否有多个起点同时扩散 | 腐烂橘子、矩阵距离 | 多源全部先入队 |\n| 是否要统计连通块 | 岛屿数量 | 外层枚举起点，BFS 吃完整块 |\n| 是否是依赖关系判环 | 课程表 | 入度为 0 的点入队，拓扑剥离 |\n| 是否能用 DP 更优 | 完全平方数、零钱兑换 | BFS 可理解最短路，DP 常是更直接写法 |\n\nBFS 常见模型有四类：\n\n| BFS 类型 | 队列里放什么 | 层的含义 | 代表题 |\n|---|---|---|---|\n| 树层序 BFS | 树节点 | 树的深度层 | `102`、`199`、`104`、`101`、`226` |\n| 网格 BFS | 坐标 `(r, c)` | 网格距离或扩散分钟 | `200`、`994` |\n| 拓扑 BFS | 入度为 0 的节点 | 当前可执行任务批次 | `207` |\n| 状态图 BFS | 数值状态或剩余金额 | 操作次数 | `279`、`322` |\n\n## 2. Hot100 BFS 题型地图\n\n\n| 题型 | 题目 | 抽象能力 | 一句话记忆 |\n|---|---|---|---|\n| 树层序遍历 | `102 二叉树层序遍历` | 固定每层队列长度 | 每层开始先记 `size` |\n| 树层信息 | `199 右视图`、`104 最大深度` | 层数和每层端点 | BFS 层数就是深度，右视图取每层最后一个 |\n| 树结构处理 | `101 对称二叉树`、`226 翻转二叉树` | 队列同步节点或逐层修改 | 对称树一次弹两个镜像节点 |\n| 网格连通块 | `200 岛屿数量` | BFS 吃掉整座岛 | 发现新陆地，队列扩展全块 |\n| 多源扩散 | `994 腐烂的橘子` | 多个源点同时按分钟扩散 | 所有烂橘子第 0 分钟一起入队 |\n| 拓扑排序 | `207 课程表` | 入度剥离判有向图环 | 能弹完所有课就无环 |\n| 状态图最短路 | `279 完全平方数`、`322 零钱兑换` | 每次操作是一条边 | 第一次到达目标就是最少步数 |\n\n## 3. 复习顺序建议\n\n建议按“队列层序 → 网格扩散 → 拓扑排序 → 状态图”的顺序复习：\n\n1. `102 二叉树层序遍历`：掌握固定当前层 `size`。\n2. `199 二叉树右视图`：练每层端点信息。\n3. `104 最大深度`、`226 翻转二叉树`：理解 BFS 也能做树属性和修改。\n4. `101 对称二叉树`：练队列中一次放入成对节点。\n5. `200 岛屿数量`：练网格 BFS 和永久访问标记。\n6. `994 腐烂的橘子`：掌握多源 BFS 和分钟计数。\n7. `207 课程表`：掌握拓扑排序的入度队列。\n8. `279 完全平方数`：把数字看成状态，边是减去一个平方数。\n9. `322 零钱兑换`：理解 BFS 能求最少硬币数，但 DP 更常用。\n\n## 4. 关键套路详解\n\n### 4.1 BFS 按层题必须固定当前层 size\n\n队列在处理当前层时会不断加入下一层节点。如果直接用动态变化的 `len(q)` 作为循环边界，就会把下一层混进当前层。正确写法是每层开始先固定：\n\n```text\nlevel_size = len(q)\nfor _ in range(level_size):\n    ...\n```\n\n`102` 每层收集一个数组，`199` 每层取最后一个节点，`104` 每处理完一层深度加一，本质都靠这个固定层长度。\n\n### 4.2 BFS 的 visited 要在入队时标记\n\nBFS 中同一个节点可能被多个父节点同时发现。如果等到出队时才标记，它可能被重复入队，导致重复计算甚至超时。网格 BFS、状态图 BFS、拓扑排序的后继入队，都应在“决定入队”那一刻更新状态。\n\n| 场景 | 标记动作 | 原因 |\n|---|---|---|\n| 网格连通块 | 入队时把陆地改成水或 visited | 避免同一格被多个邻居重复加入 |\n| 腐烂橘子 | 新鲜橘子入队时改成腐烂 | 表示它已被感染，不会重复感染 |\n| 状态图 | 新状态入队时 visited | BFS 第一次到达就是最短 |\n| 拓扑排序 | 入度减到 0 时入队 | 每个节点只在可执行时进入一次 |\n\n### 4.3 多源 BFS 的第 0 层包含所有源点\n\n`994 腐烂的橘子` 最重要的是初始化：所有腐烂橘子都要先入队，作为第 0 分钟的源点。然后每处理完一层，分钟数加一。\n\n如果一个一个腐烂橘子分别 BFS，会把同时扩散误算成先后扩散。多源 BFS 的本质是把多个起点当作同一层的所有节点。\n\n### 4.4 拓扑排序是 BFS 版有向图判环\n\n`207 课程表` 的队列按“当前入度为 0，可以学习”的节点扩展。每弹出一门课，就相当于删除它的出边，让后续课程入度减一。\n\n判断标准是弹出的课程数是否等于总课程数；队列最终为空本身没有判定价值。如果还有节点没弹出，说明它们被环互相卡住。\n\n### 4.5 状态图 BFS 适合最少操作次数\n\n`279 完全平方数` 可以把每个剩余值看成一个节点，从 `n` 出发，每次减去一个平方数，第一次到达 `0` 的层数就是最少平方数个数。`322 零钱兑换` 也可以把金额看成节点，每次加一个硬币或减一个硬币，第一次到达目标金额就是最少硬币数。\n\n但这两题 DP 通常更简洁稳定。BFS 视角的价值是帮助理解“最少次数 = 无权图最短路”。\n\n### 4.6 BFS 和 DFS 的选择标准\n\n| 需求 | 优先方法 | 原因 |\n|---|---|---|\n| 只要遍历完整连通块 | DFS 或 BFS 都可以 | 不关心层数 |\n| 最短步数、最少时间、最近距离 | BFS | 无权图第一时间到达就是最短 |\n| 树的层级输出 | BFS | 队列天然按层 |\n| 当前路径需要撤销状态 | DFS 回溯 | BFS 不适合维护深路径回溯 |\n| 有向图判环 | BFS 拓扑或 DFS 三色 | 两者都可，状态语义不同 |\n\n## 5. 抽象代码模板\n\n下面模板按 BFS 中“层”的语义组织。重点关注层序、多源扩散、拓扑入度和状态图最短路的不变量。\n\n### 5.1 二叉树层序 BFS 模板\n\n#### 适用题型\n\n- 二叉树层序遍历。\n- 二叉树右视图、左视图。\n- 二叉树最大深度 BFS 写法。\n- 每层统计最大值、平均值、宽度等。\n\n#### 核心思路\n\n树层序 BFS 的不变量是：每轮开始时，队列中恰好保存当前层的所有节点。先固定 `size`，本轮只处理这 `size` 个节点；新入队的孩子属于下一层。层数、右视图、每层统计都依赖这个不变量。\n\n#### 代码模板\n\n> **题目简述：** 本模板用于：二叉树层序遍历。；二叉树右视图、左视图。；二叉树最大深度 BFS 写法。；每层统计最大值、平均值、宽度等。 [102 原题 ↗](https://leetcode.cn/problems/binary-tree-level-order-traversal/) · [199 原题 ↗](https://leetcode.cn/problems/binary-tree-right-side-view/) · [104 原题 ↗](https://leetcode.cn/problems/maximum-depth-of-binary-tree/)\n\n```python\nclass TreeNode:\n    def __init__(self, val=0, left=None, right=None):\n        self.val = val\n        self.left = left\n        self.right = right\n\ndef levelOrder(root):\n    from collections import deque\n\n    ans = []\n    if not root:\n        return ans\n\n    q = deque([root])\n    while q:\n        size = len(q)\n        level = []\n\n        for _ in range(size):\n            node = q.popleft()\n            level.append(node.val)\n\n            if node.left:\n                q.append(node.left)\n            if node.right:\n                q.append(node.right)\n\n        ans.append(level)\n\n    return ans\n```\n\n#### 易错点\n\n- 用变化中的 `len(q)` 作为当前层循环条件。\n- 空树没有提前返回，把None放进队列。\n- 右视图取错节点：右视图取每层最后处理的节点，不能只走整棵树最右链。\n\n### 5.2 双节点同步 BFS 模板\n\n#### 适用题型\n\n- `101 对称二叉树` 的迭代写法。\n- 两棵树是否相同、是否镜像、是否互为子结构等同步比较问题。\n- 队列中每个状态是一组需要同时比较的节点。\n\n#### 核心思路\n\n双节点同步 BFS 的队列里放的是“待比较的一对节点”。每次出队后先处理空节点组合，再比较节点值；如果当前这对节点满足关系，就按题目要求把下一组对应节点成对入队。对称树的关键在于镜像配对：外侧对外侧，内侧对内侧。\n\n#### 代码模板\n\n> **题目简述：** 101 对称二叉树：给定二叉树根结点，判断其左右子树是否关于中心互为镜像。 [力扣原题 ↗](https://leetcode.cn/problems/symmetric-tree/)\n\n```python\nclass TreeNode:\n    def __init__(self, val=0, left=None, right=None):\n        self.val = val\n        self.left = left\n        self.right = right\n\ndef isSymmetricByPairBfs(root):\n    from collections import deque\n\n    if not root:\n        return True\n\n    q = deque([(root.left, root.right)])\n    while q:\n        a, b = q.popleft()\n\n        if not a and not b:\n            continue\n        if not a or not b:\n            return False\n        if a.val != b.val:\n            return False\n\n        q.append((a.left, b.right))\n        q.append((a.right, b.left))\n\n    return True\n\ndef isSameTreeByPairBfs(p, qRoot):\n    from collections import deque\n\n    q = deque([(p, qRoot)])\n    while q:\n        a, b = q.popleft()\n\n        if not a and not b:\n            continue\n        if not a or not b or a.val != b.val:\n            return False\n\n        q.append((a.left, b.left))\n        q.append((a.right, b.right))\n\n    return True\n```\n\n#### 易错点\n\n- 把对称树写成普通层序遍历，只比较每层数组，忽略空节点位置会误判结构。\n- 镜像配对顺序写反：对称树应比较 `left.left` 和 `right.right`、`left.right` 和 `right.left`。\n- 出队后直接访问节点值，没有先处理两个节点是否为空。\n\n### 5.3 网格连通块 BFS 模板\n\n#### 适用题型\n\n- 岛屿数量。\n- 图像渲染、区域连通块统计。\n- 最大岛屿面积的 BFS 写法。\n\n#### 核心思路\n\n网格连通块 BFS 的共同骨架是：外层枚举入口，发现一个未访问目标格后入队，入队时立刻标记，然后不断扩展四邻域。岛屿数量、最大面积、区域染色只是在“外层如何结算”和“入队时标记成什么”上不同。\n\n关键不变量：\n\n- 队列里保存当前连通块中已经标记、但邻居尚未完全扩展的格子。\n- 入队时标记 visited，避免同一个格子被多个父节点重复加入。\n- 数量题在发现入口时计数；面积题在出队时累加；染色题把 `oldColor/newColor` 参数化。\n\n#### 代码模板：共同骨架\n\n> **题目简述：** 本模板用于：岛屿数量。；图像渲染、区域连通块统计。；最大岛屿面积的 BFS 写法。 [力扣原题 ↗](https://leetcode.cn/problems/number-of-islands/)\n\n```python\ndef bfsComponent(grid, sr, sc, targetValue, markValue):\n    from collections import deque\n\n    if not grid or not grid[0]:\n        return 0\n\n    m = len(grid)\n    n = len(grid[0])\n    q = deque([(sr, sc)])\n    grid[sr][sc] = markValue\n    area = 0\n\n    while q:\n        x, y = q.popleft()\n        area += 1\n\n        for dx, dy in ((0, 1), (0, -1), (1, 0), (-1, 0)):\n            nx = x + dx\n            ny = y + dy\n            if nx \u003c 0 or nx >= m or ny \u003c 0 or ny >= n or grid[nx][ny] != targetValue:\n                continue\n            grid[nx][ny] = markValue\n            q.append((nx, ny))\n\n    return area\n```\n\n#### 变形点对照\n\n| 题型 | 外层入口条件 | 入队标记 | 结算方式 |\n|---|---|---|---|\n| 岛屿数量 | `grid[r][c] == 1` | 改成 `0` | 发现入口时 `ans += 1`，BFS 返回值不用 |\n| 最大岛屿面积 | `grid[r][c] == 1` | 改成 `0` | `ans = max(ans, bfsComponent(...))` |\n| 区域染色 | 起点颜色 `oldColor` | 改成 `newColor` | 不需要外层枚举，只从起点 BFS |\n\n区域染色只需要把入口从“全图枚举”改成“从给定起点开始”，并处理新旧颜色相同的特殊情况：\n\n```python\noldColor = image[sr][sc]\nif oldColor != newColor:\n    bfsComponent(image, sr, sc, oldColor, newColor)\n```\n\n#### 易错点\n\n- 出队时才标记，导致同一节点被多个父节点重复加入。\n- 发现新陆地后只处理起点，没把整个连通块扩展完。\n- 区域染色没处理 `oldColor == newColor`，导致标记失效。\n- 忘记空网格判断。\n\n### 5.4 多源 BFS 按层扩散模板\n\n#### 适用题型\n\n- 腐烂的橘子。\n- 01 矩阵距离。\n- 多个源点同时向外扩散的最短时间、最近距离问题。\n\n#### 核心思路\n\n多源 BFS 的共同点是“所有源点共同构成第 0 层”。腐烂橘子和 01 矩阵距离的队列推进逻辑相同，差异只在源点定义、访问标记和答案记录位置。\n\n关键不变量：\n\n- 第 0 层必须一次性放入所有源点。\n- 邻居第一次入队就是最短触达，因此入队时立刻写状态或距离。\n- 如果答案是时间，按层推进；如果答案是距离矩阵，可以直接用父节点距离 + 1。\n\n#### 代码模板：共同骨架\n\n> **题目简述：** 本模板用于：腐烂的橘子。；01 矩阵距离。；多个源点同时向外扩散的最短时间、最近距离问题。 [994 原题 ↗](https://leetcode.cn/problems/rotting-oranges/) · [542 原题 ↗](https://leetcode.cn/problems/01-matrix/)\n\n```python\ndef multiSourceSpread(grid):\n    from collections import deque\n\n    if not grid or not grid[0]:\n        return 0\n\n    m = len(grid)\n    n = len(grid[0])\n    q = deque()\n    fresh = 0\n\n    for r in range(m):\n        for c in range(n):\n            if grid[r][c] == 2:\n                q.append((r, c))\n            elif grid[r][c] == 1:\n                fresh += 1\n\n    minutes = 0\n    while q and fresh > 0:\n        size = len(q)\n        for _ in range(size):\n            r, c = q.popleft()\n\n            for dr, dc in ((0, 1), (0, -1), (1, 0), (-1, 0)):\n                nr = r + dr\n                nc = c + dc\n                if nr \u003c 0 or nr >= m or nc \u003c 0 or nc >= n or grid[nr][nc] != 1:\n                    continue\n                grid[nr][nc] = 2\n                fresh -= 1\n                q.append((nr, nc))\n        minutes += 1\n\n    return minutes if fresh == 0 else -1\n```\n\n01 矩阵距离沿用同一主循环，只做局部替换：\n\n> **题目简述：** 本模板用于：腐烂的橘子。；01 矩阵距离。；多个源点同时向外扩散的最短时间、最近距离问题。 [994 原题 ↗](https://leetcode.cn/problems/rotting-oranges/) · [542 原题 ↗](https://leetcode.cn/problems/01-matrix/)\n\n```python\ndef template_216(grid):\n    from collections import deque\n\n    if not grid or not grid[0]:\n        return []\n\n    m = len(grid)\n    n = len(grid[0])\n    dist = [[-1] * n for _ in range(m)]\n    q = deque()\n\n    for r in range(m):\n        for c in range(n):\n            if grid[r][c] == 0:\n                dist[r][c] = 0\n                q.append((r, c))\n\n    while q:\n        r, c = q.popleft()\n\n        for dr, dc in ((0, 1), (0, -1), (1, 0), (-1, 0)):\n            nr = r + dr\n            nc = c + dc\n            if nr \u003c 0 or nr >= m or nc \u003c 0 or nc >= n or dist[nr][nc] != -1:\n                continue\n            dist[nr][nc] = dist[r][c] + 1\n            q.append((nr, nc))\n\n    return dist\n```\n\n#### 变形点对照\n\n| 题型 | 第 0 层源点 | 入队标记 | 答案形态 |\n|---|---|---|---|\n| 腐烂橘子 | `grid == 2` | `grid[nr][nc] = 2`，`fresh -= 1` | 返回分钟数或 `-1` |\n| 01 矩阵距离 | `grid == 0` | `dist = dist[parent] + 1` | 返回整张 `dist` 表 |\n| 最近设施距离 | 所有设施点 | 写距离或 visited | 返回每个格子的最近距离 |\n\n#### 易错点\n\n- 只把一个源点入队，破坏“同时扩散”。\n- 分钟数按层增加，不能每弹出一个节点就加一分钟。\n- 不在入队时标记，导致同一个格子被多个源点重复入队。\n- 距离矩阵不需要 `fresh`，不要把腐烂橘子的状态变量硬搬过去。\n\n### 5.5 拓扑排序 BFS 模板\n\n#### 适用题型\n\n- 课程表。\n- 任务依赖调度。\n- 有向图判环、生成合法执行顺序。\n\n#### 核心思路\n\n拓扑 BFS 的队列不表示距离，而表示“当前入度为 0、已经可以执行”的节点。每弹出一个节点，相当于删除它的出边，并让后继节点入度减一。最终能弹出所有节点说明无环；剩下弹不出的节点被环卡住。\n\n#### 代码模板\n\n> **题目简述：** 本模板用于：课程表。；任务依赖调度。；有向图判环、生成合法执行顺序。 [力扣原题 ↗](https://leetcode.cn/problems/course-schedule/)\n\n```python\ndef canFinishByTopo(n, prerequisites):\n    from collections import deque\n\n    edges = [[] for _ in range(n)]\n    indeg = [0] * n\n\n    for course, pre in prerequisites:\n        edges[pre].append(course)\n        indeg[course] += 1\n\n    q = deque()\n    for i in range(n):\n        if indeg[i] == 0:\n            q.append(i)\n\n    learned = 0\n    while q:\n        u = q.popleft()\n        learned += 1\n\n        for v in edges[u]:\n            indeg[v] -= 1\n            if indeg[v] == 0:\n                q.append(v)\n\n    return learned == n\n```\n\n#### 易错点\n\n- 建图方向反了：`[a, b]` 表示 `b: a`。\n- 用“队列最后为空”判断是否无环；队列总会为空，应该比较弹出节点数。\n- 入度减到 0 时忘记入队。\n\n### 5.6 状态图 BFS 最少操作次数模板\n\n#### 适用题型\n\n- 完全平方数：状态是剩余值，每次减一个平方数。\n- 零钱兑换：状态是金额或剩余金额，每次加/减一个硬币。\n- 任意无权图最短步数问题。\n\n#### 核心思路\n\n把每个状态看成图节点，每次合法操作看成一条无权边。BFS 按操作次数分层，第一次到达目标状态时就是最少次数。visited 要在入队时标记，因为第一次入队已经保证是最短距离。\n\n#### 代码模板\n\n代码 A：剩余值递减到 0\n\n> **题目简述：** 本模板用于：完全平方数：状态是剩余值，每次减一个平方数。；零钱兑换：状态是金额或剩余金额，每次加/减一个硬币。；任意无权图最短步数问题。 [279 原题 ↗](https://leetcode.cn/problems/perfect-squares/) · [322 原题 ↗](https://leetcode.cn/problems/coin-change/)\n\n```python\ndef shortestSteps(start, moves):\n    visited = [False for _ in range(start + 1)]\n    q = deque()\n    q.append(start)\n    visited[start] = True\n\n    step = 0\n    while not not q:\n        size = len(q)  # 当前层所有状态都需要 step 次操作到达。\n\n        for i in range(0, size):\n            cur = q[0]\n            q.pop()\n\n            if cur == 0:\n                return step  # 第一次到达目标，必然是最少操作次数。\n\n            for move in moves:\n                next = cur - move\n                if next \u003c 0 or visited[next]:\n                    continue\n                visited[next] = True  # 入队时标记，锁定最短距离。\n                q.append(next)\n\n        step += 1\n\n    return -1\n\ndef numSquaresBfs(n):\n    squares = []\n    for x in range(1, 0):\n        squares.append(x * x)\n    return shortestSteps(n, squares)\n```\n\n代码 B：金额从 0 递增到 amount / 零钱兑换 BFS 变形\n\n> **题目简述：** 本模板用于：完全平方数：状态是剩余值，每次减一个平方数。；零钱兑换：状态是金额或剩余金额，每次加/减一个硬币。；任意无权图最短步数问题。 [279 原题 ↗](https://leetcode.cn/problems/perfect-squares/) · [322 原题 ↗](https://leetcode.cn/problems/coin-change/)\n\n```python\ndef coinChangeBfs(coins, amount):\n    if amount == 0:\n        return 0\n\n    visited = [False for _ in range(amount + 1)]\n    q = deque()\n    q.append(0)\n    visited[0] = True\n\n    step = 0\n    while not not q:\n        size = len(q)\n        step += 1  # 扩展到下一层，表示再使用一枚硬币。\n\n        for i in range(0, size):\n            cur = q[0]\n            q.pop()\n\n            for coin in coins:\n                next = cur + coin\n                if next \u003c= amount and not visited[next]:\n                    if next == amount:\n                        return step  # 第一次到达 amount，就是最少硬币数。\n                    visited[next] = True\n                    q.append(next)\n\n    return -1\n```\n\n#### 易错点\n\n- 无 visited 导致状态重复爆炸。\n- 把加权边问题套普通 BFS；普通 BFS 只适合边权相同的最短路。\n- 目标判断位置混乱；按层 BFS 中第一次遇到目标即可返回当前层数。\n\n## 6. 高频易错点清单\n\n| 易错点 | 典型题目 | 规避方式 |\n|---|---|---|\n| BFS 层序没有固定当前层长度 | `102`、`199`、`994` | 每层开始先 `level_size = len(q)` |\n| 空树或空网格没处理 | `102`、`200` | 入队前先判断输入为空 |\n| visited 出队时才标记 | `200`、`994`、`279` | 决定入队时立即标记 |\n| 右视图取错节点 | `199` | 每层最后一个弹出的节点是右视图，也可先看 `q.back()` |\n| 对称树队列没有成对入队 | `101` | 一次比较两个镜像节点 |\n| 岛屿 BFS 没吃完整块 | `200` | 从新陆地出发，把整块相邻陆地全部标记 |\n| 多源 BFS 只放一个源点 | `994` | 初始化时所有腐烂橘子全部入队 |\n| 腐烂橘子分钟数每个节点加一次 | `994` | 每处理完一层才加一分钟 |\n| 腐烂橘子没统计 fresh | `994` | 用 fresh 判断是否仍有无法到达的新鲜橘子 |\n| 课程表建图方向反了 | `207` | `[a, b]` 表示 `b: a` |\n| 拓扑排序只看队列是否为空 | `207` | 比较弹出节点数是否等于课程数 |\n| 状态 BFS 没有 visited 导致重复爆炸 | `279`、`322` | 新状态入队前检查并标记 visited |\n\n## 7. 最短复盘口诀\n\nBFS 题先问“层代表什么”。树题层代表深度，网格题层代表距离或分钟，多源题所有源点第 0 层一起入队，拓扑题层代表当前可执行节点，状态图层代表操作次数。队列每层先固定 `size`，入队时立刻标记 visited，第一次到达目标就是无权最短路。`102` 是层序母题，`994` 是多源 BFS 母题，`207` 是拓扑 BFS 母题，`279/322` 是状态图 BFS 理解题。\n\n\n\n================================================================================\n\n# 第19部分: 设计\n\n================================================================================\n\n> 目标：本文把 Hot100 设计题抽象成“接口语义、数据结构组合、复杂度约束、状态一致性”的复习笔记。复习时先从操作复杂度反推底层结构，再写清每个接口如何维护不变量。\n\n## 1. 设计题的底层模型\n\n设计题的核心在于同时满足多个操作的复杂度要求。每道设计题先问六个问题：\n\n| 问题 | 如果答案是“是” | 常用处理 |\n|---|---|---|\n| 是否要求 O(1) 查询并调整顺序 | LRU 缓存 | dict + 双向链表 |\n| 是否要求栈顶和最小值都 O(1) | 最小栈 | 数据栈 + 辅助最小栈 |\n| 是否要求前缀查询 | Trie | 多叉字符节点 + `isEnd` |\n| 是否要求动态维护中位数 | 数据流中位数 | 大根堆 + 小根堆 |\n| 是否有多个结构存同一批数据 | LRU、双堆 | 每次操作都要同步维护 |\n| 是否接口有隐藏不变量 | 容量、堆大小、单词终止 | 写完接口后检查不变量是否仍成立 |\n\n设计题常见的数据结构组合：\n\n| 组合 | 各自职责 | 代表题 |\n|---|---|---|\n| dict + 双向链表 | dict 定位节点，链表维护顺序 | `146` |\n| 普通栈 + 最小栈 | 一个存值，一个存当前最小值 | `155` |\n| Trie 节点数组 | 路径表示前缀，终止标记表示单词 | `208` |\n| 大根堆 + 小根堆 | 左半部分最大值，右半部分最小值 | `295` |\n\n## 2. Hot100 设计题型地图\n\n设计专题覆盖 4 道典型题，分别代表缓存、栈、前缀树和数据流四类高频设计模型。\n\n| 题型 | 题目 | 抽象能力 | 一句话记忆 |\n|---|---|---|---|\n| O(1) 缓存淘汰 | `146 LRU 缓存` | 哈希表定位 + 双向链表调序 | dict 找节点，链表排冷热 |\n| O(1) 辅助查询 | `155 最小栈` | 主结构和辅助结构同步 | minStack 栈顶就是当前最小值 |\n| 前缀路径结构 | `208 实现 Trie` | 字符路径、节点创建、终止标记 | `isEnd` 区分完整单词和前缀 |\n| 动态中位数 | `295 数据流的中位数` | 双堆平衡和堆顶含义 | 左堆不小于右堆，堆顶给中位数 |\n\n## 3. 复习顺序建议\n\n建议按“单结构增强 → 树形结构 → 多结构同步”的顺序复习：\n\n1. `155 最小栈`：理解辅助结构同步维护额外查询能力。\n2. `208 Trie`：掌握节点定义、路径插入和前缀查询。\n3. `295 数据流中位数`：掌握两个堆的大小平衡和大小关系。\n4. `146 LRU 缓存`：综合哈希表、双向链表、容量淘汰和状态一致性。\n\n## 4. 关键套路详解\n\n### 4.1 从复杂度反推结构\n\n`146 LRU` 要求 `get` 和 `put` 都是 O(1)。单独用数组或链表无法 O(1) 查找 key，单独用dict 无法 O(1) 找到最久未使用元素并调整顺序。因此必须组合：dict 负责 key 到节点，双向链表负责 O(1) 删除任意节点和移动到头部。\n\n设计题看到多个操作都要求高复杂度时，通常需要多个结构各司其职。\n\n### 4.2 辅助结构必须和主结构同步\n\n`155 最小栈` 的辅助栈可以每次 push 当前最小值。这样 `data` 和 `mins` 长度始终一致，pop 时两个栈一起弹，最不容易错。\n\n如果选择只在新值小于等于当前最小值时压入 `mins`，也可以，但 pop 时必须在弹出的值等于当前最小值时同步弹出 `mins`。\n\n### 4.3 Trie 的节点表示“前缀状态”\n\nTrie 根节点表示空前缀。插入单词时，每走一个字符就进入下一层节点；没有边就新建。`search` 和 `startsWith` 的遍历过程相同，区别只在最后：`search` 必须要求 `isEnd == true`，`startsWith` 只要路径存在。\n\n最容易错的是把前缀存在当成完整单词存在。\n\n### 4.4 双堆维护中位数有两个不变量\n\n`295 数据流中位数` 中大根堆 `small` 存较小的一半，小根堆 `large` 存较大的一半。两个不变量必须同时成立：\n\n| 不变量 | 含义 |\n|---|---|\n| 大小平衡 | `len(small)` 等于 `len(large)`，或只比它多 1 |\n| 顺序正确 | `-small[0] \u003c= large[0]`，左半部分都不大于右半部分 |\n\n插入一个数后，先放入某个堆，再通过移动堆顶恢复这两个不变量。查中位数时，如果总数为奇数，返回 `-small[0]`；偶数则返回两个堆顶平均值。\n\n### 4.5 LRU 的链表要用哑头哑尾\n\n双向链表用哑头和哑尾可以让插入头部、删除尾部前一个节点、删除任意节点都没有None特判。约定头部表示最近使用，尾部表示最久未使用。\n\n每次 `get` 命中和 `put` 更新都要把节点移动到头部。超过容量时删除 `tail.prev`，并同步从dict 中删除对应 key。\n\n## 5. 抽象代码模板\n\n下面模板按设计题的接口语义组织。复习时先写清每个接口要维护的不变量，再补数据结构组合；接口名尽量贴近 LeetCode 原题，方便迁移。\n\n### 5.1 MinStack 最小栈\n\n#### 适用题型\n\n- `155 最小栈`：`push`、`pop`、`top`、`getMin` 都要求 O(1)。\n- 栈结构需要同时支持历史最小值、最大值等聚合查询。\n- 主结构变化后辅助信息必须同步更新的设计题。\n\n#### 核心思路\n\n原始笔记使用一个 `list[tuple[int, int]]`：`tuple[0]` 存真实入栈值，`tuple[1]` 存“压入该节点后，整个栈的最小值”。初始化时先压入哨兵 `(0, float(\"inf\"))`，这样第一次 `push` 可以统一写 `min(val, self.st[-1][1])`，不需要单独判断空栈。\n\n关键不变量：\n\n- `self.st[-1][0]` 是当前栈顶元素。\n- `self.st[-1][1]` 是当前真实栈内最小值。\n- 底部哨兵只服务初始化，题目保证 `pop/top/getMin` 不会在空真实栈上调用。\n\n#### 代码模板\n\n> **题目简述：** 155 最小栈：设计支持压栈、出栈、查看栈顶和获取最小值且操作均为 O(1) 的栈。 [力扣原题 ↗](https://leetcode.cn/problems/min-stack/)\n\n```python\nclass MinStack:\n    def __init__(self):\n        # (真实值, 截止当前栈顶的最小值)。哨兵让第一次 push 也能直接读栈顶最小值。\n        self.st = [(0, float('inf'))]\n\n    def push(self, val):\n        current_min = min(val, self.st[-1][1])\n        self.st.append((val, current_min))\n\n    def pop(self):\n        self.st.pop()\n\n    def top(self):\n        return self.st[-1][0]\n\n    def getMin(self):\n        return self.st[-1][1]\n```\n\n#### 变形点对照\n\n| 写法 | 存储结构 | 优点 | 注意事项 |\n|---|---|---|---|\n| 原始 `pair` 栈 | 每个节点同时存值和当前最小值 | 一个栈就能同步弹出 | 需要哨兵或空栈特判 |\n| 双栈写法 | 主栈存值，辅助栈存每层最小值 | 语义拆开更直观 | 两个栈必须每次 `push/pop` 同步 |\n| 只存更小值辅助栈 | 辅助栈只在出现新最小时入栈 | 节省部分空间 | 重复最小值和 `pop` 相等判断容易错 |\n\n#### 易错点\n\n- 辅助信息只在严格更小时更新，遇到重复最小值时弹出逻辑容易错误。\n- `tuple[1]` 表示“当前深度最小值”，不能当当前节点自己的值。\n- 哨兵存在时不要把它当真实元素返回；题目调用接口时真实栈非空。\n\n### 5.2 Trie 前缀树\n\n#### 适用题型\n\n- `208 实现 Trie`：`insert`、`search`、`startsWith`。\n- 前缀查询、自动补全、敏感词匹配、单词替换。\n- 固定字符集路径结构题。\n\n#### 核心思路\n\n根节点表示空前缀，每条边表示追加一个字符。插入时沿字符路径创建节点，最后把终点标记为完整单词。`search` 和 `startsWith` 都先查路径，区别是 `search` 还要求终点 `isEnd == true`。\n\n原始笔记在三个接口里重复写遍历逻辑；专题模板把公共遍历抽成 `findNode`，这是等价重构，不改变原始 `children[26] + isEnd` 的核心写法。\n\n关键不变量：\n\n- `children[i]` 表示接上第 `i` 个字符后的下一前缀状态。\n- `isEnd` 只标记完整单词结尾，不代表所有前缀都是单词。\n- `root` 必须在构造函数中初始化。\n\n#### 代码模板\n\n> **题目简述：** 208 实现 Trie：设计前缀树，支持插入单词、查询完整单词和判断是否存在指定前缀。 [力扣原题 ↗](https://leetcode.cn/problems/implement-trie-prefix-tree/)\n\n```python\nclass Trie:\n    class Node:\n        def __init__(self):\n            self.next = [None] * 26\n            self.isEnd = False\n\n    def __init__(self):\n        self.root = self.Node()\n\n    def _findNode(self, text):\n        cur = self.root\n        for ch in text:\n            idx = ord(ch) - ord('a')\n            if cur.next[idx] is None:\n                return None\n            cur = cur.next[idx]\n        return cur\n\n    def insert(self, word):\n        cur = self.root\n        for ch in word:\n            idx = ord(ch) - ord('a')\n            if cur.next[idx] is None:\n                cur.next[idx] = self.Node()\n            cur = cur.next[idx]\n        cur.isEnd = True\n\n    def search(self, word):\n        node = self._findNode(word)\n        return node is not None and node.isEnd\n\n    def startsWith(self, prefix):\n        return self._findNode(prefix) is not None\n```\n\n#### 易错点\n\n- `search` 只判断路径存在，把前缀误判成完整单词。\n- 构造函数没有初始化根节点。\n- 字符集超出小写字母时不要硬用 26 数组，应改成 `dict[str, Node]`。\n\n### 5.3 MedianFinder 数据流中位数\n\n#### 适用题型\n\n- `295 数据流的中位数`：`addNum`、`findMedian`。\n- 动态插入并查询中位数。\n- 需要维护有序分区但不需要完整排序的数据流题。\n\n#### 核心思路\n\n原始笔记使用两个堆维护左右两半：`maxHeap` 是大顶堆，保存较小一半；`minHeap` 是小顶堆，保存较大一半。插入时先“无脑进入左边”，再把左边堆顶移到右边，保证左右顺序；如果右边数量更多，再把右边堆顶移回左边，保证左边数量不少于右边。\n\n关键不变量：\n\n- `maxHeap` 中任意元素 `\u003c= minHeap` 中任意元素。\n- `len(max_heap) == len(min_heap)` 或 `len(max_heap) == len(min_heap) + 1`。\n- 奇数个元素时中位数是 `-max_heap[0]`；偶数个元素时是两个堆顶均值。\n\n#### 代码模板\n\n> **题目简述：** 295 数据流的中位数：设计结构持续接收整数，并能随时返回当前所有数据的中位数。 [力扣原题 ↗](https://leetcode.cn/problems/find-median-from-data-stream/)\n\n```python\nclass MedianFinder:\n    def __init__(self):\n        import heapq\n        self.heapq = heapq\n        self.maxHeap = []  # 左半边，用负数模拟大顶堆。\n        self.minHeap = []  # 右半边，小顶堆。\n\n    def addNum(self, num):\n        self.heapq.heappush(self.maxHeap, -num)\n        self.heapq.heappush(self.minHeap, -self.heapq.heappop(self.maxHeap))\n\n        if len(self.minHeap) > len(self.maxHeap):\n            self.heapq.heappush(self.maxHeap, -self.heapq.heappop(self.minHeap))\n\n    def findMedian(self):\n        if len(self.maxHeap) > len(self.minHeap):\n            return -self.maxHeap[0]\n        return (-self.maxHeap[0] + self.minHeap[0]) / 2.0\n```\n\n#### 变形点对照\n\n| 写法 | 插入流程 | 优点 | 注意事项 |\n|---|---|---|---|\n| 原始写法 | 先进左堆，再移动左堆顶到右堆，最后平衡数量 | 不需要先判断 `num` 属于哪边 | 三步顺序不要调换 |\n| 条件插入写法 | 先和左堆顶比较，再进入对应堆 | 语义直观 | 插入后仍要同时维护顺序和大小平衡 |\n| 支持删除变体 | 双堆 + 延迟删除 | 可处理滑动窗口中位数 | 普通堆不能 O(log n) 删除任意元素 |\n\n#### 易错点\n\n- 只做大小平衡，没保证左半部分都小于等于右半部分。\n- 原始三步流程中，少了“左堆顶移到右堆”会让两个堆的有序分区失效。\n- 偶数中位数如果值域更大，应先直接用 `/ 2.0`，避免相加溢出。\n\n### 5.4 LRUCache dict + 双向链表\n\n#### 适用题型\n\n- `146 LRU 缓存`：`get`、`put` 都要求 O(1)。\n- 需要 O(1) 定位元素，同时维护最近使用顺序的缓存题。\n- 命中、更新、插入、淘汰都必须同步多结构的设计题。\n\n#### 核心思路\n\n原始笔记使用“哈希表 + 手写双向链表”。dict 负责 `key: Node` 的 O(1) 定位；双向链表负责 O(1) 删除任意节点和移动到头部。约定 `head` 后面是最近使用，`tail` 前面是最久未使用。`get` 命中后刷新到头部；`put` 更新已有 key 也刷新到头部；插入新 key 后若超过容量，删除 `tail.prev` 并同步删除哈希表。\n\n关键不变量：\n\n- `map` 中的每个 key 都对应链表中的一个真实节点。\n- 链表从 `head.next` 到 `tail.prev` 按最近使用到最久使用排序。\n- 淘汰链表节点时必须先拿到 key 并 `del cache[key]`，再从链表摘除并 释放引用。\n- 哑头哑尾永远存在，不存真实业务数据。\n\n#### 代码模板\n\n> **题目简述：** 146 LRU 缓存：设计定容量缓存，使查询和写入均为平均 O(1)，满时淘汰最久未使用项。 [力扣原题 ↗](https://leetcode.cn/problems/lru-cache/)\n\n```python\nclass Node:\n    def __init__(self, key=0, value=0):\n        self.key = key\n        self.value = value\n        self.prev = None\n        self.next = None\n\n\nclass LRUCache:\n    def __init__(self, capacity):\n        self.cap = capacity\n        self.map = {}\n        self.head = Node()\n        self.tail = Node()\n        self.head.next = self.tail\n        self.tail.prev = self.head\n\n    def _remove(self, node):\n        node.prev.next = node.next\n        node.next.prev = node.prev\n\n    def _add(self, node):\n        node.prev = self.head\n        node.next = self.head.next\n        self.head.next.prev = node\n        self.head.next = node\n\n    def get(self, key):\n        if key not in self.map:\n            return -1\n        node = self.map[key]\n        self._remove(node)\n        self._add(node)\n        return node.value\n\n    def put(self, key, value):\n        if key in self.map:\n            node = self.map[key]\n            node.value = value\n            self._remove(node)\n            self._add(node)\n            return\n\n        node = Node(key, value)\n        self.map[key] = node\n        self._add(node)\n\n        if len(self.map) > self.cap:\n            old = self.tail.prev\n            del self.map[old.key]\n            self._remove(old)\n```\n\n#### 变形点对照\n\n| 操作 | 是否改哈希表 | 是否改链表 | 刷新位置 |\n|---|---|---|---|\n| `get` 命中 | 否 | `remove + add` | 移到头部 |\n| `get` 未命中 | 否 | 否 | 返回 `-1` |\n| `put` 更新旧 key | 否 | `rem
