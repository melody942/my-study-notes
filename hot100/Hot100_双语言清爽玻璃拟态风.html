n```\n\n#### 易错点\n\n- 把全局答案当成 DFS 返回值返回，导致父节点收到一条已经分叉的路径。\n- 最大路径和不截断负贡献。\n- 类成员 `ans` 未在入口函数重置。\n\n### 5.4 树上前缀和回溯 DFS 模板\n\n#### 适用题型\n\n- 路径总和 III。\n- 树上祖先到后代路径和计数。\n- 当前路径历史状态查询。\n\n#### 核心思路\n\n`prefix[sum]` 只代表当前递归路径上的历史前缀和。进入当前节点后，先用 `curSum - target` 查询能形成多少条合法路径，再把当前前缀加入历史；递归完左右子树后撤销，防止左子树历史污染右子树。\n\n#### 代码模板\n\n> **题目简述：** 本模板用于：路径总和 III。；树上祖先到后代路径和计数。；当前路径历史状态查询。 [力扣原题 ↗](https://leetcode.cn/problems/path-sum-iii/)\n\n```cpp\nclass TreePrefixDfsTemplate {\nprivate:\n    int dfs(TreeNode* root,\n            long long curSum,\n            long long target,\n            unordered_map\u003clong long, int>& prefix) {\n        // 返回值语义：当前子树内满足 target 的路径条数。\n        if (!root) {\n            return 0;\n        }\n\n        curSum += root->val;\n        int count = prefix[curSum - target];\n\n        prefix[curSum]++; // 做选择：当前节点加入“当前路径历史”。\n        count += dfs(root->left, curSum, target, prefix);\n        count += dfs(root->right, curSum, target, prefix);\n        prefix[curSum]--; // 撤销选择：返回父节点前恢复现场。\n\n        return count;\n    }\n\npublic:\n    int pathSum(TreeNode* root, int targetSum) {\n        unordered_map\u003clong long, int> prefix;\n        prefix[0] = 1; // 根到当前节点刚好等于 target 时，需要这条空前缀。\n        return dfs(root, 0, targetSum, prefix);\n    }\n};\n```\n\n#### 易错点\n\n- 递归左右后忘记 `prefix[curSum]--`。\n- `prefix` 是当前路径记录，不能当全局访问记录。\n- 前缀和使用 `int` 可能溢出。\n\n### 5.5 LCA 后序查找 DFS 模板\n\n#### 适用题型\n\n- `236 二叉树的最近公共祖先`。\n- 树上查找两个目标节点并向上返回命中结果。\n- 多目标 LCA、不保证目标存在等变形。\n\n#### 核心思路\n\nLCA 是后序 DFS：当前节点先向左右子树询问是否找到了目标或 LCA，再根据左右结果决定返回什么。返回值语义必须明确：如果当前子树找到了 `p`、`q` 或 LCA，就返回对应节点；如果都没找到，就返回 `nullptr`。左右都非空时，当前节点就是两个目标的首次汇合点。\n\n#### 代码模板\n\n> **题目简述：** 236 二叉树的最近公共祖先：给定二叉树及其中两个结点，返回同时包含二者的最深祖先结点。 [力扣原题 ↗](https://leetcode.cn/problems/lowest-common-ancestor-of-a-binary-tree/)\n\n```cpp\nTreeNode* lowestCommonAncestorDfs(TreeNode* root, TreeNode* p, TreeNode* q) {\n    // 返回值语义：找到 p/q/LCA 就返回对应节点；当前子树都没找到就返回 nullptr。\n    if (!root || root == p || root == q) {\n        return root;\n    }\n\n    TreeNode* left = lowestCommonAncestorDfs(root->left, p, q);\n    TreeNode* right = lowestCommonAncestorDfs(root->right, p, q);\n\n    if (left && right) {\n        return root; // 两个目标分别在左右子树，当前节点是最近公共祖先。\n    }\n\n    return left ? left : right; // 只找到一侧时，把命中结果继续向上传递。\n}\n```\n\n#### 易错点\n\n- 命中 `p` 或 `q` 时应直接返回当前节点，不要继续把目标节点下面的结构混进判断。\n- 普通二叉树 LCA 不能按值大小剪枝，那是 BST 专属变形。\n- 如果题目不保证两个目标都存在，需要额外统计命中数量，否则可能返回唯一存在的节点。\n\n### 5.6 网格 DFS 永久染色模板\n\n#### 适用题型\n\n- 岛屿数量。\n- 区域染色 / 图像渲染。\n- 连通块面积、连通块个数等访问后不需要恢复的题。\n\n#### 核心思路\n\n这类题共享同一个 flood fill 骨架：DFS 入口判断越界和目标值，进入后立即永久染色，再递归四个方向。不同题型只改“目标值是什么”“染成什么”“返回值要不要统计面积”。\n\n关键不变量：\n\n- 当前格子一旦被处理，就不应该再参与其他连通块。\n- 进入 DFS 后先标记，再递归邻居，避免环形连通块无限递归。\n- 连通块统计是永久染色，不需要退出时恢复。\n\n#### 代码模板：共同骨架\n\n> **题目简述：** 本模板用于：岛屿数量。；区域染色 / 图像渲染。；连通块面积、连通块个数等访问后不需要恢复的题。 [力扣原题 ↗](https://leetcode.cn/problems/number-of-islands/)\n\n```cpp\nint floodFillDfs(vector\u003cvector\u003cint>>& grid, int r, int c, int targetValue, int markValue) {\n    int m = grid.size();\n    int n = grid[0].size();\n    if (r \u003c 0 || r >= m || c \u003c 0 || c >= n || grid[r][c] != targetValue) {\n        return 0;\n    }\n\n    grid[r][c] = markValue; // 共同动作：永久染色，修改本身就是 visited。\n    int area = 1;           // 面积变形需要返回；数量题可以忽略。\n\n    area += floodFillDfs(grid, r + 1, c, targetValue, markValue);\n    area += floodFillDfs(grid, r - 1, c, targetValue, markValue);\n    area += floodFillDfs(grid, r, c + 1, targetValue, markValue);\n    area += floodFillDfs(grid, r, c - 1, targetValue, markValue);\n    return area;\n}\n```\n\n#### 变形点对照\n\n| 题型 | 外层入口 | DFS 参数 | 答案结算 |\n|---|---|---|---|\n| 岛屿数量 | 遍历中发现 `grid[r][c] == 1` | `targetValue = 1`，`markValue = 0` | 入口处 `ans++`，DFS 只负责染掉整块 |\n| 最大岛屿面积 | 遍历中发现 `grid[r][c] == 1` | `targetValue = 1`，`markValue = 0` | `ans = max(ans, floodFillDfs(...))` |\n| 区域染色 | 只从 `(sr, sc)` 开始 | `targetValue = oldColor`，`markValue = newColor` | 不需要外层计数，只执行染色 |\n| `char` 岛屿网格 | 遍历中发现 `'1'` | 把 `1/0` 换成 `'1'/'0'` | 骨架不变，只换值类型 |\n\n区域染色必须额外处理新旧颜色相同的情况：\n\n```cpp\nint oldColor = image[sr][sc];\nif (oldColor != newColor) {\n    floodFillDfs(image, sr, sc, oldColor, newColor);\n}\n```\n\n#### 易错点\n\n- 忘记进入后立刻标记，导致四方向递归互相回到旧格子。\n- 把回溯题的恢复逻辑搬到连通块题里，导致染色失效。\n- 区域染色没判断 `oldColor == newColor`，递归会反复进入同色区域。\n- 面积题只在外层 `ans++`，没有让 DFS 返回当前连通块大小。\n\n### 5.7 网格回溯 DFS 恢复模板\n\n#### 适用题型\n\n- `79 单词搜索`。\n- 棋盘路径搜索、路径枚举。\n- 访问限制只对当前路径有效，退出分支后必须恢复的题。\n\n#### 核心思路\n\n回溯类网格 DFS 的访问标记只属于当前路径。进入格子后临时占用，递归搜索下一步；无论搜索失败还是提前成功返回，都要恢复原字符，让兄弟分支和其他起点继续使用该格子。\n\n#### 代码模板\n\n> **题目简述：** 79 单词搜索：判断单词能否由字符网格中上下左右相邻且不重复使用的单元格组成。 [力扣原题 ↗](https://leetcode.cn/problems/word-search/)\n\n```cpp\nclass GridBacktrackingDfsTemplate {\nprivate:\n    int dirs[4][2] = {{0, 1}, {0, -1}, {1, 0}, {-1, 0}};\n\n    bool dfs(vector\u003cvector\u003cchar>>& board, string& word, int r, int c, int k) {\n        // 返回值语义：从 (r,c) 开始，能否匹配 word[k...]。\n        int m = board.size(), n = board[0].size();\n        if (r \u003c 0 || r >= m || c \u003c 0 || c >= n || board[r][c] != word[k]) {\n            return false;\n        }\n        if (k == (int)word.size() - 1) {\n            return true;\n        }\n\n        char old = board[r][c];\n        board[r][c] = '#'; // 做选择：当前路径临时占用该格子。\n\n        for (auto [dr, dc] : dirs) {\n            if (dfs(board, word, r + dr, c + dc, k + 1)) {\n                board[r][c] = old; // 提前成功返回前也必须恢复现场。\n                return true;\n            }\n        }\n\n        board[r][c] = old; // 撤销选择：让其他路径还能使用该格子。\n        return false;\n    }\n\npublic:\n    bool exist(vector\u003cvector\u003cchar>>& board, string word) {\n        if (board.empty() || board[0].empty()) {\n            return false;\n        }\n        for (int r = 0; r \u003c (int)board.size(); r++) {\n            for (int c = 0; c \u003c (int)board[0].size(); c++) {\n                if (dfs(board, word, r, c, 0)) {\n                    return true;\n                }\n            }\n        }\n        return false;\n    }\n};\n```\n\n#### 易错点\n\n- 单词搜索用永久染色，导致其他起点或路径无法使用本该可用的格子。\n- 提前 `return true` 前忘记恢复字符。\n- `k == word.size() - 1` 的成功条件放错，导致最后一个字符无法正确匹配。\n\n\n### 5.8 有向图 DFS 三色判环模板\n\n#### 适用题型\n\n- 课程表。\n- 依赖关系判环。\n- 最终安全节点类问题。\n\n#### 核心思路\n\n三色状态区分“没访问过”“正在当前递归路径中”“已经处理完成”。遇到 `state == 1` 表示回到当前路径上的点，存在环；遇到 `state == 2` 表示这个点之前已经确认安全，可以复用结果。\n\n#### 代码模板\n\n> **题目简述：** 本模板用于：课程表。；依赖关系判环。；最终安全节点类问题。 [力扣原题 ↗](https://leetcode.cn/problems/course-schedule/)\n\n```cpp\nclass DirectedCycleDfsTemplate {\nprivate:\n    vector\u003cvector\u003cint>> edges;\n    vector\u003cint> state; // 0 未访问，1 当前路径中，2 已完成且安全。\n\n    bool dfs(int u) {\n        // 返回值语义：从 u 出发的依赖链是否无环。\n        if (state[u] == 1) {\n            return false; // 回到当前递归路径，发现环。\n        }\n        if (state[u] == 2) {\n            return true;  // 已经确认安全，避免重复搜索。\n        }\n\n        state[u] = 1; // 进入节点：加入当前递归路径。\n        for (int v : edges[u]) {\n            if (!dfs(v)) {\n                return false;\n            }\n        }\n        state[u] = 2; // 退出节点：所有后继安全，当前节点也安全。\n        return true;\n    }\n\npublic:\n    bool canFinish(int n, vector\u003cvector\u003cint>>& prerequisites) {\n        edges.assign(n, {});\n        state.assign(n, 0);\n\n        for (auto& e : prerequisites) {\n            int course = e[0], pre = e[1];\n            edges[pre].push_back(course); // pre -> course，完成 pre 后解锁 course。\n        }\n\n        for (int i = 0; i \u003c n; i++) {\n            if (state[i] == 0 && !dfs(i)) {\n                return false;\n            }\n        }\n        return true;\n    }\n};\n```\n\n#### 易错点\n\n- 只用 `visited` 布尔值，无法区分“当前路径中”和“已完成”。\n- DFS 结束时忘记把 `state[u]` 改为 2。\n- 课程表边方向建反：`[a, b]` 表示 `b -> a`。\n\n## 6. 高频易错点清单\n\n| 易错点 | 典型题目 | 规避方式 |\n|---|---|---|\n| DFS 函数返回值语义不清 | `104`、`543`、`236` | 先写一句“dfs 返回什么” |\n| 把前序、中序、后序当成死模板 | `94`、`98`、`124` | 按“当前节点处理时机”理解 |\n| 贡献型题把全局答案直接返回 | `543`、`124` | 全局答案可左右合并，返回值只能单边延伸 |\n| 最大路径和没有截断负贡献 | `124` | `gain = max(0, dfs(child))` |\n| 树上前缀和没有回溯 | `437` | 递归左右后 `prefix[curSum]--` |\n| LCA 找到一个目标后继续乱处理 | `236` | 命中 `p/q` 直接返回当前节点 |\n| 网格 DFS 忘记越界判断 | `200`、`79` | DFS 入口第一行处理边界和目标值 |\n| 单词搜索提前返回前没恢复现场 | `79` | 所有 return true 前先还原字符 |\n| 岛屿数量没有永久标记 | `200` | 访问过的陆地改成水或 visited |\n| 课程表 DFS 只有 visited 布尔值 | `207` | 用三色状态区分访问中和已完成 |\n| 三色 DFS 退出时忘记设为 2 | `207` | 当前节点所有后继安全后 `state[u] = 2` |\n\n## 7. 最短复盘口诀\n\nDFS 先定义函数语义：处理什么，返回什么。树题看当前节点处理位置，子树题用后序汇总，路径题进入加状态、退出撤状态，贡献题答案能拐弯、返回不能拐弯。网格统计永久染色，路径搜索回溯恢复。有向图判环用三色，遇到访问中就是环。`104` 是分治母题，`543/124` 是贡献母题，`437` 是回溯前缀和母题，`200/79` 是网格 DFS 对照题，`207` 是图染色母题。\n\n\n\n================================================================================\n\n# 第18部分: 广度优先搜索\n\n================================================================================\n\n> 目标：本文把 Hot100 中所有标注“广度优先搜索”的题抽象成队列按层、最短距离、多源扩散、拓扑剥离和状态图搜索等可复用模板。复习时先判断答案是否和层数、最短步数或依赖入度有关，再决定 BFS 形态。\n\n## 1. BFS 题的底层模型\n\nBFS 的核心是“按距离从近到远扩展”。每道 BFS 题先问六个问题：\n\n| 问题 | 如果答案是“是” | 常用处理 |\n|---|---|---|\n| 答案是否按层输出 | 二叉树层序遍历、右视图 | 队列每轮固定当前层 `size` |\n| 是否要求最短步数或最少时间 | 腐烂橘子、完全平方数、零钱兑换状态图 | BFS 层数就是最短距离 |\n| 是否有多个起点同时扩散 | 腐烂橘子、矩阵距离 | 多源全部先入队 |\n| 是否要统计连通块 | 岛屿数量 | 外层枚举起点，BFS 吃完整块 |\n| 是否是依赖关系判环 | 课程表 | 入度为 0 的点入队，拓扑剥离 |\n| 是否能用 DP 更优 | 完全平方数、零钱兑换 | BFS 可理解最短路，DP 常是更直接写法 |\n\nBFS 常见模型有四类：\n\n| BFS 类型 | 队列里放什么 | 层的含义 | 代表题 |\n|---|---|---|---|\n| 树层序 BFS | 树节点 | 树的深度层 | `102`、`199`、`104`、`101`、`226` |\n| 网格 BFS | 坐标 `(r, c)` | 网格距离或扩散分钟 | `200`、`994` |\n| 拓扑 BFS | 入度为 0 的节点 | 当前可执行任务批次 | `207` |\n| 状态图 BFS | 数值状态或剩余金额 | 操作次数 | `279`、`322` |\n\n## 2. Hot100 BFS 题型地图\n\n\n| 题型 | 题目 | 抽象能力 | 一句话记忆 |\n|---|---|---|---|\n| 树层序遍历 | `102 二叉树层序遍历` | 固定每层队列长度 | 每层开始先记 `size` |\n| 树层信息 | `199 右视图`、`104 最大深度` | 层数和每层端点 | BFS 层数就是深度，右视图取每层最后一个 |\n| 树结构处理 | `101 对称二叉树`、`226 翻转二叉树` | 队列同步节点或逐层修改 | 对称树一次弹两个镜像节点 |\n| 网格连通块 | `200 岛屿数量` | BFS 吃掉整座岛 | 发现新陆地，队列扩展全块 |\n| 多源扩散 | `994 腐烂的橘子` | 多个源点同时按分钟扩散 | 所有烂橘子第 0 分钟一起入队 |\n| 拓扑排序 | `207 课程表` | 入度剥离判有向图环 | 能弹完所有课就无环 |\n| 状态图最短路 | `279 完全平方数`、`322 零钱兑换` | 每次操作是一条边 | 第一次到达目标就是最少步数 |\n\n## 3. 复习顺序建议\n\n建议按“队列层序 → 网格扩散 → 拓扑排序 → 状态图”的顺序复习：\n\n1. `102 二叉树层序遍历`：掌握固定当前层 `size`。\n2. `199 二叉树右视图`：练每层端点信息。\n3. `104 最大深度`、`226 翻转二叉树`：理解 BFS 也能做树属性和修改。\n4. `101 对称二叉树`：练队列中一次放入成对节点。\n5. `200 岛屿数量`：练网格 BFS 和永久访问标记。\n6. `994 腐烂的橘子`：掌握多源 BFS 和分钟计数。\n7. `207 课程表`：掌握拓扑排序的入度队列。\n8. `279 完全平方数`：把数字看成状态，边是减去一个平方数。\n9. `322 零钱兑换`：理解 BFS 能求最少硬币数，但 DP 更常用。\n\n## 4. 关键套路详解\n\n### 4.1 BFS 按层题必须固定当前层 size\n\n队列在处理当前层时会不断加入下一层节点。如果直接用动态变化的 `q.size()` 作为循环边界，就会把下一层混进当前层。正确写法是每层开始先固定：\n\n```text\nint size = q.size();\nfor (int i = 0; i \u003c size; i++) { ... }\n```\n\n`102` 每层收集一个数组，`199` 每层取最后一个节点，`104` 每处理完一层深度加一，本质都靠这个固定层长度。\n\n### 4.2 BFS 的 visited 要在入队时标记\n\nBFS 中同一个节点可能被多个父节点同时发现。如果等到出队时才标记，它可能被重复入队，导致重复计算甚至超时。网格 BFS、状态图 BFS、拓扑排序的后继入队，都应在“决定入队”那一刻更新状态。\n\n| 场景 | 标记动作 | 原因 |\n|---|---|---|\n| 网格连通块 | 入队时把陆地改成水或 visited | 避免同一格被多个邻居重复加入 |\n| 腐烂橘子 | 新鲜橘子入队时改成腐烂 | 表示它已被感染，不会重复感染 |\n| 状态图 | 新状态入队时 visited | BFS 第一次到达就是最短 |\n| 拓扑排序 | 入度减到 0 时入队 | 每个节点只在可执行时进入一次 |\n\n### 4.3 多源 BFS 的第 0 层包含所有源点\n\n`994 腐烂的橘子` 最重要的是初始化：所有腐烂橘子都要先入队，作为第 0 分钟的源点。然后每处理完一层，分钟数加一。\n\n如果一个一个腐烂橘子分别 BFS，会把同时扩散误算成先后扩散。多源 BFS 的本质是把多个起点当作同一层的所有节点。\n\n### 4.4 拓扑排序是 BFS 版有向图判环\n\n`207 课程表` 的队列按“当前入度为 0，可以学习”的节点扩展。每弹出一门课，就相当于删除它的出边，让后续课程入度减一。\n\n判断标准是弹出的课程数是否等于总课程数；队列最终为空本身没有判定价值。如果还有节点没弹出，说明它们被环互相卡住。\n\n### 4.5 状态图 BFS 适合最少操作次数\n\n`279 完全平方数` 可以把每个剩余值看成一个节点，从 `n` 出发，每次减去一个平方数，第一次到达 `0` 的层数就是最少平方数个数。`322 零钱兑换` 也可以把金额看成节点，每次加一个硬币或减一个硬币，第一次到达目标金额就是最少硬币数。\n\n但这两题 DP 通常更简洁稳定。BFS 视角的价值是帮助理解“最少次数 = 无权图最短路”。\n\n### 4.6 BFS 和 DFS 的选择标准\n\n| 需求 | 优先方法 | 原因 |\n|---|---|---|\n| 只要遍历完整连通块 | DFS 或 BFS 都可以 | 不关心层数 |\n| 最短步数、最少时间、最近距离 | BFS | 无权图第一时间到达就是最短 |\n| 树的层级输出 | BFS | 队列天然按层 |\n| 当前路径需要撤销状态 | DFS 回溯 | BFS 不适合维护深路径回溯 |\n| 有向图判环 | BFS 拓扑或 DFS 三色 | 两者都可，状态语义不同 |\n\n## 5. 抽象代码模板\n\n下面模板按 BFS 中“层”的语义组织。重点关注层序、多源扩散、拓扑入度和状态图最短路的不变量。\n\n### 5.1 二叉树层序 BFS 模板\n\n#### 适用题型\n\n- 二叉树层序遍历。\n- 二叉树右视图、左视图。\n- 二叉树最大深度 BFS 写法。\n- 每层统计最大值、平均值、宽度等。\n\n#### 核心思路\n\n树层序 BFS 的不变量是：每轮开始时，队列中恰好保存当前层的所有节点。先固定 `size`，本轮只处理这 `size` 个节点；新入队的孩子属于下一层。层数、右视图、每层统计都依赖这个不变量。\n\n#### 代码模板\n\n> **题目简述：** 本模板用于：二叉树层序遍历。；二叉树右视图、左视图。；二叉树最大深度 BFS 写法。；每层统计最大值、平均值、宽度等。 [102 原题 ↗](https://leetcode.cn/problems/binary-tree-level-order-traversal/) · [199 原题 ↗](https://leetcode.cn/problems/binary-tree-right-side-view/) · [104 原题 ↗](https://leetcode.cn/problems/maximum-depth-of-binary-tree/)\n\n```cpp\nstruct TreeNode {\n    int val;\n    TreeNode* left;\n    TreeNode* right;\n    TreeNode(int x = 0) : val(x), left(nullptr), right(nullptr) {}\n};\n\nvector\u003cvector\u003cint>> levelOrder(TreeNode* root) {\n    vector\u003cvector\u003cint>> ans;\n    if (!root) {\n        return ans;\n    }\n\n    queue\u003cTreeNode*> q;\n    q.push(root);\n\n    while (!q.empty()) {\n        int size = q.size(); // 当前层节点数；循环中 q 会加入下一层，不能再动态读取。\n        vector\u003cint> level;\n\n        for (int i = 0; i \u003c size; i++) {\n            TreeNode* node = q.front();\n            q.pop();\n\n            // i == 0 可用于左视图；i == size - 1 可用于右视图。\n            level.push_back(node->val);\n\n            if (node->left) {\n                q.push(node->left);\n            }\n            if (node->right) {\n                q.push(node->right);\n            }\n        }\n\n        ans.push_back(level);\n    }\n\n    return ans;\n}\n```\n\n#### 易错点\n\n- 用变化中的 `q.size()` 作为当前层循环条件。\n- 空树没有提前返回，把空指针放进队列。\n- 右视图取错节点：右视图取每层最后处理的节点，不能只走整棵树最右链。\n\n### 5.2 双节点同步 BFS 模板\n\n#### 适用题型\n\n- `101 对称二叉树` 的迭代写法。\n- 两棵树是否相同、是否镜像、是否互为子结构等同步比较问题。\n- 队列中每个状态是一组需要同时比较的节点。\n\n#### 核心思路\n\n双节点同步 BFS 的队列里放的是“待比较的一对节点”。每次出队后先处理空节点组合，再比较节点值；如果当前这对节点满足关系，就按题目要求把下一组对应节点成对入队。对称树的关键在于镜像配对：外侧对外侧，内侧对内侧。\n\n#### 代码模板\n\n> **题目简述：** 101 对称二叉树：给定二叉树根结点，判断其左右子树是否关于中心互为镜像。 [力扣原题 ↗](https://leetcode.cn/problems/symmetric-tree/)\n\n```cpp\nstruct TreeNode {\n    int val;\n    TreeNode* left;\n    TreeNode* right;\n    TreeNode(int x = 0) : val(x), left(nullptr), right(nullptr) {}\n};\n\nbool isSymmetricByPairBfs(TreeNode* root) {\n    if (!root) {\n        return true;\n    }\n\n    queue\u003cpair\u003cTreeNode*, TreeNode*>> q;\n    q.push({root->left, root->right}); // 队列状态是一对镜像位置节点。\n\n    while (!q.empty()) {\n        auto [a, b] = q.front();\n        q.pop();\n\n        if (!a && !b) {\n            continue; // 两个镜像位置都为空，当前这一对合法。\n        }\n        if (!a || !b) {\n            return false; // 一个为空一个不为空，结构不对称。\n        }\n        if (a->val != b->val) {\n            return false; // 镜像位置节点值必须相同。\n        }\n\n        // 镜像比较的下一层配对：外侧 a->left 对 b->right，内侧 a->right 对 b->left。\n        q.push({a->left, b->right});\n        q.push({a->right, b->left});\n    }\n\n    return true;\n}\n\nbool isSameTreeByPairBfs(TreeNode* p, TreeNode* qRoot) {\n    queue\u003cpair\u003cTreeNode*, TreeNode*>> q;\n    q.push({p, qRoot});\n\n    while (!q.empty()) {\n        auto [a, b] = q.front();\n        q.pop();\n\n        if (!a && !b) {\n            continue;\n        }\n        if (!a || !b || a->val != b->val) {\n            return false;\n        }\n\n        // 相同树是同方向比较：左对左，右对右；和镜像比较的入队顺序不同。\n        q.push({a->left, b->left});\n        q.push({a->right, b->right});\n    }\n\n    return true;\n}\n```\n\n#### 易错点\n\n- 把对称树写成普通层序遍历，只比较每层数组，忽略空节点位置会误判结构。\n- 镜像配对顺序写反：对称树应比较 `left.left` 和 `right.right`、`left.right` 和 `right.left`。\n- 出队后直接访问节点值，没有先处理两个节点是否为空。\n\n### 5.3 网格连通块 BFS 模板\n\n#### 适用题型\n\n- 岛屿数量。\n- 图像渲染、区域连通块统计。\n- 最大岛屿面积的 BFS 写法。\n\n#### 核心思路\n\n网格连通块 BFS 的共同骨架是：外层枚举入口，发现一个未访问目标格后入队，入队时立刻标记，然后不断扩展四邻域。岛屿数量、最大面积、区域染色只是在“外层如何结算”和“入队时标记成什么”上不同。\n\n关键不变量：\n\n- 队列里保存当前连通块中已经标记、但邻居尚未完全扩展的格子。\n- 入队时标记 visited，避免同一个格子被多个父节点重复加入。\n- 数量题在发现入口时计数；面积题在出队时累加；染色题把 `oldColor/newColor` 参数化。\n\n#### 代码模板：共同骨架\n\n> **题目简述：** 本模板用于：岛屿数量。；图像渲染、区域连通块统计。；最大岛屿面积的 BFS 写法。 [力扣原题 ↗](https://leetcode.cn/problems/number-of-islands/)\n\n```cpp\nint bfsComponent(vector\u003cvector\u003cint>>& grid, int sr, int sc, int targetValue, int markValue) {\n    int m = grid.size(), n = grid[0].size();\n    int dirs[4][2] = {{0, 1}, {0, -1}, {1, 0}, {-1, 0}};\n    queue\u003cpair\u003cint, int>> q;\n\n    q.push({sr, sc});\n    grid[sr][sc] = markValue; // 共同动作：入队即标记。\n    int area = 0;\n\n    while (!q.empty()) {\n        auto [x, y] = q.front();\n        q.pop();\n        area++; // 面积变形会用到；数量题可以忽略返回值。\n\n        for (auto [dx, dy] : dirs) {\n            int nx = x + dx, ny = y + dy;\n            if (nx \u003c 0 || nx >= m || ny \u003c 0 || ny >= n || grid[nx][ny] != targetValue) {\n                continue;\n            }\n            grid[nx][ny] = markValue;\n            q.push({nx, ny});\n        }\n    }\n\n    return area;\n}\n```\n\n#### 变形点对照\n\n| 题型 | 外层入口条件 | 入队标记 | 结算方式 |\n|---|---|---|---|\n| 岛屿数量 | `grid[r][c] == 1` | 改成 `0` | 发现入口时 `ans++`，BFS 返回值不用 |\n| 最大岛屿面积 | `grid[r][c] == 1` | 改成 `0` | `ans = max(ans, bfsComponent(...))` |\n| 区域染色 | 起点颜色 `oldColor` | 改成 `newColor` | 不需要外层枚举，只从起点 BFS |\n\n区域染色只需要把入口从“全图枚举”改成“从给定起点开始”，并处理新旧颜色相同的特殊情况：\n\n```cpp\nint oldColor = image[sr][sc];\nif (oldColor != newColor) {\n    bfsComponent(image, sr, sc, oldColor, newColor);\n}\n```\n\n#### 易错点\n\n- 出队时才标记，导致同一节点被多个父节点重复加入。\n- 发现新陆地后只处理起点，没把整个连通块扩展完。\n- 区域染色没处理 `oldColor == newColor`，导致标记失效。\n- 忘记空网格判断。\n\n### 5.4 多源 BFS 按层扩散模板\n\n#### 适用题型\n\n- 腐烂的橘子。\n- 01 矩阵距离。\n- 多个源点同时向外扩散的最短时间、最近距离问题。\n\n#### 核心思路\n\n多源 BFS 的共同点是“所有源点共同构成第 0 层”。腐烂橘子和 01 矩阵距离的队列推进逻辑相同，差异只在源点定义、访问标记和答案记录位置。\n\n关键不变量：\n\n- 第 0 层必须一次性放入所有源点。\n- 邻居第一次入队就是最短触达，因此入队时立刻写状态或距离。\n- 如果答案是时间，按层推进；如果答案是距离矩阵，可以直接用父节点距离 + 1。\n\n#### 代码模板：共同骨架\n\n> **题目简述：** 本模板用于：腐烂的橘子。；01 矩阵距离。；多个源点同时向外扩散的最短时间、最近距离问题。 [994 原题 ↗](https://leetcode.cn/problems/rotting-oranges/) · [542 原题 ↗](https://leetcode.cn/problems/01-matrix/)\n\n```cpp\nint multiSourceSpread(vector\u003cvector\u003cint>>& grid) {\n    if (grid.empty() || grid[0].empty()) {\n        return 0;\n    }\n\n    int m = grid.size(), n = grid[0].size();\n    int dirs[4][2] = {{0, 1}, {0, -1}, {1, 0}, {-1, 0}};\n    queue\u003cpair\u003cint, int>> q;\n    int fresh = 0;\n\n    for (int r = 0; r \u003c m; r++) {\n        for (int c = 0; c \u003c n; c++) {\n            if (grid[r][c] == 2) {\n                q.push({r, c}); // 腐烂橘子：所有烂橘子是第 0 层源点。\n            } else if (grid[r][c] == 1) {\n                fresh++;\n            }\n        }\n    }\n\n    int minutes = 0;\n    while (!q.empty() && fresh > 0) {\n        int size = q.size();\n        for (int i = 0; i \u003c size; i++) {\n            auto [r, c] = q.front();\n            q.pop();\n\n            for (auto [dr, dc] : dirs) {\n                int nr = r + dr, nc = c + dc;\n                if (nr \u003c 0 || nr >= m || nc \u003c 0 || nc >= n || grid[nr][nc] != 1) {\n                    continue;\n                }\n                grid[nr][nc] = 2; // 入队即标记：第一次感染就是最早时间。\n                fresh--;\n                q.push({nr, nc});\n            }\n        }\n        minutes++;\n    }\n\n    return fresh == 0 ? minutes : -1;\n}\n```\n\n01 矩阵距离沿用同一主循环，只做局部替换：\n\n> **题目简述：** 本模板用于：腐烂的橘子。；01 矩阵距离。；多个源点同时向外扩散的最短时间、最近距离问题。 [994 原题 ↗](https://leetcode.cn/problems/rotting-oranges/) · [542 原题 ↗](https://leetcode.cn/problems/01-matrix/)\n\n```cpp\n// 初始化：源点从腐烂橘子的 2 换成矩阵里的 0，并用 dist 充当 visited。\nvector\u003cvector\u003cint>> dist(m, vector\u003cint>(n, -1));\nif (grid[r][c] == 0) {\n    dist[r][c] = 0;\n    q.push({r, c});\n}\n\n// 扩展：目标判断从 grid[nr][nc] == 1 换成 dist[nr][nc] == -1。\nif (nr \u003c 0 || nr >= m || nc \u003c 0 || nc >= n || dist[nr][nc] != -1) {\n    continue;\n}\n\n// 结算：感染状态改成距离填表。\ndist[nr][nc] = dist[r][c] + 1;\nq.push({nr, nc});\n```\n\n#### 变形点对照\n\n| 题型 | 第 0 层源点 | 入队标记 | 答案形态 |\n|---|---|---|---|\n| 腐烂橘子 | `grid == 2` | `grid = 2`，`fresh--` | 返回分钟数或 `-1` |\n| 01 矩阵距离 | `grid == 0` | `dist = dist[parent] + 1` | 返回整张 `dist` 表 |\n| 最近设施距离 | 所有设施点 | 写距离或 visited | 返回每个格子的最近距离 |\n\n#### 易错点\n\n- 只把一个源点入队，破坏“同时扩散”。\n- 分钟数按层增加，不能每弹出一个节点就加一分钟。\n- 不在入队时标记，导致同一个格子被多个源点重复入队。\n- 距离矩阵不需要 `fresh`，不要把腐烂橘子的状态变量硬搬过去。\n\n### 5.5 拓扑排序 BFS 模板\n\n#### 适用题型\n\n- 课程表。\n- 任务依赖调度。\n- 有向图判环、生成合法执行顺序。\n\n#### 核心思路\n\n拓扑 BFS 的队列不表示距离，而表示“当前入度为 0、已经可以执行”的节点。每弹出一个节点，相当于删除它的出边，并让后继节点入度减一。最终能弹出所有节点说明无环；剩下弹不出的节点被环卡住。\n\n#### 代码模板\n\n> **题目简述：** 本模板用于：课程表。；任务依赖调度。；有向图判环、生成合法执行顺序。 [力扣原题 ↗](https://leetcode.cn/problems/course-schedule/)\n\n```cpp\nbool canFinishByTopo(int n, vector\u003cvector\u003cint>>& prerequisites) {\n    vector\u003cvector\u003cint>> edges(n);\n    vector\u003cint> indeg(n, 0);\n\n    for (auto& e : prerequisites) {\n        int course = e[0], pre = e[1];\n        edges[pre].push_back(course); // pre -> course：完成 pre 后解锁 course。\n        indeg[course]++;\n    }\n\n    queue\u003cint> q;\n    for (int i = 0; i \u003c n; i++) {\n        if (indeg[i] == 0) {\n            q.push(i); // 当前没有前置依赖的课程。\n        }\n    }\n\n    int learned = 0;\n    while (!q.empty()) {\n        int u = q.front();\n        q.pop();\n        learned++;\n\n        for (int v : edges[u]) {\n            indeg[v]--; // 删除 u -> v 这条依赖影响。\n            if (indeg[v] == 0) {\n                q.push(v); // v 的所有前置课都已完成。\n            }\n        }\n    }\n\n    return learned == n;\n}\n```\n\n#### 易错点\n\n- 建图方向反了：`[a, b]` 表示 `b -> a`。\n- 用“队列最后为空”判断是否无环；队列总会为空，应该比较弹出节点数。\n- 入度减到 0 时忘记入队。\n\n### 5.6 状态图 BFS 最少操作次数模板\n\n#### 适用题型\n\n- 完全平方数：状态是剩余值，每次减一个平方数。\n- 零钱兑换：状态是金额或剩余金额，每次加/减一个硬币。\n- 任意无权图最短步数问题。\n\n#### 核心思路\n\n把每个状态看成图节点，每次合法操作看成一条无权边。BFS 按操作次数分层，第一次到达目标状态时就是最少次数。visited 要在入队时标记，因为第一次入队已经保证是最短距离。\n\n#### 代码模板\n\n代码 A：剩余值递减到 0\n\n> **题目简述：** 本模板用于：完全平方数：状态是剩余值，每次减一个平方数。；零钱兑换：状态是金额或剩余金额，每次加/减一个硬币。；任意无权图最短步数问题。 [279 原题 ↗](https://leetcode.cn/problems/perfect-squares/) · [322 原题 ↗](https://leetcode.cn/problems/coin-change/)\n\n```cpp\nint shortestSteps(int start, const vector\u003cint>& moves) {\n    vector\u003cbool> visited(start + 1, false);\n    queue\u003cint> q;\n    q.push(start);\n    visited[start] = true;\n\n    int step = 0;\n    while (!q.empty()) {\n        int size = q.size(); // 当前层所有状态都需要 step 次操作到达。\n\n        for (int i = 0; i \u003c size; i++) {\n            int cur = q.front();\n            q.pop();\n\n            if (cur == 0) {\n                return step; // 第一次到达目标，必然是最少操作次数。\n            }\n\n            for (int move : moves) {\n                int next = cur - move;\n                if (next \u003c 0 || visited[next]) {\n                    continue;\n                }\n                visited[next] = true; // 入队时标记，锁定最短距离。\n                q.push(next);\n            }\n        }\n\n        step++;\n    }\n\n    return -1;\n}\n\nint numSquaresBfs(int n) {\n    vector\u003cint> squares;\n    for (int x = 1; x * x \u003c= n; x++) {\n        squares.push_back(x * x);\n    }\n    return shortestSteps(n, squares);\n}\n```\n\n代码 B：金额从 0 递增到 amount / 零钱兑换 BFS 变形\n\n> **题目简述：** 本模板用于：完全平方数：状态是剩余值，每次减一个平方数。；零钱兑换：状态是金额或剩余金额，每次加/减一个硬币。；任意无权图最短步数问题。 [279 原题 ↗](https://leetcode.cn/problems/perfect-squares/) · [322 原题 ↗](https://leetcode.cn/problems/coin-change/)\n\n```cpp\nint coinChangeBfs(vector\u003cint>& coins, int amount) {\n    if (amount == 0) {\n        return 0;\n    }\n\n    vector\u003cbool> visited(amount + 1, false);\n    queue\u003cint> q;\n    q.push(0);\n    visited[0] = true;\n\n    int step = 0;\n    while (!q.empty()) {\n        int size = q.size();\n        step++; // 扩展到下一层，表示再使用一枚硬币。\n\n        for (int i = 0; i \u003c size; i++) {\n            int cur = q.front();\n            q.pop();\n\n            for (int coin : coins) {\n                int next = cur + coin;\n                if (next \u003c= amount && !visited[next]) {\n                    if (next == amount) {\n                        return step; // 第一次到达 amount，就是最少硬币数。\n                    }\n                    visited[next] = true;\n                    q.push(next);\n                }\n            }\n        }\n    }\n\n    return -1;\n}\n```\n\n#### 易错点\n\n- 无 visited 导致状态重复爆炸。\n- 把加权边问题套普通 BFS；普通 BFS 只适合边权相同的最短路。\n- 目标判断位置混乱；按层 BFS 中第一次遇到目标即可返回当前层数。\n\n## 6. 高频易错点清单\n\n| 易错点 | 典型题目 | 规避方式 |\n|---|---|---|\n| BFS 层序没有固定 size | `102`、`199`、`994` | 每层开始先 `int size = q.size()` |\n| 空树或空网格没处理 | `102`、`200` | 入队前先判断输入为空 |\n| visited 出队时才标记 | `200`、`994`、`279` | 决定入队时立即标记 |\n| 右视图取错节点 | `199` | 每层最后一个弹出的节点是右视图，也可先看 `q.back()` |\n| 对称树队列没有成对入队 | `101` | 一次比较两个镜像节点 |\n| 岛屿 BFS 没吃完整块 | `200` | 从新陆地出发，把整块相邻陆地全部标记 |\n| 多源 BFS 只放一个源点 | `994` | 初始化时所有腐烂橘子全部入队 |\n| 腐烂橘子分钟数每个节点加一次 | `994` | 每处理完一层才加一分钟 |\n| 腐烂橘子没统计 fresh | `994` | 用 fresh 判断是否仍有无法到达的新鲜橘子 |\n| 课程表建图方向反了 | `207` | `[a, b]` 表示 `b -> a` |\n| 拓扑排序只看队列是否为空 | `207` | 比较弹出节点数是否等于课程数 |\n| 状态 BFS 没有 visited 导致重复爆炸 | `279`、`322` | 新状态入队前检查并标记 visited |\n\n## 7. 最短复盘口诀\n\nBFS 题先问“层代表什么”。树题层代表深度，网格题层代表距离或分钟，多源题所有源点第 0 层一起入队，拓扑题层代表当前可执行节点，状态图层代表操作次数。队列每层先固定 `size`，入队时立刻标记 visited，第一次到达目标就是无权最短路。`102` 是层序母题，`994` 是多源 BFS 母题，`207` 是拓扑 BFS 母题，`279/322` 是状态图 BFS 理解题。\n\n\n\n================================================================================\n\n# 第19部分: 设计\n\n================================================================================\n\n> 目标：本文把 Hot100 设计题抽象成“接口语义、数据结构组合、复杂度约束、状态一致性”的复习笔记。复习时先从操作复杂度反推底层结构，再写清每个接口如何维护不变量。\n\n## 1. 设计题的底层模型\n\n设计题的核心在于同时满足多个操作的复杂度要求。每道设计题先问六个问题：\n\n| 问题 | 如果答案是“是” | 常用处理 |\n|---|---|---|\n| 是否要求 O(1) 查询并调整顺序 | LRU 缓存 | 哈希表 + 双向链表 |\n| 是否要求栈顶和最小值都 O(1) | 最小栈 | 数据栈 + 辅助最小栈 |\n| 是否要求前缀查询 | Trie | 多叉字符节点 + `isEnd` |\n| 是否要求动态维护中位数 | 数据流中位数 | 大根堆 + 小根堆 |\n| 是否有多个结构存同一批数据 | LRU、双堆 | 每次操作都要同步维护 |\n| 是否接口有隐藏不变量 | 容量、堆大小、单词终止 | 写完接口后检查不变量是否仍成立 |\n\n设计题常见的数据结构组合：\n\n| 组合 | 各自职责 | 代表题 |\n|---|---|---|\n| 哈希表 + 双向链表 | 哈希表定位节点，链表维护顺序 | `146` |\n| 普通栈 + 最小栈 | 一个存值，一个存当前最小值 | `155` |\n| Trie 节点数组 | 路径表示前缀，终止标记表示单词 | `208` |\n| 大根堆 + 小根堆 | 左半部分最大值，右半部分最小值 | `295` |\n\n## 2. Hot100 设计题型地图\n\n设计专题覆盖 4 道典型题，分别代表缓存、栈、前缀树和数据流四类高频设计模型。\n\n| 题型 | 题目 | 抽象能力 | 一句话记忆 |\n|---|---|---|---|\n| O(1) 缓存淘汰 | `146 LRU 缓存` | 哈希表定位 + 双向链表调序 | map 找节点，链表排冷热 |\n| O(1) 辅助查询 | `155 最小栈` | 主结构和辅助结构同步 | minStack 栈顶就是当前最小值 |\n| 前缀路径结构 | `208 实现 Trie` | 字符路径、节点创建、终止标记 | `isEnd` 区分完整单词和前缀 |\n| 动态中位数 | `295 数据流的中位数` | 双堆平衡和堆顶含义 | 左堆不小于右堆，堆顶给中位数 |\n\n## 3. 复习顺序建议\n\n建议按“单结构增强 → 树形结构 → 多结构同步”的顺序复习：\n\n1. `155 最小栈`：理解辅助结构同步维护额外查询能力。\n2. `208 Trie`：掌握节点定义、路径插入和前缀查询。\n3. `295 数据流中位数`：掌握两个堆的大小平衡和大小关系。\n4. `146 LRU 缓存`：综合哈希表、双向链表、容量淘汰和状态一致性。\n\n## 4. 关键套路详解\n\n### 4.1 从复杂度反推结构\n\n`146 LRU` 要求 `get` 和 `put` 都是 O(1)。单独用数组或链表无法 O(1) 查找 key，单独用哈希表无法 O(1) 找到最久未使用元素并调整顺序。因此必须组合：哈希表负责 key 到节点，双向链表负责 O(1) 删除任意节点和移动到头部。\n\n设计题看到多个操作都要求高复杂度时，通常需要多个结构各司其职。\n\n### 4.2 辅助结构必须和主结构同步\n\n`155 最小栈` 的辅助栈可以每次 push 当前最小值。这样 `data` 和 `mins` 长度始终一致，pop 时两个栈一起弹，最不容易错。\n\n如果选择只在新值小于等于当前最小值时压入 `mins`，也可以，但 pop 时必须在弹出的值等于当前最小值时同步弹出 `mins`。\n\n### 4.3 Trie 的节点表示“前缀状态”\n\nTrie 根节点表示空前缀。插入单词时，每走一个字符就进入下一层节点；没有边就新建。`search` 和 `startsWith` 的遍历过程相同，区别只在最后：`search` 必须要求 `isEnd == true`，`startsWith` 只要路径存在。\n\n最容易错的是把前缀存在当成完整单词存在。\n\n### 4.4 双堆维护中位数有两个不变量\n\n`295 数据流中位数` 中大根堆 `small` 存较小的一半，小根堆 `large` 存较大的一半。两个不变量必须同时成立：\n\n| 不变量 | 含义 |\n|---|---|\n| 大小平衡 | `small.size()` 等于 `large.size()`，或只比它多 1 |\n| 顺序正确 | `small.top() \u003c= large.top()`，左半部分都不大于右半部分 |\n\n插入一个数后，先放入某个堆，再通过移动堆顶恢复这两个不变量。查中位数时，如果总数为奇数，返回 `small.top()`；偶数则返回两个堆顶平均值。\n\n### 4.5 LRU 的链表要用哑头哑尾\n\n双向链表用哑头和哑尾可以让插入头部、删除尾部前一个节点、删除任意节点都没有空指针特判。约定头部表示最近使用，尾部表示最久未使用。\n\n每次 `get` 命中和 `put` 更新都要把节点移动到头部。超过容量时删除 `tail->prev`，并同步从哈希表中删除对应 key。\n\n## 5. 抽象代码模板\n\n下面模板按设计题的接口语义组织。复习时先写清每个接口要维护的不变量，再补数据结构组合；接口名尽量贴近 LeetCode 原题，方便迁移。\n\n### 5.1 MinStack 最小栈\n\n#### 适用题型\n\n- `155 最小栈`：`push`、`pop`、`top`、`getMin` 都要求 O(1)。\n- 栈结构需要同时支持历史最小值、最大值等聚合查询。\n- 主结构变化后辅助信息必须同步更新的设计题。\n\n#### 核心思路\n\n原始笔记使用一个 `stack\u003cpair\u003cint,int>>`：`first` 存真实入栈值，`second` 存“压入该节点后，整个栈的最小值”。构造函数先压入哨兵 `{0, INT_MAX}`，这样第一次 `push` 可以统一写 `min(val, st.top().second)`，不需要单独判断空栈。\n\n关键不变量：\n\n- `st.top().first` 是当前栈顶元素。\n- `st.top().second` 是当前真实栈内最小值。\n- 底部哨兵只服务初始化，题目保证 `pop/top/getMin` 不会在空真实栈上调用。\n\n#### 代码模板\n\n> **题目简述：** 155 最小栈：设计支持压栈、出栈、查看栈顶和获取最小值且操作均为 O(1) 的栈。 [力扣原题 ↗](https://leetcode.cn/problems/min-stack/)\n\n```cpp\nclass MinStack {\nprivate:\n    // pair.first  是真实值；pair.second 是压入该值后，到当前深度为止的最小值。\n    stack\u003cpair\u003cint, int>> st;\n\npublic:\n    MinStack() {\n        // 哨兵：让第一次 push 也能直接读取 st.top().second。\n        // 真实元素永远在这个哨兵之上。\n        st.push({0, INT_MAX});\n    }\n\n    void push(int val) {\n        int currentMin = min(val, st.top().second);\n        st.push({val, currentMin});\n    }\n\n    void pop() {\n        st.pop();\n    }\n\n    int top() {\n        return st.top().first;\n    }\n\n    int getMin() {\n        return st.top().second;\n    }\n};\n```\n\n#### 变形点对照\n\n| 写法 | 存储结构 | 优点 | 注意事项 |\n|---|---|---|---|\n| 原始 `pair` 栈 | 每个节点同时存值和当前最小值 | 一个栈就能同步弹出 | 需要哨兵或空栈特判 |\n| 双栈写法 | 主栈存值，辅助栈存每层最小值 | 语义拆开更直观 | 两个栈必须每次 `push/pop` 同步 |\n| 只存更小值辅助栈 | 辅助栈只在出现新最小时入栈 | 节省部分空间 | 重复最小值和 `pop` 相等判断容易错 |\n\n#### 易错点\n\n- 辅助信息只在严格更小时更新，遇到重复最小值时弹出逻辑容易错误。\n- `pair.second` 表示“当前深度最小值”，不能当当前节点自己的值。\n- 哨兵存在时不要把它当真实元素返回；题目调用接口时真实栈非空。\n\n### 5.2 Trie 前缀树\n\n#### 适用题型\n\n- `208 实现 Trie`：`insert`、`search`、`startsWith`。\n- 前缀查询、自动补全、敏感词匹配、单词替换。\n- 固定字符集路径结构题。\n\n#### 核心思路\n\n根节点表示空前缀，每条边表示追加一个字符。插入时沿字符路径创建节点，最后把终点标记为完整单词。`search` 和 `startsWith` 都先查路径，区别是 `search` 还要求终点 `isEnd == true`。\n\n原始笔记在三个接口里重复写遍历逻辑；专题模板把公共遍历抽成 `findNode`，这是等价重构，不改变原始 `children[26] + isEnd` 的核心写法。\n\n关键不变量：\n\n- `children[i]` 表示接上第 `i` 个字符后的下一前缀状态。\n- `isEnd` 只标记完整单词结尾，不代表所有前缀都是单词。\n- `root` 必须在构造函数中初始化。\n\n#### 代码模板\n\n> **题目简述：** 208 实现 Trie：设计前缀树，支持插入单词、查询完整单词和判断是否存在指定前缀。 [力扣原题 ↗](https://leetcode.cn/problems/implement-trie-prefix-tree/)\n\n```cpp\nclass Trie {\nprivate:\n    struct Node {\n        array\u003cNode*, 26> next{};\n        bool isEnd = false;\n    };\n\n    Node* root;\n\n    Node* findNode(const string& text) const {\n        Node* cur = root;\n        for (char ch : text) {\n            int idx = ch - 'a';\n            if (!cur->next[idx]) {\n                return nullptr;\n            }\n            cur = cur->next[idx];\n        }\n        return cur;\n    }\n\npublic:\n    Trie() : root(new Node()) {}\n\n    void insert(string word) {\n        Node* cur = root;\n        for (char ch : word) {\n            int idx = ch - 'a';\n            if (!cur->next[idx]) {\n                cur->next[idx] = new Node();\n            }\n            cur = cur->next[idx];\n        }\n        cur->isEnd = true;\n    }\n\n    bool search(string word) {\n        Node* node = findNode(word);\n        return node != nullptr && node->isEnd;\n    }\n\n    bool startsWith(string prefix) {\n        return findNode(prefix) != nullptr;\n    }\n};\n```\n\n#### 易错点\n\n- `search` 只判断路径存在，把前缀误判成完整单词。\n- 构造函数没有初始化根节点。\n- 字符集超出小写字母时不要硬用 26 数组，应改成 `unordered_map\u003cchar, Node*>`。\n\n### 5.3 MedianFinder 数据流中位数\n\n#### 适用题型\n\n- `295 数据流的中位数`：`addNum`、`findMedian`。\n- 动态插入并查询中位数。\n- 需要维护有序分区但不需要完整排序的数据流题。\n\n#### 核心思路\n\n原始笔记使用两个堆维护左右两半：`maxHeap` 是大顶堆，保存较小一半；`minHeap` 是小顶堆，保存较大一半。插入时先“无脑进入左边”，再把左边堆顶移到右边，保证左右顺序；如果右边数量更多，再把右边堆顶移回左边，保证左边数量不少于右边。\n\n关键不变量：\n\n- `maxHeap` 中任意元素 `\u003c= minHeap` 中任意元素。\n- `maxHeap.size() == minHeap.size()` 或 `maxHeap.size() == minHeap.size() + 1`。\n- 奇数个元素时中位数是 `maxHeap.top()`；偶数个元素时是两个堆顶均值。\n\n#### 代码模板\n\n> **题目简述：** 295 数据流的中位数：设计结构持续接收整数，并能随时返回当前所有数据的中位数。 [力扣原题 ↗](https://leetcode.cn/problems/find-median-from-data-stream/)\n\n```cpp\nclass MedianFinder {\nprivate:\n    priority_queue\u003cint, vector\u003cint>, less\u003cint>> maxHeap;       // 左半边：较小的一半，堆顶是左半边最大值。\n    priority_queue\u003cint, vector\u003cint>, greater\u003cint>> minHeap;    // 右半边：较大的一半，堆顶是右半边最小值。\n\npublic:\n    MedianFinder() = default;\n\n    void addNum(int num) {\n        // 1. 先放入左边。即使 num 偏大，下一步也会通过堆顶转移纠正顺序。\n        maxHeap.push(num);\n\n        // 2. 把左边最大的元素移到右边，保证左边剩下的都 \u003c= 右边。\n        minHeap.push(maxHeap.top());\n        maxHeap.pop();\n\n        // 3. 约定左边数量不少于右边；若右边更多，把右边最小值移回左边。\n        if (minHeap.size() > maxHeap.size()) {\n            maxHeap.push(minHeap.top());\n            minHeap.pop();\n        }\n    }\n\n    double findMedian() {\n        if (maxHeap.size() > minHeap.size()) {\n            return maxHeap.top();\n        }\n\n        // 题目数值范围下 int 相加安全；如果范围更大，可写成 ((double)maxHeap.top() + minHeap.top()) / 2.0。\n        return (maxHeap.top() + minHeap.top()) / 2.0;\n    }\n};\n```\n\n#### 变形点对照\n\n| 写法 | 插入流程 | 优点 | 注意事项 |\n|---|---|---|---|\n| 原始写法 | 先进左堆，再移动左堆顶到右堆，最后平衡数量 | 不需要先判断 `num` 属于哪边 | 三步顺序不要调换 |\n| 条件插入写法 | 先和左堆顶比较，再进入对应堆 | 语义直观 | 插入后仍要同时维护顺序和大小平衡 |\n| 支持删除变体 | 双堆 + 延迟删除 | 可处理滑动窗口中位数 | 普通堆不能 O(log n) 删除任意元素 |\n\n#### 易错点\n\n- 只做大小平衡，没保证左半部分都小于等于右半部分。\n- 原始三步流程中，少了“左堆顶移到右堆”会让两个堆的有序分区失效。\n- 偶数中位数如果值域更大，应先转 `double` 或 `long long`，避免相加溢出。\n\n### 5.4 LRUCache 哈希表 + 双向链表\n\n#### 适用题型\n\n- `146 LRU 缓存`：`get`、`put` 都要求 O(1)。\n- 需要 O(1) 定位元素，同时维护最近使用顺序的缓存题。\n- 命中、更新、插入、淘汰都必须同步多结构的设计题。\n\n#### 核心思路\n\n原始笔记使用“哈希表 + 手写双向链表”。哈希表负责 `key -> Node*` 的 O(1) 定位；双向链表负责 O(1) 删除任意节点和移动到头部。约定 `head` 后面是最近使用，`tail` 前面是最久未使用。`get` 命中后刷新到头部；`put` 更新已有 key 也刷新到头部；插入新 key 后若超过容量，删除 `tail->prev` 并同步删除哈希表。\n\n关键不变量：\n\n- `map` 中的每个 key 都对应链表中的一个真实节点。\n- 链表从 `head->next` 到 `tail->prev` 按最近使用到最久使用排序。\n- 淘汰链表节点时必须先拿到 key 并 `map.erase(key)`，再从链表摘除并 `delete`。\n- 哑头哑尾永远存在，不存真实业务数据。\n\n#### 代码模板\n\n> **题目简述：** 146 LRU 缓存：设计定容量缓存，使查询和写入均为平均 O(1)，满时淘汰最久未使用项。 [力扣原题 ↗](https://leetcode.cn/problems/lru-cache/)\n\n```cpp\nstruct Node {\n    int key;\n    int value;\n    Node* prev;\n    Node* next;\n\n    Node(int k, int v) : key(k), value(v), prev(nullptr), next(nullptr) {}\n};\n\nclass LRUCache {\nprivate:\n    int cap;\n    unordered_map\u003cint, Node*> map; // key -> 链表节点地址。\n    Node* head;\n    Node* tail;\n\n    void remove(Node* node) {\n        // node 一定是真实节点，不会是 head/tail 哨兵。\n        node->prev->next = node->next;\n        node->next->prev = node->prev;\n    }\n\n    void add(Node* node) {\n        // 把 node 插到 head 后面，表示最近使用。\n        node->prev = head;\n        node->next = head->next;\n        head->next->prev = node;\n        head->next = node;\n    }\n\npublic:\n    LRUCache(int capacity) {\n        cap = capacity;\n        head = new Node(0, 0);\n        tail = new Node(0, 0);\n        head->next = tail;\n        tail->prev = head;\n    }\n\n    int get(int key) {\n        if (map.count(key)) {\n            Node* node = map[key];\n            remove(node);\n            add(node); // 访问过后刷新为最近使用。\n            return node->value;\n        }\n        return -1;\n    }\n\n    void put(int key, int value) {\n        if (map.count(key)) {\n            Node* node = map[key];\n            node->value = value;\n            remove(node);\n            add(node); // 更新也算一次使用。\n            return;\n        }\n\n        Node* newnode = new Node(key, value);\n        map[key] = newnode;\n        add(newnode);\n\n        if ((int)map.size() > cap) {\n            Node* delnode = tail->prev;   // tail 前一个真实节点就是最久未使用。\n            map.erase(delnode->key);      // 先删哈希表，避免留下悬空指针。\n            remove(delnode);              // 再从链表摘除。\n            delete delnode;               // 最后释放节点内存。\n        }\n    }\n};\n```\n\n#### 变形点对照\n\n| 操作 | 是否改哈希表 | 是否改链表 | 刷新位置 |\n|---|---|---|---|\n| `get` 命中 | 否 | `remove + add` | 移到头部 |\n| `get` 未命中 | 否 | 否 | 返回 `-1` |\n| `put` 更新旧 key | 否 | `remove + add` | 移到头部 |\n| `put` 插入新 key | `map[key] = node` | `add` | 插到头部 |\n| 超容量淘汰 | `map.erase(delnode->key)` | `remove(delnode)` | 删除尾前节点 |\n\n#### 易错点\n\n- `get` 命中后没有移动到头部，最近使用顺序失真。\n- `put` 更新已有 key 时只改 value，没有移动到头部。\n- 淘汰链表尾部节点后忘记从哈希表删除，导致哈希表保存悬空指针。\n- `delete delnode` 应放在 `map.erase` 和 `remove` 之后；先 delete 再读 key 或改链表会有悬空访问风险。\n- 不用哑头哑尾，空链表、单节点链表特判过多且容易空指针。\n\n## 6. 高频易错点清单\n\n| 易错点 | 典型题目 | 规避方式 |\n|---|---|---|\n| 只用一个结构硬做所有操作 | `146`、`295` | 从复杂度拆职责，多个结构组合 |\n| 最小栈没有随每层保存当前最小值 | `155` | 原始写法用 `stack\u003cpair\u003cint,int>>`，`second` 存当前深度最小值 |\n| 最小栈忘记哨兵语义 | `155` | 构造函数压 `{0, INT_MAX}`，真实元素在哨兵之上 |\n| Trie 把前缀当完整单词 | `208` | `search` 必须检查 `isEnd`，`startsWith` 只检查路径 |\n| Trie 根节点未初始化 | `208` | 构造函数或成员初始化中创建 root |\n| 双堆插入流程随意改 | `295` | 原始流程：进左堆 -> 左堆顶移右堆 -> 右堆多则移回左堆 |\n| 双堆左右顺序不满足 | `295` | 左堆保存较小一半，右堆保存较大一半 |\n| 中位数整数溢出或整数除法 | `295` | 值域大时转 `double`/`long long` 后再求平均 |\n| LRU 命中后没移动到头部 | `146` | `get` 和更新型 `put` 都要 `remove + add` |\n| LRU 淘汰链表节点后没删哈希表 | `146` | 先 `map.erase(delnode->key)`，再 `remove`，最后 `delete` |\n| 双向链表没用哑头哑尾导致特判多 | `146` | 默认使用 dummy head/tail |\n\n## 7. 最短复盘口诀\n\n设计题先看接口复杂度，再拆数据结构职责。最小栈按原始笔记用 `pair(value, currentMin)` 保存每层最小值，Trie 是 `children[26] + isEnd`，数据流中位数按“先进左堆、移到右堆、再平衡”的双堆流程，LRU 是哈希表加手写双向链表。多个结构存同一份状态时，每个接口都要同步维护不变量。\n\n================================================================================\n\n# 第20部分: 分治\n\n================================================================================\n\n> 目标：本文把 Hot100 中“拆成子问题、分别求解、再合并结果”的题目抽象成若干可复用模板。复习时先定义子问题区间，再明确递归返回值和跨区间合并方式。\n\n## 1. 分治题的底层模型\n\n分治的本质是把一个大问题拆成若干结构相同的小问题。每道分治题先问五个问题：\n\n| 问题 | 如果答案是“是” | 常用处理 |\n|---|---|---|\n| 子问题是否仍是同类问题 | 排序链表、最大子数组、建树 | 递归处理左右区间 |\n| 合并是否简单 | 合并 K 个链表、有序数组转 BST | 两两合并、取中点构造 |\n| 合并是否需要跨边界信息 | 最大子数组和 | 返回前缀、后缀、总和、最佳值 |\n| 是否只需要其中一边 | 第 K 大、二分分割 | 快速选择、二分短数组 |\n| 是否能排除一个区域 | 搜索二维矩阵 II | 按单调性缩小候选区域 |\n\n分治题的递归函数一定要先定义语义：\n\n| 递归语义 | 返回值含义 | 代表题 |\n|---|---|---|\n| 区间构造 | 用 `[l, r]` 或 `[l, r)` 构造答案结构 | `108`、`105` |\n| 区间统计 | 返回当前区间的统计信息 | `53` |\n| 区间排序 | 返回当前区间排好序后的结构 | `148`、`23` |\n| 区间选择 | 返回当前区间目标秩元素 | `215` |\n| 区间排除 | 根据中点关系排除一半 | `4`、`240` |\n\n## 2. Hot100 分治题型地图\n\n\n| 题型 | 题目 | 抽象能力 | 一句话记忆 |\n|---|---|---|---|\n| 双数组第 K 小 | `4 寻找两个正序数组的中位数` | 每次丢弃不可能包含答案的一段 | 中位数可以转化为第 K 小 |\n| 两两归并 | `23 合并 K 个升序链表` | 把 K 路问题拆成两个半区 | K 个链表两两合并，像归并排序 |\n| 跨区间合并 | `53 最大子数组和` | 合并左右区间的前缀、后缀和最佳值 | 最大子数组要么在左，要么在右，要么跨中点 |\n| 区间建树 | `105 前序中序构造树` | 根切分左右子树区间 | 前序定根，中序定规模 |\n| 中点构造 | `108 有序数组转 BST` | 取中点保持平衡 | 中点做根，左右递归 |\n| 链表归并排序 | `148 排序链表` | 快慢指针拆分，两段排序后合并 | 链表排序的分治核心是断链和 merge |\n| 多数元素分治 | `169 多数元素` | 左右候选合并 | 左右候选相同直接返回，不同则计数比较 |\n| 快速选择 | `215 数组第 K 大` | partition 后只递归一边 | 只找目标秩，不完整排序 |\n| 矩阵分治搜索 | `240 搜索二维矩阵 II` | 根据单调性排除区域 | 也可用右上角阶梯搜索替代 |\n| 频次 Top K 快选 | `347 前 K 高频元素` | 在频次数组上选择前 K | 先统计频次，再分治选择 |\n\n## 3. 复习顺序建议\n\n建议按“区间递归 → 归并 → 选择 → 结构构造 → 复杂合并”的顺序复习：\n\n1. `108 有序数组转 BST`：最简单的中点分治构造。\n2. `105 前序中序构造树`：练区间边界和规模计算。\n3. `23 合并 K 个升序链表`：练两两归并。\n4. `148 排序链表`：练拆分、断链、合并完整流程。\n5. `53 最大子数组和`：理解跨区间信息合并。\n6. `169 多数元素`：理解候选合并，顺便对比摩尔投票。\n7. `215 数组第 K 大`：掌握 partition 后只保留一边。\n8. `347 前 K 高频元素`：把快选用在频次对象上。\n9. `240 搜索二维矩阵 II`：理解二维候选区域排除。\n10. `4 两个正序数组中位数`：最后练双数组第 K 小或分割线二分。\n\n## 4. 关键套路详解\n\n### 4.1 分治先写递归语义，不先写代码\n\n分治题最常见的错误是递归函数边界写出来了，但不知道返回值代表什么。写代码前先补全这句话：\n\n```text\nsolve(l, r) 返回区间 ______ 的 ______。\n```\n\n`108` 返回 `[l, r)` 构造出的 BST 根节点；`53` 返回当前区间的总和、最大前缀、最大后缀、最大子数组和；`148` 返回当前链表排序后的头结点。\n\n### 4.2 区间边界要全程统一\n\n数组分治建议使用左闭右开 `[l, r)`，空区间是 `l >= r`，单元素区间是 `r - l == 1`。树构造题有时用闭区间更贴近题解，但同一个函数内必须统一。\n\n`105` 的关键是 `leftSize = rootIndex - inLeft`。只要左子树规模算对，前序和中序的左右区间就能全部推出来。\n\n### 4.3 归并类题的合并函数是核心组件\n\n`23`、`148` 都可以复用“合并两个有序链表”。`23` 是把 K 个链表分治成左右两组，分别合并后再 merge。`148` 是先把一条链表拆成两条短链表，分别排序后再 merge。\n\n归并题的复杂度通常来自每层合并 O(n)，层数 O(log k) 或 O(log n)。\n\n### 4.4 跨区间答案必须携带足够信息\n\n`53 最大子数组和`如果只返回当前区间最大子数组和，合并时无法处理“跨过中点”的答案。所以每个区间至少返回四个量：区间总和、最大前缀和、最大后缀和、最大子数组和。\n\n跨中点答案等于左区间最大后缀加右区间最大前缀。\n\n### 4.5 快速选择只递归目标所在半边\n\n`215` 和 `347` 的分治点是 partition。pivot 落定后，左边都不大于它，右边都不小于它。目标秩如果在左边，只处理左边；在右边，只处理右边。平均 O(n) 的关键就是每层只走一边。\n\n第 K 大要换算成升序下标 `n - k`，这是最常见的错误点。\n\n### 4.6 分治不一定是递归，也可能是“排除一半”\n\n`4` 的第 K 小解法每次比较两个数组各自第 `k / 2` 个候选，丢掉较小的一段，因为这段不可能包含第 K 小。`240` 也可以递归分割矩阵区域，不过右上角阶梯搜索更简洁。\n\n二分查找本质上也是一种只递归一边的分治。\n\n## 5. 抽象代码模板\n\n下面模板把分治题拆成“子问题定义、递归返回值、合并信息、只递归哪一边”四个层面来复用。写分治前先确认：当前函数处理哪个区间，返回什么，左右结果如何合并，是否可以排除某一边。\n\n### 5.1 区间构造分治\n\n#### 适用题型\n\n- `108 有序数组转换为二叉搜索树`：中点做根，左右区间递归构造。\n- `105 从前序与中序遍历序列构造二叉树`：前序定根，中序定左右子树规模。\n- 所有“一个区间唯一决定一个子结构”的递归构造题。\n\n#### 核心思路\n\n区间构造题的关键在于让每个递归参数都有清晰语义。推荐数组构造使用左闭右开 `[left, right)`，树遍历构造也可以用闭区间，但同一个函数内必须统一。\n\n合并信息通常很简单：先构造根节点，再把左区间结果接到 `root->left`，右区间结果接到 `root->right`。如果中序位置确定，`leftSize = rootIndex - inLeft` 是推导所有边界的核心。\n\n#### 代码模板\n\n> **题目简述：** 本模板覆盖：108 将有序数组转换为二叉搜索树（给定严格升序数组，将其转换为一棵高度平衡的二叉搜索树。）；105 从前序与中序遍历序列构造二叉树（给定同一棵无重复值二叉树的前序和中序序列，还原并返回该树。） [105 原题 ↗](https://leetcode.cn/problems/construct-binary-tree-from-preorder-and-inorder-traversal/) · [108 原题 ↗](https://leetcode.cn/problems/convert-sorted-array-to-binary-search-tree/)\n\n```cpp\n#include \u003cbits/stdc++.h>\nusing namespace std;\n\nstruct ListNode {\n    int val;\n    ListNode* next;\n    ListNode() : val(0), next(nullptr) {}\n    ListNode(int x) : val(x), next(nullptr) {}\n    ListNode(int x, ListNode* next) : val(x), next(next) {}\n};\n\nstruct TreeNode {\n    int val;\n    TreeNode* left;\n    TreeNode* right;\n    TreeNode() : val(0), left(nullptr), right(nullptr) {}\n    TreeNode(int x) : val(x), left(nullptr), right(nullptr) {}\n};\n\nTreeNode* buildBalancedBstTemplate(const vector\u003cint>& nums, int left, int right) {\n    // 左闭右开区间 [left, right)，空区间没有节点。\n    if (left >= right) {\n        return nullptr;\n    }\n\n    int mid = left + (right - left) / 2;\n    TreeNode* root = new TreeNode(nums[mid]);\n    root->left = buildBalancedBstTemplate(nums, left, mid);\n    root->right = buildBalancedBstTemplate(nums, mid + 1, right);\n    return root;\n}\n\nTreeNode* buildTreeByPreInTemplate(const vector\u003cint>& preorder,\n                                   int preLeft,\n                                   int preRight,\n                                   int inLeft,\n                                   int inRight,\n                                   unordered_map\u003cint, int>& inIndex) {\n    // 这里使用闭区间：preLeft > preRight 表示当前子树为空。\n    if (preLeft > preRight) {\n        return nullptr;\n    }\n\n    int rootVal = preorder[preLeft];\n    int rootIndex = inIndex[rootVal];\n    int leftSize = rootIndex - inLeft;\n\n    TreeNode* root = new TreeNode(rootVal);\n    root->left = buildTreeByPreInTemplate(preorder,\n                                          preLeft + 1,\n                                          preLeft + leftSize,\n                                          inLeft,\n                                          rootIndex - 1,\n                                          inIndex);\n    root->right = buildTreeByPreInTemplate(preorder,\n                                           preLeft + leftSize + 1,\n                                           preRight,\n                                           rootIndex + 1,\n                                           inRight,\n                                           inIndex);\n    return root;\n}\n```\n\n#### 易错点\n\n- 同一递归函数中不要混用左闭右开和闭区间。\n- `105` 的右子树前序起点是 `preLeft + leftSize + 1`，避免写成 `preLeft + leftSize`。\n- 前序加中序能唯一建树通常默认节点值不重复；有重复值时映射会失效。\n\n### 5.2 两两归并分治\n\n#### 适用题型\n\n- `23 合并 K 个升序链表`。\n- 多路有序序列合并，但可以拆成左右两组分别合并。\n- 归并排序中的“先拆分，再合并”模型。\n\n#### 核心思路\n\n分治函数 `mergeRange(left, right)` 返回 `lists[left..right]` 合并后的有序链表。递归阶段只负责拆成两半；真正的合并信息集中在 `mergeTwo`：它维护一个已排序尾指针，把两个有序链表中较小节点接到结果后面。\n\n复杂度来自每层合并会处理所有节点，层数约为 `log k`，所以合并 K 个链表总复杂度是 `O(N log k)`。\n\n#### 代码模板\n\n> **题目简述：** 23 合并 K 个升序链表：给定 K 个升序链表，合并全部结点并返回一个升序链表。 [力扣原题 ↗](https://leetcode.cn/problems/merge-k-sorted-lists/)\n\n```cpp\nListNode* mergeTwoSortedListsTemplate(ListNode* a, ListNode* b) {\n    ListNode dummy(-1);\n    ListNode* tail = &dummy;\n\n    while (a && b) {\n        if (a->val \u003c= b->val) {\n            tail->next = a;\n            a = a->next;\n        } else {\n            tail->next = b;\n            b = b->next;\n        }\n        tail = tail->next;\n    }\n\n    tail->next = a ? a : b;\n    return dummy.next;\n}\n\nListNode* mergeKDivideTemplate(vector\u003cListNode*>& lists, int left, int right) {\n    if (left > right) {\n        return nullptr;\n    }\n    if (left == right) {\n        return lists[left];\n    }\n\n    int mid = left + (right - left) / 2;\n    ListNode* l = mergeKDivideTemplate(lists, left, mid);\n    ListNode* r = mergeKDivideTemplate(lists, mid + 1, right);\n    return mergeTwoSortedListsTemplate(l, r);\n}\n```\n\n#### 易错点\n\n- `lists` 为空时必须允许 `left > right` 返回 `nullptr`。\n- `mergeTwo` 中移动的是被接入节点所属链表的指针，不要忘记移动 `tail`。\n- 归并合并可以复用原节点，通常不需要新建所有节点。\n\n### 5.3 链表归并排序\n\n#### 适用题型\n\n- `148 排序链表`。\n- 链表上要求 `O(n log n)` 排序，且不适合随机访问快排的题。\n- 需要练习快慢指针拆链和有序链表合并的题。\n\n#### 核心思路\n\n链表归并排序的子问题是“返回当前链表排序后的头节点”。先用快慢指针找到中点，再断开成两条链表，递归排序左右两段，最后用 `mergeTwo` 合并两个有序链表。\n\n合并信息就是两个已排序链表的头指针；拆分阶段最容易遗漏的是 `slow->next = nullptr`，不切断会导致递归区间没有缩小。\n\n#### 代码模板\n\n> **题目简述：** 148 排序链表：给定单链表头结点，以 O(n log n) 时间将所有结点按值升序排列。 [力扣原题 ↗](https://leetcode.cn/problems/sort-list/)\n\n```cpp\nListNode* sortListDivideTemplate(ListNode* head) {\n    if (!head || !head->next) {\n        return head;\n    }\n\n    ListNode* slow = head;\n    ListNode* fast = head->next;\n    while (fast && fast->next) {\n        slow = slow->next;\n        fast = fast->next->next;\n    }\n\n    ListNode* rightHead = slow->next;\n    slow->next = nullptr; // 必须断链，让左右递归处理互不重叠的两段。\n\n    ListNode* left = sortListDivideTemplate(head);\n    ListNode* right = sortListDivideTemplate(rightHead);\n    return mergeTwoSortedListsTemplate(left, right);\n}\n```\n\n#### 易错点\n\n- 快慢指针初始化不同会影响左右长度，但必须保证每次拆分后规模缩小。\n- 不断链会形成重复处理甚至无限递归。\n- 链表排序更推荐归并排序，数组快排的随机访问优势在链表上不存在。\n\n### 5.4 跨区间信息合并\n\n#### 适用题型\n\n- `53 最大子数组和` 的分治写法。\n- 线段树、区间查询中需要从左右子区间合成父区间信息的题。\n- 答案可能完全在左边、完全在右边，也可能跨过中点的题。\n\n#### 核心思路\n\n如果只返回当前区间的最大子数组和，父区间无法计算跨中点答案。因此每个区间需要返回四类合并信息：`sum` 区间总和、`prefix` 最大前缀和、`suffix` 最大后缀和、`best` 最大子数组和。\n\n合并时，父区间的跨中点答案是 `left.suffix + right.prefix`；父区间的 `prefix/suffix` 也要考虑是否跨过整个左区间或右区间。\n\n#### 代码模板\n\n> **题目简述：** 53 最大子数组和：给定整数数组，找出和最大的非空连续子数组并返回其和。 [力扣原题 ↗](https://leetcode.cn/problems/maximum-subarray/)\n\n```cpp\nstruct SubarrayInfo {\n    int sum;    // 当前区间总和\n    int prefix; // 必须从区间左端开始的最大前缀和\n    int suffix; // 必须到区间右端结束的最大后缀和\n    int best;   // 当前区间内部最大子数组和\n};\n\nSubarrayInfo mergeSubarrayInfo(SubarrayInfo left, SubarrayInfo right) {\n    SubarrayInfo cur;\n    cur.sum = left.sum + right.sum;\n    cur.prefix = max(left.prefix, left.sum + right.prefix);\n    cur.suffix = max(right.suffix, right.sum + left.suffix);\n    cur.best = max({left.best, right.best, left.suffix + right.prefix});\n    return cur;\n}\n\nSubarrayInfo maxSubArrayDivideTemplate(const vector\u003cint>& nums, int left, int right) {\n    // 左闭右开 [left, right)，单元素区间四个信息都等于该元素。\n    if (right - left == 1) {\n        int x = nums[left];\n        return {x, x, x, x};\n    }\n\n    int mid = left + (right - left) / 2;\n    SubarrayInfo l = maxSubArrayDivideTemplate(nums, left, mid);\n    SubarrayInfo r = maxSubArrayDivideTemplate(nums, mid, right);\n    return mergeSubarrayInfo(l, r);\n}\n```\n\n#### 易错点\n\n- `prefix` 必须从左端开始，`suffix` 必须到右端结束，不能和 `best` 混淆。\n- 全负数时不能把初始答案设为 0，除非题目允许空子数组。\n- 分治写法不如 Kadane 简短，但它训练的是“合并信息必须足够”的能力。\n\n### 5.5 随机 pivot 快速选择\n\n#### 适用题型\n\n- `215 数组中的第 K 个最大元素`。\n- `347 前 K 个高频元素` 中对频次对象做选择。\n- 不要求完整排序，只要求目标秩或前 K 个无序集合的题。\n\n#### 核心思路\n\n原始笔记里的快速选择采用随机 `pivot`，再按第 K 大的语义分成 `big/equal/small` 三组。每一层只递归目标所在的一组：如果 `big` 已经至少有 K 个，答案一定在 `big`；如果 `big + equal` 覆盖了 K，答案就是 `pivot`；否则去 `small` 中找新的第 `k - big.size() - equal.size()` 大。\n\n随机 pivot 的作用是降低退化概率；`equal` 单独成组是为了正确处理重复值。\n\n#### 代码模板\n\n> **题目简述：** 本模板覆盖：215 数组中的第 K 个最大元素（给定无序数组和 K，返回按排序名次计算的第 K 大元素，而非第 K 个不同值。）；347 前 K 个高频元素（给定整数数组和 K，返回出现频率最高的 K 个元素，结果顺序不限。） [215 原题 ↗](https://leetcode.cn/problems/kth-largest-element-in-an-array/) · [347 原题 ↗](https://leetcode.cn/problems/top-k-frequent-elements/)\n\n```cpp\nint kthLargestQuickSelectTemplate(vector\u003cint>& nums, int k) {\n    int pivot = nums[rand() % nums.size()];\n    vector\u003cint> small, equal, big;\n\n    for (int num : nums) {\n        if (num > pivot) {\n            big.push_back(num);\n        } else if (num \u003c pivot) {\n            small.push_back(num);\n        } else {\n            equal.push_back(num);\n        }\n    }\n\n    if (k \u003c= (int)big.size()) {\n        return kthLargestQuickSelectTemplate(big, k);\n    }\n    if (k > (int)big.size() + (int)equal.size()) {\n        return kthLargestQuickSelectTemplate(small, k - (int)big.size() - (int)equal.size());\n    }\n    return pivot;\n}\n\nint findKthLargestTemplate(vector\u003cint>& nums, int k) {\n    return kthLargestQuickSelectTemplate(nums, k);\n}\n```\n\n#### 易错点\n\n- 原始三路写法直接按第 K 大递归，不需要换算成升序下标 `n - k`。\n- 进入 `small` 递归时必须扣掉 `big` 和 `equal` 的数量。\n- `equal` 不能省略，否则大量重复值时容易秩判断错误。\n\n### 5.6 两个有序数组第 K 小\n\n#### 适用题型\n\n- `4 寻找两个正序数组的中位数`。\n- 两个有序序列合并后找第 K 小，但不希望真的合并。\n- 每轮能丢弃一段确定不含答案的候选区间的题。\n\n#### 核心思路\n\n把中位数转换为第 K 小。每轮比较两个数组各自剩余部分第 `k / 2` 个候选，较小者及其之前的元素最多只能贡献较小的一批，不可能成为当前第 K 小，可以整段丢弃，并把 `k` 减去实际丢弃数量。\n\nwrapper 负责处理中位数：总长度为奇数时取第 `total / 2 + 1` 小；偶数时取第 `total / 2` 小和第 `total / 2 + 1` 小的平均。\n\n#### 代码模板\n\n> **题目简述：** 4 寻找两个正序数组的中位数：给定两个正序数组，求合并后的中位数，并满足对数级时间复杂度。 [力扣原题 ↗](https://leetcode.cn/problems/median-of-two-sorted-arrays/)\n\n```cpp\nint kthInTwoSortedArrays(const vector\u003cint>& a, int i,\n                         const vector\u003cint>& b, int j,\n                         int k) {\n    if (i == (int)a.size()) {\n        return b[j + k - 1];\n    }\n    if (j == (int)b.size()) {\n        return a[i + k - 1];\n    }\n    if (k == 1) {\n        return min(a[i], b[j]);\n    }\n\n    int half = k / 2;\n    int newI = min(i + half, (int)a.size()) - 1;\n    int newJ = min(j + half, (int)b.size()) - 1;\n\n    if (a[newI] \u003c= b[newJ]) {\n        int discarded = newI - i + 1;\n        return kthInTwoSortedArrays(a, newI + 1, b, j, k - discarded);\n    }\n\n    int discarded = newJ - j + 1;\n    return kthInTwoSortedArrays(a, i, b, newJ + 1, k - discarded);\n}\n\ndouble medianOfTwoSortedArraysWrapper(const vector\u003cint>& a, const vector\u003cint>& b) {\n    int total = a.size() + b.size();\n    if (total % 2 == 1) {\n        return kthInTwoSortedArrays(a, 0, b, 0, total / 2 + 1);\n    }\n\n    int leftMid = kthInTwoSortedArrays(a, 0, b, 0, total / 2);\n    int rightMid = kthInTwoSortedArrays(a, 0, b, 0, total / 2 + 1);\n    return ((double)leftMid + rightMid) / 2.0;\n}\n```\n\n#### 易错点\n\n- `k` 是从 1 开始的秩，避免按 0-based 下标处理。\n- 数组剩余长度可能不足 `k / 2`，所以要用 `min` 计算实际候选位置。\n- 丢弃多少元素，`k` 就必须减少多少，不能固定减 `half`。\n\n### 5.7 多数元素候选合并\n\n#### 适用题型\n\n- `169 多数元素` 的分治理解。\n- 左右子区间各自能返回候选，需要在父区间重新判断的题。\n- 练习“候选信息不足时必须补计数”的合并模型。\n\n#### 核心思路\n\n递归函数返回当前区间的多数候选。左右候选相同，可以直接作为父区间候选；若不同，则必须在父区间重新统计两个候选出现次数，次数更多的才是父区间候选。\n\n这里的合并信息只有“候选值”，不足以直接证明合法性，所以合并阶段要额外扫描当前区间计数。实战中多数元素更推荐摩尔投票，但分治写法能帮助理解局部候选如何合并。\n\n#### 代码模板\n\n> **题目简述：** 169 多数元素：给定长度为 N 的数组，找出出现次数严格超过 N/2 且保证存在的元素。 [力扣原题 ↗](https://leetcode.cn/problems/majority-element/)\n\n```cpp\nint majorityDivideTemplate(const vector\u003cint>& nums, int left, int right) {\n    if (left == right) {\n        return nums[left];\n    }\n\n    int mid = left + (right - left) / 2;\n    int leftCandidate = majorityDivideTemplate(nums, left, mid);\n    int rightCandidate = majorityDivideTemplate(nums, mid + 1, right);\n\n    if (leftCandidate == rightCandidate) {\n        return leftCandidate;\n    }\n\n    int leftCount = 0;\n    int rightCount = 0;\n    for (int i = left; i \u003c= right; i++) {\n        if (nums[i] == leftCandidate) {\n            leftCount++;\n        }\n        if (nums[i] == rightCandidate) {\n            rightCount++;\n        }\n    }\n\n    return leftCount >= rightCount ? leftCandidate : rightCandidate;\n}\n```\n\n#### 易错点\n\n- 左右候选不同不能随便返回左边或右边，必须在当前父区间计数。\n- 如果题目不保证多数元素存在，最终候选还要全局二次验证。\n- 分治返回候选，还需要再验证多数合法性。\n\n### 5.8 二维有序矩阵区域排除\n\n#### 适用题型\n\n- `240 搜索二维矩阵 II`。\n- 行、列分别有序，但整体不能直接展平成一维有序数组的矩阵题。\n- 能根据当前角点值排除一整行或一整列的题。\n\n#### 核心思路\n\n从右上角出发，当前位置是当前候选区域的“行内最大、列内最小”。如果它大于 `target`，当前列下面只会更大，可以排除这一列；如果它小于 `target`，当前行左侧只会更小，可以排除这一行。\n\n这类写法本质上每步排除一块候选区域，只保留可能包含答案的子问题。\n\n#### 代码模板\n\n> **题目简述：** 240 搜索二维矩阵 II：给定每行和每列均升序的矩阵，判断指定目标值是否存在。 [力扣原题 ↗](https://leetcode.cn/problems/search-a-2d-matrix-ii/)\n\n```cpp\nbool staircaseMatrixSearchAsDivide(const vector\u003cvector\u003cint>>& matrix, int target) {\n    if (matrix.empty() || matrix[0].empty()) {\n        return false;\n    }\n\n    int m = matrix.size();\n    int n = matrix[0].size();\n    int row = 0;\n    int col = n - 1;\n\n    while (row \u003c m && col >= 0) {\n        if (matrix[row][col] == target) {\n            return true;\n        }\n        if (matrix[row][col] > target) {\n            col--; // 当前列从 row 往下都更大，整列排除。\n        } else {\n            row++; // 当前行从 0 到 col 都更小，整行排除。\n        }\n    }\n\n    return false;\n}\n```\n\n#### 易错点\n\n- `240` 的矩阵不能直接展平二分，因为每行首尾之间不保证全局顺序。\n- 从右上或左下开始才有明确排除方向；左上和右下都无法一次排除一整块。\n- 空矩阵要先判断，否则访问 `matrix[0]` 会越界。\n\n## 6. 高频易错点清单\n\n| 易错点 | 典型题目 | 规避方式 |\n|---|---|---|\n| 递归函数返回值语义不清 | 所有分治题 | 先写“solve 返回什么” |\n| 区间开闭混用 | `105`、`108`、`53` | 一个函数内固定闭区间或左闭右开 |\n| 建树前序边界算错 | `105` | 用 `leftSize` 推前序左右子树范围 |\n| 有序数组转 BST 取中点后递归边界错 | `108` | 左闭右开时右子树从 `mid + 1` 开始 |\n| 合并 K 链表没有处理空数组 | `23` | `left > right` 返回 nullptr |\n| 链表排序切分后没断链 | `148` | `slow->next = nullptr` |\n| 最大子数组分治只返回 best | `53` | 合并需要 sum/prefix/suffix/best 四个量 |\n| 快选第 K 大下标换算错 | `215` | 升序目标是 `n - k` |\n| Top K 高频直接对原数组快选 | `347` | 先哈希统计，再对频次对象选择 |\n| 两数组第 K 小 k 更新错误 | `4` | 丢弃多少元素，k 就减多少 |\n| 矩阵分治误把行列有序当全局有序 | `240` | 不能展平二分，只能区域排除或阶梯搜索 |\n\n## 7. 最短复盘口诀\n\n分治先定义子问题，再定义返回值。建树看区间，归并先拆后合，最大子数组要带前缀后缀，快选只走目标半边，K 大先转 `n - k`，两个有序数组第 K 小每轮丢一段，行列有序矩阵靠区域排除。能合并就归并，能排除就二分，能只走一边就快选。\n\n\n\n================================================================================\n\n# 第21部分: 递归\n\n================================================================================\n\n> 目标：本文把 Hot100 中标记为递归的题目抽象成“函数语义、终止条件、子问题组合、返回值”的模板。复习时先用一句话定义递归函数，再写 base case 和组合逻辑。\n\n## 1. 递归题的底层模型\n\n递归通过同构子问题拆解问题。每道递归题先问五个问题：\n\n| 问题 | 如果答案是“是” | 常用处理 |\n|---|---|---|\n| 当前节点是否只依赖后续链表 | 反转链表、合并链表 | 递归处理 `head->next` 或两个链表的剩余部分 |\n| 是否要把一段结构拆成头和剩余 | 两数相加、字符串解码 | 当前层处理一位或一段，递归处理剩余 |\n| 是否需要返回新头 | 反转、交换、K 组反转 | 返回当前子问题处理后的头节点 |\n| 是否有嵌套结构 | 字符串解码 | 递归函数在遇到右括号时返回当前层结果 |\n| 是否递归更清楚但迭代更稳 | 链表题多数 | 掌握递归语义，同时知道栈深风险 |\n\n递归代码必须先写清楚三件事：\n\n| 内容 | 含义 | 典型例子 |\n|---|---|---|\n| 函数语义 | 这个函数解决哪个子问题 | `reverse(head)` 返回反转后新头 |\n| 终止条件 | 子问题小到什么时候直接返回 | `if (!head || !head->next) return head` |\n| 组合方式 | 当前层如何接上子问题结果 | `head->next->next = head` |\n\n## 2. Hot100 递归题型地图\n\n递归专题覆盖 7 道典型题。多数是链表题，`394` 是字符串嵌套解析题，`234` 既可以递归也可以快慢指针加反转。\n\n| 题型 | 题目 | 抽象能力 | 一句话记忆 |\n|---|---|---|---|\n| 链表递归合并 | `21 合并两个有序链表` | 选择当前头，递归合并剩余 | 谁小谁当头，next 接递归结果 |\n| 链表递归反转 | `206 反转链表` | 子链反转后接回当前节点 | 先相信后面已经反转好 |\n| 链表局部递归 | `24 两两交换节点`、`25 K 个一组翻转` | 当前段处理后接递归剩余 | 当前组先改，后面交给递归 |\n| 逐位递归/同步推进 | `2 两数相加` | 当前位 + 进位，递归下一位 | 递归参数带 carry |\n| 链表双端语义 | `234 回文链表` | 从后向前回溯比较 | 递归栈天然提供反向访问 |\n| 嵌套解析 | `394 字符串解码` | 遇到 `[` 进入子层，遇到 `]` 返回 | 每层只解析自己的括号内部 |\n\n## 3. 复习顺序建议\n\n建议按“最简单子问题 → 返回新头 → 分组处理 → 嵌套解析”的顺序复习：\n\n1. `21 合并两个有序链表`：理解递归返回“合并后的头”。\n2. `206 反转链表`：练最经典的链表递归组合。\n3. `24 两两交换节点`：练当前两个节点和剩余链表的拼接。\n4. `2 两数相加`：练递归参数携带进位。\n5. `25 K 个一组翻转`：练先判断够一组，再反转并递归连接。\n6. `234 回文链表`：理解递归栈的后序比较，但实际刷题优先掌握快慢指针方案。\n7. `394 字符串解码`：练嵌套结构的递归解析。\n\n## 4. 关键套路详解\n\n### 4.1 递归函数语义要比代码更先确定\n\n`206 反转链表` 中 `reverse(head)` 的语义是：反转以 `head` 开始的整条链表，并返回反转后的新头。只要相信 `reverse(head->next)` 已经把后半段反转好，当前层只需要把原来的第二个节点指回 `head`，再把 `head->next` 置空。\n\n如果不先定义语义，递归代码会变成“我调用我自己，然后凭感觉接指针”。\n\n### 4.2 链表递归多数都要返回新头\n\n链表节点重连后，当前子链表的头经常会变化。反转后新头是原尾节点；两两交换后新头是第二个节点；K 个一组翻转后新头是当前组的第 K 个节点。因此递归函数返回值通常就是“当前子问题处理后的头”。\n\n### 4.3 递归处理链表要警惕断链\n\n递归反转的关键两句：\n\n```cpp\nhead->next->next = head;\nhead->next = nullptr;\n```\n\n第一句把后一个节点指回当前节点，第二句切断当前节点原来的 next，避免形成环。很多递归链表题错在只接回去，不切断旧指针。\n\n### 4.4 嵌套字符串解析适合递归下降\n\n`394 字符串解码` 中每一层递归负责解析当前括号层级内的字符串。遇到数字就累积重复次数，遇到 `[` 就递归解析内部，遇到 `]` 就返回当前层结果。\n\n这种写法的好处是括号匹配天然由调用栈管理，不需要手动维护多个栈。但必须让下标按引用传递，保证子层解析完后外层继续从正确位置走。\n\n### 4.5 递归和回溯的区别在返回值语义\n\n回溯通常是在搜索树上枚举方案，重点是做选择和撤销选择。递归专题里的链表题更像分治：子问题返回一个结构，当前层把结构接好。`394` 虽然也有树形嵌套，但目标是解析一个确定结果，无需枚举所有方案。\n\n## 5. 抽象代码模板\n\n本节先按原始单题笔记的参考解法整理。需要特别注意：本专题虽然叫“递归”，但用户原始笔记中的链表题大多使用哑节点、前驱指针、三指针反转等 O(1) 空间迭代写法；递归写法只作为理解“函数语义/返回新头”的扩展，不替代原始提交模板。\n\n### 5.1 哑节点 + 尾指针/前驱指针链表模板\n\n#### 适用题型\n\n- `21 合并两个有序链表`：两个指针比较大小，尾指针接较小节点。\n- `2 两数相加`：尾指针持续新建结果节点，循环条件必须包含 `carry`。\n- `24 两两交换链表节点`：前驱指针站在待交换二元组前面，原地改三条边。\n\n#### 核心思路\n\n这三题共享“哑节点统一头部处理”骨架。`dummy` 负责兜住答案头，`cur` 或 `pre` 负责站在已经处理好的尾部/前驱位置。区别只在于：`21` 是复用旧节点并比较大小；`2` 是按位相加并新建节点；`24` 是每轮原地交换两个节点。\n\n#### 代码 A：`21` 合并两个有序链表\n\n> **题目简述：** 21 合并两个有序链表：给定两个升序链表，将其合并为一个仍然升序的链表。 [力扣原题 ↗](https://leetcode.cn/problems/merge-two-sorted-lists/)\n\n```cpp\nstruct ListNode {\n    int val;\n    ListNode* next;\n    ListNode(int x = 0) : val(x), next(nullptr) {}\n    ListNode(int x, ListNode* next) : val(x), next(next) {}\n};\n\nListNode* mergeTwoLists(ListNode* list1, ListNode* list2) {\n    // 原始笔记使用栈上 dummy，函数结束自动释放；返回 dummy.next，避免写成 dummy->next。\n    ListNode dummy(-1, list1);\n    ListNode* cur = &dummy;\n    ListNode* p = list1;\n    ListNode* q = list2;\n\n    while (p && q) {\n        if (q->val \u003c= p->val) {\n            // q 更小或相等时接 q；相等时先接哪边都可以，题目不要求稳定性。\n            cur->next = q;\n            q = q->next;\n        } else {\n            cur->next = p;\n            p = p->next;\n        }\n        cur = cur->next; // cur 始终指向已合并链表的最后一个节点。\n    }\n\n    // 至多一条链表还有剩余，直接整段接上，不需要逐个节点处理。\n    cur->next = q ? q : p;\n    return dummy.next;\n}\n```\n\n#### 代码 B：`2` 两数相加\n\n> **题目简述：** 2 两数相加：两个非空链表以逆序数字表示非负整数，求其和并以同样形式返回。 [力扣原题 ↗](https://leetcode.cn/problems/add-two-numbers/)\n\n```cpp\nListNode* addTwoNumbers(ListNode* l1, ListNode* l2) {\n    // 原始思路：dummy + cur 新建答案链表。\n    // 原笔记写过 ListNode dummy(-1, l1)，但后续会覆盖 dummy.next；这里写成 dummy(-1) 更直观。\n    ListNode dummy(-1);\n    ListNode* cur = &dummy;\n    int carry = 0;\n\n    // 循环条件必须包含 carry：两条链表都空了，也可能还要补最后一个进位节点。\n    while (l1 || l2 || carry) {\n        int sum = carry;\n        if (l1) {\n            sum += l1->val;\n            l1 = l1->next;\n        }\n        if (l2) {\n            sum += l2->val;\n            l2 = l2->next;\n        }\n\n        carry = sum / 10;\n        cur->next = new ListNode(sum % 10);\n        cur = cur->next;\n    }\n\n    return dummy.next;\n}\n```\n\n#### 代码 C：`24` 两两交换节点\n\n> **题目简述：** 24 两两交换链表中的节点：将链表中每两个相邻结点交换位置，不允许只修改结点值。 [力扣原题 ↗](https://leetcode.cn/problems/swap-nodes-in-pairs/)\n\n```cpp\nListNode* swapPairs(ListNode* head) {\n    ListNode dummy(-1, head);\n    ListNode* pre = &dummy; // pre 永远站在当前待交换二元组的前一个节点。\n    ListNode* cur = head;   // cur 是当前二元组的第一个节点。\n\n    while (cur && cur->next) {\n        ListNode* nxt = cur->next; // nxt 是当前二元组的第二个节点，交换后会变成组头。\n\n        // 三条边必须按这个顺序改：pre 接新组头，cur 接下一组，nxt 接 cur。\n        pre->next = nxt;\n        cur->next = nxt->next;\n        nxt->next = cur;\n\n        // 当前组交换完成后，cur 已经变成这一组的尾巴。\n        pre = cur;\n        cur = cur->next;\n    }\n\n    return dummy.next;\n}\n```\n\n#### 变形点对照\n\n| 题目 | 指针语义 | 节点来源 | 答案更新/连接时机 |\n|---|---|---|---|\n| `21` | `cur` 是合并后尾节点，`p/q` 是两条原链表当前位置 | 复用原节点 | 每次比较后接一个节点，循环后接剩余整段 |\n| `2` | `cur` 是结果链表尾节点，`l1/l2` 同步前进 | 新建节点 | 每位算完立即 `new ListNode(sum % 10)` |\n| `24` | `pre` 是待交换二元组前驱，`cur/nxt` 是组内两个节点 | 原地重连 | 每轮改三条边后，`pre` 移到当前组尾 |\n\n#### 易错点\n\n- `dummy` 是栈对象时，最后写 `return dummy.next`，避免写成 `dummy->next`。\n- `2` 的循环条件漏掉 `carry`，会丢失 `[5] + [5] = [0,1]` 中的最后进位。\n- `24` 改边前不保存 `nxt`，或者交换后忘记让 `pre = cur`，都会断链或死循环。\n\n### 5.2 三指针反转及其复用模板\n\n#### 适用题型\n\n- `206 反转链表`：整条链表反转。\n- `25 K 个一组翻转链表`：每次反转长度为 `k` 的一段，不足 `k` 的尾段不动。\n- `234 回文链表`：先找中点，再反转后半段，最后前后两段同步比较。\n\n#### 核心思路\n\n原始笔记中的反转链表母题是三指针：`pre` 表示已反转部分的新头，`cur` 表示当前待处理节点，`nxt` 先保存下一节点防止断链。`25` 和 `234` 都是在这个骨架外层增加边界控制：`25` 要先知道剩余节点够不够一组，`234` 要先用快慢指针定位后半段起点。\n\n#### 代码 A：`206` 整链反转\n\n> **题目简述：** 206 反转链表：给定单链表头结点，反转所有 next 指针并返回新的头结点。 [力扣原题 ↗](https://leetcode.cn/problems/reverse-linked-list/)\n\n```cpp\nListNode* reverseList(ListNode* head) {\n    ListNode* pre = nullptr; // 已反转部分的头；初始为空。\n    ListNode* cur = head;    // 当前要从原链表摘下并接到 pre 前面的节点。\n\n    while (cur) {\n        ListNode* nxt = cur->next; // 必须先保存，否则 cur->next 改掉后会丢失后续链表。\n        cur->next = pre;\n        pre = cur;\n        cur = nxt;\n    }\n\n    // cur 为空时，pre 正好是反转后链表的新头。\n    return pre;\n}\n```\n\n#### 代码 B：`25` K 个一组翻转\n\n> **题目简述：** 25 K 个一组翻转链表：按每 K 个结点一组翻转链表，末尾不足 K 个的部分保持原顺序。 [力扣原题 ↗](https://leetcode.cn/problems/reverse-nodes-in-k-group/)\n\n```cpp\nListNode* reverseKGroup(ListNode* head, int k) {\n    int n = 0;\n    ListNode dummy(-1, head);\n    ListNode* cur = head;\n    ListNode* p0 = &dummy; // p0 是上一组翻转后链表的尾巴，也就是当前组的前驱。\n\n    // 原始笔记先统计总长度，这样每轮只要判断 n >= k，不需要递归或额外栈。\n    while (cur) {\n        cur = cur->next;\n        n++;\n    }\n\n    cur = head;\n    while (n >= k) {\n        n -= k;\n\n        ListNode* pre = nullptr;\n        ListNode* first = cur; // 当前组翻转前的头，翻转后会变成这一组的新尾巴。\n\n        for (int i = 0; i \u003c k; i++) {\n            ListNode* nxt = cur->next;\n            cur->next = pre;\n            pre = cur;\n            cur = nxt;\n        }\n\n        // 此时 pre 是当前组新头，first 是当前组新尾，cur 是下一组的头。\n        first->next = cur; // 新尾巴先牵住下一组，避免断链。\n        p0->next = pre;    // 上一组尾巴接当前组新头。\n        p0 = first;        // p0 移到当前组新尾，准备下一轮。\n    }\n\n    return dummy.next;\n}\n```\n\n#### 代码 C：`234` 回文链表\n\n> **题目简述：** 234 回文链表：给定单链表头结点，判断从头到尾的结点值序列是否为回文。 [力扣原题 ↗](https://leetcode.cn/problems/palindrome-linked-list/)\n\n```cpp\nbool isPalindrome(ListNode* head) {\n    if (!head || !head->next) return true;\n\n    ListNode* fast = head;\n    ListNode* slow = head;\n\n    // 原始笔记使用偏左中点：偶数长度停在前半段最后一个节点，奇数长度停在正中间。\n    while (fast->next && fast->next->next) {\n        fast = fast->next->next;\n        slow = slow->next;\n    }\n\n    // 从 slow->next 开始反转后半段；前半段仍从 head 开始。\n    ListNode* pre = nullptr;\n    ListNode* cur = slow->next;\n    while (cur) {\n        ListNode* nxt = cur->next;\n        cur->next = pre;\n        pre = cur;\n        cur = nxt;\n    }\n\n    ListNode* start1 = head;\n    ListNode* start2 = pre;\n    while (start2) {\n        if (start1->val != start2->val) return false;\n        start1 = start1->next;\n        start2 = start2->next;\n    }\n\n    return true;\n}\n```\n\n#### 变形点对照\n\n| 题目 | 三指针反转范围 | 反转前额外准备 | 反转后如何接回 |\n|---|---|---|---|\n| `206` | 整条链表 | 无 | 直接返回 `pre` |\n| `25` | 当前连续 `k` 个节点 | 先统计长度，保证 `n >= k` 才翻 | `first->next = cur`，`p0->next = pre` |\n| `234` | `slow->next` 开始的后半段 | 快慢指针找偏左中点 | 不必接回即可判题；工程上可再反转一次恢复 |\n\n#### 易错点\n\n- 三指针反转必须先保存 `nxt`，再改 `cur->next`。\n- `25` 中 `first` 是翻转前组头、翻转后组尾；连接顺序错了会丢掉下一组。\n- `234` 从 `slow->next` 反转，避免让奇数长度中点参与比较两次。\n\n### 5.3 递归返回新头模板（扩展语义，不替代原始提交）\n\n#### 适用题型\n\n- `21`、`206`、`24` 的递归写法训练：明确函数返回“当前子链表处理后的新头”。\n- `25` 的递归变形：先处理当前 `k` 段，再递归连接剩余链表。\n\n#### 核心思路\n\n递归链表题必须先写清楚函数语义。当前层只处理“当前节点/当前一小段”，剩余部分交给子问题。由于反转、交换、分组都会改变子链表头，所以返回值通常是新头。注意：这些写法有 O(n) 调用栈，空间上弱于原始笔记的最优提交。\n\n#### 代码 A：递归合并两个有序链表\n\n> **题目简述：** 21 合并两个有序链表：给定两个升序链表，将其合并为一个仍然升序的链表。 [力扣原题 ↗](https://leetcode.cn/problems/merge-two-sorted-lists/)\n\n```cpp\nListNode* mergeTwoListsByRecursion(ListNode* a, ListNode* b) {\n    // 返回值语义：返回 a 和 b 合并后的链表头。\n    if (!a) return b;\n    if (!b) return a;\n\n    if (a->val \u003c= b->val) {\n        a->next = mergeTwoListsByRecursion(a->next, b);\n        return a;\n    }\n\n    b->next = mergeTwoListsByRecursion(a, b->next);\n    return b;\n}\n```\n\n#### 代码 B：递归反转链表\n\n> **题目简述：** 206 反转链表：给定单链表头结点，反转所有 next 指针并返回新的头结点。 [力扣原题 ↗](https://leetcode.cn/problems/reverse-linked-list/)\n\n```cpp\nListNode* reverseListByRecursion(ListNode* head) {\n    // 返回值语义：返回以 head 为头的链表反转后的新头。\n    if (!head || !head->next) return head;\n\n    ListNode* newHead = reverseListByRecursion(head->next);\n\n    // head->next 是原来的第二个节点，也是反转后链表的尾巴，让它指回 head。\n    head->next->next = head;\n    head->next = nullptr; // 切断旧边，否则会形成环。\n\n    return newHead;\n}\n```\n\n#### 代码 C：递归两两交换\n\n> **题目简述：** 24 两两交换链表中的节点：将链表中每两个相邻结点交换位置，不允许只修改结点值。 [力扣原题 ↗](https://leetcode.cn/problems/swap-nodes-in-pairs/)\n\n```cpp\nListNode* swapPairsByRecursion(ListNode* head) {\n    // 返回值语义：返回当前链表两两交换后的新头。\n    if (!head || !head->next) return head;\n\n    ListNode* second = head->next;\n    ListNode* rest = second->next; // 先保存剩余链表，避免重连后丢失。\n\n    second->next = head;\n    head->next = swapPairsByRecursion(rest); // 原 head 变成当前二元组尾巴。\n\n    return second;\n}\n```\n\n#### 变形点对照\n\n| 递归变形 | 当前层处理什么 | 子问题返回什么 | 原始笔记提交差异 |\n|---|---|---|---|\n| `21` 递归合并 | 选择 `a/b` 中较小头节点 | 剩余两链表合并后的头 | 原始笔记用迭代 dummy，空间更稳 |\n| `206` 递归反转 | 让原第二个节点指回当前节点 | 后半段反转后的新头 | 原始笔记用三指针 O(1) |\n| `24` 递归交换 | 交换当前两个节点 | 剩余链表交换后的头 | 原始笔记用 `pre/cur` 原地迭代 |\n| `25` 递归分组 | 先确认够 `k` 个，再反转 `[head, tail)` | 后续分组翻转后的头 | 原始笔记先数长度，避免递归栈 |\n\n#### 易错点\n\n- 递归模板是语义训练，不要误认为比原始迭代模板更优。\n- 返回值必须是“处理后的新头”，不能返回旧 `head`。\n- 反转类递归一定要切断旧 `next`，否则链表成环。\n\n### 5.4 双栈解析嵌套字符串模板\n\n#### 适用题型\n\n- `394 字符串解码` 原始笔记写法。\n- 括号内字符串需要重复拼接，且可能多层嵌套的解析题。\n\n#### 核心思路\n\n使用两个栈分别保存进入当前括号前的状态：`stnum` 保存重复次数，`ststr` 保存外层已经解析出的字符串。遇到数字累积 `num`；遇到 `[` 时把当前 `num/res` 入栈并重置；遇到 `]` 时弹出上层状态，把当前层 `res` 重复后拼回上层。\n\n#### 代码模板\n\n> **题目简述：** 394 字符串解码：解码形如 k[子串] 的有效编码字符串，编码可嵌套且 k 表示重复次数。 [力扣原题 ↗](https://leetcode.cn/problems/decode-string/)\n\n```cpp\nstring decodeString(string s) {\n    stack\u003cint> stnum;\n    stack\u003cstring> ststr;\n    int num = 0;\n    string res;\n\n    for (char x : s) {\n        if (isdigit(x)) {\n            // 数字可能是多位，例如 12[a]，所以不能只读一位。\n            num = num * 10 + x - '0';\n        } else if (isalpha(x)) {\n            res += x;\n        } else if (x == '[') {\n            // 进入新层前保存外层状态；当前层从空字符串和新数字开始。\n            stnum.push(num);\n            ststr.push(res);\n            res = \"\";\n            num = 0;\n        } else if (x == ']') {\n            int curnum = stnum.top();\n            stnum.pop();\n            string laststr = ststr.top();\n            ststr.pop();\n\n            string tmp;\n            for (int i = 0; i \u003c curnum; i++) {\n                tmp += res;\n            }\n\n            // 当前层展开后的结果，要接回进入这一层之前的外层字符串。\n            res = laststr + tmp;\n        }\n    }\n\n    return res;\n}\n```\n\n#### 变形点对照\n\n| 场景 | 栈中保存什么 | 出栈时做什么 |\n|---|---|---|\n| 普通字母 | 不入栈 | 直接追加到当前层 `res` |\n| 数字 | 暂存在 `num` | 遇到 `[` 时和当前 `res` 一起入栈 |\n| 左括号 `[` | 当前重复次数、外层字符串 | 重置当前层状态 |\n| 右括号 `]` | 弹出最近一层状态 | 当前层重复 `curnum` 次后拼回 `laststr` |\n\n#### 易错点\n\n- `num` 入栈后必须清零，否则下一层会继承错误重复次数。\n- `res` 入栈后必须清空，否则内层会混入外层前缀。\n- `]` 出栈时是 `laststr + tmp`，避免写成 `tmp + laststr`。\n\n### 5.5 递归下降解析模板（扩展写法）\n\n#### 适用题型\n\n- `394 字符串解码` 的递归下降写法。\n- 括号嵌套表达式求值、括号内局部解析等“每层只处理自己括号内部”的题。\n\n#### 核心思路\n\n定义 `decode(s, index)` 解析当前括号层级内的内容，直到遇到 `]` 或字符串结束。`index` 必须按引用传递：子层解析完后，外层要接着从子层右括号之后继续扫描。这个模板逻辑清晰，但空间复杂度来自调用栈，区分于原始笔记的双栈提交写法。\n\n#### 代码模板\n\n> **题目简述：** 394 字符串解码：解码形如 k[子串] 的有效编码字符串，编码可嵌套且 k 表示重复次数。 [力扣原题 ↗](https://leetcode.cn/problems/decode-string/)\n\n```cpp\nstring decodeDfs(const string& s, int& index) {\n    string result;\n    int repeat = 0;\n\n    while (index \u003c (int)s.size() && s[index] != ']') {\n        if (isdigit(s[index])) {\n            repeat = repeat * 10 + (s[index] - '0');\n            index++;\n        } else if (s[index] == '[') {\n            index++; // 跳过 '['，进入下一层。\n            string inner = decodeDfs(s, index);\n            index++; // 子层返回时停在 ']'，这里跳过右括号。\n\n            // 不使用 while (repeat--)，避免把 repeat 改成 -1 后影响阅读和后续状态。\n            for (int i = 0; i \u003c repeat; i++) {\n                result += inner;\n            }\n            repeat = 0;\n        } else {\n            result.push_back(s[index]);\n            index++;\n        }\n    }\n\n    return result;\n}\n\nstring decodeStringByRecursion(string s) {\n    int index = 0;\n    return decodeDfs(s, index);\n}\n```\n\n#### 变形点对照\n\n| 写法 | 状态保存位置 | 优点 | 注意事项 |\n|---|---|---|---|\n| 双栈原始写法 | `stnum/ststr` | 更贴近原始笔记，流程显式 | 入栈后重置 `num/res` |\n| 递归下降扩展 | 调用栈 + 引用下标 | 层级语义清楚 | `index` 必须按引用，子层返回后跳过 `]` |\n\n#### 易错点\n\n- `index` 没按引用传递，外层位置不会跟着子层推进。\n- 子层返回后忘记 `index++` 跳过 `]`。\n- 使用 `while (repeat--)` 后忘记重置，容易让重复次数状态变得不可读。\n\n## 6. 高频易错点清单\n\n| 易错点 | 典型题目 | 规避方式 |\n|---|---|---|\n| 把“递归专题”误解成所有题都要递归提交 | `21`、`206`、`24`、`25`、`234` | 先按原始笔记掌握 O(1) 迭代写法，递归只作为语义扩展 |\n| 栈上 `dummy` 返回写错 | `21`、`2`、`24`、`25` | `ListNode dummy(...);` 最后返回 `dummy.next` |\n| 两数相加漏掉最后进位 | `2` | 循环条件写成 `while (l1 || l2 || carry)` |\n| 三指针反转先改边后取后继 | `206`、`25`、`234` | 每轮第一句先保存 `ListNode* nxt = cur->next` |\n| K 组翻转连接顺序混乱 | `25` | 记住 `first` 翻转后是组尾：`first->next = cur`，`p0->next = pre` |\n| 回文链表从错误位置反转 | `234` | 原始写法找偏左中点，从 `slow->next` 开始反转后半段 |\n| 字符串解码入栈后不重置状态 | `394` | 遇到 `[` 后同时重置 `res = \"\"` 和 `num = 0` |\n| 递归下降下标没有按引用传递 | `394` 扩展写法 | `decodeDfs(const string& s, int& index)`，子层返回后外层继续正确位置 |\n\n## 7. 最短复盘口诀\n\n递归专题先看原始笔记：链表题多用 dummy 和三指针，保证 O(1) 空间；`21/2/24` 是哑节点连接，`206/25/234` 是反转骨架复用，`394` 原始写法是双栈保存外层状态。递归写法要会读：先定义函数语义，再写终止条件，返回值多是“处理后的新头”，但提交时不要丢掉原始优化解法。\n\n================================================================================\n\n# 第22部分: 前缀和\n\n================================================================================\n\n> 目标：本文把 Hot100 中“把区间问题转化为两个前缀状态之差”的题抽象成可复用模板。复习时先定义前缀状态，再判断答案是直接相减、查历史计数，还是做左右乘积。\n\n## 1. 前缀和题的底层模型\n\n前缀和的核心是把连续区间的代价从 O(n) 查询压缩到 O(1) 或接近 O(1)。每道题先问五个问题：\n\n| 问题             | 如果答案是“是”           | 常用处理                          |\n| -------------- | ------------------ | ----------------------------- |\n| 查询连续子数组和吗      | 和为 K 的子数组          | `sum(i, j) = pre[j] - pre[i]` |\n| 需要统计有多少区间满足条件吗 | 和为 K 的子数组、路径总和 III | 哈希表统计历史前缀出现次数                 |\n| 前后两侧都要贡献吗      | 除自身以外数组的乘积         | 左前缀乘积 + 右后缀乘积                 |\n| 数据结构有分叉吗       | 树上路径和              | 前缀表进入递归时加入，退出时回溯              |\n| 是二维区域或矩阵标记吗    | 矩阵类相邻题             | 二维前缀和、行列标记                    |\n\n前缀和题最常见的状态有三类：\n\n| 状态 | 对应 Hot100 题目 | 复习关键词 |\n|---|---|---|\n| 一维累计和 | `560`、`53` 相邻思路 | `pre[j] - pre[i]` |\n| 左右前后缀 | `238` | 左乘积、右乘积、不能用除法 |\n| 路径前缀和 | `437` | 当前路径、哈希计数、回溯 |\n\n## 2. Hot100 前缀和题型地图\n\n\n| 题型 | 题目 | 抽象能力 | 一句话记忆 |\n|---|---|---|---|\n| 历史前缀计数 | `560 和为 K 的子数组` | 用历史前缀和个数统计区间数 | 当前 `sum` 需要找历史 `sum - k` |\n| 左右前后缀乘积 | `238 除自身以外数组的乘积` | 不用除法得到两侧贡献 | 答案先放左乘积，再乘右乘积 |\n| 树上路径前缀 | `437 路径总和 III` | 当前根到节点路径上的历史前缀 | 左分支历史不能污染右分支 |\n| 最大子数组相邻思路 | `53 最大子数组和` | 前缀最小值或 Kadane | 当前最大区间和等于 `pre - minPre` |\n| 二维前缀相邻思路 | `73 矩阵置零`、矩阵区域和类题 | 行列状态压缩 | 二维题先想行列前缀或标记 |\n\n## 3. 复习顺序建议\n\n前缀和建议按“定义状态 → 统计区间 → 组合前后缀 → 树上回溯”的顺序复习：\n\n1. 先手写普通前缀数组：理解 `pre[0] = 0` 和左闭右开区间。\n2. `560 和为 K 的子数组`：掌握前缀和 + 哈希计数。\n3. `238 除自身以外数组的乘积`：练不显式建左右数组的前后缀压缩。\n4. `437 路径总和 III`：理解树上前缀和为什么必须回溯。\n5. `53 最大子数组和`：用前缀最小值理解 Kadane 的本质。\n\n## 4. 关键套路详解\n\n### 4.1 前缀数组最好用左闭右开定义\n\n推荐定义 `pre[0] = 0`，`pre[i + 1] = pre[i] + nums[i]`。这样任意区间 `[l, r]` 的和就是 `pre[r + 1] - pre[l]`，任意左闭右开区间 `[l, r)` 的和就是 `pre[r] - pre[l]`。\n\n### 4.2 统计区间数时不能只存一个前缀\n\n`560` 要统计所有和为 K 的子数组。当前位置前缀和为 `sum`，如果历史上有若干个前缀和等于 `sum - k`，每一个都能和当前位置组成一个答案。因此哈希表 value 必须是次数，不能存下标。\n\n### 4.3 `count[0] = 1` 是空前缀边界\n\n如果从数组开头到当前位置的和刚好等于 `k`，那么需要一个“空前缀”参与配对。`count[0] = 1` 表示在处理任何元素前，前缀和 0 已经出现一次。\n\n### 4.4 前后缀乘积是广义前缀和\n\n`238` 不能用除法，因为有 0 和题目限制。做法是先从左到右把每个位置左边所有数的乘积写入答案，再从右到左用一个变量累乘右边所有数，并乘到答案上。\n\n### 4.5 树上前缀和必须回溯\n\n数组是一条线，历史前缀天然只向右使用；树有分叉，当前路径上的前缀和只能给当前分支使用。进入节点时 `prefix[curSum]++`，递归完左右子树后必须 `prefix[curSum]--`。\n\n## 5. 抽象代码模板\n\n本节按照原始单题笔记的参考解法整理，优先保留你已经写过的变量语义和空间优化方式。前缀和专题需要根据题目判断：查历史次数、合并左右贡献、树上回溯，还是用前缀最小值解释动态规划。\n\n### 5.1 一维前缀数组与区间查询母模板\n\n#### 适用题型\n\n- 普通区间和多次查询：先构造 `pre[i + 1]`，再用两个前缀相减。\n- 固定长度窗口统计：把窗口 `[left, right]` 转成 `pre[right + 1] - pre[left]`。\n- 区间平均值、区间计数、权重累计：只要状态满足“可加可减”，都可以替换 `sum` 的含义。\n\n#### 核心思路\n\n`pre[i]` 表示下标 `[0, i - 1]` 的累计和，所以 `pre[0] = 0` 是空前缀。这样闭区间 `[left, right]` 的和统一写成 `pre[right + 1] - pre[left]`，无需为 `left == 0` 单独分支。\n\n#### 代码模板：共同骨架\n\n> **题目简述：** 本模板用于：普通区间和多次查询：先构造 pre[i + 1]，再用两个前缀相减。；固定长度窗口统计：把窗口 [left, right] 转成 pre[right + 1] - pre[left]。；区间平均值、区间计数、权重累计：只要状态满足“可加可减”，都可以替换 sum 的含义。\n\n```cpp\n#include \u003cbits/stdc++.h>\nusing namespace std;\n\nvector\u003clong long> buildPrefix(const vector\u003cint>& nums) {\n    int n = (int)nums.size();\n    vector\u003clong long> pre(n + 1, 0);\n\n    for (int i = 0; i \u003c n; i++) {\n        // pre[i + 1] 表示 nums[0..i] 的累计和；多出的 pre[0] 表示空前缀。\n        pre[i + 1] = pre[i] + nums[i];\n    }\n\n    return pre;\n}\n\nlong long rangeSumClosed(const vector\u003clong long>& pre, int left, int right) {\n    // 查询闭区间 [left, right]，右端点在前缀数组中要整体右移一位。\n    return pre[right + 1] - pre[left];\n}\n\nlong long rangeSumHalfOpen(const vector\u003clong long>& pre, int left, int right) {\n    // 查询左闭右开区间 [left, right)，适合窗口右端点不入窗的写法。\n    return pre[right] - pre[left];\n}\n```\n\n#### 变形点对照\n\n| 变形 | 状态含义 | 查询方式 |\n|---|---|---|\n| 区间和 | `pre[i]` 是前 `i` 个数之和 | `pre[r + 1] - pre[l]` |\n| 固定长度窗口 | 窗口右端固定，左端为 `right - k + 1` | `pre[right + 1] - pre[right - k + 1]` |\n| 区间计数/权重 | 把 `nums[i]` 换成是否满足条件或权重 | 仍然两个前缀相减 |\n\n#### 易错点\n\n- `pre` 长度必须是 `n + 1`，否则访问 `pre[right + 1]` 会越界。\n- 先约定闭区间还是左闭右开，不能在同一道题中混用。\n- 区间和可能超过 `int` 时，前缀数组用 `long long`。\n\n### 5.2 前缀和 + 哈希计数统计区间数\n\n#### 适用题型\n\n- `560 和为 K 的子数组`：原始笔记中的核心题，当前 `sum` 查历史 `sum - k`。\n- 和可被 K 整除的子数组：把哈希 key 从完整前缀和换成规范化后的余数。\n- 所有“统计满足条件的连续子数组个数”的题：哈希表 value 必须是出现次数。\n\n#### 核心思路\n\n这题本质是“前缀和版两数之和”。扫描到当前位置时，当前前缀和为 `sum`，如果历史前缀中出现过 `sum - k`，那么这些历史前缀之后到当前位置的连续子数组和就是 `k`。原始解法最关键的一行是初始化 `unordered_map\u003cint,int> map{{0,1}}`，它表示空前缀已经出现一次。\n\n#### 代码模板：共同骨架\n\n> **题目简述：** 560 和为 K 的子数组：给定整数数组和整数 K，统计元素和恰好为 K 的连续子数组数量。 [力扣原题 ↗](https://leetcode.cn/problems/subarray-sum-equals-k/)\n\n```cpp\nint subarraySum(vector\u003cint>& nums, int k) {\n    // key 是历史前缀和，value 是这个前缀和出现过几次。\n    // {0, 1} 表示空前缀出现一次，用来统计从下标 0 开始且和为 k 的子数组。\n    unordered_map\u003cint, int> map{{0, 1}};\n\n    int res = 0;\n    int sum = 0;\n\n    for (int i = 0; i \u003c (int)nums.size(); i++) {\n        sum += nums[i];\n\n        // 如果历史上存在 sum - k，那么那些历史位置之后到 i 的区间和就是 k。\n        // 这里先查历史，再加入当前 sum，避免当前前缀和自己配对成空区间。\n        if (map.count(sum - k)) {\n            res += map[sum - k];\n        }\n\n        // 当前前缀会成为后续位置的历史前缀。\n        map[sum]++;\n    }\n\n    return res;\n}\n```\n\n#### 变形点对照\n\n| 题型 | 哈希 key | 查询什么 | 更新顺序 |\n|---|---|---|---|\n| `560 和为 K 的子数组` | 前缀和 `sum` | `sum - k` 出现次数 | 先查后加当前 `sum` |\n| 和可被 K 整除 | 规范化余数 `((sum % k) + k) % k` | 同余前缀出现次数 | 先累计答案再 `count[mod]++` |\n| 前缀异或类 | 前缀异或值 | `xor ^ target` | 和两数之和同理 |\n\n#### 易错点\n\n- `map{{0, 1}}` 不能漏；它是空前缀边界。\n- `map` 的 value 是次数，不能存下标，否则无法统计多个历史前缀带来的多个答案。\n- 数组中有负数时滑动窗口失效，前缀和 + 哈希计数仍然成立。\n\n### 5.3 左右前后缀乘积：保留空间优化\n\n#### 适用题型\n\n- `238 除自身以外数组的乘积`：原始笔记使用一个后缀数组 `suf` 加一个滚动前缀 `pre`。\n- 每个位置都需要“左侧贡献 × 右侧贡献”的题：乘法可替换为其他可合并状态。\n\n#### 核心思路\n\n原始解法先让 `suf[i]` 表示 `i` 右侧所有元素的乘积，再用一个变量 `pre` 从左到右滚动维护 `i` 左侧所有元素的乘积。这样只用返回数组本身承载一侧贡献，另一侧用变量维护，符合题目 O(1) 额外空间的要求。\n\n#### 代码模板：共同骨架\n\n> **题目简述：** 238 除自身以外数组的乘积：不使用除法，在 O(n) 时间内返回每个位置之外其余元素乘积组成的数组。 [力扣原题 ↗](https://leetcode.cn/problems/product-of-array-except-self/)\n\n```cpp\nvector\u003cint> productExceptSelf(vector\u003cint>& nums) {\n    int n = (int)nums.size();\n    vector\u003cint> suf(n);\n\n    // suf[i] 表示 nums[i] 右侧所有元素的乘积。\n    // 最后一个位置右侧没有元素，乘法单位元是 1。\n    suf[n - 1] = 1;\n    for (int i = n - 2; i >= 0; i--) {\n        suf[i] = suf[i + 1] * nums[i + 1];\n    }\n\n    int pre = 1; // pre 表示当前 i 左侧所有元素的乘积。\n    for (int i = 0; i \u003c n; i++) {\n        // 此时 suf[i] 是右侧乘积，pre 是左侧乘积，二者都不包含 nums[i] 本身。\n        suf[i] *= pre;\n\n        // 当前 nums[i] 只应贡献给后面的元素，所以要在计算答案后再纳入 pre。\n        pre *= nums[i];\n    }\n\n    return suf;\n}\n```\n\n#### 变形点对照\n\n| 写法 | 空间使用 | 关键不变量 |\n|---|---|---|\n| 原始笔记写法：`suf` + `pre` | 返回数组承载后缀，额外一个变量 | `suf[i]` 先是右侧乘积，第二遍乘左侧 `pre` |\n| 对称写法：答案先存左乘积，再滚动右乘积 | 同样 O(1) 额外空间 | `ans[i]` 先是左侧乘积，第二遍乘右侧变量 |\n| 有 0 的情况 | 无需特判 | 前后缀乘积天然不会除以 0 |\n\n#### 易错点\n\n- 乘法单位元必须初始化为 `1`，不能写成 `0`。\n- 更新顺序不能反：先用当前滚动贡献算答案，再把 `nums[i]` 纳入滚动贡献。\n- 不要使用除法；题目禁止除法，且数组存在 0 时总乘积除法会失效。\n\n### 5.4 树上前缀和 + 回溯\n\n#### 适用题型\n\n- `437 路径总和 III`：统计任意祖先到当前节点的路径和是否为目标值。\n- 树上祖先到后代路径统计：只允许当前递归路径上的历史状态参与配对。\n\n#### 核心思路\n\n数组前缀和的历史天然只沿一个方向增长；树上前缀和的历史必须限定在“根到当前节点”的路径上。进入节点后更新 `curSum`，查询 `curSum - target`，再把当前前缀加入表中递归左右子树；离开节点前必须撤销当前前缀，防止左子树状态污染右子树。\n\n#### 代码模板：共同骨架\n\n> **题目简述：** 437 路径总和 III：统计二叉树中结点值之和等于目标值的向下路径数，路径可从任意结点开始。 [力扣原题 ↗](https://leetcode.cn/problems/path-sum-iii/)\n\n```cpp\nstruct TreeNode {\n    int val;\n    TreeNode* left;\n    TreeNode* right;\n    TreeNode(int x) : val(x), left(nullptr), right(nullptr) {}\n};\n\nint dfsPathPrefix(TreeNode* root,\n                  long long curSum,\n                  long long target,\n                  unordered_map\u003clong long, int>& prefixCount) {\n    if (!root) return 0;\n\n    curSum += root->val;\n\n    // 当前节点作为路径终点，查有多少个祖先前缀能构成 target。\n    int res = 0;\n    if (prefixCount.count(curSum - target)) {\n        res += prefixCount[curSum - target];\n    }\n\n    // 当前前缀只对当前节点的后代有效，递归前加入。\n    prefixCount[curSum]++;\n    res += dfsPathPrefix(root->left, curSum, target, prefixCount);\n    res += dfsPathPrefix(root->right, curSum, target, prefixCount);\n\n    // 回溯撤销：离开当前节点后，这个前缀不能被兄弟分支使用。\n    prefixCount[curSum]--;\n\n    return res;\n}\n\nint pathSum(TreeNode* root, int targetSum) {\n    unordered_map\u003clong long, int> prefixCount;\n    prefixCount[0] = 1; // 空前缀用于统计从根节点开始的合法路径。\n    return dfsPathPrefix(root, 0, targetSum, prefixCount);\n}\n```\n\n#### 变形点对照\n\n| 场景 | 前缀表含义 | 是否回溯 |\n|---|---|---|\n| 数组 `560` | 已扫描过的所有历史前缀 | 不回溯 |\n| 树 `437` | 当前根到节点路径上的历史前缀 | 必须回溯 |\n| 路径异或/路径字符频次 | key 换成异或值或状态压缩掩码 | 仍然进入加、退出减 |\n\n#### 易错点\n\n- `prefixCount` 不能一直全局累加，否则会把跨分支路径误算成合法路径。\n- 查询答案要发生在加入当前前缀之前，否则会把当前节点后的空路径算进去。\n- 路径和可能超出 `int`，`curSum` 和哈希 key 用 `long long` 更稳。\n\n### 5.5 最大子数组：前缀最小值与 Kadane 空间优化\n\n#### 适用题型\n\n- `53 最大子数组和`：原始笔记同时给了前缀最小值写法和 Kadane 动态规划写法。\n- 最大区间收益类问题：当前状态减去此前最小状态。\n- 连续子数组最优值：通常能进一步压缩到一个滚动变量。\n\n#### 核心思路\n\n前缀和视角下，固定当前右端点时，最大子数组和等于当前前缀和减去此前最小前缀和。Kadane 视角下，`f` 表示“以当前元素结尾的最大子数组和”，如果之前的 `f` 为负，就不如从当前元素重新开始；因此原始笔记写成 `f = max(f, 0) + x`。\n\n#### 代码 A：前缀最小值写法\n\n> **题目简述：** 53 最大子数组和：给定整数数组，找出和最大的非空连续子数组并返回其和。 [力扣原题 ↗](https://leetcode.cn/problems/maximum-subarray/)\n\n```cpp\nint maxSubArrayByPrefix(vector\u003cint>& nums) {\n    int sums = 0;\n    int res = INT_MIN;\n    int premin = 0;\n\n    for (int i = 0; i \u003c (int)nums.size(); i++) {\n        sums += nums[i];\n\n        // 以 i 为右端点时，最优左端点来自此前最小前缀和。\n        // 先更新答案，再更新 premin，避免选到空子数组。\n        res = max(res, sums - premin);\n        premin = min(premin, sums);\n    }\n\n    return res;\n}\n```\n\n#### 代码 B：Kadane 滚动变量写法\n\n> **题目简述：** 53 最大子数组和：给定整数数组，找出和最大的非空连续子数组并返回其和。 [力扣原题 ↗](https://leetcode.cn/problems/maximum-subarray/)\n\n```cpp\nint maxSubArray(vector\u003cint>& nums) {\n    int res = INT_MIN;\n    int f = 0; // f 表示以当前元素结尾的最大子数组和；负贡献会被丢弃。\n\n    for (int x : nums) {\n        // 如果前一段 f \u003c 0，继续接上只会拖累当前元素，所以从 x 重新开始。\n        f = max(f, 0) + x;\n        res = max(res, f);\n    }\n\n    return res;\n}\n```\n\n#### 变形点对照\n\n| 写法 | 状态 | 更适合的复习角度 |\n|---|---|---|\n| 前缀最小值 | `sums - premin` | 理解“区间和 = 两个前缀之差” |\n| Kadane | `f = max(f, 0) + x` | 面试实写更短，空间 O(1) |\n| 股票一次交易 | `price - minPrice` | 和前缀最小值同构，但区间收益不能为负时答案初始为 0 |\n\n#### 易错点\n\n- 最大子数组不能为空，所以 `res` 要初始化为 `INT_MIN`，不能初始化为 0。\n- 前缀写法中 `premin` 要在更新答案之后再更新。\n- Kadane 中 `f` 可以初始化为 0，但答案必须通过每个 `x` 更新，才能处理全负数组。\n\n### 5.6 二维前缀和：相邻扩展而非 `73` 主解\n\n#### 适用题型\n\n- 矩阵区域和查询、二维固定窗口统计等标准二维前缀和题。\n- 图像/网格类区域计数：把矩阵值替换成权重或是否满足条件。\n- 注意：`73 矩阵置零` 的原始主解是行列标记；这里只作为矩阵类相邻思想，不应替代 `73` 的专题模板。\n\n#### 核心思路\n\n二维前缀和把左上角到当前位置的矩形累计起来。查询任意子矩形时，用大矩形减去上方和左方，再加回被重复减掉的左上区域。多开一行一列，可以统一处理第一行和第一列。\n\n#### 代码模板：共同骨架\n\n> **题目简述：** 304 二维区域和检索：给定不变矩阵，预处理后多次返回指定子矩形内的元素和。 [力扣原题 ↗](https://leetcode.cn/problems/range-sum-query-2d-immutable/)\n\n```cpp\nvector\u003cvector\u003clong long>> build2DPrefix(const vector\u003cvector\u003cint>>& matrix) {\n    int m = (int)matrix.size();\n    int n = m == 0 ? 0 : (int)matrix[0].size();\n    vector\u003cvector\u003clong long>> pre(m + 1, vector\u003clong long>(n + 1, 0));\n\n    for (int i = 0; i \u003c m; i++) {\n        for (int j = 0; j \u003c n; j++) {\n            pre[i + 1][j + 1] = pre[i][j + 1]\n                               + pre[i + 1][j]\n                               - pre[i][j]\n                               + matrix[i][j];\n        }\n    }\n\n    return pre;\n}\n\nlong long regionSum(const vector\u003cvector\u003clong long>>& pre,\n                    int r1, int c1,\n                    int r2, int c2) {\n    // 查询闭区间矩形 [(r1, c1), (r2, c2)]。\n    return pre[r2 + 1][c2 + 1]\n         - pre[r1][c2 + 1]\n         - pre[r2 + 1][c1]\n         + pre[r1][c1];\n}\n```\n\n#### 变形点对照\n\n| 题型 | 是否是 Hot100 原始主线 | 使用方式 |\n|---|---|---|\n| 矩阵区域和 | 是二维前缀标准题 | 建 `m + 1`、`n + 1` 前缀表 |\n| 二维固定窗口 | 相邻扩展 | 枚举右下角，O(1) 查窗口和 |\n| `73 矩阵置零` | 行列标记主解 | 应回到矩阵专题的行列标记模板 |\n\n#### 易错点\n\n- 查询公式最后的 `+ pre[r1][c1]` 不能漏。\n- `pre` 坐标整体比原矩阵偏移一位，右下角访问要写 `r2 + 1`、`c2 + 1`。\n- 不要把所有矩阵题都套二维前缀；先判断题目是否真的在查询区域累计值。\n\n## 6. 高频易错点清单\n\n| 易错点 | 典型题目 | 规避方式 |\n|---|---|---|\n| 前缀数组下标错一位 | 区间和类 | 使用 `pre[i + 1] = pre[i] + num
