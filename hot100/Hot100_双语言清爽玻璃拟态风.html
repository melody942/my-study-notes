 min(height[left], height[right]);\n        ans = max(ans, width * shortSide);\n\n        // 移动短板：较高一侧即使保留，面积上限仍由短板决定。\n        // 原始笔记相等时走 else，即移动右指针；相等时移动任意一侧都安全。\n        if (height[left] \u003c height[right]) {\n            left++;\n        } else {\n            right--;\n        }\n    }\n\n    return ans;\n}\n```\n\n#### 易错点\n\n- 不能只说“移动短板更可能变大”，要能说明移动长板为什么一定不优。\n- 相等时移动任意一侧都可以，因为两侧都能作为当前短板被淘汰。\n- 双指针需要针对每道题重新证明移动方向。\n\n### 5.4 最后位置区间闭合\n\n#### 适用题型\n\n- `763 划分字母区间`。\n- 每个元素的全部出现必须落在同一个片段中。\n- 扫描时可以预先知道元素最后出现位置的区间切分题。\n\n#### 核心思路\n\n先记录每个字符的最后出现位置。扫描当前片段时，右边界 `right` 必须覆盖所有已出现字符的最后位置；当扫描下标 `i == right` 时，说明当前片段内的字符都不会再出现在后面，此时切开不会破坏约束。\n\n这个过程和 `45 跳跃游戏 II` 的层边界很像：扫描过程中不断扩张当前片段的最远右边界，只有当扫描指针追上边界时，当前“层/片段”才真正闭合。\n\n贪心证明点是“最早安全切分”：任何早于 `right` 的切分都会把某个已出现字符切到两个片段；而在 `right` 切分已经满足所有当前字符的闭合要求，越早切分越能给后续留下更多独立空间。\n\n#### 代码模板\n\n> **题目简述：** 763 划分字母区间：将字符串划分为尽可能多的片段，使每个字母最多出现在一个片段中，返回各段长度。 [力扣原题 ↗](https://leetcode.cn/problems/partition-labels/)\n\n```cpp\nvector\u003cint> partitionByLastOccurrenceTemplate(const string& s) {\n    vector\u003cint> last(26, -1);\n    for (int i = 0; i \u003c (int)s.size(); i++) {\n        last[s[i] - 'a'] = i;\n    }\n\n    vector\u003cint> ans;\n    int start = 0;\n    int right = 0;\n\n    for (int i = 0; i \u003c (int)s.size(); i++) {\n        // 当前片段必须一直扩张到所有已见字符的最后一次出现位置。\n        right = max(right, last[s[i] - 'a']);\n\n        if (i == right) {\n            ans.push_back(right - start + 1);\n            start = i + 1;\n        }\n    }\n\n    return ans;\n}\n```\n\n#### 易错点\n\n- 必须先预处理最后出现位置，不能边扫边凭当前字符决定切分。\n- `right` 是当前片段的动态闭合边界，区分于固定窗口长度。\n- 字符集超出小写字母时，把数组换成 `unordered_map\u003cchar, int>` 或离散化表。\n\n### 5.5 贪心正确性证明通用模板\n\n#### 适用题型\n\n- 面试中需要解释“为什么局部最优推出全局最优”的贪心题。\n- 排序贪心、区间贪心、边界压缩、双指针淘汰等题型的口头证明。\n\n#### 核心思路\n\n贪心代码通常很短，但证明必须补齐。常见证明方式有三种：\n\n1. 边界支配：只维护最远、最早、最小代价等代表性状态，其他状态被它支配。\n2. 交换论证：任意最优解都能把某一步替换成当前贪心选择，且答案不变差。\n3. 反证淘汰：被移动指针或被切掉的候选存在上界，不可能超过当前最优。\n\n#### 代码模板\n\n> **题目简述：** 本模板用于：面试中需要解释“为什么局部最优推出全局最优”的贪心题。；排序贪心、区间贪心、边界压缩、双指针淘汰等题型的口头证明。\n\n```cpp\nstruct GreedyProofChecklist {\n    string state;       // 维护的状态：如 farthest、end、right、shortSide\n    string choice;      // 当前做出的选择：如移动短板、扫描到 end 后跳一次\n    string discarded;   // 被丢弃的候选集合\n    string reason;      // 丢弃安全的理由：支配、交换或上界反证\n};\n\nbool greedyProofIsComplete(const GreedyProofChecklist& proof) {\n    // 这是写题解/复盘时的检查清单。\n    return !proof.state.empty()\n        && !proof.choice.empty()\n        && !proof.discarded.empty()\n        && !proof.reason.empty();\n}\n```\n\n#### 易错点\n\n- “每次选当前最优”只是做法描述，不能代替证明。\n- 如果说不清丢弃了哪些候选，通常说明这题不该直接套贪心。\n- 能用 DP 写不代表不能贪心；但能压缩状态前，必须先证明压缩不会丢最优解。\n\n## 6. 高频易错点清单\n\n| 易错点 | 典型题目 | 规避方式 |\n|---|---|---|\n| 贪心理由只写“感觉最优” | 全部贪心题 | 必须说明丢弃哪些候选且不会错过答案 |\n| 跳跃游戏没有判断断档 | `55` | 遍历时先判断 `i > farthest`，再更新最远覆盖 |\n| 跳跃游戏 II 终点多跳一次 | `45` | 循环到 `n - 2` 即可，站到终点后不再跳 |\n| 跳跃游戏 II 写了错误不可达保护 | `45` 通用化 | 原题保证可达；若泛化，必须处理 `i == end && maxlength == end` 的无法扩展情况 |\n| `end` 和 `maxlength/farthest` 混用 | `45` | `end` 是当前层边界，`maxlength` 是下一层合并后的最远覆盖 |\n| 容器题移动了高板 | `11` | 面积受短板限制，移动高板只会缩宽；相等时移动任意一侧都安全，原始笔记移动右侧 |\n| 划分字母区间没预处理最后位置 | `763` | 先扫一遍记录 `last[ch]` |\n| 区间还没闭合就切开 | `763` | 只有 `i == right/end` 才能切，逻辑类似跳跃题层边界闭合 |\n| 把所有 DP 题都强行贪心 | `322`、`416` | 不能证明局部选择安全时不要贪心 |\n\n## 7. 最短复盘口诀\n\n贪心题先问维护什么边界，再问丢掉什么候选。`55` 维护最远可达，`45` 维护当前层右端和下一层最远覆盖，原题保证可达；`11` 移动短板，相等时原始写法移动右侧；`763` 像跳跃题一样等最后位置边界闭合。能证明局部选择不伤全局，才是真贪心；证明不了就回到 DP、搜索或排序模型。\n\n================================================================================\n\n# 第14部分: 动态规划\n\n================================================================================\n\n> 目标：本文把 Hot100 动态规划题抽象成若干“状态定义 + 转移方程 + 遍历顺序”的复用模板。复习时先判断状态维度，再确认依赖方向，最后决定是否能滚动压缩。\n\n## 1. 动态规划题的底层模型\n\n动态规划题的核心在于把“重复子问题”翻译成可计算状态。每道 DP 题先问六个问题：\n\n| 问题 | 如果答案是“是” | 常用处理 |\n|---|---|---|\n| 当前答案只依赖前几个位置吗 | 爬楼梯、打家劫舍、最大子数组 | 一维 DP 或滚动变量 |\n| 状态是否需要两个坐标 | 网格路径、编辑距离、LCS | 二维 DP，明确 `dp[i][j]` 语义 |\n| 是否在区间内部枚举断点 | 最长回文、回文分割 | 区间 DP 或预处理回文表 |\n| 是否在集合容量内选择物品 | 零钱兑换、完全平方数、等和子集 | 背包 DP，注意循环方向 |\n| 当前最优是否同时需要最大和最小 | 乘积最大子数组 | 维护双状态，负数会交换角色 |\n| 能否用更强的数据结构优化 | LIS、接雨水、跳跃游戏 | 二分、单调栈、贪心作为 DP 优化 |\n\nDP 的标准落地过程只有四步：\n\n| 步骤 | 要写清楚什么 | 常见错误 |\n|---|---|---|\n| 定义状态 | `dp[i]` 或 `dp[i][j]` 表示什么 | 只写变量，不写语义 |\n| 初始化 | 空串、第一行、第一列、起点 | 边界漏掉导致整体偏移 |\n| 状态转移 | 当前状态从哪些旧状态来 | 依赖未计算或覆盖旧值 |\n| 遍历顺序 | 保证依赖项已经算完 | 背包一维压缩方向写反 |\n\n## 2. Hot100 动态规划题型地图\n\n动态规划专题覆盖 23 道典型题。`45`、`55` 可兼顾贪心，`22`、`131` 可兼顾回溯，`124` 可兼顾二叉树路径贡献；这里统一放在 DP 视角下理解。\n\n| 题型       | 题目                                   | 抽象能力              | 一句话记忆                       |\n| -------- | ------------------------------------ | ----------------- | --------------------------- |\n| 线性递推     | `70 爬楼梯`、`118 杨辉三角`                  | 从前置状态推出当前状态       | 先写清 `dp[i]`，再看能否滚动          |\n| 子数组最优    | `53 最大子数组和`、`152 乘积最大子数组`、`121 买卖股票` | 以当前位置结尾的最优贡献      | 子数组必须连续，状态要以 `i` 结尾         |\n| 网格路径     | `62 不同路径`、`64 最小路径和`                 | 二维坐标依赖上方和左方       | 第一行第一列是边界主线                 |\n| 字符串双序列   | `72 编辑距离`、`1143 最长公共子序列`             | 两个前缀之间的关系         | `dp[i][j]` 表示前 `i` 和前 `j`   |\n| 单串区间/括号  | `5 最长回文子串`、`32 最长有效括号`、`131 分割回文串`   | 子串合法性和区间依赖        | 回文看两端，括号看匹配点                |\n| 单词与拆分    | `139 单词拆分`                           | 前缀能否被合法切开         | `dp[i]` 表示前 `i` 个字符是否可拆     |\n| 背包选择     | `279 完全平方数`、`322 零钱兑换`、`416 分割等和子集`  | 容量状态与物品选择         | 完全背包正序，01 背包倒序              |\n| 序列优化     | `300 最长递增子序列`                        | `O(n^2)` DP 到二分优化 | `tails[len]` 存长度为 len 的最小尾值 |\n| 树形贡献     | `124 二叉树最大路径和`                       | 向上返回单边贡献          | 答案可左右合并，返回只能单边              |\n| 贪心可替代 DP | `45 跳跃游戏 II`、`55 跳跃游戏`、`42 接雨水`      | 从 DP 依赖中提炼局部最优    | 能维护最远/最高边界就不必全量 DP          |\n\n## 3. 复习顺序建议\n\n建议按“状态最简单 → 维度增加 → 选择模型 → 优化模型”的顺序复习：\n\n1. `70`、`118`：建立递推和初始化习惯。\n2. `53`、`121`、`152`：理解“以当前位置结尾”的状态定义。\n3. `62`、`64`：掌握二维 DP 的第一行、第一列初始化。\n4. `72`、`1143`：练两个字符串前缀 DP。\n5. `5`、`32`、`131`：练单字符串区间、匹配和预处理。\n6. `139`：练前缀可行性与枚举切点。\n7. `279`、`322`、`416`：练背包模型和循环方向。\n8. `198`：练“不相邻选择”的状态转移。\n9. `300`：先写 `O(n^2)`，再用 `tails + 二分`优化。\n10. `42`、`45`、`55`：理解 DP 可被双指针或贪心压缩的场景。\n11. `124`：把树上路径当成树形 DP 贡献题复盘。\n\n## 4. 关键套路详解\n\n### 4.1 状态定义必须带“结尾”或“前缀”语义\n\n`53 最大子数组和` 的 `dp[i]` 表示“以 `i` 结尾的最大连续子数组和”。因为连续子数组如果不要求以 `i` 结尾，就无法从 `i - 1` 转移到 `i`。\n\n`72 编辑距离` 和 `1143 LCS` 的 `dp[i][j]` 一般表示两个前缀：`word1[0..i-1]` 和 `word2[0..j-1]`。前缀语义能自然处理空串，所以数组大小通常开成 `(m + 1) * (n + 1)`。\n\n### 4.2 初始化属于状态语义\n\n二维 DP 中第一行、第一列通常代表空前缀或边界路径。`72` 中 `dp[i][0] = i` 表示把长度为 `i` 的字符串删空；`64` 中第一行只能从左边来，第一列只能从上边来。\n\n如果初始化想不清楚，说明状态语义还不够精确。\n\n### 4.3 背包题先判断“物品能用几次”\n\n| 模型 | 典型题目 | 一维循环方向 | 原因 |\n|---|---|---|---|\n| 01 背包 | `416 分割等和子集` | 容量倒序 | 防止同一物品被重复使用 |\n| 完全背包 | `322 零钱兑换`、`279 完全平方数` | 容量正序 | 允许当前物品被多次使用 |\n\n`322` 求最少硬币数，状态是最小值，初始化为不可达大数。`416` 求能否凑出目标，状态是布尔值，初始化 `dp[0] = true`。\n\n### 4.4 字符串 DP 多半在比较末尾字符\n\n两个字符串前缀题通常只看最后一个字符是否相等：\n\n| 题目 | 相等时 | 不相等时 |\n|---|---|---|\n| `1143 LCS` | `dp[i][j] = dp[i - 1][j - 1] + 1` | `max(dp[i - 1][j], dp[i][j - 1])` |\n| `72 编辑距离` | `dp[i][j] = dp[i - 1][j - 1]` | 插入、删除、替换取最小再加一 |\n\n单字符串回文题则比较区间两端：`s[l] == s[r]` 且内部区间已经是回文。\n\n### 4.5 DP 优化来自观察冗余状态\n\n`300 LIS` 的 `O(n^2)` DP 很直观，但只要求长度时，可以维护 `tails`：长度为 `k` 的递增子序列尾值越小越好，因为它给后续数字留下更大空间。\n\n`55 跳跃游戏` 也能写 DP，但只需要维护当前最远可达位置 `farthest`。如果遍历到某个位置 `i > farthest`，说明中间断档，不可能继续。\n\n## 5. 抽象代码模板\n\n本节优先保留空间优化写法，避免退回泛化的二维 `dp` 表。共同题型只抽一套骨架，变形处用变量语义、初始化和转移聚合方式说明小差异。\n\n### 5.1 模板一：线性 DP 的滚动变量\n\n#### 适用题型\n\n- `70 爬楼梯`：原始解法用 `prev1 / prev2 / res` 三个变量滚动。\n- `198 打家劫舍`：原始解法用 `prev1` 表示前一位置最优，`prev2` 表示前二位置最优。\n- `53 最大子数组和`：原始笔记保留了“前缀和 - 最小前缀”和 `f = max(f, 0) + x` 两种 O(1) 写法。\n- `121 买卖股票的最佳时机`：原始解法用历史最低价压缩状态。\n\n#### 核心思路\n\n线性 DP 的空间优化前提是：当前状态只依赖少数旧状态。代码上不再创建完整 `dp` 数组，而是把旧状态命名为 `prev1`、`prev2`、`f`、`minprice` 等变量。变形差异主要在“当前状态是否必须选当前位置”：爬楼梯是方案数累加，打家劫舍是在偷与不偷之间取最大，最大子数组要求连续，股票题维护历史最小买点。\n\n#### 代码模板：共同滚动骨架\n\n> **题目简述：** 本模板覆盖：70 爬楼梯（每次可爬一阶或两阶，给定总阶数 N，求到达楼顶的不同方式数。）；198 打家劫舍（给定各房屋金额，相邻房屋不能同时偷取，求一晚可取得的最大金额。）；53 最大子数组和（给定整数数组，找出和最大的非空连续子数组并返回其和。）；121 买卖股票的最佳时机（给定每日股价，最多完成一次先买后卖，求能够获得的最大利润。） [53 原题 ↗](https://leetcode.cn/problems/maximum-subarray/) · [70 原题 ↗](https://leetcode.cn/problems/climbing-stairs/) · [121 原题 ↗](https://leetcode.cn/problems/best-time-to-buy-and-sell-stock/) · [198 原题 ↗](https://leetcode.cn/problems/house-robber/)\n\n```cpp\n// 共同骨架：先保存本轮结果，再整体向前滚动旧状态。\n// prev1：处理到前一个位置的答案；prev2：处理到前两个位置的答案。\nint cur = /* 根据题目转移得到当前答案 */;\nprev2 = prev1;\nprev1 = cur;\n```\n\n#### 原始解法 A：爬楼梯\n\n> **题目简述：** 70 爬楼梯：每次可爬一阶或两阶，给定总阶数 N，求到达楼顶的不同方式数。 [力扣原题 ↗](https://leetcode.cn/problems/climbing-stairs/)\n\n```cpp\nclass Solution {\npublic:\n    int climbStairs(int n) {\n        int prev1 = 1, prev2 = 1, res = 1;\n        for (int i = 2; i \u003c= n; i++) {\n            // res 表示到第 i 阶的方法数：从 i-1 走一步，或从 i-2 走两步。\n            res = prev1 + prev2;\n            prev2 = prev1;\n            prev1 = res;\n        }\n        return res;\n    }\n};\n```\n\n#### 原始解法 B：打家劫舍\n\n> **题目简述：** 198 打家劫舍：给定各房屋金额，相邻房屋不能同时偷取，求一晚可取得的最大金额。 [力扣原题 ↗](https://leetcode.cn/problems/house-robber/)\n\n```cpp\nclass Solution {\npublic:\n    int rob(vector\u003cint>& nums) {\n        if (nums.size() == 1) return nums[0];\n\n        // prev1：处理到下标 1 的最优值；prev2：处理到下标 0 的最优值。\n        int prev1 = max(nums[0], nums[1]), prev2 = nums[0];\n        int res = prev1;\n\n        for (int i = 2; i \u003c nums.size(); i++) {\n            // 不偷 i：prev1；偷 i：prev2 + nums[i]。\n            res = max(prev1, prev2 + nums[i]);\n            prev2 = prev1;\n            prev1 = res;\n        }\n        return res;\n    }\n};\n```\n\n#### 原始解法 C：最大子数组和\n\n> **题目简述：** 53 最大子数组和：给定整数数组，找出和最大的非空连续子数组并返回其和。 [力扣原题 ↗](https://leetcode.cn/problems/maximum-subarray/)\n\n```cpp\nclass Solution {\npublic:\n    int maxSubArray(vector\u003cint>& nums) {\n        int res = INT_MIN, f = 0;\n        for (int x : nums) {\n            // f 表示以当前 x 结尾的最大连续子数组和。\n            // max(f, 0) 表示旧贡献为负就断开，从当前 x 重新开始。\n            f = max(f, 0) + x;\n            res = max(res, f);\n        }\n        return res;\n    }\n};\n```\n\n也可以按原笔记的前缀和思路理解同一件事：`sums - premin` 表示以当前前缀为右端时能得到的最大连续和。\n\n> **题目简述：** 53 最大子数组和：给定整数数组，找出和最大的非空连续子数组并返回其和。 [力扣原题 ↗](https://leetcode.cn/problems/maximum-subarray/)\n\n```cpp\nclass Solution {\npublic:\n    int maxSubArray(vector\u003cint>& nums) {\n        int sums = 0, res = INT_MIN;\n        int premin = 0;\n        for (int i = 0; i \u003c nums.size(); i++) {\n            sums += nums[i];\n            res = max(res, sums - premin);\n            premin = min(premin, sums);\n        }\n        return res;\n    }\n};\n```\n\n#### 原始解法 D：股票一次交易\n\n> **题目简述：** 本模板覆盖：70 爬楼梯（每次可爬一阶或两阶，给定总阶数 N，求到达楼顶的不同方式数。）；198 打家劫舍（给定各房屋金额，相邻房屋不能同时偷取，求一晚可取得的最大金额。）；53 最大子数组和（给定整数数组，找出和最大的非空连续子数组并返回其和。）；121 买卖股票的最佳时机（给定每日股价，最多完成一次先买后卖，求能够获得的最大利润。） [53 原题 ↗](https://leetcode.cn/problems/maximum-subarray/) · [70 原题 ↗](https://leetcode.cn/problems/climbing-stairs/) · [121 原题 ↗](https://leetcode.cn/problems/best-time-to-buy-and-sell-stock/) · [198 原题 ↗](https://leetcode.cn/problems/house-robber/)\n\n```cpp\nclass Solution {\npublic:\n    int maxProfit(vector\u003cint>& prices) {\n        int minprice = INT_MAX, res = INT_MIN;\n        for (int x : prices) {\n            // minprice 是当前及之前见过的最低买入价。\n            minprice = min(x, minprice);\n            // 今天作为卖出日，利润只依赖历史最低价。\n            res = max(res, x - minprice);\n        }\n        return res == INT_MIN ? 0 : res;\n    }\n};\n```\n\n#### 易错点\n\n- 滚动变量更新顺序不能反：必须先算 `res/cur`，再移动 `prev2 = prev1`、`prev1 = res`。\n- 最大子数组和不能为空，`res` 要从 `INT_MIN` 或 `nums[0]` 级别初始化。\n- 股票题的状态被压缩成“历史最低价 + 当前最大利润”。\n\n### 5.2 模板二：最大乘积子数组双状态\n\n#### 适用题型\n\n- `152 最大乘积子数组`：原始解法用 `cur_max / cur_min / global_max` 三个变量做 O(1) 空间优化。\n- 连续乘积类题：负数会让最大值和最小值互换角色，必须维护双状态。\n\n#### 核心思路\n\n`cur_max` 和 `cur_min` 都表示“以当前位置结尾”的乘积状态。遇到正数时最大仍可能来自旧最大，遇到负数时旧最小乘负数可能变成新最大，遇到 0 时把 `num` 本身纳入 `max/min`，自然完成重启。\n\n#### 代码模板\n\n> **题目简述：** 152 乘积最大子数组：给定整数数组，找出乘积最大的非空连续子数组并返回该乘积。 [力扣原题 ↗](https://leetcode.cn/problems/maximum-product-subarray/)\n\n```cpp\nclass Solution {\npublic:\n    int maxProduct(vector\u003cint>& nums) {\n        if (nums.empty()) return 0;\n\n        int cur_max = nums[0];\n        int cur_min = nums[0];\n        int global_max = nums[0];\n\n        for (int i = 1; i \u003c nums.size(); i++) {\n            int prev_max = cur_max; // 保存旧最大，避免更新 cur_max 后污染 cur_min。\n            int num = nums[i];\n\n            cur_max = max({num, prev_max * num, cur_min * num});\n            cur_min = min({num, prev_max * num, cur_min * num});\n            global_max = max(global_max, cur_max);\n        }\n        return global_max;\n    }\n};\n```\n\n#### 易错点\n\n- 不能只维护最大乘积，负数会让旧最小变成新最大。\n- 只保存 `prev_max` 是因为 `cur_min` 此时还是上一轮旧值；如果先改了 `cur_min`，也必须保存旧最小。\n\n### 5.3 模板三：网格 DP 的一维压缩\n\n#### 适用题型\n\n- `62 不同路径`：原始解法直接使用 `vector\u003cint> dp(n, 1)`，空间 O(n)。\n- `64 最小路径和`：原始解法使用一维 `dp`，先初始化第一行，再逐行滚动。\n\n#### 核心思路\n\n网格题的二维状态 `dp[i][j]` 只依赖上方和左方，因此可以压缩成一行：进入当前行时，`dp[j]` 还是“上方”的值；本轮更新后的 `dp[j - 1]` 是“左方”的值。不同路径是相加，最小路径和是取最小后加当前格子。\n\n#### 原始解法 A：不同路径\n\n> **题目简述：** 62 不同路径：机器人位于网格左上角且只能向右或向下，求到右下角的不同路径数。 [力扣原题 ↗](https://leetcode.cn/problems/unique-paths/)\n\n```cpp\nclass Solution {\npublic:\n    int uniquePaths(int m, int n) {\n        // 第一行每个位置只有一种走法，直接初始化为 1。\n        vector\u003cint> dp(n, 1);\n        for (int i = 1; i \u003c m; i++) {\n            for (int j = 1; j \u003c n; j++) {\n                // dp[j] 是上方，dp[j - 1] 是左方。\n                dp[j] = dp[j] + dp[j - 1];\n            }\n        }\n        return dp[n - 1];\n    }\n};\n```\n\n#### 原始解法 B：最小路径和\n\n> **题目简述：** 64 最小路径和：给定非负网格，只能向右或向下移动，求左上到右下的最小路径和。 [力扣原题 ↗](https://leetcode.cn/problems/minimum-path-sum/)\n\n```cpp\nclass Solution {\npublic:\n    int minPathSum(vector\u003cvector\u003cint>>& grid) {\n        int m = grid.size(), n = grid[0].size();\n        vector\u003cint> dp(n, 0);\n\n        // 第一行只能从左往右走，所以先单独初始化。\n        dp[0] = grid[0][0];\n        for (int j = 1; j \u003c n; j++) dp[j] = dp[j - 1] + grid[0][j];\n\n        for (int i = 1; i \u003c m; i++) {\n            // 第一列只能从上往下走。\n            dp[0] = dp[0] + grid[i][0];\n            for (int j = 1; j \u003c n; j++) {\n                // dp[j] 是上方旧值，dp[j - 1] 是左方新值。\n                dp[j] = min(dp[j], dp[j - 1]) + grid[i][j];\n            }\n        }\n        return dp[n - 1];\n    }\n};\n```\n\n原笔记还给了带哨兵的一维写法，本质是用 `INT_MAX` 消掉第一列特判：\n\n> **题目简述：** 64 最小路径和：给定非负网格，只能向右或向下移动，求左上到右下的最小路径和。 [力扣原题 ↗](https://leetcode.cn/problems/minimum-path-sum/)\n\n```cpp\nclass Solution {\npublic:\n    int minPathSum(vector\u003cvector\u003cint>>& grid) {\n        int n = grid[0].size();\n        vector\u003cint> f(n + 1, INT_MAX);\n        f[1] = 0;\n        for (auto& row : grid) {\n            for (int j = 0; j \u003c n; j++) {\n                f[j + 1] = min(f[j], f[j + 1]) + row[j];\n            }\n        }\n        return f[n];\n    }\n};\n```\n\n#### 易错点\n\n- 一维压缩时 `dp[j]` 和 `dp[j - 1]` 的时间含义不同：前者是上一行，后者是当前行左边。\n- 最小路径和不能把不存在方向当作 0，否则边界会被错误压低。\n- `uniquePaths` 的 `m / n` 是行列数量，答案是 `dp[n - 1]`，避免写成 `dp[n]`。\n\n### 5.4 模板四：双字符串前缀 DP 的一维压缩\n\n#### 适用题型\n\n- `1143 最长公共子序列`：原始解法使用一维 `dp(n + 1)`，通过 `pre/temp` 保存左上角。\n- `72 编辑距离`：原始解法同样压缩到一维，通过 `prev/temp` 保存 `dp[i-1][j-1]`。\n\n#### 核心思路\n\n双字符串 DP 的二维依赖通常有三个方向：上方 `dp[i-1][j]`、左方 `dp[i][j-1]`、左上方 `dp[i-1][j-1]`。压缩为一维后：\n但是我后面觉得，感觉这个没必要压缩了，不压缩多简单，一压缩怎么看都费劲。都贴在这边吧。\n```cpp\n双字符串前缀 DP\n\n适用题型：\n- 最长公共子序列。\n- 编辑距离。\n- 两个字符串之间的匹配、删除、替换类问题。\n\n核心不变：\n- dp[i][j] 表示 text1 前 i 个字符和 text2 前 j 个字符的答案。\n- 字符访问时用 text1[i - 1] 和 text2[j - 1]。\n\n变形处理：\n- LCS：相等取左上 + 1，不等取上方/左方最大。\n- 编辑距离：相等继承左上，不等从插入、删除、替换取最小 + 1。\n- 如果只依赖上一行和当前行，可以滚动数组压缩空间。\n*/\nint lcsTemplate(string a, string b) {\n    int m = a.size();\n    int n = b.size();\n    vector\u003cvector\u003cint>> dp(m + 1, vector\u003cint>(n + 1, 0));\n\n    for (int i = 1; i \u003c= m; i++) {\n        for (int j = 1; j \u003c= n; j++) {\n            if (a[i - 1] == b[j - 1]) {\n                dp[i][j] = dp[i - 1][j - 1] + 1;\n            } else {\n                dp[i][j] = max(dp[i - 1][j], dp[i][j - 1]);\n            }\n        }\n    }\n\n    return dp[m][n];\n}\n\nint editDistanceTemplate(string a, string b) {\n    int m = a.size();\n    int n = b.size();\n    vector\u003cvector\u003cint>> dp(m + 1, vector\u003cint>(n + 1, 0));\n\n    for (int i = 0; i \u003c= m; i++) {\n        dp[i][0] = i;\n    }\n    for (int j = 0; j \u003c= n; j++) {\n        dp[0][j] = j;\n    }\n\n    for (int i = 1; i \u003c= m; i++) {\n        for (int j = 1; j \u003c= n; j++) {\n            if (a[i - 1] == b[j - 1]) {\n                dp[i][j] = dp[i - 1][j - 1];\n            } else {\n                dp[i][j] = min({dp[i - 1][j], dp[i][j - 1], dp[i - 1][j - 1]}) + 1;\n            }\n        }\n    }\n\n    return dp[m][n];\n}\n```\n\n| 二维位置 | 一维变量 |\n|---|---|\n| 上方 `dp[i-1][j]` | 进入本轮内层循环前的 `dp[j]` |\n| 左方 `dp[i][j-1]` | 已经更新过的 `dp[j - 1]` |\n| 左上 `dp[i-1][j-1]` | 手动保存的 `pre/prev` |\n\n#### 原始解法 A：最长公共子序列\n\n> **题目简述：** 1143 最长公共子序列：给定两个字符串，求二者保持字符相对顺序但不要求连续的最长公共子序列长度。 [力扣原题 ↗](https://leetcode.cn/problems/longest-common-subsequence/)\n\n```cpp\nclass Solution {\npublic:\n    int longestCommonSubsequence(string text1, string text2) {\n        int m = text1.size();\n        int n = text2.size();\n        vector\u003cint> dp(n + 1, 0);\n\n        for (int i = 1; i \u003c= m; i++) {\n            int pre = dp[0]; // 左上角：上一行的 dp[j - 1]。\n            for (int j = 1; j \u003c= n; j++) {\n                int temp = dp[j]; // 保存上方，供下一列作为左上角。\n                if (text1[i - 1] == text2[j - 1]) {\n                    dp[j] = pre + 1;\n                } else {\n                    dp[j] = max(dp[j], dp[j - 1]);\n                }\n                pre = temp;\n            }\n        }\n        return dp[n];\n    }\n};\n```\n\n#### 原始解法 B：编辑距离\n\n> **题目简述：** 72 编辑距离：给定两个单词，求通过插入、删除或替换字符将前者变为后者的最少操作数。 [力扣原题 ↗](https://leetcode.cn/problems/edit-distance/)\n\n```cpp\nclass Solution {\npublic:\n    int minDistance(string word1, string word2) {\n        int m = word1.length();\n        int n = word2.length();\n        vector\u003cint> dp(n + 1);\n\n        // 第一行：空串变成 word2 的前 j 个字符，需要插入 j 次。\n        for (int j = 0; j \u003c= n; j++) dp[j] = j;\n\n        for (int i = 1; i \u003c= m; i++) {\n            int prev = dp[0]; // 左上角 dp[i - 1][0]。\n            dp[0] = i;        // 第一列：word1 前 i 个字符删成空串。\n\n            for (int j = 1; j \u003c= n; j++) {\n                int temp = dp[j]; // 更新前的 dp[j] 是上方。\n                if (word1[i - 1] == word2[j - 1]) {\n                    dp[j] = prev;\n                } else {\n                    // dp[j]：删除；dp[j - 1]：插入；prev：替换。\n                    dp[j] = 1 + min({dp[j], dp[j - 1], prev});\n                }\n                prev = temp;\n            }\n        }\n\n        return dp[n];\n    }\n};\n```\n\n#### 易错点\n\n- `pre/prev` 必须在覆盖 `dp[j]` 前保存；内层循环末尾再更新为 `temp`。\n- 编辑距离每一行开始都要先把 `dp[0]` 改成 `i`，否则第一列仍停留在上一行。\n- LCS 的 `dp[j - 1]` 是当前行左边，`dp[j]` 是上一行上方，二者语义不能混。\n\n### 5.5 模板五：单串区间、括号与切分\n\n#### 适用题型\n\n- `5 最长回文子串`：原始解法使用二维回文表，从右下向左上遍历。\n- `32 最长有效括号`：原始笔记同时保留 DP 写法和栈哨兵写法。\n- `131 分割回文串`：原始解法使用 `huiwen(left, right)` 即时判断 + 回溯，未使用预处理表。\n\n#### 核心思路\n\n单串题的关键是“区间是否有效”。最长回文子串用 `dp[i][j]` 表示 `s[i..j]` 是否为回文；最长有效括号用 `dp[i]` 表示以 `i` 结尾的最长有效括号长度；回文切分则把“判断一段是否回文”作为 DFS 的合法性检查。\n\n#### 原始解法 A：最长回文子串\n\n> **题目简述：** 5 最长回文子串：给定字符串，返回其中长度最长的连续回文子串。 [力扣原题 ↗](https://leetcode.cn/problems/longest-palindromic-substring/)\n\n```cpp\nclass Solution {\npublic:\n    string longestPalindrome(string s) {\n        int n = s.length();\n        if (n \u003c 2) return s;\n\n        vector\u003cvector\u003cbool>> dp(n, vector\u003cbool>(n, false));\n        int max_len = 1;\n        int begin = 0;\n\n        // i 从右往左，保证 dp[i + 1][j - 1] 已经计算过。\n        for (int i = n - 1; i >= 0; i--) {\n            for (int j = i; j \u003c n; j++) {\n                if (s[i] == s[j]) {\n                    if (j - i \u003c= 2 || dp[i + 1][j - 1]) {\n                        dp[i][j] = true;\n                    }\n                }\n                if (dp[i][j] && j - i + 1 > max_len) {\n                    max_len = j - i + 1;\n                    begin = i;\n                }\n            }\n        }\n        return s.substr(begin, max_len);\n    }\n};\n```\n\n#### 原始解法 B：最长有效括号 DP\n\n> **题目简述：** 32 最长有效括号：给定仅含左右圆括号的字符串，求最长连续合法括号子串的长度。 [力扣原题 ↗](https://leetcode.cn/problems/longest-valid-parentheses/)\n\n```cpp\nclass Solution {\npublic:\n    int longestValidParentheses(string s) {\n        int n = s.size();\n        if (n \u003c 2) return 0;\n\n        vector\u003cint> dp(n);\n        int maxlen = 0;\n\n        for (int i = 1; i \u003c n; i++) {\n            if (s[i] == ')') {\n                if (s[i - 1] == '(') {\n                    dp[i] = (i >= 2 ? dp[i - 2] : 0) + 2;\n                } else if (i - dp[i - 1] - 1 >= 0 && s[i - dp[i - 1] - 1] == '(') {\n                    int match = i - dp[i - 1] - 1;\n                    dp[i] = dp[i - 1] + 2 + (match - 1 >= 0 ? dp[match - 1] : 0);\n                }\n            }\n            maxlen = max(maxlen, dp[i]);\n        }\n        return maxlen;\n    }\n};\n```\n\n#### 原始解法 C：回文切分\n\n> **题目简述：** 本模板覆盖：5 最长回文子串（给定字符串，返回其中长度最长的连续回文子串。）；32 最长有效括号（给定仅含左右圆括号的字符串，求最长连续合法括号子串的长度。）；131 分割回文串（将给定字符串切分成若干子串，返回每段都是回文串的全部切分方案。） [5 原题 ↗](https://leetcode.cn/problems/longest-palindromic-substring/) · [32 原题 ↗](https://leetcode.cn/problems/longest-valid-parentheses/) · [131 原题 ↗](https://leetcode.cn/problems/palindrome-partitioning/)\n\n```cpp\nclass Solution {\nprivate:\n    vector\u003cvector\u003cstring>> res;\n    vector\u003cstring> path;\n\npublic:\n    bool huiwen(string& s, int left, int right) {\n        while (left \u003c right) {\n            if (s[left] != s[right]) return false;\n            left++;\n            right--;\n        }\n        return true;\n    }\n\n    void dfs(string& s, int start) {\n        if (start == s.size()) {\n            res.push_back(path);\n            return;\n        }\n\n        for (int i = start; i \u003c s.size(); i++) {\n            if (huiwen(s, start, i)) {\n                path.push_back(s.substr(start, i - start + 1));\n                dfs(s, i + 1);\n                path.pop_back(); // 撤销当前切分段，继续尝试下一个右端点。\n            }\n        }\n    }\n\n    vector\u003cvector\u003cstring>> partition(string s) {\n        dfs(s, 0);\n        return res;\n    }\n};\n```\n\n#### 原始解法 D：最长有效括号栈哨兵\n\n> **题目简述：** 32 最长有效括号：给定仅含左右圆括号的字符串，求最长连续合法括号子串的长度。 [力扣原题 ↗](https://leetcode.cn/problems/longest-valid-parentheses/)\n\n```cpp\nclass Solution {\npublic:\n    int longestValidParentheses(string s) {\n        int max_len = 0;\n        stack\u003cint> st;\n        st.push(-1); // 哨兵墙：表示当前有效段左边界之前的位置。\n\n        for (int i = 0; i \u003c s.length(); i++) {\n            if (s[i] == '(') {\n                st.push(i);\n            } else {\n                st.pop();\n                if (st.empty()) {\n                    // 当前右括号无法匹配，成为下一段有效括号的新墙。\n                    st.push(i);\n                } else {\n                    // 栈顶是当前有效段左边界之前的位置。\n                    max_len = max(max_len, i - st.top());\n                }\n            }\n        }\n        return max_len;\n    }\n};\n```\n\n#### 易错点\n\n- 最长回文子串的遍历顺序不能随意改：`dp[i][j]` 依赖更内层的 `dp[i + 1][j - 1]`。\n- 最长有效括号第二种转移里，匹配左括号下标是 `i - dp[i - 1] - 1`。\n- 栈哨兵 `-1` 是“墙”，栈空时要把当前右括号下标压入作为新墙。\n- 回文切分原始写法没有预处理表，复杂度更高但代码直观；如果改成预处理表，必须标明这是优化版，与原始参考解法区分。\n\n### 5.6 模板六：一维背包 DP\n\n#### 适用题型\n\n- `322 零钱兑换`：原始解法是一维完全背包，`dp[j]` 表示凑出金额 `j` 的最少硬币数。\n- `279 完全平方数`：原始解法也是一维完全背包，物品重量是 `i * i`。\n- `416 分割等和子集`：原始解法是一维 01 背包，容量必须倒序。\n\n#### 核心思路\n\n背包压缩后只保留容量维度。完全背包允许同一物品重复使用，所以容量正序；01 背包每个物品只能用一次，所以容量倒序。求最小数量时用大数初始化；求可行性时用布尔状态，`dp[0] = true` 表示什么都不选即可凑出 0。\n\n关于先遍历背包容量还是先遍历物品的问题：\n\n这取决于两个关键要素：**这是 01 背包还是完全背包？** 以及 **题目到底让你求什么？**\n\n给你一个最清晰的终极定论，我们分情况来看：\n##### 1. 01 背包\n\n**结论：必须先遍历物品（外层），再倒序遍历容量（内层）。绝对不能反过来！**\n\n- **为什么不能先遍历容量？**\n    在一维 `dp` 数组中，我们利用倒序遍历容量来保证“每个物品只被使用一次”。\n    如果你把容量放在外层循环（`for j = target down to 0`），物品放在内层循环（`for i = 0 to nums.size()`），当你计算 `dp[j]` 时，你试图复用 `dp[j - nums[i]]` 的状态。但是此时的 `dp[j - nums[i]]` 已经在之前的容量外循环中，被**所有的物品**更新过了。这就导致同一个物品被重复放入背包，01 背包直接变成了完全背包。\n    \n---\n##### 2. 完全背包 - 求最值 / 可行性（例如 322 零钱兑换、279 完全平方数）\n**结论：内外层循环顺序无所谓！谁先谁后都可以。**\n- **为什么无所谓？**\n    在这两道题中，题目问的是“最少需要多少个硬币/完全平方数”。我们不在乎硬币是怎么组合的，是 `[1, 2]` 还是 `[2, 1]` 对我们来说都是 2 个硬币。\n    - **外层物品，内层容量（你的模板写法）：** 意思是“我先拿着面值 1 的硬币，去尝试更新所有的容量；然后我再拿着面值 2 的硬币，去更新所有的容量”。\n    - **外层容量，内层物品（反向写法）：** 意思是“我想凑出容量 1，我挨个试试所有的硬币；我想凑出容量 2，我再挨个试试所有的硬币”。\n        由于物品可以无限次使用，这两种遍历方式都能覆盖所有可能的状态，最终求得的最小值是一模一样的。你可以自己去力扣 322 题把两个 `for` 循环换个位置，一样能 AC。\n        \n---\n##### 3. 完全背包 - 求方案数（真正的易错大坑）\n虽然你上面列的题目里没有，但这是面试最喜欢考的变形。一旦遇到求**方案数（有多少种方法凑出容量）**，循环顺序将决定生死。\n- **情况 A：求组合数（不强调顺序，`{1, 2}` 和 `{2, 1}` 算同一种方法）**\n    - **典型题目：** 力扣 518. 零钱兑换 II\n    - **结论：必须先遍历物品，再遍历容量。**\n    - **解释：** 当你先遍历物品时，你是先用硬币 1 铺满整个 `dp` 数组，然后再用硬币 2 去叠加。这意味着你的方案里，硬币永远是按 `[1, 1, 2, 2]` 这种严格顺序出现的，绝不可能出现 `[2, 1]` 这种逆序组合。因此它求出来的天然就是**组合数**。\n- **情况 B：求排列数（强调顺序，`{1, 2}` 和 `{2, 1}` 算两种不同的方法）**\n    - **典型题目：** 力扣 377. 组合总和 Ⅳ\n    - **结论：必须先遍历容量，再遍历物品。**\n    - **解释：** 把容量放在外层，意味着你在思考：“为了凑出容量 5，如果我最后一步放的是硬币 1，方案数就是 `dp[4]`；如果最后一步放的是硬币 2，方案数就是 `dp[3]`”。这种逻辑天然就在穷举所有的排列顺序，所以它求出来的是**排列数**。\n\n\n| **背包类型**  | **题目诉求**         | **外层循环** | **内层循环 (容量方向)** |\n| --------- | ---------------- | -------- | --------------- |\n| **01 背包** | 求最值 / 可行性        | **物品**   | **容量 (必须倒序)**   |\n| **完全背包**  | 求最值 / 可行性        | **物品**   | 容量 (正序)         |\n| **完全背包**  | 求 **组合数** (顺序无关) | **物品**   | **容量 (正序)**     |\n| **完全背包**  | 求 **排列数** (顺序有关) | **容量**   | **物品**          |\n\n#### 原始解法 A：零钱兑换\n\n> **题目简述：** 322 零钱兑换：给定可无限使用的硬币面额和总金额，求凑成金额的最少硬币数，不可达则返回 -1。 [力扣原题 ↗](https://leetcode.cn/problems/coin-change/)\n\n```cpp\nclass Solution {\npublic:\n    int coinChange(vector\u003cint>& coins, int amount) {\n        vector\u003cint> dp(amount + 1, amount + 1);\n        dp[0] = 0;\n\n        for (int i = 0; i \u003c coins.size(); i++) {\n            int count = coins[i];\n            // 完全背包正序：本轮更新后的 dp[j - count] 可以继续使用当前硬币。\n            for (int j = count; j \u003c= amount; j++) {\n                dp[j] = min(dp[j], dp[j - count] + 1);\n            }\n        }\n        return dp[amount] == amount + 1 ? -1 : dp[amount];\n    }\n};\n```\n\n#### 原始解法 B：完全平方数\n\n> **题目简述：** 279 完全平方数：给定正整数 N，求和为 N 所需的完全平方数的最少数量。 [力扣原题 ↗](https://leetcode.cn/problems/perfect-squares/)\n\n```cpp\nclass Solution {\npublic:\n    int numSquares(int n) {\n        // 求最小值，全填 n + 1；最差全用 1，也只需要 n 个。\n        vector\u003cint> dp(n + 1, n + 1);\n        dp[0] = 0;\n\n        for (int i = 1; i * i \u003c= n; i++) {\n            int weight = i * i;\n            // 完全背包正序遍历容量。\n            for (int j = weight; j \u003c= n; j++) {\n                dp[j] = min(dp[j], dp[j - weight] + 1);\n            }\n        }\n        return dp[n];\n    }\n};\n```\n\n#### 原始解法 C：分割等和子集\n\n> **题目简述：** 416 分割等和子集：给定正整数数组，判断能否将每个元素恰用一次地分成两个元素和相等的子集。 [力扣原题 ↗](https://leetcode.cn/problems/partition-equal-subset-sum/)\n\n```cpp\nclass Solution {\npublic:\n    bool canPartition(vector\u003cint>& nums) {\n        int sum = 0;\n        for (int num : nums) sum += num;\n        if (sum % 2 != 0) return false;\n\n        int target = sum / 2;\n        vector\u003cint> dp(target + 1);\n        dp[0] = 1;\n\n        for (int i = 0; i \u003c nums.size(); i++) {\n            // 01 背包倒序：避免 nums[i] 在同一轮被重复使用。\n            for (int j = target; j >= nums[i]; j--) {\n                dp[j] = dp[j] || dp[j - nums[i]];\n            }\n        }\n        return dp[target];\n    }\n};\n```\n\n#### 易错点\n\n- `322` 和 `279` 都是完全背包，容量必须正序。\n- `416` 是 01 背包，容量必须倒序；写成正序会把一个数用多次。\n- 最小数量类题的不可达值要用 `amount + 1` 或 `n + 1`，不能初始化为 0。\n\n### 5.7 模板七：前缀可行性与序列优化\n\n#### 适用题型\n\n- `139 单词拆分`：原始解法是一维布尔 DP，枚举当前位置和词典单词。\n- `300 最长递增子序列`：原始笔记同时保留 `O(n^2)` DP 和 `tails + lower_bound` 优化版。\n- `118 杨辉三角`：原始解法直接构造每一行，下一行依赖上一行相邻两个数。\n\n#### 核心思路\n\n单词拆分的 `dp[i]` 表示 `s[0..i-1]` 能否被拆分；LIS 的 `dp[i]` 表示以 `nums[i]` 结尾的最长长度，进一步优化时不再保存所有结尾状态，而用 `tails` 保存“同长度下最小尾值”。杨辉三角是二维结果构造，不需要额外空间优化，因为题目要求返回整个三角形。\n\n#### 原始解法 A：单词拆分\n\n> **题目简述：** 139 单词拆分：给定字符串和单词字典，判断字符串能否拆成一个或多个字典单词。 [力扣原题 ↗](https://leetcode.cn/problems/word-break/)\n\n```cpp\nclass Solution {\npublic:\n    bool wordBreak(string s, vector\u003cstring>& wordDict) {\n        int n = s.size();\n        vector\u003cbool> dp(n + 1);\n        dp[0] = true;\n\n        for (int i = 0; i \u003c= n; i++) {\n            for (auto& word : wordDict) {\n                int length = word.size();\n                if (i >= length && dp[i - length] && word == s.substr(i - length, length)) {\n                    dp[i] = true;\n                    break;\n                }\n            }\n        }\n        return dp[n];\n    }\n};\n```\n\n#### 原始解法 B：最长递增子序列\n\n> **题目简述：** 300 最长递增子序列：给定整数数组，求保持原有次序但不必连续的最长严格递增子序列长度。 [力扣原题 ↗](https://leetcode.cn/problems/longest-increasing-subsequence/)\n\n```cpp\nclass Solution {\npublic:\n    int lengthOfLIS(vector\u003cint>& nums) {\n        vector\u003cint> tails;\n        for (int num : nums) {\n            if (tails.empty() || num > tails.back()) {\n                tails.push_back(num);\n            } else {\n                auto it = lower_bound(tails.begin(), tails.end(), num);\n                *it = num;\n            }\n        }\n        return tails.size();\n    }\n};\n```\n\n原笔记中的基础 DP 版用于理解状态语义：\n\n> **题目简述：** 300 最长递增子序列：给定整数数组，求保持原有次序但不必连续的最长严格递增子序列长度。 [力扣原题 ↗](https://leetcode.cn/problems/longest-increasing-subsequence/)\n\n```cpp\nclass Solution {\npublic:\n    int lengthOfLIS(vector\u003cint>& nums) {\n        if (nums.empty()) return 0;\n        int n = nums.size();\n        vector\u003cint> dp(n, 1);\n        int maxLength = 1;\n\n        for (int i = 1; i \u003c n; i++) {\n            for (int j = 0; j \u003c i; j++) {\n                if (nums[i] > nums[j]) {\n                    dp[i] = max(dp[i], dp[j] + 1);\n                }\n            }\n            maxLength = max(maxLength, dp[i]);\n        }\n        return maxLength;\n    }\n};\n```\n\n#### 原始解法 C：杨辉三角\n\n> **题目简述：** 118 杨辉三角：给定行数，返回杨辉三角的前若干行，每项为左上与右上两项之和。 [力扣原题 ↗](https://leetcode.cn/problems/pascals-triangle/)\n\n```cpp\nclass Solution {\npublic:\n    vector\u003cvector\u003cint>> generate(int numRows) {\n        vector\u003cvector\u003cint>> res(numRows);\n        for (int i = 0; i \u003c numRows; i++) {\n            res[i].resize(i + 1, 1);\n            for (int j = 1; j \u003c i; j++) {\n                res[i][j] = res[i - 1][j - 1] + res[i - 1][j];\n            }\n        }\n        return res;\n    }\n};\n```\n\n#### 易错点\n\n- 单词拆分原始写法是“位置 i + 枚举 word”，`substr` 起点是 `i - length`。\n- LIS 严格递增用 `lower_bound` 替换第一个 `>= num` 的尾值；如果是非递减才考虑 `upper_bound`。\n- 杨辉三角题目要求返回完整二维数组，不能为了空间优化只保留一行。\n\n### 5.8 模板八：树形贡献 DP 与贪心压缩\n\n#### 适用题型\n\n- `124 二叉树中的最大路径和`：原始解法是树形 DP，递归返回单边贡献，全局答案可左右合并。\n- `55 跳跃游戏`：原始解法用 `maxlength` 压缩可达性。\n- `45 跳跃游戏 II`：原始解法用 `maxlength / end / res` 按层贪心，等价于压缩 BFS/DP 层数。\n- `42 接雨水`：原始解法使用双指针和左右最大值 `lm / rm`，区分于前后缀数组 DP。\n- `22 括号生成`：原始解法是约束回溯，已归入回溯专题，不强行放入 DP 模板。\n\n#### 核心思路\n\n这些题虽然在 topic 中含“动态规划”，但原始参考解法并不都是显式 `dp` 表。总结时应保留原始优化逻辑：树形路径用返回值表达向父节点的单边贡献；跳跃游戏只维护最远可达范围；接雨水只维护两侧目前最高柱，不再构造 `leftMax/rightMax` 数组。\n\n#### 原始解法 A：二叉树最大路径和\n\n> **题目简述：** 124 二叉树中的最大路径和：二叉树路径可从任意结点起止且不重复经过结点，求最大结点值之和。 [力扣原题 ↗](https://leetcode.cn/problems/binary-tree-maximum-path-sum/)\n\n```cpp\nclass Solution {\nprivate:\n    int maxSum = INT_MIN;\n\npublic:\n    int maxPathSum(TreeNode* root) {\n        dfs(root);\n        return maxSum;\n    }\n\n    int dfs(TreeNode* node) {\n        if (node == nullptr) return 0;\n\n        // 小于 0 的子树贡献会拖累路径，直接舍弃。\n        int leftGain = max(0, dfs(node->left));\n        int rightGain = max(0, dfs(node->right));\n\n        // 全局答案可以在当前节点左右拐弯。\n        int currentPathSum = node->val + leftGain + rightGain;\n        maxSum = max(maxSum, currentPathSum);\n\n        // 返回给父节点时只能选一侧继续向上延伸。\n        return node->val + max(leftGain, rightGain);\n    }\n};\n```\n\n#### 原始解法 B：跳跃游戏\n\n> **题目简述：** 55 跳跃游戏：数组元素表示当前位置的最大跳跃长度，判断能否到达最后一个下标。 [力扣原题 ↗](https://leetcode.cn/problems/jump-game/)\n\n```cpp\nclass Solution {\npublic:\n    bool canJump(vector\u003cint>& nums) {\n        int maxlength = 0, n = nums.size();\n        for (int i = 0; i \u003c n; i++) {\n            if (i > maxlength) return false; // 当前位置已经不可达，后面也无法继续。\n            maxlength = max(maxlength, i + nums[i]);\n            if (maxlength > n - 1) return true;\n        }\n        return true;\n    }\n};\n```\n\n#### 原始解法 C：跳跃游戏 II\n\n> **题目简述：** 45 跳跃游戏 II：数组元素表示最大跳跃长度，在保证可达末尾时求最少跳跃次数。 [力扣原题 ↗](https://leetcode.cn/problems/jump-game-ii/)\n\n```cpp\nclass Solution {\npublic:\n    int jump(vector\u003cint>& nums) {\n        int maxlength = 0, end = 0, res = 0;\n        for (int i = 0; i \u003c nums.size() - 1; i++) {\n            maxlength = max(maxlength, i + nums[i]);\n            if (i == end) {\n                // 当前这一跳覆盖的范围走完了，必须增加一次跳跃。\n                end = maxlength;\n                res++;\n            }\n        }\n        return res;\n    }\n};\n```\n\n#### 原始解法 D：接雨水\n\n> **题目简述：** 42 接雨水：给定各柱子的高度，计算下雨后这些柱子之间能够接住的雨水总量。 [力扣原题 ↗](https://leetcode.cn/problems/trapping-rain-water/)\n\n```cpp\nclass Solution {\npublic:\n    int trap(vector\u003cint>& height) {\n        int res = 0;\n        int lm = 0, rm = 0;\n        int l = 0, r = height.size() - 1;\n\n        while (l \u003c r) {\n            lm = max(lm, height[l]);\n            rm = max(rm, height[r]);\n\n            if (lm \u003c rm) {\n                // 左侧最高更低，当前位置能接多少水已经由 lm 决定。\n                res += lm - height[l];\n                l++;\n            } else {\n                // 右侧最高更低或相等，当前位置能接多少水由 rm 决定。\n                res += rm - height[r];\n                r--;\n            }\n        }\n        return res;\n    }\n};\n```\n\n#### 易错点\n\n- `124` 的全局答案可以左右合并，但递归返回给父节点时只能返回一条单边路径。\n- `55` 一旦 `i > maxlength` 就说明中间断档，不能继续尝试后面的下标。\n- `45` 遍历到 `nums.size() - 1` 前一位即可，否则到终点还会多计一次跳跃。\n- `42` 的 `lm/rm` 要先更新再结算当前位置，结算后再移动对应指针。\n\n## 6. 高频易错点清单\n\n| 易错点 | 典型题目 | 规避方式 |\n|---|---|---|\n| 状态定义没有“以 i 结尾” | `53`、`152` | 连续子数组题默认定义结尾状态 |\n| 二维 DP 下标错位 | `72`、`1143` | `dp[i][j]` 对应前 i 和前 j，字符用 `i - 1` |\n| 第一行第一列初始化遗漏 | `62`、`64`、`72` | 初始化写在主循环之前 |\n| 回文区间遍历顺序错误 | `5`、`131` | 按长度从短到长枚举 |\n| 背包循环方向写反 | `322`、`416` | 完全背包正序，01 背包倒序 |\n| 最小值 DP 没用 INF | `322`、`279` | 不可达状态不能初始化为 0 |\n| 乘积最大子数组只维护最大值 | `152` | 负数会让最大最小互换，必须双状态 |\n| 单词拆分重复构造过多子串 | `139` | 可按最大单词长度剪枝，或用 Trie 优化 |\n| LIS 二分边界混淆 | `300` | 严格递增用 `lower_bound` 替换第一个大于等于 |\n| 树形 DP 返回值和答案混淆 | `124` | 全局答案可左右合并，返回值只能单边延伸 |\n\n## 7. 最短复盘口诀\n\nDP 题先写状态语义，再写初始化和遍历顺序。连续子数组看“以 i 结尾”，双字符串看“前 i 和前 j”，网格看上方左方，回文看两端和内部，背包先分 01 与完全。能滚动再滚动，能贪心前先证明依赖被压缩。`70` 是线性母题，`64` 是网格母题，`72/1143` 是双串母题，`322/416` 是背包母题，`300` 是优化母题。\n\n\n\n================================================================================\n\n# 第15部分: 技巧\n\n================================================================================\n\n> 目标：本文把 Hot100 中依赖“关键观察”的题目抽象成若干可复用小模型。复习时不要死背结论，而要识别题目为什么能用进位、翻转、异或、投票、快慢指针、原地哈希或数学 DP。\n\n## 1. 技巧题的底层模型\n\n技巧题通常由某个约束触发特殊解法。每道技巧题先问六个问题：\n\n| 问题 | 如果答案是“是” | 常用处理 |\n|---|---|---|\n| 是否逐位处理并带状态 | 两数相加 | carry 进位、dummy 尾插 |\n| 是否要求原地重排数组 | 下一个排列、轮转数组、旋转图像 | 后缀性质、三次翻转、转置翻转 |\n| 是否只有一个元素出现奇数次 | 只出现一次的数字 | 异或抵消 |\n| 是否有超过一半的多数 | 多数元素 | 摩尔投票 |\n| 是否能把数组看成链表或映射 | 寻找重复数 | 快慢指针找环入口、值域二分 |\n| 是否有数学递推或状态压缩 | 爬楼梯、不同路径、完全平方数 | Fibonacci、组合数、DP/BFS |\n\n技巧题常见的小模型如下：\n\n| 小模型 | 代表题 | 关键观察 |\n|---|---|---|\n| 进位模拟 | `2 两数相加` | 两条链表逐位相加，carry 进入下一位 |\n| 后缀重排 | `31 下一个排列` | 从右找第一个下降点，再换更大数并反转后缀 |\n| 原地哈希 | `41 缺失的第一个正数` 相邻技巧题 | 值 `x` 应放到下标 `x - 1` |\n| 数组翻转 | `189 轮转数组`、`48 旋转图像` | 通过局部翻转实现整体移动 |\n| 异或抵消 | `136 只出现一次的数字` | `a ^ a = 0`，`a ^ 0 = a` |\n| 摩尔投票 | `169 多数元素` | 多数元素和非多数元素两两抵消后仍剩下 |\n| 函数图找环 | `287 寻找重复数` | 下标到值形成链，重复数是环入口 |\n| 数学 DP | `70 爬楼梯`、`62 不同路径`、`279 完全平方数` | 状态定义比公式更重要 |\n\n## 2. Hot100 技巧题型地图\n\n\n| 题型 | 题目 | 抽象能力 | 一句话记忆 |\n|---|---|---|---|\n| 进位模拟 | `2 两数相加` | 同步推进两条链表并维护 carry | 循环条件是 `l1 || l2 || carry` |\n| 后缀排列 | `31 下一个排列` | 从右找可增大的最低位 | 找下降点，换稍大的，后缀升序化 |\n| 矩阵旋转技巧 | `48 旋转图像` | 转置加水平翻转 | 90 度旋转可以拆成两个简单变换 |\n| 路径计数技巧 | `62 不同路径` | 组合数或滚动 DP | 向右和向下的排列总数 |\n| Fibonacci DP | `70 爬楼梯` | 状态压缩递推 | 到第 n 阶来自 n-1 和 n-2 |\n| 异或抵消 | `136 只出现一次的数字` | 位运算消除成对元素 | 全部异或后只剩孤立元素 |\n| 数组轮转 | `189 轮转数组` | 三次反转或环状替换 | 先整体反转，再分别反转两段 |\n| 平方数分解 | `279 完全平方数` | 完全背包 DP 或 BFS 层数 | 每个平方数可以重复使用 |\n| 重复数建模 | `287 寻找重复数` | 函数图找环入口或值域二分 | 数组值当 next 指针，重复数就是环入口 |\n| 投票抵消 | 相邻题 `169 多数元素` | 多数元素与其他元素抵消 | 票数归零就换候选 |\n\n## 3. 复习顺序建议\n\n建议按“模拟 → 原地变换 → 位运算/投票 → 数学 DP → 函数图”的顺序复习：\n\n1. `2 两数相加`：练进位模拟和 dummy 尾插。\n2. `31 下一个排列`：理解后缀降序和下一个字典序。\n3. `189 轮转数组`：掌握三次反转。\n4. `48 旋转图像`：把二维旋转拆成转置和翻转。\n5. `136 只出现一次的数字`：掌握异或抵消。\n6. `169 多数元素`：补充摩尔投票技巧。\n7. `70 爬楼梯`：练 Fibonacci 状态压缩。\n8. `62 不同路径`：对比组合数学和滚动 DP。\n9. `279 完全平方数`：理解完全背包和 BFS 层数。\n10. `287 寻找重复数`：掌握函数图找环入口和二分值域两种技巧。\n\n## 4. 关键套路详解\n\n### 4.1 模拟题要把循环条件写全\n\n`2 两数相加`需要考虑最后仍有进位。最稳的循环条件是：\n\n```text\nwhile (l1 || l2 || carry)\n```\n\n每轮从两个链表取当前位，没有节点就当 0，再加上 `carry`。结果位是 `sum % 10`，下一轮进位是 `sum / 10`。\n\n### 4.2 下一个排列的关键在“后缀已经最大”\n\n从右往左找第一个 `nums[i] \u003c nums[i + 1]`，说明 `i + 1` 到末尾是非递增后缀，已经是这段后缀能形成的最大排列。要得到刚好更大的排列，需要把 `nums[i]` 换成后缀中比它大的最小元素，然后把后缀反转成升序。\n\n如果找不到下降点，整个数组是最大排列，直接反转成最小排列。\n\n### 4.3 原地翻转类题要先想“最终块顺序”\n\n`189 轮转数组`右移 k 位后，后 k 个元素要跑到前面。三次反转的本质是改变块顺序：整体反转让后半块到前面，但块内部也反了；再分别反转两块恢复内部顺序。\n\n`48 旋转图像`原始笔记先写四点轮换，关键是不重不漏地枚举左上角四分之一；进阶写法可以拆成主对角线转置和每行反转，更容易检查。\n\n### 4.4 异或适合“成对抵消”\n\n`136` 成立依赖三个性质：`x ^ x = 0`，`x ^ 0 = x`，异或满足交换律和结合律。因此所有出现两次的数会抵消，最后剩下只出现一次的数。\n\n如果有两个数只出现一次，需要先用整体异或结果中的某个 1 位把数组分成两组；如果其他数出现三次，则要用按位计数取模 3，简单异或无法处理。\n\n### 4.5 摩尔投票的本质是抵消\n\n`169` 的多数元素超过一半，所以把一个多数元素和一个非多数元素配对删除，多数元素仍然存在。候选值 `candidate` 表示当前抵消后的可能多数，`votes` 表示净票数。票数归零时，之前那段已经完全抵消，下一位可以作为新候选。\n\n如果题目不保证多数元素存在，投票后还需要再遍历验证次数。\n\n### 4.6 重复数可以建模成函数图\n\n`287` 中数组长度是 `n + 1`，值域是 `[1, n]`。把每个下标 `i` 看成节点，边是 `i -> nums[i]`。因为值域有限且有重复，必然形成环，重复数就是环入口。\n\n这和链表环入口完全同构：快慢指针第一次相遇后，一个指针回到起点，两个指针同步走，第二次相遇就是入口。\n\n### 4.7 数学 DP 题先定义状态，再考虑公式\n\n`70` 是 `dp[i] = dp[i - 1] + dp[i - 2]`，可以压缩成两个变量。`62` 是二维路径计数，也可以压缩成一维。`279` 是完全平方数，每个平方数可以重复使用，因此内层从小到大枚举容量。\n\n不要把这些题只当公式题。公式忘了时，状态定义能把递推重新推出来。\n\n## 5. 抽象代码模板\n\n下面模板以原始单题笔记的参考解法为主，再把同一技巧下的小变形放进“变形点对照”。复习时重点看“为什么这个约束触发了特殊做法”；如果某段代码是 Hot100 原题之外的扩展，会在标题或表格中明确标注。\n\n### 5.1 逐位进位模拟\n\n#### 适用题型\n\n- `2 两数相加`：链表逆序存储数字。\n- 字符串或数组表示的大整数加法。\n- 任意需要把低位结果和进位传递到下一位的模拟题。\n\n#### 核心思路\n\n每轮取两个当前位置的数字和上一轮 `carry`，当前位写入 `sum % base`，下一轮进位变成 `sum / base`。循环条件必须包含 `carry`，因为两个输入都走完后仍可能多出最高位。\n\ndummy 节点用于统一处理结果链表头，避免第一位单独分支。\n\n#### 代码模板\n\n> **题目简述：** 2 两数相加：两个非空链表以逆序数字表示非负整数，求其和并以同样形式返回。 [力扣原题 ↗](https://leetcode.cn/problems/add-two-numbers/)\n\n```cpp\n#include \u003cbits/stdc++.h>\nusing namespace std;\n\nstruct ListNode {\n    int val;\n    ListNode* next;\n    ListNode() : val(0), next(nullptr) {}\n    ListNode(int x) : val(x), next(nullptr) {}\n    ListNode(int x, ListNode* next) : val(x), next(next) {}\n};\n\nListNode* addWithCarryTemplate(ListNode* a, ListNode* b) {\n    ListNode dummy(-1);\n    ListNode* tail = &dummy;\n    int carry = 0;\n\n    while (a || b || carry) {\n        int sum = carry;\n        if (a) {\n            sum += a->val;\n            a = a->next;\n        }\n        if (b) {\n            sum += b->val;\n            b = b->next;\n        }\n\n        carry = sum / 10;\n        tail->next = new ListNode(sum % 10);\n        tail = tail->next;\n    }\n\n    return dummy.next;\n}\n```\n\n#### 易错点\n\n- 循环条件漏掉 `carry` 会丢失最后进位。\n- 输入正序存储时不能直接套逆序模板，需要反转链表或用栈。\n- base 不一定是 10，二进制、任意进制题要替换取模和除法基数。\n\n### 5.2 后缀重排下一个排列\n\n#### 适用题型\n\n- `31 下一个排列`。\n- 字典序的下一个状态。\n- 需要原地把当前排列变成“刚好更大”的排列题。\n\n#### 核心思路\n\n从右往左找第一个 `nums[i] \u003c nums[i + 1]`，它左侧保持不变，右侧后缀已经是非递增，也就是该后缀能形成的最大排列。要让整体刚好变大，需要把 `nums[i]` 换成后缀中比它大的最小元素；交换后再反转后缀，让后缀变成最小升序。\n\n如果找不到下降点，说明整个排列已经最大，整体反转即可回到最小排列。\n\n#### 代码模板\n\n> **题目简述：** 31 下一个排列：原地生成当前整数排列的字典序下一个排列；若不存在则变为最小排列。 [力扣原题 ↗](https://leetcode.cn/problems/next-permutation/)\n\n```cpp\nvoid nextPermutationTemplate(vector\u003cint>& nums) {\n    int n = nums.size();\n    if (n \u003c= 1) return; // 原始笔记保留这个边界，避免 n-2 在空/单元素时产生无意义下标。\n\n    int i = n - 2;\n\n    while (i >= 0 && nums[i] >= nums[i + 1]) {\n        i--;\n    }\n\n    if (i >= 0) {\n        int j = n - 1;\n        while (nums[j] \u003c= nums[i]) {\n            j--;\n        }\n        swap(nums[i], nums[j]);\n    }\n\n    reverse(nums.begin() + i + 1, nums.end());\n}\n```\n\n#### 易错点\n\n- 必须从右往左找下降点，从左找会破坏“刚好更大”。\n- 交换后后缀要反转；原后缀本来就是非递增，反转即可得到升序。\n- 有重复元素时，找交换对象要用 `>`，不能用 `>=`。\n\n### 5.3 原地翻转与矩阵变换\n\n#### 适用题型\n\n- `189 轮转数组`：三次反转实现右轮转。\n- `48 旋转图像`：原始笔记先写四点轮换，再补充“转置 + 行翻转”。\n- 要求原地改变顺序、不能额外开大数组的题。\n\n#### 核心思路\n\n数组右轮转 `k` 位后，后 `k` 个元素整体跑到前面。整体反转会改变块顺序，但块内部也被反转；再分别反转前 `k` 个和后 `n-k` 个元素，就能恢复块内部顺序。\n\n矩阵顺时针旋转 90 度有两种原地写法：原始主解是四点轮换，只枚举左上角四分之一，避免重复旋转；进阶写法是先沿主对角线转置，再反转每一行。两者都满足 O(1) 额外空间。\n\n#### 代码 A：`189` 数组轮转，三次反转\n\n> **题目简述：** 189 轮转数组：给定整数数组和非负整数 K，将数组原地向右轮转 K 个位置。 [力扣原题 ↗](https://leetcode.cn/problems/rotate-array/)\n\n```cpp\nvoid reverseRange(vector\u003cint>& nums, int left, int right) {\n    // 原始笔记提醒：既然目标是 O(1) 空间，手写反转函数应直接原地修改，不需要返回 vector。\n    while (left \u003c right) {\n        swap(nums[left], nums[right]);\n        left++;\n        right--;\n    }\n}\n\nvoid rotateArrayByReverseTemplate(vector\u003cint>& nums, int k) {\n    int n = nums.size();\n    if (n == 0) return;\n\n    k %= n;\n    reverseRange(nums, 0, n - 1);\n    reverseRange(nums, 0, k - 1);\n    reverseRange(nums, k, n - 1);\n}\n```\n\n#### 代码 B：`48` 矩阵旋转，四点轮换原始写法\n\n> **题目简述：** 48 旋转图像：给定 N×N 方阵，将图像原地顺时针旋转九十度。 [力扣原题 ↗](https://leetcode.cn/problems/rotate-image/)\n\n```cpp\nvoid rotateMatrixByFourSwapTemplate(vector\u003cvector\u003cint>>& matrix) {\n    int n = matrix.size();\n    if (n \u003c= 1) return;\n\n    // i 枚举上半部分行，j 枚举左半部分列；(n + 1) / 2 处理奇数阶中心列。\n    for (int i = 0; i \u003c n / 2; i++) {\n        for (int j = 0; j \u003c (n + 1) / 2; j++) {\n            // 四个位置依次是：左上 -> 右上 -> 右下 -> 左下。\n            // 用三次 swap 完成顺时针轮换，避免额外矩阵空间。\n            swap(matrix[i][j], matrix[j][n - 1 - i]);\n            swap(matrix[n - 1 - i][n - 1 - j], matrix[n - 1 - j][i]);\n            swap(matrix[n - 1 - i][n - 1 - j], matrix[i][j]);\n        }\n    }\n}\n```\n\n#### 代码 C：`48` 矩阵旋转，转置 + 行翻转进阶写法\n\n> **题目简述：** 48 旋转图像：给定 N×N 方阵，将图像原地顺时针旋转九十度。 [力扣原题 ↗](https://leetcode.cn/problems/rotate-image/)\n\n```cpp\nvoid rotateMatrixByTransformTemplate(vector\u003cvector\u003cint>>& matrix) {\n    int n = matrix.size();\n    if (n \u003c= 1) return;\n\n    for (int r = 0; r \u003c n; r++) {\n        for (int c = r + 1; c \u003c n; c++) {\n            swap(matrix[r][c], matrix[c][r]);\n        }\n    }\n\n    for (auto& row : matrix) {\n        reverse(row.begin(), row.end());\n    }\n}\n```\n\n#### 变形点对照\n\n| 题目/写法 | 原地操作 | 边界控制 | 关键风险 |\n|---|---|---|---|\n| `189` 三次反转 | 整体反转、前 `k` 反转、后段反转 | `k %= n`，`n == 0` 直接返回 | helper 不应返回新数组 |\n| `48` 四点轮换 | 每次同时轮换四个角 | `i \u003c n/2`，`j \u003c (n+1)/2` | 枚举范围不对会重转或漏转 |\n| `48` 转置翻转 | 主对角线转置 + 每行 reverse | 只交换 `c > r` | 转置交换两次等于没换 |\n\n#### 易错点\n\n- `k` 必须先对 `n` 取模，否则 `begin() + k` 或手写区间可能越界。\n- 四点轮换必须选对左上角四分之一，不能把所有格子都轮一遍。\n- 矩阵转置只交换 `c > r` 的位置，否则会换两次等于没换。\n- 逆时针旋转的翻转方向不同，不能直接套顺时针模板。\n\n### 5.4 异或抵消与位计数变体\n\n#### 适用题型\n\n- `136 只出现一次的数字`：其他数字都出现两次，这是原始 Hot100 笔记主解。\n- 两个数字各出现一次、其余数字出现两次的变体。\n- 其他数字出现三次、只有一个数字出现一次的按位计数扩展。\n\n#### 核心思路\n\n`136` 的原始解法只需要整体异或：`x ^ x = 0`，`x ^ 0 = x`，且异或满足交换律和结合律，所以所有成对数字会抵消，只剩唯一数字。\n\n后两个写法作为同一位运算模型的扩展：两个异常值时，用 `a ^ b` 中任意一个为 1 的位分组；其他数出现三次时，用每一位出现次数对 3 取模恢复答案。\n\n#### 代码 A：`136` 一个数出现一次，原始写法\n\n> **题目简述：** 136 只出现一次的数字：非空数组中除一个元素出现一次外其余均出现两次，找出该唯一元素。 [力扣原题 ↗](https://leetcode.cn/problems/single-number/)\n\n```cpp\nint singleNumberByXorTemplate(const vector\u003cint>& nums) {\n    int ans = 0;\n    for (int x : nums) {\n        ans ^= x; // 相同数字异或后抵消为 0。\n    }\n    return ans;\n}\n```\n\n#### 代码 B：两个数出现一次，扩展写法\n\n> **题目简述：** 260 只出现一次的数字 III：恰有两个元素出现一次，其余均出现两次，返回这两个只出现一次的元素。 [力扣原题 ↗](https://leetcode.cn/problems/single-number-iii/)\n\n```cpp\npair\u003cint, int> twoSingleNumbersByXorTemplate(const vector\u003cint>& nums) {\n    int xorAll = 0;\n    for (int x : nums) {\n        xorAll ^= x;\n    }\n\n    // xorAll = a ^ b。取其中一个为 1 的位，说明 a、b 在这一位不同。\n    // 转成 unsigned 可避免 xorAll 为 INT_MIN 时对 signed 取负的边界风险。\n    unsigned ux = static_cast\u003cunsigned>(xorAll);\n    unsigned lowbit = ux & (~ux + 1u);\n\n    int a = 0;\n    int b = 0;\n    for (int x : nums) {\n        if ((static_cast\u003cunsigned>(x) & lowbit) != 0) {\n            a ^= x;\n        } else {\n            b ^= x;\n        }\n    }\n\n    return {a, b};\n}\n```\n\n#### 代码 C：其他数出现三次，扩展写法\n\n> **题目简述：** 137 只出现一次的数字 II：一个元素出现一次，其余元素均出现三次，返回只出现一次的元素。 [力扣原题 ↗](https://leetcode.cn/problems/single-number-ii/)\n\n```cpp\nint singleNumberWhenOthersAppearThreeTimesTemplate(const vector\u003cint>& nums) {\n    unsigned ans = 0;\n\n    for (int bit = 0; bit \u003c 32; bit++) {\n        int count = 0;\n        for (int x : nums) {\n            count += (static_cast\u003cunsigned>(x) >> bit) & 1u;\n        }\n\n        if (count % 3 != 0) {\n            // 用 1u \u003c\u003c bit，避免 1 \u003c\u003c 31 触碰 signed int 符号位的未定义/实现相关风险。\n            ans |= (1u \u003c\u003c bit);\n        }\n    }\n\n    return static_cast\u003cint>(ans);\n}\n```\n\n#### 变形点对照\n\n| 模型 | 触发条件 | 是否原始 Hot100 主解 | 关键动作 |\n|---|---|---|---|\n| 整体异或 | 只有一个数出现一次，其余都出现两次 | 是，`136` 原始解法 | 全部 `ans ^= x` |\n| lowbit 分组 | 两个数出现一次，其余都出现两次 | 否，位运算扩展 | 用 `a ^ b` 的最低 1 位分组 |\n| 按位计数 | 其他数出现三次 | 否，位运算扩展 | 每位计数 `% 3` 后恢复答案 |\n\n#### 易错点\n\n- 只有“其他数出现两次”才能直接整体异或。\n- `lowbit` 分组依赖两个异常值在该位不同，不能随便选位。\n- 位计数扩展处理第 31 位时用 `unsigned` 更稳，避免 `1 \u003c\u003c 31` 的 signed 边界问题。\n\n### 5.5 摩尔投票与 n/3 双候选\n\n#### 适用题型\n\n- `169 多数元素`：存在出现次数超过 `n / 2` 的元素。\n- 出现次数超过 `n / 3` 的所有元素。\n- 所有“超过某个比例的元素数量有限，可以用抵消找候选”的题。\n\n#### 核心思路\n\n摩尔投票的本质是抵消。超过一半的元素和其他元素两两抵消后一定仍有剩余。`votes == 0` 时说明当前片段已经抵消完，可以从下一个元素开始选择新候选。\n\n超过 `n / 3` 的元素最多两个，因此维护两个候选和两个票数。第一遍只找候选，第二遍必须验证，因为投票过程只能保证可能性，不能保证候选一定合法。\n\n#### 代码 A：超过 n/2\n\n> **题目简述：** 169 多数元素：给定长度为 N 的数组，找出出现次数严格超过 N/2 且保证存在的元素。 [力扣原题 ↗](https://leetcode.cn/problems/majority-element/)\n\n```cpp\nint majorityVoteTemplate(const vector\u003cint>& nums) {\n    int candidate = 0;\n    int votes = 0;\n\n    for (int x : nums) {\n        if (votes == 0) {\n            candidate = x;\n            votes = 1;\n        } else if (x == candidate) {\n            votes++;\n        } else {\n            votes--;\n        }\n    }\n\n    return candidate;\n}\n```\n\n#### 代码 B：超过 n/3 双候选\n\n> **题目简述：** 229 多数元素 II：给定整数数组，返回所有出现次数超过 floor(N/3) 的元素。 [力扣原题 ↗](https://leetcode.cn/problems/majority-element-ii/)\n\n```cpp\nvector\u003cint> majorityVoteN3Template(const vector\u003cint>& nums) {\n    int candidate1 = 0;\n    int candidate2 = 1; // 初始化成不同值，避免空票阶段误判相同候选。\n    int vote1 = 0;\n    int vote2 = 0;\n\n    for (int x : nums) {\n        if (x == candidate1) {\n            vote1++;\n        } else if (x == candidate2) {\n            vote2++;\n        } else if (vote1 == 0) {\n            candidate1 = x;\n            vote1 = 1;\n        } else if (vote2 == 0) {\n            candidate2 = x;\n            vote2 = 1;\n        } else {\n            vote1--;\n            vote2--;\n        }\n    }\n\n    int count1 = 0;\n    int count2 = 0;\n    for (int x : nums) {\n        if (x == candidate1) {\n            count1++;\n        } else if (x == candidate2) {\n            count2++;\n        }\n    }\n\n    vector\u003cint> ans;\n    int n = nums.size();\n    if (count1 > n / 3) {\n        ans.push_back(candidate1);\n    }\n    if (count2 > n / 3) {\n        ans.push_back(candidate2);\n    }\n    return ans;\n}\n```\n\n#### 易错点\n\n- 投票得到的是候选；如果题目不保证答案存在，必须二次计数验证。\n- `n/3` 版本判断顺序很重要：先匹配已有候选，再看空票位。\n- 两个候选不能相同，否则会重复计票和重复输出。\n\n### 5.6 Floyd 函数图判环\n\n#### 适用题型\n\n- `287 寻找重复数`：数组值域构成 `i -> nums[i]` 的函数图。\n- 链表环入口问题。\n- 不能修改数组、只能用 `O(1)` 额外空间寻找重复入口的题。\n\n#### 核心思路\n\n把下标看作节点，`nums[i]` 看作下一条边。由于长度是 `n + 1`、值域是 `[1, n]`，从 0 出发一定会进入环，重复数就是环入口。\n\n原始笔记采用和环形链表 II 一致的初始化：`slow = fast = 0`，第一阶段先各自走一步再判断相遇；第二阶段再让 `head = 0` 与相遇点同步走，最终相遇位置就是入口。Floyd 初始化方式可以有多种，但第一阶段起点和第二阶段起点必须配套，不能混着写。\n\n#### 代码模板\n\n> **题目简述：** 287 寻找重复数：长度 N+1 的数组仅含 1 至 N，找出重复数且不能修改数组、额外空间为常数。 [力扣原题 ↗](https://leetcode.cn/problems/find-the-duplicate-number/)\n\n```cpp\nint findDuplicateByFloydTemplate(const vector\u003cint>& nums) {\n    int slow = 0;\n    int fast = 0;\n\n    // 原始写法是 do-while 语义：先沿函数图走，再判断是否相遇。\n    while (true) {\n        slow = nums[slow];       // 等价于 slow = slow.next\n        fast = nums[nums[fast]]; // 等价于 fast = fast.next.next\n        if (fast == slow) {\n            break;\n        }\n    }\n\n    int head = 0;\n    while (slow != head) {\n        slow = nums[slow];\n        head = nums[head];\n    }\n\n    return slow; // 入环口即重复元素。\n}\n```\n\n#### 变形点对照\n\n| 场景 | 第一阶段初始化 | 第二阶段初始化 | 注意事项 |\n|---|---|---|---|\n| `287` 原始写法 | `slow = fast = 0`，循环内先走 | `head = 0`，`slow` 留在相遇点 | 与链表环入口写法一致 |\n| 预走一步写法 | `slow = nums[0]`，`fast = nums[nums[0]]` | 通常仍需从 `0` 配套推导 | 不要把两种初始化随意混合 |\n| 链表环入口 | `slow/fast = head` | 新指针回 `head` | 节点指针和数组下标语义对应 |\n\n#### 易错点\n\n- 该模板依赖值域 `[1, n]`，否则 `nums[nums[fast]]` 可能越界。\n- 第二阶段起点必须和第一阶段初始化配套；不要一会儿从 `nums[0]`，一会儿从 `0`。\n- Floyd 找的是重复值对应的环入口，不会告诉你重复出现了几次。\n\n### 5.7 原地标记与原地哈希\n\n#### 适用题型\n\n- `41 缺失的第一个正数` 一类原地哈希题。\n- 数组长度为 `n`，目标值域也与 `[1, n]` 强相关的题。\n- 允许修改数组、要求 `O(1)` 额外空间的存在性或缺失值问题。\n\n#### 核心思路\n\n原地哈希的核心是“值 `x` 应该放到下标 `x - 1`”。遍历数组时，只要 `nums[i]` 在 `[1, n]` 内，并且它还没待在正确位置，就不断交换到目标下标。整理完后，第一个 `nums[i] != i + 1` 的位置就是缺失的最小正数。\n\n注意原始单题笔记代码里边界写成了 `nums[i] \u003c n`，这会漏掉数字 `n` 应该放到下标 `n - 1` 的情况；专题模板保留原始“原地哈希”思路，但把边界修正为 `nums[i] \u003c= n`。\n\n原地标记也常用“把出现过的值对应位置改成负数”表示访问，但要先清理无关值，并小心重复标记。\n\n#### 代码 A：交换式原地哈希\n\n> **题目简述：** 41 缺失的第一个正数：给定无序整数数组，以线性时间和常数额外空间找出最小缺失正整数。 [力扣原题 ↗](https://leetcode.cn/problems/first-missing-positive/)\n\n```cpp\nint firstMissingPositiveByPlacementTemplate(vector\u003cint>& nums) {\n    int n = nums.size();\n\n    for (int i = 0; i \u003c n; i++) {\n        while (nums[i] >= 1 && nums[i] \u003c= n && nums[nums[i] - 1] != nums[i]) {\n            int target = nums[i] - 1;\n            swap(nums[i], nums[target]);\n        }\n    }\n\n    for (int i = 0; i \u003c n; i++) {\n        if (nums[i] != i + 1) {\n            return i + 1;\n        }\n    }\n    return n + 1;\n}\n```\n\n#### 代码 B：负号原地标记\n\n> **题目简述：** 41 缺失的第一个正数：给定无序整数数组，以线性时间和常数额外空间找出最小缺失正整数。 [力扣原题 ↗](https://leetcode.cn/problems/first-missing-positive/)\n\n```cpp\nint firstMissingPositiveBySignMarkTemplate(vector\u003cint>& nums) {\n    int n = nums.size();\n\n    // 非 [1, n] 的值不会影响答案，先改成哨兵 n + 1。\n    for (int& x : nums) {\n        if (x \u003c= 0 || x > n) {\n            x = n + 1;\n        }\n    }\n\n    for (int x : nums) {\n        int val = abs(x);\n        if (val >= 1 && val \u003c= n) {\n            nums[val - 1] = -abs(nums[val - 1]);\n        }\n    }\n\n    for (int i = 0; i \u003c n; i++) {\n        if (nums[i] > 0) {\n            return i + 1;\n        }\n    }\n    return n + 1;\n}\n```\n\n#### 易错点\n\n- 交换式原地哈希必须用 `while`，一次交换后当前位置可能还是错的。\n- 合法值边界应是 `1 \u003c= nums[i] \u003c= n`；写成 `\u003c n` 会漏掉数字 `n`。\n- 条件中必须判断目标位置是否已有相同值，否则重复数字会导致死循环。\n- 负号标记前要清理无关值，标记时要用 `abs` 避免重复标记影响下标。\n\n### 5.8 数学 DP 状态压缩\n\n#### 适用题型\n\n- `70 爬楼梯`：Fibonacci 型递推。\n- `62 不同路径`：网格路径计数。\n- `279 完全平方数`：完全背包最少数量。\n\n#### 核心思路\n\n技巧题里的数学 DP 不要只背公式，而要先定义状态。`70` 的状态只依赖前两项，可以压缩成两个变量；`62` 的 `dp[c]` 表示当前行第 `c` 列路径数，滚动更新即可；`279` 是完全背包，每个平方数可以重复使用，所以容量从小到大枚举。\n\n#### 代码 A：Fibonacci 状态压缩\n\n> **题目简述：** 70 爬楼梯：每次可爬一阶或两阶，给定总阶数 N，求到达楼顶的不同方式数。 [力扣原题 ↗](https://leetcode.cn/problems/climbing-stairs/)\n\n```cpp\nint climbStairsFibonacciTemplate(int n) {\n    if (n \u003c= 2) {\n        return n;\n    }\n\n    int prev2 = 1;\n    int prev1 = 2;\n    for (int i = 3; i \u003c= n; i++) {\n        int cur = prev1 + prev2;\n        prev2 = prev1;\n        prev1 = cur;\n    }\n    return prev1;\n}\n```\n\n#### 代码 B：网格路径滚动 DP\n\n> **题目简述：** 62 不同路径：机器人位于网格左上角且只能向右或向下，求到右下角的不同路径数。 [力扣原题 ↗](https://leetcode.cn/problems/unique-paths/)\n\n```cpp\nint uniquePathsRollingDpTemplate(int m, int n) {\n    vector\u003cint> dp(n, 1);\n\n    for (int r = 1; r \u003c m; r++) {\n        for (int c = 1; c \u003c n; c++) {\n            dp[c] += dp[c - 1];\n        }\n    }\n\n    return dp[n - 1];\n}\n```\n\n#### 代码 C：完全平方数完全背包\n\n> **题目简述：** 279 完全平方数：给定正整数 N，求和为 N 所需的完全平方数的最少数量。 [力扣原题 ↗](https://leetcode.cn/problems/perfect-squares/)\n\n```cpp\nint perfectSquaresDpTemplate(int n) {\n    // 原始笔记使用 n + 1 作为哨兵：最差全用 1，也只需要 n 个数，所以 n + 1 一定足够大。\n    vector\u003cint> dp(n + 1, n + 1);\n    dp[0] = 0;\n\n    // 外层枚举物品：每个完全平方数都可以重复使用。\n    for (int x = 1; x * x \u003c= n; x++) {\n        int square = x * x;\n\n        // 完全背包正序枚举容量，允许同一个 square 在本轮被重复使用。\n        for (int sum = square; sum \u003c= n; sum++) {\n            dp[sum] = min(dp[sum], dp[sum - square] + 1);\n        }\n    }\n\n    return dp[n];\n}\n```\n\n#### 易错点\n\n- `70` 中 `n = 1` 和 `n = 2` 的初值要和题目定义一致。\n- `62` 的一维 DP 从左到右更新，因为当前值旧状态代表上方，新左值代表左方。\n- `279` 是可重复使用平方数，内层容量必须正序；若每个数只能用一次才倒序。\n\n## 6. 高频易错点清单\n\n| 易错点 | 典型题目 | 规避方式 |\n|---|---|---|\n| 两数相加漏掉最后进位 | `2` | 循环条件写 `l1 || l2 || carry` |\n| 链表结果头处理复杂 | `2` | 使用 `dummy + cur` 尾插 |\n| 下一个排列忽略短数组边界 | `31` | 先处理 `if (n \u003c= 1) return` |\n| 下一个排列从左找下降点 | `31` | 必须从右往左找第一个 `nums[i] \u003c nums[i+1]` |\n| 交换后没有反转后缀 | `31` | 后缀要变成最小升序排列 |\n| 数组轮转 k 没取模 | `189` | 先 `k %= n`；手写反转 helper 应返回 `void` |\n| 旋转矩阵枚举范围重复 | `48` 四点轮换 | 只枚举左上角四分之一：`i \u003c n/2`、`j \u003c (n+1)/2` |\n| 旋转矩阵转置交换两次 | `48` 转置翻转 | 只交换 `c > r` 的位置 |\n| 异或用于错误出现次数模型 | `136` | 只有成对抵消时直接异或；位计数变体要标为扩展 |\n| 位计数写 `1 \u003c\u003c 31` | 位运算扩展 | 用 `1u \u003c\u003c bit` 和 `unsigned` 处理符号位 |\n| 摩尔投票误当计数器 | `169` | 它只找候选，不保证无条件合法 |\n| 重复数快慢指针起点混乱 | `287` | 使用原始 `slow = fast = 0` 配套 `head = 0`，不要混用初始化 |\n| 原地哈希合法边界写窄 | `41` | 条件应包含 `nums[i] \u003c= n`，数字 `n` 要放到下标 `n-1` |\n| 完全平方数内层方向写反 | `279` | 可重复使用，内层从小到大；哨兵用原始笔记的 `n + 1` |\n| 不同路径把二维边界写复杂 | `62` | 一维 `dp` 初始化为 1 即覆盖第一行第一列 |\n\n## 7. 最短复盘口诀\n\n技巧题先找触发条件：逐位相加看 `carry`，下个排列看右侧后缀，数组轮转三次反转，矩阵旋转优先记原始四点轮换、再记转置加行翻转；成对抵消用异或，位计数变体要标清扩展；多数抵消用投票；重复数按原始 `slow = fast = 0` 找函数图入口；原地哈希边界包含 `n`；爬楼梯是 Fibonacci，不同路径看上左转移，完全平方数是可重复选择的完全背包。\n\n================================================================================\n\n# 第16部分: 排序\n\n================================================================================\n\n> 目标：本文把 Hot100 中“排序作为预处理、排序作为结构、排序作为选择工具”的题目抽象成若干可复用模板。复习时先判断排序带来了什么单调性，再决定用双指针、区间扫描、三路划分、归并、堆或桶。\n\n## 1. 排序题的底层模型\n\nHot100 里的排序重点在于“排序以后问题结构发生了什么变化”。每道排序题先问五个问题：\n\n| 问题 | 如果答案是“是” | 常用处理 |\n|---|---|---|\n| 排序后相同元素会聚在一起吗 | 字母异位词、频次统计、颜色分类 | 排序 key、分组、三路划分 |\n| 排序后可以双指针收缩吗 | 三数之和、合并区间 | 固定一个点，左右指针或线性扫描 |\n| 排序后区间关系更清楚吗 | 合并区间 | 按左端点排序，维护当前合并区间 |\n| 只需要第 K 个或前 K 个吗 | 数组第 K 大、前 K 高频 | 快速选择、堆、桶 |\n| 数据是链表或数据流吗 | 排序链表、数据流中位数 | 归并排序、双堆维护有序分割 |\n\n排序题常见抽象能力如下：\n\n| 能力 | 代表题 | 排序带来的变化 |\n|---|---|---|\n| 去重与相邻比较 | `49 字母异位词分组`、`169 多数元素` | 相同特征聚集 |\n| 双指针扫描 | `15 三数之和` | 有序后和的大小可以指导移动 |\n| 区间线性合并 | `56 合并区间` | 只需和当前区间尾部比较 |\n| 原地分区 | `75 颜色分类` | 小、中、大三段边界可维护 |\n| 选择第 K | `215 数组第 K 大` | 不必完整排序，只定位目标秩 |\n| 多路/分治归并 | `148 排序链表` | 拆分后合并有序子结构 |\n| 频次排序 | `347 前 K 高频元素` | 先统计，再按频次选择 |\n| 动态有序结构 | `295 数据流中位数` | 用两个堆维护有序左右半区 |\n\n## 2. Hot100 排序题型地图\n\n\n| 题型 | 题目 | 抽象能力 | 一句话记忆 |\n|---|---|---|---|\n| 排序后双指针 | `15 三数之和` | 固定一个数，双指针找两数和 | 去重比找到答案更容易错 |\n| 排序 key 分组 | `49 字母异位词分组` | 把同类字符串映射到同一个 key | 排序后的字符串就是异位词签名 |\n| 区间排序扫描 | `56 合并区间` | 按左端点排序后维护右端点 | 能接上就扩右端，接不上就开新区间 |\n| 三路划分 | `75 颜色分类` | 荷兰国旗问题 | `0` 扔左边，`2` 扔右边，`1` 留中间 |\n| 链表归并排序 | `148 排序链表` | 快慢指针拆分，merge 合并 | 链表排序优先归并，不优先快排 |\n| 多数元素排序视角 | `169 多数元素` | 排序后中位数必是多数元素 | 更优解是摩尔投票，排序是理解入口 |\n| 第 K 大选择 | `215 数组第K个最大元素` | 快速选择、堆 | 目标下标是 `n - k` |\n| 数据流中位数 | `295 数据流的中位数` | 双堆维护左右半区 | 左边最大堆，右边最小堆 |\n| 频次选择 | `347 前 K 个高频元素` | 哈希统计后堆/桶/快选 | 先数频次，再选前 K |\n\n## 3. 复习顺序建议\n\n建议按“排序预处理 → 原地分区 → 选择问题 → 归并和动态结构”的顺序复习：\n\n1. `49 字母异位词分组`：理解排序 key 的作用。\n2. `56 合并区间`：练排序后线性扫描。\n3. `15 三数之和`：练排序后双指针和去重。\n4. `75 颜色分类`：掌握三路划分边界。\n5. `169 多数元素`：理解排序中位数视角，并对比摩尔投票。\n6. `215 数组第 K 大`：练快速选择和堆两种方案。\n7. `347 前 K 高频元素`：练频次统计后的选择。\n8. `148 排序链表`：练归并排序在链表上的实现。\n9. `295 数据流中位数`：练动态维护有序分割。\n\n## 4. 关键套路详解\n\n### 4.1 排序后先问“什么东西相邻了”\n\n排序最常见的价值是把同类元素放到一起。`49` 中每个字符串排序后得到统一 key，异位词自然归到同一组。`169` 中多数元素出现次数超过一半，排序后中间位置一定是它。\n\n但排序通常会带来 O(n log n)，如果题目有更强要求，要考虑哈希、计数、投票或选择算法。\n\n### 4.2 排序后双指针的前提是方向可判断\n\n`15 三数之和`排序后固定 `i`，剩余区间用左右指针。当前和太小就移动左指针增大，当前和太大就移动右指针减小。这个方向性来自数组有序。\n\n三数之和真正的难点是去重：固定点要跳过重复值，找到答案后左右指针也要跳过重复值。\n\n### 4.3 区间合并只看当前合并区间的右端点\n\n`56 合并区间`按左端点排序后，后面的区间左端点不会更小。维护当前合并区间 `[curL, curR]`：如果新区间 `l \u003c= curR`，说明重叠，更新 `curR = max(curR, r)`；否则把当前区间入答案，开启新区间。\n\n### 4.4 三路划分维护三个区域\n\n`75 颜色分类`是荷兰国旗问题。维护三个区间：`[0, left)` 全是 0，`[left, i)` 全是 1，`(right, n - 1]` 全是 2，`[i, right]` 是未知区。\n\n遇到 0，和 `left` 交换后 `left++`、`i++`；遇到 2，和 `right` 交换后只 `right--`，不能立刻 `i++`，因为换过来的元素还没检查。\n\n### 4.5 第 K 大不一定要完整排序\n\n`215` 的目标是第 K 大，也就是升序下标 `n - k`。快速选择每次 partition 后只递归包含目标下标的一侧，平均 O(n)。如果更重视实现稳定性，可以用大小为 K 的小顶堆，复杂度 O(n log k)。\n\n### 4.6 链表排序优先归并\n\n数组快排依赖随机访问，链表不适合。链表排序优先用归并：快慢指针找中点并断开，递归排序两段，再用合并两个有序链表的模板合并。\n\n切分时必须断链，否则递归不会收敛。\n\n### 4.7 数据流中位数是动态维护排序结果的一半\n\n`295` 不可能每插入一个数就排序一次。用大顶堆保存较小的一半，用小顶堆保存较大的一半，并保持两堆大小差不超过 1。中位数要么是大顶堆堆顶，要么是两堆堆顶平均。\n\n## 5. 抽象代码模板\n\n下面模板按排序带来的结构变化组织。刷题时先判断排序是为了产生 key、制造单调性、合并区间、原地分区、选择目标秩，还是维护动态有序分割。\n\n### 5.1 排序 Key 分组与计数 Key 分组\n\n#### 适用题型\n\n- `49 字母异位词分组`：排序后的字符串作为签名。\n- 字符集固定时，用计数 key 避免每个字符串排序。\n- 多字段对象分组：排序或规范化后作为哈希 key。\n\n#### 核心思路\n\n排序 key 的本质是把等价对象映射到同一个签名。异位词排序后字符顺序完全一致，因此可直接作为 key；如果字符集固定，也可以用 26 维计数拼接成 key。两种题型实现不同，分别给出函数。\n\n#### 代码 A：排序字符串作为 key\n\n> **题目简述：** 49 字母异位词分组：给定字符串数组，将包含相同字符及频次的字母异位词归为一组。 [力扣原题 ↗](https://leetcode.cn/problems/group-anagrams/)\n\n```cpp\n#include \u003cbits/stdc++.h>\nusing namespace std;\n\nvector\u003cvector\u003cstring>> groupAnagramsBySortedKey(const vector\u003cstring>& strs) {\n    unordered_map\u003cstring, vector\u003cstring>> groups;\n\n    for (const string& s : strs) {\n        string key = s;\n        sort(key.begin(), key.end());\n        groups[key].push_back(s);\n    }\n\n    vector\u003cvector\u003cstring>> ans;\n    for (auto& [key, values] : groups) {\n        ans.push_back(std::move(values));\n    }\n    return ans;\n}\n```\n\n#### 代码 B：26 维计数作为 key\n\n> **题目简述：** 49 字母异位词分组：给定字符串数组，将包含相同字符及频次的字母异位词归为一组。 [力扣原题 ↗](https://leetcode.cn/problems/group-anagrams/)\n\n```cpp\nstring buildCountKey(const string& s) {\n    array\u003cint, 26> cnt{};\n    for (char ch : s) {\n        cnt[ch - 'a']++;\n    }\n\n    string key;\n    for (int x : cnt) {\n        key += '#';       // 分隔符防止数字拼接产生歧义。\n        key += to_string(x);\n    }\n    return key;\n}\n\nvector\u003cvector\u003cstring>> groupAnagramsByCountKey(const vector\u003cstring>& strs) {\n    unordered_map\u003cstring, vector\u003cstring>> groups;\n    for (const string& s : strs) {\n        groups[buildCountKey(s)].push_back(s);\n    }\n\n    vector\u003cvector\u003cstring>> ans;\n    for (auto& [key, values] : groups) {\n        ans.push_back(std::move(values));\n    }\n    return ans;\n}\n```\n\n#### 易错点\n\n- 排序 key 会带来每个字符串 O(L log L) 成本；计数 key 是 O(L)。\n- 计数 key 拼接必须加分隔符。\n- 如果题目要求保留原顺序，分组内 `push_back(s)` 不要改动元素内容。\n\n### 5.2 排序后双指针：三数之和\n\n#### 适用题型\n\n- `15 三数之和`。\n- 有序两数之和、最接近三数之和。\n- k-sum 递归固定若干数后，最后降到双指针 two-sum。\n\n#### 核心思路\n\n排序后，固定 `i`，剩余区间 `[i + 1, n - 1]` 用左右指针。当前和太小移动 `left`，当前和太大移动 `right`。答案去重是循环不变量的一部分：固定点要去重，找到一个三元组后左右也要跳过重复值。\n\n#### 代码模板\n\n> **题目简述：** 15 三数之和：给定整数数组，找出所有和为零且不重复的三元组。 [力扣原题 ↗](https://leetcode.cn/problems/3sum/)\n\n```cpp\nvector\u003cvector\u003cint>> threeSumSortedTwoPointers(vector\u003cint>& nums) {\n    sort(nums.begin(), nums.end());\n    vector\u003cvector\u003cint>> ans;\n    int n = (int)nums.size();\n\n    for (int i = 0; i \u003c n; i++) {\n        if (i > 0 && nums[i] == nums[i - 1]) continue;\n        if (nums[i] > 0) break;\n\n        int left = i + 1;\n        int right = n - 1;\n        while (left \u003c right) {\n            long long sum = 1LL * nums[i] + nums[left] + nums[right];\n            if (sum == 0) {\n                ans.push_back({nums[i], nums[left], nums[right]});\n                left++;\n                right--;\n                while (left \u003c right && nums[left] == nums[left - 1]) left++;\n                while (left \u003c right && nums[right] == nums[right + 1]) right--;\n            } else if (sum \u003c 0) {\n                left++;\n            } else {\n                right--;\n            }\n        }\n    }\n\n    return ans;\n}\n```\n\n#### 易错点\n\n- 去重应在枚举过程中完成，不能最后只对答案套 `set`。\n- 排序会丢失原始下标，返回下标类变形要保存原位置。\n- 三数相加建议用 `long long`，避免极值溢出。\n\n### 5.3 区间排序扫描\n\n#### 适用题型\n\n- `56 合并区间`。\n- 插入区间后合并。\n- 会议室、区间覆盖等排序扫描基础题。\n\n#### 核心思路\n\n按左端点排序后，后面的区间左端点不会更小。维护当前合并区间 `[curL, curR]`：如果新区间 `l \u003c= curR`，说明有重叠，扩展右端点；否则把当前区间加入答案，并开启新区间。循环结束后别忘了加入最后一个区间。\n\n#### 代码模板\n\n> **题目简述：** 56 合并区间：给定若干闭区间，合并所有重叠区间并返回互不重叠的结果。 [力扣原题 ↗](https://leetcode.cn/problems/merge-intervals/)\n\n```cpp\nvector\u003cvector\u003cint>> mergeIntervalsAfterSorting(vector\u003cvector\u003cint>>& intervals) {\n    if (intervals.empty()) return {};\n\n    sort(intervals.begin(), intervals.end()); // 默认先按左端点，再按右端点。\n    vector\u003cvector\u003cint>> ans;\n\n    int curL = intervals[0][0];\n    int curR = intervals[0][1];\n\n    for (int i = 1; i \u003c (int)intervals.size(); i++) {\n        int l = intervals[i][0];\n        int r = intervals[i][1];\n\n        if (l \u003c= curR) {\n            curR = max(curR, r);\n        } else {\n            ans.push_back({curL, curR});\n            curL = l;\n            curR = r;\n        }\n    }\n\n    ans.push_back({curL, curR});\n    return ans;\n}\n```\n\n#### 易错点\n\n- 必须按左端点排序，不能按右端点排序后套这个模板。\n- 闭区间重叠条件是 `l \u003c= curR`；开区间可能要改成 `l \u003c curR`。\n- 循环结束后要把当前区间加入答案。\n\n### 5.4 三路划分与荷兰国旗\n\n#### 适用题型\n\n- `75 颜色分类`。\n- 快排三向 partition。\n- 按 pivot 分成小于、等于、大于三段的原地分类题。\n\n#### 核心思路\n\n维护四段区间：`[0, low)` 是小区，`[low, i)` 是中区，`[i, high]` 是未知区，`(high, n-1]` 是大区。扫描未知区时，遇小元素交换到左侧并前进；遇大元素交换到右侧但 `i` 不动，因为换回来的元素仍未知。\n\n#### 代码 A：颜色分类\n\n> **题目简述：** 75 颜色分类：原地整理仅含 0、1、2 的数组，使相同颜色相邻并按数值升序排列。 [力扣原题 ↗](https://leetcode.cn/problems/sort-colors/)\n\n```cpp\nvoid sortColorsDutchFlag(vector\u003cint>& nums) {\n    int low = 0;\n    int i = 0;\n    int high = (int)nums.size() - 1;\n\n    while (i \u003c= high) {\n        if (nums[i] == 0) {\n            swap(nums[low], nums[i]);\n            low++;\n            i++;\n        } else if (nums[i] == 2) {\n            swap(nums[i], nums[high]);\n            high--; // i 不动，继续检查换来的未知元素。\n        } else {\n            i++;\n        }\n    }\n}\n```\n\n#### 代码 B：按 pivot 三向切分\n\n> **题目简述：** 三向切分模板：给定数组区间和 pivot，原地划分为小于、等于和大于 pivot 的三段，并返回等值段边界。\n\n```cpp\npair\u003cint, int> threeWayPartitionByPivot(vector\u003cint>& nums, int left, int right, int pivot) {\n    // 返回等于 pivot 区间的左右边界 [equalL, equalR]。\n    int low = left;\n    int i = left;\n    int high = right;\n\n    while (i \u003c= high) {\n        if (nums[i] \u003c pivot) {\n            swap(nums[low++], nums[i++]);\n        } else if (nums[i] > pivot) {\n            swap(nums[i], nums[high--]);\n        } else {\n            i++;\n        }\n    }\n\n    return {low, high};\n}\n```\n\n#### 易错点\n\n- 遇到大元素和右端交换后不能 `i++`。\n- `low/i/high` 的区间语义要先写清楚。\n- 三向 partition 返回等值区间，不能当单个 pivot 下标。\n\n### 5.5 快速选择与堆选择第 K\n\n#### 适用题型\n\n- `215 数组中的第 K 个最大元素`。\n- 只关心目标秩，不要求完整排序。\n- 数据流或更重视稳定实现时可用大小为 K 的小顶堆。\n\n#### 核心思路\n\n原始笔记提供两种写法：稳定好写的小顶堆，以及随机 pivot 的三路快速选择。三路快选不需要完整排序，而是把数组按 `> pivot`、`== pivot`、`\u003c pivot` 分成三段；因为题目问第 K 大，所以先看 `big` 段够不够，否则扣掉 `big/equal` 的规模去 `small` 段继续找。\n\n#### 代码 A：随机 pivot 三路快速选择原始解法\n\n> **题目简述：** 215 数组中的第 K 个最大元素：给定无序数组和 K，返回按排序名次计算的第 K 大元素，而非第 K 个不同值。 [力扣原题 ↗](https://leetcode.cn/problems/kth-largest-element-in-an-array/)\n\n```cpp\nint quickSelectKthLargestTemplate(vector\u003cint>& nums, int k) {\n    int pivot = nums[rand() % nums.size()];\n    vector\u003cint> small, equal, big;\n\n    for (int num : nums) {\n        if (num > pivot) {\n            big.push_back(num);      // 比 pivot 大的元素排在第 K 大候选更前面。\n        } else if (num \u003c pivot) {\n            small.push_back(num);    // 比 pivot 小的元素只有在 big/equal 不够时才需要继续找。\n        } else {\n            equal.push_back(num);    // 重复值集中处理，避免重复元素导致秩判断错误。\n        }\n    }\n\n    if (k \u003c= (int)big.size()) {\n        return quickSelectKthLargestTemplate(big, k);\n    }\n    if (k > (int)big.size() + (int)equal.size()) {\n        return quickSelectKthLargestTemplate(small, k - (int)big.size() - (int)equal.size());\n    }\n    return pivot;\n}\n\nint findKthLargestByQuickSelect(vector\u003cint>& nums, int k) {\n    return quickSelectKthLargestTemplate(nums, k);\n}\n```\n\n#### 代码 B：小顶堆选择第 K 大原始解法\n\n> **题目简述：** 215 数组中的第 K 个最大元素：给定无序数组和 K，返回按排序名次计算的第 K 大元素，而非第 K 个不同值。 [力扣原题 ↗](https://leetcode.cn/problems/kth-largest-element-in-an-array/)\n\n```cpp\nint findKthLargestByMinHeap(const vector\u003cint>& nums, int k) {\n    priority_queue\u003cint, vector\u003cint>, greater\u003cint>> heap;\n\n    for (int x : nums) {\n        heap.push(x);\n        if ((int)heap.size() > k) {\n            heap.pop(); // 堆里只保留当前最大的 K 个数，堆顶就是这 K 个里最小的。\n        }\n    }\n\n    return heap.top();\n}\n```\n\n#### 易错点\n\n- 原始三路快选按“第 K 大”直接递归，不需要换算成 `n - k`。\n- 进入 `small` 段时，新的 K 必须扣掉 `big.size() + equal.size()`。\n- 堆方案要用小顶堆保存 K 个最大值，超出 K 时弹掉当前最小值。\n\n### 5.6 链表归并排序\n\n#### 适用题型\n\n- `148 排序链表`。\n- 链表结构需要 O(n log n) 排序。\n- 需要复用合并两个有序链表的题。\n\n#### 核心思路\n\n链表不适合随机访问，优先用归并排序。快慢指针找到中点后必须断链，使递归规模变小；分别排序左右两段后，用合并两个有序链表的模板合并。递归版有 O(log n) 栈空间，自底向上迭代可做到 O(1) 额外空间。\n\n#### 代码模板\n\n> **题目简述：** 148 排序链表：给定单链表头结点，以 O(n log n) 时间将所有结点按值升序排列。 [力扣原题 ↗](https://leetcode.cn/problems/sort-list/)\n\n```cpp\nstruct ListNode {\n    int val;\n    ListNode* next;\n    ListNode() : val(0), next(nullptr) {}\n    ListNode(int x) : val(x), next(nullptr) {}\n    ListNode(int x, ListNode* next) : val(x), next(next) {}\n};\n\nListNode* mergeSortedListsForSort(ListNode* a, ListNode* b) {\n    ListNode dummy(-1);\n    ListNode* cur = &dummy;\n\n    while (a && b) {\n        if (a->val \u003c= b->val) {\n            cur->next = a;\n            a = a->next;\n        } else {\n            cur->next = b;\n            b = b->next;\n        }\n        cur = cur->next;\n    }\n\n    cur->next = a ? a : b;\n    return dummy.next;\n}\n\nListNode* sortListByMergeSort(ListNode* head) {\n    if (!head || !head->next) return head;\n\n    ListNode* slow = head;\n    ListNode* fast = head->next;\n    while (fast && fast->next) {\n        slow = slow->next;\n        fast = fast->next->next;\n    }\n\n    ListNode* rightHead = slow->next;\n    slow->next = nullptr; // 必须断链，否则左半段递归不会收敛。\n\n    ListNode* left = sortListByMergeSort(head);\n    ListNode* right = sortListByMergeSort(rightHead);\n    return mergeSortedListsForSort(left, right);\n}\n```\n\n#### 易错点\n\n- 找到中点后必须 `slow->next = nullptr`。\n- 合并时复用原节点即可，不需要新建所有节点。\n- 快慢指针初始化为 `fast = head->next` 可让 slow 停在左半段尾部，便于断链。\n\n### 5.7 频次统计后的 Top K\n\n#### 适用题型\n\n- `347 前 K 个高频元素`。\n- 高频词、高频数字。\n- 先哈希计数，再按频率堆选、桶选或快选。\n\n#### 核心思路\n\n排序专题里的 Top K 高频先把值压缩成 `(value, frequency)`。小顶堆保留频率最高的 K 个元素；如果频次最大不超过 n，也可以用桶排序，把相同频率的元素放入同一个桶，从高频往低频收集。\n\n#### 代码 A：小顶堆\n\n> **题目简述：** 347 前 K 个高频元素：给定整数数组和 K，返回出现频率最高的 K 个元素，结果顺序不限。 [力扣原题 ↗](https://leetcode.cn/problems/top-k-frequent-elements/)\n\n```cpp\nvector\u003cint> topKFrequentByHeap(const vector\u003cint>& nums, int k) {\n    unordered_map\u003cint, int> freq;\n    for (int x : nums) {\n        freq[x]++;\n    }\n\n    using Item = pair\u003cint, int>; // {frequency, value}\n    priority_queue\u003cItem, vector\u003cItem>, greater\u003cItem>> heap;\n\n    for (auto& [value, count] : freq) {\n        heap.push({count, value});\n        if ((int)heap.size() > k) {\n            heap.pop();\n        }\n    }\n\n    vector\u003cint> ans;\n    while (!heap.empty()) {\n        ans.push_back(heap.top().second);\n        heap.pop();\n    }\n    return ans;\n}\n```\n\n#### 代码 B：桶排序\n\n> **题目简述：** 347 前 K 个高频元素：给定整数数组和 K，返回出现频率最高的 K 个元素，结果顺序不限。 [力扣原题 ↗](https://leetcode.cn/problems/top-k-frequent-elements/)\n\n```cpp\nvector\u003cint> topKFrequentByBucket(const vector\u003cint>& nums, int k) {\n    unordered_map\u003cint, int> freq;\n    for (int x : nums) freq[x]++;\n\n    vector\u003cvector\u003cint>> buckets(nums.size() + 1);\n    for (auto& [value, count] : freq) {\n        buckets[count].push_back(value);\n    }\n\n    vector\u003cint> ans;\n    for (int f = (int)buckets.size() - 1; f >= 1 && (int)ans.size() \u003c k; f--) {\n        for (int value : buckets[f]) {\n            ans.push_back(value);\n            if ((int)ans.size() == k) break;\n        }\n    }\n    return ans;\n}\n```\n\n#### 易错点\n\n- 先统计频率，再对频率选择，不能对原数组直接取前 K。\n- 小顶堆比较器方向要让最小频率在堆顶。\n- 桶下标是频次，范围是 `1..n`。\n\n### 5.8 双堆维护数据流中位数\n\n#### 适用题型\n\n- `295 数据流的中位数`。\n- 动态插入并频繁查询中位数。\n- 维护有序集合左右半区的在线题。\n\n#### 核心思路\n\n用大顶堆 `small` 保存较小的一半，用小顶堆 `large` 保存较大的一半。保持 `small.size() >= large.size()` 且大小差不超过 1，并保证 `small.top() \u003c= large.top()`。插入后立即 rebalance；查询时奇数返回 `small.top()`，偶数返回两个堆顶平均。\n\n#### 代码模板\n\n> **题目简述：** 295 数据流的中位数：设计结构持续接收整数，并能随时返回当前所有数据的中位数。 [力扣原题 ↗](https://leetcode.cn/problems/find-median-from-data-stream/)\n\n```cpp\nclass MedianFinderByTwoHeaps {\nprivate:\n    priority_queue\u003cint> small; // 较小一半，大顶堆，堆顶是左半最大值。\n    priority_queue\u003cint, vector\u003cint>, greater\u003cint>> large; // 较大一半，小顶堆。\n\npublic:\n    void addNum(int num) {\n        if (small.empty() || num \u003c= small.top()) {\n            small.push(num);\n        } else {\n            large.push(num);\n        }\n\n        // 平衡大小：允许 small 比 large 多一个，方便奇数时直接返回 small.top()。\n        if (small.size() > large.size() + 1) {\n            large.push(small.top());\n            small.pop();\n        } else if (large.size() > small.size()) {\n            small.push(large.top());\n            large.pop();\n        }\n    }\n\n    double findMedian() const {\n        if (small.size() == large.size()) {\n            return ((long long)small.top() + large.top()) / 2.0;\n        }\n        return small.top();\n    }\n};\n```\n\n#### 易错点\n\n- 每次插入后都要 rebalance，不能等查询时再修。\n- 偶数个元素求平均要防止两个 `int` 相加溢出。\n- `small` 保存较小一半但用大顶堆，`large` 保存较大一半但用小顶堆。\n\n\n## 6. 高频易错点清单\n\n| 易错点 | 典型题目 | 规避方式 |\n|---|---|---|\n| 排序后丢失原始下标 | 需要返回下标的变形题 | 排序前保存 `{value, index}` |\n| 三数之和去重不完整 | `15` | 固定点、左指针、右指针都要跳重复 |\n| 区间排序没有按左端点 | `56` | 默认 `sort(vector\u003cvector\u003cint>>)` 即先按第一维排序 |\n| 合并区间忘记最后一个区间入答案 | `56` | 循环结束后 push 当前区间 |\n| 颜色分类遇到 2 后仍然 `i++` | `75` | 与右端交换后新元素未知，不能跳过 |\n| 第 K 大目标下标算错 | `215` | 升序目标下标是 `n - k` |\n| 快选最坏情况退化 | `215` | 随机 pivot 或用堆方案兜底 |\n| 链表归并切分后没断开 | `148` | 找到中点后 `slow->next = nullptr` |\n| 前 K 高频比较器方向写反 | `347` | 小顶堆保留 K 个最大频次 |\n| 数据流中位数两堆大小失衡 | `295` | 每次插入后立即 rebalance |\n| 两堆堆顶顺序被破坏 | `295` | 小的一半进大顶堆，大的一半进小顶堆 |\n\n## 7. 最短复盘口诀\n\n排序题先问排序带来什么：同类相邻、区间有序、和可单调移动、目标秩可定位。异位词看排序 key，三数之和排序双指针，合并区间按左端扫描，颜色分类维护三段，链表排序用归并，第 K 大用快选或小顶堆，Top K 高频先计数后选择，数据流中位数用双堆维护左右半区。\n\n\n\n================================================================================\n\n# 第17部分: 深度优先搜索\n\n================================================================================\n\n> 目标：本文把 Hot100 中所有标注“深度优先搜索”的题抽象成递归语义、访问状态、回溯恢复和图染色等可复用模板。复习时先定义 DFS 函数含义，再决定是遍历型、分治型、贡献型、回溯型还是判环型。\n\n## 1. DFS 题的底层模型\n\nDFS 的核心在于定义清楚当前调用处理什么、返回什么、进入和退出时维护什么状态。每道 DFS 题先问六个问题：\n\n| 问题 | 如果答案是“是” | 常用处理 |\n|---|---|---|\n| 当前节点需要左右子树结果吗 | 深度、直径、最大路径和、LCA | 后序 DFS，先拿子结果再处理当前节点 |\n| 状态只属于当前路径吗 | 单词搜索、路径总和、回溯类题 | 进入时修改，退出时恢复 |\n| 访问过的节点是否永久失效 | 岛屿数量、连通块统计 | 永久染色或 visited 标记 |\n| 是否要判断有向图环 | 课程表、依赖关系 | DFS 三色标记：未访问、访问中、已完成 |\n| 是否利用 BST 有序性 | 验证 BST、第 K 小 | 中序 DFS 或上下界递归 |\n| 是否要模拟前序结构改指针 | 二叉树展开为链表 | 反向前序或显式栈 |\n\nDFS 常见函数语义有五类：\n\n| DFS 类型 | 返回值含义 | 状态维护 | 代表题 |\n|---|---|---|---|\n| 遍历型 | 通常无返回值，只收集答案 | 访问顺序 | `94`、`199` |\n| 分治型 | 返回当前子树属性 | 左右子树结果 | `104`、`226`、`101` |\n| 贡献型 | 返回能向父节点延伸的贡献 | 全局答案 | `543`、`124` |\n| 回溯型 | 返回是否找到或累计方案数 | 路径状态进入/退出 | `79`、`437` |\n| 图搜索型 | 返回当前节点是否安全或无环 | visited 或三色状态 | `200`、`207` |\n\n## 2. Hot100 DFS 题型地图\n\nDFS 专题关注“递归语义和状态模型”。二叉树题数量最多，图遍历、回溯和判环题也会共享同一套状态维护思路。\n\n| 题型 | 题目 | 抽象能力 | 一句话记忆 |\n|---|---|---|---|\n| 基础遍历 | `94 二叉树中序遍历` | 前中后序位置 | 当前节点处理位置决定遍历类型 |\n| 子树属性 | `104 最大深度`、`226 翻转二叉树` | 返回子树信息或修改子树 | 当前答案由左右子树合成 |\n| 双节点递归 | `101 对称二叉树` | 同步比较两个节点 | 镜像比较外侧和内侧 |\n| BST DFS | `98 验证 BST`、`230 第 K 小` | 中序有序和上下界 | BST 题优先想中序 |\n| 贡献型路径 | `543 二叉树直径`、`124 最大路径和` | 全局答案 + 单边贡献 | 答案可拐弯，返回不能拐弯 |\n| 树上前缀和 | `437 路径总和 III` | 当前路径历史状态 | 进入加前缀，退出撤前缀 |\n| LCA 后序查找 | `236 最近公共祖先` | 子树返回命中目标或答案 | 左右都找到，当前就是 LCA |\n| DFS 右视图 | `199 二叉树右视图` | 深度首次到达 | 先右后左，首次到层即答案 |\n| 树形展开 | `114 二叉树展开为链表` | 反向前序原地重连 | 右左中处理，当前接 prev |\n| 网格 DFS | `200 岛屿数量`、`79 单词搜索` | 永久染色 vs 回溯恢复 | 统计块永久标记，找路径必须恢复 |\n| 有向图判环 | `207 课程表` | 三色 DFS | 遇到访问中节点就是环 |\n\n## 3. 复习顺序建议\n\n建议按“树递归语义 → 路径状态 → 网格回溯 → 图判环”的顺序复习：\n\n1. `94`：建立前中后序的访问位置概念。\n2. `104`、`226`：理解 DFS 返回子树属性和原地修改。\n3. `101`：练两个节点同步递归。\n4. `98`、`230`：把 BST 性质落实到中序 DFS。\n5. `543`、`124`：掌握贡献型 DFS，区分全局答案和返回值。\n6. `437`：掌握路径状态必须回溯。\n7. `236`：掌握后序查找和返回命中信息。\n8. `199`、`114`：练 DFS 访问顺序对答案和结构的影响。\n9. `200`：练网格永久染色。\n10. `79`：练网格回溯恢复。\n11. `207`：练有向图三色判环。\n\n## 4. 关键套路详解\n\n### 4.1 DFS 第一行先写函数语义\n\n写 DFS 前先补完这句话：\n\n```text\ndfs(x, state) 表示处理 ______，返回 ______。\n```\n\n例如 `104` 的 DFS 返回当前子树最大深度；`543` 的 DFS 返回从当前节点向下的最长单边深度；`236` 的 DFS 返回当前子树中找到的 p、q 或 LCA；`79` 的 DFS 返回从 `(r,c)` 开始是否能匹配 `word[k...]`。\n\n如果返回值语义不清，递归边界、状态更新和答案更新都会混乱。\n\n### 4.2 前序、中序、后序是状态处理时机\n\n| 位置 | 适合做什么 | 代表题 |\n|---|---|---|\n| 前序位置 | 从父到子传状态、进入路径、首次到达某层 | `199`、`437`、`79` |\n| 中序位置 | BST 有序访问 | `94`、`98`、`230` |\n| 后序位置 | 汇总子树结果、贡献计算、LCA | `104`、`543`、`124`、`236` |\n\n不要把前中后序只理解成遍历顺序。它真正决定的是“当前节点在递归生命周期的哪个阶段被处理”。\n\n### 4.3 贡献型 DFS 必须区分答案和返回值\n\n`543` 和 `124` 是 DFS 最重要的抽象题型。当前节点处的最优答案可以同时使用左右子树，因为路径可以在当前节点拐弯。但向父节点返回时只能选一边继续延伸，否则路径会分叉。\n\n| 题目 | 更新全局答案 | 向上返回 |\n|---|---|---|\n| `543 直径` | `leftDepth + rightDepth` | `max(leftDepth, rightDepth) + 1` |\n| `124 最大路径和` | `root->val + leftGain + rightGain` | `root->val + max(leftGain, rightGain)` |\n\n口诀：答案可以拐弯，返回值不能拐弯。\n\n### 4.4 永久染色和回溯恢复不能混用\n\n`200` 和 `79` 都是网格 DFS，但访问标记语义完全不同。\n\n| 场景 | 标记策略 | 原因 |\n|---|---|---|\n| 连通块统计 | 永久标记 visited 或把陆地改成水 | 一块区域统计后不再需要参与其他答案 |\n| 路径搜索 | 临时标记，递归退出前恢复 | 当前路径不能重复用格子，但其他路径仍可能用 |\n\n判断方法：如果一个点访问过后全局都不该再用，永久染色；如果只是不允许当前路径重复使用，必须回溯恢复。\n\n### 4.5 树上前缀和是数组前缀和的回溯版\n\n`437 路径总和 III` 和数组 `560` 类似，都用 `curSum - target` 查历史前缀。但树有分叉，当前路径历史只能给当前分支使用，不能污染兄弟分支。\n\n固定动作：进入节点后 `prefix[curSum]++`，递归左右子树，退出节点前 `prefix[curSum]--`。\n\n初始化 `prefix[0] = 1` 表示允许从根节点开始的一段路径被统计。\n\n### 4.6 有向图 DFS 判环看“当前路径”\n\n`207 课程表` 用 DFS 判环时，visited 不能只有 true/false。因为遇到“已访问过”有两种含义：正在当前递归路径中，或者已经完全处理完。\n\n三色状态：\n\n| 状态 | 含义 | 遇到时 |\n|---|---|---|\n| `0` | 未访问 | 继续 DFS |\n| `1` | 当前路径中 | 有环 |\n| `2` | 已完成且安全 | 直接返回无环 |\n\n退出一个节点前必须从 `1` 改成 `2`，否则会把已处理节点误判为环。\n\n## 5. 抽象代码模板\n\n下面模板按 DFS 的函数语义组织。每个模板都使用统一结构，并在使用成员答案时提供 wrapper 初始化，避免重复调用污染状态。\n\n### 5.1 树 DFS 访问位置模板\n\n#### 适用题型\n\n- 前序、中序、后序遍历。\n- BST 验证、第 K 小。\n- DFS 右视图、从根向下传状态。\n\n#### 核心思路\n\nDFS 访问位置决定当前节点的处理时机。前序位置适合“进入节点”时做事，中序位置适合 BST 有序访问，后序位置适合左右子树处理完后汇总。这个模板是遍历型，通常不依赖返回值。\n\n#### 代码模板\n\n> **题目简述：** 本模板用于：前序、中序、后序遍历。；BST 验证、第 K 小。；DFS 右视图、从根向下传状态。 [94 原题 ↗](https://leetcode.cn/problems/binary-tree-inorder-traversal/) · [98 原题 ↗](https://leetcode.cn/problems/validate-binary-search-tree/) · [230 原题 ↗](https://leetcode.cn/problems/kth-smallest-element-in-a-bst/) · [199 原题 ↗](https://leetcode.cn/problems/binary-tree-right-side-view/)\n\n```cpp\nstruct TreeNode {\n    int val;\n    TreeNode* left;\n    TreeNode* right;\n    TreeNode(int x = 0) : val(x), left(nullptr), right(nullptr) {}\n};\n\nvoid treeDfsPosition(TreeNode* root, int depth, vector\u003cint>& ans) {\n    if (!root) {\n        return;\n    }\n\n    // 前序位置：刚进入当前节点。\n    // 可用于 DFS 右视图：先递归右子树，首次到达 depth 时记录。\n    // if (depth == (int)ans.size()) ans.push_back(root->val);\n\n    treeDfsPosition(root->left, depth + 1, ans);\n\n    // 中序位置：BST 题的核心访问点。\n    // 验证 BST：检查 prev \u003c root->val；第 K 小：在这里计数。\n\n    treeDfsPosition(root->right, depth + 1, ans);\n\n    // 后序位置：左右子树都完成后再处理当前节点。\n    // 如果需要左右返回值，不要硬塞进 void 遍历，用分治/贡献模板。\n}\n```\n\n#### 易错点\n\n- 把前中后序理解成状态处理时机，避免机械套固定遍历顺序。\n- DFS 右视图忘记先右后左，导致记录成左视图。\n- BST 验证只比较父子节点，遗漏整棵子树范围约束。\n\n### 5.2 子树属性分治 DFS 模板\n\n#### 适用题型\n\n- 最大深度、节点数、叶子数。\n- 翻转二叉树。\n- 判断平衡二叉树。\n\n#### 核心思路\n\n这一组题都在后序位置做同一件事：先拿到左右子树结果，再在当前节点合并。差别只在于“返回值语义”和“合并公式”。\n\n共同不变量：\n\n- 空节点先给出不会影响合并的默认值。\n- 当前节点只依赖左右子树已经算好的结果。\n- 如果题目需要提前失败，例如平衡树，返回值里要能表达失败状态。\n- 如果题目是原地修改，例如翻转树，合并动作从“计算属性”变成“接回左右子树”。\n\n#### 代码模板：共同骨架\n\n> **题目简述：** 本模板用于：最大深度、节点数、叶子数。；翻转二叉树。；判断平衡二叉树。 [104 原题 ↗](https://leetcode.cn/problems/maximum-depth-of-binary-tree/) · [226 原题 ↗](https://leetcode.cn/problems/invert-binary-tree/)\n\n```cpp\nstruct SubtreeInfo {\n    int height;     // 最大深度变形：当前子树高度\n    int nodeCount;  // 节点数变形：当前子树节点总数\n    int leafCount;  // 叶子数变形：当前子树叶子数量\n    bool balanced;  // 平衡树变形：当前子树是否平衡\n};\n\nSubtreeInfo collectSubtreeInfo(TreeNode* root) {\n    // 共同 base case：空树高度、节点数、叶子数都是 0，且天然平衡。\n    if (!root) {\n        return {0, 0, 0, true};\n    }\n\n    SubtreeInfo left = collectSubtreeInfo(root->left);\n    SubtreeInfo right = collectSubtreeInfo(root->right);\n\n    SubtreeInfo cur;\n    cur.height = max(left.height, right.height) + 1;\n    cur.nodeCount = left.nodeCount + right.nodeCount + 1;\n    cur.leafCount = (!root->left && !root->right)\n                  ? 1\n                  : left.leafCount + right.leafCount;\n    cur.balanced = left.balanced && right.balanced &&\n                   abs(left.height - right.height) \u003c= 1;\n    return cur;\n}\n```\n\n翻转二叉树仍然是同一个“先处理左右、再处理当前”的后序骨架，只是合并动作从计算属性改成交换指针：\n\n> **题目简述：** 本模板用于：最大深度、节点数、叶子数。；翻转二叉树。；判断平衡二叉树。 [104 原题 ↗](https://leetcode.cn/problems/maximum-depth-of-binary-tree/) · [226 原题 ↗](https://leetcode.cn/problems/invert-binary-tree/)\n\n```cpp\nTreeNode* invertTreeDfs(TreeNode* root) {\n    if (!root) {\n        return nullptr;\n    }\n\n    TreeNode* left = invertTreeDfs(root->left);\n    TreeNode* right = invertTreeDfs(root->right);\n\n    // 变形点：左右结果用于交换后接回当前节点。\n    root->left = right;\n    root->right = left;\n    return root;\n}\n```\n\n#### 变形点对照\n\n| 题型 | 共同骨架中改哪里 | 合并公式 / 处理差异 |\n|---|---|---|\n| 最大深度 | 返回值只保留 `height` | `max(left.height, right.height) + 1` |\n| 节点数 | 返回值只保留 `nodeCount` | `left.nodeCount + right.nodeCount + 1` |\n| 叶子数 | 增加叶子判断 | 叶子返回 `1`，非叶子累加左右叶子数 |\n| 平衡二叉树 | 返回高度同时带失败状态 | 左右平衡且高度差不超过 `1` |\n| 翻转二叉树 | 合并动作从算属性改成接指针 | `root->left = right; root->right = left` |\n\n#### 易错点\n\n- 没有先说清楚返回值语义，导致 base case 和合并逻辑都摇摆。\n- 节点数、叶子数和深度共享后序骨架，但合并公式不同，不能机械套 `max(left, right) + 1`。\n- 平衡树只看当前高度差不够，还要左右子树本身都平衡。\n- 翻转树递归后忘记接回左右子树，或把局部变量和原指针混淆。\n\n### 5.3 贡献型路径 DFS 模板\n\n#### 适用题型\n\n- 二叉树直径。\n- 二叉树最大路径和。\n- 当前节点能更新答案，但向父节点只能返回单边贡献的路径题。\n\n#### 核心思路\n\n全局答案和递归返回值含义不同。全局答案可以使用“左贡献 + 当前节点 + 右贡献”，因为答案路径可以在当前节点拐弯；返回值要给父节点继续拼接，只能选择左或右一边。成员变量答案必须在 wrapper 里初始化。\n\n#### 代码 A：直径\n\n> **题目简述：** 本模板用于：二叉树直径。；二叉树最大路径和。；当前节点能更新答案，但向父节点只能返回单边贡献的路径题。 [力扣原题 ↗](https://leetcode.cn/problems/diameter-of-binary-tree/)\n\n```cpp\nclass DiameterDfsTemplate {\nprivate:\n    int ans;\n\n    int depthGain(TreeNode* root) {\n        // 返回值语义：从 root 向下延伸的最大深度。\n        if (!root) {\n            return 0;\n        }\n\n        int left = depthGain(root->left);\n        int right = depthGain(root->right);\n\n        // 全局答案：经过 root 的直径候选，可以同时用左右深度。\n        ans = max(ans, left + right);\n\n        // 返回值：给父节点的单边深度，只能选较大一侧。\n        return max(left, right) + 1;\n    }\n\npublic:\n    int diameterOfBinaryTree(TreeNode* root) {\n        ans = 0;       // wrapper 初始化，避免重复调用污染状态。\n        depthGain(root);\n        return ans;\n    }\n};\n```\n\n#### 代码 B：最大路径和\n\n> **题目简述：** 124 二叉树中的最大路径和：二叉树路径可从任意结点起止且不重复经过结点，求最大结点值之和。 [力扣原题 ↗](https://leetcode.cn/problems/binary-tree-maximum-path-sum/)\n\n```cpp\nclass MaxPathDfsTemplate {\nprivate:\n    int ans;\n\n    int sumGain(TreeNode* root) {\n        // 返回值语义：从 root 出发向下延伸的一条最大路径和。\n        if (!root) {\n            return 0;\n        }\n\n        int left = max(0, sumGain(root->left));\n        int right = max(0, sumGain(root->right));\n\n        // 全局答案可以在 root 处拐弯，同时拿左右非负贡献。\n        ans = max(ans, root->val + left + right);\n\n        // 返回给父节点时不能拐弯，否则路径分叉。\n        return root->val + max(left, right);\n    }\n\npublic:\n    int maxPathSum(TreeNode* root) {\n        ans = INT_MIN; // 全负数也需要被某个节点值更新。\n        sumGain(root);\n        return ans;\n    }\n};\
