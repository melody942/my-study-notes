 回溯\n\n================================================================================\n\n> 目标：本文把 Hot100 回溯题抽象成“选择列表、路径状态、剪枝条件、撤销现场”的模板。复习时先判断是在枚举组合、排列、切分、棋盘还是网格路径，再套对应搜索树。\n\n## 1. 回溯题的底层模型\n\n回溯题的本质是遍历一棵搜索树。每个节点代表当前已经做出的选择，每条边代表再做一个选择。每道回溯题先问五个问题：\n\n| 问题 | 如果答案是“是” | 常用处理 |\n|---|---|---|\n| 选择是否有顺序 | 全排列、电话号码 | 用 `used` 或按位置推进 |\n| 选择是否不能重复 | 组合、子集、分割 | 用 `start` 保证只向后选 |\n| 一个元素能否重复使用 | 组合总和 | 递归时传 `i`，允许本元素重复选择 |\n| 是否需要路径合法性剪枝 | 括号、N 皇后、单词搜索 | 进入下一层前先判断约束 |\n| 状态是否要恢复 | 棋盘、网格、路径数组 | 进入修改，退出撤销 |\n\n回溯模板最关键的四个位置：\n\n| 位置 | 作用 | 典型代码 |\n|---|---|---|\n| 终止条件 | 决定什么时候收集答案 | `if (path.size() == n)` |\n| 选择循环 | 枚举当前层可以选什么 | `for (int i = start; i \u003c n; i++)` |\n| 做选择 | 修改路径和状态 | `path.push_back(x)`、`used[i] = true` |\n| 撤销选择 | 恢复给兄弟分支 | `path.pop_back()`、`used[i] = false` |\n\n## 2. Hot100 回溯题型地图\n\n回溯专题覆盖 8 道典型题。`22` 和 `131` 可兼顾动态规划属性，`79` 可兼顾矩阵 DFS；这里统一按回溯搜索树理解。\n\n| 题型 | 题目 | 抽象能力 | 一句话记忆 |\n|---|---|---|---|\n| 固定映射展开 | `17 电话号码的字母组合` | 每一层对应一个字符位置 | 第 k 层从 digits[k] 的映射字符里选 |\n| 合法序列生成 | `22 括号生成` | 搜索中维护合法约束 | 左括号不超过 n，右括号不超过左括号 |\n| 组合枚举 | `39 组合总和` | `start` 控制去重和复用 | 可重复就递归传 `i`，不可重复传 `i + 1` |\n| 排列枚举 | `46 全排列` | `used` 控制每个元素只用一次 | 每层都从 0 扫，靠 used 避免重复 |\n| 子集枚举 | `78 子集` | 每个节点都是一个答案 | 先收集当前路径，再继续向后选 |\n| 棋盘约束 | `51 N 皇后` | 行推进、列和对角线剪枝 | 一行放一个皇后，三组集合判冲突 |\n| 网格路径 | `79 单词搜索` | 临时访问标记和恢复现场 | 路径题不能永久染色 |\n| 回文切分 | `131 分割回文串` | 枚举切点，回文剪枝 | 只在子串是回文时切一刀 |\n\n## 3. 复习顺序建议\n\n建议按“纯枚举 → 带约束 → 带恢复 → 预处理剪枝”的顺序复习：\n\n1. `78 子集`：理解每个搜索节点都可以成为答案。\n2. `46 全排列`：掌握 `used` 数组和撤销选择。\n3. `39 组合总和`：理解 `start` 的去重语义和可重复选择。\n4. `17 电话号码`：练按位置推进的多叉搜索。\n5. `22 括号生成`：练合法性剪枝。\n6. `79 单词搜索`：练网格路径的临时标记和恢复。\n7. `131 分割回文串`：练切点枚举和回文预处理。\n8. `51 N 皇后`：综合行推进、集合剪枝和棋盘构造。\n\n## 4. 关键套路详解\n\n### 4.1 `start` 和 `used` 解决的是不同问题\n\n组合和子集不关心顺序，`[1, 2]` 和 `[2, 1]` 是同一个选择，所以用 `start` 限制后续只能选当前位置之后的元素。\n\n排列关心顺序，`[1, 2]` 和 `[2, 1]` 是不同答案，所以每层都可以从头枚举，但必须用 `used` 防止同一个元素在同一路径里重复出现。\n\n| 模型 | 是否关心顺序 | 控制方式 |\n|---|---|---|\n| 子集、组合 | 不关心 | `start` 向后推进 |\n| 全排列 | 关心 | `used[i]` 标记路径内已使用 |\n| 组合总和可重复 | 不关心但可复用 | 选中 `i` 后下一层仍从 `i` 开始 |\n\n### 4.2 剪枝应该发生在递归之前\n\n回溯的效率来自尽早拒绝不可能分支。`22 括号生成` 中如果 `right > left`，当前前缀已经非法，后面再加字符也无法变合法。`51 N 皇后` 中如果列或对角线冲突，就不要放皇后，更不要递归。\n\n剪枝条件越靠近“做选择”之前，搜索树越小。\n\n### 4.3 路径状态必须对兄弟分支无副作用\n\n`path.push_back` 后必须 `path.pop_back`。`used[i] = true` 后必须恢复成 false。`79 单词搜索` 中把格子改成 `#` 后，失败或提前成功返回前都要还原原字符。\n\n回溯代码最重要的对称性是：做选择和撤销选择必须成对出现。\n\n### 4.4 回文分割要把“判断回文”和“枚举切法”拆开\n\n`131 分割回文串` 如果每次递归都用双指针判断子串是否回文，会重复计算。更稳的方式是先用 DP 预处理 `isPalindrome[l][r]`，回溯时只负责枚举下一刀切在哪里。\n\n这类题的模式是：DP 负责合法性查询，回溯负责枚举方案。\n\n### 4.5 N 皇后不要每次扫描棋盘\n\nN 皇后每一行只放一个皇后，因此递归层数就是行号。冲突只需要三类信息：列、主对角线、副对角线。\n\n| 冲突类型 | 标识方式 |\n|---|---|\n| 同列 | `col` |\n| 主对角线 | `row - col` |\n| 副对角线 | `row + col` |\n\n用集合或布尔数组维护这三类占用，就不需要每次扫描棋盘。\n\n## 5. 抽象代码模板\n\n下面模板按搜索树形态组织。回溯代码重点看四个位置：终止条件、选择列表、做选择、撤销现场。\n\n### 5.1 子集与组合枚举模板\n\n#### 适用题型\n\n- 子集：每个搜索节点都是一个答案。\n- 组合总和：路径和达到目标时收集答案。\n- 从数组中选择若干元素且不关心顺序的题。\n\n#### 核心思路\n\n`start` 表示当前层只能从哪个下标开始选。组合和子集不关心顺序，递归向后推进可以避免 `[1,2]` 和 `[2,1]` 这种排列式重复。选择一个元素后立刻进入下一层，返回后撤销选择，保证兄弟分支看到的是同一个现场。\n\n#### 代码 A：子集\n\n> **题目简述：** 本模板用于：子集：每个搜索节点都是一个答案。；组合总和：路径和达到目标时收集答案。；从数组中选择若干元素且不关心顺序的题。 [78 原题 ↗](https://leetcode.cn/problems/subsets/) · [39 原题 ↗](https://leetcode.cn/problems/combination-sum/)\n\n```cpp\nvoid subsetDfs(vector\u003cint>& nums,\n               int start,\n               vector\u003cint>& path,\n               vector\u003cvector\u003cint>>& ans) {\n    // 当前 path 本身就是一个子集，所以进入节点就收集。\n    ans.push_back(path);\n\n    for (int i = start; i \u003c (int)nums.size(); i++) {\n        // 做选择：把 nums[i] 放入当前路径。\n        path.push_back(nums[i]);\n\n        // 下一层只能从 i + 1 开始，保证不回头选，避免组合重复。\n        subsetDfs(nums, i + 1, path, ans);\n\n        // 撤销现场：移除刚才选择，让下一个 i 作为兄弟分支重新尝试。\n        path.pop_back();\n    }\n}\n```\n\n#### 代码 B：组合总和\n\n> **题目简述：** 39 组合总和：从互异正整数候选集中选数凑成目标值，每个数可重复使用，返回全部组合。 [力扣原题 ↗](https://leetcode.cn/problems/combination-sum/)\n\n```cpp\nvoid combinationSumDfs(vector\u003cint>& candidates,\n                       int start,\n                       int remain,\n                       vector\u003cint>& path,\n                       vector\u003cvector\u003cint>>& ans) {\n    if (remain == 0) {\n        ans.push_back(path);\n        return;\n    }\n\n    for (int i = start; i \u003c (int)candidates.size(); i++) {\n        if (candidates[i] > remain) {\n            continue; // 若已排序可改成 break，提前剪掉更大的候选。\n        }\n\n        path.push_back(candidates[i]);\n\n        // 可重复使用当前元素，所以仍传 i；不可重复时应传 i + 1。\n        combinationSumDfs(candidates, i, remain - candidates[i], path, ans);\n\n        path.pop_back();\n    }\n}\n```\n\n#### 易错点\n\n- 组合题每层从 0 开始枚举，写成排列题。\n- 可重复选择和不可重复选择混淆：可重复传 `i`，不可重复传 `i + 1`。\n- `path` 传值导致大量拷贝；应传引用并手动 push/pop。\n\n### 5.2 全排列模板\n\n#### 适用题型\n\n- 全排列。\n- 每个元素只能使用一次，但不同顺序代表不同答案的题。\n\n#### 核心思路\n\n排列关心顺序，每一层都可以从 0 到 `n - 1` 枚举候选。`used[i]` 表示 `nums[i]` 是否已出现在当前路径中。做选择时同时修改 `used` 和 `path`，撤销时必须按相反顺序恢复。\n\n#### 代码模板\n\n> **题目简述：** 本模板用于：全排列。；每个元素只能使用一次，但不同顺序代表不同答案的题。 [力扣原题 ↗](https://leetcode.cn/problems/permutations/)\n\n```cpp\nvoid permutationDfs(vector\u003cint>& nums,\n                    vector\u003cbool>& used,\n                    vector\u003cint>& path,\n                    vector\u003cvector\u003cint>>& ans) {\n    if (path.size() == nums.size()) {\n        ans.push_back(path);\n        return;\n    }\n\n    for (int i = 0; i \u003c (int)nums.size(); i++) {\n        if (used[i]) {\n            continue; // 当前路径已经使用过 nums[i]，不能重复使用。\n        }\n\n        used[i] = true;\n        path.push_back(nums[i]);\n\n        permutationDfs(nums, used, path, ans);\n\n        // 撤销现场：path 和 used 必须同时恢复，否则兄弟分支会被污染。\n        path.pop_back();\n        used[i] = false;\n    }\n}\n```\n\n#### 易错点\n\n- 忘记恢复 `used[i] = false`，导致后续分支少选元素。\n- 把排列题误用 `start`，会漏掉不同顺序的答案。\n- 含重复元素时只排序不做同层去重，仍会产生重复排列。\n\n### 5.3 按位置展开字符串模板\n\n#### 适用题型\n\n- 电话号码的字母组合。\n- 每一层候选由当前位置决定的字符串生成题。\n\n#### 核心思路\n\n`index` 表示当前处理输入的第几个字符。与组合题不同，候选集合由 `digits[index]` 映射出来。每一层必须推进到 `index + 1`，直到处理完所有位置。\n\n#### 代码模板\n\n> **题目简述：** 本模板用于：电话号码的字母组合。；每一层候选由当前位置决定的字符串生成题。 [力扣原题 ↗](https://leetcode.cn/problems/letter-combinations-of-a-phone-number/)\n\n```cpp\nclass Solution {\nprivate:\n    string letterMap[10] = {\n        \"\",     // 0\n        \"\",     // 1\n        \"abc\",  // 2\n        \"def\",  // 3\n        \"ghi\",  // 4\n        \"jkl\",  // 5\n        \"mno\",  // 6\n        \"pqrs\", // 7\n        \"tuv\",  // 8\n        \"wxyz\"  // 9\n    };\n    vector\u003cstring> result; // 最终的大账本\n    string path;           // 探险家当前的路径（选中的字母）\n    void backtracking(const string& digits, int index) {\n        if (index == digits.size()) {\n            result.push_back(path); \n            return;\n        }\n        int digit = digits[index] - '0';  \n        string letters = letterMap[digit]; \n        for (int i = 0; i \u003c letters.size(); i++) {\n            path.push_back(letters[i]);    \n            backtracking(digits, index + 1); \n            path.pop_back();             \n        }\n    }\npublic:\n    vector\u003cstring> letterCombinations(string digits) {\n        if (digits.empty()) return result;\n        backtracking(digits, 0);\n        return result;\n    }\n};\n```\n\n#### 易错点\n\n- 空输入没有特殊处理，可能返回包含空串的答案；实际题目通常空输入返回空数组。\n- `index` 不推进导致无限递归。\n- 把映射字符串拷贝到局部变量问题不大，但可用引用减少拷贝。\n\n### 5.4 合法序列生成模板\n\n#### 适用题型\n\n- 括号生成。\n- 需要在构造过程中保持前缀合法的序列题。\n\n#### 核心思路\n\n回溯不一定要等完整序列才判断合法。括号生成的核心不变量是：任意前缀中右括号数量不能超过左括号数量，左括号数量不能超过 `n`。剪枝发生在递归之前，搜索树会小很多。\n\n#### 代码模板\n\n> **题目简述：** 本模板用于：括号生成。；需要在构造过程中保持前缀合法的序列题。 [力扣原题 ↗](https://leetcode.cn/problems/generate-parentheses/)\n\n```cpp\nvoid generateParenthesisDfs(int n,\n                            int leftUsed,\n                            int rightUsed,\n                            string& path,\n                            vector\u003cstring>& ans) {\n    if ((int)path.size() == 2 * n) {\n        ans.push_back(path);\n        return;\n    }\n\n    if (leftUsed \u003c n) {\n        path.push_back('(');\n        generateParenthesisDfs(n, leftUsed + 1, rightUsed, path, ans);\n        path.pop_back();\n    }\n\n    if (rightUsed \u003c leftUsed) {\n        // 只有右括号数量少于左括号时，加入右括号后前缀仍合法。\n        path.push_back(')');\n        generateParenthesisDfs(n, leftUsed, rightUsed + 1, path, ans);\n        path.pop_back();\n    }\n}\n```\n\n#### 易错点\n\n- 只检查最终左右括号数量，不检查前缀合法性。\n- 右括号条件写成 `rightUsed \u003c n`，会生成非法前缀。\n- 做选择后忘记撤销，导致字符串路径串在一起。\n\n### 5.5 网格路径回溯模板\n\n#### 适用题型\n\n- 单词搜索。\n- 棋盘或矩阵中寻找一条满足条件的路径。\n- 当前路径不能重复使用同一格，但其他路径仍可使用的题。\n\n#### 核心思路\n\n网格路径题的访问标记只属于当前路径。进入格子时临时标记，递归探索邻居；无论失败还是提前成功返回，都必须恢复原字符，避免污染其他方向、其他起点。\n\n#### 代码模板\n\n> **题目简述：** 本模板用于：单词搜索。；棋盘或矩阵中寻找一条满足条件的路径。；当前路径不能重复使用同一格，但其他路径仍可使用的题。 [力扣原题 ↗](https://leetcode.cn/problems/word-search/)\n\n```cpp\nclass GridPathBacktrackingTemplate {\nprivate:\n    int dirs[4][2] = {{0, 1}, {0, -1}, {1, 0}, {-1, 0}};\n\n    bool dfs(vector\u003cvector\u003cchar>>& board, string& word, int r, int c, int index) {\n        // 返回值语义：从 (r,c) 出发，能否匹配 word[index...]。\n        int m = board.size(), n = board[0].size();\n        if (r \u003c 0 || r >= m || c \u003c 0 || c >= n || board[r][c] != word[index]) {\n            return false;\n        }\n        if (index == (int)word.size() - 1) {\n            return true;\n        }\n\n        char original = board[r][c];\n        board[r][c] = '#'; // 做选择：当前路径占用该格子。\n\n        for (auto [dr, dc] : dirs) {\n            if (dfs(board, word, r + dr, c + dc, index + 1)) {\n                board[r][c] = original; // 提前返回前也要撤销现场。\n                return true;\n            }\n        }\n\n        board[r][c] = original; // 撤销选择，恢复给兄弟分支和其他起点。\n        return false;\n    }\n\npublic:\n    bool exist(vector\u003cvector\u003cchar>>& board, string word) {\n        if (board.empty() || board[0].empty()) {\n            return false;\n        }\n        for (int r = 0; r \u003c (int)board.size(); r++) {\n            for (int c = 0; c \u003c (int)board[0].size(); c++) {\n                if (dfs(board, word, r, c, 0)) {\n                    return true;\n                }\n            }\n        }\n        return false;\n    }\n};\n```\n\n#### 易错点\n\n- 把单词搜索写成永久染色，导致后续路径不能复用格子。\n- 成功提前返回前忘记恢复现场。\n- `index == word.size() - 1` 的终止条件放在字符匹配之前，可能越界或误判。\n\n### 5.6 回文切分模板\n\n#### 适用题型\n\n- 分割回文串。\n- 枚举字符串所有合法切分方案。\n- 合法性查询可以预处理的切分题。\n\n#### 核心思路\n\n回文切分由一个回溯骨架加一个合法性查询优化组成。共同主线是：`index` 表示下一刀起点，枚举 `end`，如果 `s[index..end]` 合法，就选择这一段并递归到 `end + 1`。\n\n#### 代码模板：共同骨架\n\n> **题目简述：** 本模板用于：分割回文串。；枚举字符串所有合法切分方案。；合法性查询可以预处理的切分题。 [力扣原题 ↗](https://leetcode.cn/problems/palindrome-partitioning/)\n\n```cpp\nvoid palindromePartitionDfs(string& s,\n                            int index,\n                            vector\u003cvector\u003cbool>>& isPalindrome,\n                            vector\u003cstring>& path,\n                            vector\u003cvector\u003cstring>>& ans) {\n    if (index == (int)s.size()) {\n        ans.push_back(path);\n        return;\n    }\n\n    for (int end = index; end \u003c (int)s.size(); end++) {\n        if (!isPalindrome[index][end]) {\n            continue; // 变形点：合法性查询由预处理表 O(1) 提供。\n        }\n\n        path.push_back(s.substr(index, end - index + 1));\n        palindromePartitionDfs(s, end + 1, isPalindrome, path, ans);\n        path.pop_back();\n    }\n}\n```\n\n回文表是同一模板的“合法性查询加速器”：\n\n> **题目简述：** 本模板用于：分割回文串。；枚举字符串所有合法切分方案。；合法性查询可以预处理的切分题。 [力扣原题 ↗](https://leetcode.cn/problems/palindrome-partitioning/)\n\n```cpp\nvector\u003cvector\u003cbool>> buildPalindromeTable(string& s) {\n    int n = s.size();\n    vector\u003cvector\u003cbool>> isPalindrome(n, vector\u003cbool>(n, false));\n\n    for (int len = 1; len \u003c= n; len++) {\n        for (int left = 0; left + len - 1 \u003c n; left++) {\n            int right = left + len - 1;\n            isPalindrome[left][right] = s[left] == s[right] &&\n                                      (len \u003c= 2 || isPalindrome[left + 1][right - 1]);\n        }\n    }\n    return isPalindrome;\n}\n```\n\n#### 变形点对照\n\n| 部分 | 在共同骨架中的作用 | 代码差异 |\n|---|---|---|\n| 普通回溯切分 | 枚举下一刀 `end` | `path.push_back` 后递归 `end + 1` |\n| 回文判断 | 决定当前段能否选择 | 用 `isPalindrome[index][end]` 替代每次双指针扫描 |\n| wrapper | 初始化共享状态 | 先建回文表，再初始化 `path/ans` 调 DFS |\n\n```cpp\nvector\u003cvector\u003cstring>> partitionTemplate(string s) {\n    vector\u003cvector\u003cbool>> isPalindrome = buildPalindromeTable(s);\n    vector\u003cvector\u003cstring>> ans;\n    vector\u003cstring> path;\n    palindromePartitionDfs(s, 0, isPalindrome, path, ans);\n    return ans;\n}\n```\n\n#### 易错点\n\n- 每次递归都双指针判断回文，重复计算多。\n- 收集答案时没有保证 `index == s.size()`，导致未切完整字符串。\n- 撤销时忘记 `path.pop_back()`。\n- 回文表区间长度遍历顺序错误，导致 `isPalindrome[left + 1][right - 1]` 尚未计算。\n\n### 5.7 N 皇后棋盘约束模板\n\n#### 适用题型\n\n- N 皇后。\n- 一行/一列只能选一个位置，并带对角线或其他冲突约束的棋盘题。\n\n#### 核心思路\n\n递归层数就是当前行号，每行放一个皇后。用三组布尔数组记录列、主对角线、副对角线占用，避免每次扫描棋盘。做选择时同时改棋盘和三组占用，返回后完全恢复。\n\n#### 代码模板\n\n> **题目简述：** 本模板用于：N 皇后。；一行/一列只能选一个位置，并带对角线或其他冲突约束的棋盘题。 [力扣原题 ↗](https://leetcode.cn/problems/n-queens/)\n\n```cpp\nvoid nQueensDfs(int n,\n                int row,\n                vector\u003cstring>& board,\n                vector\u003cbool>& col,\n                vector\u003cbool>& diag1,\n                vector\u003cbool>& diag2,\n                vector\u003cvector\u003cstring>>& ans) {\n    if (row == n) {\n        ans.push_back(board);\n        return;\n    }\n\n    for (int c = 0; c \u003c n; c++) {\n        int d1 = row - c + n - 1; // 主对角线编号，平移避免负数。\n        int d2 = row + c;         // 副对角线编号。\n\n        if (col[c] || diag1[d1] || diag2[d2]) {\n            continue;\n        }\n\n        board[row][c] = 'Q';\n        col[c] = diag1[d1] = diag2[d2] = true;\n\n        nQueensDfs(n, row + 1, board, col, diag1, diag2, ans);\n\n        col[c] = diag1[d1] = diag2[d2] = false;\n        board[row][c] = '.';\n    }\n}\n```\n\n#### 易错点\n\n- 主对角线 `row - col` 可能为负，必须平移。\n- 只恢复棋盘，忘记恢复列或对角线占用。\n- 每次扫描整个棋盘判断冲突，代码复杂且效率低。\n\n## 6. 高频易错点清单\n\n| 易错点 | 典型题目 | 规避方式 |\n|---|---|---|\n| 组合题写成排列题 | `39`、`78` | 用 `start` 控制向后选择 |\n| 排列题忘记恢复 `used` | `46` | `used[i] = true` 和 `false` 成对出现 |\n| 可重复选择和不可重复选择混淆 | `39` | 可重复传 `i`，不可重复传 `i + 1` |\n| 括号生成只看总数不看前缀合法 | `22` | 任何时候右括号数量不能超过左括号 |\n| 网格搜索提前返回前没恢复字符 | `79` | 所有 return true 前先还原现场 |\n| 回文分割每次重复判断子串 | `131` | 预处理 `isPalindrome` 表 |\n| N 皇后对角线下标为负 | `51` | 主对角线用 `row - col + n - 1` |\n| 终止条件收集答案太早或太晚 | 多数回溯题 | 先定义“路径什么时候完整” |\n| path 传值导致性能差 | 多数回溯题 | 传引用，手动 push/pop |\n| 排序后去重漏掉同层条件 | 含重复元素变形 | 只跳过同一层前一个未使用的重复值 |\n\n## 7. 最短复盘口诀\n\n回溯题先画搜索树。组合子集用 `start`，排列用 `used`，括号看前缀合法，棋盘靠集合剪枝，网格路径进来标记出去恢复。做选择和撤销选择必须对称，剪枝越早越好。`78` 是子集母题，`46` 是排列母题，`39` 是组合母题，`22` 是合法序列母题，`51/79` 是状态恢复母题。\n\n\n\n================================================================================\n\n# 第9部分: 二分查找\n\n================================================================================\n\n> 目标：本文把 Hot100 中的有序数组、旋转数组、答案空间、二维矩阵和二分优化题抽象成若干“可复用模板”。复习时先判断单调性在哪里，再选择查值、查边界、查答案或查结构。\n\n## 1. 二分查找题的底层模型\n\n二分查找的本质是存在一个能把搜索空间分成两半的单调判断。每道二分题先问五个问题：\n\n| 问题 | 如果答案是“是” | 常用处理 |\n|---|---|---|\n| 数组整体有序吗 | 插入位置、左右边界、二维矩阵展平 | 标准左闭右开二分 |\n| 要找第一个满足条件的位置吗 | 搜索插入位置、左边界、答案最小值 | `if (check(mid)) right = mid` |\n| 要找最后一个满足条件的位置吗 | 右边界、最大可行答案 | `if (check(mid)) left = mid + 1` 后回看 |\n| 数组被旋转了吗 | 搜索旋转数组、寻找最小值 | 判断哪一半有序或和右端点比较 |\n| 单调性不在下标而在答案吗 | 寻找重复数、LIS、两个数组中位数 | 对值域、长度或切分位置二分 |\n\n二分题最重要的是明确 `check(x)` 的语义：\n\n| 二分类型 | `check(x)` 含义 | 代表题 |\n|---|---|---|\n| 查值 | `nums[mid]` 和 `target` 的大小关系 | `35`、`74` |\n| 查边界 | 位置 `mid` 是否已经达到目标区间 | `34` |\n| 查旋转结构 | `mid` 落在哪个有序半区或最小值在哪边 | `33`、`153` |\n| 查答案空间 | 答案不超过或至少为 `mid` 是否可行 | `287`、`300` |\n| 查分割线 | 左半部分最大值是否不大于右半部分最小值 | `4` |\n\n## 2. Hot100 二分查找题型地图\n\n\n| 题型 | 题目 | 抽象能力 | 一句话记忆 |\n|---|---|---|---|\n| 标准 lower_bound | `35 搜索插入位置` | 找第一个 `>= target` 的位置 | 左闭右开最稳定 |\n| 左右边界 | `34 在排序数组中查找范围` | 两次 lower_bound | 左边界找 `target`，右边界找 `target + 1` 再减一 |\n| 旋转数组查值 | `33 搜索旋转排序数组` | 判断哪半边有序 | 每轮至少有一半是有序的 |\n| 旋转数组最小值 | `153 寻找旋转排序数组中的最小值` | 和右端点比较最小值在哪边 | `nums[mid] > nums[right]` 说明最小值在右边 |\n| 二维矩阵展平 | `74 搜索二维矩阵` | 一维下标映射二维坐标 | `mid / n` 和 `mid % n` |\n| 行列有序矩阵 | `240 搜索二维矩阵 II` | 阶梯排除或分治缩区间 | 从右上角开始，大左小下 |\n| 值域二分 | `287 寻找重复数` | 对数值范围做计数判断 | `\u003c= mid` 的个数过多，重复数在左半值域 |\n| 二分优化 DP | `300 最长递增子序列` | `tails[len]` 维护长度的最小尾值 | 维护每个长度的最优尾巴，不代表最终序列 |\n| 双数组分割 | `4 寻找两个正序数组的中位数` | 二分短数组切分点 | 左半最大不大于右半最小 |\n\n## 3. 复习顺序建议\n\n建议按“基础边界 → 旋转结构 → 矩阵结构 → 答案空间 → 双数组切分”的顺序复习：\n\n1. `35 搜索插入位置`：先把左闭右开 lower_bound 写熟。\n2. `34 查找第一个和最后一个位置`：练两次 lower_bound。\n3. `74 搜索二维矩阵`：把下标二分扩展到二维坐标。\n4. `33 搜索旋转排序数组`：练“哪一半有序”的判断。\n5. `153 寻找最小值`：练和右端点比较的结构二分。\n6. `240 搜索二维矩阵 II`：理解二维单调结构不一定能展平。\n7. `287 寻找重复数`：掌握值域二分，不改数组。\n8. `300 最长递增子序列`：掌握 tails 数组和 lower_bound。\n9. `4 两个正序数组中位数`：最后攻克分割线二分。\n\n## 4. 关键套路详解\n\n### 4.1 左开右开模板优先级最高\n\n本专题统一使用左开右开区间 `(left, right)`。这里的 `left` 和 `right` 都作为两侧哨兵，位于当前未知区间外：\n\n```text\nleft  : 已确认不满足条件的位置，初始为 -1\nright : 已确认满足条件的位置，初始为 n\n(left, right) : 仍然未知、需要继续二分的区间\n```\n\n循环条件固定写 `left + 1 \u003c right`。每次计算 `mid` 后，只把 `mid` 变成新的哨兵：`right = mid` 或 `left = mid`。循环结束时 `left + 1 == right`，`right` 就是第一个满足条件的位置。\n\n`35` 是母题：找第一个 `nums[i] >= target` 的位置。如果这个位置等于 `n`，说明 target 应插入末尾。\n\n### 4.2 边界题不要写复杂分支\n\n`34` 可以拆成两个左开右开 lower_bound：\n\n```text\nleftBoundary  = 第一个 >= target 的位置\nrightBoundary = 第一个 > target 的位置 - 1\n```\n\n目标不存在时，`lowerBound` 仍会返回插入位置，所以必须验证 `start \u003c n && nums[start] == target`。\n\n### 4.3 旋转数组也能用哨兵思维\n\n`153` 寻找最小值可以转化为：找第一个 `nums[i] \u003c= nums[n - 1]` 的位置。旋转后右半段都不大于最后一个元素，左半段都大于最后一个元素，因此 `check(i) = nums[i] \u003c= nums[n - 1]` 具有单调性。\n\n`33` 搜索目标不能套普通 lower_bound，因为数组整体缺少全局有序性。它仍可以写成左开右开边界更新，但每轮要先判断 `mid` 落在左侧有序段还是右侧有序段，再决定目标是否在可保留区间。\n\n### 4.4 二维矩阵不能随便展平\n\n`74` 可以展平，因为每行最后一个小于下一行第一个，整体全局有序。`240` 不能展平，因为行列分别有序不等于一维全局有序。`240` 常从右上角阶梯搜索，每次排除一整行或一整列。\n\n### 4.5 值域二分是在答案上找边界\n\n`287 寻找重复数` 不查数组下标，而是在值域 `[1, n]` 上找最小满足“左侧值域已经装不下”的值。统计 `\u003c= mid` 的个数，如果个数大于 `mid`，说明重复数在 `[1, mid]`。\n\n### 4.6 LIS 的 tails 数组表示最优尾值\n\n`300` 中 `tails[i]` 表示长度为 `i + 1` 的递增子序列的最小可能尾值。每个元素 `x` 用左开右开 lower_bound 找第一个 `>= x` 的尾值位置并替换。严格递增用 lower_bound，非递减通常用 upper_bound。\n\n### 4.7 双数组中位数是在找合法切分\n\n`4` 在较短数组上找切分点 `i`，让两个数组左半元素数量满足要求，并满足：\n\n```text\nmaxLeftA \u003c= minRightB && maxLeftB \u003c= minRightA\n```\n\n它可以保留闭区间切分写法，因为搜索空间是切分点 `[0, m]`，核心在于调整 `i` 直到分割线合法。\n\n## 5. 抽象代码模板\n\n下面模板统一以左开右开 `(left, right)` 为主。复习时先判断能否定义“第一个满足条件的位置”；能定义时使用哨兵 lower_bound，不能定义时再考虑旋转结构、阶梯搜索或双数组切分。\n\n### 5.1 左开右开 lower_bound 母模板\n\n#### 适用题型\n\n- `35 搜索插入位置`：找第一个 `>= target` 的位置。\n- `34 在排序数组中查找元素的第一个和最后一个位置`。\n- `74 搜索二维矩阵`：展平成一维后找第一个 `>= target` 的位置。\n- `300 最长递增子序列`：在 `tails` 中找第一个 `>= x` 的尾值位置。\n\n#### 核心思路\n\n左开右开模板维护两个哨兵：`left` 永远表示“不满足”的一侧，`right` 永远表示“满足”的一侧。未知区间是 `(left, right)`，因此循环条件是 `left + 1 \u003c right`。每轮只把 `mid` 归类到某个哨兵，不能写成 `mid + 1` 或 `mid - 1`，否则会破坏哨兵语义。\n\n#### 代码模板：共同骨架\n\n> **题目简述：** 本模板覆盖：35 搜索插入位置（在升序无重复数组中查找目标值，返回其下标或应插入的位置。）；34 在排序数组中查找元素的第一个和最后一个位置（在升序数组中返回目标值的首尾下标，不存在时返回 [-1, -1]。）；74 搜索二维矩阵（矩阵每行升序且下一行首项大于上一行末项，判断目标值是否存在。）；300 最长递增子序列（给定整数数组，求保持原有次序但不必连续的最长严格递增子序列长度。） [34 原题 ↗](https://leetcode.cn/problems/find-first-and-last-position-of-element-in-sorted-array/) · [35 原题 ↗](https://leetcode.cn/problems/search-insert-position/) · [74 原题 ↗](https://leetcode.cn/problems/search-a-2d-matrix/) · [300 原题 ↗](https://leetcode.cn/problems/longest-increasing-subsequence/)\n\n```cpp\n#include \u003cbits/stdc++.h>\nusing namespace std;\n\n// 母模板：在虚拟下标 [0, n) 中找第一个满足 check(i) 的位置。\n// left 和 right 是开区间两侧的哨兵，不属于未知区间本身。\ntemplate \u003cclass Check>\nint firstTrueByOpenInterval(int n, Check check) {\n    int left = -1; // 哨兵：已确认不满足 check 的位置。\n    int right = n; // 哨兵：已确认满足 check 的位置；n 表示可能不存在。\n\n    while (left + 1 \u003c right) {\n        int mid = left + (right - left) / 2;\n        if (check(mid)) {\n            right = mid; // mid 已满足，保留 mid，继续向左找第一个满足位置。\n        } else {\n            left = mid;  // mid 不满足，保留 mid 作为新的左哨兵。\n        }\n    }\n\n    return right;\n}\n\nint lowerBoundOpen(const vector\u003cint>& nums, int target) {\n    int left = -1;\n    int right = (int)nums.size();\n\n    while (left + 1 \u003c right) {\n        int mid = left + (right - left) / 2;\n        if (nums[mid] >= target) {\n            right = mid; // 第一个 >= target 可能就是 mid。\n        } else {\n            left = mid;  // nums[mid] \u003c target，mid 及左侧都可排除。\n        }\n    }\n\n    return right;\n}\n\nint searchInsert(vector\u003cint>& nums, int target) {\n    // LeetCode 35：如果 target 大于所有元素，right 会停在 nums.size()。\n    return lowerBoundOpen(nums, target);\n}\n```\n\n#### 变形点对照\n\n| 题型 | `check(mid)` 含义 | 返回值使用方式 |\n|---|---|---|\n| 搜索插入位置 `35` | `nums[mid] >= target` | 直接返回 `right` |\n| 左边界 `34` | `nums[mid] >= target` | 返回后验证 `nums[right] == target` |\n| 右边界 `34` | `nums[mid] > target` | 返回 `right - 1` |\n| LIS `300` | `tails[mid] >= x` | `right` 是替换位置 |\n\n#### 易错点\n\n- 初始必须是 `left = -1, right = n`，避免写成 `left = 0, right = n`。\n- 循环条件必须是 `left + 1 \u003c right`，避免写成 `left \u003c right`。\n- 更新必须是 `left = mid` 或 `right = mid`，不要写 `mid + 1` / `mid - 1`。\n- 返回的是右哨兵 `right`，它可能等于 `n`，调用方需要判断越界。\n\n### 5.2 左右边界：两次左开右开 lower_bound\n\n#### 适用题型\n\n- `34 在排序数组中查找元素的第一个和最后一个位置`。\n- 统计有序数组中某个值出现次数。\n- 需要查 `[target, target]`、`[low, high]` 这类值域边界的有序数组题。\n\n#### 核心思路\n\n左边界是第一个 `>= target` 的位置；右边界是第一个 `> target` 的位置减一。这样可以避免写命中后向两边扩散，也避免目标不存在时的复杂分支。唯一必须做的是：先验证左边界确实命中目标。\n\n#### 代码模板：共同骨架\n\n> **题目简述：** 34 在排序数组中查找元素的第一个和最后一个位置：在升序数组中返回目标值的首尾下标，不存在时返回 [-1, -1]。 [力扣原题 ↗](https://leetcode.cn/problems/find-first-and-last-position-of-element-in-sorted-array/)\n\n```cpp\nint upperBoundOpen(const vector\u003cint>& nums, int target) {\n    int left = -1;\n    int right = (int)nums.size();\n\n    while (left + 1 \u003c right) {\n        int mid = left + (right - left) / 2;\n        if (nums[mid] > target) {\n            right = mid; // 第一个 > target 可能就是 mid。\n        } else {\n            left = mid;  // nums[mid] \u003c= target，还在目标区间左侧或内部。\n        }\n    }\n\n    return right;\n}\n\nvector\u003cint> searchRange(vector\u003cint>& nums, int target) {\n    int start = lowerBoundOpen(nums, target);\n\n    // lower_bound 只保证插入位置，不保证 target 存在。\n    if (start == (int)nums.size() || nums[start] != target) {\n        return {-1, -1};\n    }\n\n    int end = upperBoundOpen(nums, target) - 1;\n    return {start, end};\n}\n```\n\n#### 变形点对照\n\n| 需求 | 写法 | 说明 |\n|---|---|---|\n| 找第一个等于 target | `lowerBoundOpen(nums, target)` | 返回后必须验证 |\n| 找最后一个等于 target | `upperBoundOpen(nums, target) - 1` | 不用 `target + 1`，避免溢出 |\n| 统计出现次数 | `upper - lower` | 若目标不存在结果自然为 0 |\n\n#### 易错点\n\n- 目标不存在时不能直接返回 `{start, upper - 1}`。\n- 用 `target + 1` 找右边界可能在极值时溢出，`upperBoundOpen` 更稳。\n- `upperBoundOpen` 的判断是 `nums[mid] > target`，避免写成 `>=`。\n\n### 5.3 二维矩阵展平搜索\n\n#### 适用题型\n\n- `74 搜索二维矩阵`。\n- 每行升序且上一行最后一个小于下一行第一个的矩阵。\n- 可以把二维坐标视为虚拟一维有序数组的题。\n\n#### 核心思路\n\n如果矩阵满足全局有序，就可以把下标 `idx` 映射为 `matrix[idx / n][idx % n]`，再用左开右开 lower_bound 找第一个 `>= target` 的位置。搜索结束后同样要检查 `right` 是否越界以及值是否等于目标。\n\n#### 代码模板：共同骨架\n\n> **题目简述：** 74 搜索二维矩阵：矩阵每行升序且下一行首项大于上一行末项，判断目标值是否存在。 [力扣原题 ↗](https://leetcode.cn/problems/search-a-2d-matrix/)\n\n```cpp\nbool searchFlattenedSortedMatrix(vector\u003cvector\u003cint>>& matrix, int target) {\n    if (matrix.empty() || matrix[0].empty()) return false;\n\n    int m = (int)matrix.size();\n    int n = (int)matrix[0].size();\n    int total = m * n;\n\n    int left = -1;\n    int right = total;\n\n    while (left + 1 \u003c right) {\n        int mid = left + (right - left) / 2;\n        int value = matrix[mid / n][mid % n];\n\n        if (value >= target) {\n            right = mid;\n        } else {\n            left = mid;\n        }\n    }\n\n    return right \u003c total && matrix[right / n][right % n] == target;\n}\n```\n\n#### 变形点对照\n\n| 题型 | 是否可展平 | 处理方式 |\n|---|---|---|\n| `74 搜索二维矩阵` | 可以 | `idx / n`、`idx % n` 映射后 lower_bound |\n| `240 搜索二维矩阵 II` | 不可以 | 行列分别有序但不全局有序，用阶梯搜索 |\n\n#### 易错点\n\n- 展平前必须确认矩阵是全局有序，而不只是行列分别有序。\n- `right` 可能等于 `m * n`，访问前必须判断。\n- 坐标映射中除数和模数都是列数 `n`。\n\n### 5.4 旋转数组：搜索目标与寻找最小值\n\n#### 适用题型\n\n- `153 寻找旋转排序数组中的最小值`。\n- `33 搜索旋转排序数组`。\n- 有重复值的旋转数组变形。\n\n#### 核心思路\n\n`153` 可以转成标准左开右开二分：找第一个 `nums[i] \u003c= nums[n - 1]` 的位置。因为旋转数组左半段大于最后一个元素，右半段小于等于最后一个元素，单调性来自“是否已经进入右半段”。\n\n`33` 的目标搜索不能套普通 lower_bound，也不能只比较 `nums[mid]` 和 `target`。每轮先判断 `mid` 在左侧有序段还是右侧有序段，再判断 target 是否与 `mid` 位于同一可保留半区。\n\n#### 代码 A：寻找旋转数组最小值\n\n> **题目简述：** 153 寻找旋转排序数组中的最小值：给定元素互异且旋转过的升序数组，以对数时间找出其中最小元素。 [力扣原题 ↗](https://leetcode.cn/problems/find-minimum-in-rotated-sorted-array/)\n\n```cpp\nint findMinInRotatedArray(vector\u003cint>& nums) {\n    int n = (int)nums.size();\n    int left = -1;\n    int right = n;\n\n    while (left + 1 \u003c right) {\n        int mid = left + (right - left) / 2;\n\n        if (nums[mid] > nums[n - 1]) {\n            left = mid;  // mid 仍在左侧较大有序段，最小值在右边。\n        } else {\n            right = mid; // mid 已进入右侧较小有序段，可能就是最小值。\n        }\n    }\n\n    return nums[right];\n}\n```\n\n#### 代码 B：搜索旋转排序数组\n\n> **题目简述：** 33 搜索旋转排序数组：在元素互异的旋转升序数组中查找目标值，返回下标或 -1。 [力扣原题 ↗](https://leetcode.cn/problems/search-in-rotated-sorted-array/)\n\n```cpp\nint searchInRotatedArray(vector\u003cint>& nums, int target) {\n    if (nums.empty()) return -1;\n\n    int n = (int)nums.size();\n    int left = -1;\n    int right = n;\n\n    while (left + 1 \u003c right) {\n        int mid = left + (right - left) / 2;\n        if (nums[mid] == target) return mid;\n\n        if (nums[mid] >= nums[0]) {\n            // mid 在左侧有序段。只有 target 也在左段且小于 nums[mid]，才保留左侧。\n            if (target >= nums[0] && target \u003c nums[mid]) {\n                right = mid;\n            } else {\n                left = mid;\n            }\n        } else {\n            // mid 在右侧有序段。只有 target 也在右段且大于 nums[mid]，才保留右侧。\n            if (target > nums[mid] && target \u003c= nums[n - 1]) {\n                left = mid;\n            } else {\n                right = mid;\n            }\n        }\n    }\n\n    return -1;\n}\n```\n\n#### 变形点对照\n\n| 题型 | 每轮判断什么 | 边界更新差异 |\n|---|---|---|\n| 找最小值 `153` | `nums[mid] > nums[n - 1]` 是否仍在左段 | 左段则 `left = mid`，右段则 `right = mid` |\n| 搜索目标 `33` | `mid` 在哪段，target 是否落在应保留段 | 命中直接返回，否则用哨兵收缩 |\n| 有重复找最小值 | `nums[mid] == nums[right]` 时方向不确定 | 通常只能安全 `right--`，最坏 O(n) |\n\n#### 易错点\n\n- `153` 中 `right` 最终是最小值下标，返回 `nums[right]`。\n- `33` 不能把 `nums[mid] >= nums[0]` 写成普通有序数组比较。\n- 有重复值时，`nums[mid] == nums[right]` 会破坏单调判断，需要单独处理。\n\n### 5.5 值域二分与可行性二分\n\n#### 适用题型\n\n- `287 寻找重复数`：对答案值域 `[1, n]` 二分。\n- 最小可行速度、最小容量、最少天数等答案空间题。\n- 最大可行值类题，需要返回最后一个满足条件的位置。\n\n#### 核心思路\n\n值域二分查答案值，区分于数组下标。最小可行值仍然可以使用左开右开哨兵：左边界表示“不可行”，右边界表示“可行”。最大可行值也能用对称写法：左边界表示“可行”，右边界表示“不可行”，最终返回 `left`。\n\n#### 代码模板：共同骨架\n\n> **题目简述：** 287 寻找重复数：长度 N+1 的数组仅含 1 至 N，找出重复数且不能修改数组、额外空间为常数。 [力扣原题 ↗](https://leetcode.cn/problems/find-the-duplicate-number/)\n\n```cpp\ntemplate \u003cclass Check>\nint binarySearchMinFeasibleOpen(int lowImpossible, int highPossible, Check check) {\n    // left 是不可行哨兵，right 是可行哨兵。\n    int left = lowImpossible;\n    int right = highPossible;\n\n    while (left + 1 \u003c right) {\n        int mid = left + (right - left) / 2;\n        if (check(mid)) {\n            right = mid; // mid 已可行，继续找更小可行值。\n        } else {\n            left = mid;  // mid 不可行，只能增大答案。\n        }\n    }\n\n    return right;\n}\n\ntemplate \u003cclass Check>\nint binarySearchMaxFeasibleOpen(int lowPossible, int highImpossible, Check check) {\n    // left 是可行哨兵，right 是不可行哨兵。\n    int left = lowPossible;\n    int right = highImpossible;\n\n    while (left + 1 \u003c right) {\n        int mid = left + (right - left) / 2;\n        if (check(mid)) {\n            left = mid;  // mid 可行，继续找更大可行值。\n        } else {\n            right = mid; // mid 不可行，答案在左边。\n        }\n    }\n\n    return left;\n}\n\nint findDuplicateByValueBinarySearch(vector\u003cint>& nums) {\n    int n = (int)nums.size() - 1;\n    int left = 0;  // 值域从 1 开始，0 是不可行哨兵。\n    int right = n; // 重复数一定在 [1, n]，right 初始为可行上界。\n\n    while (left + 1 \u003c right) {\n        int mid = left + (right - left) / 2;\n\n        int countLessEqual = 0;\n        for (int x : nums) {\n            if (x \u003c= mid) countLessEqual++;\n        }\n\n        if (countLessEqual > mid) {\n            right = mid; // [1, mid] 的元素个数过多，重复数在左半值域。\n        } else {\n            left = mid;  // 左半值域没有重复压力，重复数在右半值域。\n        }\n    }\n\n    return right;\n}\n```\n\n#### 变形点对照\n\n| 题型 | 哨兵语义 | check 为真时 | 返回值 |\n|---|---|---|---|\n| 最小可行值 | `left` 不可行，`right` 可行 | `right = mid` | `right` |\n| 最大可行值 | `left` 可行，`right` 不可行 | `left = mid` | `left` |\n| 寻找重复数 `287` | `countLessEqual > mid` 表示左半存在重复压力 | `right = mid` | `right` |\n\n#### 易错点\n\n- 值域二分返回答案值，区分于数组下标。\n- 必须先证明 `check(mid)` 具有单调性，再套模板。\n- `287` 中 `countLessEqual > mid` 来自抽屉原理，不能按普通排序比较理解。\n\n### 5.6 LIS 的左开右开 lower_bound 优化\n\n#### 适用题型\n\n- `300 最长递增子序列`。\n- 俄罗斯套娃信封排序后一维 LIS。\n- 需要维护“某个长度的最小可能尾值”的序列题。\n\n#### 核心思路\n\n`tails[i]` 表示长度为 `i + 1` 的严格递增子序列的最小可能尾值。每来一个 `x`，在 `tails` 中用左开右开 lower_bound 找第一个 `>= x` 的位置：如果位置等于 `tails.size()`，说明可以扩展长度；否则替换更小尾值，为后续元素留下更多空间。\n\n#### 代码模板：共同骨架\n\n> **题目简述：** 300 最长递增子序列：给定整数数组，求保持原有次序但不必连续的最长严格递增子序列长度。 [力扣原题 ↗](https://leetcode.cn/problems/longest-increasing-subsequence/)\n\n```cpp\nint lengthOfLisByOpenInterval(vector\u003cint>& nums) {\n    vector\u003cint> tails;\n\n    for (int x : nums) {\n        int left = -1;\n        int right = (int)tails.size();\n\n        while (left + 1 \u003c right) {\n            int mid = left + (right - left) / 2;\n            if (tails[mid] >= x) {\n                right = mid; // 第一个 >= x 的尾值可以被 x 替换。\n            } else {\n                left = mid;  // tails[mid] \u003c x，x 可以接在该长度后面。\n            }\n        }\n\n        if (right == (int)tails.size()) {\n            tails.push_back(x);\n        } else {\n            tails[right] = x;\n        }\n    }\n\n    return (int)tails.size();\n}\n```\n\n#### 变形点对照\n\n| 题型 | 二分条件 | 说明 |\n|---|---|---|\n| 严格递增 LIS | `tails[mid] >= x` | lower_bound，避免相等元素扩展长度 |\n| 非递减 LIS | `tails[mid] > x` | upper_bound，相等元素允许接上 |\n| 俄罗斯套娃信封 | 宽升序、高降序后对高做 LIS | 高降序避免相同宽度互相嵌套 |\n\n#### 易错点\n\n- `tails` 表示最小尾值，不能直接输出为最终子序列。\n- 严格递增用 `>= x` 找替换位置，非递减才用 `> x`。\n- 替换尾值不会改变已有最优长度，只是优化未来可扩展性。\n\n### 5.7 行列有序矩阵：用阶梯搜索\n\n#### 适用题型\n\n- `240 搜索二维矩阵 II`。\n- 行升序、列升序，但不满足全局一维有序的矩阵。\n- 每次可以排除一整行或一整列的二维单调结构。\n\n#### 核心思路\n\n从右上角开始：当前值大于目标时，当前列从当前位置往下都更大，可以排除这一列；当前值小于目标时，当前行从左到当前位置都更小，可以排除这一行。这属于利用单调结构缩小搜索空间，思路接近二分但模板不同。\n\n#### 代码模板：共同骨架\n\n> **题目简述：** 240 搜索二维矩阵 II：给定每行和每列均升序的矩阵，判断指定目标值是否存在。 [力扣原题 ↗](https://leetcode.cn/problems/search-a-2d-matrix-ii/)\n\n```cpp\nbool searchRowColSortedMatrix(vector\u003cvector\u003cint>>& matrix, int target) {\n    if (matrix.empty() || matrix[0].empty()) return false;\n\n    int m = (int)matrix.size();\n    int n = (int)matrix[0].size();\n    int row = 0;\n    int col = n - 1;\n\n    while (row \u003c m && col >= 0) {\n        int value = matrix[row][col];\n        if (value == target) return true;\n\n        if (value > target) {\n            col--; // 排除当前列：这一列从 row 往下都 >= value > target。\n        } else {\n            row++; // 排除当前行：这一行从 0 到 col 都 \u003c= value \u003c target。\n        }\n    }\n\n    return false;\n}\n```\n\n#### 变形点对照\n\n| 起点 | 当前值过大 | 当前值过小 | 说明 |\n|---|---|---|---|\n| 右上角 | 左移 | 下移 | 最常用写法 |\n| 左下角 | 上移 | 右移 | 对称写法 |\n\n#### 易错点\n\n- `240` 不能像 `74` 一样展平。\n- 从右上角出发时，大了左移，小了下移，方向不要反。\n- 循环条件是 `row \u003c m && col >= 0`。\n\n### 5.8 两个有序数组的分割线二分\n\n#### 适用题型\n\n- `4 寻找两个正序数组的中位数`。\n- 两个有序数组合并后的第 k 小。\n- 对两个有序序列寻找合法左右分割。\n\n#### 核心思路\n\n只在较短数组上二分切分点 `i`，另一个数组切分点 `j` 由左半元素总数决定。合法分割满足 `maxLeftA \u003c= minRightB` 且 `maxLeftB \u003c= minRightA`。边界切空时用 `INT_MIN/INT_MAX` 哨兵，避免访问越界。\n\n#### 代码模板：共同骨架\n\n> **题目简述：** 4 寻找两个正序数组的中位数：给定两个正序数组，求合并后的中位数，并满足对数级时间复杂度。 [力扣原题 ↗](https://leetcode.cn/problems/median-of-two-sorted-arrays/)\n\n```cpp\ndouble findMedianTwoSortedArrays(vector\u003cint>& a, vector\u003cint>& b) {\n    if (a.size() > b.size()) {\n        return findMedianTwoSortedArrays(b, a);\n    }\n\n    int m = (int)a.size();\n    int n = (int)b.size();\n    int half = (m + n + 1) / 2; // 奇数时左半多一个。\n    int left = 0;\n    int right = m;\n\n    while (left \u003c= right) {\n        int i = left + (right - left) / 2;\n        int j = half - i;\n\n        int aLeft = (i == 0) ? INT_MIN : a[i - 1];\n        int aRight = (i == m) ? INT_MAX : a[i];\n        int bLeft = (j == 0) ? INT_MIN : b[j - 1];\n        int bRight = (j == n) ? INT_MAX : b[j];\n\n        if (aLeft \u003c= bRight && bLeft \u003c= aRight) {\n            int leftMax = max(aLeft, bLeft);\n            if ((m + n) % 2 == 1) {\n                return leftMax;\n            }\n            int rightMin = min(aRight, bRight);\n            return ((long long)leftMax + rightMin) / 2.0;\n        }\n\n        if (aLeft > bRight) {\n            right = i - 1; // a 左边拿太多了。\n        } else {\n            left = i + 1;  // a 左边拿太少了。\n        }\n    }\n\n    return 0.0; // 正常有序输入不会走到这里。\n}\n```\n\n#### 变形点对照\n\n| 题型 | 搜索空间 | 判断条件 |\n|---|---|---|\n| 两数组中位数 | 较短数组切分点 `i` | 左半最大值不大于右半最小值 |\n| 两数组第 k 小 | 第一个数组取几个元素 | 左侧总数固定为 k |\n\n#### 易错点\n\n- 必须在较短数组上二分，保证 `j` 不越界。\n- 奇数总长度返回左半最大值，偶数返回两边中间值平均。\n- `leftMax + rightMin` 可能溢出，求平均前转 `long long`。\n\n## 6. 高频易错点清单\n\n| 易错点 | 典型题目 | 规避方式 |\n|---|---|---|\n| 把左开右开写成左闭右开 | `35`、`34` | 固定 `left = -1, right = n`，循环 `left + 1 \u003c right` |\n| 更新成 `mid + 1` 或 `mid - 1` | 所有左开右开模板 | 哨兵模板只写 `left = mid` 或 `right = mid` |\n| 返回错哨兵 | lower_bound 类 | 找第一个满足条件返回 `right` |\n| 找边界后没有验证目标存在 | `34` | 返回前检查 `start \u003c n && nums[start] == target` |\n| 展平矩阵坐标映射错误 | `74` | `row = idx / n`、`col = idx % n` |\n| 把行列有序矩阵当全局有序 | `240` | 只能阶梯搜索或分治，不能展平二分 |\n| 旋转最小值没有定义单调条件 | `153` | 找第一个 `nums[i] \u003c= nums[n - 1]` 的位置 |\n| 旋转数组搜索目标当普通 lower_bound | `33` | 先判断 `mid` 在左段还是右段 |\n| 值域二分误以为返回下标 | `287` | 返回的是答案值，不能当下标 |\n| LIS 把 tails 当真实子序列 | `300` | tails 只维护最小尾值，不保证来自同一条实际序列 |\n| 两数组中位数没选短数组二分 | `4` | 递归或交换保证 `m \u003c= n` |\n| 分割线边界访问越界 | `4` | 切空时用 `INT_MIN` 和 `INT_MAX` |\n\n## 7. 最短复盘口诀\n\n二分先找单调性，再定义 `check(mid)`。基础题统一左开右开：`left` 是不满足哨兵，`right` 是满足哨兵，循环 `left + 1 \u003c right`，更新只写 `left = mid` 或 `right = mid`。边界题做两次 lower_bound；旋转最小值找第一个进入右段的位置；二维矩阵全局有序才能展平，行列有序走阶梯；答案空间二分返回值；LIS 的 `tails` 是最小尾值，双数组中位数是找合法分割线。\n\n================================================================================\n\n# 第10部分: 单调栈\n\n================================================================================\n\n> 目标：本文把 Hot100 中的单调栈题抽象成“找最近更大/更小边界”的统一模型。复习时先判断维护递增还是递减，再确定出栈时结算距离、面积还是蓄水量。\n\n## 1. 单调栈题的底层模型\n\n单调栈解决的是“某个元素左右两侧第一个比它大或小的位置”。每道题先问五个问题：\n\n| 问题            | 如果答案是“是”     | 常用处理                            |\n| ------------- | ------------ | ------------------------------- |\n| 是否要找右侧第一个更大元素 | 每日温度、下一个更大元素 | 维护单调递减栈，新元素更大时出栈结算              |\n| 是否要找右侧第一个更小元素 | 柱状图最大矩形、边界压缩 | 维护单调递增栈，新元素更小时出栈结算              |\n| 出栈元素是否需要左边界   | 柱状图宽度、接雨水宽度  | 出栈后新的栈顶就是左边界                    |\n| 末尾是否还有元素没结算   | 柱状图最大矩形      | 在数组两端加哨兵或末尾补 0                  |\n| 相等元素如何处理      | 重复高度、重复温度    | 根据边界是否允许合并决定用 `>`、`>=`、`\u003c`、`\u003c=` |\n\n单调栈的关键在于：出栈那一刻，栈顶元素的右边界已经被当前元素确定，左边界由出栈后的新栈顶确定。\n\n| 维护方式 | 栈内含义 | 触发出栈 | 代表题 |\n|---|---|---|---|\n| 单调递减栈 | 从栈底到栈顶值递减 | 当前值更大 | `739 每日温度` |\n| 单调递增栈 | 从栈底到栈顶值递增 | 当前值更小 | `84 柱状图最大矩形` |\n| 凹槽递减栈 | 保留可能成为左墙的高度 | 当前高度高于槽底 | `42 接雨水` |\n\n## 2. Hot100 单调栈题型地图\n\n\n| 题型 | 题目 | 抽象能力 | 一句话记忆 |\n|---|---|---|---|\n| 下一个更大元素 | `739 每日温度` | 出栈时确定右侧第一个更高温度 | 当前温度让栈顶等待结束 |\n| 最近更小边界 | `84 柱状图中最大的矩形` | 以出栈柱为最矮柱计算最大宽度 | 当前更矮柱子切断右边界 |\n| 凹槽蓄水 | `42 接雨水` | 左墙、槽底、右墙共同结算水量 | 栈顶出栈是槽底，新栈顶是左墙 |\n\n## 3. 复习顺序建议\n\n建议按“边界最简单 → 宽度边界 → 双墙结算”的顺序复习：\n\n1. `739 每日温度`：只需要右侧第一个更大元素，最适合入门。\n2. `84 柱状图中最大的矩形`：理解出栈元素的左边界和右边界。\n3. `42 接雨水`：理解出栈元素代表凹槽底部。\n4. 回头比较 `84` 和 `42`：二者都用当前元素作为右边界，但结算公式完全不同。\n5. 总结相等高度处理：`84` 可用严格递增或非严格递增，但要保持宽度定义一致；`739` 必须是更高温度，不能用相等温度结算。\n\n## 4. 关键套路详解\n\n### 4.1 单调栈一般存下标，不只存值\n\nHot100 的单调栈题几乎都要计算距离或宽度，因此栈里应保存下标。值可以通过 `nums[index]` 取到，下标还能计算 `i - j`、`right - left - 1` 这类答案。\n\n| 题目 | 出栈时需要什么 | 为什么存下标 |\n|---|---|---|\n| `739` | 等待天数 `i - j` | 需要温度差对应的位置差 |\n| `84` | 矩形宽度 `right - left - 1` | 需要左右边界位置 |\n| `42` | 凹槽宽度 `right - left - 1` | 需要左右墙之间的距离 |\n\n### 4.2 找下一个更大：维护递减栈\n\n`739 每日温度` 中，栈里保存还没找到更高温度的日期。栈内温度从底到顶递减。当今天温度高于栈顶日期温度时，栈顶日期的答案就确定了：今天就是它右侧第一个更高温度。\n\n这里的“第一个”来自遍历顺序。因为从左到右扫描，栈顶第一次被更大元素弹出时，当前下标就是最近的右侧更大元素。\n\n### 4.3 找最近更小边界：维护递增栈\n\n`84 柱状图最大矩形` 中，一个柱子能向左右扩展到哪里，取决于左右第一个比它矮的柱子。维护递增栈时，当前柱子更矮，会让栈顶柱子的右边界确定为当前下标。出栈后新的栈顶就是它左侧第一个更矮柱子。\n\n宽度公式必须记清楚：\n\n```text\nheight = heights[mid]\nright = i\nleft = st.top() after pop\nwidth = right - left - 1\narea = height * width\n```\n\n哨兵的作用是统一边界。左侧加 `-1` 下标作为虚拟矮柱，右侧补 `0` 强制所有柱子结算。\n\n### 4.4 接雨水：出栈元素是槽底\n\n`42 接雨水` 也用递减栈，但结算语义不同。当前高度大于栈顶时，栈顶被弹出作为“槽底”。如果弹出后栈为空，说明没有左墙，不能蓄水。否则新栈顶是左墙，当前元素是右墙。\n\n水量公式：\n\n```text\nboundedHeight = min(height[left], height[right]) - height[bottom]\nwidth = right - left - 1\nwater += boundedHeight * width\n```\n\n这道题最容易误把出栈元素当成左墙。正确理解是：出栈元素位于两堵墙之间，是被水覆盖的低洼位置。\n\n### 4.5 相等元素处理要服务题意\n\n相等高度是否出栈没有唯一标准，但必须和题意一致。\n\n| 场景 | 推荐条件 | 原因 |\n|---|---|---|\n| `739` 找更高温度 | `temperatures[i] > temperatures[st.top()]` | 相等温度不能算更暖 |\n| `84` 找严格更矮边界 | `heights[i] \u003c heights[st.top()]` | 保留相等高度也能算对，宽度由后续统一结算 |\n| `84` 合并相等高度 | `heights[i] \u003c= heights[st.top()]` | 相等柱提前出栈，保留更靠右下标，写法也可行 |\n| `42` 接雨水 | `height[i] > height[st.top()]` | 高于槽底才可能形成水位 |\n\n复习时不要机械背比较符号，要能解释比较符号背后的“是否已经确定边界”。\n\n## 5. 抽象代码模板\n\n本节把单调栈拆成“等待结算”和“边界查询”两类模板。关键在于说明：栈里元素为什么还没结算，当前元素为什么能让它们出栈。\n\n### 5.1 模板一：右侧第一个更大元素\n\n#### 适用题型\n\n- `739 每日温度`：返回右侧第一个更高温度的距离。\n- 下一个更大元素：返回右侧第一个更大的值或下标。\n- 股票跨度类反向变形：可以从右向左维护单调栈。\n\n#### 核心思路\n\n- 栈里保存“还没找到右侧更大元素”的下标。\n- 栈内对应值保持单调递减。\n- 当前值更大时，栈顶元素的右侧第一个更大值已经确定，可以出栈结算。\n\n#### 代码模板\n\n> **题目简述：** 739 每日温度：给定每日温度，返回每一天还需等待多少天才会出现更高温度，不存在则为零。 [力扣原题 ↗](https://leetcode.cn/problems/daily-temperatures/)\n\n```cpp\n#include \u003cbits/stdc++.h>\nusing namespace std;\n\nvector\u003cint> dailyTemperaturesTemplate(const vector\u003cint>& temperatures) {\n    int n = temperatures.size();\n    vector\u003cint> ans(n, 0);\n    stack\u003cint> st;\n\n    for (int i = 0; i \u003c n; i++) {\n        // 当前温度更高时，可以连续结算多个还在等待的低温下标。\n        while (!st.empty() && temperatures[i] > temperatures[st.top()]) {\n            int j = st.top();\n            st.pop();\n            ans[j] = i - j;\n        }\n\n        // 当前下标暂时还没找到右侧更高温度，入栈等待未来结算。\n        st.push(i);\n    }\n\n    return ans;\n}\n```\n\n#### 易错点\n\n- 栈里默认存下标，不存值；距离和宽度都需要下标。\n- 相等温度不能算更暖，所以比较条件是 `>`。\n- 出栈可能连续发生，必须用 `while`，不能用 `if`。\n\n### 5.2 模板二：循环数组的下一个更大元素\n\n#### 适用题型\n\n- 环形数组中找下一个更大元素。\n- 需要把右侧搜索延伸到数组开头的变形。\n\n#### 核心思路\n\n- 遍历 `2n` 次模拟环。\n- 只有前 `n` 次真正入栈，避免同一个下标重复等待。\n- 后 `n` 次只负责帮助前面的元素完成结算。\n\n#### 代码模板\n\n> **题目简述：** 本模板用于：环形数组中找下一个更大元素。；需要把右侧搜索延伸到数组开头的变形。\n\n```cpp\nvector\u003cint> circularNextGreaterTemplate(const vector\u003cint>& nums) {\n    int n = nums.size();\n    vector\u003cint> ans(n, -1);\n    stack\u003cint> st;\n\n    for (int i = 0; i \u003c 2 * n; i++) {\n        int idx = i % n;\n\n        while (!st.empty() && nums[idx] > nums[st.top()]) {\n            ans[st.top()] = nums[idx];\n            st.pop();\n        }\n\n        // 每个真实下标只入栈一次，第二圈只用来结算第一圈遗留元素。\n        if (i \u003c n) {\n            st.push(idx);\n        }\n    }\n\n    return ans;\n}\n```\n\n#### 易错点\n\n- 第二圈不要继续入栈，否则同一个下标会重复等待。\n- 如果题目要求距离，距离要用 `(i - j + n) % n` 处理环形偏移。\n\n### 5.3 模板三：柱状图出栈结算面积\n\n#### 适用题型\n\n- `84 柱状图中最大的矩形`：出栈时以该柱子作为最低高度结算最大宽度。\n- 对每个元素找左右第一个更小元素。\n- 需要用当前元素作为最低点向两侧扩展的题。\n\n#### 核心思路\n\n- 栈内高度保持递增。\n- 当前高度更小时，栈顶柱子的右边界确定为当前下标。\n- 出栈后的新栈顶是左侧第一个更小元素。\n- 宽度是 `right - left - 1`。\n\n#### 代码模板\n\n> **题目简述：** 84 柱状图中最大的矩形：给定单位宽度柱状图的各柱高度，求连续柱子可构成的最大矩形面积。 [力扣原题 ↗](https://leetcode.cn/problems/largest-rectangle-in-histogram/)\n\n```cpp\nint largestRectangleTemplate(vector\u003cint>& heights) {\n    // 原始解法使用右侧哨兵 -1，强制在最后结算所有未出栈柱子。\n    heights.push_back(-1);\n\n    stack\u003cint> st;\n    st.push(-1); // 左侧哨兵：宽度公式里的左边界，不允许访问 heights[-1]。\n\n    int maxx = INT_MIN;\n    for (int i = 0; i \u003c heights.size(); i++) {\n        // 当前柱子更矮时，st.top() 这根柱子的右侧更小边界就是 i。\n        while (st.top() != -1 && heights[i] \u003c heights[st.top()]) {\n            int cur = st.top();\n            st.pop();\n            int area = heights[cur] * (i - st.top() - 1);\n            maxx = max(maxx, area);\n        }\n        st.push(i);\n    }\n\n    return maxx;\n}\n```\n\n#### 易错点\n\n- 原始写法通过 `heights.push_back(-1)` 添加右侧哨兵，确保所有遗留柱子都会被结算。\n- 宽度必须是 `i - st.top() - 1`，当前 `i` 和弹栈后的左边界本身都不能包含。\n- 左侧虚拟下标 `-1` 不能拿来访问 `heights[-1]`，所以循环条件必须先判断 `st.top() != -1`。\n\n### 5.4 模板四：显式左右更小边界数组\n\n#### 适用题型\n\n- 柱状图最大矩形的边界数组写法。\n- 需要多次复用每个位置左右边界的题。\n- 调试单调栈时验证边界语义。\n\n#### 核心思路\n\n- `leftLess[i]` 是左侧第一个严格更小元素下标，不存在为 `-1`。\n- `rightLess[i]` 是右侧第一个严格更小元素下标，不存在为 `n`。\n- 面积为 `heights[i] * (rightLess[i] - leftLess[i] - 1)`。\n\n#### 代码模板\n\n> **题目简述：** 本模板用于：柱状图最大矩形的边界数组写法。；需要多次复用每个位置左右边界的题。；调试单调栈时验证边界语义。 [力扣原题 ↗](https://leetcode.cn/problems/largest-rectangle-in-histogram/)\n\n```cpp\nint largestRectangleByBoundariesTemplate(const vector\u003cint>& heights) {\n    int n = heights.size();\n    vector\u003cint> leftLess(n, -1), rightLess(n, n);\n    stack\u003cint> st;\n\n    for (int i = 0; i \u003c n; i++) {\n        // 弹掉大于等于当前高度的柱子，使栈顶成为严格更小的左边界。\n        while (!st.empty() && heights[st.top()] >= heights[i]) {\n            st.pop();\n        }\n        leftLess[i] = st.empty() ? -1 : st.top();\n        st.push(i);\n    }\n\n    while (!st.empty()) {\n        st.pop();\n    }\n\n    for (int i = n - 1; i >= 0; i--) {\n        while (!st.empty() && heights[st.top()] >= heights[i]) {\n            st.pop();\n        }\n        rightLess[i] = st.empty() ? n : st.top();\n        st.push(i);\n    }\n\n    int ans = 0;\n    for (int i = 0; i \u003c n; i++) {\n        ans = max(ans, heights[i] * (rightLess[i] - leftLess[i] - 1));\n    }\n    return ans;\n}\n```\n\n#### 易错点\n\n- 相等高度的处理要左右一致，否则边界可能重叠或漏算。\n- `>=` 会保留更靠近当前元素的边界语义，适合严格更小边界。\n\n### 5.5 模板五：接雨水凹槽结算\n\n#### 适用题型\n\n- `42 接雨水`：当前右墙出现后，结算中间低洼槽底。\n- 任何“右边界出现后才能确定中间贡献”的题。\n\n#### 核心思路\n\n- 栈内保存可能成为左墙的下标，整体保持递减高度。\n- 当前高度高于栈顶时，栈顶作为槽底出栈。\n- 出栈后如果栈为空，说明没有左墙，不能接水。\n- 水位由左右墙较矮者决定。\n\n#### 代码模板\n\n> **题目简述：** 42 接雨水：给定各柱子的高度，计算下雨后这些柱子之间能够接住的雨水总量。 [力扣原题 ↗](https://leetcode.cn/problems/trapping-rain-water/)\n\n```cpp\nint trapRainWaterTemplate(const vector\u003cint>& height) {\n    int n = height.size();\n    int water = 0;\n    stack\u003cint> st;\n\n    for (int right = 0; right \u003c n; right++) {\n        while (!st.empty() && height[right] > height[st.top()]) {\n            int bottom = st.top();\n            st.pop();\n\n            if (st.empty()) {\n                break;\n            }\n\n            int left = st.top();\n            int boundedHeight = min(height[left], height[right]) - height[bottom];\n            int width = right - left - 1;\n            water += boundedHeight * width;\n        }\n\n        st.push(right);\n    }\n\n    return water;\n}\n```\n\n#### 易错点\n\n- 出栈元素是槽底；新栈顶才是左墙。\n- 没有左墙时不能接水，要先判断空栈。\n- `boundedHeight` 是左右墙较矮值减槽底高度。\n\n### 5.6 模板六：四方向最近更大 / 更小边界\n\n#### 适用题型\n\n- 面试时快速确定维护递增栈还是递减栈。\n- 需要同时获得左右边界的题，例如柱状图、贡献法统计子数组最小值/最大值。\n- 需要找最近更大或最近更小元素的通用边界题。\n\n#### 核心思路\n\n- 找更小：弹掉大于等于当前值的元素，让栈顶成为严格更小。\n- 找更大：弹掉小于等于当前值的元素，让栈顶成为严格更大。\n- 找左边界从左往右扫，找右边界从右往左扫。\n\n#### 代码模板\n\n> **题目简述：** 本模板用于：面试时快速确定维护递增栈还是递减栈。；需要同时获得左右边界的题，例如柱状图、贡献法统计子数组最小值/最大值。；需要找最近更大或最近更小元素的通用边界题。 [力扣原题 ↗](https://leetcode.cn/problems/largest-rectangle-in-histogram/)\n\n```cpp\nvector\u003cint> nearestSmallerOnLeftTemplate(const vector\u003cint>& nums) {\n    // 🌟 默认值为 -1。意思是：如果左边没有比我更小的数，那左边界就是数组最外侧（索引 -1）\n    vector\u003cint> ans(nums.size(), -1); \n    stack\u003cint> st; // 栈里面存的是元素的“索引（下标）”，不存具体的值\n\n    // 🌟 找左边界，所以从左往右遍历\n    for (int i = 0; i \u003c (int)nums.size(); i++) {\n        // 🌟 核心逻辑：我要找更小的，所以栈里那些“大于等于”我的元素都没用了，直接踢走\n        while (!st.empty() && nums[st.top()] >= nums[i]) {\n            st.pop();\n        }\n        // 踢完之后，如果栈没空，那栈顶就是离我最近且比我小的元素下标\n        ans[i] = st.empty() ? -1 : st.top();\n        // 当前元素处理完毕，把自己变成候选人，压入栈中等待后面的人来找\n        st.push(i);\n    }\n    return ans;\n}\n\nvector\u003cint> nearestSmallerOnRightTemplate(const vector\u003cint>& nums) {\n    int n = nums.size();\n    // 🌟 默认值为 n。意思是：如果右边没有比我更小的数，那右边界就是数组最外侧（索引 n）\n    vector\u003cint> ans(n, n);\n    stack\u003cint> st;\n\n    // 🌟 找右边界，所以必须【倒着】从右往左扫！\n    for (int i = n - 1; i >= 0; i--) {\n        // 🌟 核心逻辑同上：找更小，踢掉大于等于我的\n        while (!st.empty() && nums[st.top()] >= nums[i]) {\n            st.pop();\n        }\n        // 踢完之后，剩下的栈顶就是右侧最近更小值的下标\n        ans[i] = st.empty() ? n : st.top();\n        st.push(i);\n    }\n    return ans;\n}\n\nvector\u003cint> nearestGreaterOnLeftTemplate(const vector\u003cint>& nums) {\n    // 🌟 默认值为 -1（左边界找不到）\n    vector\u003cint> ans(nums.size(), -1);\n    stack\u003cint> st;\n\n    // 🌟 找左边界，从左往右扫\n    for (int i = 0; i \u003c (int)nums.size(); i++) {\n        // 🌟 核心逻辑变了！我要找更大的，所以栈里那些“小于等于”我的都被我挡住了，直接踢走\n        while (!st.empty() && nums[st.top()] \u003c= nums[i]) {\n            st.pop();\n        }\n        ans[i] = st.empty() ? -1 : st.top();\n        st.push(i);\n    }\n    return ans;\n}\n\nvector\u003cint> nearestGreaterOnRightTemplate(const vector\u003cint>& nums) {\n    int n = nums.size();\n    // 🌟 默认值为 n（右边界找不到）\n    vector\u003cint> ans(n, n);\n    stack\u003cint> st;\n\n    // 🌟 找右边界，倒着扫\n    for (int i = n - 1; i >= 0; i--) {\n        // 🌟 核心逻辑：找更大，踢掉小于等于我的\n        while (!st.empty() && nums[st.top()] \u003c= nums[i]) {\n            st.pop();\n        }\n        ans[i] = st.empty() ? n : st.top();\n        st.push(i);\n    }\n    return ans;\n}\n```\n\n#### 易错点\n\n- `>=` / `\u003c=` 决定相等元素归属，涉及贡献计数时尤其重要。\n- 左边界不存在用 `-1`，右边界不存在用 `n`，这样宽度公式更自然。\n- 找右边界时从右往左扫，不要写成和左边界同一个方向。\n\n## 6. 高频易错点清单\n\n| 易错点 | 典型题目 | 规避方式 |\n|---|---|---|\n| 栈里存值导致无法计算距离 | `739`、`84`、`42` | 默认存下标，通过下标取值 |\n| 比较方向写反 | `739`、`84` | 找更大维护递减栈，找更小维护递增栈 |\n| 只用 `if` 出栈 | `84`、`42` | 当前元素可能连续结算多个栈顶，必须用 `while` |\n| 柱状图末尾元素没结算 | `84` | 循环到 `i == n`，令当前高度为 0 |\n| 柱状图宽度少减 1 | `84` | 宽度是 `right - left - 1` |\n| 出栈后马上访问空栈 | `42` | 弹出槽底后先判断 `st.empty()` |\n| 接雨水把槽底当左墙 | `42` | 出栈元素是 bottom，新栈顶才是 left |\n| 每日温度把相等温度当更暖 | `739` | 只在 `>` 时结算 |\n| 相等高度处理前后不一致 | `84` | 明确选择严格或非严格边界，并保持统一 |\n| 忘记单调栈答案在出栈时更新 | `42`、`84`、`739` | 入栈只是等待，出栈才是结算 |\n\n## 7. 最短复盘口诀\n\n单调栈题先问找更大还是更小。找更大用递减栈，找更小用递增栈；栈里存下标，破坏单调就 while 出栈结算。`739` 出栈算距离，`84` 出栈算以它为最低柱的矩形，`42` 出栈的是槽底，左右墙共同算水。右边界是当前下标，左边界是出栈后的新栈顶。\n\n\n\n================================================================================\n\n# 第11部分: 栈\n\n================================================================================\n\n> 目标：本文把 Hot100 中所有显式或隐式用栈的题抽象成若干“可复用题型模板”。复习时先判断栈里存什么、什么时候入栈、什么时候出栈、出栈时结算什么。\n\n## 1. 栈题的底层模型\n\n栈题的本质是“最近的未完成状态”。每道栈题先问五个问题：\n\n| 问题 | 如果答案是“是” | 常用处理 |\n|---|---|---|\n| 是否需要匹配最近的左侧状态 | 括号匹配、字符串解码、最长有效括号 | 栈保存左括号、下标或上一层状态 |\n| 是否需要撤回到上一层语义 | 嵌套字符串、递归模拟、表达式解析 | 栈保存进入当前层前的上下文 |\n| 是否需要维护额外最值 | 最小栈、最大栈变形 | 主栈保存数据，辅助栈保存当前最值 |\n| 是否在模拟递归调用栈 | 二叉树迭代遍历、展开树 | 显式栈保存待处理节点和访问状态 |\n| 是否需要找最近更大/更小元素 | 每日温度、柱状图、接雨水 | 单调栈，出栈时结算贡献 |\n\n栈里通常只存三类东西：\n\n| 栈内元素 | 适用场景 | 代表题 |\n|---|---|---|\n| 字符或节点本身 | 判断匹配、模拟遍历 | `20`、`94`、`114` |\n| 下标 | 需要计算长度、距离、宽度 | `32`、`42`、`84`、`739` |\n| 上一层上下文 | 嵌套结构还原 | `394` |\n| 聚合状态 | O(1) 查询当前最值 | `155` |\n\n## 2. Hot100 栈题型地图\n\n\n| 题型 | 题目 | 抽象能力 | 一句话记忆 |\n|---|---|---|---|\n| 括号匹配 | `20 有效的括号` | 最近左括号匹配 | 右括号只和栈顶最近左括号配对 |\n| 下标哨兵 | `32 最长有效括号` | 用栈维护合法段左边界 | 栈底放“最后一个非法位置” |\n| 嵌套解码 | `394 字符串解码` | 栈保存上一层字符串和倍数 | 遇到 `[` 入栈，遇到 `]` 弹栈拼回上一层 |\n| 设计型栈 | `155 最小栈` | 双栈同步维护最值 | 每个元素入栈时都记录当前最小值 |\n| 递归模拟 | `94 二叉树中序遍历`、`114 二叉树展开为链表` | 显式栈模拟调用栈 | 手动保存还没处理的节点 |\n| 辅助判断 | `234 回文链表` | 栈保存前半段或整链值 | 后进先出天然反向比较 |\n| 单调栈 | `42 接雨水`、`84 柱状图最大矩形`、`739 每日温度` | 最近更大/更小关系 | 栈保持单调，破坏单调时结算答案 |\n\n## 3. 复习顺序建议\n\n先掌握普通栈，再进入单调栈和递归模拟：\n\n1. `20 有效的括号`：理解栈解决“最近匹配”。\n2. `155 最小栈`：理解主栈和辅助栈同步状态。\n3. `394 字符串解码`：练嵌套结构和上下文恢复。\n4. `32 最长有效括号`：练“下标栈 + 哨兵边界”。\n5. `94 二叉树中序遍历`：把递归调用栈改写成显式栈。\n6. `234 回文链表`：把栈作为反向访问工具，并对比快慢指针反转法。\n7. `739 每日温度`：入门单调栈，出栈时结算距离。\n8. `84 柱状图最大矩形`：掌握哨兵和左右边界。\n9. `42 接雨水`：理解单调栈按“凹槽”结算。\n10. `114 二叉树展开为链表`：理解栈和反向 DFS 都能模拟前序结构。\n\n## 4. 关键套路详解\n\n### 4.1 栈里存什么，比用不用栈更重要\n\n栈题最常见错误是直接把元素压栈，却发现答案需要距离、宽度或边界。判断标准很简单：如果题目最终要计算位置差，就存下标；如果只需要匹配类型，就存字符；如果需要恢复上一层状态，就存上下文对象。\n\n| 需求 | 栈里存 | 例子 |\n|---|---|---|\n| 判断括号是否匹配 | 左括号字符 | `20` |\n| 计算最长合法长度 | 下标 | `32` |\n| 计算等待天数或矩形宽度 | 下标 | `739`、`84` |\n| 恢复嵌套前的字符串 | `{之前字符串, 重复次数}` | `394` |\n| 查询当前最小值 | 当前层最小值 | `155` |\n\n### 4.2 括号类题的边界是“最后一个非法位置”\n\n`20` 只需要判断是否完全匹配，所以栈保存左括号即可。`32` 需要计算最长长度，因此不能只存字符，必须存下标。栈底的 `-1` 表示“当前合法段左侧的非法边界”。当遇到无法匹配的右括号时，把它的下标作为新的非法边界。\n\n这类题的关键在于让栈顶始终能回答：当前合法段从哪里之后开始。\n\n### 4.3 嵌套结构题用栈保存上一层上下文\n\n`394 字符串解码` 的当前层字符串遇到 `[` 后会进入下一层。如果不保存上一层，遇到 `]` 时就不知道应该把当前层重复后拼回哪里。因此栈里保存的是“进入下一层之前的状态”：上一层已经构造好的字符串、当前层的重复次数。\n\n类似表达式解析、括号内表达式求值、嵌套列表解析，都可以套这个模型。\n\n### 4.4 最小栈每层保存当前最小值\n\n`155 最小栈` 要求 `getMin()` 为 O(1)。这意味着不能在查询时遍历主栈。常见做法有两种：\n\n| 方法 | 思路 | 优点 |\n|---|---|---|\n| 双栈同步 | 每次 push 时辅助栈也 push 当前最小值 | pop 时天然同步，不需要计数 |\n| 压缩辅助栈 | 只在新值小于等于当前最小时入辅助栈 | 节省空间，但 pop 时要比较 |\n\n复习时优先写双栈同步版，逻辑最稳。\n\n### 4.5 递归调用栈可以显式模拟\n\n二叉树递归本质上也是栈。`94` 的中序遍历可以用 `while (cur || !st.empty())` 模拟：一路向左入栈，弹出时访问节点，再转向右子树。`114` 可以把右节点先压栈、左节点后压栈，从而弹出顺序符合前序。\n\n写迭代遍历时不要只记“模板长什么样”，要明确栈里保存的是“之后还要回来的节点”。\n\n### 4.6 单调栈是栈专题的进阶分支\n\n单调栈通过维护一个单调序列完成结算。当新元素破坏单调性时，说明栈顶元素找到了右侧第一个更大或更小元素，可以立刻结算。\n\n`739` 结算距离，`84` 结算以某根柱子为最矮柱的最大矩形，`42` 结算某个凹槽能接的水。它们共同点是：出栈元素在出栈那一刻同时确定了右边界，左边界由新的栈顶给出。\n\n## 5. 抽象代码模板\n\n下面模板按栈内状态抽象出通用骨架。复习时先确定栈里存字符、下标、上下文、节点还是聚合状态，再选择对应模板。\n\n### 5.1 括号匹配栈\n\n#### 适用题型\n\n- `20 有效的括号`：右括号必须匹配最近的左括号。\n- 表达式括号合法性检查、多类型括号匹配。\n- 需要判断“最近未闭合状态”是否合法的题。\n\n#### 核心思路\n\n栈中只保存尚未匹配的左括号。遇到右括号时，它只能和栈顶最近左括号匹配；如果栈为空或类型不一致，立即失败。遍历结束后栈必须为空。\n\n关键不变量：\n\n- 栈内元素从底到顶是尚未被关闭的左括号。\n- 右括号不入栈，只负责触发匹配和出栈。\n- 每次访问 `top()` 前必须先判断空栈。\n\n#### 代码模板\n\n> **题目简述：** 20 有效的括号：给定仅含三类括号的字符串，判断括号类型、顺序和配对是否有效。 [力扣原题 ↗](https://leetcode.cn/problems/valid-parentheses/)\n\n```cpp\nclass Solution {\npublic:\n    bool isValid(string s) {\n        stack\u003cchar> st;\n        for (char x : s) {\n            if (x == '(') st.push(')');\n            else if (x == '[') st.push(']');\n            else if (x == '{') st.push('}');\n            else {\n                if (st.empty() || st.top() != x) {\n                    return false;\n                }\n                st.pop();\n            }\n        }\n        return st.empty();\n    }\n};\n```\n\n#### 易错点\n\n- 把所有字符都当作左括号入栈，导致非括号字符干扰匹配。\n- 右括号到来时直接 `st.top()`，空栈会越界。\n- 忘记最后检查栈为空，漏掉多余左括号。\n\n### 5.2 下标栈 + 哨兵边界\n\n#### 适用题型\n\n- `32 最长有效括号`：需要计算合法括号段长度。\n- 任意需要用最近非法位置切分区间的括号题。\n- 单调栈题中的距离、宽度计算也常复用“存下标”的思想。\n\n#### 核心思路\n\n栈底放一个哨兵下标，表示当前合法段左侧最后一个不能跨越的位置。遇到 `(` 压入下标；遇到 `)` 先弹出一个待匹配位置。若弹后栈空，说明当前右括号无法匹配，它成为新的非法边界；否则 `i - st.top()` 就是以当前下标结尾的合法长度。\n\n关键不变量：\n\n- 栈底始终是当前扫描段左侧的非法边界。\n- 栈内其余元素是尚未匹配的左括号下标。\n- 每次合法匹配后，栈顶提供当前合法段左边界的前一个位置。\n\n#### 代码模板\n\n> **题目简述：** 32 最长有效括号：给定仅含左右圆括号的字符串，求最长连续合法括号子串的长度。 [力扣原题 ↗](https://leetcode.cn/problems/longest-valid-parentheses/)\n\n```cpp\nint longestValidParenthesesTemplate(const string& s) {\n    stack\u003cint> st;\n    st.push(-1);\n    int ans = 0;\n\n    for (int i = 0; i \u003c (int)s.size(); i++) {\n        if (s[i] == '(') {\n            st.push(i);\n        } else {\n            st.pop();\n            if (st.empty()) {\n                st.push(i);\n            } else {\n                ans = max(ans, i - st.top());\n            }\n        }\n    }\n\n    return ans;\n}\n```\n\n#### 易错点\n\n- 忘记初始哨兵 `-1`，导致开头合法段长度算错。\n- 无法匹配的右括号没有变成新边界。\n- 用字符栈会丢失长度信息，必须存下标。\n\n### 5.3 嵌套结构上下文栈\n\n#### 适用题型\n\n- `394 字符串解码`：`k[encoded]` 类型嵌套还原。\n- 括号嵌套表达式求值。\n- 进入子结构前需要保存父层状态的解析题。\n\n#### 核心思路\n\n当前层遇到 `[` 时即将进入子层，必须把“父层已经构造好的字符串”和“本层重复次数”一起入栈。遇到 `]` 时当前层完成，弹出父层上下文，把当前层重复后拼回父层。\n\n关键不变量：\n\n- `cur` 始终表示当前层已经解析出的内容。\n- `repeat` 必须支持多位数字累积。\n- 栈中每个元素都是进入下一层前保存的 `{父层字符串, 重复次数}`。\n\n#### 代码模板\n\n> **题目简述：** 394 字符串解码：解码形如 k[子串] 的有效编码字符串，编码可嵌套且 k 表示重复次数。 [力扣原题 ↗](https://leetcode.cn/problems/decode-string/)\n\n```cpp\nclass Solution {\npublic:\n    string decodeString(string s) {\n        stack\u003cint> stnum;\n        stack\u003cstring> ststr;\n        int num=0;\n        string res=\"\";\n        for(char x:s){\n            if(isdigit(x)){\n                num=num*10+x-'0';\n            }\n            if(isalpha(x)){\n                res+=x;\n            }\n            if(x=='['){\n                stnum.push(num);\n                ststr.push(res);\n                res=\"\";\n                num=0;\n            }\n            if(x==']'){\n                int curnum=stnum.top();\n                string laststr=ststr.top();\n                string tmp=\"\";\n                stnum.pop();\n                ststr.pop();\n                for(int i=0;i\u003ccurnum;i++){\n                    tmp+=res;\n                }\n                res=laststr+tmp;\n            }\n        }\n        return res;\n    }\n};\n```\n\n#### 易错点\n\n- 数字只按单字符处理，漏掉 `12[a]` 这类多位倍数。\n- 遇到 `]` 后只重复当前层，忘记拼回父层。\n- 入栈后没有清空当前层状态，导致父子层内容混在一起。\n\n### 5.4 最小栈双栈同步\n\n#### 适用题型\n\n- `155 最小栈`：`push/pop/top/getMin` 都要求 O(1)。\n- 最大栈、历史最值查询、支持撤销的聚合状态栈。\n- 主结构操作后需要同步维护辅助查询结果的设计题。\n\n#### 核心思路\n\n一个栈保存真实数据，另一个栈保存“压入当前元素后整个栈的最小值”。每次 `push` 两个栈都入栈，每次 `pop` 两个栈都出栈，所以 `mins.top()` 永远是当前最小值。\n\n关键不变量：\n\n- `data.size() == mins.size()`。\n- `mins.top()` 是当前所有 `data` 元素的最小值。\n- `pop()` 必须让主栈和辅助栈同步变化。\n\n#### 代码模板\n\n> **题目简述：** 155 最小栈：设计支持压栈、出栈、查看栈顶和获取最小值且操作均为 O(1) 的栈。 [力扣原题 ↗](https://leetcode.cn/problems/min-stack/)\n\n```cpp\nclass MinStack {\n    stack\u003cpair\u003cint,int>> st; \n\npublic:\n    MinStack() {\n        st.push({0,INT_MAX});\n    }\n    \n    void push(int val) {\n        int current_min = min(val, st.top().second);\n        st.push({val, current_min});\n    }\n    \n    void pop() {\n        st.pop();\n    }\n    \n    int top() {\n        return st.top().first;\n    }\n    \n    int getMin() {\n        return st.top().second;\n    }\n};\n\n/**\n * Your MinStack object will be instantiated and called as such:\n * MinStack* obj = new MinStack();\n * obj->push(val);\n * obj->pop();\n * int param_3 = obj->top();\n * int param_4 = obj->getMin();\n */\n```\n\n#### 易错点\n\n- 只维护一个普通栈，`getMin()` 时扫描，复杂度不满足 O(1)。\n- 辅助栈只在更小值时入栈，却在弹出相等最小值时忘记同步弹出。\n- 两个栈长度不同步，连续 `pop()` 后最小值失真。\n\n### 5.5 显式栈模拟树遍历\n\n#### 适用题型\n\n- `94 二叉树中序遍历`。\n- BST 第 K 小、验证 BST 等“中序访问时结算”的题。\n- 递归调用栈可能过深，或面试要求迭代写法的树题。\n\n#### 核心思路\n\n递归本质就是系统栈。中序遍历的显式栈写法是：当前节点不空时一路向左并压栈；走不动后弹出最近未访问节点，访问它，再转向右子树。\n\n关键不变量：\n\n- 栈内节点是“左子树已准备深入，但自身还没访问”的祖先链。\n- 弹栈时才访问节点，保证左、根、右顺序。\n- 访问后必须令 `cur = cur->right`，否则右子树会丢失。\n\n#### 代码模板\n\n> **题目简述：** 94 二叉树的中序遍历：给定二叉树根结点，按左子树、根、右子树的顺序返回结点值。 [力扣原题 ↗](https://leetcode.cn/problems/binary-tree-inorder-traversal/)\n\n```cpp\nstruct TreeNode {\n    int val;\n    TreeNode* left;\n    TreeNode* right;\n    TreeNode(int x) : val(x), left(nullptr), right(nullptr) {}\n};\n\nvector\u003cint> inorderIterativeTemplate(TreeNode* root) {\n    vector\u003cint> res;\n    stack\u003cTreeNode*> st;\n    TreeNode* cur = root;\n\n    while (cur || !st.empty()) {\n        while (cur) {\n            st.push(cur);\n            cur = cur->left;\n        }\n        cur = st.top();\n        st.pop();\n        res.push_back(cur->val);\n        cur = cur->right;\n    }\n\n    return res;\n}\n```\n\n#### 易错点\n\n- 外层循环只写 `while (cur)`，栈中剩余祖先无法继续处理。\n- 弹出节点后忘记转向右子树。\n- 前序遍历中入栈顺序写反：想先访问左子树，应先压右再压左。\n\n### 5.6 前序栈模拟结构重排\n\n#### 适用题型\n\n- `114 二叉树展开为链表` 的显式栈写法。\n- 需要按前序顺序重排树结构的题。\n- 递归 flatten 容易栈溢出或要求迭代实现的场景。\n\n#### 核心思路\n\n前序顺序是根、左、右。栈是后进先出，所以为了先处理左子树，入栈时要先压右再压左。每弹出一个节点，就把上一个节点的 `right` 指向当前节点，并清空 `left`，逐步形成前序链表。\n\n关键不变量：\n\n- 栈中保存尚未接到链表上的节点。\n- `prev` 始终是已经展开链表的尾节点。\n- 每处理一个节点，都必须清空 `left`。\n\n#### 代码模板\n\n> **题目简述：** 114 二叉树展开为链表：将二叉树原地展开为前序遍历顺序的单链表，仅使用结点的右指针。 [力扣原题 ↗](https://leetcode.cn/problems/flatten-binary-tree-to-linked-list/)\n\n```cpp\nvoid flattenByPreorderStack(TreeNode* root) {\n    if (!root) {\n        return;\n    }\n\n    stack\u003cTreeNode*> st;\n    st.push(root);\n    TreeNode* prev = nullptr;\n\n    while (!st.empty()) {\n        TreeNode* cur = st.top();\n        st.pop();\n\n        if (prev) {\n            prev->right = cur;\n            prev->left = nullptr; // 展开后的链表只能沿 right 指针前进。\n        }\n\n        // 先压右再压左，弹出顺序才是 root -> left -> right。\n        if (cur->right) {\n            st.push(cur->right);\n        }\n        if (cur->left) {\n            st.push(cur->left);\n        }\n\n        prev = cur;\n    }\n\n    if (prev) {\n        prev->left = nullptr;\n    }\n}\n```\n\n#### 易错点\n\n- 入栈顺序写成先左后右，会得到根、右、左的错误链表。\n- 只重连 `right`，忘记清空 `left`。\n- 在保存左右孩子之前就改指针，导致原子树入口丢失。\n\n### 5.7 链表回文的栈辅助判断\n\n#### 适用题型\n\n- `234 回文链表` 的栈解法。\n- 只能单向遍历，但需要反向比较的链表题。\n- 空间 O(n) 可接受、优先保证思路简单的场景。\n\n#### 核心思路\n\n单链表无法从尾部向前走，可以先把前半段或全部节点值压栈，再从链表头或中点开始比较。更节省空间的写法是快慢指针找中点，同时把前半段压栈；奇数长度时跳过中间节点。\n\n关键不变量：\n\n- 快指针每次走两步，慢指针每次走一步。\n- 慢指针经过的前半段值按顺序入栈，栈顶对应靠近中点的值。\n- 比较后半段时，栈顶顺序正好是前半段的反向。\n\n#### 代码模板\n\n> **题目简述：** 234 回文链表：给定单链表头结点，判断从头到尾的结点值序列是否为回文。 [力扣原题 ↗](https://leetcode.cn/problems/palindrome-linked-list/)\n\n```cpp\nstruct ListNode {\n    int val;\n    ListNode* next;\n    ListNode(int x) : val(x), next(nullptr) {}\n};\n\nbool isPalindromeByStack(ListNode* head) {\n    stack\u003cint> st;\n    ListNode* slow = head;\n    ListNode* fast = head;\n\n    while (fast && fast->next) {\n        st.push(slow->val); // slow 走过的节点属于前半段。\n        slow = slow->next;\n        fast = fast->next->next;\n    }\n\n    if (fast) {\n        slow = slow->next; // 奇数长度跳过中间节点。\n    }\n\n    while (slow) {\n        if (st.empty() || st.top() != slow->val) {\n            return false;\n        }\n        st.pop();\n        slow = slow->next;\n    }\n\n    return st.empty();\n}\n```\n\n#### 易错点\n\n- 奇数长度没有跳过中间节点，导致自己和自己错位比较。\n- 把后半段也压栈，比较方向混乱。\n- 只比较到链表结束，不检查栈是否同步为空。\n\n\n### 5.8 单调栈结算模板\n\n#### 适用题型\n\n- `739 每日温度`：找右侧第一个更大元素并计算距离。\n- `84 柱状图最大矩形`：出栈时确定当前柱子的左右更矮边界。\n- `42 接雨水`：出栈时按左右边界结算凹槽水量。\n\n#### 核心思路\n\n这三题共享同一个“右边界出现时弹栈结算”骨架。共同点是栈里存还没确定右边界的下标；当当前元素破坏栈的单调性时，被弹出的下标立刻拿到右边界，新的栈顶通常提供左边界。\n\n关键不变量：\n\n- 栈里存下标，不直接存值，因为距离、宽度都来自下标差。\n- 出栈那一刻必须完成结算，不能只弹不算。\n- 每日温度要找右侧更大，维护单调递减栈。\n- 柱状图要找右侧更小，维护单调递增栈，并用哨兵清算尾部。\n- 接雨水和每日温度一样等右侧更大，但弹出元素代表凹槽底部。\n\n#### 代码模板：共同骨架\n\n> **题目简述：** 本模板覆盖：739 每日温度（给定每日温度，返回每一天还需等待多少天才会出现更高温度，不存在则为零。）；84 柱状图中最大的矩形（给定单位宽度柱状图的各柱高度，求连续柱子可构成的最大矩形面积。）；42 接雨水（给定各柱子的高度，计算下雨后这些柱子之间能够接住的雨水总量。） [42 原题 ↗](https://leetcode.cn/problems/trapping-rain-water/) · [84 原题 ↗](https://leetcode.cn/problems/largest-rectangle-in-histogram/) · [739 原题 ↗](https://leetcode.cn/problems/daily-temperatures/)\n\n```cpp\nvector\u003cint> nextGreaterDistanceTemplate(const vector\u003cint>& nums) {\n    vector\u003cint> ans(nums.size(), 0);\n    stack\u003cint> st; // 单调递减栈：栈内下标对应的值还没找到右侧更大值。\n\n    for (int i = 0; i \u003c (int)nums.size(); i++) {\n        while (!st.empty() && nums[i] > nums[st.top()]) {\n            int mid = st.top();\n            st.pop();\n\n            // 共同结算点：i 是 mid 的右边界；弹栈后的 st.top() 可作为左边界。\n            ans[mid] = i - mid; // 每日温度变形：答案是距离。\n        }\n        st.push(i);\n    }\n\n    return ans;\n}\n```\n\n柱状图和接雨水只替换“破坏单调性的条件”和“弹出时的结算公式”：\n\n> **题目简述：** 本模板覆盖：739 每日温度（给定每日温度，返回每一天还需等待多少天才会出现更高温度，不存在则为零。）；84 柱状图中最大的矩形（给定单位宽度柱状图的各柱高度，求连续柱子可构成的最大矩形面积。）；42 接雨水（给定各柱子的高度，计算下雨后这些柱子之间能够接住的雨水总量。） [42 原题 ↗](https://leetcode.cn/problems/trapping-rain-water/) · [84 原题 ↗](https://leetcode.cn/problems/largest-rectangle-in-histogram/) · [739 原题 ↗](https://leetcode.cn/problems/daily-temperatures/)\n\n```cpp\n// 柱状图最大矩形变形：原始解法用左右哨兵，找右侧第一个更矮柱子。\nheights.push_back(-1);\nstack\u003cint> st;\nst.push(-1);\nfor (int i = 0; i \u003c heights.size(); i++) {\n    while (st.top() != -1 && heights[i] \u003c heights[st.top()]) {\n        int cur = st.top();\n        st.pop();\n        ans = max(ans, heights[cur] * (i - st.top() - 1));\n    }\n    st.push(i);\n}\n\n// 接雨水变形：仍等右侧更高柱，但弹出的 mid 是凹槽底部。\nwhile (!st.empty() && height[i] > height[st.top()]) {\n    int bottom = st.top();\n    st.pop();\n    if (st.empty()) {\n        break; // 没有左边界，无法形成凹槽。\n    }\n    int left = st.top();\n    int width = i - left - 1;\n    int boundedHeight = min(height[left], height[i]) - height[bottom];\n    ans += boundedHeight * width;\n}\n```\n\n#### 变形点对照\n\n| 题型 | 栈单调性 | 触发弹栈条件 | 弹出元素含义 | 结算公式 |\n|---|---|---|---|---|\n| 每日温度 | 单调递减 | `nums[i] > nums[st.top()]` | 等到右侧更大值的位置 | `ans[mid] = i - mid` |\n| 柱状图最大矩形 | 单调递增 | `heights[i] \u003c heights[st.top()]` | 以该柱为最矮柱 | `heights[mid] * (i - leftLessIndex - 1)` |\n| 接雨水 | 单调递减 | `height[i] > height[st.top()]` | 凹槽底部 | `(min(left, right) - bottom) * width` |\n\n#### 易错点\n\n- 通用：忘记存下标，导致无法计算等待天数、矩形宽度或水槽宽度。\n- `while` 写成 `if`，一次只弹一个，漏掉连续被当前右边界结算的元素。\n- 柱状图忘记右侧哨兵，导致递增栈尾部柱子没有被清算。\n- 接雨水弹出底部后没有检查栈空，或把底部高度当成边界高度。\n\n## 6. 高频易错点清单\n\n| 易错点 | 典型题目 | 规避方式 |\n|---|---|---|\n| 栈里存了字符但题目要算长度 | `32` | 需要距离或长度时优先存下标 |\n| 右括号来时没有检查空栈 | `20`、`32` | 每次访问 `top()` 前先判断空 |\n| 最长有效括号忘记哨兵 `-1` | `32` | 栈底保存最后一个非法边界 |\n| 无效右括号没有更新边界 | `32` | 栈空后把当前下标压入作为新边界 |\n| 字符串解码没有处理多位数字 | `394` | `repeat = repeat * 10 + digit` |\n| 遇到 `]` 后只重复当前层，忘记拼回上一层 | `394` | 弹出 `{prev, times}`，令 `cur = prev + repeat(cur)` |\n| 最小栈辅助栈没有同步 pop | `155` | 主栈和辅助栈一起 push/pop |\n| 迭代中序遍历丢失右子树 | `94` | 访问弹出节点后 `cur = cur->right` |\n| 前序栈遍历入栈顺序反了 | `114` | 想先处理左，就先压右再压左 |\n| 单调栈只入栈不结算 | `42`、`84`、`739` | 破坏单调性时必须 while 出栈并更新答案 |\n\n## 7. 最短复盘口诀\n\n栈题先问“最近未完成状态是什么”。匹配存左括号，算长度存下标，嵌套存上一层上下文，最值查询存历史最值，递归模拟存待回来的节点。`20` 是匹配母题，`32` 是下标哨兵母题，`394` 是上下文母题，`155` 是辅助栈母题，`739/84/42` 是单调栈母题。\n\n\n\n================================================================================\n\n# 第12部分: 堆\n\n================================================================================\n\n> 目标：本文把 Hot100 中的堆题抽象成“动态维护极值”的可复用模板。复习时先判断要维护最大值、最小值、前 K 个元素还是数据流中位数，再选择大顶堆、小顶堆或双堆。\n\n## 1. 堆题的底层模型\n\n堆解决的是“当前最该被处理的元素是谁”。每道堆题先问五个问题：\n\n| 问题 | 如果答案是“是” | 常用处理 |\n|---|---|---|\n| 是否每次都要取当前最小元素 | K 路归并、最短候选、升序合并 | 小顶堆 |\n| 是否只关心最大的 K 个 | 第 K 大、Top K 高频 | 固定大小小顶堆 |\n| 是否只关心最小的 K 个 | 第 K 小、最小 K 个数 | 固定大小大顶堆 |\n| 是否需要动态中位数 | 数据流不断插入和查询中位数 | 大顶堆保存较小半，小顶堆保存较大半 |\n| 是否有窗口过期元素 | 滑动窗口最大值的堆写法 | 堆中保存 `{值, 下标}`，弹出过期下标 |\n\n堆题最核心的三种模型：\n\n| 模型 | 堆内元素 | 不变式 | 代表题 |\n|---|---|---|---|\n| 多路归并 | 当前候选节点 | 堆顶是所有候选中最小者 | `23` |\n| 固定大小 Top K | 当前保留的 K 个候选 | 堆顶是最弱候选，超 K 就淘汰 | `215`、`347` |\n| 双堆平衡 | 小半部分和大半部分 | 两堆大小差不超过 1，且左堆都不大于右堆 | `295` |\n\n## 2. Hot100 堆题型地图\n\n\n| 题型 | 题目 | 抽象能力 | 一句话记忆 |\n|---|---|---|---|\n| K 路归并 | `23 合并 K 个升序链表` | 每条链贡献一个当前最小候选 | 弹出最小节点后，把它的后继补进堆 |\n| 第 K 大 | `215 数组中的第 K 个最大元素` | 固定大小小顶堆或快速选择 | 堆里只留最大的 K 个，堆顶就是第 K 大 |\n| Top K 高频 | `347 前 K 个高频元素` | 哈希计数 + 固定大小堆 | 先统计频率，再用堆淘汰低频元素 |\n| 滑动窗口极值 | `239 滑动窗口最大值` | 堆保存值和下标，延迟删除过期元素 | 堆顶过期就弹，没过期就是窗口最大值 |\n| 数据流中位数 | `295 数据流的中位数` | 双堆分区和平衡 | 左堆放较小半，右堆放较大半 |\n\n## 3. 复习顺序建议\n\n建议按“单堆极值 → 固定大小 Top K → 多路归并 → 双堆设计”的顺序复习：\n\n1. `215 数组中的第 K 个最大元素`：先写固定大小小顶堆，理解“淘汰最弱候选”。\n2. `347 前 K 个高频元素`：在 `215` 基础上增加哈希计数和自定义比较。\n3. `23 合并 K 个升序链表`：理解小顶堆做多路归并。\n4. `239 滑动窗口最大值`：掌握堆的延迟删除思想，并对比单调队列更优解。\n5. `295 数据流的中位数`：掌握双堆大小平衡和顺序平衡。\n6. 回头总结 C++ `priority_queue` 比较器方向：默认大顶堆，小顶堆要写 `greater\u003cT>` 或自定义 `return a > b`。\n\n## 4. 关键套路详解\n\n### 4.1 C++ priority_queue 默认是大顶堆\n\nC++ 的 `priority_queue\u003cint>` 默认让最大值在堆顶。如果要最小值在堆顶，需要写：\n\n```text\npriority_queue\u003cint, vector\u003cint>, greater\u003cint>> minHeap;\n```\n\n如果元素是结构体或指针，比较器的方向最容易写反。记住：`priority_queue` 中 comparator 返回 `true` 表示“a 的优先级低于 b，需要排在 b 后面”。所以小顶堆比较节点值时常写 `return a->val > b->val`。\n\n### 4.2 固定大小堆的本质是淘汰\n\n`215` 和 `347` 都可以用固定大小堆。关键在于只保留 K 个最有竞争力的元素。\n\n| 目标 | 使用堆 | 淘汰谁 | 堆顶含义 |\n|---|---|---|---|\n| 第 K 大 | 小顶堆 | 超过 K 时淘汰当前最小 | 第 K 大 |\n| 第 K 小 | 大顶堆 | 超过 K 时淘汰当前最大 | 第 K 小 |\n| Top K 高频 | 按频率的小顶堆 | 超过 K 时淘汰最低频 | 第 K 高频的边界 |\n\n如果 K 很接近 N，堆仍然能过，但快速选择可能更优。复习堆专题时优先掌握堆法，因为模板更稳定。\n\n### 4.3 K 路归并只放“当前候选”\n\n`23 合并 K 个升序链表` 不需要把所有节点一次性放入堆。每条链表天然有序，所以每条链只需要把当前头节点作为候选放入堆。弹出某个节点后，再把它的下一个节点补进堆。\n\n这个模型也适用于合并 K 个有序数组、找有序矩阵第 K 小、多个日志流按时间合并。\n\n### 4.4 滑动窗口堆要处理过期元素\n\n`239 滑动窗口最大值` 的堆写法把 `{值, 下标}` 放进大顶堆。窗口右端推进时不断入堆，但堆里会残留已经离开窗口的旧元素。不要试图在元素过期时从堆中间删除，因为 `priority_queue` 不支持高效删除任意元素。\n\n正确做法是延迟删除：每次取答案前，检查堆顶下标是否还在窗口内。如果过期，就弹掉，直到堆顶有效。\n\n这道题最优解是单调队列，但堆写法仍然是理解“过期候选”的重要模板。\n\n### 4.5 数据流中位数要同时维护两个不变式\n\n`295 数据流的中位数` 需要维护两个不变式：\n\n| 不变式 | 含义 | 维护方式 |\n|---|---|---|\n| 顺序不变式 | 左堆所有元素都小于等于右堆所有元素 | 新数先按大小放入对应堆，必要时跨堆移动 |\n| 大小不变式 | 两堆大小差不超过 1 | 哪边多太多，就把堆顶移到另一边 |\n\n常见写法是让左边大顶堆 `small` 的大小等于右边小顶堆 `large`，或只比右边多 1。这样奇数个元素时中位数是 `small.top()`，偶数个元素时是两堆顶平均值。\n\n## 5. 抽象代码模板\n\n下面模板按“动态极值维护”的模型抽象。复习时先判断要保留 Top K、合并多路候选、清理过期元素，还是用双堆维护分位点。\n\n### 5.1 固定大小堆维护 Top K\n\n#### 适用题型\n\n- `215 数组中的第 K 个最大元素`。\n- 数据流中持续保留最大的 K 个元素。\n- 求第 K 小、最小 K 个数等对称问题。\n\n#### 核心思路\n\n固定大小堆的共同抽象是“只保留 K 个强候选，堆顶永远是这 K 个候选里最弱的那个”。第 K 大和第 K 小不需要写成两套无关模板，差别只有堆的方向和淘汰谁。\n\n关键不变量：\n\n- 堆大小不超过 K。\n- 堆顶是当前保留候选中最应该被淘汰的元素。\n- 第 K 大：保留最大的 K 个，最弱候选是其中最小值，所以用小顶堆。\n- 第 K 小：保留最小的 K 个，最弱候选是其中最大值，所以用大顶堆。\n\n#### 代码模板：共同骨架\n\n> **题目简述：** 215 数组中的第 K 个最大元素：给定无序数组和 K，返回按排序名次计算的第 K 大元素，而非第 K 个不同值。 [力扣原题 ↗](https://leetcode.cn/problems/kth-largest-element-in-an-array/)\n\n```cpp\nint kthLargestTemplate(const vector\u003cint>& nums, int k) {\n    // 共同骨架：扫描元素 -> 入堆 -> 超过 K 就弹出“最弱候选”。\n    // 第 K 大：小顶堆，堆顶是最大 K 个里的最小值。\n    priority_queue\u003cint, vector\u003cint>, greater\u003cint>> heap;\n\n    for (int x : nums) {\n        heap.push(x);\n        if ((int)heap.size() > k) {\n            heap.pop(); // 共同动作：淘汰堆顶这个最弱候选。\n        }\n    }\n\n    return heap.top();\n}\n```\n\n如果题目改成第 K 小，只改堆方向，循环骨架不变：\n\n> **题目简述：** 第 K 小变形：给定整数数组和 K，返回按排序名次计算的第 K 小元素。\n\n```cpp\n// 第 K 小变形点：把小顶堆换成大顶堆。\n// priority_queue\u003cint, vector\u003cint>, greater\u003cint>> heap;  // 第 K 大\npriority_queue\u003cint> heap;                                // 第 K 小\n```\n\n#### 变形点对照\n\n| 题型 | 保留谁 | 堆方向 | 超 K 时淘汰谁 | 堆顶含义 |\n|---|---|---|---|---|\n| 第 K 大 | 最大的 K 个 | 小顶堆 | 当前保留候选中最小的 | 第 K 大 |\n| 第 K 小 | 最小的 K 个 | 大顶堆 | 当前保留候选中最大的 | 第 K 小 |\n| Top K 高频 | 频率最高的 K 个 | 按频率的小顶堆 | 当前最低频候选 | 第 K 高频边界 |\n\n#### 易错点\n\n- 把所有元素都放进堆后再弹，空间退化为 O(n)。\n- 求第 K 大时堆方向写反，导致保留下来的反而是最小 K 个。\n- 只记“第 K 大用小顶堆”，不理解原因，遇到第 K 小或 Top K 高频就容易反向。\n- K 可能等于 1 或等于 n，代码仍要保持同一不变量。\n\n### 5.2 哈希计数 + 固定大小堆\n\n#### 适用题型\n\n- `347 前 K 个高频元素`。\n- 前 K 个高频单词、按权重取 Top K。\n- 需要先聚合，再按频率或分数筛选的题。\n\n#### 核心思路\n\n先用哈希表把原始数组压缩为 `{元素 -> 频率}`，再对频率建固定大小小顶堆。堆顶代表当前 Top K 中频率最低的候选，超过 K 时弹出它。\n\n关键不变量：\n\n- 堆内元素数量不超过 K。\n- 堆顶是当前最应该被淘汰的候选。\n- 比较器必须和“谁更差”一致；有 tie-breaker 时要显式写清。\n\n#### 代码 A：桶排序原始解法\n\n> **题目简述：** 347 前 K 个高频元素：给定整数数组和 K，返回出现频率最高的 K 个元素，结果顺序不限。 [力扣原题 ↗](https://leetcode.cn/problems/top-k-frequent-elements/)\n\n```cpp\nvector\u003cint> topKFrequentByBucketTemplate(vector\u003cint>& nums, int k) {\n    unordered_map\u003cint, int> count;\n    for (int num : nums) {\n        count[num]++;\n    }\n\n    int n = nums.size();\n    vector\u003cvector\u003cint>> buckets(n + 1);\n    for (auto& [num, freq] : count) {\n        buckets[freq].push_back(num);\n    }\n\n    vector\u003cint> res;\n    for (int i = n; i >= 0; i--) {\n        for (int num : buckets[i]) {\n            res.push_back(num);\n            if (res.size() == k) {\n                return res;\n            }\n        }\n    }\n    return res;\n}\n```\n\n#### 代码 B：小顶堆原始解法\n\n> **题目简述：** 347 前 K 个高频元素：给定整数数组和 K，返回出现频率最高的 K 个元素，结果顺序不限。 [力扣原题 ↗](https://leetcode.cn/problems/top-k-frequent-elements/)\n\n```cpp\nvector\u003cint> topKFrequentTemplate(vector\u003cint>& nums, int k) {\n    unordered_map\u003cint, int> count;\n    for (int num : nums) {\n        count[num]++;\n    }\n\n    // pair 的 first 是频率；greater\u003cpair\u003cint,int>> 让最低频候选在堆顶。\n    priority_queue\u003cpair\u003cint, int>, vector\u003cpair\u003cint, int>>, greater\u003cpair\u003cint, int>>> pq;\n    for (auto& [num, freq] : count) {\n        pq.push({freq, num});\n        if (pq.size() > k) {\n            pq.pop();\n        }\n    }\n\n    vector\u003cint> res;\n    while (!pq.empty()) {\n        res.push_back(pq.top().second);\n        pq.pop();\n    }\n    // 如果题目要求“必须按频率从高到低输出”，因为小顶堆最先 pop 出来的是频率相对最小的，\n    // 需要在这里加一句：reverse(res.begin(), res.end());\n    return res;\n}\n```\n\n#### 易错点\n\n- 没有先统计频率，直接对原数组建堆。\n- `pair` 默认先比 first 再比 second，不一定符合题目 tie-breaker。\n- 比较器写反，导致高频元素被当成“更差候选”弹出。\n\n### 5.3 自定义权重 Top K 比较器\n\n#### 适用题型\n\n- `347 前 K 个高频元素` 的多字段排序变体。\n- 前 K 个高频单词、按分数/时间/优先级取 Top K。\n- 需要 tie-breaker 的固定大小堆：频率相同按字典序、编号、时间等规则比较。\n\n#### 核心思路\n\n固定大小 Top K 的核心在于让堆顶成为当前 Top K 中最差的候选。每加入一个新候选，如果堆超过 K，就弹掉堆顶这个最差候选。自定义比较器时要先定义 `worse(a, b)`：如果 `a` 比 `b` 更应该被淘汰，则 `a` 应该浮到堆顶。\n\nC++ `priority_queue` 的比较器方向容易反直觉：`operator()(a, b)` 返回 `true` 表示 `a` 的优先级低于 `b`，所以要让“更差候选”排在堆顶时，比较器必须围绕“谁应该被留下/淘汰”写清楚。\n\n#### 代码模板\n\n> **题目简述：** 自定义权重 Top K：给定带分数和时间戳的候选项，按指定优先级选出前 K 项。\n\n```cpp\nstruct Candidate {\n    int value;\n    int score;\n    int timestamp;\n};\n\nstruct WorseCandidateFirst {\n    bool operator()(const Candidate& a, const Candidate& b) const {\n        if (a.score != b.score) {\n            return a.score > b.score; // 小分数更差；这里返回 true 让高分优先级更高。\n        }\n        return a.timestamp \u003c b.timestamp; // 分数相同，时间更早者更差，优先被淘汰。\n    }\n};\n\nvector\u003cint> topKByCustomWeightTemplate(const vector\u003cCandidate>& items, int k) {\n    priority_queue\u003cCandidate, vector\u003cCandidate>, WorseCandidateFirst> heap;\n\n    for (const Candidate& item : items) {\n        heap.push(item);\n        if ((int)heap.size() > k) {\n            heap.pop(); // 堆顶始终是当前 Top K 中最差的候选。\n        }\n    }\n\n    vector\u003cint> ans;\n    while (!heap.empty()) {\n        ans.push_back(heap.top().value);\n        heap.pop();\n    }\n    reverse(ans.begin(), ans.end()); // 如需从强到弱输出，可按业务规则再排序。\n    return ans;\n}\n```\n\n#### 易错点\n\n- 没先定义“堆顶是最好还是最差”，导致比较器方向反复试错。\n- 多字段排序漏掉 tie-breaker，结果在同分候选上不稳定或不符合题意。\n- 固定大小堆中弹出的是“当前 Top K 中最差”的候选，这个语义必须和比较器一致。\n\n### 5.4 K 路归并小顶堆\n\n#### 适用题型\n\n- `23 合并 K 个升序链表`。\n- 合并 K 个有序数组、日志流、时间线。\n- 从多条有序序列中不断取全局最小候选。\n\n#### 核心思路\n\n每一路本身有序，所以堆里不需要放所有元素，只放每一路当前头部候选。弹出全局最小节点后，把它所在那一路的后继补进堆。\n\n关键不变量：\n\n- 堆中最多每一路一个当前候选。\n- 堆顶是所有未合并元素中当前可确定的最小值。\n- 弹出节点后必须补入它的 `next`，否则该路后续元素会丢失。\n\n#### 代码模板\n\n> **题目简述：** 23 合并 K 个升序链表：给定 K 个升序链表，合并全部结点并返回一个升序链表。 [力扣原题 ↗](https://leetcode.cn/problems/merge-k-sorted-lists/)\n\n```cpp\nstruct ListNode {\n    int val;\n    ListNode* next;\n    ListNode(int x) : val(x), next(nullptr) {}\n};\n\nstruct CompareNode {\n    // 重载括号运算符。注意：在 C++ 优先队列中，想要\"最小堆\"，这里必须用大于号 '>'\n    bool operator()(ListNode* a, ListNode* b) {\n        return a->val > b->val; \n    }\n};\n\nclass Solution {\npublic:\n    ListNode* mergeKLists(vector\u003cListNode*>& lists) {\n        // 1. 召唤金牌管家。尖括号里清清爽爽：\u003c数据类型, 容器类型, 比较规则>\n        priority_queue\u003cListNode*, vector\u003cListNode*>, CompareNode> pq;\n\n        // 2. 请所有班级的排头兵入场（遍历所有链表的头节点）\n        for (ListNode* head : lists) {\n            if (head != nullptr) {\n                pq.push(head); \n            }\n        }\n\n        // 3. 准备接收最终队伍\n        ListNode dummy(-1); \n        ListNode* cur = &dummy;\n\n        // 4. 提取与替补的无限循环\n        while (!pq.empty()) { \n            // 动作A：管家把最矮的人推到门口，你把他领走\n            ListNode* node = pq.top(); \n            pq.pop();\n            \n            // 动作B：替补入场（把你领走的人的下一个小弟送进堆里）\n            if (node->next != nullptr) { \n                pq.push(node->next); \n            }\n            \n            // 动作C：把领走的人接在最终的队伍后面\n            cur->next = node; \n            cur = cur->next; \n        }\n\n        return dummy.next; \n    }\n};\n```\n\n#### 易错点\n\n- 一次性把所有链表节点入堆，空间从 O(k) 退化为 O(n)。\n- C++ 自定义比较器方向写反，小顶堆变成大顶堆。\n- 弹出节点后忘记压入后继节点。\n\n### 5.5 滑动窗口堆 + 延迟删除\n\n#### 适用题型\n\n- `239 滑动窗口最大值` 的堆写法。\n- 带过期时间的实时最大值/最小值查询。\n- `priority_queue` 不能从堆中间删除，需要惰性清理的场景。\n\n#### 核心思路\n\n堆中保存 `{value, index}`。右端点每前进一步就把新元素入堆，旧元素不主动删除；每次取答案前，只检查堆顶是否已经离开窗口，若过期就不断弹出，直到堆顶有效。\n\n关键不变量：\n\n- 堆中允许存在过期元素，但答案只能来自有效堆顶。\n- 当前窗口为 `[i - k + 1, i]`，过期条件是 `index \u003c= i - k`。\n- 延迟删除只在“堆顶被需要时”清理，不试图删除堆内部元素。\n\n#### 代码模板\n\n> **题目简述：** 239 滑动窗口最大值：给定整数数组和窗口大小 K，返回窗口从左向右滑动时每个位置的最大值。 [力扣原题 ↗](https://leetcode.cn/problems/sliding-window-maximum/)\n\n```cpp\nvector\u003cint> maxSlidingWindowByHeapTemplate(const vector\u003cint>& nums, int k) {\n    priority_queue\u003cpair\u003cint, int>> heap; // {value, index}\n    vector\u003cint> ans;\n\n    for (int i = 0; i \u003c (int)nums.size(); i++) {\n        heap.push({nums[i], i});\n\n        while (!heap.empty() && heap.top().second \u003c= i - k) {\n            heap.pop();\n        }\n        if (i >= k - 1) {\n            ans.push_back(heap.top().first);\n        }\n    }\n\n    return ans;\n}\n```\n\n#### 易错点\n\n- 取答案前没有清理过期堆顶，返回了窗口外元素。\n- 过期边界写成 `\u003c i - k`，导致刚离窗元素仍被保留。\n- 误以为堆写法是 O(n)，实际是 O(n log n)；最优解通常是单调队列。\n\n### 5.6 双堆维护数据流中位数\n\n#### 适用题型\n\n- `295 数据流的中位数`。\n- 动态插入并查询中位数或相邻分位点。\n- 需要把数据流分成较小半和较大半的设计题。\n\n#### 核心思路\n\n用大顶堆 `minHeap` 保存较小的一半，用小顶堆 `maxHeap` 保存较大的一半。约定 `minHeap.size()` 等于 `maxHeap.size()` 或只比它多 1。插入后通过跨堆移动堆顶恢复大小平衡，堆顶就能直接给出中位数。\n\n关键不变量：\n\n- 顺序不变量：`minHeap` 中所有元素都不大于 `maxHeap` 中所有元素。\n- 大小不变量：`minHeap.size() == maxHeap.size()` 或 `minHeap.size() == maxHeap.size() + 1`。\n- 奇数个元素时中位数为 `minHeap.top()`，偶数时为两堆顶平均。\n\n#### 代码模板\n\n> **题目简述：** 295 数据流的中位数：设计结构持续接收整数，并能随时返回当前所有数据的中位数。 [力扣原题 ↗](https://leetcode.cn/problems/find-median-from-data-stream/)\n\n```cpp\nclass MedianFinder {\nprivate:\n    priority_queue\u003cint, vector\u003cint>, less\u003cint>> maxHeap;\n    priority_queue\u003cint, vector\u003cint>, greater\u003cint>> minHeap;\n\npublic:\n    MedianFinder() {\n    }\n    \n    void addNum(int num) {\n        maxHeap.push(num);\n        minHeap.push(maxHeap.top());\n        maxHeap.pop();\n        if (minHeap.size() > maxHeap.size()) {\n            maxHeap.push(minHeap.top());\n            minHeap.pop();\n        }\n    }\n    \n    double findMedian() {\n        if (maxHeap.size() > minHeap.size()) {\n            return maxHeap.top();\n        }\n        return (maxHeap.top() + minHeap.top()) / 2.0;\n    }\n};\n```\n\n#### 易错点\n\n- 只维护大小平衡，没有维护左右顺序。\n- 偶数中位数直接整数相加再除以 2，出现整数除法或溢出风险。\n- 扩展到滑动窗口中位数时，忘记普通 `priority_queue` 无法直接删除任意元素，需要额外延迟删除表。\n\n## 6. 高频易错点清单\n\n| 易错点 | 典型题目 | 规避方式 |\n|---|---|---|\n| C++ 小顶堆比较器写反 | `23`、`215`、`347` | 小顶堆常写 `greater\u003cint>` 或 `return a->val > b->val` |\n| 第 K 大把所有元素入堆后才弹 | `215` | 固定大小为 K，超出就弹，空间 O(K) |\n| Top K 高频没有先统计频率 | `347` | 先 `unordered_map` 计数，再对频率建堆 |\n| pair 默认排序维度不符合题意 | `347`、自定义 Top K | 明确 `{frequency, value}` 的排序含义，必要时写 comparator |\n| K 路归并一次性把所有节点入堆 | `23` | 每条链只放当前候选，弹出后补后继 |\n| 合并链表弹出节点后忘记压入 next | `23` | `if (node->next) heap.push(node->next)` |\n| 滑动窗口堆顶已经过期 | `239` | 取答案前 while 弹出 `index \u003c= i - k` |\n| 数据流中位数只平衡大小，不保证顺序 | `295` | 插入时按 `small.top()` 分堆，必要时跨堆移动 |\n| 双堆大小差超过 1 | `295` | 每次 add 后调用 rebalance |\n| 偶数中位数整数溢出或整数除法 | `295` | 转成 `double` 或用 `long long` 后再平均 |\n\n## 7. 最短复盘口诀\n\n堆题先问“谁最该被处理”。取最小用小顶堆，取最大用大顶堆；Top K 用固定大小堆，超 K 淘汰最弱；K 路归并每路只放当前候选；窗口堆要延迟删除过期下标；中位数用双堆，左边大顶堆、右边小顶堆，大小和平衡顺序都要守住。`215/347` 是 Top K 母题，`23` 是多路归并母题，`295` 是双堆母题。\n\n\n\n================================================================================\n\n# 第13部分: 贪心\n\n================================================================================\n\n> 目标：本文把 Hot100 贪心题抽象成“局部选择为什么能推出全局最优”的复习笔记。复习时不要只背做法，必须能说清楚贪心指标、维护变量和正确性理由。\n\n## 1. 贪心题的底层模型\n\n贪心题的关键在于证明当前选择不会破坏全局最优。每道贪心题先问五个问题：\n\n| 问题           | 如果答案是“是”     | 常用处理                    |\n| ------------ | ------------ | ----------------------- |\n| 是否能维护一个最远边界  | 跳跃游戏、跳跃游戏 II | 扫描时更新 `farthest` 或当前层边界 |\n| 是否能通过双指针丢弃劣解 | 盛最多水的容器      | 移动短板，因为长板移动不可能更优        |\n| 是否按区间最右端合并   | 划分字母区间       | 先记录最后出现位置，再扩张当前段        |\n| 是否只需当前最优状态   | 股票一次买卖       | 维护历史最低价和当前最大收益          |\n| 贪心选择是否有交换论证  | 多数区间、排序题     | 证明换成局部最优不会变差            |\n\n贪心题最常见的维护对象有三类：\n\n| 维护对象 | 含义 | 代表题 |\n|---|---|---|\n| 最远可达位置 | 当前扫描范围内能到的最远下标 | `55`、`45` |\n| 当前区间右边界 | 当前必须覆盖到的位置 | `45`、`763` |\n| 一对候选边界 | 左右指针决定当前候选空间 | `11` |\n\n## 2. Hot100 贪心题型地图\n\n贪心专题覆盖 4 道典型题。`45`、`55` 同时可从动态规划理解，但复习时应优先掌握贪心写法。\n\n| 题型 | 题目 | 抽象能力 | 一句话记忆 |\n|---|---|---|---|\n| 双指针淘汰劣解 | `11 盛最多水的容器` | 判断哪一侧移动才可能变好 | 面积受短板限制，移动长板没有意义 |\n| 可达性边界 | `55 跳跃游戏` | 扫描时维护最远可达 | 一旦当前位置超过 farthest，就断档 |\n| BFS 层贪心 | `45 跳跃游戏 II` | 当前步数覆盖一层范围 | 扫到当前层末尾时必须跳一次 |\n| 区间闭合 | `763 划分字母区间` | 用字符最后位置扩张片段 | 当前段右端等于扫描位置时才能切开 |\n\n## 3. 复习顺序建议\n\n建议按“边界维护 → 层边界 → 区间闭合 → 双指针证明”的顺序复习：\n\n1. `55 跳跃游戏`：掌握 `farthest` 可达边界。\n2. `45 跳跃游戏 II`：在 `farthest` 基础上增加当前层边界 `end`。\n3. `763 划分字母区间`：练“当前段必须覆盖所有已见字符最后位置”。\n4. `11 盛最多水的容器`：练反证法和淘汰劣解。\n\n## 4. 关键套路详解\n\n### 4.1 贪心必须能说清“丢掉了什么”\n\n`11 盛最多水的容器` 中左右指针形成当前最大宽度。如果左边更矮，面积上限由左边决定。移动右指针只会让宽度变小，短板高度还没变，因此不可能得到更大面积。能产生更优解的唯一希望是移动短板。\n\n贪心每一步都安全地丢掉一批不可能成为最优解的候选。\n\n### 4.2 跳跃游戏的本质是维护覆盖范围\n\n`55` 只问能不能到达终点，所以维护一个 `farthest` 就够了。扫描到 `i` 时，如果 `i \u003c= farthest`，说明当前位置可达，可以继续更新 `farthest = max(farthest, i + nums[i])`。\n\n`45` 问最少跳几次，可以把每次跳跃看成 BFS 的一层。`end` 表示当前步数能覆盖的最右端，`farthest` 表示下一步能覆盖的最右端。扫描到 `end` 时，必须增加一步，并把下一层边界更新为 `farthest`。\n\n### 4.3 区间闭合题先找“最后一次出现”\n\n`763 划分字母区间` 的贪心选择是：当前段必须包含段内所有字符的最后出现位置。因此扫描时不断用 `last[s[i]]` 扩张右边界。当扫描位置 `i == right` 时，说明当前段内所有字符都不会再出现在后面，此时切开一定安全。\n\n这个思路也适用于很多“同类元素不能跨区间”的题。\n\n### 4.4 DP 能写不代表贪心不该写\n\n`55`、`45` 都可以写 DP，但 DP 会保留大量不必要状态。贪心本质上是把所有可达位置压缩成一个最远边界，把 BFS 队列的一层压缩成 `[start, end]` 区间。\n\n当题目只关心可达性、最少层数或区间是否闭合时，优先考虑边界压缩。\n\n## 5. 抽象代码模板\n\n下面模板以原始单题笔记的参考解法为主，再按贪心证明方式组织。每个模板都要同时回答三件事：维护什么局部状态、当前选择丢弃了哪些候选、为什么这些候选不可能产生更优解。\n\n### 5.1 最远可达边界\n\n#### 适用题型\n\n- `55 跳跃游戏`：判断是否存在一条路径到达终点。\n- 一维覆盖类问题：扫描过程中只关心“目前能覆盖到的最远位置”。\n- 只需要可达性，不需要还原具体路径的题。\n\n#### 核心思路\n\n`farthest` 表示在已经确认可达的位置中，下一步能扩展出的最远下标。只要当前下标 `i \u003c= farthest`，就说明 `i` 可达，可以用 `i + nums[i]` 更新覆盖范围；如果出现 `i > farthest`，前面的所有可达点都无法跨过断档，后续位置自然也无法被访问。\n\n贪心证明点是“边界支配”：在扫描到 `i` 之前，所有可达位置产生的后续可能性都被压缩进了一个最大的 `farthest`。保留较小可达终点不会带来额外优势，因此可以安全丢弃。\n\n#### 代码模板\n\n> **题目简述：** 55 跳跃游戏：数组元素表示当前位置的最大跳跃长度，判断能否到达最后一个下标。 [力扣原题 ↗](https://leetcode.cn/problems/jump-game/)\n\n```cpp\n#include \u003cbits/stdc++.h>\nusing namespace std;\n\nbool canReachEndGreedyTemplate(const vector\u003cint>& nums) {\n    int n = nums.size();\n    int farthest = 0; // 已扫描可达点能共同扩展出的最远位置\n\n    for (int i = 0; i \u003c n; i++) {\n        // 当前位置已经超过覆盖边界，说明前面所有选择都跨不过这个断档。\n        if (i > farthest) {\n            return false;\n        }\n\n        // 只要 i 可达，就把从 i 出发的能力合并到全局最远边界中。\n        farthest = max(farthest, i + nums[i]);\n        if (farthest >= n - 1) {\n            return true; // 可达性题可以提前结束，不必继续扫描。\n        }\n    }\n\n    return true;\n}\n```\n\n#### 易错点\n\n- 更新 `farthest` 前必须先判断 `i` 是否可达，否则会用不可达位置错误扩展边界。\n- `farthest` 表示“最远覆盖”，无需还原具体下一步落点。\n- 空数组、单元素数组如果题目允许出现，需要单独按题意处理。\n\n### 5.2 层边界最少跳数\n\n#### 适用题型\n\n- `45 跳跃游戏 II`：求到达终点的最少跳数，原题保证一定可达。\n- 每次操作可以把当前一批状态扩展到下一批状态，且每层代价相同的题。\n- BFS 可以做但状态是一维连续区间，适合压缩成左右边界的题。\n\n#### 核心思路\n\n把“跳一次”理解成 BFS 的一层。`end` 是当前跳数能覆盖到的右边界，`maxlength` 是遍历当前层过程中合并得到的“下一层最远覆盖边界”。扫描到 `end` 时，当前层已经处理完，若还没到终点，就必须增加一次跳跃并进入下一层。\n\n贪心证明点在于“同样跳数下，只需要保留下一层能覆盖到的最远右边界”。当前层所有可达点扩展出的下一层候选区间，被合并压缩为一个最大右边界 `maxlength`；较小覆盖边界被它支配，不会产生更少跳数。\n\n#### 代码模板\n\n> **题目简述：** 45 跳跃游戏 II：数组元素表示最大跳跃长度，在保证可达末尾时求最少跳跃次数。 [力扣原题 ↗](https://leetcode.cn/problems/jump-game-ii/)\n\n```cpp\nint minJumpLayerGreedyTemplate(const vector\u003cint>& nums) {\n    int maxlength = 0; // 当前层内所有位置再跳一步后，能覆盖到的最远位置。\n    int end = 0;       // 当前 res 次跳跃能覆盖到的右边界。\n    int res = 0;\n\n    // 原始笔记强调遍历到 nums.size() - 1 之前即可，站到终点后不需要再跳。\n    // LeetCode 45 保证可达，所以这里不写通用不可达返回值，避免制造错误语义。\n    for (int i = 0; i \u003c (int)nums.size() - 1; i++) {\n        maxlength = max(maxlength, i + nums[i]);\n\n        if (i == end) {\n            end = maxlength;\n            res++;\n        }\n    }\n\n    return res;\n}\n```\n\n#### 变形点对照\n\n| 场景 | 是否保证可达 | 模板处理 | 备注 |\n|---|---|---|---|\n| `45` 原题 | 保证 | 不写不可达分支，按层边界计数 | 与原始笔记一致 |\n| 通用最少跳 | 不保证 | 需要在 `i == end && maxlength == end` 时判定无法继续扩展 | 不要直接套原题代码 |\n| BFS 显式写法 | 不一定 | 队列按层扩展 | 一维连续覆盖时可压缩成 `end/maxlength` |\n\n#### 易错点\n\n- 循环到 `n - 1` 容易在终点多加一次跳数。\n- `end` 和 `maxlength` 不能混用：前者是当前层边界，后者是下一层合并后的最远覆盖。\n- `45` 原题保证可达；如果自己写通用模板，必须额外处理无法扩展的断档，不要返回一个看似合法的跳数。\n\n### 5.3 双指针淘汰劣解\n\n#### 适用题型\n\n- `11 盛最多水的容器`。\n- 答案由左右边界共同决定，且每次能证明某一侧边界可以整批淘汰的题。\n- 宽度、区间长度随指针内移单调减少的候选空间题。\n\n#### 核心思路\n\n当前面积由 `min(height[left], height[right]) * width` 决定。假设左板更短，如果移动右指针，宽度只会变小，短板仍然不高于原左板，面积不可能超过当前组合；因此所有“固定左板、右端继续左移”的候选都可以被丢弃，唯一可能变好的是移动短板。\n\n贪心证明点是“反证淘汰”：被丢弃的一批候选在关键上界上不超过当前答案，所以不可能包含全局最优。\n\n#### 代码模板\n\n> **题目简述：** 11 盛最多水的容器：给定各位置的高度，选择两条竖线，使其与横轴围成的容器容量最大。 [力扣原题 ↗](https://leetcode.cn/problems/container-with-most-water/)\n\n```cpp\nint maxContainerByEliminationTemplate(const vector\u003cint>& height) {\n    int left = 0;\n    int right = (int)height.size() - 1;\n    int ans = 0;\n\n    while (left \u003c right) {\n        int width = right - left;\n        int shortSide =
