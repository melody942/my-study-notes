n\n#### 易错点\n\n- 这套最短和窗口要求数组为正数；有负数时应改用前缀和类方法。\n- 更新最短答案必须放在 `while (state >= k)` 内，不能只在右扩后更新一次。\n- 出窗时要先撤销 `nums[left]`，再 `left++`，保持窗口状态和边界一致。\n\n## 6. 高频易错点清单\n\n| 易错点 | 典型题目 | 规避方式 |\n|---|---|---|\n| 没定义窗口合法性就写循环 | `3`、`76` | 先写出合法条件 |\n| 最长窗口在非法状态更新答案 | `3` | 先 `while` 缩左恢复合法，再插入当前字符并更新 |\n| 遇到重复字符只删一次左端 | `3` | 用 `while (window.count(s[right]))` 持续删除到不重复 |\n| 最短窗口只找到一个满足窗口就停 | `76` | 满足后还要继续缩左找最短 |\n| `valid` 和 `t.size()` 比较 | `76` | `valid` 是满足种类数，应比较 `map.size()` |\n| 欠账表加减方向写反 | `76`、`438` | 右扩还债 `--`，左缩撤销 `++` |\n| 异位词窗口每轮比较两张表 | `438` | 原始写法用当前字符透支 `map[in] \u003c 0` 驱动左缩 |\n| 单调队列保存值不保存下标 | `239` | 必须用下标判断过期 |\n| 队尾淘汰只用 `if` | `239` | 弱候选可能有多个，必须用 `while` 弹到单调 |\n| 队尾淘汰方向写反 | `239` | 最大值窗口保持队列值递减 |\n\n## 7. 最短复盘口诀\n\n滑窗题先定合法性。最长题非法就缩左，合法后更新；最短题满足就缩左，缩时更新；固定窗口到长度再判断；最大值窗口用单调队列，下标负责过期，队尾负责淘汰弱候选。\n\n================================================================================\n\n# 第4部分: 矩阵\n\n================================================================================\n\n> 目标：本文把 Hot100 中二维数组、网格图、棋盘搜索和矩阵 DP 抽象成若干“可复用题型模板”。复习时先判断矩阵的坐标语义，再决定遍历顺序、边界收缩、原地标记、二分方式或 DFS/BFS 状态。\n\n## 1. 矩阵题的底层模型\n\n矩阵题的核心在于把 `(r, c)` 的含义说清楚。每道矩阵题先问六个问题：\n\n| 问题             | 如果答案是“是”         | 常用处理             |\n| -------------- | ---------------- | ---------------- |\n| 是否要按特定顺序访问每个格子 | 螺旋遍历、旋转图像        | 边界收缩、层级处理、坐标映射   |\n| 是否可以原地修改矩阵     | 矩阵置零、岛屿数量、腐烂橘子   | 首行首列标记、染色、入队即标记  |\n| 行列是否有序         | 搜索二维矩阵、搜索二维矩阵 II | 展平成一维二分、右上角阶梯搜索  |\n| 相邻格子是否代表边      | 岛屿数量、腐烂橘子、单词搜索   | 方向数组生成邻居         |\n| 答案是否依赖上方或左方状态  | 不同路径、最小路径和       | 二维 DP 或滚动数组      |\n| 路径状态是否需要撤销     | 单词搜索             | 回溯 DFS，进入标记，退出恢复 |\n\n矩阵题常见的坐标模型有四类：\n\n| 坐标模型 | 代表题 | 关键动作 |\n|---|---|---|\n| 边界模型 | `54 螺旋矩阵`、`48 旋转图像` | 维护上下左右边界或按层处理 |\n| 标记模型 | `73 矩阵置零`、`200 岛屿数量` | 用矩阵自身或额外 visited 表示状态 |\n| 有序模型 | `74 搜索二维矩阵`、`240 搜索二维矩阵 II` | 二分、阶梯搜索、候选区域缩小 |\n| 状态转移模型 | `62 不同路径`、`64 最小路径和` | 当前格子由上方和左方转移 |\n\n## 2. Hot100 矩阵题型地图\n\n\n| 题型 | 题目 | 抽象能力 | 一句话记忆 |\n|---|---|---|---|\n| 矩阵原地变换 | `48 旋转图像` | 坐标映射、转置加翻转、四点轮换 | 旋转需要处理每个坐标的目标位置 |\n| 边界收缩遍历 | `54 螺旋矩阵` | 上下左右边界维护 | 每走完一条边，就收缩对应边界 |\n| 矩阵标记 | `73 矩阵置零` | 首行首列作为标记位 | 标记和执行要分两阶段，首列单独记 |\n| 展平二分 | `74 搜索二维矩阵` | 二维坐标和一维下标互转 | `mid / n` 找行，`mid % n` 找列 |\n| 阶梯搜索 | `240 搜索二维矩阵 II` | 从右上角排除一行或一列 | 大了左移，小了下移 |\n| 网格连通块 | `200 岛屿数量` | DFS/BFS 吃掉整块 | 发现新陆地，整座岛染掉 |\n| 多源 BFS | `994 腐烂的橘子` | 队列按层扩散 | 所有腐烂橘子第 0 分钟同时入队 |\n| 网格回溯 | `79 单词搜索` | 路径状态临时标记 | 当前路径不能重复用格子，失败后恢复 |\n| 矩阵 DP | `62 不同路径`、`64 最小路径和` | 从上和左转移 | 第一行第一列是边界，内部格子看上左 |\n\n## 3. 复习顺序建议\n\n建议按“坐标遍历 → 原地标记 → 有序搜索 → 网格图 → 矩阵 DP”的顺序复习：\n\n1. `54 螺旋矩阵`：练边界变量和循环退出条件。\n2. `48 旋转图像`：掌握转置加水平翻转，理解坐标映射。\n3. `73 矩阵置零`：练原地标记和首行首列边界。\n4. `74 搜索二维矩阵`：把二维矩阵展平成一维二分。\n5. `240 搜索二维矩阵 II`：从右上角阶梯式排除候选区域。\n6. `200 岛屿数量`：用 DFS/BFS 处理网格连通块。\n7. `994 腐烂的橘子`：用多源 BFS 处理最短时间。\n8. `79 单词搜索`：练回溯 DFS 的进入标记和退出恢复。\n9. `62`、`64`：把矩阵坐标转成 DP 状态。\n\n## 4. 关键套路详解\n\n### 4.1 矩阵题先定义坐标含义\n\n写代码前先确定：`m` 是行数，`n` 是列数，`r` 表示第几行，`c` 表示第几列。很多错误来自把行列维度写反，尤其是 `matrix[r][c]`、`r \u003c m`、`c \u003c n` 三者不一致。\n\n`74` 展平成一维后，下标 `idx` 对应 `(idx / n, idx % n)`。这里必须除以列数 `n`，不能除以行数 `m`。\n\n### 4.2 边界收缩题要防止重复访问\n\n`54 螺旋矩阵`每一圈最多走四条边：上边、右边、下边、左边。走下边前要确认 `top \u003c= bottom`，走左边前要确认 `left \u003c= right`。否则单行或单列矩阵会重复加入元素。\n\n边界题最稳的写法是每走完一条边立即收缩，并在进入下一条边前检查边界是否仍合法。\n\n### 4.3 原地标记要分清“记录阶段”和“执行阶段”\n\n`73 矩阵置零`不能看到一个 0 就立刻清整行整列，因为新制造的 0 会污染后续判断。正确逻辑是先记录哪些行列需要置零，再统一执行。\n\n如果要求 O(1) 额外空间，可以把首行和首列当作标记数组。但 `matrix[0][0]` 同时属于首行和首列，所以通常额外用 `firstColZero` 记录首列是否需要清零。\n\n### 4.4 有序矩阵有两种完全不同的搜索模型\n\n`74 搜索二维矩阵`每行递增，且下一行首元素大于上一行尾元素，所以整个矩阵可以视为一个升序数组，直接二分。\n\n`240 搜索二维矩阵 II`每行递增、每列递增，但不能整体展平为全局有序数组。右上角是最好的决策点：当前值大于目标，当前列下面都更大，只能左移；当前值小于目标，当前行左边都更小，只能下移。\n\n### 4.5 网格 DFS/BFS 的边界判断必须统一\n\n网格题通常用方向数组生成邻居：\n\n```cpp\nint dirs[4][2] = {{0, 1}, {0, -1}, {1, 0}, {-1, 0}};\n```\n\nDFS 入口要先判断越界、格子值是否符合、是否已访问。BFS 则要在邻居入队时就标记访问，避免同一个格子被同层多个节点重复入队。\n\n### 4.6 统计连通块可以永久染色，路径搜索必须回溯\n\n`200 岛屿数量`只关心每座岛统计一次，所以可以把访问过的 `'1'` 永久改成 `'0'`。`79 单词搜索`是在找一条具体路径，当前路径不能重复使用格子，但失败后别的路径仍然可以使用这个格子，因此必须恢复现场。\n\n一句话区分：统计类染掉不回来，路径类标记后要撤销。\n\n### 4.7 矩阵 DP 的方向来自题目允许的移动\n\n`62` 和 `64` 只允许向右或向下走，所以到达 `(r, c)` 只能来自 `(r - 1, c)` 或 `(r, c - 1)`。如果题目允许四个方向，就不能直接套这种 DP，通常要变成图搜索或最短路。\n\n## 5. 抽象代码模板\n\n下面模板按矩阵坐标模型抽象出可迁移骨架。复习时先统一 `m` 为行数、`n` 为列数、`r/c` 为坐标，再决定边界收缩、方向数组、原地标记或 DP 顺序。\n\n### 5.1 边界收缩遍历\n\n#### 适用题型\n\n- `54 螺旋矩阵`：按上、右、下、左顺序收集元素。\n- 只处理矩阵外圈，或按层处理矩阵。\n- 需要避免单行、单列重复访问的边界题。\n\n#### 核心思路\n\n维护四个边界 `top/bottom/left/right` 表示当前尚未访问的矩形区域。每走完一条边就收缩对应边界；在处理下边和左边前检查边界是否仍合法，避免单行或单列被重复访问。\n\n关键不变量：\n\n- `[top, bottom]` 和 `[left, right]` 是未处理区域。\n- 每个元素只在所属边第一次被扫描时加入答案。\n- 收缩边界后必须重新判断区域是否为空。\n\n#### 代码模板\n\n> **题目简述：** 54 螺旋矩阵：给定二维矩阵，按从外到内的顺时针螺旋顺序返回全部元素。 [力扣原题 ↗](https://leetcode.cn/problems/spiral-matrix/)\n\n```cpp\n#include \u003cbits/stdc++.h>\nusing namespace std;\n\nvector\u003cint> spiralOrderTemplate(const vector\u003cvector\u003cint>>& matrix) {\n    vector\u003cint> ans;\n    if (matrix.empty() || matrix[0].empty()) {\n        return ans;\n    }\n\n    int top = 0;\n    int bottom = (int)matrix.size() - 1;\n    int left = 0;\n    int right = (int)matrix[0].size() - 1;\n\n    while (top \u003c= bottom && left \u003c= right) {\n        for (int c = left; c \u003c= right; c++) ans.push_back(matrix[top][c]);\n        top++;\n\n        for (int r = top; r \u003c= bottom; r++) ans.push_back(matrix[r][right]);\n        right--;\n\n        if (top \u003c= bottom) {\n            for (int c = right; c >= left; c--) ans.push_back(matrix[bottom][c]);\n            bottom--;\n        }\n\n        if (left \u003c= right) {\n            for (int r = bottom; r >= top; r--) ans.push_back(matrix[r][left]);\n            left++;\n        }\n    }\n\n    return ans;\n}\n```\n\n#### 易错点\n\n- 下边和左边处理前不检查边界，单行单列重复加入。\n- `top/bottom` 与 `left/right` 更新顺序混乱。\n- 行列变量写反，把 `matrix[r][c]` 写成 `matrix[c][r]`。\n\n### 5.2 矩阵原地旋转\n\n#### 适用题型\n\n- `48 旋转图像`：`n x n` 矩阵顺时针旋转 90 度。\n- 转置、水平翻转、垂直翻转等坐标映射题。\n- 要求原地修改矩阵的方阵变换。\n\n#### 核心思路\n\n顺时针旋转 90 度可以拆成两步：先沿主对角线转置，再反转每一行。转置时只交换 `c > r` 的上三角元素，避免同一对坐标交换两次。\n\n关键不变量：\n\n- 转置后 `(r, c)` 与 `(c, r)` 互换。\n- 每行反转后列坐标变为 `n - 1 - c`。\n- 原地修改会覆盖旧值，必须使用安全的交换顺序。\n\n#### 代码模板\n\n> **题目简述：** 48 旋转图像：给定 N×N 方阵，将图像原地顺时针旋转九十度。 [力扣原题 ↗](https://leetcode.cn/problems/rotate-image/)\n\n```cpp\nvoid rotateMatrixTemplate(vector\u003cvector\u003cint>>& matrix) {\n    int n = matrix.size();\n\n    for (int r = 0; r \u003c n; r++) {\n        for (int c = r + 1; c \u003c n; c++) {\n            swap(matrix[r][c], matrix[c][r]);\n        }\n    }\n\n    for (int r = 0; r \u003c n; r++) {\n        reverse(matrix[r].begin(), matrix[r].end());\n    }\n}\n```\n\n#### 易错点\n\n- 转置时内层从 0 开始，导致元素被交换两次。\n- 非方阵不能直接套原地旋转模板。\n- 四点轮换时直接覆盖目标格，没用临时变量保存旧值。\n\n### 5.3 矩阵置零的原地标记\n\n#### 适用题型\n\n- `73 矩阵置零`。\n- 先记录状态、后执行修改的原地标记题。\n- 可以借用矩阵自身某些行列作为标记数组的题。\n\n#### 核心思路\n\n不能看到 0 就立即清整行整列，否则新制造的 0 会污染后续扫描。O(1) 空间做法是用第一行和第一列记录哪些列、哪些行需要清零；由于 `matrix[0][0]` 同时属于首行首列，单独用 `firstColZero` 记录首列是否清零。\n\n关键不变量：\n\n- 第一轮只标记，不执行清零。\n- 首列状态不能只靠 `matrix[0][0]` 表示。\n\n#### 代码模板\n\n> **题目简述：** 73 矩阵置零：若矩阵某元素为零，则将其整行整列置零，要求在原矩阵上完成。 [力扣原题 ↗](https://leetcode.cn/problems/set-matrix-zeroes/)\n\n```cpp\nclass Solution {\npublic:\n    void setZeroes(vector\u003cvector\u003cint>>& matrix) {\n        int col0=0,m=matrix.size(),n=matrix[0].size();\n        for(int i=0;i\u003cm;i++){\n            if(matrix[i][0]==0) col0=1;\n            for(int j=1;j\u003cn;j++){\n                if(matrix[i][j]==0) {\n                    matrix[i][0]=0;\n                    matrix[0][j]=0;\n                }\n            }\n        }\n        for(int i=1;i\u003cm;i++){\n            for(int j=1;j\u003cn;j++){\n                if(matrix[i][0]==0||matrix[0][j]==0){\n                    matrix[i][j]=0;\n                }\n            }\n        }\n        if(matrix[0][0]==0){\n            for(int j=0;j\u003cn;j++){\n                matrix[0][j]=0;\n            }\n        }\n        if(col0==1){\n            for(int i=0;i\u003cm;i++){\n                matrix[i][0]=0;\n            }\n        }\n\n    }\n};\n```\n\n#### 易错点\n\n- 边扫描边清零，导致后续判断被污染。\n- 忘记单独记录首列，`matrix[0][0]` 标记含义冲突。\n- 从左上往右下执行清零，提前破坏第一行第一列标记。\n\n### 5.4 有序矩阵搜索\n\n#### 适用题型\n\n- `74 搜索二维矩阵`：整体可视为一维升序数组。\n- `240 搜索二维矩阵 II`：每行每列递增，但整体不能展平有序。\n- 候选区域可根据当前值排除一行或一列的题。\n\n#### 核心思路\n\n`74` 的矩阵满足全局有序，可以把 `[0, m * n)` 当作一维下标，坐标换算为 `(idx / n, idx % n)`。`240` 只能从右上角做阶梯搜索：当前值太大就左移排除一列，当前值太小就下移排除一行。\n\n关键不变量：\n\n- 展平二分必须除以列数 `n`，不能除以行数 `m`。\n- 阶梯搜索要求当前位置能同时代表一行最大值和一列最小值。\n- 两种有序条件不同，不能把 `240` 直接展平成全局有序数组。\n\n#### 代码 A：展平二分\n\n> **题目简述：** 74 搜索二维矩阵：矩阵每行升序且下一行首项大于上一行末项，判断目标值是否存在。 [力扣原题 ↗](https://leetcode.cn/problems/search-a-2d-matrix/)\n\n```cpp\nbool searchFlattenedMatrix(const vector\u003cvector\u003cint>>& matrix, int target) {\n    int m = matrix.size();\n    int n = matrix[0].size();\n    int left = 0;\n    int right = m * n;\n\n    while (left \u003c right) {\n        int mid = left + (right - left) / 2;\n        int value = matrix[mid / n][mid % n];\n        if (value \u003c target) {\n            left = mid + 1;\n        } else {\n            right = mid;\n        }\n    }\n\n    return left \u003c m * n && matrix[left / n][left % n] == target;\n}\n```\n\n#### 代码 B：右上角阶梯搜索\n\n> **题目简述：** 240 搜索二维矩阵 II：给定每行和每列均升序的矩阵，判断指定目标值是否存在。 [力扣原题 ↗](https://leetcode.cn/problems/search-a-2d-matrix-ii/)\n\n```cpp\nbool searchStaircaseMatrix(const vector\u003cvector\u003cint>>& matrix, int target) {\n    int m = matrix.size();\n    int n = matrix[0].size();\n    int r = 0;\n    int c = n - 1;\n\n    while (r \u003c m && c >= 0) {\n        if (matrix[r][c] == target) {\n            return true;\n        }\n        if (matrix[r][c] > target) {\n            c--;\n        } else {\n            r++;\n        }\n    }\n\n    return false;\n}\n```\n\n#### 易错点\n\n- 坐标换算写成 `mid / m`、`mid % m`。\n- 把行列分别有序误认为整体有序。\n- 阶梯搜索移动方向反了：右上角大了左移，小了下移。\n\n### 5.5 网格 DFS 连通块染色\n\n#### 适用题型\n\n- `200 岛屿数量`：发现一块陆地后，把整座岛吃掉。\n- 连通块数量、连通块面积、区域染色等访问后不需要恢复的网格题。\n- 只关心“这块区域是否已经被全局处理过”的矩阵搜索题。\n\n#### 核心思路\n\n这些题不应该拆成互不相关的多个 DFS 模板。共同骨架都是：外层找到入口，DFS 判断边界和目标值，进入后立即永久标记，再递归四个方向。差别只在于外层如何结算答案，以及 DFS 是否需要返回面积。\n\n关键不变量：\n\n- `dirs` 中每个方向都表示一次上下左右邻接移动。\n- DFS 入口统一做越界和目标值判断。\n- 访问标记是永久状态，不能在递归退出时恢复。\n- 数量题在“发现新入口”时计数；面积题在 DFS 内累加格子数；染色题把目标值和标记值参数化。\n\n#### 代码模板：共同骨架\n\n> **题目简述：** 200 岛屿数量：给定由陆地和水组成的网格，统计上下左右相连陆地区域的数量。 [力扣原题 ↗](https://leetcode.cn/problems/number-of-islands/)\n\n```cpp\nclass GridFloodFillTemplate {\nprivate:\n    const vector\u003cpair\u003cint, int>> dirs = {{0, 1}, {0, -1}, {1, 0}, {-1, 0}};\n\n    int dfs(vector\u003cvector\u003cint>>& grid, int r, int c, int targetValue, int markValue) {\n        // 共同入口：越界、不属于目标区域、已经被标记过，都直接返回 0 贡献。\n        int m = grid.size();\n        int n = grid[0].size();\n        if (r \u003c 0 || r >= m || c \u003c 0 || c >= n || grid[r][c] != targetValue) {\n            return 0;\n        }\n\n        grid[r][c] = markValue; // 永久染色：修改本身就是 visited 标记。\n        int area = 1;           // 面积变形会用到；数量题可以忽略这个返回值。\n        for (auto [dr, dc] : dirs) {\n            area += dfs(grid, r + dr, c + dc, targetValue, markValue);\n        }\n        return area;\n    }\n\npublic:\n    int countComponents(vector\u003cvector\u003cint>>& grid) {\n        if (grid.empty() || grid[0].empty()) {\n            return 0;\n        }\n\n        int ans = 0;\n        for (int r = 0; r \u003c (int)grid.size(); r++) {\n            for (int c = 0; c \u003c (int)grid[0].size(); c++) {\n                if (grid[r][c] == 1) {\n                    ans++;              // 变形点：数量题在发现新入口时加一。\n                    dfs(grid, r, c, 1, 0);\n                }\n            }\n        }\n        return ans;\n    }\n\n    int maxComponentArea(vector\u003cvector\u003cint>>& grid) {\n        if (grid.empty() || grid[0].empty()) {\n            return 0;\n        }\n\n        int ans = 0;\n        for (int r = 0; r \u003c (int)grid.size(); r++) {\n            for (int c = 0; c \u003c (int)grid[0].size(); c++) {\n                if (grid[r][c] == 1) {\n                    ans = max(ans, dfs(grid, r, c, 1, 0)); // 变形点：数量改成取最大面积。\n                }\n            }\n        }\n        return ans;\n    }\n\n    void fillRegion(vector\u003cvector\u003cint>>& image, int sr, int sc, int newValue) {\n        if (image.empty() || image[0].empty()) {\n            return;\n        }\n\n        int oldValue = image[sr][sc];\n        if (oldValue == newValue) {\n            return; // 新旧值相同会让标记后仍满足进入条件，必须提前退出。\n        }\n        dfs(image, sr, sc, oldValue, newValue); // 变形点：目标值来自起点，标记值来自题目要求。\n    }\n};\n```\n\n#### 变形点对照\n\n| 题型 | 共同骨架中改哪里 | 代码差异 |\n|---|---|---|\n| 岛屿数量 | 外层发现入口时结算 | `ans++; dfs(grid, r, c, 1, 0);` |\n| 最大岛屿面积 | DFS 返回值参与答案 | `ans = max(ans, dfs(...));` |\n| 区域染色 | 目标值和标记值参数化 | `targetValue = oldValue`，`markValue = newValue` |\n| `char` 网格岛屿 | 值类型不同，骨架不变 | 把 `1/0` 换成 `'1'/'0'` |\n\n#### 易错点\n\n- 访问后没有永久染色，导致同一岛屿被重复统计。\n- 把路径搜索的回溯恢复写到连通块题里，使已处理格子重新变成可访问。\n- 区域染色没处理 `oldValue == newValue`，会导致递归无法真正标记 visited。\n- DFS 入口没有统一越界判断，递归到边界外时访问非法坐标。\n\n### 5.6 网格多源 BFS 扩散\n\n#### 适用题型\n\n- `994 腐烂的橘子`：所有腐烂橘子同时向外扩散。\n- 多个源点到所有目标点的最短时间或最近距离。\n- 01 矩阵距离、地图最近设施距离等“所有源点同为第 0 层”的题。\n\n#### 核心思路\n\n多源 BFS 的共同骨架是：先把所有源点作为第 0 层一起入队，然后按层扩散，邻居入队时立刻标记。腐烂橘子和 01 矩阵距离的主循环几乎一样，差别只在初始化源点、邻居能否进入、以及入队时记录什么答案。\n\n关键不变量：\n\n- 初始化时所有源点同时入队。\n- 每轮开始固定 `size`，这一轮只处理当前层节点。\n- 入队即标记，不能等出队再标记。\n- 腐烂橘子需要统计剩余目标；距离矩阵需要在入队时写 `dist`。\n\n#### 代码模板：共同骨架\n\n> **题目简述：** 994 腐烂的橘子：网格中腐烂橘子每分钟感染四邻新鲜橘子，求全部腐烂所需时间，不可能则返回 -1。 [力扣原题 ↗](https://leetcode.cn/problems/rotting-oranges/)\n\n```cpp\nint orangesRottingTemplate(vector\u003cvector\u003cint>>& grid) {\n    if (grid.empty() || grid[0].empty()) {\n        return 0;\n    }\n\n    int m = grid.size();\n    int n = grid[0].size();\n    vector\u003cpair\u003cint, int>> dirs = {{0, 1}, {0, -1}, {1, 0}, {-1, 0}};\n    queue\u003cpair\u003cint, int>> q;\n    int fresh = 0;\n\n    for (int r = 0; r \u003c m; r++) {\n        for (int c = 0; c \u003c n; c++) {\n            if (grid[r][c] == 2) {\n                q.push({r, c}); // 共同点：所有源点同时作为第 0 层。\n            } else if (grid[r][c] == 1) {\n                fresh++;        // 腐烂橘子特有：记录还没被触达的目标数量。\n            }\n        }\n    }\n\n    int minutes = 0;\n    while (!q.empty() && fresh > 0) {\n        int size = q.size(); // 固定当前层大小，处理完一层才推进时间。\n        for (int i = 0; i \u003c size; i++) {\n            auto [r, c] = q.front();\n            q.pop();\n\n            for (auto [dr, dc] : dirs) {\n                int nr = r + dr, nc = c + dc;\n                if (nr \u003c 0 || nr >= m || nc \u003c 0 || nc >= n || grid[nr][nc] != 1) {\n                    continue;\n                }\n\n                grid[nr][nc] = 2; // 入队即标记：第一次触达就是最短时间。\n                fresh--;\n                q.push({nr, nc});\n            }\n        }\n        minutes++;\n    }\n\n    return fresh == 0 ? minutes : -1;\n}\n```\n\n01 矩阵距离不需要另起一个完整模板，只替换三处：源点条件、访问标记、答案写入。\n\n> **题目简述：** 542 01 矩阵：给定 0/1 矩阵，返回每个单元格到最近 0 的距离。 [力扣原题 ↗](https://leetcode.cn/problems/01-matrix/)\n\n```cpp\n// 变形点 1：初始化源点。\n// 腐烂橘子：grid[r][c] == 2 入队。\n// 01 矩阵：grid[r][c] == 0 入队，并令 dist[r][c] = 0。\nvector\u003cvector\u003cint>> dist(m, vector\u003cint>(n, -1));\nif (grid[r][c] == 0) {\n    dist[r][c] = 0;\n    q.push({r, c});\n}\n\n// 变形点 2：邻居能否进入。\n// 腐烂橘子：grid[nr][nc] == 1。\n// 01 矩阵：dist[nr][nc] == -1。\nif (nr \u003c 0 || nr >= m || nc \u003c 0 || nc >= n || dist[nr][nc] != -1) {\n    continue;\n}\n\n// 变形点 3：入队时写答案。\n// 腐烂橘子：grid[nr][nc] = 2; fresh--。\n// 01 矩阵：dist[nr][nc] = dist[r][c] + 1。\ndist[nr][nc] = dist[r][c] + 1;\nq.push({nr, nc});\n```\n\n#### 变形点对照\n\n| 题型 | 共同骨架中改哪里 | 代码差异 |\n|---|---|---|\n| 腐烂橘子 | 源点、目标、答案 | 源点是 `2`，目标是 `1`，用 `fresh/minutes` 结算 |\n| 01 矩阵距离 | 源点、访问标记、返回值 | 源点是 `0`，用 `dist == -1` 判断未访问，返回 `dist` |\n| 最近设施距离 | 源点集合不同 | 所有设施入队，空地第一次触达时写距离 |\n\n#### 易错点\n\n- 只把一个源点入队，破坏“同时扩散”。\n- 分钟数按层增加，不能每弹出一个节点就加一分钟。\n- 不在入队时标记，导致同一个格子被多个源点重复入队。\n- 把腐烂橘子的 `fresh` 逻辑机械搬到距离矩阵，导致返回值语义混乱。\n\n### 5.7 网格回溯路径搜索\n\n#### 适用题型\n\n- `79 单词搜索`。\n- 棋盘路径枚举、当前路径不能重复使用同一格的搜索题。\n- 需要临时标记并在退出分支时恢复现场的题。\n\n#### 核心思路\n\n回溯 DFS 的访问状态只对当前路径有效。进入格子时先保存原字符并临时标记，向四个方向搜索；无论搜索成功还是失败，离开前都要恢复原字符。\n\n关键不变量：\n\n- `k` 表示当前要匹配 `word[k]`。\n- 当前路径中的格子不能重复使用。\n- 任何提前返回 `true` 之前都必须先恢复现场。\n\n#### 代码模板\n\n> **题目简述：** 79 单词搜索：判断单词能否由字符网格中上下左右相邻且不重复使用的单元格组成。 [力扣原题 ↗](https://leetcode.cn/problems/word-search/)\n\n```cpp\nclass GridBacktrackingSearchTemplate {\nprivate:\n    const vector\u003cpair\u003cint, int>> dirs = {{0, 1}, {0, -1}, {1, 0}, {-1, 0}};\n\n    bool dfs(vector\u003cvector\u003cchar>>& board, const string& word, int r, int c, int k) {\n        int m = board.size();\n        int n = board[0].size();\n        if (r \u003c 0 || r >= m || c \u003c 0 || c >= n || board[r][c] != word[k]) {\n            return false;\n        }\n        if (k == (int)word.size() - 1) {\n            return true;\n        }\n\n        char original = board[r][c];\n        board[r][c] = '#';\n\n        for (auto [dr, dc] : dirs) {\n            if (dfs(board, word, r + dr, c + dc, k + 1)) {\n                board[r][c] = original;\n                return true;\n            }\n        }\n\n        board[r][c] = original;\n        return false;\n    }\n\npublic:\n    bool exist(vector\u003cvector\u003cchar>>& board, string word) {\n        int m = board.size();\n        int n = board[0].size();\n        for (int r = 0; r \u003c m; r++) {\n            for (int c = 0; c \u003c n; c++) {\n                if (dfs(board, word, r, c, 0)) {\n                    return true;\n                }\n            }\n        }\n        return false;\n    }\n};\n```\n\n#### 易错点\n\n- 找到答案提前返回前没有恢复当前格子。\n- 把连通块的永久染色模板照搬到路径搜索。\n- 没有先判断越界就访问 `board[r][c]`。\n\n### 5.8 矩阵 DP 滚动数组\n\n#### 适用题型\n\n- `62 不同路径`：到达每格的方案数。\n- `64 最小路径和`：到达每格的最小代价。\n- 只能从上方和左方转移的网格 DP。\n\n#### 核心思路\n\n若只能向右或向下走，那么 `(r, c)` 只可能来自上方 `(r - 1, c)` 或左方 `(r, c - 1)`。滚动数组中 `dp[c]` 在更新前表示上方状态，`dp[c - 1]` 表示当前行左侧状态。\n\n关键不变量：\n\n- 第一行只能从左边来，第一列只能从上边来。\n- 更新顺序必须从左到右，保证 `dp[c - 1]` 已是当前行状态。\n- 若允许四方向移动，不能直接套这个无环 DP 模板。\n\n#### 代码 A：路径数\n\n> **题目简述：** 62 不同路径：机器人位于网格左上角且只能向右或向下，求到右下角的不同路径数。 [力扣原题 ↗](https://leetcode.cn/problems/unique-paths/)\n\n```cpp\nint gridDpPathCountTemplate(int m, int n) {\n    vector\u003cint> dp(n, 1);\n\n    for (int r = 1; r \u003c m; r++) {\n        for (int c = 1; c \u003c n; c++) {\n            dp[c] += dp[c - 1];\n        }\n    }\n\n    return dp[n - 1];\n}\n```\n\n#### 代码 B：最小路径和\n\n> **题目简述：** 64 最小路径和：给定非负网格，只能向右或向下移动，求左上到右下的最小路径和。 [力扣原题 ↗](https://leetcode.cn/problems/minimum-path-sum/)\n\n```cpp\nint gridDpMinCostTemplate(const vector\u003cvector\u003cint>>& grid) {\n    int m = grid.size();\n    int n = grid[0].size();\n    vector\u003cint> dp(n, INT_MAX / 2);\n    dp[0] = 0;\n\n    for (int r = 0; r \u003c m; r++) {\n        for (int c = 0; c \u003c n; c++) {\n            if (c == 0) {\n                dp[c] = dp[c] + grid[r][c];\n            } else {\n                dp[c] = min(dp[c], dp[c - 1]) + grid[r][c];\n            }\n        }\n    }\n\n    return dp[n - 1];\n}\n```\n\n#### 易错点\n\n- 第一行第一列初始化错误。\n- 滚动数组要从左往右更新，确保 `dp[c - 1]` 仍是当前行状态。\n- 题目允许上下左右移动时仍套矩阵 DP，形成有环依赖。\n\n## 6. 高频易错点清单\n\n| 易错点 | 典型题目 | 规避方式 |\n|---|---|---|\n| 行列变量写反 | `48`、`54`、`74` | 统一使用 `m = rows`、`n = cols`、`matrix[r][c]` |\n| 螺旋遍历单行单列重复加入 | `54` | 处理下边和左边前检查边界 |\n| 旋转矩阵转置时交换了两次 | `48` | 内层从 `c = r + 1` 开始 |\n| 矩阵置零边扫描边清零 | `73` | 先标记，后执行 |\n| 首行首列标记混淆 | `73` | 用单独变量记录首列是否置零 |\n| 展平二分坐标换算写错 | `74` | 行是 `mid / n`，列是 `mid % n` |\n| 把 `240` 当成整体有序数组 | `240` | 只能阶梯搜索或分治，不能直接展平二分 |\n| DFS 缺少越界判断 | `200`、`79` | 递归入口第一行做边界和目标值判断 |\n| BFS 出队才标记访问 | `994` | 入队时立刻改状态 |\n| 单词搜索提前返回前没恢复 | `79` | 所有 return true 前都恢复原字符 |\n| 矩阵 DP 第一行第一列初始化错误 | `62`、`64` | 明确边界只能来自一个方向 |\n\n## 7. 最短复盘口诀\n\n矩阵题先定坐标：行是 `r`，列是 `c`。螺旋看边界，旋转看映射，置零先标记后执行；全局有序展平成一维二分，行列有序从右上角阶梯走；连通块永久染色，多源 BFS 入队即标记，路径搜索必须回溯；矩阵 DP 看能从哪些方向转移。\n\n\n\n================================================================================\n\n# 第5部分: 链表\n\n================================================================================\n\n> 目标：本文把 Hot100 链表题抽象成若干“可复用套路”。复习时先识别题型，再套对应模板，最后处理边界和变形。\n\n## 1. 链表题的底层模型\n\n链表题的难点通常不在遍历，而在维护指针关系。每道链表题先问四个问题：\n\n| 问题               | 如果答案是“是”             | 常用处理                  |\n| ---------------- | -------------------- | --------------------- |\n| 头结点会不会变          | 删除头、交换头、反转头、合并后新头不确定 | 用 `dummy` 保护头结点       |\n| 是否需要目标节点的前驱      | 删除、插入、区间反转、分组反转      | 让指针停在目标节点前一个位置        |\n| 修改 `next` 前会不会丢链 | 反转、交换、拆分、复制          | 先保存 `nxt = cur->next` |\n| 是否要快速定位某个节点      | LRU、随机链表复制、K 路归并     | 哈希表、堆、双向链表            |\n\n链表题最核心的动作只有五类：\n\n| 动作 | 对应 Hot100 题目 | 复习关键词 |\n|---|---|---|\n| 哑节点与尾插 | `2`、`19`、`21`、`24`、`25` | `dummy`、`cur`、`pre` |\n| 局部反转 | `206`、`24`、`25`、`234` | `pre`、`cur`、`nxt` |\n| 快慢指针定位 | `141`、`142`、`148`、`234` | 判环、入环点、中点 |\n| 双链表同步 | `160`、`21`、`2` | 换头、归并、同步推进 |\n| 辅助结构设计 | `23`、`138`、`146` | 堆、哈希表、双向链表 |\n\n## 2. Hot100 链表题型地图\n\n| 题型 | 题目 | 抽象能力 | 一句话记忆 |\n|---|---|---|---|\n| 基础重连 | `206 反转链表` | 单链表反转 | 改 `cur->next` 前必须先保存 `nxt` |\n| 尾插构造 | `2 两数相加`、`21 合并两个有序链表` | 用 `dummy + cur` 构造结果链 | `cur` 永远指向结果链表尾部 |\n| 删除节点 | `19 删除倒数第 N 个结点` | 找目标前驱 | 删除题通常找目标前一个节点 |\n| 分组操作 | `24 两两交换节点`、`25 K 个一组翻转` | 固定长度区间重连 | 先保证够一组，再反转，再接回去 |\n| 快慢指针 | `141 环形链表`、`142 环形链表 II` | 判环和找入口 | 第一次相遇判有环，第二次相遇找入口 |\n| 链表归并 | `23 合并 K 个升序链表`、`148 排序链表` | 多路归并和分治 | `21` 是 `23` 和 `148` 的基础组件 |\n| 双指针对齐 | `160 相交链表` | 消除长度差 | 走完自己的路，就去对方的路上补齐 |\n| 组合题 | `234 回文链表` | 找中点加反转加比较 | 先切出后半段，再反转比较 |\n| 复杂结构复制 | `138 随机链表的复制` | 节点映射关系 | 哈希表映射最直观，穿插复制最省空间 |\n| 双向链表设计 | `146 LRU 缓存` | O(1) 查找和 O(1) 调整顺序 | 哈希表查节点，双向链表排冷热 |\n| 树链表化 | `114 二叉树展开为链表` | 树结构原地改链 | 反向前序像链表头插法 |\n\n## 3. 复习顺序建议\n\n先刷基础动作，再刷组合题。推荐顺序如下：\n\n1. `206 反转链表`：必须闭眼写出三指针反转。\n2. `21 合并两个有序链表`：掌握 `dummy + cur` 尾插。\n3. `19 删除倒数第 N 个结点`：理解“找前驱”比“找目标”更重要。\n4. `24 两两交换节点`：练局部重连。\n5. `25 K 个一组翻转`：把局部反转和接回链表练熟。\n6. `141`、`142`：快慢指针判环和找入口。\n7. `160`：双链表换头对齐。\n8. `234`：组合 `找中点 + 反转 + 比较`。\n9. `148`、`23`：复用 `21` 做归并。\n10. `138`、`146`：处理带额外结构的链表设计题。\n\n## 4. 关键套路详解\n\n### 4.1 dummy 是默认防御\n\n当头结点可能被删除、交换、反转、替换时，不要对 `head` 写一堆特判。直接构造一个虚拟前驱：\n\n```cpp\nListNode dummy(-1, head);\nListNode* pre = &dummy;\nreturn dummy.next;\n```\n\n`dummy` 的价值是把“头结点”和“普通节点”统一处理。`19` 删除头结点、`24` 交换前两个节点、`25` 第一组反转后换头，都靠它避免特殊分支。\n\n### 4.2 反转链表是母题\n\n所有链表反转题都来自同一个动作：\n\n```cpp\nListNode* nxt = cur->next;\ncur->next = pre;\npre = cur;\ncur = nxt;\n```\n\n这个动作解决的是“把当前节点从原方向摘下来，接到反方向链表前面”。`206` 是完整链表反转，`25` 是每 K 个节点重复这个动作，`234` 是只反转后半段。\n\n### 4.3 快慢指针有三种停法\n\n| 目标    | 循环条件                                     | 结果                  |\n| ----- | ---------------------------------------- | ------------------- |\n| 判环    | `while (fast && fast->next)`             | `fast == slow` 表示有环 |\n| 找偏右中点 | `while (fast && fast->next)`             | 偶数长度时 `slow` 到右中点   |\n| 找偏左中点 | `while (fast->next && fast->next->next)` | 偶数长度时 `slow` 到左中点   |\n\n`234 回文链表`通常希望 `slow` 停在前半段尾部，所以用偏左中点写法。`148 排序链表`需要切断左右两段，通常额外保存 `pre`。\n\n### 4.4 归并类题要复用组件\n\n`21 合并两个有序链表`是链表归并的基础函数。`23 合并 K 个链表`只是把它变成多路合并。`148 排序链表`只是先把链表拆成小段，再用它合回来。\n\n不要把 `21`、`23`、`148` 当三道完全不同的题，它们共用同一个“有序链表合并”动作。\n\n### 4.5 复杂链表题的本质是“映射”和“快速调整”\n\n`138 随机链表复制`的本质是旧节点到新节点的映射。哈希表方案显式维护映射，穿插复制方案把映射藏在 `old->next` 里。\n\n`146 LRU 缓存`的本质是同时满足两个要求：通过 key 快速找到节点，通过访问顺序快速移动节点。所以哈希表和双向链表缺一不可。\n\n## 5. 抽象代码模板\n\n本节按链表操作的基本动作拆分模板。链表代码最怕“断链”和“头结点变化”，因此每个模板都明确维护哪些指针、什么时候保存后继、什么时候接回前后链表。\n\n```cpp\n#include \u003cbits/stdc++.h>\nusing namespace std;\n\nstruct ListNode {\n    int val;\n    ListNode* next;\n    ListNode() : val(0), next(nullptr) {}\n    ListNode(int x) : val(x), next(nullptr) {}\n    ListNode(int x, ListNode* next) : val(x), next(next) {}\n};\n```\n\n### 5.1 模板一：dummy + 尾插构造结果链\n\n#### 适用题型\n\n- `21 合并两个有序链表`：复用原节点，每轮把较小节点接到结果链尾部。\n- `2 两数相加`：新建结果节点，每轮计算一位和进位。\n- 任何需要按扫描顺序构造新链表的题：统一维护 `cur` 指向结果尾部。\n\n#### 核心思路\n\n- `dummy` 保护结果链头，避免单独处理第一个节点。\n- `cur` 永远指向结果链尾部，每接一个节点后都要移动到新尾部。\n- 复用原节点时要注意后续是否可能形成旧链残留；新建节点时不影响原链。\n\n#### 代码 A：合并两个有序链表\n\n> **题目简述：** 21 合并两个有序链表：给定两个升序链表，将其合并为一个仍然升序的链表。 [力扣原题 ↗](https://leetcode.cn/problems/merge-two-sorted-lists/)\n\n```cpp\nListNode* mergeTwoListsTemplate(ListNode* a, ListNode* b) {\n    ListNode dummy(-1);\n    ListNode* cur = &dummy;\n\n    while (a && b) {\n        if (a->val \u003c= b->val) {\n            cur->next = a;\n            a = a->next;\n        } else {\n            cur->next = b;\n            b = b->next;\n        }\n\n        // cur 始终跟到结果链尾部，下一轮才能继续尾插。\n        cur = cur->next;\n    }\n\n    // 剩余链表本身已经有序，可以整段接上。\n    cur->next = a ? a : b;\n    return dummy.next;\n}\n```\n\n#### 代码 B：两数相加\n\n> **题目简述：** 2 两数相加：两个非空链表以逆序数字表示非负整数，求其和并以同样形式返回。 [力扣原题 ↗](https://leetcode.cn/problems/add-two-numbers/)\n\n```cpp\nListNode* addTwoNumbersTemplate(ListNode* a, ListNode* b) {\n    ListNode dummy(-1);\n    ListNode* cur = &dummy;\n    int carry = 0;\n\n    while (a || b || carry) {\n        int sum = carry;\n        if (a) {\n            sum += a->val;\n            a = a->next;\n        }\n        if (b) {\n            sum += b->val;\n            b = b->next;\n        }\n\n        // 当前位只保留个位数，十位作为下一轮进位。\n        cur->next = new ListNode(sum % 10);\n        cur = cur->next;\n        carry = sum / 10;\n    }\n\n    return dummy.next;\n}\n```\n\n#### 易错点\n\n- 合并链表复用原节点，移动 `a/b` 前要先把节点接到 `cur->next`。\n- 两数相加循环条件必须包含 `carry`，否则最高位进位会丢。\n- 返回 `dummy.next`，不要返回 `cur`。\n\n### 5.2 模板二：删除节点与找前驱\n\n#### 适用题型\n\n- `19 删除链表的倒数第 N 个结点`：快慢指针让慢指针停在待删节点前驱。\n- 删除指定值或指定区间：单链表删除通常必须先定位前驱。\n- 头结点可能被删除的题：必须使用 dummy 统一处理。\n\n#### 核心思路\n\n- 删除节点时需要改的是前驱的 `next`。\n- `right` 先走 `n` 步，然后 `left/right` 同步走，最终 `left` 停在待删节点前驱。\n- `dummy` 让删除头节点与删除中间节点使用同一套逻辑。\n\n#### 代码模板\n\n> **题目简述：** 19 删除链表的倒数第 N 个结点：给定单链表和正整数 N，删除倒数第 N 个结点并返回链表头。 [力扣原题 ↗](https://leetcode.cn/problems/remove-nth-node-from-end-of-list/)\n\n```cpp\nListNode* removeNthFromEndTemplate(ListNode* head, int n) {\n    ListNode dummy(-1, head);\n    ListNode* left = &dummy;\n    ListNode* right = &dummy;\n\n    // 先制造 n 个节点的间距；题目保证 n 合法时 right 不会提前为空。\n    for (int i = 0; i \u003c n; i++) {\n        right = right->next;\n    }\n\n    // right 到达最后一个节点时，left 正好停在待删节点前驱。\n    while (right->next) {\n        left = left->next;\n        right = right->next;\n    }\n\n    ListNode* del = left->next;\n    left->next = del->next;\n    delete del;\n\n    return dummy.next;\n}\n```\n\n#### 易错点\n\n- `left` 应停在前驱，不能停在待删节点本身。\n- 删除头节点时，如果不用 dummy，需要额外特判。\n- 面试中可说明 LeetCode 通常不要求手动 `delete`，但 C++ 模板释放更规范。\n\n### 5.3 模板三：三指针反转与区间反转\n\n#### 适用题型\n\n- `206 反转链表`：反转整条链表。\n- `234 回文链表`：反转后半段再比较。\n- `25 K 个一组翻转链表`：反转 `[head, stop)` 区间。\n\n#### 核心思路\n\n- `pre` 表示已经反转好的部分头部。\n- `cur` 表示当前待处理节点。\n- `nxt` 必须先保存原链后继，否则一改 `cur->next` 就会断链。\n- 反转 `[head, stop)` 时，`stop` 不参与反转，适合局部重连。\n\n#### 代码模板\n\n> **题目简述：** 本模板覆盖：206 反转链表（给定单链表头结点，反转所有 next 指针并返回新的头结点。）；234 回文链表（给定单链表头结点，判断从头到尾的结点值序列是否为回文。）；25 K 个一组翻转链表（按每 K 个结点一组翻转链表，末尾不足 K 个的部分保持原顺序。） [25 原题 ↗](https://leetcode.cn/problems/reverse-nodes-in-k-group/) · [206 原题 ↗](https://leetcode.cn/problems/reverse-linked-list/) · [234 原题 ↗](https://leetcode.cn/problems/palindrome-linked-list/)\n\n```cpp\nListNode* reverseBeforeStopTemplate(ListNode* head, ListNode* stop) {\n    ListNode* pre = stop;\n    ListNode* cur = head;\n\n    while (cur != stop) {\n        // 改指针前先保存后继，否则剩余链表会丢失。\n        ListNode* nxt = cur->next;\n        cur->next = pre;\n        pre = cur;\n        cur = nxt;\n    }\n\n    return pre;\n}\n\nListNode* reverseListTemplate(ListNode* head) {\n    return reverseBeforeStopTemplate(head, nullptr);\n}\n```\n\n#### 易错点\n\n- `pre` 初始为 `stop`，这样反转后的尾巴天然接回后续链表。\n- 反转循环结束后返回的是 `pre`，也就是新区间头。\n\n### 5.4 模板四：分组反转与局部重连\n\n#### 适用题型\n\n- `24 两两交换链表中的节点`：`k = 2`。\n- `25 K 个一组翻转链表`：每组够 `k` 个才反转。\n- 指定长度区间反转：只执行一轮分组反转。\n\n#### 核心思路\n\n- `groupPrev` 是当前组前一个节点。\n- `groupHead` 是当前组反转前的头，反转后会变成尾。\n- `nextGroup` 是下一组开头，反转区间为 `[groupHead, nextGroup)`。\n\n#### 代码模板\n\n> **题目简述：** 本模板覆盖：24 两两交换链表中的节点（将链表中每两个相邻结点交换位置，不允许只修改结点值。）；25 K 个一组翻转链表（按每 K 个结点一组翻转链表，末尾不足 K 个的部分保持原顺序。） [24 原题 ↗](https://leetcode.cn/problems/swap-nodes-in-pairs/) · [25 原题 ↗](https://leetcode.cn/problems/reverse-nodes-in-k-group/)\n\n```cpp\nListNode* reverseKGroupTemplate(ListNode* head, int k) {\n    ListNode dummy(-1, head);\n    ListNode* groupPrev = &dummy;\n\n    while (true) {\n        ListNode* kth = groupPrev;\n\n        // 先确认当前组是否有 k 个节点，不足 k 个按题意保持原样。\n        for (int i = 0; i \u003c k && kth; i++) {\n            kth = kth->next;\n        }\n        if (!kth) {\n            break;\n        }\n\n        ListNode* groupHead = groupPrev->next;\n        ListNode* nextGroup = kth->next;\n\n        // 反转当前组，返回当前组新的头节点。\n        ListNode* newGroupHead = reverseBeforeStopTemplate(groupHead, nextGroup);\n\n        // 把反转后的组接回前驱；groupHead 已经变成当前组尾巴。\n        groupPrev->next = newGroupHead;\n        groupHead->next = nextGroup;\n\n        groupPrev = groupHead;\n    }\n\n    return dummy.next;\n}\n\nListNode* swapPairsTemplate(ListNode* head) {\n    return reverseKGroupTemplate(head, 2);\n}\n```\n\n#### 易错点\n\n- 反转前必须保存 `nextGroup`，否则接不回下一组。\n- 反转后 `groupHead` 变成尾巴，下一轮的 `groupPrev` 应该移动到它。\n- 不足 `k` 个是否反转取决于题意，Hot100 第 25 题是不反转。\n\n### 5.5 模板五：快慢指针定位\n\n#### 适用题型\n\n- `141 环形链表`：快慢指针相遇说明有环。\n- `142 环形链表 II`：相遇后一个指针回头，两指针同步走找入口。\n- `234 回文链表`：找前半段尾巴后反转后半段。\n- `148 排序链表`：快慢指针切分左右两半。\n\n#### 核心思路\n\n- 判环：`slow` 一步，`fast` 两步。\n- 入环点：第一次相遇后，`head` 和 `meet` 同步走，重逢处是入口。\n- 找中点要先明确想要偏左中点还是偏右中点。\n\n#### 代码 A：判环与找入口\n\n> **题目简述：** 本模板覆盖：141 环形链表（给定单链表头结点，判断沿 next 指针前进是否会重复到达某个结点。）；142 环形链表 II（若单链表存在环则返回入环的第一个结点，否则返回空结点。） [141 原题 ↗](https://leetcode.cn/problems/linked-list-cycle/) · [142 原题 ↗](https://leetcode.cn/problems/linked-list-cycle-ii/)\n\n```cpp\nListNode* getCycleMeetTemplate(ListNode* head) {\n    ListNode* slow = head;\n    ListNode* fast = head;\n\n    while (fast && fast->next) {\n        slow = slow->next;\n        fast = fast->next->next;\n\n        if (slow == fast) {\n            return slow;\n        }\n    }\n\n    return nullptr;\n}\n\nListNode* detectCycleEntryTemplate(ListNode* head) {\n    ListNode* meet = getCycleMeetTemplate(head);\n    if (!meet) {\n        return nullptr;\n    }\n\n    ListNode* p = head;\n    ListNode* q = meet;\n    while (p != q) {\n        p = p->next;\n        q = q->next;\n    }\n\n    return p;\n}\n```\n\n#### 代码 B：排序链表切分\n\n> **题目简述：** 148 排序链表：给定单链表头结点，以 O(n log n) 时间将所有结点按值升序排列。 [力扣原题 ↗](https://leetcode.cn/problems/sort-list/)\n\n```cpp\nListNode* splitMiddleForSortTemplate(ListNode* head) {\n    ListNode* pre = nullptr;\n    ListNode* slow = head;\n    ListNode* fast = head;\n\n    while (fast && fast->next) {\n        pre = slow;\n        slow = slow->next;\n        fast = fast->next->next;\n    }\n\n    // pre 是左半段尾巴，断开后 head 和 slow 分别是左右两段头。\n    if (pre) {\n        pre->next = nullptr;\n    }\n    return slow;\n}\n```\n\n#### 代码 C：回文链表原始反转后半段解法\n\n> **题目简述：** 234 回文链表：给定单链表头结点，判断从头到尾的结点值序列是否为回文。 [力扣原题 ↗](https://leetcode.cn/problems/palindrome-linked-list/)\n\n```cpp\nbool isPalindromeTemplate(ListNode* head) {\n    ListNode* fast = head;\n    ListNode* slow = head;\n\n    // 原始写法让 slow 停在前半段尾部，slow->next 是后半段起点。\n    while (fast->next && fast->next->next) {\n        fast = fast->next->next;\n        slow = slow->next;\n    }\n\n    // 反转后半段。\n    ListNode* pre = nullptr;\n    ListNode* cur = slow->next;\n    while (cur) {\n        ListNode* nxt = cur->next;\n        cur->next = pre;\n        pre = cur;\n        cur = nxt;\n    }\n\n    // pre 是反转后的后半段头；从 head 和 pre 同步比较。\n    ListNode* start1 = head;\n    ListNode* start2 = pre;\n    while (start2) {\n        if (start1->val != start2->val) {\n            return false;\n        }\n        start1 = start1->next;\n        start2 = start2->next;\n    }\n    return true;\n}\n```\n\n#### 易错点\n\n- 排序链表切分后必须断开 `pre->next`，否则递归不会收敛。\n- 回文链表原始解法中 `slow` 要停在前半段尾部，因此循环条件是 `fast->next && fast->next->next`。\n- 回文链表只需要比较反转后的后半段长度，循环条件应是 `while (start2)`。\n\n### 5.6 模板六：双链表同步推进\n\n#### 适用题型\n\n- `160 相交链表`：两个指针交换链表头后总路程相同。\n- 两条链表长度不同但要同步比较：先拉齐路径长度。\n\n#### 核心思路\n\n- `p` 走完 A 后去 B，`q` 走完 B 后去 A。\n- 如果有交点，两个指针会在交点相遇；如果无交点，会同时到达 `nullptr`。\n\n#### 代码模板\n\n> **题目简述：** 160 相交链表：给定两个无环单链表，返回它们按结点引用相交的起点，不相交则返回空。 [力扣原题 ↗](https://leetcode.cn/problems/intersection-of-two-linked-lists/)\n\n```cpp\nListNode* getIntersectionNodeTemplate(ListNode* headA, ListNode* headB) {\n    ListNode* p = headA;\n    ListNode* q = headB;\n\n    while (p != q) {\n        // 走完自己的链表就切到对方链表，抵消长度差。\n        p = p ? p->next : headB;\n        q = q ? q->next : headA;\n    }\n\n    return p;\n}\n```\n\n#### 易错点\n\n- 相交比较节点地址，节点值无效。\n- 无交点时最终 `p` 和 `q` 都是 `nullptr`，循环也能结束。\n\n### 5.7 模板七：归并类链表题\n\n#### 适用题型\n\n- `21 合并两个有序链表`：归并的基础动作。\n- `23 合并 K 个升序链表`：分治合并或最小堆多路归并。\n- `148 排序链表`：切分两半，递归排序，再归并。\n\n#### 核心思路\n\n- 两两合并是基础组件。\n- K 路合并：分治法复用 mergeTwo，堆法每次取当前最小节点。\n- 排序链表：快慢指针切分后递归处理左右半段。\n\n#### 代码 A：分治合并 K 条链表\n\n> **题目简述：** 23 合并 K 个升序链表：给定 K 个升序链表，合并全部结点并返回一个升序链表。 [力扣原题 ↗](https://leetcode.cn/problems/merge-k-sorted-lists/)\n\n```cpp\nListNode* mergeKByDivideTemplate(vector\u003cListNode*>& lists) {\n    if (lists.empty()) {\n        return nullptr;\n    }\n\n    for (int step = 1; step \u003c (int)lists.size(); step *= 2) {\n        for (int i = 0; i + step \u003c (int)lists.size(); i += 2 * step) {\n            lists[i] = mergeTwoListsTemplate(lists[i], lists[i + step]);\n        }\n    }\n\n    return lists[0];\n}\n```\n\n#### 代码 B：排序链表\n\n> **题目简述：** 148 排序链表：给定单链表头结点，以 O(n log n) 时间将所有结点按值升序排列。 [力扣原题 ↗](https://leetcode.cn/problems/sort-list/)\n\n```cpp\nListNode* sortListTemplate(ListNode* head) {\n    if (!head || !head->next) {\n        return head;\n    }\n\n    ListNode* rightHead = splitMiddleForSortTemplate(head);\n    ListNode* leftSorted = sortListTemplate(head);\n    ListNode* rightSorted = sortListTemplate(rightHead);\n    return mergeTwoListsTemplate(leftSorted, rightSorted);\n}\n```\n\n#### 易错点\n\n- 分治合并 K 条链表时，`step` 每轮翻倍。\n- 排序链表切分后要确保左右两段断开。\n\n### 5.8 模板八：复杂指针链表复制\n\n#### 适用题型\n\n- `138 随机链表复制`：建立旧节点到新节点的映射。\n- 带额外指针的链表 / 图深拷贝：都可以先创建节点，再补边。\n\n#### 核心思路\n\n- 哈希表法显式记录 `oldToNew[old] = copy`，最稳且通用。\n- 穿插复制法把复制节点插到原节点后面，用 `old->next` 隐式表示映射。\n\n#### 代码模板\n\n> **题目简述：** 138 随机链表的复制：深拷贝一个同时含 next 和 random 指针的链表，新结点不得指向原链表。 [力扣原题 ↗](https://leetcode.cn/problems/copy-list-with-random-pointer/)\n\n```cpp\nclass RandomNode {\npublic:\n    int val;\n    RandomNode* next;\n    RandomNode* random;\n\n    RandomNode(int value) : val(value), next(nullptr), random(nullptr) {}\n};\n\nRandomNode* copyRandomListTemplate(RandomNode* head) {\n    unordered_map\u003cRandomNode*, RandomNode*> oldToNew;\n\n    for (RandomNode* cur = head; cur; cur = cur->next) {\n        oldToNew[cur] = new RandomNode(cur->val);\n    }\n\n    for (RandomNode* cur = head; cur; cur = cur->next) {\n        // 所有节点已经创建好，这里只负责把 next/random 指向复制节点。\n        oldToNew[cur]->next = cur->next ? oldToNew[cur->next] : nullptr;\n        oldToNew[cur]->random = cur->random ? oldToNew[cur->random] : nullptr;\n    }\n\n    return head ? oldToNew[head] : nullptr;\n}\n```\n\n#### 易错点\n\n- 新链表的 `next/random` 必须指向复制节点，不能指回原节点。\n- 两遍扫描更稳：第一遍建点，第二遍补边。\n\n### 5.9 模板九：完整 LRU 缓存\n\n#### 适用题型\n\n- `146 LRU 缓存`：哈希表 O(1) 定位节点，双向链表 O(1) 调整顺序。\n- 需要按访问时间维护顺序并支持 O(1) 删除任意节点的设计题。\n\n#### 核心思路\n\n- 哈希表负责 `key -> node`。\n- 双向链表头部表示最近使用，尾部表示最久未使用。\n- 每次 `get/put` 命中节点后都移动到头部；超容量时删除尾部前一个真实节点。\n\n#### 代码模板\n\n> **题目简述：** 146 LRU 缓存：设计定容量缓存，使查询和写入均为平均 O(1)，满时淘汰最久未使用项。 [力扣原题 ↗](https://leetcode.cn/problems/lru-cache/)\n\n```cpp\nstruct Node{\n    int key;\n    int value;\n    Node* prev;\n    Node* next;\n    Node (int k,int v){key=k;value=v;prev=nullptr;next=nullptr;\n    }\n};\n\nclass LRUCache {\nprivate:\n    int cap;\n    unordered_map\u003cint,Node*> map;\n    Node* head;\n    Node* tail;\n\n    void remove(Node* node){\n        node->prev->next=node->next;\n        node->next->prev=node->prev;\n    }\n\n    void add(Node* node){\n        node->prev=head;\n        node->next=head->next;\n        head->next->prev=node;\n        head->next=node;\n    }\n    \npublic:\n    LRUCache(int capacity) {\n        cap=capacity;\n        head=new Node(0,0);\n        tail=new Node(0,0);\n        head->next=tail;\n        tail->prev=head;\n    }\n    \n    int get(int key) {\n        if(map.count(key)){\n            Node* node=map[key];\n            remove(node);\n            add(node);\n            return node->value;\n        }\n        return -1;\n    }\n    \n    void put(int key, int value) {\n        if(map.count(key)){\n            Node* node=map[key];\n            node->value=value;\n            remove(node);\n            add(node);\n        }\n        else{\n            Node* newnode = new Node(key,value);\n            map[key]=newnode;\n            add(newnode);\n            if(map.size()>cap){\n                Node* delnode=tail->prev;\n                map.erase(delnode->key);\n                remove(delnode);\n                delete delnode;\n            }\n        }\n    }\n};\n\n/**\n * Your LRUCache object will be instantiated and called as such:\n * LRUCache* obj = new LRUCache(capacity);\n * int param_1 = obj->get(key);\n * obj->put(key,value);\n */\n```\n\n#### 易错点\n\n- 删除链表节点时必须同步删除哈希表。\n- `get` 命中也算访问，需要移动到头部。\n- 使用虚拟 `head/tail` 可以避免删除头尾时大量特判。\n\n### 5.10 模板十：树结构链表化\n\n#### 适用题型\n\n- `114 二叉树展开为链表`：按前序顺序原地展开。\n- 树转单链形式：按目标顺序反向递归维护 `prev`。\n\n#### 核心思路\n\n- 前序是中-左-右；反过来按右-左-中处理，可以让 `prev` 始终表示已经展开好的后继链。\n- 当前节点的 `right` 指向 `prev`，`left` 置空，然后当前节点成为新的 `prev`。\n- 外层 wrapper 每次调用前重置 `prev`，避免多次调用污染状态。\n\n#### 代码模板\n\n> **题目简述：** 114 二叉树展开为链表：将二叉树原地展开为前序遍历顺序的单链表，仅使用结点的右指针。 [力扣原题 ↗](https://leetcode.cn/problems/flatten-binary-tree-to-linked-list/)\n\n```cpp\nstruct TreeNode {\n    int val;\n    TreeNode* left;\n    TreeNode* right;\n    TreeNode(int x) : val(x), left(nullptr), right(nullptr) {}\n};\n\nclass TreeFlattenTemplate {\nprivate:\n    TreeNode* prev;\n\n    void dfs(TreeNode* root) {\n        if (!root) {\n            return;\n        }\n\n        // 反向前序：先处理右，再处理左，最后处理当前节点。\n        dfs(root->right);\n        dfs(root->left);\n\n        root->right = prev;\n        root->left = nullptr;\n        prev = root;\n    }\n\npublic:\n    void flatten(TreeNode* root) {\n        prev = nullptr;\n        dfs(root);\n    }\n};\n```\n\n#### 易错点\n\n- 如果没有 wrapper 重置 `prev`，同一个对象重复调用会把上次结果接进来。\n- 展开后所有 `left` 都必须置空。\n\n## 6. 高频易错点清单\n\n| 易错点 | 典型题目 | 规避方式 |\n|---|---|---|\n| 忘记处理头结点变化 | `19`、`24`、`25` | 默认使用 `dummy` |\n| 反转前没保存后继 | `206`、`25`、`234` | 第一行先写 `ListNode* nxt = cur->next` |\n| 删除时指针停在目标节点 | `19` | 删除要停在目标前驱 |\n| K 个一组反转后接不回去 | `25` | 记录 `groupHead`，它翻转后就是尾巴 |\n| 快慢指针循环条件混乱 | `141`、`142`、`234`、`148` | 先明确 slow 要停在哪里 |\n| 相交链表比较了值 | `160` | 相交是地址相同，值相等无效 |\n| 随机链表复制指向原节点 | `138` | 新链表的 `next/random` 必须指向复制节点 |\n| LRU 删除链表节点忘记删哈希表 | `146` | 链表和 map 必须同步更新 |\n| 归并排序切分后没断开 | `148` | 找到中点后必须 `pre->next = nullptr` |\n| 最小堆比较器方向写反 | `23` | C++ 小顶堆比较器写 `a->val > b->val` |\n\n## 7. 最短复盘口诀\n\n链表题先判断头会不会变，会变就上 `dummy`。删除找前驱，反转存后继，合并看尾巴，分组先判够不够。快慢指针负责定位，双链换头负责对齐，哈希表负责映射，双向链表负责 O(1) 移动。`206` 是反转母题，`21` 是归并母题，`25` 是局部重连大成题。\n\n\n\n================================================================================\n\n# 第6部分: 二叉树\n\n================================================================================\n\n> 目标：本文把 Hot100 二叉树题抽象成若干“可复用题型模板”。复习时先判断题型，再套递归定义、遍历顺序、返回值语义和状态维护方式。\n\n## 1. 二叉树题的底层模型\n\n二叉树题的关键在于说清楚每个递归函数到底在做什么。每道树题先问五个问题：\n\n| 问题 | 如果答案是“是” | 常用处理 |\n|---|---|---|\n| 需要访问所有节点吗 | 遍历、统计、比较、构造答案 | DFS 或 BFS |\n| 答案和层有关吗 | 层序遍历、右视图、最小层级信息 | BFS 按层处理，或 DFS 携带 `depth` |\n| 当前节点需要左右子树返回值吗 | 深度、直径、最大路径和、LCA | 后序递归，先拿左右结果再处理当前节点 |\n| 题目利用 BST 性质吗 | 验证 BST、第 K 小、有序数组转 BST | 中序有序、上下界约束、取中点构造 |\n| 路径是否可以从任意节点开始 | 路径总和 III、最大路径和、直径 | 全局答案 + 向父节点返回“可延伸贡献” |\n\n二叉树题最常见的递归函数有三种语义：\n\n| 递归语义 | 返回值含义 | 代表题 |\n|---|---|---|\n| 遍历型 | 不关心返回值，只在访问节点时收集答案 | `94`、`199` |\n| 分治型 | 返回当前子树的某种属性 | `104`、`226`、`236` |\n| 贡献型 | 返回给父节点能继续使用的单边贡献，同时更新全局答案 | `543`、`124` |\n\n## 2. Hot100 二叉树题型地图\n\n本专题覆盖二叉树/BST 题 15 道。`208 Trie`、`200 岛屿数量`、`994 腐烂的橘子`、`207 课程表`、`79 单词搜索`虽然也有 DFS/BFS，但归入 Trie、图或回溯专题更合适。\n\n| 题型        | 题目                           | 抽象能力          | 一句话记忆             |\n| --------- | ---------------------------- | ------------- | ----------------- |\n| 基础 DFS 遍历 | `94 二叉树的中序遍历`                | 前中后序递归与迭代     | 递归顺序决定访问顺序        |\n| 层序 BFS    | `102 二叉树的层序遍历`、`199 二叉树的右视图` | 队列按层处理        | 每轮先固定本层 `size`    |\n| 子树属性递归    | `104 最大深度`、`226 翻转二叉树`       | 子树返回值与原地修改    | 当前节点只依赖左右子树结果     |\n| 镜像比较      | `101 对称二叉树`                  | 双节点同步递归       | 比较外侧和内侧，避免单棵树独立递归 |\n| BST 中序性质  | `98 验证二叉搜索树`、`230 第 K 小`     | 中序严格递增        | BST 题先想中序遍历       |\n| BST 构造    | `108 有序数组转 BST`              | 区间递归建树        | 取中点做根，左右区间递归      |\n| 遍历序列建树    | `105 前序与中序构造二叉树`             | 用根切分左右子树      | 前序找根，中序确定左右规模     |\n| 树形展开      | `114 二叉树展开为链表`               | 原地重连指针        | 反向前序像链表头插法        |\n| 贡献型路径     | `543 二叉树的直径`、`124 最大路径和`     | 返回单边贡献，更新全局答案 | 答案可以拐弯，返回值不能拐弯    |\n| 前缀和路径     | `437 路径总和 III`               | 树上前缀和与回溯      | 左子树历史不能污染右子树      |\n| 最近公共祖先    | `236 二叉树的最近公共祖先`             | 子树查找目标节点      | 左右都找到，当前就是答案      |\n\n## 3. 复习顺序建议\n\n建议按“遍历能力 → 子树返回值 → 路径贡献 → 构造和设计”的顺序复习：\n\n1. `94 二叉树的中序遍历`：建立前中后序递归直觉。\n2. `104 最大深度`：理解子树返回值。\n3. `226 翻转二叉树`：练递归中的原地修改。\n4. `101 对称二叉树`：练两个节点同时递归。\n5. `102 层序遍历`：掌握 BFS 队列按层模板。\n6. `199 右视图`：理解 BFS 每层最后一个和 DFS 深度首次到达。\n7. `98`、`230`：用中序有序性处理 BST。\n8. `108`、`105`：练区间递归构造树。\n9. `543`、`124`：区分“全局答案”和“向上返回值”。\n10. `437`：掌握树上前缀和必须回溯。\n11. `236`：掌握 LCA 的后序查找逻辑。\n12. `114`：练树形结构原地改链。\n\n## 4. 关键套路详解\n\n### 4.1 递归从函数语义开始\n\n写二叉树递归前，先用一句话定义函数：\n\n```text\n这个函数处理以 root 为根的子树，并返回 ______。\n```\n\n例如 `104 最大深度` 返回“这棵子树的最大深度”；`543 直径` 的 DFS 返回“从当前节点向下走的最大深度”，同时用全局变量更新“经过当前节点的最大直径”；`236 最近公共祖先` 返回“当前子树里找到的 p 或 q 或 LCA”。\n\n如果这句话说不清楚，递归代码大概率会写乱。\n\n### 4.2 前中后序的真正区别是“当前节点什么时候处理”\n\n| 遍历 | 顺序 | 适合题型 |\n|---|---|---|\n| 前序 | 中、左、右 | 复制树、展开树、从根向下传状态 |\n| 中序 | 左、中、右 | BST 有序性、第 K 小、验证 BST |\n| 后序 | 左、右、中 | 深度、直径、最大路径和、LCA、删除/重构子树 |\n\n树的多数难题需要“遍历时带状态”或“遍历后返回信息”。比如 `437 路径总和 III` 是前序进入节点时加入前缀和，退出节点时回溯撤销。`124 最大路径和`是后序拿到左右贡献后更新答案。\n\n### 4.3 BFS 的关键是固定当前层长度\n\n层序题不要边遍历边用 `q.size()` 作为循环条件，因为队列过程中会加入下一层节点。正确做法是每进入一层先固定：\n\n```cpp\nint size = q.size();\nfor (int i = 0; i \u003c size; i++) { ... }\n```\n\n`102` 收集每层所有节点，`199` 可以在每层开始时取 `q.back()->val`，也可以在每层循环中记录最后一个弹出的节点。\n\n### 4.4 BST 题优先想中序遍历\n\nBST 的最强性质是中序遍历严格递增。`98 验证 BST`不能只比较当前节点和左右孩子，因为 BST 约束是整棵左子树都小于当前节点、整棵右子树都大于当前节点。正确方向有两个：\n\n| 方法 | 思路 | 适合场景 |\n|---|---|---|\n| 中序递增 | 维护上一个访问值 `prev` | 验证 BST、第 K 小 |\n| 上下界递归 | 每个节点必须落在 `(low, high)` 内 | 避免全局变量，更严格表达范围约束 |\n\n`230 第 K 小`就是中序遍历到第 K 个节点。进阶场景如果频繁插入删除并查询第 K 小，需要维护子树大小，走类似 order statistic tree 的路线。\n\n### 4.5 贡献型路径题要区分“答案”和“返回值”\n\n`543 直径`和`124 最大路径和`是同一类题。当前节点处的最优答案可以同时使用左子树和右子树，因为路径可以在当前节点拐弯。但向父节点返回时，只能选择一边继续向上，不能左右都带走，否则路径会分叉。\n\n| 题目 | 当前节点更新答案 | 向父节点返回 |\n|---|---|---|\n| `543 直径` | `leftDepth + rightDepth` | `max(leftDepth, rightDepth) + 1` |\n| `124 最大路径和` | `node->val + leftGain + rightGain` | `node->val + max(leftGain, rightGain)` |\n\n最重要的一句话：答案可以拐弯，返回值不能拐弯。\n\n### 4.6 树上前缀和必须回溯\n\n`437 路径总和 III`像数组题 `560 和为 K 的子数组`，但树有分叉。当前路径上的前缀和只能给当前分支使用，不能污染兄弟分支。因此进入节点时 `prefix[sum]++`，递归完左右子树后必须 `prefix[sum]--`。\n\n初始化 `prefix[0] = 1` 的含义是：如果从根到当前节点的路径和刚好等于目标值，也应该被统计。\n\n### 4.7 构造题的本质是区间递归\n\n`108 有序数组转 BST`和`105 前序中序构造树`都依赖区间递归。\n\n`108` 的区间含义简单：取中点做根，左区间建左子树，右区间建右子树。\n\n`105` 的边界更容易错：前序第一个是根，中序中根左边是左子树，根右边是右子树。只要算出 `leftSize`，前序左右子树边界就能推出来。\n\n## 5. 抽象代码模板\n\n下面模板按二叉树题的递归语义拆分。每个模板都先说明适用题型、核心思路，再给出可迁移 C++ 骨架。本节在保留新版严格结构的同时，补回旧版总笔记中的完整覆盖：遍历、层序、子树属性、双节点比较、BST、构造树、贡献型路径、树上前缀和、LCA 和树形展开。\n\n### 5.1 DFS 访问位置模板\n\n#### 适用题型\n\n- `94 二叉树的中序遍历`：访问位置决定前序 / 中序 / 后序。\n- `199 二叉树的右视图`：先右后左，首次到达某一层时记录。\n- 从根向下传递路径状态、深度、上下界的题。\n- BST 中序类题的基础访问框架，完整 BST 模板见 5.5。\n\n#### 核心思路\n\n二叉树 DFS 的关键在于明确当前节点在递归生命周期的哪个位置处理：前序位置适合把状态从父节点传给子节点；中序位置适合利用 BST 有序性；后序位置适合等左右子树都处理完后汇总信息。这个模板本身不依赖返回值，重点是访问时机。\n\n#### 代码模板\n\n> **题目简述：** 本模板覆盖：94 二叉树的中序遍历（给定二叉树根结点，按左子树、根、右子树的顺序返回结点值。）；199 二叉树的右视图（给定二叉树，返回从右侧观察时自顶向下能够看到的结点值。） [94 原题 ↗](https://leetcode.cn/problems/binary-tree-inorder-traversal/) · [199 原题 ↗](https://leetcode.cn/problems/binary-tree-right-side-view/)\n\n```cpp\nstruct TreeNode {\n    int val;\n    TreeNode* left;\n    TreeNode* right;\n    TreeNode(int x = 0) : val(x), left(nullptr), right(nullptr) {}\n};\n\nvoid dfsPosition(TreeNode* root, int depth, vector\u003cint>& ans) {\n    if (!root) {\n        return;\n    }\n\n    // 前序位置：刚进入 root。\n    // 适合记录根到当前节点路径、向下传递 depth/sum/range 等状态。\n    // 右视图变形：先递归右子树；depth == ans.size() 说明第一次到达该层。\n    // if (depth == (int)ans.size()) ans.push_back(root->val);\n\n    dfsPosition(root->left, depth + 1, ans);\n\n    // 中序位置：左子树已经访问完，当前节点正好处于 BST 的有序访问点。\n    // 普通中序遍历：ans.push_back(root->val);\n\n    dfsPosition(root->right, depth + 1, ans);\n\n    // 后序位置：左右子树都处理完。\n    // 适合删除 / 释放子树、统计左右返回值后的逻辑。\n    // 真正依赖左右返回值时，用 5.3、5.7、5.9 这类模板更清晰。\n}\n```\n\n#### 易错点\n\n- BST 题不要只在前序位置比较当前节点和左右孩子，BST 约束的是整棵子树范围或中序严格递增。\n- 右视图 DFS 必须先右后左，否则“首次到达该层”记录的是左视图。\n- 路径状态如果只属于当前路径，进入节点后修改，退出节点前必须恢复。\n\n### 5.2 BFS 层序模板\n\n#### 适用题型\n\n- `102 二叉树的层序遍历`：按层收集节点。\n- `199 二叉树的右视图`：每层取最后一个节点。\n- 二叉树最大深度的 BFS 写法。\n- 按层统计最大值、平均值、宽度等。\n\n#### 核心思路\n\nBFS 层序的核心不变量是：每一轮开始时队列里恰好是当前层的所有节点。必须先固定 `size`，本轮只弹出这 `size` 个节点；循环中加入的孩子属于下一层，不能混入当前层。\n\n#### 代码模板\n\n> **题目简述：** 本模板覆盖：102 二叉树的层序遍历（给定二叉树，按从上到下、每层从左到右返回各层结点值。）；199 二叉树的右视图（给定二叉树，返回从右侧观察时自顶向下能够看到的结点值。） [102 原题 ↗](https://leetcode.cn/problems/binary-tree-level-order-traversal/) · [199 原题 ↗](https://leetcode.cn/problems/binary-tree-right-side-view/)\n\n```cpp\nvector\u003cvector\u003cint>> levelOrder(TreeNode* root) {\n    vector\u003cvector\u003cint>> levels;\n    if (!root) {\n        return levels;\n    }\n\n    queue\u003cTreeNode*> q;\n    q.push(root);\n\n    while (!q.empty()) {\n        int size = q.size(); // 层序不变量：当前层节点数，后续 q.size() 会变化。\n        vector\u003cint> level;\n\n        for (int i = 0; i \u003c size; i++) {\n            TreeNode* node = q.front();\n            q.pop();\n\n            // i == 0 是左视图候选；i == size - 1 是右视图候选。\n            level.push_back(node->val);\n\n            if (node->left) {\n                q.push(node->left); // 下一层节点，只能在下一轮处理。\n            }\n            if (node->right) {\n                q.push(node->right);\n            }\n        }\n\n        levels.push_back(level);\n    }\n\n    return levels;\n}\n```\n\n#### 易错点\n\n- 不要在 `for` 条件里动态使用 `q.size()`，否则会把下一层节点也处理掉。\n- 右视图取的是当前层最后一个弹出的节点，也可以每层开始时读取 `q.back()`。\n- 空树要在入队前处理，不能把空指针塞进队列。\n\n### 5.3 子树属性返回值模板\n\n#### 适用题型\n\n- `104 二叉树的最大深度`：返回当前子树高度。\n- 最小深度、节点数、叶子数等子树属性统计。\n- 判断平衡二叉树：返回高度，同时带失败状态。\n- `226 翻转二叉树`：递归处理左右子树后原地重连。\n\n#### 核心思路\n\n这一类题共享“后序合并”骨架：先处理左右子树，再在当前节点合成结果。它们不需要拆成完全不同的模板，真正变化的是返回值语义和合并公式。结构修改类题也一样，只是合并动作从“计算属性”变成“重接指针”。\n\n#### 代码模板：共同骨架\n\n> **题目简述：** 本模板覆盖：104 二叉树的最大深度（给定二叉树，求根结点到最远叶结点路径上的结点数。）；226 翻转二叉树（交换二叉树中每个结点的左右子树，并返回翻转后的根结点。） [104 原题 ↗](https://leetcode.cn/problems/maximum-depth-of-binary-tree/) · [226 原题 ↗](https://leetcode.cn/problems/invert-binary-tree/)\n\n```cpp\nstruct SubtreeInfo {\n    int height;\n    int nodeCount;\n    int leafCount;\n    bool balanced;\n};\n\nSubtreeInfo collectSubtreeInfo(TreeNode* root) {\n    if (!root) {\n        return {0, 0, 0, true};\n    }\n\n    SubtreeInfo left = collectSubtreeInfo(root->left);\n    SubtreeInfo right = collectSubtreeInfo(root->right);\n\n    SubtreeInfo cur;\n    cur.height = max(left.height, right.height) + 1;\n    cur.nodeCount = left.nodeCount + right.nodeCount + 1;\n    cur.leafCount = (!root->left && !root->right)\n                  ? 1\n                  : left.leafCount + right.leafCount;\n    cur.balanced = left.balanced && right.balanced &&\n                   abs(left.height - right.height) \u003c= 1;\n    return cur;\n}\n```\n\n翻转树仍是同一个递归框架，原始笔记写法是先暂存左子树，再递归交换左右入口：\n\n> **题目简述：** 本模板覆盖：104 二叉树的最大深度（给定二叉树，求根结点到最远叶结点路径上的结点数。）；226 翻转二叉树（交换二叉树中每个结点的左右子树，并返回翻转后的根结点。） [104 原题 ↗](https://leetcode.cn/problems/maximum-depth-of-binary-tree/) · [226 原题 ↗](https://leetcode.cn/problems/invert-binary-tree/)\n\n```cpp\nTreeNode* invertTreeTemplate(TreeNode* root) {\n    if (root == nullptr) {\n        return nullptr;\n    }\n\n    // tmp 保存原左子树；随后 root->left 会被改成翻转后的原右子树。\n    TreeNode* tmp = root->left;\n    root->left = invertTreeTemplate(root->right);\n    root->right = invertTreeTemplate(tmp);\n    return root;\n}\n```\n\n#### 变形点对照\n\n| 题型    | 共同骨架中改哪里         | 合并公式 / 处理差异                              |\n| ----- | ---------------- | ---------------------------------------- |\n| 最大深度  | 返回 `height`      | `max(left.height, right.height) + 1`     |\n| 节点数   | 返回 `nodeCount`   | `left.nodeCount + right.nodeCount + 1`   |\n| 叶子数   | 增加叶子判断           | 叶子为 `1`，非叶子累加左右叶子数                       |\n| 平衡二叉树 | 高度同时带 `balanced` | 左右平衡且高度差不超过 `1`                          |\n| 最小深度  | 单孩子节点特殊处理        | 空子树不能参与 `min`                            |\n| 翻转二叉树 | 合并动作改成指针重接       | `root->left = right; root->right = left` |\n|       |                  |                                          |\n\n#### 易错点\n\n- 返回值必须只表示当前子树属性，不要混入“整棵树最终答案”的语义。\n- 最小深度遇到单孩子节点不能简单 `min(left, right) + 1`，否则会把不存在的空子树深度 0 当成路径。\n- 平衡树不能只看当前节点高度差，还要保证左右子树本身已经平衡。\n- 翻转树可以前序交换也可以后序交换，但必须保证左右指针最终接到已处理后的子树。\n\n### 5.4 双节点镜像递归模板\n\n#### 适用题型\n\n- `101 对称二叉树`：比较左右子树是否互为镜像。\n- 判断两棵树是否相同。\n- 判断一棵树是否是另一棵树的子树。\n- 任意需要两个节点同步推进、成对比较的树题。\n\n#### 核心思路\n\n对称树需要双节点同步递归。递归参数同时保存两个待比较节点。镜像比较时使用 `a->left` 对 `b->right`、`a->right` 对 `b->left`；相同树比较时使用 `a->left` 对 `b->left`、`a->right` 对 `b->right`。\n\n#### 代码 A：镜像比较\n\n> **题目简述：** 101 对称二叉树：给定二叉树根结点，判断其左右子树是否关于中心互为镜像。 [力扣原题 ↗](https://leetcode.cn/problems/symmetric-tree/)\n\n```cpp\nbool mirrorCompare(TreeNode* a, TreeNode* b) {\n    // 返回值语义：判断 a、b 两棵子树是否互为镜像。\n    if (!a && !b) {\n        return true;\n    }\n    if (!a || !b) {\n        return false;\n    }\n    if (a->val != b->val) {\n        return false;\n    }\n\n    // 镜像关系比较外侧和内侧，避免同方向比较。\n    return mirrorCompare(a->left, b->right) &&\n           mirrorCompare(a->right, b->left);\n}\n\nbool isSymmetricTemplate(TreeNode* root) {\n    if (!root) {\n        return true;\n    }\n    return mirrorCompare(root->left, root->right);\n}\n```\n\n#### 代码 B：相同树比较\n\n> **题目简述：** 100 相同的树：给定两棵二叉树，判断其结构及对应结点值是否完全相同。 [力扣原题 ↗](https://leetcode.cn/problems/same-tree/)\n\n```cpp\nbool sameTree(TreeNode* a, TreeNode* b) {\n    // 返回值语义：判断 a、b 两棵子树结构和值是否完全相同。\n    if (!a && !b) {\n        return true;\n    }\n    if (!a || !b) {\n        return false;\n    }\n    if (a->val != b->val) {\n        return false;\n    }\n\n    return sameTree(a->left, b->left) &&\n           sameTree(a->right, b->right);\n}\n```\n\n#### 易错点\n\n- 对称树比较的是外侧和内侧：`left-left` 对 `right-right` 的写法是错的。\n- 双节点递归要先处理“同时为空 / 只有一个为空 / 值不同”三类终止条件。\n- 子树判断通常是“外层遍历每个起点 + 内层 sameTree”，不要把两层语义混在一个函数里。\n\n### 5.5 BST 中序与上下界模板\n\n#### 适用题型\n\n- `98 验证二叉搜索树`：中序严格递增或递归传上下界。\n- `230 二叉搜索树中第 K 小的元素`：中序遍历第 K 个访问点。\n- BST 第 K 大：反中序，即右、根、左。\n- BST 范围查询、范围剪枝。\n\n#### 核心思路\n\nBST 的性质要求整棵左子树都小于根，整棵右子树都大于根。验证时要么传递开区间 `(low, high)`，要么利用中序严格递增。第 K 小的本质是中序遍历计数，成员变量需要在公开入口初始化。\n\n#### 代码 A：上下界验证 BST\n\n> **题目简述：** 98 验证二叉搜索树：判断二叉树是否满足所有左侧值严格更小、右侧值严格更大的全局约束。 [力扣原题 ↗](https://leetcode.cn/problems/validate-binary-search-tree/)\n\n```cpp\nclass ValidateBstRangeTemplate {\nprivate:\n    bool dfs(TreeNode* root, long long low, long long high) {\n        // 返回值语义：判断当前子树所有节点是否都落在开区间 (low, high) 内。\n        if (!root) {\n            return true;\n        }\n\n        if (root->val \u003c= low || root->val >= high) {\n            return false;\n        }\n\n        // 左子树上界收紧为 root->val；右子树下界收紧为 root->val。\n        return dfs(root->left, low, root->val) &&\n               dfs(root->right, root->val, high);\n    }\n\npublic:\n    bool isValidBST(TreeNode* root) {\n        return dfs(root, LLONG_MIN, LLONG_MAX);\n    }\n};\n```\n\n#### 代码 B：中序验证 BST\n\n> **题目简述：** 98 验证二叉搜索树：判断二叉树是否满足所有左侧值严格更小、右侧值严格更大的全局约束。 [力扣原题 ↗](https://leetcode.cn/problems/validate-binary-search-tree/)\n\n```cpp\nclass ValidateBstInorderTemplate {\nprivate:\n    long long prev;\n\n    bool inorder(TreeNode* root) {\n        if (!root) {\n            return true;\n        }\n\n        if (!inorder(root->left)) {\n            return false;\n        }\n\n        // 中序访问必须严格递增；相等也非法。\n        if (root->val \u003c= prev) {\n            return false;\n        }\n        prev = root->val;\n\n        return inorder(root->right);\n    }\n\npublic:\n    bool isValidBST(TreeNode* root) {\n        prev = LLONG_MIN; // wrapper 初始化，避免重复调用沿用旧 prev。\n        return inorder(root);\n    }\n};\n```\n\n#### 代码 C：第 K 小\n\n> **题目简述：** 本模板覆盖：98 验证二叉搜索树（判断二叉树是否满足所有左侧值严格更小、右侧值严格更大的全局约束。）；230 二叉搜索树中第 K 小的元素（给定二叉搜索树和有效整数 K，返回所有结点值中的第 K 小值。） [98 原题 ↗](https://leetcode.cn/problems/validate-binary-search-tree/) · [230 原题 ↗](https://leetcode.cn/problems/kth-smallest-element-in-a-bst/)\n\n```cpp\nclass KthSmallestBstTemplate {\nprivate:\n    int remain;\n    int answer;\n\n    void inorder(TreeNode* root) {\n        if (!root || remain == 0) {\n            return;\n        }\n\n        inorder(root->left);\n\n        // 中序第 k 个访问到的节点就是第 k 小。\n        if (--remain == 0) {\n            answer = root->val;\n            return;\n        }\n\n        inorder(root->right);\n    }\n\npublic:\n    int kthSmallest(TreeNode* root, int k) {\n        remain = k;\n        answer = 0;\n        inorder(root);\n        return answer;\n    }\n};\n```\n\n#### 易错点\n\n- 验证 BST 不能只比较当前节点和左右孩子，要约束整棵子树。\n- `prev` 初始化不能用 `INT_MIN`，因为节点值可能等于 `INT_MIN`，用 `LLONG_MIN` 更安全。\n- 第 K 大只需改成反中序 `right -> root -> left`，不要先遍历完整数组再排序。\n\n### 5.6 区间递归构造二叉树模板\n\n#### 适用题型\n\n- `108 将有序数组转换为二叉搜索树`：用有序区间中点作为根。\n- `105 从前序与中序遍历序列构造二叉树`：前序确定根，中序切分左右子树。\n- 中序 + 后序构造树变形。\n- 任意“一个区间构造一棵子树”的分治题。\n\n#### 核心思路\n\n构造树题必须先定义区间语义。`108` 适合使用左闭右开区间 `[left, right)`；`105` 常用闭区间，前序左端是根，中序根左侧是左子树。为了避免每次在线性扫描中序数组，先用哈希表记录值到下标的映射。\n\n#### 代码 A：有序数组转平衡 BST\n\n> **题目简述：** 108 将有序数组转换为二叉搜索树：给定严格升序数组，将其转换为一棵高度平衡的二叉搜索树。 [力扣原题 ↗](https://leetcode.cn/problems/convert-sorted-array-to-binary-search-tree/)\n\n```cpp\nTreeNode* buildBalancedBst(vector\u003cint>& nums, int left, int right) {\n    // 区间语义：用 nums[left, right) 构造一棵平衡 BST。\n    if (left >= right) {\n        return nullptr;\n    }\n\n    int mid = left + (right - left) / 2;\n    TreeNode* root = new TreeNode(nums[mid]);\n\n    root->left = buildBalancedBst(nums, left, mid);\n    root->right = buildBalancedBst(nums, mid + 1, right);\n\n    return root;\n}\n\nTreeNode* sortedArrayToBSTTemplate(vector\u003cint>& nums) {\n    return buildBalancedBst(nums, 0, nums.size());\n}\n```\n\n#### 代码 B：前序 + 中序构造树\n\n> **题目简述：** 105 从前序与中序遍历序列构造二叉树：给定同一棵无重复值二叉树的前序和中序序列，还原并返回该树。 [力扣原题 ↗](https://leetcode.cn/problems/construct-binary-tree-from-preorder-and-inorder-traversal/)\n\n```cpp\nclass BuildTreePreInTemplate {\nprivate:\n    unordered_map\u003cint, int> inIndex;\n\n    TreeNode* build(vector\u003cint>& preorder,\n                    int preLeft,\n                    int preRight,\n                    int inLeft,\n                    int inRight) {\n        // 区间语义：preorder[preLeft, preRight] 与 inorder[inLeft, inRight]\n        // 表示同一棵子树，两个区间长度必须一致。\n        if (preLeft > preRight) {\n            return nullptr;\n        }\n\n        int rootVal = preorder[preLeft];\n        TreeNode* root = new TreeNode(rootVal);\n        int rootIndex = inIndex[rootVal];\n        int leftSize = rootIndex - inLeft;\n\n        // 左子树：前序跳过根后取 leftSize 个；中序在根左边。\n        root->left = build(preorder,\n                           preLeft + 1,\n                           preLeft + leftSize,\n                           inLeft,\n                           rootIndex - 1);\n\n        // 右子树：前序跳过根和左子树；中序在根右边。\n        root->right = build(preorder,\n                            preLeft + leftSize + 1,\n                            preRight,\n                            rootIndex + 1,\n                            inRight);\n\n        return root;\n    }\n\npublic:\n    TreeNode* buildTree(vector\u003cint>& preorder, vector\u003cint>& inorder) {\n        inIndex.clear();\n        for (int i = 0; i \u003c (int)inorder.size(); i++) {\n            inIndex[inorder[i]] = i;\n        }\n\n        return build(preorder,\n                     0,\n                     (int)preorder.size() - 1,\n                     0,\n                     (int)inorder.size() - 1);\n    }\n};\n```\n\n#### 易错点\n\n- 构造题最容易错的是区间开闭不统一，建议在代码注释里固定区间语义。\n- `leftSize` 是中序根下标和当前中序左边界的差，不能用前序下标差。\n- `105` 默认节点值不重复；如果值重复，单纯 `value -> index` 映射会失效。\n\n### 5.7 贡献型路径模板\n\n#### 适用题型\n\n- `543 二叉树的直径`。\n- `124 二叉树中的最大路径和`。\n- 任意“当前节点更新全局答案，向父节点只能返回单边贡献”的路径题。\n\n#### 核心思路\n\n贡献型题共享同一套骨架：DFS 返回“能继续交给父节点拼接的单边贡献”，而全局答案在当前节点用“左贡献 + 当前节点 + 右贡献”更新。直径和最大路径和共用模板，差别在于贡献的单位、负贡献处理和答案公式。\n\n#### 代码模板：共同骨架\n\n> **题目简述：** 本模板覆盖：543 二叉树的直径（求二叉树任意两结点间最长路径的边数，该路径不一定经过根结点。）；124 二叉树中的最大路径和（二叉树路径可从任意结点起止且不重复经过结点，求最大结点值之和。） [124 原题 ↗](https://leetcode.cn/problems/binary-tree-maximum-path-sum/) · [543 原题 ↗](https://leetcode.cn/problems/diameter-of-binary-tree/)\n\n```cpp\nclass PathContributionTemplate {\nprivate:\n    int ans;\n\n    int dfs(TreeNode* root) {\n        if (!root) {\n            return 0;\n        }\n\n        int left = dfs(root->left);\n        int right = dfs(root->right);\n\n        // 共同结算点：答案可以在当前节点拐弯，同时使用左右贡献。\n        ans = max(ans, left + right);\n\n        // 共同返回点：返回给父节点时不能拐弯，只能选一侧继续延伸。\n        return max(left, right) + 1;\n    }\n\npublic:\n    int diameterOfBinaryTree(TreeNode* root) {\n        ans = 0;\n        dfs(root);\n        return ans;\n    }\n};\n```\n\n最大路径和沿用相同骨架，只替换三处：空节点贡献、负贡献处理、答案公式。\n\n> **题目简述：** 本模板覆盖：543 二叉树的直径（求二叉树任意两结点间最长路径的边数，该路径不一定经过根结点。）；124 二叉树中的最大路径和（二叉树路径可从任意结点起止且不重复经过结点，求最大结点值之和。） [124 原题 ↗](https://leetcode.cn/problems/binary-tree-maximum-path-sum/) · [543 原题 ↗](https://leetcode.cn/problems/diameter-of-binary-tree/)\n\n```cpp\n// 变形点 1：左右贡献如果为负，直接截断为 0。\nint leftGain = max(0, sumGain(root->left));\nint rightGain = max(0, sumGain(root->right));\n\n// 变形点 2：全局答案公式从边数改成路径和。\nans = max(ans, root->val + leftGain + rightGain);\n\n// 变形点 3：返回值带上当前节点值，只能选一侧。\nreturn root->val + max(leftGain, rightGain);\n```\n\n#### 变形点对照\n\n| 题型 | 返回值语义 | 全局答案公式 | 特殊处理 |\n|---|---|---|---|\n| 二叉树直径 | 向下最大深度 | `leftDepth + rightDepth` | `ans` 初始为 `0` |\n| 最大路径和 | 向下最大路径和 | `root->val + leftGain + rightGain` | 负贡献截断；`ans` 初始为 `INT_MIN` |\n\n#### 易错点\n\n- 不要把 `left + right` 返回给父节点；它只能用于更新当前节点处的全局答案。\n- 最大路径和的答案初值必须足够小，不能初始化为 0，否则全负数输入会错。\n- 如果把 `ans` 写成成员变量或全局变量，必须在公开入口函数里重置。\n- 直径常按边数计，深度返回按节点层数计，两者不要混淆。\n\n### 5.8 树上前缀和回溯模板\n\n#### 适用题型\n\n- `437 路径总和 III`。\n- 树上任意祖先到后代路径和计数。\n- 需要查询当前路径历史状态的题。\n\n#### 核心思路\n\n树上前缀和像数组前缀和，但历史只属于“根到当前节点”这条路径。进入节点后加入当前前缀，递归左右子树，退出节点前撤销当前前缀。这里不需要全局答案，直接用返回值累计当前子树中的方案数，初始化 `map[0] = 1`。\n\n#### 代码模板\n\n> **题目简述：** 437 路径总和 III：统计二叉树中结点值之和等于目标值的向下路径数，路径可从任意结点开始。 [力扣原题 ↗](https://leetcode.cn/problems/path-sum-iii/)\n\n```cpp\nclass Solution {\nprivate:\n    unordered_map\u003clong long,int> map{{0,1}};\n    int target;\npublic:\n    int path(TreeNode*root,long long sum){\n        if(!root) return 0;\n        sum+=root->val;\n        int res=0;\n        if(map.count(sum-target)){\n            res+=map[sum-target];\n        }\n        map[sum]++;\n        res+=path(root->left,sum);\n        res+=path(root->right,sum);\n        map[sum]--;\n        return res;\n    }\n\n    int pathSum(TreeNode* root, int targetSum) {\n        target=targetSum;\n        return  path(root,0);\n    }\n};\n```\n\n#### 易错点\n\n- `map` 记录当前路径历史，不能当全树历史；递归退出前必须 `--`。\n- 先统计 `map[sum - target]`，再把当前 `sum` 加入表，避免把当前节点当成自己的历史。\n- 节点值和路径和可能溢出 `int`，前缀和建议用 `long long`。\n\n### 5.9 最近公共祖先 LCA 模板\n\n#### 适用题型\n\n- `236 二叉树的最近公共祖先`：普通二叉树后序查找。\n- BST 最近公共祖先：利用节点值范围剪枝。\n- 多个目标节点的公共祖先变形。\n- 不保证目标节点存在时，需要额外统计命中数量的变形。\n\n#### 核心思路\n\n普通二叉树 LCA 的共同骨架是后序查找：左右子树各自返回命中信息，当前节点根据左右命中情况决定是否成为汇合点。变形不应该拆成完全无关模板，而是在返回值里增加“是否找到目标”“命中数量”等少量信息。BST LCA 是例外：因为可利用值范围剪枝，控制流会变成迭代向左/向右。\n\n#### 代码模板：共同骨架\n\n> **题目简述：** 236 二叉树的最近公共祖先：给定二叉树及其中两个结点，返回同时包含二者的最深祖先结点。 [力扣原题 ↗](https://leetcode.cn/problems/lowest-common-ancestor-of-a-binary-tree/)\n\n```cpp\nTreeNode* lowestCommonAncestorTemplate(TreeNode* root, TreeNode* p, TreeNode* q) {\n    if (!root || root == p || root == q) {\n        return root;\n    }\n\n    TreeNode* left = lowestCommonAncestorTemplate(root->left, p, q);\n    TreeNode* right = lowestCommonAncestorTemplate(root->right, p, q);\n\n    if (left && right) {\n        return root; // 左右两侧各命中一个目标，当前节点是最近汇合点。\n    }\n    return left ? left : right;\n}\n```\n\n如果题目不保证目标都存在，骨架仍是后序，只把返回值从一个节点扩展成“节点 + 命中标记”：\n\n> **题目简述：** 236 二叉树的最近公共祖先：给定二叉树及其中两个结点，返回同时包含二者的最深祖先结点。 [力扣原题 ↗](https://leetcode.cn/problems/lowest-common-ancestor-of-a-binary-tree/)\n\n```cpp\nstruct LcaSearchResult {\n    TreeNode* node;\n    bool foundP;\n    bool foundQ;\n};\n\n// 变形点：left/right 仍然来自后序，只是合并时顺便维护 foundP/foundQ。\nbool foundP = left.foundP || right.foundP || root == p;\nbool foundQ = left.foundQ || right.foundQ || root == q;\n// 最终只有 foundP && foundQ 时，node 才是真正 LCA。\n```\n\n多目标 LCA 也是同一思路：把两个布尔命中扩展成“当前子树命中的目标数量”。\n\n> **题目简述：** 236 二叉树的最近公共祖先：给定二叉树及其中两个结点，返回同时包含二者的最深祖先结点。 [力扣原题 ↗](https://leetcode.cn/problems/lowest-common-ancestor-of-a-binary-tree/)\n\n```cpp\n// 变形点：返回 count，表示当前子树命中了多少个目标节点。\nint count = targets.count(root) ? 1 : 0;\ncount += dfs(root->left);\ncount += dfs(root->right);\nif (count == (int)targets.size() && !answer) {\n    answer = root; // 后序第一次集齐全部目标的位置就是最近公共祖先。\n}\n```\n\n#### 变形点对照\n\n| 题型 | 返回值语义 | 合并差异 |\n|---|---|---|\n| 普通二叉树 LCA | 返回 `p/q/LCA/nullptr` | 左右都非空则当前为 LCA |\n| 不保证目标存在 | 返回节点，同时带 `foundP/foundQ` | 最终必须两个目标都存在才返回答案 |\n| 多目标 LCA | 返回命中目标数量 | 首次命中数量达到目标总数时锁定答案 |\n| BST LCA | 不需要后序返回值 | 根据 `p/q` 与当前值关系向左或向右剪枝 |\n\n#### 易错点\n\n- 当前节点等于 `p` 或 `q` 时要直接返回当前节点，不需要继续向下找另一个。\n- 普通二叉树不能用值大小剪枝；只有 BST LCA 才能按值判断左右方向。\n- 如果题目不保证 `p`、`q` 都存在，普通模板会把存在的那个节点返回，需要额外记录命中数量。\n- 多目标 LCA 要在后序位置判断，前序判断会把过高的祖先误当答案。\n\n### 5.10 二叉树展开为链表模板\n\n#### 适用题型\n\n- `114 二叉树展开为链表`。\n- 树按前序遍历顺序原地改成单链结构。\n- 需要把左子树和右子树重排到一条 `right` 指针链上的题。\n\n#### 核心思路\n\n目标链表顺序是前序：根、左、右。递归法可以反过来处理：右、左、根，用 `prev` 保存已经处理好的链表头，当前节点接到 `prev` 前面。迭代法则找到当前左子树的最右节点，把原右子树接到它后面，再把左子树整体挪到右边。\n\n#### 代码 A：反向前序递归\n\n> **题目简述：** 114 二叉树展开为链表：将二叉树原地展开为前序遍历顺序的单链表，仅使用结点的右指针。 [力扣原题 ↗](https://leetcode.cn/problems/flatten-binary-tree-to-linked-list/)\n\n```cpp\nclass FlattenReversePreorderTemplate {\nprivate:\n    TreeNode* prev;\n\n    void dfs(TreeNode* root) {\n        if (!root) {\n            return;\n        }\n\n        // 目标是前序：root -> left -> right；反向处理就是 right -> left -> root。\n        dfs(root->right);\n        dfs(root->left);\n\n        root->right = prev;\n        root->left = nullptr; // 题目要求展开后所有 left 都为空。\n        prev = root;\n    }\n\npublic:\n    void flatten(TreeNode* root) {\n        prev = nullptr; // wrapper 初始化，避免重复调用污染状态。\n        dfs(root);\n    }\n};\n```\n\n#### 代码 B：O(1) 额外空间前驱法\n\n> **题目简述：** 114 二叉树展开为链表：将二叉树原地展开为前序遍历顺序的单链表，仅使用结点的右指针。 [力扣原题 ↗](https://leetcode.cn/problems/flatten-binary-tree-to-linked-list/)\n\n```cpp\nvoid flattenByPredecessorTemplate(TreeNode* root) {\n    TreeNode* cur = root;\n\n    while (cur) {\n        if (cur->left) {\n            // predecessor 是左子树按前序展开后最末尾的节点，也就是左子树最右链末端。\n            TreeNode* predecessor = cur->left;\n            while (predecessor->right) {\n                predecessor = predecessor->right;\n            }\n\n            predecessor->right = cur->right; // 原右子树接到左子树末尾。\n            cur->right = cur->left;          // 左子树整体移动到右侧。\n            cur->left = nullptr;             // 展开链表必须清空 left。\n        }\n\n        cur = cur->right;\n    }\n}\n```\n\n#### 易错点\n\n- `114` 的目标顺序是前序，不能用中序或后序。\n- 递归反向前序必须初始化 `prev = nullptr`，否则多次调用会串到旧链表。\n- 每处理一个节点都要清空 `left`，否则展开链表结构非法。\n- 前驱法中必须先把原右子树接到左子树最右节点，再移动左子树。\n\n\n## 6. 高频易错点清单\n\n| 易错点 | 典型题目 | 规避方式 |\n|---|---|---|\n| 递归函数返回值语义不清 | `104`、`543`、`124`、`236` | 先写一句“dfs 返回什么” |\n| BFS 没有固定当前层长度 | `102`、`199` | 每层开始先 `int size = q.size()` |\n| 队列初始化后忘记压入根节点 | `102` | 空树判断后立刻 `q.push(root)` |\n| BST 只比较父子节点 | `98` | 用中序严格递增或上下界递归 |\n| 第 K 小没有利用 BST 中序 | `230` | 中序遍历计数，第 K 个就是答案 |\n| 构造树边界算错 | `105` | 用 `leftSize` 推前序左右区间 |\n| 贡献型题把返回值当答案 | `543`、`124` | 全局答案可左右合并，返回值只能单边延伸 |\n| 最大路径和没有截断负贡献 | `124` | `leftGain = max(0, dfs(left))` |\n| 前缀和没有回溯 | `437` | 左右子树递归后 `prefixCount[curSum]--` |\n| LCA 不知道何时返回当前节点 | `236` | 左右都找到时当前节点就是 LCA |\n| 展开链表忘记清空 left | `114` | 每处理一个节点都 `root->left = nullptr` |\n| 现有 `543` 笔记代码与题目不匹配 | `543` | 思路是直径，代码应使用直径模板，不应套最大路径和函数 |\n\n## 7. 最短复盘口诀\n\n二叉树题先定义递归函数返回什么。遍历题看当前节点处理位置，层序题固定当前层 `size`，BST 题先想中序，构造题看区间边界，路径题分清“全局答案”和“向上贡献”，前缀和题进入加状态、退出撤状态。`104` 是子树属性母题，`102` 是 BFS 母题，`98` 是 BST 母题，`543/124` 是贡献型路径母题，`236` 是后序查找母题。\n\n\n\n================================================================================\n\n# 第7部分: 图论\n\n================================================================================\n\n> 目标：本文把 Hot100 中的图论题抽象成若干“可复用题型模板”。复习时先判断图的形态，再决定建图方式、遍历方式、状态语义和终止条件。\n\n## 1. 图论题的底层模型\n\n图论题的关键在于把题目翻译成图。每道图论题先问六个问题：\n\n| 问题 | 如果答案是“是” | 常用处理 |\n|---|---|---|\n| 图是隐式的吗 | 网格、字符串前缀、状态转移 | 不一定显式建边，用方向数组、字符分支或状态转移生成邻居 |\n| 图是显式的吗 | 课程依赖、边列表、节点关系 | 建邻接表 `vector\u003cvector\u003cint>> edges` |\n| 需要找连通块数量吗 | 岛屿数量、区域计数 | 外层枚举起点，遇到未访问节点就 DFS/BFS 吃掉整块 |\n| 答案和最短时间/层数有关吗 | 腐烂的橘子、最短步数 | BFS 按层扩散，必要时多源同时入队 |\n| 是否是有向图判环 | 课程表、依赖关系 | 拓扑排序看是否能访问全部节点，或 DFS 三色标记 |\n| 是否是前缀路径结构 | Trie、自动补全、前缀查询 | 每个节点维护 `children`，路径表示字符串前缀 |\n\n图论题最常见的图形态有四种：\n\n| 图形态 | 节点是什么 | 边是什么 | 代表题 |\n|---|---|---|---|\n| 网格图 | 一个格子 `(r, c)` | 上下左右相邻 | `200`、`994`、相邻题 `79` |\n| 有向图 | 一门课程或一个状态 | 依赖关系或状态转移 | `207` |\n| 字符前缀图 | Trie 节点 | 下一个字符分支 | `208` |\n| 状态图 | 一个数值或组合状态 | 一次合法操作 | 相邻题 `279`、`322` 可用 BFS 理解 |\n\n## 2. Hot100 图论题型地图\n\n本专题覆盖 `200 岛屿数量`、`207 课程表`、`208 实现 Trie`、`994 腐烂的橘子` 四类图论模型。`79 单词搜索`与网格图 DFS 模板高度相关，可作为相邻变形题一起复习。\n\n| 题型 | 题目 | 抽象能力 | 一句话记忆 |\n|---|---|---|---|\n| 网格连通块 DFS | `200 岛屿数量` | 方向数组、边界判断、访问标记 | 遇到一块陆地，DFS 把整座岛吃掉 |\n| 网格多源 BFS | `994 腐烂的橘子` | 多源入队、按层扩散、分钟计数 | 一开始所有腐烂橘子同时扩散 |\n| 有向图判环 | `207 课程表` | 邻接表、入度、拓扑排序、三色 DFS | 能拓扑完所有课就无环 |\n| 前缀树设计 | `208 实现 Trie` | 多叉字符图、路径查询、终止标记 | 节点表示前缀，`isEnd` 区分完整单词 |\n| 网格回溯 DFS | 相邻题 `79 单词搜索` | 路径状态、访问撤销、提前返回 | 找路径要恢复现场，不能永久染色 |\n\n## 3. 复习顺序建议\n\n建议按“隐式图遍历 → BFS 层扩散 → 显式建图 → 设计型图结构”的顺序复习：\n\n1. `200 岛屿数量`：建立网格图 DFS 的方向数组和访问标记直觉。\n2. `994 腐烂的橘子`：掌握多源 BFS 和按层计时。\n3. `207 课程表`：学习显式建图、入度数组、拓扑排序和 DFS 染色判环。\n4. `208 实现 Trie`：理解前缀树其实是字符路径图。\n5. `79 单词搜索`：作为网格 DFS 的回溯变形，重点练“进入修改、失败恢复”。\n\n## 4. 关键套路详解\n\n### 4.1 先翻译“点”和“边”\n\n图论题第一步是翻译：\n\n```text\n节点是什么？\n从一个节点可以走到哪些邻居？\n一个节点访问过以后还能不能再次访问？\n```\n\n`200` 中节点是格子，边是上下左右相邻的陆地；`994` 中节点也是格子，但边表示腐烂扩散，答案和 BFS 层数有关；`207` 中节点是课程，边是先修关系；`208` 中节点是前缀状态，边是一个字符。\n\n如果点和边翻译不清楚，DFS/BFS 模板再熟也会写乱。\n\n### 4.2 网格图的核心是方向数组和防越界\n\n网格图通常不需要显式建邻接表，因为每个格子的邻居可以通过方向数组现场生成：\n\n```cpp\nint dirs[4][2] = {{0, 1}, {0, -1}, {1, 0}, {-1, 0}};\n```\n\n网格 DFS/BFS 的“防爆盾”通常包含三层：坐标是否越界、格子是否符合目标值、是否已经访问过。`200` 可以直接把访问过的 `'1'` 改成 `'0'` 或其他标记；`79` 不能永久修改，因为一条路径失败后，别的路径还可能使用这个格子，所以必须回溯恢复。\n\n### 4.3 DFS 适合吃完整块，BFS 适合算最短层数\n\n`200 岛屿数量`只需要知道有多少个连通块。外层枚举每个格子，一旦发现新陆地，就用 DFS 或 BFS 把整个连通块标记掉，答案加一。\n\n`994 腐烂的橘子`需要最少分钟数。分钟天然对应 BFS 的层数，所以要用队列按层扩散。更关键的是它是多源 BFS：一开始所有腐烂橘子同时入队。\n\n| 场景 | 优先方法 | 原因 |\n|---|---|---|\n| 只要遍历完一个连通块 | DFS 或 BFS | 不关心层数，吃完整块即可 |\n| 要最短步数、分钟、距离 | BFS | BFS 第一时间到达就是最短 |\n| 多个起点同时扩散 | 多源 BFS | 所有源点先一起入队，层数才正确 |\n| 路径要撤销状态 | 回溯 DFS | 进入标记，退出恢复 |\n\n### 4.4 多源 BFS 的初始化决定答案是否正确\n\n`994` 的难点在初始化：\n\n| 初始化内容 | 作用 |\n|---|---|\n| 所有腐烂橘子入队 | 多个源点同时在第 0 分钟开始扩散 |\n| 统计新鲜橘子数量 `fresh` | 最后判断是否还有死角无法腐烂 |\n| 如果 `fresh == 0` 直接返回 0 | 没有新鲜橘子时不需要进入 BFS |\n\nBFS 每处理完当前队列中的一层，才代表过了一分钟。不要每弹出一个橘子就加一分钟。\n\n### 4.5 课程表是有向图判环\n\n`207 课程表`要先把题意翻译成有向图。如果 `[a, b]` 表示学 `a` 之前必须先学 `b`，那么边应该是 `b -> a`，意思是完成 `b` 后可以解锁 `a`。\n\n两种常用解法本质一致：\n\n| 方法 | 状态含义 | 判定方式 |\n|---|---|---|\n| 拓扑排序 | `indeg[x]` 表示课程 `x` 还剩多少前置课 | 能弹出并学习全部课程，说明无环 |\n| DFS 三色标记 | `0` 未访问，`1` 当前路径中，`2` 已确认安全 | DFS 遇到 `1`，说明有环 |\n\n拓扑排序更直观，DFS 染色更像递归版判环。两个都要掌握。\n\n### 4.6 Trie 是字符图，不只是字符串题\n\n`208 实现 Trie`可以理解为一张从根出发的字符图。每走一个字符，就沿着对应边进入下一层节点。`search` 和 `startsWith` 的区别不在遍历过程，而在遍历结束后的判断：\n\n| 操作 | 遍历过程 | 结束判断 |\n|---|---|---|\n| `insert` | 没有边就新建节点 | 最后节点 `isEnd = true` |\n| `search` | 缺边直接 false | 最后必须 `isEnd == true` |\n| `startsWith` | 缺边直接 false | 走完 prefix 就 true |\n\n最容易错的是把前缀存在当成完整单词存在。`apple` 插入后，`startsWith(\"app\")` 是 true，但 `search(\"app\")` 仍是 false，除非单独插入过 `app`。\n\n### 4.7 永久染色和回溯恢复不能混用\n\n`200` 和 `79` 都像网格 DFS，但访问标记的语义完全不同：\n\n| 题目 | 标记方式 | 为什么 |\n|---|---|---|\n| `200 岛屿数量` | 可以永久把陆地改成水或已访问 | 一座岛只需要统计一次，之后不再需要原状态 |\n| `79 单词搜索` | 进入时临时标记，退出时恢复 | 当前路径不能重复用格子，但其他路径仍可能用 |\n\n一句话区分：统计连通块可以永久染色，搜索具体路径通常要回溯恢复。\n\n## 5. 抽象代码模板\n\n下面模板按图的形态组织：网格图、依赖有向图、前缀字符图。重点是先翻译节点和边，再选择 DFS、BFS、拓扑或 Trie。\n\n### 5.1 网格 DFS 连通块模板\n\n#### 适用题型\n\n- 岛屿数量 / 连通块数量。\n- 岛屿最大面积。\n- 区域染色 / 图像渲染。\n\n#### 核心思路\n\n同一类网格 DFS 应该先抽出共同的 flood fill 骨架：入口判断、永久染色、四方向递归。岛屿数量、最大面积、区域染色的差别很小，主要是外层结算方式和目标/标记值不同。\n\n关键不变量：\n\n- 访问过的格子要永久标记，不能回溯恢复。\n- DFS 入口统一处理越界和目标值判断。\n- 数量题在入口计数，面积题让 DFS 返回格子数，染色题把颜色作为参数。\n\n#### 代码模板：共同骨架\n\n> **题目简述：** 本模板用于：岛屿数量 / 连通块数量。；岛屿最大面积。；区域染色 / 图像渲染。 [力扣原题 ↗](https://leetcode.cn/problems/number-of-islands/)\n\n```cpp\nint gridDfs(vector\u003cvector\u003cint>>& grid, int r, int c, int targetValue, int markValue) {\n    int m = grid.size();\n    int n = grid[0].size();\n    if (r \u003c 0 || r >= m || c \u003c 0 || c >= n || grid[r][c] != targetValue) {\n        return 0;\n    }\n\n    grid[r][c] = markValue; // 永久染色，避免同一连通块被重复访问。\n    int area = 1;\n    area += gridDfs(grid, r + 1, c, targetValue, markValue);\n    area += gridDfs(grid, r - 1, c, targetValue, markValue);\n    area += gridDfs(grid, r, c + 1, targetValue, markValue);\n    area += gridDfs(grid, r, c - 1, targetValue, markValue);\n    return area;\n}\n```\n\n#### 变形点对照\n\n| 题型 | 改哪里 | 代码差异 |\n|---|---|---|\n| 岛屿数量 | 外层结算 | 发现 `1` 时 `ans++`，然后 `gridDfs(grid, r, c, 1, 0)` |\n| 岛屿最大面积 | 外层结算 | `ans = max(ans, gridDfs(grid, r, c, 1, 0))` |\n| 区域染色 | 入口和标记值 | 从 `(sr, sc)` 开始，`targetValue = oldColor`，`markValue = newColor` |\n| 字符网格 | 值类型 | 把 `1/0` 换成 `'1'/'0'`，骨架不变 |\n\n区域染色的新旧颜色相同会让“染色即标记”失效，需要提前返回：\n\n```cpp\nint oldColor = image[sr][sc];\nif (oldColor != newColor) {\n    gridDfs(image, sr, sc, oldColor, newColor);\n}\n```\n\n#### 易错点\n\n- 没有永久染色，导致同一连通块重复统计。\n- 面积题仍只写 `ans++`，没有使用 DFS 返回的面积。\n- 区域染色没判断新旧颜色相等。\n- 把回溯恢复逻辑写进连通块题，导致 visited 失效。\n\n### 5.2 网格多源 BFS 扩散模板\n\n#### 适用题型\n\n- 腐烂橘子。\n- 01 矩阵距离、地图最近设施距离。\n- 最短桥等“先构造源点集合，再向外扩散”的题。\n\n#### 核心思路\n\n多源 BFS 的核心是：所有源点同时作为第 0 层入队，随后一层一层向外扩散。腐烂橘子和 01 矩阵距离只在源点定义、入队标记和答案记录上不同；最短桥多了“先用 DFS 找第一座岛并作为源点”的预处理阶段，BFS 骨架仍然相同。\n\n#### 代码模板：共同骨架\n\n> **题目简述：** 本模板用于：腐烂橘子。；01 矩阵距离、地图最近设施距离。；最短桥等“先构造源点集合，再向外扩散”的题。 [994 原题 ↗](https://leetcode.cn/problems/rotting-oranges/) · [542 原题 ↗](https://leetcode.cn/problems/01-matrix/)\n\n```cpp\nint multiSourceBfsGrid(vector\u003cvector\u003cint>>& grid) {\n    int m = grid.size(), n = grid[0].size();\n    int dirs[4][2] = {{0, 1}, {0, -1}, {1, 0}, {-1, 0}};\n    queue\u003cpair\u003cint, int>> q;\n    int fresh = 0;\n\n    for (int r = 0; r \u003c m; r++) {\n        for (int c = 0; c \u003c n; c++) {\n            if (grid[r][c] == 2) {\n                q.push({r, c}); // 腐烂橘子：所有 2 是第 0 层源点。\n            } else if (grid[r][c] == 1) {\n                fresh++;\n            }\n        }\n    }\n\n    int step = 0;\n    while (!q.empty() && fresh > 0) {\n        int size = q.size();\n        for (int i = 0; i \u003c size; i++) {\n            auto [r, c] = q.front();\n            q.pop();\n\n            for (auto [dr, dc] : dirs) {\n                int nr = r + dr, nc = c + dc;\n                if (nr \u003c 0 || nr >= m || nc \u003c 0 || nc >= n || grid[nr][nc] != 1) {\n                    continue;\n                }\n                grid[nr][nc] = 2; // 入队即标记，第一次触达就是最短层数。\n                fresh--;\n                q.push({nr, nc});\n            }\n        }\n        step++;\n    }\n\n    return fresh == 0 ? step : -1;\n}\n```\n\n#### 变形点对照\n\n| 题型 | 源点初始化 | 邻居进入条件 | 入队时写什么 | 返回什么 |\n|---|---|---|---|---|\n| 腐烂橘子 | 所有 `2` 入队 | `grid[nr][nc] == 1` | `grid = 2`，`fresh--` | 分钟数或 `-1` |\n| 01 矩阵距离 | 所有 `0` 入队，`dist = 0` | `dist[nr][nc] == -1` | `dist[nr][nc] = dist[r][c] + 1` | 距离矩阵 |\n| 最短桥 | 先 DFS 标记第一座岛并全部入队 | 未访问的水或第二座岛 | 水改成已访问；遇到第二座岛返回 | 翻转的水格数 |\n\n最短桥是在 BFS 前增加“构造源点集合”的阶段：\n\n```cpp\n// 预处理变形：先 DFS 找到第一座岛，把它的所有格子标记为 2 并入队。\n// 之后沿用多源 BFS；BFS 第一次遇到仍为 1 的格子，就是第二座岛。\nif (grid[nr][nc] == 1) {\n    return step;\n}\n```\n\n#### 易错点\n\n- 多源题只放一个源点，导致层数偏大。\n- 入队时不标记，导致同一格子被重复入队。\n- 腐烂橘子按层加分钟，不能按节点加分钟。\n- 最短桥忘记先把第一座岛整座入队，导致 BFS 源点不完整。\n\n### 5.3 拓扑排序 BFS 模板\n\n#### 适用题型\n\n- 课程表。\n- 任务依赖调度。\n- 有向图判环、输出一种可行拓扑序。\n\n#### 核心思路\n\n拓扑排序把有向图中入度为 0 的节点作为“当前可执行节点”。弹出一个节点相当于删除它和它的出边，后继节点入度随之减少。如果最终弹出的节点数少于总数，剩余节点一定被环卡住。\n\n#### 代码模板\n\n> **题目简述：** 本模板用于：课程表。；任务依赖调度。；有向图判环、输出一种可行拓扑序。 [力扣原题 ↗](https://leetcode.cn/problems/course-schedule/)\n\n```cpp\nvector\u003cint> topoOrder(int n, vector\u003cvector\u003cint>>& prerequisites) {\n    vector\u003cvector\u003cint>> edges(n);\n    vector\u003cint> indeg(n, 0);\n\n    for (auto& e : prerequisites) {\n        int course = e[0], pre = e[1];\n        edges[pre].push_back(course); // pre -> course。\n        indeg[course]++;\n    }\n\n    queue\u003cint> q;\n    for (int i = 0; i \u003c n; i++) {\n        if (indeg[i] == 0) {\n            q.push(i);\n        }\n    }\n\n    vector\u003cint> order;\n    while (!q.empty()) {\n        int u = q.front();\n        q.pop();\n        order.push_back(u);\n\n        for (int v : edges[u]) {\n            if (--indeg[v] == 0) {\n                q.push(v);\n            }\n        }\n    }\n\n    if ((int)order.size() != n) {\n        return {}; // 有环，不存在完整拓扑序。\n    }\n    return order;\n}\n```\n\n#### 易错点\n\n- `[a, b]` 的方向翻译错，正确是 `b -> a`。\n- 只判断队列是否为空；拓扑结束时队列总为空，要看弹出数量。\n- 入度数组没有和邻接表方向保持一致。\n\n### 5.4 有向图 DFS 三色判环模板\n\n#### 适用题型\n\n- 课程表 DFS 写法。\n- 依赖关系是否存在环。\n- 安全节点类问题。\n\n#### 核心思路\n\nDFS 三色法关注“当前递归路径”。`0` 表示未访问，`1` 表示正在当前路径中，`2` 表示已经处理完并确认安全。遇到 `1` 就是环；遇到 `2` 可以直接复用结果。\n\n#### 代码模板\n\n代码 A：课程表判环\n\n> **题目简述：** 本模板用于：课程表 DFS 写法。；依赖关系是否存在环。；安全节点类问题。 [力扣原题 ↗](https://leetcode.cn/problems/course-schedule/)\n\n```cpp\nclass DirectedGraphCycleTemplate {\nprivate:\n    vector\u003cvector\u003cint>> edges;\n    vector\u003cint> state; // 0 未访问，1 当前路径中，2 已完成。\n\n    bool dfs(int u) {\n        // 返回值语义：从 u 出发是否不存在环。\n        if (state[u] == 1) {\n            return false;\n        }\n        if (state[u] == 2) {\n            return true;\n        }\n\n        state[u] = 1; // 进入当前递归路径。\n        for (int v : edges[u]) {\n            if (!dfs(v)) {\n                return false;\n            }\n        }\n        state[u] = 2; // 离开递归路径，且所有后继安全。\n        return true;\n    }\n\npublic:\n    bool canFinishByDfs(int n, vector\u003cvector\u003cint>>& prerequisites) {\n        edges.assign(n, {});\n        state.assign(n, 0);\n\n        for (auto& e : prerequisites) {\n            int course = e[0], pre = e[1];\n            edges[pre].push_back(course);\n        }\n\n        for (int i = 0; i \u003c n; i++) {\n            if (state[i] == 0 && !dfs(i)) {\n                return false;\n            }\n        }\n        return true;\n    }\n};\n```\n\n代码 B：最终安全节点变形\n\n> **题目简述：** 本模板用于：课程表 DFS 写法。；依赖关系是否存在环。；安全节点类问题。 [力扣原题 ↗](https://leetcode.cn/problems/course-schedule/)\n\n```cpp\nclass EventualSafeNodesTemplate {\nprivate:\n    vector\u003cint> state; // 0 未访问，1 当前路径中，2 已确认安全。\n\n    bool dfs(int u, vector\u003cvector\u003cint>>& graph) {\n        if (state[u] == 1) {\n            return false; // 回到当前路径，说明能进入环，不安全。\n        }\n        if (state[u] == 2) {\n            return true;\n        }\n\n        state[u] = 1;\n        for (int v : graph[u]) {\n            if (!dfs(v, graph)) {\n                return false;\n            }\n        }\n        state[u] = 2;\n        return true;\n    }\n\npublic:\n    vector\u003cint> eventualSafeNodes(vector\u003cvector\u003cint>>& graph) {\n        int n = graph.size();\n        state.assign(n, 0);\n        vector\u003cint> ans;\n\n        for (int i = 0; i \u003c n; i++) {\n            if (dfs(i, graph)) {\n                ans.push_back(i); // 外层收集所有 dfs(i) 为 true 的点。\n            }\n        }\n        return ans;\n    }\n};\n```\n\n#### 易错点\n\n- 用布尔 visited 无法区分“当前路径中”和“已经安全”。\n- 退出节点时忘记设为 `2`，把安全节点误判为环。\n- 发现环后继续递归，导致状态语义混乱。\n\n### 5.5 Trie 前缀树模板\n\n#### 适用题型\n\n- 实现 Trie。\n- 单词插入、完整单词查询、前缀查询。\n- 字符路径图设计题。\n\n#### 核心思路\n\nTrie 可以看作字符图：每个节点表示一个前缀状态，每条边表示追加一个字符。`insert`、`search`、`startsWith` 的遍历过程类似，区别在结束判断：完整单词必须 `isEnd == true`，前缀只要路径存在即可。\n\n#### 代码模板\n\n> **题目简述：** 本模板用于：实现 Trie。；单词插入、完整单词查询、前缀查询。；字符路径图设计题。 [力扣原题 ↗](https://leetcode.cn/problems/implement-trie-prefix-tree/)\n\n```cpp\nclass TrieNode {\npublic:\n    TrieNode* children[26]{}; \n    bool isEnd=false;           \n};\n\nclass Trie {\nprivate:\n    TrieNode* root= new TrieNode() ; \n\npublic:\n    void insert(string word) {\n        TrieNode* node = root; \n        for (char c : word) {\n            int index = c - 'a';\n            if (node->children[index] == nullptr) {\n                node->children[index] = new TrieNode();\n            }\n            node = node->children[index]; \n        }\n        node->isEnd = true; \n    }\n    \n    bool search(string word) {\n        TrieNode* node = root;\n        for (char c : word) {\n            int index = c - 'a';\n            if (node->children[index] == nullptr) {\n                return false; \n            }\n            node = node->children[index];\n        }\n        return node->isEnd; \n    }\n\n    bool startsWith(string prefix) {\n        TrieNode* node = root;\n        for (char c : prefix) {\n            int index = c - 'a';\n            if (node->children[index] == nullptr) {\n                return false;\n            }\n            node = node->children[index];\n        }\n        return true; \n    }\n};\n```\n\n#### 易错点\n\n- 把前缀存在误认为完整单词存在。\n- 插入时忘记在最后节点设置 `isEnd`。\n- 字符集不止小写字母时仍硬编码 26 个孩子，需要改成哈希表。\n\n### 5.6 网格路径回溯模板\n\n#### 适用题型\n\n- 单词搜索。\n- 棋盘或矩阵路径搜索。\n- 当前路径不能重复使用节点，但其他路径仍可使用节点的题。\n\n#### 核心思路\n\n路径搜索中的访问标记只属于当前路径。进入格子时临时标记，递归探索四个方向，成功提前返回前也要恢复；如果四个方向都失败，退出前同样恢复现场。\n\n#### 代码模板\n\n> **题目简述：** 本模板用于：单词搜索。；棋盘或矩阵路径搜索。；当前路径不能重复使用节点，但其他路径仍可使用节点的题。 [力扣原题 ↗](https://leetcode.cn/problems/word-search/)\n\n```cpp\nclass GridPathBacktrackingTemplate {\nprivate:\n    int dirs[4][2] = {{0, 1}, {0, -1}, {1, 0}, {-1, 0}};\n\n    bool dfs(vector\u003cvector\u003cchar>>& board, string& word, int r, int c, int k) {\n        // 返回值语义：从 (r,c) 出发是否能匹配 word[k...]。\n        int m = board.size(), n = board[0].size();\n        if (r \u003c 0 || r >= m || c \u003c 0 || c >= n || board[r][c] != word[k]) {\n            return false;\n        }\n        if (k == (int)word.size() - 1) {\n            return true;\n        }\n\n        char old = board[r][c];\n        board[r][c] = '#'; // 做选择：当前路径占用该格子。\n\n        for (auto [dr, dc] : dirs) {\n            if (dfs(board, word, r + dr, c + dc, k + 1)) {\n                board[r][c] = old;\n                return true;\n            }\n        }\n\n        board[r][c] = old; // 撤销现场。\n        return false;\n    }\n\npublic:\n    bool exist(vector\u003cvector\u003cchar>>& board, string word) {\n        if (board.empty() || board[0].empty()) {\n            return false;\n        }\n        for (int r = 0; r \u003c (int)board.size(); r++) {\n            for (int c = 0; c \u003c (int)board[0].size(); c++) {\n                if (dfs(board, word, r, c, 0)) {\n                    return true;\n                }\n            }\n        }\n        return false;\n    }\n};\n```\n\n#### 易错点\n\n- 把路径题当连通块题永久染色。\n- 提前成功返回前没有恢复原字符。\n- 没有用 `k` 明确表示当前匹配进度，导致递归层级混乱。\n\n## 6. 高频易错点清单\n\n| 易错点 | 典型题目 | 规避方式 |\n|---|---|---|\n| 没先翻译清楚点和边 | `207`、`208` | 先写一句“节点是什么，边是什么” |\n| 网格 DFS 忘记边界判断 | `200`、`79` | 递归入口第一行写越界和目标值判断 |\n| 访问标记时机错误 | `200`、`994` | DFS 进入时标记，BFS 入队时标记 |\n| 把路径回溯写成永久染色 | `79` | 路径搜索失败后必须恢复现场 |\n| 多源 BFS 只放了一个起点 | `994` | 初始化时把所有源点全部入队 |\n| BFS 分钟数加错 | `994` | 每处理完一层才加一分钟 |\n| 没统计剩余新鲜橘子 | `994` | 用 `fresh` 判断是否存在无法到达的死角 |\n| 课程表建图方向反了 | `207` | `[a, b]` 表示 `b -> a`，学完 b 才能学 a |\n| 拓扑排序只看队列是否为空 | `207` | 必须比较 `visitedCount == numCourses` |\n| DFS 染色忘记从 1 改成 2 | `207` | 当前路径退出前标记为已完成 |\n| Trie 把前缀当完整单词 | `208` | `search` 必须检查 `isEnd`，`startsWith` 不需要 |\n| Trie 根节点没初始化 | `208` | 构造函数或成员变量中创建 `root` |\n\n## 7. 最短复盘口诀\n\n图论题先翻译点和边。网格题用方向数组，连通块用 DFS 吃掉整块，最短时间用 BFS 按层扩散，多源题先把所有源点入队。有向依赖题先建邻接表和入度，拓扑排序看能否访问全部节点，DFS 染色看是否遇到当前路径。Trie 本质是字符路径图，`isEnd` 决定完整单词，不决定前缀是否存在。统计类可以永久标记，路径类必须回溯恢复。\n\n\n\n================================================================================\n\n# 第8部分:
