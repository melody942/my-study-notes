<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <title>Hot 100 复盘考场</title>
  <style>
    :root {
      --bg: #f5f7fb;
      --panel: #ffffff;
      --panel-soft: #f8fafc;
      --text: #172033;
      --muted: #667085;
      --line: #e5e9f0;
      --brand: #5b5ce2;
      --brand-soft: #eef0ff;
      --orange: #ff8a3d;
      --green: #16855b;
      --green-soft: #e8f7ef;
      --yellow: #a56a00;
      --yellow-soft: #fff6dc;
      --red: #c23b4a;
      --red-soft: #fff0f1;
      --surface-warm: #fffdf8;
      --surface-indigo: #f6f7ff;
      --surface-explain: #fafaff;
      --surface-code: #202638;
      --shadow: 0 14px 34px rgba(31, 41, 55, .08);
      --radius: 16px;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { overflow-x: hidden; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 14px/1.65 Inter, "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
    }
    :root[data-theme="dark"] {
      --bg: #0b1020;
      --panel: #111827;
      --panel-soft: #151e30;
      --text: #e7ecf5;
      --muted: #a8b3c5;
      --line: #2a3850;
      --brand: #a6a9ff;
      --brand-soft: #282c5b;
      --orange: #ffad70;
      --green: #5bd39a;
      --green-soft: #173c32;
      --yellow: #f2c66d;
      --yellow-soft: #493b1d;
      --red: #ff8793;
      --red-soft: #4c252e;
      --surface-warm: #241f19;
      --surface-indigo: #1c2140;
      --surface-explain: #1d203d;
      --surface-code: #080d18;
      --shadow: 0 14px 34px rgba(0, 0, 0, .28);
    }
    :root[data-theme="dark"] body { color-scheme: dark; }
    :root[data-theme="dark"] .topbar { background: rgba(11,16,32,.92); border-bottom-color: rgba(42,56,80,.8); }
    :root[data-theme="dark"] .topbar .search,
    :root[data-theme="dark"] .btn,
    :root[data-theme="dark"] .filter,
    :root[data-theme="dark"] .quiz,
    :root[data-theme="dark"] .visual-note,
    :root[data-theme="dark"] .note-panel,
    :root[data-theme="dark"] .concept,
    :root[data-theme="dark"] .related,
    :root[data-theme="dark"] textarea { background: var(--panel); color: var(--text); }
    :root[data-theme="dark"] .topbar .search { border-color: var(--line); }
    :root[data-theme="dark"] .btn.ghost { background: transparent; }
    :root[data-theme="dark"] .filter.active { background: var(--brand-soft); border-color: #555bd0; }
    :root[data-theme="dark"] .problem-statement { border-color: var(--line); background: #121a2a; }
    :root[data-theme="dark"] .quiz-q { color: #e6ebf5; }
    :root[data-theme="dark"] .answer { background: #182235; color: #c4cede; }
    :root[data-theme="dark"] .explain { border-color: #343b78; background: var(--surface-explain); }
    :root[data-theme="dark"] .problem-statement .note-copy p,
    :root[data-theme="dark"] .explain p,
    :root[data-theme="dark"] .side-card p { color: #c4cede; }
    :root[data-theme="dark"] .badge { background: #202a3b; color: #c4cede; }
    :root[data-theme="dark"] .visual-note img { background: #182235; }
    :root[data-theme="dark"] .rating button { background: var(--panel); color: var(--muted); }
    :root[data-theme="dark"] .save-hint { color: #8d9bb2; }
    :root[data-theme="dark"] .note-library { background: var(--surface-warm); border-color: #604b2a; }
    :root[data-theme="dark"] .note-panel { border-color: #604b2a; }
    :root[data-theme="dark"] .note-panel[open] summary { border-bottom-color: #443821; }
    :root[data-theme="dark"] .note-panel summary { color: #f2c66d; }
    :root[data-theme="dark"] .note-content { color: #c4cede; }
    :root[data-theme="dark"] .note-copy h5,
    :root[data-theme="dark"] .concept-block strong { color: var(--text); }
    :root[data-theme="dark"] .note-code { background: var(--surface-code); }
    :root[data-theme="dark"] .side-column { background: var(--panel-soft); }
    :root[data-theme="dark"] .recap { background: #2b211a; color: #e6c3a4; }
    :root[data-theme="dark"] .recap strong { color: #ffad70; }
    :root[data-theme="dark"] .image-modal-content { background: #111827; }
    :root[data-theme="dark"] .image-modal-close { background: #263247; color: #e7ecf5; }
    :root[data-theme="dark"] .image-modal-close:hover { background: #34435e; }
    :root[data-theme="dark"] .footer-note { color: #7f8da4; }
    button, input, textarea, select { font: inherit; }
    button { cursor: pointer; }
    a { color: var(--brand); text-decoration: none; }
    a:hover { text-decoration: underline; }
    .app { min-height: 100vh; display: grid; grid-template-columns: 286px minmax(0, 1fr); }
    .sidebar {
      position: sticky; top: 0; height: 100vh; overflow: auto;
      background: #111827; color: #e5e7eb; padding: 22px 14px 28px;
    }
    .brand { padding: 4px 10px 18px; }
    .brand h1 { font-size: 19px; margin: 0 0 4px; color: #fff; letter-spacing: .01em; }
    .brand p { margin: 0; color: #9ca3af; font-size: 12px; }
    .side-tools { display: grid; gap: 8px; margin: 0 4px 15px; }
    .side-search, .search {
      border: 1px solid rgba(255,255,255,.12); border-radius: 10px;
      background: rgba(255,255,255,.08); color: #fff; padding: 9px 11px; outline: none;
    }
    .side-search::placeholder { color: #9ca3af; }
    .side-progress { height: 6px; background: rgba(255,255,255,.12); border-radius: 20px; overflow: hidden; }
    .side-progress span { display: block; height: 100%; background: #8b8df1; width: 0; transition: width .2s; }
    .side-progress-text { display: flex; justify-content: space-between; color: #9ca3af; font-size: 11px; }
    .group { margin: 13px 0; }
    .group-title {
      display: flex; justify-content: space-between; align-items: center; width: 100%;
      color: #9ca3af; background: none; border: 0; padding: 7px 9px; text-align: left;
      font-weight: 700; font-size: 12px;
    }
    .group-title span:last-child { font-weight: 500; color: #6b7280; }
    .group-list { display: grid; gap: 2px; }
    .nav-item {
      display: flex; gap: 7px; align-items: center; width: 100%; text-align: left;
      border: 0; background: transparent; color: #d1d5db; border-radius: 8px;
      padding: 6px 8px; min-width: 0;
    }
    .nav-item:hover, .nav-item.active { background: rgba(139,141,241,.18); color: #fff; }
    .nav-home {
      display: flex; align-items: center; width: 100%; margin: 0 0 12px; padding: 10px 11px;
      border: 1px solid rgba(139,141,241,.45); border-radius: 10px; background: rgba(139,141,241,.12);
      color: #e6e7ff; text-align: left; font-weight: 700;
    }
    .nav-home:hover, .nav-home.active { background: #8b8df1; border-color: #8b8df1; color: #fff; }
    .nav-num { width: 27px; color: #6b7280; font-size: 11px; text-align: right; flex: none; }
    .nav-item.active .nav-num { color: #c7c8ff; }
    .nav-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
    .nav-mark { width: 6px; height: 6px; border-radius: 50%; background: #6b7280; flex: none; }
    .nav-mark.熟练 { background: #43bd84; }
    .nav-mark.精通 { background: #8b8df1; }
    .nav-mark.模糊 { background: #f3b34f; }
    .nav-mark.不会 { background: #e36c79; }
    .main { min-width: 0; }
    .topbar {
      position: sticky; top: 0; z-index: 5; display: flex; gap: 14px; align-items: center;
      justify-content: space-between; min-height: 66px; padding: 12px 28px;
      background: rgba(245,247,251,.92); backdrop-filter: blur(14px); border-bottom: 1px solid rgba(229,233,240,.8);
    }
    .topbar .search { background: #fff; color: var(--text); border-color: var(--line); width: min(420px, 43vw); }
    .search::placeholder { color: #98a2b3; }
    .top-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
    .btn {
      border: 1px solid var(--line); background: #fff; color: var(--text); border-radius: 9px;
      padding: 8px 11px; transition: .15s ease; white-space: nowrap;
    }
    .btn:hover { border-color: #b9bdf4; color: var(--brand); transform: translateY(-1px); }
    .btn.primary { background: var(--brand); border-color: var(--brand); color: #fff; }
    .btn.ghost { background: transparent; }
    .content { max-width: 1220px; margin: 0 auto; padding: 28px; }
    .hero {
      display: grid; grid-template-columns: minmax(0, 1.45fr) minmax(280px, .8fr); gap: 18px;
      background: linear-gradient(135deg, #20254f, #363879 62%, #6256b3); color: #fff;
      border-radius: 22px; padding: 28px 30px; box-shadow: var(--shadow); overflow: hidden; position: relative;
    }
    .hero:after { content: ""; position: absolute; width: 310px; height: 310px; border: 1px solid rgba(255,255,255,.12); border-radius: 50%; right: -90px; top: -120px; box-shadow: 0 0 0 35px rgba(255,255,255,.03), 0 0 0 70px rgba(255,255,255,.025); }
    .eyebrow { color: #cbd0ff; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; }
    .hero h2 { margin: 7px 0 8px; font-size: clamp(25px, 3vw, 38px); letter-spacing: -.03em; line-height: 1.2; }
    .hero p { margin: 0; color: #e1e3ff; max-width: 720px; }
    .hero-note { margin-top: 17px; display: flex; gap: 8px; flex-wrap: wrap; }
    .hero-note span { border: 1px solid rgba(255,255,255,.2); background: rgba(255,255,255,.08); border-radius: 999px; padding: 4px 9px; font-size: 12px; }
    .stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; align-content: center; position: relative; z-index: 1; }
    .stat { padding: 14px; border: 1px solid rgba(255,255,255,.14); border-radius: 14px; background: rgba(255,255,255,.09); }
    .stat b { display: block; font-size: 25px; line-height: 1.1; color: #fff; }
    .stat span { display: block; color: #d9dcff; font-size: 11px; margin-top: 4px; }
    .filters { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 22px 0 16px; }
    .filter {
      border: 1px solid var(--line); background: #fff; color: var(--muted); border-radius: 999px; padding: 6px 12px;
    }
    .filter.active { background: var(--brand-soft); color: var(--brand); border-color: #caccff; }
    .filter small { margin-left: 4px; color: inherit; opacity: .7; }
    .current {
      display: flex; align-items: center; justify-content: space-between; gap: 14px; margin: 0 0 13px;
      color: var(--muted); font-size: 13px;
    }
    .current strong { color: var(--text); font-size: 16px; }
    .question-card {
      background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
      box-shadow: var(--shadow); overflow: hidden;
    }
    .question-head { padding: 24px 26px 18px; border-bottom: 1px solid var(--line); }
    .crumb { color: var(--brand); font-size: 12px; margin-bottom: 9px; }
    .title-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; }
    .title-row h3 { margin: 0; font-size: 25px; line-height: 1.25; letter-spacing: -.02em; }
    .title-en { color: var(--muted); font-size: 13px; margin: 4px 0 0; }
    .badges { display: flex; gap: 7px; flex-wrap: wrap; justify-content: flex-end; }
    .badge { display: inline-flex; align-items: center; border-radius: 999px; padding: 4px 9px; font-size: 11px; background: #f1f3f7; color: #596273; white-space: nowrap; }
    .badge.easy { color: #16855b; background: var(--green-soft); }
    .badge.medium { color: #9b6700; background: var(--yellow-soft); }
    .badge.hard { color: #c23b4a; background: var(--red-soft); }
    .badge.level-不会 { color: #c23b4a; background: var(--red-soft); }
    .badge.level-模糊 { color: #9b6700; background: var(--yellow-soft); }
    .badge.level-熟练 { color: #16855b; background: var(--green-soft); }
    .badge.level-精通 { color: #5759bd; background: var(--brand-soft); }
    .recap {
      margin-top: 18px; border-left: 3px solid var(--orange); background: #fff8f1; padding: 12px 14px;
      color: #6f4b2d; border-radius: 0 10px 10px 0;
    }
    .recap strong { display: block; color: #9c5a1d; font-size: 12px; margin-bottom: 3px; }
    .session-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 16px; }
    .body-grid { display: grid; grid-template-columns: minmax(0, 1.18fr) minmax(285px, .82fr); gap: 0; }
    .main-column { padding: 23px 26px 28px; border-right: 1px solid var(--line); }
    .side-column { padding: 23px 22px 28px; background: var(--panel-soft); }
    .section-title { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 0 0 12px; }
    .section-title h4 { margin: 0; font-size: 16px; }
    .section-title small { color: var(--muted); font-weight: 400; }
    .problem-statement {
      border: 1px solid #e3e7ee; background: #fbfcfe; border-radius: 12px;
      padding: 14px 15px; margin-bottom: 17px;
    }
    .problem-panel summary { cursor: pointer; color: var(--text); font-weight: 700; font-size: 15px; }
    .problem-panel summary::after { content: "点击展开完整题面"; float: right; color: var(--muted); font-size: 11px; font-weight: 400; }
    .problem-panel[open] summary { padding-bottom: 8px; border-bottom: 1px solid var(--line); }
    .problem-panel[open] summary::after { content: "点击收起"; }
    .problem-panel .note-copy { padding-top: 10px; }
    .problem-statement .note-copy p { margin: 0 0 7px; color: #4d596d; }
    .problem-statement .note-copy p:last-child { margin-bottom: 0; }
    .quiz-list { display: grid; gap: 10px; }
    .quiz {
      border: 1px solid var(--line); border-radius: 12px; padding: 13px 14px; background: #fff;
    }
    .quiz-q { display: flex; gap: 9px; align-items: flex-start; font-weight: 700; color: #293247; }
    .q-index { width: 23px; height: 23px; display: grid; place-items: center; border-radius: 7px; color: var(--brand); background: var(--brand-soft); font-size: 12px; flex: none; }
    .answer-toggle { margin: 10px 0 0 32px; color: var(--brand); font-size: 12px; cursor: pointer; user-select: none; }
    .answer { display: none; margin: 9px 0 0 32px; padding: 10px 12px; background: #f8fafc; border-radius: 9px; color: #475467; }
    .quiz.open .answer { display: block; }
    .answer b { color: var(--text); }
    .code-block { margin: 8px 0 0; padding: 9px 11px; border-radius: 8px; background: #202638; color: #d8e2ff; overflow: auto; font: 12px/1.55 ui-monospace, SFMono-Regular, Consolas, monospace; white-space: pre-wrap; }
    .explain {
      border: 1px solid #e2e4ff; background: #fafaff; border-radius: 12px; padding: 14px; margin-top: 17px;
    }
    .explain p { margin: 5px 0; color: #475467; }
    .explain strong { color: #4447a5; }
    .concept-block + .concept-block { margin-top: 11px; padding-top: 11px; border-top: 1px solid var(--line); }
    .concept-block strong { display: block; color: var(--text); margin-bottom: 3px; }
    .visual-notes { display: grid; gap: 11px; }
    .visual-note { display: block; width: 100%; border: 1px solid var(--line); background: #fff; border-radius: 10px; padding: 9px; text-align: left; cursor: zoom-in; }
    .visual-note:hover { border-color: #989bf0; box-shadow: 0 5px 16px rgba(91,92,226,.12); }
    .visual-note img { display: block; width: 100%; height: auto; max-height: 330px; object-fit: contain; border-radius: 7px; background: #f8fafc; }
    .visual-note p { margin: 6px 2px 0; color: var(--muted); font-size: 11px; }
    .visual-note-hint { display: block; margin: 5px 2px 0; color: var(--brand); font-size: 11px; }
    .note-library { background: #fffdf8; border-color: #f0dfbd; }
    .note-library .section-title { margin-bottom: 9px; }
    .note-panel { border: 1px solid #eadfca; border-radius: 10px; background: #fff; margin-top: 9px; overflow: hidden; }
    .note-panel summary { cursor: pointer; padding: 10px 12px; color: #7b551d; font-weight: 700; font-size: 13px; }
    .note-panel[open] summary { border-bottom: 1px solid #f1e8d8; }
    .note-content { padding: 10px 12px 12px; color: #4d596d; }
    .note-copy p { margin: 0 0 7px; white-space: pre-wrap; }
    .note-copy h5 { margin: 10px 0 6px; color: var(--text); font-size: 13px; }
    .note-bullet { margin: 4px 0; line-height: 1.55; }
    .note-gap { height: 4px; }
    .note-code { margin: 0; padding: 11px 12px; border-radius: 8px; background: #202638; color: #d8e2ff; overflow: auto; font: 12px/1.6 ui-monospace, SFMono-Regular, Consolas, monospace; white-space: pre; tab-size: 4; }
    .note-code code { display: block; min-width: max-content; font: inherit; }
    .note-code .code-comment { color: #7f8da8; }
    .note-code .code-keyword { color: #c792ea; }
    .note-code .code-type { color: #82aaff; }
    .note-code .code-string { color: #c3e88d; }
    .note-code .code-number { color: #f78c6c; }
    .note-code .code-preprocessor { color: #89ddff; }
    .note-label { margin: 0 0 6px; color: #9c6b23; font-size: 12px; font-weight: 700; }
    .image-modal { position: fixed; inset: 0; z-index: 50; display: none; padding: 24px; }
    .image-modal.open { display: grid; place-items: center; }
    .image-modal-backdrop { position: absolute; inset: 0; background: rgba(15, 23, 42, .78); }
    .image-modal-content { position: relative; z-index: 1; max-width: min(1200px, 96vw); max-height: 94vh; padding: 12px; border-radius: 14px; background: #fff; box-shadow: 0 20px 70px rgba(0,0,0,.35); }
    .image-modal-content img { display: block; max-width: 92vw; max-height: 84vh; width: auto; height: auto; object-fit: contain; }
    .image-modal-content p { margin: 8px 34px 0 2px; color: var(--muted); font-size: 12px; }
    .image-modal-close { position: absolute; top: 7px; right: 8px; width: 28px; height: 28px; border: 0; border-radius: 50%; background: #eef1f6; color: #475467; cursor: pointer; font-size: 20px; line-height: 1; }
    .image-modal-close:hover { background: #dfe4ed; }
    details summary { cursor: pointer; color: var(--brand); font-size: 12px; margin-top: 6px; }
    .notes-area { margin-top: 20px; }
    textarea {
      width: 100%; resize: vertical; min-height: 110px; border: 1px solid var(--line); border-radius: 10px;
      padding: 11px; background: #fff; color: var(--text); outline: none;
    }
    textarea:focus, input:focus, select:focus { border-color: #989bf0; box-shadow: 0 0 0 3px rgba(91,92,226,.1); }
    .save-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: 8px; }
    .save-hint { color: var(--muted); font-size: 11px; }
    .side-card { margin-bottom: 19px; }
    .side-card h4 { margin: 0 0 9px; font-size: 14px; }
    .side-card p { margin: 0; color: var(--muted); }
    .concept { padding: 12px 13px; background: #fff; border: 1px solid var(--line); border-radius: 10px; color: #4d596d; }
    .concept strong { display: block; color: var(--text); margin-bottom: 4px; }
    .related-list { display: grid; gap: 9px; }
    .related {
      background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 11px 12px;
    }
    .related-title { display: flex; justify-content: space-between; gap: 8px; }
    .related-title a { font-weight: 700; }
    .related p { margin-top: 4px; font-size: 12px; color: var(--muted); }
    .source { color: #98a2b3; font-size: 10px; margin-top: 4px; }
    .rating {
      display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 9px;
    }
    .rating button { border: 1px solid var(--line); background: #fff; border-radius: 8px; padding: 7px 4px; font-size: 11px; color: var(--muted); }
    .rating button:hover, .rating button.selected { border-color: var(--brand); color: var(--brand); background: var(--brand-soft); }
    .footer-note { color: #98a2b3; font-size: 11px; margin: 21px 0 5px; text-align: center; }
    .empty { padding: 34px; text-align: center; color: var(--muted); background: #fff; border: 1px dashed var(--line); border-radius: 14px; }
    .acm-guide {
      margin: 0 0 18px; border: 1px solid #cfd5ff; border-radius: 16px;
      background: linear-gradient(135deg, #f8f9ff, #fff); box-shadow: var(--shadow); overflow: hidden;
    }
    .acm-guide summary { cursor: pointer; list-style: none; padding: 16px 18px; color: #4447a5; font-size: 17px; font-weight: 800; }
    .acm-guide summary::-webkit-details-marker { display: none; }
    .acm-guide summary::after { content: "展开"; float: right; color: var(--muted); font-size: 12px; font-weight: 500; }
    .acm-guide[open] summary { border-bottom: 1px solid #e2e4ff; }
    .acm-guide[open] summary::after { content: "收起"; }
    .acm-content { padding: 0 18px 18px; color: #475467; }
    .acm-lead { margin: 14px 0; padding: 10px 12px; border-left: 3px solid var(--brand); border-radius: 0 9px 9px 0; background: var(--brand-soft); }
    .acm-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
    .acm-card { min-width: 0; padding: 13px; border: 1px solid var(--line); border-radius: 11px; background: var(--panel); }
    .acm-card h5 { margin: 0 0 7px; color: var(--text); font-size: 14px; }
    .acm-card p { margin: 5px 0; }
    .acm-card ul { margin: 6px 0 0; padding-left: 19px; }
    .acm-card li { margin: 3px 0; }

        <template id="acmGuideTemplate"><details class="acm-guide" open>
          <summary>ACM 模式输入输出速查：把力扣核心代码改成完整程序</summary>
          <div class="acm-content">
            <div class="acm-lead"><strong>核心区别：</strong>力扣给你函数参数和返回值；ACM/笔试通常要求你自己从标准输入读数据、自己组织答案并输出。算法主体大多不变，新增的是“读入格式 → 数据结构 → 算法 → 输出格式”。</div>
            <div class="acm-grid">
              <section class="acm-card">
                <h5>0. 通用 C++ 主函数模板</h5>
                <p>先把这几行写熟：关闭同步提高输入速度，<code>cin.tie(nullptr)</code> 避免不必要的刷新。</p>
                <pre class="acm-code">#include &lt;bits/stdc++.h&gt;
using namespace std;

int main() {
    ios::sync_with_stdio(false);
    cin.tie(nullptr);
    // 读入 → 算法 → 输出
    return 0;
}</pre>
              </section>
              <section class="acm-card">
                <h5>1. 固定数量的数组 / 数字</h5>
                <p>对应两数之和、三数之和、股票、跳跃游戏、DP 等。先读 n，再读 n 个元素；题目给 target 就继续读 target。</p>
                <pre class="acm-code">int n;
cin &gt;&gt; n;
vector&lt;int&gt; nums(n);
for (int &amp;x : nums) cin &gt;&gt; x;
int target;
cin &gt;&gt; target;</pre>
              </section>
              <section class="acm-card">
                <h5>2. 不知道长度：读到 EOF</h5>
                <p>题目没有 n，或者明确“多组数据直到文件结束”时，用 while (cin &gt;&gt; x)。不要把 EOF 当成一个数据。</p>
                <pre class="acm-code">int x;
while (cin &gt;&gt; x) {
    // 处理一个输入
}</pre>
              </section>
              <section class="acm-card">
                <h5>3. 多组测试用例</h5>
                <p>常见格式是第一行 T，后面每组独立读入。每一组都要清空 vector、map、答案和 visited。</p>
                <pre class="acm-code">int T;
cin &gt;&gt; T;
while (T--) {
    int n;
    cin &gt;&gt; n;
    // 本组输入、计算、输出
}</pre>
              </section>
              <section class="acm-card">
                <h5>4. 字符串：token 与整行</h5>
                <p><code>cin &gt;&gt; s</code> 读不含空格的字符串；需要保留空格时用 <code>getline</code>。数字读完后先吸收换行。</p>
                <pre class="acm-code">int n;
cin &gt;&gt; n;
cin.ignore(numeric_limits&lt;streamsize&gt;::max(), '\n');
string s;
getline(cin, s);</pre>
              </section>
              <section class="acm-card">
                <h5>5. 矩阵 / 网格</h5>
                <p>对应矩阵置零、螺旋矩阵、旋转图像、岛屿、网格 DP。先读 m、n，再双重循环；边界和下标从 0 开始。</p>
                <pre class="acm-code">int m, n;
cin &gt;&gt; m &gt;&gt; n;
vector&lt;vector&lt;int&gt;&gt; a(m, vector&lt;int&gt;(n));
for (auto &amp;row : a)
    for (int &amp;x : row) cin &gt;&gt; x;</pre>
              </section>
              <section class="acm-card">
                <h5>6. 图：点数、边数、边列表</h5>
                <p>对应课程表、图论遍历。通常读 n、m，再读 m 条边；无向图加双向，有向图只加一向。题目若给 1 到 n，要转成 0 到 n-1。</p>
                <pre class="acm-code">int n, m;
cin &gt;&gt; n &gt;&gt; m;
vector&lt;vector&lt;int&gt;&gt; g(n);
while (m--) {
    int u, v;
    cin &gt;&gt; u &gt;&gt; v;
    --u; --v;
    g[u].push_back(v);
}</pre>
              </section>
              <section class="acm-card">
                <h5>7. 树与链表：先把“结构”读出来</h5>
                <p>力扣的 <code>TreeNode*</code>、<code>ListNode*</code> 不会自动出现。ACM 中常见做法是读数组/层序序列，或读 n 条父子边；先建结构，再复用遍历、递归和 DP。</p>
                <ul><li>链表：读 n 和 n 个值，用尾插建节点。</li><li>树：读 n 条 <code>parent child direction</code>，或读带 <code>null</code> 的层序数组。</li><li>只考数组性质时，不必强行建节点，直接用 vector 更稳。</li></ul>
              </section>
              <section class="acm-card">
                <h5>8. 输出也要匹配题目</h5>
                <ul><li>一个数：<code>cout &lt;&lt; ans &lt;&lt; '\n';</code></li><li>数组：循环输出，控制空格，不要输出题面里的 <code>[ ]</code>，除非题目明确要求。</li><li>二维答案：外层换行，内层按题目规定分隔。</li><li>布尔值：确认输出 <code>true/false</code> 还是 <code>YES/NO</code>。</li><li>多组数据：通常每组一行，必要时输出 <code>Case #i:</code>。</li></ul>
              </section>
            </div>
            <div class="acm-checklist"><span>① 先确认输入有无 T、n、m</span><span>② 再确认数字 / token / 整行</span><span>③ 最后确认空格、换行、YES/NO</span></div>
          </div>

    const NOTE_DETAILS = {"3sum":{"problem":"给你一个整数数组 nums ，判断是否存在三元组 [nums[i], nums[j], nums[k]] 满足 i != j、i != k 且 j != k ，同时还满足 nums[i] + nums[j] + nums[k] == 0 。请你返回所有和为 0 且不重复的三元组。\n\n注意：答案中不可以包含重复的三元组。\n\n示例 1：\n\n输入：nums = [-1,0,1,2,-1,-4]\n输出：[[-1,-1,2],[-1,0,1]]\n解释：\nnums[0] + nums[1] + nums[2] = (-1) + 0 + 1 = 0 。\nnums[1] + nums[2] + nums[4] = 0 + 1 + (-1) = 0 。\nnums[0] + nums[3] + nums[4] = (-1) + 2 + (-1) = 0 。\n不同的三元组是 [-1,0,1] 和 [-1,-1,2] 。\n注意，输出的顺序和三元组的顺序并不重要。\n\n示例 2：\n\n输入：nums = [0,1,1]\n输出：[]\n解释：唯一可能的三元组和不为 0 。\n\n示例 3：\n\n输入：nums = [0,0,0]\n输出：[[0,0,0]]\n解释：唯一可能的三元组和为 0 。\n\n提示：\n• 3 \u003c= nums.length \u003c= 3000\n• -10^5 \u003c= nums[i] \u003c= 10^5","solution":"## 题目理解\n-\n\n## 思路\n-我们可以固定一个数 nums[i]。剩下的问题就变成了：在剩下的数组中，寻找两个数，使得它们的和等于 -nums[i]。这实际上转化为了“两数之和”的变体。\n-务必要先排序，不然没有顺序，无法进行去重操作，本题最难的在去重。\n-去重分为两部分，首先是固定的首位数不能重复，即if (i \u003e 0 \u0026\u0026 nums[i] == nums[i - 1]) continue，当过一次首位的就不用再尝试了。\n-然后是左右指针指向数字的去重，逻辑一样，同样的数字就跳过，即\nwhile (left\u003cright \u0026\u0026 nums[right]==nums[right-1]) right--;\n while (left\u003cright \u0026\u0026 nums[left]==nums[left+1]) left++;\n\n## 要点\n-\n\n## 复杂度\n- 时间复杂度：\n- 空间复杂度：\n\n## 易错点\n-","review":"• 2026-09-13 复习记录：\n• 卡点：       if(i\u003e0\u0026\u0026nums[i]==nums[i-1]) continue;写成while了\n• 修正：\n• 下次重点：只记得去重的lr+-了，不记得本身就要默认的+-！\n\n2026-10-04 复习记录：\n- 卡点：l 和 r 必须每次 i 重新设置！！定义的位置在for循环里\n- 修正：\n- 下次重点：","cpp":"```cpp\nclass Solution {\npublic:\n    vector\u003cvector\u003cint\u003e\u003e threeSum(vector\u003cint\u003e\u0026 nums) {\n        vector\u003cvector\u003cint\u003e\u003e res;\n        sort(nums.begin(),nums.end());\n        for(int i=0;i\u003cnums.size();i++){\n            if (nums[i]\u003e0) return res;\n            if(i\u003e0\u0026\u0026nums[i]==nums[i-1]) continue;\n            int left=i+1,right=nums.size()-1;\n            while(left\u003cright){\n                if(nums[i]+nums[left]+nums[right]\u003e0) right--;\n                else if(nums[i]+nums[left]+nums[right]\u003c0) left++;\n                else {\n                    res.push_back(vector\u003cint\u003e {nums[i],nums[left],nums[right]});\n                    while (left\u003cright \u0026\u0026 nums[right]==nums[right-1]) right--;\n                    while (left\u003cright \u0026\u0026 nums[left]==nums[left+1]) left++;\n                left++;\n                right--;\n                }\n            }\n        }\n        return res;\n    }\n};\n```","python":"```python\nclass Solution:\n    def threeSum(self, nums: list[int]) -\u003e list[list[int]]:\n```"},"add-two-numbers":{"problem":"给你两个 非空 的链表，表示两个非负的整数。它们每位数字都是按照 逆序 的方式存储的，并且每个节点只能存储 一位 数字。\n\n请你将两个数相加，并以相同形式返回一个表示和的链表。\n\n你可以假设除了数字 0 之外，这两个数都不会以 0 开头。\n\n示例 1：\n\n输入：l1 = [2,4,3], l2 = [5,6,4]\n输出：[7,0,8]\n解释：342 + 465 = 807.\n\n示例 2：\n\n输入：l1 = [0], l2 = [0]\n输出：[0]\n\n示例 3：\n\n输入：l1 = [9,9,9,9,9,9,9], l2 = [9,9,9,9]\n输出：[8,9,9,9,0,0,0,1]\n\n提示：\n• 每个链表中的节点数在范围 [1, 100] 内\n• 0 \u003c= Node.val \u003c= 9\n• 题目数据保证列表表示的数字不含前导零","solution":"## 题目理解\n-\n\n## 思路\n-就一直加呗\n-其中一个没了咋办？\n-什么时候停止所有循环？两个都没了就停止了吗？\n-不是！如果进位出新的，那么就还要继续。\n\n## 要点\n-怎么新建链表的节点？new ListNode(val)\n\n## 复杂度\n- 时间复杂度：\n- 空间复杂度：\n\n## 易错点\n-","review":"• 2026-09-15 复习记录：\n• 卡点：记得该怎么做，实际上写不出来，必须自己再写\n• 修正：\n• 下次重点：","cpp":"```cpp\n/**\n * Definition for singly-linked list.\n * struct ListNode {\n *     int val;\n *     ListNode *next;\n *     ListNode() : val(0), next(nullptr) {}\n *     ListNode(int x) : val(x), next(nullptr) {}\n *     ListNode(int x, ListNode *next) : val(x), next(next) {}\n * };\n */\nclass Solution {\npublic:\n    ListNode* addTwoNumbers(ListNode* l1, ListNode* l2) {\n        ListNode dummy(-1,l1);\n        ListNode* cur=\u0026dummy;\n        int carry=0;\n        while(l1||l2||carry){\n            int sum=carry;\n            if(l1){\n                sum+=l1-\u003eval;\n                l1=l1-\u003enext;\n            }\n            if(l2){\n                sum+=l2-\u003eval;\n                l2=l2-\u003enext;\n            }\n            carry=sum/10;\n            cur-\u003enext=new ListNode(sum%10);\n            cur=cur-\u003enext;\n        }\n        return dummy.next;\n    }\n};\n```","python":"```python\n# Definition for singly-linked list.\n# class ListNode:\n#     def __init__(self, val=0, next=None):\n#         self.val = val\n#         self.next = next\nclass Solution:\n    def addTwoNumbers(self, l1: Optional[ListNode], l2: Optional[ListNode]) -\u003e Optional[ListNode]:\n```"},"best-time-to-buy-and-sell-stock":{"problem":"给定一个数组 prices ，它的第 i 个元素 prices[i] 表示一支给定股票第 i 天的价格。\n\n你只能选择 某一天 买入这只股票，并选择在 未来的某一个不同的日子 卖出该股票。设计一个算法来计算你所能获取的最大利润。\n\n返回你可以从这笔交易中获取的最大利润。如果你不能获取任何利润，返回 0 。\n\n示例 1：\n\n输入：[7,1,5,3,6,4]\n输出：5\n解释：在第 2 天（股票价格 = 1）的时候买入，在第 5 天（股票价格 = 6）的时候卖出，最大利润 = 6-1 = 5 。\n注意利润不能是 7-1 = 6, 因为卖出价格需要大于买入价格；同时，你不能在买入前卖出股票。\n\n示例 2：\n\n输入：prices = [7,6,4,3,1]\n输出：0\n解释：在这种情况下, 没有交易完成, 所以最大利润为 0。\n\n提示：\n• 1 \u003c= prices.length \u003c= 10^5\n• 0 \u003c= prices[i] \u003c= 10^4","solution":"## 题目理解\n-\n\n## 思路\n-贪心的思路，对于每一天，减去之前最少的一天即可 ，因为只交易一次。\n\n## 要点\n-\n\n## 复杂度\n- 时间复杂度：\n- 空间复杂度：\n\n## 易错点\n-","review":"-\n\n2026-09-28 复习记录：\n- 卡点：贪心秒了\n- 修正：\n- 下次重点：","cpp":"```cpp\nclass Solution {\npublic:\n    int maxProfit(vector\u003cint\u003e\u0026 prices) {\n        int minprice=INT_MAX,res=INT_MIN;\n        for(int x:prices){\n            minprice=min(x,minprice);\n            res=max(res,x-minprice);\n        }\n        return res==INT_MIN?0:res;\n    }\n};\n```","python":"```python\nclass Solution:\n    def maxProfit(self, prices: List[int]) -\u003e int:\n```"},"binary-tree-inorder-traversal":{"problem":"给定一个二叉树的根节点 root ，返回 *它的 中序 遍历* 。\n\n示例 1：\n\n输入：root = [1,null,2,3]\n输出：[1,3,2]\n\n示例 2：\n\n输入：root = []\n输出：[]\n\n示例 3：\n\n输入：root = [1]\n输出：[1]\n\n提示：\n• 树中节点数目在范围 [0, 100] 内\n• -100 \u003c= Node.val \u003c= 100\n\n进阶: 递归算法很简单，你可以通过迭代算法完成吗？","solution":"## 题目理解\n-\n\n## 思路\n-最简单的递归\n\n## 要点\n-\n\n## 复杂度\n- 时间复杂度：\n- 空间复杂度：\n\n## 易错点\n-","review":"-\n\n2026-10-06 复习记录：\n- 卡点：最简单的递归\n- 修正：\n- 下次重点：","cpp":"```cpp\n/**\n * Definition for a binary tree node.\n * struct TreeNode {\n *     int val;\n *     TreeNode *left;\n *     TreeNode *right;\n *     TreeNode() : val(0), left(nullptr), right(nullptr) {}\n *     TreeNode(int x) : val(x), left(nullptr), right(nullptr) {}\n *     TreeNode(int x, TreeNode *left, TreeNode *right) : val(x), left(left), right(right) {}\n * };\n */\nclass Solution {\npublic:\n    void inorder(TreeNode *root, vector\u003cint\u003e \u0026res) {\n        if (root == nullptr) {\n            return;\n        }\n\n        inorder(root-\u003eleft, res);\n                res.push_back(root-\u003eval);\n        inorder(root-\u003eright, res);\n    }\n    vector\u003cint\u003e inorderTraversal(TreeNode* root) {\n                vector\u003cint\u003e res;\n        inorder(root, res);\n        return res;\n    }\n};\n```","python":"```python\n# Definition for a binary tree node.\n# class TreeNode:\n#     def __init__(self, val=0, left=None, right=None):\n#         self.val = val\n#         self.left = left\n#         self.right = right\nclass Solution:\n    def inorderTraversal(self, root: Optional[TreeNode]) -\u003e List[int]:\n```"},"binary-tree-level-order-traversal":{"problem":"给你二叉树的根节点 root ，返回其节点值的 层序遍历 。 （即逐层地，从左到右访问所有节点）。\n\n示例 1：\n\n输入：root = [3,9,20,null,null,15,7]\n输出：[[3],[9,20],[15,7]]\n\n示例 2：\n\n输入：root = [1]\n输出：[[1]]\n\n示例 3：\n\n输入：root = []\n输出：[]\n\n提示：\n• 树中节点数目在范围 [0, 2000] 内\n• -1000 \u003c= Node.val \u003c= 1000","solution":"## 题目理解\n-\n\n## 思路\n-显然能够意识到是BFS，但是这个流程容易忘，多想想\n-需要一个节点类型的队列，while不为空，记录该层size数量，for循环该层。本题中要记录下每层的节点。\n-一个易错点是，定义好队列后要初始化，q.push(root)\n\n## 要点\n-\n\n## 复杂度\n- 时间复杂度：\n- 空间复杂度：\n\n## 易错点\n-","review":"-\n\n2026-10-06 复习记录：\n- 卡点：怎么说呢，总体上都能写出来，但是各种小bug\n- 修正：用queue而非stack，判空··· \n- 下次重点：","cpp":"```cpp\n/**\n * Definition for a binary tree node.\n * struct TreeNode {\n *     int val;\n *     TreeNode *left;\n *     TreeNode *right;\n *     TreeNode() : val(0), left(nullptr), right(nullptr) {}\n *     TreeNode(int x) : val(x), left(nullptr), right(nullptr) {}\n *     TreeNode(int x, TreeNode *left, TreeNode *right) : val(x), left(left), right(right) {}\n * };\n */\nclass Solution {\npublic:\n    vector\u003cvector\u003cint\u003e\u003e levelOrder(TreeNode* root) {\n        vector\u003cvector\u003cint\u003e\u003e res;\n        if(!root) return res;\n        queue\u003cTreeNode*\u003e q;\n        q.push(root);\n        while(!q.empty()){\n            int length=q.size();\n            vector\u003cint\u003e path;\n            for(int i=0;i\u003clength;i++){\n                TreeNode* node=q.front();\n                q.pop();\n                path.push_back(node-\u003eval);\n                if(node-\u003eleft) q.push(node-\u003eleft);\n                if(node-\u003eright) q.push(node-\u003eright);\n            }\n            res.push_back(path);\n        }\n        return res;\n    }\n};\n```","python":"```python\n# Definition for a binary tree node.\n# class TreeNode:\n#     def __init__(self, val=0, left=None, right=None):\n#         self.val = val\n#         self.left = left\n#         self.right = right\nclass Solution:\n    def levelOrder(self, root: Optional[TreeNode]) -\u003e List[List[int]]:\n```"},"binary-tree-maximum-path-sum":{"problem":"二叉树中的 路径 被定义为一条节点序列，序列中每对相邻节点之间都存在一条边。同一个节点在一条路径序列中 至多出现一次 。该路径 至少包含一个 节点，且不一定经过根节点。\n\n路径和 是路径中各节点值的总和。\n\n给你一个二叉树的根节点 root ，返回其 最大路径和 。\n\n示例 1：\n\n输入：root = [1,2,3]\n输出：6\n解释：最优路径是 2 -\u003e 1 -\u003e 3 ，路径和为 2 + 1 + 3 = 6\n\n示例 2：\n\n输入：root = [-10,9,20,null,null,15,7]\n输出：42\n解释：最优路径是 15 -\u003e 20 -\u003e 7 ，路径和为 15 + 20 + 7 = 42\n\n提示：\n• 树中节点数目范围是 [1, 3 * 10^4]\n• -1000 \u003c= Node.val \u003c= 1000","solution":"## 题目理解\n-\n\n## 思路\n-本题其实和二叉树的直径是一个思路，如果记得那道题，这个就不难\n-即在本节点偷偷找最大值，val+left+right，而return的是max（left，right）+val\n\n## 要点\n-\n\n## 复杂度\n- 时间复杂度：\n- 空间复杂度：\n\n## 易错点\n-","review":"• 2026-10-06 复习记录：\n• 卡点：啊 这道题完全知道怎么写基本能写对，但是忘了l和r要：\nmax（0，dfs（~））即要和0比一比\n• 修正：\n• 下次重点：","cpp":"```cpp\n/**\n * Definition for a binary tree node.\n * struct TreeNode {\n *     int val;\n *     TreeNode *left;\n *     TreeNode *right;\n *     TreeNode() : val(0), left(nullptr), right(nullptr) {}\n *     TreeNode(int x) : val(x), left(nullptr), right(nullptr) {}\n *     TreeNode(int x, TreeNode *left, TreeNode *right) : val(x), left(left), right(right) {}\n * };\n */\nclass Solution {\nprivate:\n    int maxSum = INT_MIN;\npublic:\n    int maxPathSum(TreeNode* root) {\n        dfs(root);\n        return maxSum;\n    }\n    int dfs(TreeNode* node) {\n        if (node == nullptr) return 0;\n        int leftGain = max(0,dfs(node-\u003eleft));\n        int rightGain = max(0, dfs(node-\u003eright));\n        int currentPathSum = node-\u003eval + leftGain + rightGain;\n        maxSum = max(maxSum, currentPathSum);\n        return node-\u003eval + max(leftGain, rightGain);\n    }\n};\n```","python":"```python\n# Definition for a binary tree node.\n# class TreeNode:\n#     def __init__(self, val=0, left=None, right=None):\n#         self.val = val\n#         self.left = left\n#         self.right = right\nclass Solution:\n    def maxPathSum(self, root: Optional[TreeNode]) -\u003e int:\n```"},"binary-tree-right-side-view":{"problem":"给定一个二叉树的 根节点 root，想象自己站在它的右侧，按照从顶部到底部的顺序，返回从右侧所能看到的节点值。\n\n示例 1：\n\n输入：root = [1,2,3,null,5,null,4]\n\n输出：[1,3,4]\n\n解释：\n\n示例 2：\n\n输入：root = [1,2,3,4,null,null,null,5]\n\n输出：[1,3,4,5]\n\n解释：\n\n示例 3：\n\n输入：root = [1,null,3]\n\n输出：[1,3]\n\n示例 4：\n\n输入：root = []\n\n输出：[]\n\n提示:\n• 二叉树的节点个数的范围是 [0,100]\n• -100 \u003c= Node.val \u003c= 100","solution":"## 题目理解\n-\n\n## 思路\n-符合正常思路的肯定是BFS，完全套用BFS的模板代码，何时记录结果？每次进入while循环，肯定是完整的一层！，直接res.push_back(q.back()-\u003eval)即可\n-其实也可以使用DFS，先递归右，再递归左，当第一次遇到某一层时，该值就是结果，所以需要想，如何确认第一次到某一层？  记录深度变量即可。\n-depth==res.size() 用来判断，可以说是神来之笔\n\n## 要点\n-\n\n## 复杂度\n- 时间复杂度：\n- 空间复杂度：\n\n## 易错点\n-","review":"-\n\n2026-10-06 复习记录：\n- 卡点：BFS秒了，DFS不太记得了\n- 修正：\n- 下次重点：","cpp":"```cpp\n/**\n * Definition for a binary tree node.\n * struct TreeNode {\n *     int val;\n *     TreeNode *left;\n *     TreeNode *right;\n *     TreeNode() : val(0), left(nullptr), right(nullptr) {}\n *     TreeNode(int x) : val(x), left(nullptr), right(nullptr) {}\n *     TreeNode(int x, TreeNode *left, TreeNode *right) : val(x), left(left), right(right) {}\n * };\n */\nclass Solution {\npublic:\n    void dfs(TreeNode* root,int depth,vector\u003cint\u003e\u0026 res){\n        if(!root) return;\n        if(depth==res.size()) res.push_back(root-\u003eval);\n        dfs(root-\u003eright,depth+1,res);\n        dfs(root-\u003eleft,depth+1,res);\n    }\n\n    vector\u003cint\u003e rightSideView(TreeNode* root) {\n        vector\u003cint\u003e res;\n        dfs(root,0,res);\n        return res;\n    }\n};\n//## BFS\n/**\n * Definition for a binary tree node.\n * struct TreeNode {\n *     int val;\n *     TreeNode *left;\n *     TreeNode *right;\n *     TreeNode() : val(0), left(nullptr), right(nullptr) {}\n *     TreeNode(int x) : val(x), left(nullptr), right(nullptr) {}\n *     TreeNode(int x, TreeNode *left, TreeNode *right) : val(x), left(left), right(right) {}\n * };\n */\nclass Solution {\npublic:\n    vector\u003cint\u003e rightSideView(TreeNode* root) {\n        vector\u003cint\u003e res;\n        if (!root) return res;\n        queue\u003cTreeNode*\u003e q;\n        q.push(root);\n        while(!q.empty()){\n            int length=q.size();\n            res.push_back(q.back()-\u003eval);\n            for(int i=0;i\u003clength;i++){\n                TreeNode* root = q.front();\n                q.pop();\n                if(root-\u003eleft) q.push(root-\u003eleft);\n                if(root-\u003eright) q.push(root-\u003eright);\n            }\n        }\n        return res;\n    }\n};\n```","python":"```python\n# Definition for a binary tree node.\n# class TreeNode:\n#     def __init__(self, val=0, left=None, right=None):\n#         self.val = val\n#         self.left = left\n#         self.right = right\nclass Solution:\n    def rightSideView(self, root: Optional[TreeNode]) -\u003e List[int]:\n```"},"climbing-stairs":{"problem":"假设你正在爬楼梯。需要 n 阶你才能到达楼顶。\n\n每次你可以爬 1 或 2 个台阶。你有多少种不同的方法可以爬到楼顶呢？\n\n示例 1：\n\n输入：n = 2\n输出：2\n解释：有两种方法可以爬到楼顶。\n1. 1 阶 + 1 阶\n2. 2 阶\n\n示例 2：\n\n输入：n = 3\n输出：3\n解释：有三种方法可以爬到楼顶。\n1. 1 阶 + 1 阶 + 1 阶\n2. 1 阶 + 2 阶\n3. 2 阶 + 1 阶\n\n提示：\n• 1 \u003c= n \u003c= 45","solution":"## 题目理解\n-\n\n## 思路\n-动态规划，几个重要的点。确认dp定义，找到状态转移方程，定义初始值，for循环确认边界。\n\n## 要点\n-\n\n## 复杂度\n- 时间复杂度：\n- 空间复杂度：\n\n## 易错点\n-","review":"-\n\n2026-10-03 复习记录：\n- 卡点：能写对也懂\n- 修正：\n- 下次重点：","cpp":"```cpp\nclass Solution {\npublic:\n    int climbStairs(int n) {\n        int prev1=1,prev2=1,res=1;\n        for(int i=2;i\u003c=n;i++){\n        res=prev1+prev2;\n        prev2=prev1;\n        prev1=res;\n        }\n    return res;\n    }\n};\n```","python":"```python\nclass Solution:\n    def climbStairs(self, n: int) -\u003e int:\n```"},"coin-change":{"problem":"给你一个整数数组 coins ，表示不同面额的硬币；以及一个整数 amount ，表示总金额。\n\n计算并返回可以凑成总金额所需的 最少的硬币个数 。如果没有任何一种硬币组合能组成总金额，返回 -1 。\n\n你可以认为每种硬币的数量是无限的。\n\n示例 1：\n\n输入：coins = [1, 2, 5], amount = 11\n输出：3\n解释：11 = 5 + 5 + 1\n\n示例 2：\n\n输入：coins = [2], amount = 3\n输出：-1\n\n示例 3：\n\n输入：coins = [1], amount = 0\n输出：0\n\n提示：\n• 1 \u003c= coins.length \u003c= 12\n• 1 \u003c= coins[i] \u003c= 2^31 - 1\n• 0 \u003c= amount \u003c= 10^4","solution":"## 题目理解\n-\n\n## 思路\n-与上一题可以说是一模一样\n\n## 要点\n-\n\n## 复杂度\n- 时间复杂度：\n- 空间复杂度：\n\n## 易错点\n-","review":"• 2026-10-03 复习记录：\n• 卡点：和上题一样，上题不会写，那这个也不能会写，刚写过不算\n• 修正：\n• 下次重点：","cpp":"```cpp\nclass Solution {\npublic:\n    int coinChange(vector\u003cint\u003e\u0026 coins, int amount) {\n        vector\u003cint\u003e dp(amount+1,amount+1);\n        dp[0]=0;\n        for(int i=0;i\u003ccoins.size();i++){\n            int count=coins[i];\n            for(int j=count;j\u003c=amount;j++){\n                    dp[j]=min(dp[j],dp[j-count]+1);\n            }\n        }\n        return dp[amount] == amount + 1 ? -1 : dp[amount];\n    }\n};\n```","python":"```python\nclass Solution:\n    def coinChange(self, coins: List[int], amount: int) -\u003e int:\n```"},"combination-sum":{"problem":"给你一个 无重复元素 的整数数组 candidates 和一个目标整数 target ，找出 candidates 中可以使数字和为目标数 target 的 所有* *不同组合 ，并以列表形式返回。你可以按 任意顺序 返回这些组合。\n\ncandidates 中的 同一个 数字可以 无限制重复被选取 。如果至少一个数字的被选数量不同，则两种组合是不同的。\n\n对于给定的输入，保证和为 target 的不同组合数少于 150 个。\n\n示例 1：\n\n输入：candidates = [2,3,6,7], target = 7\n输出：[[2,2,3],[7]]\n解释：\n2 和 3 可以形成一组候选，2 + 2 + 3 = 7 。注意 2 可以使用多次。\n7 也是一个候选， 7 = 7 。\n仅有这两种组合。\n\n示例 2：\n\n输入: candidates = [2,3,5], target = 8\n输出: [[2,2,2,2],[2,3,3],[3,5]]\n\n示例 3：\n\n输入: candidates = [2], target = 1\n输出: []\n\n提示：\n• 1 \u003c= candidates.length \u003c= 30\n• 2 \u003c= candidates[i] \u003c= 40\n• candidates 的所有元素 互不相同\n• 1 \u003c= target \u003c= 40","solution":"## 题目理解\n-\n\n## 思路\n-可重复选的组合型，不传i+1而是传i即可\n\n## 要点\n-\n\n## 复杂度\n- 时间复杂度：\n- 空间复杂度：\n\n## 易错点\n-","review":"-\n\n2026-09-26 复习记录：\n- 卡点：可以重复选，要传的是什么，能理解吗？\n- 修正：\n- 下次重点：","cpp":"```cpp\nclass Solution {\nprivate:\n    vector\u003cvector\u003cint\u003e\u003e res;\n    vector\u003cint\u003e path;\npublic:\n    void bt(vector\u003cint\u003e\u0026candidates,int start,int target){\n        if(target==0) {\n            res.push_back(path);\n            return;\n        }\n        if(0\u003etarget) return;\n        for(int i=start;i\u003ccandidates.size();i++){\n            path.push_back(candidates[i]);\n            bt(candidates,i,target-candidates[i]);\n            path.pop_back();\n        }\n        return;\n    }\n\n\n    vector\u003cvector\u003cint\u003e\u003e combinationSum(vector\u003cint\u003e\u0026 candidates, int target) {\n        bt(candidates,0,target);\n        return res;\n    }\n};\n```","python":"```python\nclass Solution:\n    def combinationSum(self, candidates: List[int], target: int) -\u003e List[List[int]]:\n```"},"construct-binary-tree-from-preorder-and-inorder-traversal":{"problem":"给定两个整数数组 preorder 和 inorder ，其中 preorder 是二叉树的先序遍历， inorder 是同一棵树的中序遍历，请构造二叉树并返回其根节点。\n\n示例 1:\n\n输入: preorder = [3,9,20,15,7], inorder = [9,3,15,20,7]\n输出: [3,9,20,null,null,15,7]\n\n示例 2:\n\n输入: preorder = [-1], inorder = [-1]\n输出: [-1]\n\n提示:\n• 1 \u003c= preorder.length \u003c= 3000\n• inorder.length == preorder.length\n• -3000 \u003c= preorder[i], inorder[i] \u003c= 3000\n• preorder 和 inorder 均 无重复 元素\n• inorder 均出现在 preorder\n• preorder 保证 为二叉树的前序遍历序列\n• inorder 保证 为二叉树的中序遍历序列","solution":"## 题目理解\n剖析“左子树”的边界\n中序边界：[in_left, root_index - 1]\n人话翻译：因为 root_index 是根节点，所以根节点的正左边（减 1），一直到最左头，全都是左子树的人。\n前序边界：[pre_left + 1, pre_left + left_size]\n人话翻译：pre_left 坐着根节点，所以左子树从它的下一个（+1）开始。\n既然从 pre_left + 1 开始，而且左子树一共有 left_size 个人，那么最后一个人在哪？\n数学公式：起始位置 + 人数 - 1 = 终点位置。\n所以终点是：(pre_left + 1) + left_size - 1 = pre_left + left_size！\n🔪 剖析“右子树”的边界（90%的人死在这里！）\n中序边界：[root_index + 1, in_right]\n人话翻译：根节点（root_index）的正右边（加 1），一直到最右头，全都是右子树的人。这个简单。\n前序边界：[pre_left + left_size + 1, pre_right]\n人话翻译：右子树的起点到底在哪里？！\n想想我们刚才算出的左子树前序边界，左子树的最后一个人的下标是 pre_left + left_size。\n那么，紧挨在左子树最后一个人后面的，不就是右子树的第一个人吗！\n所以，右子树的起点就是：pre_left + left_size + 1！\n终点呢？毫无疑问是当前大区间的最后一个：pre_right。\n\n## 思路\n-这道题首先是看懂题意吧，怎么从前序和中序中，确认实际树的样子。前序的第一个就是根。然后根据中序就能确认根的左右各多少。\n-然后实际上难点还有如何处理下标。\n-还要注意先用哈希表存一下中序遍历的顺序，为了找到根节点在中序数组里的下标。\n\n## 要点\n-辅助函数需要\nvector\u003cint\u003e\u0026 preorder, vector\u003cint\u003e\u0026 inorder,  int pre_left, int pre_right,int in_left, int in_right)。即前序数组，中序数组，前序范围，中序范围。难点在如何找到范围。然后还要分别找到左子树的这几个和右子树的这几个\n\n## 复杂度\n- 时间复杂度：\n- 空间复杂度：\n\n## 易错点\n-","review":"• 2026-10-06 复习记录：\n• 卡点：其实这道题吧，我已经知道要干什么了，也记得哈希表存，也记得传四个范围，但是第一反应还是懵逼，不知道怎么具体实现\n• 修正：二叉树咋实现？不就是根节点值，左右节点分别是啥吗！这里就先找到根节点在哪和值是多少，然后左右节点就递归，递归的范围是多少？这是着重考虑\n• 下次重点：","cpp":"```cpp\n/**\n * Definition for a binary tree node.\n * struct TreeNode {\n *     int val;\n *     TreeNode *left;\n *     TreeNode *right;\n *     TreeNode() : val(0), left(nullptr), right(nullptr) {}\n *     TreeNode(int x) : val(x), left(nullptr), right(nullptr) {}\n *     TreeNode(int x, TreeNode *left, TreeNode *right) : val(x), left(left), right(right) {}\n * };\n */\nclass Solution {\nprivate:\n    unordered_map\u003cint,int\u003e map;\npublic:\n    TreeNode* dfs(vector\u003cint\u003e\u0026 preorder, vector\u003cint\u003e\u0026 inorder,int preleft,int preright,int inleft,int inright){\n        if(preleft\u003epreright) return nullptr;\n        int rootvalue=preorder[preleft];\n        int rootindex=map[rootvalue];\n        int leftsize=rootindex-inleft;\n        TreeNode* root = new TreeNode(rootvalue);\n        root-\u003eleft=dfs(preorder,inorder,preleft+1,preleft+leftsize,inleft,rootindex-1);\n        root-\u003eright=dfs(preorder,inorder,preleft+leftsize+1,preright,rootindex+1,inright);\n        return root;\n    }\n\n    TreeNode* buildTree(vector\u003cint\u003e\u0026 preorder, vector\u003cint\u003e\u0026 inorder) {\n        int n=inorder.size();\n        for(int i=0;i\u003cn;i++){\n            map[inorder[i]]=i;\n        }\n        return dfs(preorder,inorder,0,n-1,0,n-1);\n    }\n};\n```","python":"```python\n# Definition for a binary tree node.\n# class TreeNode:\n#     def __init__(self, val=0, left=None, right=None):\n#         self.val = val\n#         self.left = left\n#         self.right = right\nclass Solution:\n    def buildTree(self, preorder: List[int], inorder: List[int]) -\u003e Optional[TreeNode]:\n```"},"container-with-most-water":{"problem":"给定一个长度为 n 的整数数组 height 。有 n 条垂线，第 i 条线的两个端点是 (i, 0) 和 (i, height[i]) 。\n\n找出其中的两条线，使得它们与 x 轴共同构成的容器可以容纳最多的水。\n\n返回容器可以储存的最大水量。\n\n说明：你不能倾斜容器。\n\n示例 1：\n\n输入：[1,8,6,2,5,4,8,3,7]\n输出：49\n解释：图中垂直线代表输入数组 [1,8,6,2,5,4,8,3,7]。在此情况下，容器能够容纳水（表示为蓝色部分）的最大值为 49。\n\n示例 2：\n\n输入：height = [1,1]\n输出：1\n\n提示：\n• n == height.length\n• 2 \u003c= n \u003c= 10^5\n• 0 \u003c= height[i] \u003c= 10^4","solution":"## 题目理解\n-\n\n## 思路\n-相向双指针，指向两边\n-while（left\u003cright) \n-面积就是，（右减左）*min（左高，右高）\n\n## 要点\n-\n\n## 复杂度\n- 时间复杂度：\n- 空间复杂度：\n\n## 易错点\n-","review":"• 2026-10-06 复习记录：\n• 卡点：一个简单的双指针，会写\n• 修正：\n• 下次重点：","cpp":"```cpp\nclass Solution {\npublic:\n    int maxArea(vector\u003cint\u003e\u0026 height) {\n        int n=height.size();\n        int left=0,right=n-1,square=0;\n        while(left\u003cright){\n            square=max((right-left)*min(height[right],height[left]),square);\n            if(height[left]\u003cheight[right]) left++;\n            else right--;\n        }\n        return square;\n    }\n};\n```","python":"```python\nclass Solution:\n    def maxArea(self, height: List[int]) -\u003e int:\n```"},"convert-sorted-array-to-binary-search-tree":{"problem":"给你一个整数数组 nums ，其中元素已经按 升序 排列，请你将其转换为一棵 平衡 二叉搜索树。\n\n示例 1：\n\n输入：nums = [-10,-3,0,5,9]\n输出：[0,-3,9,-10,null,5]\n解释：[0,-10,5,null,-3,null,9] 也将被视为正确答案：\n\n示例 2：\n\n输入：nums = [1,3]\n输出：[3,1]\n解释：[1,null,3] 和 [3,1] 都是高度平衡二叉搜索树。\n\n提示：\n• 1 \u003c= nums.length \u003c= 10^4\n• -10^4 \u003c= nums[i] \u003c= 10^4\n• nums 按 严格递增 顺序排列","solution":"## 题目理解\n-\n\n## 思路\n-看懂题意，平衡搜索二叉树意味着，让中间大小的值当作根节点，递归这一步即可。\n-注意判断左右大小作为结束条件\n\n## 要点\n-\n\n## 复杂度\n- 时间复杂度：\n- 空间复杂度：\n\n## 易错点\n-","review":"• 2026-10-06 复习记录：\n• 卡点：知道咋写也基本能写对，唯一错点在，二分区间写错了\n• 修正：\n• 下次重点：","cpp":"```cpp\n/**\n * Definition for a binary tree node.\n * struct TreeNode {\n *     int val;\n *     TreeNode *left;\n *     TreeNode *right;\n *     TreeNode() : val(0), left(nullptr), right(nullptr) {}\n *     TreeNode(int x) : val(x), left(nullptr), right(nullptr) {}\n *     TreeNode(int x, TreeNode *left, TreeNode *right) : val(x), left(left), right(right) {}\n * };\n */\nclass Solution {\npublic:\n    TreeNode* dfs(vector\u003cint\u003e\u0026 nums,int left,int right){\n        if (left == right) {\n            return nullptr;\n        }\n        int m=left+(right-left)/2;\n        TreeNode* root=new TreeNode;\n        root-\u003eval=nums[m];\n        root-\u003eleft=dfs(nums,left,m);\n        root-\u003eright=dfs(nums,m+1,right);\n//可合并TreeNode* root=new TreeNode(nums[m],dfs(nums,left,m),(nums,m+1,right);\n        return root;\n    }\n\n    TreeNode* sortedArrayToBST(vector\u003cint\u003e\u0026 nums) {\n        return dfs(nums,0,nums.size());\n    }\n};\n```","python":"```python\n# Definition for a binary tree node.\n# class TreeNode:\n#     def __init__(self, val=0, left=None, right=None):\n#         self.val = val\n#         self.left = left\n#         self.right = right\nclass Solution:\n    def sortedArrayToBST(self, nums: List[int]) -\u003e Optional[TreeNode]:\n```"},"copy-list-with-random-pointer":{"problem":"给你一个长度为 n 的链表，每个节点包含一个额外增加的随机指针 random ，该指针可以指向链表中的任何节点或空节点。\n\n构造这个链表的 [深拷贝](https://baike.baidu.com/item/深拷贝/22785317?fr=aladdin)。 深拷贝应该正好由 n 个 全新 节点组成，其中每个新节点的值都设为其对应的原节点的值。新节点的 next 指针和 random 指针也都应指向复制链表中的新节点，并使原链表和复制链表中的这些指针能够表示相同的链表状态。复制链表中的指针都不应指向原链表中的节点 。\n\n例如，如果原链表中有 X 和 Y 两个节点，其中 X.random --\u003e Y 。那么在复制链表中对应的两个节点 x 和 y ，同样有 x.random --\u003e y 。\n\n返回复制链表的头节点。\n\n用一个由 n 个节点组成的链表来表示输入/输出中的链表。每个节点用一个 [val, random_index] 表示：\n• val：一个表示 Node.val 的整数。\n• random_index：随机指针指向的节点索引（范围从 0 到 n-1）；如果不指向任何节点，则为  null 。\n\n你的代码 只 接受原链表的头节点 head 作为传入参数。\n\n示例 1：\n\n输入：head = [[7,null],[13,0],[11,4],[10,2],[1,0]]\n输出：[[7,null],[13,0],[11,4],[10,2],[1,0]]\n\n示例 2：\n\n输入：head = [[1,1],[2,1]]\n输出：[[1,1],[2,1]]\n\n示例 3：\n\n输入：head = [[3,null],[3,0],[3,null]]\n输出：[[3,null],[3,0],[3,null]]\n\n提示：\n• 0\n• -10^4 \u003c= Node.val \u003c= 10^4\n• Node.random 为 null` 或指向链表中的节点。","solution":"## 题目理解\n-\n\n## 思路\n-为什么不能直接复制？因为遍历到第一个时，还找不到后面的在哪\n-一个较为简单的思路是，遍历链表，用一个哈希表存下来其random对应谁，即\u003clistnode*,listnode*\u003e前面是该节点，后面是random指向的\n-但是这样需要额外空间，可以使用影分身复制之法。\n-每个节点紧跟在后面生成一个复制体，然后让复制体的random指向本体random-\u003enext\n\n## 要点\n-但是怎么遍历这个过程，for循环里写什么？\n-生成好复制体并且对应完之后，如何拆分出单独的复制链表？这个for循环呢？\n-并且最好还原原来的链表\n\n## 复杂度\n- 时间复杂度：\n- 空间复杂度：\n\n## 易错点\n-","review":"• 2026-09-23 复习记录：\n• 卡点：依然是记得要复制，但是忘了复制的目的是什么了，即第二个for循环如何写\n• 修正：\n• 下次重点：\n\n2026-09-25 复习记录：\n• 卡点：第二个for循环，一定要判断，cur-\u003erandom是不是空！！\n• 修正：\n• 下次重点：","cpp":"```cpp\n/*\n// Definition for a Node.\nclass Node {\npublic:\n    int val;\n    Node* next;\n    Node* random;\n    \n    Node(int _val) {\n        val = _val;\n        next = NULL;\n        random = NULL;\n    }\n};\n*/\n\nclass Solution {\npublic:\n    Node* copyRandomList(Node* head) {\n        if (head == nullptr) return nullptr;\n        Node* cur = head;\n        while (cur != nullptr) {\n            cur-\u003enext = new Node(cur-\u003eval,cur-\u003enext,nullptr);;\n            cur = cur-\u003enext-\u003enext; \n        }\n        cur = head;\n        while (cur != nullptr) {\n            if (cur-\u003erandom != nullptr) {\n                cur-\u003enext-\u003erandom = cur-\u003erandom-\u003enext;\n            }\n            cur = cur-\u003enext-\u003enext; \n        }\n        Node dummy(-1,head);\n        Node* tail = \u0026dummy;\n        cur = head;\n        while (cur) {\n            Node* copy = cur-\u003enext;\n            tail-\u003enext = copy;\n            tail = copy;\n            cur-\u003enext = copy-\u003enext;\n            cur = cur-\u003enext;\n        }\n        return dummy.next;\n    }\n};\n```","python":"```python\n\"\"\"\n# Definition for a Node.\nclass Node:\n    def __init__(self, x: int, next: \u0027Node\u0027 = None, random: \u0027Node\u0027 = None):\n        self.val = int(x)\n        self.next = next\n        self.random = random\n\"\"\"\n\nclass Solution:\n    def copyRandomList(self, head: \u0027Optional[Node]\u0027) -\u003e \u0027Optional[Node]\u0027:\n```"},"course-schedule":{"problem":"你这个学期必须选修 numCourses 门课程，记为 0 到 numCourses - 1 。\n\n在选修某些课程之前需要一些先修课程。 先修课程按数组 prerequisites 给出，其中 prerequisites[i] = [a_i, b_i] ，表示如果要学习课程 a_i 则 必须 先学习课程  b_i_ 。\n• 例如，先修课程对 [0, 1] 表示：想要学习课程 0 ，你需要先完成课程 1 。\n\n请你判断是否可能完成所有课程的学习？如果可以，返回 true ；否则，返回 false 。\n\n示例 1：\n\n输入：numCourses = 2, prerequisites = [[1,0]]\n输出：true\n解释：总共有 2 门课程。学习课程 1 之前，你需要完成课程 0 。这是可能的。\n\n示例 2：\n\n输入：numCourses = 2, prerequisites = [[1,0],[0,1]]\n输出：false\n解释：总共有 2 门课程。学习课程 1 之前，你需要先完成​课程 0 ；并且学习课程 0 之前，你还应先完成课程 1 。这是不可能的。\n\n提示：\n• 1 \u003c= numCourses \u003c= 2000\n• 0 \u003c= prerequisites.length \u003c= 5000\n• prerequisites[i].length == 2\n• 0 \u003c= a_i, b_i \u003c numCourses\n• prerequisites[i] 中的所有课程对 互不相同","solution":"## 题目理解\n-另一种思路是DFS，即染色法，这个虽然代码实现上简单一点，但思维难度比较高。\n-也要建立邻接表，然后建立状态表，dfs里判断是2则返回对，是1则返回错，否则对其邻接表里的每一个进行递归，如果里面有错就返回错，否则最后返回对。\n-主函数里也是这样。\n-易错点是，dfs里，判断是不是2和1之后，要把当前节点设为1，迭代完后设为2.\n\n## 思路\n-首先要意识到，这是一个有向图找是否有环的问题\n-然后难点在于如何翻译题目与初始化，即制作邻接表数组和零度数组。邻接数组即存入第i门课可以解锁的课程。零度数组即该门课需要多少个前置课程。然后q初始化开始零度就为零的。\n-然后用一个变量记录已经学习的课程，用来最后判断结果\n-循环内就是常见的BFS方法，由于不需要知道每层，所以可以不用内部的for循环\n-循环里要做的就是对q里的每个，通过邻接数组让他对应的课程零度都--，当为0时，就进入q\n\n## 要点\n在 C++ 中，我们最常用来表示邻接表的数据结构是：\nvector\u003cvector\u003cint\u003e\u003e edges;\n这看起来像个二维矩阵，但它绝对不是一个四四方方的方阵！ 请把它翻译成一句大白话：“这是一个大柜子（外层 vector），柜子里有很多抽屉。第 i 个抽屉里，装着所有从 i 房间出发能到达的房间号。”\n\n## 复杂度\n- 时间复杂度：\n- 空间复杂度：\n\n## 易错点\n-","review":"• 2026-09-26 复习记录：\n• 卡点：只大概记得，完全不知道如何实现，还得多手写啊！\n• 修正：两种方法都不会！BFS可以参考腐烂的橘子\n• 下次重点：","cpp":"```cpp\nclass Solution {\npublic:\n    bool canFinish(int numCourses, vector\u003cvector\u003cint\u003e\u003e\u0026 prerequisites) {\n        vector\u003cvector\u003cint\u003e\u003e edges(numCourses);\n        vector\u003cint\u003e indeg(numCourses);\n        for(auto\u0026 x:prerequisites){\n            edges[x[1]].push_back(x[0]);\n            indeg[x[0]]++;\n        }\n        queue\u003cint\u003e q;\n        int visit=0;\n        for(int i=0;i\u003cnumCourses;i++){\n            if(indeg[i]==0) q.push(i);\n        }\n        while(!q.empty()){\n            int length=q.size();\n            for(int i=0;i\u003clength;i++){\n                int u=q.front();\n                q.pop();\n\n                visit++;\n                for(auto v:edges[u]){\n                    indeg[v]--;\n                    if(indeg[v]==0) q.push(v);\n                }\n            }\n        }\n        return visit == numCourses;\n    }\n};\n\n\nclass Solution {\nprivate:\n        vector\u003cvector\u003cint\u003e\u003e edges;\n        vector\u003cint\u003e state;\npublic:\n    bool dfs(int u){\n        if(state[u]==1) return false;\n        if(state[u]==2) return true;\n        state[u] = 1;\n        for(int v:edges[u]){\n            if(!dfs(v)) return false;\n        }\n        state[u]=2;\n        return true;\n    }\n\n\n    bool canFinish(int numCourses, vector\u003cvector\u003cint\u003e\u003e\u0026 prerequisites) {\n        edges.resize(numCourses);\n        state.resize(numCourses, 0);\n        for(auto\u0026 x:prerequisites){\n            edges[x[1]].push_back(x[0]);\n        }        \n        for(int i=0;i\u003cnumCourses;i++){\n            if(state[i]==0) {\n                if (!dfs(i)) {\n                    return false;\n                }\n            }\n        }\n        return true;\n    }\n};\n```","python":"```python\nclass Solution:\n    def canFinish(self, numCourses: int, prerequisites: List[List[int]]) -\u003e bool:\n```"},"daily-temperatures":{"problem":"给定一个整数数组 temperatures ，表示每天的温度，返回一个数组 answer ，其中 answer[i] 是指对于第 i 天，下一个更高温度出现在几天后。如果气温在这之后都不会升高，请在该位置用 0 来代替。\n\n示例 1:\n\n输入: temperatures = [73,74,75,71,69,72,76,73]\n输出: [1,1,4,2,1,1,0,0]\n\n示例 2:\n\n输入: temperatures = [30,40,50,60]\n输出: [1,1,1,0]\n\n示例 3:\n\n输入: temperatures = [30,60,90]\n输出: [1,1,0]\n\n提示：\n• 1 \u003c= temperatures.length \u003c= 10^5\n• 30 \u003c= temperatures[i] \u003c= 100","solution":"## 题目理解\n-\n\n## 思路\n-单调栈，栈中存下标\n-如果栈不空且大于栈顶，就要记录了\n-j=top，res[j]=i-j;\n\n## 要点\n-\n\n## 复杂度\n- 时间复杂度：\n- 空间复杂度：\n\n## 易错点\n-","review":"• 2026-09-27 复习记录：\n• 卡点：注意判空+放的是下标\n• 修正：\n• 下次重点：","cpp":"```cpp\nclass Solution {\npublic:\n    vector\u003cint\u003e dailyTemperatures(vector\u003cint\u003e\u0026 temperatures) {\n        int n=temperatures.size();\n        stack\u003cint\u003e st;\n        vector\u003cint\u003e res(n);\n        for(int i=0;i\u003cn;i++){\n            while(!st.empty()\u0026\u0026 temperatures[i]\u003etemperatures[st.top()]){\n                int j=st.top();\n                st.pop();\n                res[j]=i-j;\n            }\n            st.push(i);\n        }\n        return res;        \n    }\n};\n```","python":"```python\nclass Solution:\n    def dailyTemperatures(self, temperatures: List[int]) -\u003e List[int]:\n```"},"decode-string":{"problem":"给定一个经过编码的字符串，返回它解码后的字符串。\n\n编码规则为: k[encoded_string]，表示其中方括号内部的 encoded_string 正好重复 k 次。注意 k 保证为正整数。\n\n你可以认为输入字符串总是有效的；输入字符串中没有额外的空格，且输入的方括号总是符合格式要求的。\n\n此外，你可以认为原始数据不包含数字，所有的数字只表示重复的次数 k ，例如不会出现像 3a 或 2[4] 的输入。\n\n测试用例保证输出的长度不会超过 10^5。\n\n示例 1：\n\n输入：s = \"3[a]2[bc]\"\n输出：\"aaabcbc\"\n\n示例 2：\n\n输入：s = \"3[a2[c]]\"\n输出：\"accaccacc\"\n\n示例 3：\n\n输入：s = \"2[abc]3[cd]ef\"\n输出：\"abcabccdcdcdef\"\n\n示例 4：\n\n输入：s = \"abc3[cd]xyz\"\n输出：\"abccdcdcdxyz\"\n\n提示：\n• 1 \u003c= s.length \u003c= 30\n• s 由小写英文字母、数字和方括号 \u0027[]\u0027 组成\n• s 保证是一个 有效 的输入。\n• s 中所有整数的取值范围为 [1, 300]","solution":"## 题目理解\n-\n\n## 思路\n-栈是肯定的，这道题难在具体实现。首先最好使用两个栈分别记录字符串和数字，这样最简单\n-多位数字别忘了\n-遇到左括号，入栈并且重置res和num状态\n-遇到右括号，出栈，通过一个tmp，重复栈顶num次当前的res，然后栈顶str+tmp\n\n## 要点\n-数字不一定是单位的，如何处理多位数字\n-字符串里的两个函数，isdigit和isalpha要记得用\n\n## 复杂度\n- 时间复杂度：\n- 空间复杂度：\n\n## 易错点\n-","review":"• 2026-10-06 复习记录：\n• 卡点：总体流程思路是会的，容易搞混的是最后面，for里面是tmp+=res，然后最后是res=tmp+laststr\n• 修正：\n• 下次重点：","cpp":"```cpp\nclass Solution {\npublic:\n    string decodeString(string s) {\n        stack\u003cint\u003e stnum;\n        stack\u003cstring\u003e ststr;\n        int num=0;\n        string res=\"\";\n        for(char x:s){\n            if(isdigit(x)){\n                num=num*10+x-\u00270\u0027;\n            }\n            if(isalpha(x)){\n                res+=x;\n            }\n            if(x==\u0027[\u0027){\n                stnum.push(num);\n                ststr.push(res);\n                res=\"\";\n                num=0;\n            }\n            if(x==\u0027]\u0027){\n                int curnum=stnum.top();\n                string laststr=ststr.top();\n                string tmp=\"\";\n                stnum.pop();\n                ststr.pop();\n                for(int i=0;i\u003ccurnum;i++){\n                    tmp+=res;\n                }\n                res=laststr+tmp;\n            }\n        }\n        return res;\n    }\n};\n```","python":"```python\nclass Solution:\n    def decodeString(self, s: str) -\u003e str:\n```"},"diameter-of-binary-tree":{"problem":"给你一棵二叉树的根节点，返回该树的 直径 。\n\n二叉树的 直径 是指树中任意两个节点之间最长路径的 长度 。这条路径可能经过也可能不经过根节点 root 。\n\n两节点之间路径的 长度 由它们之间边数表示。\n\n示例 1：\n\n输入：root = [1,2,3,4,5]\n输出：3\n解释：3 ，取路径 [4,2,1,3] 或 [5,2,1,3] 的长度。\n\n示例 2：\n\n输入：root = [1,2]\n输出：1\n\n提示：\n• 树中节点数目在范围 [1, 10^4] 内\n• -100 \u003c= Node.val \u003c= 100","solution":"## 题目理解\n-\n\n## 思路\n-这道题还是有一定难度的，在于如何翻译清楚题目中的，直径这一概念\n-可以想想，一个子树最长的可能是从他的左子节点到右子节点\n-所以呢，经过节点 X 的最长路径长度 = X 的左子树最大深度 + X 的右子树最大深度\n-还有一个点在于，函数依然是要向上传递深度的，所以return的是依然是深度,返回值不是答案！\n-也就是说，在一个函数内，执行了两份工作，一个是找答案，一个是让父节点找答案\n\n## 要点\n-\n\n## 复杂度\n- 时间复杂度：\n- 空间复杂度：\n\n## 易错点\n-","review":"• 2026-10-06 复习记录：\n• 卡点：知道dfs需要同时传值和记录结果，但是还是没翻译对直径这一概念，直径就是l+r（其实这是题目说清楚的！不需要再+1）\n• 修正：\n• 下次重点：","cpp":"```cpp\n/**\n * Definition for a binary tree node.\n * struct TreeNode {\n *     int val;\n *     TreeNode *left;\n *     TreeNode *right;\n *     TreeNode() : val(0), left(nullptr), right(nullptr) {}\n *     TreeNode(int x) : val(x), left(nullptr), right(nullptr) {}\n *     TreeNode(int x, TreeNode *left, TreeNode *right) : val(x), left(left), right(right) {}\n * };\n */\nclass Solution {\nprivate:int maxlegnth=0;\npublic:\n    int dfs(TreeNode* root){\n        if(!root) return 0;\n        int left=dfs(root-\u003eleft);\n        int right=dfs(root-\u003eright);\n        maxlegnth=max(maxlegnth,left+right);\n        return max(right,left)+1;\n    }\n\n    int diameterOfBinaryTree(TreeNode* root) {\n        dfs(root);\n        return maxlegnth;\n    }\n};\n```","python":"```python\n# Definition for a binary tree node.\n# class TreeNode:\n#     def __init__(self, val=0, left=None, right=None):\n#         self.val = val\n#         self.left = left\n#         self.right = right\nclass Solution:\n    def diameterOfBinaryTree(self, root: Optional[TreeNode]) -\u003e int:\n```"},"edit-distance":{"problem":"给你两个单词 word1 和 word2， *请返回将 word1 转换成 word2 所使用的最少操作数*  。\n\n你可以对一个单词进行如下三种操作：\n• 插入一个字符\n• 删除一个字符\n• 替换一个字符\n\n示例 1：\n\n输入：word1 = \"horse\", word2 = \"ros\"\n输出：3\n解释：\nhorse -\u003e rorse (将 \u0027h\u0027 替换为 \u0027r\u0027)\nrorse -\u003e rose (删除 \u0027r\u0027)\nrose -\u003e ros (删除 \u0027e\u0027)\n\n示例 2：\n\n输入：word1 = \"intention\", word2 = \"execution\"\n输出：5\n解释：\nintention -\u003e inention (删除 \u0027t\u0027)\ninention -\u003e enention (将 \u0027i\u0027 替换为 \u0027e\u0027)\nenention -\u003e exention (将 \u0027n\u0027 替换为 \u0027x\u0027)\nexention -\u003e exection (将 \u0027n\u0027 替换为 \u0027c\u0027)\nexection -\u003e execution (插入 \u0027u\u0027)\n\n提示：\n• 0 \u003c= word1.length, word2.length \u003c= 500\n• word1 和 word2 由小写英文字母组成","solution":"## 题目理解\n一维空间压缩最让人大脑宕机的地方，就在于“换行的那一瞬间”（也就是外层循环 i 刚递增，内层循环 j 还没开始的时候）。\n我们要找的那个“左上角”，在真实的二维坐标系里，到底是谁？\n答案是：当我们准备计算这一行的第一个内部格子（j = 1）时，它的左上角坐标永远是 (i - 1, 0)！\n也就是说，prev 的使命，就是精准捕获二维矩阵里的第 i-1 行、第 0 列的值。\n\n## 思路\n-dp[i][j] 表示将 word1 的前 i 个字符转换成 word2 的前 j 个字符所需要的最少操作数。\n-初始化，第一行 dp[0][j]：空串变 word2，步数就是 j（全是插入）第一列 dp[i][0]：word1 变空串，步数就是 i（全是删除）\n-状态转移方程，如果一样，直接看左上角，否则需要增删改，这三步的操作量都是1，即min这三步+1；\n-这道题也可以优化空间，同样要临时变量存储左上角，我认为的难点就是，在什么时候、如何初始化这个临时变量。\n\n## 要点\n-\n\n## 复杂度\n- 时间复杂度：\n- 空间复杂度：\n\n## 易错点\n-","review":"• 2026-10-04 复习记录：\n• 卡点：和上题几乎一样，妈的又忘了初始化了\n• 修正：\n• 下次重点：","cpp":"```cpp\nclass Solution {\npublic:\n    int minDistance(string word1, string word2) {\n        int m=word1.size(),n=word2.size();\n        vector\u003cvector\u003cint\u003e\u003e dp(m+1,vector\u003cint\u003e(n+1));\n        for(int i=0;i\u003c=m;i++) dp[i][0]=i;\n        for(int j=0;j\u003c=n;j++) dp[0][j]=j;\n        for(int i=1;i\u003c=m;i++){\n            for(int j=1;j\u003c=n;j++){\n                if(word1[i-1]==word2[j-1]) dp[i][j]=dp[i-1][j-1];\n                else dp[i][j]=min({dp[i-1][j-1],dp[i][j-1],dp[i-1][j]})+1;\n            }\n        }\n        return dp[m][n];\n    }\n};\n一维二维\nclass Solution {\npublic:\n    int minDistance(string word1, string word2) {\n        int m = word1.length();\n        int n = word2.length();\n        vector\u003cint\u003e dp(n + 1);\n        for (int j = 0; j \u003c= n; j++) dp[j] = j;\n        for (int i = 1; i \u003c= m; i++) {\n            int prev = dp[0]; \n            dp[0] = i; \n            for (int j = 1; j \u003c= n; j++) {\n                int temp = dp[j];\n                if (word1[i - 1] == word2[j - 1]) {\n                    dp[j] = prev;\n                } else {\n                    dp[j] = 1 + min({dp[j],dp[j - 1],prev});\n                }\n                prev = temp;\n            }\n        }\n\n        return dp[n];\n    }\n};\n```","python":"```python\nclass Solution:\n    def minDistance(self, word1: str, word2: str) -\u003e int:\n```"},"find-all-anagrams-in-a-string":{"problem":"给定两个字符串 s 和 p，找到 s 中所有 p 的 异位词 的子串，返回这些子串的起始索引。不考虑答案输出的顺序。\n\n示例 1:\n\n输入: s = \"cbaebabacd\", p = \"abc\"\n输出: [0,6]\n解释:\n起始索引等于 0 的子串是 \"cba\", 它是 \"abc\" 的异位词。\n起始索引等于 6 的子串是 \"bac\", 它是 \"abc\" 的异位词。\n\n 示例 2:\n\n输入: s = \"abab\", p = \"ab\"\n输出: [0,1,2]\n解释:\n起始索引等于 0 的子串是 \"ab\", 它是 \"ab\" 的异位词。\n起始索引等于 1 的子串是 \"ba\", 它是 \"ab\" 的异位词。\n起始索引等于 2 的子串是 \"ab\", 它是 \"ab\" 的异位词。\n\n提示:\n• 1 \u003c= s.length, p.length \u003c= 3 * 10^4\n• s 和 p 仅包含小写字母","solution":"## 题目理解\n-\n\n## 思路\n-滑动窗口，先把p都存入哈希数组中。\n-然后开始滑动，map里right直接--，如果出现小于0了，说明吃到错的了，左边要++，左边吐了记得把map加回去；\n-如果长度等于p了，存入答案\n\n## 要点\n-\n\n## 复杂度\n- 时间复杂度：\n- 空间复杂度：\n\n## 易错点\n-","review":"• 2026-09-13 复习记录：\n• 卡点：\n• 修正：\n• 下次重点：滑动窗口重点：右指针扩张，判断是否超标，左指针收缩，在合适的地方更新答案","cpp":"```cpp\nclass Solution {\npublic:\n    vector\u003cint\u003e findAnagrams(string s, string p) {\n        vector\u003cint\u003e res;\n        int map[26]={0};\n        int m=s.size(),n=p.size();\n        for(int i=0;i\u003cn;i++){\n            map[p[i]-\u0027a\u0027]++;\n        }\n        int left=0;\n        for(int right=0;right\u003cm;right++){\n            map[s[right]-\u0027a\u0027]--;\n            while(map[s[right]-\u0027a\u0027]\u003c0){\n                map[s[left]-\u0027a\u0027]++;\n                left++;\n            }\n            if (right - left + 1 == p.size()) {\n                res.push_back(left);\n            }\n        }\n        return res;\n    }\n};\n```","python":"```python\nclass Solution:\n    def findAnagrams(self, s: str, p: str) -\u003e List[int]:\n```"},"find-first-and-last-position-of-element-in-sorted-array":{"problem":"给你一个按照非递减顺序排列的整数数组 nums，和一个目标值 target。请你找出给定目标值在数组中的开始位置和结束位置。\n\n如果数组中不存在目标值 target，返回 [-1, -1]。\n\n你必须设计并实现时间复杂度为 O(log n) 的算法解决此问题。\n\n示例 1：\n\n输入：nums = [5,7,7,8,8,10], target = 8\n输出：[3,4]\n\n示例 2：\n\n输入：nums = [5,7,7,8,8,10], target = 6\n输出：[-1,-1]\n\n示例 3：\n\n输入：nums = [], target = 0\n输出：[-1,-1]\n\n提示：\n• 0 \u003c= nums.length \u003c= 10^5\n• -10^9 \u003c= nums[i] \u003c= 10^9\n• nums 是一个非递减数组\n• -10^9 \u003c= target \u003c= 10^9","solution":"## 题目理解\n-\n\n## 思路\n-意识到传统的二分是找到第一个题意值，那么这道题再对题意值+1进行一次二分，再下标-1就是最后一个题意值了。\n\n## 要点\n-\n\n## 复杂度\n- 时间复杂度：\n- 空间复杂度：\n\n## 易错点\n-","review":"• 2026-09-27 复习记录：\n• 卡点：这个主要是怎么处理不存在的情况，之前没注意过\n• 修正：手写的return是int 不然是迭代器，要注意\n• 下次重点：","cpp":"```cpp\nclass Solution {\n    int lower_bound(vector\u003cint\u003e\u0026 nums, int target) {\n        int left = -1, right = nums.size(); \n        while (left + 1 \u003c right) {\n            int mid = left + (right - left) / 2;\n            if (nums[mid] \u003e= target) {\n                right = mid;\n            } else {\n                left = mid; \n            }\n        }\n        return right;\n    }\n\npublic:\n    vector\u003cint\u003e searchRange(vector\u003cint\u003e\u0026 nums, int target) {\n        int start = lower_bound(nums, target);\n        if (start == nums.size() || nums[start] != target) {\n            return {-1, -1}; \n        }\n        int end = lower_bound(nums, target + 1) - 1;\n        return {start, end};\n    }\n};\n```","python":"```python\nclass Solution:\n    def searchRange(self, nums: List[int], target: int) -\u003e List[int]:\n```"},"find-median-from-data-stream":{"problem":"中位数是有序整数列表中的中间值。如果列表的大小是偶数，则没有中间值，中位数是两个中间值的平均值。\n• 例如 arr = [2,3,4] 的中位数是 3 。\n• 例如 arr = [2,3] 的中位数是 (2 + 3) / 2 = 2.5 。\n\n实现 MedianFinder 类:\n• MedianFinder() 初始化 MedianFinder 对象。\n• void addNum(int num) 将数据流中的整数 num 添加到数据结构中。\n• double findMedian() 返回到目前为止所有元素的中位数。与实际答案相差 10^-5 以内的答案将被接受。\n\n示例 1：\n\n输入\n[\"MedianFinder\", \"addNum\", \"addNum\", \"findMedian\", \"addNum\", \"findMedian\"]\n[[], [1], [2], [], [3], []]\n输出\n[null, null, null, 1.5, null, 2.0]\n\n解释\nMedianFinder medianFinder = new MedianFinder();\nmedianFinder.addNum(1);    // arr = [1]\nmedianFinder.addNum(2);    // arr = [1, 2]\nmedianFinder.findMedian(); // 返回 1.5 ((1 + 2) / 2)\nmedianFinder.addNum(3);    // arr[1, 2, 3]\nmedianFinder.findMedian(); // return 2.0\n\n提示:\n• -10^5 \u003c= num \u003c= 10^5\n• 在调用 findMedian 之前，数据结构中至少有一个元素\n• 最多 5 * 10^4 次调用 addNum 和 findMedian","solution":"## 题目理解\n-\n\n## 思路\n-需要同时维护最大堆和最小堆，左边用最大堆存较小的那些，只关注这里面最大的，右边用最小堆存较大的那些，只关注这里面最小的。\n-然后写函数，add，先无脑进左， 然后把左的顶入右。然后调节一下天平平衡，即如果右边更多，把右边的顶入左。\n-find函数，如果左边人多说明答案是左边顶，否则两边顶求均值/\n\n## 要点\n-\n\n## 复杂度\n- 时间复杂度：\n- 空间复杂度：\n\n## 易错点\n-","review":"• 2026-10-06 复习记录：\n• 卡点：这道题主要是学一个双堆的思路！二分那里有道题如果不考虑复杂度的话也可以用这个思路写\n• 修正：\n• 下次重点：","cpp":"```cpp\nclass MedianFinder {\nprivate:\n    priority_queue\u003cint, vector\u003cint\u003e, less\u003cint\u003e\u003e maxHeap;\n    priority_queue\u003cint, vector\u003cint\u003e, greater\u003cint\u003e\u003e minHeap;\n\npublic:\n    MedianFinder() {\n    }\n    \n    void addNum(int num) {\n        maxHeap.push(num);\n        minHeap.push(maxHeap.top());\n        maxHeap.pop();\n        if (minHeap.size() \u003e maxHeap.size()) {\n            maxHeap.push(minHeap.top());\n            minHeap.pop();\n        }\n    }\n    \n    double findMedian() {\n        if (maxHeap.size() \u003e minHeap.size()) {\n            return maxHeap.top();\n        }\n        return (maxHeap.top() + minHeap.top()) / 2.0;\n    }\n};\n```","python":"```python\nclass MedianFinder:\n\n    def __init__(self):\n        \n\n    def addNum(self, num: int) -\u003e None:\n        \n\n    def findMedian(self) -\u003e float:\n        \n\n\n# Your MedianFinder object will be instantiated and called as such:\n# obj = MedianFinder()\n# obj.addNum(num)\n# param_2 = obj.findMedian()\n```"},"find-minimum-in-rotated-sorted-array":{"problem":"已知一个长度为 n 的数组，预先按照升序排列，经由 1 到 n 次 旋转 后，得到输入数组。例如，原数组 nums = [0,1,2,4,5,6,7] 在变化后可能得到：\n• 若旋转 4 次，则可以得到 [4,5,6,7,0,1,2]\n• 若旋转 7 次，则可以得到 [0,1,2,4,5,6,7]\n\n注意，数组 [a[0], a[1], a[2], ..., a[n-1]] 旋转一次 的结果为数组 [a[n-1], a[0], a[1], a[2], ..., a[n-2]] 。\n\n给你一个元素值 互不相同 的数组 nums ，它原来是一个升序排列的数组，并按上述情形进行了多次旋转。请你找出并返回数组中的 最小元素 。\n\n你必须设计一个时间复杂度为 O(log n) 的算法解决此问题。\n\n示例 1：\n\n输入：nums = [3,4,5,1,2]\n输出：1\n解释：原数组为 [1,2,3,4,5] ，旋转 3 次得到输入数组。\n\n示例 2：\n\n输入：nums = [4,5,6,7,0,1,2]\n输出：0\n解释：原数组为 [0,1,2,4,5,6,7] ，旋转 4 次得到输入数组。\n\n示例 3：\n\n输入：nums = [11,13,15,17]\n输出：11\n解释：原数组为 [11,13,15,17] ，旋转 4 次得到输入数组。\n\n提示：\n• n == nums.length\n• 1 \u003c= n \u003c= 5000\n• -5000 \u003c= nums[i] \u003c= 5000\n• nums 中的所有整数 互不相同\n• nums 原来是一个升序排序的数组，并进行了 1 至 n 次旋转","solution":"## 题目理解\n-\n\n## 思路\n-这题和上一题一样甚至更简单\n-但是最好是和nums[n-1]比，不然要额外处理没旋转时候的情况\n\n## 要点\n-\n\n## 复杂度\n- 时间复杂度：\n- 空间复杂度：\n\n## 易错点\n-","review":"• 2026-09-27 复习记录：\n• 卡点：为什么这样就能找到最小值呢？\n• 修正：就是找到分界点，分界右边当然就是最小值了\n• 下次重点：","cpp":"```cpp\nclass Solution {\npublic:\n    int findMin(vector\u003cint\u003e\u0026 nums) {\n        int left=-1,right=nums.size();\n        while(left+1\u003cright){\n            int mid=left+(right-left)/2;\n            if(nums[mid]\u003enums[nums.size()-1]) left=mid;\n            else right=mid;\n        }\n        return nums[right];\n    }\n};\n```","python":"```python\nclass Solution:\n    def findMin(self, nums: List[int]) -\u003e int:\n```"},"find-the-duplicate-number":{"problem":"给定一个包含 n + 1 个整数的数组 nums ，其数字都在 [1, n] 范围内（包括 1 和 n），可知至少存在一个重复的整数。\n\n假设 nums 只有 一个重复的整数 ，返回 这个重复的数 。\n\n你设计的解决方案必须 不修改 数组 nums 且只用常量级 O(1) 的额外空间。\n\n示例 1：\n\n输入：nums = [1,3,4,2,2]\n输出：2\n\n示例 2：\n\n输入：nums = [3,1,3,4,2]\n输出：3\n\n示例 3 :\n\n输入：nums = [3,3,3,3,3]\n输出：3\n\n提示：\n• 1 \u003c= n \u003c= 10^5\n• nums.length == n + 1\n• 1 \u003c= nums[i] \u003c= n\n• nums 中 只有一个整数 出现 两次或多次 ，其余整数均只出现 一次\n\n进阶：\n• 如何证明 nums 中至少存在一个重复的数字?\n• 你可以设计一个线性级时间复杂度 O(n) 的解决方案吗？","solution":"## 题目理解\n-\n\n## 思路\n-这道题最变态的地方是，把数组看成一个链表，由于必定有重复的数字，也就意味着这个被看成的链表一定是有环的，那么题意就变成了，找到环的入口。\n-那就要想到环形链表Ⅱ了，先用快慢指针，相遇时，再用一个指针从头开始，与慢指针一步步走直到相遇。\n-补充一下，被看成链表后，当前节点的值即下标i，当前节点的next即值nums[i]\n\n## 要点\n-\n\n## 复杂度\n- 时间复杂度：\n- 空间复杂度：\n\n## 易错点\n-","review":"• 2026-10-04 复习记录：\n• 卡点：其实我记得是环形链表2，但是还是有些忘了怎么实现以及忘了第一个循环用来确认相遇了，但不是环的入口，从头开始再来一个循环，才能找到环的入口\n• 修正：\n• 下次重点：","cpp":"```cpp\nclass Solution {\npublic:\n    int findDuplicate(vector\u003cint\u003e\u0026 nums) {\n        int slow = 0, fast = 0; \n        while (true) {\n            slow = nums[slow]; // 等价于 slow = slow.next\n            fast = nums[nums[fast]]; // 等价于 fast = fast.next.next\n            if (fast == slow) { // 快慢指针移动到同一个节点\n                break;\n            }\n        }\n        int head = 0; // 再用一个指针，从起点出发\n        while (slow != head) {\n            slow = nums[slow];\n            head = nums[head];\n        }\n        return slow; // 入环口即重复元素\n    }\n};\n```","python":"```python\nclass Solution:\n    def findDuplicate(self, nums: List[int]) -\u003e int:\n```"},"first-missing-positive":{"problem":"给你一个未排序的整数数组 nums ，请你找出其中没有出现的最小的正整数。\n\n请你实现时间复杂度为 O(n) 并且只使用常数级别额外空间的解决方案。\n\n示例 1：\n\n输入：nums = [1,2,0]\n输出：3\n解释：范围 [1,2] 中的数字都在数组中。\n\n示例 2：\n\n输入：nums = [3,4,-1,1]\n输出：2\n解释：1 在数组中，但 2 没有。\n\n示例 3：\n\n输入：nums = [7,8,9,11,12]\n输出：1\n解释：最小的正数 1 没有出现。\n\n提示：\n• 1 \u003c= nums.length \u003c= 10^5\n• -2^31 \u003c= nums[i] \u003c= 2^31 - 1","solution":"## 题目理解\n-问题是题目要求了O1的额外空间，意味着不能使用哈希表或者排序\n-那怎么办？\n\n## 思路\n-原地哈希\n-让每个数字到自己该到的位置\n-nums[i]!=nums[nums[i]-1]\n\n## 要点\n-什么时候交换，即交换条件  \n-是while还是if？（是一次还是需要多次）\n\n## 复杂度\n- 时间复杂度：\n- 空间复杂度：\n\n## 易错点\n-合法数字（0-n）范围内是交换的前提之一\n-交换条件能写成nums[i]!=i+1吗？为什么？","review":"• 2026-10-06 复习记录：\n• 卡点：大概记得思路，忘了怎么实现了。\n• 修正：\n• 下次重点：","cpp":"```cpp\nclass Solution {\npublic:\n    int firstMissingPositive(vector\u003cint\u003e\u0026 nums) {\n        int n=nums.size();\n        for(int i=0;i\u003cn;i++){\n            while(nums[i]\u003e0\u0026\u0026nums[i]\u003cn\u0026\u0026nums[i]!=nums[nums[i]-1]){\n                swap(nums[i],nums[nums[i]-1]);\n            }\n        }\n        for(int i=0;i\u003cn;i++){\n            if (nums[i]!=i+1) return i+1;\n        }\n        return n+1;\n    }\n};\n```","python":"```python\nclass Solution:\n    def firstMissingPositive(self, nums: List[int]) -\u003e int:\n```"},"flatten-binary-tree-to-linked-list":{"problem":"给你二叉树的根结点 root ，请你将它展开为一个单链表：\n• 展开后的单链表应该同样使用 TreeNode ，其中 right 子指针指向链表中下一个结点，而左子指针始终为 null 。\n• 展开后的单链表应该与二叉树 [先序遍历](https://baike.baidu.com/item/%E5%85%88%E5%BA%8F%E9%81%8D%E5%8E%86/6442839?fr=aladdin) 顺序相同。\n\n示例 1：\n\n输入：root = [1,2,5,3,4,null,6]\n输出：[1,null,2,null,3,null,4,null,5,null,6]\n\n示例 2：\n\n输入：root = []\n输出：[]\n\n示例 3：\n\n输入：root = [0]\n输出：[0]\n\n提示：\n• 树中结点数在范围 [0, 2000] 内\n• -100 \u003c= Node.val \u003c= 100\n\n进阶：你可以使用原地算法（O(1) 额外空间）展开这棵树吗？","solution":"## 题目理解\n-\n\n## 思路\n-考虑到最后的形式是一个一直向右的树，所以可以联想到，可以逆序遍历（右左中）\n-在脑海里模拟从树的最右下角开始往回退，用一个 prev 变量记录上一个被处理好的节点。每次退到一个节点，就把它的右边接上 prev，左边置空，然后把自己变成新的 prev\n-这种思路很好实现，但是比较难想啊。可以联想链表的头插法。不过既然学过还是记住这个。\n-另一种思路是，对于根节点，找到左子树中“最后一个被访问的节点”，然后把原来的右子树接在它后面。实现起来比较复杂了，while（根节点）if（左子树存在）while（右子树存在）一直往右深入。\n\n## 要点\n-\n\n## 复杂度\n- 时间复杂度：\n- 空间复杂度：\n\n## 易错点\n-","review":"• 2026-10-06 复习记录：\n• 卡点：记得有种更巧妙的方法，但是完全不知道怎么实现了\n• 修正：现在仔细一看，这不是普通的逆序啊，是右左中！也可以称为反向前序，而题目要求的是最后按照前序遍历，因此可以联想到，我要得到这个结果，使用头插法，那就是反向前序\n• 下次重点：想到这个，就还好了，用一个pre当作上一个搞好的 节点","cpp":"```cpp\n/**\n * Definition for a binary tree node.\n * struct TreeNode {\n *     int val;\n *     TreeNode *left;\n *     TreeNode *right;\n *     TreeNode() : val(0), left(nullptr), right(nullptr) {}\n *     TreeNode(int x) : val(x), left(nullptr), right(nullptr) {}\n *     TreeNode(int x, TreeNode *left, TreeNode *right) : val(x), left(left), right(right) {}\n * };\n */\nclass Solution {\nprivate:\n    TreeNode* pre = nullptr; \npublic:\n    void flatten(TreeNode* root) {\n        if (!root) return; \n        flatten(root-\u003eright);\n        flatten(root-\u003eleft);\n        root-\u003eright = pre;    \n        root-\u003eleft = nullptr; \n        pre = root; \n    }\n};\n\nclass Solution {\npublic:\n    void flatten(TreeNode* root) {\n        TreeNode* curr = root;\n        while (curr != nullptr) {\n            if (curr-\u003eleft != nullptr) {\n                TreeNode* predecessor = curr-\u003eleft;\n                while (predecessor-\u003eright != nullptr) {\n                    predecessor = predecessor-\u003eright;\n                }\n                predecessor-\u003eright = curr-\u003eright;\n                curr-\u003eright = curr-\u003eleft;\n                curr-\u003eleft = nullptr;\n            }\n            curr = curr-\u003eright;\n        }\n    }\n};\n```","python":"```python\n# Definition for a binary tree node.\n# class TreeNode:\n#     def __init__(self, val=0, left=None, right=None):\n#         self.val = val\n#         self.left = left\n#         self.right = right\nclass Solution:\n    def flatten(self, root: Optional[TreeNode]) -\u003e None:\n        \"\"\"\n        Do not return anything, modify root in-place instead.\n        \"\"\"\n```"},"generate-parentheses":{"problem":"数字 n 代表生成括号的对数，请你设计一个函数，用于能够生成所有可能的并且 有效的 括号组合。\n\n示例 1：\n\n输入：n = 3\n输出：[\"((()))\",\"(()())\",\"(())()\",\"()(())\",\"()()()\"]\n\n示例 2：\n\n输入：n = 1\n输出：[\"()\"]\n\n提示：\n• 1 \u003c= n \u003c= 8","solution":"## 题目理解\n-\n\n## 思路\n-这道题不是不那么传统的组合型回溯，因为在套路模板之外，要考虑，为了让最后的结果是符合题意的，要满足一定条件才能进入回溯。条件是什么呢？\n-当左括号没到n个时，就可以放入左括号\n-当右括号数量小于左括号时，就可以放入右括号\n-所以bt(n,left,right)\n\n## 要点\n-\n\n## 复杂度\n- 时间复杂度：\n- 空间复杂度：\n\n## 易错点\n-","review":"• 2026-09-26 复习记录：\n• 卡点：一点点提示就全能写出来，但总就差那么一点点\n• 修正：\n• 下次重点：","cpp":"```cpp\nclass Solution {\nprivate:\n    vector\u003cstring\u003e res;\n    string path;\npublic:\n    void bt(int n,int left,int right){\n        if (path.size() == n * 2) {\n            res.push_back(path);\n            return;\n        }\n        if (left \u003c n) {\n            path.push_back(\u0027(\u0027);     \n            bt(n, left + 1, right);  \n            path.pop_back();         \n        }\n        if (right \u003c left) {\n            path.push_back(\u0027)\u0027);     \n            bt(n, left, right + 1);  \n            path.pop_back();         \n        }\n    }\n\n    vector\u003cstring\u003e generateParenthesis(int n) {\n        bt(n,0,0);\n        return res;\n    }\n};\n```","python":"```python\nclass Solution:\n    def generateParenthesis(self, n: int) -\u003e List[str]:\n```"},"group-anagrams":{"problem":"给你一个字符串数组，请你将 字母异位词 组合在一起。可以按任意顺序返回结果列表。\n\n示例 1:\n\n输入: strs = [\"eat\", \"tea\", \"tan\", \"ate\", \"nat\", \"bat\"]\n\n输出: [[\"bat\"],[\"nat\",\"tan\"],[\"ate\",\"eat\",\"tea\"]]\n\n解释：\n• 在 strs 中没有字符串可以通过重新排列来形成 \"bat\"。\n• 字符串 \"nat\" 和 \"tan\" 是字母异位词，因为它们可以重新排列以形成彼此。\n• 字符串 \"ate\" ，\"eat\" 和 \"tea\" 是字母异位词，因为它们可以重新排列以形成彼此。\n\n示例 2:\n\n输入: strs = [\"\"]\n\n输出: [[\"\"]]\n\n示例 3:\n\n输入: strs = [\"a\"]\n\n输出: [[\"a\"]]\n\n提示：\n• 1 \u003c= strs.length \u003c= 10^4\n• 0 \u003c= strs[i].length \u003c= 100\n• strs[i] 仅包含小写字母","solution":"## 题目理解\n-\n\n## 思路\n-哈希表\n-将字符串排序后当作key，原字符串当作value即可\n\n## 要点\n-\n\n## 复杂度\n- 时间复杂度：\n- 空间复杂度：\n\n## 易错点\n-","review":"• 2026-09-12 复习记录：\n• 卡点：       for(auto it=map.begin();it!=map.end();it++){\n            res.push_back(it-\u003esecond);\n        } 这个for循环忘了！\n• 修正：\n• 下次重点：","cpp":"```cpp\nclass Solution {\npublic:\n    vector\u003cvector\u003cstring\u003e\u003e groupAnagrams(vector\u003cstring\u003e\u0026 strs) {\n        vector\u003cvector\u003cstring\u003e\u003e res;\n        unordered_map\u003cstring,vector\u003cstring\u003e\u003e map;\n        for(string \u0026s :strs){\n            string key=s;\n            sort(key.begin(),key.end());\n            map[key].push_back(s);\n        }\n        for(auto it=m
