{t:'s', q:'浏览器验证服务器证书的信任基础（信任锚点）是？', opts:['服务器自己声明可信','操作系统/浏览器预装的根 CA 证书库：站点证书 ← 中间 CA ← 根 CA 逐级验签，链到受信任的根即通过','运营商背书','域名注册商担保'], a:[1], ex:'证书链验证：用上一级 CA 的公钥验证下一级证书的签名，最终到自签名的根证书——根证书预装在系统信任库中，是整个体系的信任起点。除验签外还要核对域名匹配、有效期、吊销状态。抓包工具能解密 HTTPS，正是因为用户手动安装了它的根证书（自愿的中间人）。'},
{t:'s', q:'HTTPS 下中间人攻击（MITM）难以得逞的原因是？', opts:['网络设备会拦截攻击者','中间人若替换公钥则证书签名验不过、伪造证书不在信任链上、原样转发真证书又没有对应私钥无法完成握手','HTTPS 隐藏了服务器 IP','TCP 序列号无法预测'], a:[1], ex:'证书把"域名与公钥的绑定"交给 CA 背书：篡改公钥破坏签名，假证书链不到受信根，转发真证书则在密钥交换阶段卡死（无私钥解不出/签不了）。残余风险来自人与生态：用户手滑点掉告警、根证书库被污染、CA 事故——HSTS（强制 HTTPS、禁止忽略证书告警）与证书透明度用于兜底，防 SSL 剥离降级攻击。'},
{t:'s', q:'XSS 与 CSRF 的本质区别，概括正确的是？', opts:['XSS 攻击服务器，CSRF 攻击浏览器','XSS 是"恶意代码进来"（脚本注入到页面在受害者浏览器执行）；CSRF 是"伪造请求出去"（借浏览器自动携带 Cookie 之便，诱导发出用户不知情的请求）','两者都是 SQL 注入的变种','XSS 只影响 HTTP，CSRF 只影响 HTTPS'], a:[1], ex:'XSS 三型：存储型（入库、危害最大）、反射型（藏在 URL）、DOM 型（前端 innerHTML）；防御核心是输出编码，辅以 CSP、Cookie HttpOnly 止损。CSRF 三前提：已登录 + 凭证自动携带 + 参数可预测；攻击者读不到响应，只能盲打写操作。两者是应用层漏洞，HTTPS 都防不了；XSS 能偷 CSRF Token，因此先治 XSS。'},
{t:'m', q:'防御 CSRF 的有效手段包括？', opts:['CSRF Token：服务端下发随机令牌，请求须携带，藏在跨站读不到的位置','Cookie 设置 SameSite 属性，跨站请求不携带 Cookie','校验 Origin/Referer 头的来源','把接口全部改成 GET 方法'], a:[0,1,2], ex:'CSRF 的命门是"凭证自动携带 + 请求可预测"：Token 打破可预测性（攻击者跨站拿不到）；SameSite 打破自动携带；来源校验直接识别跨站请求；高危操作再加二次确认（密码/验证码）。D 反而更糟：GET 更容易被 img/a 标签触发，且改方法不改变凭证自动携带的事实。'},
{t:'s', q:'强缓存与协商缓存的区别是？', opts:['强缓存要发请求确认，协商缓存不发请求','强缓存（Cache-Control: max-age）有效期内不发请求直接用本地副本；协商缓存发请求带 If-None-Match/If-Modified-Since 验证，未变则返回 304 省去 body','两者都必须发请求','协商缓存只在 HTTPS 下生效'], a:[1], ex:'强缓存命中 = 零请求（from cache），靠 Cache-Control max-age（相对时间，替代 Expires 绝对时间）；过期后走协商：ETag（内容指纹，优先）配 If-None-Match，Last-Modified（秒级精度、改时间会误判）配 If-Modified-Since，服务器判定未变回 304。工程标配：HTML 用 no-cache 每次协商，静态资源文件名带哈希 + 一年强缓存，更新靠换 URL。'},
{t:'s', q:'Cache-Control 中 no-cache 与 no-store 的区别是？', opts:['两者等价，都是禁止缓存','no-cache 是"可以缓存但每次使用前必须协商验证"；no-store 才是真正的"完全不缓存"','no-cache 禁止缓存，no-store 允许缓存','no-store 只对代理生效'], a:[1], ex:'no-cache 的名字有误导性：副本仍会保存，只是每次都要发协商请求（304 则继续用）——适合 HTML 入口文件；no-store 是最严格的禁令，任何副本都不留——用于敏感数据（个人信息、支付页）。另有 public/private 控制代理可否缓存、s-maxage 专管 CDN。'},
{t:'s', q:'正向代理与反向代理的判别标准是？', opts:['按协议区分：HTTP 是正向，HTTPS 是反向','谁配置代理、代理就隐藏谁：正向代理站在客户端一侧（翻墙、内网出口），服务器不知道真实客户端；反向代理站在服务端一侧（Nginx 负载均衡），客户端不知道真实服务器','按部署位置：机房内是正向','正向代理只能加速，反向代理只能加密'], a:[1], ex:'正向代理代表客户端向外请求（客户端主动配置）；反向代理代表服务端接收请求（客户端无感知），用途包括负载均衡、TLS 终结、静态缓存、限流与隐藏后端拓扑。502/504 都发生在反向代理与上游服务之间。CDN 本质是"部署在边缘的反向代理 + 缓存"。'},
{t:'s', q:'网站接入 CDN 的标准方式是？', opts:['把服务器搬到 CDN 机房','把域名 CNAME 到 CDN 厂商的调度域名：厂商 DNS 按用户 LDNS 位置返回就近边缘节点 IP；边缘未命中则逐级回源','在网页里引用 CDN 的 JS 脚本','修改用户的 hosts 文件'], a:[1], ex:'CNAME 接入后，域名解析被引导到 CDN 的智能调度系统，按地理位置/负载返回最近节点。缓存未命中时边缘→区域→源站逐级回源。内容更新三板斧：文件名带哈希（最优）、主动刷新 Purge、预热。HTTPS 站点要把证书部署到 CDN，边缘节点能看到明文——选厂商即选信任边界。'},
{t:'m', q:'关于 DNS 解析，下列说法正确的有？', opts:['客户端到本地 DNS（LDNS）是递归查询（要最终答案）；LDNS 向根/顶级域/权威服务器是迭代查询（逐级要线索）','DNS 查询默认使用 UDP 53 端口；响应超长被截断（TC 位）时改用 TCP，区域传送也用 TCP','CNAME 记录把域名指向另一个域名，是 CDN 接入的关键记录类型','浏览器发起解析时会跳过本机缓存直接问根服务器'], a:[0,1,2], ex:'解析顺序：浏览器缓存 → hosts/系统缓存 → LDNS →（根 → .com 顶级域 → 权威）→ 结果逐级缓存（按 TTL）。递归/迭代分工让终端简单、根服务器不被压垮（D 错）。单包问答用 UDP 省握手；大响应与区域传送走 TCP。防劫持手段：换公共 DNS、HTTPDNS、DNSSEC，HTTPS 证书校验是最后防线。'},
{t:'s', q:'WebSocket 建立连接的方式是？', opts:['直接 TCP 连接后立即收发帧','先发一个带 Upgrade: websocket 头的 HTTP GET 请求，服务器返回 101 Switching Protocols 完成协议升级，之后改用 WebSocket 二进制帧全双工通信','通过 DNS 特殊记录协商','用 UDP 广播发现服务器'], a:[1], ex:'WebSocket 借 HTTP 完成握手（兼容既有端口与基础设施），101 之后与 HTTP 再无关系：帧头最小 2 字节（对比 HTTP 头几百字节）、消息级边界（无需自己拆包）、内置 Ping/Pong 心跳、服务器可主动推送。Sec-WebSocket-Key/Accept 只防误连不是安全机制，生产用 wss。单向低频通知用 SSE 更轻；演进链：短轮询→长轮询→WebSocket。'}
);
BANKS['net-http'].questions.push(
{t:'s', q:'某站点存在存储型 XSS 漏洞，且会话 Cookie 未设置 HttpOnly。攻击者能造成的最直接后果是？', opts:['只能弹个广告，无实质危害','注入的脚本通过 `document.cookie` 读取会话 Cookie 并外传，攻击者携带它即可冒充受害者登录态','攻击者能拿到服务器 root 权限','用户浏览器被永久锁定'], a:[1], ex:'存储型 XSS 入库后对每个访问者执行；Cookie 没有 HttpOnly 意味着脚本可读——会话凭证被偷 = 账号被冒用，这是 XSS 最经典的变现路径。HttpOnly 能止损（脚本读不到），但治本仍是输出编码 + CSP；另注意偷到 Cookie 还能绕过 CSRF Token 防御，所以"先治 XSS"。'},
{t:'s', q:'新版本发布后，部分用户反馈页面还是旧的 JS 逻辑，服务器上文件确认已更新。最可能的原因与工程正解是？', opts:['服务器没重启；重启即可','用户网络劫持；换 HTTPS','浏览器强缓存命中：max-age 未过期期间根本不发请求，自然拿不到新文件；正解是静态资源文件名带内容哈希 + 长强缓存，HTML 入口用 no-cache，更新靠"换 URL"','DNS 没生效；刷新 DNS'], a:[2], ex:'强缓存的命中发生在浏览器本地，服务器端"确认已更新"毫无作用——请求根本没到服务器。工程标配把"更新"转化为"换名字"：app.3f9d2c.js 内容变则哈希变、URL 变，旧缓存自然失效；HTML 每次协商（no-cache + ETag/304）保证入口最新。让用户 Ctrl+F5 只是应急不是方案。'},
{t:'e', q:'【综合】从浏览器地址栏输入 URL 回车到页面完整显示，中间经历了哪些主要步骤？请按顺序完整描述，并指出这条链路上存在哪些层级的缓存。', ans:'主干七步：\n1. URL 解析与本地检查：补全协议、HSTS 列表强制 HTTPS、查浏览器强缓存（Cache-Control 未过期直接用本地副本，流程终止于此）。\n2. DNS 解析：浏览器缓存 → 系统 hosts/缓存 → 本地 DNS（LDNS，递归查询）→ 根 → 顶级域 → 权威服务器（迭代查询），结果按 TTL 逐级缓存；CDN 站点在此经 CNAME 调度返回就近边缘节点 IP。\n3. TCP 三次握手建立连接。\n4. TLS 握手（HTTPS）：交换随机数与套件、验证证书链、（ECDHE）协商会话密钥。\n5. 发送 HTTP 请求：可能命中 CDN 边缘缓存或反向代理缓存；协商缓存未变则 304 省 body；否则源站返回 200 与资源。\n6. 浏览器渲染：HTML→DOM、CSS→CSSOM → 合成渲染树 → 布局（计算几何）→ 绘制；解析中遇到的外链 JS/CSS/图片重复走上述网络流程（HTTP/2 单连接多路并发）。\n7. 连接复用（keep-alive）等待后续请求，或最终四次挥手关闭。\n\n全链路缓存清单：浏览器强缓存/协商缓存 → DNS 多级缓存 → CDN 边缘缓存 → 反向代理缓存 → 应用层缓存（Redis）→ 数据库自身缓存（buffer pool）。\n\n性能优化四类归纳：少发请求（缓存）、就近取（CDN）、降 RTT（TLS1.3、连接复用、HTTP/2/3）、减体积（压缩、304）。'},
{t:'e', q:'【综合】HTTPS 是如何建立安全连接的？请描述 TLS 握手过程、混合加密中两类算法的分工、证书链的验证逻辑，并解释：为什么中间人攻击在证书体系下难以得逞？ECDHE 的"前向安全"是什么？', ans:'TLS（以 1.2 RSA 交换为例）握手：\n1. ClientHello：客户端随机数 C + 支持的加密套件列表；\n2. ServerHello + 证书：服务端随机数 S + 选定套件 + 数字证书（含服务器公钥）；\n3. 客户端验证证书通过后，生成 pre-master 并用服务器公钥加密发送；\n4. 双方用 C、S、pre-master 三个随机数派生出相同的会话密钥；\n5. 互发 Finished（用会话密钥加密的握手摘要）校验握手未被篡改，此后业务数据全部走对称加密 + 完整性校验（AEAD）。TLS1.3 把流程精简为 1-RTT，会话恢复可 0-RTT（有重放风险，只放幂等请求）。\n\n混合加密分工：非对称（RSA/ECDHE）安全但慢百倍，只用来"递钥匙"；对称（AES）快，负责全部数据加密——各取所长。\n\n证书链验证：站点证书 ← 中间 CA ← 根 CA，用上一级公钥验下一级签名，根证书自签名且预装在系统信任库（信任锚点）；另核对域名匹配、有效期、吊销状态。\n\n中间人为何失败：改公钥 → 破坏 CA 签名，验签不过；伪造证书 → 链不到受信根；原样转发真证书 → 没有对应私钥，密钥交换阶段进行不下去。残余风险在人与生态：用户点掉告警、根证书库被污染——HSTS（强制 HTTPS + 禁止忽略告警）与证书透明度兜底。\n\n前向安全（ECDHE）：每次会话用临时密钥对做 DH 协商，会话密钥不经网络传输且用完即弃——即使服务器私钥日后泄露，攻击者存档的历史密文也解不开。RSA 密钥交换做不到这点（私钥一泄、历史全破），因此 TLS1.3 已废除。'}
);
BANKS['os'].questions.push(
{t:'s', q:'操作系统划分用户态与内核态的根本目的是？', opts:['提高 CPU 主频','故障隔离与安全：应用只能执行受限指令、访问本进程空间，特权操作必须经内核校验代办','方便编写程序','节省内存'], a:[1], ex:'CPU 特权级把"能干什么"分层：用户态跑应用（受限指令+本进程地址空间），内核态跑 OS（特权指令+全部内存）。应用越界（如直接访问硬件、碰别人内存）会被硬件拦下，防止一个错误进程拖垮全系统。进入内核只有三个入口：系统调用（主动）、中断（外设异步）、异常（缺页/除零）。'},
{t:'s', q:'printf、malloc 与 read 的层次区别，正确的是？', opts:['三者都是系统调用','printf/malloc 是带缓冲/内存池的库函数（底层才按需调用 write/brk 等系统调用）；read 是系统调用的薄封装','三者都是纯用户态函数，不涉及内核','printf 是内核函数'], a:[1], ex:'库函数在用户态做了大量优化：printf 攒缓冲减少 write 次数，malloc 用内存池避免每次找内核要内存——所以它们不是每次调用都陷入内核。系统调用比普通函数调用贵 1~2 个数量级（陷入/返回、寄存器保存），减少系统调用次数是性能优化的常规思路。'},
{t:'s', q:'"模式切换"与"进程上下文切换"的开销对比，正确的是？', opts:['两者开销相同','模式切换（同一进程内用户态↔内核态）较轻；进程上下文切换要换页表、刷 TLB，开销大得多','进程切换更轻','模式切换需要重启 CPU'], a:[1], ex:'系统调用只是同一进程变换特权级，地址空间不变；进程切换要保存/恢复完整现场并切换页表，TLB 大面积失效后一段时间内访存都变慢——这是"进程切换微秒级、代价重"的主因。线程切换介于两者之间（同进程共享地址空间，不换页表）。'},
{t:'s', q:'Linux 中处于 D 状态（不可中断睡眠）的进程，其特点是？', opts:['可以用 kill -9 立即杀死','连 SIGKILL 都无法响应，通常在等待磁盘 IO 完成；大量 D 状态往往指向 IO 子系统问题','是已经死亡的进程','是被 Ctrl+Z 暂停的进程'], a:[1], ex:'D = uninterruptible sleep：进程在内核中等待不可中断的操作（典型是磁盘 IO/NFS），此时不响应任何信号，kill -9 也无效——只能等操作完成或排查底层 IO。Z 是僵尸（已死待收尸）、T 是停止。load average 统计包含 D 状态任务，所以"load 高但 CPU 不高"要查 IO。'},
{t:'s', q:'时间片轮转调度中，时间片长度的权衡是？', opts:['越短越好','太长退化为先来先服务（交互响应差）；太短则上下文切换开销占比过高——需要折中','越长越好','时间片长度不影响性能'], a:[1], ex:'时间片是响应性与吞吐的调节旋钮：过长时短任务排队久，交互卡顿；过短时 CPU 大量时间耗在切换本身。其他算法的经典问题：FCFS 护航效应、SJF 需预估且长任务饥饿、优先级调度用"老化"防饥饿；多级反馈队列自动区分交互/CPU 型任务；Linux CFS 用红黑树按 vruntime（加权虚拟运行时间）挑最小者实现加权公平。'},
{t:'m', q:'关于进程间通信（IPC）方式，下列说法正确的有？', opts:['共享内存是最快的 IPC：数据零拷贝，但需要信号量等机制自行同步','匿名管道是半双工的，且只能用于有亲缘关系的进程（fd 靠 fork 继承）','信号中 SIGKILL 和 SIGSTOP 不可被捕获或忽略','消息队列要求收发双方必须同时在线'], a:[0,1,2], ex:'IPC 两条路线：内核二传手（管道/消息队列，两次拷贝）vs 共享内存映射（零拷贝最快，配信号量同步）。匿名管道是内核环形缓冲、半双工、限亲缘（shell 的 | 就是它）；命名管道 FIFO 可跨无亲缘进程。D 错：消息队列的消息由内核暂存，双方不必同时在线。socket 是唯一跨主机的 IPC；本机 Unix 域套接字不走协议栈还能传 fd。'},
{t:'s', q:'fork() 的返回值语义是？', opts:['父子进程都返回 0','调用一次返回两次：父进程得到子进程 PID，子进程得到 0，失败返回 -1','父进程返回 0，子进程返回父进程 PID','只在子进程返回'], a:[1], ex:'一次调用、两个进程各自返回：代码用返回值区分身份（`if (pid == 0)` 走子进程分支）。子进程复制父进程的地址空间副本、fd 表（共享文件偏移量）、信号设置。多线程程序 fork 只复制调用线程，其他线程持有的锁可能永远无人释放——因此 fork 后应尽快 exec。'},
{t:'s', q:'fork 能做到微秒级完成的关键机制是？', opts:['内核用 DMA 高速复制内存','写时复制（COW）：fork 只复制页表并把页标记为只读，父子共享物理页；哪方真正写入才触发缺页、复制那一页','子进程不分配内存','fork 实际上不创建新进程'], a:[1], ex:'COW 把"复制整个地址空间"推迟到"真正写入"的那一刻、且只复制被写的页——fork 的即时成本只有页表复制。Redis bgsave 正是借 fork+COW 拿到内存快照：子进程看到冻结的旧页，父进程继续写（写到哪页复制哪页），代价是写压力大时内存最坏接近翻倍。'},
{t:'s', q:'僵尸进程的成因与正确处理方式是？', opts:['子进程死循环；kill -9 杀掉子进程即可','子进程已退出但父进程未调用 wait 回收，残留的 PCB 占用 PID；处理办法是让父进程收尸（SIGCHLD + waitpid 循环）或杀掉父进程让 init 接管','父进程先退出导致；无需处理','内存泄漏导致；重启机器'], a:[1], ex:'僵尸已经死了，kill -9 对尸体无效（A 错）——要处理的是它的父进程。标准写法：父进程注册 SIGCHLD 处理器循环 waitpid(-1, NULL, WNOHANG)，或直接 SIG_IGN 让内核自动回收。区分孤儿进程：父先死、子被 init/systemd 收养并负责 wait，孤儿无害。守护进程的"两次 fork + setsid"正是利用孤儿机制脱离终端。'}
);
BANKS['os'].questions.push(
{t:'m', q:'死锁产生的四个必要条件包括？', opts:['互斥：资源一次只能被一个进程占用','持有并等待：占着已有资源再去申请新资源','不可剥夺：资源不能被强行抢走','循环等待：进程间形成环形的等待链','时间片耗尽'], a:[0,1,2,3], ex:'四条件缺一不可，因此破坏任意一条即可预防死锁：按全局固定顺序申请资源破坏循环等待（最常用）、一次性申请全部资源破坏持有并等待等。四大策略：预防（破条件）、避免（银行家算法）、检测与解除（InnoDB 的等待图回滚）、鸵鸟策略（通用 OS 的现实选择）。E 与死锁无关。'},
{t:'s', q:'银行家算法属于死锁的哪种策略？其核心思想是？', opts:['死锁预防；直接禁止资源共享','死锁避免；试探性分配后检查系统能否找到一个"安全序列"，找不到则回滚拒绝分配','死锁检测；定期扫描等待图','死锁解除；杀死所有进程'], a:[1], ex:'银行家算法在每次分配前模拟：若分配后仍存在某个执行顺序能让所有进程依次拿到最大需求并完成（安全序列），才真正分配。它需要预知每个进程的最大资源需求，运行时开销大，属教学模型；工程上更常见的是死锁检测+回滚（数据库）或加锁顺序约定（预防）。'},
{t:'s', q:'活锁与死锁的区别是？', opts:['是同一个概念','死锁是各方互相等待、全部静止；活锁是各方都在不停动作（如互相礼让重试）却始终无进展——常用随机退避打破对称性','活锁只发生在单线程','活锁比死锁更容易检测'], a:[1], ex:'死锁"卡住不动"，活锁"忙个不停却原地踏步"——典型如两个事务冲突后同时回滚重试、又同时再冲突。解法是引入随机性（随机退避时间）打破同步节奏。再区分饥饿：个别进程因优先级低永远抢不到资源（其他进程正常推进），用"老化"逐步提升等待者优先级解决。'},
{t:'m', q:'虚拟内存机制带来的核心价值包括？', opts:['进程隔离：各进程地址空间独立，互相无法直接访问','地址独立：程序使用统一的虚拟地址，物理内存可任意搬移、共享或做写时复制','内存超卖：借助 swap，进程申请的总内存可超过物理内存','让 CPU 缓存命中率提升一倍'], a:[0,1,2], ex:'虚拟地址经 MMU 查页表翻译为物理地址：隔离（安全的根基）、解耦（共享库映射、COW 都靠它）、超卖（按需分配+换页）。页表项还带权限位/脏位/访问位。代价是翻译开销——由 TLB 缓存翻译结果弥补，多级页表则解决页表本身占内存的问题（空洞不分配下级表）。D 无此关系。'},
{t:'s', q:'程序访问非法地址触发"段错误（SIGSEGV）"，其底层裁决机制是？', opts:['编译器在编译期插入检查代码','MMU 查页表时发现地址无效或权限不符（如写只读页、执行数据页），触发异常，内核判定非法后向进程发送 SIGSEGV','硬盘控制器拒绝访问','杀毒软件拦截'], a:[1], ex:'每次访存都经 MMU 翻译：页表项的有效位、读/写/执行权限位是硬件级关卡。访问未映射地址或违反权限即触发缺页异常，内核检查后发现并非"合法缺页"（如按需分配、COW、swap 换回），就发 SIGSEGV。合法缺页则由内核补页后重新执行该指令，进程无感知。'},
{t:'s', q:'页面置换算法中，FIFO 特有的"Belady 异常"指的是？', opts:['命中率总是最低','分配的页框增多，缺页次数反而可能增加的反直觉现象','只淘汰热页','无法实现'], a:[1], ex:'FIFO 只看进入顺序不看访问频率，特定访问序列下增加页框反而更多缺页——违反"资源越多性能越好"的直觉。LRU 无此异常（栈式算法），接近理论最优 OPT（淘汰未来最久不用的页，不可实现、作基准）。OS 实际用 Clock（时钟）算法：访问位+环形指针给页第二次机会，以近似 LRU 的效果换 O(1) 开销。'},
{t:'s', q:'手写 O(1) 复杂度的 LRU 缓存，标准数据结构组合是？', opts:['数组 + 二分查找','哈希表（O(1) 定位）+ 双向链表（O(1) 摘除与头插），节点冗余存 key 以便淘汰时反删哈希表','单链表 + 栈','红黑树 + 队列'], a:[1], ex:'哈希表 key→链表节点实现 O(1) 查找；双向链表维护访问顺序：命中或写入都移到头部，淘汰从尾部摘除。四个要点：双向链表才能 O(1) 摘中间节点、头尾哨兵免特判、节点里冗余存 key（尾淘汰时才能删哈希表项）、get 也要移动到头部。Redis 则用"采样近似 LRU"（每对象存 24 位时钟，随机采 5 个驱逐最老）省掉全局链表。'},
{t:'s', q:'系统频繁换页、CPU 大部分时间耗在页面调度上导致整体卡死，这种现象称为？', opts:['死锁','抖动（颠簸，thrashing）：页框数小于工作集，对策是降低并发度或增加内存','缓存穿透','优先级反转'], a:[1], ex:'工作集 = 进程近期活跃访问的页集合。物理页框不足以容纳工作集时，刚换出的页马上又要换入，磁盘 IO 打满、CPU 空转等页。vmstat 的 si/so 持续非零是典型信号。对策：减少并发进程数、增大内存，或优化程序局部性。'},
{t:'s', q:'操作系统实际采用的近似 LRU 页面置换算法——用一个访问位和环形指针给页面"第二次机会"——是？', opts:['FIFO 算法','Clock（时钟）算法','LFU 算法','OPT 算法'], a:[1], ex:'精确 LRU 需要每次访存都更新链表，硬件开销不可接受。Clock 算法把页排成环：指针扫过时访问位为 1 则清零放过（第二次机会），为 0 则淘汰。FIFO 不看访问位（有 Belady 异常）；LFU 按频率；OPT 是不可实现的理论最优。三层对照：应用层精确 LRU（哈希+双向链表）、OS 用 Clock 近似、Redis 用随机采样近似——访问频率越高的层，实现越"便宜"。'}
);
BANKS['os'].questions.push(
{t:'s', q:'关于 Linux 文件系统中的 inode，正确的说法是？', opts:['inode 中存放文件名和文件内容','inode 存元数据（权限、大小、时间戳、链接计数、数据块指针），不存文件名——文件名在目录项中，目录本质是"文件名→inode 号"的映射表','每个文件名对应独立的 inode 和数据副本','inode 数量没有上限'], a:[1], ex:'文件名与文件本体（inode+数据块）解耦：同盘 mv 只改目录项、瞬间完成；硬链接就是多个目录项指向同一 inode。inode 数量在格式化时确定——小文件海量场景会出现"df -h 有空间、df -i 满"的 inode 耗尽故障。'},
{t:'m', q:'硬链接与软链接的区别，下列说法正确的有？', opts:['硬链接是同一 inode 的多个名字：链接计数 +1，删除任一名字只是计数 -1，计数归零且无进程打开才真正释放','软链接是独立的小文件，内容是目标路径，目标被删后软链接悬空','硬链接可以跨文件系统、可以链接目录','软链接可以跨文件系统、可以指向目录'], a:[0,1,3], ex:'硬链接受限于 inode 号仅在本文件系统内唯一——不能跨盘；为防目录环也不能链目录（C 错）。软链接按路径间接寻址：灵活（跨盘、链目录）但目标删除即悬空。删除被进程打开的文件时，目录项消失但 inode 与数据仍被 fd 引用——磁盘空间不释放，用 lsof | grep deleted 排查，日志清理应用截断而非 rm。'},
{t:'s', q:'Linux 文件描述符的三层结构（进程 fd 表 → 系统打开文件表 → inode 表）解释了哪个现象？', opts:['文件不能同时被两个进程打开','同一文件被两次 open 得到的 fd 各有独立偏移量；而 fork 出的子进程与父进程共享文件偏移（共享打开文件表项）','fd 数量无限','偏移量存储在 inode 中'], a:[1], ex:'偏移量存在"系统打开文件表"的表项里：两次独立 open 产生两个表项、各自偏移；fork 复制的是 fd 表（指针），父子指向同一表项、共享偏移——重定向和 dup 也是让多个 fd 指向同一表项。inode 表则全局唯一对应文件本体。'},
{t:'s', q:'传统方式发送文件（read 到用户缓冲区再 write 到 socket）涉及的拷贝次数是？', opts:['1 次','2 次 DMA 拷贝 + 2 次 CPU 拷贝，共 4 次，外加 4 次用户态/内核态切换','2 次','0 次'], a:[1], ex:'路径：磁盘→内核页缓存（DMA）→用户缓冲区（CPU）→socket 缓冲区（CPU）→网卡（DMA）。数据在用户态白绕一圈。优化：mmap+write 省 1 次 CPU 拷贝（还能访问内容）；sendfile 全程内核内直达，配合 SG-DMA 后 CPU 拷贝归零——Kafka、Nginx 发静态文件的核心优化。'},
{t:'s', q:'零拷贝技术（如 sendfile）的"零"指的是？以及它的适用限制是？', opts:['DMA 拷贝也为零；无限制','CPU 参与的拷贝为零（DMA 拷贝省不掉）；数据不经过用户态，应用无法查看或修改内容，只适合原样转发的场景','所有内存操作为零；只支持文本文件','网络传输延迟为零；只支持本地回环'], a:[1], ex:'零拷贝消除的是 CPU 搬运和多余的态切换，DMA 硬件拷贝仍然必要。代价是数据对应用不可见——需要加密、压缩、修改内容的场景用不了 sendfile，可退回 mmap+write（页缓存映射进用户空间，省 1 次 CPU 拷贝且可访问内容）。'},
{t:'s', q:'write() 返回成功后断电，数据仍可能丢失的原因是？', opts:['write 有 bug','write 返回只表示数据进入内核页缓存（脏页），实际落盘由内核异步刷新；要保证持久化必须显式调用 fsync','磁盘写入必然丢数据','文件系统不支持持久化'], a:[1], ex:'页缓存是性能支柱：写操作先改内存标脏、批量异步刷盘。代价是"返回成功≠持久化"。数据库等强持久化场景在关键点调 fsync 强制落盘（如 redo log 提交），或用 O_DIRECT 绕过页缓存自管缓冲。这也是 MySQL innodb_flush_log_at_trx_commit、Redis appendfsync 等参数存在的原因。'},
{t:'s', q:'统计访问日志中出现次数最多的前 10 个 IP，经典命令管道是 `awk \'{print $1}\' log | sort | uniq -c | sort -rn | head`。其中第一个 sort 不可省略的原因是？', opts:['为了输出美观','uniq 只合并"相邻"的重复行，不排序则同一 IP 分散各处无法正确计数','sort 能加快 awk 速度','head 要求输入有序'], a:[1], ex:'uniq 的语义是折叠相邻重复行——必须先 sort 把相同行聚在一起，uniq -c 的计数才正确。管道逐段：awk 取第 1 列（IP）→ sort 聚合 → uniq -c 计数 → sort -rn 按次数降序 → head 取前 10。三剑客分工：grep 找行、sed 改行、awk 拆列统计。'},
{t:'s', q:'kill 命令不带参数时默认发送的信号是？', opts:['SIGKILL(9)','SIGTERM(15)','SIGINT(2)','SIGSTOP(19)'], a:[1], ex:'kill 默认发 SIGTERM(15)：进程可捕获并优雅清理（关文件、释放锁）后退出。SIGKILL(9) 不可捕获不可忽略、立即终止——但进程无清理机会，且对 D 状态（不可中断 IO 等待）进程无效；SIGINT 是 Ctrl+C 的中断信号；SIGSTOP 是暂停（同样不可捕获）。运维惯例：先 kill -15 等待，无效再 kill -9。'},
{t:'s', q:'服务器 load average 很高但 CPU 使用率不高，最可能的方向是？', opts:['CPU 主频太低','load 统计包含不可中断（D 状态）任务：大量进程在等磁盘/网络存储 IO——用 iostat 看 %util/await、找 D 状态进程','内存太大','负载值计算错误'], a:[1], ex:'Linux 的 load 不只统计"等 CPU 的任务"，还包括 D 状态任务。load 高 + CPU 闲的组合指向 IO 瓶颈或存储故障（NFS 挂死是常客）。相关排障惯例：CPU 高用 top → top -Hp 定位线程 → 线程号转十六进制对 perf/gdb 堆栈；内存看 free 的 available（buff/cache 可回收），进程无故消失查 dmesg 里的 OOM killer 记录。'}
);
BANKS['os'].questions.push(
{t:'s', q:'磁盘使用率 95%，删除了一个 10GB 的日志文件后 `df -h` 仍显示 95%。原因与正确处理是？', opts:['df 有缓存，等几分钟就好','文件系统坏了，需要 fsck','文件仍被某进程打开：rm 只删目录项，inode 与数据块要等"链接数为 0 且无进程打开"才释放；用 `lsof | grep deleted` 找到进程，重启它或用截断方式清理','磁盘配额限制，需要 root 权限'], a:[2], ex:'这是 inode 机制的名场面：目录项删了，但打开着的 fd 仍引用 inode，空间不释放。lsof | grep deleted 定位持有进程；处理：重启该进程，或对仍在写的日志用截断 `> file`（清内容不换 inode）。预防教训：清理正被写入的日志永远用截断，不用 rm。'},
{t:'s', q:'系统很卡，top 显示 CPU 的 us（用户态）与 sy（内核态）都很低，但 wa（iowait）很高。排查方向是？', opts:['CPU 主频不足，升级 CPU','内存泄漏，重启进程','IO 瓶颈：CPU 在空等磁盘——用 iostat 看设备 %util 与 await，找 D 状态进程，定位慢盘或异常 IO 的应用','网络带宽被打满'], a:[2], ex:'wa 高 = CPU 无事可做、在等 IO 完成，瓶颈在存储不在算力（升级 CPU 无效）。配套证据链：load 高但 CPU 使用率不高（load 统计包含 D 状态任务）、ps 里出现 D 状态进程、iostat 的 %util 接近 100%/await 飙升。方向确定后再区分：是磁盘本身慢，还是某应用在做异常量的 IO（如疯狂刷日志、全表扫描）。'},
{t:'e', q:'【综合】请系统对比进程、线程、协程：定义与本质、资源与调度、上下文切换开销、崩溃影响、通信方式，以及各自的典型适用场景。', ans:'定义与本质：\n- 进程 = 资源分配的基本单位：独立虚拟地址空间、fd 表等；\n- 线程 = CPU 调度的基本单位：从属进程、共享其地址空间，私有栈和寄存器现场（Linux 内核视角是共享资源的轻量 task）；\n- 协程 = 用户态轻量执行流：内核无感知，程序自己调度，主动让出（协作式）。\n\n切换开销：进程 > 线程 > 协程。进程切换要换页表、刷 TLB（微秒级，后遗症是缓存变冷）；线程同空间不换页表；协程用户态保存少量寄存器（纳秒~百纳秒级），这是它支撑万级并发的成本基础。\n\n崩溃影响：进程间隔离，一个崩不连累别人（关键组件进程隔离的依据）；线程崩溃（如段错误）整个进程一起挂；协程异常按语言机制在线程内传播。\n\n通信：进程靠 IPC（管道/消息队列/共享内存+信号量/信号/socket，共享内存最快但要自配同步）；线程直接共享内存 + 锁/原子量；协程通常经 channel 或共享变量（同线程内天然串行）。\n\n调度：进程/线程由内核抢占式调度；协程协作式——不主动让出就独占线程，因此不能有阻塞调用横在中间。\n\n适用场景：需要隔离性/多语言部署 → 多进程；利用多核并行计算 → 多线程（CPU 密集线程数≈核数）；海量并发 IO（网关、爬虫、万级连接）→ 协程（IO 等待期让出，单线程养万协程；但 CPU 密集无收益且不能利用多核，需配多线程，如 Go 的 GMP）。补充：有栈协程（goroutine）可在任意调用层挂起；无栈协程（C++20 co_await）编译成状态机、只能在协程函数内挂起、更省内存。'}
);
BANKS['mysql'].questions.push(
{t:'s', q:'数据库设计三大范式中，第二范式（2NF）的要求是？', opts:['每一列都是不可再分的原子值','在 1NF 基础上，消除非主键列对主键的"部分依赖"（针对联合主键：非主键列必须依赖整个主键）','消除传递依赖','所有表必须有外键'], a:[1], ex:'1NF 列原子；2NF 消除部分依赖（联合主键场景下，某列只依赖主键的一部分就该拆表）；3NF 消除传递依赖（非主键列不能依赖另一个非主键列）。工程上常做反范式冗余（如订单表存商品名称快照）以空间换查询性能——规范是手段不是目的。'},
{t:'s', q:'LEFT JOIN 中对右表的过滤条件写在 ON 与写在 WHERE 的区别是？', opts:['完全等价','写在 ON：先过滤右表再连接，左表仍全量保留（未匹配补 NULL）；写在 WHERE：连接后再过滤，右表为 NULL 的行被滤掉，LEFT JOIN 退化成 INNER JOIN','写在 WHERE 更快，结果相同','写在 ON 会报语法错误'], a:[1], ex:'LEFT JOIN 的语义是保左表全量。WHERE 在连接之后执行，`WHERE 右表.列 = x` 会把"没匹配上（右列为 NULL）"的行一并过滤——左连接名存实亡。经典应用："查没有员工的部门" = LEFT JOIN + WHERE 右表主键 IS NULL。'},
{t:'s', q:'SQL 中 WHERE 与 HAVING 的区别是？', opts:['两者可互换','WHERE 在分组前过滤行、不能使用聚合函数；HAVING 在分组后过滤组、可以使用聚合函数','HAVING 在分组前执行','WHERE 只能用于数字列'], a:[1], ex:'逻辑执行顺序：FROM → WHERE → GROUP BY → HAVING → SELECT → ORDER BY → LIMIT。WHERE 阶段尚未分组，写 `WHERE COUNT(*) > 2` 直接报错；HAVING 面对的是分组后的聚合结果。性能习惯：能在 WHERE 提前过滤的条件不要拖到 HAVING。'},
{t:'s', q:'delete、truncate、drop 的区别，正确的是？', opts:['三者完全等价','delete 是 DML：可带 WHERE、记录日志可回滚；truncate 是 DDL：清空全表并重置自增、不可回滚但更快；drop 连表结构一起删除','truncate 可以回滚','drop 只删除数据保留结构'], a:[1], ex:'delete 逐行删除并写 undo/redo/binlog，事务内可回滚，可加条件；truncate 直接重建表空间，速度快、重置 AUTO_INCREMENT，属 DDL 不可回滚；drop 把表定义与数据一起移除。误删数据的恢复依赖"全量备份 + binlog 重放"。'},
{t:'s', q:'一条查询 SQL 在 MySQL Server 层经过的组件顺序是？', opts:['优化器 → 分析器 → 执行器','连接器（认证/权限载入）→ 分析器（词法语法）→ 优化器（选索引/连接顺序）→ 执行器（查权限后调用存储引擎接口）','执行器 → 分析器 → 优化器','分析器 → 连接器 → 执行器'], a:[1], ex:'连接器管连接与权限快照；"表不存在/列名错"在分析器报出；优化器做基于成本的选择（用哪个索引、多表 join 顺序）；执行器校验权限后按计划逐行调用引擎接口。查询缓存因命中率低已在 8.0 移除。更新语句额外涉及 undo/redo/binlog 与两阶段提交。'},
{t:'s', q:'InnoDB 全面取代 MyISAM 成为默认引擎的原因，不包括？', opts:['支持事务与崩溃恢复（redo log）','支持行级锁，并发写入能力强','聚簇索引组织数据','无条件 count(*) 比 MyISAM 更快'], a:[3], ex:'InnoDB 的胜点：事务/ACID、行锁、崩溃自动恢复、MVCC。MyISAM 仅存的优势恰是 D——它维护了精确行数元数据，无条件 count(*) O(1)；InnoDB 的 count(*) 需要扫描（可见性因事务而异）。但这点小甜头远不敌无事务、表级锁、崩溃易坏表的硬伤。'},
{t:'s', q:'InnoDB buffer pool 的 LRU 链表分为 young/old 两区，新读入的页先进 old 区的目的是？', opts:['加快新页访问','防止全表扫描等一次性访问把热点数据整体冲出缓存（缓存污染）：只有在 old 区停留足够久且再次被访问的页才晋升 young 区','节省内存','兼容旧版本'], a:[1], ex:'朴素 LRU 的缺陷：一次大扫描会把整个缓存刷一遍，真正的热页全被挤走。分区后一次性访问的页在 old 区自生自灭，"短时间内二次访问"才有资格进 young 区——热数据得到保护。这与 Redis 用采样近似 LRU、OS 用 Clock 是同一主题的不同实现。'},
{t:'s', q:'InnoDB 中通过二级索引查询非索引列时的"回表"指的是？', opts:['重新解析 SQL','二级索引叶子节点只存"索引列 + 主键值"，需再用主键回聚簇索引树查完整行数据','把数据写回磁盘','跨库查询'], a:[1], ex:'聚簇索引 = 主键 B+ 树，叶子存整行；二级索引叶子只存索引列和主键。二级索引命中后拿到主键，再走一遍主键树取整行——即回表（多一次树查找）。若查询所需列全部包含在二级索引中则无需回表，称覆盖索引（explain 的 Extra 显示 Using index），是高频查询的重要优化。'},
{t:'s', q:'推荐用"自增短主键"而不是 UUID 做 InnoDB 主键的原因是？', opts:['UUID 不唯一','自增主键顺序追加、页写满自然分裂；UUID 随机插入导致频繁页分裂与碎片，且过长的主键会被冗余存进所有二级索引，撑大整体体积','UUID 无法建索引','自增主键查询语法更简单'], a:[1], ex:'聚簇索引按主键有序组织：自增值永远插在最右侧、顺序 IO 友好；UUID 随机落点造成大量页分裂、页利用率低。此外每个二级索引的叶子都要存一份主键——主键越长，所有索引都跟着膨胀。需要全局唯一 ID 时可用雪花算法（趋势递增）替代 UUID。'}
);
BANKS['mysql'].questions.push(
{t:'m', q:'联合索引 (a, b, c) 存在时，下列哪些查询能用上该索引（至少部分列）？', opts:['WHERE a = 1 AND b = 2 AND c = 3','WHERE a = 1 AND b > 5 AND c = 3（c 能否用到？——a、b 部分能用）','WHERE b = 2 AND c = 3（不含 a）','WHERE a = 1'], a:[0,1,3], ex:'最左前缀原则：索引按 a→b→c 逐层有序，必须从最左列开始连续匹配。A、D 显然可用；B 中 a 等值、b 范围可用索引，但"范围之后的列停止匹配"——c 无法走索引（这正是"等值在前、范围在后"建索引原则的来源）。C 跳过了 a，整个索引失效。'},
{t:'m', q:'下列哪些写法会导致索引失效（无法走索引）？', opts:['对索引列使用函数或运算：WHERE YEAR(create_time) = 2024','隐式类型转换：字符串列与数字比较 WHERE phone = 13800138000','LIKE 前导通配符：WHERE name LIKE \'%abc\'','WHERE id = 100（id 为主键）'], a:[0,1,2], ex:'索引存的是原始值：套函数/运算后引擎无法利用有序性（可改写为范围条件或用函数索引）；varchar 列与数字比较时 MySQL 把"列"转成数字——相当于对列套函数，索引失效（反之数字列遇字符串参数则参数转型、索引仍可用）；前导 % 使前缀无从匹配。其余失效场景还有：OR 连接非索引列、违反最左前缀、字符集不一致。'},
{t:'s', q:'索引下推（ICP，Index Condition Pushdown）的作用是？', opts:['把索引整体下移到磁盘','把本需回表后在 Server 层判断的条件，下推到存储引擎层利用索引列先过滤，减少回表次数','把 WHERE 条件推给客户端执行','自动创建缺失的索引'], a:[1], ex:'例：索引 (name, age)，查询 WHERE name LIKE \'张%\' AND age = 10。无 ICP 时按 name 前缀命中的每条记录都要回表后再判 age；有 ICP 时在索引里就用 age 过滤，只有通过者才回表。explain 的 Extra 显示 Using index condition。'},
{t:'s', q:'ACID 四特性与其实现机制的对应关系，正确的是？', opts:['原子性靠 redo log，持久性靠 undo log','原子性靠 undo log（逻辑日志记逆操作，回滚倒序执行）；持久性靠 redo log（WAL：提交先落日志，崩溃后重放）；隔离性靠锁 + MVCC；一致性是前三者加业务约束共同达成的目标','四者都靠 binlog','一致性靠主从复制'], a:[1], ex:'undo 记"怎么撤销"（还兼任 MVCC 版本链）；redo 记"改了什么物理页"（顺序写代替随机写，先日志后数据）；隔离性由锁与多版本并发控制配合；一致性（C）是目的而非独立机制。补充：redo 是环形固定大小，写满会强制刷脏页造成写入抖动；长事务会让 undo 无法清理、膨胀。'},
{t:'s', q:'事务并发的三大读问题中，"不可重复读"与"幻读"的区别是？', opts:['是同一个问题','不可重复读针对"同一行被别的事务修改"（两次读同一行值不同）；幻读针对"结果集行数变化"（别的事务插入/删除了满足条件的行）','幻读只发生在读未提交级别','不可重复读比幻读严重'], a:[1], ex:'脏读 = 读到未提交数据；不可重复读 = 同行两次读值不同（UPDATE 引起）；幻读 = 同条件两次查询行数不同（INSERT/DELETE 引起）。区分的意义在于解决手段不同：锁住已有行防不了"凭空出现"的新行——防幻读需要间隙锁或串行化。'},
{t:'s', q:'MySQL InnoDB 的默认事务隔离级别是？', opts:['读未提交（Read Uncommitted）','读已提交（Read Committed）','可重复读（Repeatable Read）','串行化（Serializable）'], a:[2], ex:'InnoDB 默认 RR：事务首个快照读时创建 Read View 并全程复用，保证可重复读；RC 则每条语句新建 Read View（能看到别人已提交的最新数据）。互联网公司常改用 RC：间隙锁更少、死锁率更低，前提是 binlog 用 ROW 格式。Oracle/PostgreSQL 默认 RC。'},
{t:'s', q:'MVCC 判断某行版本对当前事务是否可见，依赖的"三件套"是？', opts:['锁、日志、缓存','行的隐藏字段（trx_id/roll_pointer）+ undo log 版本链 + Read View（活跃事务集合）','主键、外键、索引','binlog、redo log、relay log'], a:[1], ex:'每行隐藏 trx_id（最后修改事务）与 roll_pointer（指向 undo 里的旧版本，串成版本链）；Read View 记录创建时刻的活跃事务集合。可见性判定：自己改的可见、创建前已提交的可见、活跃中或之后开启的不可见——不可见就沿版本链回溯找旧版本。这实现了"读不加锁、读写不冲突"。'},
{t:'s', q:'快照读与当前读的区别是？', opts:['没有区别','普通 SELECT 是快照读：走 MVCC 读历史版本、不加锁；UPDATE/DELETE/SELECT ... FOR UPDATE 是当前读：读最新已提交版本并加锁','快照读需要加表锁','当前读不存在于 InnoDB'], a:[1], ex:'快照读读的是 Read View 决定的一致性视图；而修改操作必须基于最新数据，属当前读且加行锁/临键锁。RR 级别下的幻读防护是"双轨制"：快照读靠 MVCC、当前读靠临键锁（Next-Key Lock）各自防住；但先快照读后当前读的混用仍有幻读窗口——当前读会看到快照里没有的新行。'},
{t:'s', q:'InnoDB 的行锁实际加在什么上面？由此推出的重要结论是？', opts:['加在物理行地址上；与索引无关','加在索引记录上；若 UPDATE/DELETE 的条件列没有索引，将退化为近似锁全表（对所有行加锁）','加在表空间上；粒度最小是页','加在主键上；二级索引不加锁'], a:[1], ex:'行锁挂在索引项上：条件走不了索引时，引擎只能全表扫描并给扫过的记录全部加锁（RR 下还加间隙锁）——并发瞬间跌到冰点。这是"UPDATE 条件列必须有索引"的硬性理由。补充：唯一索引等值命中退化为纯记录锁；等值不存在时退化为间隙锁。'}
);
BANKS['mysql'].questions.push(
{t:'s', q:'InnoDB 间隙锁（Gap Lock）的特点是？', opts:['锁住已存在的行，防止被修改','锁住索引记录之间的开区间，只阻止其他事务在区间内插入新行；间隙锁彼此兼容（两个事务可持有同一间隙的锁）','等价于表锁','只在读未提交级别生效'], a:[1], ex:'间隙锁是 RR 级别防幻读（当前读路径）的武器：锁"空隙"防止凭空插入。它不互斥的特性暗藏杀机——两个事务同时拿到同一间隙锁后互相往里插入，互等对方释放 = 经典死锁姿势。RC 级别基本没有间隙锁（死锁更少的原因）。临键锁 Next-Key = 记录锁 + 前面的间隙，是 RR 加锁的基本单位。'},
{t:'s', q:'线上执行 DDL 前必须先检查长事务，原因与 MDL（元数据锁）有关，具体是？', opts:['DDL 会删除数据','查询/DML 持有 MDL 读锁；DDL 需要 MDL 写锁——有长事务未提交时 DDL 拿不到写锁而阻塞，且它排队后会挡住后续所有新查询，全表瘫痪','MDL 锁会锁住整个数据库','长事务会自动回滚 DDL'], a:[1], ex:'MDL 保护表结构一致性：读读兼容、写与一切互斥。危险链条：长事务持 MDL 读锁 → DDL 排队等写锁 → 后续所有请求排在 DDL 之后 → 连查询都被卡死。预防：DDL 前查 information_schema.innodb_trx 杀长事务、设 lock_wait_timeout，大表用 online DDL / gh-ost。'},
{t:'s', q:'redo log 与 binlog 的区别，正确的是？', opts:['两者都是 Server 层日志','redo log 是 InnoDB 私有的物理日志、环形覆写、用于崩溃恢复；binlog 是 Server 层通用的逻辑日志、追加保留、用于主从复制与时间点恢复','binlog 是物理日志','redo log 用于主从复制'], a:[1], ex:'redo 记"某页某处改成某值"（物理），空间固定循环使用，保证已提交事务不丢（崩溃后重放）；binlog 记逻辑变更（ROW 格式记行前后镜像），追加不覆盖，是复制和"全量备份+增量重放"恢复的基础。undo 则负责回滚与 MVCC。三日志职责互不可替代。'},
{t:'s', q:'redo log 与 binlog 之间采用"两阶段提交"（redo prepare → 写 binlog → redo commit）的原因是？', opts:['提升写入速度','保证两份日志的一致性：若先写完 redo 就崩溃，主库恢复了数据但 binlog 缺失，从库少数据；若先写完 binlog 崩溃，从库重放了主库没提交的变更，从库多数据','节省磁盘空间','兼容 MyISAM'], a:[1], ex:'两份日志各自独立落盘，中间任意时刻崩溃都可能造成主从不一致——两阶段提交用"prepare 状态 + binlog 是否完整"做裁决：恢复时发现 redo 处于 prepare 且 binlog 完整则提交（从库可能已拿到），binlog 不完整则回滚。金融场景配"双 1"（redo 每提交 fsync + sync_binlog=1），靠组提交合并 fsync 扛并发。'},
{t:'s', q:'explain 输出中，type 列的性能等级排序（好→差）正确的是？', opts:['ALL > index > range > ref','const > eq_ref > ref > range > index > ALL','ref > const > ALL > range','index > const > range > ALL'], a:[1], ex:'const（主键/唯一索引等值，最多一行）最优；eq_ref（join 时按主键/唯一索引匹配）；ref（普通索引等值）；range（索引范围扫描）；index（扫全索引——注意它是"坏"的，别与 Extra 里的 Using index 覆盖索引混淆）；ALL 全表扫描最差。优化底线：至少到 range。Extra 出现 Using filesort/Using temporary 需要优化。'},
{t:'s', q:'深分页 `LIMIT 1000000, 10` 慢的原因与优化方案是？', opts:['LIMIT 语法本身慢；换用 OFFSET','需取出前 1000010 行再丢弃前 100 万行；优化：游标法 WHERE id > 上页末尾 ID LIMIT 10（连续翻页），或延迟关联——子查询用覆盖索引只取主键再回表（支持跳页）','数据库缓存太小；加内存','磁盘太慢；换 SSD'], a:[1], ex:'OFFSET 的本质是"取出来再扔掉"，扫描与回表都白做。游标法把"跳过 N 行"变成"从某个索引位置开始"，代价 O(10)；延迟关联 `JOIN (SELECT id ... LIMIT 1000000,10) t` 让丢弃阶段只发生在覆盖索引上（无回表），再对最终 10 个 id 回表。'},
{t:'s', q:'MySQL 主从复制的标准流程（三线程模型）是？', opts:['主库直接写从库磁盘','主库 dump 线程推送 binlog → 从库 IO 线程接收写入 relay log（中继日志）→ 从库 SQL 线程回放 relay log','从库定时全量拷贝主库数据','客户端双写主从'], a:[1], ex:'异步复制是默认模式：主库提交不等从库，宕机可能丢尾部事务；半同步要求至少一个从库"收到"binlog（注意不是回放完）才向客户端确认；GTID 用于定位复制位点，并行复制缓解延迟。衍生问题"写后读不到自己"：强制走主库、会话粘性或 GTID 等位。'},
{t:'s', q:'MySQL 中记录数据变更、用于主从复制和时间点恢复的 Server 层逻辑日志是？', opts:['redo log','undo log','binlog','relay log'], a:[2], ex:'binlog 是 Server 层通用日志，三种格式：STATEMENT 记 SQL 语句（NOW()/UUID() 会导致主从不一致）、ROW 记行前后镜像（默认，Canal 等订阅工具依赖它）、MIXED 自动切换。时间点恢复 = 最近全量备份 + 重放其后的 binlog。redo/undo 是 InnoDB 引擎私有日志（崩溃恢复/回滚）；relay log 是从库接收 binlog 的中继暂存，并非主库所记。'},
{t:'s', q:'分库分表后的"跨库全局唯一 ID"，雪花算法（Snowflake）的构成与注意点是？', opts:['随机 128 位；无注意点','时间戳 + 机器 ID + 序列号拼成 64 位整数，趋势递增适合做主键；注意时钟回拨会产生重复 ID，需要处理','自增步长；需要单点发号器','UUID 截断；无需协调'], a:[1], ex:'雪花 ID 天然有序（利于 B+ 树插入）、本地生成无单点。时钟回拨是经典隐患：机器时间被 NTP 往回调后可能发出重复 ID——方案有等待追平、备用位、报警拒发。分片键则按主查询路径选（订单库按 user_id），跨片查询靠基因法/异构冗余表/ES。'}
);
BANKS['mysql'].questions.push(
{t:'s', q:'表上有联合索引 (a, b)。执行 `SELECT * FROM t WHERE a = 1 ORDER BY b;`，排序阶段的行为是？', opts:['必须 Using filesort 额外排序','无需额外排序：a 等值定位后，该范围内的记录在索引中天然按 b 有序，顺序扫描即得排序结果','需要建临时表排序','取决于表的行数，优化器随机选择'], a:[1], ex:'联合索引按 (a, b) 字典序组织：a 固定后 b 有序——ORDER BY b 被索引"白送"。这是"用索引消除 filesort"的标准手法：让 WHERE 的等值列 + ORDER BY 列构成索引最左前缀。若写 ORDER BY c（不在索引中）或 a 是范围条件，则退回 filesort。explain 的 Extra 无 Using filesort 即验证成功。'},
{t:'s', q:'RR（可重复读）隔离级别下：事务 A 先 `SELECT COUNT(*)` 得 10；随后事务 B 插入一行并提交；A 再次执行普通 `SELECT COUNT(*)`。A 看到的结果是？', opts:['11：B 已提交所以可见','10：普通 SELECT 是快照读，复用事务开始时的 Read View，看不到之后提交的插入','报错：检测到幻读','随机 10 或 11'], a:[1], ex:'RR 下事务复用首个快照读创建的 Read View——B 的事务在视图之后提交，判定不可见，A 两次读结果一致（这正是"可重复读"的含义，顺带挡住了快照读路径的幻读）。但若 A 第二次用 `SELECT ... FOR UPDATE`（当前读），会读最新数据得到 11 并加临键锁——"先快照读后当前读"的混用窗口是 RR 幻读讨论的核心细节。'},
{t:'e', q:'【综合】执行 `UPDATE t SET c = c + 1 WHERE id = 5;`（id 为主键），请描述这条语句在 MySQL（InnoDB）中的完整执行链路——从连接层到日志落盘，并解释 WAL 与两阶段提交各自解决什么问题。', ans:'完整链路：\n1. 连接器：校验身份、载入权限。\n2. 分析器：词法/语法解析（表名列名错在此报出）。\n3. 优化器：选择访问路径——此处走主键索引点查。\n4. 执行器：校验表权限后调用 InnoDB 接口。\n5. InnoDB 读数据页：目标页不在 buffer pool 则从磁盘读入（16KB 页，LRU 分 young/old 区管理）。\n6. 记 undo log：保存旧值的逆操作——供回滚与 MVCC 版本链使用。\n7. 在 buffer pool 中修改数据页（此后为脏页，异步刷盘）。\n8. 写 redo log，状态 prepare（物理日志：某页某处改成某值）。\n9. 写 binlog（Server 层逻辑日志，ROW 格式记行前后镜像）。\n10. redo log 置为 commit，向客户端返回成功——注意此时数据页可能还没落盘，但日志已持久化。\n\nWAL（先写日志后写数据）解决什么：数据页是随机写、日志是顺序追加——用顺序 IO 换随机 IO，性能大增；崩溃后凭 redo 重放即可恢复已提交事务（持久性），脏页可以从容异步刷。\n\n两阶段提交解决什么：redo 与 binlog 是两份独立日志，中间崩溃会主从不一致——先 redo 就崩：主库有数据、binlog 没有 → 从库少数据；先 binlog 就崩：从库回放了主库未提交的变更 → 从库多数据。两阶段提交的恢复裁决：redo 处于 prepare 且 binlog 完整 → 提交；binlog 不完整 → 回滚。金融场景配"双 1"（redo 每次提交 fsync + sync_binlog=1），靠组提交合并 fsync 支撑并发。'}
);
BANKS['redis'].questions.push(
{t:'s', q:'实现"排行榜"（按分数排序、支持范围取名次）最合适的 Redis 数据类型是？', opts:['String','Hash','List','ZSet（有序集合）'], a:[3], ex:'ZSet 为每个成员维护分数并按分数有序：ZADD 更新分数、ZRANGE/ZREVRANGE 取名次段、ZRANK 查排名，天然契合排行榜与延迟队列（分数存时间戳）。其他常见对位：String 缓存/计数（INCR）/分布式锁（SETNX）、Hash 对象字段级修改（购物车）、List 消息列表、Set 去重与交并差（共同关注）。'},
{t:'s', q:'Redis 的 SDS（简单动态字符串）相比 C 字符串的优势，不包括？', opts:['头部记录 len，获取长度 O(1)','记录已分配空间，追加前检查并扩容，杜绝缓冲区溢出','二进制安全：内容可包含 \\0，能存图片等任意字节','自动压缩字符串内容以节省内存'], a:[3], ex:'SDS 结构 = len + alloc + 字节数组：O(1) 长度（C 字符串要 strlen 扫描）、扩容检查防溢出、以 len 而非 \\0 判定结尾所以二进制安全。D 无此功能——Redis 的省内存手段是编码切换（小对象用 int/embstr/listpack 等紧凑编码，变大才转 hashtable/skiplist）。'},
{t:'s', q:'Redis 字典扩容采用"渐进式 rehash"的原因与做法是？', opts:['一次性迁移更快但代码复杂','单线程模型下一次性迁移海量键会长时间阻塞服务；渐进式维护新旧两张表，每次增删改查顺带迁移一桶，新增只写新表，把迁移成本摊到日常操作中','为了兼容旧版本','为了节省内存'], a:[1], ex:'Redis 命令执行是单线程，百万级键一次性 rehash 会卡顿数百毫秒——对外表现为服务抖动。渐进式 rehash 期间查找先查旧表再查新表，写入只进新表，配合定时任务逐步搬完。这是"大任务摊销化"思想的经典落地。'},
{t:'s', q:'ZSet 的底层实现选择跳表（skiplist）而不是红黑树的原因是？', opts:['跳表查询复杂度更优','实现简单（随机层数、无旋转调整），且底层本就是有序链表，范围查询（ZRANGE）沿链遍历天然高效；并且 ZSet 同时配一个字典实现 O(1) 按成员查分数','红黑树不支持排序','跳表不占内存'], a:[1], ex:'两者查询都是 O(log n)，跳表胜在工程性：插入删除只改指针无需旋转，范围操作直接顺链走。ZSet 是"双结构"：跳表管排序与范围、字典管成员→分数的 O(1) 查询，空间换时间。'},
{t:'s', q:'Redis 6.0 引入多线程后，其线程模型的准确描述是？', opts:['命令执行也改为多线程并发','多线程只用于网络 IO 的读写与协议解析，命令执行仍是单线程——因此单条命令的原子性保证不变','完全退回单线程','每个 key 一个线程'], a:[1], ex:'Redis 快的根基：纯内存 + 高效数据结构 + 单线程免锁免切换 + epoll 事件循环。瓶颈逐渐移到网络 IO，6.0 把读写 socket 并行化，但命令仍串行执行——不需要锁、原子性语义不变。使用侧配合：禁用 KEYS 用 SCAN、大 key 删除用 UNLINK（异步）。'},
{t:'s', q:'RDB 持久化通过 bgsave 生成快照时，Redis 仍能继续处理写命令的机制是？', opts:['写命令被暂停排队','fork 子进程借助写时复制（COW）：子进程看到 fork 瞬间的冻结内存视图负责落盘，父进程继续服务，写到哪页才复制哪页','双倍内存常驻','写请求转发到从库'], a:[1], ex:'bgsave = fork + COW：子进程遍历的是快照视图，父进程的写入触发页复制互不干扰。代价：大内存实例 fork 本身有停顿（页表复制），写压力大时内存最坏接近翻倍——maxmemory 建议设物理内存的 60~70% 留余量。RDB 文件小恢复快，但丢失最后一次快照之后的数据。'},
{t:'s', q:'AOF 的 appendfsync everysec（默认）策略的含义与代价是？', opts:['每条命令都 fsync，绝不丢数据','每秒批量 fsync 一次：性能与安全的折中，宕机最多丢约 1 秒的写入','从不 fsync，交给操作系统','每分钟 fsync 一次'], a:[1], ex:'AOF 三档：always 每命令刷盘最安全最慢；everysec 折中（最多丢 1 秒）；no 交给 OS 最快最险。AOF 文件靠重写压缩：fork 子进程按当前内存生成最小命令集。混合持久化（重写后的 AOF = RDB 头 + 增量命令尾）兼得恢复快与丢失窗口小。'},
{t:'m', q:'关于 Redis 哨兵（Sentinel）与集群（Cluster），下列说法正确的有？', opts:['哨兵负责监控与自动故障转移：主观下线 → 达到 quorum 判客观下线 → 选举领头哨兵执行切换','哨兵通常部署至少 3 个且为奇数，领头选举需要全体哨兵的多数派','Cluster 用 16384 个哈希槽分片，key 按 CRC16 取模映射到槽','Cluster 中多 key 命令可以随意跨槽执行'], a:[0,1,2], ex:'哨兵解决高可用（主从切换），Cluster 解决容量与写扩展（分片）。多 key 命令（MSET、事务、Lua）要求所有 key 落在同一槽——用 hash tag（如 {user1000}.xx）强制同槽，D 错。客户端按 MOVED/ASK 重定向找对节点；主从复制本身是异步的，主挂可能丢尾部数据，脑裂用 min-replicas-to-write 缓解。'},
{t:'s', q:'Redis 对过期 key 的删除策略是"惰性删除 + ____"的组合。空缺处应填？', opts:['定时删除（为每个 key 设独立定时器）','定期删除（周期性抽样检查过期字典）','同步全量扫描删除','引用计数归零删除'], a:[1], ex:'惰性删除（访问时检查）零后台成本但冷 key 会滞留；定期删除每 100ms 从过期字典抽约 20 个检查，过期比例超 25% 则继续抽，并限制时间片防止阻塞。A 的"每 key 一个定时器"内存与 CPU 代价过高，Redis 未采用；从库不主动删过期 key，等主库同步 DEL。大量 key 同时过期会造成延迟毛刺——设置过期时间要加随机抖动。'}
);
BANKS['redis'].questions.push(
{t:'s', q:'Redis 达到 maxmemory 后的默认行为，以及做缓存时的推荐淘汰策略是？', opts:['默认随机删除；推荐 volatile-ttl','默认 noeviction（内存满后写命令报错）；缓存场景标配 allkeys-lru','默认 allkeys-lru；推荐 noeviction','默认删除最大的 key'], a:[1], ex:'八种策略 = {allkeys, volatile} × {lru, lfu, random} + volatile-ttl + noeviction（默认，保数据不保可用性）。做纯缓存应改 allkeys-lru：全体 key 按近似 LRU 驱逐。volatile 系只驱逐设了过期时间的 key，一旦没有可驱逐对象照样报错。'},
{t:'s', q:'Redis 的 LRU/LFU 淘汰与教科书实现的区别是？', opts:['完全相同的双向链表实现','LRU 是采样近似：每对象存 24 位时钟，随机采样 5 个驱逐最久未用的（省去全局链表）；LFU 用 8 位对数计数器（越大越难增长）加定期衰减（防"过气网红"长期霸占）','Redis 未实现任何淘汰算法','用红黑树精确排序'], a:[1], ex:'全局精确 LRU 链表要为每次访问付出维护成本并占额外内存，Redis 选择概率近似：采样足够好且零链表开销。LFU 的对数计数解决"计数溢出与新老 key 不公平"，衰减机制让历史热点逐渐让位。三层对照：应用层精确 LRU、OS 的 Clock、Redis 的采样——频率越高实现越轻。'},
{t:'s', q:'缓存穿透的定义与针对性方案是？', opts:['热点 key 过期瞬间大量请求打到数据库；加互斥锁','查询"数据库中根本不存在"的数据，缓存永远无法命中，恶意流量直接穿到数据库；方案：参数校验 + 空值短缓存 + 布隆过滤器','缓存整体宕机；上集群','缓存和数据库数据不一致；延迟双删'], a:[1], ex:'穿透的特征是"数据不存在"——正常缓存逻辑对它无效。三板斧：入口参数合法性校验；对"查无此数据"也缓存一个短 TTL 空值；布隆过滤器把全量合法 key 预先编码，"判定不存在"的请求直接拒绝。A 描述的是击穿，C 是雪崩，D 是一致性问题。'},
{t:'m', q:'关于布隆过滤器（Bloom Filter）的特性，下列说法正确的有？', opts:['判定"不存在"绝对准确（不会漏判）','判定"存在"可能误判（哈希冲突导致假阳性）','标准布隆过滤器不支持删除元素','它精确存储了每个元素的完整内容'], a:[0,1,2], ex:'布隆过滤器用 k 个哈希函数把元素映射到位数组置 1：查询时任一位为 0 必不存在（可靠的否定）；全为 1 只能说"可能存在"（其他元素可能恰好置了这些位）。删除会误伤共享位，标准实现不支持（计数布隆是变种）。以极小内存换概率判断，是穿透防护的经典组件。'},
{t:'s', q:'缓存击穿（热点 key 过期瞬间大量并发直击数据库）的两种主流方案是？', opts:['加大数据库连接池；升级硬件','互斥锁：只放一个请求去重建缓存，其余等待；逻辑过期：物理上不设过期，值里存过期时间，发现过期后返回旧值并异步重建','把所有 key 设为永不过期；定期重启','用布隆过滤器拦截'], a:[1], ex:'击穿是"单个热点 key + 过期瞬间"的并发问题。互斥锁保证重建只做一次（简单但等待期间有延迟）；逻辑过期用"稍旧的数据"换"永不阻塞"（最终一致）。布隆过滤器针对的是"不存在的数据"（穿透），对存在但过期的热点无效。'},
{t:'s', q:'缓存雪崩的成因与组合对策是？', opts:['单个 key 太大；拆分 key','大量 key 同时过期或 Redis 整体宕机，请求洪峰砸向数据库；对策：过期时间加随机抖动、多级缓存、哨兵/集群保高可用、限流降级熔断兜底','数据库主从延迟；强制读主','客户端重试太多；去掉重试'], a:[1], ex:'雪崩是"面"的失效（对比击穿是"点"）。两种成因两手抓：集中过期 → TTL 加随机值打散；实例宕机 → 高可用架构（哨兵/集群）。同时要有兜底：接口限流、服务降级、熔断，保证数据库不被打死。'},
{t:'s', q:'"缓存与数据库双写一致性"的主流方案是"先更新数据库，再删除缓存"，选择"删缓存"而非"改缓存"、"先更新库"而非"先删缓存"的原因是？', opts:['删除操作速度更快','改缓存易产生并发写覆盖且可能更新不被读到的冷数据；先删缓存则在"删后更新前"的窗口里，并发读会把旧值重新填回缓存造成长期不一致','缓存不支持更新操作','数据库不允许先更新'], a:[1], ex:'删除是幂等且轻量的"失效"语义，下次读时按需回填。"先删后更"的经典事故：A 删缓存 → B 读 miss 回源读到旧值并回填 → A 才更新库——缓存里长期留着旧值。"先更后删"仍有极小窗口，可用延迟双删（更新后延时再删一次）或订阅 binlog（Canal）异步删除兜底，目标是最终一致。'},
{t:'s', q:'用 Redis 实现分布式锁的正确加锁命令是？', opts:['先 GET 判断再 SET','SET key uniqueValue NX PX 30000 —— 一条原子命令同时完成"不存在才设置 + 过期时间 + 唯一持有者标识"','SETNX key 1 然后 EXPIRE key 30','INCR key'], a:[1], ex:'三要素缺一不可：NX 保证互斥且与设值原子（A、C 两步操作间可能崩溃，留下永不过期的死锁）；PX 过期防持有者宕机死锁；唯一值（如 UUID）标识持有者——解锁时必须用 Lua 脚本"先验值再删"，防止误删别人的锁（自己的锁已过期、别人已持有）。'},
{t:'s', q:'分布式锁的"看门狗（watchdog）续期"机制解决的问题是？', opts:['锁的价格问题','业务执行时间超过锁的过期时间，锁提前失效被他人抢走；看门狗在持有期间定期自动延长过期时间，任务完成或客户端崩溃则停止续期','Redis 内存不足','网络延迟'], a:[1], ex:'过期时间设短了业务没跑完锁就没了，设长了崩溃后死锁久——看门狗（如 Redisson 实现）动态续期化解两难。残余风险：主从异步复制下，主节点写锁成功未同步就宕机，新主上锁"消失"——高并发场景用 Redis 锁 + 业务幂等兜底；强互斥需求换 ZooKeeper/etcd（多数派写入）。'}
);
BANKS['redis'].questions.push(
{t:'s', q:'秒杀扣库存的实现：先 `GET stock` 判断大于 0，再 `DECR stock`。高并发下的问题是？', opts:['没有问题，Redis 是单线程的','GET 与 DECR 是两条独立命令，判断与扣减之间可插入其他请求——多个请求同时通过判断导致超卖；正解是 Lua 脚本把"判断+扣减"原子执行（或 DECR 后判负回补）','Redis 不支持并发访问','GET 命令会加锁阻塞其他请求'], a:[1], ex:'Redis 单线程保证的是"单条命令原子"，不保证"多条命令间无插队"——check-then-act 的竞态与 C++ 里先 if 再操作共享变量是同一类错误。Lua 脚本在服务端原子执行整段逻辑，是标准解法；简单场景也可先 DECR 再判断返回值（负数说明超了，回补并拒绝）。这个模式同样解释了分布式锁为什么必须用一条 `SET key val NX PX` 而非 SETNX+EXPIRE 两条。'},
{t:'e', q:'【综合】缓存与数据库的双写一致性：请给出主流方案并论证——为什么用"删除缓存"而不是"更新缓存"？为什么"先更新数据库再删缓存"而不是"先删缓存再更新数据库"？还有哪些兜底手段？', ans:'主流方案：旁路缓存（Cache Aside）+ 先更新数据库、再删除缓存，追求最终一致。\n\n为什么"删"优于"改"：\n1. 并发写时两次"更新缓存"的到达顺序可能与数据库提交顺序相反，缓存留下旧值；删除是幂等的"失效"语义，无顺序问题；\n2. 缓存值可能是多表加工的结果，写库时同步算缓存浪费；冷数据更新后可能根本没人读——删除让下次读时按需回填，天然懒加载。\n\n为什么"先更库再删缓存"：反例推演——先删缓存后更库的窗口期：A 删缓存 → B 读 miss、回源读到旧值并回填缓存 → A 才提交新值：缓存里的旧值一直留到下次失效，不一致时间可能很长。而先更库再删缓存，仅在"B 回源旧值且回填晚于 A 删除"这种极小概率交错下短暂不一致。\n\n兜底手段：\n1. 延迟双删：更新库、删缓存后，延时几百毫秒再删一次，清掉窗口期被回填的旧值；\n2. 订阅 binlog 异步删除（Canal）：由数据库变更事件驱动删缓存，与业务代码解耦、不怕删除失败漏删（可重试）；\n3. 删除失败重试队列 + 缓存设置兜底过期时间（最终总会失效）。\n\n认知边界：只要用缓存就只能承诺最终一致；需要强一致的读要么直读数据库，要么上分布式锁牺牲吞吐。'}
);
BANKS['design'].questions.push(
{t:'s', q:'六大设计原则中被视为"核心目标"的开闭原则（OCP），其含义是？', opts:['类要么开放要么关闭','对扩展开放、对修改关闭：新增需求通过"加代码"（新类/新实现）满足，而不是"改旧代码"','所有成员都应该 public','接口越多越好'], a:[1], ex:'改旧代码会波及已验证的逻辑、需要回归测试；通过抽象（接口/基类）+ 新实现类扩展则风险隔离。工厂方法对简单工厂的改进、策略模式对 if-else 的收敛，本质都是奔着开闭去的。其余原则（单一职责、里氏替换、依赖倒置、接口隔离、迪米特）可视为达成开闭的手段。'},
{t:'s', q:'"正方形继承矩形"是违反哪个原则的经典反例？', opts:['单一职责原则','里氏替换原则：子类必须能透明替换父类——setWidth 不改变 height 的父类契约被正方形破坏','迪米特法则','接口隔离原则'], a:[1], ex:'矩形的行为契约是宽高独立可设；正方形为维持四边相等必须联动修改，凡依赖"改宽不动高"的代码换成正方形就出错——数学上的 is-a 不等于行为上的 is-a。里氏替换是继承正确性的试金石：不能透明替换就不该用继承（改用组合）。'},
{t:'s', q:'依赖倒置原则（DIP）的准确表述是？', opts:['下层模块依赖上层模块','高层与低层模块都依赖抽象（接口），而不是高层直接依赖低层的具体实现；依赖注入（DI）是它的落地手段','所有依赖必须反向','禁止模块间有任何依赖'], a:[1], ex:'"倒置"指依赖箭头从"指向具体"改为"指向抽象"：业务层依赖 Storage 接口而非 MySQLStorage 具体类，具体实现从外部注入。收益：可替换（换 Redis 实现不改业务）、可测试（注入 mock）。构造函数注入是最常见形式。'},
{t:'s', q:'GoF 23 种设计模式按目的分为三大类，正确的划分是？', opts:['创建型（单例/工厂/建造者/原型——管对象怎么"生"）、结构型（适配器/装饰器/代理/外观——管怎么"组装"）、行为型（观察者/策略/模板方法——管怎么"协作"）','静态型、动态型、混合型','单类型、多类型、泛型','界面型、逻辑型、数据型'], a:[0], ex:'三大类的记忆锚点：创建型解决"new 的失控"（构造过程复杂、需要控制实例数量）；结构型解决"类与对象的组合"（接口不兼容、功能叠加、访问控制）；行为型解决"对象间职责分配与通信"。答题套路：报分类 → 深讲两三个真用过的 → 落到 STL/项目实例。'},
{t:'s', q:'简单工厂与工厂方法模式的关键区别是？', opts:['没有区别','简单工厂用一个静态方法按参数分支创建产品，新增产品要改工厂代码（违反开闭）；工厂方法为每个产品配一个工厂子类，新增产品只加新类不改旧码（符合开闭）','工厂方法只能创建一个对象','简单工厂是 GoF 23 种模式之一'], a:[1], ex:'简单工厂的 switch/if 分支是修改热点；工厂方法把"创建哪个产品"的决定下放到工厂子类，扩展 = 新增一对（产品类+工厂类）。简单工厂的现代救法：注册表 + std::function——新产品向 map 注册创建函数，同样不改工厂代码。抽象工厂则更进一步：一个工厂生产一"族"配套产品（如同一主题的全套 UI 控件），加新族容易、族内加新品类难（接口要变，全体工厂都得改）。'},
{t:'s', q:'建造者（Builder）模式最适合解决的问题是？', opts:['对象数量失控','构造参数爆炸（尤其大量可选参数）：链式方法分步设置，build() 时集中校验并生成对象','对象无法拷贝','类之间接口不兼容'], a:[1], ex:'十几个参数的构造函数难读易错（顺序、默认值），重载组合爆炸。Builder 用具名的链式调用（.setHost().setPort().build()）自文档化，还能在 build() 里做跨参数校验、产出不可变对象。与工厂的区别：工厂关心"创建哪种"，建造者关心"复杂对象怎么一步步装配"。'},
{t:'s', q:'原型（Prototype）模式在 C++ 中解决的核心问题是？', opts:['对象太大无法创建','通过基类指针复制对象：构造函数不能是虚函数，但可以定义 clone() 虚函数，派生类各自实现（内部调用自身拷贝构造）实现多态拷贝','禁止对象拷贝','单例的另一种写法'], a:[1], ex:'只持有 Base* 时想复制"真实类型"的对象：拷贝构造无法虚化，clone() 虚函数补位——每个派生类返回 new Derived(*this)。这是"运行期按现有对象克隆新对象"的标准手法，也常用于避免重复的昂贵初始化（复制现成原型再微调）。'},
{t:'s', q:'饿汉式与懒汉式单例的区别及 C++ 推荐实现是？', opts:['饿汉按需创建、懒汉启动即创建','饿汉在程序启动（静态初始化）时即创建，天然线程安全但可能白建；懒汉首次使用才创建，需处理并发——C++11 推荐 Meyers 单例（函数内局部静态变量），语言保证线程安全','两者都必须加锁','懒汉不能用于多线程'], a:[1], ex:'Meyers 写法：`static Singleton& get(){ static Singleton s; return s; }`——C++11 保证局部静态初始化的线程安全，代码最短。替代方案 call_once；手写双检锁（DCLP）必须配 atomic 与内存序才正确，易错不推荐。单例的real缺点是全局状态难测试——能依赖注入就别单例。'},
{t:'m', q:'"代理三兄弟"辨析：适配器、装饰器、代理的定位，下列说法正确的有？', opts:['适配器改变接口：把不兼容的既有接口翻译成目标接口（事后补救）','装饰器不改接口、动态叠加功能：与被装饰者实现同一接口并持有它（is-a + has-a），可层层包裹','代理控制访问：延迟加载、权限检查、远程调用、缓存——由代理决定何时/是否把调用转给真实对象','三者结构完全不同，不存在相似性'], a:[0,1,2], ex:'三者都"包一个对象"，分野在意图：适配器解决"接口不合"（转换），装饰器解决"功能增强"（同接口可叠加，如 IO 流的缓冲层），代理解决"访问控制"（对象的门卫）。智能指针是最纯正的代理；stack/queue 是容器适配器。D 错：结构相似恰是这组题的考点，靠意图区分。'},
{t:'s', q:'外观（Facade）模式与适配器模式的区别是？', opts:['没有区别','外观是"简化一群"：把多个子系统的复杂调用封装成一个门面方法（如下单一键调库存+支付+消息）；适配器是"转换一个"：让单个不兼容接口符合期望','外观只用于 UI 界面','适配器不能用于类'], a:[1], ex:'外观做减法（隐藏内部复杂度、给外部一个简单入口），是迪米特法则（只与直接朋友通信）的落地；适配器做翻译（接口形状不匹配）。一个面向"简化"，一个面向"兼容"。'}
);
BANKS['design'].questions.push(
{t:'s', q:'享元（Flyweight）模式的核心约束是？', opts:['共享对象必须加锁','被共享的"内在状态"必须不可变（可安全共享），随场景变化的"外在状态"由调用方在使用时传入','所有对象都必须共享','只能用于字符串'], a:[1], ex:'享元靠共享省内存（字符串常量池、棋子共享形状对象），前提是共享体不可变——否则一处修改全体遭殃。可变的部分（棋子的位置）抽成外在状态按次传入。这是"共享与可变不可兼得"原则的模式化表达。'},
{t:'s', q:'观察者模式与发布-订阅模式的区别，一句话概括是？', opts:['完全相同','有没有中间人（Broker）：观察者模式中主题直接持有观察者列表、同进程同步通知；发布订阅经消息中间件转发，双方零耦合、可异步可跨进程','发布订阅不能有多个订阅者','观察者模式只能用于 GUI'], a:[1], ex:'观察者：Subject 持抽象 Observer 列表，变化即遍历通知——新增下游零改动，但双方仍在同一进程内互相可见（C++ 现代形态是 std::function 回调/信号槽，用 weak_ptr 防观察者悬垂）。发布订阅加入 Broker（MQ）后，发布方与订阅方互不知晓，获得异步、削峰、跨服务能力。'},
{t:'s', q:'策略模式消除大段 if-else 的完整方案通常是"策略 + 什么"的组合？', opts:['策略 + 单例','策略 + 注册表工厂：各算法实现统一接口并向 map<名字, 创建函数> 注册，运行期按 key 查表获取策略——新增策略零修改分发代码','策略 + 观察者','策略 + 建造者'], a:[1], ex:'只用策略模式，选择策略的地方仍可能是一串 if-else；配注册表把"名字→策略"收敛成一张映射，分支逻辑变成一次查表。C++ 还有编译期版本：模板参数注入策略（比较器/哈希/分配器），零虚函数开销——"运行期变化用虚函数，编译期确定用模板"。'},
{t:'s', q:'模板方法模式中，父类骨架函数的设计要点是？', opts:['骨架函数声明为纯虚函数','骨架函数是非虚的（固定流程不许子类改），流程中的可变步骤声明为纯虚/虚函数（钩子）留给子类填空——"别调用我们，我们会调用你"（好莱坞原则）','所有步骤都必须是虚函数','子类必须重写骨架'], a:[1], ex:'模板方法把"流程"与"步骤实现"分离：父类定死执行顺序（run() 非虚），子类只填空（doStep() 纯虚、钩子函数可选覆盖）。与策略模式对比：模板方法用继承换"一步"，策略用组合换"整套算法"。'},
{t:'s', q:'状态模式与策略模式结构几乎相同，本质区别是？', opts:['状态模式性能更好','谁驱动切换：策略由外部选定后通常整个过程不变；状态由对象内部随业务流转自动迁移（状态对象常知道下一个状态是谁），用类替代满屏 switch','策略模式不能有多个实现','状态模式不能用于游戏'], a:[1], ex:'两者都是"接口 + 多实现 + 组合持有"。策略是"外部选择算法"（排序用哪种比较器）；状态是"内部流转行为"（订单从待支付→已支付→已发货，行为随状态变）。命令模式则把"请求"对象化：可排队、可撤销（undo 栈）、可重放——线程池的任务队列就是命令模式。'},
{t:'s', q:'Reactor 与 Proactor 模式的分界，一句话是？', opts:['Reactor 用于 UI，Proactor 用于网络','Reactor 通知你"可以读了"（就绪通知，用户自己完成读写——同步非阻塞，epoll 系）；Proactor 通知你"已经读完了"（内核连等待和拷贝都做完——异步 IO，IOCP/io_uring）','Reactor 是多线程版的 Proactor','两者只是名字不同'], a:[1], ex:'Reactor = epoll 事件循环 + 事件分发，IO 动作仍由应用执行；Proactor 把 IO 完全交给内核，回调时数据已在应用缓冲区。Linux 传统上缺完善异步文件 IO，主流网络框架（Redis/Nginx/Netty）都是 Reactor；io_uring 正在补齐 Proactor 之路。'},
{t:'s', q:'主从 Reactor 多线程模型（Netty/muduo 的标准架构）的关键设计是？', opts:['所有线程抢同一个 epoll','主 Reactor 只管 accept 新连接，然后把连接固定分配给某个从 Reactor（每个从 loop 独占一批连接）——同一连接的所有 IO 都在同一线程，连接内无锁','每个请求新建一个线程','用全局大锁保护所有连接'], a:[1], ex:'演进三档：单 Reactor 单线程（零锁但单核封顶、慢业务卡全场——Redis）→ 单 Reactor 多线程（业务进线程池，IO 仍单点）→ 主从 Reactor（accept 与 IO 分离、连接固定归属）。"一条连接固定一个 loop"换来连接内免锁；工作线程要写 socket 时不直接写，把任务投回连接所属 loop 的队列并用 eventfd 唤醒。'},
{t:'m', q:'关于生产者-消费者模式与池化技术的工程要点，正确的有？', opts:['阻塞队列解耦生产与消费速率、削峰填谷','队列必须有界，并配套拒绝策略——无界队列 = 延迟无限膨胀 + 最终 OOM','连接池/线程池复用昂贵资源，借出应设超时，归还必须重置状态（脏连接毒害后续使用者）','队列越大越好，最好不设上限'], a:[0,1,2], ex:'生产者消费者三要素：共享缓冲队列 + 互斥 + 两个条件变量（未满可生产/非空可消费）。有界是纪律：上游超速时宁可快速失败/降级，也不能让队列悄悄吃光内存（D 反例）。池化的对称纪律：借出计时（防泄漏）、归还重置（防脏状态）。'},
{t:'s', q:'STL 迭代器体现的设计模式及其价值是？', opts:['单例模式：全局唯一迭代器','迭代器模式：以统一接口遍历不同容器，使 M 个算法 × N 个容器从 M×N 份实现解耦为 M+N','工厂模式：创建容器','装饰器模式：增强容器'], a:[1], ex:'std::sort、std::find 等算法只面向迭代器区间编程，不关心底层是 vector 还是 deque——算法与容器经由迭代器这层抽象正交组合。STL 中的其他模式实例：智能指针=代理、容器适配器 stack/queue=适配器、比较器/分配器模板参数=编译期策略、std::function+lambda=命令/回调、CRTP=编译期模板方法。'},
{t:'s', q:'pimpl 惯用法（指向实现的指针）与哪个设计模式同源？其主要工程收益是？', opts:['单例；节省内存','桥接；编译防火墙：头文件只留一个不透明指针，实现细节改动不再触发使用方重新编译，还能隐藏私有依赖','享元；共享实现','观察者；解耦通知'], a:[1], ex:'桥接模式把"抽象"与"实现"两个变化维度用组合连接（M×N 子类 → M+N）；pimpl 是它的工程特化：class Widget 只持 `unique_ptr<Impl>`，成员变量全搬进 .cpp 里的 Impl——头文件稳定、编译依赖切断。注意析构函数要在 .cpp 中定义（Impl 在头文件中是不完整类型）。'}
);
BANKS['design'].questions.push(
{t:'s', q:'`std::stack` 基于 deque 封装、把接口收窄为只剩 push/pop/top，不允许随机访问。它体现的设计模式是？', opts:['装饰器模式：给 deque 增强了功能','适配器模式：包装既有组件、转换/收窄其接口以符合"栈"的抽象（容器适配器）','代理模式：控制对 deque 的访问权限','外观模式：简化了一群子系统'], a:[1], ex:'stack/queue/priority_queue 官方名称就是"容器适配器"：复用底层容器的实现，把接口改造成目标抽象。辨析：装饰器不改接口只叠功能（此处接口变了）；代理的意图是访问控制（延迟/权限/远程），此处是接口转换；外观针对"一群"子系统（此处只有一个）。识别模式看意图而非结构，是这类题的判分点。'},
{t:'e', q:'【综合】请手写一个 C++11 线程安全的懒汉式单例（Meyers 写法），并回答：它为什么线程安全？与饿汉式各有什么取舍？为什么不推荐手写双检锁（DCLP）？单例模式本身有什么代价？', ans:'Meyers 单例：\n`class Singleton {\npublic:\n  static Singleton& instance() {\n    static Singleton s;   // C++11 保证线程安全\n    return s;\n  }\n  Singleton(const Singleton&) = delete;\n  Singleton& operator=(const Singleton&) = delete;\nprivate:\n  Singleton() = default;\n  ~Singleton() = default;\n};`\n\n要点：构造/析构私有化，删除拷贝，static 局部对象 + 引用返回。\n\n为什么线程安全：C++11 规定静态局部变量的初始化并发安全——首个到达的线程执行初始化，其余线程阻塞等待完成，且只初始化一次。等价的替代是 std::call_once + once_flag。\n\n饿汉 vs 懒汉：饿汉在程序启动（静态初始化阶段）就构造——天然无并发问题、首次访问零延迟，但可能构造根本用不到的对象，且多个全局对象间的初始化顺序不可控（静态初始化顺序问题）；懒汉按需构造，Meyers 写法是懒汉的最简线程安全形态。\n\n为什么不手写 DCLP：`if(!p){ lock; if(!p) p = new T; }` 在无内存序约束下，`p = new T` 可能被重排为"先赋地址后构造"，另一线程看到非空的 p 却访问到未构造完的对象——正确实现需要 std::atomic + acquire/release 内存序，极易写错；Meyers 一行顶它全部。\n\n单例的代价：本质是受控的全局状态——隐藏依赖（调用方悄悄拿单例，接口上看不出）、单元测试难以替换/隔离、生命周期与析构顺序难控。工程建议：能通过构造函数依赖注入的就注入，单例留给真正全局唯一且无状态争议的东西（日志器、配置中心）。'}
);
BANKS['rosqt'].questions.push(
{t:'s', q:'ROS1 中 Master（roscore）在话题通信中的角色是？', opts:['所有消息数据都经过 Master 转发','只做"电话簿"：节点向它注册/查询（XML-RPC），订阅者拿到发布者地址后直接建立点对点连接（TCPROS），消息数据完全不经过 Master','Master 负责序列化所有消息','Master 是可选组件'], a:[1], ex:'发现机制四步：节点启动向 Master 注册 → 订阅者从 Master 获取发布者地址列表 → 订阅者直连各发布者协商协议 → 数据点对点传输。Master 只在"牵线"阶段出场——控制面与数据面分离，这是理解后续所有推论（Master 挂掉、多发布者）的基础。'},
{t:'s', q:'ROS1 运行中 Master 突然挂掉，系统的表现是？', opts:['所有节点立即停止通信','已建立的话题连接照常收发（数据面不依赖 Master），但新节点无法加入、新话题无法发现——控制面瘫痪','所有消息改为广播模式','节点自动重启'], a:[1], ex:'数据走节点间直连的 TCPROS，Master 死后既有连接不受影响；受影响的是注册与发现。这就是 ROS1 单点故障的准确范围，也是 ROS2 改用 DDS 分布式发现（无 Master、节点对等）的核心动机。'},
{t:'s', q:'修改了 .msg 消息定义文件后只重新编译了一端，运行时连接被拒绝，原因是？', opts:['网络防火墙拦截','TCPROS 连接握手时双方校验消息定义的 md5sum，不一致则拒绝连接','Master 缓存了旧消息','话题名冲突'], a:[1], ex:'消息类型以其定义内容的 md5 为指纹，握手时核对——两端定义不一致宁可拒连也不静默错解字节。"改了 .msg 没重编另一边"是该报错的最常见来源，全量重新编译两端即可解决。'},
{t:'s', q:'ROS 话题的 queue_size 选型原则："状态流"与"事件流"应分别如何设置？', opts:['都设为 0 表示不限制','高频状态流（位姿/关节角）设 1——只要最新值，积压旧值徒增延迟；事件流（任务状态文本）设大些（如 10）——每条都是独立事件，丢一条就丢信息；queue_size=0 是无限队列，内存炸弹，永远别用','都设为 1','状态流设大、事件流设 1'], a:[1], ex:'发布队列与订阅队列溢出都丢最旧。一句话原则："状态流要最新，事件流要缓冲"。这一哲学与 latched topic、"最后值缓存"一脉相承。另外 publish() 是异步的——只入队即返回（微秒级），序列化与发送由内部线程完成，控制循环里连发多条不阻塞；没有订阅者时 publish 几乎零成本。'},
{t:'s', q:'ros::spin()、ros::spinOnce()、ros::AsyncSpinner 的区别是？', opts:['三者等价','spin() 当前线程死循环处理回调（纯被动节点）；spinOnce() 处理完当前积压立即返回（适合自带主循环的节点，回调在主循环间隙串行执行）；AsyncSpinner(n) 后台 n 个线程持续处理（回调耗时、不能阻塞主线程时用）','spin 是多线程的，AsyncSpinner 是单线程的','spinOnce 会阻塞直到有新消息'], a:[1], ex:'回调先进回调队列，spin 系列决定"谁来消费"。选择依据是回调的耗时特征：回调轻则 spinOnce 单线程串行——回调与主逻辑同线程交替执行，全程免锁；回调重才用多线程 spinner，同时必须补锁。GUI 程序主线程被 Qt 的 exec() 占住，无人调 spinOnce，所以标准搭配是 AsyncSpinner。'},
{t:'s', q:'把单线程 spinOnce 换成多线程 AsyncSpinner(n) 后，并发语义的关键变化是？', opts:['没有变化','n 个线程从同一回调队列取任务并发执行：不同话题的回调可能并发，同一个订阅的回调默认也可能并发——原先"天然串行免锁"的成员变量全部需要补同步','回调自动加锁','消息会丢失'], a:[1], ex:'这是换 spinner 的隐藏合同变更：并发粒度由"全局单线程"变为"队列级并发"。隔离手段：为关键话题绑定自定义 CallbackQueue 由专属线程 spin；ROS2 把这套机制正规化为 callback group（互斥组内保证串行）。'},
{t:'s', q:'节点运行在命名空间 /left_arm 下、节点名 teleop，则相对名 `cmd_mode`、绝对名 `/global/cmd_mode`、私有名 `~debug` 分别解析为？', opts:['/cmd_mode、/global/cmd_mode、/debug','/left_arm/cmd_mode、/global/cmd_mode、/left_arm/teleop/debug','/left_arm/cmd_mode、/left_arm/global/cmd_mode、/left_arm/debug','三者都解析为原样'], a:[1], ex:'三规则：相对名被 namespace 修饰；前导 / 的绝对名原样；~ 私有名再叠加节点名一层（参数专用）。工程价值：同一份代码放进不同 namespace 就是多个隔离实例（双臂系统零改码复用），全局话题做广播、相对话题做点对点；launch 的 remap 还能不改代码重接话题。'},
{t:'s', q:'latched topic（advertise 第三参数 latch=true）的语义与适用对象是？', opts:['消息发送后需要确认','发布者保留最后一条消息，此后任何新连接的订阅者立即补收一次——适合低频"状态量"话题（当前模式、地图、标定结果）；高频流话题绝不能 latch','消息加密传输','消息永久存盘'], a:[1], ex:'解决"订阅者晚启动错过状态"的时序问题：状态变化时才发布 + latch 让迟到者可见，兼得事件驱动与省带宽。本质是"最后值缓存"。高频位姿流 latch 反而有害（迟到者收到过时位姿）。ROS2 中对应 QoS 的 durability=transient_local。'},
{t:'s', q:'ros::Rate loop(100); loop.sleep() 与裸 sleep_for(10ms) 的区别是？', opts:['完全相同','Rate 睡到"上一节拍点 + 周期"——固定节拍：本帧干活 3ms 就只睡 7ms，自动吸收工作时长抖动；裸 sleep 是固定间隔：实际周期 = 工作时间 + 10ms，频率漂移','Rate 精度更低','裸 sleep 不占 CPU'], a:[1], ex:'"Rate 睡的是到下一个节拍的剩余时间"。单帧超时则立即返回并重置基准（不追帧）。配套知识：use_sim_time 为真时 ros::Time::now() 读 /clock 仿真时间——rosbag 回放可暂停倍速甚至回跳，两次 now() 之差可能为负，时间差必须做防御性夹取；测真实耗时用 ros::WallTime。'}
);
BANKS['rosqt'].questions.push(
{t:'m', q:'ROS1 与 ROS2 的关键区别，下列说法正确的有？', opts:['ROS2 用 DDS 分布式发现取代中心化 Master，节点对等、无单点故障，多机部署不再需要 ROS_MASTER_URI','ROS2 提供完整 QoS 策略：reliability（best_effort/reliable）、durability（transient_local ≈ latch）、deadline 等','ROS2 用 callback group 控制回调并发：同一互斥组内的回调保证串行','ROS2 移除了对 C++ 的支持，只能用 Python'], a:[0,1,2], ex:'三大升级对应 ROS1 的三大痛点：Master 单点 → DDS 去中心化；只有 queue_size 和 latch 两个旋钮 → 完整 QoS（不可靠低延迟流直接声明 best_effort，无需自写 UDP）；并发语义由全局 spinner 决定 → 每组回调声明式控制。另有 Lifecycle 节点（受控启动状态机）、原生进程内零拷贝。D 错：rclcpp 是 Modern C++ API。'},
{t:'s', q:'机器人姿态表示用四元数而非欧拉角的主要原因是？', opts:['四元数占内存更小是唯一原因','欧拉角有万向节锁（两轴对齐丢失一个自由度）、插值路径不自然、组合旋转要转矩阵；四元数无奇异点、slerp 沿最短大圆均匀插值、乘法即旋转组合','欧拉角无法表示 90 度以上旋转','四元数更容易人工读懂'], a:[1], ex:'四元数 4 个数即可无奇异地表示旋转，代价是不直观——工程上常在边界转换：对人接口用 RPY，内部计算用四元数。实操要点：只有单位四元数才表示旋转（输入要归一化防御，接近零回退单位元）；q 与 -q 表示同一旋转（双覆盖，slerp 要选短弧）；位置插值用 lerp、旋转插值用 slerp（旋转空间是弯的，线性插值会跑出单位球）。'},
{t:'s', q:'Qt 中 Q_OBJECT 宏与 moc 的关系是？', opts:['Q_OBJECT 是普通注释','Q_OBJECT 声明一组由 moc 生成实现的成员（metaObject、信号函数、按索引分发的 qt_metacall 等）；moc 在构建期扫描类定义生成配套 .cpp——Qt 用代码生成给 C++ 补了一套反射','Q_OBJECT 在运行期动态解析','moc 是运行时虚拟机'], a:[1], ex:'信号槽、运行期类型信息、按名调用、属性系统都需要反射，而 C++ 没有——moc 在构建期生成签名表/字符串表/分发函数。冷知识：Q_OBJECT 类定义在 .cpp 文件里时，需在文件末尾手动 `#include "文件名.moc"`，忘写的报错是 undefined reference to vtable；CMake 的 AUTOMOC 可自动处理。qobject_cast 则走元对象继承链、不依赖 RTTI，跨动态库比 dynamic_cast 可靠。'},
{t:'s', q:'Qt 信号槽五种连接类型中，跨线程投递的关键类型及其机制是？', opts:['DirectConnection：跨线程直接调用','QueuedConnection：把调用打包成事件投到"接收者所属线程"的事件队列异步执行；默认的 AutoConnection 同线程走 Direct、跨线程自动走 Queued','UniqueConnection：为每个线程建立唯一通道','BlockingQueuedConnection：性能最好应默认使用'], a:[1], ex:'Direct 在发射者线程同步调用；Queued 依赖接收者的 thread affinity（对象属于创建它的线程，moveToThread 可迁移）——"槽在哪个线程执行由接收者所属线程决定"。两个深坑：Queued 的参数会被拷贝进事件，自定义类型必须 qRegisterMetaType 注册，否则槽静默不执行；BlockingQueuedConnection 在同线程使用 = 等自己 = 死锁。'},
{t:'s', q:'connect(sender, signal, this, lambda) 中第三个参数（上下文对象）的作用是？', opts:['仅仅是命名习惯','上下文对象析构时连接自动断开（lambda 不会在对象死后被调用），同时它决定 Queued 连接时槽在哪个线程执行——lambda 连接永远要带上下文对象是防悬垂纪律','加快信号传递','让 lambda 可以修改捕获'], a:[1], ex:'不带上下文的 lambda 连接在对象销毁后仍可能被触发，捕获的 this 已悬垂——崩溃点在毫无关系的信号发射处，极难排查。信号槽相对裸回调的三大附加值正在于此：多对多、自动断连（QObject 析构解除连接）、跨线程投递。'},
{t:'s', q:'Qt 槽函数中执行了 5 秒的耗时操作，界面会怎样？为什么？', opts:['界面正常，Qt 自动多线程','界面冻结 5 秒：槽在 GUI 线程的事件循环内同步执行，期间鼠标、重绘等事件无人处理；正解是把耗时工作移到 worker 线程，完成后经信号槽（自动 Queued）把结果投回 GUI 线程','界面只会变慢一点','Qt 会自动弹出等待对话框'], a:[1], ex:'app.exec() 的本质是"取事件→分发→处理"的循环，槽卡住 = 队列没人取 = 白屏。应急手段 processEvents 可在长任务中手动泵事件，但引入重入风险（泵出的事件可能再进当前调用栈），受控场景才用。Qt 还规定：所有 QWidget 操作只能在 GUI 线程进行，后台线程更新 UI 必须跨线程投递（invokeMethod/信号槽），配 QPointer 判活。'},
{t:'s', q:'Qt 对象树（parent-child）内存管理与 C++ 智能指针的相处规则是？', opts:['所有 QObject 都应该用 shared_ptr 管理','parent 析构时递归 delete 所有 children，因此 `new QTimer(this)` 不泄漏；红线：有 parent 的对象绝不能再交给智能指针或手动 delete（双重释放），顶层窗口（无 parent）才用智能指针','对象树和智能指针可以随意混用','Qt 对象永远不需要释放'], a:[1], ex:'两套所有权体系各管各的地盘：树内靠 parent（契合"控件属于窗口"的层级），树外（顶层窗口）用 unique_ptr。配套工具 deleteLater：把删除投成事件、当前调用栈完全退出后执行——解决"在自己的槽里删除自己"的经典崩溃，socket 断开处理的标配。QObject 拷贝构造是 delete 的（身份语义：一个树节点、一份连接列表、一个所属线程）。'},
{t:'s', q:'QPointer 与 std::weak_ptr 的对比，正确的是？', opts:['两者机制完全相同','都解决"持有不拥有的引用并探测对象存亡"：weak_ptr 靠 shared_ptr 控制块的弱计数（对象必须由 shared_ptr 管理）；QPointer 挂在 QObject 的析构通知上（对象析构时自动置空，不要求智能指针参与）','QPointer 能防止对象被析构','weak_ptr 只能用于 Qt 对象'], a:[1], ex:'QPointer 是对象树所有权体系配套的 weak 引用。注意其判空不解决线程竞争——判空与使用之间对象理论上可能在他线程析构；在 GUI 场景它够用是因为 QWidget 的析构只发生在 GUI 线程、判空也在 GUI 线程，同线程内不可能交错。跨线程投递回调时"QPointer + lambda 开头判空"是标准姿势。'},
{t:'s', q:'QTcpServer/QTcpSocket 的 IO 模型本质是？使用 readyRead 信号的纪律是？', opts:['阻塞式 IO，每连接一个线程','框架级 Reactor：socket 注册进事件循环（Linux 底层是 poll/epoll 族），就绪以信号通知（newConnection/readyRead/disconnected）；readyRead 不保证一条消息一次，触发时要把 bytesAvailable 读干净，消息边界仍需应用层自己拆（长度前缀等）','Proactor 异步 IO，数据自动就位','UDP 广播模型'], a:[1], ex:'Qt 网络类把"epoll + 非阻塞 + 事件回调"封装成信号槽，事件驱动的 socket 全在 GUI 线程也不阻塞、天然串行免锁（单线程事件驱动，Redis 同款哲学）。TCP 粘包知识在事件驱动模型下原样成立：readyRead 里循环读空缓冲、按协议切包。QProcess 同理把子进程管理纳入事件循环（stdout via readyRead、退出 via finished，errorOccurred 要成对监听防漏启动失败分支）。'}
);
BANKS['rosqt'].questions.push(
{t:'e', q:'【综合】面试官："介绍一下 ROS1 的话题通信机制——发布订阅是怎么建立起来的？" 请完整回答：建立流程、数据面与控制面的关系，以及三个经典追问（Master 挂了会怎样？两个节点发布同一话题合法吗？改了 .msg 只重编一端会怎样？）', ans:'建立流程（四步）：\n1. 节点启动时通过 XML-RPC 向 Master（roscore，默认端口 11311）注册自己的地址和发布/订阅的话题——Master 是一本"电话簿"；\n2. 订阅者从 Master 查询到该话题所有发布者的地址列表；\n3. 订阅者直接连接每个发布者，协商传输协议（默认 TCPROS，可选 UDPROS），建立点对点连接；\n4. 此后所有消息数据在节点间直连传输，完全不经过 Master。\n\n关键架构认识：控制面（注册与发现，依赖 Master）与数据面（消息传输，点对点）分离。\n\n三个追问：\n1. Master 挂了：已建立的连接照常收发（数据面不依赖它），但新节点无法加入、新话题无法发现——控制面瘫痪。这就是 ROS1 的单点故障范围，也是 ROS2 改用 DDS 分布式发现（无 Master、节点对等）的动机。\n2. 多个发布者发同一话题：完全合法。订阅者会连接所有发布者，消息混流到达——典型用法是 GUI 和键盘节点都往同一命令话题发布，控制节点全收。\n3. 消息定义校验：TCPROS 握手时双方核对 .msg 定义的 md5sum，不一致直接拒绝连接——"改了消息文件只重编一端"报的就是这个错，宁可拒连也不静默错解字节。\n\n加分项：TCPROS 默认开启 TCP_NODELAY 关闭 Nagle（高频小消息不攒包，低延迟）；publish() 是异步入队即返回，序列化与发送由内部线程完成；queue_size 的选型哲学——状态流给 1 只要最新，事件流给缓冲不许丢。'}
);
</script>
<script>
/*
 * LLM 自测题库（独立数据片段）
 * 用法：在面试八股自测.html 的题库注册脚本之后插入本文件内容。
 * 数据结构与现有页面兼容：s=单选，m=多选，f=填空，e=简答。

reg('llm-arch', {
  name:'LLM 模型架构与核心组件',
  desc:'Transformer · Attention · RoPE · Tokenizer · Norm/FFN · MoE',
  accent:'#0f766e', questions:[]
});
BANKS['llm-arch'].questions.push(
{t:'s', q:'Transformer 相比 RNN/LSTM 在长序列训练中最关键的计算优势是什么？', opts:['消除了所有平方复杂度','把同一序列的位置计算组织成可并行的矩阵运算','让模型不再需要位置编码','保证每个生成 token 可以同时得到'], a:[1], ex:'RNN/LSTM 的隐藏状态存在时间步依赖，同一个样本的序列维度难以并行。Transformer 在训练时可一次生成整段序列的 Q/K/V，并用矩阵乘法计算注意力；位置顺序仍需由位置机制提供，生成阶段也仍然要逐 token 推进。'},
{t:'m', q:'关于 Encoder-only、Encoder-Decoder 和 Decoder-only，正确的说法有？', opts:['Encoder-only 的双向注意力适合分类、抽取和表征学习','Encoder-Decoder 适合源序列与目标序列边界清晰的翻译或摘要','Decoder-only 的每个位置可以读取右侧尚未生成的 token','Decoder-only 可以把提示、示例和回答统一成 next-token 任务'], a:[0,1,3], ex:'Encoder-only 让输入内部双向可见，常用于理解和向量表示；Encoder-Decoder 由 Encoder 编码源序列、Decoder 按因果顺序生成目标；Decoder-only 只读取当前位置及左侧内容，但可以用统一的前缀续写接口覆盖多种生成任务。'},
{t:'s', q:'在注意力公式 `softmax(QK^T / sqrt(d_k) + M)V` 中，Q、K、V 的主要职责分别是什么？', opts:['Q 负责被读取的内容，K 负责输出，V 负责查询','Q/K 计算匹配关系，V 提供按匹配权重汇总的内容','Q 负责位置编码，K 负责归一化，V 负责 Mask','三者都只用于保存历史缓存'], a:[1], ex:'Q 可以理解为当前位置要查找的条件，K 是各位置可被匹配的索引特征，V 是匹配后真正汇总的内容。Mask M 先参与分数计算，Softmax 得到权重后再对 V 加权求和。'},
{t:'f', q:'标准全注意力中，长度为 n 时注意力两两交互矩阵的时间复杂度通常写作什么？', a:['O(n^2)','O(n²)'], ex:'QK^T 需要比较长度为 n 的位置对，注意力部分的平方项通常写为 O(n^2)。若把隐藏维、头数和 batch 一并展开，可写成 O(BHN^2D_h)；线性投影还会带来 O(BND^2) 项。'},
{t:'m', q:'关于因果 Mask 和 Softmax 的说法，正确的有？', opts:['因果 Mask 在 Softmax 前把不可见位置的分数置为负无穷','训练时因果 Mask 限制信息可见范围，但各位置仍可并行计算','Softmax 后把概率清零且不重新归一化，仍然是严格概率分布','Padding Mask 与因果 Mask 解决的是完全相同的问题'], a:[0,1], ex:'因果 Mask 防止当前位置读取未来 token，通常在 Softmax 前加到 logits 上；训练时所有位置的真实前缀已知，因此仍能并行。Softmax 后改值需要重新归一化，Padding Mask 负责忽略补齐位置，二者用途不同。'},
{t:'s', q:'在隐藏维总量固定的前提下，MHA、MQA、GQA 的主要差别集中在哪里？', opts:['是否使用位置编码','每个 Q 头对应的 K/V 头数量','是否需要 FFN','是否能进行自回归生成'], a:[1], ex:'MHA 为每个 Q 头配置独立 K/V，表达力和 KV Cache 规模都较大；MQA 共享一组 K/V，缓存和带宽开销小但容量更受限；GQA 在两者之间分组共享，常作为质量与 Decode 成本的折中。'},
{t:'s', q:'RoPE 作用于 Q/K 后，最重要的性质是什么？', opts:['把所有 token 映射到同一个向量','让注意力中的位置调制项主要依赖相对位移，同时保留内容相似度','完全消除长上下文外推问题','只对 V 做旋转以保存绝对位置'], a:[1], ex:'RoPE 对 Q/K 的成对维度按位置旋转，两个位置的内积会带有相对位移相关的相位项。它改善了位置表达，却没有保证超过训练长度后仍然稳定，长度外推仍需缩放或继续训练与评测。'},
{t:'s', q:'扩大 Tokenizer 词表通常带来的组合影响是？', opts:['序列可能变短，但 Embedding/LM Head 参数和稀有 token 学习压力上升','序列变长且输出层参数一定减少','词表大小只影响预处理速度，不影响推理成本','新增 token 会自动获得正确的领域语义'], a:[0], ex:'更大的词表可能让中文、代码或常见短语用更少 token 表示，降低注意力和 Decode 步数；代价是嵌入与输出矩阵变大、稀有 token 数据不足。新增 token 还需要继续训练，Tokenizer、权重和特殊 token 必须版本绑定。'},
{t:'m', q:'关于 Transformer Block 中的残差、归一化和 FFN，正确的有？', opts:['残差提供接近恒等的梯度路径','Pre-Norm 通常让深层训练更稳定','RMSNorm 会像 LayerNorm 一样先减去均值','SwiGLU 使用门控分支，参数预算通常需调小中间维'], a:[0,1,3], ex:'残差让信息和梯度可以绕过子层传播；Pre-Norm 先规范化子层输入，深层优化通常更稳。RMSNorm 只按均方根缩放，不做均值中心化。SwiGLU 有额外门控投影，常通过减小中间维来控制总参数量。'},
{t:'s', q:'MoE 模型中“激活参数量”最准确的含义是什么？', opts:['整个模型实际存储的参数量','每个 token 经过 Router 后实际参与前向计算的参数量','只包含 Embedding 的参数量','训练时所有专家参数的平均值'], a:[1], ex:'稀疏 MoE 可以存储很多专家，但每个 token 只路由到 Top-k 个专家，因此单 token 前向使用的参数量称为激活参数量。总参数仍需驻留或可按策略加载；All-to-All 通信、负载倾斜和专家容量会影响真实吞吐。'},
{t:'e', q:'请解释通用 LLM 为什么常采用 Decoder-only，并区分训练、Prefill 和 Decode 三个阶段的并行性。', ans:'回答可按三层组织：\n1. 架构层：Decoder-only 用因果注意力和 next-token 目标，把普通文本、提示、对话和代码统一成前缀续写接口，数据构造和分布式训练路径较统一。\n2. 训练层：整段真实序列已知，因果 Mask 阻止未来信息泄漏，但所有位置可以并行计算。\n3. 推理层：Prefill 一次处理已知提示并建立 KV Cache；Decode 每轮只新增一个 token，复用历史 K/V，却受逐 token 串行、显存带宽和 Cache 容量限制。\n补充边界：Encoder-only 在双向表征任务中更高效，Encoder-Decoder 在输入输出边界清晰的转换任务中仍有优势。', ex:'好的回答应同时覆盖任务接口、训练目标和推理代价，不能只说“Decoder-only 更先进”。'},
{t:'e', q:'线上模型出现“回答不停、角色标签重复、工具参数格式异常”，你会怎样排查 Tokenizer 和 Chat Template？', ans:'先固定模型、Tokenizer、特殊 token 表和模板版本，打印原始消息与最终序列化 token，检查 system/user/assistant 起止标记、EOS、工具调用标记及角色顺序。再用一组最小多轮样本做单步 tokenize/decode，确认训练时的 assistant mask 与线上模板一致；比较模板变更前后的首 token 概率和停止条件。最后分别回归短对话、多轮对话、工具调用和空历史，避免只看一条样例。', ex:'这类症状常来自格式协议不一致，排查重点是可复现的序列化结果、特殊 token ID 和停止条件。'}
);

reg('llm-train', {
  name:'LLM 预训练与训练工程',
  desc:'Next-token · 数据管线 · Scaling Law · 优化器 · 并行训练 · 容错',
  accent:'#b45309', questions:[]
});
BANKS['llm-train'].questions.push(
{t:'s', q:'自回归预训练中，Teacher Forcing 的含义是什么？', opts:['训练时每一步都使用模型刚生成的 token','训练时用真实前缀预测下一个真实 token，并将各位置损失并行计算','训练时完全移除因果 Mask','训练时只计算最后一个 token 的损失'], a:[1], ex:'训练样本右移一位后，模型用真实前缀预测下一个 token，这样整段样本的目标都已知，可以并行计算交叉熵。推理时前缀可能包含模型自己生成的 token，二者存在分布差异。'},
{t:'s', q:'困惑度（Perplexity）通常与什么量的指数相关？', opts:['平均负对数似然（或平均交叉熵）','参数总量','GPU 显存利用率','输出 token 的最大长度'], a:[0], ex:'常见定义是 PPL=exp(平均负对数似然)。它只能在 Tokenizer、数据分布和计算口径一致时比较；换了词表后 token 数与概率分解改变，不能直接横向比较数值。'},
{t:'m', q:'高质量预训练数据管线通常需要包含哪些环节？', opts:['来源许可、版本和可追溯记录','语言/质量过滤、精确与近似去重','评测污染检测和敏感信息处理','只保留训练 Loss 最低的网页，不需要验证集'], a:[0,1,2], ex:'数据治理要覆盖来源、解析、质量、去重、隐私、领域配比、污染隔离和版本回滚。单看训练 Loss 会放大重复、泄漏或模板噪声，必须配合持出评测与数据审计。'},
{t:'f', q:'Dense Decoder 训练 FLOPs 的常用一阶估算式是 ______。', a:['6ND','6*N*D'], ex:'`6ND` 中 N 表示参与矩阵计算的参数口径，D 表示训练 token 数。它是估算起点，实际时长还要乘卡数、MFU、通信、保存和故障余量；MoE 要单列激活参数、路由与通信。'},
{t:'s', q:'Scaling Law 和 Chinchilla 结论对训练预算的核心提醒是什么？', opts:['只要增加参数，数据量可以保持不变','参数量与训练 token 需要协同扩展，参数过大而数据不足会欠训练','损失下降可以精确预测所有离散能力','训练 token 越多，部署延迟一定越高'], a:[1], ex:'经验幂律能描述受控范围内损失随参数、数据和计算的趋势。固定计算预算下，过大的模型若没有足够 token 会欠训练；部署还需综合参数量、质量和全生命周期推理成本。'},
{t:'s', q:'AdamW 中“解耦权重衰减”主要解决什么问题？', opts:['让权重衰减直接混入梯度动量，不再需要学习率','将权重衰减作为独立的参数收缩步骤，便于与自适应梯度更新分别调节','让所有梯度都变成二值','自动消除梯度裁剪需求'], a:[1], ex:'Adam 的自适应缩放会改变把 L2 正则项直接加到梯度后的效果。AdamW 将 weight decay 从梯度更新中分离，参数收缩强度更可控，但仍需合理学习率、Warmup 和正则设置。'},
{t:'m', q:'关于 FP16、BF16、FP8 和 Loss Scaling，正确的有？', opts:['BF16 与 FP16 位宽相同，但指数范围通常更接近 FP32','FP16 训练常需要动态 Loss Scaling 来减少小梯度下溢','FP8 只改存储格式，完全不依赖缩放和累加精度','低精度训练仍需关注归约、激活异常值和 Kernel 支持'], a:[0,1,3], ex:'BF16 的小数精度较低，但指数范围大，通常比 FP16 更不易溢出。FP16 常用动态 Loss Scaling；FP8 对分块缩放、累加精度、校准和硬件 Kernel 更敏感，任何格式都不能脱离算子实现单独判断。'},
{t:'s', q:'训练中 Loss 突然 Spike 并伴随 NaN，第一步更合适的做法是什么？', opts:['立即把学习率乘以 0 并删除日志','保留异常 batch、rank、前向/梯度统计和 checkpoint，再按数据到优化器链路定位首个异常','只增加 GPU 数量','只把模型换成更大的版本'], a:[1], ex:'先保留现场才能判断根因。应记录异常样本、首个非有限值出现的层/算子、梯度范数、loss scale、通信前后数值和优化器状态，再分别排查脏数据、溢出、Kernel、分片和通信。'},
{t:'m', q:'下列并行方式与主要切分对象匹配的有？', opts:['DP：复制模型并切分 batch','TP：切分层内矩阵并进行高频集合通信','PP：切分层并在 stage 间传递激活','EP：切分专家并常通过 All-to-All 交换 token'], a:[0,1,2,3], ex:'DP 沿数据维复制模型；TP 在层内切矩阵，通信频繁且适合高速互联；PP 按层切 stage，需要 micro-batch 调度并产生 bubble；EP 将 token 路由到不同专家，All-to-All 和负载均衡是关键成本。'},
{t:'s', q:'ZeRO/FSDP 的主要显存思路是？', opts:['把所有激活复制到每张卡','分片参数、梯度和优化器状态，并在需要时通信聚合或收集','只把输入 token 压缩成 1 bit','完全消除跨卡通信'], a:[1], ex:'ZeRO/FSDP 通过分片训练状态降低单卡驻留量，阶段越高通常节省越多参数/梯度副本，但会增加按需 all-gather、reduce-scatter 和调度复杂度。它可与 TP、PP 组合。'},
{t:'e', q:'请为一个 70B 级模型制定训练显存预算和 OOM 排查顺序。', ans:'先按参数、梯度、优化器状态/主权重、激活、通信 buffer、临时 workspace 和碎片逐项列账，明确每项的精度与是否分片。然后用小规模配置跑过至少一个完整 optimizer step，因为 Adam 的状态可能在首次更新时才分配。若 OOM，依次核对 batch/序列长度与激活峰值、梯度累积、Activation Checkpoint、ZeRO/FSDP 分片、临时算子和通信峰值，再考虑 offload 或降低并发；每次只改一个变量并记录吞吐与 MFU。', ex:'好的预算要覆盖 optimizer step 的峰值和通信临时空间，不能只用“参数量×字节数”估算。'},
{t:'e', q:'训练任务中断后，怎样设计可真正恢复的 Checkpoint，并验证恢复正确？', ans:'Checkpoint 至少包含模型参数分片、梯度或优化器状态、学习率调度器、全局 step、随机数状态、数据游标/采样器状态、并行拓扑和版本 manifest。保存后写校验和与完成标记，恢复时检查所有 rank 文件、参数哈希和数据位置；用固定小数据跑若干 step，对比中断前后的 loss、梯度和随机采样结果。模型文件单独可读并不代表训练轨迹可连续恢复。', ex:'恢复一致性依赖训练状态和数据顺序，缺少任一关键元数据都可能造成静默偏移。'}
);

BANKS['llm-post'].questions.push(
{t:'s', q:'下面哪种需求最适合优先使用 RAG，暂不做继续预训练？', opts:['需要模型掌握稳定的领域语法和写作风格','企业制度每周更新，并要求回答给出可追溯证据','需要改变基础代码补全能力','需要让模型遵循固定输出格式'], a:[1], ex:'频繁变化且需要引用的事实适合在运行时检索注入，便于更新和审计。CPT 更适合改变领域语言分布，SFT 更适合行为和格式，三者可按失败原因组合。'},
{t:'m', q:'继续预训练（CPT/DAPT）时，合理的工程做法有？', opts:['先用 RAG/SFT 基线确认问题确实来自底层领域建模能力','混入通用回放数据并监控通用能力回退','用领域增益、通用回归和数据污染一起评估','领域数据越少，简单重复采样越能创造新信息'], a:[0,1,2], ex:'CPT 会改变语言建模分布，少量领域数据重复扩增容易过拟合且不能增加信息。应先建立便宜基线，控制领域配比，混入通用数据并持续检测灾难性遗忘。'},
{t:'s', q:'SFT 多轮对话中常见的 Assistant Loss Mask 作用是什么？', opts:['只让模型学习用户问题，跳过回答','主要对 assistant 输出及必要结束标记计算损失，避免把用户输入当成要生成的目标','把所有 token 的 loss 都置为零','只用于量化权重'], a:[1], ex:'部署时模型需要生成 assistant 部分，因此通常只对 assistant 内容和 EOS 等必要标记监督。模板序列化、角色边界和 mask 必须与线上格式一致，否则训练 Loss 可能很好，行为仍会异常。'},
{t:'s', q:'Packing 多条样本时，最需要防止哪类错误？', opts:['把 GPU 利用率提高','后一个样本通过注意力读取前一个样本的无关内容，或把 loss 计入错误边界','让每条样本都使用相同答案','使所有 token 都变成 padding'], a:[1], ex:'Packing 把多个短样本拼成一个长序列提升 token 利用率，但 EOS 仅是提示，无法自动隔离注意力。需要文档级 mask、独立段边界和正确的 loss mask，位置编码也要与实现约定一致。'},
{t:'f', q:'LoRA 中低秩增量的参数量通常写作 ______（忽略 bias）。', a:['r(d_in+d_out)','r*(d_in+d_out)'], ex:'将 `d_out×d_in` 的更新写成 `BA` 后，A、B 的参数量为 `r×d_in + d_out×r = r(d_in+d_out)`。rank 还需与 alpha、目标模块、学习率和任务回归共同选择。'},
{t:'m', q:'关于 QLoRA，正确的说法有？', opts:['通常冻结 4-bit 底座，只更新较高精度 LoRA 参数','前向计算常需把量化权重按块反量化到计算精度','它主要节省底座权重和优化器状态，不会自动消除激活显存','4-bit 表示意味着端到端显存和延迟严格变成四分之一'], a:[0,1,2], ex:'QLoRA 的底座通常冻结并以低比特存储，矩阵计算仍需反量化和较高精度累加。激活、临时 buffer、长序列和 LoRA 参数仍占显存，实际收益取决于 Kernel 与批处理。'},
{t:'s', q:'Bradley-Terry 偏好模型把两个回答的奖励怎样转成优选概率？', opts:['`P(y_w)=r_w+r_l`','`P(y_w>y_l)=sigmoid(r_w-r_l)`','`P(y_w)=1/r_w`','只比较回答长度'], a:[1], ex:'Bradley-Terry 关注奖励差，奖励差越大，优选概率越接近 1。实际训练常最小化 `-log sigmoid(r_w-r_l)`；Reward Model 的分数是偏好代理，不能直接当最终事实或质量指标。'},
{t:'m', q:'PPO/RLHF 中的 KL 约束和 Reward Hacking 相关判断，正确的有？', opts:['KL 太弱可能让策略跑到 Reward Model 未覆盖的区域','KL 太强可能压制偏好收益','长度膨胀、格式套路化和迎合评分器都可能是 Reward Hacking 症状','只要训练奖励持续上升，就无需独立人工评测'], a:[0,1,2], ex:'KL 提供相对参考策略的漂移尺度，强弱需要结合质量和稳定性调节。Reward Model 与训练目标同源，策略可能利用其盲区，因此必须用持出人工、不同裁判和红队样本验证。'},
{t:'s', q:'DPO 与 GRPO 的关键区别是什么？', opts:['DPO 通常基于离线偏好对直接优化概率比，GRPO 仍需要在线采样并用组内相对奖励估优势','DPO 只能做推理，GRPO 只能做分词','两者都必须训练独立 Value Model','GRPO 完全不需要奖励或参考策略'], a:[0], ex:'DPO 将特定偏好模型与 KL 假设折进离线损失，训练形态接近 SFT；GRPO 对同一提示采样一组回答，用组内奖励构造相对优势，仍支付 rollout、奖励和策略稳定成本。'},
{t:'m', q:'关于测试时计算（CoT、Self-consistency、Best-of-N、Verifier/Search），正确的有？', opts:['Self-consistency 需要多条具有一定多样性的轨迹再聚合答案','Best-of-N 的收益同时取决于候选质量、评分器和 N','Verifier/Search 可以通过扩展和剪枝增加可验证任务的计算','把输出写得更长就必然提升正确率'], a:[0,1,2], ex:'测试时计算用 token、候选数和验证时间换质量。候选高度相关、评分器偏弱或轨迹早早犯错时，增加预算会饱和；生产上应按难度和验证结果动态分配预算。'},
{t:'e', q:'给定“领域术语经常错、输出格式也不稳定、企业事实每天更新”的系统，你会怎样组合 CPT、SFT、LoRA 和 RAG？', ans:'先用现有模型加 RAG 建立可引用事实基线，再分别测试术语/语言分布和行为格式的失败比例。术语和领域语言建模缺口明显时，用小规模 CPT 并混入通用回放；格式与工作流用高质量 SFT，资源有限可用 LoRA/QLoRA。每日更新事实继续放在 RAG，检索结果带版本和来源。每阶段都做领域增益、通用能力、引用正确性、延迟和成本回归，避免把可更新知识硬写进参数。', ex:'方案选择应由失败原因和更新频率驱动，最后用统一评测集验证组合收益。'},
{t:'e', q:'SFT Loss 很低但线上对话质量差，或者 PPO 奖励升高却出现怪异回答，你会如何排障？', ans:'SFT 先核对 Chat Template、角色顺序、assistant mask、EOS、Packing 隔离和训练/线上 Tokenizer 版本，再按任务桶看持出回归；单一平均 Loss 不能定位行为缺口。PPO 则检查奖励尺度、长度分布、KL/clip、旧新策略版本、rollout 数据和 Reward Model 持出表现，同时用人工盲测、独立裁判和红队样本寻找 Reward Hacking。修复后固定版本重跑基线，记录每次数据、模板和超参变化。', ex:'两个症状都要求把“训练指标”与“真实行为”分开，并沿数据、模板、优化器和评测链路定位。'}
);

BANKS['llm-infer'].questions.push(
{t:'s', q:'Temperature 对 logits 的典型作用是？', opts:['用 `z_i/T` 调整分布，T<1 更尖锐、T>1 更平坦','直接删除所有低概率 token','只改变最大 token 的索引','只影响 Prefill，不影响 Decode'], a:[0], ex:'Temperature 在采样前缩放 logits，随后仍需 Softmax。T 趋近 0 时行为接近 Greedy，但错误的高概率 token 仍可能稳定出现；Top-k、Top-p 和惩罚的处理顺序也会影响结果。'},
{t:'m', q:'关于 Greedy、Beam Search、Top-k/Top-p 和结构化生成，正确的有？', opts:['Greedy 每步选择当前最大概率 token','Beam Search 维护多条累计对数概率较高的前缀','Top-p 保留累计概率达到阈值的最小候选集合','合法 JSON 生成后无需做字段权限和业务校验'], a:[0,1,2], ex:'Greedy 延迟低且通常可复现；Beam 维护多个候选，更适合目标明确的条件生成；Top-p 的候选数随分布变化。语法约束只能保证结构，字段范围、权限、SQL 读写和幂等性仍需业务层校验。'},
{t:'f', q:'自回归推理中，历史 Q 用完即弃，通常需要缓存历史 ______ 和 ______。', a:['K和V','K,V','K V','KV','K/V'], ex:'历史 K/V 会在后续每个 Decode step 被新 Q 读取；历史 Q 只参与当前步的注意力，之后无需保留。缓存大小还与层数、序列长度、KV 头数、头维、元素字节数和并发数有关。'},
{t:'s', q:'Prefill 与 Decode 的主要性能特征通常如何区分？', opts:['Prefill 处理整段提示，常有较高并行度；Decode 每步新增一个 token，常受带宽和调度限制','两者都只处理一个 token','Prefill 永远只受网络限制，Decode 永远只受算力限制','Decode 不需要读取历史状态'], a:[0], ex:'Prefill 已知整段输入，可用大矩阵提高计算利用率，但长提示有平方注意力成本；Decode 复用 KV，却需要反复读取历史 KV 和权重，常呈显存带宽受限。实际瓶颈要通过剖析确认。'},
{t:'m', q:'关于 FlashAttention、PagedAttention 和 Continuous Batching，正确的有？', opts:['FlashAttention 通过分块和 Online Softmax 避免物化完整注意力矩阵，主要减少 HBM IO','PagedAttention 用固定 block 和页表管理非连续 KV','Continuous Batching 可在 Decode step 间动态加入和退出请求','PagedAttention 等同于把 KV 换入磁盘'], a:[0,1,2], ex:'FlashAttention 保持数学结果等价，重点优化片上存储与 HBM 读写；PagedAttention 借鉴分页映射思想，页由推理调度器管理并驻留设备内存。Continuous Batching 需要公平调度和长请求防饿死策略。'},
{t:'s', q:'Prefix Cache 的命中键为什么不能只使用原始文本哈希？', opts:['原始文本没有任何意义','模型、Tokenizer、Chat Template、Adapter、权限和安全上下文变化都可能改变 KV 状态','哈希算法无法处理中文','缓存只支持数字输入'], a:[1], ex:'相同文字在不同模板、模型版本、位置状态、Adapter 或权限上下文下可能得到不同 KV。命中键应纳入所有影响计算和信任边界的版本字段，公共前缀与租户私有前缀也要隔离。'},
{t:'s', q:'投机解码在什么条件下可以保持目标模型的输出分布？', opts:['Draft 生成后直接全部接受','Target 对 Draft token 逐步验证，并在拒绝点按校正规则重采样','只要 Draft 比 Target 小就一定无损','把 Temperature 固定为 0 即可'], a:[1], ex:'无损投机解码会让 Target 验证 Draft 前缀，在拒绝点依据 Target 的剩余概率校正采样，因此整体分布仍与 Target 一致。真实加速还取决于 Draft 接受率、验证 Kernel、搬运开销和候选长度。'},
{t:'s', q:'PTQ 与 QAT 的主要差别是？', opts:['PTQ 在训练后用校准数据估计量化尺度；QAT 在训练中模拟量化误差并适配权重','PTQ 必须重新训练全部参数；QAT 完全不需要数据','两者只针对 Tokenizer','QAT 只能量化 KV Cache'], a:[0], ex:'PTQ 成本低、部署快，但对激活异常值和校准集敏感；QAT 把量化误差纳入训练，通常更有机会保精度，代价是训练资源和流程复杂度。'},
{t:'m', q:'关于 W4A16、W8A8/FP8 和 KV 量化，合理的判断有？', opts:['W4A16 主要节省权重存储，激活仍以较高精度计算','W8A8/FP8 更依赖端到端矩阵 Kernel 和累加精度','KV 量化会直接影响长上下文历史信息，应单独做质量回归','量化位宽越低，端到端延迟一定线性下降'], a:[0,1,2], ex:'低比特权重可减少带宽和显存，但实际速度取决于反量化是否融合、矩阵尺寸和硬件支持。KV 量化的误差会随上下文和层数累积，需单独评估召回、事实性和长序列稳定性。'},
{t:'e', q:'设计一个支持流式输出的 LLM 服务请求生命周期，并说明 TTFT、TPOT、Admission 和背压如何配合。', ans:'请求依次经过鉴权/限流、Tokenizer、模型路由、Admission、Prefill 排队、KV 分配、Decode 调度、流式发送、结束或取消和资源回收。Admission 依据输入 token、最大输出、当前 KV 水位和租户配额做预算；TTFT 主要反映排队与 Prefill，TPOT 主要反映 Decode、带宽和调度。输出通道变慢时要传播背压，取消要停止后续 Decode 并安全归还 KV 页；超时、OOM 和过载时按策略拒绝、降级或切小模型，并记录分阶段 trace。', ex:'服务题要把状态机、容量预算、指标和失败路径一起讲清楚。'},
{t:'e', q:'线上出现 TTFT 升高但 TPOT 正常，同时 KV 水位频繁打满，你会怎样定位和处理？', ans:'先按 trace 拆分网关排队、Tokenizer、Admission、Prefill 和首 token 时间，确认问题集中在 TTFT 前段；再按输入长度、最大输出、租户和模型版本分桶看 KV 分配与释放。KV 水位打满时设置输入/输出硬上限，启用 Chunked Prefill、Paged KV、配额和公平调度，必要时降低最大新 token 或切换小/量化模型。检查取消路径、页回收和缓存泄漏，最后用真实长度分布压测验证 TTFT、TPOT、Goodput 与拒绝率。', ex:'先分阶段定位，随后治理资源上限和回收路径，避免只盯 Decode Kernel。'},
{t:'m', q:'关于分布式推理和 Prefill-Decode 解耦，正确的说法有？', opts:['TP 切分层内矩阵，适合大模型单请求但每步同步频繁','PP 按层切分，batch 较小时会有流水线气泡','EP 需要把 token 路由到专家并承担 All-to-All','P/D 解耦后仍要处理 KV 传输、版本一致和小请求额外开销'], a:[0,1,2,3], ex:'TP、PP、EP 分别在层内、层间和专家维度切分，各自有通信与调度代价。P/D 解耦能分别扩缩容两类负载，但会增加 KV 网络传输、故障恢复和调度复杂度，低负载短请求可能变慢。'}
);

{t:'s', q:'把上下文窗口从 8K 扩到 128K，最完整的约束组合是？', opts:['只修改 max_position_embeddings 即可','位置编码外推、注意力/激活成本、KV 容量、训练分布和信息利用能力都要验证','只增加输出温度','只扩大 Tokenizer 词表'], a:[1], ex:'配置支持长度不等于模型能有效利用长度。需要处理 RoPE 缩放或继续训练，同时评估平方注意力、长序列激活、KV 驻留、Lost in the Middle、多跳和冲突证据任务。'},
{t:'m', q:'降低长上下文成本的常见手段及其代价包括？', opts:['滑窗/稀疏注意力减少全局连接，可能损失远距离依赖','Context Parallel 在设备间切分序列，需要交换必要状态','RoPE 缩放或 YaRN 需要联合短长长度回归','把窗口增大后所有 token 都会被同等有效利用'], a:[0,1,2], ex:'稀疏连接和序列并行可以降低单卡成本，但会引入信息可见性、通信和位置分布问题。长短联合回归能发现短文本退化与长文本收益之间的权衡。'},
{t:'s', q:'Needle 测试通过后，仍不能推出哪项结论？', opts:['模型在某一位置能定位简单字符串','模型对所有真实文档问答、多跳推理和冲突证据都可靠','可以继续测试不同位置和干扰强度','需要与业务任务集结合'], a:[1], ex:'Needle 主要检验定位能力，真实业务还涉及多跳组合、表格、长文档结构、证据冲突和忠实生成。通过单一 Needle 用例不能替代分层业务评测。'},
{t:'f', q:'长文档中相关信息位于开头和结尾容易被利用，位于中间较难利用，这种现象常称为“Lost in the ______”。', a:['Middle','middle','中间'], ex:'Lost in the Middle 描述有效上下文利用的位置信息偏差。评测应改变证据位置、干扰内容、长度和问题类型，不能只把 token 数加长。'},
{t:'s', q:'在“制度每天更新、答案必须引用来源”的问答场景中，长上下文与 RAG 如何选择？', opts:['把所有历史文档永久拼进窗口即可','用 RAG 选择可更新证据并保留来源，长上下文只承载必要片段和跨段推理','RAG 只能用于图像','长上下文天然能保证引用正确'], a:[1], ex:'RAG 便于更新、引用和控制输入规模，长上下文适合需要同时比较多个相关片段的推理。两者可以组合，仍需验证检索召回、证据蕴含和最终引用忠实性。'},
{t:'s', q:'主流生成式视觉语言模型（VLM）把图像送入语言模型前，通常需要哪些组件？', opts:['视觉编码器提取 patch 特征，再由 Projector/Q-Former 映射到语言隐藏空间','只把 JPEG 字节直接拼到文本后面','只使用 Tokenizer，不需要视觉编码器','先把图像转换成随机 token'], a:[0], ex:'视觉编码器将像素转成视觉特征，Projector 或 Q-Former 做维度和语义空间对齐，随后视觉 token 与文本一起进入生成式 LLM。不同模型会采用拼接、Cross-Attention 或压缩器等变体。'},
{t:'m', q:'多模态推理成本和幻觉风险的常见来源包括？', opts:['高分辨率、视频帧和 OCR 会增加视觉 token 与 KV 占用','patch 下采样或压缩可能丢失小字和局部细节','区域级数据、动态切图和工具核验有助于改善视觉幻觉','图像 token 数与分辨率永远线性且固定'], a:[0,1,2], ex:'视觉 token 数取决于分辨率、patch、压缩器、帧采样和实现，不能用固定常数估算。局部裁剪、OCR 分支、区域标注和外部核验可针对细节错误，但会增加延迟或系统复杂度。'},
{t:'s', q:'多模态训练先冻结视觉编码器和语言底座、优先训练连接器，主要目的是什么？', opts:['先学习两种表示空间的坐标映射，降低同时扰动两端底座的风险','让模型永远不能理解文本','减少所有数据标注','保证视觉模型不需要任何预训练'], a:[0], ex:'连接器先对齐视觉和语言隐藏空间，训练更稳定、成本更低；随后可逐步解冻部分模块，用单模态和多模态回归监控遗忘。冻结策略会随数据规模和目标任务调整。'},
{t:'e', q:'设计一个“长文档 + 图片表格”问答系统，要求可引用、可排障，并控制上下文成本。', ans:'先解析文档和图片，给文本段落、表格单元格和图像区域建立带页码/坐标的索引；检索阶段按问题召回少量文本与高分辨率局部图像，保留来源 ID。对需要跨段比较的请求，再把排序后的证据放入长上下文，并限制总 token、图片分辨率和帧数。生成后做引用覆盖、数值/字段校验，必要时调用 OCR、表格解析或计算工具。监控召回、证据蕴含、视觉 OCR 错误、TTFT/TPOT 和 KV 水位，按失败类型回流评测集。', ex:'方案要把检索、视觉编码、上下文预算、引用核验和线上指标连起来。'},
{t:'e', q:'RoPE 扩展后长文本能力提升，但短文本回归下降，你会怎样设计实验和修复？', ans:'按长度分桶建立短、中、长联合评测，加入不同证据位置、干扰强度和多跳任务，先确认退化来自位置分布还是数据/模板变化。对比不同 RoPE 缩放、频率分段或 YaRN 配置，配合混合长度继续训练和通用回放；也可按长度路由不同模型或策略。每个候选都同时测质量、KV/Prefill 成本和延迟，选取满足短文本底线且长文本收益稳定的版本。', ex:'长上下文优化需要联合验证能力与成本，单看最大长度或单一 Needle 分数不足。'}

BANKS['llm-reliability'].questions.push(
{t:'s', q:'知识性幻觉与忠实性幻觉的区分，正确的是？', opts:['知识性幻觉与外部事实不符；忠实性幻觉没有被给定上下文、工具结果或证据支持','两者都只表示语法错误','知识性幻觉只发生在图像，忠实性幻觉只发生在文本','只要模型多次输出相同答案，就不存在幻觉'], a:[0], ex:'知识性幻觉关注答案是否符合世界事实，忠实性幻觉关注答案是否被当前证据支持。降低温度只能减少随机性，无法修复高概率错误；高风险结论仍需检索、工具或独立证据核验。'},
{t:'m', q:'降低事实性风险的分层措施通常包括？', opts:['检索或工具提供可追溯证据','生成时限制可引用来源并做结构化校验','用置信校准、阈值和明确拒答处理证据不足','只把 Temperature 调到 0 就完成治理'], a:[0,1,2], ex:'可靠性是证据供给、生成约束、结果核验和拒答策略的组合。RAG 改善证据供给，却仍可能检索错误、引用错误或生成不忠实，必须分别评测。'},
{t:'s', q:'评估引用质量时，哪组指标比“URL 是否存在”更完整？', opts:['检索召回、证据蕴含、断言覆盖和最终忠实','只统计 URL 字符串长度','只看回答 token 数','只看模型温度'], a:[0], ex:'引用链路至少要检查是否找到了相关证据、证据是否支持断言、关键断言是否都覆盖，以及最终回答是否忠实引用。链接存在只能说明格式通过。'},
{t:'m', q:'大模型评测分层和指标匹配的做法，正确的有？', opts:['公开基准用于粗筛，私有业务集衡量真实任务','Pass@k 适合代码等可执行结果，Pairwise 适合偏好比较','线上 A/B 和人工样本用于验证产品价值与副作用','所有任务都用单一平均准确率即可'], a:[0,1,2], ex:'评测集、指标和决策目标要对应。公开基准便于趋势观察，私有集抵抗污染并贴近业务，线上与人工验证延迟、成本、用户偏好和安全副作用。'},
{t:'s', q:'LLM-as-a-Judge 最常见的偏差组合包括？', opts:['位置、长度、风格和自偏好偏差','只会出现 GPU 温度偏差','只与 Tokenizer 词表大小有关','Judge 永远比人工稳定且无需校准'], a:[0], ex:'裁判模型可能偏好先出现的答案、较长或更像自身风格的答案，也可能受模型名和格式影响。常用交换 A/B 顺序、多裁判聚合、盲化和人工校准降低偏差。'},
{t:'f', q:'代码任务中“至少有一个样本通过执行验证”的指标常写作 ______。', a:['Pass@k','pass@k'], ex:'Pass@k 衡量生成 k 个候选中至少一个通过执行或测试的概率，适合可验证代码等任务。它与单次准确率、Best-of-N 选优质量的口径不同，报告时要说明采样数和验证器。'},
{t:'m', q:'发现评测分数异常升高时，数据污染排查可以包含？', opts:['训练来源审计和时间切分','n-gram 或语义重叠检测','新建私有问题、持出集和人工抽样','只把测试集再公开发布一次'], a:[0,1,2], ex:'污染可能来自直接重复、改写重叠或时间泄漏，需要来源、文本/语义相似度、时间切分和新鲜私有集组合检查。单一 n-gram 方法会漏掉改写和跨语言重叠。'},
{t:'s', q:'越狱与 Prompt Injection 的目标边界，较准确的描述是？', opts:['越狱主要试图绕过模型安全策略；Prompt Injection 主要试图改变应用原定指令或工具行为，来源可为用户或外部数据','两者都只来自系统管理员','越狱只影响延迟，Prompt Injection 只影响显存','两者完全没有交集'], a:[0], ex:'二者可能重叠，但判断应看攻击目标和信任边界。网页、文档和工具结果中的不可信指令属于间接注入，应用不能把检索内容自动当作高优先级系统指令。'},
{t:'s', q:'模型版本回滚时，至少还应同步考虑哪些组件？', opts:['Tokenizer、Chat Template、Adapter、护栏、策略配置和量化/Kernel 版本','只回滚前端颜色','只删除用户缓存','只修改随机种子'], a:[0], ex:'线上行为由权重和外围协议共同决定。版本回滚要绑定整套可执行组合，并验证缓存键、模板、权限和安全策略，否则可能出现“权重回去了，行为仍不一致”。'},
{t:'e', q:'请为一个“客服问答 + 高风险政策解释”系统设计可靠性评测方案。', ans:'先把任务拆成事实问答、引用、拒答、冲突证据、多轮上下文和高风险政策类别，建立带版本来源的私有集与边界集。离线分别测检索召回、证据蕴含、断言覆盖、最终忠实、拒答精度、延迟和成本；用公开基准做趋势参考，代码/结构化任务可用执行校验。LLM Judge 采用 A/B 交换、多裁判和人工校准，防位置与长度偏差。上线做影子流量和 A/B，监控用户纠正、升级率、误拒、越权和 p95/p99 延迟，并为每次模型、模板、Tokenizer、检索或护栏变更保存可回归版本。', ex:'评测必须覆盖“答案对不对”和“风险场景是否正确拒答”，并把离线、人工、线上指标串联。'},
{t:'e', q:'系统被发现会执行网页中的恶意指令并偶发泄露内部信息，你会怎样处置并长期治理？', ans:'先暂停高风险工具权限和自动执行，保留请求、检索文档、工具调用、模型/模板版本及审计日志，隔离受影响租户并轮换可能泄露的凭据。短期增加输入来源标记、工具参数白名单、最小权限、敏感操作人工确认和输出敏感信息检测；把网页/文档内容当作不可信数据，禁止其改变系统级策略。随后做针对直接越狱和间接注入的红队集，评估漏报与误报，灰度发布修复后的模型/护栏组合，保留可一键回滚的权重、Tokenizer、Adapter、Kernel 和策略版本。', ex:'处置顺序应包含止损、取证、权限收缩、修复验证和可回滚发布，单一分类器无法覆盖完整风险。'},
{t:'m', q:'安全治理中合理的长期机制包括？', opts:['安全 SFT/偏好优化与部署侧护栏并行','按风险等级设置阈值、升级和人工确认路径','持续红队、回归评测、审计和版本灰度回滚','把所有不确定请求一律拒绝且不监控误拒率'], a:[0,1,2], ex:'安全能力来自训练、输入/输出控制、权限、人工流程和持续验证的闭环。阈值过严会带来误拒和可用性损失，应分层监控安全召回、误拒率和用户影响。'}
);
