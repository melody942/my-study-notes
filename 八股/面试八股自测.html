BANKS['agent-foundation'].questions.push(
  {t:'s', q:'下面哪项最准确地描述 Agent？', opts:['一个更大的语言模型，参数越多就越自主','围绕目标运行、由宿主程序控制 Observe-Decide-Act 闭环的系统','把所有历史对话拼接进 Prompt 的聊天页面','只负责自动点击网页的 RPA 脚本'], a:[1], ex:'Agent 的核心是目标驱动的闭环。宿主程序读取状态和环境，模型在受限动作集合中选择下一步，宿主校验并执行动作，再把结果作为新的观察。模型大小、历史消息数量或是否操作网页都不能单独定义 Agent。'},
  {t:'m', q:'关于 Observe-Decide-Act 三个阶段，下列说法正确的有？', opts:['Observe 应收集已确认事实、工具结果和当前任务状态','Decide 可以直接绕过宿主权限检查调用任意外部 API','Act 由宿主校验动作名称、参数、权限和预算后执行','工具错误和用户补充信息都应成为下一轮观察'], a:[0,2,3], ex:'Observe 负责把当前可验证信息整理给模型；Decide 只是在宿主声明的候选动作中做选择，权限仍由代码掌握；Act 记录执行结果、错误和耗时，供下一轮使用。把模型输出当作已执行动作会破坏系统边界。'},
  {t:'s', q:'下列哪类步骤最适合保留在确定性工作流中？', opts:['从自然语言中判断用户真正想查的对象','根据已确认金额和规则执行扣款事务','在多份文档中寻找可能的同义表达','根据工具返回结果决定下一步补问'], a:[1], ex:'金额计算、权限判断、事务提交等分支可枚举且副作用高，适合由代码和数据库事务保证。模型可以负责意图理解和信息补全，最终写操作仍应经过确定性服务。'},
  {t:'s', q:'L2 受控 Agent 通常至少需要哪些约束？', opts:['只要换成更强模型即可，无需运行时约束','工具白名单、最大步数或费用、状态记录和失败回退','允许模型自行增加工具并永久修改系统提示','取消所有人工接管以提高自主性'], a:[1], ex:'L2 代表在低风险范围内连续执行。工具白名单限制动作空间，步数和费用预算限制循环，状态记录支持恢复，失败回退避免一次错误扩散。模型能力提升不能替代这些边界。'},
  {t:'s', q:'最小 Agent 运行时中，哪项负责保存每轮输入、动作、观察和错误？', opts:['模型权重','状态存储与事件日志','前端渲染组件','Embedding 向量维度'], a:[1], ex:'状态存储保存可恢复的任务状态，事件日志记录事实和审计轨迹。模型上下文只是某轮输入视图，前端和向量维度都不承担运行状态持久化。'},
  {t:'m', q:'哪些条件可以作为代码层的终止或升级信号？', opts:['达到可验证的成功条件','达到时间、步数、token 或费用预算','连续动作没有带来新事实或进展','模型在文本中说“我已经完成”'], a:[0,1,2], ex:'成功条件、预算耗尽和无进展都能由宿主检查。模型声称完成只能作为候选信号，仍需校验外部状态；否则容易出现“回答完成、事务未完成”的假成功。'},
  {t:'s', q:'ReAct 与 Plan-and-Execute 的主要差异是什么？', opts:['ReAct 先生成固定完整计划，Plan-and-Execute 每步临时决定','ReAct 交替观察和行动，Plan-and-Execute 先形成计划再按节点执行','两者都要求多个 Agent 协作','两者只适用于纯文本问答'], a:[1], ex:'ReAct 适合环境信息不断变化的任务，模型根据每次观察决定下一步。Plan-and-Execute 适合目标可拆解、希望跟踪进度和依赖的长任务，计划可被后续观察触发局部调整。'},
  {t:'m', q:'工作流模式与适用场景匹配正确的有？', opts:['chaining：步骤顺序稳定、后一环依赖前一环输出','routing：根据意图或条件选择互斥分支','parallel：彼此独立的子任务可并行执行','parallel：所有子任务必须共享同一个可变上下文且无合并规则'], a:[0,1,2], ex:'Chaining、routing、parallel 分别解决顺序依赖、分支选择和独立任务并发。并行任务若共享可变状态，需要明确合并和冲突策略，否则并发会引入竞态。'},
  {t:'s', q:'Agent 模型路由应优先优化哪一组目标？', opts:['只看单次离线准确率','任务成功率、P95 时延、token/请求成本、工具稳定性和可用性的联合目标','只看模型参数量','只看输出文风是否一致'], a:[1], ex:'模型选择是多目标优化。简单分类和抽取可交给小模型，复杂规划和失败修复再升级到强模型；每条路由都要有超时、配额和降级策略。'},
  {t:'s', q:'Shadow 测试新模型时，正确做法是？', opts:['把真实请求复制给候选模型，候选结果不影响用户且不写真实状态','让候选模型直接执行真实扣款以验证完整链路','只拿人工编写的理想问题测试','候选模型出错后立即切全量流量'], a:[0], ex:'Shadow 将真实输入复制到候选版本，观测质量、时延和成本，禁止候选产生真实副作用。它适合发现线上分布差异，之后仍需通过离线回放、Canary 和门禁逐步放量。'},
  {t:'f', q:'Agent 最常用的“观察—决策—行动”闭环英文缩写是？', a:['Observe-Decide-Act','ODA'], ans:'Observe-Decide-Act（ODA）。宿主先收集状态和环境事实，模型选择动作，宿主执行并把结果写回下一轮。', ex:'只写“ReAct”不能覆盖本章强调的宿主控制边界；ODA 用于描述 Agent 运行时的职责分工。'},
  {t:'e', q:'请设计一个“查询并申请退款”的 Agent MVP，说明哪些步骤交给模型，哪些步骤必须由代码或人工控制。', ans:'先定义成功条件：得到退款受理号或明确的人工升级结果。模型负责识别退款意图、从对话提取订单号、在缺字段时发起澄清，并在查询结果后选择下一步。宿主保存订单号、资格判断、已确认金额和重试次数，限制工具白名单并校验 schema。订单查询和政策检索可以由工具执行；金额计算、资格校验、退款提交由确定性服务完成，超过金额阈值要求人工确认。每次副作用动作带幂等键，代码检查成功、失败、预算、取消和无进展，事件日志支持审计和恢复。', ex:'回答应同时覆盖目标、闭环、模型与宿主分工、风险边界、幂等和终止条件。只说“让模型自动调用退款接口”没有说明副作用控制，无法形成可上线方案。'}
);

BANKS['agent-context-tools'].questions.push(
  {t:'s', q:'Context Engineering 相比只写 Prompt，新增的核心职责是什么？', opts:['把模型参数量扩大','在运行时选择、排序、压缩、标注并版本化状态、证据和历史消息','把所有数据永久放入上下文','用正则表达式替代模型'], a:[1], ex:'Prompt Engineering 关注单次指令、示例和输出约束；Context Engineering 还要处理动态状态、检索证据、历史裁剪、优先级和预算。上下文是某轮输入视图，源状态仍应独立保存。'},
  {t:'m', q:'上下文预算紧张时，哪些做法更稳妥？', opts:['保留系统约束、用户目标和当前任务状态','先删除重复或低价值历史，再压缩摘要','缩小检索范围并保留证据来源','无条件从消息头部截断直到不超限'], a:[0,1,2], ex:'约束和当前任务状态的优先级高于寒暄与重复历史。应按层级压缩、筛选证据，并记录摘要版本；机械截断可能删掉目标、否定条件或工具契约。'},
  {t:'s', q:'“Lost in the Middle”主要提醒我们什么？', opts:['上下文越长，模型一定越准确','关键信息放在长上下文中部可能更难被利用，需要排序、分段或摘要验证','只要使用向量检索就会消失','它只描述模型训练速度'], a:[1], ex:'长上下文会带来位置利用不均。可以把高优先级约束和关键证据放在稳定位置，采用分段摘要或专门评测验证模型是否真正使用了中部信息。'},
  {t:'f', q:'Function Calling 中，描述工具参数字段、类型和必填约束的契约通常叫作什么？', a:['schema','JSON Schema','参数 schema'], ans:'参数 schema（通常使用 JSON Schema 表达）。它描述字段形状和基础约束，宿主还要继续校验权限、业务状态、范围和预算。', ex:'Schema 校验通过只代表形状合法，不能证明订单存在、用户有权限或操作可执行。'},
  {t:'s', q:'Structured Output 能保证什么，仍不能独立保证什么？', opts:['能保证模型一定理解业务规则','主要保证输出语法和字段形状，业务语义仍需宿主校验','能自动执行外部工具','能替代所有单元测试'], a:[1], ex:'结构化输出减少解析歧义，便于运行时消费。业务语义校验要检查实体存在、权限、状态转移和数值范围；这些条件无法仅靠 JSON 结构表达。'},
  {t:'m', q:'执行模型工具调用前，宿主通常应检查哪些项目？', opts:['工具名称是否在注册表中','参数 schema、类型和业务范围','当前用户/租户权限以及副作用审批','模型输出的语气是否符合文风'], a:[0,1,2], ex:'工具名称、参数、权限和当前业务状态共同构成执行门槛。语气只影响展示，不决定动作是否合法。原始模型输出和校验错误也应留存，便于修复与归因。'},
  {t:'s', q:'对可能产生副作用的工具，幂等键最主要解决什么问题？', opts:['让模型生成更长的回答','重试或重复投递时避免同一个业务动作被成功执行多次','提升向量检索召回率','代替权限校验'], a:[1], ex:'网络超时后，客户端无法确定请求是否已到达下游。稳定的业务幂等键让下游把重复请求映射到同一结果；它仍需配合状态查询、超时和对账，不能替代权限检查。'},
  {t:'s', q:'工具调用返回超时且结果未知时，较稳妥的处理是？', opts:['立即无限重试写操作','先用幂等键查询业务状态，再决定重试、补偿或人工核对','直接告诉用户操作成功','删除本地日志避免重复'], a:[1], ex:'超时只说明响应未按时返回，远端可能已经成功。先查询状态能区分未执行、已成功和部分成功；随后按幂等和补偿策略处理，不能把未知状态当失败或成功。'},
  {t:'m', q:'高质量 Agent 工具接口通常具备哪些特征？', opts:['单一职责、参数可描述、结果结构化','错误类型可区分，包含可重试性或恢复建议','副作用动作具有幂等、状态查询或补偿路径','把整个业务系统封装成一个无边界万能工具'], a:[0,1,2], ex:'工具是 Agent 的系统边界，接口应让模型容易选择、让宿主容易校验、让运维容易观测和恢复。万能工具隐藏权限和事务边界，错误难以定位，也会扩大模型的决策空间。'},
  {t:'s', q:'MCP 的角色关系正确的是？', opts:['Host 管理会话与策略，Client 连接 Server，Server 暴露 Tools、Resources、Prompts','Server 直接拥有宿主全部权限','Client 只负责渲染网页','MCP 自动提供幂等和权限审批'], a:[0], ex:'MCP 统一宿主访问外部上下文和工具的交互方式。权限、审计、幂等和租户隔离仍由平台执行层负责，协议本身不会自动赋予这些保障。'},
  {t:'s', q:'A2A 相比单个工具调用，主要解决哪类问题？', opts:['压缩 Token','Agent 之间的能力发现、任务委托和状态回传','替代数据库事务','只传输 UI 像素'], a:[1], ex:'A2A 的交互粒度通常高于一个函数：一个 Agent 可以把带目标、约束和回传状态的子任务委托给另一个 Agent。仍需定义身份、权限、超时、幂等和错误契约。'},
  {t:'e', q:'请设计一个“创建退款申请”工具的契约与执行流程，说明 schema、权限、幂等、超时和未知结果如何处理。', ans:'输入至少包含 tenant_id、order_id、amount、reason、request_id 和用户确认信息；schema 约束类型、金额非负、reason 枚举和必填字段。宿主从认证上下文取得租户与用户身份，不接受模型覆盖；执行前查询订单状态、退款资格和金额上限。request_id 作为稳定幂等键，工具返回受理号、状态和可重试错误。超时后先查询 request_id 的业务状态，已受理则复用结果，未受理才允许有限重试；部分成功进入对账或人工队列。记录完整 trace、schema 版本和审计事件。', ex:'重点在“结构合法”和“业务可执行”分层，以及未知状态处理。只给一段 JSON 字段而不说明权限、幂等和状态查询，工具仍然不可靠。'}
);

BANKS['agent-rag'].questions.push(
  {t:'s', q:'生产级 RAG 通常分成哪两条主要路径？', opts:['只在在线请求中临时解析所有文档','离线摄取/解析/索引与在线查询/生成/引用','训练模型和删除模型','前端渲染和 CSS 编译'], a:[1], ex:'离线路径负责解析、切块、Embedding、倒排和版本发布；在线路径负责权限过滤、召回、重排、上下文组装、生成和引用。分开后才能独立扩缩、回滚和评测。'},
  {t:'s', q:'动态、长尾且需要引用和及时撤回的知识，优先采用哪种方案？', opts:['只把知识写进模型权重','RAG，并保存来源、版本和权限元数据','只依赖更长的系统 Prompt','让用户自行记住答案'], a:[1], ex:'RAG 允许增量更新、按权限检索并追溯证据。微调更适合行为、风格和格式；把经常变化的事实硬编码进权重会增加更新和撤回成本。'},
  {t:'m', q:'即使检索到了相关证据，答案仍可能出错的原因包括？', opts:['证据与问题条件不完整或版本过期','模型没有忠实使用证据，或把不同片段拼成错误结论','引用映射丢失，无法核对 claim 来源','只要 Recall@K 高，生成一定正确'], a:[0,1,2], ex:'召回覆盖只说明候选中出现了证据。证据可能缺少限定条件，模型也可能忽略、误读或混合片段；因此还要评估引用覆盖、Faithfulness 和端到端正确率。'},
  {t:'s', q:'切块中的“语义闭包”指什么？', opts:['每个块必须包含整本书','块内保留理解核心陈述所需的主语、条件和结论','块只保留关键词，不保存上下文','所有块长度必须完全相同'], a:[1], ex:'检索命中的块应能独立支持一个事实或条件。只有数字、结论缺少适用范围，或表格行脱离表头，都会破坏语义闭包并导致生成误判。'},
  {t:'m', q:'索引块的元数据通常应包含哪些关键信息？', opts:['文档 ID、路径、标题层级和页码','内容/解析/Embedding 版本与哈希','租户、ACL 和删除状态','随机生成且每次更新都变化的 ID'], a:[0,1,2], ex:'来源定位、版本和权限是引用、增量更新及隔离检索的基础。稳定的内容哈希和版本键支持幂等；每次随机换 ID 会让去重、删除和回滚变得困难。'},
  {t:'s', q:'索引发布中的 alias 与 tombstone 分别解决什么问题？', opts:['alias 用于原子切换在线版本，tombstone 先标记删除并过滤旧记录','alias 用于保存 Prompt，tombstone 用于压缩向量','两者都只负责提高 Embedding 维度','alias 让旧版本继续可见，tombstone 恢复被删数据'], a:[0], ex:'新索引构建完成后原子切换 alias，查询不会读到半成品。删除先写 tombstone 并在查询过滤，物理压实可异步完成；这样能兼顾在线可用性和最终一致。'},
  {t:'f', q:'对产品编号、错误码和稀有专有名词特别有效的稀疏检索算法是？', a:['BM25','bm25'], ans:'BM25。它利用词频、逆文档频率和长度归一化，对精确词匹配和稀有词很敏感；稠密向量检索可补充同义表达。', ex:'混合检索时还要处理 BM25 分数与向量分数尺度不同的问题，可使用排名融合或校准后的加权。'},
  {t:'m', q:'关于召回、ANN 和重排，下列说法正确的有？', opts:['Bi-Encoder 可独立编码 query 和文档，适合大规模 ANN 召回','Cross-Encoder 联合编码 query/文档，精度高但适合有限 top-K','HNSW、IVF、PQ 在速度、内存和召回之间做折中','Cross-Encoder 应对全库每篇文档逐一计算以获得最佳结果'], a:[0,1,2], ex:'Bi-Encoder 预计算文档向量，适合先筛出几十到几百个候选；Cross-Encoder 再做细粒度比较。HNSW、IVF、PQ 的参数要用 Recall@K、P95 和内存联合评估，不能只看一个指标。'},
  {t:'s', q:'当查询和文档向量都做了 L2 归一化后，Cosine 相似度与哪种计算等价？', opts:['向量长度之和','点积','欧氏距离平方必然为 0','BM25 分数'], a:[1], ex:'单位向量满足 cos(q,d)=q·d。归一化约定必须与训练目标和索引实现一致；未归一化时点积还会受到向量范数影响。'},
  {t:'s', q:'何时更适合启用 Agentic RAG 的 Multi-query 或多跳？', opts:['所有精确编号查询都无条件启用','问题存在术语歧义、实体关系或跨文档条件，需要根据中间证据继续搜索','只为增加轨迹长度','索引完全不可用时让模型凭空生成'], a:[1], ex:'Multi-query 和多跳能提高复杂问题的覆盖，但会增加调用、延迟和噪声。应由问题分类或证据不足信号触发，并设置最大跳数、候选数、去重和停止条件。'},
  {t:'m', q:'Agentic RAG 的生产评测应同时关注哪些维度？', opts:['Recall@K、MRR 或 nDCG 等召回指标','答案正确率、Faithfulness 和 claim 到 chunk 的引用覆盖','P95、检索次数、token 和费用','只看模型输出长度'], a:[0,1,2], ex:'召回、生成忠实度、引用链和系统成本共同决定价值。多搜几次若只增加轨迹和费用，端到端成功率没有提升，就应调整策略或回退到简单链路。'},
  {t:'e', q:'线上出现“Recall@K 很高，但用户答案仍频繁错误”，请给出排查顺序和改进方案。', ans:'先抽取失败样本的 query、候选 chunk、版本和引用链，确认金标准证据是否真的完整、未过期且满足 ACL。若证据缺条件，检查解析、切块、过滤和重排；若证据充分，检查上下文排序、模型是否遗漏否定/数字、claim 分解与 verifier。再用 oracle evidence 固定正确证据，判断生成层上限；用回放比较改写、重排、提示和模型版本。上线前同时看引用覆盖、Faithfulness、任务成功率、P95 和成本，并为知识更新与删除保留 alias/tombstone 回滚路径。', ex:'排查要把召回、证据完整性、上下文组装和生成分开。只调向量维度或直接更换大模型，无法定位究竟是哪一层造成错误。'}
);

BANKS['agent-memory-state'].questions.push(
  {t:'m', q:'关于四类 Agent 记忆，下列匹配正确的有？', opts:['工作记忆：当前计划和工具结果，任务内一致性要求强','情景记忆：发生过的任务事件和时间线','语义记忆：经过确认、可复用的抽象事实','程序性记忆：稳定的操作步骤或偏好，可版本化'], a:[0,1,2,3], ex:'四类记忆按用途和生命周期区分。工作记忆支撑当前执行，情景记忆保留经历，语义记忆保存事实，程序性记忆保存方法；存储和召回策略应随类型变化。'},
  {t:'s', q:'上下文窗口与长期记忆的关系，正确的是？', opts:['窗口中的消息天然永久保存','上下文窗口是单次调用的输入空间，长期记忆需要独立持久化、筛选和召回','长期记忆只存在模型权重中','两者都能作为订单状态的唯一真源'], a:[1], ex:'窗口会随裁剪和任务结束消失，不能承担可靠持久化。长期记忆要记录来源、时间、范围和状态；订单审批等精确业务事实仍由事务数据库或事件系统维护。'},
  {t:'s', q:'工作流状态（如订单号、审批状态）最适合由什么作为真源？', opts:['模型生成的摘要','数据库或事件系统中的结构化状态','随机向量相似度','浏览器 localStorage'], a:[1], ex:'工作流状态需要精确恢复、并发控制和审计，结构化存储更合适。摘要可作为上下文视图，向量库可辅助语义召回，却不能替代状态真源。'},
  {t:'m', q:'长期记忆写入流水线通常应包含哪些步骤？', opts:['从对话或事件中抽取候选记忆','判断显著性、可复用性并做去重','检测与已有事实的冲突并保留来源和时间','无需确认地把每句聊天永久写入'], a:[0,1,2], ex:'写入门槛应高于召回门槛。抽取后还需判断信息是否稳定、是否属于当前用户范围，并进行冲突合并；自动保存所有寒暄会放大噪声和错误传播。'},
  {t:'s', q:'两条同一用户的记忆记录发生冲突时，较稳妥的处理是？', opts:['随机选择一条','依据来源可信度、时间、用户确认和业务规则合并，并保留冲突历史','把两条都无条件放进 Prompt','永远以向量相似度最高者为准'], a:[1], ex:'冲突处理需要可解释规则。例如用户明确确认的新偏好可覆盖旧候选，关键事实还要保留旧版本和来源供追溯。向量相似度只能帮助召回，无法单独决定事实真伪。'},
  {t:'s', q:'长期记忆中的 TTL、用户删除和 tombstone 主要用于什么？', opts:['控制过期、撤回和删除传播，并让查询先过滤无效记录','增加模型上下文长度','替代所有权限检查','保证物理删除瞬间完成'], a:[0], ex:'TTL 可让短期偏好衰减，用户删除需要传播到 SQL、事件、向量索引、缓存和快照；tombstone 先阻止在线召回，物理清理可异步完成。'},
  {t:'s', q:'结构化用户事实与向量库的合理分工是？', opts:['向量库作为唯一事实真源，SQL 只做缓存','SQL/KV 保存结构化事实和版本，向量库辅助语义召回','两者都不保存来源和时间','只把事实写入 Prompt 文件'], a:[1], ex:'结构化事实需要精确更新、约束和审计，适合 SQL/KV；向量库适合按语义找到候选记录。召回后仍要按用户范围、时间和置信度过滤。'},
  {t:'m', q:'事件日志与 checkpoint 的区别正确的有？', opts:['事件日志记录已发生的事实，通常追加写入','checkpoint 是某个时刻可快速恢复的状态投影','恢复可从 checkpoint 继续并 replay 尚未投影的事件','checkpoint 可以覆盖原始事件，二者无需版本'], a:[0,1,2], ex:'事件是事实来源，checkpoint 是性能和恢复边界。保留事件能审计和重建状态；快照损坏或版本迁移时可用事件重放，二者都要有 schema/version。'},
  {t:'s', q:'Replay 长任务时，如何避免重复发送邮件或扣款？', opts:['直接重新执行所有外部调用','外部动作使用稳定幂等键，先查状态，必要时走补偿或人工对账','删除旧事件再重放','让模型决定是否重复'], a:[1], ex:'Replay 只能重建编排状态，外部副作用仍可能已发生。每个 activity 需要幂等键、状态查询或补偿语义；未知结果进入对账，不能依赖模型猜测。'},
  {t:'f', q:'长期记忆写入前，用来表示“未来任务是否值得复用”的核心门槛可概括为“显著性与____性”。', a:['可复用','复用'], ans:'可复用性。候选信息应稳定、与未来任务相关、来源可追溯，并通过冲突和权限检查；一次性的闲聊通常达不到写入门槛。', ex:'“记住得越多越好”会导致召回噪声。实际系统还应加入用户确认、时间衰减和删除机制。'},
  {t:'s', q:'同一长任务被两个 worker 同时恢复时，哪种机制可避免互相覆盖？', opts:['让两个 worker 都直接写最后状态','owner 标识加乐观版本或租约，提交时做条件检查','把状态只放在 Prompt 中','按响应速度选择结果'], a:[1], ex:'owner、乐观版本和租约能确认谁有权推进任务；提交时若版本不匹配就拒绝或重新读取。只按响应速度写入会产生旧状态覆盖新状态。'},
  {t:'e', q:'请设计一个可恢复的多轮客服任务状态模型，覆盖记忆、事件、快照、删除和版本迁移。', ans:'将 conversation、task、event 和 checkpoint 分开建模。task 保存目标、owner、业务状态、deadline 和 schema_version；event 追加记录用户消息、工具结果、审批与错误，带 event_id、时间、租户和来源；checkpoint 保存可恢复的状态投影及最后 event 序号。恢复从最新 checkpoint 继续，必要时 replay 未投影事件，外部动作使用幂等键和状态查询。长期记忆单独存储候选事实、来源、置信度、时间和 TTL，召回前做用户范围过滤；删除通过 tombstone 先阻断在线读取，再传播到索引、缓存、日志和快照。版本升级提供迁移器，旧任务保留回滚和审计信息。', ex:'回答应把业务状态、记忆和事件边界分开。仅保存最后一条 Prompt 会丢失工具事实、并发版本和副作用执行记录。'}
);

BANKS['agent-planning-multi'].questions.push(
  {t:'s', q:'一个可执行计划相比一段自然语言步骤，至少需要补充什么？', opts:['更华丽的措辞','节点 ID、依赖、完成条件、资源预算和失败策略','更多无关背景','只保留最终答案'], a:[1], ex:'调度器和恢复器需要结构化节点。ID 用于追踪，依赖决定 DAG 顺序，完成条件验证进度，预算和失败策略控制资源与回退；自然语言步骤无法稳定承担这些职责。'},
  {t:'m', q:'哪些情况通常会触发局部重规划？', opts:['环境事实变化导致前置条件失效','某节点连续失败或工具能力不可用','用户修改目标或约束','每次节点成功都无条件重做全部计划'], a:[0,1,2], ex:'重规划应响应事实和目标变化，并尽量保留已确认成果。每次成功都全量重做会浪费预算、破坏稳定节点，也让执行难以审计。'},
  {t:'s', q:'DAG 计划中一个节点失败时，优先策略通常是什么？', opts:['立即清空所有已完成节点','根据依赖和失败策略重试、替换或只重规划受影响的子图','忽略失败并宣布任务成功','让模型无限生成替代步骤'], a:[1], ex:'DAG 的依赖关系能标出受影响节点。可重试的瞬态错误走有限重试，能力缺失可替换节点，关键前置失败才升级或回滚；已确认成果应保留。'},
  {t:'s', q:'Reflection 与 Evaluator 的关键区别是？', opts:['Reflection 让同一模型自检修改，Evaluator 提供规则、测试或独立模型的外部信号','Reflection 一定比单元测试可靠','Evaluator 只能检查文风','两者都直接执行生产写操作'], a:[0], ex:'自我反思成本低，但生成和检查可能共享同一错误。Evaluator 可以使用 schema、单元测试、SQL 约束或独立模型，提供相对独立的信号；副作用仍由宿主控制。'},
  {t:'m', q:'更可靠的 Agent 验证信号包括哪些？', opts:['工具参数 schema 和业务规则校验','可执行的单元测试、SQL 结果或状态断言','独立 verifier 对 claim 和引用的检查','只看答案长度和语气'], a:[0,1,2], ex:'可执行约束能直接判定很多错误，模型评价可补充主观质量。长度和语气只能作为展示维度，无法证明任务完成或证据正确。'},
  {t:'s', q:'Self-consistency 通常怎样降低随机推理错误？', opts:['只调用一次模型并提高温度','对同一问题采样多个候选，再按答案或验证结果聚合','把所有候选都执行一遍副作用工具','删除所有不一致样本而不记录'], a:[1], ex:'多次采样提供多个推理路径，投票或 verifier 聚合能降低部分随机性。成本随采样数上升，候选仍可能共享系统性错误，应设置样本数和预算。'},
  {t:'s', q:'Tree Search 在 Agent 中最需要控制的风险是？', opts:['候选路径数量和搜索深度指数增长','输出无法使用中文','所有节点都会自动成功','检索结果变成结构化 JSON'], a:[0], ex:'树搜索展开多个候选，分支数和深度会迅速放大模型调用与工具成本。常用限制包括 beam 宽度、最大深度、剪枝、早停和总预算，并优先使用便宜 verifier。'},
  {t:'m', q:'Agent 运行预算可以包括哪些维度？', opts:['总 deadline 和最大循环步数','模型 token、调用次数与费用','工具调用数、并发额度和下游配额','只记录最终总费用，运行中不限制'], a:[0,1,2], ex:'预算应在运行时生效。启动任务分配多维额度，发起调用前原子预留，返回后按实际结算；并发子任务共享同一账本，避免各自超支。'},
  {t:'s', q:'为什么要在发起模型或工具调用前原子预留预算？', opts:['为了让 Prompt 更长','避免并发 worker 同时看到余额后都发起调用，造成超额','为了替代结果校验','为了隐藏费用'], a:[1], ex:'并发读取同一余额会产生竞态。原子预留把“检查余额”和“占用额度”合成一个操作，调用结束再按实际消耗结算；已经发出的请求可能晚到费用，仍需对账。'},
  {t:'s', q:'下列哪项最能说明 Agent 发生“无进展”？', opts:['工具返回了新的订单状态','连续循环重复同一动作和相同状态指纹，没有新增事实','用户补充了关键字段','计划节点完成条件已满足'], a:[1], ex:'无进展检测可比较状态指纹、动作参数和新证据。轮询类工具要结合状态变化和合理等待时间判断，不能把每次等待都简单当作失败。'},
  {t:'f', q:'当任务达到时间、费用或步数上限时，宿主应执行预先定义的____路径。', a:['降级','降级或人工接管','fallback'], ans:'降级或人工接管路径。系统可以返回已确认的部分结果、减少检索深度、切换小模型，或把任务交给人工；不能继续无条件接纳新工作。', ex:'预算控制的目标是可预测地止损，同时保留状态和未解决点，方便后续恢复。'},
  {t:'e', q:'请说明一个长任务 Agent 如何从目标澄清、DAG 执行、动态重规划走到最终终止。', ans:'先把用户目标转成可验收的成功条件，补问缺失约束，再生成带节点 ID、依赖、完成条件、预算和失败策略的粗粒度 DAG。调度器只运行满足依赖的节点，每次工具结果写入事件并更新里程碑；若环境变化、前置条件失效或连续失败，只重规划受影响的子图，保留已确认成果。Reflection/Evaluator 用规则、测试和引用校验提供外部信号。运行时共享 deadline、token、费用、工具和并发预算，检测重复动作与无进展；满足成功条件就结束，遇到不可恢复错误、取消或预算耗尽就回滚、降级或人工接管。', ex:'完整回答需要同时交代计划数据、执行状态、重规划触发、验证信号和终止预算。只描述“模型不断思考直到满意”缺少可调度和可恢复边界。'}
);

BANKS['agent-planning-multi'].questions.push(
  {t:'s', q:'采用 Multi-Agent 最有说服力的理由通常是什么？', opts:['让多个角色重复生成相同答案','存在专业隔离、可并行容量、局部失败隔离或模型能力组合的明确瓶颈','为了让架构图更复杂','因为单模型名字不够长'], a:[1], ex:'多 Agent 会增加通信、调度和成本。只有当任务确实有独立专业边界、并行机会或故障隔离收益时才值得采用，先用单 Agent/工作流建立基线。'},
  {t:'m', q:'常见协作拓扑及其特点匹配正确的有？', opts:['Supervisor：中心 Agent 分派子任务并汇总结果','Pipeline：阶段按顺序传递结构化产物','Parallel：独立子任务并行后合并','Debate：参与者越多，质量和成本必然同时提升'], a:[0,1,2], ex:'Supervisor、Pipeline 和 Parallel 分别适合集中调度、阶段依赖和独立任务。Debate 的收益取决于意见独立性与评审机制，参与者增多也可能放大成本和共同错误。'},
  {t:'s', q:'设计多 Agent 之前为何要保留单 Agent 基线？', opts:['便于量化新增拓扑带来的质量、延迟和成本变化','单 Agent 永远比多 Agent 更好','为了避免编写接口','因为多 Agent 不需要评测'], a:[0], ex:'基线让团队知道当前瓶颈和可接受指标。没有基线时，通信开销、重复推理和故障复杂度很难证明值得，架构选择容易停留在概念展示。'},
  {t:'s', q:'子 Agent 的任务契约至少应明确什么？', opts:['只有角色名称','输入、输出 schema、所有权、deadline、预算和错误语义','允许读取所有共享上下文','不需要完成条件'], a:[1], ex:'契约把子任务从开放对话变成可调度工作单元。结构化输入输出和完成条件便于校验、重试和归因，所有权和预算避免多个 worker 无边界争用资源。'},
  {t:'m', q:'把每个 Agent 当作分布式 worker 时，需要考虑哪些机制？', opts:['消息幂等键以及顺序/交付语义','任务租约、owner 和 fencing token','超时、取消传播、背压和资源回收','只依赖共享 Prompt 协调，不需要状态'], a:[0,1,2], ex:'多 Agent 的难点首先是分布式一致性。消息可能重复、乱序或延迟，租约和 fencing 防止旧 worker 继续写，取消和背压避免任务结束后仍消耗资源。'},
  {t:'s', q:'至少一次投递下，怎样避免子 Agent 重复执行副作用？', opts:['每次都生成新请求 ID','消息携带稳定幂等键，执行前查询状态，结果可去重','关闭所有重试','把重复执行交给用户发现'], a:[1], ex:'至少一次交付意味着重复消息是正常情况。稳定业务键让 worker 能识别同一任务，状态查询区分已完成和未执行；关闭重试会降低可用性，交给用户发现风险更高。'},
  {t:'s', q:'租约与 fencing token 的主要用途是？', opts:['让旧 worker 在网络恢复后仍可继续写','确保失去租约的旧 worker 的写入被下游拒绝','压缩消息大小','替代所有业务幂等键'], a:[1], ex:'worker 失联后租约可能过期，新 worker 接管。递增 fencing token 写入下游，旧 worker 携带旧 token 时被拒绝，避免双主写入；它与业务幂等键解决的问题不同。'},
  {t:'s', q:'发现 Agent 之间互相等待资源时，优先采取什么措施？', opts:['增加更多等待时间','建立全局资源顺序、设置超时并做等待图/进展检测','让每个 Agent 无限重试','删除所有状态记录'], a:[1], ex:'统一加锁顺序可避免环路，超时和等待图能发现已形成的死锁；活锁还需比较状态进展和限制重试。只增加等待时间可能掩盖问题并浪费预算。'},
  {t:'m', q:'父任务取消时，哪些清理动作应向下传播？', opts:['通知子 Agent 停止接收新工作','释放租约、队列消息和并发额度','处理已在途工具调用和临时产物','保留审计事件与取消原因'], a:[0,1,2,3], ex:'取消是状态变化，不只是一条 UI 消息。子任务要停止扩散，租约和额度要回收，在途调用要按协议取消或对账，日志和取消原因要保留以便排障。'},
  {t:'s', q:'Blackboard/共享状态拓扑最容易遇到的工程问题是什么？', opts:['共享数据永远不会冲突','并发写冲突和所有权模糊，需要版本、单一 owner 或事件合并规则','无法保存任何结果','只能用于单轮聊天'], a:[1], ex:'共享黑板降低传递成本，却引入并发写和陈旧读。可让一个 Agent 负责某类状态，或使用带版本的事件合并；无规则时结果顺序不可预测。'},
  {t:'f', q:'多 Agent 系统中，负责推进某个任务并对其状态写入承担责任的角色叫作任务____。', a:['owner','所有者','任务所有权'], ans:'任务 owner（所有者）。每个任务应有明确 owner、租约和交接规则，避免多个 worker 同时推进；共享资源仍需版本和冲突策略。', ex:'“有多个 Agent 在帮忙”不能代替所有权定义。Owner 变更要带 fencing 或版本，旧 worker 的迟到写入必须被拒绝。'},
  {t:'e', q:'请设计一个多 Agent 研究报告流水线，说明分工、通信、失败隔离、取消和成本控制。', ans:'先建立单 Agent 基线，再按明确瓶颈拆为检索、事实核验、写作和审校 worker；每个 worker 接收带任务 ID、目标、来源范围和预算的结构化输入，输出带 schema、证据引用和完成状态的产物。Supervisor 或编排器维护 owner、DAG 依赖和 deadline，消息带幂等键并采用至少一次投递；写入共享黑板时使用版本或单一 owner。检索 worker 失败可重试或降级，核验失败只阻断受影响章节，避免拖住全部任务。父任务取消时传播取消、回收租约和队列，保留已生成证据。所有子任务共享费用/token/并发账本，trace 按 agent 和任务归因。', ex:'要点是把协作当作分布式系统设计。仅列出“研究员、写作者、审核员”三个角色，没有契约、幂等、取消和预算，无法落地。'}
);

BANKS['agent-eval'].questions.push(
  {t:'m', q:'Agent 评测的四组维度及其内容匹配正确的有？', opts:['Outcome：任务是否完成、结果是否正确','Process：轨迹、工具、检索和 Groundedness','System：时延、token、费用、稳定性','Human：人工接管、返工和满意度'], a:[0,1,2,3], ex:'最终答案只是 Outcome 的一部分。Process 可定位路径问题，System 衡量生产代价，Human 反映真实使用负担；权限违规和不可接受副作用应作为跨组硬门槛单独统计。'},
  {t:'s', q:'为什么只看最终答案准确率会漏掉重要问题？', opts:['最终答案包含所有内部信息','轨迹可能绕远路、工具越权或偶然答对，最终文本无法揭示过程和风险','最终答案永远不重要','因为评测只能看日志数量'], a:[1], ex:'一个答案可能碰巧正确，却调用了错误工具、泄露了权限数据或消耗过多预算。分层 trace 能把结果与路径、检索证据和副作用联系起来。'},
  {t:'s', q:'分层评测中的 oracle evidence 主要用于什么？', opts:['让模型永远得到完美答案并直接上线','固定下游输入为正确证据，观察生成层的上限，从而隔离检索问题','增加线上流量','替代所有人工标注'], a:[1], ex:'把正确证据注入生成层后，若答案仍错，问题更可能在上下文组装、模型遵循或验证；若明显改善，检索/解析层值得优先排查。Oracle 只用于诊断，不能代表真实线上能力。'},
  {t:'m', q:'一个可重复的 Golden Task 应包含哪些内容？', opts:['用户目标和环境状态','可接受结果、必要证据和完成条件','不可接受动作、预算与版本信息','只保存最终答案文本'], a:[0,1,2], ex:'Golden Task 需要定义输入环境、成功标准和风险边界，才能比较轨迹和失败。Mock/测试环境、Record-Replay 还要固定外部依赖；只存答案无法复现工具和状态条件。'},
  {t:'s', q:'LLM-as-a-Judge 上线前最需要做什么？', opts:['直接把模型分数当成绝对真值','用明确 rubric 与人工标注校准，检查偏差、一致性和置信区间','只挑选高分样本','让被评模型自己决定分数'], a:[1], ex:'LLM Judge 是测量器，可能受答案位置、长度和模型风格影响。需要人工标注校准、盲测、分层统计和一致性检查，发布门禁应结合规则和任务指标。'},
  {t:'s', q:'Shadow 与 Canary 的区别，正确的是？', opts:['Shadow 复制请求只观测，Canary 让小比例真实流量使用候选版本','Shadow 允许候选写真实订单，Canary 完全不产生结果','两者都是离线测试','Canary 只能测试 Prompt 文案'], a:[0], ex:'Shadow 适合比较候选模型的输出、延迟和成本，不产生真实副作用；Canary 在受控小流量中验证真实容量和业务质量，需设回滚门槛。'},
  {t:'m', q:'一条可用于故障归因的 Agent trace 通常应关联哪些节点？', opts:['用户请求、Prompt/模型版本和路由决策','检索查询、候选文档、引用和 ACL','工具参数、结果、错误、状态事件和耗时','只记录最后一段回答'], a:[0,1,2], ex:'Trace 要形成因果链，关联输入、版本、检索、工具、状态和最终结果。敏感 Prompt 可脱敏或采样，但字段缺失会使线上问题难以复现。'},
  {t:'f', q:'持久化状态转移、activity command 和已确认结果，并在故障后从 checkpoint/replay 继续的编排能力称为什么？', a:['Durable Execution','durable execution','持久执行'], ans:'Durable Execution（持久执行）。它让长任务在进程或节点故障后继续，减少整条任务从头重跑。', ex:'Durable Execution 不能自动保证外部副作用 exactly-once。远端操作可能已经成功而结果事件尚未落库，因此仍需稳定幂等键、状态查询、对账和补偿。'},
  {t:'m', q:'Agent 流式事件协议通常应具备哪些字段或事件类型？', opts:['有序 event_id、run/step 状态和重连游标','模型 token 之外的工具进度、引用、错误和完成事件','心跳、背压和取消语义','只发送一串不可区分的文本字符'], a:[0,1,2], ex:'用户需要知道任务正在检索、调用工具、等待确认还是失败。结构化事件便于断线续传和 UI 去重；token 只是其中一种事件，不能承载完整运行状态。'},
  {t:'s', q:'SSE 与 WebSocket 的选择，通常怎样判断？', opts:['SSE 适合服务器单向推送，WebSocket 适合高频双向控制','WebSocket 只能传文本，SSE 只能传二进制','两者都自带业务幂等和权限','所有 Agent 都必须使用 WebSocket'], a:[0], ex:'普通 Agent 流主要由服务器向客户端推送，SSE 简洁且易穿透；需要客户端高频发送暂停、交互或控制消息时可用 WebSocket。两者都要自行实现 event_id、重连和取消。'},
  {t:'s', q:'P95 延迟突然翻倍但模型服务指标正常，排查顺序更合理的是？', opts:['立即换更大模型','沿 trace 拆分排查检索、上下文组装、队列等待、工具和重试耗时','只看平均延迟','删除慢请求日志'], a:[1], ex:'端到端延迟可能由排队、RAG、工具、重试、序列化或客户端背压造成。按 trace 分段比较 P50/P95，先找新增耗时来源，再决定缓存、并行、路由或降级方案。'},
  {t:'e', q:'请设计一个生产级客服 Agent 的评测、发布和故障恢复闭环，覆盖离线、线上、状态恢复和降级。', ans:'离线建立分层 Golden Task，固定模型/Prompt/检索/工具版本和预算，使用 Mock/测试环境与 Record-Replay；指标覆盖 Outcome、Trajectory、Tool、Retrieval、Groundedness、P95、费用和人工接管，并用规则、oracle evidence 与校准过的 Judge 做归因。候选版本先 Shadow，再小流量 Canary，质量、可靠性、成本或关键回归恶化就自动暂停并回滚；A/B 需按用户和任务保持版本一致。线上每次 run 关联请求、模型、检索、工具、状态和引用 trace。长任务由 Durable Execution 保存事件、checkpoint 和 activity 结果，外部动作带幂等键并支持状态查询/补偿。预算耗尽、工具未知结果或模型不可用时走确定性 FAQ、人工接管或只读查询降级，保留未解决点和审计记录。', ex:'回答要形成从样本到发布、从 trace 到归因、从故障到恢复的闭环。只说“加监控、换模型、重试”无法说明如何验证修复，也无法保护长任务副作用。'}
);

/* Regroup the questions to match the non-placeholder chapter boundaries. */
(function regroupAgentQuestions(){
  var planningAndMulti = BANKS['agent-planning-multi'].questions;
  BANKS['agent-planning-multi'].questions = [0,1,2,3,4,6,7,9,10,12,13,15,16,17,18,23].map(function(i){ return planningAndMulti[i]; });

  var stagedEvalAndProduction = BANKS['agent-eval'].questions;
  BANKS['agent-eval'].questions = stagedEvalAndProduction.slice(0, 7);
  BANKS['agent-production'].questions.push.apply(BANKS['agent-production'].questions, stagedEvalAndProduction.slice(7, 11));
})();

BANKS['agent-eval'].questions.push(
  {t:'s', q:'比较两个具有随机性的 Agent 版本时，怎样报告结果更可靠？', opts:['每个版本只运行一次，直接比较是否成功','在相同分层样本和预算下多次运行，报告均值、分位数、方差与置信区间','只保留两个版本各自最好的结果','只比较单次 token 数'], a:[1], ex:'Agent 的模型采样、工具波动和环境状态都会引入随机性。相同任务需要重复运行，并按难度、租户和任务类型分层；均值展示总体水平，分位数和方差揭示尾部风险与稳定性。'},
  {t:'m', q:'关于分层失败归因，下列做法正确的有？', opts:['在组件边界用 oracle 输出替换真实输出，估计下游上限','反事实回放时一次只改变一个变量','允许一个失败同时拥有多个原因和不确定标签','只要最终结果错误，就全部归因给模型'], a:[0,1,2], ex:'Oracle 替换和单变量反事实能隔离检索、路由、工具或生成层的影响。真实事故常由多个组件共同触发，归因系统应支持多标签和证据强度，避免把全部问题笼统归给模型。'},
  {t:'f', q:'把真实外部调用及其结果记录下来，离线评测时按相同请求重放的技术通常称为什么？', a:['Record-Replay','record replay','记录重放'], ans:'Record-Replay（记录重放）。它固定外部依赖，使候选模型、Prompt 或路由能够在相同环境结果上比较。', ex:'重放数据需要记录请求、响应、版本、时间和脱敏规则。涉及会变化的业务状态时，还要说明重放环境与真实线上环境的差异。'},
  {t:'s', q:'线上 A/B 测试 Agent 时，为什么通常要按用户或任务固定版本？', opts:['避免同一条长任务中途切换 Prompt、模型或工具版本，造成状态和体验混杂','让所有用户永远使用旧版本','减少 Golden Task 数量','保证两个版本输出完全相同'], a:[0], ex:'Agent 可能跨越多轮和长时间运行。版本粘滞能保持同一任务的模型、Prompt、工具契约和状态迁移一致，指标也能准确归因到实验组。'},
  {t:'e', q:'请设计一条从离线评测到线上发布门禁的 Agent 评测流水线。', ans:'先按任务类型、难度和风险建立 Golden Task，记录目标、环境状态、必要证据、可接受结果、不可接受动作和预算；通过 Mock/测试环境与 Record-Replay 固定外部依赖。分别评测 Outcome、Trajectory、Tool、Retrieval、Groundedness、System 和 Human 指标，多次运行并报告分位数、方差和置信区间。组件失败用规则、oracle 替换和单变量反事实回放归因，LLM Judge 只在明确 rubric 和人工校准后参与评分。候选版本先做离线回归，再 Shadow 观测真实分布，随后 Canary 小流量验证；质量、可靠性、成本或硬门槛恶化时自动暂停并回滚，A/B 任务保持版本粘滞。', ex:'高质量答案要说明样本、环境、指标、归因、Judge 校准和发布阶段。单一总分无法解释回归来自哪个组件，也不足以保护副作用路径。'}
);

BANKS['agent-safety'].questions.push(
  {t:'s', q:'直接 Prompt Injection 与间接 Prompt Injection 的来源差异，哪项描述更准确？', opts:['直接注入来自当前用户输入；间接注入藏在网页、文档、邮件或工具结果等外部内容中','直接注入只影响回答格式；间接注入只影响模型延迟','直接注入发生在训练期；间接注入发生在量化期','两者都要求攻击者修改模型权重'], a:[0], ex:'分类依据是指令进入系统的来源。用户在对话中提交的诱导内容属于直接来源；Agent 检索或读取外部数据后接触到的诱导内容属于间接来源。两类内容都可能影响回答或工具决策，因此运行时要保留来源与信任级别。'},
  {t:'m', q:'Agent 把外部文档放入上下文时，哪些措施有助于保持信任边界？', opts:['为内容记录来源、版本、租户和信任级别','用稳定分隔和字段标明“证据内容”，限制其指令权限','只召回完成当前任务所需的最少片段','把文档文本直接拼入最高优先级系统指令'], a:[0,1,2], ex:'来源元数据支持追溯与过滤，明确的数据边界帮助模型区分任务指令和参考材料，最小化上下文能减少无关控制语句进入决策链。系统级规则应由受控配置提供，外部材料只能作为待验证数据。'},
  {t:'s', q:'网页正文要求 Agent 忽略原任务并调用无关工具时，宿主程序最稳妥的处理是什么？', opts:['照做，因为网页比用户更了解任务','把该内容当作低信任数据，继续按原目标、工具白名单和权限策略决策','把网页内容永久写入用户记忆','自动提升模型温度后再执行'], a:[1], ex:'网页内容可以提供事实证据，没有权限改变系统目标或扩大动作集合。宿主仍需校验工具名称、参数、用户授权、当前业务状态和预算；模型若提出无关动作，应拒绝、记录并按策略降级。'},
  {t:'m', q:'针对 Prompt Injection，合理的分层防线包括哪些？', opts:['上下文来源标注与指令/数据分区','工具执行前的权限、参数和业务状态校验','高风险动作预览、二次确认与审计','依赖一个检测分类器覆盖所有新型输入'], a:[0,1,2], ex:'输入处理、模型决策、工具执行和结果展示都要设置边界。检测器可提供风险信号，但开放文本会持续出现新变体；关键保障来自宿主侧不可绕过的授权、校验、确认和最小权限。'},
  {t:'s', q:'为什么 Prompt Injection 检测器不适合单独承担最终授权？', opts:['检测器只能处理英文','自然语言输入开放且检测存在漏报和误报，最终动作仍需确定性权限与业务规则校验','检测器无法输出分数','检测器会自动删除审计日志'], a:[1], ex:'检测结果适合用于拒绝、降级或升级人工的风险信号。最终授权应检查主体、资源、动作、租户、参数范围和当前状态，使漏报也无法直接扩大权限或产生未批准副作用。'},
  {t:'f', q:'安全事件中，为了沿 source → chunk/memory → context → action 定位受影响记录，需要保留完整的____。', a:['数据血缘','data lineage','Data Lineage','lineage'], ex:'数据血缘记录内容从来源、切块和记忆进入上下文，再影响动作的传播关系。它让系统能够圈定受影响的索引、缓存、会话和工具调用，并支持按来源撤回与重建。'},
  {t:'s', q:'能力令牌（capability）或工具 allowlist 的主要价值是什么？', opts:['把模型可执行的动作限制在当前任务明确授予的范围内','让模型自动获得管理员权限','省略用户身份校验','保证模型永远不会选错工具'], a:[0], ex:'Allowlist 规定平台登记并允许暴露哪些工具与动作；capability 进一步绑定当前主体、租户、run、资源范围和有效期。两者共同收缩潜在影响面，执行层仍需做参数校验、业务状态检查、审计和撤销。'},
  {t:'m', q:'执行转账、删除或对外发布等高风险动作前，宿主通常应检查哪些内容？', opts:['认证主体与资源权限','结构化参数、业务前置状态和影响范围','面向用户的动作预览及与本次参数绑定的确认','模型是否使用了足够长的思维文本'], a:[0,1,2], ex:'高风险动作需要把“谁、对什么、做什么、影响多大”固定下来。确认记录应绑定具体参数、版本和有效期，执行时再次检查状态；模型推理文本长度无法证明动作获得授权。'},
  {t:'s', q:'Agent 调用需要密钥的工具时，怎样管理 Secret 更稳妥？', opts:['把长期密钥写进 System Prompt','由凭据代理在执行阶段按身份和工具注入短期凭据，模型上下文与普通日志不接触明文','让模型把密钥保存在长期记忆','把密钥作为工具描述的一部分'], a:[1], ex:'模型只需选择受控工具和业务参数。执行层根据已认证主体获取范围受限、可撤销的短期凭据，并对日志做脱敏；这样可以减少密钥在上下文、缓存和观测链路中的暴露。'},
  {t:'m', q:'为代码执行或文件处理工具设置隔离环境时，哪些限制通常有效？', opts:['独立临时工作区与只读基础镜像','默认关闭外网，按任务开放必要出口','限制 CPU、内存、运行时间和输出大小','只要运行在容器中，就可以授予宿主机完整文件权限'], a:[0,1,2], ex:'隔离环境要同时限制文件、网络、进程、资源和生命周期，并在结束后销毁临时状态。容器只是隔离机制的一部分，挂载、内核能力和网络策略配置错误仍会扩大影响。'},
  {t:'s', q:'高风险操作的确认页面为什么要展示最终参数并设置有效期？', opts:['让确认与具体动作绑定，参数变化或确认过期后必须重新确认','为了增加页面字数','便于模型自动修改确认内容','确认一次后永久授权同类操作'], a:[0], ex:'用户确认的对象应是可理解的最终动作摘要，包括资源、数量、目标和关键副作用。执行前若参数、身份、租户或业务状态变化，旧确认应失效，防止确认内容和实际执行发生偏移。'},
  {t:'s', q:'高风险工具调用超时且结果未知时，安全恢复顺序是什么？', opts:['立即换一个请求 ID 重复执行','先冻结后续依赖动作，按原幂等键查询远端状态，再决定补记结果、重试、补偿或人工对账','直接向用户宣布成功','删除 command 和 trace 后从头开始'], a:[1], ex:'超时只表示响应未及时返回，远端可能已经完成动作。原幂等键、状态查询和审计记录可以区分未执行、已成功与部分成功；未知状态未澄清前不应继续依赖该结果。'},
  {t:'m', q:'降低记忆与 RAG 数据投毒风险，写入和召回链路应保留哪些能力？', opts:['来源、作者/租户、时间和内容哈希','写入审批、显著性门槛与冲突检测','版本、撤回标记和按来源回滚','高相似度内容直接获得永久最高优先级'], a:[0,1,2], ex:'可追溯元数据让系统定位受影响记录，写入门槛与冲突检测减少未经确认内容沉淀，版本和撤回支持止损与重建。向量相似度只衡量相关性，不能代表内容可信或具备指令权限。'},
  {t:'s', q:'接入新的 MCP Server 或第三方工具时，哪种发布流程更稳妥？', opts:['只阅读工具名称后直接全量开放','固定来源与版本，审查工具描述和权限差异，在测试租户验证，再按最小能力灰度发布','允许工具在运行时自行增加权限','每次启动都下载未固定版本的最新包'], a:[1], ex:'工具供应链审查要覆盖发布者、制品哈希或签名、依赖、工具 schema、所需权限和网络目标。候选版本先在隔离测试环境运行，记录行为基线与版本指纹，权限或描述变化触发重新审批。'},
  {t:'m', q:'Agent 生成 SQL、Shell 命令或代码后，进入执行层前应采用哪些控制？', opts:['解析为 AST 或结构化计划并校验允许的操作','绑定只读或最小权限身份，在隔离测试环境先验证','设置资源、行数、路径和网络范围上限','只检查输出是否位于 Markdown 代码块'], a:[0,1,2], ex:'执行层应理解操作语义和影响范围：解析结构、限制资源、使用最小权限环境并优先 dry-run。Markdown 格式只能帮助展示，无法证明命令、查询或代码满足业务与权限约束。'},
  {t:'e', q:'线上 Agent 被发现会受外部文档影响调用无关工具，同时知识库出现来源不明的异常记录。请给出止损、定位、修复和回归方案。', ans:'先暂停受影响版本的写工具与记忆自动写入，将运行降级为只读或人工确认，保留 run、citation、retrieval/tool result、memory_id、模型/模板/索引/工具版本和审计记录。随后从失败 trace 找到外部内容进入上下文的最早位置，按来源和哈希圈定异常文档及记忆，撤回或隔离记录并轮换可能暴露的凭据。修复时恢复指令/数据分区、来源标记和最小召回，执行层加强 allowlist、权限、参数和业务状态检查，高风险动作绑定预览确认；记忆写入增加来源、审批、冲突与版本回滚。最后用直接/间接注入、异常工具描述、投毒记录和正常业务样本建立回归集，分别监控拦截、误拒、任务成功、工具越权、P95 与人工接管，先 Shadow/测试租户再 Canary。', ex:'回答应形成“限制影响面—保全证据—追溯来源—修复不可绕过边界—补回归门禁”的闭环，同时关注误拒和业务可用性。'}

BANKS['agent-production'].questions.push(
  {t:'s', q:'为什么长任务 Agent 不宜一直占用一个 HTTP 请求等待完成？', opts:['HTTP 无法传输文本','进程重启、网关超时或客户端断线会丢失进度，任务也难以暂停和恢复','HTTP 会自动重复扣款','模型只能在队列中调用'], a:[1], ex:'长任务可能持续数分钟甚至数小时。接入层应快速创建 run 并返回任务 ID，后台编排器通过队列推进；状态、事件和 checkpoint 持久化后，客户端断线或 worker 重启都不会让任务从头开始。'},
  {t:'m', q:'生产级 Agent 后端的合理分层包括哪些？', opts:['无状态接入与认证层','持久编排、状态/事件存储和队列 worker','模型网关、工具执行器、知识/记忆服务','观测、配额、人工接管和结果流'], a:[0,1,2,3], ex:'分层让接入、编排、模型、工具和数据服务独立扩缩与故障隔离。编排层负责确定性状态转移，工具层处理副作用，观测和配额贯穿整条 run，前端只消费结构化事件。'},
  {t:'s', q:'Durable Execution 为什么仍不能自动保证外部副作用 exactly-once？', opts:['因为它无法保存任何状态','远端操作可能已经成功，但结果事件尚未持久化，activity 随后会再次投递','因为所有消息都会丢失','因为 checkpoint 只能存文本'], a:[1], ex:'编排器可以可靠恢复自身状态，却无法原子提交远端业务系统和本地事件。副作用 activity 需要稳定幂等键、业务状态查询、outbox/对账或补偿路径，用可验证语义处理重复与未知结果。'},
  {t:'m', q:'队列消息出现重复或乱序时，哪些处理方式有效？', opts:['使用 task/activity 幂等键去重','事件带序号或版本，消费者拒绝旧版本覆盖新状态','副作用执行前后保存 command 与结果，并支持状态查询','默认相信消息只会投递一次'], a:[0,1,2], ex:'生产队列通常提供至少一次交付，重复属于预期情况。幂等键、版本检查和可查询的执行记录共同控制重复与乱序；业务若依赖顺序，还要按任务键分区或在状态机中校验合法转移。'},
  {t:'s', q:'某个租户流量突增时，怎样减少对其他租户的影响？', opts:['所有租户共用一个无上限队列','按租户设置配额、并发池和公平调度，热点任务可独立分区并触发背压','关闭全部日志','让模型自行决定是否限流'], a:[1], ex:'多租户生产系统需要隔离并发、费用和下游配额。公平队列、租户级令牌桶、热点分区和背压能限制噪声邻居效应，超额请求进入排队、降级或明确拒绝。'},
  {t:'s', q:'SSE 断线重连后，怎样避免客户端重复显示旧事件？', opts:['每次重连重新发送全部事件且不带编号','事件携带单调 event_id，客户端保存游标并按 ID 去重，服务器从游标之后续传','清空服务端运行状态','把所有事件合并成一个 token'], a:[1], ex:'客户端携带 Last-Event-ID 或等价游标重连，服务端重放未确认事件。前端按 event_id 幂等应用，完成事件也要可重放；心跳用于发现连接失效。'},
  {t:'m', q:'优化 Agent 性能和成本时，哪些做法需要成对验证收益与质量？', opts:['用路由让小模型处理简单任务，失败时升级','压缩上下文、减少无效检索和重复工具调用','只并行真正独立的工具，并计入下游容量','语义缓存键包含任务、版本、权限和时效，命中后仍检查适用条件'], a:[0,1,2,3], ex:'优化应先分解 TTFT、模型、检索、队列和工具耗时，再针对瓶颈行动。并行会增加峰值负载，缓存会引入陈旧和隔离风险，路由与压缩可能损失质量，因此每项都要做回归和成本归因。'},
  {t:'e', q:'请设计一个可恢复、可流式交互的生产级 Agent 系统，并说明一次 P95 延迟事故如何排查。', ans:'接入层完成认证和配额后创建 run，返回 task_id；持久编排器维护状态机、事件、checkpoint、deadline 和预算，通过按任务分区的队列调度模型与工具 worker。模型网关负责路由、版本和降级，工具执行器区分参数错误、业务拒绝、瞬态故障和未知结果；副作用带稳定幂等键、状态查询及补偿。SSE 或 WebSocket 发送带 event_id 的 run、step、token、工具进度、引用、错误和完成事件，支持游标重连、背压和取消。发生 P95 翻倍时先按 trace 分解接入排队、检索、上下文、模型、工具、重试和流式背压耗时，再按版本、租户和任务类型对照；先限流或降级止损，用回放验证修复，Canary 发布并保留快速回滚。', ex:'回答应包含状态真源、后台编排、队列语义、副作用恢复、流式事件和 Trace 排障。单纯增加 worker 可能把压力转移给模型或下游工具，必须结合容量和分段耗时判断。'}

      s('恶意网页诱导 Agent 读取企业私有文件并通过邮件工具发往外部地址，这条链路最准确的安全描述是什么？', [
        '直接提示注入诱发工具越权，并通过模型输出通道泄露数据',

      s('用户确认退款 100 元后，Agent 将金额改为 300 元。执行层应如何处理原确认？', [

      m('关于 Agent Outcome 与分层评测，下列说法正确的有？', [

      m('关于 Agent 安全、隐私和治理，下列说法正确的有？', [

      f('一条轨迹共 12 步，其中确认有 3 步是重复调用或无进展动作，则冗余率为 ____。', ['25%','25 %','0.25','四分之一'], '25%。', '按 `redundancy_rate = repeated_or_no_progress_steps / actual_steps`，结果为 `3 / 12 = 25%`。合理的验证、指数退避或换工具不应仅因增加步数就判为冗余。'),
      e('订票 Agent 展示成功，但评测发现一次请求生成了两张订单，第二次来自“超时后重试”。请设计能在上线前发现该问题的评测与测试方案。', '端到端验收以可重置沙箱中的订单、支付和库存状态为准，断言目标订单恰好一个、金额与用户约束一致、无越权且最终回复与环境一致。组件层用 Fake Booking Tool 注入“服务端已写入但响应超时”，重放同一 Idempotency Key，断言只产生一次写并先查询权威状态。轨迹层检查确认先于支付、重复副作用为零、总 Attempt 和预算受控，但不要求自然语言逐字一致。确定性逻辑进入单元/契约测试；真实模型多次运行并按任务、错误类型与置信区间做门禁。该事故样本脱敏后加入版本化回归集，Canary 继续监控重复订单率和每成功任务成本。', '高质量答案会同时覆盖环境 Outcome、故障注入、幂等不变量、统计评测和事故回归。只检查最终文本或正常工具响应无法暴露“超时但已成功”的窗口。'),
      e('Research Agent 阅读到恶意网页，网页要求读取环境变量并发送到外部“验证服务”。请给出从威胁建模到纵深防御的完整方案。', '先把网页标为攻击者可控的数据面输入，资产包括 Secret、私有资料和宿主身份；攻击链是间接注入影响模型，经读取与外发工具组合形成 Confused Deputy。模型只可提出 Action，外部内容不得修改工具目录或权限。Host 仅暴露任务所需只读工具，Policy 按主体、资源、目的和目标域决定；Secret 由 Broker 以短期 Capability 提供给工具且不进入模型。下载解析在隔离沙箱中，网络默认拒绝并经 Egress Allowlist；模型生成的 URL、路径和参数做结构化校验，敏感数据保持污点，外发 Sink 执行目的地策略与 DLP。所有拒绝、调用和网络事件进入脱敏审计 Trace。红队覆盖编码、图片、工具返回和记忆持久化变体，成功样本进入回归；准备按工具、租户和外发网络止损的 Kill Switch，并在事故后轮换密钥、清理污染记忆与验证删除。', '提示词和来源标签只能降低模型受影响概率，不能成为权限边界。答案应覆盖预防、检测、遏制和恢复，并说明安全控制不依赖模型自律。')
    ]

  'agent-production': {

      s('Deep Research Agent 应如何把一条搜索结果用于最终报告引用？', [

      m('设计企业知识与客服 Agent 时，下列说法正确的有？', [
        '把所有企业文档放进长上下文可以同时解决 ACL 与知识新鲜度',

      m('关于四类专业 Agent 的领域验证器，下列对应关系正确的有？', [

      m('把 Coding、Research、数据分析和 Computer Use 从 Demo 推向生产，下列措施正确的有？', [

(function installLatestAiBanks(root){
'use strict';

var AI_BANK_ORDER = [
  'llm-arch',
  'llm-train',
  'llm-post',
  'llm-infer',
  'llm-context',
  'llm-reliability',
  'llm-multimodal',
  'llm-debug',
  'agent-foundation',
  'agent-context-tools',
  'agent-rag',
  'agent-memory-state',
  'agent-planning-multi',
  'agent-eval',
  'agent-safety',
  'agent-production'
];
var isAiBank = function(bankKey){ return /^(?:llm|agent)-/.test(bankKey); };
var sourceBanks = root.LATEST_AI_BANKS || {};

AI_BANK_ORDER.forEach(function(bankKey){
  if (!sourceBanks[bankKey]) throw new Error('Missing latest AI bank: ' + bankKey);
  BANKS[bankKey] = sourceBanks[bankKey];
  BANKS[bankKey].questions.forEach(function(question){
    if (question.t === 's' || question.t === 'm') question._qualityRevised = true;
  });
});

var firstAiIndex = BANK_ORDER.findIndex(isAiBank);
var insertAt = firstAiIndex < 0 ? BANK_ORDER.length : BANK_ORDER.slice(0, firstAiIndex).filter(function(bankKey){
  return !isAiBank(bankKey);
}).length;
var nextOrder = BANK_ORDER.filter(function(bankKey){ return !isAiBank(bankKey); });
nextOrder.splice.apply(nextOrder, [insertAt, 0].concat(AI_BANK_ORDER));
BANK_ORDER.length = 0;
Array.prototype.push.apply(BANK_ORDER, nextOrder);

var oldOverrides = root.QUESTION_QUALITY_OVERRIDES || {};
Object.keys(oldOverrides).forEach(function(bankKey){
  if (isAiBank(bankKey)) delete oldOverrides[bankKey];
});

})(window);

(function applyQuestionQualityOverrides(){
  'use strict';
  var overrides = window.QUESTION_QUALITY_OVERRIDES;
  var errors = [];

  Object.keys(overrides).forEach(function(bankKey){
    var bank = BANKS[bankKey];
    if (!bank){
      errors.push('unknown bank: ' + bankKey);
      return;
    }
    Object.keys(overrides[bankKey]).forEach(function(rawIndex){
      var qi = +rawIndex;
      var question = bank.questions[qi];
      var patch = overrides[bankKey][rawIndex];
      if (!question){
        errors.push(bankKey + '#' + (qi + 1) + ': question not found');
        return;
      }
      ['q', 'opts', 'a', 'ex'].forEach(function(field){
        if (!Object.prototype.hasOwnProperty.call(patch, field)) return;
        question[field] = Array.isArray(patch[field]) ? patch[field].slice() : patch[field];
      });
      question._qualityRevised = true;
    });
  });

  function compactLength(value){
    return Array.from(String(value || '').replace(/`/g, '').replace(/[\s　]/g, '')).length;
  }
  function average(values){
    return values.length ? values.reduce(function(sum, value){ return sum + value; }, 0) / values.length : 0;
  }
  function likelyOptionLetterReference(value){
    return /(?:^|[，。；：;:、（(\s])(?:选项\s*)?[A-E](?=\s*(?:[、/]|选项|项|中|错|错误|正确|描述|说法|把|是|无此|恰恰|反而|产生))/.test(String(value || ''));
  }

  var report = {
    banks: 0,
    objective: 0,
    single: 0,
    multiple: 0,
    multiAnswerCounts: {2: 0, 3: 0, 4: 0},
    singleCorrectUniqueLongest: 0,
    singleCorrectLengthRatioAbove150: 0,
    explanationLetterWarnings: [],
    errors: errors
  };

  BANK_ORDER.forEach(function(bankKey){
    if (bankKey.indexOf('__') === 0) return;
    report.banks++;
    BANKS[bankKey].questions.forEach(function(question, qi){
      if (question.t !== 's' && question.t !== 'm') return;
      report.objective++;
      var ref = bankKey + '#' + (qi + 1);
      if (!question._qualityRevised) errors.push(ref + ': missing quality override');
      if (!Array.isArray(question.opts) || !Array.isArray(question.a)){
        errors.push(ref + ': opts/a must be arrays');
        return;
      }
      if (new Set(question.opts.map(function(option){ return String(option).trim(); })).size !== question.opts.length){
        errors.push(ref + ': duplicate options');
      }
      if (new Set(question.a).size !== question.a.length || question.a.some(function(index){
        return !Number.isInteger(index) || index < 0 || index >= question.opts.length;
      })){
        errors.push(ref + ': invalid answer indexes');
      }
      if (likelyOptionLetterReference(question.ex)) report.explanationLetterWarnings.push(ref);

      if (question.t === 's'){
        report.single++;
        if (question.opts.length !== 4 || question.a.length !== 1){
          errors.push(ref + ': single choice must have 4 options and 1 answer');
          return;
        }
        var lengths = question.opts.map(compactLength);
        var correctLength = lengths[question.a[0]];
        var distractorLengths = lengths.filter(function(_, index){ return index !== question.a[0]; });
        var distractorAverage = average(distractorLengths);
        if (correctLength > Math.max.apply(null, distractorLengths)) report.singleCorrectUniqueLongest++;
        if (distractorAverage && correctLength / distractorAverage > 1.5){
          report.singleCorrectLengthRatioAbove150++;
          errors.push(ref + ': correct option is over 1.5x the average distractor length');
        }
      } else {
        report.multiple++;
        if (question.opts.length !== 5 || question.a.length < 2 || question.a.length > 4){
          errors.push(ref + ': multiple choice must have 5 options and 2-4 answers');
          return;
        }
        report.multiAnswerCounts[question.a.length]++;
      }
    });
  });

  var multiDistribution = [2, 3, 4].map(function(count){ return report.multiAnswerCounts[count]; });
  if (Math.max.apply(null, multiDistribution) - Math.min.apply(null, multiDistribution) > 2){
    errors.push('multiple-choice answer-count distribution must stay balanced within 2; got ' + multiDistribution.join('/'));

(function installDeepExplanations(root){
'use strict';

var catalog = root.DEEP_EXPLANATIONS || {};
var errors = [];
var report = {
  banks:0,
  questions:0,
  objective:0,
  fill:0,
  essay:0,
  optionNotes:0,
  errors:errors
};

function textLength(value){
  return Array.from(String(value || '').replace(/[\s　]/g, '')).length;
}
function ref(bankKey, index){
  return bankKey + '#' + (index + 1);
}

BANK_ORDER.filter(function(bankKey){ return bankKey.indexOf('__') !== 0; }).forEach(function(bankKey){
  var bank = BANKS[bankKey];
  var details = catalog[bankKey];
  report.banks++;
  if (!Array.isArray(details)){
    errors.push(bankKey + ': missing explanation bank');
    return;
  }
  if (details.length !== bank.questions.length){
    errors.push(bankKey + ': expected ' + bank.questions.length + ' explanations, got ' + details.length);
  }
  bank.questions.forEach(function(question, index){
    var detail = details[index];
    var questionRef = ref(bankKey, index);
    report.questions++;
    if (!detail || typeof detail !== 'object'){
      errors.push(questionRef + ': missing deep explanation');
      return;
    }
    if (textLength(detail.overview) < 100){
      errors.push(questionRef + ': overview is shorter than 100 non-space characters');
    }
    if (!Array.isArray(detail.steps) || detail.steps.length < 2 || detail.steps.some(function(step){ return textLength(step) < 12; })){
      errors.push(questionRef + ': steps must contain at least two substantive items');
    }
    if (textLength(detail.pitfall) < 35){
      errors.push(questionRef + ': pitfall is shorter than 35 non-space characters');
    }

    if (question.t === 's' || question.t === 'm'){
      report.objective++;
      if (!Array.isArray(detail.optionNotes) || detail.optionNotes.length !== question.opts.length){
        errors.push(questionRef + ': optionNotes count must match options');
      } else {
        detail.optionNotes.forEach(function(note, optionIndex){
          report.optionNotes++;
          if (textLength(note) < 35){
            errors.push(questionRef + ': option note ' + (optionIndex + 1) + ' is shorter than 35 non-space characters');
          }
          if (/(?:选项|答案)\s*[A-E](?:\b|项|是|错|对)/i.test(String(note || ''))){
            errors.push(questionRef + ': option note ' + (optionIndex + 1) + ' references a display letter');
          }
        });
      }
    } else {
      if (question.t === 'f') report.fill++;
      if (question.t === 'e') report.essay++;
      if (!Array.isArray(detail.optionNotes) || detail.optionNotes.length !== 0){
        errors.push(questionRef + ': non-objective optionNotes must be an empty array');
      }
    }
    question.deep = detail;
  });
});

Object.keys(catalog).forEach(function(bankKey){
  if (!BANKS[bankKey]) errors.push(bankKey + ': explanation bank has no matching question bank');
});

root.__DEEP_EXPLANATION_REPORT__ = report;
if (errors.length) console.error('Deep explanation validation failed:', errors);

})(window);
/* DEEP_EXPLANATIONS_END */
</script>
<script>
(function(){
'use strict';
var $ = function(s){ return document.querySelector(s); };
var LS_WRONG = 'quiz-wrong-v1', LS_STAT = 'quiz-stat-v2', LS_STAT_OLD = 'quiz-stat-v1', LS_THEME = 'bagu-theme';
var LS_AI_BANK_SCHEMA = 'quiz-ai-bank-schema', AI_BANK_SCHEMA = 'llm-agent-full-notes-2026-07-v1';
var FILTER_LABEL = { all: '全部', undone: '未做', wrong: '错题' };
var FILTER_CYCLE = ['all', 'undone', 'wrong'];

/* ---------- 存储 ---------- */
function load(k, d){ try{ var v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } }
function save(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }

function migrateStats(raw){
  var out = {};
  if (!raw || typeof raw !== 'object') return out;
  Object.keys(raw).forEach(function(bank){
    var src = raw[bank];
    if (!src || typeof src !== 'object') return;
    out[bank] = {};
    Object.keys(src).forEach(function(qi){
      var v = src[qi];
      if (v && typeof v === 'object'){
        var att = Math.max(0, +v.attempts || 0);
        var cor = Math.max(0, +v.correct || 0);
        var last = typeof v.last === 'number' ? v.last : (cor > 0 ? 1 : (att > 0 ? 0 : null));
        if (att || cor || last !== null){
          out[bank][qi] = { attempts: att || (last !== null ? 1 : 0), correct: cor, last: last };
        }
      } else if (v === 0 || v === 1 || v === '0' || v === '1'){
        var ok = +v === 1;
        out[bank][qi] = { attempts: 1, correct: ok ? 1 : 0, last: ok ? 1 : 0 };
      }
    });
  });
  return out;
}

function migrateAiBankProgressOnce(){
  try{
    if (localStorage.getItem(LS_AI_BANK_SCHEMA) === AI_BANK_SCHEMA) return;
    [LS_WRONG, LS_STAT, LS_STAT_OLD].forEach(function(storageKey){
      if (localStorage.getItem(storageKey) === null) return;
      var stored = load(storageKey, null);
      if (!stored || typeof stored !== 'object') return;
      Object.keys(stored).forEach(function(bankKey){
        if (/^(?:llm|agent)-/.test(bankKey)) delete stored[bankKey];
      });
      save(storageKey, stored);
    });
    localStorage.setItem(LS_AI_BANK_SCHEMA, AI_BANK_SCHEMA);
  }catch(e){}
}

migrateAiBankProgressOnce();
var wrongBook = load(LS_WRONG, {}); // {bank:[qidx,...]}
var stats = migrateStats(load(LS_STAT, null) || load(LS_STAT_OLD, {}));
save(LS_STAT, stats);
try{ localStorage.removeItem(LS_STAT_OLD); }catch(e){}

function wrongTotal(){
  var n = 0;
  for (var k in wrongBook) n += (wrongBook[k] || []).length;
  return n;
}
function addWrong(bank, idx){
  var arr = wrongBook[bank] || (wrongBook[bank] = []);
  idx = +idx;
  if (arr.indexOf(idx) < 0) arr.push(idx);
  save(LS_WRONG, wrongBook); refreshWrongBtn();
}
function removeWrong(bank, idx){
  var arr = wrongBook[bank]; if (!arr) return;
  idx = +idx;
  var p = arr.indexOf(idx);
  if (p >= 0){
    arr.splice(p, 1);
    if (!arr.length) delete wrongBook[bank];
    save(LS_WRONG, wrongBook);
    refreshWrongBtn();
  }
}
function getStat(bank, idx){
  var st = stats[bank] && stats[bank][idx];
  if (!st) return { attempts: 0, correct: 0, last: null };
  return {
    attempts: +st.attempts || 0,
    correct: +st.correct || 0,
    last: typeof st.last === 'number' ? st.last : null
  };
}
function setStat(bank, idx, ok){
  var bag = stats[bank] || (stats[bank] = {});
  var cur = getStat(bank, idx);
  bag[idx] = {
    attempts: cur.attempts + 1,
    correct: cur.correct + (ok ? 1 : 0),
    last: ok ? 1 : 0
  };
  save(LS_STAT, stats);
}
function bankSummary(key){
  var b = BANKS[key];
  var total = b.questions.length;
  var touched = 0, everRight = 0, attempts = 0, correct = 0, lastRight = 0;
  var st = stats[key] || {};
  Object.keys(st).forEach(function(qi){
    if (+qi >= total) return;
    var s = getStat(key, qi);
    if (!s.attempts) return;
    touched++;
    attempts += s.attempts;
    correct += s.correct;
    if (s.correct > 0) everRight++;
    if (s.last === 1) lastRight++;
  });
  var wrongN = (wrongBook[key] || []).filter(function(qi){ return qi >= 0 && qi < total; }).length;
  return {
    total: total,
    touched: touched,
    everRight: everRight,
    attempts: attempts,
    correct: correct,
    lastRight: lastRight,
    wrongN: wrongN,
    acc: attempts ? Math.round(correct / attempts * 100) + '%' : '—'
  };
}

/* ---------- 渲染工具 ---------- */
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function fmt(s){ return esc(s).replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\n/g, '<br>'); }
function explanationSection(title, body, className){
  if (!body) return '';
  return '<div class="explain-section' + (className ? ' ' + className : '') + '">' +
    '<div class="explain-title">' + esc(title) + '</div>' +
    '<div class="explain-copy">' + fmt(body) + '</div></div>';
}
function renderLearningDetails(q, optOrder, done){
  var deep = q && q.deep;
  var html = q && q.ex ? explanationSection(q.t === 'e' ? '评分重点' : '核心结论', q.ex) : '';
  if (!deep) return html;

  html += explanationSection(q.t === 'e' ? '思路拆解' : '深入理解', deep.overview);

  if ((q.t === 's' || q.t === 'm') && Array.isArray(deep.optionNotes) && deep.optionNotes.length === q.opts.length){
    var rows = '';
    optOrder.forEach(function(originalIndex, displayIndex){
      var isRight = (q.a || []).indexOf(originalIndex) >= 0;
      var isSelected = done && Array.isArray(done.sel) && done.sel.indexOf(originalIndex) >= 0;
      var label = String.fromCharCode(65 + displayIndex) + ' · ' + (isRight ? '正确' : '不选');
      if (isSelected && !isRight) label += '（误选）';
      rows += '<div class="option-analysis-row">' +
        '<div class="option-analysis-key ' + (isRight ? 'right' : 'wrong') + '">' + esc(label) + '</div>' +
        '<div class="option-analysis-body">' +
          '<div class="option-analysis-text">' + fmt(q.opts[originalIndex]) + '</div>' +
          '<div class="option-analysis-reason">' + fmt(deep.optionNotes[originalIndex]) + '</div>' +
        '</div></div>';
    });
    html += '<div class="explain-section"><div class="explain-title">逐项辨析</div>' +
      '<div class="option-analysis">' + rows + '</div></div>';
  }

  if (Array.isArray(deep.steps) && deep.steps.length){
    var stepTitle = q.t === 'e' ? '作答框架' : (q.t === 'f' ? '推导步骤' : '解题与迁移');
    html += '<div class="explain-section"><div class="explain-title">' + esc(stepTitle) + '</div><ol class="deep-steps">' +
      deep.steps.map(function(step){ return '<li>' + fmt(step) + '</li>'; }).join('') +
      '</ol></div>';
  }
  html += explanationSection('易错边界', deep.pitfall, 'pitfall');
  return html;
}
function norm(s){
  return String(s).toLowerCase()
    .replace(/[\s　]/g, '')
    .replace(/（/g,'(').replace(/）/g,')').replace(/：/g,':').replace(/，/g,',')
    .replace(/[。．.]+$/,'');
}
var TYPE_NAME = { s:'单选', m:'多选', f:'填空', e:'简答' };

/* ---------- 视图切换 ---------- */
function show(id){
  ['view-home','view-quiz','view-wrong'].forEach(function(v){
    document.getElementById(v).classList.toggle('active', v === id);
  });
  window.scrollTo(0, 0);
}

/* ---------- 首页 ---------- */
var BANK_GROUPS = [
  {id:'traditional', name:'传统基础', desc:'C++ · 网络 · 操作系统 · 数据库 · 工程实践'},
  {id:'llm', name:'LLM', desc:'模型原理 · 训练与对齐 · 推理系统 · 评测'},
  {id:'agent', name:'Agent', desc:'运行循环 · 工具与 RAG · 记忆规划 · 安全治理 · 生产系统'}
];
function bankGroup(key){
  if (key.indexOf('llm-') === 0) return 'llm';
  if (key.indexOf('agent-') === 0) return 'agent';
  return 'traditional';
}
function renderHome(){
  var g = $('#bankGrid'); g.innerHTML = '';
  BANK_GROUPS.forEach(function(group){
    var keys = BANK_ORDER.filter(function(key){
      return key.indexOf('__') !== 0 && bankGroup(key) === group.id;
    });
    if (!keys.length) return;
    var section = document.createElement('section');
    section.className = 'bank-section';
    section.innerHTML = '<div class="section-head"><h2>' + esc(group.name) + '</h2>' +
      '<span>' + keys.length + ' 个专题 · ' + esc(group.desc) + '</span></div>';
    var grid = document.createElement('div');
    grid.className = 'grid';
    keys.forEach(function(key){
      var b = BANKS[key];
      var sm = bankSummary(key);
      var card = document.createElement('div');
      card.className = 'card';
      card.style.setProperty('--bc', b.accent);
      card.innerHTML =
        '<h3>' + esc(b.name) + '</h3>' +
        '<div class="meta">' + sm.total + ' 题 · ' + esc(b.desc) + '</div>' +
        '<div class="stat">' +
          '<span>覆盖 <b>' + sm.touched + '/' + sm.total + '</b></span>' +
          '<span>累计 <b>' + sm.correct + '/' + sm.attempts + '</b></span>' +
          '<span>正确率 <b>' + sm.acc + '</b></span>' +
          (sm.wrongN ? '<span>错题 <b style="color:var(--bad)">' + sm.wrongN + '</b></span>' : '') +
        '</div>' +
        '<div class="actions">' +
          '<button class="btn primary" data-act="all">开始</button>' +
          '<button class="btn" data-act="undone">未做</button>' +
          '<button class="btn" data-act="wrong">错题</button>' +
        '</div>';
      card.querySelectorAll('[data-act]').forEach(function(btn){
        btn.onclick = function(e){
          e.stopPropagation();
          startQuiz(key, { filter: btn.getAttribute('data-act') });
        };
      });
      card.onclick = function(){ startQuiz(key, { filter: 'all' }); };
      grid.appendChild(card);
    });
    section.appendChild(grid);
    g.appendChild(section);
  });
  refreshWrongBtn();
}
function refreshWrongBtn(){
  var n = wrongTotal();
  $('#wrongCount').textContent = n ? '(' + n + ')' : '';
  var pill = $('#wrongTotalPill');
  if (pill) pill.textContent = n ? n + ' 题' : '';
}

/* ---------- 答题会话 ---------- */
// S: {bank, fullOrder, order, pos, results, mode, filter, redo, navOpen, titleExtra}
var S = null;
function shuffle(a){
  for (var i = a.length - 1; i > 0; i--){
    var j = Math.floor(Math.random() * (i + 1));
    var t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}
function shuffledOptionOrder(q){
  if (!q || !Array.isArray(q.opts)) return [];
  return shuffle(q.opts.map(function(_, i){ return i; }));
}
function optionOrderFor(qi, q){
  if (!S || !S.optionOrders) return q.opts.map(function(_, i){ return i; });
  var order = S.optionOrders[qi];
  if (!order || order.length !== q.opts.length){
    order = shuffledOptionOrder(q);
    S.optionOrders[qi] = order;
  }
  return order;
}
function buildOrder(bankKey, opts){
  opts = opts || {};
  var b = BANKS[bankKey];
  var total = b.questions.length;
  if (opts.indices){
    return opts.indices.map(function(x){ return +x; }).filter(function(qi){ return qi >= 0 && qi < total; });
  }
  var all = b.questions.map(function(_, i){ return i; });
  var filter = opts.filter || 'all';
  if (filter === 'undone'){
    return all.filter(function(qi){ return getStat(bankKey, qi).attempts === 0; });
  }
  if (filter === 'wrong'){
    var set = {};
    (wrongBook[bankKey] || []).forEach(function(qi){ set[qi] = 1; });
    // 也包含最近一次做错的
    var st = stats[bankKey] || {};
    Object.keys(st).forEach(function(qi){
      if (getStat(bankKey, qi).last === 0) set[qi] = 1;
    });
    return all.filter(function(qi){ return set[qi]; });
  }
  return all;
}
function startQuiz(bankKey, opts){
  opts = opts || {};
  var b = BANKS[bankKey];
  if (!b) return;
  var filter = opts.filter || (opts.indices ? 'all' : 'all');
  var order = buildOrder(bankKey, opts);
  if (!order.length){
    var msg = filter === 'undone' ? '该题库没有未做的题了。' :
              filter === 'wrong' ? '该题库当前没有错题。' : '该题库没有题目。';
    alert(msg);
    return;
  }
  var fullOrder = b.questions.map(function(_, i){ return i; });
  S = {
    bank: bankKey,
    fullOrder: fullOrder,
    order: order,
    pos: 0,
    results: {},
    mode: 'seq',
    filter: filter,
    redo: !!opts.indices || filter === 'wrong',
    navOpen: true,
    titleExtra: opts.titleExtra || '',
    optionOrders: {}
  };
  order.forEach(function(qi){
    var q = b.questions[qi];
    if (q && (q.t === 's' || q.t === 'm')) S.optionOrders[qi] = shuffledOptionOrder(q);
  });
  if (typeof opts.startPos === 'number' && opts.startPos >= 0 && opts.startPos < order.length){
    S.pos = opts.startPos;
  } else if (typeof opts.startQi === 'number'){
    var p = order.indexOf(opts.startQi);
    if (p >= 0) S.pos = p;
  }
  document.documentElement.style.setProperty('--accent', b.accent);
  document.documentElement.style.setProperty('--accent-soft', b.accent + '22');
  var title = b.name;
  if (S.titleExtra) title += ' · ' + S.titleExtra;
  else if (filter === 'wrong') title += ' · 错题';
  else if (filter === 'undone') title += ' · 未做';
  else if (S.redo) title += ' · 重做';
  $('#quizBankName').textContent = title;
  $('#modeBtn').textContent = '顺序模式';
  $('#filterBtn').textContent = FILTER_LABEL[S.filter] || '全部';
  $('#quizFilterPill').textContent = (FILTER_LABEL[S.filter] || '全部') + ' · ' + order.length + ' 题';
  $('#navToggleBtn').textContent = '收起题号';
  $('#qnav').classList.add('open');
  show('view-quiz');
  renderQ();
}

function answeredCount(){ return Object.keys(S.results).length; }
function rightCount(){
  var n = 0;
  for (var k in S.results) if (S.results[k].ok) n++;
  return n;
}
function histText(st){
  if (!st.attempts) return '未做过';
  return st.correct + '/' + st.attempts;
}

function resolveStatKey(qi){
  if (S && S.bank === '__wrong_mix__'){
    var q = BANKS[S.bank].questions[qi];
    if (q && q._srcBank != null) return { bank: q._srcBank, idx: q._srcQi };
  }
  return { bank: S.bank, idx: qi };
}

function renderNav(){
  if (!S) return;
  var grid = $('#qnavGrid');
  if (!grid) return;
  var html = '';
  S.order.forEach(function(qi, p){
    var sk = resolveStatKey(qi);
    var st = getStat(sk.bank, sk.idx);
    var done = S.results[qi];
    var cls = ['qnav-cell'];
    if (p === S.pos) cls.push('cur');
    if (done) cls.push(done.ok ? 'ok' : 'bad');
    else if (st.attempts){
      cls.push(st.last === 1 ? 'ok' : 'bad');
    }
    if (done) cls.push('sess');
    html += '<button type="button" class="' + cls.join(' ') + '" data-pos="' + p + '" title="第 ' + (p + 1) + ' 题 · 历史 ' + histText(st) + '">' +
      (p + 1) +
      (st.attempts ? '<div style="font-size:.62rem;opacity:.85;margin-top:2px">' + st.correct + '/' + st.attempts + '</div>' : '') +
      '</button>';
  });
  grid.innerHTML = html;
  grid.querySelectorAll('.qnav-cell').forEach(function(btn){
    btn.onclick = function(){
      S.pos = +btn.getAttribute('data-pos');
      renderQ();
    };
  });
  var jump = $('#jumpIn');
  if (jump){
    jump.min = 1;
    jump.max = S.order.length;
    jump.placeholder = '1-' + S.order.length;
    jump.value = String(S.pos + 1);
  }
}

function jumpToInput(){
  if (!S) return;
  var v = parseInt(($('#jumpIn') && $('#jumpIn').value) || '', 10);
  if (!v || v < 1 || v > S.order.length){
    alert('请输入 1 到 ' + S.order.length + ' 之间的题号');
    return;
  }
  S.pos = v - 1;
  renderQ();
}

function renderQ(){
  if (!S || !S.order.length) return;
  if (S.pos < 0) S.pos = 0;
  if (S.pos >= S.order.length) S.pos = S.order.length - 1;

  var b = BANKS[S.bank];
  var qi = S.order[S.pos];
  var q = b.questions[qi];
  var done = S.results[qi];
  var optOrder = q && q.opts ? optionOrderFor(qi, q) : [];
  var statBank = S.bank, statIdx = qi;
  if (S.bank === '__wrong_mix__' && q && q._srcBank != null){
    statBank = q._srcBank;
    statIdx = q._srcQi;
  }
  var st = getStat(statBank, statIdx);

  $('#quizPos').textContent = '第 ' + (S.pos + 1) + ' / ' + S.order.length + ' 题';
  $('#progFill').style.width = (S.order.length ? (answeredCount() / S.order.length * 100) : 0) + '%';
  $('#quizFilterPill').textContent = (FILTER_LABEL[S.filter] || '全部') + ' · ' + S.order.length + ' 题';
  $('#modeBtn').textContent = S.mode === 'rand' ? '随机模式' : '顺序模式';
  $('#filterBtn').textContent = FILTER_LABEL[S.filter] || '全部';
  $('#navToggleBtn').textContent = S.navOpen ? '收起题号' : '题号';
  $('#qnav').classList.toggle('open', !!S.navOpen);

  var h =
    '<div class="qmeta">' +
      '<span class="qtype">' + TYPE_NAME[q.t] + '</span>' +
      '<span class="qhist' + (st.attempts ? ' has' : '') + '" title="累计答对次数 / 做过次数">历史 ' + histText(st) + '</span>' +
      (S.bank !== '__wrong_mix__' ? '<span class="qhist">原题 #' + (qi + 1) + '</span>' : '') +
    '</div>' +
    '<div class="qtext">' + fmt(q.q) + '</div>';

  if (q.t === 'f'){
    h += '<div class="fillrow"><input id="fillIn" type="text" placeholder="输入答案后回车或点提交" autocomplete="off"' + (done ? ' disabled' : '') + '></div>';
  } else if (q.t === 'e'){
    h += '<div style="color:var(--muted);font-size:.88rem;margin:2px 0 10px">综合题：先自己口述或写出答案，再对照参考答案自评（自评结果计入统计与错题本）。</div>';
  } else {
    optOrder.forEach(function(originalIndex, displayIndex){
      var op = q.opts[originalIndex];
      h += '<div class="opt" data-i="' + originalIndex + '"><span class="tag">' + String.fromCharCode(65 + displayIndex) + '.</span><span>' + fmt(op) + '</span></div>';
    });
  }

  h += '<div class="explain" id="explain"></div>' +
       '<div class="qfoot">' +
       '<button class="btn" id="prevBtn"' + (S.pos === 0 ? ' disabled' : '') + '>上一题</button>' +
       ((q.t === 'm' || q.t === 'f') && !done ? '<button class="btn primary" id="submitBtn">提交</button>' : '') +
       (q.t === 'e' && !done ? '<button class="btn primary" id="revealBtn">显示参考答案</button>' : '') +
       (done ? '<button class="btn" id="retryBtn">再做一次</button>' : '') +
       '<span class="spacer"></span>' +
       '<span class="scorebar">本轮 对 <b class="ok">' + rightCount() + '</b> · 错 <b class="bad">' + (answeredCount() - rightCount()) + '</b></span>' +
       '<button class="btn primary" id="nextBtn">' + nextLabel() + '</button></div>' +
       '<div class="kbhint">快捷键：1-9 选选项 · Enter 提交/下一题 · ← → 切题 · G 跳转 · N 题号面板</div>';

  $('#qcard').innerHTML = h;
  renderNav();

  var sel = new Set();
  var opts = document.querySelectorAll('#qcard .opt');
  if (!done){
    opts.forEach(function(el){
      el.onclick = function(){
        var i = +el.dataset.i;
        if (q.t === 's'){ judge(qi, [i]); }
        else {
          el.classList.toggle('sel');
          if (sel.has(i)) sel.delete(i); else sel.add(i);
        }
      };
    });
    var sb = $('#submitBtn');
    if (sb) sb.onclick = function(){
      if (q.t === 'm'){
        if (!sel.size) return;
        judge(qi, Array.from(sel).sort(function(a, c){ return a - c; }));
      } else {
        var v = $('#fillIn').value.trim();
        if (!v) return;
        judge(qi, v);
      }
    };
    var fi = $('#fillIn');
    if (fi){
      fi.focus();
      fi.onkeydown = function(e){ if (e.key === 'Enter'){ e.preventDefault(); $('#submitBtn').click(); } };
    }
    var rb = $('#revealBtn');
    if (rb) rb.onclick = function(){
      var ex = $('#explain');
      ex.className = 'explain show ok';
      ex.innerHTML = '<div class="verdict">参考答案</div>' +
        explanationSection('完整参考答案', q.ans) +
        renderLearningDetails(q, [], null) +
        '<div class="qfoot" style="margin-top:12px"><span class="scorebar">对照后自评：</span>' +
        '<button class="btn" id="selfBad">没答好，记入错题本</button>' +
        '<button class="btn primary" id="selfOk">我答对了</button></div>';
      rb.style.display = 'none';
      $('#selfOk').onclick = function(){ selfJudge(qi, true); };
      $('#selfBad').onclick = function(){ selfJudge(qi, false); };
      window.scrollTo(0, document.body.scrollHeight);
    };
  } else {
    paintResult(q, done, optOrder);
    var rty = $('#retryBtn');
    if (rty) rty.onclick = function(){ retryCurrent(); };
  }

  $('#prevBtn').onclick = function(){
    if (S.pos > 0){ S.pos--; renderQ(); }
  };
  $('#nextBtn').onclick = gotoNext;
}

function nextLabel(){
  if (answeredCount() >= S.order.length) return '查看成绩';
  return S.mode === 'rand' ? '随机下一题' : '下一题';
}

function recordAnswer(qi, ok, sel){
  S.results[qi] = { ok: ok, sel: sel };
  var bank = S.bank, idx = qi;
  if (S.bank === '__wrong_mix__'){
    var srcQ = BANKS[S.bank].questions[qi];
    if (srcQ && srcQ._srcBank != null){
      bank = srcQ._srcBank;
      idx = srcQ._srcQi;
    }
  }
  setStat(bank, idx, ok);
  if (ok) removeWrong(bank, idx); else addWrong(bank, idx);
}

function judge(qi, sel){
  var b = BANKS[S.bank];
  var q = b.questions[qi];
  var ok;
  if (q.t === 'f'){
    var n = norm(sel);
    ok = (q.a || []).some(function(acc){ return norm(acc) === n; });
  } else {
    ok = JSON.stringify(sel) === JSON.stringify((q.a || []).slice().sort(function(a, c){ return a - c; }));
  }
  recordAnswer(qi, ok, sel);
  renderQ();
}

function selfJudge(qi, ok){
  recordAnswer(qi, ok, 'self');
  renderQ();
}

function retryCurrent(){
  if (!S) return;
  var qi = S.order[S.pos];
  delete S.results[qi];
  renderQ();
}

function paintResult(q, done, optOrder){
  if (q.t === 'e'){
    var exE = $('#explain');
    exE.className = 'explain show ' + (done.ok ? 'ok' : 'bad');
    exE.innerHTML = '<div class="verdict">' + (done.ok ? '✓ 自评：已掌握' : '✗ 自评：未掌握' + (done.ok ? '' : '（已加入错题本）')) + '</div>' +
                    explanationSection('完整参考答案', q.ans) +
                    renderLearningDetails(q, [], done);
    return;
  }
  var opts = document.querySelectorAll('#qcard .opt');
  opts.forEach(function(el){
    el.classList.add('locked');
    var i = +el.dataset.i;
    var isAns = (q.a || []).indexOf(i) >= 0;
    var isSel = Array.isArray(done.sel) && done.sel.indexOf(i) >= 0;
    if (isAns) el.classList.add('right');
    else if (isSel) el.classList.add('wrong');
    else el.classList.add('dim');
    el.onclick = null;
  });
  var fi = $('#fillIn');
  if (fi){
    fi.value = done.sel;
    fi.disabled = true;
    fi.classList.add(done.ok ? 'right' : 'wrong');
  }
  var ex = $('#explain');
  var ansText;
  if (q.t === 'f') ansText = (q.a && q.a[0]) || '';
  else ansText = (q.a || []).map(function(originalIndex){
    return optOrder.indexOf(originalIndex);
  }).filter(function(displayIndex){
    return displayIndex >= 0;
  }).sort(function(a, b){
    return a - b;
  }).map(function(displayIndex){
    return String.fromCharCode(65 + displayIndex);
  }).join('、');
  ex.className = 'explain show ' + (done.ok ? 'ok' : 'bad');
  ex.innerHTML = '<div class="verdict">' + (done.ok ? '✓ 回答正确' : '✗ 回答错误（已加入错题本）') + '</div>' +
                 '<div class="ans">正确答案：' + fmt(ansText) + '</div>' +
                 renderLearningDetails(q, optOrder, done);
}

function gotoNext(){
  var un = S.order.map(function(_, p){ return p; }).filter(function(p){ return !(S.order[p] in S.results); });
  if (!un.length) return renderSummary();
  if (S.mode === 'rand'){
    var cand = un.filter(function(p){ return p !== S.pos; });
    var pool = cand.length ? cand : un;
    S.pos = pool[Math.floor(Math.random() * pool.length)];
  } else {
    var after = un.filter(function(p){ return p > S.pos; });
    S.pos = after.length ? after[0] : un[0];
  }
  renderQ();
}

function gotoPrev(){
  if (!S || S.pos <= 0) return;
  S.pos--;
  renderQ();
}

function renderSummary(){
  var total = S.order.length, right = rightCount();
  var wrongIdx = S.order.filter(function(qi){ return S.results[qi] && !S.results[qi].ok; });
  var acc = total ? Math.round(right / total * 100) : 0;
  $('#progFill').style.width = '100%';
  $('#quizPos').textContent = '已完成';
  $('#qcard').innerHTML = '<div class="summary">' +
    '<div class="sub">' + esc(BANKS[S.bank].name) + (S.filter !== 'all' ? ' · ' + (FILTER_LABEL[S.filter] || '') : '') + ' 完成一轮</div>' +
    '<div class="big">' + acc + '<span style="font-size:1.2rem"> 分</span></div>' +
    '<div class="sub">共 ' + total + ' 题 · 答对 ' + right + ' · 答错 ' + wrongIdx.length + '</div>' +
    '<div class="qfoot" style="justify-content:center">' +
    (wrongIdx.length ? '<button class="btn primary" id="redoBtn">重做本轮错题（' + wrongIdx.length + '）</button>' : '') +
    '<button class="btn" id="againBtn">再来一轮</button>' +
    '<button class="btn" id="homeBtn2">返回题库</button></div></div>';
  renderNav();
  var rb = $('#redoBtn');
  if (rb) rb.onclick = function(){
    startQuiz(S.bank, { indices: wrongIdx, titleExtra: '本轮错题', filter: 'wrong' });
  };
  $('#againBtn').onclick = function(){
    startQuiz(S.bank, {
      indices: S.order.slice(),
      filter: S.filter,
      titleExtra: S.titleExtra
    });
  };
  $('#homeBtn2').onclick = function(){ renderHome(); show('view-home'); };
}

/* ---------- 错题本 ---------- */
function collectAllWrong(){
  var items = [];
  BANK_ORDER.forEach(function(key){
    (wrongBook[key] || []).forEach(function(qi){
      if (!BANKS[key] || !BANKS[key].questions[qi]) return;
      items.push({ bank: key, qi: +qi });
    });
  });
  return items;
}

function renderWrong(){
  var list = $('#wrongList'); list.innerHTML = '';
  var items = collectAllWrong();
  refreshWrongBtn();
  if (!items.length){
    list.innerHTML = '<div class="empty">错题本是空的——答错的题会自动出现在这里，重做答对后自动移除。</div>';
    $('#redoAllBtn').style.display = 'none';
    return;
  }
  $('#redoAllBtn').style.display = '';
  items.forEach(function(it){
    var q = BANKS[it.bank].questions[it.qi];
    var st = getStat(it.bank, it.qi);
    var el = document.createElement('div');
    el.className = 'witem';
    el.innerHTML =
      '<div class="from">' +
        '<span>' + esc(BANKS[it.bank].name) + ' · ' + TYPE_NAME[q.t] + '</span>' +
        '<span>历史 ' + histText(st) + '</span>' +
        '<span>#' + (it.qi + 1) + '</span>' +
      '</div>' +
      '<div class="wq">' + fmt(q.q.length > 90 ? q.q.slice(0, 90) + '…' : q.q) + '</div>';
    el.onclick = function(){
      startQuiz(it.bank, { indices: [it.qi], titleExtra: '错题', filter: 'wrong' });
    };
    list.appendChild(el);
  });
}

function startAllWrongQuiz(){
  var items = collectAllWrong();
  if (!items.length){
    alert('错题本是空的');
    return;
  }
  // 跨题库：创建虚拟会话，按列表顺序做；为兼容现有单 bank 结构，分批按 bank 聚合后顺序做完
  // 简化：把所有错题按出现顺序，逐题库串联——用“混合重做”：先做一个 bank 的全部错题，完成后提示下一批
  // 更直观：用临时混合 bank 会话
  startMixedWrong(items);
}

function startMixedWrong(items){
  // 临时混合题库，不注册进 BANK_ORDER，避免污染首页
  var mixKey = '__wrong_mix__';
  BANKS[mixKey] = {
    name: '全部错题',
    desc: '跨题库错题重做',
    accent: '#dc2626',
    questions: items.map(function(it){
      var q = BANKS[it.bank].questions[it.qi];
      return {
        t: q.t,
        q: '【' + BANKS[it.bank].name + ' #' + (it.qi + 1) + '】\n' + q.q,
        opts: q.opts, a: q.a, ans: q.ans, ex: q.ex, deep: q.deep,
        _srcBank: it.bank, _srcQi: it.qi
      };
    })
  };
  startQuiz(mixKey, { filter: 'all', titleExtra: '跨库重做' });
  S.redo = true;
}

/* ---------- 全局按钮 ---------- */
$('#wrongBtn').onclick = function(){ renderWrong(); show('view-wrong'); };
$('#wrongBackBtn').onclick = function(){ renderHome(); show('view-home'); };
$('#backBtn').onclick = function(){ renderHome(); show('view-home'); };

$('#modeBtn').onclick = function(){
  if (!S) return;
  S.mode = S.mode === 'seq' ? 'rand' : 'seq';
  $('#modeBtn').textContent = S.mode === 'rand' ? '随机模式' : '顺序模式';
  var nb = $('#nextBtn'); if (nb) nb.innerHTML = nextLabel();
};

$('#filterBtn').onclick = function(){
  if (!S) return;
  if (S.bank === '__wrong_mix__'){
    alert('跨库错题重做中不支持切换筛选，请返回题库后使用。');
    return;
  }
  var i = FILTER_CYCLE.indexOf(S.filter);
  var next = FILTER_CYCLE[(i + 1) % FILTER_CYCLE.length];
  var curQi = S.order[S.pos];
  startQuiz(S.bank, { filter: next, startQi: curQi });
};

$('#navToggleBtn').onclick = function(){
  if (!S) return;
  S.navOpen = !S.navOpen;
  $('#qnav').classList.toggle('open', S.navOpen);
  $('#navToggleBtn').textContent = S.navOpen ? '收起题号' : '题号';
};

$('#jumpBtn').onclick = jumpToInput;
$('#jumpIn').addEventListener('keydown', function(e){
  if (e.key === 'Enter'){ e.preventDefault(); jumpToInput(); }
});

$('#redoAllBtn').onclick = function(){ startAllWrongQuiz(); };

$('#clearStatsBtn').onclick = function(){
  if (!confirm('确定清除所有题库的做题统计（历史 对/做）？错题本不受影响。')) return;
  stats = {};
  save(LS_STAT, stats);
  renderHome();
};
$('#clearWrongBtn').onclick = function(){
  if (!confirm('确定清空错题本？做题统计不受影响。')) return;
  wrongBook = {};
  save(LS_WRONG, wrongBook);
  refreshWrongBtn();
  renderHome();
};

var root = document.documentElement;
var savedTheme = null; try{ savedTheme = localStorage.getItem(LS_THEME); }catch(e){}
root.dataset.theme = savedTheme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
$('#themeBtn').onclick = function(){
  root.dataset.theme = root.dataset.theme === 'dark' ? 'light' : 'dark';
  try{ localStorage.setItem(LS_THEME, root.dataset.theme); }catch(e){}
};

document.addEventListener('keydown', function(e){
  if (!document.getElementById('view-quiz').classList.contains('active') || !S) return;
  var tag = document.activeElement && document.activeElement.tagName;
  var inInput = tag === 'INPUT' || tag === 'TEXTAREA';

  if (e.key === 'g' || e.key === 'G'){
    if (!inInput){
      e.preventDefault();
      S.navOpen = true;
      $('#qnav').classList.add('open');
      $('#navToggleBtn').textContent = '收起题号';
      var ji = $('#jumpIn'); if (ji){ ji.focus(); ji.select(); }
    }
    return;
  }
  if (e.key === 'n' || e.key === 'N'){
    if (!inInput){
      e.preventDefault();
      S.navOpen = !S.navOpen;
      $('#qnav').classList.toggle('open', S.navOpen);
      $('#navToggleBtn').textContent = S.navOpen ? '收起题号' : '题号';
    }
    return;
  }
  if (inInput) return;

  if (e.key === 'ArrowLeft'){ e.preventDefault(); gotoPrev(); return; }
  if (e.key === 'ArrowRight'){ e.preventDefault(); gotoNext(); return; }

  var opts = document.querySelectorAll('#qcard .opt:not(.locked)');
  var n = e.key.charCodeAt(0) - 49; // '1' => 0
  if (n >= 0 && n < opts.length && opts[n]) opts[n].click();
  if (e.key === 'Enter'){
    var sb = $('#submitBtn') || $('#revealBtn');
    if (sb) sb.click();
    else {
      var rty = $('#retryBtn');
      var nb = $('#nextBtn');
      if (nb) nb.click();
    }
  }
  if ((e.key === 'r' || e.key === 'R') && $('#retryBtn')){
    e.preventDefault();
    $('#retryBtn').click();
  }
});

renderHome();
})();
</script>

</body>
</html>
