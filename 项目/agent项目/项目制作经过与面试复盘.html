### 真实端到端评测方法

#### 30.1 先区分三种 E2E

面试官问“你的 E2E 怎么做”时，先把范围说清楚：

| 类型 | 是否真实调用 LLM | 是否真实调用外部 RAG/数据库 | 主要验证内容 |
|---|---:|---:|---|
| 纯函数/规则测试 | 否 | 否 | 规则输入输出和边界 |
| 确定性 Agent E2E | 否或使用受控执行 | 使用 fixture 或本地组件 | 计划、工具顺序、状态和安全不变量 |
| 真实 Agent E2E | 是 | 是 | 模型决策、真实工具链、回答质量、延迟和成本 |

**面试逐字稿：**

> 我把 E2E 分成两层。仓库里的 E2E runner 是可重复的确定性链路测试，用固定场景串起画像抽取、上下文压缩、Execution Plan、信息评估、规则计算、fixture citation、答案构造和 Guardrail，主要验证架构不变量。
>
> 在项目实际开发过程中，我另外做过真实模型和真实依赖的 E2E 评测。真实评测通过实际聊天入口或 Agent Runtime 发送多轮消息，使用实际模型、实际工具和实际政策检索环境，捕获完整的工具序列、计划状态、计算结果、citation、最终文本、延迟和错误。它主要验证模型是否能在真实不确定性下遵循流程，以及最终回答是否自然、完整和有证据。
>
> 两者不能互相替代：确定性 E2E 适合快速回归和定位，真实 E2E 适合评估模型行为和线上链路。

---

#### 30.2 真实 E2E 的一条样例如何执行

以“多轮画像累积 + 个人化计算 + 官方依据”为例。

**测试输入：**

~~~text
第 1 轮：我是 1977 年 3 月出生的男性，在上海参保。
第 2 轮：养老保险累计缴费 170 个月。
第 3 轮：我什么时候退休，最低缴费够了吗？请给官方依据。
~~~

**期望的业务轨迹：**

~~~text
messages_received
  → profile_extract
  → context_compression（如果达到阈值）
  → execution_plan(intent=mixed)
  → assessRequiredInfo(status=ready)
  → computePlan(status=ready)
  → retrievePolicy(requireOfficial=true, status=ready)
  → answer_draft
  → answer_guardrail(passed)
  → conversation_persist
  → profile_persist
~~~

**需要记录的证据：**

- 每一轮的原始用户消息。
- 每一轮抽取出的 profile patch。
- 合并后的画像和事实来源。
- Execution Plan 的 intent、status、steps。
- 实际调用工具和调用顺序。
- assessRequiredInfo 的 missing 和 ready。
- computePlan 的结果、规则 trace 和 policy version。
- retrievePolicy 的查询条件、候选数、citation 和 sourceType。
- 最终答案文本。
- Guardrail violation code。
- 总延迟、各阶段延迟、模型 token 和外部调用次数。
- 持久化结果以及长期记忆中最终保留的字段。

**面试逐字稿：**

> 我判断一条真实 E2E 是否通过，不是看接口返回 200，也不是只看最终答案里有没有“退休”两个字，而是看整条证据链是否成立。
>
> 这个场景至少要同时满足：画像字段抽取正确；计划被识别为 mixed；先完成必要信息校验；computePlan 返回 ready；政策检索命中相关且官方来源；最终个人化数字来自 computePlan，政策数字和官方声明有 citation 支持；Guardrail 通过；持久化时只保存用户显式画像，不把退休结果写成用户属性。
>
> 只要其中一个关键不变量失败，即使答案文字碰巧正确，也应该记为链路失败。例如模型直接写了正确的退休年龄，但没有调用规则引擎，这说明系统可能只是凭模型记忆答对一次，不能证明链路可信。

---

#### 30.3 真实 E2E 的测试矩阵

真实评测不能只准备几条正常问题。建议按以下维度组合：

##### 维度一：用户任务

- 个人退休年龄。
- 精确退休年月。
- 缴费缺口。
- 最低缴费政策。
- 延迟退休政策依据。
- 女性退休身份口径。
- 4050 补贴。
- 灵活就业参保。
- 养老金计算公式。
- 混合咨询。

##### 维度二：信息完整性

- 所有字段完整。
- 缺出生年份。
- 缺出生月份。
- 缺性别。
- 缺累计缴费月份。
- 女性缺退休身份。
- 用户表达不确定。
- 多轮逐步补充。
- 多轮前后冲突。
- 模型可能补默认值。

##### 维度三：证据状态

- 只有用户事实，没有政策检索。
- 有规则计算，没有 RAG。
- 有普通摘要，没有官方来源。
- 有官方来源，但版本过期。
- 有多个官方来源且适用条件不同。
- RAG 无结果。
- RAG 降级为 lexical。
- 数据库不可用。
- embedding/API 超时。

##### 维度四：模型行为

- 正确遵循计划。
- 跳过 assessRequiredInfo。
- 重复调用同一工具。
- 调用无关工具。
- 使用工具结果之外的数字。
- 声称官方但 citation 非官方。
- 工具失败后继续编造。
- 过度追问。
- 过度拒答。
- 把工具派生结果写入长期记忆。

##### 维度五：输出风险

- 一般性解释。
- 政策具体数字。
- 个人化退休数字。
- 官方来源声明。
- 资格判断。
- 带免责声明的估算。
- 需要人工核验的结论。

---

#### 30.4 真实 E2E 的判定标准

建议将每条用例拆成六类断言：

| 断言层 | 关键问题 | 示例 |
|---|---|---|
| 输入层 | 用户消息和历史画像是否正确进入系统 | 三轮消息完整传入 |
| 计划层 | intent、status、steps 是否正确 | mixed，包含 compute 和 retrieve |
| 工具层 | 是否调用 required tool，是否调用 forbidden tool | 缺月份时禁止 computePlan |
| 事实层 | 计算和 citation 是否可用 | compute ready，官方 source 命中 |
| 回答层 | 输出是否覆盖任务、没有无支撑 claim | 只在有依据时出现数字 |
| 持久化层 | 记忆是否被污染 | 不保存 compute_plan 派生字段 |

**关键原则：**

- 关键安全用例通常要求零 forbidden tool。
- 缺字段场景要求零个人化确定数字。
- 官方依据场景要求至少一条官方 citation。
- 混合场景要求计算证据和政策证据同时存在。
- 工具失败场景要求正确降级或安全终止。
- 长对话场景要求关键画像和工具事实不丢失。

不要只用“答案包含某个词”作为唯一断言。答案字符串断言可以作为最低层检查，但高质量 E2E 应以结构化轨迹和 claim 支持为主。

---

#### 30.5 真实 E2E 评测的执行流程

**面试逐字稿：**

> 我会先冻结评测环境，包括模型版本、temperature、系统 Prompt、工具 schema、规则集版本、政策数据版本和 embedding 配置。否则同一条用例失败时，无法判断是代码变化、模型变化还是知识库变化。
>
> 然后为每个场景准备初始状态、用户多轮消息、预期意图、允许工具、禁止工具、必要字段、相关来源和输出风险级别。执行时通过真实聊天入口或 Agent Runtime 发送请求，记录完整 trace，而不是只保存最终文本。
>
> 评测结束后先跑程序化断言，例如工具序列、计划状态、规则结果、citation 类型和 Guardrail 状态；再对开放式回答做结构化检查和人工抽样，判断回答是否真正覆盖用户问题、是否正确表达不确定性、citation 是否支持 claim。
>
> 对具有随机性的真实模型，我会对关键用例重复多次，而不是只跑一次。个人化数字、缺字段追问和官方来源要求属于关键不变量，应该重点观察最坏情况，而不是只看平均分。
>
> 最后把失败按根因分类：意图识别失败、画像抽取失败、计划约束失败、工具参数失败、规则计算失败、RAG 召回失败、证据支撑失败、Guardrail 失败、记忆污染和性能问题。每修复一个根因，就把该场景加入回归集。

---

#### 30.6 真实 E2E 如何评估模型回答，而不是把答案写死

**面试逐字稿：**

> 我不会要求答案和标准答案逐字一致，因为政策回答可以有多种自然语言表达。我的评测对象是结构化事实和必要约束。
>
> 例如个人化测算需要检查：是否出现了正确的退休年月、缴费缺口是否与规则引擎一致、是否说明了适用条件和估算边界；缺字段场景需要检查：是否追问正确字段、是否没有给出确定个人数字；政策问题需要检查：是否回答了问题、是否引用了相关来源、是否把官方和摘要区分开。
>
> 可以把最终回答拆成 claim，再为每条 claim 指定验证器。个人化 claim 对规则结果，政策 claim 对 citation excerpt 和版本条件，官方 claim 对 sourceType 和 sourceUrl，用户事实复述对 profile evidence。
>
> 对剩余的表达质量，再使用人工 rubric 或 LLM judge 辅助，但 judge 不能替代确定性校验。尤其是数字和来源，必须优先以系统事实为准。

---

#### 30.7 真实 E2E 评测中最容易出现的假通过

**面试官：你的 E2E 都通过了，为什么线上还可能错？**

**面试逐字稿：**

> 有几种典型的假通过。
>
> 第一，答案碰巧正确，但工具链没有按要求执行。例如模型直接凭记忆回答了一个常见政策数字，字符串检查会认为通过，但没有证据链。
>
> 第二，fixture citation 过于理想化。测试中直接注入了相关官方来源，无法暴露真实检索的 query 改写、过滤、排序和数据库问题。
>
> 第三，测试只覆盖典型年份，没有覆盖政策边界月、旧新版本、身份冲突和无结果场景。
>
> 第四，评测只看最终文本，没有检查长期记忆是否污染、是否调用了 forbidden tool、是否发生了隐性重试或重复调用。
>
> 第五，单次运行通过不能代表随机模型稳定通过。真实模型的计划遵循和表达会有波动。
>
> 所以我在真实 E2E 中会把“最终回答质量”和“执行轨迹正确性”分开评分，同时加入失败注入和重复运行。通过不是一个布尔结论，而是要知道通过的是哪一层。

#### 30.8 真实 E2E 失败复盘：一条“工具成功但事实错误”的 Bad Case

这是我在真实模型链路回放中最有代表性的一类失败。它比“接口 500”更值得复盘，因为所有服务都返回成功，只有把工具参数、事实来源和最终 claim 串起来，才能发现它实际上不应该通过。

**失败用例：**

```text
用户：我是1977年出生的男性，我什么时候退休？
```

**Case 的期望契约：**

```text
intent                  = personal_plan
plan.status             = needs_more_info
missingFields           = [birthMonth, paidMonths]
requiredTools           = [profile_extract, execution_plan, assessRequiredInfo, answer_guardrail]
forbiddenTools          = [computePlan, retrievePolicy]
answer                  = 只追问缺失字段，不出现确定退休年月和缴费缺口
memory                  = 不保存模型补的 birthMonth、paidMonths
```

**第一次真实运行观察到的实际轨迹：**

```text
profile_extract
  → execution_plan(personal_plan, ready)
  → assessRequiredInfo(ready)
  → computePlan(input.birthMonth=1, input.paidMonths=0, status=ready)
  → answer_draft(出现退休年月和缴费缺口)
  → answer_guardrail(passed)
  → profile_persist(错误字段进入后续画像快照)
```

表面上看，这条链路有计划、有信息评估、有规则工具、有 Guardrail，甚至最终答案可能和某个预期年份碰巧一致。如果 E2E 只检查 HTTP 200、`hasComputePlan=true` 或答案包含“退休”，它会被错误判为通过。

**错误后果：**

- 用户得到没有出生月份依据的确定退休时间；
- `paidMonths=0` 造成虚假的缴费缺口；
- Guardrail 因为只确认“有 ready computePlan”而漏过；
- 错误的 profile 快照可能影响下一轮和跨会话恢复；
- 如果只看最终答案，很难区分“模型碰巧答对”和“系统按正确链路计算”。

**我如何检测到它：**

我把 E2E evaluator 从单层答案断言改成多层断言，按以下顺序检查：

1. **输入层**：用户原文中是否真的出现了出生月份和缴费月份。
2. **画像层**：profile patch 和 Memory fact 的来源是否是 `user_message`，是否为 `confirmed`，是否存在冲突。
3. **计划层**：缺字段时是否应为 `needs_more_info`，`missingFields` 是否准确。
4. **工具层**：是否出现 forbidden `computePlan`，以及工具入参中的每个高风险字段是否能追溯到用户证据。
5. **结果层**：`computePlan.status=ready` 是否建立在合法且有证据的输入上，而不是只看状态字段。
6. **回答层**：回答中的退休年月和缴费缺口是否有对应计算结果；缺字段时是否出现了被禁止的个人确定数字。
7. **持久化层**：错误默认值是否进入长期画像，下一轮是否会被重新投影出来。

因此这条失败至少会被三个断言同时捕获：

```text
forbidden tool violation: actual contains computePlan
missing-field violation: expected birthMonth/paidMonths, actual assessment says ready
unsupported-input violation: computePlan input has no user evidence
```

如果这三个断言中只有一个失败，也要保留完整 trace；不能只输出“case failed”，否则修复者仍然不知道问题发生在哪一层。

**根因归因：**

我沿着 trace 反向排查，得到的因果链是：

```text
模型工具参数补默认值
  → schema 认为参数合法
  → assessment 只看 value，没有检查 evidence
  → computePlan 认为输入完整并返回 ready
  → Guardrail 只看有 ready computePlan，没有检查入参来源
  → Memory 持久化边界没有完全隔离派生快照
```

这个归因很重要。如果只修改规则公式，下一次模型把出生月份补成 2 月仍然会产生同类错误；如果只加最终答案关键词拦截，错误记忆已经发生；如果只加 forbidden tool 断言但不修工具内部校验，真实运行仍可能被绕过。

**具体修改：**

第一，把 `assessRequiredInfo` 的判断条件从“字段是否存在且类型正确”改成“字段存在、类型正确、来源允许、状态可用于计算”。

第二，在 `computePlan` 内部保留第二道前置校验。它不信任模型传入的完整 profile，而是根据用户证据和已确认 Memory 重新构造可计算画像；不满足条件时返回 `needs_more_info`，不运行规则计算。

第三，把 Guardrail 的支持条件从 `hasReadyComputePlan` 扩展为“有 ready 计算 + 计算输入经过 evidence 校验 + 个人化 claim 与计算结果一致”。

第四，在记忆持久化中使用来源白名单，只让用户明确表达且未冲突的 profile fact 进入长期画像；`compute_plan`、`model_inferred` 和工具临时快照不进入用户事实投影。

第五，把失败用例固化为确定性回归和真实 E2E 回放：确定性 runner 快速检查状态、工具和记忆不变量；真实模型重复运行检查模型是否仍会尝试补值、是否能自然追问以及修复后的行为是否稳定。

**修复后的轨迹：**

```text
profile_extract
  → execution_plan(personal_plan, needs_more_info)
  → assessRequiredInfo(needs_more_info, missing=[birthMonth, paidMonths])
  → ask_clarification
  → answer_guardrail(passed: no unsupported personal number)
  → profile_persist(only birthYear/gender, no invented fields)
```

当用户下一轮补充“出生月份是 3 月，已经缴费 170 个月”时，新的 trace 才允许变为：

```text
profile_extract
  → memory_merge(confirmed birthMonth/paidMonths)
  → execution_plan(personal_plan, ready)
  → assessRequiredInfo(ready)
  → computePlan(ready)
  → answer_draft
  → answer_guardrail(passed)
```

**回归和发布判定：**

我会把修复后的验证拆成四组，而不是只重跑失败样例：

| 回归组 | 目的 | 必须满足 |
|---|---|---|
| 缺字段反例 | 防止默认值再次绕过 | `needs_more_info`、零 `computePlan` |
| 完整画像正常例 | 防止安全修复导致全量拒答 | `computePlan=ready`、结果可回答 |
| 多轮补充 | 验证状态能恢复 | 不重复追问已确认字段，继续计算 |
| 记忆污染反例 | 防止错误跨会话传播 | 派生/推断字段不进入长期画像 |

真实模型有随机性时，关键 case 不能只跑一次。我会固定模型版本、Prompt、工具 schema、规则版本和政策索引版本，对缺字段、女性身份不明、官方来源不足等高风险场景重复运行，并记录每次的工具序列、失败原因、延迟和 token。目标不是用一个平均通过率掩盖最坏情况，而是确认关键安全不变量没有偶发漏过。

**这条 E2E 失败复盘的面试逐字稿：**

> 我做真实 E2E 时遇到过一条典型的假通过。用户只说“我是 1977 年出生的男性，我什么时候退休”，按契约应该追问出生月份和累计缴费月份，但真实模型为了调用工具补了 1 月和 0 个月。接口返回成功，规则引擎返回 ready，回答也有退休年月，所以如果只看最终文本，这条 case 会被误判为通过。
>
> 我是通过结构化 trace 才发现的。先看用户原文和 profile patch，确认没有出生月份和缴费月份；再看 Plan，发现缺字段状态不对；继续看 `computePlan` 入参，确认出现了没有用户证据的默认值；最后看 Guardrail 和 Memory，发现 Guardrail 只验证了“有 ready 计算”，没有验证计算输入的来源，记忆层也需要隔离派生快照。这样我把问题定位到 evidence gate 和持久化边界，而不是规则公式。
>
> 修复时我增加了三层检查：`assessRequiredInfo` 校验字段证据，`computePlan` 内部二次校验，Guardrail 检查个人化 claim 是否来自经过证据校验的 ready 结果；同时把模型推断和工具派生结果从长期画像中排除。E2E 增加了 forbidden tool、answer exclusion 和 memory pollution 断言。
>
> 修复后，缺字段 case 的轨迹会停在 `needs_more_info`，只追问缺失字段，不调用 `computePlan`，也不输出确定退休数字；用户补齐信息后才进入计算。完整画像和多轮补充用例也一起回归，避免安全修复变成过度拒答。这个过程让我认识到，E2E 的价值不是证明接口能返回，而是证明任务状态、工具路径、事实来源、最终 claim 和持久化结果能够同时成立。

---

### 评测工程与产品化指标补充

#### 问题 71：为什么不用 BLEU、ROUGE 或简单文本相似度？

**面试逐字稿：**

> 因为政策 Agent 的目标不是让回答和参考答案字面相似，而是让结论正确、依据可靠、过程可追溯。相同的政策结论可以有很多种自然语言表达，所以 BLEU 或 ROUGE 低，不代表回答错误；反过来，回答和参考答案很像，但引用了错误政策、使用了过期版本，或者在缺信息时给了确定数字，仍然应该判失败。
>
> 
> 我的评测会把任务拆成结构化状态和事实声明：工具是否调用、参数是否来自用户证据、规则结果是否正确、来源是否命中、回答中的 claim 是否被工具结果或 citation 支撑。文本相似度最多作为辅助观察，不作为政策数字或可信度的主指标。

#### 问题 72：工具调用如何评估？为什么不能只看最终答案？

**面试逐字稿：**

> 因为最终答案正确，可能只是模型凭记忆猜对了，并不能证明链路按预期执行。对于高风险政策问题，我不仅要看“答对没有”，还要看“是否经过了应该经过的步骤”。
>
> 
> 我会根据每条 case 的 gold workflow 标注 requiredTools、forbiddenTools、工具顺序或依赖关系，以及关键参数来源。然后从真实 trace 中计算：必要工具调用召回率、无关工具调用精确率、工具顺序正确率和参数准确率。
>
> 
> 比如完整个人化测算必须调用信息完整性校验和 computePlan；纯政策解释不应该调用个人化规则引擎；缺出生月份时 computePlan 应该被禁止；即使模型最终碰巧答出了正确年份，只要绕过了规则引擎，也不能把这个 case 判为完全通过。

#### 问题 73：LLM-as-judge 怎么用？如何校准？

**面试逐字稿：**

> LLM judge 适合辅助判断自然语言回答的完整性、可读性、是否覆盖用户问题，以及帮助拆分回答中的 claim，但它不应该独立裁决高风险政策数字。
>
> 
> 我会先建立一批人工标注的 gold set，把 claim 标成 supported、unsupported、contradicted 或 not_applicable，再让 judge 对同一批样本评分，比较它和人工标注的一致性，并分析误判集中在哪些类型。
>
> 
> 对退休日期、最低缴费月数、缴费缺口这类确定性结果，我优先使用程序化比对：回答中的数字必须能映射到规则引擎结果；对 citation 是否真正支持政策解释，可以用结构化规则加人工抽检，LLM judge 只作为辅助。
>
> 
> 这样做的原因是，judge 本身也可能产生偏差。如果让一个模型去裁决另一个模型有没有违反政策边界，容易把评测再次变成不可解释的黑盒。

#### 问题 74：固定评测集、隐藏评测集和线上回流集分别解决什么问题？

**面试逐字稿：**

> 固定回归集用于保证已有能力不退化，比如缺字段不能计算、规则边界不能错、核心政策来源不能漏。它可以被开发者看到，适合本地和 CI 快速执行。
>
> 
> 隐藏评测集用于检查泛化能力，不能被用来针对性调 prompt，否则分数会失去意义。它可以包含不同表达、不同对话顺序、相似政策和边界条件。
>
> 
> 线上回流集来自真实 bad case，经过脱敏和人工复核后加入离线评测。它反映的是测试设计没有预先想到的问题，可以让 benchmark 持续接近真实分布。
>
> 
> 三者结合，分别解决防回归、看泛化和发现新问题，不能用一套固定集代替全部评测。

#### 问题 75：真实 E2E 中模型有随机性，如何保证结果可信？

**面试逐字稿：**

> 真实 E2E 不能只调用一次然后根据一次结果下结论。模型输出存在随机性，外部检索和服务也可能有波动，所以我会固定模型版本、政策索引版本、规则版本和测试输入，并记录每次运行的 trace。
>
> 
> 对高风险 case，我会重复运行多次，分别观察任务通过率、工具路径稳定性、参数错误率和 Unsafe Answer Rate。对于关键安全约束，比如缺字段时禁止 computePlan，应该采用确定性断言，不能因为某一次模型恰好追问了就认为系统安全。
>
> 
> 如果一次运行失败，我会根据 trace 归因，而不是简单把它记成“模型不稳定”。需要区分意图识别错误、工具选择错误、参数错误、外部依赖失败、规则结果错误和回答整合错误。

#### 问题 76：离线指标和产品指标如何对齐？

**面试逐字稿：**

> 离线指标要从产品风险反推，而不是只选容易统计的指标。这个项目的产品目标是让用户得到可信的政策解释和个人化规划，所以离线侧要关注 Rule Accuracy、Missing Info Recall、RelevantOfficialHit 和 Claim Support Rate。
>
> 
> 上线或试运行后，还要关注用户追问率、负反馈率、人工转接率、RAG 降级率、工具失败率和 citation 查看或点击情况。比如用户频繁追问“依据是什么”，可能说明回答虽然有 citation，但展示不清楚；用户频繁追问同一个缺失字段，可能说明追问策略不够友好。
>
> 
> 但产品指标不能替代正确性指标。用户没有投诉，不代表政策数字就是正确的；因此高风险规则和安全指标仍然要有独立门槛。

#### 问题 77：如果端到端通过率很高，但用户满意度不高，说明什么？

**面试逐字稿：**

> 这通常说明“任务约束完成”和“用户体验好”之间还有差距。系统可能在安全上很保守，频繁追问；或者答案虽然有依据，但表达太长、没有直接回答用户最关心的问题；也可能是用户想要办理路径，而系统只给了政策解释。
>
> 
> 我会先把低满意度样本和 trace 对齐，观察是过度追问、过度拒答、答案组织、citation 展示还是任务理解问题，再针对模块优化。对于政策 Agent，不能为了提高满意度而放松高风险约束，而是要把安全追问做得更少、更精准，并在不能计算时提供有帮助的通用解释和下一步材料清单。

#### 评测指标的统一失败复盘：从文本相似度假通过到产品指标错配

前面的 Q71～Q77 讲的是指标应该怎么设计。面试官如果继续追问“你有没有遇到过指标把错误判成正确”，我会用下面这条失败轨迹回答。它同时说明三件事：**文本像不像不是可信度，固定集通过不是泛化能力，E2E 通过也不等于用户任务完成**。

**代表性 Bad Case 一：答案很像参考答案，但执行路径是错的**

```text
用户：我是 1977 年 3 月出生的男性，已经缴费 170 个月。我什么时候退休？

gold workflow：
  profile.birthYear = confirmed
  profile.birthMonth = confirmed
  profile.gender = confirmed
  profile.paidMonths = confirmed
  plan.status = ready
  required tools = assessRequiredInfo -> computePlan
  final personal claim 必须来自 computePlan.result

模型实际轨迹：
  profile_extract = 正确
  plan.status = ready
  computePlan = 没有调用
  模型根据上下文和经验直接生成一个退休年月
  最终回答的措辞与参考答案高度相似
```

如果参考答案本身也是一段“先给退休结论、再解释计算依据”的模板，BLEU、ROUGE 或简单文本相似度都可能给出很高分。但这条 case 仍然应该判失败，因为**高风险个人数字没有经过要求的确定性工具，也没有 rule trace、ruleSet 和参数版本**。模型可能只是碰巧猜对，也可能在政策版本变化后继续输出旧数字。

**代表性 Bad Case 二：答案不像参考答案，但事实和证据是对的**

```text
gold：按当前规则，你预计在某个退休时点达到对应退休年龄；具体月份还要结合出生月份和适用口径确认。

actual：
  没有复述 gold 的句式
  使用了“从你的出生年月和身份口径看……”的不同表达
  退休年月与 computePlan.result 一致
  政策条件由对应 official citation 支持
  对尚未覆盖的精度边界做了明确说明
```

这条 case 可能因为措辞、句子顺序和 n-gram 不同而得到较低的文本相似度，但从业务角度应该通过。也就是说，文本指标既会把“看起来像但过程不可信”判成好，也会把“表达不同但证据完整”判成差。

**一次失败回放中的 expected / actual trace：**

| 阶段 | Expected | Actual | 判定 |
|---|---|---|---|
| 信息校验 | 字段来自用户事实，状态为 `ready` | 字段抽取正确 | 仅抽取通过 |
| 计划执行 | 必须调用 `computePlan` | 没有 `computePlan` 事件 | hard fail |
| 规则证据 | 有 `ruleTrace`、`ruleSet`、`paramsId` | 没有规则结果 | hard fail |
| 最终 claim | 个人数字绑定 `computePlan.result` | 数字只出现在模型文本中 | unsupported claim |
| 文本相似度 | 不作为硬门禁 | 与 gold 很像 | 误判为 pass |
| 长期记忆 | 只允许保存显式用户事实 | 不能保存模型猜测的退休结果 | 需要检查污染 |

我排查时不会只看最终回答，而是把同一个 `caseId` 的输入、画像 patch、计划、工具事件、规则结果、回答草稿、最终文本、Guardrail 结果和 Memory patch 串起来。这样可以明确回答：**它是“答案错”，还是“答案碰巧对但路径错”，还是“工具正确但回答没有使用工具结果”**。

**为什么 29/29、6/6、10/10 也不能被过度解读：**

- `29/29` 只能说明当前固定 Agent 回归集中的 29 条样例通过，不能说明所有用户表达都通过，也不能证明隐藏集或线上分布通过。
- `6/6` 只能说明固定 E2E 或规则边界样例通过；如果样例没有覆盖缺字段、工具越权、版本冲突和记忆污染，分母再小也无法说明这些风险不存在。
- `10/10` 只能说明当前标注的 RAG 用例通过，不能替代更大规模 benchmark，更不能直接等价于最终回答准确率。
- 历史 `Recall@3 = 94%` 是 **source-level** 指标，回答 Top-3 中是否出现标注的相关来源；历史官方来源命中率 `98%` 是 **query-level** 指标，Top-K 中是否至少出现一条官方类型来源。两者都不直接证明 claim 被正确支持。

因此我会把评测结果拆成不同层级，而不是汇报一个“总通过率”：

| 层级 | 核心问题 | 典型指标或断言 | 主要证据 |
|---|---|---|---|
| 规则正确性 | 输入固定时计算是否正确 | Rule Accuracy、边界样例、性质测试 | 独立 gold、rule trace |
| 执行正确性 | 该走的步骤是否走了 | required tool、forbidden tool、顺序、参数来源 | Execution trace |
| 证据正确性 | 来源是否真的支持 claim | RelevantOfficialHit、Citation Completeness、Claim Support Rate | source/chunk/excerpt |
| 回答质量 | 用户是否得到清楚、完整、克制的表达 | 事实覆盖、条件覆盖、拒答边界、可读性 | claim evaluator、人工标注 |
| 交互与产品 | 用户是否完成了咨询任务 | 补全率、重复追问率、任务完成率、负反馈率、人工转接率 | 多轮回放和产品日志 |

**LLM-as-judge 与人工标注不一致时怎么处理：**

我不会把 judge 分数直接当真值。首先抽取一批覆盖正常、缺字段、混合请求、政策冲突、无证据数字和降级依赖的样本，人工把 claim 标成 `supported`、`unsupported`、`contradicted` 或 `not_applicable`，同时标注任务是否完成、追问是否必要、citation 是否真正相关。然后让 judge 在同一批样本上评分，比较它与人工结果的一致性，单独分析它最容易犯的错误。

如果 judge 把“有官方链接”误判为“官方内容支持了具体数字”，说明 judge 的 rubric 不够细；如果 judge 把合理的同义表达判成事实缺失，说明它过度依赖参考答案表面文本。修复方式是把 rubric 改成结构化判断，给 judge 同时提供 claim、evidence、适用地区、政策版本和禁止推断规则，并对高风险数字继续使用程序化比对和人工抽检。**judge 只能辅助评估开放式表达，不能替代规则结果和证据门禁。**

**E2E 通过率高但满意度低的失败复盘：**

我遇到这种现象时，第一步会先确认 E2E 脚本是不是把所有信息一次性喂给系统。脚本可以自动补齐出生年月、性别和缴费月份，因此工具链、规则结果和最终答案都通过；真实用户却可能只提供一句“我什么时候退休”，在连续追问多个字段后直接退出。此时 E2E 的 `task_status = pass`，但用户旅程实际上是 `input → repeated clarification → abandon`。

另一类情况是政策回答满足了 citation 和安全断言，却把结论埋在长免责声明后面，用户仍然不知道“我现在能确认什么、还要准备什么材料”。所以我会把低满意度样本按原因拆分：过度追问、重复追问、过度拒答、答案结构、citation 不可理解、任务意图误判、依赖降级和办理路径缺失，再回看对应 trace，而不是简单放松 Guardrail。

**修复后的分层门禁：**

1. 对缺字段、错误来源、禁止工具、规则矛盾和无证据高风险 claim 设置 hard gate；这些不允许靠语言质量抵消。
2. 对回答完整性、可读性和表达长度设置 soft score；低于阈值可以优化模板或重新组织，但不能修改事实。
3. 对多轮产品体验补充用户路径断言：补充字段后不能重复追问、一次追问应覆盖当前任务所需的最小字段、无法计算时必须给出安全范围内的下一步帮助。
4. 每次修复都把原始失败样本加入固定回归集，再使用变形样本检查是否只是针对某一句 Prompt 过拟合。

**面试逐字稿：**

> 我后来意识到，评测最容易出现的错误不是指标不会算，而是指标测错了对象。比如一条完整画像的个人化问题，模型没有调用 `computePlan`，只是根据上下文猜出了一个和参考答案一样的退休年月。BLEU、ROUGE 甚至人工快速浏览都可能觉得它通过，但 trace 会显示没有规则事件、没有 `ruleTrace`，最终数字也没有 evidenceRef，所以这条 case 在执行正确性和证据正确性上必须失败。
>
> 
> 反过来，一条答案使用了不同的自然语言表达，但数字和条件都与规则结果一致，官方政策 claim 也能落到对应的 sourceId、chunkId 和 excerpt，它可能文本相似度不高，但业务上应该通过。因此我的做法是把评测拆成规则、执行、证据、回答和产品五层。高风险数字用程序化校验，工具路径看 required 和 forbidden tools，政策回答看 claim 是否被具体 citation 支持，开放式表达再用人工标注或校准后的 LLM judge 辅助。
>
> 
> 另外，`29/29`、`6/6` 和 `10/10` 只能说明固定回归集通过，94% 和 98% 也分别是 source-level Recall@3 和 query-level 官方来源命中率，不能说成最终回答准确率。真实 E2E 通过率高但满意度低时，我会把用户反馈和 trace 对齐，判断是脚本过度提供信息、系统重复追问、答案组织不清，还是用户需要办理路径而系统只给了政策解释。这样指标才真正对应产品风险，而不是为了追求一个漂亮的总分。

## 七、深度面试 Q&A 核心题库

> 本部分回答：面试官可能如何围绕前六部分深挖，以及如何给出有原理、有项目证据、有取舍和有边界的回答。

### 题库使用方法与 Agent 心智模型

#### 18.1 使用方式

下面的问题不是让你机械背诵，而是帮助你形成一套稳定的回答顺序：

1. 先说明业务风险和问题本质。
2. 再说明为什么不能只靠 LLM。
3. 然后讲你的架构决策、状态变化和工具契约。
4. 最后说明验证方式、当前边界和下一步。

当面试官只问一句“你这个 Agent 是怎么做的”时，不要一次性把所有模块都念出来。建议先用 60 秒回答主线，面试官继续追问哪个方向，再展开对应章节。

#### 18.2 先建立一个准确的 Agent 心智模型

我对这个项目中 Agent 的理解不是“让大模型多调用几个工具”，而是：

> Agent 是一个由模型参与决策、由工具执行动作、由状态承载上下文、由策略约束边界的闭环系统。

在这个项目里，一轮请求可以抽象为：

~~~text
用户输入
  → 当前状态：消息、画像、记忆、摘要、工具事实
  → 任务判断与执行计划
  → 模型提出工具动作
  → 服务端检查前置条件
  → 工具执行并返回结构化结果
  → 状态更新或进入下一步
  → 模型组织答案
  → 回答支撑校验
  → 持久化允许保存的事实
~~~

这个定义有三个关键点：

- **模型不是唯一决策者**：高风险的计算和政策来源要求由服务端规则约束。
- **工具不是普通函数**：工具要有输入 schema、前置条件、输出状态、失败语义和可观测事件。
- **记忆不是聊天记录**：记忆中的每个字段都需要来源、置信度和状态。

面试官如果继续问“那你做的到底是不是 Agent”，我会回答：

> 是，但它不是完全开放式、完全由模型自主控制的 Agent，而是一个受约束的混合 Agent。语言理解、混合意图识别和回答组织由模型参与；个人化信息闸门、规则计算、官方来源要求和结果校验由服务端控制。对于社保这种高风险场景，我认为这种分工比让模型自由探索更合理。

### 题库总导航、覆盖矩阵与统一答题协议

第七部分是全文的面试核心。前六部分不是背景材料，而是本题库每一道深挖题的事实来源。面试时要做到“题目可以切换，底层主线不变”：无论面试官问 Agent 原理、RAG、记忆、评测还是个人贡献，都回到**风险—职责分工—状态与证据—验证—边界**这五个轴上。

#### 前六部分到第七部分的覆盖矩阵

| 前六部分知识底座 | 面试官真正想确认什么 | 第七部分对应题库 | 必须掌握的关键问题 |

| 项目背景与业务问题 | 你是否理解为什么这个场景不能只做聊天或普通 RAG | 基础题、A 类、G 类、L 类 | Agent 与普通 RAG/工作流的边界；用户和业务风险是什么 |
| 从 0 到 1 的制作过程 | 你是否真的做过决策，而不是事后拼装技术名词 | I 类、G 类、L 类 | 为什么先做规则；为什么后来增加信息闸门、记忆和 RAG；哪些尝试失败过 |
| 系统架构与运行机制 | 你能否讲清状态、工具契约和执行顺序 | A 类、B 类、C 类、H 类 | Plan 由谁生成；工具如何依赖；状态如何变化；失败如何恢复 |
| 典型场景与端到端链路 | 你能否把抽象架构落到一条真实请求上 | B 类、C 类、D 类、E 类、H 类 | 缺字段、女性身份冲突、混合请求、长对话、RAG 降级如何处理 |

| Agent 横向知识 | 你是否能把项目经验迁移到岗位通用问题 | K 类、A 类、F 类 | RAG/规则/微调边界；多智能体、MCP、Reward hacking 如何判断 |
| 个人贡献与岗位匹配 | 你是否能证明自己负责了关键判断和落地 | L 类、G 类、I 类 | 个人贡献、业务价值、没有线上用户时如何证明价值、扩展方向 |

| `H-01`～`H-11` | H 类问题 45～55 | 真实 E2E、ground truth、失败归因和复杂场景 |
| `I-01`～`I-05` | I 类问题 56～60 | 制作决策、错误尝试和最小必要信息 |
| `J-01`～`J-10` | J 类问题 61～70 | RAG 检索工程补充 |
| `K-01`～`K-06` | K 类问题 78～83 | Agent 岗位横向知识 |
| `L-01`～`L-05` | L 类问题 84～88 | 个人贡献、业务价值和岗位匹配 |

面试官不一定按照编号提问，所以不要死记“第几题的第几句”。应先识别问题属于哪条主线，再调用对应的答案结构。

#### 每道深挖题的统一回答模板

第七部分每道题都建议按以下顺序准备。不是每次都要把九个部分全部说完，而是根据面试官的时间和追问深度逐层展开：

1. **面试官问题**：把问题还原成一句清晰的话，避免答非所问。
2. **考察点**：指出是在考 Agent 边界、工程落地、业务理解、评测能力还是真实性。
3. **结论**：先用一句话给判断，不要从背景铺垫开始。
4. **原理解释**：说明为什么这个问题在政策 Agent 中风险高，以及相关机制如何工作。
5. **项目中的具体实现**：讲模块、状态、工具输入输出、数据来源和执行顺序。
6. **Bad Case 或验证方式**：给一个真实或代表性反例，并说明如何通过 trace、断言、回归或指标验证。
7. **技术取舍**：说明方案换来了什么、牺牲了什么，以及为什么在当时优先这样做。
8. **当前边界**：明确哪些已经实现、哪些只是后续方案，主动避免过度包装。
9. **面试官追问**：预判下一层问题，并准备一到两句短答。
10. **30 秒短答**：时间被压缩时，保留结论、项目动作和边界。

技术题可以直接套用：

> 我的结论是……。这个场景的核心风险在于……，所以我把……交给服务端/规则/检索，把……交给模型。项目里最典型的反例是……，我通过……定位并用……回归验证。这个方案的取舍是……，当前还没有完全解决的是……。

项目复盘题可以套用 STAR/BEI：

> 当时的场景是……，系统原本能够……，但在……条件下出现了……。我的目标是……。我先通过……定位现象，再对比……确认根因，最后采取……修复，并增加……类反例测试。修复后的结果是……，这次问题让我形成的工程原则是……。

复杂场景题可以套用状态机表达：

> 我会先拆意图和风险，再确定当前状态。缺字段进入 `needs_more_info`，冲突进入 `conflict`，工具暂时不可用进入 `degraded`，只有满足前置条件才进入 `ready` 和计算状态。每个个人化数字都必须绑定规则结果，每个政策数字都必须绑定 citation；如果证据不足，我会缩小回答范围，而不是补一个看似完整的结论。

#### 五类口径必须始终一致

旧稿补充内容和新增逐字稿都服务于当前项目，不代表项目新增了另一套架构。以下口径在所有答案中保持不变：

- 当前 `Execution Plan` 主要由服务端根据意图和画像状态确定性生成，不说成 LLM 自主生成任意计划并自由执行。
- 当前 `Guardrail` 主要承担回答生成后的发现、校验和观测职责，不说成已经完全阻断所有错误。
- 真实 E2E 已经完成，但它是离线测试环境中的真实聊天入口和真实模型链路，不等于真实线上用户验证。
- RAG 的 Recall@3 和官方来源命中率是召回层指标，不等于最终回答准确率，也不等于每个 claim 都被证据支持。
- 当前是单 Agent workflow 加多工具，不说成多个自治 Agent 协作系统。
- 没有实际实现的 SFT、DPO、RL、多智能体和 MCP，只能作为横向理解或后续设计回答。
