    headings.forEach(function(h) {
      const level = parseInt(h.tagName.charAt(1), 10);
      const text = h.textContent.replace(/¶$/, '').trim();
      const id = h.id || slugify(text);
      h.id = id;
      items.push({ level: level, text: text, id: id, el: h });
    });

    if (items.length === 0) {
      tocEmpty.classList.add('visible');
      return;
    }

    // 构建嵌套的树形结构
    // 每个 item 加上 children 数组
    const root = { level: 0, children: [], id: '__root__' };
    const stack = [root];

    items.forEach(function(item) {
      // 弹出栈中 level >= 当前 level 的项
      while (stack.length > 1 && stack[stack.length - 1].level >= item.level) {
        stack.pop();
      }
      const parent = stack[stack.length - 1];
      parent.children = parent.children || [];
      parent.children.push(item);
      stack.push(item);
    });

    // 渲染树
    const fragment = document.createDocumentFragment();
    root.children.forEach(function(item) {
      fragment.appendChild(buildTocNode(item));
    });
    tocList.appendChild(fragment);

    // 更新计数
    updateMarkCounts();

    // 启动 scroll spy
    setupScrollSpy();
  }

  // 递归构建目录节点
  function buildTocNode(item) {
    const li = document.createElement('li');
    li.className = 'sidenav__item';
    li.setAttribute('data-id', item.id);
    li.setAttribute('data-level', item.level);

    const hasChildren = item.children && item.children.length > 0;

    if (hasChildren) {
      li.classList.add('has-children');
      // 默认：level-1 展开子项（最大标题可见）；level >= 2 默认折叠
      // 用户已显式展开过的不受默认规则影响
      let collapsed;
      if (TocState.isCollapsed(item.id)) {
        collapsed = true;
      } else if (localStorage.getItem('toc-collapsed-init-' + item.id) === 'expanded') {
        collapsed = false;
      } else {
        collapsed = item.level >= 2; // 默认 level>=2 折叠
      }
      if (collapsed) li.classList.add('collapsed');
    }

    const a = document.createElement('a');
    a.className = 'sidenav__link level-' + item.level;
    a.href = '#' + item.id;
    a.setAttribute('data-level', item.level);
    a.setAttribute('data-text', item.text.toLowerCase());
    a.setAttribute('data-id', item.id);

    const textSpan = document.createElement('span');
    textSpan.className = 'sidenav__link-text';
    textSpan.textContent = item.text;
    a.appendChild(textSpan);

    // 折叠/展开按钮（仅有子项时显示）
    if (hasChildren) {
      const toggleBtn = document.createElement('span');
      toggleBtn.className = 'sidenav__toggle';
      toggleBtn.setAttribute('role', 'button');
      toggleBtn.setAttribute('aria-label', '展开/折叠');
      toggleBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>';
      toggleBtn.addEventListener('click', function(e) {
        e.preventDefault();
        e.stopPropagation();
        const wasCollapsed = li.classList.contains('collapsed');
        if (wasCollapsed) {
          li.classList.remove('collapsed');
          li.classList.add('expanded');
          TocState.setCollapsed(item.id, false);
          localStorage.setItem('toc-collapsed-init-' + item.id, 'expanded');
        } else {
          li.classList.add('collapsed');
          li.classList.remove('expanded');
          TocState.setCollapsed(item.id, true);
        }
      });
      a.appendChild(toggleBtn);
    }

    // 收藏 / 掌握 标记按钮
    const actions = document.createElement('span');
    actions.className = 'sidenav__link-actions';

    const starBtn = document.createElement('button');
    starBtn.className = 'sidenav__mark-btn' + (MarkManager.has('starred', item.id) ? ' starred' : '');
    starBtn.setAttribute('type', 'button');
    starBtn.setAttribute('title', MarkManager.has('starred', item.id) ? '取消收藏' : '加入收藏');
    starBtn.setAttribute('aria-label', '收藏');
    starBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>';
    starBtn.addEventListener('click', function(e) {
      e.preventDefault();
      e.stopPropagation();
      MarkManager.toggle('starred', item.id);
      starBtn.classList.toggle('starred', MarkManager.has('starred', item.id));
      a.classList.toggle('starred', MarkManager.has('starred', item.id));
      starBtn.setAttribute('title', MarkManager.has('starred', item.id) ? '取消收藏' : '加入收藏');
      updateMarkCounts();
      applyFilter();
    });
    actions.appendChild(starBtn);

    const masteredBtn = document.createElement('button');
    masteredBtn.className = 'sidenav__mark-btn' + (MarkManager.has('mastered', item.id) ? ' mastered' : '');
    masteredBtn.setAttribute('type', 'button');
    masteredBtn.setAttribute('title', MarkManager.has('mastered', item.id) ? '取消掌握' : '标记为已掌握');
    masteredBtn.setAttribute('aria-label', '已掌握');
    masteredBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>';
    masteredBtn.addEventListener('click', function(e) {
      e.preventDefault();
      e.stopPropagation();
      MarkManager.toggle('mastered', item.id);
      masteredBtn.classList.toggle('mastered', MarkManager.has('mastered', item.id));
      a.classList.toggle('mastered', MarkManager.has('mastered', item.id));
      masteredBtn.setAttribute('title', MarkManager.has('mastered', item.id) ? '取消掌握' : '标记为已掌握');
      updateMarkCounts();
      applyFilter();
    });
    actions.appendChild(masteredBtn);

    a.appendChild(actions);

    // 应用已存在的标记 class
    if (MarkManager.has('starred', item.id)) a.classList.add('starred');
    if (MarkManager.has('mastered', item.id)) a.classList.add('mastered');

    a.addEventListener('click', function(e) {
      // 如果点击的是按钮或切换器，不处理跳转
      if (e.target.closest('.sidenav__mark-btn') || e.target.closest('.sidenav__toggle')) return;
      e.preventDefault();
      const target = document.getElementById(item.id);
      if (target) {
        target.scrollIntoView({ behavior: 'smooth', block: 'start' });
        // 在移动端关闭侧边栏
        if (window.innerWidth <= 768) {
          closeSidenav();
        }
      }
    });
    li.appendChild(a);

    // 递归构建子节点
    if (hasChildren) {
      const subUl = document.createElement('ul');
      subUl.className = 'sidenav__sublist';
      item.children.forEach(function(child) {
        subUl.appendChild(buildTocNode(child));
      });
      li.appendChild(subUl);
    }

    return li;
  }

  // 更新计数显示
  function updateMarkCounts() {
    $('#starredCount').textContent = MarkManager.count('starred');
    $('#masteredCount').textContent = MarkManager.count('mastered');
  }

  // 当前筛选模式：'all' | 'starred' | 'mastered'
  let currentFilter = 'all';

  // 应用筛选
  function applyFilter() {
    const sidenav = $('#sidenav');
    const tocList = $('#tocList');

    // 清除所有相关标记
    $$('.sidenav__item', tocList).forEach(function(li) {
      li.classList.remove('filter-match', 'ancestor-of-match');
    });

    if (currentFilter === 'all') {
      sidenav.classList.remove('sidenav__filter-mode');
      $('#tocEmpty').classList.remove('visible');
      return;
    }

    sidenav.classList.add('sidenav__filter-mode');

    const type = currentFilter; // 'starred' or 'mastered'
    const matchedItems = $$('.sidenav__item', tocList).filter(function(li) {
      const id = li.getAttribute('data-id');
      const isMatch = MarkManager.has(type, id);
      if (isMatch) li.classList.add('filter-match');
      return isMatch;
    });

    // 标记祖先节点
    matchedItems.forEach(function(matchLi) {
      let node = matchLi.parentElement;
      while (node && node !== tocList) {
        if (node.classList && node.classList.contains('sidenav__item')) {
          node.classList.add('ancestor-of-match');
        }
        node = node.parentElement;
      }
    });

    // 显示空状态
    if (matchedItems.length === 0) {
      $('#tocEmpty').classList.add('visible');
    } else {
      $('#tocEmpty').classList.remove('visible');
    }
  }

  // 全部展开/折叠
  function expandAll() {
    $$('#tocList .sidenav__item.has-children').forEach(function(li) {
      li.classList.remove('collapsed');
      li.classList.add('expanded');
      const id = li.getAttribute('data-id');
      TocState.setCollapsed(id, false);
      localStorage.setItem('toc-collapsed-init-' + id, 'expanded');
    });
  }

  function collapseAll() {
    $$('#tocList .sidenav__item.has-children').forEach(function(li) {
      li.classList.add('collapsed');
      li.classList.remove('expanded');
      const id = li.getAttribute('data-id');
      TocState.setCollapsed(id, true);
    });
  }

  function setupFilter() {
    MarkManager.load();
    TocState.load();

    $$('#sidenavFilter .sidenav__filter-btn').forEach(function(btn) {
      btn.addEventListener('click', function() {
        currentFilter = btn.getAttribute('data-filter');
        $$('#sidenavFilter .sidenav__filter-btn').forEach(function(b) {
          b.classList.toggle('active', b === btn);
        });
        applyFilter();
      });
    });

    $('#expandAllBtn').addEventListener('click', expandAll);
    $('#collapseAllBtn').addEventListener('click', collapseAll);
  }

  // ============ Scroll Spy ============
  function setupScrollSpy() {
    const links = $$('.sidenav__link');
    const headings = links.map(function(link) {
      const id = link.getAttribute('href').slice(1);
      return { link: link, heading: document.getElementById(id) };
    }).filter(function(item) { return item.heading; });

    const spy = function() {
      const scrollPos = window.scrollY + 100;
      let current = -1;
      for (let i = 0; i < headings.length; i++) {
        if (headings[i].heading.offsetTop <= scrollPos) {
          current = i;
        }
      }
      links.forEach(function(l, i) {
        if (i === current) {
          l.classList.add('active');
          // 自动展开包含 active 项的折叠祖先链
          expandPathToItem(l.parentElement);
          // 滚动到视图中
          if (l.scrollIntoView && l.parentElement) {
            const parent = $('#sidenav');
            const linkTop = l.offsetTop - parent.offsetTop;
            const linkBottom = linkTop + l.offsetHeight;
            const viewTop = parent.scrollTop;
            const viewBottom = viewTop + parent.clientHeight;
            if (linkTop < viewTop || linkBottom > viewBottom) {
              // 平滑滚动 sidenav
              parent.scrollTo({ top: linkTop - parent.clientHeight / 2 + l.offsetHeight / 2, behavior: 'smooth' });
            }
          }
        } else {
          l.classList.remove('active');
        }
      });
    };
    const spyDebounced = debounce(spy, 30);
    window.addEventListener('scroll', spyDebounced, { passive: true });
    spy();
  }

  // ============ 展开/显示某个标题（用于搜索命中或滚动定位）============
  function expandPathToItem(li) {
    if (!li) return;
    let node = li.parentElement;
    while (node && node.id !== 'tocList') {
      if (node.classList && node.classList.contains('sidenav__item')) {
        node.classList.remove('collapsed');
        node.classList.add('expanded');
      }
      node = node.parentElement;
    }
  }

  // ============ 侧边栏 ============
  function openSidenav() {
    $('#sidenav').classList.add('open');
    $('#sidenavOverlay').classList.add('visible');
    document.body.style.overflow = 'hidden';
  }
  function closeSidenav() {
    $('#sidenav').classList.remove('open');
    $('#sidenavOverlay').classList.remove('visible');
    document.body.style.overflow = '';
  }

  function setupSidenav() {
    $('#menuBtn').addEventListener('click', openSidenav);
    $('#sidenavOverlay').addEventListener('click', closeSidenav);
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') {
        closeSidenav();
      }
    });
  }

  // ============ 回到顶部 ============
  function setupBackToTop() {
    const btn = $('#backToTop');
    const update = function() {
      if (window.scrollY > 600) {
        btn.classList.add('visible');
      } else {
        btn.classList.remove('visible');
      }
    };
    window.addEventListener('scroll', update, { passive: true });
    btn.addEventListener('click', function() {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });
    update();
  }

  // ============ 阅读进度 ============
  function setupReadingProgress() {
    const bar = $('#readingProgress');
    const topBar = $('#topProgress');
    const update = function() {
      const docHeight = document.documentElement.scrollHeight - window.innerHeight;
      const scrolled = window.scrollY;
      const percent = docHeight > 0 ? Math.min(100, (scrolled / docHeight) * 100) : 0;
      bar.style.width = percent + '%';
      topBar.style.width = percent + '%';
    };
    window.addEventListener('scroll', update, { passive: true });
    window.addEventListener('resize', update);
    update();
  }

  // ============ 搜索 ============
  function setupSearch() {
    const input = $('#searchInput');
    const clearBtn = $('#searchClear');
    const empty = $('#tocEmpty');

    const filter = function() {
      const query = input.value.trim().toLowerCase();
      const links = $$('.sidenav__link');

      if (query) {
        clearBtn.classList.add('visible');
      } else {
        clearBtn.classList.remove('visible');
      }

      // 重置所有 hidden 状态
      links.forEach(function(link) {
        link.classList.remove('hidden');
      });

      if (!query) {
        // 恢复默认折叠状态
        $$('#tocList .sidenav__item.has-children').forEach(function(li) {
          const id = li.getAttribute('data-id');
          // 默认：level-1 展开，其它折叠；除非用户已展开
          let collapsed;
          if (TocState.isCollapsed(id)) {
            collapsed = true;
          } else if (localStorage.getItem('toc-collapsed-init-' + id) === 'expanded') {
            collapsed = false;
          } else {
            const level = parseInt(li.getAttribute('data-level'), 10);
            collapsed = level >= 2;
          }
          li.classList.toggle('collapsed', collapsed);
        });
        if (currentFilter === 'all') {
          empty.classList.remove('visible');
        } else {
          applyFilter();
        }
        return;
      }

      // 找到所有匹配的项，以及它们的祖先链
      const matchedLinks = [];
      links.forEach(function(link) {
        const text = link.getAttribute('data-text') || '';
        if (text.indexOf(query) >= 0) {
          matchedLinks.push(link);
        }
      });

      // 隐藏不匹配且不是匹配项祖先的节点
      const visibleItems = new Set();
      matchedLinks.forEach(function(link) {
        let li = link.parentElement;
        visibleItems.add(li);
        // 向上展开祖先链
        let node = li.parentElement;
        while (node && node.id !== 'tocList') {
          if (node.classList && node.classList.contains('sidenav__item')) {
            visibleItems.add(node);
            node.classList.remove('collapsed'); // 展开祖先
          }
          node = node.parentElement;
        }
        // 向下显示所有子孙（便于看完整结构）
        let descendants = li.querySelectorAll('.sidenav__item');
        descendants.forEach(function(d) {
          visibleItems.add(d);
          d.classList.remove('collapsed');
        });
      });

      // 隐藏不在 visibleItems 中的项
      $$('#tocList .sidenav__item').forEach(function(li) {
        if (!visibleItems.has(li)) {
          li.querySelector(':scope > .sidenav__link').classList.add('hidden');
        }
      });

      if (matchedLinks.length === 0) {
        empty.classList.add('visible');
      } else {
        empty.classList.remove('visible');
      }
    };

    input.addEventListener('input', debounce(filter, 100));
    clearBtn.addEventListener('click', function() {
      input.value = '';
      filter();
      input.focus();
    });
  }

  // ============ 顶部标题点击 ============
  function setupTopTitle() {
    $('#topTitle').addEventListener('click', function(e) {
      e.preventDefault();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });
  }

  // ============ 锚点平滑滚动 ============
  function setupAnchors() {
    document.addEventListener('click', function(e) {
      const link = e.target.closest('a[href^="#"]');
      if (!link) return;
      const href = link.getAttribute('href');
      if (!href || href === '#') return;
      const target = document.getElementById(href.slice(1));
      if (target) {
        e.preventDefault();
        target.scrollIntoView({ behavior: 'smooth', block: 'start' });
        history.replaceState(null, '', href);
      }
    });
  }

  // ============ 启动 ============
  function init() {
    ThemeManager.init();
    FontSizeManager.init();
    setupSidenav();
    setupBackToTop();
    setupReadingProgress();
    setupFilter();
    setupSearch();
    setupTopTitle();
    setupAnchors();
    renderMarkdown();
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>
