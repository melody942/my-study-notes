### 基础高频问答：从项目介绍到尖锐问题

以下回答可以直接作为面试准备稿，但要根据自己实际做过的细节调整。

#### 问题 1：为什么要做 Agent，而不是普通 RAG？

**参考回答：**

普通 RAG 更适合“根据知识库回答政策问题”，但这个项目还有个人化计算、缺字段追问、不同工具顺序和安全门禁。用户问“我什么时候退休”时，系统首先需要判断画像是否完整，然后调用确定性规则引擎；用户问“政策依据是什么”时，才需要召回官方来源；如果两者同时出现，还要把计算结果和 citation 组合起来。因此我使用 Agent 工作流处理任务分解和工具编排，RAG 只是其中一个工具。

**追问准备：**

如果只是一个固定流程，也可以用状态机。Agent 的价值主要体现在自然语言意图解析、混合请求识别和回答组织；高风险的执行顺序仍由服务端约束。

**深挖补充：**

这里的关键不是为了追求“Agent”这个名词，而是看一条请求是否需要根据当前状态选择不同动作。普通 RAG 的典型链路是 query → retrieve → generate；本项目至少存在四种不同任务：个人化测算、一般政策解释、个人化结果加政策依据、画像更新。它们的输入、允许工具和安全要求都不同。

最典型的反例是：用户问“上海最低缴费年限有没有官方依据”，即使 Memory 中已经有完整出生年月和缴费月份，也不应该因为画像完整就触发 `computePlan`；相反，用户问“我什么时候退休”时，只有 RAG 不能完成个人化计算。E2E 因此分别断言纯政策问题的 `forbiddenTools` 包含 `computePlan`，缺字段个人问题也禁止计算。

**面试逐字稿：**

> 我的结论是，这个项目需要 Agent，但不意味着所有事情都交给 LLM。普通 RAG 能解决“根据政策材料回答一般问题”，但社保退休咨询还有状态判断、缺字段追问、确定性计算、政策依据和回答安全校验。比如用户问“我什么时候退休”，系统要先确认出生年月、性别、累计缴费月份，女性还要确认退休身份，信息齐全后才能调用规则引擎；用户问“最低缴费年限有没有官方依据”，则应该走政策 RAG，不能因为画像完整就做无关的个人计算。
>
> 所以我把 RAG 作为工具链的一部分，把 Agent 用在意图识别、任务编排和结果组织上；高风险数字仍由规则引擎和服务端门禁负责。这个方案的取舍是，固定流程的部分确实可以用状态机实现，我当前也采用了服务端确定性计划来控制它；Agent 的增量主要体现在用户可以用自然语言表达混合问题，系统能识别当前任务需要哪些工具，并把结构化结果组织成可追溯回答。
>
> 我用反例验证这个边界：纯政策问题要求只检索、不计算；缺出生月份时必须追问，不能输出退休年月；混合问题才要求规则计算和官方 citation 同时存在。这样证明的不是“接了一个 RAG 就叫 Agent”，而是模型的语言灵活性被状态和工具契约约束住了。

#### 问题 2：请你从用户请求开始，讲一下完整链路。

**参考回答：**

请求进入 API Route 后，先做限流、消息长度校验和会话恢复，然后加载匿名 session 对应的用户画像。系统从用户历史消息中抽取显式 profile patch，和已有 Memory V2 合并，再压缩长上下文并提取摘要和工具事实。之后服务端构建 Execution Plan，判断本轮是个人化计算、政策解释还是混合请求。个人化请求先调用 assessRequiredInfo，ready 后调用 computePlan；政策问题调用 retrievePolicy；最后由模型组织答案，运行时校验回答是否有对应工具支撑，结束后保存会话和允许持久化的长期画像。

**深挖补充：**

我会把链路讲成“输入事实、计划状态、工具事实、回答提交、持久化”五个阶段，而不是只背一串组件名：

```text
请求边界
  → session/历史恢复与输入保护
  → 显式画像抽取和 Memory 合并
  → 上下文压缩，同时保留 summary、profile、tool facts
  → 服务端构建 Execution Plan
  → 按计划进入 assess / compute / retrieve / clarify
  → LLM 组织草稿
  → 根据 tool support 和 claim 做 Guardrail 校验
  → 持久化会话，并按来源白名单写长期画像
```

每一步都应该有可观测状态。比如 `assessRequiredInfo` 的 `ready` 和 `needs_more_info` 决定能不能计算；RAG 的 `ready`、`empty`、`disabled` 决定能不能引用；Guardrail 的 violation code 决定回答是否具备提交资格。真正排查问题时，我会从最终回答反向沿 trace 找到第一个不符合预期的不变量。

**面试逐字稿：**

> 用户请求进来后，我先把它当成一个有边界的任务处理，而不是直接拼 Prompt。入口会做消息长度、限流、session 和模型配置检查；然后从用户消息中抽取显式画像，与已有 Memory V2 合并。长对话达到阈值时，保留最近消息、会话摘要、结构化画像和工具事实，不简单保留最后几条。
>
> 接着服务端根据当前问题和画像状态构造 Execution Plan。个人化测算先做信息完整性和证据校验，ready 后才能计算；政策解释走 retrievePolicy；混合问题同时需要规则结果和官方 citation。模型只基于这些工具结果组织答案，结束时根据工具状态、计划要求和回答中的 claim 做校验，最后只把用户显式确认的画像字段写入长期记忆。
>
> 我实际遇到过的排查例子是缺出生月份。最终回答虽然有退休年份，但从 trace 看用户原文没有月份、工具参数却出现 1 月，于是我没有把问题归因到规则算法，而是修了 evidence gate 和 Memory 隔离。这个例子说明完整链路的价值在于每一层都有状态和证据可以回放。

#### 问题 3：你的 Plan-and-Execute 具体怎么实现？

**参考回答：**

计划由 intent、status、是否需要 computePlan、是否需要 retrievePolicy、是否需要官方 citation、缺失字段和 steps 组成。比如个人化问题会先生成 assess_required_info，再根据结果选择 compute_plan 或 ask_clarification；纯政策问题只生成 retrieve_policy 和 answer；同时要求个人计算和政策出处时则生成 mixed 计划。当前版本由服务端确定性构建计划，LLM 根据注入的计划和工具描述执行，工具内部还有二次校验。

**必须承认：**

当前不是 LLM 自主生成任意 JSON 计划，而是服务端根据意图和画像状态生成结构化计划。这样牺牲了部分灵活性，但能保证高风险流程可控。

**深挖补充：**

Plan-and-Execute 在这里不是简单地让模型先写一段计划文本，而是把计划变成运行时协议。计划字段至少要能回答：当前 intent 是什么、现在处于什么 status、需要哪些工具、缺哪些字段、步骤之间有什么前置关系、哪些工具禁止调用、最终回答需要什么证据。当前实现中 `buildExecutionPlan` 由服务端根据最新用户表达和画像状态确定性生成，模型通过 Agent Runtime 执行工具，工具事件再回写实际状态。

需要特别区分“计划生成正确”和“计划执行正确”。我见过的代表性失败是计划已经包含 `assess_required_info`，但实际工具序列直接出现 `computePlan`。因此评测不仅检查 `stepKinds`，还检查 `toolSequence`、`requiredTools`、`forbiddenTools` 和工具输出状态。

**面试逐字稿：**

> 我的 Plan-and-Execute 实现分两层。第一层是服务端根据意图和画像状态构造结构化 Execution Plan，例如个人化问题生成 assess、compute、answer；纯政策问题生成 retrieve、answer；同时要求个人化结果和官方依据时生成 mixed 计划。第二层是 Agent Runtime 按计划提供上下文、调用工具并记录事件。
>
> 计划不是一段给模型看的说明，而是后续评测和安全校验的依据。比如计划要求 `requiresComputePlan=true`，但缺字段时 status 应该是 `needs_more_info`，这时 `computePlan` 必须属于 forbidden tool；如果是官方依据问题，则要检查 retrievePolicy 是否命中官方质量 citation。
>
> 当前版本计划主要由服务端确定性生成，我不会把它说成 LLM 自主生成任意 JSON 计划。这样牺牲了开放式规划能力，但换来了高风险流程的稳定性。未来如果让模型提出候选计划，我也会先用 schema、工具白名单和前置条件把它编译成服务端可执行计划。

#### 问题 4：为什么不让 LLM 自己生成计划？

**参考回答：**

因为社保数字属于高风险输出，计划中的一个错误就可能导致跳过信息校验或使用错误工具。当前我优先选择确定性计划生成，把可控性放在第一位。更进一步的方案是让 LLM 生成候选计划，但必须经过 Zod schema、工具白名单、前置条件和策略引擎验证，不能让模型生成的计划直接执行。

**深挖补充：**

我做这个取舍不是因为 LLM 永远不能规划，而是因为本项目的任务空间虽然自然语言多样，但高风险分支相对有限，且错误代价不对称。把“个人计算”和“官方依据”漏掉一次，影响的是答案完整性；把缺字段时错误放行一次，影响的是个人化政策数字的可信性。因此先用确定性计划把高风险路径收窄，再让模型负责理解和表达，是更符合当前场景的工程选择。

如果让 LLM 直接生成计划，至少还要解决四类问题：计划 schema 合法但语义不合法；模型遗漏前置步骤；模型给工具传入无证据字段；计划与当前政策版本或用户画像状态不一致。候选计划必须经过服务端编译，检查 intent、step dependency、risk level、allowed tools、required evidence 和最大步数，不能直接执行。

**面试逐字稿：**

> 我没有一开始就让 LLM 自己生成计划，主要是风险收益不对称。当前社保场景的高风险动作是可枚举的：信息不完整就追问，信息完整才计算，要求官方依据才检索官方来源。服务端确定性生成这些步骤，可以保证不同模型、不同温度下门禁一致；LLM 仍然参与自然语言意图理解、工具结果解释和答案组织。
>
> 这不是否定模型规划，而是把模型规划放在候选层。后续可以让 LLM 提出计划，再经过 schema、前置条件、工具白名单、政策版本和用户证据校验，最终由服务端编译成可执行状态机。我的原则是：模型可以建议下一步，但不能单独授予高风险工具执行权限。

#### 问题 5：如何强制个人化计算前先收集完整信息？

**参考回答：**

有三道约束。第一，Execution Plan 把 assessRequiredInfo 作为 required step。第二，computePlan 工具内部再次执行 assessRequiredInfo，ready=false 时返回 needs_more_info，不计算确定数字。第三，回答结束后 Guardrail 根据 toolSequence 和 outputStatus 检查回答中是否出现没有工具依据的政策数字。这样即使模型跳过了第一道约束，后面仍有兜底。

**深挖补充：**

最小必要信息不是“schema 中有哪些字段”，而是“哪些字段会改变规则分支或结果数字”。当前个人化测算至少要确认出生年份、出生月份、性别、累计缴费月份；女性还要确认退休身份。每个字段都要同时满足格式和来源要求。缺字段不是异常，而是一个正常的业务状态：计划转为 `needs_more_info`，只生成针对缺失字段的追问。

这里有一个容易忽略的漏洞：如果只在模型调用前做一次 assessment，模型仍可能在后续工具调用中自己补齐字段。因此 `computePlan` 内部必须二次校验；如果只在回答结束时拦截，又可能已经产生错误工具事实或污染记忆。三道门分别保护执行前、执行中和输出后。

**验证与取舍：**

E2E 会检查缺出生月份、缺缴费月份、女性缺退休身份、完整画像和多轮补充。关键安全用例要求零 `computePlan`，完整画像用例则要求能正常计算，防止把系统做成“凡是涉及政策数字都拒答”。代价是首次交互可能多一轮，但这是用少量交互成本换取个人化结果的证据完整性。

**面试逐字稿：**

> 我不是通过 Prompt 口头要求模型先问，而是把“信息是否足够”变成一个有状态的工具结果。assessment 要检查两件事：字段值是否合法，以及字段是否有用户证据或已确认记忆。缺出生月份时返回 `needs_more_info`，并只追问出生月份；女性缺退休身份时只追问身份，不自行选择工人或干部。
>
> 然后我在 `computePlan` 内部再做一次校验，防止模型跳过前置步骤或传入看起来完整的默认值。最后 Guardrail 检查最终回答中的个人化数字是否有 ready 的计算结果。评测上，我同时验证缺字段时的计划状态、禁止工具、回答禁用 claim 和记忆持久化，完整画像再验证正常计算，确保安全约束和可用性都成立。

#### 问题 6：只做 Zod schema 校验不够吗？

**参考回答：**

不够。Zod 只能校验类型和范围，例如 birthMonth 是 1 到 12，但不能判断这个月份是不是用户说过的。模型可能在调用工具时补一个 1 月，schema 会认为它合法。因此我在 assessRequiredInfo 中同时检查当前用户文本和已确认画像，把“字段合法”和“字段有用户证据”分开处理。

**为什么这不是细节问题：**

schema 的问题在于它描述的是数据形状，不是事实来源。`birthMonth=1`、`paidMonths=0`、`femaleRetireType="worker"` 都可能通过类型校验，但它们分别代表用户没有提供的月份、没有提供的缴费历史和没有确认的身份分支。对于普通推荐场景，这种默认值可能只是体验问题；对于政策计算，它会直接改变结论。

我在排查时把同一字段拆成三列：`value`、`source`、`status`。只有 `value` 合法且 `source` 是用户消息或确认过的 Memory、`status` 不是 `inferred/conflicted/stale`，才允许进入确定性计算。这个分层也解释了为什么不能简单把字段都设为 required：required 只会要求模型提供值，却不会保证值真实。

**面试逐字稿：**

> Zod 对我来说是第一层契约，但不是业务可信性的证明。它能告诉我 birthMonth 是不是 1 到 12 的整数，却不能告诉我这个 1 月是否在用户消息里出现过。项目的真实 Bad Case 就是模型传了合法的 1 月和 0 个月，schema 和规则引擎都没有报错。
>
> 所以我在信息闸门里增加 evidence 检查，把字段值、来源和状态分开。用户明确说过的值可以作为 confirmed fact；模型推断只能作为候选；冲突或过期字段不能参与计算。修复后，评测不仅检查 schema 通过，还检查缺字段状态、工具序列和长期记忆是否被污染。我的结论是：schema 保证“能不能解析”，evidence gate 保证“有没有资格相信”。

#### 问题 7：模型把出生月份补成 1 月怎么办？

**参考回答：**

当前消息和长期画像都没有月份证据时，assessment 会把 birthMonth 标记为 missing。即使 computePlan 收到模型传入的月份，它内部也会再次评估，不满足证据条件就返回 needs_more_info。长期记忆层也排除了 compute_plan 来源，避免模型补的 1 月污染后续会话。

**完整排查口径：**

我会先确认当前消息和历史用户消息是否真的提到月份；再看显式抽取是否产生 `birthMonth`；再看 Memory 中是否存在来源为 `user_message`、状态为 `confirmed` 的月份；最后才看工具参数。如果工具参数有 1 月，但前三层都没有证据，就必须把它视为模型推断，而不是用户输入。

修复后不是简单地把 1 月改成 `null`，而是让系统返回可解释状态：`missingFields=[birthMonth, paidMonths]`，问题类型为 `needs_more_info`，回答追问缺失信息。这样用户补充“3 月、已缴 170 个月”后，系统才会在下一轮重新抽取、合并和执行计划。

**验证与边界：**

回归包括显式“1 月”、只说“1977 年”、模型注入“1 月”、用户第二轮补“3 月”、用户先说 3 月后纠正为 4 月。前两类应保留用户证据，注入类应拒绝，补充类应恢复计算，纠正类应使旧派生结果失效。当前完整的自动派生失效传播仍可进一步工程化，但错误默认值不会作为确认画像使用。

**面试逐字稿：**

> 我不会在模型传入 1 月后直接接受，也不会简单把它当成普通参数。我的排查顺序是先查用户原文，再查 profile extract，再查 Memory fact 的来源，最后查工具入参。只有前面有证据，工具参数才有资格参与计算。
>
> 如果没有证据，assessment 返回缺少出生月份和缴费月份，`computePlan` 内部也会拒绝执行，最终只追问，不输出个人化数字。用户下一轮明确补充月份后，系统重新合并画像再计算。这个修复同时解决了当轮错误和跨会话污染两个问题。

#### 问题 8：规则引擎为什么不直接写在 Prompt 里？

**参考回答：**

Prompt 中的规则容易受模型理解、上下文长度和版本混淆影响，也难做单元测试。规则引擎可以把每条规则独立测试，输出 trace，并且把规则集和参数版本固化。模型只负责解释结果，不负责做最终算术和条件判断。

**具体风险和 Bad Case：**

如果把“出生年月 → 延迟月份”“退休年份 → 最低缴费月份”“requiredMonths - paidMonths”直接写在 Prompt 里，模型可能在不同轮次使用不同的边界解释；即使正常样例答对，也很难证明它在政策切换月、女性身份分支和缺口为负数时仍然一致。更严重的是，RAG 文档发生版本变化后，Prompt 中残留的旧数字可能和当前 citation 冲突。

规则引擎也不是天然正确。我仍然要测试它的输入完整性、边界月份、政策版本和独立参考结果。当前项目的规则结果返回 `trace`、`ruleSet`、`paramsId` 和 `versionContext`，这样能区分“引擎执行稳定”和“规则编码本身正确”这两个问题。

**面试逐字稿：**

> 我把模型定位成理解和表达层，把政策数字的确定性计算放到规则引擎。原因不是简单地说模型会幻觉，而是政策计算包含多个结构化条件和时间边界，需要可重复、可单测、可版本化和可审计。Prompt 中写规则，模型每次都在重新解释；规则引擎则可以固定输入、输出和 trace。
>
> 但我不会因此声称规则引擎一定正确。项目中我也会用边界样例和独立政策口径验证规则本身，尤其主动说明当前延迟退休实现仍是参数化月级近似，不能包装成完全复现官方逐月表。这样 RAG 负责政策依据，规则负责个人化执行，两者各自有责任边界。

#### 问题 9：规则引擎的结构是什么？

**参考回答：**

输入是用户画像和可选的政策版本参数。dsl-loader 解析规则包和参数包，orchestrator 初始化 EngineState，executor 依次执行 DSL rule，builtins 负责标准化性别、女性身份推断、退休年龄映射、日期计算和缴费缺口计算，最终输出 result、trace、ruleSet、paramsId 和 versionContext。这样规则、参数、执行过程和结果可以分开审计。

**按执行过程拆开：**

1. 先校验画像是否具备出生年、月、性别、缴费月份等输入。
2. 标准化性别和女性退休身份，不能在这里默默选择未经确认的分支。
3. 根据规则集解析基础退休年龄和政策版本。
4. 根据出生年月和政策起始时间计算当前实现的退休年龄月份。
5. 计算预计退休年月，并处理月份进位。
6. 根据退休年份查最低缴费月份 schedule。
7. 计算 `missingMonths=max(requiredMonths-paidMonths,0)`。
8. 输出结果、规则 trace 和版本上下文。

**为什么不是普通后端函数：**

普通函数往往只返回一个数字；这里的执行器还要保存规则步骤、参数版本、输入快照和状态。当政策参数从 180 个月切换到逐年增加的 schedule 时，历史回答必须能说明使用了哪个 `paramsId`，否则同一个用户今天重算可能得到不同数字，却无法解释差异来自政策更新还是代码修改。

**面试逐字稿：**

> 我的规则引擎不是一个把所有逻辑写在函数里的黑盒。输入先经过完整性和身份标准化，再由 orchestrator 按规则步骤驱动 executor，builtins 负责日期、退休年龄和缴费缺口等确定性动作；规则和参数分离，最后返回 result、trace、ruleSet、paramsId 和 versionContext。
>
> 这样排查时可以回答两个问题：第一，这次计算执行了哪些规则；第二，它使用的是哪一版政策参数。遇到边界错误时，我可以定位到是身份映射、日期进位、schedule 查表还是参数版本，而不是只看到一个错误数字。当前延迟退休公式仍需进一步对齐官方逐月表，所以我会把“执行可追溯”和“政策编码已完全正确”分开说明。

#### 问题 10：女性退休年龄如何处理？

**参考回答：**

先识别性别。如果是女性，再根据用户明确提供的 femaleRetireType 或 employmentType 推断 worker、cadre、flexible。不同类型映射到不同的退休年龄 key。如果女性身份无法得到可信结论，信息闸门要求继续追问，而不是选择一个默认口径。

**深挖补充：**

女性身份不是一个展示字段，而是规则分支字段。它会影响基础退休年龄、延迟节奏和适用政策，因此不能因为用户说了“女性”就默认成女工人或女干部。`employmentType` 也不是无限可信：用户说“我在单位上班”并不能自动证明属于干部或管理技术岗位；“灵活就业”可以支持部分口径，但仍要结合业务定义和地区政策确认。

**代表性 Bad Case：**

```text
用户：我是 1975 年 3 月出生的女性，已经缴了 180 个月，帮我算什么时候退休。
错误行为：系统默认 femaleRetireType=worker，直接输出一个退休年月。
正确行为：追问退休身份，或分别解释不同身份对应的政策口径，但不把其中一类套到用户身上。
```

排查时我会看 profile patch 是否只有 `gender=female`，Memory 是否有已确认的 `femaleRetireType`，以及 Plan 的 `missingFields` 是否包含该字段。若没有身份证据但 `computePlan` 返回 ready，就是身份证据闸门失效，而不是单纯的年龄公式问题。

**面试逐字稿：**

> 女性退休年龄的处理重点是不能把身份分支当成默认值。我的系统先确认性别；如果是女性，再检查用户有没有明确提供退休身份，或者有没有足够明确的 employmentType 证据。不同身份会进入不同的规则 key，所以“女性”本身不足以支持一个确定的个人退休结果。
>
> 例如用户只说“我是女性，1975 年出生，缴费 180 个月”，我不会默认她是工人或干部，而是追问管理技术岗位、生产操作岗位或灵活就业等信息。如果用户只想了解一般政策，可以分别解释几种口径，但不能把其中一种伪装成针对她个人的结论。评测会检查缺身份时 `missingFields` 正确、禁止 `computePlan`，补齐身份后才允许计算。

#### 问题 11：你的延迟退休计算是否完全精确复现了政策逐月表？

**参考回答：**

当前实现是一个参数化的月级近似计算：builtins.ts 中按出生年月与政策起始时间计算月份差，并使用 Math.floor(monthsSinceStart / 3) 推导延迟月份。项目政策文档描述的不同群体节奏可能是每 4 个月延迟 1 个月或每 2 个月延迟 1 个月，因此当前公式不能声称完全等价于官方逐月表。生产版本应该把官方逐月对照表或完整分段规则编码进 policy bundle，并增加边界月份的回归测试。

**这是必须主动说明的风险点。**

**为什么这是核心边界：**

“参数化”只说明实现可重复，不说明政策编码已经完全正确。最容易出错的地方包括政策起始月前后、每个延迟阶段的切换月、不同身份的延迟节奏、退休月份进位，以及出生年月恰好落在分界线上的情况。典型年份通过，不能证明边界正确。

我会把当前实现定位为“框架和近似计算已完成，官方逐月对照仍需校准”。如果面试官追问为什么不直接说精确，我会说明：规则引擎可以稳定执行一套参数，但如果输入参数和官方逐月表没有逐项对齐，稳定地算错比随机报错更危险。

**验证方法：**

- 准备独立的官方逐月表或人工核验样例，不能用同一份实现生成 ground truth；
- 覆盖政策起始月前后、阶段切换月、最大延迟月和不同女性身份；
- 比较规则输出的退休年龄月数和退休年月，而不是只比较年份；
- 检查最低缴费 schedule 使用的是退休年份还是出生年份；
- 规则或参数版本变化时，重新运行全部边界用例。

**面试逐字稿：**

> 当前实现不能声称完全复现官方逐月表。它是参数化的月级近似：先根据出生年月和政策起始时间计算月份差，再按当前参数推导延迟月份。这个实现可以验证规则引擎的执行框架、版本管理和 trace，但不同人群的官方节奏、政策切换月和边界月份还需要逐项对照。
>
> 我会主动把这个风险说出来，因为“公式能运行”和“政策完全正确”是两个命题。真正生产化时，我会把官方逐月对照表或完整分段 DSL 放入版本化 policy bundle，并用独立参考表覆盖分界月份、身份分支和月份进位。上线前如果边界没有通过，我会把结果标成待核验估算，不能包装成正式政策结论。

#### 问题 12：最低缴费年限怎么计算？

**参考回答：**

规则引擎先根据个人出生年月计算预计退休年份，再用 resolveRequiredPaidMonthsByYear 根据 schedule 查退休年份对应的最低缴费月份。如果退休年份早于 schedule 起始年，使用 beforeStartMonths；之后按 incrementMonthsPerYear 增长，并限制在 maxMonths；最后用 requiredMonths 减去 paidMonths，取不小于 0 的值作为 missingMonths。

**深挖补充：**

这里有两个容易被忽略的依赖：最低缴费要求依赖“预计退休年份”，而预计退休年份又依赖出生年月、性别和退休身份；因此不能先拿当前年份的 180 个月固定套用。第二，缴费缺口只在 `paidMonths` 有用户证据时才有资格计算，不能把缺失值默认为 0。

**代表性边界问题：**

如果退休年份正好落在 schedule 起始年、递增节点或最大值节点，常见错误是多加一年、少加一年，或者将 `requiredMonths` 和 `missingMonths` 混淆。排查时我会看 rule trace 中的 `retirementYear`、命中的 schedule 分支、`requiredMonths`、`paidMonths` 和 `missingMonths`，而不是只看最终一句“还差多少个月”。

**面试逐字稿：**

> 最低缴费不是一个永远固定的 180 个月。我的计算顺序是先根据画像和规则得到预计退休年份，再用该年份查询最低缴费 schedule；退休年份在 schedule 起始年之前用 beforeStartMonths，之后按增量计算并限制最大值，最后用最低要求减去用户已经明确提供的缴费月份，缺口不小于 0。
>
> 我会特别防两个问题：第一，缺 `paidMonths` 时不能默认 0，否则会输出虚假的缺口；第二，schedule 边界要测起始年、递增切换年和最大值年。规则结果中保留 trace 和参数版本，评测既验证数字，也验证命中了正确的年份分支。

#### 问题 13：RAG 的文档是怎么准备的？

**参考回答：**

我先用 manifest 统一管理文档元数据，包括 sourceId、标题、地区、类别、来源类型、生效日期、URL、发布机关和版本。然后清理 frontmatter，按政策章节和语义边界切块，为每个 chunk 保存 chunkId、ordinal、keywords 和 locator，再生成 embedding 写入数据库。这样召回时不仅返回内容，还可以追踪到具体文件和片段。

**深挖补充：**

文档准备最容易被忽略的是“切块不能只按字符数”。政策条件、例外、适用人群、办理材料和生效时间如果被拆到不同 chunk，向量相似度可能仍然很高，但模型拿到的片段不足以支撑结论。我的做法是优先按标题和语义章节切块，同时保留 `ordinal`、`locator`、关键词和来源元数据，必要时在检索结果中通过相邻 chunk 补全上下文。

当前数据集也要如实区分来源：共有 26 篇政策文档，其中 21 篇标为 official_policy、official_notice 或 official_faq，5 篇是 derived_summary 或 demo_summary。不能把整个数据集笼统说成“全部官方原文”。

**验证方法和 Bad Case：**

我会构造“条件在上一段、例外在下一段”的文档样例，检查 Top-K 是否同时返回必要片段；检查每条 citation 是否能回到 sourceId、chunkId 和 locator；检查失效日期、地区和来源类型能否被过滤。若回答只引用了包含数字的 chunk，却没有包含适用条件的 chunk，即使数字命中，也应视为证据不完整。

**面试逐字稿：**

> RAG 的质量从文档加工就开始了，不是只换一个 embedding 模型。我先用 manifest 管理 sourceId、地区、政策类别、来源类型、生效时间、URL、发布机关和版本；再清理文档并按章节和语义边界切块，保存 chunkId、顺序、关键词和定位信息。这样召回结果不仅有文本，还能追溯到具体来源和版本。
>
> 切块时我重点防条件和例外被拆散。例如一段写“适用于某类人员”，下一段写“但不适用于某情形”，如果只按固定长度切块，模型可能只看到前半段。验证上我会用条件、例外、地区和时间组合的 query 检查 citation 是否覆盖完整证据。当前数据集包含官方和演示摘要两类来源，我会在回答中区分，不能把摘要冒充官方原文。

#### 问题 14：为什么用 hybrid retrieval？

**参考回答：**

政策问题同时需要精确词命中和语义泛化。lexical 对“4050”“15 年”“240 个月”等精确词更稳定，vector 对“我还要交多久”这类表达更有帮助。所以我分别召回两路候选，用 RRF 融合，再做 rerank，并对官方来源加权和按 sourceId 做多样性控制。

**一个具体的排序 Bad Case：**

用户问“上海最低缴费年限一般是多少”，如果只做向量检索，语义相近的 4050 补贴、灵活就业或养老金申请材料可能进入候选；如果只做 lexical，用户问“我还要交多久”时未必命中“最低缴费年限”。另一个问题是同一个政策文件的多个相似 chunk 可能占满 Top-K，真正包含适用条件的另一份官方文件被挤掉。

我排查时会保留 lexical 候选、vector 候选、RRF 排名、rerank 分数、source boost 和 sourceId 分布，确定正确 source 在哪一步丢失。这样能区分 query 词法问题、embedding 问题、融合权重问题、rerank 问题和多样性问题。

**面试逐字稿：**

> 我用 hybrid retrieval 是因为政策问题同时有精确术语和口语表达。像“4050”“15 年”“240 个月”需要 lexical 的精确命中；“我还要交多久”更依赖语义召回。两路候选分别保留，再用 RRF 融合，之后根据文本相关性、类别、官方来源和时效 rerank，并限制同一 sourceId 的 chunk 数量。
>
> 我不把 hybrid 当成天然正确。真实排查要看正确 source 是在 lexical 阶段没召回，还是被 vector 候选挤掉，或者在 rerank 后丢失。评测会比较 lexical、vector、hybrid 和 rerank 的 Recall@3，同时检查同源 chunk 是否霸榜。这个方案增加了延迟和调参成本，但比单路检索更适合政策中的数字、别名和口语混合表达。

#### 问题 15：官方来源是如何优先的？

**参考回答：**

一方面，requireOfficial=true 时在元数据层只保留 official_policy、official_notice 和 official_faq；另一方面，混合排序时对官方来源增加 source boost。citation 中还会保存 sourceType、sourceUrl、issuingAuthority、sourceVersion 和生效日期。最终 Guardrail 会检查回答声称“官方依据”时是否确实有官方质量 citation。

**必须区分“官方”和“适用”：**

官方来源优先不等于官方来源一定适合当前问题。官方文件可能属于其他地区、历史版本、不同身份，或者只描述政策原则而没有支撑回答中的具体数字。因此我把官方优先拆成三层：元数据过滤保证来源类型，版本/地区/有效期保证适用范围，claim-evidence 检查保证正文真正支持回答。

**代表性 Bad Case：**

```text
召回结果：official_notice，但 effectiveTo 已过期
模型回答：根据当前官方规定，最低缴费年限为……
```

这条不能直接通过。若用户问历史时点可以引用，但必须说明适用年份；如果问当前政策，应优先当前有效版本，无法确认时安全降级。类似地，只有 `derived_summary` 的结果不能支持“官方文件规定”这句话。

**面试逐字稿：**

> 我不是简单给官方来源加一个分，而是根据用户是否要求官方依据改变检索策略。`requireOfficial=true` 时优先过滤官方政策、通知和 FAQ，同时检查地区、有效期和版本；citation 里保留 sourceType、URL、发布机关和生效时间。回答如果出现“官方依据”“原文规定”，Guardrail 还要检查是否真的有官方质量的 citation。
>
> 但我会主动说明，官方来源优先不等于官方来源一定正确或一定适用。一个过期的官方文件、其他地区的官方文件，不能直接支撑当前用户结论；一个官方文件只讲总体政策，也不一定支撑具体个人数字。评测中我会加入摘要冒充官方、过期官方、跨地区官方和两个官方来源冲突的 case。

#### 问题 16：Recall@3 是怎么定义的？

**参考回答：**

当前实现不是 chunk-level，而是 source-level。每个 query 有 expected relevantSourceIds，取 Top-3 citation 中命中的相关 sourceId 并去重，再除以该 query 的相关 sourceId 数量，最后对所有 query 做宏平均。因此它衡量的是 Top-3 中召回了多少个相关政策来源，而不是召回了多少个文本 chunk。

**用一个例子说明分母：**

如果某个 query 的人工标注相关来源是 `{A, B}`，Top-3 返回 `{A, C, A}`，去重后命中 `{A}`，这一条 query 的 source-level Recall@3 是 `1/2`，不是 `2/3`，也不是因为 A 出现两次就算两次。若所有 query 的相关来源数量不同，最后对 query 做宏平均，避免相关来源较多的 query 把结果完全主导。

**这个指标能说明什么、不能说明什么：**

它能说明 Top-3 是否把标注的相关政策来源召回，不能说明 chunk 内容足够、citation 真正支持 claim、模型是否正确使用了工具，也不能说明最终回答准确率。一个 query 可能召回了正确 source，但只拿到介绍性片段，没有拿到例外条件，回答仍然可能错误。

**面试逐字稿：**

> 我们的 Recall@3 是 source-level，不是 chunk-level。每条 query 先有人工标注的 `expected relevantSourceIds`，取 Top-3 citation 中命中的 sourceId 并去重，再除以这条 query 的相关 source 数量，最后对所有 query 做宏平均。比如相关来源是 A、B，Top-3 返回 A、C、A，只命中 A，所以是 1/2。
>
> 这个指标只评价召回层，不能直接说政策答案准确率是 94%。为了防止指标被误解，我还要单独评估官方来源命中、citation 完整性和 claim 是否被正文支持。面试官如果只问一个数字，我会先说清相关性单位、Top-K、分母和不覆盖的层次。

#### 问题 17：官方来源命中率 98% 是怎么定义的？

**参考回答：**

它是 query-level 指标：如果某个 query 的 Top-K citation 中至少有一条 sourceType 属于 official_policy、official_notice 或 official_faq，则该 query 命中，否则未命中，最后按 query 平均。它和 Recall@3 的分母、粒度不同，不能把两个数字混在一起解释。

**为什么要单独统计：**

Recall@3 关注“相关来源召回了多少”，官方命中率关注“至少有没有一条可归类为官方质量的来源”。二者可能出现不同组合：Top-3 里有官方来源但不是最相关内容，官方命中率算成功，Recall 仍可能偏低；或者相关来源被召回但都是摘要，Recall 可能不低，官方命中率却失败。

此外，官方命中也不是 claim 支持率。只要 Top-K 里出现一条官方来源就算 query-level 命中，但它可能只支持政策背景，不能支持回答中的具体数字。因此我会把它作为来源质量的粗指标，再增加 citation entailment 或人工核验。

**面试逐字稿：**

> 官方来源命中率是 query-level 指标：一条 query 的 Top-K 里，只要至少有一条 sourceType 是 official_policy、official_notice 或 official_faq，就算命中，最后按 query 平均。它的分母是一条条 query，不是 chunk，也不是所有返回结果。
>
> 我会主动说明这个指标比较宽松：它证明“检索结果里有官方来源”，不证明这条官方来源一定适用，也不证明它支撑了最终回答。比如一个官方来源只讲政策背景，回答却输出具体退休月份，仍然需要规则结果或更细 citation 支撑。所以 98% 不能包装成回答准确率。

#### 问题 18：94% 和 98% 可以复现吗？

**参考回答：**

需要在有 DATABASE_URL、政策数据和 embedding/API 配置的环境中运行 benchmark。当前本地运行 pnpm benchmark:rag 时真实数据库/API 无法连接，50 条用例没有得到 ready 结果，因此我不会把这次运行说成复现成功。简历中的数字应注明测试集、Top-K、source-level/query-level 口径和实验环境。

**完整复现流程：**

我会先冻结 query 集、人工标注的 relevant source、文档和索引版本、embedding 模型、Top-K、过滤条件、RRF/rerank 配置，再运行文档加载和索引健康检查。之后分开跑 lexical、vector、hybrid 和 rerank，输出每条 query 的候选、Top-K sourceId、官方类型和失败原因，最后聚合 Recall@3 和官方命中率。

复现失败时不能只说“环境没配好”。要区分：数据库连接失败、embedding 服务失败、索引为空、metadata 过滤把正确来源过滤掉、Top-K 排序错误，还是指标脚本本身没有拿到 ready 结果。当前本地环境真实数据库/API 不可用，50 条用例没有得到 ready 结果，因此我只能准确地说历史 benchmark 曾有 94%/98% 这组指标，不能说当前环境已复现成功。

**指标口径的面试逐字稿：**

> 这两个数字可以复现，但前提是实验环境和口径一致。我要冻结测试集、标注来源、政策文档和 index version、embedding 配置、Top-K、过滤和排序参数，然后先做索引健康检查，再分阶段跑 lexical、vector、hybrid 和 rerank，保存每条 query 的 sourceId、sourceType 和失败状态，最后按 source-level Recall@3 和 query-level official hit rate 聚合。
>
> 我会主动区分历史结果和当前复现结果。当前本地运行时真实数据库/API 不可用，50 条用例没有得到 ready 结果，所以不能把这次运行说成成功复现。简历里的 94% 和 98% 必须注明数据集、Top-K、分母和环境；它们是召回层指标，不等于最终回答准确率，也不等于线上用户满意度。

#### 问题 19：你的 Memory V2 解决了什么问题？

**参考回答：**

它把画像字段存成带来源、置信度、状态和冲突记录的事实。user_message 表示用户显式说过，compute_plan 表示规则计算中的派生快照，conflicted 和 stale 的事实不能直接用于计算。长期记忆只保留白名单和确认过的用户信息，工具结果保留在会话上下文中，避免模型推断和派生结果污染用户画像。

**为什么普通 profile 不够：**

如果 profile 只是 `{birthYear: 1977, birthMonth: 1}`，系统无法回答“1 月是谁说的”“这个值有没有被用户纠正”“这个值是否已经过期”“它能不能用于当前计算”。Memory V2 把 fact 设计成带来源和生命周期的事实对象，至少记录 path、value、source、observedAt、confidence、status 和 conflicts。

**代表性 Bad Case：**

一次计算为了完成工具调用产生了 `birthMonth=1`，规则结果里又出现 `estimatedRetireYear`、`requiredMonths` 等派生字段。如果这些字段全部写入长期记忆，下一轮模型就会把它们当成用户画像或当前事实。修复后，`projectProfileWithoutMemory` 只投影来源和状态满足条件的用户事实，compute_plan 派生结果留在当前上下文的 tool facts 中。

**面试逐字稿：**

> Memory V2 解决的不是“让模型记得更多”，而是让系统知道记住的东西是什么性质。普通 JSON 只能保存值，不能区分用户明确说过、模型推断、规则派生和发生冲突的事实。我的 Memory fact 会记录来源、置信度和状态，只有用户确认且未冲突的白名单字段才能投影为下一次计算画像。
>
> 这个设计直接来自一个 Bad Case：模型补的 1 月和 0 个月如果写进长期记忆，后续会话就会把它们当成真实信息。因此我把 compute_plan 和 inferred 来源隔离出来，工具事实仍可服务当前会话，但不能自动升级为用户事实。评测会检查派生字段不进入持久化画像，用户显式字段可以跨会话恢复。

#### 问题 20：记忆冲突如何处理？

**参考回答：**

同一路径出现不同值时不静默覆盖。系统会比较来源优先级、确认状态和置信度；如果新值不能安全替换旧值，就保留原 fact 并记录 conflicts，必要时将状态标记为 conflicted。冲突字段不参与确定性计算，最终向用户追问确认。

**具体场景：**

用户第一轮说“我是 1977 年出生”，系统保存 confirmed；后面又说“前面说错了，我是 1978 年”。这不是普通的 key-value update，因为出生年份会影响退休年月和最低缴费年份。处理顺序应该是：保存新旧事实和更正来源，标记旧的计算结果 stale，重新评估必要字段，再决定是否重新计算。

如果用户只是说“好像是 1978 年”，则新值只能是 inferred，不能覆盖 1977 的 confirmed；如果用户明确说“前面说错了”，可以记录为显式更正，但仍要让下游结果失效并重新计算。这里的来源优先级不是简单的“最新值永远覆盖旧值”。

**排查与边界：**

我会检查 Memory facts、conflicts、profile projection、旧 tool fact 的 input fingerprint 和新 Plan 是否重新构建。当前实现已经能做来源隔离、冲突标记和计算时重新读取画像，但完整的事实依赖图和派生结果自动失效传播仍是生产化增强点，面试时不说成已经全部完成。

**面试逐字稿：**

> 记忆冲突我不会静默覆盖。比如用户先确认 1977 年，后面明确说前面说错了，是 1978 年。我会保留旧事实和新事实的来源，记录更正事件，把基于 1977 年的退休结果标记为 stale，然后重新确认出生月份、性别和缴费月份，再按新画像计算。
>
> 如果只是“不太确定是 1977 还是 1978”，新值应该是 inferred，不能覆盖 confirmed。评测会检查冲突状态、旧派生结果是否失效、回答是否混用新旧结果。当前已经实现 fact 隔离和冲突标记，但完整的依赖图失效传播还可以继续做，所以我会把它作为边界和下一步说明。

#### 问题 21：上下文压缩如何避免丢事实？

**参考回答：**

压缩不是简单截断。系统保留最近消息，同时生成 conversationSummary，并从工具消息中提取 toolFacts；结构化 userProfile 单独注入模型上下文。压缩结果还带 originalMessageCount、droppedMessageCount 和 compressed 状态，便于观察压缩是否发生以及后续定位问题。

**真实问题和排查：**

我用多轮闲聊把消息数推过阈值后，发现简单保留最后 N 条会丢掉早期出生月份；另一类问题是摘要记住了“之前算过退休”，却没有保留计算所用的政策版本和缴费月份。后续用户说“按刚才的结果继续”，模型只能从自然语言摘要猜，可能重复追问，也可能沿用已经过期的结果。

所以压缩后我要分别检查四份状态：最近消息是否连续，summary 是否覆盖历史主题，`userProfile` 是否保留已确认字段，`toolFacts` 是否保留结果、输入摘要和版本。如果关键字段只存在于 summary 而不在结构化画像中，不能把它当成计算证据。

**验证与取舍：**

长上下文 E2E 会构造 28 轮闲聊，之后补齐画像并询问退休；断言压缩发生、画像字段仍在、工具事实可用、计算不重复追问。摘要和 tool facts 会增加少量上下文，但比单纯提高上下文窗口更容易控制成本和事实来源。

**面试逐字稿：**

> 我没有把压缩理解成“截掉旧消息”。最近消息、摘要、结构化画像和工具事实解决的是四个不同问题：最近消息保证对话连续性，摘要保留主题，画像保存用户确认事实，工具事实保存当前会话可复用的计算或 citation。
>
> 我遇到过简单截断导致出生月份丢失、系统重复追问的反例，也遇到过摘要说“刚才算过”但没有保存政策版本的风险。现在压缩后会记录统计信息，并把 profile 和 tool facts 独立注入；如果只剩模糊摘要，没有可验证的工具事实，就不能直接复用旧数字，而要重新校验或重算。

#### 问题 22：Guardrail 是在什么时机执行的？

**参考回答：**

模型生成草稿后，在 onFinish 中根据回答文本和 runtimeToolSupport 执行校验，记录 validation_started 和 validation_passed 或 validation_failed。它会判断政策数字、个人化数字和官方声明是否有对应工具支持。当前版本是后置校验和记录，尚未把违规结果完全接入流式阻断或自动修复。

**为什么放在这个时机：**

模型草稿生成后，工具事件、规则结果、citation 和计划状态已经齐全，适合做一次跨模块一致性检查。例如回答出现个人退休年月时，要同时看 `hasReadyComputePlan`、计算输入证据和结果字段；回答出现“官方依据”时，要看 `hasOfficialRetrievePolicy` 和 citation 元数据。只在工具调用结束时校验还看不到最终 claim，只在文本层校验又看不到工具事实。

**当前实现与生产目标：**

当前 Guardrail 主要在完成回调中做后置检查、记录 violation code 和评测结果，并不是完整的流式阻断。生产上我会采用 draft-then-commit：先生成结构化草稿和 claims，服务端做证据校验，通过后才提交文本；失败则走安全模板或受控重试。

**面试逐字稿：**

> Guardrail 放在回答草稿之后，是因为这时既有最终文本，也有完整的 runtimeToolSupport、规则结果、citation 和 Execution Plan，可以做跨层一致性判断。个人数字要对应 ready 的 computePlan，政策数字要有检索证据，官方声明要有官方质量来源。
>
> 当前实现主要是后置校验和违规观测，能识别失败但还没有完整实现流式文本撤回、自动重试和安全模板替换。我会如实说明这一点。下一步会改成 draft-then-commit，把高风险回答在提交前完成 claim-evidence 校验，避免文本已经流出去才发现违规。

#### 问题 23：如果 Guardrail 发现违规，系统会不会把回答拦住？

**参考回答：**

当前实现主要能识别和记录违规，评测也能验证违规场景被检测出来；但由于文本是流式发送的，当前代码没有完整实现“发现违规后撤回已发送文本、自动重试并返回修复答案”的闭环。更准确的说法是“实现了回答支撑校验和违规观测”，而不是“完全阻断”。

**一个具体的漏检风险：**

如果缺出生月份时模型直接在草稿中写“你预计 2039 年退休”，后置 Guardrail 可以识别“没有 ready computePlan”；但如果模型先流式发送了这句话，校验发生在结束回调，用户已经看到了部分错误内容。另一个风险是文本中使用含糊表达或拆开的数字，简单正则可能漏掉；反过来，政策解释中的一般数字也可能被误判为个人化数字。

因此当前结果要分成 `detected` 和 `blocked` 两个概念：评测能证明系统发现了违规，不等于线上已经阻断。验证时要统计 false positive 和 false negative，并用带工具支撑和不带工具支撑的成对样例校准。

**面试逐字稿：**

> 当前 Guardrail 发现违规后，主要会记录 validation_failed 和 violationCodes，评测可以断言它识别到了问题，但还不能把它说成完整拦截。因为流式输出的提交时机在校验之前，已发送文本没有完整撤回和自动修复闭环。
>
> 具体来说，缺字段时输出个人退休年份、只有摘要却声称官方依据、只有 retrievePolicy 却输出个人缴费缺口，都是我会纳入评测的违规样例。生产化我会先生成草稿，再做 claim-evidence 校验，通过后才提交；失败则返回安全追问或降级说明。这样能把“发现问题”升级为“阻止问题到达用户”。

#### 问题 24：如果向量服务不可用怎么办？

**参考回答：**

retrievePolicy 会尝试 embedding；如果不可用，则标记 embedding_unavailable 和 lexical_fallback，降级为 lexical 检索。混合检索失败时再尝试 legacy 检索。如果数据库本身不可用，返回 disabled 和 reason，不生成虚假的 citation。结果中有 degraded 字段，调用方可以决定是否降级回答或提示用户。

**故障注入和后果：**

我会分别注入 embedding 超时、数据库连接失败和索引为空。三者不能都返回同一个空数组：embedding 失败可能还能 lexical fallback；数据库不可用意味着没有可靠检索证据；索引为空则可能是部署或索引构建问题。若这些状态被吞掉，模型就可能把“没有检索到”误认为“没有相关政策”，或者在没有 citation 时自行声称官方依据。

评测中我会检查 `retrieval.status`、`degraded`、`reason`、candidateCount、citation sourceType 和回答表述。只有 lexical fallback 得到可用结果时，才允许作为降级检索回答；`disabled` 时不能伪造来源，应该说明当前无法验证，并建议用户查询官方渠道或稍后重试。

**面试逐字稿：**

> 我把外部依赖失败当成业务状态，而不是只当异常日志。embedding 不可用时可以降级到 lexical，并标记 degraded；混合检索失败可以尝试 legacy；数据库本身不可用就返回 disabled 和 reason。`empty` 表示依赖正常但没有相关结果，`disabled` 表示系统没有能力完成检索，这两者对回答策略不同。
>
> 最重要的是不能在 disabled 或没有官方 citation 时编造“官方依据”。我做故障注入时不仅检查接口是否返回，还检查回答是否诚实表达降级、citation 是否为空、Guardrail 是否阻止高承诺 claim。这个方案的取舍是依赖异常时回答能力会下降，但不会用一个看似完整的假来源换取表面可用性。

#### 问题 25：如何保证工具调用幂等和成本可控？

**参考回答：**

每个工具输入做稳定序列化，生成 inputHash；同一轮使用 Map 缓存相同 toolName 和 inputHash 的 Promise，避免重复计算和重复检索。Agent 设置最大 stepCount，温度较低，工具事件记录 cache_hit，便于分析重复调用和成本。

**深挖补充：**

幂等和成本控制要分别回答“同一输入是否得到同一结果”和“同一轮是否被重复执行”。规则计算本身是确定性的，可以用稳定序列化后的输入哈希做同轮 Promise 去重；RAG 还要把 query、过滤条件、版本和 Top-K 纳入 key，否则换了地区或政策版本却错误复用旧 citation。工具事件记录 started、cache_hit、succeeded、failed 和 outputStatus，便于识别模型重复调用。

**代表性问题：**

模型对“最低缴费年限”连续调用三次 retrievePolicy，三次 query 只有细微变化。如果只看最终答案，可能没有明显错误，但延迟、token 和外部检索成本都会增加。排查时按 `toolName + inputHash` 聚合调用，区分完全相同的重复和 query 改写后的近重复；前者可以直接去重，后者需要判断是否真正改变了检索条件。

**面试逐字稿：**

> 我会从三层控制成本：工具输入稳定序列化并生成 inputHash，同一轮相同工具和相同输入复用 Promise；Agent 设置最大 stepCount，防止循环；trace 记录 cache hit、重复调用、token、延迟和失败状态。对 RAG，缓存 key 还要包含地区、类别、官方要求、有效时间和 index version，不能只用 query 文本。
>
> 我遇到过模型对同一政策问题连续检索的评测场景。修复时没有简单禁止所有第二次调用，因为工具失败后受控重试可能是合理的；而是区分同输入重复、参数改变的重试和降级路径，并给每类设置上限。这样既控制成本，也不牺牲必要的恢复能力。

#### 问题 26：如何证明 Agent 不是“看起来能跑”？

**参考回答：**

我把评测拆成多层。规则测试验证计算；Agent eval 验证记忆、信息闸门、计划和 Guardrail；E2E eval 验证完整工具链和禁止工具；RAG eval 验证召回和 citation；build 和 lint 验证工程可交付性。尤其是 E2E 不只检查最终文本，还检查 requiredTools、forbiddenTools、计算状态、召回状态和 Guardrail 结果。

**为什么要这么拆：**

如果只看最终回答，会出现三种假通过：答案碰巧正确但没有调用规则工具；工具调用了但输入使用了模型补的默认值；citation 命中了但正文不支持回答中的具体 claim。反过来，如果只看工具路径，也可能得到一个流程正确但用户无法理解、没有回答问题的文本。因此我把质量拆成规则、状态、工具、证据、回答和持久化六层。

**一个完整判定例子：**

缺出生月份的 case 要同时满足 `planStatus=needs_more_info`、`missingFields` 包含 `birthMonth`、`forbiddenTools` 包含且实际没有 `computePlan`、回答不含确定退休数字、Memory 不保存模型推断字段；完整画像 case 则要反过来要求 `computePlan.status=ready`，结果与规则断言一致。RAG case 还要单独判断 source-level Recall、官方来源和 claim 支撑。

**面试逐字稿：**

> 我不把“29/29、6/6、10/10”直接等同于系统可靠。规则测试只能证明当前输入输出符合预期，确定性 Agent eval 能证明计划、记忆和 Guardrail 的不变量，真实 E2E 才能看到模型在真实工具链上的波动，RAG benchmark 只评价召回层。
>
> 真实 E2E 的 case 会定义任务、必要字段、期望 Plan、required/forbidden tools、规则或 citation 约束、回答 claim 约束和持久化约束。最终文本不是唯一标准答案，而是拆成可验证的 claim。这样既能发现“碰巧答对”，也能发现“结果正确但记忆污染”这类文本看不出来的问题。

#### 问题 27：如果重新设计，你会优先改什么？

**参考回答：**

第一，把渐进式延迟退休从近似公式升级为官方逐月映射表或完整分段 DSL；第二，把后置 Guardrail 接入安全阻断、重试和 fallback answer；第三，让 LLM 只生成候选计划，由服务端状态机编译执行；第四，补齐真实数据库环境下的 benchmark 和人工标注数据；第五，增加隐私脱敏、用户授权、审计日志和 P95 延迟监控。

**为什么按这个顺序：**

我会先处理可能直接改变个人化数字的规则精度和证据边界，再处理输出提交安全，然后才扩展模型规划能力。原因是：如果底层数字和字段证据不稳定，增加更多自治能力只会放大错误；如果 Guardrail 仍是后置观测，复杂计划带来的错误也可能已经流出。

具体优先级是：

1. 用官方逐月表或完整分段规则校准延迟退休，补齐边界回归。
2. 把 Plan 编译为状态机和动态工具权限，缺字段时不暴露计算工具。
3. 用 draft-then-commit 和 claim-evidence 校验替代单纯后置记录。
4. 把真实 E2E、RAG benchmark、人工标注和线上回流连接成发布门禁。
5. 最后补隐私授权、并发一致性、P95 延迟和成本优化。

**面试逐字稿：**

> 如果重新设计，我不会先追求更多工具或更复杂的多 Agent，而是按风险优先级改。第一，延迟退休个人化数字直接影响用户决策，所以先用官方逐月表校准规则并覆盖边界；第二，把计划编译为状态机，让缺字段时计算工具根本不可调用；第三，把 Guardrail 从后置检查升级为提交前的草稿校验和安全降级；第四，把真实 E2E、RAG benchmark 和人工标注接成发布门禁；最后再做性能、成本、隐私和并发治理。
>
> 这样每一步都能对应一个已经观察到的问题，而不是为了增加技术名词。当前系统已经有核心链路和真实 E2E，但这些改动会把它从“可验证的实验系统”进一步推向“可受控的生产系统”。

---

### A 类：Agent 原理与架构边界

#### 问题 1：为什么这个项目需要 Agent？如果流程已经比较固定，为什么不用普通工作流或状态机？

**考察点：**

这道题不是问你会不会说“Agent 可以调用工具”，而是在问你是否能区分 Agent、工作流、状态机和普通 RAG 的边界。

**面试逐字稿：**

> 这个问题我一开始也认真权衡过。单看社保退休测算，它确实可以被写成一个固定状态机：先收集字段，再校验字段，然后计算，最后回答；如果只做这条链路，纯状态机甚至比 Agent 更稳定。
>
> 但真实用户的问题不是固定格式的。用户可能问个人退休时间，也可能问政策依据，也可能把个人测算和官方出处放在同一个问题里，还可能在一轮里补充画像、纠正之前的信息，或者从一个政策问题跳到另一个政策问题。这里需要模型理解自然语言、识别任务组合，并决定需要哪些信息和哪些证据。
>
> 所以我的选择不是让 LLM 接管整个流程，而是做混合架构：把语言理解和答案组织交给模型，把高风险的状态转移和计算约束交给服务端。比如个人化问题必须先经过信息完整性评估，只有 ready 之后才能进入规则计算；需要官方出处时，回答必须有官方质量的 citation。这个部分更像一个受策略约束的 Agent。
>
> 换句话说，Agent 的价值在于处理输入和任务的不确定性，状态机的价值在于保证高风险执行的确定性。我的项目是让两者组合，而不是把二者对立起来。

**面试官可能追问：那你这个项目中哪些部分真正由 Agent 决策？**

**继续回答：**

> 当前版本中，服务端会先根据用户意图和画像状态生成结构化 Execution Plan，这个计划本身采用确定性逻辑，主要是为了保证高风险场景的稳定。模型在计划约束下负责选择和调用工具、理解工具结果、处理自然语言表达，并生成最终回答。
>
> 因此我不会把它描述成“模型可以自主生成任意计划并自由执行”。更准确的表述是：我实现了一个带有结构化计划和工具执行约束的 Agent Runtime，计划生成当前以服务端控制为主，模型负责在约束范围内完成语言和工具协作。

**这个问题的高分点：**

- 不把 Agent 等同于 ReAct。
- 承认固定流程适合状态机。
- 能说明为什么需要模型，也能说明为什么不能让模型全权负责。
- 不夸大“自主规划”。

---

#### 问题 2：你如何定义这个 Agent 的状态？如果没有清晰状态，Agent 会出现什么问题？

**考察点：**

考察你是否真正理解 Agent 是状态转换系统，而不是一段 Prompt 加几个函数。

**面试逐字稿：**

> 我把一轮对话的状态拆成几类，而不是把所有内容混成一个字符串。
>
> 第一类是用户显式事实，比如出生年份、出生月份、性别、累计缴费月份和女性退休身份。这些事实可以进入结构化用户画像，但必须带来源和状态。
>
> 第二类是当前任务状态，包括本轮识别出的 intent、Execution Plan 的 status、缺失字段、是否需要规则计算、是否需要政策检索以及是否要求官方 citation。
>
> 第三类是工具事实，比如信息校验结果是 ready 还是 needs_more_info，规则引擎返回的预计退休年月、缴费缺口和版本上下文，以及 RAG 返回的 citation。这些事实可以支撑当前回答，但不一定应该写入长期用户画像。
>
> 第四类是对话上下文，包括最近消息、会话摘要和工具事实摘要。它用于帮助模型理解当前对话，但不等同于长期记忆。
>
> 第五类是执行和观测状态，比如已经调用了哪些工具、工具是否失败、是否命中缓存、当前是否已经有 ready 的计算结果，以及最终回答有没有通过支撑校验。
>
> 如果不区分这些状态，就会出现几类典型问题：把模型猜测当成用户事实，把计算结果当成用户画像，把旧政策 citation 当成当前政策，把工具失败当成工具没有返回结果，或者在上下文压缩后丢掉关键状态。
>
> 所以我认为 Agent 的核心不是“多轮对话”，而是能够在每一轮中明确知道：当前任务是什么、已有事实是什么、哪些事实可信、下一步允许做什么，以及什么条件满足后才能结束。

**追问：你会不会把模型的思维链也放到状态里？**

**继续回答：**

> 不会把模型的隐式思维链作为业务状态保存。业务状态应该是可验证、可复现的结构化信息，例如计划步骤、工具输入输出、版本上下文和校验结果。模型内部的推理过程既不应该作为长期记忆，也不应该成为审计事实。
>
> 如果需要解释结果，我会依赖规则 trace、citation 和工作流事件，而不是保存一段不可稳定复现的自然语言思维链。

---

#### 问题 3：Plan-and-Execute 和 ReAct 有什么区别？你的方案为什么选择前者？

**面试逐字稿：**

> ReAct 更强调模型边观察边行动：模型先想一步、调用一个工具、观察结果，再决定下一步。这种方式灵活，适合开放式探索，但在高风险业务中容易出现工具顺序不稳定、重复调用、绕过前置校验或者在信息不足时过早生成结论。
>
> Plan-and-Execute 则是先形成一个任务层面的执行计划，再按照计划执行。它的优点是可观测性和可控性更好：我可以在请求开始时知道它是个人化测算、政策解释还是混合任务，也可以明确本轮是否必须先做信息校验、是否需要官方来源。
>
> 我的项目采用的是一种受约束的 Plan-and-Execute：计划描述业务步骤，不描述模型的内部思考。例如个人化测算的计划是 assess_required_info、compute_plan、answer；纯政策问题是 retrieve_policy、answer；混合问题需要计算和官方检索。
>
> 但我也不会说当前版本已经是完全动态的计划执行系统。当前计划主要由服务端确定性生成，工具内部有二次校验，模型根据计划和工具契约执行。真正更完整的版本应该支持观察工具结果后重新规划，例如检索结果为空时决定改写 query、切换检索模式或降级为谨慎回答。
>
> 我选择 Plan-and-Execute 的核心原因是：对于政策咨询，先明确任务和约束，再执行工具，比让模型边走边猜更容易做安全校验和失败恢复。

**追问：计划是否会导致系统僵化？**

**继续回答：**

> 会，这是它的代价。计划太固定，会影响对新问题和混合问题的适应性；计划太开放，又会牺牲可控性。
>
> 我的处理方式是把计划分成稳定的业务骨架和可变化的参数。稳定骨架包括信息闸门、规则计算、政策检索和回答校验；变化部分包括用户意图、政策类别、地区、有效时间和是否要求官方来源。
>
> 后续如果需要更灵活，可以让模型生成候选计划，但不能直接执行。服务端需要做 schema 校验、步骤白名单校验、前置条件校验和风险策略裁剪，最后把候选计划编译成可执行状态机。这样既保留模型的灵活性，又不让模型绕过高风险约束。

---

#### 问题 4：你说“生成结构化 Execution Plan”，一个合格的 Plan 至少应该包含什么？

**面试逐字稿：**

> 一个合格的执行计划不能只是工具名称列表。至少需要包含五类信息。
>
> 第一是任务意图，例如个人化测算、政策解释、混合咨询、画像更新或一般问答。
>
> 第二是任务状态，例如 ready、needs_more_info 或 no_tool_required。状态决定后续是否可以继续执行。
>
> 第三是能力需求，包括是否需要规则计算、是否需要政策检索、是否需要官方 citation。
>
> 第四是步骤和步骤原因。比如 assess_required_info 的原因是个人化测算必须先确认最小必要信息；ask_clarification 的原因是当前信息不足，不能输出确定性个人数字。
>
> 第五是缺失字段和计划创建时间。缺失字段用于生成具体追问，时间和版本信息有助于审计。
>
> 从 Agent 原理上讲，我还会给每个步骤定义前置条件和后置条件。比如 compute_plan 的前置条件是信息评估结果为 ready，后置条件是返回一个带 status、结果字段、规则 trace 和版本上下文的结构化结果。retrieve_policy 的后置条件是返回 ready、empty 或 disabled 状态，并说明是否降级和为什么。
>
> 这样计划才是一个可执行契约，而不是给模型看的提示词。

**追问：为什么不把模型的每一步思考都放进 Plan？**

**继续回答：**

> 因为计划应该描述业务动作和可验证约束，而不是暴露或固化模型的内部推理。把“先分析用户可能是某种人，再猜测某个政策”写进计划，不仅难以验证，也容易把推断变成事实。
>
> 我更关注计划的可执行性：需要什么输入、允许调用什么工具、工具返回什么状态、什么情况下必须停止或追问。解释性通过 trace、citation 和事件日志实现，而不是通过保存隐式思维过程实现。

---

#### 问题 5：如果 Execution Plan 本身判断错了怎么办？

**面试逐字稿：**

> 我会把这个问题分成三层处理。
>
> 第一层是计划生成的保守策略。个人化测算的漏判和误判成本不同：如果把个人化问题误判成一般问答，可能输出没有计算支撑的数字；如果把一般问题误判成需要个人信息，主要是多问了一轮。因此在高风险关键词和不确定表达下，我会优先选择需要校验或需要检索的路径，而不是直接回答。
>
> 第二层是工具前置条件。即使计划误判为可以计算，computePlan 内部也要再次评估必要字段；即使计划没有标记官方要求，回答中出现“官方规定”“政策原文”等表述时，回答校验也应该检查是否有官方 citation。
>
> 第三层是运行时重新规划。理想情况下，工具返回 needs_more_info、empty、disabled 或 degraded 时，Agent 不应该继续沿着原计划盲目生成答案，而应该转移到追问、改写查询、降级回答或明确无法确认的状态。
>
> 当前版本已经有第一层和第二层，运行时动态重新规划还不完整。当前更准确的说法是：计划负责提前约束，工具负责二次门禁，后置校验负责发现不一致；下一步是把失败状态纳入显式状态机，支持真正的 replan 和安全终止。

**追问：为什么不把所有错误都交给 LLM 自己处理？**

**继续回答：**

> 因为错误恢复本身也有风险。比如 RAG 返回空结果时，模型可能为了完成任务而凭经验补充政策数字；规则引擎返回 needs_more_info 时，模型可能自行猜一个出生月份。
>
> 所以恢复动作应该由错误类型决定：缺字段只能追问；官方来源不足只能降低表述强度或明确无法确认；数据库不可用可以切换检索模式，但不能把没有证据的结果说成官方政策；工具超时可以重试有限次数，但不能无限循环。模型可以负责把恢复结果说得自然，但恢复策略不能完全由模型自由决定。

---

#### 问题 6：你的 Agent 中，哪些事情应该交给 LLM，哪些事情绝对不能交给 LLM？

**面试逐字稿：**

> 我会按三种事实和三类动作来划分。
>
> 第一类是用户原始事实，例如用户说自己 1977 年出生、3 月出生、是男性、累计缴费 220 个月。这些可以由 LLM 从自然语言中抽取，但抽取结果需要 schema 校验，并且要回到用户消息或已确认画像中验证来源。
>
> 第二类是外部政策事实，例如最低缴费年限、延迟退休政策文本、4050 补贴办事条件。这些应该由 RAG 返回 citation，模型只负责基于证据解释。
>
> 第三类是派生计算事实，例如预计退休年月、缴费缺口和适用退休年龄。这些应该由规则引擎计算，模型不能凭语言推理直接生成。
>
> LLM 适合做的是自然语言理解、意图归类、参数抽取、工具选择、结果解释和追问组织。绝对不能单独决定的是政策算术、版本适用、用户没有提供的关键字段、官方来源真实性和冲突事实的最终裁决。
>
> 我希望形成的责任边界是：模型处理不确定的语言，规则处理确定的计算，检索处理外部证据，策略层处理允许和禁止的动作。

**追问：如果模型的推理结果和规则引擎结果冲突，你信谁？**

**继续回答：**

> 对已经定义在规则引擎中的个人化数字，我信规则引擎，并把模型生成的数字视为没有支撑的文本。回答应该基于规则引擎结果重写或降级，而不是让模型和规则结果投票。
>
> 对政策解释，如果模型概括和 citation 原文冲突，我信当前有效且符合地区、时间条件的政策来源；如果来源之间冲突，就不能简单选择语言上更像的那条，而应该进入政策版本冲突处理，展示适用条件或明确需要人工确认。

---

#### 问题 7：为什么不让 LLM 直接调用 computePlan？既然工具是确定性的，模型传入什么参数不都一样吗？

**面试逐字稿：**

> 工具确定性并不代表工具输入可信。computePlan 可以保证给定输入的计算是确定的，但不能保证输入中的出生月份、缴费月份和女性身份一定来自用户。
>
> 例如用户只说“我是 1977 年男性”，模型为了满足工具 schema 传入 birthMonth=1、paidMonths=0。对工具来说这些值类型合法，但对业务来说没有证据。若直接计算，就会把模型补全的值当成用户事实。
>
> 所以我在工具链中区分“字段合法性”和“字段证据性”。字段合法性检查类型、范围和格式；证据性检查当前消息或已确认画像是否支持这个值。信息评估不通过时，computePlan 应该返回 needs_more_info，而不是输出正式的个人化数字。
>
> 这也是为什么工具必须有业务前置条件，而不能只依赖模型的调用顺序。模型可以提出调用动作，但服务端要判断这次调用是否被允许。

**面试官可能继续问：那模型传入一个错误但格式合法的值怎么办？**

**继续回答：**

> 仅靠系统无法判断所有语义错误，所以需要把风险分层。对于可以从用户文本核对的字段，例如年份、月份和性别，可以做文本证据校验；对于用户明确说“我不确定”的字段，应该记录为 uncertain 或 needs_confirmation，而不是 confirmed；对于无法自动核实的就业身份，应该追问用户确认。
>
> 如果业务允许，还可以在回答前把关键画像复述给用户确认，例如“我将按 1977 年 3 月出生、男性、累计缴费 220 个月进行估算，是否正确”。这属于高风险场景的显式确认机制。

---

### B 类：工具编排、规则执行与失败恢复

#### 问题 8：你的工具之间是什么关系？它们是并列工具，还是有依赖图？

**面试逐字稿：**

> 它们不是完全并列的。个人化计算链路有明确依赖：画像抽取或加载之后，先做必要信息评估；只有评估 ready，才能计算；计算结果出来后，模型才能组织个人化数字。
>
> 政策检索的依赖相对独立，但如果用户要求“我的退休结果以及官方依据”，检索和计算共享同一份用户问题和政策上下文。计算和检索在某些情况下可以并行，但不能牺牲前置条件。例如个人化计算必须先确认画像，政策检索可以在确认问题类别后执行。
>
> 我会把工具关系分成三种：
>
> - 强依赖：computePlan 依赖 assessRequiredInfo 的 ready 结果。
> - 条件依赖：retrievePolicy 是否要求官方来源，取决于用户意图和回答目标。
> - 独立任务：画像更新和一般性政策解释在某些场景可以分别完成。
>
> 如果以后把执行器做得更严格，可以把计划编译成依赖图，节点包含 precondition、execute 和 postcondition。这样不是由模型临时决定“下一个工具是什么”，而是由执行器根据状态决定允许的动作集合。

**追问：混合问题中，计算和 RAG 应该串行还是并行？**

**继续回答：**

> 要看依赖。若 RAG 查询只依赖用户原始问题和固定地区，可以和信息评估并行；但如果查询需要计算得到的退休年份、适用女性身份或政策 effectiveAt，就必须在计算或身份确认之后检索。
>
> 我的默认策略是先保证信息闸门，再决定是否并行。高风险链路优先保证正确性，只有在输入和检索条件稳定后再做并行优化。并行的目标是降低延迟，不应该改变工具的前置条件。

---

#### 问题 9：如果工具失败，Agent 应该如何区分“重试”“降级”“追问”和“停止”？

**面试逐字稿：**

> 我会先定义错误分类，而不是所有错误都重试。
>
> 第一类是可重试的瞬时错误，例如网络抖动、embedding 请求超时或数据库连接暂时失败。这类错误可以有限次数重试，并且需要退避和总时限。
>
> 第二类是可降级错误，例如向量检索不可用但 lexical 检索可用，可以把 retrieval mode 降级为 lexical，并在结果中记录 degraded；如果 hybrid 失败，可以尝试 legacy。降级后要降低回答的确定性，尤其不能继续声称“已完整检索官方依据”。
>
> 第三类是需要追问的业务错误，例如出生月份缺失、女性退休身份不明确、用户说的信息互相冲突。这类错误不能重试，因为重试不会产生新事实，只能向用户追问。
>
> 第四类是不可安全恢复的错误，例如数据库和政策来源都不可用，但用户要求具体政策数字。这时应该停止生成确定性答案，返回无法确认并提供查询官方渠道的建议。
>
> 第五类是模型或工具契约错误，例如参数格式不对、工具返回字段缺失或状态非法。应该记录错误并终止当前分支，避免模型依据不完整结果继续回答。
>
> 当前项目已经有检索降级和 needs_more_info 这类状态，也有工具失败记录；但真正完整的自动重试、replan 和安全 fallback 还可以继续增强。我会把这说成已实现的降级基础，而不是完整的故障自愈系统。

**追问：为什么不能在所有工具失败后直接让模型给一个大概答案？**

**继续回答：**

> 因为“大概答案”在政策场景里可能被用户理解为正式结论。尤其是退休年月和缴费缺口，少一个字段就可能改变结果；官方来源不可用时，模型的参数记忆也可能过期。
>
> 更合理的做法是区分输出类型：可以继续给一般性解释，但不能给无证据的个人化数字；可以说明查询方向，但不能伪造官方 citation；可以给估算，也必须明确估算依据、缺失条件和不确定性。

---

#### 问题 10：你如何防止 Agent 工具循环、重复调用和成本失控？

**面试逐字稿：**

> 我会从四个层面控制。
>
> 第一是执行步数上限，避免模型在检索、改写 query 和重复计算之间无限循环。
>
> 第二是工具幂等和缓存。相同工具、相同输入可以通过稳定序列化生成输入标识，同一轮复用已有 Promise 或结果，避免重复调用。
>
> 第三是工具序列观测。记录工具开始、成功、失败、缓存命中和输出状态。如果连续出现相同工具和相同输入，或者工具序列违反计划依赖，就应该触发循环检测或终止。
>
> 第四是按工具设置预算。规则计算通常是本地确定性执行，预算可以很低；外部 RAG 和 embedding 有网络成本，应设置超时、候选数和重试次数；模型本身也要设置最大步数和 token 预算。
>
> 但缓存不能只按 query 字符串做。政策检索还需要考虑地区、类别、effectiveAt、requireOfficial 和检索模式；规则计算需要考虑画像和 policy version。否则会出现不同政策版本之间错误复用结果。
>
> 所以我理解的成本控制不是简单地“少调用几次模型”，而是为每个动作定义输入边界、幂等键、时限、重试和退出条件。

---

#### 问题 11：规则引擎和普通的后端计算函数有什么本质区别？

**面试逐字稿：**

> 如果规则数量很少，普通函数当然可以完成计算。但政策系统的特点是规则会变化、条件会组合、结果需要解释和审计，所以我把计算进一步抽象成规则包、参数包、内置函数和执行 trace。
>
> 普通函数通常只返回一个结果；规则引擎除了结果，还能说明哪些规则命中了、哪些条件没有满足、使用了哪个 ruleSet 和 params version。政策更新时，可以新增参数版本或规则版本，而不是把数字散落在 Prompt 和业务逻辑里。
>
> 另外，规则引擎能够对缺字段进行正式建模。它不是“算不出来就返回 null”，而是可以返回 needs_more_info、missing fields、warnings、suggestions 和 caveats。这些状态可以被 Agent 理解和展示。
>
> 它的代价是开发成本更高，需要规则 DSL、执行器、版本管理和测试体系。因此我不会为了所有业务都上规则引擎，而是在退休年龄、最低缴费年限和缴费缺口这类高风险、可形式化的部分使用它。

**追问：规则引擎是否会把政策编码错误？**

**继续回答：**

> 会，所以规则引擎不能自动等于正确。它解决的是执行一致性和可审计性，不解决政策源头理解错误。
>
> 我会把政策编码过程拆成政策解释、参数建模、边界样例、规则实现和人工复核。尤其对退休年龄这种有出生年月边界的政策，不能只测几个典型年份，要做表驱动的边界测试，并把最终结果和官方逐月表对照。
>
> 当前项目的延迟退休公式仍是参数化近似，不能声称完全复现官方逐月表。这个边界本身也说明了：规则引擎需要被政策版本和验证数据约束。

---

#### 问题 12：政策规则变化时，你如何保证历史结果可解释？

**面试逐字稿：**

> 我会把“当前查询”和“历史结果”分开处理。
>
> 当前查询需要根据查询时间、政策生效时间和用户指定的 effectiveAt 选择适用的规则集和参数集。历史计算结果则需要保存使用的 ruleSetId、paramsId、paramsVersion 和 versionContext，而不是只保存一个最终数字。
>
> 这样当政策更新后，系统可以做到两件事：默认用新版本重新计算当前结果；如果用户查看历史结果，则仍然可以说明当时使用的是哪个政策版本，必要时进行可重复回放。
>
> 如果新旧政策之间存在过渡期，还要把 effectiveFrom 和 effectiveTo 建模为一等条件，不能简单按“当前最新版本”覆盖所有结果。
>
> 面试时我会强调：版本化不仅是数据库字段，而是计算输入的一部分。没有版本上下文，退休年月和缴费缺口即使算对了，也很难审计。

---

### C 类：记忆、上下文与可信事实

#### 问题 13：你说“长期结构化记忆”，为什么不直接保存完整聊天记录？

**面试逐字稿：**

> 完整聊天记录适合做会话回放，但不适合作为长期画像。因为聊天记录里同时包含用户事实、模型推断、工具参数、工具派生结果、政策文本和临时上下文。
>
> 如果把整段聊天历史直接作为长期记忆，下一次模型可能把“模型当时猜测的出生月份”理解成用户事实，也可能把某一次政策计算结果当成永久属性。随着对话增加，检索和 Prompt 成本也会变高。
>
> 所以我把两件事分开：会话记录用于恢复对话和审计；长期记忆只保存可复用的、经过来源和状态标记的用户事实。每个 fact 带 path、value、source、confidence 和 status，必要时保留冲突记录。
>
> 这样后续计算拿到的是结构化画像，而不是让模型从几十轮对话中重新猜一次用户信息。

**追问：为什么工具结果不直接写入长期记忆？**

**继续回答：**

> 因为工具结果往往是派生事实。比如 computePlan 返回“预计 2038 年退休”，它依赖当前政策版本、当前出生信息和当前缴费情况；它不是用户的永久属性。政策更新或用户补充信息后，这个结果可能变化。
>
> 工具结果应该保留在当前会话事实、计划记录或审计日志里。如果要跨会话复用，也应该作为带版本和输入依赖的可重新计算结果保存，而不是当作用户确认字段写回画像。

---

#### 问题 14：记忆中的一个字段什么时候算“可信”？

**面试逐字稿：**

> 我不会只用一个布尔值表示可信，而是至少考虑来源、状态、置信度和冲突。
>
> 用户明确说过的字段通常是高优先级来源，但如果用户在同一轮说“我记得可能是 1977 年”，这类表达也不应该直接标记为 confirmed，可以标记为 uncertain 或 inferred，必要时要求确认。
>
> 模型根据上下文推断出来的字段不能和用户显式字段同级；工具传入的字段也不能因为 schema 合法就被当成用户确认。computePlan 产生的退休年月属于派生事实，更不能反投影成用户画像。
>
> 如果同一路径存在多个冲突值，我不会简单选择最新值。要比较来源优先级、确认状态和置信度；如果无法安全裁决，就把字段标记为 conflicted，让它暂时不参与确定性计算，并向用户追问。
>
> 因此，可信记忆的本质不是“存得久”，而是知道这个值从哪里来、是否被确认、是否冲突、是否仍然有效。

**追问：置信度是模型自己给的吗？**

**继续回答：**

> 不能完全依赖模型自由填写。置信度可以由来源和规则映射得到。例如用户明确陈述并通过格式校验，可以使用较高的默认置信度；模型推断则低一些；工具派生结果不进入同一类用户事实置信度体系。
>
> 如果允许模型提供置信度，也只能作为一个输入，最终还要经过来源类型和业务规则裁剪，不能让模型通过填写 0.99 把猜测升级为事实。

---

#### 问题 15：如果用户前后两次说了不同的出生年份，你具体怎么回答？

**面试逐字稿：**

> 我不会直接使用最新值覆盖旧值，也不会在没有说明的情况下继续计算。
>
> 系统会保留两个 fact 的来源和观察时间，并把 birthYear 标记为 conflicted，或者保留一个已确认值、把另一个作为冲突候选。因为出生年份会影响退休年龄、退休时间和政策适用区间，不能把这种冲突当成普通文本差异。
>
> 面向用户时，我会说：“我记录到您之前提供的是 1977 年，这一轮又提到 1978 年。由于出生年份会影响退休年月和政策适用，请您确认最终按哪一年计算。”确认之后，再将新的值升级为 confirmed，并重新执行信息评估和计算。
>
> 这比静默覆盖更安全，也比完全拒绝更友好。系统不是不允许修改，而是要求高影响字段修改时显式确认。

---

#### 问题 16：长上下文压缩后，如何证明摘要没有改变事实？

**面试逐字稿：**

> 摘要本身不应该成为唯一事实源。我的设计是让摘要承担“帮助模型快速了解历史”的作用，而把关键画像和工具事实作为结构化上下文单独保留。
>
> 压缩时，最近消息保留完整内容；用户显式画像从消息中重新抽取或从结构化记忆加载；规则计算和政策检索的重要结果提取为 tool facts；摘要只概括对话主题和已完成事项。
>
> 如果摘要和结构化事实冲突，应该以结构化事实和最新用户确认优先，而不是以摘要优先。摘要也应该带压缩统计信息，便于观察原始消息数量、保留消息数量和丢弃数量。
>
> 更严格的版本可以在压缩后做事实一致性检查：比较压缩前后抽取出的关键字段、计划状态和工具结果；如果发生变化，就拒绝使用该摘要或回退到更保守的上下文。

**追问：摘要是否应该写入长期记忆？**

**继续回答：**

> 一般不应该直接写入长期用户画像。摘要可以作为会话级记忆保存，但它包含模型生成内容，可能有概括错误。若要跨会话使用，也应把它标记为 summary source，并且不能覆盖 confirmed profile facts。
>
> 长期记忆应该保存可验证的原子事实，摘要属于方便检索的辅助信息。

---

#### 问题 17：你的长期记忆现在是匿名 session，为什么简历写“可跨会话恢复”？

**面试逐字稿：**

> 这里需要区分“跨会话”和“跨账号”。当前实现支持基于匿名 session 的跨会话画像恢复：同一个匿名会话后续重新打开对话时，可以加载之前持久化的结构化画像。
>
> 但这不等于已经完成了基于实名账号的跨设备身份体系。若接入登录系统，需要把记忆主体从匿名 session 切换到经过授权的 user subject，并补充数据删除、导出、加密、访问控制和多设备并发更新。
>
> 所以简历中更严谨的说法是“支持基于会话主体的跨会话结构化画像恢复”。如果面试官问到账号、隐私和数据生命周期，我会主动说明当前实现范围，不把匿名 session 包装成完整用户账户系统。

---

### D 类：政策 RAG 深层设计

#### 问题 18：为什么退休政策不能全部放进 RAG，让模型根据文档计算？

**面试逐字稿：**

> RAG 解决的是证据获取，不天然解决确定性计算。即使模型检索到了正确的政策文本，它仍然可能在出生年月边界、女性身份映射、月份换算和缴费缺口计算上出错。
>
> 例如政策文本可能说明不同人群的退休年龄变化节奏，但用户的具体出生年月需要经过分段规则或逐月表映射。让模型从文本中临时做这个计算，结果不可稳定复现，也难以测试。
>
> 所以我把两类问题分开：RAG 负责回答“政策依据是什么、适用条件是什么、官方出处在哪里”；规则引擎负责回答“在给定画像和版本下，这个用户的派生结果是什么”。二者可以在混合请求中组合，但不应该互相替代。
>
> 这也是可信 Agent 的核心：检索证据和执行计算各自承担擅长的责任。

---

#### 问题 19：政策文档如何切块？切得太大或太小分别有什么问题？

**面试逐字稿：**

> 政策文档切块不是单纯按固定字符数切。政策的有效信息通常依赖标题、条款、适用范围、时间和例外条件，所以我会优先按文档结构和语义边界切块，并保留文档级元数据。
>
> 块太大，会把多个主题和多个适用条件混在一起，检索相似度可能被无关内容稀释，引用时也不容易定位具体依据；块太小，则可能把条件和结论拆开，例如把“适用人员范围”与“补贴标准”分到不同块，模型拿到数字却没有条件。
>
> 因此一个合格的 chunk 不只是正文，还要带 sourceId、chunkId、标题、关键词、地区、类别、sourceType、生效时间、URL 和定位信息。对重要政策，切块后需要人工抽查：一个 chunk 是否足以支持一个完整 claim。
>
> 后续还可以对不同类别采用不同切块策略：法律法规按条款，办事指南按步骤和条件，FAQ 按问题—答案对，表格政策按表头和行上下文一起保存。

---

#### 问题 20：为什么用 hybrid retrieval？vector 和 lexical 各自解决什么问题？

**面试逐字稿：**

> lexical 和 vector 解决的是两种不同的匹配问题。
>
> lexical 对精确词非常有价值，例如“4050”“15 年”“240 个月”“女工人”“灵活就业”等政策术语。向量检索可能理解语义相近，但对数字、编号和专有政策名称不一定稳定。
>
> vector 对表达变化更有帮助。用户可能说“我还需要交多久才能领养老金”，文档写的是“最低缴费年限”或“基本养老保险待遇领取条件”，二者表面词不同，但语义相关。
>
> 因此我先用元数据过滤地区、类别、有效时间和官方要求，再分别获得 lexical 和 vector 候选，用 RRF 融合排名，之后结合政策类别、关键词、来源类型等特征 rerank，并对官方来源加权和按 sourceId 做多样性控制。
>
> 这样做的代价是链路更复杂、延迟更高、需要调权重，但对政策场景来说，精确术语和自然语言表达都很重要，单一路径容易在某一类 query 上失效。

**追问：RRF 为什么比直接把两个分数相加更合适？**

**继续回答：**

> vector 相似度和 lexical 相似度不一定处在同一个数值尺度上，直接相加需要非常谨慎地做归一化，否则某一路会因为分值范围更大而支配结果。
>
> RRF 主要使用候选在各自列表中的 rank 来融合，对不同召回器的分数尺度不敏感。一个候选如果在两路都排得靠前，融合后自然获得更高排名。之后再用领域特征做 rerank，能够把通用相关性和政策可信度分开处理。

---

#### 问题 21：官方来源优先是否等于官方来源一定正确？

**面试逐字稿：**

> 不等于。官方来源优先解决的是来源可信等级，不自动解决版本有效性、地区适用性和内容是否真的支持当前 claim。
>
> 一份官方文件可能已经过期，也可能是全国性政策，而用户问的是上海地方办理口径；一份官方 FAQ 可能只回答一个特殊条件，不能被泛化成所有人的结论。
>
> 所以官方优先至少要和三个条件结合：来源类型、有效时间和适用地区。检索时用 metadata filter 过滤不适用的文档，citation 中保留 sourceVersion、publishedAt 和 effectiveFrom/To；回答时还要把“官方来源”与“当前用户是否适用”分开表达。
>
> 对于官方来源之间的冲突，不能只按排名最高的文本回答，需要识别版本关系、上位政策和地方实施细则，必要时明确“需要以当前办事窗口核验”。

---

#### 问题 22：Recall@3 达到 94% 能说明 Agent 的政策回答正确率是 94% 吗？

**面试逐字稿：**

> 不能。Recall@3 只说明在定义好的 benchmark 和相关 source 集合下，Top-3 召回了多少相关来源，它不是最终答案正确率。
>
> 当前指标是 source-level：对每个 query，统计 Top-K citation 命中的相关 sourceId 数量，再除以该 query 的相关 sourceId 数量，最后做宏平均。它关注来源召回，不直接判断模型是否正确理解了来源，也不判断 citation 是否足以支持回答中的每个 claim。
>
> 举例来说，Top-3 命中了相关官方文件，但模型可能把“逐步提高”解释成错误的具体月份；或者 citation 虽然相关，但没有包含回答所引用的那个数字。此时 Recall@3 仍可能很高，但答案不可信。
>
> 所以我会把评估拆成至少四层：召回相关性、官方来源命中、citation 完整性和 claim-evidence 支持度，最终再做端到端人工或模型辅助评审。94% 是检索层指标，不能扩大解释为整体准确率。

**追问：你的 98% 官方来源命中率为什么不是官方答案准确率？**

**继续回答：**

> 因为它的定义是 query-level：Top-K 中只要至少有一条 sourceType 属于官方政策、官方通知或官方 FAQ，就算命中。它没有判断这条官方来源是否是最适用的版本，也没有判断最终回答是否正确引用了它。
>
> 所以我会在简历或面试中同时说清楚：Recall@3 是 source-level 宏平均，官方来源命中率是 query-level Top-K 命中指标。这样面试官不会误以为这是经过人工审校的答案准确率。

---

#### 问题 23：如果 Top-K 召回了很多相似 chunk，但没有真正支持答案，怎么办？

**面试逐字稿：**

> 这说明“相关性”和“支持性”没有完全对齐。我的改进方向是把评估对象从“query—source”进一步细化到“claim—evidence”。
>
> 生成答案前，先把候选回答拆成原子 claim，例如“最低缴费要求是多少”“这个用户预计哪年退休”“官方文件是哪一份”。然后为每个 claim 指定所需证据类型：个人化数字必须来自 computePlan，政策数字必须来自 citation，官方声明必须来自官方来源。
>
> 生成回答后，检查每个 claim 是否有对应的 evidence。对于 citation，需要检查 excerpt 是否包含相关数字、适用条件和时间范围，而不只是 sourceId 命中了关键词。
>
> 当前项目已经有 citation 的来源、excerpt 和完整性字段，也通过 Guardrail 检查部分数字支撑，但还没有完成全面的 claim-level entailment 评估。因此我会把这个作为从“检索可追溯”继续升级到“回答可证明”的方向。

---

#### 问题 24：如果 RAG 没有召回结果，Agent 应该怎么回答？

**面试逐字稿：**

> 首先要区分 empty、disabled 和 degraded。
>
> empty 表示检索正常执行，但当前过滤条件下没有候选；disabled 可能是数据库或配置不可用；degraded 表示使用了降级路径，例如 embedding 不可用而切换到 lexical。
>
> 对 empty，Agent 可以尝试一次受控的 query 改写或放宽非关键过滤条件，但不能放宽官方要求、地区和生效时间这类安全条件。改写仍为空时，应明确当前知识库没有找到足够依据。
>
> 对 disabled，如果用户问的是一般政策概念，可以给出不带具体数字的谨慎说明；如果用户问具体政策数字或官方出处，应该停止确定性回答，建议查询官方渠道。
>
> 对 degraded，回答可以继续，但需要降低措辞强度，并记录降级原因。无论哪种情况，都不能因为“用户期待答案”而伪造 citation 或凭记忆补政策数字。

---

### E 类：Guardrail、可信度与安全边界

#### 问题 25：你如何定义“可信政策 Agent”？可信度和准确率有什么区别？

**面试逐字稿：**

> 我认为可信度不只是最终答案有没有碰巧答对，而是用户和系统能不能知道这条结论为什么成立、适用什么条件、是否存在不确定性，以及出错时能不能追溯。
>
> 在这个项目里，我把可信度拆成几部分：
>
> 第一是事实准确性，个人化数字由确定性规则计算，政策内容来自检索证据。
>
> 第二是来源可追溯性，citation 记录 sourceId、chunkId、来源类型、URL、版本和生效时间。
>
> 第三是过程可解释性，保存工具调用状态、规则 trace、计划状态和降级原因。
>
> 第四是不确定性表达，信息不足、冲突、无来源或版本不确定时不输出强结论。
>
> 第五是记忆边界，模型推断和工具派生结果不能静默变成用户长期事实。
>
> 所以准确率高但无法解释、无法区分适用条件、无法发现错误的系统，仍然不能称为可信。反过来，可信机制也不能替代真实准确性，必须通过规则测试、RAG benchmark 和端到端评测共同验证。

---

#### 问题 26：你的 Guardrail 是怎么判断一句回答中的数字是否有支撑的？

**面试逐字稿：**

> 我会先把回答中的风险类型分开，而不是把所有数字都当成同一种数字。
>
> 第一类是个人化数字，例如“您预计 2038 年退休”“您还差 20 个月”。这类数字必须有 ready 的 computePlan 支持。
>
> 第二类是一般政策数字，例如最低缴费年限、补贴比例或政策年份。这类数字需要有 retrievePolicy 结果，若用户要求官方依据，还要有官方质量 citation。
>
> 第三类是普通日期、示例数字或用户原话中的数字，它们不一定是政策结论，需要结合语境判断。
>
> 当前版本主要通过回答文本中的政策关键词、数字模式和工具支持状态进行后置校验，因此优势是成本低、容易覆盖高风险反例；缺点是可能出现误报和漏报。例如复杂句式、中文数字、表格化回答或模型换一种表达，都可能让简单规则不够稳定。
>
> 更成熟的方案是先做 claim extraction，再将 claim 与工具事实逐条对齐；对高风险个人化数字采用规则化检测，对一般解释使用分类器或小模型辅助，并保留安全兜底。

**追问：为什么不在模型生成前就阻止它？**

**继续回答：**

> 生成前可以通过 system prompt、工具 description 和计划约束减少违规，但无法保证模型一定遵守。生成后校验可以看到最终文本和实际工具状态，因此是必要的。
>
> 但当前后置校验存在流式输出的问题：如果文本已经发给用户，发现违规后不能自然撤回。更完整的生产方案应该采用 draft-then-commit：先在服务端生成草稿和校验，校验通过后再流式或提交给用户；或者设置短暂的输出缓冲，检测到高风险 claim 后再发送。
>
> 当前实现主要完成了违规识别和事件记录，尚未完成完整的阻断、自动修复和重新生成闭环。这是我会主动说明的边界。

---

#### 问题 27：Guardrail 的误报和漏报怎么权衡？

**面试逐字稿：**

> 在社保咨询里，个人化数字和官方依据声明属于高风险内容，我会优先降低漏报，也就是宁可多追问或多提示一次，也不要让无依据数字直接通过。
>
> 但所有内容都过度拦截会导致系统不可用，所以需要分级：
>
> - 个人退休年月、缴费缺口：高风险，必须有 ready computePlan。
> - 一般政策数字：中高风险，需要有 RAG 支撑。
> - 普通概念解释：可以允许模型进行低风险表达，但不能伪装成官方原文。
> - 用户自己提供的数字：可以复述，但不应把它重新包装成系统计算结果。
>
> 误报处理上，可以通过安全模板解释原因，例如“目前只能确认一般政策口径，无法根据现有信息计算您的个人退休年月”。漏报处理上，需要增加反例集、中文表达覆盖、claim-level 检查和人工抽样。
>
> 指标上不能只看 pass rate，还要分别看高风险违规召回率、误报率、人工复核率和用户完成率。

---

#### 问题 28：如果用户明确要求“不要追问，直接给我一个估算”，你会怎么处理？

**面试逐字稿：**

> 我会区分低风险估算和高风险个人结论。对于缺少出生月份但用户只想了解政策大致范围，可以给一般性的解释，并明确这不是个人正式测算；但如果用户要求具体退休年月或缴费缺口，即使用户要求不要追问，也不能擅自补关键字段。
>
> 我会尽量减少追问成本，例如一次性列出最少必要字段，并解释为什么只需要这些字段：“为了计算到月份，我只需要确认出生月份；如果您暂时不知道，我可以先给您讲适用的政策规则，但不能给出确定退休年月。”
>
> 这样既保持用户体验，也不牺牲高风险结论的可信度。Agent 的目标不是无条件满足用户的即时请求，而是在允许范围内给出尽可能有帮助的结果。

---

### F 类：评测、实验与工程化深挖

#### 问题 29：29/29、6/6、10/10 的测试通过，为什么不能证明系统可靠？

**面试逐字稿：**

> 因为这些数字首先说明的是预先设计的测试用例全部通过，不能直接等同于开放世界的可靠性。
>
> 它们的价值在于验证几个关键不变量：缺字段时进入 needs_more_info，完整信息时可以计算，纯政策问题不触发个人化计算，官方声明需要官方 citation，记忆冲突不会静默覆盖，长上下文压缩后关键事实仍然存在。
>
> 但固定测试集可能存在覆盖不足、样例偏简单和与真实用户分布不一致的问题。所以我会把它们看成回归保护，而不是最终质量结论。
>
> 真正的评测应该包括：不同意图和语言表达的覆盖、边界月份和政策版本、工具失败和降级、对抗性输入、真实用户 query 的人工标注、线上抽样复核，以及规则、RAG、模型和 Guardrail 的消融实验。
>
> 面试中我会主动说清楚：测试通过证明设计的关键不变量在这些样例上成立，不能证明所有政策问答都正确。

---

#### 问题 30：你会如何设计一个更严格的 Agent 评测集？

**面试逐字稿：**

> 我会按“任务类型 × 信息状态 × 外部依赖状态 × 风险级别”设计，而不是只按政策主题罗列问题。
>
> 任务类型包括个人化测算、纯政策解释、混合请求、画像更新和无关问题；信息状态包括完整、缺出生年份、缺月份、缺性别、缺累计缴费、女性身份不明、字段冲突和模型可能补默认值；外部依赖状态包括正常检索、无候选、embedding 不可用、数据库不可用、旧新政策冲突；风险级别包括一般解释、政策数字、个人化数字和官方声明。
>
> 每条测试不仅定义 expected answer，还定义 expected tool sequence、forbidden tools、计划状态、是否允许输出数字、是否要求官方 citation、记忆中允许保留的事实和 Guardrail 结果。
>
> 对开放式答案，我不会只做字符串相等，而是评估结构化事实、来源、风险状态和关键 claim。这样可以避免模型换一种说法就被误判为错误，也能避免答案看起来通顺但工具链实际违规。

---

#### 问题 31：如何做消融实验，证明你的架构组件真的有价值？

**面试逐字稿：**

> 我会针对每个组件设计可比较的 ablation。
>
> 对 Execution Plan，可以比较有计划和无计划时的工具顺序违规率、无关工具调用率和平均步数。
>
> 对信息闸门，可以比较开启和关闭时缺字段场景下的个人化数字违规率。
>
> 对规则引擎，可以比较模型直接计算和规则计算的数值一致性、边界错误率和可复现性。
>
> 对 Memory V2，可以比较普通历史 Prompt 和结构化记忆在长对话、多轮补充和冲突场景下的字段保留率与污染率。
>
> 对 RAG，可以比较 lexical、vector、hybrid、hybrid 加 rerank、hybrid 加 official boost 的 Recall@K、MRR、官方命中率和延迟。
>
> 对 Guardrail，可以比较开启和关闭时的高风险 unsupported claim rate，以及误报率。
>
> 只有这样才能说明“某个组件改善了什么”，而不是因为系统整体变复杂就认为它一定更好。

---

#### 问题 32：如果要上线，你最关心哪些线上指标？

**面试逐字稿：**

> 我会同时看业务质量、Agent 行为、系统性能和安全指标。
>
> 业务质量方面，看个人化回答的人工抽检通过率、政策引用支持率、追问后用户补全率和用户纠错率。
>
> Agent 行为方面，看计划类型分布、工具调用成功率、重复调用率、needs_more_info 比例、Guardrail 违规率、降级比例和人工接管比例。
>
> RAG 方面，看按主题、地区和时间分层的 Recall@K、官方命中率、无结果率、citation 完整性和版本过期率。
>
> 系统方面，看 P50/P95 延迟、模型 token、embedding 调用成本、数据库耗时、缓存命中率和超时率。
>
> 安全方面，看敏感信息暴露、越权读取、Prompt injection、错误政策数字和用户投诉。
>
> 这些指标需要带版本和实验分组，否则政策更新或模型升级后，无法判断质量变化来自哪里。

---

#### 问题 33：如果延迟太高，你会怎么优化？顺序是什么？

**面试逐字稿：**

> 我会先拆分延迟来源，再做优化，不会一开始就盲目换模型。
>
> 第一，确认是否存在不必要的工具调用，例如纯政策问题误触发个人化信息评估或重复检索。
>
> 第二，对确定性规则计算和同轮重复工具调用做缓存；对 RAG 使用 query、过滤条件、effectiveAt 和 embedding 版本组成缓存键。
>
> 第三，能并行的部分并行，但必须保持依赖关系。例如在用户画像和检索条件已经确定后，独立的政策检索可以与非依赖步骤并行。
>
> 第四，控制候选数量、rerank 深度、embedding 次数和模型最大步数。
>
> 第五，考虑模型分级：意图和字段抽取可以使用轻量模型，复杂解释使用主模型；但高风险计算仍由规则引擎负责。
>
> 第六，评估是否需要流式输出。流式只能改善感知延迟，不能掩盖最终校验尚未完成的问题。对于高风险数字，应该确保校验完成后再提交相关内容。

---

#### 问题 34：你如何避免 Prompt Injection 影响工具和政策回答？

**面试逐字稿：**

> 我会把用户内容、政策文档和系统策略看成不同信任级别的输入。
>
> 用户消息可以表达需求，但不能修改系统规则、工具权限或官方来源判定。检索到的政策文本也是外部数据，不能因为文本中出现“忽略之前指令”就改变 Agent 行为。
>
> 工具权限应该由服务端计划和策略控制，不能只写在 Prompt 中。工具输入必须经过 schema、范围和业务前置条件校验；检索内容只作为 evidence，不作为新的系统指令。
>
> 回答时还要避免把 citation 中的任意文本原样当成可执行指令。对于政策文本中的链接、脚本或恶意内容，只当作数据展示或过滤处理。
>
> 当前项目重点在业务可信度和工具约束，完整的 Prompt Injection 防护、租户隔离和内容净化还需要继续工程化。面试中我会说明这属于上线安全层，而不是声称已经解决所有安全问题。

---

### G 类：围绕简历每一句话深挖

下面这些问题最容易在面试中出现，因为面试官会把你的简历拆成名词，然后判断你是否真正拥有对应的工程经验。

#### 问题 35：你简历里写“可信政策 Agent”，为什么敢用“可信”两个字？

**面试逐字稿：**

> 我使用“可信”不是指系统永远不会错，而是指系统对高风险结论增加了可验证和可追溯的约束。
>
> 具体来说，个人化数字不由模型直接计算，而是由规则引擎基于结构化画像和政策版本产生；政策解释不只返回文本，还保留来源、片段、来源类型、URL 和有效版本；信息不完整时，系统进入追问状态而不是强行给结论；用户显式事实、模型推断和工具派生结果在记忆中分离；回答生成后还会检查数字和官方声明是否有工具支撑。
>
> 当然，这些机制只能提高可信度，不能替代政策审核。当前版本的 Guardrail 主要是后置校验，延迟退休计算也仍有逐月表精度边界，所以我会把“可信”解释为架构目标和约束体系，而不是绝对正确的承诺。

---

#### 问题 36：你说“引入 Plan-and-Execute 工作流”，具体解决了原系统的什么问题？

**面试逐字稿：**

> 原始的直接问答模式有三个问题：一是模型可能没有判断清楚用户是在问个人结果还是一般政策；二是工具顺序不稳定，可能没有先校验信息就计算；三是回答生成后很难知道它到底依据了什么。
>
> 引入计划后，每一轮请求先被归类为个人化、政策、混合、画像更新或一般问题，并记录本轮是否需要计算、是否需要检索、是否需要官方来源。个人化问题必须先进入信息评估，缺字段就转为追问；完整后才允许计算；混合问题还要补政策 citation。
>
> 计划的另一个价值是可观测性。面试官或开发者可以看到本轮任务状态、缺失字段、计划步骤和实际工具序列，而不是只看到一段最终文本。
>
> 当前版本的计划由服务端确定性生成，后续可以把模型生成的候选计划纳入，但必须经过服务端验证。这个取舍是为了先确保高风险流程可控。

---

#### 问题 37：你写“根据用户意图生成结构化 Execution Plan”，用户意图是怎么得到的？

**面试逐字稿：**

> 当前版本首先采用高风险优先的确定性意图识别。系统会识别个人化表达、政策依据表达、官方来源要求、画像更新表达等信号，并结合已有画像判断是否需要计算、检索或追问。
>
> 我没有把它表述成训练了一个复杂的意图分类模型，因为项目核心不在于证明分类模型的离线准确率，而在于把意图判断转化为后续可执行约束。对于不确定或混合表达，宁可多走一次政策检索或信息评估，也不直接输出个人化数字。
>
> 未来可以把意图识别升级为结构化分类器，让模型输出 intent、entities、requiredEvidence 和 confidence；但服务端仍然要做 schema 校验和策略裁剪，不能让分类结果直接决定高风险动作。

---

#### 问题 38：你简历里写“设计并编排工具链”，工具编排和简单调用几个函数有什么区别？

**面试逐字稿：**

> 区别在于工具之间存在业务依赖、输入输出契约、状态转换和失败语义。
>
> 例如 assessRequiredInfo 不只是一个字段校验函数，它的输出 ready 或 needs_more_info 会决定 computePlan 是否允许执行；computePlan 不只是返回数字，还要返回计算状态、缺失信息、规则 trace 和版本上下文；retrievePolicy 不只是返回文本，还要返回 citation、来源类型、降级状态和原因；Guardrail 需要读取这些工具事件来判断回答是否有支撑。
>
> 因此我在设计时关注的不只是“工具能不能调用”，还关注：什么时候允许调用、调用后状态如何变化、失败时应该重试还是追问、结果是否可以写入长期记忆、最终回答如何引用。
>
> 这才是工具链编排，而不是把几个函数注册给模型。

---

#### 问题 39：你写“将政策逻辑沉淀为确定性规则”，哪些逻辑适合沉淀，哪些不适合？

**面试逐字稿：**

> 适合沉淀的是输入和输出边界清晰、可形式化、需要稳定复现的逻辑。例如性别标准化、女性退休身份映射、退休年龄选择、退休年月换算、退休年份对应最低缴费月份和缴费缺口计算。
>
> 不适合直接硬编码的是开放式政策解释、复杂的政策争议、需要结合办事窗口判断的个案资格，以及来源之间尚未明确的政策冲突。这些更适合通过 RAG 返回依据，并把不确定性展示给用户。
>
> 另外，规则沉淀不代表把所有数字写死在代码里。我更希望规则和参数分离，参数有版本和生效时间，规则执行能返回 trace。
>
> 当前延迟退休的逐月公式仍然需要进一步对齐官方表格，所以我会把现状描述为“已建立版本化确定性计算框架”，而不是“已完整编码所有官方细则”。

---

#### 问题 40：你写“通过校验工具调用状态与回答内容”，这两个校验分别防什么问题？

**面试逐字稿：**

> 工具调用状态校验解决的是“系统实际上做了什么”。例如回答中出现个人退休年月，但本轮没有 ready 的 computePlan；或者回答声称有官方依据，但 retrievePolicy 没有官方质量 citation。这些都可以通过工具事件、输出状态和来源状态判断。
>
> 回答内容校验解决的是“模型最终说了什么”。模型可能调用了工具，但最终回答仍然增加工具结果中没有的数字，或者把普通摘要说成官方原文。因此需要扫描回答中的个人化数字、政策数字、官方声明和不确定性表达，再与工具结果对齐。
>
> 当前实现主要是回答完成后的后置一致性检查。更完整的实现应该在回答生成前限制可用工具，在生成后做 claim-evidence 对齐，发现高风险违规时阻断或重新生成。

---

#### 问题 41：你写“隔离用户显式信息、模型推断信息与工具派生结果”，为什么这个隔离这么重要？

**面试逐字稿：**

> 因为这三类信息的事实地位完全不同。
>
> 用户显式信息是系统可以在一定条件下长期保存和复用的输入；模型推断只是对用户表达的解释，可能错；工具派生结果依赖规则版本和当前输入，可能随着政策或画像变化而变化。
>
> 如果不隔离，模型调用工具时补的默认月份可能写回长期画像，下一次用户只说“帮我重新算一下”，系统就会在错误月份基础上输出新的退休年月。又或者旧版本 computePlan 的结果被当作用户永久属性，政策更新后仍然沿用。
>
> 所以我的 Memory V2 为 fact 记录 source type、confidence、status 和 conflict；长期持久化只保留允许的显式用户事实，工具派生结果留在会话和审计层。这个隔离是可信 Agent 和普通聊天记忆的关键差异。

---

#### 问题 42：你写“支持上下文压缩、会话摘要和工具事实保留”，三者分别解决什么问题？

**面试逐字稿：**

> 上下文压缩解决的是消息太多带来的 token、延迟和模型注意力问题；会话摘要解决的是保留历史主题和阶段性结论；工具事实保留解决的是保留结构化、可用于下一步决策的结果。
>
> 这三者不能互相替代。摘要适合表达“用户已经补充了出生信息，并讨论过最低缴费年限”，但不应该承担精确保存 birthMonth=3 或 requiredMonths=240 的职责；工具事实适合保存计算状态和 citation，但不应该自动成为长期用户画像；结构化画像适合保存用户确认字段，但不应该包含每一次计算结果。
>
> 所以我的上下文设计是多通道的：最近消息保持自然语言连续性，摘要保持对话概览，结构化 profile 保持用户事实，tool facts 保持工具结果，Execution Plan 保持当前任务状态。

---

#### 问题 43：你写“RAG Recall@3 94%、官方来源命中率 98%”，面试官问数据集、分母和复现方式，你怎么回答？

**面试逐字稿：**

> 这两个指标必须结合实验口径来解释。当前 benchmark 用每条 query 的 expected relevantSourceIds 作为相关来源集合。Recall@3 以 sourceId 为相关性单位，统计 Top-3 citation 中命中的相关 sourceId 数量，除以该 query 的相关 sourceId 数量，再对 query 做宏平均，所以不是 chunk-level，也不是最终答案准确率。
>
> 官方来源命中率是 query-level 指标：Top-K 里只要至少有一条来源类型属于 official_policy、official_notice 或 official_faq，就算该 query 命中官方来源。
>
> 复现需要对应的政策数据、数据库、embedding/API 配置和 benchmark 环境。当前本地环境下真实数据库/API 不可用，50 条用例没有得到 ready 结果，因此我不会把这次运行说成复现成功。简历里的 94% 和 98% 应该注明是历史实验结果，并同时提供指标定义和测试集版本。
>
> 如果要增强可信度，我会补充每个 query 的命中明细、人工标注依据、不同检索策略的消融结果、P50/P95 延迟和 claim-level 支持评估。

---

#### 问题 44：你认为这份简历描述里最容易被质疑的地方是什么？

**面试逐字稿：**

> 我认为有四个地方最容易被追问。
>
> 第一，“根据用户意图生成 Execution Plan”容易被理解成 LLM 自主规划。实际当前版本主要是服务端确定性计划生成，所以我会主动说明这一点。
>
> 第二，“回答安全校验”容易被理解成已经可以实时阻断和自动修复。当前实现主要是后置校验和违规记录，完整闭环还需要增强。
>
> 第三，“延迟退休规则”容易被追问到具体出生年月边界。当前公式是参数化近似，不能声称完全复现官方逐月表。
>
> 第四，“Recall@3 94%、官方来源命中率 98%”容易被误解成答案准确率。必须说清楚 source-level 和 query-level 口径，以及当前环境不能现场复测的事实。
>
> 我宁愿把这些边界说清楚，也不把能力包装得过满。真正做过项目的人应该能说清楚系统在哪些地方可靠、在哪些地方仍然需要人工确认。

---

### H 类：真实 E2E 深度问答

#### 问题 45：你做真实 E2E 时，为什么不能只调用一次真实模型？

**面试逐字稿：**

> 因为真实模型存在随机性和外部依赖波动。一次通过可能只是模型刚好选择了正确工具，不能说明流程稳定。
>
> 我会把评测分成关键不变量和软质量两部分。关键不变量，例如缺月份时不能调用 computePlan、个人化数字必须有 ready 计算、官方声明必须有官方 citation，应该在固定温度或重复运行下观察稳定性，重点看最坏情况。软质量，例如回答是否自然、追问是否简洁，可以用多次结果做人工或模型辅助评分。
>
> 同时冻结模型版本、Prompt、工具 schema、规则版本和 RAG 数据版本，并记录随机参数。否则同一条用例前后结果变化，无法定位原因。

---

#### 问题 46：真实 E2E 的 ground truth 从哪里来？

**面试逐字稿：**

> 不同类型的 ground truth 来源不同。
>
> 个人化数字的 ground truth 来自独立的规则参考实现、政策表或人工核验样例，而不是再用同一个被测规则引擎生成一遍。否则规则引擎自己算错时，评测也会认为它正确。
>
> 工具链 ground truth 来自业务不变量，例如缺出生月份必须追问、纯政策问题禁止 computePlan、要求官方依据必须命中官方来源。
>
> RAG ground truth 来自人工标注的相关 sourceId、官方来源要求、必要术语和适用地区/时间。
>
> 自然语言答案 ground truth 不固定为一段标准文本，而是拆成必须包含的事实、必须避免的 claim、必须展示的条件和可接受的表达范围。
>
> 对于有争议或版本不稳定的政策，不应该强行设置单一数字作为真值，而应设置“需要说明版本差异或人工核验”的期望状态。

**追问：如果参考实现和被测规则引擎使用了同一份错误政策表怎么办？**

**回答：**

> 这是评测闭环中的相关性问题。高风险规则至少需要一个独立来源：官方逐月表、人工复核表、另一套实现或历史人工计算记录。还要做边界样例和变形测试，不能只依赖同一份配置文件。
>
> 评测系统本身也要版本化，记录 ground truth 来源、标注人和更新时间。

---

#### 问题 47：你的真实 E2E 如何区分“工具没调用”和“工具调用了但结果没被使用”

**面试逐字稿：**

> 我会分别检查 trace 和最终 claim。
>
> 工具没调用，可以通过 tool event 或 SDK 的 tool call 记录直接判断；工具调用了但结果没被使用，则需要对答案中的 claim 与工具输出做对齐。
>
> 例如 computePlan 返回 retireAgeLabel、estimatedRetireYear 和 missingMonths，如果最终答案给了另一个年份，就属于 tool-result contradiction；如果回答完全没提计算结果，可能是任务完成度不足，但不一定是安全违规。
>
> RAG 也一样：citation 命中相关 sourceId 只能证明检索层成功，最终答案是否使用了 citation，需要检查它引用的数字、条件和表述是否能被 excerpt 支持。
>
> 所以真实 E2E 至少要同时有 execution trace evaluator 和 answer evaluator，不能把工具调用日志当成回答正确的证明。

---

#### 问题 48：真实 E2E 的一条用例失败后，你如何定位根因

**面试逐字稿：**

> 我会按固定的故障树排查，而不是先改 Prompt。
>
> 第一看输入：消息是否完整、角色是否正确、会话是否恢复、用户画像是否加载。
>
> 第二看抽取：birthYear、birthMonth、gender、paidMonths 和女性身份是否从用户文本正确抽取，是否出现空值覆盖或错误类型。
>
> 第三看计划：intent、status、missingFields 和 steps 是否符合场景。
>
> 第四看工具：是否调用 required tool，是否调用 forbidden tool，输入是否带证据，输出状态是否 ready。
>
> 第五看规则或检索：规则 trace 和版本是否正确，RAG 的过滤、候选、sourceType、effectiveAt 和 citation 是否符合预期。
>
> 第六看回答：模型是否使用工具事实，是否添加了没有证据的新数字，是否正确表达了不确定性。
>
> 第七看持久化：本轮结果是否把派生事实写进长期画像，下一轮是否出现污染。
>
> 这样一个失败样本最终会被分类为 extraction、planning、orchestration、tool contract、engine、retrieval、generation、guardrail、memory 或 infrastructure 问题，修复方向会清晰很多。

---

#### 问题 49：如果真实 E2E 通过率很高，但用户满意度不高，说明什么

**面试逐字稿：**

> 说明我们优化了系统不变量，但没有充分优化用户任务完成。
>
> 例如缺字段时系统非常安全，但一次性追问五个字段，用户不知道为什么需要；或者政策回答引用很多来源，却没有先给用户结论；或者系统过度使用免责声明，让用户觉得它只会拒答。
>
> 所以 E2E 评测还要加入任务完成度和交互质量：追问字段是否最小化、用户补充后是否能顺利完成、回答是否先结论后依据、来源是否可点击、是否明确下一步行动。
>
> 高风险场景不能只追求“拒绝率低”或“Guardrail 全通过”，还要看用户在安全约束下能不能完成咨询任务。

---

#### 问题 50：如果模型经常过度追问，你如何优化

**面试逐字稿：**

> 我会先确认追问是否真的有业务必要，而不是直接在 Prompt 里要求模型少问。
>
> 第一，重新定义每类任务的最小字段。比如纯政策问题不需要个人画像；只解释退休年龄政策也不需要累计缴费月份；只有计算缴费缺口时才需要 paidMonths。
>
> 第二，把 missingFields 按优先级分组，一次性追问必要字段，避免一轮只问一个字段。
>
> 第三，区分精确计算和一般估算。如果用户只需要政策范围，可以先回答一般口径；如果要精确到月份，再追问 birthMonth。
>
> 第四，记录用户补全率和重复追问率。如果某个字段经常被系统重复询问，优先排查记忆合并和上下文传递。
>
> 第五，给追问补充原因，例如“出生月份会影响精确退休年月”“女性岗位身份会影响退休年龄口径”，让用户知道它不是无意义收集信息。

---

#### 问题 51：如果模型过度拒答，怎样让它更有帮助

**面试逐字稿：**

> 安全不是把所有问题都拒绝，而是把结论拆成不同确定性层级。
>
> 对缺少个人月份的问题，可以拒绝确定退休年月，但仍然解释计算需要哪些信息；对 RAG 暂时不可用的问题，可以给不带具体数字的政策框架和官方查询路径；对女性身份不明的问题，可以列出不同身份口径，帮助用户选择；对养老金金额测算，可以解释公式和需要补充的参数。
>
> 我会把回答设计成“当前能确认什么、不能确认什么、下一步需要什么”，而不是简单说“无法回答”。这样 Guardrail 的作用是限制高风险 claim，而不是限制所有帮助性内容。

---

#### 问题 52：用户的问题同时包含个人计算、政策依据、补贴资格和养老金金额，你怎么拆

**面试逐字稿：**

> 我会先把复杂请求拆成多个子任务，并分别标记风险和依赖：
>
> - 个人退休年月：需要画像和规则引擎。
> - 最低缴费和延迟退休依据：需要 RAG，要求官方来源。
> - 4050 资格：可以先做初筛，但最终资格需要官方办事条件核验。
> - 养老金金额：当前版本只能解释公式或要求补充参数，不能假装已经完成精确金额计算。
>
> 计划中不应该只有一个“回答”步骤，而要有子任务状态。每个子任务独立记录 ready、needs_more_info、unsupported 或 degraded，最后由回答层组合。
>
> 如果一个子任务信息不足，不应该阻塞所有低风险子任务。例如可以先回答政策解释，同时追问计算所需字段；但不能因为政策检索成功，就顺便生成个人退休数字。

---

#### 问题 53：如果用户的问题很模糊，比如“退休政策怎么回事”，你会怎么规划

**面试逐字稿：**

> 这种问题意图范围太宽，我不会立即调用所有工具。可以先做轻量意图澄清，或者给出一个简短的主题菜单：延迟退休、最低缴费年限、女性退休身份、弹性退休、4050 补贴、养老金计算。
>
> 如果用户没有要求个人化结果，就不应追问出生年月和缴费月份。系统可以先回答政策主题概览，并询问用户最关心哪一项。
>
> 这也是 Agent 规划的重要作用：在不确定时选择成本低、风险低的澄清动作，而不是把所有工具都调用一遍。

---

#### 问题 54：如果用户发送一段很长的政策文件，并要求“按这个文件回答”，你是否相信用户提供的文件

**面试逐字稿：**

> 用户提供的文件可以作为待分析材料，但不能自动升级为官方权威来源。首先需要识别它的来源、发布日期、地区和适用范围；如果无法验证，就应该标记为 user_provided 或 unverified source。
>
> 对文件内容的总结可以基于用户提供材料完成，但涉及“官方规定”“当前有效政策”的表述，仍需要和官方知识库或官方链接核验。
>
> 文件中的指令性文字也只能视为数据，不能改变系统工具权限或安全策略。这样同时处理了来源可信度和 Prompt Injection 风险。

---

#### 问题 55：如果用户的画像字段来自客户端直接传入，而不是聊天文本，你信任吗

**面试逐字稿：**

> 客户端 profile 可以作为用户显式输入的候选，但服务端仍要 sanitize、schema 校验和来源标记，不能因为字段来自前端 JSON 就视为绝对可信。
>
> 如果这是用户在表单中明确确认的字段，可以标记为 user_input 或 user_message confirmed；如果是前端自动推断或历史缓存，则需要降低状态或重新确认。
>
> 服务端还需要防止客户端直接注入内部字段，例如 _memory、tool facts、rule trace 或 plan status。长期记忆和计算输入必须由服务端投影和过滤，不能让客户端决定事实来源和可信状态。

---

### I 类：制作决策与错误尝试

#### 问题 56：你为什么先做规则引擎，而不是先做 RAG？

**面试逐字稿：**

> 因为规则引擎更容易形成确定性的最小闭环。只要输入画像固定，我可以先验证退休年龄映射、退休日期、最低缴费月份和缺口计算是否正确，再把它包装成 Agent 工具。
>
> 如果先做 RAG，模型可能已经能回答政策文本，但个人化计算仍然混在生成层里，后面很难判断错误来自检索、模型还是计算。
>
> 我的开发顺序是先固定高风险数字，再加入工具编排，然后做 RAG 证据，最后补记忆、上下文和 Guardrail。这样每一步都有清晰的验收标准。

#### 问题 57：你为什么没有一开始就让 LLM 生成 Execution Plan？

**面试逐字稿：**

> 因为当时最先要解决的是可控性，不是规划的开放性。对于个人化社保问题，计划步骤其实有很强的业务先验：先判断信息是否够，再计算；如果要求依据，再检索政策。
>
> 让模型一开始自由生成计划，会引入 schema 错误、步骤遗漏、工具越权和调试困难。我先用服务端确定性计划验证完整链路，等工具契约、状态和评测稳定后，再考虑引入模型候选计划。
>
> 这也是一种工程取舍：先用确定性规则把 Agent 的“骨架”搭稳，再把模型的自主性放进安全边界内。

#### 问题 58：你为什么没有直接使用一个成熟 Agent 框架解决？

**面试逐字稿：**

> 成熟框架可以解决消息循环、工具注册和基础状态管理，但这个项目的难点是社保业务的可信边界，不是把工具注册出来。
>
> 我需要明确区分用户事实和派生事实、实现字段证据校验、管理政策版本和官方来源、定义缺字段和冲突状态、设计 source-level RAG 指标，以及在回答中校验不同数字对应的证据。这些约束最终还是要落到自己的领域模型里。
>
> 所以框架可以作为运行时基础设施，但关键的 plan schema、memory schema、rule engine、retrieval metadata 和 guardrail 仍然需要自己设计。

#### 问题 59：你做过哪些错误尝试，后来为什么放弃

**面试逐字稿：**

> 第一种错误尝试是只在 system prompt 中要求“不要补全信息”。这种方式在简单样例上有效，但模型输出存在波动，不能作为硬约束，所以后来增加了证据型信息闸门和工具内二次校验。
>
> 第二种尝试是把完整用户画像直接传给模型和工具。这样看起来简单，但模型工具参数中的默认值和派生结果容易回流到长期记忆，所以后来引入 Memory V2 和 profile projection。
>
> 第三种尝试是只使用向量检索。它对自然语言表达有帮助，但对 4050、15 年、240 个月等精确数字和术语不够稳定，所以改成 lexical/vector 混合、RRF 和官方来源加权。
>
> 第四种尝试是只看最终答案评测。后来发现答案正确不代表工具路径正确，因此把计划状态、工具序列、禁止工具、citation 和 Guardrail 结果都纳入 E2E 断言。
>
> 这些尝试让我认识到，Agent 开发不是一开始就能设计出完美架构，而是通过失败样例逐步把隐含约束显式化。

#### 问题 60：你是如何决定哪些字段是“最小必要信息”的

**面试逐字稿：**

> 我不是按数据库里所有可用字段来收集，而是按具体任务的输出依赖反推。
>
> 要算退休年月，需要出生年月、性别和女性退休身份；要算缴费缺口，还需要累计缴费月份；要解释一般政策，则不需要个人画像；要做 4050 初筛，可能需要年龄、就业状态和地区，但不等于已经完成资格审核。
>
> 因此最小必要信息应该是“任务相关的最小字段集合”，而不是统一的全量画像。这样既降低追问成本，也减少不必要的个人信息收集。
>
> 在实现上，Execution Plan 先确定任务，再由 assessRequiredInfo 按任务检查字段；后续可以把 required fields 进一步从规则 DSL 的输入声明自动推导出来，避免业务代码和规则依赖列表不一致。

---

### J 类：RAG 检索工程补充问答

#### 问题 61：为什么需要 rerank？初始召回不够吗？

**考察点：**是否理解召回和排序的职责差异，是否知道政策 RAG 不能只看向量相似度。

**面试逐字稿：**

> 初始召回和 rerank 解决的是两个不同问题。初始召回更关注覆盖率，希望不要漏掉可能相关的政策来源；rerank 更关注精确性，要在候选结果里判断哪些内容真正适合当前问题。
>
> 
> 在我的项目里，用户问题不仅有语义，还有地区、政策类型、身份、发布时间和官方来源这些条件。比如“4050 补贴”可能对应不同地区、不同年份和不同政策名称，仅靠向量相似度，容易召回一段语义相近但地区或时效不匹配的内容。
>
> 
> 所以我会先用 lexical 和 vector 做候选召回，再通过 RRF 或融合排序得到候选集合，之后结合 metadata、来源类型、政策时效、地区匹配和查询意图做 rerank。这样初始召回负责“尽量不漏”，rerank 负责“把真正能支撑回答的内容排到前面”。
>
> 这背后的取舍是，rerank 会增加延迟和计算成本，所以不是所有低风险问题都需要很重的 rerank。生产化时可以根据风险等级和候选集质量决定是否启用更复杂的排序。

**面试官可能继续追问：**

- 你如何证明 rerank 有效果？
- rerank 使用哪些特征？
- 如果 rerank 把真正相关的条款排下去了怎么办？

**追问回答：**

> 我会做消融对比：固定同一批 query 和文档，只比较 lexical/vector、融合排序和加入 rerank 后的 source-level Recall@3、MRR、RelevantOfficialHit@3 以及端到端 citation 支持率。如果召回指标提高但最终回答没有改善，说明瓶颈可能在 citation 使用或回答整合层，而不一定是检索排序本身。

#### 问题 62：embedding 模型如何选择？换模型后需要做什么？

**考察点：**是否理解 embedding 选择不能只看通用榜单，是否考虑政策语料、时延、成本和索引一致性。

**面试逐字稿：**

> 我不会只根据模型名称或者通用 benchmark 选择 embedding，而是先用项目里的政策问法建立 baseline，再比较不同模型在 source-level Recall@3、MRR、相关政策排序、延迟和资源成本上的表现。
>
> 
> 社保政策有两个特殊点：一是口语词和官方术语之间存在差异，比如“4050”和“就业困难人员社会保险补贴”；二是地区、身份和时间条件很重要。embedding 需要有稳定的中文语义匹配能力，但不能把 metadata 条件完全交给向量语义判断，所以我还会结合结构化过滤和 rerank。
>
> 
> 如果更换 embedding 模型，不能只替换查询侧模型。文档向量和 query 向量必须在同一个向量空间里，因此需要重新生成文档 embedding、重建索引，并锁定新的 index version。之后重新跑 RAG benchmark 和关键 E2E 回归，确认 sourceId、citation 和政策版本映射没有被破坏。
>
> 面试里我会把模型选择说成一个工程实验：先建立 baseline，再看召回效果和成本延迟，最后选择综合收益最好的方案，而不是只报一个模型名字。

**不能说错：**

- embedding 模型变更通常需要重建文档向量；
- 新模型分数提高不代表最终回答一定提高；
- embedding 不能替代地区、时效和来源类型等 metadata 过滤。

#### 问题 63：用户用俗称、别名或口语表达时，RAG 如何处理？

**面试逐字稿：**

> 我会采用“保留用户原词，加官方术语扩展”的方式，而不是把用户问题完全改写掉。
>
> 
> 例如用户说“4050 那个补贴”，系统可以把“4050”保留在原始 query 中，同时补充“就业困难人员社会保险补贴”等可能的官方术语；用户说“延迟退休新规”，可以扩展到“渐进式延迟法定退休年龄”和对应的政策文件名称。
>
> 
> 这样做有两个好处：第一，保留原词可以避免 query rewrite 偏离用户真实意图；第二，补充官方术语可以提高和政策标题、条款关键词的匹配概率。扩展后的 query 还要结合地区、政策类型和时间条件，不能只做同义词替换。
>
> 如果别名存在多个可能含义，我不会直接选一个结果，而是降低回答确定性，先给出候选解释，必要时追问地区、年份或具体政策对象。

#### 问题 64：Top-K 被同一个政策来源的 chunk 占满怎么办？

**面试逐字稿：**

> 如果 Top-K 全部来自同一个政策文件的相邻 chunk，表面上召回数量很多，但信息多样性不足，也可能把其他适用条件、地方细则或官方解释挤出 Top-K。
>
> 
> 我会在 rerank 后增加 source-level 去重或多样性约束，例如限制同一 source 在最终 Top-K 中的占比，同时保留真正支持当前 claim 的关键条款。这里不是简单地“每个来源只留一条”，因为同一份政策中可能确实需要定义条款和例外条款共同支持答案。
>
> 
> 所以更准确的做法是按 source 和 policy section 做分组，在保证核心证据完整的前提下控制重复 chunk。评测时也要同时看 source-level Recall、Context Coverage 和 Citation Completeness，避免为了多样性反而删掉必要条件。

#### 问题 65：政策别名、地区和时效都存在时，如何构造检索 query？

**面试逐字稿：**

> 我会把 query 拆成几部分：用户原始问题、标准化后的政策类型、地区、时间或政策版本、以及必要的个人条件。比如“上海、4050、2026 年、灵活就业人员、能不能享受补贴”会比只用“4050 补贴”更容易召回适用内容。
>
> 
> 但我不会把所有个人字段都无差别塞进 query。出生年月和缴费月数主要服务于规则计算，只有当它们会影响政策适用条件时才进入 RAG query。这样可以控制噪声，也能避免把计算问题误变成纯文本检索问题。
>
> 
> 最终检索 query 应该既保留用户原话，又包含结构化的检索条件。原话保证意图不丢，结构化条件保证地区、政策类型和时效可控。

#### 问题 66：RAG 索引什么时候会失效？怎么发现和修复？

**面试逐字稿：**

> 政策 RAG 的索引失效不只是一种情况。政策更新后旧索引没有刷新，会召回过期文件；metadata 错误会导致地区或有效期过滤失效；chunk 切分不合理可能把适用条件和例外条款分开；embedding 模型更换但没有重建索引，会出现 query 和文档向量空间不一致；sourceId 或文档版本变化还可能导致 benchmark 标注失效。
>
> 
> 我会通过版本化文档和索引来治理。每次政策更新记录 sourceId、documentVersion、indexVersion 和生效时间，更新后先跑文档级检查，再跑 RAG benchmark 和关键 E2E。线上如果发现 citation 的版本异常或用户频繁追问依据，也要把 case 回流到评测集。
>
> 
> 修复时不能只重新跑一次查询，而要确认文档内容、metadata、embedding、索引和 benchmark gold 是否处于同一版本。否则可能出现“检索结果看起来恢复了，但评测标注已经失效”的假修复。

#### 问题 67：官方来源优先，是否等于官方来源一定正确？

**面试逐字稿：**

> 不等于。官方来源优先解决的是来源权威性问题，但不能自动解决适用地区、有效期、身份条件和条款支持关系问题。
>
> 
> 一份官方文件可能是旧版本，也可能只解释总体政策，不包含用户当前问题的具体条件。即使域名是官方的，citation 也可能没有真正支持回答里的 claim。
>
> 
> 所以我会把“官方”和“相关”拆成两个维度：来源类型要是官方或权威来源，同时内容要和当前问题、地区、时间和政策类型匹配。比单纯的 OfficialHit 更严格的指标是 RelevantOfficialHit，要求来源既官方又真正相关。

#### 问题 68：如果 RAG 召回了很多内容，但没有真正支持答案，怎么办？

**面试逐字稿：**

> 这说明“召回到相关主题”和“证据足以支持最终结论”不是一回事。比如召回结果都在讲延迟退休，但没有覆盖用户所属身份或具体生效时间，模型仍然不能据此输出确定结论。
>
> 
> 我会把回答拆成 claim，再为每个 claim 建立 evidence 关系。确定性数字应当来自规则结果；政策解释和条件说明应当关联到具体 citation；如果某个 claim 没有足够证据，就删除、改成不确定表达，或者继续追问，而不是为了让回答完整而补写。
>
> 
> 这也是为什么我会区分 Recall@3、RelevantOfficialHit 和 Claim Support Rate：前两个主要衡量检索，最后一个才开始衡量证据是否真正被回答使用。

#### 问题 69：RAG 为什么需要处理政策别名和俗称？

**面试逐字稿：**

> 因为真实用户不会按照政策文件标题提问。用户可能说“4050”，官方文件写的是“就业困难人员社会保险补贴”；用户可能说“延迟退休新规”，文件中使用的是“渐进式延迟法定退休年龄”。如果只做原文关键词匹配，会漏召回；如果只做向量检索，也可能把相似但不适用的政策混在一起。
>
> 
> 所以我会采用原词保留、官方术语扩展、metadata 过滤和 rerank 结合的方式。扩展不能替换用户原意，最终回答仍然需要根据具体地区和时间确认适用政策。

#### 问题 70：政策文档切块时，如何避免把条件和例外切散？

**面试逐字稿：**

> 政策文档不能只按固定字符数机械切分。定义、适用范围、例外条件、时间和办理要求经常分布在相邻条款中，如果切得太小，召回到的片段可能只有结论，没有适用条件；如果切得太大，又会增加噪声和上下文成本。
>
> 
> 我会优先按标题、条款、语义段落切分，并在 chunk metadata 中保留父文档、章节、条款序号和相邻位置。对必须一起理解的条件和例外，可以使用适度 overlap 或在检索后补充相邻条款。最终评测不只看 chunk 是否命中，还看返回证据是否覆盖 claim 所需的条件。

### K 类：Agent 岗位横向知识

#### 问题 78：RAG、规则和微调分别适合什么？

**面试逐字稿：**

> 我会按知识的变化频率、确定性和是否需要来源来区分。RAG 适合更新频繁、需要引用和追溯的外部知识，比如社保政策文件；规则适合确定性高、输入输出边界清晰、不能接受模型自由发挥的逻辑，比如退休年龄、最低缴费月数和缺口计算；微调更适合稳定的行为模式，比如工具调用格式、领域表达风格和固定任务的输出习惯。
>
> 
> 在我的项目里，政策内容没有通过微调硬塞进模型，因为政策会更新，而且回答需要引用来源。个人化政策数字也没有交给模型，而是使用规则引擎。LLM 主要负责意图理解、自然语言抽取、流程协作和回答组织。
>
> 
> 三者不是互相替代的关系。即使未来对模型做微调，也不能因此取消规则、RAG 和安全校验。

#### 问题 79：你做过 SFT、DPO 或 RL 吗？

**面试逐字稿：**

> 这个项目的主线是 Agent 应用工程，不是模型训练，所以我没有把 SFT、DPO 或 RL 作为核心实现，也不会把后续规划说成已经做过。
>
> 
> 如果继续优化，我会优先考虑用高质量的工具调用轨迹做 SFT，让模型更稳定地产生意图、计划草稿和工具参数；但高风险参数仍然要经过服务端 schema、证据和业务前置条件校验。
>
> 
> DPO 更适合用偏好数据优化回答风格、追问策略或安全边界；RL 则可能用于优化长链路策略，但它会遇到信用分配和 reward hacking 问题。因此在我的项目里，先把 trace、分层评测和规则边界做好，比直接做 RL 更重要。

#### 问题 80：Reward hacking 在 Agent 中是什么意思？

**面试逐字稿：**

> Reward hacking 指系统为了获得评测奖励，学会了表面上得分但实际上违背目标的行为。
>
> 
> 在我的项目里，如果只奖励“最终回答看起来完整”，模型可能会绕过规则引擎，直接凭记忆给出退休数字；如果只奖励“不要答错”，模型又可能对所有问题都追问或拒答，虽然 Unsafe Answer Rate 下降了，但用户体验变差。
>
> 
> 所以 Agent 的奖励或评测不能只看最终文本，还要看工具路径、参数来源、规则结果、citation 支持、缺信息追问和不必要工具调用。最终目标应该是“正确完成任务并保持证据链”，而不是单纯追求一个分数。

#### 问题 81：Agent 应用开发和算法岗位的区别是什么？

**面试逐字稿：**

> 算法岗位更关注模型本身，例如训练、微调、推理优化、对齐和模型评测；Agent 应用开发更关注如何把模型接入真实业务流程，包括工具设计、状态管理、RAG、记忆、权限、安全、可观测性和产品体验。
>
> 
> 我的项目更偏 Agent 应用工程。我的核心工作不是训练一个新模型，而是判断什么应该交给 LLM，什么应该交给规则，什么必须有政策来源，什么情况下必须停止，以及如何通过 E2E 和 trace 验证系统行为。
>
> 
> 这类岗位并不意味着不需要算法基础。相反，需要理解模型的能力边界、上下文限制、工具调用不稳定性和评测偏差，然后把这些认识转化成工程约束。

#### 问题 82：什么时候值得引入多智能体？

**面试逐字稿：**

> 我不会因为“多智能体”听起来更复杂就主动引入。判断标准是任务是否存在相对独立、需要不同上下文或不同权限的专业角色。
>
> 
> 当前社保退休规划的主流程比较明确，规则计算本身也应该由确定性工具完成，所以单 Agent workflow 加多工具更容易追踪和归因。引入多个自治 Agent 会增加通信、状态同步、延迟和错误归因成本。
>
> 
> 如果未来扩展到多个政策领域，或者需要政策研究、计算复核、材料办理和人工审核等相对独立的角色，可以考虑 Planner、Policy Researcher、Calculator、Verifier 等角色。但即使拆成多 Agent，规则计算和权限控制仍不应交给自治模型自由决定。

#### 问题 83：LangChain、LangGraph、MCP 和 Skill 分别解决什么问题？

**面试逐字稿：**

> LangChain 更偏工具、模型、检索器和链路的组件组合；LangGraph 更适合把有状态、有分支、有循环的 Agent workflow 表达成状态图；MCP 更偏向用标准协议暴露外部工具和资源；Skill 更偏向描述完成某类任务的方法、流程和约束。
>
> 
> 放到我的项目里，退休规划流程可以抽象成一个 Skill，规则引擎和政策检索可以作为工具，未来可以通过 MCP 暴露；如果流程分支和恢复逻辑继续增多，可以用 LangGraph 或自定义状态机管理状态。
>
> 
> 但这些框架不是可信性的来源。真正重要的是工具契约、服务端前置条件、规则版本、citation、trace 和评测。框架可以替换，责任边界不能丢。

### L 类：项目价值、个人贡献与岗位匹配

#### 问题 84：你个人在这个项目中主要负责什么？

**面试逐字稿：**

> 这个项目是我从零开始构建的，我主要负责从业务拆解到 Agent 链路、规则、RAG 和评测的完整闭环。具体来说，我先定义了个人化测算和政策解释的任务边界，设计了用户画像字段和信息完整性闸门；然后把退休年龄、最低缴费年限、缴费缺口等确定性逻辑沉淀到规则引擎；同时设计政策文档的 metadata、混合召回、官方来源优先和 citation 输出；最后完成 RAG benchmark、真实 E2E 评测和 bad case 归因。
>
> 
> 我不把自己的贡献描述成“调用了一个大模型 API”。真正花时间的是确定哪些能力交给模型，哪些能力必须由服务端控制，以及如何通过 trace 和评测证明链路按预期工作。

**面试官可能继续追问：**

- 哪个模块是你最独立完成的？
- 哪个决定最能体现你的技术判断？
- 你做过哪些错误尝试？

**建议回答：**

> 最能体现我技术判断的是把高风险政策数字从模型生成中拿出来，并在工具前后都建立约束。因为模型即使能答对正常样例，也可能在缺出生月份、女性身份不明或政策版本变化时给出错误确定值。我选择让规则引擎负责计算，让 RAG 负责依据，让模型负责理解和表达，再用 E2E 验证这几部分是否一致。

#### 问题 85：这个项目的目标用户和业务价值是什么？

**面试逐字稿：**

> 目标用户主要是需要了解退休年龄、最低缴费条件、弹性退休和相关补贴政策的个人用户，也可以包括需要处理高频政策咨询的服务人员或机构。
>
> 
> 对个人用户，价值不是简单给一个数字，而是帮助他知道：根据哪些已确认信息得到当前结果，还缺什么信息，政策依据来自哪里，下一步应该补充什么材料或向哪个官方渠道确认。
>
> 
> 对服务机构，价值在于把高频、结构化程度较高的政策咨询自动化，同时通过规则、来源和安全校验降低答复不一致的风险。对于无法确认、政策冲突或高风险资格判断，系统应该保守回答或转人工，而不是追求全自动覆盖。
>
> 
> 所以这个项目的业务价值可以概括为：提高高频咨询的响应效率、一致性和可追溯性，同时把高风险问题显式暴露出来。

#### 问题 86：如果没有真实线上用户，怎么说明项目价值？

**面试逐字稿：**

> 如果没有真实线上用户，我不会把离线评测包装成线上业务收益。我的说法是：当前已经完成了可运行的核心链路和真实 E2E 评测，验证了系统在多轮输入、缺信息、混合意图、政策召回和安全约束下的行为；但还没有足够的真实流量来证明用户留存、转化或人工成本下降。
>
> 
> 目前能证明的是工程能力和可验证性，不能直接证明商业化效果。若进一步试运行，我会在脱敏和授权基础上记录任务完成率、用户追问率、负反馈率、人工转接率、citation 查看率和高风险错误率，再结合人工复核判断系统是否真正有帮助。

#### 问题 87：如果扩展到医保或公积金，需要重做什么？

**面试逐字稿：**

> 我不会简单地把现有政策文档全部换一批。扩展到医保或公积金时，首先要重新定义领域 schema 和最小必要信息，因为不同业务的关键字段、资格条件、计算方式和地区差异不同。
>
> 
> 第二，要重新梳理哪些逻辑适合规则化，哪些只是政策解释。第三，要建立新的政策 source taxonomy、版本管理和 benchmark，不能直接复用社保的 gold labels。第四，要重新设计权限和隐私边界，因为不同业务涉及的个人信息和可执行动作不同。
>
> 
> Agent runtime、trace 和 E2E 框架可以复用，但领域规则、知识库、画像 schema、评测集和安全策略必须重新验证。

#### 问题 88：这个项目最能证明你适合 Agent 岗位的能力是什么？

**面试逐字稿：**

> 我认为最能证明的是三种能力的结合。第一是模型能力边界判断：知道什么交给 LLM，什么不能交给 LLM；第二是系统工程能力：能把意图、计划、工具、规则、RAG、记忆和校验连接成可运行链路；第三是评测和复盘能力：不是看到模型能回答就结束，而是能通过 trace、E2E 和 bad case 找到根因并形成回归。
>
> 
> 这个项目让我形成了一个比较明确的工作方式：先定义业务风险，再设计责任边界；先建立最小闭环，再用反例推动工程化；最后用指标和 trace 判断优化到底改善了哪一层，而不是只凭主观感觉调 Prompt。

### M 类：Prompt、Runtime 取舍、事实冲突与 Agent 生态

这一类问题是对前面所有模块的横向串联。面试官问 Prompt，通常不是想听“我写了一个很长的 system prompt”；问框架，也不是想听“我觉得自己写得更灵活”。真正要回答的是：**模型在什么上下文里做什么决策，哪些决策被服务端硬性裁剪，错误从哪里被发现，框架和协议分别位于哪一层。**

#### 问题 89：这个项目的 Prompt 到底是怎么设计的？由哪些部分组成？

**30 秒短答：**

> 我的 Prompt 不是一段孤立的业务说明，而是由系统规则、工具契约、动态事实、当前 Execution Plan、用户原话和输出校验要求共同组成。System Prompt 负责定义高风险边界，工具描述负责定义能力和前置条件，动态上下文提供当前状态，Plan 限制当前任务允许做什么，用户消息提供原始意图和事实，最终 Guardrail 再检查模型输出是否真的有工具和证据支撑。也就是说，Prompt 负责把模型放进正确的责任边界里，但真正的安全门禁仍然由服务端校验和规则引擎承担。

**面试逐字稿：**

> 我会把当前项目的 Prompt 看成一个“上下文协议”，而不是一段提示词。它至少有六层。
>
> 第一层是 System Prompt，也就是稳定的业务规则和角色边界。这里会明确：个人化问题必须先做必要信息评估；信息不完整时不能调用 `computePlan`；政策问题要调用政策检索；混合问题要同时满足计算证据和政策 citation；没有 ready 的计算结果时不能输出个人化数字；模型不能把工具名、内部状态和实现细节直接暴露给普通用户；最终回答还要做证据自检。
>
> 第二层是工具契约。工具不只是一个函数名和参数 schema，还要告诉模型这个工具能做什么、不能做什么、什么时候调用、成功和失败分别意味着什么。例如 `assessRequiredInfo` 的结果不是简单的 true/false，而是 `ready`、`needs_more_info`、`missingFields` 和必要字段说明；`computePlan` 的结果除了数字，还应该有 `status`、规则版本和 trace；`retrievePolicy` 要返回 citation、来源类型、版本和降级状态。工具描述越接近业务契约，模型越容易形成正确的调用预期。
>
> 第三层是动态上下文，也就是当前用户画像、Memory V2 摘要、会话摘要、历史工具事实、上下文压缩统计和待确认问题。这里最重要的是把这些内容作为“数据”注入，而不是让它们看起来像新的系统指令。用户显式事实、模型推断和工具派生结果要分区，并且带上来源和状态，避免模型把摘要中的一句推断当成确认事实。
>
> 第四层是 Execution Plan。它告诉模型当前请求被识别成 `personal_plan`、`policy_explanation`、`mixed`、`profile_update` 还是 `general`，计划状态是 `ready`、`needs_more_info` 还是 `no_tool_required`，以及接下来应该完成哪些步骤。当前版本的计划主要由服务端根据意图信号和画像状态确定性生成，再注入模型；我不会把它包装成 LLM 完全自由生成的计划。
>
> 第五层是用户原始消息。它既包含用户要完成的任务，也可能包含个人事实、修改、冲突、拒绝追问或 Prompt Injection。用户消息可以表达需求和事实，但不能修改系统规则、工具权限、政策版本或安全门禁。所以用户原话需要保留原始性，但不能获得比 System Prompt 更高的控制权。
>
> 第六层是输出责任。模型要先给结论，再给依据和限制；个人化数字只能来自 ready 的规则结果；政策数字必须有相应 citation；不确定、冲突、降级和未覆盖能力要显式表达；不能为了让答案完整而补一个看似合理的数字。当前实现的回答校验主要在生成完成后执行，所以这层是生成约束加后置检查，不是单靠 Prompt 就完成阻断。

可以把当前上下文抽象成下面这张责任表：

| 上下文部分 | 主要内容 | 解决的问题 | 信任级别 | 当前实现中的作用 |
|---|---|---|---|---|
| System Prompt | 业务边界、禁止行为、回答原则 | 让模型知道什么不能做 | 最高的模型侧规则 | `SYSTEM_PROMPT` |
| Tool description/schema | 工具能力、参数、状态、失败语义 | 减少错误调用和错误参数 | 工具契约，不等于授权 | 模型工具调用入口 |
| Dynamic Context | profile、summary、tool facts、压缩信息 | 提供当前状态和历史事实 | 按来源分层 | `buildContextPrompt` |
| Execution Plan | 意图、步骤、状态、前置条件 | 把开放式请求变成受约束任务 | 服务端生成的业务状态 | 计划注入模型并记录 |
| User Message | 原始问题和用户显式信息 | 完成自然语言理解 | 不可直接改写系统规则 | 当前轮任务输入 |
| Guardrail | claim、工具状态、citation 对齐 | 检查模型到底说了什么 | 服务端校验 | 当前主要是后置检查 |

**我在 Prompt 中重点考虑了五个设计原则：**

1. **规则要写成动作前置条件，而不是泛泛提醒。** “请谨慎回答”很弱；“`needs_more_info` 时不要调用 `computePlan`，也不要输出个人化数字”才对应一个可检查的不变量。
2. **失败语义必须写清楚。** 工具返回空结果、降级、冲突和系统错误时，模型应该分别追问、谨慎解释、提示版本冲突或停止，而不是把所有失败都当成“没有查到”或者继续猜测。
3. **最小必要信息要和任务绑定。** 纯政策问题不应因为画像缺字段而追问；要精确到月份的个人测算才要求出生月份；4050 初筛需要的字段也不应被养老金金额任务混用。
4. **事实和指令要分离。** 政策文档、用户提供的长文本、工具返回的 excerpt 都是数据，不因为里面出现“忽略之前指令”就升级成系统规则。
5. **每条高风险 claim 都要有落点。** Prompt 不能只要求“引用来源”，而要让模型知道个人化数字、政策数字、官方声明分别应该对应哪类 evidence。

**我不会采用的 Prompt 写法：**

- 只写“你是一个专业、严谨、不会出错的社保专家”——没有状态、前置条件和可验证动作；
- 把所有历史对话原样塞进上下文——增加 token，却没有区分确认事实、推断和派生结果；
- 在工具 schema 中把缺失字段设成普通默认值，再期待模型自己记得不要使用默认值；
- 写几十条互相没有优先级的禁止事项——模型可能记住措辞，却不知道当前状态下下一步是什么；
- 只在生成前提醒，不记录工具事件和输出 claim——最终无法证明模型是否真的遵守。

**面试官追问：Prompt 中的 System Prompt 和动态上下文发生冲突时怎么办？**

> 我会把动态画像、摘要、检索文本和用户消息都当成低于 System Prompt 的数据输入。比如历史摘要写着“用户可能是女干部”，但当前画像没有用户确认，这句话最多作为待确认线索，不能放行退休计算。更进一步，服务端不应该只依赖模型自行理解优先级，而是把高风险前置条件写进工具授权和工具内部校验。Prompt 负责引导，状态和证据负责裁决。

**当前边界：**

> 当前 Prompt 的具体措辞和动态上下文已经参与真实运行，但它不是形式化验证系统，也不是完整的 Policy-as-Code。计划主要由服务端确定性生成，Guardrail 主要是生成后的检测和事件记录；如果要做生产级提交前阻断，我会把模型先输出成结构化 answer draft，再做 claim-evidence 校验，通过后才提交给用户。

#### 问题 90：哪一段 Prompt 是真实失败后特意添加或强化的？请讲一个具体 Bad Case。

**面试逐字稿：**

> 最典型的失败是用户只说：“我是 1977 年出生的男性，我什么时候退休？”用户没有提供出生月份，也没有提供累计缴费月份。早期版本虽然在业务说明里写过“不要擅自补全信息”，但工具 schema 需要结构化参数，模型为了调用工具，实际传入过类似下面的参数：
>
> ```json
> {
>   "birthYear": 1977,
>   "birthMonth": 1,
>   "gender": "male",
>   "paidMonths": 0
> }
> ```
>
> 这些值对类型校验来说都是合法的，所以规则引擎返回了 `ready`，最终答案出现了具体退休数字。真正的问题不是规则函数算错，而是模型把“没有证据的补值”伪装成了工具输入。`birthMonth=1` 和 `paidMonths=0` 是 schema 合法值，不是用户事实。
>
> 这个 Bad Case 之后，我强化的不是一句孤立的“不要补值”，而是一组相互配合的 Prompt 规则：第一，个人化问题先调用 `assessRequiredInfo`；第二，评估返回 `needs_more_info` 时只能追问，禁止 `computePlan`；第三，没有 ready 的 `computePlan`，不能在回答中出现个人化数字；第四，工具计算和政策检索职责分离；第五，回答前必须检查数字和证据是否一致；第六，必须遵循显式 Execution Plan。
>
> 但我不会把这个问题说成只靠改 Prompt 就解决了。Prompt 是概率性约束，真正的修复还包括三层服务端保护：在 `computePlan` 内部重新检查字段是否有用户证据；把“字段格式合法”和“字段来源可信”分开；在 E2E 中增加 forbidden tool 断言，缺关键字段时即使最终文本看起来谨慎，只要实际调用了 `computePlan` 也算失败。

**从发现到修复的排查过程：**

1. **先确认最终答案不是偶然文本问题。** 保留原始用户消息、计划、工具调用、工具参数、规则结果和最终文本，发现参数中出现了用户从未说过的月份和缴费月数。
2. **再看 schema。** 发现 schema 只检查 `birthMonth` 是 1～12、`paidMonths` 是非负整数，并没有检查“该值是否在当前消息或已确认画像中出现”。
3. **再看计划。** 计划本来应该是 `needs_more_info`，但模型没有先走信息评估，直接调用了计算工具；说明模型可见的计划约束没有转化成硬门禁。
4. **最后看持久化。** 如果把这次参数或结果直接写进长期画像，下一轮用户只说“继续算”，错误月份还会被再次使用，形成跨轮污染。

**修复后的不变量：**

```text
missing_high_impact_field => plan.status = needs_more_info
missing_high_impact_field => computePlan is forbidden
computePlan.ready => every input has user/profile evidence
personalized_numeric_claim => has ready computePlan evidence
derived_tool_fact => cannot be promoted to confirmed profile fact
```

**回归方法：**

- 用原始 Bad Case 做固定回归；
- 把出生月份分别替换成缺失、明确为 1 月、说“可能是 1 月”、前后冲突四种输入；
- 检查工具序列、参数来源、`ready` 状态、最终数字和长期画像是否全部符合预期；
- 重复调用真实模型，统计 forbidden tool rate 和 unsupported numeric claim rate，而不是只看某一次回答是否追问。

**关于“哪一行是失败后加的”的诚实说法：**

> 我没有保留每一次 Prompt 修改的完整 commit diff，所以不会声称某一句文字是在某个精确提交中加入的。但从失败演化上，可以明确说：`assessRequiredInfo` 前置、`needs_more_info` 禁止计算、ready 结果才能输出个人数字、最终 evidence 自检和显式 Plan 约束，都是被这个“模型补 1 月和 0 个月”的真实失败逼出来并逐步强化的。最终解决它的也不是 Prompt 单点，而是 Prompt、工具契约、服务端 evidence gate、Memory 隔离和 E2E 断言共同形成的闭环。

**面试官可能追问：为什么只增加一句“不要补默认值”不够？**

> 因为模型面对结构化工具时仍然有完成参数的压力；“1 月”和“0 个月”在语法上是合法值，模型可能认为自己是在填充缺省参数。更关键的是，哪怕模型完全理解了提示词，服务端也不能信任模型声称“这个字段是用户提供的”。所以我会把提示词作为意图约束，把证据来源作为服务端可验证状态，不能用一段更长的 Prompt 替代业务闸门。

#### 问题 91：如何评估 Prompt 是否真的有效，而不是换了措辞后刚好答对？

**面试逐字稿：**

> 我不会只比较两版 Prompt 的最终文本是否更像标准答案，而是做 Prompt ablation，并把工具路径和高风险 claim 作为主要指标。
>
> 首先固定模型版本、temperature、工具 schema、规则版本、RAG 数据版本、上下文模板和评测集，避免把模型或数据变化误认为 Prompt 改善。然后至少比较五组：原始 Prompt；只加入“不要补值”；加入信息评估和前置条件；再加入 evidence/source 约束；最后加入显式 Execution Plan 和输出自检。
>
> 对每组 Prompt，我会在相同 case 上重复运行，重点看几个指标：缺字段时的 forbidden tool rate，个人化数字无规则证据的 unsupported claim rate，必要字段识别召回率，重复追问率，工具参数的证据准确率，以及在安全约束下任务是否仍然完成，也就是 safe helpfulness。对于正常场景，还要看完整画像是否真的能完成计算，不能为了降低违规率把系统调成过度拒答。
>
> 我会把指标分成硬指标和软指标。硬指标包括：缺出生月份不能调用 `computePlan`、没有 ready 结果不能输出个人数字、要求官方依据时必须有官方 citation、冲突字段不能静默覆盖。硬指标只要一次违反，就记录为该次运行失败。软指标包括回答是否自然、追问是否简洁、结论是否先说、用户是否知道下一步，这些可以用人工或经过校准的 LLM judge 评分。

**Prompt ablation 示例：**

| 版本 | 额外约束 | 可能观察到的结果 | 解释 |
|---|---|---|---|
| P0 | 领域说明 + 工具描述 | 能回答，但可能直接计算 | 基线，知道业务，不知道证据闸门 |
| P1 | 增加“不要补值” | 部分减少默认值 | 仍然没有明确下一步和服务端授权 |
| P2 | 增加 `assessRequiredInfo` 前置 | 工具顺序改善 | 把规则写成可执行步骤 |
| P3 | 增加 ready/evidence/citation 约束 | 无依据数字下降 | 输出与证据开始绑定 |
| P4 | 加入动态 Plan、状态和失败语义 | 混合请求和降级更稳定 | 模型获得当前任务状态 |
| P5 | P4 + 服务端 gate | 关键违规被硬性拒绝 | Prompt 不再承担唯一安全责任 |

**一个容易被忽略的坏结果：**

> 如果只看 unsupported claim rate，P4 可能看起来比 P0 好，但它也可能把所有女性用户都要求补充退休身份，或者政策问题也追问完整画像，导致任务完成率下降。因此我会同时看 `missing_info_recall`、`duplicate_question_rate`、`subtask_completion_rate` 和 `over_refusal_rate`。Prompt 优化不是越保守越好，而是让系统在该拒绝的地方拒绝、该回答的地方完成。

**面试官追问：你怎么知道是 Prompt 变好了，而不是模型随机性变小了？**

> 在相同模型和参数下对每个 case 重复多次，报告平均值、最差运行和硬约束全通过率；如果资源允许，再使用固定随机种子或低 temperature 做确定性回归。对高风险 case，我更关心“是否所有重复运行都没有 forbidden tool”，而不是平均通过率。只有 Prompt、模型、工具和数据版本都冻结，比较才有解释性。

**当前边界：**

> 当前项目确实做了真实 E2E 和失败回放，但并不是一套完整的统计显著性研究，也没有把所有 Prompt 版本的指标都整理成公开 benchmark。因此面试时我会把历史真实结果、当前可验证结果和建议的 ablation 方案分开说，不虚构一张不存在的 Prompt 实验表。

#### 问题 92：为什么不直接使用 LangChain、LangGraph 这样的成熟框架，而要自己搭建 Runtime？

**30 秒短答：**

> 不是因为 LangChain 或 LangGraph 不好，而是当前项目的核心难点不是缺少一个 Agent 抽象，而是高风险事实、工具前置条件、规则版本、citation 和记忆投影必须由我直接控制。当前实现是在 AI SDK 的模型和工具能力之上，自建了领域 Runtime：自己定义 Plan、工具事件、状态和证据关系。这样前期能快速验证业务边界，但代价是循环、恢复、持久化和可观测性也需要自己维护。若流程继续扩大，我会考虑用 LangGraph 承担通用状态编排，同时保留领域规则和证据门禁。

**面试逐字稿：**

> 我会先把“框架是否成熟”和“当前项目为什么自建”分开。LangChain 更偏模型、工具、Retriever、Prompt 等组件和集成；LangGraph 更偏有状态、可恢复、可分支、可循环的 Agent workflow。它们可以解决很多通用工程问题，但不会自动知道退休年龄、女性退休身份、政策有效期、缺字段不能计算、citation 是否支持 claim 这些领域约束。
>
> 当前项目的流程相对窄，核心依赖关系也比较明确：个人化请求先评估信息，完整后计算；政策请求检索并保留来源；混合请求分别完成计算和政策证据；回答完成后检查 claim。为了从零验证这些责任边界，我选择在 AI SDK 的 `streamText`、工具调用和 step limit 之上，自定义 `Execution Plan`、工具事件、状态判断、Memory V2 投影和 Guardrail 事件。这里的“自建 Runtime”不是自己实现大模型推理，也不是重复造所有框架，而是把最关键的领域状态和安全约束掌握在服务端。
>
> 自建带来的直接收益是控制面很清楚：我可以把 `plan.status`、`missingFields`、`forbiddenTools`、`policyVersion`、`citation`、`toolFacts` 和 `guardrail` 放在同一条 trace 里；可以在 `computePlan` 内部二次检查字段证据；可以决定哪些结果允许投影进长期记忆；也可以为真实 E2E 定义业务不变量，而不是只依赖框架的通用成功状态。
>
> 但它的代价也很明显。框架已经解决的状态图、checkpoint、重试、人工介入、并发恢复、可视化和生态集成，我需要自己补；如果未来流程扩展到几十个状态、跨天任务、人工审核和多 Agent 协作，自建 Runtime 的维护成本会迅速上升。所以这不是“自建永远优于框架”的结论，而是当前阶段以业务约束验证为主的取舍。

| 维度 | 当前自建 Runtime | LangChain | LangGraph |
|---|---|---|---|
| 主要定位 | 领域流程和安全状态的直接控制 | 模型、工具、检索等组件集成 | 有状态 Agent/workflow 编排 |
| 当前项目适配点 | Plan、证据闸门、规则版本、Memory 投影可直接内嵌 | 可复用模型和 Retriever 集成 | 可表达分支、循环、恢复和人工介入 |
| 需要自己补的内容 | 状态图、checkpoint、重试、trace UI、持久化 | 领域安全策略仍需自己补 | 领域规则、证据和权限仍需自己补 |
| 前期成本 | 低到中，代码少时迭代快 | 中，组件学习和组合成本 | 中到高，需要理解状态图和持久化 |
| 长期风险 | 自己维护的基础设施越来越多 | 抽象层和依赖升级带来的适配成本 | 图复杂度、状态迁移和运维成本 |
| 我会怎么选 | 当前原型和领域验证 | 需要大量现成集成时 | 生产化复杂流程或长运行任务 |

**面试官追问：你是不是为了“自己写”而拒绝成熟框架？**

> 不是。我会把通用能力和领域能力分开。模型调用、流式输出、工具注册等能力可以使用成熟 SDK；如果引入 LangGraph，我也不会把规则和安全交给框架默认处理。当前自建的原因是项目最早要回答“什么状态和证据约束才是正确的”，而不是“如何把一个复杂通用图搭出来”。验证完这些边界后，迁移到 LangGraph 反而更有基础，因为每个节点的输入、输出、前置条件和失败状态已经定义清楚了。

**如果流程扩大到生产级，我的迁移方案：**

1. 把当前 `ExecutionPlan` 编译为图节点和条件边，明确每个节点的输入、输出、重试和恢复状态；
2. 使用 checkpoint 保存 conversation、plan、tool facts、policy version 和待人工确认状态；
3. 对高风险节点加入 human-in-the-loop 或服务端审批；
4. 把现有规则引擎、RAG citation、evidence gate 作为领域节点保留，不让通用框架覆盖它们；
5. 用旧 Runtime 的 E2E 回归集对迁移前后做行为等价性验证。

**当前边界：**

> 当前项目没有实际迁移到 LangGraph，也没有使用 LangChain 的完整 Agent 抽象。我会把它们作为框架选择和生产化方向来讨论，不把“未来可以迁移”说成“已经接入”。

#### 问题 93：如果用户和 AI 对同一个事实说法冲突，系统应该听谁的？

**核心原则：**

> 用户显式陈述优先于模型推断；已确认的新用户事实优先于旧的已确认事实，但高影响字段发生冲突时不能静默覆盖；工具派生结果不参与用户事实裁决，用户事实一旦变化，依赖它的旧结果必须失效；政策文本决定适用规则，不决定用户个人输入。

可以把事实来源和状态分成下面几类：

| 类型 | 例子 | 是否可以参与个人化计算 | 冲突时处理 |
|---|---|---|---|
| 用户明确陈述 | “我 1977 年 3 月出生” | 通过格式和语义校验后可以 | 作为高优先级事实 |
| 用户不确定陈述 | “我好像是 1977 年” | 不直接作为 confirmed | 追问确认 |
| 模型推断 | 根据语境猜测“可能是女干部” | 不能直接作为高风险输入 | 降为 inferred，不写入 confirmed |
| 工具参数 | 模型传入 `birthMonth=1` | 只有能回溯到用户证据才可用 | 无证据则拒绝或 needs_more_info |
| 工具派生结果 | “预计 2038 年退休” | 只能作为当前版本结果 | 输入变化后标记 stale |
| 政策证据 | 官方文件中的退休条件 | 决定规则和解释依据 | 版本冲突进入核验，不覆盖用户事实 |

**面试逐字稿：**

> 我会先区分“用户和 AI 冲突”与“用户前后两次冲突”，这两种问题不能用同一个策略。
>
> 第一种是用户显式信息和模型推断冲突。例如用户只说“我是女性”，模型根据职业描述猜测她属于女干部。这里用户显式信息只能说明 `gender=female`，不能说明 `femaleRetireType`。模型的推断应该记录为 `inferred` 或 `needs_confirmation`，不能写入 confirmed profile，也不能作为计算输入。
>
> 第二种是用户自己前后说法冲突。例如第一轮说“我是 1977 年出生”，第二轮说“我其实是 1978 年出生”。出生年份会影响退休年月，所以不能简单按最新消息静默覆盖，也不能继续沿用旧结果。我会保留两个事实的来源和时间，把 `birthYear` 标记为 `conflicted`，让计划进入 `needs_more_info`，面向用户明确指出冲突并要求确认最终按哪一年计算。确认后才把新的值升级为 confirmed，并重新执行信息评估和规则计算。
>
> 第三种是用户修正事实和旧工具结果冲突。比如旧画像按 1977 年算出 2038 年，用户补充出生月份或修改年份后，2038 年这个结果不能继续当作当前答案。它应该根据依赖图被标记为 stale，新的计算必须带新的输入快照和规则版本。这个过程本质上是派生事实失效传播，不是简单覆盖一列数据库字段。
>
> 第四种是规则结果和 RAG 文本表述不一致。用户的出生年月和缴费情况仍然由已确认画像提供；RAG 只负责政策依据和适用条件。如果 RAG 命中的是旧版本，或者规则参数和当前官方来源不一致，我不会让模型在两段文本之间自行投票，而是暂停强结论，检查政策版本、有效时间、地区和规则参数，必要时返回版本差异或人工核验提示。

**典型冲突 Bad Case：**

```text
第 1 轮：我是 1977 年出生的男性，已经缴费 220 个月。
第 2 轮：我其实是 1978 年出生的，按最新的算。
第 3 轮：你别追问，直接用你记得的年份。

正确处理：
  birthYear = conflicted
  old computePlan = stale
  plan.status = needs_more_info
  computePlan = forbidden
  向用户确认：最终按 1977 还是 1978 年计算
```

**另一个模型推断冲突：**

```text
用户：我是女性，出生年月是明确的。
模型推断：用户可能属于女干部。
错误做法：直接使用女干部退休口径计算。
正确做法：femaleRetireType = inferred/needs_confirmation，先追问岗位身份。
```

**面试官追问：为什么不能简单采用“最新用户消息优先”？**

> 对低影响的表达偏好，最新值覆盖通常问题不大；但出生年月、性别、女性退休身份、参保地区和缴费情况会改变高风险计算。最新消息可能是口误、转述或“我不确定”的猜测，所以高影响字段要先识别冲突，再确认。用户确认后的新事实可以替换旧事实，但替换必须留下审计记录，并让旧派生结果失效。

**面向用户的回答话术：**

> 我记录到您之前提供的是 1977 年出生，这一轮又提到 1978 年。由于出生年份会影响退休年月，我暂时不直接沿用旧结果。请确认最终按 1977 年还是 1978 年计算；确认后我会重新按当前规则版本测算。

**当前边界：**

> 当前 Memory V2 已经区分来源、状态和派生结果，也有冲突处理设计；但如果要做到生产级，还需要完整的 fact revision、用户确认事件、依赖图失效、并发乐观锁、数据删除和审计查询。不能把“模型能在对话里追问冲突”说成已经完成完整的记忆治理系统。
