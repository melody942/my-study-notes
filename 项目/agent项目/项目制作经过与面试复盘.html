<style>
/* ============ 基础变量 ============ */
:root {
  --bg: #ffffff;
  --bg-secondary: #f6f8fa;
  --bg-tertiary: #eaeef2;
  --bg-code: #f0f2f5;
  --bg-hover: #f0f2f5;
  --bg-sidenav: #fafbfc;
  --bg-topbar: rgba(255, 255, 255, 0.85);
  --text: #1f2328;
  --text-secondary: #57606a;
  --text-tertiary: #8b949e;
  --border: #d0d7de;
  --border-light: #e8ecef;
  --accent: #0969da;
  --accent-hover: #0550ae;
  --accent-bg: rgba(9, 105, 218, 0.08);
  --success: #1a7f37;
  --warning: #9a6700;
  --danger: #cf222e;
  --quote-bg: #f6f8fa;
  --quote-border: #d0d7de;
  --table-header-bg: #f6f8fa;
  --table-border: #d0d7de;
  --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.05);
  --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.08);
  --shadow-lg: 0 8px 24px rgba(0, 0, 0, 0.12);
  --radius-sm: 4px;
  --radius-md: 6px;
  --radius-lg: 10px;
  --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
               "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue",
               Helvetica, Arial, sans-serif;
  --font-mono: "SFMono-Regular", Consolas, "Liberation Mono", Menlo,
               "Courier New", monospace;
  --font-serif: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei",
               "Source Han Serif SC", "Noto Serif CJK SC", serif;
  --max-content-width: 880px;
  --sidenav-width: 300px;
  --topbar-height: 56px;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0d1117;
    --bg-secondary: #161b22;
    --bg-tertiary: #21262d;
    --bg-code: #161b22;
    --bg-hover: #161b22;
    --bg-sidenav: #0d1117;
    --bg-topbar: rgba(13, 17, 23, 0.85);
    --text: #e6edf3;
    --text-secondary: #8b949e;
    --text-tertiary: #6e7681;
    --border: #30363d;
    --border-light: #21262d;
    --accent: #58a6ff;
    --accent-hover: #79c0ff;
    --accent-bg: rgba(56, 139, 253, 0.15);
    --success: #3fb950;
    --warning: #d29922;
    --danger: #f85149;
    --quote-bg: #161b22;
    --quote-border: #30363d;
    --table-header-bg: #161b22;
    --table-border: #30363d;
    --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.3);
    --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.4);
    --shadow-lg: 0 8px 24px rgba(0, 0, 0, 0.5);
  }
}

/* 手动主题覆盖 */
html[data-theme="light"] {
  --bg: #ffffff;
  --bg-secondary: #f6f8fa;
  --bg-tertiary: #eaeef2;
  --bg-code: #f0f2f5;
  --bg-hover: #f0f2f5;
  --bg-sidenav: #fafbfc;
  --bg-topbar: rgba(255, 255, 255, 0.85);
  --text: #1f2328;
  --text-secondary: #57606a;
  --text-tertiary: #8b949e;
  --border: #d0d7de;
  --border-light: #e8ecef;
  --accent: #0969da;
  --accent-hover: #0550ae;
  --accent-bg: rgba(9, 105, 218, 0.08);
  --success: #1a7f37;
  --warning: #9a6700;
  --danger: #cf222e;
  --quote-bg: #f6f8fa;
  --quote-border: #d0d7de;
  --table-header-bg: #f6f8fa;
  --table-border: #d0d7de;
  --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.05);
  --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.08);
  --shadow-lg: 0 8px 24px rgba(0, 0, 0, 0.12);
}

html[data-theme="dark"] {
  --bg: #0d1117;
  --bg-secondary: #161b22;
  --bg-tertiary: #21262d;
  --bg-code: #161b22;
  --bg-hover: #161b22;
  --bg-sidenav: #0d1117;
  --bg-topbar: rgba(13, 17, 23, 0.85);
  --text: #e6edf3;
  --text-secondary: #8b949e;
  --text-tertiary: #6e7681;
  --border: #30363d;
  --border-light: #21262d;
  --accent: #58a6ff;
  --accent-hover: #79c0ff;
  --accent-bg: rgba(56, 139, 253, 0.15);
  --success: #3fb950;
  --warning: #d29922;
  --danger: #f85149;
  --quote-bg: #161b22;
  --quote-border: #30363d;
  --table-header-bg: #161b22;
  --table-border: #30363d;
  --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.3);
  --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.4);
  --shadow-lg: 0 8px 24px rgba(0, 0, 0, 0.5);
}

/* ============ 基础重置 ============ */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
  scroll-padding-top: calc(var(--topbar-height) + 20px);
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
}

body {
  font-family: var(--font-sans);
  background: var(--bg);
  color: var(--text);
  line-height: 1.7;
  font-size: 16px;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  transition: background-color 0.25s ease, color 0.25s ease;
  overflow-x: hidden;
}

/* ============ 顶部导航栏 ============ */
.topbar {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  height: var(--topbar-height);
  background: var(--bg-topbar);
  backdrop-filter: saturate(180%) blur(16px);
  -webkit-backdrop-filter: saturate(180%) blur(16px);
  border-bottom: 1px solid var(--border-light);
  z-index: 100;
  display: flex;
  align-items: center;
  padding: 0 16px;
  gap: 12px;
}

.topbar__menu-btn,
.topbar__theme-btn,
.topbar__top-btn {
  background: transparent;
  border: 1px solid transparent;
  color: var(--text-secondary);
  width: 36px;
  height: 36px;
  border-radius: var(--radius-md);
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  transition: all 0.2s ease;
  flex-shrink: 0;
}

.topbar__menu-btn:hover,
.topbar__theme-btn:hover,
.topbar__top-btn:hover {
  background: var(--bg-hover);
  color: var(--text);
}

.topbar__menu-btn svg,
.topbar__theme-btn svg,
.topbar__top-btn svg {
  width: 20px;
  height: 20px;
}

.topbar__title {
  flex: 1;
  min-width: 0;
  font-size: 14px;
  font-weight: 600;
  color: var(--text);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  letter-spacing: 0.2px;
}

.topbar__title a {
  color: inherit;
  text-decoration: none;
}

.topbar__search {
  position: relative;
  flex: 0 1 280px;
  max-width: 280px;
}

.topbar__search input {
  width: 100%;
  height: 32px;
  padding: 0 32px 0 32px;
  background: var(--bg-secondary);
  border: 1px solid var(--border-light);
  border-radius: var(--radius-md);
  color: var(--text);
  font-size: 13px;
  font-family: inherit;
  outline: none;
  transition: all 0.2s ease;
}

.topbar__search input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-bg);
}

.topbar__search input::placeholder {
  color: var(--text-tertiary);
}

.topbar__search-icon {
  position: absolute;
  left: 10px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--text-tertiary);
  pointer-events: none;
  width: 14px;
  height: 14px;
}

.topbar__search-clear {
  position: absolute;
  right: 6px;
  top: 50%;
  transform: translateY(-50%);
  background: transparent;
  border: none;
  color: var(--text-tertiary);
  cursor: pointer;
  padding: 4px;
  border-radius: var(--radius-sm);
  display: none;
  align-items: center;
  justify-content: center;
}

.topbar__search-clear.visible {
  display: inline-flex;
}

.topbar__search-clear:hover {
  color: var(--text);
  background: var(--bg-hover);
}

.topbar__search-clear svg {
  width: 12px;
  height: 12px;
}

.topbar__progress {
  position: absolute;
  bottom: -1px;
  left: 0;
  height: 2px;
  background: var(--accent);
  transition: width 0.1s ease;
  width: 0%;
}

/* ============ 侧边栏 ============ */
.sidenav {
  position: fixed;
  top: var(--topbar-height);
  left: 0;
  bottom: 0;
  width: var(--sidenav-width);
  background: var(--bg-sidenav);
  border-right: 1px solid var(--border-light);
  overflow-y: auto;
  overflow-x: hidden;
  padding: 20px 12px 60px 16px;
  z-index: 50;
  transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}

.sidenav::-webkit-scrollbar {
  width: 8px;
}

.sidenav::-webkit-scrollbar-track {
  background: transparent;
}

.sidenav::-webkit-scrollbar-thumb {
  background: var(--border);
  border-radius: 4px;
}

.sidenav::-webkit-scrollbar-thumb:hover {
  background: var(--text-tertiary);
}

.sidenav__title {
  font-size: 12px;
  font-weight: 600;
  color: var(--text-secondary);
  text-transform: uppercase;
  letter-spacing: 0.8px;
  padding: 0 8px 8px 8px;
  margin-top: 4px;
}

.sidenav__title:not(:first-child) {
  margin-top: 20px;
}

.sidenav__list {
  list-style: none;
}

.sidenav__item {
  margin: 1px 0;
}

.sidenav__link {
  display: block;
  padding: 5px 12px;
  color: var(--text-secondary);
  text-decoration: none;
  font-size: 13.5px;
  line-height: 1.5;
  border-radius: var(--radius-sm);
  border-left: 2px solid transparent;
  transition: all 0.18s ease;
  cursor: pointer;
  word-break: break-word;
}

.sidenav__link:hover {
  background: var(--bg-hover);
  color: var(--text);
}

.sidenav__link.active {
  background: var(--accent-bg);
  color: var(--accent);
  border-left-color: var(--accent);
  font-weight: 500;
}

/* 当 active 项位于折叠的祖先下时，自动展开 */
.sidenav__item .sidenav__link.active {
  /* 占位：展开逻辑通过 JS 添加 expanded 类实现 */
}

/* 当祖先处于 filter 模式或搜索命中时强制展开已通过其它规则处理 */
.sidenav__item:has(> .sidenav__link.active) {
  /* 自身保持 */
}

/* 当子孙有 active 时，强制展开自己 */
.sidenav__item:has(.sidenav__link.active) > .sidenav__sublist {
  display: block;
}

.sidenav__item:has(.sidenav__link.active) > .sidenav__link > .sidenav__toggle {
  transform: rotate(90deg);
}

.sidenav__link.level-1 {
  font-weight: 600;
  color: var(--text);
  font-size: 14px;
  padding-top: 8px;
  padding-bottom: 8px;
}

.sidenav__link.level-2 {
  padding-left: 20px;
  font-size: 13.5px;
}

.sidenav__link.level-3 {
  padding-left: 32px;
  font-size: 13px;
  color: var(--text-secondary);
}

.sidenav__link.level-4 {
  padding-left: 44px;
  font-size: 12.5px;
  color: var(--text-tertiary);
}

.sidenav__link.level-5 {
  padding-left: 56px;
  font-size: 12.5px;
  color: var(--text-tertiary);
}

.sidenav__link.hidden {
  display: none;
}

/* ============ 目录折叠/展开 ============ */
.sidenav__item.has-children > .sidenav__link {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 6px;
}

.sidenav__link-text {
  flex: 1;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
}

.sidenav__toggle {
  flex-shrink: 0;
  width: 16px;
  height: 16px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border-radius: var(--radius-sm);
  color: var(--text-tertiary);
  transition: transform 0.18s ease, color 0.18s ease, background 0.18s ease;
}

.sidenav__toggle svg {
  width: 10px;
  height: 10px;
}

.sidenav__toggle:hover {
  background: var(--bg-hover);
  color: var(--text);
}

.sidenav__item.expanded > .sidenav__link > .sidenav__toggle {
  transform: rotate(90deg);
}

.sidenav__item.collapsed > .sidenav__sublist {
  display: none;
}

.sidenav__sublist {
  list-style: none;
  margin: 0;
  padding: 0;
}

/* ============ 收藏/掌握标记按钮 ============ */
.sidenav__link-actions {
  flex-shrink: 0;
  display: inline-flex;
  align-items: center;
  gap: 2px;
  margin-left: 4px;
}

.sidenav__mark-btn {
  background: transparent;
  border: none;
  width: 18px;
  height: 18px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  color: var(--text-tertiary);
  opacity: 0.35;
  transition: opacity 0.15s ease, color 0.15s ease, background 0.15s ease;
  padding: 0;
}

.sidenav__mark-btn:hover {
  opacity: 1;
  background: var(--bg-hover);
}

.sidenav__mark-btn svg {
  width: 12px;
  height: 12px;
}

.sidenav__mark-btn.starred {
  opacity: 1;
  color: var(--warning);
}

.sidenav__mark-btn.mastered {
  opacity: 1;
  color: var(--success);
}

/* 收藏/掌握标记显示在主标题上 */
.sidenav__link.starred::before,
.sidenav__link.mastered::after {
  content: '';
  display: inline-block;
  width: 6px;
  height: 6px;
  border-radius: 50%;
  margin-right: 6px;
  vertical-align: middle;
}

.sidenav__link.starred::before {
  background: var(--warning);
}

/* 当筛选为「已收藏」或「已掌握」时，未命中的隐藏 */
.sidenav__filter-mode .sidenav__item:not(.filter-match) {
  display: none;
}

/* 筛选模式下，匹配项的祖先链必须显示 */
.sidenav__filter-mode .sidenav__item.filter-match,
.sidenav__filter-mode .sidenav__item.ancestor-of-match {
  display: block;
}

.sidenav__filter-mode .sidenav__item.ancestor-of-match > .sidenav__link .sidenav__toggle {
  transform: rotate(90deg);
}

.sidenav__filter-mode .sidenav__item.ancestor-of-match > .sidenav__sublist {
  display: block;
}

/* ============ 筛选栏 ============ */
.sidenav__filter {
  display: flex;
  gap: 4px;
  padding: 0 8px 12px 8px;
  margin-bottom: 4px;
  border-bottom: 1px solid var(--border-light);
  flex-wrap: wrap;
}

.sidenav__filter-btn {
  background: transparent;
  border: 1px solid var(--border);
  color: var(--text-secondary);
  font-size: 12px;
  padding: 4px 8px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 3px;
  transition: all 0.15s ease;
  white-space: nowrap;
}

.sidenav__filter-btn:hover {
  background: var(--bg-hover);
  color: var(--text);
}

.sidenav__filter-btn.active {
  background: var(--accent-bg);
  border-color: var(--accent);
  color: var(--accent);
  font-weight: 500;
}

.sidenav__filter-count {
  font-size: 11px;
  opacity: 0.7;
}

.sidenav__filter-actions {
  margin-left: auto;
  display: inline-flex;
  gap: 4px;
}

.sidenav__filter-action {
  background: transparent;
  border: none;
  color: var(--text-tertiary);
  font-size: 11px;
  cursor: pointer;
  padding: 4px 6px;
  border-radius: var(--radius-sm);
}

.sidenav__filter-action:hover {
  background: var(--bg-hover);
  color: var(--text);
}

.sidenav__empty {
  padding: 12px 8px;
  color: var(--text-tertiary);
  font-size: 13px;
  font-style: italic;
  display: none;
}

.sidenav__empty.visible {
  display: block;
}

.sidenav__overlay {
  display: none;
  position: fixed;
  top: var(--topbar-height);
  left: 0;
  right: 0;
  bottom: 0;
  background: rgba(0, 0, 0, 0.4);
  z-index: 49;
  opacity: 0;
  transition: opacity 0.3s ease;
}

.sidenav__overlay.visible {
  display: block;
  opacity: 1;
}

/* ============ 主内容区 ============ */
.content {
  margin-left: var(--sidenav-width);
  padding: calc(var(--topbar-height) + 32px) 32px 80px 32px;
  max-width: calc(var(--max-content-width) + var(--sidenav-width) + 64px);
  min-height: 100vh;
}

.content__inner {
  max-width: var(--max-content-width);
  margin: 0 auto;
}

/* ============ 文档标题 ============ */
.doc-header {
  margin-bottom: 48px;
  padding-bottom: 32px;
  border-bottom: 2px solid var(--border-light);
}

.doc-header h1 {
  font-size: 32px;
  font-weight: 700;
  line-height: 1.3;
  color: var(--text);
  margin-bottom: 16px;
  letter-spacing: -0.5px;
}

.doc-header__meta {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  font-size: 13px;
  color: var(--text-secondary);
  align-items: center;
}

.doc-header__meta-item {
  display: inline-flex;
  align-items: center;
  gap: 6px;
}

.doc-header__meta-item svg {
  width: 14px;
  height: 14px;
  color: var(--text-tertiary);
}

.doc-header__divider {
  color: var(--border);
}

/* ============ Markdown 内容样式 ============ */
.markdown-body {
  color: var(--text);
  font-size: 16px;
  line-height: 1.8;
  word-wrap: break-word;
}

.markdown-body > *:first-child {
  margin-top: 0;
}

.markdown-body h1,
.markdown-body h2,
.markdown-body h3,
.markdown-body h4,
.markdown-body h5,
.markdown-body h6 {
  font-weight: 600;
  line-height: 1.3;
  margin-top: 2.5em;
  margin-bottom: 0.8em;
  color: var(--text);
  scroll-margin-top: calc(var(--topbar-height) + 16px);
  letter-spacing: -0.2px;
}

.markdown-body h1 {
  font-size: 28px;
  padding-bottom: 0.4em;
  border-bottom: 1px solid var(--border-light);
  margin-top: 0;
  font-weight: 700;
}

.markdown-body h2 {
  font-size: 22px;
  padding-bottom: 0.3em;
  border-bottom: 1px solid var(--border-light);
  margin-top: 2.8em;
}

.markdown-body h3 {
  font-size: 19px;
  margin-top: 2.2em;
}

.markdown-body h4 {
  font-size: 16.5px;
  margin-top: 2em;
}

.markdown-body h5 {
  font-size: 15px;
  color: var(--text-secondary);
}

.markdown-body h6 {
  font-size: 14px;
  color: var(--text-secondary);
}

.markdown-body h1 .heading-anchor,
.markdown-body h2 .heading-anchor,
.markdown-body h3 .heading-anchor,
.markdown-body h4 .heading-anchor,
.markdown-body h5 .heading-anchor,
.markdown-body h6 .heading-anchor {
  opacity: 0;
  margin-left: 8px;
  color: var(--text-tertiary);
  text-decoration: none;
  font-size: 0.85em;
  transition: opacity 0.2s ease, color 0.2s ease;
}

.markdown-body h1:hover .heading-anchor,
.markdown-body h2:hover .heading-anchor,
.markdown-body h3:hover .heading-anchor,
.markdown-body h4:hover .heading-anchor,
.markdown-body h5:hover .heading-anchor,
.markdown-body h6:hover .heading-anchor {
  opacity: 1;
}

.markdown-body h1 .heading-anchor:hover,
.markdown-body h2 .heading-anchor:hover,
.markdown-body h3 .heading-anchor:hover,
.markdown-body h4 .heading-anchor:hover,
.markdown-body h5 .heading-anchor:hover,
.markdown-body h6 .heading-anchor:hover {
  color: var(--accent);
}

.markdown-body p {
  margin: 0 0 1em 0;
}

.markdown-body p:last-child {
  margin-bottom: 0;
}

.markdown-body a {
  color: var(--accent);
  text-decoration: none;
  border-bottom: 1px solid transparent;
  transition: border-color 0.18s ease, color 0.18s ease;
}

.markdown-body a:hover {
  color: var(--accent-hover);
  border-bottom-color: var(--accent-hover);
}

.markdown-body strong {
  font-weight: 600;
  color: var(--text);
}

.markdown-body em {
  font-style: italic;

> 本文用于还原项目从需求分析、架构设计、编码实现、测试评估到面试表达的完整过程。
>
> 文档依据当前仓库实现、测试脚本和项目说明整理。为了保证面试表述真实，文中明确区分：
>
> - **已实现**：代码中已经存在，并且可以从仓库定位到。

> - **设计目标**：架构上希望达到，但当前实现仍不完整。
> - **面试边界**：不能把设计目标或历史实验结果直接说成当前线上能力。

## 阅读导航

> 本文的前六部分沉淀项目事实、架构、制作过程、场景、难点和评测；第七部分是全文核心深度面试题库；第八部分把前文知识转化为可直接表达的逐字稿和连续追问训练；第九、十部分用于防守、优化和快速复习。

## 一、项目背景与业务问题

> 本部分回答：这个项目服务谁、解决什么问题，以及为什么需要 Agent。

### 项目概览、简历描述与结果锚点

#### 1.1 项目背景

社保退休规划咨询不是普通的知识问答，用户的问题通常同时包含三类需求：

1. **个人化测算**
   - 我什么时候退休？
   - 我还差多少个月缴费？
   - 我是否满足最低缴费要求？
   - 女性用户应该按照哪一类退休身份判断？

2. **政策解释**
   - 延迟退休政策具体怎么规定？
   - 最低缴费年限为什么变化？
   - 4050 补贴的申请条件是什么？
   - 有没有官方文件或办事指南？

3. **多轮信息补全**
   - 用户可能在不同轮次分别提供出生年份、出生月份、性别、累计缴费月份和就业身份。
   - 当关键信息缺失时，Agent 不能为了“回答完整”而擅自补默认值。

因此，这个项目的核心不是让大模型记住更多政策，而是构造一个**受流程、工具、规则和证据约束的政策 Agent**：

- 大模型负责理解自然语言、选择工具和组织回答。
- Execution Plan 负责确定本轮应该做什么。
- 信息校验工具负责判断能否进入个人化计算。
- 规则引擎负责输出退休年龄、退休月份和缴费缺口等确定性结果。
- RAG 负责召回政策证据和官方来源。
- 记忆模块负责沉淀用户显式信息。
- Guardrail 负责检查回答是否缺少计算或政策证据支持。

#### 1.2 简历中的原始描述

> **Agent 架构**：构建面向社保退休规划咨询场景的可信政策 Agent，引入 Plan-and-Execute 工作流，根据用户意图生成结构化 Execution Plan，将个人化测算、官方政策解释等不同请求拆解为可执行步骤，约束模型按计划完成推理与回答。  
>
> **工具链路**：设计并编排人物画像抽取、信息完整性校验、规则引擎测算、政策依据召回和回答安全校验等工具链路；将退休年龄、最低缴费年限、弹性退休提示等政策逻辑沉淀为确定性规则，由规则引擎负责个人化测算，并通过校验工具调用状态与回答内容，防止模型在缺失关键信息时直接输出政策数字。  
>
> **记忆与上下文**：设计长期结构化记忆机制，将多轮对话中分散提供的个人信息沉淀为可跨会话恢复的用户画像；同时实现上下文压缩、会话摘要和工具事实保留机制，在长对话场景下保留关键信息，并隔离用户显式信息、模型推断信息与工具派生结果，避免污染长期记忆。  
>
> **政策信息 RAG**：构建覆盖最低缴费年限、延迟退休、弹性退休、4050 补贴等场景的政策依据召回链路，支持回答中引用可追溯政策来源；设计 RAG benchmark 验证政策召回效果，政策来源 Recall@3 达到 94%，官方来源命中率达到 98%，提升政策类 Agent 输出的可解释性、可追溯性和可信度。

#### 1.3 一句话定位

这是一个**规则引擎、政策 RAG、结构化记忆和 LLM 工作流协同的可信政策咨询 Agent**，重点解决政策场景下的个人化计算、证据追溯和回答安全问题。

#### 1.4 当前仓库可验证的结果

| 验证项 | 结果 | 说明 |
|---|---:|---|
| 规则引擎测试 | 6/6 通过 | 覆盖男性、女性身份、缴费年限、缺字段、版本上下文等场景 |
| Agent 单元评估 | 29/29 通过 | 覆盖记忆、上下文、信息闸门、Guardrail、Execution Plan 等 |
| Agent 端到端评估 | 6/6 通过 | 覆盖完整测算、追问、纯政策问答、长对话等链路 |
| RAG 功能评估 | 10/10 通过 | 覆盖混合召回、官方来源优先、引用完整性等 |
| 生产构建 | 通过 | pnpm build |
| 静态检查 | 0 errors，1 warning | pnpm lint |
| 真实 RAG benchmark | 当前环境未完成 | 数据库/API 当前无法连接，50 条用例未得到 ready 结果，不能用这次运行复现 94%/98% |

### 从业务问题到 Agent 可执行任务

#### 2.1 为什么不能只做一个聊天机器人

如果只给模型一段政策文本，再让模型直接回答，会出现几个问题：

- 用户说“我 1977 年出生”，模型可能默认出生月份为 1 月。
- 用户问“我什么时候退休”，模型可能只根据性别给出一个整数年龄，忽略出生月份和政策版本。
- 用户问“最低缴费年限”，模型可能把旧政策、项目摘要和官方文件混在一起。
- 用户问女性退休年龄，模型可能忽略女工人、女干部、管理技术岗位和灵活就业身份的区别。
- 用户在多轮对话中先说一个出生年份，后面又说另一个年份，模型可能静默覆盖而没有标记冲突。
- 上下文过长后，模型可能忘记工具计算结果，却仍然输出一个看似合理的数字。
- 模型调用工具失败后，仍然可能生成完整答案。

所以项目的第一步不是写 Prompt，而是建立以下业务边界：

| 业务类型 | 是否需要个人画像 | 是否需要规则引擎 | 是否需要 RAG | 关键信息 |
|---|---:|---:|---:|---|
| “我什么时候退休” | 是 | 是 | 可选 | 出生年月、性别、女性退休身份 |
| “我还差几个月” | 是 | 是 | 可选 | 出生年月、性别、累计缴费月份 |
| “最低缴费年限是多少” | 否 | 否 | 是 | 地区、政策时点、是否官方 |
| “延迟退休依据是什么” | 否 | 否 | 是 | 政策主题、官方来源 |
| “我什么时候退休，政策依据是什么” | 是 | 是 | 是 | 画像字段 + 官方 citation |
| “我补充一下我是女工人” | 是 | 否 | 否 | 更新显式用户画像 |
| “4050 补贴怎么办” | 通常否 | 否 | 是 | 地区、就业状态、补贴口径 |

#### 2.2 最小必要信息原则

对于个人化测算，不能只检查字段是否存在，还要检查字段是否有可信来源。

最小字段包括：

- 出生年份 birthYear
- 出生月份 birthMonth
- 性别 gender
- 累计缴费月份 paidMonths
- 女性用户的退休身份 femaleRetireType

其中：

- 出生年份决定政策适用区间。
- 出生月份决定精确退休年月。
- 性别决定基础退休年龄。
- 女性退休身份决定女工人、女干部或灵活就业等不同口径。
- 累计缴费月份用于计算最低缴费缺口。

因此系统不是简单地判断：

> profile.birthYear 是否为数字？

而是判断：

> 这个数字是否来自当前用户画像或当前用户消息，并且满足当前测算请求的最小信息要求？

---

### 项目核心价值与模块责任边界

这个项目的核心不是“接入了几个工具”，而是建立了一个针对高风险政策场景的责任分工：

| 组件 | 应该负责什么 | 不应该负责什么 |
|---|---|---|
| LLM | 意图理解、自然语言抽取、工具选择、回答组织 | 最终政策算术、凭空补个人字段 |
| Execution Plan | 定义本轮任务和步骤 | 代替所有业务规则 |
| assessRequiredInfo | 判断信息是否足够且有证据 | 计算退休结果 |
| Rule Engine | 确定性计算和版本追踪 | 解释所有自然语言问题 |
| RAG | 召回政策证据和官方来源 | 直接替代个人化计算 |
| Memory | 保存用户显式事实和冲突状态 | 保存所有模型推断 |
| Context Compression | 控制上下文长度并保留摘要、工具事实 | 代替长期记忆 |
| Guardrail | 检查回答是否有支撑 | 当前版本不等于完整阻断和自动修复 |
| Benchmark | 衡量召回和链路质量 | 不能替代真实业务审核 |

面试中最有说服力的表达是：

> 我不是把大模型当作一个更会搜索的问答框，而是把它放在一个有计划、有工具、有规则、有记忆边界、有来源证据和有评测的系统里。模型负责不确定的语言理解，规则和检索组件负责可验证的事实，Guardrail 负责发现两者之间的不一致。


---

## 二、从 0 到 1 的项目制作经过

> 本部分回答：项目是如何从业务失败案例逐步演进到可运行、可验证系统的。

### 从零到可验证系统的十个阶段

下面按一个真实 Agent 项目的合理开发顺序整理。面试时可以把它讲成“我先做最小闭环，再逐层增加确定性和可观测性”。

#### 阶段一：明确场景边界和可信要求

##### 主要问题

社保政策涉及多个地区、多个生效时间和多种身份口径，不能一开始就做“全国所有社保政策”。

##### 解决方式

先收敛到上海社保退休规划的最小可用范围：

- 男性退休年龄和延迟退休。
- 女性工人、干部/管理技术岗位和灵活就业口径。
- 最低缴费年限和缴费缺口。
- 4050 或就业困难人员补贴。
- 连续缴费、养老金计算和灵活就业参保等政策解释。

同时把问题拆为：

- 个人化计算问题。
- 一般政策解释问题。
- 个人化计算加政策依据的混合问题。
- 画像补充和更新问题。

##### 关键决策

不让模型直接承担所有职责，而是先定义每类请求需要的证据和工具：

| 输出类型 | 允许的来源 |
|---|---|
| 个人退休年月 | 规则引擎 ready 结果 |
| 缴费缺口 | 规则引擎 ready 结果 |
| 政策数字 | RAG citation 或明确版本化规则上下文 |
| 官方依据 | 官方来源 citation |
| 用户画像 | 当前消息或已有确认记忆 |

##### 面试表述

> 我一开始没有把问题当成普通 RAG 问答，而是先把输出拆成“个人化派生结果”和“政策原文依据”。前者要求走确定性规则引擎，后者要求走带来源元数据的 RAG。这样模型只负责理解和表达，关键数字由可验证组件产生。

---

#### 阶段二：先实现最小聊天闭环

##### 主要问题

如果一开始就同时开发记忆、RAG、规则和安全校验，问题很难定位。

##### 解决方式

先打通：

- 前端发送消息。
- API Route 接收消息。
- LLM 流式回答。
- 保存会话。
- 能看到基本日志。

然后再以工具调用为边界逐步加入能力。

##### 实现重点

- 为请求设置消息数量、单条字符数和总字符数上限。
- 通过匿名 session cookie 区分用户会话。
- 通过 conversationId 恢复会话。
- 数据库不可用时保留降级行为。
- 模型配置缺失时明确返回错误，不让系统表现为“模型沉默”。

##### 面试表述

> 我先做了一个可运行的最小闭环，确认模型调用、流式输出和会话保存都正常，再把规则、RAG 和安全约束逐层接入。这样每增加一个模块，都能通过端到端测试确认它没有破坏原链路。

---

#### 阶段三：把政策计算沉淀为规则引擎

##### 主要问题

政策计算不适合让模型自由推理，尤其是：

- 年龄和月份的换算。
- 女性身份映射。
- 最低缴费年限随退休年份变化。
- 缴费缺口的计算。
- 政策版本和生效时间。

##### 解决方式

建立规则 DSL 和执行器，把计算拆成：

1. 校验出生年份。
2. 标准化性别。
3. 推断女性退休类型。
4. 解析退休年龄 key。
5. 计算退休年月。
6. 计算退休时点对应的最低缴费月份。
7. 计算缴费缺口。
8. 最终信息闸门和警告。

核心入口：

- src/lib/engine/plan.ts
- src/lib/engine/orchestrator.ts
- src/lib/engine/executor.ts
- src/lib/engine/builtins.ts
- src/lib/engine/dsl-loader.ts
- src/lib/engine/minimum-rules.ts

##### 规则和参数分离

规则本身描述“怎么判断、执行什么动作”，参数描述“当前政策数字是什么”。

例如：

- 退休年龄按性别和女性身份映射。
- 最低缴费月份按退休年份查 schedule。
- 规则集和参数集具有 ruleSetId、paramsId 和 versionContext。
- 通过 effectiveAt、ruleSetId、paramsVersion 支持政策版本选择。

这样政策调整时，不必把政策数字散落在 Prompt 或业务代码中。

##### 面试表述

> 我把规则逻辑和政策参数拆开。规则引擎负责执行，参数集负责版本化。计算结果不仅返回数字，还返回 rule trace、ruleSet 和 paramsId，便于解释“这个结果是由哪些规则、哪个版本产生的”。

---

#### 阶段四：建立信息完整性闸门

##### 主要问题

模型很容易把用户没有说过的信息当成默认值。例如：

- 用户只说“1977 年男性”，模型补成 1 月。
- 用户说“我是女性”，模型自行判断女干部。
- 用户没提供累计缴费月份，模型却输出“还差 36 个月”。
- 模型传入工具的 profile 中包含默认字段，系统误认为是用户确认信息。

##### 解决方式

增加 assessRequiredInfo 工具，并设计两层校验：

1. **字段合法性校验**
   - 年份在合理范围内。
   - 月份为 1 到 12。
   - 性别为 male 或 female。
   - 缴费月份为非负整数。

2. **证据来源校验**
   - 当前消息明确提到的字段可以作为本轮证据。
   - 长期画像中已经确认的字段可以复用。
   - 仅仅出现在模型工具参数中的默认值不能自动视为用户事实。

如果 ready=false：

- 返回 needs_more_info。
- 生成缺失字段列表。
- 只追问缺失字段。
- 不允许进入正式 computePlan 输出确定性个人数字。

##### 关键代码位置

- src/lib/ai/tools.ts 中的 assessRequiredInfoForPlan。
- src/lib/ai/execution-plan.ts 中的 needs_more_info 状态。
- src/lib/engine/test-runner.ts 中的缺字段测试。
- src/lib/ai/eval/cases.ts 中的默认值污染回归测试。

##### 面试表述

> 信息闸门不是只做 Zod schema 校验。Schema 只能说明输入格式合法，不能说明这个字段是用户说过的。我额外把“字段值”和“用户证据”分开校验，避免模型为了完成工具调用而补默认值。

---

#### 阶段五：加入 Plan-and-Execute 工作流

##### 主要问题

直接把所有工具暴露给模型，会出现工具乱序或无关调用：

- 纯政策问题却触发个人化测算。
- 信息不全时跳过 assessRequiredInfo。
- 只有 RAG 结果却给出个人退休年份。
- 个人化测算没有官方依据却声称“根据官方规定”。

##### 解决方式

为每一轮请求构造 Execution Plan，计划包含：

- id
- intent
- status
- requiresComputePlan
- requiresRetrievePolicy
- requiresOfficialCitation
- missingFields
- steps
- createdAt

当前支持的 intent：

- personal_plan
- policy_explanation
- mixed
- profile_update
- general

当前支持的 step：

- assess_required_info
- compute_plan
- retrieve_policy
- update_profile
- ask_clarification
- answer

典型计划：

| 用户问题 | intent | 计划 |
|---|---|---|
| “我什么时候退休” | personal_plan | assess → compute → answer |
| “最低缴费年限是多少，有官方依据吗” | policy_explanation | retrieve(requireOfficial) → answer |
| “我什么时候退休，政策依据是什么” | mixed | assess → compute → retrieve official → answer |
| “我是女工人” | profile_update | update_profile → answer |
| “你好” | general | answer |

##### 必须准确说明的实现边界

当前 buildExecutionPlan 是服务端确定性生成：

- 通过关键词和画像状态识别意图。
- 由服务端直接生成步骤。
- 不是让 LLM 自主生成 JSON 计划再执行。

因此，简历里的“根据用户意图生成结构化 Execution Plan”是成立的；但面试时应说：

> 当前版本采用确定性计划生成作为流程控制层，目的是先保证高风险场景的工具顺序和门禁稳定。后续可以让 LLM 提出候选计划，再由服务端 schema 校验和策略层裁剪。

这比直接说“模型自主生成并执行计划”更准确。

---

#### 阶段六：设计工具链和工具调用观测

##### 主要问题

工具调用的结果如果只作为模型上下文存在，难以回答：

- 本轮到底调用了哪些工具？
- 工具是否失败？
- 是否命中缓存？
- RAG 是否命中官方来源？
- computePlan 是否 ready？
- 回答里的数字是否有对应工具结果？

##### 解决方式

在 tools.ts 中统一封装工具执行：

- 对工具输入做稳定序列化。
- 生成 inputHash。
- 使用 Map 缓存同一轮相同输入的 Promise。
- 记录 started、cache_hit、succeeded、failed。
- 记录 outputStatus。
- 记录是否存在官方 citation。
- 在 agent.ts 中维护 runtimeToolSupport。

工具链核心组件：

| 工具或模块 | 作用 | 结果 |
|---|---|---|
| profile extract | 从用户消息抽取显式画像 | profile patch |
| assessRequiredInfo | 判断个人化测算是否具备最小信息 | ready / needs_more_info |
| computePlan | 调用规则引擎 | 退休结果、缴费缺口、trace |
| retrievePolicy | 检索政策依据 | citations、来源、检索状态 |
| validateField | 对字段做基本校验 | valid / invalid |
| answer guardrail | 检查回答是否有工具支撑 | violations |
| workflow | 记录工作流状态 | 可观测事件和摘要 |

##### 面试表述

> 我把工具调用当作有状态的执行过程，而不是几个普通函数。每次调用会记录输入哈希、开始和结束状态、输出状态、缓存命中和官方来源情况，这样后面既能做调试，也能做回答安全校验。

---

#### 阶段七：实现结构化记忆

##### 主要问题

普通做法通常是把整段历史消息塞进 Prompt，或者把模型生成的所有 profile 都保存下来。两种方式都容易失控：

- 上下文越来越长。
- 模型推断被当成用户事实。
- 工具计算结果反向污染画像。
- 同一字段在不同轮次冲突时被静默覆盖。
- 空值覆盖已有有效值。

##### 解决方式

设计 Memory V2：

~~~text
_memory:
  version: 2
  updatedAt: ISO 时间
  facts:
    - path: birthYear
      value: 1977
      source:
        type: user_message
        messageId: ...
        observedAt: ...
      confidence: 0.95
      status: confirmed
~~~

每个 fact 至少包含：

- path：字段路径。
- value：字段值。
- source.type：来源类型。
- source.messageId：可选的消息来源。
- source.toolName：可选的工具来源。
- observedAt：观察时间。
- confidence：置信度。
- status：confirmed、inferred、conflicted 或 stale。
- conflicts：冲突值和原因。

##### 来源隔离

当前 source type 包括：

- user_message：用户明确说过。
- tool_result：工具返回的事实。
- compute_plan：规则引擎派生结果。
- profile_update：画像更新事件。

projectProfileWithoutMemory 会把可用于计算的记忆事实投影成普通 profile，但以下内容不会直接作为用户确认事实：

- conflicted。
- stale。
- 空值。
- source.type 为 compute_plan 的事实。

这样可以避免：

> 模型为了调用 computePlan 传入了 1 月，后续系统却把 1 月保存成用户真实出生月份。

##### 冲突处理

当同一 path 出现新旧值时，不直接覆盖：

- 比较来源优先级和确认状态。
- 已确认值不会被低可信推断静默覆盖。
- 新值不一致时保留 conflicts。
- 发生冲突时可以把状态标为 conflicted。
- conflicted 字段不参与确定性计算，必要时重新追问。

##### 面试表述

> 我没有把 memory 设计成一个普通 JSON 字典，而是把每个字段设计成带来源、置信度、状态和冲突记录的 fact。这样长期记忆不仅能恢复用户画像，还能解释这个值来自哪里，以及当前是否可以用于计算。

---

#### 阶段八：长上下文压缩与工具事实保留

##### 主要问题

长对话压缩不能简单截取最后 N 条消息，否则可能丢失：

- 早期用户明确提供的出生年月。
- 之前规则引擎给出的退休年月。
- RAG 返回的政策依据。
- 用户在中间轮次纠正过的字段。

##### 解决方式

compressMessagesForContext 处理：

- 最大消息数。
- 单条消息最大字符数。
- 总字符数上限。
- 最近消息保留。
- 会话摘要。
- 工具事实提取。
- 压缩统计信息。

上下文注入包含：

- conversationSummary。
- toolFacts。
- contextStats。
- userProfile。
- executionPlan。
- pending questions。

设计原则：

1. 用户显式画像进入长期记忆。
2. 工具事实进入当前会话上下文。
3. 会话摘要用于帮助模型了解历史。
4. 模型推断和工具派生结果不能自动进入长期用户画像。
5. 压缩后仍要保留最近一轮和关键工具结果。

##### 面试表述

> 我把“长期记忆”和“当前上下文”分开。长期记忆保存用户明确确认的画像；摘要和工具事实只服务当前会话，避免为了减少 Prompt 长度而把派生结果永久写入用户画像。

#### 阶段九：构建政策 RAG

##### 主要问题

政策问答的难点不只是“召回相关文本”，还包括：

- 政策有地区和生效时间。
- 官方文件、官方 FAQ、项目摘要的可信度不同。
- 同一政策可能在多个文件中出现。
- 需要返回可追溯引用，而不是只返回一段文本。
- embedding 不可用时仍要有可解释的降级路径。

##### 解决方式：文档加工

RAG 文档处理链路：

1. 文档 manifest 管理。
2. 记录 sourceId、标题、地区、类别、来源类型、生效时间、URL、发布机关和版本。
3. 清理 frontmatter。
4. 按标题和语义边界切块。
5. 为 chunk 保存 chunkId、ordinal、keywords 和 locator。
6. 生成 embedding。
7. 将文档和 chunk 写入数据库。
8. 通过 sourceType 标记官方来源与摘要来源。

当前数据集边界：

- 共 26 篇政策文档。
- 其中 21 篇为 official_policy、official_notice 或 official_faq。
- 5 篇为 derived_summary 或 demo_summary。
- 不能把 26 篇全部称作官方原始文件。

##### 解决方式：混合召回

当前 RAG v2 主要采用：

1. 元数据过滤
   - jurisdiction。
   - category。
   - sourceTypes。
   - effectiveAt。
   - requireOfficial。

2. lexical 召回
   - PostgreSQL/pg_trgm 相似度。
   - 结合关键词、类别和来源打分。

3. vector 召回
   - 使用 embedding。
   - 通过 pgvector 相似度搜索。

4. RRF 融合
   - vector 和 lexical 两路候选用 Reciprocal Rank Fusion 融合。
   - 默认 vector 权重高于 lexical。

5. 官方来源加权
   - official_policy、official_notice、official_faq 增加 source boost。
   - requireOfficial=true 时优先过滤官方来源。

6. rerank 和 source diversification
   - 对融合候选重新排序。
   - 尽量让 Top-K 覆盖不同 sourceId，避免同一文件切块霸榜。

7. fallback
   - embedding 不可用时降级为 lexical。
   - 混合检索失败时降级到 legacy。
   - 数据库不可用时返回 disabled，而不是编造 citation。

##### Citation 设计

每条 citation 包含：

- sourceId。
- title。
- documentTitle。
- officialTitle。
- chunkId。
- excerpt。
- relevanceScore。
- sourceType。
- sourceUrl。
- sourceVersion。
- issuingAuthority。
- publishedAt。
- effectiveFrom / effectiveTo。
- locator。
- retrievalStrategyLabels。

因此回答可以做到：

> 这条结论来自哪个 sourceId、哪个 chunk、哪个来源类型、哪个 URL、哪个生效版本。

#### 阶段十：增加回答安全校验

##### 主要问题

即使工具链设计正确，大模型仍可能：

- 没有 computePlan 却输出个人退休年份。
- 只有普通 RAG 结果却声称“官方文件规定”。
- computePlan 状态为 needs_more_info 却输出精确数字。
- 只有 retrievePolicy 却输出用户个人缴费缺口。
- RAG 只有 demo_summary，却声称“官方依据”。

##### 解决方式

validatePolicyAnswerForRuntime 根据两类信息校验：

1. 回答文本
   - 是否包含政策数字。
   - 是否出现个人化结论。
   - 是否声明官方、原文、出处或文件依据。

2. 工具支持状态
   - hasAssessRequiredInfo。
   - hasReadyAssessRequiredInfo。
   - hasComputePlan。
   - hasReadyComputePlan。
   - hasRetrievePolicy。
   - hasOfficialRetrievePolicy。
   - executionPlan status。
   - requiresComputePlan。
   - requiresRetrievePolicy。
   - requiresOfficialCitation。
   - toolSequence。

典型规则：

| 违规情况 | 期望 |
|---|---|
| 没有 computePlan，却输出个人化退休年月 | 违规 |
| computePlan 不是 ready，却输出个人化数字 | 违规 |
| 声称官方依据，但 citation 没有官方 URL/来源类型 | 违规 |
| 只有 retrievePolicy，却输出个人化退休年份 | 违规 |
| 有 ready computePlan 后输出计算结果 | 允许 |
| 有官方 citation 后解释一般政策数字 | 允许 |

##### 必须准确说明的实现边界

当前 runtime guardrail 主要做：

- 后置检查。
- 记录 validation_started、validation_passed 或 validation_failed。
- 记录 violationCodes。
- 为评测提供可判断的结果。

当前实现没有完整做到：

- 在流式输出过程中实时阻断已发送文本。
- 发现违规后自动调用修复模型。
- 自动重试工具并重新生成答案。
- 将违规回答替换为安全模板后再返回。

因此面试时应说：

> 当前版本已经实现回答支撑校验和违规观测，并在评测中能识别违规；下一步是把后置校验升级为真正的阻断、重试或安全降级闭环。

不能说：

> 已经完全阻断所有违规回答。

### 制作过程中的错误演化：每一个模块是被什么问题逼出来的

如果只按照“先做规则、再做记忆、再做 RAG、最后加 Guardrail”的顺序讲，面试官容易感觉这是事后拼出的架构图。更真实的制作过程应该是：先做出能运行的版本，再用反例发现上一层的责任边界不够，最后把失败样本转成下一层的约束和回归。下面这条演化链可以作为“我不是先把所有设计想完，而是在排查问题中逐步工程化”的主线。

#### 第一轮：最小聊天闭环能回答，但不能证明回答有依据

**初始实现和现象**

最开始我只打通了消息接入、模型调用、流式返回和会话保存。正常输入例如“延迟退休政策是什么”，模型可以给出一段流畅解释；用户问“我什么时候退休”，模型也可能给出一个具体年份。接口状态、流式输出和会话保存都没有异常。

**第一个反例**

```text
用户：我是 1977 年出生的男性，我什么时候退休？
```

这时我发现“回答得像真的”不能作为成功标准：模型没有出生月份和累计缴费月份，却可能直接给出个人化数字；如果政策问题换成“官方依据是什么”，模型还可能凭训练记忆回答，无法给出可点击、可追溯的来源。

**排查结论**

问题不是聊天闭环失败，而是闭环缺少业务不变量。它没有回答：个人数字必须来自什么工具？缺字段时应该停止还是继续？政策数字是否必须带来源？这推动我先定义输出类型与允许来源，再把个人化计算、政策解释和混合请求拆开。

**验证门禁**

从这一轮开始，正常用例不再只看文本；缺字段用例要求追问，个人数字要求规则结果，官方声明要求 citation。最小聊天闭环仍然保留，但它只证明“请求能通”，不再被当成 Agent 可信性的证明。

#### 第二轮：把计算移出模型后，规则引擎也会稳定地算错

**初始实现和现象**

我先把退休年龄、预计退休年月、最低缴费月份和缴费缺口放进规则引擎。这样模型不再负责算术，典型样例输出稳定了，但在政策起始月份、不同女性身份、退休年份跨越最低缴费 schedule 节点时，发现简单公式和政策口径可能不完全一致。

**为什么不能说“用了规则就准确”**

规则引擎只保证同样输入得到同样输出，不保证编码的政策理解没有错误。一个固定公式可能在典型年份都通过，却在切换月产生系统性偏差。尤其当前延迟退休实现是参数化的月级近似，不能说成已经完全复现官方逐月表。

**排查方式和修复**

我把规则执行拆成 trace，检查性别标准化、女性身份映射、延迟月份计算、退休年月进位、退休年份 schedule 命中和缺口计算分别得到什么结果；再用独立政策表或人工核验样例对照边界，而不是只对一个最终年份。规则与参数分离、`ruleSet`、`paramsId` 和 `versionContext` 就是在这个过程中形成的。

**验证门禁**

规则测试覆盖完整男性、女性身份、政策节点、缺出生年月和版本上下文。生产化前还要用官方逐月表补全出生年月边界。面试中要把“规则执行确定性”和“政策规则已完全校准”分开说。

#### 第三轮：schema 通过不等于信息完整，模型补值暴露了事实边界

**失败现象**

当我增加工具 schema 后，本来希望模型把 profile 传给 `computePlan`。但模型为了满足字段结构，可能把缺少的出生月份补成 1 月，把缺少的缴费月份补成 0。schema、工具和规则引擎都返回成功，造成“正常成功的错误”。

**第一次错误修复**

我尝试强化 Prompt，要求模型不要猜测；也尝试把字段全部设为 required。前者不能提供硬保证，后者反而把“缺字段”变成“必须想办法填值”。这两次尝试让我确认，问题不在提示词措辞，而在系统没有把“缺失”作为一种合法的业务状态。

**最终修复**

增加 `assessRequiredInfo`，将格式校验和 evidence 校验分开；`ready=false` 时转为 `needs_more_info`；`computePlan` 内部二次校验；Memory 记录来源和状态；评测增加 forbidden tool、answer exclusion 和 memory pollution 断言。这个问题是本项目最重要的实际 Bug，也构成了后面 Plan、Memory、Guardrail 和 E2E 的共同基线。

#### 第四轮：有了信息闸门，模型仍可能不按顺序调用工具

**失败现象**

信息闸门和规则工具都存在后，模型仍可能直接调用 `computePlan`，或者纯政策问题触发个人化计算。即使工具内部最终拒绝，调用路径仍然浪费了一次模型决策和工具事件；如果工具内部校验不严，就会重新暴露默认值问题。

**排查方式**

我将 Plan 的 `steps` 和实际 `toolSequence` 放进同一条 trace，发现“计划正确”和“执行正确”是两个独立维度。于是 Execution Plan 不再只是 Prompt 文本，而是成为服务端验证依据：记录 `requiredTools`、`forbiddenTools`、`missingFields`、计划状态和输出状态。

**当前取舍**

当前计划主要由服务端确定性生成，工具内部有二次门禁，但还不是完整动态工具权限或状态机。优点是可控、实现成本低、能快速评测；缺点是模型仍可能发起不必要调用。下一步是把计划编译为状态机，`needs_more_info` 时直接隐藏 `computePlan`。

#### 第五轮：多轮对话暴露记忆污染和冲突问题

**失败现象**

如果把每轮模型传入的 profile 或工具输出直接合并，模型补的 1 月、规则结果里的预计退休年份和用户显式出生年份会被放到同一个 JSON 里。用户后面纠正出生年份时，旧的退休结果也可能继续被复用。

**排查方式**

我逐个查看 fact 的 `source.type`、`status`、`confidence` 和 `conflicts`，并比较 Memory 投影前后的 profile。由此发现“值是否存在”不能替代“值是否可用于计算”，同时高影响字段更正必须让下游派生结果失效。

**最终修复与验证**

Memory V2 将用户显式事实、模型推断、工具结果和计算派生结果分层；conflicted/stale 不参与计算；长期画像只保存白名单显式事实；用户更正字段时保留历史并重新计算。回归验证不仅看字段合并，还看派生结果不进入长期记忆、冲突不静默覆盖和下一轮是否重新走信息闸门。

#### 第六轮：长上下文压缩暴露“摘要记住了主题，却忘了证据”

**失败现象**

简单保留最后 N 条消息时，早期出生月份和缴费月份可能丢失；只生成自然语言摘要时，摘要可能说“之前已经算过退休”，却没有保存计算输入、规则版本和 citation。用户说“继续按刚才结果算”时，模型只能猜。

**最终修复与验证**

我把最近消息、conversation summary、结构化 userProfile 和 toolFacts 分开管理，并记录压缩统计。长对话 E2E 用 28 轮闲聊后补充画像，检查压缩发生、字段保留、工具事实可用和计划没有错误追问。摘要是上下文辅助，不能升级为用户事实；工具事实是当前会话证据，不能自动写进长期画像。

#### 第七轮：RAG 召回到内容，不代表召回到可用证据

**失败现象**

RAG 可能召回相关摘要、过期官方文件或同一 source 的重复 chunk。表面上 `status=ready`，但用户要求“官方依据”时，citation 没有官方 URL；或者回答中的具体数字并不在 excerpt 中。

**排查方式和修复**

我沿 metadata filter、lexical/vector 候选、RRF、rerank 和 source diversification 逐阶段查看正确来源在哪一步丢失；同时检查 sourceType、sourceUrl、effectiveAt、sourceVersion 和 locator。最终通过官方来源过滤/加权、版本过滤、source 多样性和 citation 完整性约束，区分“有相关文本”“有官方来源”和“能支撑当前 claim”。

**验证门禁**

RAG benchmark 统计 source-level Recall@3 和 query-level 官方命中率；功能测试额外检查摘要不能冒充官方、过期文件不能支撑当前政策、citation 是否能支撑回答 claim。94%/98% 只属于召回层，不作为最终答案准确率。

#### 第八轮：Guardrail 后置校验暴露提交时机问题

**失败现象**

模型可能在没有 computePlan 时输出个人退休数字，或只有摘要时声称官方依据。后置 Guardrail 能在完成回调发现问题，但流式文本可能已经发给用户，因此“检测到了”不等于“阻断了”。

**最终修复与边界**

当前版本保留回答文本、工具支持和计划状态，做后置校验并记录 violation code；下一步是 draft-then-commit、claim-evidence graph 和安全降级。面试时必须准确说“实现了支撑校验和违规观测”，不能说“已经完全阻断所有违规回答”。

#### 第九轮：E2E 发现“答案正确”也可能是假通过

**失败现象**

最终答案碰巧正确，但没有调用规则工具；或者调用了工具，但输入是模型补的 1 月；或者 citation 命中了，但没有支撑回答中的具体数字。只看字符串会把这些都判成通过。

**最终评测方式**

每条真实 E2E case 定义用户消息序列、初始画像、期望 intent、Plan 状态、required/forbidden tools、规则或 RAG 事实约束、回答 claim 约束和持久化约束。执行时记录完整 trace，先做确定性断言，再做 claim 检查和人工抽样；关键 case 重复运行，并将失败样本加入回归集。这样 E2E 从“看答案”升级为“验证任务是否按正确状态和证据链完成”。

#### 贯穿式制作过程的面试逐字稿

> 这个项目不是我先把一个完整架构图画出来，再把模块逐个接上去。我的过程更像是先做一个能聊天的最小闭环，然后用反例不断逼出责任边界。
>
> 第一版能流式回答，但缺字段时模型也会给个人退休数字，所以我把退休年龄、退休年月、最低缴费和缺口从模型中拿出来，放到规则引擎。规则跑通后又发现，schema 合法不代表字段有用户证据，模型会补 1 月和 0 个月，于是增加了信息完整性闸门、computePlan 二次校验和 Memory 来源隔离。
>
> 再往后我发现计划写进 Prompt 也不等于模型按顺序执行，所以开始记录 Plan 和真实 tool sequence，增加 required/forbidden tool 断言。多轮场景又暴露了派生结果污染和字段冲突，长对话暴露了简单截断丢事实，RAG 场景暴露了摘要冒充官方和过期来源问题，最后 Guardrail 和 E2E 又暴露出“能检测”不等于“能阻断”、答案正确不等于链路正确。
>
> 所以现在的系统不是把 Agent、RAG、Memory 这些名词堆在一起，而是每个模块都对应一个实际失败模式：规则解决模型算数和版本问题，信息闸门解决默认值问题，Plan 和工具观测解决乱序问题，Memory 解决事实污染，RAG 解决依据追溯，Guardrail 和 E2E 解决无支撑输出和假通过。这个演化过程也是我认为最能证明项目真实性的部分。

### 制作路线的面试讲法

可以按下面的叙事顺序回答，不要一上来只罗列技术名词。

#### 第一步：从业务失败案例出发

我先列出普通 LLM 在社保咨询中的失败类型：

- 缺出生月份却给出精确退休月份。
- 女性身份不明确却直接套一个年龄。
- 没有官方依据却声称政策规定。
- 多轮信息冲突却静默覆盖。
- 长上下文中忘记工具计算结果。

这些失败案例决定了系统必须有：

- 信息闸门。
- 确定性规则引擎。
- 来源可追溯的 RAG。
- 结构化记忆。
- 回答 Guardrail。

#### 第二步：先做最小闭环

先让消息能正常进入模型并流式返回，确认：

- API Route。
- 会话 ID。
- 基础持久化。
- 模型配置。
- 错误处理。
- 限流和输入长度限制。

#### 第三步：先把计算从模型拿出来

将退休年龄、退休年月、最低缴费月份和缴费缺口放入规则引擎，模型不再直接计算数字。

#### 第四步：在工具前增加信息闸门

让个人化问题先评估字段和证据，不足就追问，禁止计算。

#### 第五步：用 Execution Plan 统一编排

把个人化计算、政策检索和混合请求变成结构化步骤，减少工具乱序和无关调用。

#### 第六步：补上记忆和上下文治理

把用户显式信息和工具派生事实分离，增加冲突状态和长上下文压缩。

#### 第七步：建设政策 RAG 和 benchmark

从文档 manifest、切块、元数据、embedding、混合召回、rerank、citation 到指标评测，形成可追踪链路。

#### 第八步：用反例测试而不是只测正常案例

重点测试：

- 缺字段。
- 默认值污染。
- 女性身份不明。
- 官方来源不足。
- embedding 不可用。
- 数据库不可用。
- 多轮冲突。
- 长上下文。
- 工具调用顺序错误。

#### 第九步：工程化收尾

加入：

- 日志。
- 工具事件。
- cache hit。
- policy version context。
- 会话持久化。
- 429 限流。
- 构建和 lint。
- 测试脚本。

## 三、系统架构与运行机制

> 本部分回答：系统有哪些层次、状态、工具契约和运行边界。

### 总体架构与请求主链路

#### 3.1 总体分层

项目可以分成六层：

1. **请求接入层**
   - Next.js API Route 接收消息。
   - 校验消息数量、单条长度和总长度。
   - 处理匿名会话、会话 ID、限流和数据库加载。

2. **上下文与记忆层**
   - 从历史消息抽取用户显式画像。
   - 合并已有长期记忆。
   - 压缩长对话并保留摘要、最近消息和工具事实。
   - 将画像、摘要和 Execution Plan 注入模型上下文。

3. **计划与工具编排层**
   - 识别个人化测算、政策解释、混合请求和画像更新。
   - 生成结构化 Execution Plan。
   - 根据计划决定是否需要信息评估、规则计算、政策召回和官方引用。

4. **确定性计算层**
   - 通过规则 DSL、规则集、参数集和内置函数执行政策逻辑。
   - 输出退休年龄、退休年月、最低缴费月份和缺口等结果。
   - 记录规则 trace 和政策版本上下文。

5. **政策 RAG 层**
   - 对政策文档进行清洗、切块、元数据管理和 embedding。
   - 使用 lexical、vector、RRF 融合和 rerank 召回。
   - 对官方来源进行过滤或加权，并生成 citation。

6. **回答与安全层**
   - LLM 根据工具结果组织自然语言。
   - 检查回答中的政策数字、个人化结论和“官方依据”声明。
   - 记录工作流事件和工具调用事实。

#### 3.2 请求到回答的主链路

~~~mermaid
flowchart TD
    A[用户消息] --> B[API 接入与输入校验]
    B --> C[加载匿名会话与长期画像]
    C --> D[抽取显式画像]
    D --> E[长上下文压缩]
    E --> F[构建 Execution Plan]
    F --> G{本轮任务类型}
    G -->|个人化测算| H[assessRequiredInfo]
    H -->|信息不足| I[只追问缺失字段]
    H -->|ready| J[computePlan]
    G -->|政策解释| K[retrievePolicy]
    G -->|个人化加政策依据| H
    J --> K
    I --> L[生成追问]
    K --> M[LLM 组织答案]
    J --> M
    M --> N[Runtime Guardrail]
    N --> O[流式返回]
    O --> P[抽取并持久化显式记忆]
~~~

#### 3.3 当前代码中的真实入口

主入口是：

- src/app/api/chat/route.ts

入口中可以看到以下顺序：

1. 读取匿名 session。
2. 执行限流。
3. 校验消息大小。
4. 检查模型配置。
5. 加载会话和用户画像。
6. 合并客户端传入的画像字段。
7. 压缩上下文。
8. 从用户消息抽取显式画像。
9. 构建 Execution Plan。
10. 把画像、摘要、工具事实和计划传给 createChatStream。
11. 在流式响应结束时提取记忆并持久化。

这个顺序很重要，因为如果先让模型回答、最后才做画像抽取，就可能发生：

- 本轮回答使用了尚未确认的信息。
- 模型自己补全缺失字段。
- 计算结果污染长期记忆。
- 长上下文压缩丢失关键事实。

### 关键模块、数据结构与运行机制

#### 5.1 API Route：请求边界与会话恢复

文件：

- src/app/api/chat/route.ts

主要职责：

- 读取匿名会话 cookie。
- 限流。
- 过滤非法 conversationId。
- 限制消息大小。
- 加载数据库中的用户画像和会话。
- 合并客户端 profile patch。
- 从用户消息中抽取显式 profile patch。
- 压缩上下文。
- 构建 Execution Plan。
- 启动流式模型调用。
- 在结束回调中持久化会话和长期画像。

输入保护：

- 最多 40 条消息。
- 单条消息最多 4000 字符。
- 总消息最多 20000 字符。
- 缺少模型配置时返回 503。
- rate limit 超限时返回 429。

注意：

当前匿名会话通过 session cookie 恢复。若面试官问“跨账号跨设备长期记忆”，不能直接这样表述；当前代码证据更准确的说法是：

> 支持基于匿名 session 的跨会话画像恢复；若接入真实登录用户，只需把 subjectType/subjectId 切换到账号身份，并继续复用画像持久化接口。

#### 5.2 Execution Plan：计划结构和状态机

文件：

- src/lib/ai/execution-plan.ts

计划主要字段：

~~~text
{
  id,
  intent,
  status,
  requiresComputePlan,
  requiresRetrievePolicy,
  requiresOfficialCitation,
  missingFields,
  steps,
  createdAt
}
~~~

状态：

- ready：已有足够条件或已确定需要检索/回答。
- needs_more_info：个人化计算缺少必要字段。
- no_tool_required：当前问题不需要工具。

计划生成逻辑：

- 个人化关键词命中时设置 requiresComputePlan。
- 政策、依据、官方、4050、最低缴费等关键词命中时设置 requiresRetrievePolicy。
- 出现官方、出处、原文、政府、人社等关键词时设置 requiresOfficialCitation。
- 同时命中计算和政策时 intent 为 mixed。
- 只有 profile 更新表达时，生成 update_profile step。
- 最后统一追加 answer step。

#### 5.3 Agent Runtime：模型、工具和工作流事件

文件：

- src/lib/ai/agent.ts
- src/lib/ai/workflow.ts

运行参数：

- temperature 为 0.3。
- stopWhen 为 stepCountIs(8)。
- OpenAI providerOptions 中关闭 store。
- 记录消息接收、上下文准备、工具准备、工具开始、工具结束、草稿生成、校验开始、校验结果和最终完成等事件。

工具调用状态保存在 runtimeToolSupport 中，供回答校验使用。

#### 5.4 规则引擎：规则、参数和执行 trace

文件：

- src/lib/engine/plan.ts
- src/lib/engine/orchestrator.ts
- src/lib/engine/executor.ts
- src/lib/engine/json-logic.ts
- src/lib/engine/dsl-loader.ts
- src/lib/engine/minimum-rules.ts
- src/lib/engine/builtins.ts

计算流程：

~~~text
用户画像
  → 规则包解析
  → EngineState 初始化
  → 依次执行 DSL rules
  → builtins 计算派生事实
  → 最终信息闸门
  → result + trace + versionContext
~~~

当前能看到的典型规则：

- 校验出生年份。
- 标准化性别。
- 推断女性退休类型。
- 查找法定退休年龄。
- 计算预计退休年月。
- 计算退休时点的最低缴费月份。
- 计算缴费缺口。
- 最终信息闸门。

结果中还保留：

- retireAge。
- retireAgeYears。
- retireAgeMonths。
- estimatedRetireYear。
- estimatedRetireMonth。
- paidMonths。
- requiredMonths。
- missingMonths。
- warnings。
- suggestions。
- caveats。
- trace。
- ruleSet。
- paramsId。
- versionContext。

#### 5.5 政策版本管理

政策数字不能散落在代码各处，当前通过 policy bundle 管理：

- ruleSetId：规则集合版本。
- paramsVersion：参数版本。
- effectiveAt：政策生效时间。
- paramsId：实际使用的参数集标识。
- versionContext：执行时的版本上下文。

面试时如果被问“政策更新怎么办”，可以回答：

> 我把政策规则与参数分离，更新政策时新增参数版本或规则集，并通过 effectiveAt 选择适用版本。历史计算结果保留 paramsId 和 versionContext，避免同一用户在不同时间查询得到无法解释的结果。

#### 5.6 RAG 文档处理

文件：

- src/lib/rag/ingest.ts
- src/lib/rag/chunk.ts
- src/lib/rag/embedding.ts
- src/lib/rag/retrieval.ts
- src/lib/rag/hybrid.ts
- src/lib/rag/rerank.ts
- src/lib/rag/citation.ts

文档元数据要先规范化，再进行切块：

| 元数据 | 用途 |
|---|---|
| sourceId | 评测相关性和追踪来源 |
| sourceType | 区分官方和摘要 |
| jurisdiction | 地区过滤 |
| category | 主题过滤 |
| effectiveFrom / effectiveTo | 时间有效性过滤 |
| sourceUrl | 官方链接和可追溯性 |
| issuingAuthority | 发布机构展示 |
| sourceVersion | 版本追踪 |
| sourceLocator | 章节、条款、页码定位 |

#### 5.7 记忆与持久化

文件：

- src/lib/profile/extract.ts
- src/lib/profile/memory-v2.ts
- src/lib/profile/merge.ts
- src/lib/profile/conflict.ts
- src/lib/profile/persistable.ts
- src/lib/ai/message-inspector.ts

持久化分两类：

1. **会话持久化**
   - 保存完整 finishedMessages。
   - 保存本轮合并后的 userProfile。
   - 用于恢复对话上下文。

2. **长期用户画像持久化**
   - 只保存白名单允许的显式用户信息。
   - 过滤工具派生结果、模型推断结果和不应长期保存的字段。
   - 通过匿名 session 关联。

这两个层次分开，可以降低长期记忆污染风险。

## 四、典型场景与完整链路演示

> 本部分回答：用真实用户场景理解系统如何规划、执行、追问、降级和回答。

### 典型场景的完整执行过程

#### 场景一：完整男性画像的个人化测算

用户：

> 我是 1977 年 3 月出生的男性，累计缴费 220 个月，想知道什么时候退休、还差多少缴费。

执行过程：

1. API 读取消息和历史画像。
2. 抽取 birthYear=1977、birthMonth=3、gender=male、paidMonths=220。
3. 构建 Execution Plan：
   - intent=personal_plan。
   - status=ready。
   - requiresComputePlan=true。
4. LLM 调用 assessRequiredInfo。
5. assessRequiredInfo 返回 ready=true。
6. 调用 computePlan。
7. 规则引擎：
   - 标准化性别。
   - 解析 male 退休年龄。
   - 计算渐进式退休年龄。
   - 计算预计退休年月。
   - 根据退休年份查最低缴费月份。
   - 计算 missingMonths。
8. LLM 使用工具结果组织回答。
9. Runtime Guardrail 检查：
   - 有 ready computePlan。
   - 若回答声明官方依据，还需要官方 RAG。
10. 会话保存，用户明确画像进入 Memory V2。

面试重点：

- 模型不负责算最终数字。
- 工具结果包含 trace 和版本上下文。
- 计算前有信息闸门。
- 画像来源是用户消息，不是模型补全。

#### 场景二：缺少出生月份

用户：

> 我是 1977 年出生的男性，缴费 220 个月，什么时候退休？

执行过程：

1. 可以抽取 birthYear、gender、paidMonths。
2. Execution Plan 命中 personal_plan。
3. assessRequiredInfo 发现 birthMonth 缺失。
4. 返回 needs_more_info。
5. 计划追加 ask_clarification。
6. 不进入有效 computePlan。
7. 最终回答只追问出生月份，并说明出生月份会影响精确退休年月。
8. 如果模型仍然输出了确定退休数字，Guardrail 识别为违规。

面试重点：

> 系统宁可多问一轮，也不使用 1 月或其他默认值。对于政策数字，信息不足时的“拒答/追问”比看似完整但不可信的回答更重要。

#### 场景三：女性用户未说明退休身份

用户：

> 我是 1975 年 3 月出生的女性，缴费 240 个月，什么时候退休？

执行过程：

1. 抽取出生年月、性别和缴费月份。
2. 因为女性不同岗位对应不同退休口径，inferFemaleRetireType 无法得到可信类型。
3. assessRequiredInfo 返回 femaleRetireType 缺失。
4. 追问：
   - 女工人/生产操作岗位？
   - 干部或管理技术岗位？
   - 灵活就业人员？
5. 不输出确定退休年月。

面试重点：

- 女性身份不是可有可无的字段。
- 系统不把模型根据常识做出的猜测写进长期记忆。
- 需要用户确认或长期画像中已有确认事实。

#### 场景四：纯政策问题

用户：

> 上海领取养老金最低缴费年限是多少？有没有官方依据？

执行过程：

1. 识别 policy_explanation。
2. requiresComputePlan=false。
3. requiresRetrievePolicy=true。
4. requiresOfficialCitation=true。
5. 只调用 retrievePolicy：
   - jurisdiction=上海。
   - category=minimum_paid_months。
   - requireOfficial=true。
   - retrievalMode=hybrid。
6. 返回官方 citation。
7. LLM 基于 excerpt、标题、URL 和版本信息回答。
8. Guardrail 检查“官方依据”声明是否有官方 citation 支持。

面试重点：

> 纯政策问题不应该触发个人化信息追问，否则用户体验差，也会增加不必要工具调用。

#### 场景五：个人化计算加官方依据

用户：

> 我是 1977 年 3 月出生的男性，缴费 220 个月，我什么时候退休？请给我政策出处。

执行过程：

1. intent=mixed。
2. 先 assessRequiredInfo。
3. ready 后调用 computePlan。
4. 同时或随后调用 retrievePolicy，并设置 requireOfficial=true。
5. 回答同时包含：
   - 个人化计算结果。
   - 计算口径。
   - 官方政策引用。
   - 免责声明和适用范围。
6. Guardrail 要求个人数字有 computePlan 支持，官方声明有官方 citation 支持。

#### 场景六：长对话后继续追问

用户前几轮分别提供：

- 出生年份。
- 出生月份。
- 性别。
- 累计缴费月份。
- 女性工作身份。

当消息较多时：

1. 压缩旧消息。
2. 保留最近若干消息。
3. 生成 summary。
4. 抽取 toolFacts。
5. 将用户画像、摘要和工具事实重新注入。
6. 后续问题继续走 Execution Plan 和信息闸门。
7. 不把 computePlan 的派生 profile 当成用户确认画像。

### 端到端评测场景题

#### 场景题 1：答案正确，但模型没有调用 computePlan

**面试官：**

> 用户问“我什么时候退休”，模型直接回答了一个正确年份，但 trace 里没有 computePlan。你会把这条算通过吗？

**逐字回答：**

> 不算关键链路通过。答案正确只能说明这一次文本结果碰巧正确，不能说明系统具备可复现的个人化计算能力。
>
> 对个人化数字，我的判定标准不是“结果看起来对”，而是“结果来自正确的确定性工具，并且工具输入具备用户证据”。如果没有 computePlan，应该把它记录为 unsupported personalized claim 或 missing computation evidence。
>
> 这类失败要继续追查：是意图识别没有识别成 personal_plan，还是 Execution Plan 没有注入，还是模型没有调用工具，还是工具结果被丢失。修复可能包括强化计划门禁、动态裁剪工具、增加 Guardrail 和回归测试。
>
> 如果业务允许，也可以在服务端检测到个人化问题但没有 computePlan 时，不提交模型草稿，而是转为安全追问或受控重试。

---

#### 场景题 2：模型调用了 computePlan，但输入是模型补的 1 月

**逐字回答：**

> 仍然不算通过。工具调用发生不代表工具输入可信。
>
> 我会检查该字段是否出现在当前用户消息、confirmed profile 或用户显式 profile patch 中。如果没有，assessment 应该是 needs_more_info；如果 computePlan 仍然返回 ready，说明证据闸门被绕过，是高优先级缺陷。
>
> 评测中需要单独记录“工具调用正确性”和“工具输入证据性”，不能只记一个 hasComputePlan 布尔值。这个场景也是为什么我把 schema、evidence gate、computePlan 二次校验和 memory source isolation 结合起来。

---

#### 场景题 3：缺月份时模型反复追问出生月份

**逐字回答：**

> 第一次追问是正确的，重复追问说明状态没有正确更新或记忆合并没有生效。
>
> 我会先检查第二轮用户消息中的“3 月”是否被 profile extractor 抽取；再检查 merge 是否把 birthMonth 合并到当前画像；再检查 Execution Plan 是否使用了最新 profile；最后确认 assessment 的证据上下文是否包含当前消息。
>
> 如果画像已经有 birthMonth=3 且来源是用户确认，但计划仍然 needs_more_info，就属于状态传播问题；如果画像没有更新，就是抽取或持久化问题；如果画像更新了但模型仍然追问，可能是上下文 Prompt 或工具输入没有同步。
>
> 评测要设置多轮连续用例，而不是每轮单独测。关键断言是第二轮不能重复追问已确认字段，并且要继续进入 computePlan。

---

#### 场景题 4：用户先说男性，后面说“我是女性”

**逐字回答：**

> 性别是高影响字段，不能简单按最新消息静默覆盖，也不能继续使用旧结果。
>
> 首先记录冲突或更正事件，标记原来的退休计算结果 stale；其次要求用户确认最终性别以及女性退休身份；然后重新构建 Execution Plan 和规则计算。
>
> 如果用户明确说“前面说错了，我是女性”，这可以被视为显式更正，但仍需重新确认女性退休类型。因为性别改变会影响退休年龄分支，旧的男性计算不能继续复用。
>
> 评测要检查三件事：旧结果是否失效、是否重新触发必要信息校验、是否没有把新旧结果混在同一条回答里。

---

#### 场景题 5：用户问纯政策问题，但画像字段完整

**逐字回答：**

> 画像完整不代表每个问题都要做个人化计算。用户问的是一般政策还是自己的结果，应该由当前请求意图决定。
>
> 例如用户问“上海最低缴费年限有没有官方依据”，即使画像里已经有完整出生年月和缴费月份，也应该走 policy_explanation，只调用 retrievePolicy，不触发 assessRequiredInfo 和 computePlan。
>
> 这样可以减少延迟和无关的隐私处理，也避免把一般政策口径误说成用户个人结果。E2E 里要同时断言 requiredTools 包含 retrievePolicy，forbiddenTools 包含 assessRequiredInfo 和 computePlan。

---

#### 场景题 6：用户问“我什么时候退休，政策依据是什么”，但 RAG 只返回摘要

**逐字回答：**

> 这个场景不能把摘要当成官方依据。个人化计算可以在信息完整后由 computePlan 完成，但“官方依据”这个 claim 必须有官方 citation 支持。
>
> 如果 RAG 只返回 derived_summary 或 demo_summary，我会把检索状态记录为有候选但官方证据不足，回答可以说明知识库中的摘要口径，但不能声称“官方文件规定”。如果用户明确要求官方出处，应该安全降级：告诉用户当前没有获得可验证的官方来源，建议查询官方人社渠道，或者受控扩大检索范围。
>
> Guardrail 应该把“声称官方但只有摘要”识别为违规。这个场景能区分“检索到了内容”和“检索到了足以支撑当前表述的来源”。

---

#### 场景题 7：RAG 召回了官方文件，但文件已经过期

**逐字回答：**

> 官方来源和当前有效来源不是一回事。检索时要把 effectiveAt 作为过滤或排序条件，检查 effectiveFrom 和 effectiveTo；如果文档是官方但过期，就不能直接作为当前政策结论。
>
> 如果用户问历史时点，例如“2024 年当时的政策是什么”，可以使用历史版本，但回答要明确查询时间和适用范围；如果用户问当前政策，过期来源最多作为历史背景，不能作为当前依据。
>
> 评测要加入同一主题的新旧官方文档，并验证 effectiveAt 不同会返回不同 sourceVersion。否则官方 boost 可能把旧文件排在新文件前面。

---

#### 场景题 8：两个官方来源互相矛盾

**逐字回答：**

> 我会先判断它们是否真的矛盾，还是一个是上位政策、另一个是地方实施细则，或者适用时间和人群不同。
>
> 如果通过地区、时间、人员类型和政策层级仍然不能消解冲突，就不能让模型自行选择一个数字。系统应该返回 policy_conflict 或 needs_manual_verification，展示两条来源的适用条件，并告诉用户需要以当前办事窗口或最新正式文件为准。
>
> 在计算链路中，如果规则参数和官方来源冲突，也应该阻止输出确定性个人结果，直到参数包完成更新或人工确认。政策系统中，“有两个官方来源”不等于“可以随便选一个”。

---

#### 场景题 9：RAG 无结果，但模型知道答案

**逐字回答：**

> 模型知道不代表系统有当前可追溯证据。对于一般概念可以给低确定性的解释，但涉及具体政策数字、官方出处或个人资格判断时，不能凭模型参数记忆输出。
>
> 我会先尝试受控 query rewrite，例如把用户口语改成政策术语，但不放宽地区、有效时间和 official 要求。如果仍然没有结果，就返回“当前知识库未找到足够依据”，并建议官方查询渠道。
>
> 面试中我会把这称为 abstention，而不是能力不足。可信 Agent 必须知道什么时候不应该回答。

---

#### 场景题 10：embedding 服务挂了，是否整个 RAG 都不可用

**逐字回答：**

> 不一定。embedding 失败时可以降级到 lexical，只要数据库和关键词索引仍然可用。结果要带 degraded、embedding_unavailable 和 lexical_fallback 标记。
>
> 但降级之后不能假装仍然完成了 hybrid retrieval，也不能把降级召回结果包装成百分之百可靠。对于强关键词政策问题，lexical 可能仍然足够；对于语义表达很宽泛的问题，应该降低置信度或提示用户换一种问法。
>
> 如果 lexical 也失败，再考虑 legacy 或安全终止。降级路径的关键是状态透明和风险跟随，而不是无条件返回文本。

---

#### 场景题 11：模型调用 retrievePolicy 三次，三次 query 只有细微变化

**逐字回答：**

> 我会先区分合理 query rewrite 和无效循环。合理改写应该改变召回效果或弥补术语差异；如果连续 query 只是同义改写、候选集合和排名都没有变化，就应该触发重复检索检测。
>
> 系统可以记录 query hash、过滤条件、候选 sourceIds 和结果状态。如果连续多次输入不同但输出集合相同，就没有继续消耗外部调用的价值。
>
> 处理上可以设置最大检索次数、query rewrite 次数和总预算。超过预算后，进入“基于已有 citation 回答”或“无法找到更充分依据”的终止状态。

---

#### 场景题 12：规则计算耗时很低，为什么还需要工具事件和 trace

**逐字回答：**

> 工具事件和 trace 的价值不只在性能，而在可解释性、审计和故障定位。
>
> 用户质疑结果时，需要知道系统使用了哪些输入和政策版本；开发者排查错误时，需要知道哪条规则命中、哪一步返回了 null；评测时需要判断模型是否真的调用了规则引擎；政策更新后还需要回放历史结果。
>
> 所以即使计算只需要几毫秒，也要记录 planId、输入摘要、ruleSet、paramsId、trace 和结果状态。但要注意隐私和日志脱敏，不能把完整身份证号或不必要的敏感信息写进日志。

---

#### 场景题 13：用户说“我只知道大概出生年份，按 1977 年算吧”

**逐字回答：**

> 这里要区分用户明确授权采用假设，和系统把假设当成事实。
>
> 如果用户明确说“按 1977 年做示例估算”，系统可以创建一个 scenario input，标记 source= user_assumption、status= provisional，并在回答中明确“以下按假设条件估算，不代表已确认画像”。这个结果不能写入长期 confirmed memory。
>
> 如果用户只是说“我大概 1977 年”，则不能直接标记 confirmed，应继续追问或给出区间说明。关键是把假设输入和用户真实画像隔离。

---

#### 场景题 14：用户明确要求你不要展示来源，只要答案

**逐字回答：**

> 可以简化展示形式，但不能取消内部证据要求。用户不想看长链接，不代表系统可以不检索或无依据生成政策数字。
>
> 我会在内部保留 citation，在面向用户的回答中只展示简短来源名称和必要的适用说明；如果用户后续需要，再展开官方链接和原文片段。
>
> 对个人化数字仍然需要 computePlan；对官方声明仍然需要官方 citation。可信性约束是系统内部要求，不应该完全交给用户选择。

---

#### 场景题 15：用户说“我之前的计算和官方窗口不一致，系统是不是错了”

**逐字回答：**

> 我不会立即为系统辩护，也不会立即承认一定是系统错误。首先需要把两次计算的输入和版本对齐：出生年月、性别、女性退休身份、累计缴费月份、参保地区、计算日期、规则集和政策版本。
>
> 其次要区分差异来源：可能是官方窗口采用了更新的政策版本，可能是用户身份口径不同，可能是系统当前延迟退休规则仍是近似公式，也可能是缴费记录口径不同。
>
> 系统应该展示计算依据和不确定性，并把这种案例纳入误差分析。如果确认是规则实现问题，就修复参数或规则、增加回归样例并重新评估；如果是数据口径差异，就把差异原因解释清楚。
>
> 当前项目最大的风险之一正是不能把近似的延迟退休公式说成完全等价于官方逐月表，所以面对这个问题要保持诚实。

---

#### 场景题 16：两个用户同时更新同一个画像字段，如何处理并发覆盖

**逐字回答：**

> 长期画像更新不能只做最后写入覆盖。需要为 profile 或 memory envelope 增加版本号、更新时间或乐观锁；保存时检查读取版本是否仍然有效，冲突时重新合并 facts，而不是直接覆盖整个 JSON。
>
> 对同一用户主体的并发请求，还需要按 subject 或 conversation 做串行化，或者在数据库层使用事务和 compare-and-swap。事实合并本身也要遵循 source priority 和 conflict policy。
>
> 当前项目重点完成了单会话内的 fact merge 和来源隔离，完整的多请求并发一致性需要在真实多用户部署时补充。

---

#### 场景题 17：用户要求删除长期记忆，你的 Agent 如何响应

**逐字回答：**

> 删除记忆应该是明确的系统动作，不应只让模型说“已经删除”。系统需要识别删除意图，经过身份或 session 校验后调用专门的 memory deletion 工具或服务端接口，删除或匿名化长期 profile，同时根据数据保留策略处理会话日志和审计记录。
>
> 删除后还要验证：下一次加载画像时字段确实不存在，缓存没有继续返回旧值，摘要或工具事实没有被错误当成长期画像重新写回。
>
> 当前项目已经有长期画像过滤和持久化边界，但完整的数据删除、导出和隐私生命周期接口属于上线前需要补齐的能力。

---

### 多风险组合场景题

#### 组合题 1：完整画像 + 政策版本 + 官方出处 + 结果质疑

**面试官：**

> 用户说：“我 1977 年 3 月出生，男性，缴费 170 个月。请按 2026 年政策算一下我什么时候退休，为什么和我在网上看到的结果不一样，还要给官方出处。”你怎么处理？

**面试逐字稿：**

> 我会先把这句话拆成四个子任务：按指定时间或版本进行个人化计算；判断最低缴费缺口；解释差异可能来自哪些口径；召回对应版本的官方来源。
>
> 第一，抽取并确认出生年月、性别和缴费月份。因为用户已经明确提供了这些字段，可以进入信息评估。
>
> 第二，构建带 effectiveAt 或 policy version 的 mixed plan。计算和检索都必须使用同一政策时间上下文，不能规则用 2026 参数、RAG 却返回旧政策。
>
> 第三，由规则引擎计算并保留 ruleSet、paramsId、versionContext 和 trace。
>
> 第四，RAG 查询时带上海地区、退休年龄/最低缴费类别、用户指定的有效时间和 requireOfficial=true。
>
> 第五，比较系统结果与用户看到的结果时，不直接说对方错了，而是检查出生月份、女性身份、地区、退休年份、政策版本、最低缴费 schedule 和是否使用了近似算法。当前项目的延迟退休计算有逐月表精度边界，我会主动把“估算结果”和“官方口径”区分开。
>
> 最终回答应该分成：我的计算条件、当前规则结果、政策依据、与其他结果可能不同的原因、需要人工核验的事项。只要版本或来源存在冲突，就降低确定性，不把不一致强行解释成用户输入错误。

---

#### 组合题 2：缺字段 + 用户拒绝追问 + 要求官方数字

**面试逐字稿：**

> 用户拒绝追问不会改变个人化计算的必要条件。我会把任务拆成可以继续完成和不能完成两部分。
>
> 可以继续完成的是一般政策解释：说明延迟退休和最低缴费年限的总体规则，并提供官方来源。不能完成的是该用户精确退休年月和个人缴费缺口。
>
> 我会用一次性、低成本的追问说明原因，例如“要精确到月份，只差确认出生月份；如果暂时不方便提供，我可以先按一般政策解释，但不会替您假设具体月份。”
>
> 如果用户仍然拒绝，系统应该安全结束个人化分支，而不是把一般政策数字包装成个人结果。

---

#### 组合题 3：长对话 + 画像冲突 + RAG 过期

**面试逐字稿：**

> 这个场景不能直接复用摘要和旧 citation。首先重新构建当前结构化画像，识别出生年份冲突并要求确认；其次把旧计算结果标为 stale；再次检查历史 citation 的 effectiveTo 或 sourceVersion，过期来源不能支持当前回答。
>
> 在用户确认出生年份之前，我可以解释一般政策，但不进行个人化计算；在重新检索到当前有效官方来源并且画像 ready 后，才能重新执行。
>
> 这说明长对话系统不能只保存“上一轮答案”，而要保存事实来源、派生依赖和政策版本。

---

#### 组合题 4：RAG 命中官方来源，但模型输出了来源没有的数字

**面试逐字稿：**

> 这属于 claim-evidence 不一致。官方来源命中只能说明来源质量，不能证明回答中的每个数字都有支持。
>
> 我会把回答中的数字 claim 抽取出来，和 citation excerpt、结构化工具结果逐一对齐。对于来源没有出现、规则结果也没有返回的数字，标记为 unsupported_policy_number。
>
> 当前后置 Guardrail 可以识别部分这类情况，但生产上应在草稿提交前完成 claim-level 校验，失败后优先删掉无支撑数字、改成条件性表达或重新检索，而不是直接把整段回答放出去。

---

#### 组合题 5：同一用户快速连续发送两条消息

**面试逐字稿：**

> 需要考虑并发状态一致性。第一条消息可能正在计算或持久化，第二条消息已经基于旧画像开始执行。
>
> 对同一 conversation 或 session，我会引入请求版本、消息序号或乐观锁。第二条请求加载画像时要知道第一条是否已经提交；持久化时检查版本，不允许旧请求覆盖新画像。
>
> 工具结果也要带 conversation turn 和 profile version，避免把旧结果写入新状态。用户体验上可以选择排队、合并或提示上一轮仍在处理中。
>
> 当前项目的主要链路已经有会话和画像持久化，但高并发下的完整串行化和版本冲突处理属于需要进一步补齐的生产能力。

---

## 五、最大难点、Bad Case 与真实项目复盘

> 本部分回答：面试官如何通过现象、根因、排查、修复和验证确认项目真实性。

### 八类核心技术难点

#### 难点一：如何防止模型补全缺失字段

##### 根因

LLM 的目标是完成回答，容易把缺失信息当成常见默认值。

##### 解决

- schema 限制类型和范围。
- assessRequiredInfo 强制前置。
- 当前消息和长期记忆双重证据校验。
- ready=false 时返回 needs_more_info。
- computePlan 内部再次检查，形成第二道门。
- eval 专门覆盖“只说年份、模型补 1 月和 0 个月”的回归场景。
- Guardrail 再检查最终回答。

##### 面试金句

> Schema 解决“值是否合法”，证据校验解决“值是否真实来自用户”，两者不能混为一谈。

#### 难点二：如何防止工具调用顺序错误

##### 根因

只依赖 Prompt 时，模型可能跳过工具或乱序调用。

##### 解决

- 服务器先构建 Execution Plan。
- 计划记录 required step 和 missingFields。
- 工具 description 明确调用前置条件。
- computePlan 内部再次调用 assessRequiredInfo。
- runtimeToolSupport 记录实际 toolSequence。
- 端到端测试检查 requiredTools 和 forbiddenTools。

##### 局限

当前服务端计划是确定性生成，实际 LLM 仍可能不完全遵循计划。更强的实现应在服务端将计划编译为可执行状态机，或把不允许的工具从当前轮工具集合中移除。

#### 难点三：如何让政策数字可追溯

##### 根因

只返回文本片段会失去来源、版本和生效时间。

##### 解决

- 文档 manifest。
- sourceId 和 chunkId。
- sourceType 分类。
- sourceUrl、发布机构、版本和有效期。
- citation completeness 评估。
- requireOfficial 过滤和 official boost。
- answer guardrail 检查官方声明。

#### 难点四：如何融合关键词检索和向量检索

##### 根因

政策查询既有精确词，也有自然语言表达：

- “15 年”和“180 个月”是精确术语。
- “我还要交多久”是语义表达。
- “4050”是强关键词。
- “弹性退休”可能需要语义扩展。

##### 解决

- lexical 召回保证精确关键词。
- vector 召回处理语义相似表达。
- RRF 融合两路排名。
- rerank 结合规则分、文本相似度、类别和来源。
- 官方来源加权。
- source diversification 减少同一来源占满 Top-K。

#### 难点五：如何处理 embedding 或数据库不可用

##### 根因

外部模型、数据库和向量服务都可能失败。

##### 解决

- embedding 不可用时降级 lexical。
- hybrid 失败时降级 legacy。
- 数据库未配置时返回 disabled。
- 结果中保留 degraded 和 reason。
- 不在 disabled/empty 状态下生成伪造 citation。

#### 难点六：长期记忆如何避免污染

##### 根因

模型调用工具时可能传入默认字段，工具结果也可能包含派生字段。

##### 解决

- Memory V2 fact 记录 source.type。
- compute_plan 来源的 fact 不可直接投影为用户事实。
- conflicted 和 stale 不参与计算。
- 只持久化白名单和显式确认的用户画像。
- 冲突不静默覆盖，保留 conflicts。

#### 难点七：如何在长对话中保留有用信息

##### 根因

直接截断会丢失早期关键画像和工具结论。

##### 解决

- 最近消息保留。
- 摘要保留历史主题。
- toolFacts 保留工具派生结果。
- profile 单独作为结构化上下文传入。
- contextStats 记录压缩前后消息数和丢弃数量。

#### 难点八：如何评估 Agent 而不是只看“能不能回答”

##### 根因

端到端看起来能回答，不代表工具顺序和事实来源正确。

##### 解决

分别测试：

- 规则正确性。
- 信息完整性。
- 记忆合并。
- 冲突处理。
- 长上下文压缩。
- Guardrail 违规识别。
- Execution Plan 意图和步骤。
- E2E 工具序列。
- RAG 召回和 citation 完整性。

### 八类难点的深度复盘版：从 Bad Case 到回归门禁

前面的八类难点是速记版，下面补充面试官真正想听的工程闭环。这里的“实际问题”需要准确理解：难点一和难点六来自开发过程中的真实链路回放与已有回归用例；难点二、三、四、五、七、八既包含真实 E2E 中观察到的现象，也包含我为了验证边界而主动注入的失败条件。它们不是线上生产事故，我不会把离线评测回放包装成线上事故，但它们确实是在真实工具链或真实依赖上发现并修复的系统问题。

#### 难点一：缺字段和模型默认值污染

**Bad Case 和后果**

我实际重点排查过的一条输入是：

```text
我是1977年出生的男性，我什么时候退休？
```

用户只提供了出生年份和性别，没有提供出生月份，也没有提供累计缴费月份。某次真实模型链路回放中，模型为了满足工具参数，把输入组织成了下面这样：

```json
{
  "birthYear": 1977,
  "birthMonth": 1,
  "gender": "male",
  "paidMonths": 0
}
```

这两个值从 schema 看都合法：月份 `1` 在 1 到 12 之间，缴费月份 `0` 也是非负整数。因此规则引擎没有抛异常，而是继续返回了一个 `ready` 的计算结果，回答中出现了具体退休年月和缴费缺口。问题的危险性就在这里：它不是“接口报错”，而是“正常返回了一个没有事实依据的结果”。如果这两个字段继续被写进 Memory，用户下一次只问“那我还差多久”，系统就可能把模型猜的 1 月和 0 个月当成真实画像使用。

**如何复现和看见问题**

我先用完整画像跑通正常样例，确认规则引擎、回答和持久化链路本身都能工作；然后只删除出生月份和缴费月份，保留同一个问题，最后再用模型工具调用回放或固定参数注入的方式模拟“模型补默认值”。这样可以把“正常链路”和“缺字段链路”放在同一套环境里对比。

排查时我没有只看最终文字，而是把同一个 `traceId` 下的关键状态放在一起比较：

| Trace 节点 | 期望 | 出问题时观察到的现象 |
|---|---|---|
| 用户原文 | 只有 birthYear、gender | 没有 birthMonth、paidMonths |
| profile patch | 只产生用户明确说过的字段 | 工具快照中多出 1 和 0 |
| required-info | `needs_more_info` | 被错误判为 `ready`，missingFields 为空 |
| Execution Plan | 进入追问分支 | 仍允许或实际执行 `computePlan` |
| computePlan 入参 | 缺字段或拒绝计算 | 收到合法的 1 月和 0 个月 |
| 规则结果 | 不应有确定性个人数字 | 正常返回退休年月和缺口 |
| 最终回答 | 追问，不给个人确定数字 | 文字完整，反而掩盖了错误 |
| Memory | 不保存推断字段 | 失败版本可能留下错误画像 |

**真正根因和错误尝试**

第一反应很容易怀疑日期计算公式，但把同一组参数直接交给规则引擎后，结果是稳定的，所以规则引擎不是这条 Bad Case 的第一根因。真正根因有四层：

1. 只做了类型和范围校验，没有做“字段证据”校验。
2. 把模型传入的 profile 快照当成了用户确认画像。
3. 前置 `assessRequiredInfo` 不是不可绕过的服务端门禁。
4. 记忆写入流程没有把用户事实、模型推断和工具派生结果完全隔离。

我尝试过只强化 Prompt，例如写“不要猜测缺失信息”；这只能降低概率，不能提供确定性保证。也尝试过把字段全部设成 required，结果只是把“缺字段”变成“模型必须想办法填字段”，反而增加了补默认值的动机。还尝试过只在最终回答做关键词拦截，但这时错误计算和错误记忆可能已经发生，属于太晚的防线。

**最终修复**

最终方案不是单点修补，而是把“值”和“证据”拆开：

- schema 继续负责类型、范围和结构合法性；
- `profile_extract` 只抽取用户明确表达的字段；
- `assessRequiredInfo` 同时检查当前消息证据和已确认、无冲突的 Memory fact；
- 缺字段返回 `needs_more_info` 和最小 `missingFields`，而不是要求模型填默认值；
- `computePlan` 内部再次执行前置校验，避免模型跳过信息闸门；
- `model_inferred`、`compute_plan` 和派生快照不进入长期用户画像；
- E2E 增加 `forbiddenTools` 和 `answerExcludes`，同时检查记忆持久化结果。

**回归验证**

修复后我至少回归了以下组合：缺出生月份、缺缴费月份、女性缺退休身份、完整男性画像、第二轮补充月份、错误默认值不写入 Memory、用户纠正字段后旧结果不继续复用。关键断言是：缺月份时 `status=needs_more_info`，`missingFields` 包含 `birthMonth`；缺缴费月份时不计算缺口；`computePlan` 不在工具序列中；最终回答不出现确定性个人退休数字；补齐字段后可以恢复到 `ready`。已有的 `required-info-rejects-invented-january-and-zero-paid-months` 就是把这条问题固化成回归的用例。

**面试逐字稿**

> 我实际遇到过一个比较隐蔽的 Bad Case：用户只说“我是 1977 年出生的男性，我什么时候退休”，没有说出生月份和累计缴费月份，但模型在调用工具时补了 `birthMonth=1` 和 `paidMonths=0`。这两个值在 schema 层都合法，所以工具和规则引擎都正常返回，最终回答也有具体退休年月，看起来像成功，实际上是一个没有用户证据的个人化结果。
>
> 我当时没有先改 Prompt，而是沿着完整 trace 对比用户原文、profile patch、Memory 合并结果、Execution Plan、`computePlan` 入参、规则结果、最终回答和持久化结果。最后确认规则计算本身没有问题，根因是系统只验证了 value 合法，没有验证 value 的 evidence；同时把模型工具参数误当成用户事实，记忆层又缺少来源隔离。
>
> 修复时我把字段值和字段证据分开。只有字段值合法、并且能在当前用户消息或已确认 Memory 中找到来源，assessment 才能返回 ready；`computePlan` 内部再做一次校验；推断字段和派生结果不允许写入长期画像。评测上，我把缺字段时禁止 `computePlan`、回答不得出现个人化数字、错误字段不得进入 Memory、补齐字段后能够继续计算都加入了回归。这个问题让我把系统从“字段存在就计算”改成了“字段有可信证据才计算”。

#### 难点二：Execution Plan 和真实工具执行不一致

**代表性 Bad Case**

我主动在真实 E2E 中注入过一种情况：计划已经判断为个人化测算且缺少出生月份，期望步骤是 `assess_required_info → ask_clarification → answer`，但模型仍然直接发起了 `computePlan`；另一个反例是纯政策问题，画像虽然完整，模型却额外调用了个人化计算。

**后果和排查**

这种错误不一定让最终答案立刻变错，却会造成无关计算、增加隐私暴露和延迟，更严重时会绕过信息闸门。排查时我比较 `plan.steps` 和实际 `toolSequence`，并检查每个工具事件的输入和输出状态：

```text
expected: assessRequiredInfo → ask_clarification → answer
actual:   assessRequiredInfo → computePlan → answer
```

如果是纯政策问题，则应当是 `retrievePolicy → answer`，但实际序列可能多出 `assessRequiredInfo → computePlan`。这说明问题不在计划对象有没有生成，而在计划有没有成为执行约束。

**根因、修复和取舍**

根因是把 Plan 当成了 Prompt 中的一段说明，而不是服务端的权限和状态依据。最终修复包括：服务端确定性构造 Plan；工具内部按当前 profile 和 evidence 再校验；runtime 记录 required/forbidden tool；Guardrail 检查计划要求、工具序列和回答 claim 是否一致。这样即使模型发起错误调用，工具也不能直接产出可信结果。

这个方案牺牲了一部分 Agent 的自由探索能力，也可能让模型发出一次最终会被拒绝的无效调用。生产化下一步是根据计划状态动态裁剪工具集合，把“不能调用”从 Prompt 约束提升为服务端权限控制，或者直接把 Plan 编译成状态机。

**回归验证和逐字稿**

回归不只断言答案，而是分别断言：个人化缺字段场景禁止 `computePlan`；纯政策场景禁止 `computePlan` 和 `assessRequiredInfo`；混合场景必须同时包含计算和官方检索；计划更新后不能执行旧计划步骤。

> 我遇到的不是“Plan 没生成”，而是“Plan 生成了，但模型执行路径没有完全遵守”。所以我把计划拆成两种作用：给模型的任务上下文，以及给服务端的验证和权限依据。真实 trace 中同时保存计划步骤和实际工具序列，工具内部再做二次门禁，E2E 检查 requiredTools 和 forbiddenTools。这样可以把“模型有没有听话”变成可观测、可断言的问题。当前版本还不是完全的状态机执行器，这也是我下一步会升级的地方。

#### 难点三：政策数字可追溯，而不是“看起来有来源”

**代表性 Bad Case**

用户问“上海最低缴费年限是多少，有官方依据吗”，检索结果里确实有相关文字，但命中的来源是 `derived_summary` 或 `demo_summary`，没有官方 URL。若模型只看到摘要内容，可能会回答“根据官方规定，最低缴费年限是……”。

**后果和排查**

后果不是单纯引用链接缺失，而是把项目整理的摘要冒充成官方依据，用户无法追溯，政策更新后也可能继续使用旧口径。排查时我检查 `retrievePolicy.status`、citation 的 `sourceType`、`sourceUrl`、`sourceVersion`、`effectiveFrom/effectiveTo`，再对照回答中是否出现“官方、原文、政府文件”等高承诺词。典型失败状态是：

```text
retrieval.status = ready
citations        = [derived_summary]
answer.claim     = “官方依据显示……”
```

这说明“有召回结果”和“有资格支撑官方 claim”不是同一个状态。

**根因、修复和验证**

根因是检索层只返回了相关性结果，回答层没有根据来源类型重新判断 claim 的许可范围。修复时我给文档做 manifest 和 sourceType 分层，`requireOfficial=true` 时优先过滤官方来源，citation 携带 URL、发布机关、版本和有效期；Guardrail 识别官方声明，若没有官方质量 citation，就要求降级表达或提示无法确认。

回归包括：官方来源允许一般政策数字；只有摘要时禁止“官方依据”表述；过期官方来源不能支持当前政策；混合问题中个人数字必须由规则结果支撑，不能由 citation 代替。

> 我后来把 citation 当成证据对象，而不是回答末尾的一条装饰链接。来源类型、URL、发布机关和有效期决定它能支撑什么表述；回答中的“官方依据”是一个高风险 claim，必须单独验证。当前系统能识别这类支撑不足并记录违规，后续还要把后置识别升级成提交前阻断。

#### 难点四：Hybrid Retrieval 的排序和多样性

**代表性 Bad Case**

政策查询既可能包含精确词，也可能是口语表达。例如“4050 怎么办”和“我还要交多久”分别依赖强关键词和语义理解。回放中我用相邻主题的候选进行注入，观察到语义相似的补贴 chunk 可能挤进最低缴费问题的 Top-K；另一个问题是同一官方文档的多个 chunk 因为文字高度相似，几乎占满 Top-K，导致真正相关的另一份政策来源没有露出。

**排查方式**

我把检索 trace 拆成 lexical 候选、vector 候选、RRF 融合分、rerank 分、metadata 过滤结果以及 Top-K 的 sourceId 分布。排查重点不是只看最终第一条，而是看“正确 source 在哪一步消失”：如果 lexical 有、vector 没有，属于语义召回问题；如果两路都有但融合后掉出，检查 RRF 权重；如果融合保留但 rerank 后消失，检查 source boost 和类别特征；如果同源 chunk 霸榜，则是多样性策略缺失。

**解决方案和验证**

最终采用 metadata 过滤、lexical/vector 双路召回、RRF 融合、rerank、官方来源加权和 source diversification。对“4050”“15 年”“180 个月”等词保留 lexical 强度，对自然语言表达保留 vector 覆盖，再限制同一 sourceId 的 chunk 数量，避免一个文档的局部重复掩盖其他适用条件。

验证时分别比较 lexical、vector、hybrid、hybrid+rereank 的 Recall@3 和 source 分布，并加入别名、数字表达、同源 chunk 霸榜和跨地区干扰样例。这里的 94% 是历史 RAG benchmark 的 source-level Recall@3，不应说成最终答案准确率。

> 我选择 hybrid 不是因为“两个检索一定比一个好”，而是因为政策场景同时存在数字术语和口语表达。排查时我会沿候选链路看正确 source 在 lexical、vector、RRF 还是 rerank 阶段丢失，再针对性调整，而不是盲目改 Top-K。最终还要检查 sourceId 多样性，因为 Top-K 被同一文件切块占满时，表面相关性很高，实际证据覆盖反而变差。

#### 难点五：embedding 或数据库不可用时如何安全降级

**代表性 Bad Case**

我在评测中注入 embedding 超时和数据库未配置两种失败。错误行为是：检索没有拿到可验证 citation，但模型仍凭上下文回答“官方文件规定……”。另一种错误是把技术异常吞掉后返回空数组，调用方误以为“检索成功但没有更多结果”。

**排查、根因和修复**

我先看外部依赖错误，再看 `retrieval.status`、`degraded`、`reason`、candidateCount、returnedCount 和 citation 数量，确认是 embedding 失败、混合检索失败还是数据库整体不可用。根因是失败状态没有被当成一等业务状态传递到回答层，模型只看到“没有引用”而不知道“为什么没有引用”。

修复为显式状态：embedding 不可用时走 lexical fallback，并标记 `degraded` 和原因；混合链路失败时再尝试 legacy；数据库不可用返回 `disabled`；`empty` 表示依赖正常但没有相关结果；`disabled` 或无官方 citation 时禁止伪造来源。个人化规则计算与政策检索分离，检索不可用时仍可以返回已完成的计算，但不能声称获得了当前官方依据。

回归验证要求：embedding 故障时能走 lexical 且不伪造 citation；数据库故障时返回安全降级；无结果时明确说明无法确认；恢复依赖后同一 case 能重新变成 ready。还要记录降级比例和恢复时间，否则只知道“接口没挂”而不知道系统是否长期处于降级。

> 我对降级的原则是“可以少做，但不能假装做过”。`degraded`、`empty` 和 `disabled` 必须区分：前者是降级后仍有结果，第二个是检索正常但没找到，第三个是依赖不可用。只有在状态和 citation 都满足条件时，回答才可以使用“官方依据”这类表述。

#### 难点六：长期记忆污染和错误事实传播

**代表性 Bad Case**

在一条记忆回归中，初始画像中有用户明确确认的 `birthYear=1977`，但 `birthMonth=1` 来自 `compute_plan`，`paidMonths=0` 来自 `profile_update` 的推断。若把 Memory 当成普通字典合并，下一轮投影出来的 profile 就会变成完整画像，系统可能直接计算。

**后果和排查**

这类错误具有跨轮次、跨会话放大效应：第一轮只是一个工具参数错误，第二轮会被误当成用户历史事实，第三轮又可能产生新的规则结果。排查时我检查每个 fact 的 `path/value/source.type/status/confidence`，再对比 `projectProfileWithoutMemory` 的投影结果和最终持久化白名单。关键问题是“值是否存在”不能替代“来源是否允许进入计算”。

**最终解决和回归**

Memory V2 保留事实来源、置信度、confirmed/inferred/conflicted/stale 状态和冲突历史；只有用户显式确认且未冲突的白名单字段投影为计算画像；`compute_plan` 和模型推断只能作为当前上下文或候选事实；用户更正高影响字段时，旧的退休结果和缴费缺口必须视为 stale，重新计算。

已有回归会检查派生字段不进入长期记忆、空值不覆盖有效值、前后冲突标记 `conflicted`、用户补充月份后能累积而不是重置原画像。完整的事实依赖图和自动失效传播目前仍是后续工程化方向，这一点要主动说明。

> 我把记忆理解成“带证据的事实账本”，不是一个永远覆盖的 JSON。真正需要验证的是来源、状态和投影结果。只要一个派生字段没有用户证据，即使它的值很合理，也不能进入长期画像，否则错误会在后续对话里被系统自己证明。

#### 难点七：长上下文压缩后关键事实丢失

**代表性 Bad Case**

我用 28 轮闲聊再补充出生年月和缴费信息的场景测试上下文压缩。最初的简单方案是保留最后 N 条消息，结果早期的出生月份被截断，模型下一轮再次追问；如果工具结果也被截掉，模型可能从摘要中模糊复述旧结果，甚至重新计算出不同数字。

**排查和根因**

我对比压缩前后的消息数量、`droppedMessageCount`、摘要、结构化画像和 tool facts，并检查后续 Plan 使用的 profile 是否仍包含关键字段。根因不是“摘要写得不够长”，而是把三种用途混在一个文本窗口里：自然语言连续性、用户确认事实和工具派生事实的保留要求不同。

**修复、验证和取舍**

现在采用分层上下文：最近消息维持对话连续性，summary 保留主题，结构化 `userProfile` 保留确认事实，`toolFacts` 保留当前会话可复用的计算和 citation，`contextStats` 记录压缩行为。压缩后再跑信息闸门和关键事实一致性检查，不能只看摘要是否通顺。

回归覆盖 28 轮闲聊、早期字段、工具结果、用户纠正字段和政策版本变化。取舍是上下文结构更复杂、注入内容需要排序和去重，但比简单截断更容易审计，也能避免为了压缩 Prompt 把派生结果永久写入长期记忆。

> 长上下文治理的关键不是“把摘要写得更聪明”，而是分层保存不同可信等级的信息。摘要可以帮助模型理解历史，但不能取代结构化画像；工具事实可以保留在当前会话，但不能自动变成用户事实。我的回归会验证压缩前后关键字段、工具版本和下一轮执行计划保持一致。

#### 难点八：端到端评测不能被“碰巧答对”欺骗

**代表性 Bad Case**

一条个人化问题的最终文本可能恰好写出了正确退休年份，但 trace 没有 `computePlan`，或者工具调用了但参数使用了模型补的 1 月。若只做字符串断言，这条 case 会被判为通过。

**如何检测和定位**

我把最终答案拆成 claim，并把每个 claim 映射到证据：个人退休年月对应 `computePlan.result`，政策数字对应 citation excerpt 和版本，官方声明对应 official source，用户画像复述对应 user evidence。同时比较 expected/actual 的计划、工具序列、状态和持久化结果。这样可以区分“没调用工具”“调用工具但没使用结果”“citation 命中但不支持 claim”“答案正确但污染记忆”四种不同问题。

**解决和验证**

E2E case 现在同时定义 `requiredTools`、`forbiddenTools`、`missingFields`、`computeStatus`、`retrievalStatus`、`answerIncludes/Excludes` 和 Guardrail 结果。真实模型评测再补充延迟、token、重试、降级和重复运行。修复失败 case 后加入固定回归集，并按 extraction、planning、orchestration、engine、retrieval、generation、guardrail、memory、infrastructure 分类统计，而不是只报一个总通过率。

> 我认为 Agent 评测最容易出现的假通过，就是答案碰巧正确。我的标准是任务状态、工具路径、事实来源、claim 支撑和持久化结果必须同时成立。文本是最后一层，不能替代执行证据。这样才能证明系统完成了正确任务，而不只是生成了一句看起来正确的话。

---

### 最大问题：从能运行到可信

这一部分是面试官最想听的。因为“用了 Agent、RAG、Memory、Guardrail”只是技术名词，真正做过项目的人应该能讲清楚：

- 问题最初是怎么暴露的。
- 当时看到的异常现象是什么。
- 根因为什么不是表面看起来的原因。
- 你做过哪些错误尝试。
- 最后采用了什么方案。
- 方案牺牲了什么。
- 如何用回归测试证明问题被修复。

#### 29.1 最大问题的总括回答

**面试官：这个项目制作过程中遇到的最大问题是什么？**

**面试逐字稿：**

> 这个项目最大的难点不是模型调用失败，也不是某个单独的 RAG 参数没有调好，而是“模型生成的内容、用户明确提供的事实、工具计算出来的派生结果”这三类信息很容易在系统里混在一起。
>
> 最典型的例子是，用户只说“我是 1977 年出生的男性，想知道什么时候退休”，但精确计算还需要出生月份和累计缴费月份。模型为了调用工具，可能会自行补一个 1 月，或者把缺失的缴费月份设成 0。这个值从类型上看是合法的，规则引擎也能执行，但它并不是用户事实。
>
> 如果系统只做字段 schema 校验，或者只看工具是否成功，就会把模型补出来的值当成真实输入，最后生成一个看起来很完整但实际上没有依据的个人化结果。更严重的是，如果这个结果再被写入长期记忆，错误就会污染后续会话。
>
> 我最后把问题拆成四道边界来解决：第一，字段格式校验；第二，字段是否有用户证据；第三，规则计算前的 ready 闸门；第四，最终回答和工具事实的一致性校验。同时在 Memory V2 中记录 fact 的来源、置信度、状态和冲突，明确禁止 computePlan 的派生输入反向覆盖用户确认画像。
>
> 这个问题让我意识到，可信 Agent 的核心不是让模型更会回答，而是让系统知道哪些内容可以相信、哪些内容只能作为候选、哪些内容必须重新向用户确认。

**面试官可能继续追问：你是怎么发现这个问题的？**

**回答：**

> 最开始做正常样例时，链路看起来是通的：模型能抽取字段，工具能执行，回答也有结果。真正暴露问题是在我补反例时，例如只提供出生年份、不提供月份，或者在后续轮次只补充“3 月”，观察系统是否会保留原来的出生年份。
>
> 我发现单看最终回答很难定位问题，因为回答可能没有明显报错。于是我开始同时观察四个东西：模型传给工具的 profile、当前用户消息能够证明的 profile、长期记忆里最终保存的 profile，以及工具的输出状态。对比之后发现，问题不在规则计算函数，而在输入事实的信任边界。
>
> 所以后来测试不再只判断“答案是不是包含退休年份”，还要判断模型有没有补默认值、缺字段时有没有调用 computePlan、派生结果有没有进入长期记忆，以及 Guardrail 能不能识别无支撑数字。

#### 29.2 问题一：模型补默认值，为什么是最危险的 Bug

这是本项目中最适合拿来回答“你实际排查过什么 Bug”的一条问题。它不是线上用户事故，而是我在真实模型 E2E 回放和缺字段反例测试中复现出的高风险 Bad Case；面试时要把性质说清楚，但不能因此把排查过程讲成抽象设计。

**复现输入：**

```text
我是1977年出生的男性，我什么时候退休？
```

用户只提供了 `birthYear=1977` 和 `gender=male`，没有提供 `birthMonth`、`paidMonths`。一次错误的模型工具调用参数是：

```json
{
  "birthYear": 1977,
  "birthMonth": 1,
  "gender": "male",
  "paidMonths": 0
}
```

**期望结果与实际结果：**

| 节点 | 期望结果 | 错误回放中观察到的结果 |
|---|---|---|
| profile extract | 只抽取出生年份、性别 | 用户抽取结果本身没有月份和缴费月份 |
| information gate | `needs_more_info` | `ready` 或被后续工具输入绕过 |
| missing fields | `birthMonth`、`paidMonths` | 空，或者只剩未被模型补齐的字段 |
| tool sequence | 不出现 `computePlan` | 出现 `computePlan` |
| compute input | 缺字段，不能计算 | 收到合法的 1 月和 0 个月 |
| rule result | 不产生确定性个人数字 | 返回 `ready`、退休年月和缴费缺口 |
| final answer | 追问，不给确定数字 | 输出看似完整的个人退休结果 |
| long-term memory | 不保存 1 月和 0 个月 | 失败版本可能把它们继续带到下一轮 |

**错误后果：**

第一，退休年月会因为出生月份被擅自设定而发生偏移；第二，`paidMonths=0` 会把用户没有提供的信息误判为“从未缴费”，从而输出一个虚假的缴费缺口；第三，规则引擎返回 `ready` 会让开发者误以为链路正确；第四，如果错误值写入 Memory，后续会话会把模型猜测变成用户历史事实，错误会跨轮次放大。最危险的不是一次答错，而是系统把错误事实保存下来并在后面反复使用。

**我当时怎么定位：**

我先跑完整画像的正常样例，确认模型、计划、工具和规则链路都能正常完成；然后只删掉出生月份和缴费月份，重复发送相同意图；最后通过真实模型回放和固定工具参数注入，稳定复现模型补默认值的路径。排查时没有先改 Prompt，而是把一个请求的完整 trace 展开：

```text
user_message
  → profile_patch
  → memory_merge
  → execution_plan
  → assessRequiredInfo
  → computePlan.input
  → computePlan.output
  → answer_draft
  → guardrail
  → memory_persist
```

我逐项对比了用户原文、显式 profile patch、Memory fact、计划状态、工具入参、规则结果和最终回答。结果是：用户原文和抽取 patch 都没有 `birthMonth`；但 `computePlan.input` 有 `birthMonth=1`。规则引擎对这组参数的输出是确定且稳定的，说明它只是忠实执行了错误输入。Guardrail 当时如果只看“是否存在 computePlan”，也可能认为个人数字有工具支撑；但它没有进一步验证这个工具输入是否有用户证据。这样就把根因从“退休公式错了”定位到了“事实来源校验不足”。

**根因拆解：**

这是“schema 合法性”和“业务可信性”被混为一谈：

```text
schema 合法性：birthMonth=1 是 1 到 12 的整数
业务可信性：birthMonth=1 是否来自用户明确表达或已确认画像
```

另外还有两个放大器：一是把模型为调用工具组织的 profile 快照当成用户事实；二是把“字段存在”当成“信息完整”，没有把 `inferred`、`derived` 和 `confirmed` 区分开。

**我试过但不够的办法：**

- 只在 Prompt 中写“不要猜测”：可以降低概率，但模型仍可能在长上下文或工具 schema 压力下补值。
- 把工具 schema 的字段全部设为 required：会迫使模型填值，不能表达“缺字段是正常业务状态”。
- 只在最终回答中拦截“203x 年”：错误计算和错误记忆已经发生，且文本规则容易漏报或误报。
- 只修改日期计算：无法解决 `paidMonths=0` 和女性身份默认分支，说明它不是单纯的算法 Bug。

**最终修复：**

1. schema 负责类型、范围和结构校验，不再承担“用户是否说过”的责任。
2. 从用户消息中抽取显式 profile patch，并为每个 fact 记录 `source.type`、`status` 和 `confidence`。
3. `assessRequiredInfo` 同时检查字段值和证据来源；模型传入的合法默认值如果找不到用户证据，仍然视为缺失。
4. 缺字段时返回 `needs_more_info`，生成最小追问，不进入确定性 `computePlan`。
5. `computePlan` 内部二次检查必要字段和 evidence，防止模型跳过前置工具或直接传完整快照。
6. `compute_plan`、`model_inferred` 和工具派生结果不投影为长期用户画像。
7. E2E 用例增加 `forbiddenTools=["computePlan"]`、`answerExcludes=["预计 20", "还差"]` 和派生事实不持久化断言。

**回归验证：**

修复后我重复验证了：只说年份、只说年份加性别、缺缴费月份、女性缺退休身份、第二轮补充出生月份、完整男性画像，以及模型显式传入 1 月和 0 个月的注入样例。期望行为是：缺字段用例必须为 `needs_more_info`，缺失字段准确，不能调用 `computePlan`，不输出确定性个人退休数字，错误默认值不能写入 Memory；补齐字段后才恢复到 `ready`。正常完整画像仍然能完成计算，确保安全修复没有把所有个人化请求都变成拒答。

**面试逐字稿：**

> 我实际排查过的一个 Bug 是模型为了满足工具 schema 给缺失字段补默认值。用户只说“我是 1977 年出生的男性，我什么时候退休”，没有说出生月份和累计缴费月份，但模型传给工具的参数里出现了 `birthMonth=1` 和 `paidMonths=0`。这两个值从类型上都合法，所以规则引擎正常返回了结果，最终答案也看起来很完整。
>
> 我当时先用完整画像跑正常样例，再删掉出生月份和缴费月份做反例回放。排查时沿着同一个 trace 对比用户原文、profile patch、Memory 合并结果、Execution Plan、`computePlan` 入参、规则输出、回答草稿和持久化结果。我发现用户原文和显式画像里没有这两个字段，但工具入参里出现了；规则引擎对给定参数没有算错，真正的问题是系统把“合法值”误当成了“有证据的用户事实”。
>
> 我试过强化 Prompt 和把字段设成 required，但前者只能降低概率，后者反而会逼模型填值。最后我增加了字段 evidence 校验：只有字段合法并且来自当前用户消息或已确认 Memory，信息闸门才返回 ready；`computePlan` 内部再做一次校验；推断字段和派生结果不能写入长期画像；E2E 同时断言缺字段时禁止 `computePlan`、回答不能出现确定个人数字、错误值不能进入 Memory。
>
> 修复后，缺月份场景会稳定进入 `needs_more_info`，只追问出生月份和累计缴费月份；补齐以后才恢复计算，完整画像正常样例没有回归。这个问题对我最大的启发是，Agent 的安全边界不能只放在 Prompt 或最终文本层，必须沿着输入证据、工具状态、回答 claim 和持久化一起校验。

---

#### 29.3 问题二：Execution Plan 和真实工具执行不一致

**异常现象：**

- 计划要求先 assessRequiredInfo，但模型直接调用 computePlan。
- 计划是纯政策解释，但模型调用了个人化测算。
- 计划要求官方 citation，但模型拿到普通摘要后仍然声称有官方依据。
- 最终答案看起来正确，但工具路径不符合预期。

**解决思路：**

不能只把计划放进 Prompt。计划需要被转换成运行时的约束和可观测状态。

**面试逐字稿：**

> 我后来发现，计划写得很清楚并不代表模型一定会严格执行。Prompt 中的 required step 只能降低错误概率，不能成为强制执行机制。
>
> 所以我把计划拆成两个作用：一是给模型提供任务上下文，二是给服务端提供验证依据。服务端会记录计划要求和实际工具序列，工具事件会记录 assessRequiredInfo、computePlan、retrievePolicy 是否成功、输出是否 ready、是否命中官方来源。
>
> 对个人化测算，computePlan 内部再次检查必要信息；对最终回答，Guardrail 根据计划要求和工具状态判断是否允许出现个人化数字或官方声明。
>
> 当前版本的强制程度还可以进一步提高：生产化时，我会根据计划动态生成当前轮可用的工具集合，或者把计划编译成状态机。比如状态是 needs_more_info 时，当前轮根本不暴露 computePlan；状态变成 ready 后才把 computePlan 加入可用工具。这样从“告诉模型不要调用”升级为“模型没有权限调用”。

**追问：为什么当前没有直接动态裁剪工具？**

**回答：**

> 因为我当时优先完成统一 Agent Runtime 和工具观测链路，同时保留工具内部的二次门禁。动态裁剪工具会带来上下文重建、流式状态管理和计划更新问题，需要更完整的执行器。
>
> 当前方案的优点是实现成本较低、工具可复用、即使模型乱序也有内部校验；缺点是模型仍然可能发出不必要的调用，只能在服务端拒绝或返回 needs_more_info。下一步应该把前置条件真正下沉到工具可见性和服务端状态机。

---

#### 29.4 问题三：政策逻辑容易“看起来对，边界上错”

**异常现象：**

- 典型年份测试通过，但出生月份边界不正确。
- 男性、女性不同身份的延迟节奏被统一公式处理。
- 退休年份跨越最低缴费年限调整节点时，计算结果没有切换到新参数。
- 规则结果和政策文档描述不完全一致。

**为什么难：**

政策文本是自然语言，规则引擎需要离散化；一旦离散化方式不对，系统会产生稳定但错误的结果。稳定性不能证明政策编码正确。

**面试逐字稿：**

> 规则引擎最难的地方不是写一个加减法，而是把政策文本中的适用范围、时间边界、人员类别和逐步变化关系转换成可执行规则。
>
> 我采用了规则和参数分离的方式：规则描述判断流程和计算步骤，参数描述退休年龄、最低缴费月份 schedule、政策起始时间和版本。这样至少能够做到版本可追踪、结果可复现和规则 trace。
>
> 但在实现延迟退休时，我发现不能因为公式可以运行，就声称它完全等价于官方逐月表。当前实现使用按月份差分段的参数化公式，而官方政策对不同群体的延迟节奏可能不同。因此它更适合作为框架验证和近似计算，不应直接包装成逐月精确复现。
>
> 如果进入生产，我会把官方逐月对照表作为权威输入，或者把不同群体的分段规则分别编码，输入出生年月后直接查表或执行分段映射。测试也不能只测 1977 年、1980 年这种典型样例，而要覆盖政策起始月、分段切换月、最大延迟月和退休年份跨越最低缴费调整节点的边界。
>
> 我的原则是：规则引擎保证执行稳定，政策表和人工复核保证规则本身正确。二者不能混为一谈。

**追问：如果产品经理要求今天就上线，你会怎么办？**

**回答：**

> 我不会直接把近似结果包装成正式政策结论，而是做风险分级上线。第一阶段可以上线一般政策解释、信息收集和带明确免责声明的估算；个人化退休年月如果没有完成官方表校准，就限制为“待核验估算”，不作为正式办事依据。
>
> 同时把高风险边界加入发布门禁：关键出生年月的规则对照测试必须通过，官方来源必须可用，Guardrail 不能出现高风险漏报。宁可缩小功能范围，也不把不确定实现扩大到所有用户。

---

#### 29.5 问题四：规则引擎结果与政策 RAG 结果冲突

**场景：**

- 规则引擎根据当前参数算出一个退休年龄。
- RAG 召回的官方文档描述了不同的年龄或适用条件。
- 模型不知道应该相信哪个结果。

**面试逐字稿：**

> 我不会让模型在规则结果和 RAG 文本之间做自由投票，而是先判断冲突类型。
>
> 如果冲突是“计算结果”和“政策原文描述”的正常关系，例如文档描述的是总体变化规则，而规则引擎根据用户出生年月计算出具体月份，那么两者可以组合：RAG 负责解释政策总体口径，规则引擎负责具体个人化结果。
>
> 如果冲突是同一用户、同一时间、同一身份下的具体数字不一致，那就属于政策参数或规则实现冲突。系统不能继续输出确定性结论，应记录冲突，检查 effectiveAt、地区、人员身份、ruleSet 和 sourceVersion，必要时进入人工复核或向用户说明无法确认。
>
> 这里的责任边界是：RAG 不是用来替换规则引擎，规则引擎也不是用来伪装政策来源。两者必须通过共同的版本上下文和适用条件对齐。

---

#### 29.6 问题五：长期记忆出现错误后，怎么修复而不是只追问一次

**场景：**

用户第一次说 1977 年，系统存入 confirmed；几轮后用户说“刚才说错了，我是 1978 年”。

**面试逐字稿：**

> 这不能只当成一次普通 profile update，因为 birthYear 会影响多个派生结果。我的处理分三步。
>
> 第一步，记录一个新的用户显式事实，并保留旧 fact 的历史和冲突关系，不直接删除旧值。这样审计时能知道发生过更正。
>
> 第二步，把受影响的派生结果标记为 stale，例如旧的退休年月和缴费缺口不能继续沿用。它们应该基于新画像和当前政策版本重新计算。
>
> 第三步，向用户确认重新计算的输入和范围：“我将按 1978 年重新计算，之前基于 1977 年的结果不再作为当前结果。请确认出生月份和累计缴费月份是否保持不变。”
>
> 这样修改会传播到下游，而不是只改一个 profile 字段。真正的记忆系统要考虑依赖关系：用户事实变化后，哪些工具结果失效，哪些 citation 仍然有效，哪些计划需要重新执行。

**追问：你现在是否已经实现了完整的派生结果失效传播？**

**回答：**

> 当前已经实现了 fact 来源隔离、冲突标记和计算时重新从画像执行，但完整的“事实依赖图—派生结果自动失效—局部重算”还可以进一步工程化。生产版本可以为每个 tool fact 保存 input fact paths、policy version 和 generatedAt，用户事实发生变化时按依赖关系标记 stale。

---

#### 29.7 问题六：长对话压缩后，用户说“继续按刚才的结果算”怎么办

**面试逐字稿：**

> 我会优先查找结构化工具事实，而不是让模型从摘要中猜。当前上下文中应该保留之前的 computePlan 结果、输入画像摘要和 policy version；如果只剩一个模糊的会话摘要，而缺少可验证的工具事实，就不能直接复用旧数字。
>
> 对于派生结果，我还要检查它是否仍然适用于当前政策版本和用户画像。如果用户修改过出生年份、性别或缴费月份，旧结果应该被标记为 stale，重新计算。
>
> 因此“继续按刚才结果算”不是简单地把上一条回答复制到 Prompt，而是要判断上一条结果的输入、版本和状态是否仍然有效。

---

#### 29.8 问题七：用户要求“帮我算养老金金额”，但你的规则引擎没有完整金额测算怎么办

**面试逐字稿：**

> 我会先区分“解释养老金计算公式”和“根据个人信息给出精确金额”。当前项目的 RAG 可以召回基础养老金、个人账户养老金等计算口径，但这不等于已经完成完整的个人金额测算。
>
> 如果用户问公式，我可以走政策 RAG，解释计算组成、影响因素和需要准备的数据；如果用户要求精确金额，我会说明当前系统需要更多参数，例如缴费基数、缴费年限结构、个人账户累计额、当地参数等，并且当前版本不应在这些数据不完整时给出确定金额。
>
> 这体现了能力边界：不能因为系统能解释一个政策，就宣称已经支持该政策对应的所有个人化计算。

---

#### 29.9 问题八：4050 资格能不能由当前规则直接判断“可以领取”

**面试逐字稿：**

> 不能直接把简化的年龄和就业状态判断包装成最终资格结论。当前规则可以做一个初筛提示，例如根据年龄、性别和灵活就业/失业等信息判断是否可能进入相关咨询范围；但完整资格还涉及就业困难人员认定、户籍或参保地、申请时间、享受期限、是否已享受其他补贴以及当地细则。
>
> 因此回答中应该使用“可能符合初步条件，建议进一步核验”，而不是“你一定可以领取”。如果用户问具体申请条件和办理流程，应通过官方 RAG 召回办事指南或 FAQ，并把需要线下确认的条件列出来。

---

### 真实 Bad Case 复盘模板与逐字稿

面试官有时会问：

> 你说的这些都是设计，能不能讲一个你实际排查 Bug 的过程？

可以使用下面的叙事结构。不要只说“我发现了问题然后修复”，要讲观察证据和排查路径。

#### 复盘模板

~~~text
1. 场景：
   用户只提供部分个人信息，但提出个人化测算。

2. 预期：
   系统进入 needs_more_info，只追问缺失字段，不计算。

3. 实际：
   规则引擎返回了 ready，最终回答出现了退休年月。

4. 第一反应：
   怀疑规则引擎把缺省字段当成了默认值。

5. 排查：
   对比用户消息抽取结果、Execution Plan、工具输入、assessment 输出、
   computePlan 输出、Memory 合并结果和最终回答。

6. 根因：
   模型为了满足工具 schema 补了合法但没有用户证据的字段；
   工具和记忆层只看 value，没有看 evidence/source。

7. 修复：
   增加当前消息证据校验；
   computePlan 二次 assessment；
   Memory V2 区分 source type；
   增加 forbidden tool 和 answer exclusion 断言。

8. 验证：
   正常完整画像可以计算；
   缺月份时禁止 computePlan；
   模型补默认值时仍然 needs_more_info；
   多轮补月份后可以恢复计算；
   工具派生结果不会写入长期用户画像。

9. 复盘：
   从“字段存在性”升级到“字段可信性”，从“答案测试”升级到“状态和证据链测试”。
~~~

#### 逐字稿

> 我实际排查这类问题时，不会先改 Prompt，而是先沿着一次请求的完整 trace 看状态变化。因为最终答案只是最后一层表现，根因可能在输入抽取、画像合并、计划生成、工具参数、规则执行或记忆持久化中的任意一层。
>
> 我会把用户原文、抽取 patch、当前 profile、Execution Plan、tool input、tool output、最终 draft 和 Guardrail 结果放在同一条 trace 里比较。最终发现，规则引擎本身对给定参数的计算是确定的，真正的问题是模型把没有证据的默认值传进了工具。
>
> 修复之后，我没有只加一个正常样例，而是把这个失败过程变成回归集：缺月份必须追问，computePlan 必须被禁止，最终回答不能出现个人化数字，模型传入默认月份也不能写进 Memory。这样修复才是针对根因，而不是针对某个文本样例打补丁。

### 证明项目真实性的细节清单

#### 37.1 你能否说清楚“状态”而不是只说“流程”

不要只说：

> 先校验，再计算，再检索，最后回答。

要进一步说：

> 校验有 ready 和 needs_more_info 两种业务状态；缺字段时计划不是失败，而是转入 ask_clarification；computePlan 有 ready、needs_more_info 和持久化状态；retrievePolicy 有 ready、empty、disabled，并且可能 degraded；这些状态决定下一步允许的动作和回答确定性。

#### 37.2 你能否说清楚“数据来源”而不是只说“记忆”

不要只说：

> 我做了长期记忆。

要进一步说：

> 每个 fact 有 source.type、confidence、status 和 conflicts；user_message 可以进入长期画像，compute_plan 只作为派生结果；conflicted 和 stale 不参与计算；用户纠正高影响字段时，下游结果应该失效并重算。

#### 37.3 你能否说清楚“指标分母”而不是只说“Recall 很高”

不要只说：

> RAG Recall@3 达到了 94%。

要进一步说：

> relevant unit 是 sourceId，不是 chunkId；每个 query 的相关 source 集合可能不止一个，Top-K 中命中的 sourceId 去重后除以相关 sourceId 数量，最后做 query 宏平均；官方命中率则是 query-level，只要 Top-K 中至少有一条官方来源就算命中。

#### 37.4 你能否说清楚“系统没有做什么”

面试官通常会追问：

- 是否实时阻断？
- 是否完整复现政策逐月表？
- 是否全部官方原文？
- 是否真实账号跨设备？
- 是否精确计算养老金金额？
- 是否做了自动重规划？
- 是否能证明答案准确率？

正确做法不是回避，而是分层：

> 当前已经完成 A；B 是后置校验或近似实现；C 需要真实数据和进一步工程化。我知道它的风险、影响和补齐方案。

---

## 六、评测体系与结果解读

> 本部分回答：如何评估模块、工具链、RAG、真实 E2E、回答支撑和产品效果。

### 评测体系与结果解读

#### 8.1 规则测试

命令：

~~~text
pnpm test:rules
~~~

结果：

- 6/6 通过。

覆盖：

- 男性用户应用渐进式延迟退休年龄。
- 女性干部用户映射到 femaleCadre。
- 2039 年及以后退休时最低缴费月份动态提高到 240 个月。
- 缺少出生年份时进入 needs_more_info。
- 缺少出生月份时不能计算精确退休年月。
- 指定政策版本时返回规则集和参数版本上下文。

#### 8.2 Agent 单元评估

命令：

~~~text
pnpm eval:agent
~~~

结果：

- 29/29 通过。

覆盖类别：

- memory：多轮画像合并和冲突。
- session_memory：长期画像白名单。
- context：压缩和摘要。
- plan：意图识别和执行步骤。
- tool：信息闸门和工具输入。
- guardrail：政策数字与工具事实的一致性。
- retrieval：政策检索意图。

#### 8.3 Agent 端到端评估

命令：

~~~text
pnpm eval:e2e
~~~

结果：

- 6/6 通过。

覆盖：

- 多轮画像累积后同时完成计算和官方依据召回。
- 缺出生月份时只追问，不调用 computePlan。
- 女性退休身份不明时只追问。
- 只问最低缴费年限时只走 RAG。
- 4050 补贴问题走政策召回，不触发退休测算。
- 长对话压缩后仍保留画像和工具事实。

#### 8.4 RAG 功能评估

命令：

~~~text
pnpm eval:rag
~~~

结果：

- 10/10 通过。

覆盖：

- RRF 是否优先融合双路命中。
- 官方来源是否优先于演示摘要。
- citation 是否包含 sourceUrl、sourceType 和 excerpt。
- 没有 query embedding 时 lexical 是否能工作。
- 没有候选时不生成 citation。
- 最低缴费、延迟退休、4050、养老金计算、灵活就业等主题是否命中预期来源。

#### 8.5 RAG benchmark 指标口径

指标函数：

- src/lib/rag/benchmark/metrics.ts

Recall@3 的当前定义：

- 以 sourceId 为相关性单位。
- 先把 Top-K citation 中命中的相关 sourceId 去重。
- 命中 sourceId 数量除以 expected relevantSourceIds 数量。
- 最后对 query 做宏平均。

官方来源命中率的当前定义：

- 以 query 为单位。
- 只要 Top-K 中至少有一条 official_policy、official_notice 或 official_faq，记为命中。
- 最后对 query 做平均。

其他指标：

- hitAtK。
- MRR。
- citationCompletenessRate。
- supportedTermRecall。
- latencyMs。
- degraded。

#### 8.6 关于 94% 和 98% 的真实性说明

项目说明中的：

- 政策来源 Recall@3：94%。
- 官方来源命中率：98%。

面试时必须补充统计口径和实验条件：

> 这两个数字来自项目 benchmark 数据集和可用数据库/API 环境下的实验结果。Recall@3 按 sourceId 做 source-level 宏平均；官方来源命中率按 query-level 判断 Top-K 是否至少包含一条官方来源。

当前复测限制：

- pnpm benchmark:rag 执行时，真实数据库/API 无法连接。
- 50 条 benchmark 用例没有得到 ready 结果。
- 因此当前环境无法重新证明 94% 和 98%。
- 不能把“50 条未 ready”当成召回率为 0，也不能把历史实验指标说成当前现场复测结果。
- 面试中如果被追问，可以说明实验可复现需要 DATABASE_URL、embedding 配置和对应文档数据。

#### 8.7 评测的局限

当前 benchmark 仍需加强：

- 增加旧政策和新政策冲突样本。
- 增加跨地区相似政策样本。
- 增加同一 source 多 chunk 的去重评测。
- 增加无官方来源时的 abstain 评测。
- 增加 citation 内容是否真正支持 claim 的 entailment 评测。
- 增加线上真实 query 的人工标注集。
- 记录 P50、P95 延迟而不是只看平均延迟。
- 分开评估 lexical、vector、hybrid 和 rerank 的增益。
